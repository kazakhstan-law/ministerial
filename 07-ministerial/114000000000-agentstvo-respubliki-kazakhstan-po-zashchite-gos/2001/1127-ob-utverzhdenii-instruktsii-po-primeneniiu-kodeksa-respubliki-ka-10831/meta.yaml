act_code: '10831'
requisite: Приказ Председателя Агентства Республики Казахстан по защите государственных секретов от 27 ноября 2001 года № 24. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 декабря 2001 года № 1710. Утратил силу приказом руководителя Канцелярии Премьер-Министра Республики Казахстан от 28 сентября 2012 года № 25-1-84
title:
  rus: Об утверждении Инструкции по применению Кодекса Республики Казахстан об административных правонарушениях в деятельности Агентства Республики Казахстан по защите государственных секретов
  kaz: Қазақстан Республикасының әкiмшiлiк құқық бұзушылық туралы кодексiн Қазақстан Республикасы Мемлекеттiк құпияларды қорғау жөнiндегі агенттiгiнің қызметiнде қолдану жөнiндегі нұсқаулықты бекiту туралы
