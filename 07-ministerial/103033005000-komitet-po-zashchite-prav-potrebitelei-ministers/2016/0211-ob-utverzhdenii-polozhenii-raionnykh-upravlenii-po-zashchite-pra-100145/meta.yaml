title:
  rus: Об утверждении положений районных Управлений по защите прав потребителей Департамента по защите прав потребителей города Астаны Комитета по защите прав потребителей Министерства национальной экономики Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық экономика министрлігі Тұтынушылардың құқықтарын қорғау комитеті Астана қаласы Тұтынушылардың құқықтарын қорғау департаментінің аудандық тұтынушылардың құқықтарын қорғау басқармаларының ережелерін бекіту туралы
