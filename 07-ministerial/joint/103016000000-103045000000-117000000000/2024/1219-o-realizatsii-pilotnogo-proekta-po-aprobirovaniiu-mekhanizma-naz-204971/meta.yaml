act_code: '204971'
requisite: Совместный приказ Министра труда и социальной защиты населения Республики Казахстан от 19 декабря 2024 года № 468, Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан 23 декабря 2024 года № 830/НҚ и Заместителя Председателя Национального Банка Республики Казахстан от 19 декабря 2024 года № 210
title:
  rus: О реализации пилотного проекта по апробированию механизма назначения государственной адресной социальной помощи при получении согласия лиц, претендующих на получение адресной социальной помощи, на передачу данных по банковским счетам, остаткам и (или) движению денег по ним посредством Межбанковской системы обмена информацией по открытым программным интерфейсам (Open API)
  kaz: Атаулы әлеуметтік көмек алуға үміткер адамдардың Ашық бағдарламалық интерфейстер (Open API) бойынша ақпарат алмасудың банкаралық жүйесі арқылы банктік шоттар, олар бойынша ақша қалдықтары және (немесе) қозғалысы бойынша деректерді беруге келісімін алған кезде мемлекеттік атаулы әлеуметтік көмек тағайындау тетігін сынақтан өткізу жөніндегі пилоттық жобаны іске асыру туралы
