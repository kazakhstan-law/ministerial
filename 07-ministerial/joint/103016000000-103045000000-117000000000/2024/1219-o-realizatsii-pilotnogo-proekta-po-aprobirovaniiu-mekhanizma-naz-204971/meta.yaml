  requisite: Совместный приказ Министра труда и социальной защиты населения Республики Казахстан от 31 октября 2025 года № 345, Заместителя Премьер-Министра - Министра искусственного интеллекта и цифрового развития Республики Казахстан от 31 октября 2025 года № 547/НҚ и Заместителя Председателя Национального Банка Республики Казахстан от 3 ноября 2025 года № 244
  title:
    rus: О внесении изменения в совместный приказ Министра труда и социальной защиты населения Республики Казахстан от 19 декабря 2024 года № 468, Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан 23 декабря 2024 года № 830/НҚ и Заместителя Председателя Национального Банка Республики Казахстан от 19 декабря 2024 года № 210 «О реализации пилотного проекта по апробированию механизма назначения государственной адресной социальной помощи при получении согласия лиц, претендующих на получение адресной социальной помощи, на передачу данных по банковским счетам, остаткам и (или) движению денег по ним посредством Межбанковской системы обмена информацией по открытым программным интерфейсам (Open API)»
    kaz: «Атаулы әлеуметтік көмек алуға үміткер адамдардың Ашық бағдарламалық интерфейстер (Open API) бойынша ақпарат алмасудың банкаралық жүйесі арқылы банктік шоттар, олар бойынша ақша қалдықтары және (немесе) қозғалысы бойынша деректерді беруге келісімін алған кезде мемлекеттік атаулы әлеуметтік көмек тағайындау тетігін сынақтан өткізу жөніндегі пилоттық жобаны іске асыру туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2024 жылғы 19 желтоқсандағы № 468, Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2024 жылғы 23 желтоқсандағы № 830/НҚ және Қазақстан Республикасының Ұлттық Банкі Төрағасының орынбасарының 2024 жылғы 19 желтоқсандағы № 210 бірлескен бұйрығына өзгеріс енгізу туралы
