act_code: '20005'
requisite: Совместный приказ Министра транспорта и коммуникаций Республики Казахстан от 7 мая 2004 года N 190-I, Министра сельского хозяйства Республики Казахстан от 5 мая 2004 года N 258, Министра здравоохранения Республики Казахстан от 6 мая 2004 года N 400, Директора Пограничной службы Комитета национальной безопасности Республики Казахстан от 7 мая 2004 года N 109 и Председателя Агентства таможенного контроля Республики Казахстан от 7 мая 2004 года N 213. Зарегистрирован Министерством юстиции Республики Казахстан 27 мая 2004 года N 2874. Утратил силу совместным приказом Директора Пограничной службы Комитета национальной безопасности Республики Казахстан от 23 июня 2015 года № 410-па, Министра сельского хозяйства Республики Казахстан от 11 декабря 2015 года № 1080, Министра здравоохранения и социального развития Республики Казахстан от 8 декабря 2015 года № 946, Министра по инвестициям и развитию Республики Казахстан от 30 ноября 2015 года № 1143 и Министра финансов Республики Казахстан от 20 ноября 2015 года № 580
title:
  rus: Об утверждении Правил взаимодействия должностных лиц таможни "Достык" Агентства таможенного контроля Республики Казахстан, работников станции "Достык" Акционерного общества "Национальная компания "Казакстан темiр жолы", должностных лиц Министерства транспорта и коммуникаций Республики Казахстан, военнослужащих Отдельного контрольно-пропускного пункта "Дружба" Пограничной службы Комитета национальной безопасности Республики Казахстан и сотрудников контролирующих служб при таможенном оформлении грузов, перемещаемых через государственную границу железнодорожным и автомобильным транспортом
  kaz: Қазақстан Республикасы Кедендік бақылау агенттігінің "Достық" кедені лауазымды адамдарының, "Қазақстан темір жолы" Ұлттық компаниясы" Акционерлік қоғамының "Достық" станциясы қызметкерлерінің, Қазақстан Республикасының Көлік және коммуникациялар министрлігі лауазымды адамдарының, Қазақстан Республикасының Ұлттық қауіпсіздік комитеті Шекаралық қызметінің "Достық" жеке бақылау-өткізу пункті әскери қызметшілерінің және бақылаушы қызметтер қызметкерлерінің мемлекеттік шекара арқылы теміржол және автомобиль көлігімен өткізілетін жүктерді кедендік ресімдеу кезіндегі өзара іс-қимыл ережесін бекіту туралы
