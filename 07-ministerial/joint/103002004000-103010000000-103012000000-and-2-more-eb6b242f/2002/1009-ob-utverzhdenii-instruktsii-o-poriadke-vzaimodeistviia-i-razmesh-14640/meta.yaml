  requisite: Совместный приказ Председателя Агентства таможенного контроля Республики Казахстан от 16 сентября 2003 года № 433, Председателя Комитета национальной безопасности Республики Казахстан от 16 сентября 2003 года № 170, Министра транспорта и коммуникаций Республики Казахстан от 15 сентября 2003 года N 265-I, Министра здравоохранения Республики Казахстан от 15 сентября 2003 года N 681 и Министра сельского хозяйства Республики Казахстан от 15 сентября 2003 года № 485. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 сентября 2003 года № 2507. Утратил силу совместным приказом Министра сельского хозяйства Республики Казахстан от 10 марта 2017 года № 108, Министра здравоохранения Республики Казахстан от 21 апреля 2017 года № 194, Министра по инвестициям и развитию Республики Казахстан от 17 марта 2017 года № 157, Министра финансов Республики Казахстан от 26 января 2017 года № 56, Председателя Комитета национальной безопасности Республики Казахстан от 24 апреля 2017 года № 22 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в совместный приказ Председателя Агентства таможенного контроля Республики Казахстан от 10 октября 2002 года № 47, Председателя Комитета национальной безопасности Республики Казахстан от 9 декабря 2002 года № 217, Министра транспорта и коммуникаций Республики Казахстан от 23 октября 2002 года № 351-1, Министра здравоохранения Республики Казахстан от 14 января 2003 года № 34, Министра сельского хозяйства Республики Казахстан от 7 января 2003 года № 3 "Об утверждении Инструкции о порядке взаимодействия и размещения контролирующих органов при осуществлении контроля в пунктах пропуска через государственную границу Республики Казахстан" (зарегистрированный в Министерстве юстиции Республики Казахстан 17 февраля 2003 года № 2174)
    kaz: '"Қазақстан Республикасының мемлекеттік шекарасы арқылы өткізу пункттерінде бақылауды жүзеге асыру кезіндегі бақылаушы органдардың өзара іс-қимылының және оларды орналастырудың тәртібі туралы нұсқаулықты бекіту туралы" Қазақстан Республикасының Кедендік бақылау агенттігі төрағасының 2002 жылғы 10 қазандағы N 47, Қазақстан Республикасының Ұлттық қауіпсіздік комитеті төрағасының 2002 жылғы 9 желтоқсандағы N 217, Қазақстан Республикасы Көлік және коммуникациялар министрінің 2002 жылғы 23 қазандағы N 351-1, Қазақстан Республикасы Денсаулық сақтау министрінің 2003 жылғы 14 қаңтардағы N 34, Қазақстан Республикасы Ауыл шаруашылығы министрінің 2003 жылғы 7 қаңтардағы N 3 бірлескен бұйрығына (Қазақстан Республикасының Әділет министрлігінде 2003 жылғы 17 ақпанда N 2174 болып тіркелген) өзгерістер мен толықтыру енгізу туралы'
