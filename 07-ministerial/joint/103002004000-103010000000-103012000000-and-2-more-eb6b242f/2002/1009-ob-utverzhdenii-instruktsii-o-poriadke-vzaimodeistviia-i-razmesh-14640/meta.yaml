  requisite: Совместный приказ Министра финансов Республики Казахстан от 16 ноября 2007 года N 397, Министра транспорта и коммуникаций от 4 декабря 2007 года N 258, Министра здравоохранения от 27 ноября 2007 года N 700, Министра сельского хозяйства от 14 ноября 2007 года N 685, Председателя Комитета национальной безопасности Республики Казахстан от 20 ноября 2007 года N 197. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 декабря 2007 года N 5032. Утратил силу совместным приказом Министра сельского хозяйства Республики Казахстан от 10 марта 2017 года № 108, Министра здравоохранения Республики Казахстан от 21 апреля 2017 года № 194, Министра по инвестициям и развитию Республики Казахстан от 17 марта 2017 года № 157, Министра финансов Республики Казахстан от 26 января 2017 года № 56, Председателя Комитета национальной безопасности Республики Казахстан от 24 апреля 2017 года № 22 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: '"О внесении изменения в Совместный приказ Председателя Агентства таможенного контроля Республики Казахстан от 10 октября 2002 года N 47, Председателя Комитета национальной безопасности Республики Казахстан от 9 декабря 2002 года N 217, Министра транспорта и коммуникаций Республики Казахстан от 23 октября 2002 года N 353-I, Министра здравоохранения Республики Казахстан от 14 января 2003 года N 34 и Министра сельского хозяйства Республики Казахстан от 7 января 2003 года N 3 "Об утверждении Инструкции о порядке взаимодействия и размещения контролирующих органов при осуществлении контроля в пунктах пропуска через государственную границу Республики Казахстан"'
    kaz: '"Қазақстан Республикасының мемлекеттiк шекарасы арқылы өткiзу пункттерiнде бақылауды жүзеге асыру кезiнде бақылаушы органдардың өзара iс-қимылының және оларды орналастырудың тәртiбi туралы нұсқаулықты бекiту туралы" Қазақстан Республикасы Кедендік бақылау агенттігі төрағасының 2002 жылғы 10 қазандағы N 47, Қазақстан Республикасы Ұлттық қауіпсіздік комитеті төрағасының 2002 жылғы 9 желтоқсандағы N 217, Қазақстан Республикасы Көлік және коммуникациялар министрінің 2002 жылғы 23 қазандағы N 353-І, Қазақстан Республикасы Денсаулық сақтау министрінің 2003 жылғы 14 қаңтардағы N 34, Қазақстан Республикасы Ауыл шаруашылығы министрінің 2003 ж. 7 қаңтардағы N 3 бірлескен бұйрығына өзгеріс енгізу туралы"'
