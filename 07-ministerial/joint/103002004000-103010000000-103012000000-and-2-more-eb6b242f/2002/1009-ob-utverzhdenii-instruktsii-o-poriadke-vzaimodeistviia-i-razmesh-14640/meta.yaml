act_code: '14640'
requisite: Совместный приказ Председателя Агентства таможенного контроля Республики Казахстан от 10 октября 2002 года N 47, Председателя Комитета национальной безопасности Республики Казахстан от 9 декабря 2002 года N 217, Министра транспорта и коммуникаций Республики Казахстан от 23 октября 2002 года N 353-I, Министра здравоохранения Республики Казахстан от 14 января 2003 года N 34 и Министра сельского хозяйства Республики Казахстан от 7 января 2003 года N 3. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 февраля 2003 года N 2174. Утратил силу совместным приказом Министра сельского хозяйства Республики Казахстан от 10 марта 2017 года № 108, Министра здравоохранения Республики Казахстан от 21 апреля 2017 года № 194, Министра по инвестициям и развитию Республики Казахстан от 17 марта 2017 года № 157, Министра финансов Республики Казахстан от 26 января 2017 года № 56, Председателя Комитета национальной безопасности Республики Казахстан от 24 апреля 2017 года № 22 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции о порядке взаимодействия и размещения контролирующих органов при осуществлении контроля в пунктах пропуска через государственную границу Республики Казахстан
  kaz: Қазақстан Республикасының мемлекеттiк шекарасы арқылы өткiзу пункттерiнде бақылауды жүзеге асыру кезiндегi бақылаушы органдардың өзара iс-қимылының және оларды орналастырудың тәртiбi туралы нұсқаулықты бекiту туралы
