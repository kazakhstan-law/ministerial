  title:
    rus: О внесении изменений в совместный приказ Министра обороны Республики Казахстан от 6 августа 2019 года № 602 и Министра национальной экономики Республики Казахстан от 12 августа 2019 года № 72 «Об утверждении критериев оценки степени риска и проверочных листов за соблюдением правил воинского учета военнообязанных и призывников организациями, военнообязанными и призывниками»
    kaz: «Ұйымдардың, әскери міндеттілер мен әскерге шақырылушылардың әскери міндеттілер мен әскерге шақырылушыларды әскери есепке алу қағидаларын сақтауына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2019 жылғы 6 тамыздағы № 602 және Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 12 тамыздағы № 72 бірлескен бұйрығына өзгерістер енгізу туралы
