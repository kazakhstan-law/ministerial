act_code: '134187'
requisite: Совместный приказ Министра обороны Республики Казахстан от 6 августа 2019 года № 602 и Министра национальной экономики Республики Казахстан от 12 августа 2019 года № 72. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 августа 2019 года № 19262. Утратил силу совместным приказом Министра обороны Республики Казахстан от 27 июня 2024 года № 675 и Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 28 июня 2024 года № 51 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов за соблюдением правил воинского учета военнообязанных и призывников организациями, военнообязанными и призывниками
  kaz: Ұйымдардың, әскери міндеттілер мен әскерге шақырылушылардың әскери міндеттілер мен әскерге шақырылушыларды әскери есепке алу қағидаларын сақтауына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
