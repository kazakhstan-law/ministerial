requisite: Совместный приказ Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 28 ноября 2012 года № 429 и Министра экономического развития и торговли Республики Казахстан от 5 декабря 2012 года № 328. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 декабря 2012 года № 8205. Утратил силу совместным приказом Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 29 апреля 2014 года № 140 и Министра регионального развития Республики Казахстан от 5 мая 2014 года № 124/ОД
title:
  rus: Об утверждении критериев оценки степени рисков в сфере частного предпринимательства в области оборота ядов, вооружения, военной техники и отдельных видов оружия, взрывчатых и пиротехнических веществ и изделий с их применением
  kaz: Улар, қару-жарақ, әскери техника мен жекелеген қару түрлері, жарылғыш және пиротехникалық заттар мен олар қолдана отырып жасалған бұйымдар айнылымы саласындағы жеке кәсіпкерлік аясында тәуекелдер дәрежесін бағалау өлшемдерін бекіту туралы
