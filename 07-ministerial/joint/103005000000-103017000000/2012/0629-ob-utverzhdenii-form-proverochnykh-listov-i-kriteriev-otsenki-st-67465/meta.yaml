requisite: Совместный приказ Министра индустрии и новых технологий Республики Казахстан от 29 июня 2012 года № 222 и Министра экономического развития и торговли Республики Казахстан от 31 июля 2012 года № 230. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 августа 2012 года № 7882. Утратил силу совместным приказом Министра по инвестициям и развитию Республики Казахстан от 29 июня 2015 года № 731 и Министра национальной экономики Республики Казахстан от 20 июля 2015 года № 544
title:
