requisite: Совместный приказ Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 28 ноября 2012 года № 428 и Министра экономического развития и торговли Республики Казахстан от 5 декабря 2012 года № 329. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 декабря 2012 года № 8206. Утратил силу совместным приказом Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 29 апреля 2014 года № 138 и Министра регионального развития Республики Казахстан от 5 мая 2014 года № 125/ОД
title:
  rus: Об утверждении форм проверочных листов в сфере частного предпринимательства в области оборота ядов, вооружения, военной техники и отдельных видов оружия, взрывчатых и пиротехнических веществ и изделий с их применением
