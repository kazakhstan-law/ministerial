requisite: Совместный приказ и.о. Министра индустрии и новых технологий Республики Казахстан от 21 августа 2010 года № 242 и Министра экономического развития и торговли Республики Казахстан от 2 сентября 2010 года № 171. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 октября 2010 года № 6528. Утратил силу совместным приказом Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 28 ноября 2012 года № 429 и Министра экономического развития и торговли Республики Казахстан от 5 декабря 2012 года № 328
title:
