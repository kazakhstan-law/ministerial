requisite: Совместный приказ Министра культуры и информации Республики Казахстан от 30 декабря 2024 года № 642-НҚ и Министра финансов Республики Казахстан от 31 декабря 2024 года № 897
title:
  rus: Об утверждении Правил представления органами государственных доходов уполномоченному органу в сфере взаимодействия с неправительственными организациями сведений о налогоплательщике (налоговом агенте), составляющих налоговую тайну без получения письменного разрешения налогоплательщика (налогового агента) и перечня представляемых сведений
  kaz: Мемлекеттік кірістер органдарының салық төлеуші (салық агенті) туралы салықтық құпияны құрайтын мәліметтерді салық төлеушінің (салық агентінің) жазбаша рұқсатын алмастан үкіметтік емес ұйымдармен өзара іс-қимыл саласындағы уәкілетті органға ұсыну қағидаларын және ұсынылатын мәліметтердің тізбесін бекіту туралы
