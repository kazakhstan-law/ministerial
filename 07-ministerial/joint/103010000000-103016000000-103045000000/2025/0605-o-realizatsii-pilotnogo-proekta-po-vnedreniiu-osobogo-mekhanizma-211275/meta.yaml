act_code: '211275'
requisite: Совместный приказ Министра труда и социальной защиты населения Республики Казахстан от 5 июня 2025 года № 168, Министра здравоохранения Республики Казахстан от 11 июня 2025 года № 56 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 9 июня 2025 года № 292/НҚ. Действовал в течение двенадцати месяцев в соответствии с пунктом 8 настоящего совместного приказа
title:
  rus: О реализации пилотного проекта по внедрению особого механизма оказания государственной услуги «Установление инвалидности и/или степени утраты трудоспособности и/или определение необходимых мер социальной защиты» по отдельным нозологическим формам в заочном проактивном формате
  kaz: Сырттай проактивті форматта жекелеген нозологиялық нысандар бойынша «Мүгедектікті және/немесе еңбек ету қабілетінен айырылу дәрежесін белгілеу және/немесе қажетті әлеуметтік қорғау шараларын айқындау» мемлекеттік қызметін көрсетудің ерекше тетігін енгізу бойынша пилоттық жобаны іске қосу туралы
