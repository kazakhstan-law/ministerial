  kaz: «Мүгедектікті және/немесе еңбекке қабілеттіліктен айырылу дәрежесін белгілеу және/немесе қажетті әлеуметтік қорғау шараларын айқындау» мемлекеттік қызметін проактивті сырттай көрсетуге дәрігерлерді тарту бойынша пилоттық жобаны іске асыру туралы
