  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра здравоохранения Республики Казахстан от 22 апреля 2024 года № 14, Министра труда и социальной защиты населения Республики Казахстан от 26 апреля 2024 года № 116, Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 16 апреля 2024 года № 234/НҚ «О реализации пилотного проекта по привлечению врачей к проактивному заочному оказанию государственной услуги «Установление инвалидности и/или степени утраты трудоспособности и/или определение необходимых мер социальной защиты»
    kaz: «Мүгедектікті және/немесе еңбекке қабілеттіліктен айырылу дәрежесін белгілеу және/немесе қажетті әлеуметтік қорғау шараларын айқындау» мемлекеттік қызметін проактивті сырттай көрсетуге дәрігерлерді тарту бойынша пилоттық жобаны іске асыру туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2024 жылғы 22 сәуірдегі № 14, Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2024 жылғы 26 сәуірдегі № 116, Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2024 жылғы 16 сәуірдегі № 234/НҚ бірлескен бұйрығына өзгертулер мен толықтырулар енгізу туралы
