title:
  rus: Об утверждении Правил взаимодействия органа государственных доходов и Государственной корпорации «Правительство для граждан», осуществляющей учет и регистрацию земельных участков и недвижимого имущества, по представлению сведений об объектах налогообложения и (или) объектах, связанных с налогообложением, и о налогоплательщиках, имеющих такие объекты
  kaz: Салық салу объектілері және (немесе) салық салуға байланысты объектілер туралы және осындай объектілері бар салық төлеушілер туралы мәліметтерді ұсыну бойынша жер учаскелері мен жылжымайтын мүлікті есепке алуды және тіркеуді жүзеге асыратын «Азаматтарға арналған үкімет» мемлекеттік корпорациясы мен мемлекеттік кірістер органының өзара іс-қимыл жасау қағидаларын бекіту туралы
