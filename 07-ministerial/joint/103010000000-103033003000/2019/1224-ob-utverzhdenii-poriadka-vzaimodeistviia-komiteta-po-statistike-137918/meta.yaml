requisite: Совместный приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 24 декабря 2019 года № 190 и Министра здравоохранения Республики Казахстан от 31 декабря 2019 года № 777
title:
  rus: Об утверждении Порядка взаимодействия Комитета по статистике Министерства национальной экономики Республики Казахстан с Министерством здравоохранения Республики Казахстан при проведении национальной переписи населения Республики Казахстан в 2020 году на объектах Министерства здравоохранения Республики Казахстан
  kaz: Қазақстан Республикасы Денсаулық сақтау министрлігінің объектілерінде 2020 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитетінің Қазақстан Республикасы Денсаулық сақтау министрлігімен өзара іс-қимыл тәртібін бекіту туралы
