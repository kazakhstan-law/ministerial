requisite: Совместный приказ Министра здравоохранения Республики Казахстан от 30 марта 2011 года № 158 и Министра экономического развития и торговли Республики Казахстан от 5 апреля 2011 года № 88. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 апреля 2011 года № 6913. Утратил силу совместным приказом Министра здравоохранения Республики Казахстан от 3 сентября 2012 года № 609 и Министра экономического развития и торговли Республики Казахстан от 3 октября 2012 года № 282
title:
  rus: Об утверждении критериев оценки степени риска в сфере частного предпринимательства по оказанию медицинских услуг, обращению лекарственных средств, изделий медицинского назначения и медицинской техники
  kaz: Медициналық қызметтерді қөрсету, дәрілік заттардың, медициналық мақсаттағы бұйымдар мен медициналық техниканың айналысы бойынша жеке кәсіпкерлік саласындағы тәуекел дәрежесін бағалау критерийлерін бекіту туралы
