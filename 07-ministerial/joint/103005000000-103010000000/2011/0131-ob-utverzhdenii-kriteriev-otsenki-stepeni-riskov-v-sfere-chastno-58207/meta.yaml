  code: '66005'
  requisite: Совместный приказ Министра здравоохранения Республики Казахстан от 8 мая 2012 года № 325 и Министра экономического развития и торговли Республики Казахстан от 15 мая 2012 года № 153. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 июня 2012 года № 7722. Утратил силу совместным приказом Министра здравоохранения Республики Казахстан от 13 ноября 2024 года № 93 и Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 18 ноября 2024 года № 103 (вводится в действие по истечении десяти календарных дней после первого официального опубликования)
  title:
    rus: О внесении изменения в Совместный приказ Министра здравоохранения Республики Казахстан от 31 января 2011 года № 59 и Министра экономического развития и торговли Республики Казахстан от 25 февраля 2011 года № 45 "Об утверждении критериев оценки степени рисков в сфере частного предпринимательства в области санитарно-эпидемиологического благополучия населения"
    kaz: '"Халықтың санитариялық-эпидемиологиялық салауаттылығы саласында жеке кәсіпкерлік аясындағы тәуекелдер дәрежесін бағалау критерийлерін бекіту туралы" Қазақстан Республикасының Денсаулық сақтау министрінің 2011 жылғы 31 қаңтардағы № 59 және Қазақстан Республикасының Экономикалық даму және сауда министрінің 2011 жылғы 25 ақпандағы № 45 бірлескен бұйрығына өзгеріс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/66005/rus
