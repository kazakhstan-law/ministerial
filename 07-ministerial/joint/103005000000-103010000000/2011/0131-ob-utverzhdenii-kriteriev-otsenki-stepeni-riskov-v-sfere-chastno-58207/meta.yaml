act_code: '58207'
requisite: Совместный приказ Министра здравоохранения Республики Казахстан от 31 января 2011 года № 59 и Министра экономического развития и торговли Республики Казахстан от 25 февраля 2011 года № 45. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 марта 2011 года № 6841. Утратил силу совместным приказом Министра здравоохранения Республики Казахстан от 3 сентября 2012 года № 602 и Министра экономического развития и торговли Республики Казахстан от 21 сентября 2012 года № 272
title:
  rus: Об утверждении критериев оценки степени рисков в сфере частного предпринимательства в области санитарно-эпидемиологического благополучия населения
  kaz: Халықтың санитариялық-эпидемиологиялық салауаттылығы саласында жеке кәсіпкерлік аясындағы тәуекелдер дәрежесін бағалау критерийлерін бекіту туралы
