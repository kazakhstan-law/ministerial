caused_by:
  code: '204181'
  requisite: Совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 10 декабря 2024 года № 10 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 12 декабря 2024 года № 791/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 декабря 2024 года № 35483. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 апреля 2026 года № 4, Министра юстиции Республики Казахстан от 30 апреля 2026 года № 408, Заместителя Премьер-Министра – Министр искусственного интеллекта и цифрового развития Республики Казахстан от 22 апреля 2026 года № 216/НҚ, Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 8 апреля 2026 года № 1 и Министра туризма и спорта Республики Казахстан от 14 апреля 2026 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 28 февраля 2022 года № 20 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 28 февраля 2022 года № 68/НҚ «Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для лиц, осуществляющих деятельность по выпуску цифровых активов, организации торгов ими, а также предоставлению услуг по обмену цифровых активов на деньги, ценности и иное имущество»
    kaz: «Цифрлық активтерді шығару, олардың сауда-саттығын ұйымдастыру, сондай-ақ цифрлық активтерді ақшаға, құндылықтарға және өзге де мүлікке айырбастау бойынша көрсетілетін қызметтерді ұсыну жөніндегі қызметті жүзеге асыратын тұлғалар үшін қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы» Қазақстан Республикасының Қаржылық мониторинг агенттігі төрағасының 2022 жылғы 28 ақпандағы № 20 және Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2022 жылғы 28 ақпандағы № 68/НҚ бірлескен бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/204181/rus
