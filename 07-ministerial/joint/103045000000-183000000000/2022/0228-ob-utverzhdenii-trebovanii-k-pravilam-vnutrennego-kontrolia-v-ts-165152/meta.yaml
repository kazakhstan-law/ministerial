  requisite: Совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 13 сентября 2022 года № 30 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 14 сентября 2022 года № 326/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 сентября 2022 года № 29584. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 апреля 2026 года № 4, Министра юстиции Республики Казахстан от 30 апреля 2026 года № 408, Заместителя Премьер-Министра – Министр искусственного интеллекта и цифрового развития Республики Казахстан от 22 апреля 2026 года № 216/НҚ, Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 8 апреля 2026 года № 1 и Министра туризма и спорта Республики Казахстан от 14 апреля 2026 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 28 февраля 2022 года № 20 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 28 февраля 2022 года № 68/НҚ «Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для лиц, осуществляющих деятельность по выпуску цифровых активов, организации торгов ими, а также предоставлению услуг по обмену цифровых активов на деньги, ценности и иное имущество»
    kaz: Қазақстан Республикасы Қаржылық мониторинг агенттігі Төрағасының 2022 жылғы 28 ақпандағы № 20 және Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2022 жылғы 28 ақпандағы № 68/НҚ «Цифрлық активтерді шығару, олардың сауда-саттығын ұйымдастыру, сондай-ақ цифрлық активтерді ақшаға, құндылықтарға және өзге де мүлікке айырбастау бойынша көрсетілетін қызметтерді ұсыну жөніндегі қызметті жүзеге асыратын тұлғалар үшін қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы» бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/171607/rus
