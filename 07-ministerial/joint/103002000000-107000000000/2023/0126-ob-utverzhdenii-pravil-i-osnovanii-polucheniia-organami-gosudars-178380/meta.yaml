requisite: Совместный приказ Генерального Прокурора Республики Казахстан от 26 января 2023 года № 41 и Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 26 января 2023 года № 69. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 января 2023 года № 31785
title:
  rus: Об утверждении Правил и оснований получения органами государственных доходов из системы информационного обмена правоохранительных, специальных государственных и иных органов информации, необходимой для осуществления налогового и таможенного контроля в форме налоговых и таможенных выездных проверок
  kaz: Мемлекеттік кірістер органдарының құқық қорғау, арнаулы мемлекеттік және өзге де органдардың ақпарат алмасу жүйесінен салықтық және кедендік көшпелі тексерулер нысанында салықтық және кедендік бақылауды жүзеге асыру үшін қажетті ақпаратты алу қағидалары мен негіздерін бекіту туралы
