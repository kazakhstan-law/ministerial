act_code: '111608'
requisite: Совместный приказ Генерального прокурора Республики Казахстан от 21 февраля 2017 года № 18 и Министра финансов Республики Казахстан от 22 февраля 2017 года № 127. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 марта 2017 года № 14952. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 15 марта 2022 года № 21 и Генерального Прокурора Республики Казахстан от 24 марта 2022 года № 54 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и оснований получения уполномоченным органом по финансовому мониторингу из системы информационного обмена правоохранительных, специальных государственных и иных органов информации, необходимой для противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма
  kaz: Қаржы мониторингі жөніндегі уәкілетті органның құқық қорғау, арнаулы мемлекеттік және өзге де органдардың ақпарат алмасу жүйесінен қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл үшін қажет ақпаратты алу қағидалары мен негіздерін бекіту туралы
