act_code: '206374'
requisite: Совместный приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 6 января 2025 года № 1/НҚ и Министра внутренних дел Республики Казахстан от 6 января 2025 года № 7
title:
  rus: О запуске и реализации пилотного проекта «Digital Nomad Residency» по оказанию государственной услуги «Выдача разрешения иностранцам и лицам без гражданства на постоянное жительство в Республике Казахстан» для специалистов в сфере информационно-коммуникационных услуг
  kaz: Ақпараттық-коммуникациялық қызметтер саласындағы мамандар үшін «Шетелдіктерге және азаматтығы жоқ адамдарға Қазақстан Республикасында тұрақты тұруға рұқсат беру» мемлекеттік қызметін көрсету жөніндегі «Digital Nomad Residency» пилоттық жобасын іске қосу және іске асыру туралы
