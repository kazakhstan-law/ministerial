act_code: '210710'
requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 26 мая 2025 года № 389 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 26 мая 2025 года № 253/НҚ. Действовал по 31 марта 2026 года в соответствии с пунктом 7 настоящего совместного приказа
title:
  rus: О проведении пилотного проекта по оказанию государственной услуги «Выдача паспортов, удостоверений личности гражданам Республики Казахстан» в части оформления удостоверения личности по причине истечения срока действия в онлайн формате посредством портала электронного правительства и мобильных приложений
  kaz: Электрондық үкімет порталы және мобильді қосымшалар арқылы онлайн форматта қолданылу мерзімінің өтуіне байланысты жеке куәлікті ресімдеу бөлігінде «Қазақстан Республикасының азаматтарына паспорттар, жеке куәліктер беру» мемлекеттік қызметін көрсету бойынша пилоттық жобаны жүргізу туралы
