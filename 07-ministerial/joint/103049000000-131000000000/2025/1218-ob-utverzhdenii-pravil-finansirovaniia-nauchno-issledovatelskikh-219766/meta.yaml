requisite: Совместный приказ и.о. Председателя Агентства Республики Казахстан по атомной энергии от 18 декабря 2025 года № 90 - н/қ и и.о. Министра науки и высшего образования Республики Казахстан от 19 декабря 2025 года № 577. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 декабря 2025 года № 37686
title:
  rus: «Об утверждении Правил финансирования научно-исследовательских, научно-технических и (или) опытно-конструкторских работ в размере одного процента от затрат на добычу, понесенных недропользователем в период добычи урана по итогам предыдущего года»
  kaz: «Алдыңғы жылдың қорытындылары бойынша жер қойнауын пайдаланушының уран өндіру кезеңінде өндіру үшін шеккен шығындарының бір пайызы мөлшерінде ғылыми-зерттеу, ғылыми-техникалық және (немесе) тәжірибелік-конструкторлық жұмыстарды қаржыландыру қағидаларын бекіту туралы»
