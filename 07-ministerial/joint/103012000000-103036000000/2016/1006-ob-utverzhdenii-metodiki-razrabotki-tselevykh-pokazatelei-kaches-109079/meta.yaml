requisite: Совместный приказ Заместителя Премьер-Министра Республики Казахстан Министра сельского хозяйства Республики Казахстан от 6 октября 2016 года № 422 и Министра энергетики Республики Казахстан от 27 ноября 2016 года № 505. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 января 2017 года № 14660. Утратил силу совместным приказом Министра водных ресурсов и ирригации Республики Казахстан от 9 июня 2025 года № 121-НҚ и и.о. Министра экологии и природных ресурсов Республики Казахстан от 10 июня 2025 года № 157 (вводится в действие c 10 июня 2025 года)
