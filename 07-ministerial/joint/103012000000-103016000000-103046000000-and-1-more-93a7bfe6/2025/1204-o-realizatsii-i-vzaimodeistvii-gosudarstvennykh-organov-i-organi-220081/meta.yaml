title:
  rus: О реализации и взаимодействии государственных органов и организаций в ходе реализации пилотного проекта по оказанию услуги «Предоставление цифровых продовольственных ваучеров получателям государственной адресной социальной помощи»
  kaz: «Мемлекеттік атаулы әлеуметтік көмек алушыларға цифрлық азық-түлік ваучерлерін ұсыну» қызметін көрсету жөніндегі пилоттық жобаны іске асыру және оны іске асыру барысында мемлекеттік органдар мен ұйымдардың өзара іс-қимылы туралы
