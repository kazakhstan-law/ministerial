  title:
    rus: О внесении изменений и дополнения в совместный приказ Председателя Комитета национальной безопасности Республики Казахстан от 25 октября 2016 года № 72 и Министра национальной экономики Республики Казахстан от 9 ноября 2016 года № 471 «Об утверждении критериев оценки степени риска и проверочных листов в сферах обеспечения информационной безопасности и специальных технических средств, предназначенных для проведения оперативно-розыскных мероприятий»
    kaz: «Ақпараттық қауіпсіздікті қамтамасыз ету және жедел iздестiру іс-шараларын жүргiзуге арналған арнайы техникалық құралдар саласындағы тәуекел дәрежесін бағалау өлшемшарттары мен тексеру парақтарын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2016 жылғы 25 қазандағы № 72 және Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 9 қарашадағы № 471 бірлескен бұйрығына өзгерістер мен толықтыру енгізу туралы
