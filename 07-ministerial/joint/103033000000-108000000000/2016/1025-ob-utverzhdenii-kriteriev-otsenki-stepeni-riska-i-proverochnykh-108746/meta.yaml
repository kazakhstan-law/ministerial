title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов в сферах обеспечения информационной безопасности и специальных технических средств, предназначенных для проведения оперативно-розыскных мероприятий
  kaz: Ақпараттық қауіпсіздікті қамтамасыз ету және жедел iздестiру іс-шараларын жүргiзуге арналған арнайы техникалық құралдар салаларындағы тәуекел дәрежесін бағалау өлшемшарттары мен тексеру парақтарын бекіту туралы
