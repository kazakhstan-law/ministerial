  kaz: Ақпараттық қауіпсіздікті қамтамасыз ету және жедел iздестiру іс-шараларын жүргiзуге арналған арнайы техникалық құралдар салаларындағы тәуекел дәрежесін бағалау өлшемшарттары мен тексеру парақтарын бекіту туралы
