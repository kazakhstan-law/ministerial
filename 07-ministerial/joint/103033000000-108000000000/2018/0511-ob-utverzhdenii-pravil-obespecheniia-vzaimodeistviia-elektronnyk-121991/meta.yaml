act_code: '121991'
requisite: Совместный приказ Министра национальной экономики Республики Казахстан от 11 мая 2018 года № 179 и Председателя Комитета национальной безопасности Республики Казахстан от 24 мая 2018 года № 41. Утратил силу совместным приказом Председателя Агентства по стратегическому планированию и реформам Республики Казахстан от 22 января 2021 года № 2 и Председателя Комитета национальной безопасности Республики Казахстан от 4 августа 2021 года № 87/қе (вступает в силу со дня его подписания)
title:
  rus: Об утверждении Правил обеспечения взаимодействия электронных информационных ресурсов Комитета национальной безопасности Республики Казахстан и Министерства национальной экономики Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің және Қазақстан Республикасы Ұлттық экономика министрлігінің электрондық ақпараттық ресурстарының өзара іс-қимылын қамтамасыз ету қағидаларын бекіту туралы
