act_code: '142892'
requisite: Совместный приказ Министра национальной экономики Республики Казахстан от 14 апреля 2020 года № 93 и Председателя Комитета национальной безопасности Республики Казахстан от 16 апреля 2020 года № 206/қе-қа
title:
  rus: Об утверждении Порядка взаимодействия Комитета по статистике Министерства национальной экономики Республики Казахстан с Комитетом национальной безопасности Республики Казахстан при проведении национальной переписи населения Республики Казахстан в 2020 году на объектах Комитета национальной безопасности Республики Казахстан
  kaz: 2020 жылы Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің объектілерінде Қазақстан Республикасы халқының ұлттық санағын өткізу кезінде Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитетінің Қазақстан Республикасы Ұлттық қауіпсіздік комитетімен өзара іс-қимыл жасау тәртібін бекіту туралы
