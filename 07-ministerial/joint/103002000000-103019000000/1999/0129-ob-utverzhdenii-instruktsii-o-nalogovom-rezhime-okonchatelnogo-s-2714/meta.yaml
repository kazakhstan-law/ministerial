act_code: '2714'
requisite: ДСП Совместный приказ Министра финансов Республики Казахстан от 29 января 1999 года № 42 и Министра государственных доходов Республики Казахстан от 29 января 1999 года № 29. Зарегистрирован в Министерстве юстиции Республики Казахстан 11.02.1999 г. N 681
title:
  rus: Об утверждении Инструкции "О налоговом режиме Окончательного Соглашения о Разделе Продукции подрядного участка нефтегазоконденсатного Карачаганакского месторождения от 18 ноября 1997 года, заключенного между компаниями Аджип Карачаганак Б.В. ("Аджип"), БГ Эксплорейшн энд Продакшн Лимитед ("Бритиш Газ"), Тексако Интернэшнл Петролеум Компани ("Тексако"), Акционерным обществом открытого типа нефтяная компания ("Лукойл"), Акционерным обществом закрытого типа Национальная Нефтегазовая Компания Казахойл ("Казахойл") и Правительством Республики Казахстан"
  kaz: '"Аджип Қарашығанақ Б.В. ("Аджип"), БГ Эксплорейшн энд Продакшн Лимитед ("Бритиш Газ"), Тексако Интернэшнл Петролеум Компаниясы ("Тексако") компаниялары, Мұнай компаниясы ашық үлгідегі акционерлік қоғамы ("Лукойл"), Қазақойл Ұлттық Мұнайгаз Компаниясы жабық үлгідегі акционерлік қоғамы ("Қазақойл") және Қазақстан Республикасының Үкіметі арасында 1997 жылдың 18 қарашасында жасалған Қарашығанақ кен орыны мұнайгазконденсант мердігерлік учаскесінің Өнімдерін Бөлу туралы Түпкілікті Келісімнің салықтық режимі туралы" Нұсқаулықты бекіту туралы'
