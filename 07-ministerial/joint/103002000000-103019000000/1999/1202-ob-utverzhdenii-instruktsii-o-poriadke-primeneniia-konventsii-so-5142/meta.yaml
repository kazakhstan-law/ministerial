  code: '31010'
  requisite: Приказ Министра финансов Республики Казахстан от 25 декабря 2006 года № 500. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 декабря 2006 года № 4496. Утратил силу приказом Министра финансов Республики Казахстан от 9 января 2009 года № 5
  title:
    rus: О внесении дополнения в совместный приказ Министра финансов Республики Казахстан от 2 декабря 1999 года № 643 и Министра государственных доходов Республики Казахстан от 2 декабря 1999 года № 1478 "Об утверждении Инструкции о порядке применения Конвенций (Соглашений) об избежании двойного налогообложения и предотвращении уклонения от уплаты налогов на доход и капитал (имущество), заключенных Республикой Казахстан с иностранными государствами"
    kaz: '"Қазақстан Республикасының шет мемлекеттермен жасасқан қосарланған салық салуды болдырмау және табыс пен капиталға (мүлікке) салық төлеуден жалтаруға жол бермеу туралы конвенцияларды (Келiсiмдерді) қолданудың тәртібі туралы нұсқаулықты бекіту туралы" Қазақстан Республикасы Қаржы министрінің 1999 жылғы 2 желтоқсандағы № 643 және Қазақстан Республикасы Мемлекеттік кіріс министрінің 1999 жылғы 2 желтоқсандағы № 1478 бірлескен бұйрығына толықтыру енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/31010/rus
