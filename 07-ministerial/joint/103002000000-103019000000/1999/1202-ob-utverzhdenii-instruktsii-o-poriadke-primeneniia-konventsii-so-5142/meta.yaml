act_code: '5142'
requisite: Совместный приказ Министра финансов Республики Казахстан от 2 декабря 1999 г. N 643 и Министра государственных доходов Республики Казахстан от 2 декабря 1999 г. N 1478. Зарегистрирован в Министерстве юстиции Республики Казахстан 6.01.2000г. за N 1021. Утратил силу приказом Министра финансов Республики Казахстан от 9 января 2009 года № 5
title:
  rus: Об утверждении Инструкции о порядке применения Конвенций (Соглашений) об избежании двойного налогообложения и предотвращении уклонения от уплаты налогов на доход и капитал (имущество), заключенных Республикой Казахстан с иностранными государствами
  kaz: Қазақстан Республикасының шет мемлекеттермен жасасқан қосарланған салық салуды болдырмау және табыс пен капиталға (мүлікке)салық төлеуден жалтаруға жол бермеу туралы Конвенцияларды (Келiсiмдерді) қолданудың тәртібі туралы нұсқаулық
