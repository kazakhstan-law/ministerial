act_code: '119344'
requisite: Совместный приказ Министра финансов Республики Казахстан от 5 февраля 2018 года № 120 и и.о. Министра здравоохранения Республики Казахстан от 20 февраля 2018 года № 64. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 марта 2018 года № 16530
title:
  rus: Об утверждении Правил осуществления должностными лицами органов государственных доходов санитарно-карантинного контроля в автомобильных пунктах пропуска через таможенную границу Евразийского экономического союза, а также привлечения территориальных подразделений государственного органа в сфере санитарно-эпидемиологического благополучия населения в целях проведения санитарно-карантинного контроля
  kaz: Еуразиялық экономикалық одақтың кедендік шекарасы арқылы автомобиль өткізу пункттерінде санитариялық-карантиндік бақылауды мемлекеттік кірістер органдары лауазымды адамдарымен жүзеге асыру, сондай-ақ санитариялық-карантиндік бақылауды жүргізу мақсатында халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы мемлекеттік органның аумақтық бөлімшелерін тарту қағидаларын бекіту туралы
