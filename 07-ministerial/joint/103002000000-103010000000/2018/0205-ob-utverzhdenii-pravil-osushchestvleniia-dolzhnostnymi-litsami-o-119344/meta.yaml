  title:
    rus: О внесении изменений в совместный приказ Министра финансов Республики Казахстан от 5 февраля 2018 года № 120 и исполняющего обязанности Министра здравоохранения Республики Казахстан от 20 февраля 2018 года № 64 «Об утверждении Правил осуществления должностными лицами органов государственных доходов санитарно-карантинного контроля в автомобильных пунктах пропуска через таможенную границу Евразийского экономического союза, а также привлечения территориальных подразделений государственного органа в сфере санитарно-эпидемиологического благополучия населения в целях проведения санитарно-карантинного контроля»
    kaz: «Еуразиялық экономикалық одақтың кедендік шекарасы арқылы автомобиль өткізу пункттерінде санитариялық-карантиндік бақылауды мемлекеттік кірістер органдары лауазымды адамдарымен жүзеге асыру, сондай-ақ санитариялық-карантиндік бақылауды жүргізу мақсатында халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы мемлекеттік органның аумақтық бөлімшелерін тарту қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 5 ақпандағы № 120 және Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2018 жылғы 20 ақпандағы № 64 бірлескен бұйрығына өзгерістер енгізу туралы
