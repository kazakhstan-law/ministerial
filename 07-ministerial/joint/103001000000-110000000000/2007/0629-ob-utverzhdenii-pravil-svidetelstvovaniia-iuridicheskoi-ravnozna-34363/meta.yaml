requisite: Совместный приказ Председателя Агентства Республики Казахстан по информатизации и связи от 29 июня 2007 года № 287-п и Министра юстиции Республики Казахстан от 29 июня 2007 года № 193. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 июля 2007 года № 4820. Утратил силу совместным приказом Министра связи и информации Республики Казахстан от 27 апреля 2010 года № 18 и Министра юстиции Республики Казахстан от 5 апреля 2010 года № 99
title:
