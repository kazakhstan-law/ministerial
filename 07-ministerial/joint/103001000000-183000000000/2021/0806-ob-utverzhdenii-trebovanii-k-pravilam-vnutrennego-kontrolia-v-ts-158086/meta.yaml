requisite: Совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 августа 2021 года № 5 и и.о. Министра юстиции Республики Казахстан от 19 августа 2021 года № 722. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 августа 2021 года № 24068. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 24 февраля 2022 года № 15 и Министра юстиции Республики Казахстан от 24 февраля 2022 года № 152 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для нотариусов
