  requisite: Совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 13 сентября 2022 года № 31 и Министра юстиции Республики Казахстан от 15 сентября 2022 года № 783. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 сентября 2022 года № 29642. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 апреля 2026 года № 4, Министра юстиции Республики Казахстан от 30 апреля 2026 года № 408, Заместителя Премьер-Министра – Министр искусственного интеллекта и цифрового развития Республики Казахстан от 22 апреля 2026 года № 216/НҚ, Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 8 апреля 2026 года № 1 и Министра туризма и спорта Республики Казахстан от 14 апреля 2026 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 24 февраля 2022 года № 15 и Министра юстиции Республики Казахстан от 24 февраля 2022 года № 152 «Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для нотариусов»
    kaz: Қазақстан Республикасы Қаржылық мониторинг агенттігі Төрағасының 2022 жылғы 24 ақпандағы № 15 және Қазақстан Республикасы Әділет министрінің 2022 жылғы 24 ақпандағы № 152 «Нотариустар үшін қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы» бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
