requisite: Совместный приказ Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 29 апреля 2014 года № 140 и Министра регионального развития Республики Казахстан от 5 мая 2014 года № 124/ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 июня 2014 года № 9514. Утратил силу совместным приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 4 декабря 2015 года № 1160 и Министра национальной экономики Республики Казахстан от 25 декабря 2015 года № 790
title:
  rus: Об утверждении критериев оценки степени риска в сфере частного предпринимательства в области оборота ядов, вооружения, военной техники и отдельных видов оружия, взрывчатых и пиротехнических веществ и изделий с их применением
