requisite: Совместный приказ Министра здравоохранения Республики Казахстан от 6 апреля 2020 года № ҚР ДСМ-29/2020, Министра торговли и интеграции Республики Казахстан от 6 апреля 2020 года № 68-НҚ и Министра национальной экономики Республики Казахстан от 7 апреля 2020 года № 26. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 апреля 2020 года № 20334. Утратил силу совместным приказом Министра здравоохранения Республики Казахстан от 13 апреля 2021 года № ҚР ДСМ-29, Министра торговли и интеграции Республики Казахстан от 13 апреля 2021 года № 275-НҚ и постановлением Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 13 апреля 2021 года № 7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
