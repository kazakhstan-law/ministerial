requisite: Совместный Приказ Председателя Комитета по водным ресурсам Министерства природных ресурсов и охраны окружающей среды от 20 июня 2001 года № 50-П и Председателя Комитета геологии и охраны недр Министерства энергетики и минеральных ресурсов Республики Казахстан от 20 июня 2001 года № 155-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июля 2001 года № 1595. Утратил силу - совместным приказом Министра здравоохранения Республики Казахстан от 24 ноября 2004 года № 824, Министра охраны окружающей среды Республики Казахстан от 1 декабря 2004 года № 309-п, и.о. Председателя Комитета по водным ресурсам Министерства сельского хозяйства Республики Казахстан от 11 ноября 2004 года № 236-п, Председателя Комитета геологии и недропользования Министерства энергетики и минеральных ресурсов Республики Казахстан от 2 декабря 2004 года № 161-п
