act_code: '69304'
requisite: Совместный приказ Министра нефти и газа Республики Казахстан от 24 августа 2012 года № 144, Министра индустрии и новых технологий Республики Казахстан от 9 октября 2012 года № 368, Министра по чрезвычайным ситуациям Республики Казахстан от 16 октября 2012 года № 465.  Зарегистрирован в Министерстве юстиции Республики Казахстан 15 ноября 2012 года № 8083. Утратил силу совместным приказом Министра нефти и газа Республики Казахстан от 10 февраля 2014 года № 21, Министра по чрезвычайным ситуациям Республики Казахстан от 14 марта 2014 года № 114 и Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 16 июня 2014 года № 217
title:
  rus: Об утверждении регламента оказания государственной услуги "Выдача разрешения на сжигание в факелах попутного и (или) природного газа при испытании объекта скважин, пробной эксплуатации месторождения, технологически неизбежном сжигании газа при пусконаладке, эксплуатации, техническом обслуживании и ремонтных работах технологического оборудования"
  kaz: '"Ұңғымалар объектiлерiн сынау, кен орнын сынамалы пайдалану, технологиялық жабдықты iске қосу-баптау, пайдалану, оған техникалық қызмет көрсету және жөндеу жұмыстары жағдайында газды технологиялық ерiксiз жағу кезiнде iлеспе және (немесе) табиғи газды алау етiп жағуға рұқсат беру" мемлекеттік қызметті көрсету регламентін бекіту туралы'
