title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов в области взрывчатых и пиротехнических (за исключением гражданских) веществ и изделий с их применением
  kaz: Жарылғыш және пиротехникалық (азаматтық заттарды қоспағанда) заттар мен оларды қолдана отырып жасалған бұйымдар саласындағы тәуекел дәрежесін бағалау өлшемшарттары және тексеру парақтарын бекіту туралы
