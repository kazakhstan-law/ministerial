  requisite: Совместный приказ Министра по чрезвычайным ситуациям Республики Казахстан от 29 августа 2023 года № 457 и Министра национальной экономики Республики Казахстан от 29 августа 2023 года № 154. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 августа 2023 года № 33357
  title:
    rus: О внесении изменений в совместный приказ Министра по чрезвычайным ситуациям Республики Казахстан от 30 ноября 2022 года № 261 и и.о. Министра национальной экономики Республики Казахстан от 30 ноября 2022 года № 106 «Об утверждении критериев оценки степени риска и проверочных листов в сфере осуществления деятельности по разработке, производству, приобретению, реализации, хранению взрывчатых и пиротехнических (за исключением гражданских) веществ и изделий с их применением, применяемые для проведения проверок, проводимых на соответствие квалификационным или разрешительным требованиям по выданным разрешениям»
    kaz: Қазақстан Республикасы Төтенше жағдайлар министрінің 2022 жылғы 30 қарашадағы № 261 және Қазақстан Республикасы Ұлттық экономика министрінің м.а. 2022 жылғы 30 қарашадағы № 106 «Берілген рұқсаттар бойынша біліктілік немесе рұқсат беру талаптарына сәйкестігіне тексерулер жүргізу үшін қолданылатын жарылғыш және пиротехникалық (азаматтық заттарды қоспағанда) заттар мен олар қолданылып жасалған бұйымдарды әзірлеу, өндіру, сатып алу, өткізу, сақтау жөніндегі қызметті жүзеге асыру саласындағы тәуекел дәрежесін бағалау өлшемшарттары мен тексеру парақтарын бекіту туралы» бірлескен бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/185685/rus
