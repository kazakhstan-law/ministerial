requisite: Совместный приказ Министра здравоохранения Республики Казахстан от 21 декабря 2020 года № ҚР ДСМ-296/2020 и и.о. Министра образования и науки Республики Казахстан от 21 декабря 2020 года № 533. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 декабря 2020 года № 21864
title:
  rus: «Об утверждении Правил непрерывного образования детей школьного возраста в период получения в стационарных условиях специализированной медицинской помощи, медицинской реабилитации, а также паллиативной медицинской помощи»
  kaz: «Мектеп жасындағы балалардың стационар жағдайында мамандандырылған медициналық көмек, медициналық оңалту, сондай-ақ паллиативтік медициналық көмек алу кезеңінде үздіксіз білім беру қағидаларын бекіту туралы»
