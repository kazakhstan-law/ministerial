  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра информации и коммуникаций Республики Казахстан от 24 октября 2017 года № 379 и Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 24 октября 2017 года № 232 «Об утверждении Методики оценки эффективности организационного развития государственных органов»
    kaz: «Мемлекеттік органдардың ұйымдастырушылық даму тиімділігін бағалау әдістемесін бекіту туралы» Қазақстан Республикасы Ақпарат және коммуникациялар министрінің 2017 жылғы 24 қазандағы № 379 және Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі төрағасының 2017 жылғы 24 қазандағы № 232 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
