  requisite: Совместный приказ Министра финансов Республики Казахстан от 28 декабря 2015 года № 705 и Министра культуры и спорта Республики Казахстан от 14 января 2016 года № 6. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 февраля 2016 года № 13087. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 28 февраля 2022 года № 17 и Министра культуры и спорта Республики Казахстан от 28 февраля 2022 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в совместный приказ Министра финансов Республики Казахстан от 27 ноября 2014 года № 527 и Министра культуры и спорта Республики Казахстан от 26 ноября 2014 года № 112 "Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для организаторов игорного бизнеса и лотерей"
    kaz: «Ойын бизнесі мен лотереяларды ұйымдастырушыларға арналған қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау ережелеріне қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Қаржы Министрінің 2014 жылғы 27 қарашадағы № 527 және Қазақстан Республикасы Мәдениет және спорт Министрінің 2014 жылғы 26 қарашадағы № 112 бірлескен бұйрығына өзгерістер енгізу туралы
