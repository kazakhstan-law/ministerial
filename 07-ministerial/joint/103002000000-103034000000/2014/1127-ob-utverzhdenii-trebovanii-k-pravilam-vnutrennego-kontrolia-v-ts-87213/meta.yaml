requisite: Совместный приказ Министра финансов Республики Казахстан от 27 ноября 2014 года № 527 и Министра культуры и спорта Республики Казахстан от 26 ноября 2014 года № 112. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 декабря 2014 года № 9966. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 28 февраля 2022 года № 17 и Министра культуры и спорта Республики Казахстан от 28 февраля 2022 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для организаторов игорного бизнеса и лотерей
  kaz: Ойын бизнесі мен лотереяларды ұйымдастырушыларға арналған қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы
