  title:
    rus: О внесении изменения в совместный приказ Министра финансов Республики Казахстан от 27 ноября 2014 года № 527 и Министра культуры и спорта Республики Казахстан от 26 ноября 2014 года № 112 «Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для организаторов игорного бизнеса и лотерей»
    kaz: «Ойын бизнесі мен лотереяларды ұйымдастырушыларға арналған қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2014 жылғы 27 қарашадағы № 527 және Қазақстан Республикасы Мәдениет және спорт министрінің 2014 жылғы 26 қарашадағы № 112 бірлескен бұйрығына өзгеріс енгізу туралы
