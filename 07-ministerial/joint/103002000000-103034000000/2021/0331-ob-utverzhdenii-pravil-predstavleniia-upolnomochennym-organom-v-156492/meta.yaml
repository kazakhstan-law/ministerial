act_code: '156492'
requisite: Совместный приказ Министра финансов Республики Казахстан от 31 марта 2021 года № 278 и Министра культуры и спорта Республики Казахстан от 31 марта 2021 года № 85. Утратил силу Совместным приказом Министра финансов Республики Казахстан от 20 апреля 2026 года № 257 и Заместителя Премьер-министра – Министр культуры и информации Республики Казахстан от 11 июня 2026 года № 286-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования и распространяется на правоотношения, возникшие с 1 января 2026 года)
title:
  rus: Об утверждении Правил представления уполномоченным органом в области культуры сведений по физическим лицам, владеющим материальными культурными ценностями, имеющими особое значение для истории и культуры страны и включенными в Государственный реестр объектов национального культурного достояния
  kaz: Мәдениет саласындағы уәкілетті орган елдің тарихы мен мәдениеті үшін ерекше маңызы бар және Ұлттық мәдени игілік объектілерінің мемлекеттік тізіліміне енгізілген материалдық мәдени құндылықтарға ие жеке тұлғалар жөніндегі мәліметтерді ұсыну қағидаларын бекіту туралы
