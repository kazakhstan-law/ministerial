act_code: '209937'
requisite: Совместный приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 19 апреля 2025 года № 166/НҚ и Министра юстиции Республики Казахстан от 30 апреля 2025 года № 236
title:
  rus: О реализации пилотного проекта по оказанию государственной услуги «Государственная регистрация прав (обременений) на недвижимое имущество» посредством реинжиниринга предоставления акционерным обществом «Казахстанская Жилищная Компания» жилья в аренду с выкупом
  kaz: «Қазақстандық тұрғын үй компаниясы» акционерлік қоғамының сатып алумен жалға тұрғын үй беруін реинжиниринг арқылы «Жылжымайтын мүлікке құқықтарды (ауыртпалықтарды) мемлекеттік тіркеу» мемлекеттік қызметін көрсету жөніндегі пилоттық жобаны іске асыру туралы»
