act_code: '182173'
requisite: Совместный приказ Министра юстиции Республики Казахстан от 26 мая 2023 года № 344 и и.о. Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 27 мая 2023 года № 115/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 мая 2023 года № 32616
title:
  rus: О реализации пилотного проекта по оказанию государственных услуг Министерства юстиции Республики Казахстан по проведению аттестации лиц, претендующих на право занятия профессиональной деятельностью и присвоению квалификации в автоматизированном режиме
  kaz: Қазақстан Республикасы Әділет министрлігінің кәсіби қызметпен айналысу құқығына үміткер адамдарды аттестаттаудан өткізу және біліктілік беру жөніндегі мемлекеттік қызметтерін автоматтандырылған режимде көрсету бойынша пилоттық жобасын іске қосу туралы
