  requisite: Совместный приказ Министра юстиции Республики Казахстан от 10 ноября 2023 года № 810 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 10 ноября 2023 года № 535/НҚ
  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра юстиции Республики Казахстан от 26 мая 2023 года № 344 и исполняющего обязанности Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 27 мая 2023 года № 115/НҚ «О реализации пилотного проекта по оказанию государственных услуг Министерства юстиции Республики Казахстан по проведению аттестации лиц, претендующих на право занятия профессиональной деятельностью и присвоению квалификации в автоматизированном режиме»
    kaz: «Қазақстан Республикасы Әділет министрлігінің кәсіби қызметпен айналысу құқығына үміткер адамдарды аттестаттаудан өткізу және біліктілік беру жөніндегі мемлекеттік қызметтерін автоматтандырылған режимде көрсету бойынша пилоттық жобасын іске қосу туралы» Қазақстан Республикасы Әділет министрінің 2023 жылғы 26 мамырдағы № 344 және Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің міндетін атқарушының 2023 жылғы 27 мамырдағы № 115/НҚ бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/188318/rus
