title:
  rus: О запуске пилотного проекта по государственной регистрации юридического лица, относящегося к субъектам малого и среднего предпринимательства через веб-портал «электронного правительства» с применением биометрической верификации
  kaz: Биометриялық верификацияны қолдана отырып, «электрондық үкімет» веб-порталы арқылы шағын және орта кәсіпкерлік субъектілеріне жататын заңды тұлғаны мемлекеттік тіркеу жөніндегі пилоттық жобаны іске қосу туралы
