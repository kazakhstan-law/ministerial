act_code: '156638'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 29 июня 2021 года № 144 и Министра образования и науки Республики Казахстан от 29 июня 2021 года № 310
title:
  rus: О взаимодействии Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики с Министерством образования и науки Республики Казахстан при проведении национальной переписи населения Республики Казахстан в 2021 году на объектах Министерства образования и науки Республики Казахстан
  kaz: Қазақстан Республикасы Білім және ғылым министрлігінің объектілерінде 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің Ұлттық статистика бюросы Қазақстан Республикасы Білім және ғылым министрлігімен өзара іс-қимылы туралы
