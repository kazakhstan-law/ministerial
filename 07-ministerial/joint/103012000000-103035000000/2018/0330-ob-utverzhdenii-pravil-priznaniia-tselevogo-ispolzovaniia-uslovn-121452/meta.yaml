act_code: '121452'
requisite: Совместный приказ Министра по инвестициям и развитию Республики Казахстан от 30 марта 2018 года № 208 и Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 3 апреля 2018 года № 143. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 апреля 2018 года № 16805
title:
  rus: Об утверждении Правил признания целевого использования условно выпущенных товаров, помещенных под таможенную процедуру выпуска для внутреннего потребления, в отношении которых применены льготы по уплате ввозных таможенных пошлин, налогов, сопряженные с ограничениями по пользованию и (или) распоряжению товарами, ввезенными на таможенную территорию Евразийского экономического союза в рамках реализации специальных инвестиционных контрактов
  kaz: Ішкі тұтыну үшін шығару рәсімімен орналастырылған, оған қатысты арнайы инвестициялық келісімшарттарды іске асыру шеңберінде Еуразиялық экономикалық одақтың кедендік аумағына әкелінген тауарларды пайдалану және (немесе) оларға билік ету бойынша шектеулермен қатар қолданылған кедендік әкелу баждарын, салықтарды төлеу жөнінде жеңілдіктер берілген шартты түрде шығарылған тауарларды нысаналы пайдалануды тану қағидаларын бекіту туралы
