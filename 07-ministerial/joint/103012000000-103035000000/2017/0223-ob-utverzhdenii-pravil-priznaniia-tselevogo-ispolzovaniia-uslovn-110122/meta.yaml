act_code: '110122'
requisite: Совместный приказ Министра по инвестициям и развитию Республики Казахстан от 23 февраля 2017 года № 106 и Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 24 февраля 2017 года № 84. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 марта 2017 года № 14860. Утратил силу совместным приказом Министра по инвестициям и развитию Республики Казахстан от 30 марта 2018 года № 208 и Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 3 апреля 2018 года № 143 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил признания целевого использования условно выпущенных товаров, помещенных под таможенную процедуру выпуска для внутреннего потребления, в отношении которых предоставлены льготы по уплате ввозных таможенных пошлин, налогов, сопряженные с ограничениями по пользованию и (или) распоряжению товарами, ввезенными на таможенную территорию Таможенного союза в рамках реализации специальных инвестиционных контрактов
  kaz: Арнайы инвестициялық келісімшарттарды іске асыру шеңберінде Кеден одағының кедендік аумағына әкелінген тауарларды пайдалану және (немесе) оларға билік ету бойынша шектеулермен ұштасқан кедендік әкелу баждарын, салықтарды төлеу бойынша жеңілдіктер берілген ішкі тұтыну үшін шығарудың кедендік рәсімімен орналастырылған тауарларды шартты түрде шығарылған нысаналы пайдалануды тану қағидаларын бекіту туралы
