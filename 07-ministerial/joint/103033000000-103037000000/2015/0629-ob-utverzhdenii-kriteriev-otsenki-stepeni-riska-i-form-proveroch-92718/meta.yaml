requisite: Совместный приказ от 29.06.2015 № 538, Министерства здравоохранения и социального развития Республики Казахстан и Министерства национальной экономики Республики Казахстан от 30.06.2015 № 490. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июля 2015 года № 11796. Утратил силу совместным приказом Министра здравоохранения и социального развития Республики Казахстан от 29 декабря 2015 года № 1064 и Министра национальной экономики Республики Казахстан от 29 декабря 2015 года № 831
title:
  rus: Об утверждении критериев оценки степени риска и форм проверочных листов в сферах оказания медицинских услуг, обращения лекарственных средств, изделий медицинского назначения и медицинской техники
  kaz: Медициналық қызметтерді көрсету сапасы, дәрілік заттардың, медициналық мақсаттағы бұйымдар мен медициналық техниканың айналысы саласындағы тәуекел дәрежесін бағалау критерийлерін және тексеру парақтарының нысандарын бекіту туралы
