title:
  rus: Об утверждении Правил расчета величины прожиточного минимума и установлении фиксированной доли расходов на непродовольственные товары и услуги
  kaz: Ең төмен күнкөріс деңгейінің шамасын есептеу қағидаларын бекіту туралы және азық-түлік емес тауарлар мен көрсетілетін қызметтерге шығыстардың тіркелген үлесін белгілеу туралы
