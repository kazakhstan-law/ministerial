  title:
    rus: О внесении изменений в совместный приказ исполняющего обязанности Министра здравоохранения и социального развития Республики Казахстан от 27 июля 2015 года № 623 и исполняющего обязанности Министра национальной экономики Республики Казахстан от 31 июля 2015 года № 585 «Об утверждении Правил расчета величины прожиточного минимума и установлении фиксированной доли расходов на непродовольственные товары и услуги»
    kaz: «Ең төмен күнкөріс деңгейінің шамасын есептеу қағидаларын бекіту туралы және азық-түлік емес тауарлар мен көрсетілетін қызметтерге шығыстардың тіркелген үлесін белгілеу туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрі міндетін атқарушының 2015 жылғы 27 шілдедегі № 623 және Қазақстан Республикасы Ұлттық экономика министрі міндетін атқарушының 2015 жылғы 31 шілдедегі № 585 бірлескен бұйрығына өзгерістер енгізу туралы
