title:
  rus: Об утверждении Правил межведомственного взаимодействия государственных органов по принятию своевременных мер в отношении иммигрантов и кандасов, прибывших в регионы расселения, определенные Правительством Республики Казахстан
  kaz: Қазақстан Республикасы Үкіметі айқындаған қоныстандыру өңірлеріне келетін иммигранттар мен қандастарға қатысты уақтылы шаралар қабылдау жөніндегі мемлекеттік органдардың ведомствоаралық өзара іс-қимыл қағидаларын бекіту туралы
