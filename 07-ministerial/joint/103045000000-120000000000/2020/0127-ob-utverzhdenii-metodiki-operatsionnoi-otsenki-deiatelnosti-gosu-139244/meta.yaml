  title:
    rus: О внесении изменения в совместный приказ исполняющего обязанности Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 27 января 2020 года № 32/НҚ и Председателя Агентства Республики Казахстан по делам государственной службы от 28 января 2020 года № 25 «Об утверждении Методики операционной оценки деятельности государственных органов по блоку «Организационное развитие государственного органа»
    kaz: «Мемлекеттік органның ұйымдастырушылық дамуы» блогы бойынша мемлекеттік органдар қызметін операциялық бағалау әдістемесін бекіту туралы» Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің м.а. 2020 жылғы 27 қаңтардағы № 32/НҚ және Қазақстан Республикасы Мемлекеттік қызмет істері агенттігі төрағасының 2020 жылғы 28 қаңтардағы № 25 бірлескен бұйрығына өзгеріс енгізу туралы
