act_code: '223023'
requisite: Совместный приказ Министра финансов Республики Казахстан от 5 марта 2026 года № 156, Министра здравоохранения Республики Казахстан от 5 марта 2026 года № 27 и Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 6 марта 2026 года № 122/НҚ
title:
  rus: Об утверждении Механизма проведения пилотного проекта по организации размещения объемов медицинской помощи посредством цифрового сервиса финансирования здравоохранения и оказанию государственной услуги «Предоставление информации об участии в качестве потребителя медицинских услуг и о перечисленных суммах отчислений и (или) взносов в системе обязательного социального медицинского страхования и их использовании»
  kaz: Денсаулық сақтауды қаржыландырудың цифрлық сервисі арқылы медициналық көмек көлемдерін орналастыруды ұйымдастыру және «Міндетті әлеуметтік медициналық сақтандыру жүйесіне медициналық көрсетілетін қызметті тұтынушы ретінде қатысу туралы және аударымдардың және (немесе) жарналардың аударылған сомалары және оларды пайдалану туралы ақпарат ұсыну» мемлекеттік қызметін көрсету бойынша пилоттық жобаны жүргізу тетігін бекіту туралы
