  title:
    rus: О внесении изменений в совместный приказ Министра по инвестициям и развитию Республики Казахстан от 20 июня 2016 года № 512 и Министра обороны Республики Казахстан от 27 июня 2016 года № 312 «Об утверждении Правил организации и предоставления спутниковых навигационных услуг национальным оператором системы высокоточной спутниковой навигации»
    kaz: «Дәлдігі жоғары спутниктік навигация жүйесі ұлттық операторының спутниктік навигациялық қызметтерді ұйымдастыру және ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2016 жылғы 20 маусымдағы № 512 және Қазақстан Республикасы Қорғаныс министрінің 2016 жылғы 27 маусымдағы № 312 бірлескен бұйрығына өзгерістер енгізу туралы
