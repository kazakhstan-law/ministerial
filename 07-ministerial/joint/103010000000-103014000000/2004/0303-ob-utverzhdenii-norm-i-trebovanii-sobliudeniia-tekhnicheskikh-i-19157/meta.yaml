act_code: '19157'
requisite: Совместный приказ Председателя Агентства Республики Казахстан по туризму и спорту от 3 марта 2004 года N 06-2-2/73 и Министра здравоохранения Республики Казахстан от 1 марта 2004 года N 203. Зарегистрировано в Министерстве юстиции Республики Казахстан 29 марта 2004 года N 2775. Утратил силу совместным приказом Министра туризма и спорта Республики Казахстан от 2 ноября 2023 года № 279 и Министра здравоохранения Республики Казахстан от 6 ноября 2023 года № 161 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм и требований соблюдения технических и санитарных условий для обеспечения отдыха туристов с инвалидностью на всех объектах туристской инфраструктуры
  kaz: Барлық туристiк инфрақұрылым объектiлерiнде мүгедектігі бар туристердiң демалысын қамтамасыз ету үшiн техникалық және санитарлық жағдайларды сақтау нормалары мен талаптарын бекiту туралы
