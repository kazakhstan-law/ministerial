caused_by:
  code: '172461'
  requisite: Совместный приказ Министра культуры и спорта Республики Казахстан от 30 сентября 2022 года № 284 и и.о. Министра здравоохранения Республики Казахстан от 30 сентября 2022 года № ҚР ДСМ-109. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 октября 2022 года № 29985. Утратил силу совместным приказом Министра туризма и спорта Республики Казахстан от 2 ноября 2023 года № 279 и Министра здравоохранения Республики Казахстан от 6 ноября 2023 года № 161 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в совместный приказ Председателя Агентства Республики Казахстан по туризму и спорту от 3 марта 2004 года № 06-2-2/73 и Министра здравоохранения Республики Казахстан от 1 марта 2004 года № 203 «Об утверждении норм и требований соблюдения технических и санитарных условий для обеспечения отдыха туристов-инвалидов на всех объектах туристской инфраструктуры»
    kaz: «Барлық туристiк инфрақұрылым объектiлерiнде мүгедек туристердiң демалысын қамтамасыз ету үшiн техникалық және санитарлық жағдайларды сақтау нормалары мен талаптарын бекiту туралы» Қазақстан Республикасының Туризм және спорт жөнiндегi агенттiгi төрағасының 2004 жылғы 3 наурыздағы № 06-2-2/73 және Қазақстан Республикасының Денсаулық сақтау министрiнiң 2004 жылғы 1 наурыздағы № 203 бірлескен бұйрығына өзгерістер енгізу туралы
