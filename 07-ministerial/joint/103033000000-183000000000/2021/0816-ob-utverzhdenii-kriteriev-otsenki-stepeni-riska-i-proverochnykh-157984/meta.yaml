  requisite: Совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 25 мая 2023 года № 3 и Министра национальной экономики Республики Казахстан от 26 мая 2023 года № 84. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 мая 2023 года № 32611
  title:
    rus: О внесении изменений и дополнений в совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 16 августа 2021 года № 7 и Министра национальной экономики Республики Казахстан от 16 августа 2021 года № 80 «Об утверждении критериев оценки степени риска и проверочного листа за соблюдением законодательства Республики Казахстан о противодействии легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма»
    kaz: Қазақстан Республикасы Қаржылық мониторинг агенттігі Төрағасының 2021 жылғы 16 тамыздағы № 7 және Қазақстан Республикасы Ұлттық экономика министрінің 2021 жылғы 16 тамыздағы № 80 «Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл туралы Қазақстан Республикасының заңнамасын сақтаудың тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/182216/rus
