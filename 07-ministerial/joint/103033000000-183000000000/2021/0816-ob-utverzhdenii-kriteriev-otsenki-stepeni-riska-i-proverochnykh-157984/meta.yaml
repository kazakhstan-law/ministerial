act_code: '157984'
requisite: Совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 16 августа 2021 года № 7 и Министра национальной экономики Республики Казахстан от 16 августа 2021 года № 80. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 августа 2021 года № 24034
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов за соблюдением законодательства Республики Казахстан о противодействии легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения
  kaz: Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл туралы Қазақстан Республикасының заңнамасын сақтаудың тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
