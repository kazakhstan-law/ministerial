  requisite: Совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 19 марта 2025 года № 4 и Министра национальной экономики Республики Казахстан от 26 марта 2025 года № 14. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 марта 2025 года № 35868
  title:
    rus: О внесении изменений и дополнений в Совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 16 августа 2021 года № 7 и Министра национальной экономики Республики Казахстан от 16 августа 2021 года № 80 «Об утверждении критериев оценки степени риска и проверочного листа за соблюдением законодательства Республики Казахстан о противодействии легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма»
    kaz: «Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл туралы Қазақстан Республикасының заңнамасын сақтаудың тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасының Қаржылық мониторинг агенттігі төрағасының 2021 жылғы 16 тамыздағы № 7 және Қазақстан Республикасы Ұлттық экономика министрінің 2021 жылғы 16 тамыздағы № 80 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
