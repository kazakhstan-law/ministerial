  title:
    rus: О внесении изменений в совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 16 августа 2021 года № 7 и Министра национальной экономики Республики Казахстан от 16 августа 2021 года № 80 «Об утверждении критериев оценки степени риска и проверочного листа за соблюдением законодательства Республики Казахстан о противодействии легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма»
    kaz: «Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл туралы Қазақстан Республикасының заңнамасын сақтаудың тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасы Қаржылық мониторинг агенттігі Төрағасының 2021 жылғы 16 тамыздағы № 7 және Қазақстан Республикасы Ұлттық экономика министрінің 2021 жылғы 16 тамыздағы № 80 бірлескен бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/220962/rus
