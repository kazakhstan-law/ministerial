title:
  rus: Об утверждении Правил взаимодействия по представлению органами государственных доходов Министерству труда и социальной защиты населения Республики Казахстан сведений о налогоплательщике (налоговом агенте), составляющих налоговую тайну
  kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігіне мемлекеттік кірістер органдарының салық төлеуші (салық агенті) туралы салық құпиясын құрайтын мәліметтерді ұсыну жөніндегі өзара іс-қимыл қағидаларын бекіту туралы
