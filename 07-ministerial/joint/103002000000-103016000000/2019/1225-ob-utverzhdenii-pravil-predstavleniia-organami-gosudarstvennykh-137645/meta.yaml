  requisite: Совместный приказ Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 13 февраля 2023 года № 167 и Министра труда и социальной защиты населения Республики Казахстан от 9 февраля 2023 года № 41. Утратил силу совместным приказом Министра труда и социальной защиты населения Республики Казахстан от 2 июня 2026 года № 228 и Министра финансов Республики Казахстан от 3 июня 2026 года № 358 (вводится в действие с 12 июля 2026 года)
  title:
    rus: О внесении изменений и дополнений в Совместный приказ Первого заместителя Премьер-Министра Республики Казахстан - Министра финансов Республики Казахстан от 25 декабря 2019 года № 1416 и Министра труда и социальной защиты населения Республики Казахстан от 26 декабря 2019 года № 700 «Об утверждении Правил представления органами государственных доходов Министерству труда и социальной защиты населения Республики Казахстан сведений о налогоплательщике (налоговом агенте), составляющих налоговую тайну без получения письменного разрешения налогоплательщика (налогового агента) и перечня представляемых сведений»
    kaz: «Мемлекеттік кірістер органдарының Қазақстан Республикасы Еңбек және халықты әлеуметтiк қорғау министрлігіне салықтық құпияны құрайтын салық төлеушінің (салық агентінің) жазбаша рұқсатын алмастан салық төлеуші (салық агенті) туралы мәліметтерді беру қағидаларын және ұсынатын мәліметтердің тізбесін бекіту туралы» Қазақстан Республикасы Премьер-Министрінің Бірінші орынбасары - Қазақстан Республикасы Қаржы министрінің 2019 жылғы 25 желтоқсандағы № 1416 және Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2019 жылғы 26 желтоқсандағы № 700 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
