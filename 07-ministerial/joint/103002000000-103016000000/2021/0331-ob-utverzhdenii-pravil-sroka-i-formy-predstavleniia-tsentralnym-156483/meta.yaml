act_code: '156483'
requisite: Совместный приказ Министра финансов Республики Казахстан от 31 марта 2021 года № 279 и Министра труда и социальной защиты населения Республики Казахстан от 31 марта 2021 года № 97
title:
  rus: Об утверждении Правил, срока и формы представления центральным исполнительным органом, осуществляющим руководство, а также в пределах, предусмотренных законодательством Республики Казахстан, межотраслевую координацию в сфере социальной защиты населения, сведений по лицам, получающим социальные пособия, и размерах выплачиваемых им пособий, по лицам, получающим пенсионные выплаты, и их размерах, за исключением пенсионных выплат из страховых организаций
  kaz: Халықты әлеуметтік қорғау саласында басшылықты, сондай-ақ Қазақстан Республикасының заңнамасында көзделген шектерде салааралық үйлестіруді жүзеге асыратын орталық атқарушы органның әлеуметтік жәрдемақылар алатын адамдар және оларға төленетін жәрдемақылардың мөлшері бойынша, сақтандыру ұйымдарынан төленетін зейнетақы төлемдерін қоспағанда, зейнетақы төлемдерін алатын адамдар және олардың мөлшері бойынша мәліметтерді ұсыну қағидаларын, мерзімін және нысанын бекіту туралы
