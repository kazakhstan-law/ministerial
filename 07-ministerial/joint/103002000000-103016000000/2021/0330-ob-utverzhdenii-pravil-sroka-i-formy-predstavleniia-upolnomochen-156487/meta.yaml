requisite: Совместный приказ Министра финансов Республики Казахстан от 30 марта 2021 года № 269 и Министра труда и социальной защиты населения Республики Казахстан от 29 марта 2021 года № 90. Утратил силу совместным приказом Министра финансов Республики Казахстан от 1 октября 2025 года № 556 и Министра труда и социальной защиты населения Республики Казахстан от 30 сентября 2025 года № 304 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил, срока и формы представления уполномоченным органом по труду сведений о физических лицах, являющихся безработными, выданных разрешениях на привлечение иностранной рабочей силы для осуществления трудовой деятельности
  kaz: Еңбек жөніндегі уәкілетті мемлекеттік орган жұмыссыз болып табылатын жеке тұлғалар, еңбек қызметін жүзеге асыру үшін шетелдік жұмыс күшін тартуға берілген рұқсаттар туралы мәліметтерді ұсыну қағидаларын, мерзімін және нысанын бекіту туралы
