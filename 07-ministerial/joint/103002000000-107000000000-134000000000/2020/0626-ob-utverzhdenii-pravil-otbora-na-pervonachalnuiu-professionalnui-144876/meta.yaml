act_code: '144876'
requisite: Совместный приказ Генерального Прокурора Республики Казахстан от 26 июня 2020 года № 80, Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 29 июня 2020 года № 199 и Министра финансов Республики Казахстан от 14 июля 2020 года № 675. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 июля 2020 года № 20984
title:
  rus: Об утверждении Правил отбора на первоначальную профессиональную подготовку и условия ее прохождения для лиц, поступающих на службу в органы прокуратуры и службу экономических расследований, а также основания их отчисления от первоначальной профессиональной подготовки
  kaz: Прокуратура органдарына және экономикалық тергеу қызметіне кіретін адамдар үшін алғашқы кәсіптік даярлыққа іріктеудің және оны өткізу шарттарының, сондай-ақ оларды алғашқы кәсіптік даярлықтан шығару негіздерінің қағидаларын бекіту туралы
