  requisite: Совместный приказ Генерального Прокурора Республики Казахстан от 1 февраля 2023 года № 47, Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 21 февраля 2023 года № 61 и Председателя Агентства Республики Казахстан по финансовому мониторингу от 2 февраля 2023 года № 42. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 февраля 2023 года № 31956
  title:
    rus: О внесении изменений в совместный приказ Генерального Прокурора Республики Казахстан от 26 июня 2020 года № 80, Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 29 июня 2020 года № 199 и Министра финансов Республики Казахстан от 14 июля 2020 года № 675 «Об утверждении Правил отбора на первоначальную профессиональную подготовку и условия ее прохождения для лиц, поступающих на службу в органы прокуратуры, антикоррупционную службу и службу экономических расследований, а также основания их отчисления от первоначальной профессиональной подготовки»
    kaz: «Прокуратура органдарына, сыбайлас жемқорлыққа қарсы қызметке және экономикалық тергеу қызметіне кіретін адамдар үшін алғашқы кәсіптік даярлыққа іріктеудің және оны өткізу шарттарының, сондай-ақ оларды алғашқы кәсіптік даярлықтан шығару негіздерінің қағидаларын бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2020 жылғы 26 маусымдағы № 80, Қазақстан Республикасы Сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі (Сыбайлас жемқорлыққа қарсы қызмет) Төрағасының 2020 жылғы 29 маусымдағы № 199 және Қазақстан Республикасы Қаржы министрінің 2020 жылғы 14 шiлдедегi № 675 бірлескен бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/178800/rus
