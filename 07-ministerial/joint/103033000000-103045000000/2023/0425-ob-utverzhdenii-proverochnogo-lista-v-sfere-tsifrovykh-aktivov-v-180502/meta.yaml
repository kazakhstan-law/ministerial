  requisite: Совместный приказ и.о. Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 25 декабря 2023 года № 662/НҚ и и.о. Министра национальной экономики Республики Казахстан от 27 декабря 2023 года № 184. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 декабря 2023 года № 33828
  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 25 апреля 2023 года № 164/НҚ и Министра национальной экономики Республики Казахстан от 26 апреля 2023 года № 49 «Об утверждении проверочного листа в сфере цифровых активов в отношении цифровых майнеров»
    kaz: «Цифрлық майнерлерге қатысты цифрлық активтер саласындағы тексеру парағын бекіту туралы» Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2023 жылғы 25 сәуірдегі № 164/НҚ және Қазақстан Республикасы Ұлттық экономика министрінің 2023 жылғы 26 сәуірдегі № 49 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
