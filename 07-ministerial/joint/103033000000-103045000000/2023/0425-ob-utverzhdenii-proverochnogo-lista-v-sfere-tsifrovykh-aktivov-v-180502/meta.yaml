  requisite: Совместный приказ Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 2 июня 2026 года № 275/НҚ и Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 29 июня 2026 года № 90. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 июня 2026 года № 39137
  title:
    rus: О внесении изменений в совместный приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 25 апреля 2023 года № 164/НҚ и Министра национальной экономики Республики Казахстан от 26 апреля 2023 года № 49 «Об утверждении проверочных листов в сфере цифровых активов в отношении цифровых майнеров и цифровых майнинговых пулов»
    kaz: Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2023 жылғы 25 сәуірдегі № 164/НҚ және Қазақстан Республикасы Ұлттық экономика министрінің 2023 жылғы 26 сәуірдегі № 49 «Цифрлық майнерлерге және цифрлық майнингтік пулдарға қатысты цифрлық активтер саласындағы тексеру парақтарын бекіту туралы» бірлескен бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/227155/rus
