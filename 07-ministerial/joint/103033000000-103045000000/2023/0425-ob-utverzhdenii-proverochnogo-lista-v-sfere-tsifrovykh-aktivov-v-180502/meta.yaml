  requisite: Совместный приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 26 июня 2024 года № 373/НҚ и Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 28 июня 2024 года № 49. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 июня 2024 года № 34676
  title:
    rus: О внесении дополнения в совместный приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 25 апреля 2023 года № 164/НҚ и Министра национальной экономики Республики Казахстан от 26 апреля 2023 года № 49 «Об утверждении проверочных листов в сфере цифровых активов в отношении цифровых майнеров и цифровых майнинговых пулов»
    kaz: «Цифрлық майнерлерге және цифрлық майнингтік пулдарға қатысты цифрлық активтер саласындағы тексеру парақтарын бекіту туралы» Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2023 жылғы 25 сәуірдегі № 164/НҚ және Қазақстан Республикасы Ұлттық экономика министрінің 2023 жылғы 26 сәуірдегі № 49 бірлескен бұйрығына толықтыру енгізу туралы
