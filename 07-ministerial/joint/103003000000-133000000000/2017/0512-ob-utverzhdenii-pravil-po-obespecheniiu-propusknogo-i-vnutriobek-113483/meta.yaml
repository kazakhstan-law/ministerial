act_code: '113483'
requisite: Совместный приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 12 мая 2017 года № 5 дсп и Министра внутренних дел Республики Казахстан от 29 мая 2017 года № 90 дсп. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июля 2017 года № 15316
title:
  rus: Об утверждении Правил по обеспечению пропускного и внутриобъектового режимов в административном здании Республиканского государственного казенного предприятия «Академия государственного управления при Президенте Республики Казахстан» и прилагающей к нему территории»
  kaz: «Қазақстан Республикасы Президентінің жанындағы Мемлекеттік басқару академиясы» Республикалық мемлекеттік қазыналық кәсіпорнының әкімшілік ғимаратына және оған тиесілі аумағына өткізу және объектішілік режимдерін қамтамасыз ету қағидаларын бекіту туралы»
