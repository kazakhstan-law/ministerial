  code: '178790'
  requisite: Совместный приказ Председателя Агентства Республики Казахстан по делам государственной службы от 24 января 2023 года № 1қбп и Министра внутренних дел Республики Казахстан от 6 февраля 2023 года № 13дсп. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 февраля 2023 года № 31899
  title:
    rus: О внесении изменений в совместный приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 12 мая 2017 года № 5 дсп и Министра внутренних дел Республики Казахстан от 29 мая 2017 года № 90 дсп «Об утверждении Правил по обеспечению пропускного и внутриобъектового режимов в административном здании Республиканского государственного казенного предприятия «Академия государственного управления при Президенте Республики Казахстан» и прилегающей к нему территории»
    kaz: «Қазақстан Республикасы Президентінің жанындағы Мемлекеттік басқару академиясы» республикалық мемлекеттік қазыналық кәсіпорнының әкімшілік ғимаратына және оған тиесілі аумағына өткізу және объектішілік режимдерін қамтамасыз ету қағидаларын бекіту туралы» Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі Төрағасының 2017 жылғы 12 мамырдағы № 5 қбпү және Қазақстан Республикасы Ішкі істер министрінің 2017 жылғы 29 мамырдағы № 90 қбпү бірлескен бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/178790/rus
