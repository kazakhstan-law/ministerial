act_code: '133156'
requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 9 июля 2019 года № 616 и Председателя Комитета национальной безопасности Республики Казахстан от 10 июля 2019 года № 47/қе. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 июля 2019 года № 19019.  Утратил силу Совместным приказом Министра внутренних дел Республики Казахстан от 2 марта 2024 года № 201 и Председателя Комитета национальной безопасности Республики Казахстан от 4 марта 2024 года № 54 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил взаимодействия органов внутренних дел и национальной безопасности по вопросам обеспечения безопасности и правопорядка на территории специальной экономической зоны, пределы которой полностью или частично совпадают с участками таможенной границы Евразийского экономического союза
  kaz: Шектері Еуразиялық экономикалық одақтың кедендік шекарасының учаскелерімен толық немесе ішінара тұспа-тұс келетін арнайы экономикалық аймақтың аумағында қауіпсіздік пен құқықтық тәртіпті қамтамасыз ету мәселелері бойынша ішкі істер және ұлттық қауіпсіздік органдарының өзара іс-қимыл жасау қағидаларын бекіту туралы
