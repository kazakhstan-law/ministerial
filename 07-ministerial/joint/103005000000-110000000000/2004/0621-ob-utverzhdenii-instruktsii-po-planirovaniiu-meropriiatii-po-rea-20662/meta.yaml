    kaz: '"Ақпараттандыру саласындағы бюджеттік бағдарламаларды іске асыру жөніндегі іс-шараларын жоспарлау жөніндегі Нұсқаулықты бекіту туралы" Қазақстан Республикасы Экономика және бюджеттік жоспарлау министрінің 2004 жылғы 22 маусымдағы № 94, Қазақстан Республикасы Ақпараттандыру және байланыс агенттігі төрағасының 2004 жылғы 17 мамырдағы № 101-б біріккен бұйрығына толықтырулар мен өзгерістер енгізу туралы'
