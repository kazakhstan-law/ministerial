requisite: Совместный приказ Министра энергетики, индустрии и торговли Республики Казахстан от 9 июля 1999 года № 187 и Министра природных ресурсов и охраны окружающей среды Республики Казахстан от 9 июля 1999 года № 182-II. Зарегистрирован в Министерстве юстиции Республики Казахстан от 22 июля 1999 года N 847. Утратил силу совместным приказом И.о. Министра нефти и газа Республики Казахстан от 11 января 2011 года № 5 и Министра охраны окружающей среды Республики Казахстан от 19 января 2011 года № 14-ө
title:
  rus: Об утверждении Инструкции по соблюдению норм экологической безопасности при проектировании и проведении нефтяных операций в акватории и прибрежных зонах морей и внутренних водоемов Республики Казахстан
  kaz: Акватория мен Қазақстан Республикасының теңіз жағалауы аймақтарында және ішкі су қоймаларында мұнай операцияларын жобалау мен өткізу кезіндегі экологиялық қауіпсіздік нормаларын сақтау жөніндегі нұсқаулықты бекіту туралы
