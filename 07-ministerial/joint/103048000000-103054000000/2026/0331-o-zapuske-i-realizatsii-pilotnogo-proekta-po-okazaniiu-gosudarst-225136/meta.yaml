requisite: Совместный приказ Министра просвещения Республики Казахстан от 31 марта 2026 года № 73-НҚ и Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 1 апреля 2026 года № 168/НҚ
title:
  rus: «О запуске и реализации пилотного проекта по оказанию государственной услуги «Прием документов и зачисление в организации образования независимо от ведомственной подчиненности для обучения по общеобразовательным программам начального, основного среднего, общего среднего образования»
  kaz: «Бастауыш, негізгі орта, жалпы орта білім берудің жалпы білім беретін бағдарламалары бойынша оқыту үшін ведомстволық бағыныстылығына қарамастан білім беру ұйымдарына құжаттарды қабылдау және оқуға қабылдау» мемлекеттік қызметін көрсету жөніндегі пилоттық жобаны іске қосу және жүзеге асыру туралы»
