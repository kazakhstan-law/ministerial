title:
  rus: Об утверждении Правил подтверждения соответствия требованиям технических регламентов, соблюдения запретов и ограничений в отношении условно выпущенных товаров в части технического регулирования
  kaz: Техникалық регламенттердің талаптарына сәйкестікті растау, шартты түрде шығарылған тауарларға қатысты техникалық реттеу бөлігінде тыйым салулар мен шектеулерді сақтау қағидаларын бекіту туралы
