  requisite: Совместный приказ и.о. Министра финансов Республики Казахстан от 23 ноября 2022 года № 1185, Министра здравоохранения Республики Казахстан от 21 ноября 2022 года № ҚР ДСМ-135 и Заместителя Премьер-Министра - Министра торговли и интеграции Республики Казахстан от 22 ноября 2022 года № 445-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 декабря 2022 года № 30956
  title:
    rus: О внесении изменений в совместный приказ Министра по инвестициям и развитию Республики Казахстан от 28 апреля 2018 года № 287, Министра здравоохранения Республики Казахстан от 16 мая 2018 года № 266 и Министра финансов Республики Казахстан от 2 мая 2018 года № 500 «Об утверждении правил подтверждения соответствия требованиям технических регламентов, соблюдения запретов и ограничений в отношении условно выпущенных товаров в части технического регулирования»
    kaz: «Техникалық регламенттердің талаптарына сәйкестікті растау, шартты түрде шығарылған тауарларға қатысты техникалық реттеу бөлігінде тыйым салулар мен шектеулерді сақтау қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 28 сәуірдегі № 287, Қазақстан Республикасы Денсаулық сақтау министрінің 2018 жылғы 16 мамырдағы № 266 және Қазақстан Республикасы Қаржы министрінің 2018 жылғы 2 мамырдағы № 500 бірлескен бұйрығына өзгерістер енгізу туралы
