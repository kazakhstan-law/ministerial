act_code: '100922'
requisite: Совместный приказ Министра культуры и спорта Республики Казахстан от 28 января 2016 года № 20 и Министра национальной экономики Республики Казахстан от 9 февраля 2016 года № 65. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 апреля 2016 года № 13565. Утратил силу совместным приказом и.о. Министра науки и высшего образования Республики Казахстан от 23 ноября 2022 года № 151 и Министра национальной экономики Республики Казахстан от 24 ноября 2022 года № 86 (вводится в действие с 1 января 2023 года)
title:
