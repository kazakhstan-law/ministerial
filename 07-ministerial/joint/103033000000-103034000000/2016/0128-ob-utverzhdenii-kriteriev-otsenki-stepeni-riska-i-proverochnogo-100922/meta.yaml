  title:
    rus: О признании утратившими силу совместных приказов Министра культуры и спорта Республики Казахстан от 28 января 2016 года № 20 и Министра национальной экономики Республики Казахстан от 9 февраля 2016 года № 65 «Об утверждении критериев оценки степени риска и проверочного листа в области применения законодательства Республики Казахстан о языках» и Министра культуры и спорта Республики Казахстан от 1 ноября 2018 года № 314 и Министра национальной экономики Республики Казахстан от 1 ноября 2018 года № 53 «О внесении изменений в совместный приказ Министра культуры и спорта Республики Казахстан от 28 января 2016 года № 20 и Министра национальной экономики Республики Казахстан от 9 февраля 2016 года № 65 «Об утверждении критериев оценки степени риска и проверочного листа в области применения законодательства Республики Казахстан о языках»
    kaz: «Қазақстан Республикасының тіл туралы заңнамасын қолдану саласындағы тәуекел дәрежесін бағалау өлшемшарттары және тексеру парағын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2016 жылғы 28 қаңтардағы № 20 және Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 9 ақпандағы № 65 бірлескен бұйрығының және «Қазақстан Республикасының тіл туралы заңнамаларын қолдану саласындағы тәуекел дәрежесін бағалау өлшемшарттары және тексеру парағын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2016 жылғы 28 қаңтардағы № 20 және Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 9 ақпандағы № 65 бірлескен бұйрығына өзгерістер енгізу туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2018 жылғы 1 қарашадағы № 314 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 1 қарашадағы № 53 бірлескен бұйрықтарының күші жойылды деп тану туралы
