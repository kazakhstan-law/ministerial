requisite: Совместный приказ Министра культуры и спорта Республики Казахстан от 29 июня 2016 года № 195 и Министра национальной экономики Республики Казахстан от 18 июля 2016 года № 323. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 августа 2016 года № 14142
title:
  rus: Об утверждении критериев оценки степени риска и проверочного листа за соблюдением законодательства Республики Казахстан о лотереях и лотерейной деятельности в отношении оператора лотереи
  kaz: Лотерея операторына қатысты Қазақстан Республикасының лотерея және лотерея қызметі туралы заңнаманы сақтаудағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы
