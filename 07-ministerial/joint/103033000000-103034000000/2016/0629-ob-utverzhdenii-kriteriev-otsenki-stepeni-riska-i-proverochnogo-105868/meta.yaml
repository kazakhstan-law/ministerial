  title:
    rus: О внесении изменений и дополнения в совместный приказ Министра культуры и спорта Республики Казахстан от 29 июня 2016 года № 195 и Министра национальной экономики Республики Казахстан от 18 июля 2016 года № 323 «Об утверждении критериев оценки степени риска и проверочного листа за соблюдением законодательства Республики Казахстан о лотереях и лотерейной деятельности в отношении оператора лотереи»
    kaz: «Лотерея операторына қатысты Қазақстан Республикасының лотерея және лотерея қызметі туралы заңнаманы сақтаудағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2016 жылғы 29 маусымдағы № 195 және Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 18 шілдедегі № 323 бірлескен бұйрығына өзгерістер мен толықтыру енгізу туралы
