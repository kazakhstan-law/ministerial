  title:
    rus: О внесении изменений в совместный приказ Министра культуры и спорта Республики Казахстан от 9 июня 2017 года № 172 и Министра национальной экономики Республики Казахстан от 14 августа 2017 года № 301 «Об утверждении критериев оценки степени риска и проверочных листов за соблюдением законодательства Республики Казахстан о Национальном архивном фонде и архивах»
    kaz: «Қазақстан Республикасының Ұлттық архив қоры және архивтер туралы заңнамасының сақталуының тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекiту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2017 жылғы 9 маусымдағы № 172 және Қазақстан Республикасы Ұлттық экономика министрінің 2017 жылғы 14 тамыздағы № 301 бірлескен бұйрығына өзгерістер енгізу туралы
