requisite: Совместный приказ Министра культуры и спорта Республики Казахстан от 9 июня 2017 года № 172 и Министра национальной экономики Руспублики Казахстан от 14 августа 2017 года № 301. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 сентября 2017 года № 15644
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов за соблюдением законодательства Республики Казахстан о Национальном архивном фонде и архивах
  kaz: Ұлттық архив қоры және архивтер туралы Қазақстан Республикасы заңнамасының сақталуының тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
