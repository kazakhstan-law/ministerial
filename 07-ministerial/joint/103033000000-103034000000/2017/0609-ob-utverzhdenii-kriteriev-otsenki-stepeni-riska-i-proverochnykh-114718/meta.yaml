  requisite: Совместный приказ Министра культуры и спорта Республики Казахстан от 24 мая 2023 года № 128 и Министра национальной экономики Республики Казахстан от 24 мая 2023 года № 78. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 мая 2023 года № 32598
  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра культуры и спорта Республики Казахстан от 9 июня 2017 года № 172 и Министра национальной экономики Республики Казахстан от 14 августа 2017 года № 301 «Об утверждении критериев оценки степени риска и проверочных листов за соблюдением законодательства Республики Казахстан о Национальном архивном фонде и архивах»
    kaz: «Қазақстан Республикасының Ұлттық архив қоры және архивтер туралы заңнамасының сақталуына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2017 жылғы 9 маусымдағы № 172 және Қазақстан Республикасы Ұлттық экономика министрінің 2017 жылғы 14 тамыздағы № 301 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
