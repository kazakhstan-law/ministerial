  requisite: Совместный приказ Заместителя Премьер-Министра - Министра культуры и информации Республики Казахстан от 18 декабря 2025 года № 663-НҚ и Заместителя Премьер-Министра – Министр национальной экономики  Республики Казахстан от 26 декабря 2025 года № 134. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2025 года № 37734
  title:
    rus: О внесении изменений в совместный приказ Министра культуры и спорта Республики Казахстан от 9 июня 2017 года № 172 и Министра национальной экономики Республики Казахстан от 14 августа 2017 года № 301 «Об утверждении критериев оценки степени риска и проверочных листов за соблюдением законодательства Республики Казахстан о Национальном архивном фонде и архивах, за исключением государственных и местных исполнительных органов»
    kaz: «Мемлекеттік және жергілікті атқарушы органдарды қоспағанда, Қазақстан Республикасының Ұлттық архив қоры және архивтер туралы заңнамасының сақталуының тәуекел дәрежесін бағалау өлшемшарттары» Қазақстан Республикасы Мәдениет және спорт министрінің 2017 жылғы 9 маусымдағы № 172 және Қазақстан Республикасы Ұлттық экономика министрінің 2017 жылғы 14 тамыздағы № 301 бірлескен бұйрығына өзгерістер енгізу туралы
