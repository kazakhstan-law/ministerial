act_code: '84339'
requisite: Совместный приказ Министра обороны Республики Казахстан от 26 сентября 2014 года № 432 и Министра внутренних дел Республики Казахстан от 29 сентября 2014 года № 655. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 октября 2014 года № 9844. Утратил силу совместным приказом Министра обороны Республики Казахстан от 4 августа 2017 года № 415 и Министра внутренних дел Республики Казахстан от 10 августа 2017 года № 545 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил внутреннего распорядка и порядка содержания осужденных на гауптвахте органов военной полиции Вооруженных Сил Республики Казахстан
  kaz: Қазақстан Республикасы Қарулы Күштері әскери полиция органдарының гауптвахтасындағы ішкі тәртіп және онда сотталғандарды ұстау тәртібі қағидаларын бекіту туралы
