act_code: '174920'
requisite: Совместный приказ Министра здравоохранения Республики Казахстан от 2 декабря 2022 года № ҚР ДСМ-152 и Министра национальной экономики Республики Казахстан от 2 декабря 2022 года № 117. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 декабря 2022 года № 30964
title:
  rus: «Об утверждении критериев оценки степени риска и проверочных листов в сфере санитарно-эпидемиологического благополучия населения»
  kaz: «Халықтың санитариялық-эпидемиологиялық саламаттылығы саласында тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы»
