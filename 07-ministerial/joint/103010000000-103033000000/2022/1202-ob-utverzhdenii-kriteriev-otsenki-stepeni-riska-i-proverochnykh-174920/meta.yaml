  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра здравоохранения Республики Казахстан от 2 декабря 2022 года № ҚР ДСМ-152 и Министра национальной экономики Республики Казахстан от 2 декабря 2022 года № 117 «Об утверждении критериев оценки степени риска и проверочных листов в сфере санитарно-эпидемиологического благополучия населения»
    kaz: «Халықтың санитариялық-эпидемиологиялық саламаттылығы саласында тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2022 жылғы 2 желтоқсандағы № ҚР ДСМ-152 және Қазақстан Республикасы Ұлттық экономика министрінің 2022 жылғы 2 желтоқсандағы № 117 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы»
