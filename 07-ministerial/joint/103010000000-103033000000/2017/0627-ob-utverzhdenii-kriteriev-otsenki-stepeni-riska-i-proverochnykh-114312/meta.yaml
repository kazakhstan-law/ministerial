  requisite: Совместный приказ Министра здравоохранения Республики Казахстан от 31 октября 2018 года № ҚР ДСМ-30 и Министра национальной экономики Республики Казахстан от 31 октября 2018 года № 44. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 ноября 2018 года № 17704. Утратил силу cовместным приказом Министра здравоохранения Республики Казахстан от 2 декабря 2022 года № ҚР ДСМ-152 и Министра национальной экономики Республики Казахстан от 2 декабря 2022 года № 117 (вводится в действие с 1 января 2023 года)
  title:
    rus: О внесении изменений в совместный приказ Министра здравоохранения Республики Казахстан от 27 июня 2017 года № 463 и Министра национальной экономики Республики Казахстан от 20 июля 2017 года № 285 «Об утверждении критериев оценки степени риска и проверочных листов в сфере санитарно-эпидемиологического благополучия населения»
    kaz: «Халықтың санитариялық-эпидемиологиялық саламаттылығы саласында тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2017 жылғы 27 маусымдағы № 463 және Қазақстан Республикасы Ұлттық экономика министрінің 2017 жылғы 20 шілдедегі № 285 бірлескен бұйрығына өзгерістер енгізу туралы
