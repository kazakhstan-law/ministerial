act_code: '114312'
requisite: Совместный приказ Министра здравоохранения Республики Казахстан от 27 июня 2017 года № 463 и Министра национальной экономики Республики Казахстан от 20 июля 2017 года № 285. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 августа 2017 года № 15512. Утратил силу cовместным приказом Министра здравоохранения Республики Казахстан от 2 декабря 2022 года № ҚР ДСМ-152 и Министра национальной экономики Республики Казахстан от 2 декабря 2022 года № 117 (вводится в действие с 1 января 2023 года)
title:
