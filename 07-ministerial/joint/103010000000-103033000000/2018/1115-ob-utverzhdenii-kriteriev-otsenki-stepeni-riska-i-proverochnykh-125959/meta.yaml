  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра здравоохранения Республики Казахстан от 15 ноября 2018 года № ҚР ДСМ-32 и Министра национальной экономики Республики Казахстан от 15 ноября 2018 года № 70 «Об утверждении критериев оценки степени риска и проверочных листов в сферах качества оказания медицинских услуг, обращения лекарственных средств и медицинских изделий»
    kaz: «Медициналық қызметтерді көрсету, дәрілік заттар мен медициналық бұйымдар айналысының сапасы салаларындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2018 жылғы 15 қарашадағы № ҚР ДСМ – 32 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 15 қарашадағы № 70 бірлескен бұйрығына  өзгерістер мен толықтырулар енгізу туралы
