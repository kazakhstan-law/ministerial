title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов в сферах оказания медицинских услуг (помощи), обращения лекарственных средств и медицинских изделий
  kaz: Медициналық қызметтер (көмек) көрсету, дәрілік заттар мен медициналық бұйымдар айналысы салаларындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
