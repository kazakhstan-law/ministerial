act_code: '66002'
requisite: Совместный приказ Министерства внутренних дел Республики Казахстан от 7 марта 2012 года № 135 и Министерства иностранных дел Республики Казахстан от 28 апреля 2012 года № 08-1-1-1/154. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 июня 2012 года № 7698. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 9 октября 2015 года № 831 и Министра иностранных дел Республики Казахстан от 17 ноября 2015 года № 11-1-2/513
title:
  rus: Об утверждении Правил регистрации паспортов иммигрантов, их передвижения, а также въезда в отдельные местности (территории), закрытые для посещения иностранцами, транзитного проезда иностранцев и лиц без гражданства по территории Республики Казахстан
  kaz: Көшіп-келушілердің паспорттарын тіркеу, олардың жүріп-тұру, сондай-ақ шетелдіктердің болуы үшін жабық жекелеген жергілікті жерлерге (аумаққа) кіру, шетелдіктер мен азаматтығы жоқ адамдардың Қазақстан Республикасының аумағы бойынша транзитпен жүру қағидаларын бекіту туралы
