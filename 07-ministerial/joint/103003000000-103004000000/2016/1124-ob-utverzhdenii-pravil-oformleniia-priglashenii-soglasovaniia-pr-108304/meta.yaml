act_code: '108304'
requisite: Совместный приказ исполняющего обязанности Министра иностранных дел Республики Казахстан от 24 ноября 2016 года № 11-1-2/555 и Министра внутренних дел Республики Казахстан от 28 ноября 2016 года № 1100. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 декабря 2016 года № 14531
title:
  rus: Об утверждении Правил оформления приглашений, согласования приглашений на въезд иностранцев и лиц без гражданства в Республику Казахстан, выдачи, аннулирования, восстановления виз Республики Казахстан, а также продления и сокращения сроков их действия
  kaz: Шетелдіктер мен азаматтығы жоқ адамдардың Қазақстан Республикасына келуіне шақыруларын ресімдеу, шақыруларын келісу, Қазақстан Республикасының визаларын беру, күшін жою, қалпына келтіру, сондай-ақ олардың қолданылу мерзімдерін ұзарту және қысқарту қағидаларын бекіту туралы
