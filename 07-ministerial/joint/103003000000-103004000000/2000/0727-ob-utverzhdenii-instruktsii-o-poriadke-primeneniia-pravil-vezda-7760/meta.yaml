act_code: '7760'
requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 28 июля 2000 года № 422 и Министра иностранных дел Республики Казахстан от 8 августа 2000 года № 100. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 декабря 2000 года № 1337. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 9 апреля 2004 года № 215, Министра иностранных дел Республики Казахстан от 14 апреля 2004 года № 08-1/93 и Председателя Агентства Республики Казахстан по миграции и демографии от 14 апреля 2004 года № 35-п
title:
  rus: Об утверждении Инструкции о порядке применения Правил въезда и пребывания иностранных граждан в Республике Казахстан, а также их выезда из Республики Казахстан
  kaz: Шетел азаматтарының Қазақстан Республикасына келуінің және болуының, сондай-ақ олардың Қазақстан Республикасынан кетуінің тәртібін қолдану тәртібі туралы Нұсқаулықты бекіту туралы
