  requisite: Совместный приказ Министра сельского хозяйства Республики Казахстан от 19 мая 2011 года № 06-3/268 и Председателя Агентства Республики Казахстан по управлению земельными ресурсами от 31 марта 2011 года № 78-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 июня 2011 года № 7002. Утратил силу приказом Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 11 ноября 2016 года № 474
  title:
    rus: О внесении изменений в cовместный приказ Министра сельского хозяйства Республики Казахстан от 2 марта 2005 года № 165, Председателя Агентства Республики Казахстан по управлению земельными ресурсами от 25 февраля 2005 года № 24-п "Об утверждении Правил организации и проведения конкурсов при предоставлении земельных участков в аренду для ведения сельскохозяйственного производства"
    kaz: «Ауыл шаруашылығы өндірісін жүргізу үшін жер учаскелерін жалға берген кезде конкурстарды ұйымдастыру және өткізудің ережесін бекіту туралы» Қазақстан Республикасының Ауыл шаруашылығы Министрінің 2005 жылғы 2 наурыздағы № 165, Қазақстан Республикасы Жер ресурстарын басқару агенттігі Төрағасының 2005 жылғы 25 ақпандағы № 24-ө бірлескен бұйрығына өзгерістер енгізу туралы
