requisite: Совместный приказ Министра сельского хозяйства Республики Казахстан от 2 марта 2005 года N 165 и Председателя Агентства Республики Казахстан по управлению земельными ресурсами от 25 февраля 2005 года N 24-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 марта 2005 года N 3518. Утратил силу приказом Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 11 ноября 2016 года № 474
title:
  rus: Об утверждении Правил организации и проведения конкурсов при предоставлении земельных участков в аренду для ведения сельскохозяйственного производства
  kaz: Ауыл шаруашылығы өндірісін жүргізу үшін жер учаскелерін жалға берген кезде конкурстарды ұйымдастыру және өткізудің ережесін бекіту туралы
