    kaz: «Жасырын тергеу әрекеттерін жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2014 жылғы 12 желтоқсандағы № 892, Қазақстан Республикасы Қаржы министрінің 2014 жылғы 12 желтоқсандағы № 565, Қазақстан Республикасы Мемлекеттік күзет қызметі бастығының 2014 жылғы 15 желтоқсандағы № 146, Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі төрағасының 2014 жылғы 12 желтоқсандағы № 62, Қазақстан Республикасы Ұлттық қауіпсіздік комитеті төрағасының 2014 жылғы 18 желтоқсандағы № 416 бірлескен бұйрығына өзгеріс енгізу туралы
