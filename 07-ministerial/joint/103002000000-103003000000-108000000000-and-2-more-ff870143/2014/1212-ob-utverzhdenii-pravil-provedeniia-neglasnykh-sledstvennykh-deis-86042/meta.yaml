  title:
    rus: О внесении изменений в совместный приказ Министра финансов Республики Казахстан от 12 декабря 2014 года № 565, Начальника Службы государственной охраны Республики Казахстан от 15 декабря 2014 года № 146, Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 12 декабря 2014 года № 62, Председателя Комитета национальной безопасности Республики Казахстан от 18 декабря 2014 года № 416, Министра внутренних дел Республики Казахстан от 12 декабря 2014 года № 892 «Об утверждении Правил проведения негласных следственных действий»
    kaz: «Жасырын тергеу әрекеттерін жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2014 жылғы 12 желтоқсандағы № 565, Қазақстан Республикасы Мемлекеттік күзет қызметі бастығының 2014 жылғы 15 желтоқсандағы № 146, Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі төрағасының 2014 жылғы 12 желтоқсандағы № 62, Қазақстан Республикасы Ұлттық қауіпсіздік комитеті төрағасының 2014 жылғы 18 желтоқсандағы № 416, Қазақстан Республикасы Ішкі істер министрінің 2014 жылғы 12 желтоқсандағы № 892 бірлескен бұйрығына өзгерістер енгізу туралы
