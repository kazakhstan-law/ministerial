  requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 24 октября 2014 года № 730 и Министра образования и науки Республики Казахстан от 27 октября 2014 года № 444
  title:
    rus: О признании утратившим силу Совместный приказ Министра внутренних дел Республики Казахстан от 25 апреля 2007 года № 167 и Министра образования и науки Республики Казахстан от 26 апреля 2007 года № 213 "О некоторых мерах по реализации постановления Правительства Республики Казахстан от 20 июня 1999 года № 1018 "О государственном образовательном кредитовании подготовки кадров в высших учебных заведениях Республики Казахстан"
    kaz: Қазақстан Республикасының жоғары оқу орындарында кадрлар даярлауды мемлекеттік білімдік несиелендіру туралы" Қазақстан Республикасы Үкіметінің 1999 жылғы 20 шілдедегі № 1018 қаулысын іске асыру жөніндегі кейбір шаралар туралы" Қазақстан Республикасы Ішкі істер министрінің 2007 жылғы 25 сәуірдегі № 167 және Қазақстан Республикасы Білім және ғылым министрінің 2007 жылғы 26 сәуірдегі № 213 бірлескен бұйрығының күші жойылды деп тану туралы
