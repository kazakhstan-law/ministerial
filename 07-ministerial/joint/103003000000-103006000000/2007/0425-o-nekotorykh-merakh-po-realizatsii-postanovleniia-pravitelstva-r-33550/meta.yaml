act_code: '33550'
requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 25 апреля 2007 года № 167 и Министра образования и науки Республики Казахстан от 26 апреля 2007 года № 213. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 мая 2007 года № 4691. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 24 октября 2014 года № 730 и Министра образования и науки Республики Казахстан от 27 октября 2014 года № 444
title:
  rus: О некоторых мерах по реализации постановления Правительства Республики Казахстан от 20 июля 1999 года № 1018 "О государственном образовательном кредитовании подготовки кадров в высших учебных заведениях Республики Казахстан"
  kaz: '"Қазақстан Республикасының жоғары оқу орындарында кадрлар даярлауды мемлекеттік білімдік несиелендіру туралы" Қазақстан Республикасы Үкіметінің 1999 жылғы 20 шілдедегі № 1018 қаулысын іске асыру жөніндегі кейбір шаралар туралы'
