  title:
    rus: О внесении изменений в совместный приказ Министра труда и социальной защиты населения Республики Казахстан от 17 апреля 2026 года № 141 и Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 30 апреля 2026 года № 233/НҚ «О реализации пилотного проекта по обеспечению отдельными техническими вспомогательными (компенсаторными) средствами, специальными средствами передвижения, предоставляемым лицам с инвалидностью на условиях безвозмездного пользования и возврата в Актюбинской, Карагандинской и Павлодарской областях»
    kaz: «Ақтөбе, Қарағанды және Павлодар облыстарында мүгедектігі бар адамдарға өтеусіз пайдалану және қайтару шарттарымен берілетін жеке техникалық көмекші (орнын толтырушы) құралдармен, арнаулы жүріп-тұру құралдарымен қамтамасыз ету бойынша пилоттық жобаны іске асыру туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2026 жылғы 17 сәуірдегі № 141 және Қазақстан Республикасы Премьер-Министрінің орынбасары – Жасанды интеллект және цифрлық даму министрінің 2026 жылғы 30 сәуірдегі № 233/НҚ бірлескен бұйрығына өзгерістер енгізу туралы
