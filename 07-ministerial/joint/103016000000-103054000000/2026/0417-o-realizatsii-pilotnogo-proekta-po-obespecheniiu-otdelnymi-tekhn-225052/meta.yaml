title:
  rus: О реализации пилотного проекта по обеспечению отдельными техническими вспомогательными (компенсаторными) средствами, специальными средствами передвижения, предоставляемым лицам с инвалидностью на условиях безвозмездного пользования и возврата в Актюбинской, Карагандинской и Павлодарской областях
  kaz: Ақтөбе, Қарағанды және Павлодар облыстарында мүгедектігі бар адамдарға өтеусіз пайдалану және қайтару шарттарымен берілетін жеке техникалық көмекші (орнын толтырушы) құралдармен, арнаулы жүріп-тұру құралдарымен қамтамасыз ету бойынша пилоттық жобаны іске асыру туралы
