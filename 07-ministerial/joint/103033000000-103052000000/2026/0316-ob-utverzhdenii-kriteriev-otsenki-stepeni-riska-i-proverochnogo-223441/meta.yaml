title:
  rus: Об утверждении критериев оценки степени риска и проверочного листа в области разрешительного контроля в части осуществления деятельности по сбору (заготовке), хранению, переработке и реализации юридическими лицами лома и отходов цветных и черных металлов
  kaz: Заңды тұлғалардың түсті және қара металдардың сынықтары мен қалдықтарын жинау (дайындау), сақтау, қайта өңдеу және өткізу жөніндегі қызметті жүзеге асыру бөлігінде рұқсат беруді бақылау саласындағы тәуекел дәрежесін бағалау өлшемшарттары мен тексеру парағын бекіту туралы
