title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов в области архитектуры, градостроительства и строительства за деятельностью местных исполнительных органов по делам архитектуры, градостроительства, строительства и государственного архитектурно-строительного контроля и надзора
  kaz: Сәулет, қала құрылысы, құрылыс және мемлекеттік сәулет-құрылыс бақылау және қадағалау істері жөніндегі жергілікті атқарушы органдардың қызметіне сәулет, қала құрылысы және құрылыс саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
