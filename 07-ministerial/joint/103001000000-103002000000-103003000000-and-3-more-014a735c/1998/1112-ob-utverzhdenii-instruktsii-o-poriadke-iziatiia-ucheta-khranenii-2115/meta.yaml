act_code: '2115'
requisite: Совместный приказ Министра юстиции Республики Казахстан от 12 ноября 1998 года № 121, Генерального прокурора Республики Казахстан от 1 декабря 1998 года № 1043ца, Председателя Комитета национальной безопасности Республики Казахстан от 8 декабря 1998 года № 73, Министра финансов Республики Казахстан от 22 декабря 1998 года № 598, Министра внутренних дел Республики Казахстан от 2 декабря 1998 года № 429, Министра государственных доходов Республики Казахстан от 28 декабря 1998 года № 111. Зарегистрирован Министерством юстиции Республики Казахстан 30 декабря 1998 года № 658
title:
  rus: Об утверждении Инструкции "О порядке изъятия, учета, хранения, передачи и уничтожения вещественных доказательств, документов по уголовным делам, гражданским делам и делам об административных правонарушениях судом, органами прокуратуры, предварительного следствия, дознания и судебной экспертизы"
  kaz: Соттардың, прокуратура, алдын-ала тергеу, анықтау сот сараптамасы органдарының қылмыстық, азаматтық iстер жөнiндегi және әкiмшiлiк құқық бұзушылық iстерi туралы құжаттарды, заттай дәлелдемелердi алу, есепке алу, сақтау, беру және жою тәртiбi туралы Нұсқаулық
