  title:
    rus: О внесении дополнений в совместный приказ Министра юстиции Республики Казахстан от 12 ноября 1998 года N 121, Генерального прокурора Республики Казахстан от 1 декабря 1998 года N 1043 ца, Председателя Комитета национальной безопасности Республики Казахстан от 8 декабря 1998 года N 73, Министра финансов Республики Казахстан от 22 декабря 1998 года N 598, Министра внутренних дел Республики Казахстан от 2 декабря 1998 года N 429, Министра государственных доходов Республики Казахстан от 28 декабря 1998 года N 111 "Об утверждении Инструкции "О порядке изъятия, учета, хранения, передачи и уничтожения вещественных доказательств, документов по уголовным делам, гражданским делам и делам об административных правонарушениях судом, органами прокуратуры, предварительного следствия, дознания и судебной экспертизы"
    kaz: '"Соттардың, прокуратура, алдын ала тергеу, анықтау сот сараптамасы органдарының заттай дәлелдемелерді, қылмыстық істер, азаматтық істер және әкімшілік құқық бұзушылық істері туралы құжаттарды, заттай дәлелдемелерді алу, есепке алу, сақтау, беру және жою тәртібі туралы" Нұсқаулықты бекіту туралы" Қазақстан Республикасы Әділет министрінің 1998 жыл 12 қарашадағы N 121, Қазақстан Республикасы Бас прокурорының 1998 жыл 1 желтоқсандағы N 1043 ца, Қазақстан Республикасы Ұлттық қауіпсіздік комитеті төрағасының 1998 жыл 8 желтоқсандағы N 73, Қазақстан Республикасы Қаржы министрінің 1998 жыл 22 желтоқсандағы N 598, Қазақстан Республикасы Ішкі істер министрінің 1998 жыл 2 желтоқсандағы N 429, Қазақстан Республикасы мемлекеттік кіріс министрінің 1998 жыл 28 желтоқсандағы N 111 бірлескен бұйрығына толықтырулар енгізу туралы'
