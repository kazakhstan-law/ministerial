  title:
    rus: О внесении дополнения в совместный приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 18 апреля 2008 года № 133-ОД и Министра сельского хозяйства Республики Казахстан от 25 апреля 2008 года № 263 «Об утверждении перечня видов деятельности, технологически связанных с  регулируемыми услугами (товарами, работами) водохозяйственной и (или) канализационной систем
    kaz: Су шаруашылық және (немесе) кәріз жүйелерінің реттеліп көрсетілетін қызметтерімен (тауарларымен, жұмыстарымен) технологиялық байланысты қызмет түрлерінің тізбесін бекіту туралы» Қазақстан Республикасы Табиғи монополиялық реттеу агенттігі Төрағасының 2008 жылғы 18 сәуірдегі № 133-НҚ және Қазақстан Республикасы Ауыл шаруашылығы Министрінің 2008 жылғы 25 сәуірдегі № 263 бірлескен бұйрығына толықтыру енгізу туралы
