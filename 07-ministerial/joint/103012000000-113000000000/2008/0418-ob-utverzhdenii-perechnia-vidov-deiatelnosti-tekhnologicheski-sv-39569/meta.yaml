act_code: '39569'
requisite: Совместный приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 18 апреля 2008 года № 133-ОД и Министра сельского хозяйства Республики Казахстан от 25 апреля 2008 года № 263. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 мая 2008 года № 5216. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 1 июля 2020 года № 51 и Министра экологии, геологии и природных ресурсов Республики Казахстан от 27 апреля 2021 года № 121 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня видов деятельности, технологически связанных с регулируемыми услугами (товарами, работами) водохозяйственной и (или) канализационной систем
  kaz: Су шаруашылығы және (немесе) кәріз жүйелерінің реттеліп көрсетілетін қызметтерімен (тауарларымен, жұмыстарымен) технологиялық байланысты қызмет түрлерінің тізбесін бекіту туралы
