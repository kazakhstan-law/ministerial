requisite: Совместный приказ Министра транспорта и коммуникаций Республики Казахстан от 12 декабря 2006 года № 331, Министра внутренних дел Республики Казахстан от 5 февраля 2007 года № 42, Министра труда и социальной защиты населения Республики Казахстан от 14 декабря 2006 года № 290-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 марта 2007 года № 4555. Утратил силу приказом Министра транспорта и коммуникаций Республики Казахстан от 26 июля 2013 года № 571
title:
  rus: Об утверждении условий, на которых иностранцы и лица без гражданства могут входить в состав экипажа судна, плавающего под Государственным флагом Республики Казахстан
