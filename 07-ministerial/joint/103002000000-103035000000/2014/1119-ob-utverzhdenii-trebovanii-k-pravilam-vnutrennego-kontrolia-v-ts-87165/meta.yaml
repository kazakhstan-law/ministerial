  title:
    rus: О внесении изменения в совместный приказ Министра финансов Республики Казахстан от 19 ноября 2014 года № 499 и Министра по инвестициям и развитию Республики Казахстан от 25 ноября 2014 года № 182 «Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для операторов почты, оказывающих услуги по переводу денег»
    kaz: «Ақша аударымы қызметін көрсететін пошта операторларына арналған қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2014 жылғы 19 қарашадағы № 499 және Қазақстан Республикасы Инвестициялар және даму министрінің 2014 жылғы 25 қарашадағы № 182 бірлескен бұйрығына өзгеріс енгізу туралы»
