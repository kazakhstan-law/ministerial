act_code: '87165'
requisite: Совместный приказ Министра финансов Республики Казахстан от 19 ноября 2014 года № 499 и Министра по инвестициям и развитию Республики Казахстан от 25 ноября 2014 года № 182. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 декабря 2014 года № 9965. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 28 февраля 2022 года № 19 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 28 февраля 2022 года № 69/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для операторов почты, оказывающих услуги по переводу денег
  kaz: Ақша аударымы қызметін көрсететін почта операторларына арналған қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы
