  requisite: Совместный приказ Министра финансов Республики Казахстан от 28 декабря 2015 года № 703 и и.о. Министра по инвестициям и развитию Республики Казахстан от 31 декабря 2015 года № 1302. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 февраля 2016 года № 13040. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 28 февраля 2022 года № 19 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 28 февраля 2022 года № 69/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в совместный приказ Министра финансов Республики Казахстан от 19 ноября 2014 года № 499 и Министра по инвестициям и развитию Республики Казахстан от 25 ноября 2014 года № 182 "Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для операторов почты, оказывающих услуги по переводу денег"
    kaz: '"Ақша аударымы қызметін көрсететін почта операторларына арналған қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау ережелеріне қойылатын талаптарды бекіту туралы" Қазақстан Республикасы Қаржы Министрінің 2014 жылғы 19 қарашадағы № 499 және Қазақстан Республикасы Инвестициялар және даму Министрінің 2014 жылғы 25 қарашадағы № 182 бірлескен бұйрығына өзгерістер енгізу туралы'
