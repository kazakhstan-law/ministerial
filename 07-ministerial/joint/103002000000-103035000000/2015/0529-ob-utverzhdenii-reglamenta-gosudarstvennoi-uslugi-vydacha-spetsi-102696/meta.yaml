act_code: '102696'
requisite: Совместный приказ Министра по инвестициям и развитию Республики Казахстан от 29 мая 2015 года № 672 и Министра финансов Республики Казахстан от 31 декабря 2015 года № 739. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 февраля 2016 года № 13029. Утратил силу совместным приказом и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 7 октября 2020 года № 518 и Министра финансов Республики Казахстан от 12 октября 2020 года № 992 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача специального разрешения на проезд тяжеловесных и (или) крупногабаритных транспортных средств (включая иностранные) по территории Республики Казахстан»
  kaz: «Қазақстан Республикасының аумағы арқылы ауыр салмақты және (немесе) ірі көлемді көлік құралдарының (шетелдік көліктерді қоса алғанда) жүріп өтуі үшін арнайы рұқсат беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
