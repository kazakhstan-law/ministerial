caused_by:
  code: '102812'
  requisite: Совместный приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 25 февраля 2016 года № 230 и Министра финансов Республики Казахстан от 4 марта 2016 года № 103. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 апреля 2016 года № 13585. Утратил силу совместным приказом и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 7 октября 2020 года № 518 и Министра финансов Республики Казахстан от 12 октября 2020 года № 992 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в совместный приказ Министра по инвестициям и развитию Республики Казахстан от 29 мая 2015 года № 672 и Министра финансов Республики Казахстан от 31 декабря 2015 года № 739 "Об утверждении регламента государственной услуги "Выдача специального разрешения на проезд тяжеловесных и (или) крупногабаритных транспортных средств (включая иностранные) по территории Республики Казахстан"
    kaz: '"Қазақстан Республикасының аумағы арқылы ауыр салмақты және (немесе) iрi көлемді көлік құралдарының (шетелдiктердi қоса алғанда) жүріп өтуі үшін арнайы рұқсат беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" Қазақстан Республикасы Инвестициялар және даму Министрінің 2015 жылғы 29 мамырдағы № 672 және Қазақстан Республикасы Қаржы Министрінің 2015 жылғы 31 желтоқсандағы № 739 бірлескен бұйрығына өзгерістер енгізу туралы'
