act_code: '120395'
requisite: Совместный приказ Министра финансов Республики Казахстан от 15 марта 2018 года № 372 и Министра по инвестициям и развитию Республики Казахстан от 26 марта 2018 года № 195. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 марта 2018 года № 16699
title:
  rus: Об утверждении Правил взаимодействия органов государственных доходов с национальной железнодорожной компанией, национальным перевозчиком в сфере железнодорожного транспорта, международными аэропортами, морскими и речными портами Республики Казахстан
  kaz: Мемлекеттік кірістер органдары Қазақстан Республикасының ұлттық теміржол компаниясымен, теміржол көлігі саласындағы ұлттық тасымалдаушысымен, халықаралық әуежайларымен, теңіз және өзен порттарымен өзара іс-қимыл жасасу қағидаларын бекіту туралы
