caused_by:
  code: '158129'
  requisite: Совместный приказ Министра финансов Республики Казахстан от 17 августа 2021 года № 824 и и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 20 августа 2021 года № 459. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 августа 2021 года № 24085
  title:
    rus: О внесении изменений в совместный приказ Министра финансов Республики Казахстан от 15 марта 2018 года № 372 и Министра по инвестициям и развитию Республики Казахстан от 26 марта 2018 года № 195 «Об утверждении Правил взаимодействия органов государственных доходов с национальной железнодорожной компанией, национальным перевозчиком в сфере железнодорожного транспорта, международными аэропортами, морскими и речными портами Республики Казахстан»
    kaz: «Мемлекеттік кірістер органдары Қазақстан Республикасының ұлттық теміржол компаниясымен, теміржол көлігі саласындағы ұлттық тасымалдаушысымен, халықаралық әуежайларымен, теңіз және өзен порттарымен өзара іс-қимыл жасасу қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 15 наурыздағы № 372 және Қазақстан Республикасы Ивестициялар және даму министрінің 2018 жылғы 26 наурыздағы № 195 бірлескен бұйрығына өзгерістер енгізу туралы
