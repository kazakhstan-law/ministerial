title:
  rus: Об утверждении Правил осуществления должностными лицами органов государственных доходов транспортного контроля в автомобильных пунктах пропуска через таможенную границу Евразийского экономического союза
  kaz: Еуразиялық экономикалық одақтың кедендік шекарасы арқылы автомобиль өткізу пункттерінде мемлекеттік кірістер органдары лауазымды адамдарының көліктік бақылауды жүзеге асыру қағидаларын бекіту туралы
