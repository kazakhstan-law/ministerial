  title:
    rus: О внесении изменений в совместный приказ Министра финансов Республики Казахстан от 26 января 2018 года № 74 и Министра по инвестициям и развитию Республики Казахстан от 19 февраля 2018 года № 113 «Об утверждении Правил информационного взаимодействия уполномоченного органа в области технического регулирования и уполномоченного органа по обмену сведениями о документах, подтверждающих соответствие ввозимых товаров требованиям, установленным техническими регламентами Евразийского экономического союза, а также законодательством Республики Казахстан в области технического регулирования, а также сведениями из таких документов, для целей подтверждения соблюдения мер технического регулирования»
    kaz: «Техникалық реттеу шараларының сақталуын растау мақсаттары үшін техникалық реттеу саласындағы уәкілетті орган мен уәкілетті органның әкелінетін тауарлардың Еуразиялық экономикалық одақтың техникалық регламенттерінде, сондай-ақ Қазақстан Республикасының техникалық реттеу саласындағы заңнамасында белгіленген талаптарға сәйкестігін растайтын құжаттар туралы мәліметтерді, сондай-ақ осындай құжаттардан алынған мәліметтерді алмасу жөніндегі ақпараттық өзара іс-қимыл қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 26 қаңтардағы № 74 және Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 19 ақпандағы № 113 бірлескен бұйрығына өзгерістер енгізу туралы
