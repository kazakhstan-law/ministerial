act_code: '111009'
requisite: Совместный приказ Министра юстиции Республики Казахстан от 6 марта 2017 года № 242 и Министра национальной экономики Республики Казахстан от 24 марта 2017 года № 126. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 апреля 2017 года № 14970. Утратил силу совместным приказом Министра юстиции Республики Казахстан от 23 ноября 2022 года № 957 и Министра национальной экономики Республики Казахстан от 25 ноября 2022 года № 90 (вводится в действие с 1 января 2023 года)
title:
  rus: Об утверждении критериев оценки степени риска и проверочного листа в сфере регистрации актов гражданского состояния
