  title:
    rus: О внесении изменений в совместный приказ Министра юстиции Республики Казахстан от 6 марта 2017 года № 242 и Министра национальной экономики Республики Казахстан от 24 марта 2017 года № 126 «Об утверждении критериев оценки степени риска и проверочного листа в сфере регистрации актов гражданского состояния»
    kaz: «Азаматтық хал актілерін тіркеу саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2017 жылғы 6 наурыздағы № 242 және Қазақстан Республикасы Ұлттық экономика министрінің 2017 жылғы 24 наурыздағы № 126 бірлескен бұйрығына өзгерістер енгізу туралы
