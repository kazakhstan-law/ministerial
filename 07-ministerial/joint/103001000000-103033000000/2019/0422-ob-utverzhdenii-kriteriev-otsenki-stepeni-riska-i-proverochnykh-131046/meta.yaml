  title:
    rus: О внесении изменений в совместный приказ Министра юстиции Республики Казахстан от 22 апреля 2019 года № 218 и Министра национальной экономики Республики Казахстан от 29 апреля 2019 года № 31 «Об утверждении критериев оценки степени риска и проверочных листов деятельности организаций, управляющих имущественными правами на коллективной основе»
    kaz: «Мүліктік құқықтарды ұжымдық негізде басқаратын ұйымдар қызметінің тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2019 жылғы 22 сәуірдегі № 218 және Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 29 сәуірдегі № 31 бірлескен бұйрығына өзгерістер енгізу туралы»
