  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра юстиции Республики Казахстан от 27 декабря 2019 года № 627 и Министра национальной экономики Республики Казахстан от 30 декабря 2019 года № 99 «Об утверждении критериев оценки степени риска и проверочного листа в сфере деятельности палат юридических консультантов»
    kaz: «Заң консультанттары палаталарының қызметі саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағының нысанын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2019 жылғы 27 желтоқсандағы № 627 және Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 30 желтоқсандағы № 99 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
