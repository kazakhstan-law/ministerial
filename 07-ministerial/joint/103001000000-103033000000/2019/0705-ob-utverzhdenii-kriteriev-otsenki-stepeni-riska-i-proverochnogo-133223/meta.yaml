  title:
    rus: О внесении изменений в совместный приказ Министра юстиции Республики Казахстан от 5 июля 2019 года № 350 и Министра национальной экономики Республики Казахстан от 9 июля 2019 года № 61 «Об утверждении критериев оценки степени риска и проверочного листа в сфере регистрации юридических лиц, филиалов и представительств, являющихся коммерческими организациями»
    kaz: «Коммерциялық ұйымдар болып табылатын заңды тұлғаларды, филиалдар мен өкілдіктерді тіркеу саласында тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2019 жылғы 5 шілдедегі № 350 және Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 9 шілдедегі № 61 бірлескен бұйрығына өзгерістер енгізу туралы
