title:
  rus: Об утверждении проверочных листов за использованием объектов авторского права и смежных прав, товарного знака, знака обслуживания, наименования места происхождения товара или фирменного наименования
  kaz: Авторлық құқық және сабақтас құқықтар объектілерін, тауар белгісінің, қызмет көрсету белгісінің, тауар шығарылған жер атауының немесе фирмалық атаудың пайдаланылуын тексеру парақтарын бекіту туралы
