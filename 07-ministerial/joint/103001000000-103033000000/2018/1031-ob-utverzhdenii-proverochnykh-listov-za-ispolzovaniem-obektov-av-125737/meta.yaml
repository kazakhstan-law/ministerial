  title:
    rus: «О внесении изменения в совместный приказ Министра юстиции Республики Казахстан от 31 октября 2018 года № 1517 и Министра национальной экономики Республики Казахстан от 31 октября 2018 года № 48 «Об утверждении проверочного листа за использованием товарного знака, знака обслуживания, наименования места происхождения товара или фирменного наименования»
    kaz: «Тауар белгісін, қызмет көрсету белгісін, тауар шығарылған жердің атауын немесе фирмалық атауды пайдалануды тексеру парағын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2018 жылғы 31 қазандағы № 1517 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 31 қазандағы № 48 бірлескен бұйрығына өзгеріс енгізу туралы»
