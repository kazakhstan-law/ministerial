  requisite: Совместный приказ Министра юстиции Республики Казахстан от 7 апреля 2021 года № 273 и Министра национальной экономики Республики Казахстан от 7 апреля 2021 года № 38. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 апреля 2021 года № 22521
  title:
    rus: О внесении изменений в совместный приказ Министра юстиции Республики Казахстан от 1 ноября 2018 года № 1520 и Министра национальной экономики Республики Казахстан от 2 ноября 2018 года № 55  «Об утверждении критериев оценки степени риска и проверочного листа в сфере регистрации прав на недвижимое имущество»
    kaz: «Жылжымайтын мүлікке құқықтарды тіркеу саласында тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2018 жылғы 1 қарашадағы № 1520 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 2 қарашадағы № 55 бірлескен бұйрығына өзгерістер енгізу туралы
