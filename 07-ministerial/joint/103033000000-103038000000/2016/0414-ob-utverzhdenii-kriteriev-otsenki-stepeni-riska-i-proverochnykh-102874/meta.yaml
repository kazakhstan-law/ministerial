act_code: '102874'
requisite: Совместный приказ Министра по делам государственной службы Республики Казахстан от 14 апреля 2016 года № 76 и Министра национальной экономики Республики Казахстан от 26 апреля 2016 года № 186. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 мая 2016 года № 13744. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 31 октября 2018 года № 252 и Министра национальной экономики Республики Казахстан от 31 октября 2018 года № 45 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов за соблюдением законодательства в сфере государственной службы государственными органами и за соблюдением служебной этики государственными служащими
  kaz: Мемлекеттік органдармен мемлекеттік қызмет саласындағы заңнаманы сақтаудағы және мемлекеттік қызметшілермен қызметтік әдепті сақтаудағы тәуекел дәрежесін бағалау мен тексеру парақтарының критерийлерін бекіту туралы
