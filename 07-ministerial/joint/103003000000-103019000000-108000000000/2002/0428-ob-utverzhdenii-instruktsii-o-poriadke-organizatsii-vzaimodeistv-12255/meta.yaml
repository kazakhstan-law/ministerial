  requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 7 января 2006 года № 11, Министра финансов Республики Казахстан от 2 декабря 2005 года № 406, Председателя Комитета национальной безопасности Республики Казахстан от 28 декабря 2005 года № 213. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 января 2006 года № 4056. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 13 января 2015 года № 19, Министра финансов Республики Казахстан от 4 февраля 2015 года № 66 и Председателя Комитета национальной безопасности Республики Казахстан от 25 апреля 2015 года № 29
  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 23 апреля 2002 года № 65, Министра внутренних дел Республики Казахстан от 29 апреля 2002 года № 293, Министра государственных доходов Республики Казахстан от 10 апреля 2002 года № 420 "Об утверждении Инструкции о порядке организации взаимодействия органов внутренних дел, Пограничной службы Комитета национальной безопасности и Таможенного комитета Министерства государственных доходов Республики Казахстан по пресечению незаконной миграции иностранных граждан в пунктах пропуска через государственную границу Республики Казахстан"
    kaz: '"Ішкі істер органдарының, Қазақстан Республикасының Ұлттық қауіпсіздік комитеті Шекара қызметінің және Қазақстан Республикасының Мемлекеттік кіріс министрлігі Кеден комитетінің Қазақстан Республикасының шекара арқылы өткізу бекеттеріндегі шетел азаматтарының заңсыз қоныс аударуының жолын кесу жөніндегі өзара іс-қимылын ұйымдастырудың тәртібі жөніндегі Нұсқаулықты бекіту туралы" Қазақстан Республикасы Ұлттық қауіпсіздік комитеті төрағасының 2002 жылғы 23 сәуірдегі № 65, Қазақстан Республикасы Ішкі істер министрінің 2002 жылғы 29 сәуірдегі № 293, Қазақстан Республикасы Мемлекеттік кіріс министрінің 2002 жылғы 10 сәуірдегі № 420 бұйрығына өзгерістер енгізу туралы'
