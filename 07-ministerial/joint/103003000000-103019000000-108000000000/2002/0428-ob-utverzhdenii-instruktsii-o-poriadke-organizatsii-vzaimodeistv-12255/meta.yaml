act_code: '12255'
requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 29 апреля 2002 г. N 293, Председателя Комитета национальной безопасности Республики Казахстан от 23 апреля 2002 г. N 65, Министра государственных доходов Республики Казахстан от 10 апреля 2002 г. N 420. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 мая 2002 года N 1862. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 13 января 2015 года № 19, Министра финансов Республики Казахстан от 4 февраля 2015 года № 66 и Председателя Комитета национальной безопасности Республики Казахстан от 25 апреля 2015 года № 29
title:
  rus: Об утверждении Инструкции о порядке организации взаимодействия органов внутренних дел, Пограничной службы Комитета национальной безопасности и Таможенного комитета Министерства государственных доходов Республики Казахстан по пресечению незаконной миграции иностранных граждан в пунктах пропуска через государственную границу Республики Казахстан
  kaz: '"Ішкі істер органдарының, Қазақстан Республикасының Ұлттық қауіпсіздік комитеті Шекара қызметінің және Мемлекеттік кіріс министрлігі Кеден комитетінің Қазақстан Республикасының шекара арқылы өткізу бекеттеріндегі шетел азаматтарының заңсыз қоныс аударуының жолын кесу жөніндегі өзара іс-қимылын ұйымдастырудың тәртібі жөніндегі Нұсқаулықты бекіту туралы"'
