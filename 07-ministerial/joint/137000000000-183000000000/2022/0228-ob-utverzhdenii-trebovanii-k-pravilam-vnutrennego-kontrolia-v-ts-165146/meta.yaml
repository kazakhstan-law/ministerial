  requisite: Совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 1 апреля 2025 года № 6 и и.о. Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 2 апреля 2025 года № 5. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 апреля 2025 года № 35945. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 апреля 2026 года № 4, Министра юстиции Республики Казахстан от 30 апреля 2026 года № 408, Заместителя Премьер-Министра – Министр искусственного интеллекта и цифрового развития Республики Казахстан от 22 апреля 2026 года № 216/НҚ, Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 8 апреля 2026 года № 1 и Министра туризма и спорта Республики Казахстан от 14 апреля 2026 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: «О внесении изменений и дополнений в совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 28 февраля 2022 года № 16 и Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 28 февраля 2022 года № 2 «Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для товарной биржи»
    kaz: «Тауар биржасы үшін қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Қаржылық мониторинг агенттігі Төрағасының 2022 жылғы 28 ақпандағы № 16 және Қазақстан Республикасының Бәсекелестікті қорғау және дамыту агенттігі Төрағасының 2022 жылғы 28 ақпандағы № 2 бірлескен бұйрығына өзгертулер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/208918/rus
