act_code: '165146'
requisite: Совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 28 февраля 2022 года № 16 и Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 28 февраля 2022 года № 2. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 марта 2022 года № 26983. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 апреля 2026 года № 4, Министра юстиции Республики Казахстан от 30 апреля 2026 года № 408, Заместителя Премьер-Министра – Министр искусственного интеллекта и цифрового развития Республики Казахстан от 22 апреля 2026 года № 216/НҚ, Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 8 апреля 2026 года № 1 и Министра туризма и спорта Республики Казахстан от 14 апреля 2026 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для деятельности товарных бирж
  kaz: Тауар биржалары, өз қызметін тауар биржасында жүзеге асыратын және биржалық тауарлармен мәмілелер жасайтын биржалық брокерлер, сондай-ақ тауар биржаларының клирингтік орталықтары үшін қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы
