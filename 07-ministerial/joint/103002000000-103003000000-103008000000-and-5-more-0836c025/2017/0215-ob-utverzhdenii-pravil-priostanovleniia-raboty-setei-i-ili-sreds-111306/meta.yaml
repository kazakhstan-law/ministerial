  requisite: Совместный приказ Председателя Комитета национальной безопасности Республики Казахстан от 20 декабря 2023 года № 98/дсп, Председателя Агентства Республики Казахстан по финансовому мониторингу от 26 декабря 2023 года № 470-нқ-қбпү, Начальника Службы государственной охраны Республики Казахстан от 12 января 2024 года № 11-13 дсп, Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 17 января 2024 года № 3 дсп, Министра внутренних дел Республики Казахстан от 24 января 2024 года № 19 дсп, Министра культуры и информации Республики Казахстан от 7 февраля 2024 года № 6-қбпү, Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 16 февраля 2024 года № 4/нқ-қбпү и Министра обороны Республики Казахстан от 29 февраля 2024 года № 206 дсп. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 марта 2024 года № 34157
  title:
    rus: О внесении изменений в совместный приказ Министра информации и коммуникаций Республики Казахстан от 2 марта 2017 года № 82дсп, Министра финансов Республики Казахстан от 15 марта 2017 года № 168дсп, Министра обороны Республики Казахстан от 9 марта 2017 года № 49/44дсп, Начальника Службы государственной охраны Республики Казахстан от 10 марта 2017 года № 11-58дсп, Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 3 марта 2017 года № 3дсп, Директора Службы внешней разведки Республики Казахстан «Сырбар» от 22 февраля 2017 года № 4дсп, Председателя Комитета национальной безопасности Республики Казахстан от 15 февраля 2017 года № 5/дсп, Министра внутренних дел Республики Казахстан от 28 февраля 2017 года № 41 «Об утверждении Правил приостановления работы сетей и (или) средств связи, оказания услуг связи, доступа к интернет-ресурсам и (или) размещенной на них информации»
    kaz: «Байланыс желілерінің және (немесе) құралдарының жұмысын, байланыс қызметтерінің көрсетілуін, интернет-ресурстарға және (немесе) оларда орналастырылған ақпаратқа қолжетімділікті тоқтата тұру қағидаларын бекіту туралы» Қазақстан Республикасы Ақпарат және коммуникациялар министрінің 2017 жылғы 2 наурыздағы № 82қбп, Қазақстан Республикасы Қаржы министрінің 2017 жылғы 15 наурыздағы № 168қбп, Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 9 наурыздағы № 49/44қбп, Қазақстан Республикасы Мемлекеттік күзет қызметі бастығының 2017 жылғы 10 наурыздағы № 11-58қбп, Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы  іс-қимыл агенттігі төрағасының 2017 жылғы 3 наурыздағы № 3қбп, Қазақстан Республикасы «Сырбар» Сыртқы барлау қызметі директорының 2017 жылғы 22 ақпандағы № 4қбп, Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2017 жылғы 15 ақпандағы № 5/қбп, Қазақстан Республикасы Ішкі істер министрінің 2017 жылғы 28 ақпандағы № 41 бірлескен бұйрығына өзгерістер енгізу туралы
