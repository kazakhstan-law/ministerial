  title:
    rus: О признании утратившими силу совместного приказа Министра здравоохранения Республики Казахстан от 10 февраля 2009 года № 79, Министра образования и науки Республики Казахстан от 28 января 2009 года № 28, Министра труда и социальной зашиты населения Республики Казахстан от 28 января года № 28-п "Об утверждении Правил оценки и определения потребности в специальных социальных услугах" и совместного приказа Министра здравоохранения Республики Казахстан от 18 марта 2010 года № 186, Министра образования и науки Республики Казахстан от 18 марта 2010 года № 125 и Министра труда и социальной защиты населения Республики Казахстан от 17 марта 2010 года № 89-п "О внесении изменений и дополнений в совместный приказ Министра здравоохранения Республики Казахстан от 10 февраля 2009 года № 79, Министра образования и науки Республики Казахстан от 28 января 2009 года № 28, Министра труда и социальной защиты населения Республики Казахстан от 28 января 2009 года № 28-п "Об утверждении Правил оценки и определения потребности в специальных социальных услугах"
    kaz: '"Арнаулы әлеуметтік қызметтерге қажеттілікті бағалау және айқындау ережесін бекіту туралы" Қазақстан Республикасы Денсаулық сақтау министрінің 2009 жылғы 10 ақпандағы № 79, Қазақстан Республикасы Білім және ғылым министрінің 2009 жылғы 28 қаңтардағы № 28, Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2009 жылғы 28 қаңтардағы № 28-ө бірлескен бұйрығының және «Арнаулы әлеуметтік қызметтерге қажеттілікті бағалау және айқындау ережесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2009 жылғы 10 ақпандағы № 79, Қазақстан Республикасы Білім және ғылым министрінің 2009 жылғы 28 қаңтардағы № 28, Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2009 жылғы 28 қаңтардағы № 28-ө бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2010 жылғы 18 наурыздағы № 186, Қазақстан Республикасы Білім және ғылым министрінің 2010 жылғы 18 наурыздағы № 125 және Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2010 жылғы 17 наурыздағы № 89-ө бірлескен бұйрығының күші жойылды деп тану туралы'
