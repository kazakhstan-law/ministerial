title:
  rus: Об утверждении Порядка взаимодействия Комитета по статистике Министерства национальной экономики Республики Казахстан с Министерством внутренних дел Республики Казахстан при проведении национальной переписи населения Республики Казахстан в 2020 году на объектах Министерства внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы Ішкі істер министрлігінің объектілерінде 2020 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитетінің Қазақстан Республикасы Ішкі істер министрлігімен өзара іс-қимыл тәртібін бекіту туралы
