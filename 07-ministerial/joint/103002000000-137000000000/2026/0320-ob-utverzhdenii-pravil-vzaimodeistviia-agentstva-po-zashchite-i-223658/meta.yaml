act_code: '223658'
requisite: Совместный приказ Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 20 марта 2026 года № 16 и Министра финансов Республики Казахстан от 26 марта 2026 года № 201
title:
  rus: Об утверждении Правил взаимодействия Агентства по защите и развитию конкуренции Республики Казахстан и Министерства финансов Республики Казахстан по представлению органом государственных доходов антимонопольному органу сведений, составляющих налоговую тайну, и конфиденциальной информации
  kaz: Мемлекеттік кірістер органының монополияға қарсы органға салық құпиясын және құпия ақпаратты құрайтын мәліметтерді ұсынуы бойынша Қазақстан Республикасының Бәсекелестікті қорғау және дамыту агенттігі мен Қазақстан Республикасы Қаржы министрлігінің өзара іс-қимыл жасау қағидаларын бекіту туралы
