  requisite: Совместный приказ Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 31 декабря 2021 года № 355-НҚ и Министра финансов Республики Казахстан от 31 декабря 2021 года № 1360. Утратил силу совместным приказом Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 20 марта 2026 года № 16 и Министра финансов Республики Казахстан от 26 марта 2026 года № 201 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в совместный приказ Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 2 июня 2021 года № 133-ОД и Министра финансов Республики Казахстан от 3 июня 2021 года № 524 «Об утверждении Правил представления органами государственных доходов антимонопольному органу сведений о налогоплательщике (налоговом агенте), составляющих налоговую тайну, без получения письменного разрешения налогоплательщика (налогового агента) и перечня представляемых сведений»
    kaz: «Мемлекеттік кірістер органдарының монополияға қарсы органға салық төлеушінің (салық агентінің) жазбаша рұқсатын алмай, салық құпиясын құрайтын салық төлеуші (салық агенті) туралы мәліметтерді және ұсынылатын мәліметтер тізбесін ұсыну қағидаларын бекіту туралы» Қазақстан Республикасының Бәсекелестікті қорғау және дамыту агенттігі төрағасының 2021 жылғы 2 маусымдағы № 133-НҚ және Қазақстан Республикасы Қаржы министрінің 2021 жылғы 3 маусымдағы № 524 бірлескен бұйрығына өзгерістер енгізу туралы
