act_code: '156402'
requisite: Совместный приказ Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 2 июня 2021 года № 133-ОД и Министра финансов Республики Казахстан от 3 июня 2021 года № 524. Утратил силу совместным приказом Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 20 марта 2026 года № 16 и Министра финансов Республики Казахстан от 26 марта 2026 года № 201 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил представления органами государственных доходов антимонопольному органу сведений о налогоплательщике (налоговом агенте), составляющих налоговую тайну, без получения письменного разрешения налогоплательщика (налогового агента) и конфиденциальной информации в сфере таможенного регулирования, а также перечня представляемых сведений
  kaz: Мемлекеттік кірістер органдарының монополияға қарсы органға салық төлеушінің (салық агентінің) жазбаша рұқсатын алмай, салыққұпиясын құрайтын салық төлеуші (салық агенті) туралы мәліметтерді және кедендік реттеу саласындағы құпия ақпаратты, сондай-ақұсынылатын мәліметтер тізбесін ұсыну қағидаларын бекіту туралы
