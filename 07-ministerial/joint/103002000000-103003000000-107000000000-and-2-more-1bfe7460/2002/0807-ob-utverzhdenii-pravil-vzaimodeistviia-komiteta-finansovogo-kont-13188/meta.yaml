act_code: '13188'
requisite: Совместный приказ Министра финансов Республики Казахстан от 8 августа 2002 года N 361, Генерального Прокурора Республики Казахстан от 23 июля 2002 года N 37, Министра внутренних дел Республики Казахстан от 4 сентября 2002 года N 566, Председателя Комитета национальной безопасности Республики Казахстан от 8 августа 2002 года N 145, Председателя Агентства финансовой полиции Республики Казахстан от 8 августа 2002 года N 101. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 сентября 2002 года N 1966. Утратил силу совместным приказом Министра финансов Республики Казахстан от 28 января 2008 года N 41, Генерального Прокурора Республики Казахстан от 25 марта 2008 года N 12, Министра внутренних дел Республики Казахстан от 25 марта 2008 года N 115, Председателя Комитета национальной безопасности Республики Казахстан от 26 марта 2008 года N 46, Председателя Агентства финансовой полиции Республики Казахстан от 3 марта 2008 года N 41.
title:
  rus: Об утверждении Правил взаимодействия Комитета финансового контроля Министерства финансов Республики Казахстан с органами прокуратуры, национальной безопасности, внутренних дел и финансовой полиции Республики Казахстан по Закону Республики Казахстан "О контроле за исполнением республиканского и местных бюджетов"
  kaz: Қазақстан Республикасының Қаржы министрлiгi Қаржы бақылау комитетiнiң "Республикалық және жергiлiктi бюджеттердiң атқарылуын бақылау туралы" Қазақстан Республикасының Заңы бойынша Қазақстан Республикасының прокуратура, ұлттық қауiпсiздiк, iшкi iстер органдарымен және қаржы полициясымен өзара iс-қимыл жасасу ережесiн бекiту туралы
