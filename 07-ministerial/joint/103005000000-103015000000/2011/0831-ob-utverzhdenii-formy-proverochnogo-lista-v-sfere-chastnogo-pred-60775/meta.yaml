requisite: Совместный приказ Министра охраны окружающей среды Республики Казахстан от 31 августа 2011 года № 232-ө и и.о. Министра экономического развития и торговли Республики Казахстан от 16 сентября 2011 года № 293. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 сентября 2011 года № 7222. Утратил силу совместным приказом Министра энергетики Республики Казахстан от 24 июня 2015 года № 431 и и.о. Министра национальной экономики Республики Казахстан от 30 июня 2015 года № 474
title:
  rus: Об утверждении формы проверочного листа в сфере частного предпринимательства в области охраны окружающей среды, воспроизводства и использования природных ресурсов
  kaz: Қоршаған ортаны қорғау, табиғи ресурстарды молықтыру және пайдалану саласында жеке кәсіпкерлік субъектілерін тексеру жөніндегі тексеріс парағының нысанын бекіту туралы
