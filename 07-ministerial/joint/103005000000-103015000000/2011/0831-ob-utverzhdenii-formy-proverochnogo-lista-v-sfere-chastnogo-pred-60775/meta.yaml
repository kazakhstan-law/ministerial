  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра охраны окружающей среды Республики Казахстан от 31 августа 2011 года № 232-ө и и.о. Министра экономического развития и торговли Республики Казахстан от 16 сентября 2011 года № 293 "Об утверждении формы проверочного листа в сфере частного предпринимательства в области охраны окружающей среды, воспроизводства и использования природных ресурсов"
    kaz: '"Қоршаған ортаны қорғау, табиғи ресурстарды молықтыру және пайдалану саласында жеке кәсіпкерлік субъектілерін тексеру жөніндегі тексеріс парағының нысанын бекіту туралы" Қазақстан Республикасы Қоршаған ортаны қорғау министрлігінің 2011 жылғы 31 тамыздағы № 232-Ө және Қазақстан Республикасы Экономикалық даму және сауда министрлігінің 2011 жылғы 16 қыркүйектегі № 293 бірлескен бұйрығына өзгертулер мен толықтырулар енгізу туралы'
