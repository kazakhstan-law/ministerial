act_code: '3446'
requisite: Утверждено совместными приказами Министра финансов Республики Казахстан от 22 июня 1999 года № 315 и Председателя Агентства Республики Казахстан по инвестициям от 22 июня 1999 года № 1. Зарегистрирован в Министерстве юстиции Республики Казахстан 2.07.1999 г. за № 827. Утратил силу совместным приказом Министра финансов Республики Казахстан от 18 января 2010 года № 12 и Министра энергетики и минеральных ресурсов Республики Казахстан от 19 января 2010 года № 11
title:
  rus: Об утверждении Правил о порядке определения размера подписного бонуса в контрактах на недропользование (проведение разведки, совмещенной разведки и добычи, а также добычи полезных ископаемых, за исключением общераспространенных полезных ископаемых) в Республике Казахстан
  kaz: 'Қазақстан Республикасында жер қойнауын пайдалануға (барлау, бiрлескен барлау және өңдеу жүргiзуге, сондай-ақ көп кездесетiн пайдалы қазбаларды қоспағанда, пайдалы қазбаларды өндiруге) арналған келісім-шарттардағы жазылу жүргiзiлетiн бонустың мөлшерiн белгілеудің тәртібі туралы ережелерді бекіту туралы<*> Ескерту: Бұйрықтың атауы өзгертілді - ҚР Қаржы министрлiгi мен Инвестициялар жөнiндегi агенттiгiнің 2000 жылғы 18 қазандағы N 448, N 0-1/170 бірлескен бұйртарымен. ~V001286'
