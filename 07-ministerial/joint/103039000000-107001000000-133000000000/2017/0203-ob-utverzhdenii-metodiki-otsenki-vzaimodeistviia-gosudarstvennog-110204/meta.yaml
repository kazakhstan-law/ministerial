  requisite: Совместный приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 23 ноября 2017 года № 229, Министра информации и коммуникаций Республики Казахстан от 24 ноября 2017 года № 414 и Председателя Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан от 24 ноября 2017 года № 93 о/д. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 декабря 2017 года № 16160. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по делам государственной службы от 3 марта 2020 года № 43, заместителя Председателя Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан от 3 марта 2020 года № 37 и Министр цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 5 марта 2020 года № 86/НҚ (вводится в действие со дня его первого официального опубликования)
  title:
    rus: О внесении изменения в совместный приказ Министра информации и коммуникаций Республики Казахстан от 6 февраля 2017 года № 45, Председателя Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан от 7 февраля 2017 года № 4 о/д и Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 3 февраля 2017 года № 29 «Об утверждении Методики оценки взаимодействия государственного органа с гражданами»
    kaz: Қазақстан Республикасы Ақпарат және коммуникациялар министрінің 2017 жылғы 6 ақпандағы № 45, Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөніндегі комитеті төрағасының 2017 жылғы 7 ақпандағы № 4 н/қ және Қазақстан Республикасының Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі төрағасының 2017 жылғы 3 ақпандағы № 29 «Мемлекеттік органдардың азаматтармен өзара іс-қимылын бағалау әдiстемесiн бекіту туралы» бірлескен бұйрығына өзгеріс енгізу туралы
