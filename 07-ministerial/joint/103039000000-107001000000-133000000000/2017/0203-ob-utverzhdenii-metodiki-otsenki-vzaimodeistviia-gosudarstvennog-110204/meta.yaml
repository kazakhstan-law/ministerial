  title:
    rus: О внесении изменений в совместный приказ Министра информации и коммуникаций Республики Казахстан от 6 февраля 2017 года № 45, Председателя Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан от 7 февраля 2017 года № 4 о/д и Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 3 февраля 2017 года № 29 «Об утверждении Методики оценки взаимодействия государственного органа с гражданами»
    kaz: Қазақстан Республикасы Ақпарат және коммуникациялар министрінің 2017 жылғы 6 ақпандағы № 45, Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөніндегі комитеті төрағасының 2017 жылғы 7 ақпандағы № 4 н/қ және Қазақстан Республикасының Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі төрағасының 2017 жылғы 3 ақпандағы № 29 «Мемлекеттік органдардың азаматтармен өзара іс-қимылын бағалау әдiстемесiн бекіту туралы» бірлескен бұйрығына өзгерістер енгізу туралы
