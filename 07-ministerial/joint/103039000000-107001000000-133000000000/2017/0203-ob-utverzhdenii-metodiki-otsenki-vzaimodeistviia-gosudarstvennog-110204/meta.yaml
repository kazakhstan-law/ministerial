act_code: '110204'
requisite: Совместный приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 3 февраля 2017 года № 29, Министра информации и коммуникаций Республики Казахстан от 6 февраля 2017 года № 45 и Председателя Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан от 7 февраля 2017 года № 4 о/д. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 февраля 2017 года № 14795. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по делам государственной службы от 3 марта 2020 года № 43, заместителя Председателя Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан от 3 марта 2020 года № 37 и Министр цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 5 марта 2020 года № 86/НҚ (вводится в действие со дня его первого официального опубликования)
title:
