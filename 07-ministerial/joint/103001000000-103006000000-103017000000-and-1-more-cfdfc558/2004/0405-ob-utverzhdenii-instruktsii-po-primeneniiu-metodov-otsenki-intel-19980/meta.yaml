act_code: '19980'
requisite: Совместный приказ Министра юстиции Республики Казахстан от 6 апреля 2004 года N 91, Министра образования и науки Республики Казахстан от 6 апреля 2004 года N 290, Министра индустрии и торговли Республики Казахстан от 6 апреля 2004 года N 79 и Министра энергетики и минеральных ресурсов Республики Казахстан от 6 апреля 2004 года N 79. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 мая 2004 года N 2844. Утратил силу совместным приказом Министра образования и науки Республики Казахстан от 3 июля 2015 года № 438, Министра по инвестициям и развитию Республики Казахстан от 16 июля 2015 года № 762, Министра энергетики Республики Казахстан  от 10 июля 2015 года № 477 и Министра юстиции Республики Казахстан от 15 сентября 2015 года № 497
title:
  rus: Об утверждении Инструкции по применению методов оценки интеллектуальной собственности при внедрении научных исследований, а также при внесении интеллектуальной собственности в уставные капиталы юридических лиц, в том числе при организации венчурных производств
  kaz: Ғылыми зерттеулердi енгiзу, сондай-ақ заңды тұлғалардың жарғылық капиталдарына зияткерлiк меншiктi кiргiзу, оның iшiнде венчурлық өндiрiстi ұйымдастыру кезiнде зияткерлік меншікті бағалау әдістерін қолдану жөнiндегi нұсқаулықты бекiту туралы
