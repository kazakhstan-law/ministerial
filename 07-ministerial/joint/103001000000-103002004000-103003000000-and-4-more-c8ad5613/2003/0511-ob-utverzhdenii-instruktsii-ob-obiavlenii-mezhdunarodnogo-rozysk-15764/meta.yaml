act_code: '15764'
requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 12 мая 2003 года N 260, Государственного секретаря - Министра иностранных дел Республики Казахстан от 17 января 2003 года N 08-1/7, Председателя Комитета национальной безопасности Республики Казахстан от 7 мая 2003 года N 85, Генерального Прокурора Республики Казахстан от 7 апреля 2003 года N 29, Министра юстиции Республики Казахстан от 22 мая 2003 года N 93, Начальника Службы охраны Президента Республики Казахстан от 18 апреля 2003 года N 2, Председателя Агентства таможенного контроля Республики Казахстан от 25 апреля 2003 года N 168 и Председателя Агентства финансовой полиции Республики Казахстан от 16 апреля 2003 года N 74. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 июня 2003 года N 2341. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 12 июля 2017 года № 480, Генерального Прокурора Республики Казахстан от 12 сентября 2017 года № 102, Министра финансов Республики Казахстан от 14 июля 2017 года № 435, Начальника Службы государственной охраны Республики Казахстан от 18 августа 2017 года № 11-36, Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 21 июля 2017 года № 148, Министра иностранных дел Республики Казахстан от 25 июля 2017 года № 318 и Председателя Комитета национальной безопасности Республики Казахстан от 15 августа 2017 года № 60 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции об объявлении международного розыска, исполнения и направления компетентными органами Республики Казахстан запросов и поручений по линии Интерпола, а также их обработки Национальным Центральным Бюро Интерпола в Республике Казахстан
  kaz: Халықаралық iздестiрудi жариялау, Қазақстан Республикасы құзыреттi органдарының Интерпол саласы бойынша сұрау салулар мен тапсырмаларды орындауы және жiберуi, сондай-ақ оларды Интерполдың Қазақстан Республикасындағы Ұлттық Орталық бюросында өңдеу туралы нұсқаулықты бекiту туралы
