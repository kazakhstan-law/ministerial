act_code: '53752'
requisite: Совместный приказ Министра экономического развития и торговли Республики Казахстан от 1 июля 2010 года № 102 и Председателя Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства от 30 июня 2010 года № 276. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 июля 2010 года № 6345. Утратил силу совместным приказом Министра экономики и бюджетного планирования Республики Казахстан от 27 июня 2014 года № 184 и Министра регионального развития Республики Казахстан от 31 июля 2014 года № 226/НК
title:
  rus: Об утверждении требований к разработке или корректировке, а также проведению необходимых экспертиз технико-экономического обоснования бюджетного инвестиционного и концессионного проектов
  kaz: Бюджеттік инвестициялық және концессиялық жобалардың техникалық-экономикалық негіздемелерін әзірлеуге немесе түзетуге, сондай-ақ қажетті сараптамалар жүргізуге қойылатын талаптарды бекіту туралы
