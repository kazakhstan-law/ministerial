requisite: Совместный приказ Председателя Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства от 18 февраля 2010 года № 60 и Министра экономики и бюджетного планирования Республики Казахстан от 19 февраля 2010 года № 82. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2010 года № 6075. Утратил силу приказом Председателя Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства от 17 февраля 2011 года № 59
title:
  rus: Об утверждении критериев оценок степеней рисков субъектов архитектурной, градостроительной и строительной деятельности и местных исполнительных органов в сфере архитектурной, градостроительной и строительной деятельности, государственного архитектурно-строительного контроля и лицензирования
  kaz: Сәулет, қала құрылысы және құрылыс қызметі субъектілерінің және сәулет, қала құрылысы және құрылыс қызметі, мемлекеттік сәулет-құрылыс бақылауы және лицензиялау саласындағы жергілікті атқарушы органдардың тәуекелдер дәрежесін бағалау критерийлерін бекіту туралы
