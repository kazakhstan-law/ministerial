act_code: '50922'
requisite: Совместный приказ Председателя Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства от 18 февраля 2010 года № 62 и Министра экономики и бюджетного планирования Республики Казахстан от 19 февраля 2010 года № 83. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2010 года № 6074. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства от 28 марта 2011 года № 123 и Министра экономического развития и торговли Республики Казахстан от 31 марта 2011 года № 75
title:
  rus: Об утверждении форм проверочных листов по вопросам проверки субъектов архитектурной, градостроительной и строительной деятельности и деятельности местных исполнительных органов в сфере архитектурной, градостроительной и строительной деятельности, государственного архитектурно-строительного контроля и лицензирования
  kaz: Сәулет, қала құрылысы және құрылыс қызметі субъектілерін және сәулет, қала құрылысы және құрылыс қызметі, мемлекеттік сәулет-құрылыс бақылауы және лицензиялау саласындағы жергілікті атқарушы органдардың қызметін тексеру мәселелері жөніндегі тексеру мәселелері жөніндегі тексеру парақтарының нысандарын бекіту туралы
