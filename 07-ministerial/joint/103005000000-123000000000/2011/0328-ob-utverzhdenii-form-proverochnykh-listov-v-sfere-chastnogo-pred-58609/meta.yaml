  title:
    rus: О внесении изменений и дополнения в совместный приказ Председателя Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства от 28 марта 2011 года № 123 и Министра экономического развития и торговли Республики Казахстан от 31 марта 2011 года № 75 "Об утверждении формы проверочного листа в сфере частного предпринимательства в области архитектуры, градостроительства и строительства"
    kaz: '"Сәулет, қала құрылысы және құрылыс саласындағы жеке кәсіпкерлік саласында тексеру парағының нысанын бекіту туралы" Қазақстан Республикасы Құрылыс және тұрғын үй-коммуналдық шаруашылық істері агенттігі Төрағаның 2011 жылғы 28 наурыздағы № 123 және Қазақстан Республикасы Экономикалық даму және сауда Министрінің 2011 жылғы 31 наурыздағы № 75 бірлескен бұйрыққа өзгертулер мен толықтыру енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/66266/rus
