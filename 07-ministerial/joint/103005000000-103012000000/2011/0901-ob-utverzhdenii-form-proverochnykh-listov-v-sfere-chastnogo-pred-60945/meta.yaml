act_code: '60945'
requisite: Совместный приказ и.о. Министра сельского хозяйства Республики Казахстан от 1 сентября 2011 года № 18-03/496 и и.о. Министра экономического развития и торговли Республики Казахстан от 16 сентября 2011 года № 312. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 октября 2011 года № 7250. Утратил силу совместным приказом Министра сельского хозяйства Республики Казахстан от 24 августа 2015 года № 15-02/762 и Министра национальной экономики Республики Казахстан от 16 ноября 2015 года № 697
title:
  rus: Об утверждении форм проверочных листов в сфере частного предпринимательства по государственному контролю в области племенного животноводства и семеноводства и государственному контролю в области защиты растений
  kaz: Жеке кәсіпкерлік саласындағы асыл тұқымды мал шаруашылығы және тұқым шаруашылығы салаларындағы мемлекеттік бақылау бойынша және өсімдіктерді қорғау саласындағы мемлекеттік бақылау бойынша тексеру парақтарының нысандарын бекіту туралы
