  requisite: Совместный приказ Министра сельского хозяйства Республики Казахстан от 20 марта 2013 года № 15-07/124 и Первого заместителя Премьер-Министра Республики Казахстан - Министра регионального развития Республики Казахстан от 9 апреля 2013 года № 01-04-03/39 НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 мая 2013 года № 8451. Утратил силу совместным приказом и.о. Министра сельского хозяйства Республики Казахстан от 3 июля 2015 года № 15-03/609 и Министра национальной экономики Республики Казахстан от 10 июля 2015 года № 522
  title:
    rus: О внесении изменений и дополнений в совместные приказы и.о. Министра сельского хозяйства Республики Казахстан от 19 мая 2011 года № 18-03/276 и и.о. Министра экономического развития и торговли Республики Казахстан от 16 июня 2011 года № 169 «Об утверждении Критериев оценки степени рисков в сфере частного предпринимательства в области регулирования рынка зерна, безопасности и качества хлопка», и.о. Министра сельского хозяйства Республики Казахстан от 19 мая 2011 года № 18-03/277 и и.о. Министра экономического развития и торговли Республики Казахстан от 16 июня 2011 года № 170 «Об утверждении форм проверочных листов в сфере частного предпринимательства в области регулирования рынка зерна, безопасности и качества хлопка»
    kaz: '"Астық нарығын реттеу және мақтаның қауiпсiздiгi мен сапасы бойынша жеке кәсiпкерлiк саласындағы тәуекелдер дәрежесiн бағалау өлшемдерiн бекiту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің міндетін атқарушының 2011 жылғы 19 мамырдағы № 18-03/276 және Қазақстан Республикасы Экономикалық даму және сауда министрінің міндетін атқарушының 2011 жылғы 16 маусымдағы № 169, "Астық нарығын реттеу және мақтаның қауіпсіздігі мен сапасы бойынша жеке кәсіпкерлік саласындағы тексеру парақтарының нысандарын бекiту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің міндетін атқарушының 2011 жылғы 19 мамырдағы № 18-03/277 және Қазақстан Республикасы Экономикалық даму және сауда министрінің міндетін атқарушының 2011 жылғы 16 маусымдағы № 170 бірлескен бұйрықтарына өзгерістер мен толықтырулар енгізу туралы'
