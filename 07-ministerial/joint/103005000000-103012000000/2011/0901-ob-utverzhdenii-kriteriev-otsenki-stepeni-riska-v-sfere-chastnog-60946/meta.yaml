act_code: '60946'
requisite: Совместный приказ и.о. Министра сельского хозяйства Республики Казахстан    от 1 сентября 2011 года № 18-03/495 и и.о. Министра экономического развития и торговли Республики Казахстан от 16 сентября 2011 года № 313. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 октября 2011 года № 7254. Утратил силу совместным приказом Министра сельского хозяйства Республики Казахстан от 9 июля 2015 года № 15-04/634 и Министра национальной экономики Республики Казахстан от 10 августа 2015 года № 601
title:
  rus: Об утверждении критериев оценки степени риска в сфере частного предпринимательства по государственному контролю в области племенного животноводства и семеноводства и государственному контролю в области защиты растений
  kaz: Жеке кәсіпкерлік саласындағы асыл тұқымды мал шаруашылығы және тұқым шаруашылығы салаларындағы мемлекеттік бақылау бойынша және өсімдіктерді қорғау саласындағы мемлекеттік бақылау бойынша тәуекел дәрежесін бағалау критерийлерін бекіту туралы
