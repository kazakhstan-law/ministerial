  code: '78811'
  requisite: Совместный приказ Министра сельского хозяйства Республики Казахстан от 28 января 2014 года № 8/72 и Министра регионального развития Республики Казахстан от 10 февраля 2014 года № 29/ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 марта 2014 года № 9240. Утратил силу совместным приказом Министра сельского хозяйства Республики Казахстан от 17 октября 2024 года № 356 и и.о. Министра национальной экономики Республики Казахстан от 18 октября 2024 года № 93 (вводится в действие после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в совместные приказы и.о. Министра сельского хозяйства Республики Казахстан от 1 сентября 2011 года № 18-03/495 и и.о. Министра экономического развития и торговли Республики Казахстан от 16 сентября 2011 года № 313 "Об утверждении критериев оценки степени риска в сфере частного предпринимательства по государственному контролю в области племенного животноводства и семеноводства и государственному контролю в области защиты растений", и.о. Министра сельского хозяйства Республики Казахстан от 1 сентября 2011 года № 18-03/496 и и.о. Министра экономического развития и торговли Республики Казахстан от 16 сентября 2011 года № 312 "Об утверждении форм проверочных листов в сфере частного предпринимательства по государственному контролю в области племенного животноводства и семеноводства и государственному контролю в области защиты растений"
    kaz: '"Жеке кәсіпкерлік саласындағы асыл тұқымды мал шаруашылығы және тұқым шаруашылығы салаларындағы мемлекеттік бақылау бойынша және өсімдіктерді қорғау саласындағы мемлекеттік бақылау бойынша тәуекел дәрежесін бағалау критерийлерін бекіту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің м.а. 2011 жылғы 1 қыркүйектегі № 18-03/495 және Қазақстан Республикасы Экономикалық даму және сауда министрінің м.а. 2011 жылғы 16 қыркүйектегі № 313, "Жеке кәсіпкерлік саласындағы асыл тұқымды мал шаруашылығы және тұқым шаруашылығы салаларындағы мемлекеттік бақылау бойынша және өсімдіктерді қорғау саласындағы мемлекеттік бақылау бойынша тексеру парақтарының нысандарын бекіту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің м.а. 2011 жылғы 1 қыркүйектегі № 18-03/496 және Қазақстан Республикасы Экономикалық даму және сауда министрінің м.а. 2011 жылғы 16 қыркүйектегі № 312 бірлескен бұйрықтарына өзгерістер енгізу туралы'
