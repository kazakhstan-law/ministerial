requisite: Совместный приказ и.о. Министра сельского хозяйства Республики Казахстан от 18 февраля 2010 года № 100 и Министра экономики и бюджетного планирования Республики Казахстан от 25 февраля 2010 года № 102. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 марта 2010 года № 6109. Утратил силу совместным приказом Министра сельского хозяйства Республики Казахстан от 13 апреля 2011 года № 24-03/184 и Министра экономического развития и торговли Республики Казахстан от 25 апреля 2011 года № 111
title:
  rus: Об утверждении Критериев оценки степени рисков в области использования и охраны водного фонда и формы проверочного листа для субъектов, осуществляющих деятельность, связанную с забором воды или регулированием поверхностного стока
  kaz: Су қорын пайдалану және қорғау саласындағы тәуекел дәрежесін бағалаудың критерийлерін және су қорын пайдалану және cу алуды немесе жер үстiндегi ағын суды реттеумен байланысты қызметті жүзеге асыратын субъектілерге арналған тексеру парағының нысанын бекіту туралы
