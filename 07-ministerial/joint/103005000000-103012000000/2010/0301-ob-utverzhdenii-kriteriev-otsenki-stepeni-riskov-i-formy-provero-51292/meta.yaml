requisite: Совместный приказ Министра сельского хозяйства Республики Казахстан от 1 марта 2010 года № 133 и Министра экономики и бюджетного планирования Республики Казахстан от 26 февраля 2010 года № 111. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 марта 2010 года № 6127. Утратил силу совместным приказом и.о. Министра сельского хозяйства Республики Казахстан от 5 августа 2011 года № 25-03-02/459 и и.о. Министра экономического развития и торговли Республики Казахстан от 12 августа 2011 года № 238
title:
  rus: Об утверждении критериев оценки степени рисков и формы Проверочного листа в области лесного хозяйства, охраны, воспроизводства и использования животного мира (кроме рыбы и других водных животных), особо охраняемых природных территорий
  kaz: Орман шаруашылығы, жануарлар дүниесін (балықтан және басқа су жануарларынан өзге) қорғау, өсімін молайту және пайдалану, ерекше қорғалатын табиғи аумақтар саласындағы тәуекелдер деңгейін бағалау критерийлерін және тексеру парақтарын бекіту туралы
