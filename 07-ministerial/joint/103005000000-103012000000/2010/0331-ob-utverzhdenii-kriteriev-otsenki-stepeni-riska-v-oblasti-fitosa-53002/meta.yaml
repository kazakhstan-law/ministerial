act_code: '53002'
requisite: Совместный приказ Министра сельского хозяйства Республики Казахстан от 31 марта 2010 года № 219 и Министра экономического развития и торговли Республики Казахстан от 30 апреля 2010 года № 25. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 июня 2010 года № 6270. Действует до 1 января 2011 года
title:
  rus: Об утверждении Критериев оценки степени риска в области фитосанитарной, ветеринарно-санитарной безопасности, племенного животноводства, зернового, хлопкового рынка и семеноводства
  kaz: Фитосанитариялық, ветеринариялық-санитариялық қауіпсіздік, асыл тұқымды мал шаруашылығы, астық, мақта нарығы және тұқым шаруашылығы салаларындағы тәуекел дәрежесін бағалау Критерийлерін бекіту туралы
