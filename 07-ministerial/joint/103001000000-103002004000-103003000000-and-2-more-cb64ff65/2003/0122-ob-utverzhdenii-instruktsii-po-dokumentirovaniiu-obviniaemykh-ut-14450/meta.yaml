requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 22 января 2003 года N 34, Председателя Комитета национальной безопасности Республики Казахстан от 23 января 2003 года N 16, Министра юстиции Республики Казахстан от 22 января 2003 года N 8, Председателя Агентства финансовой полиции Республики Казахстан от 22 января 2003 года N 10, Председателя Агентства таможенного контроля Республики Казахстан от 22 января 2003 года N 29. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 февраля 2003 года N 2150. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 12 мая 2016 года № 497, Министра по делам государственной службы Республики Казахстан от 22 июня 2016 года № 138, Министра финансов Республики Казахстан от 14 июня 2016 года № 309 и Председателя Комитета национальной безопасности Республики Казахстан от 7 сентября 2016 года № 63
title:
