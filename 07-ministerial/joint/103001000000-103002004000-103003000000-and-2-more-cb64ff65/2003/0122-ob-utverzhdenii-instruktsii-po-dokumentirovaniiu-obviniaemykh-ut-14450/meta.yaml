  requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 25 января 2005 года № 48, Председателя Комитета национальной безопасности Республики Казахстан от 5 марта 2005 года № 46, Министра юстиции Республики Казахстан от 24 марта 2005 года № 91, Председателя Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовая полиция) от 3 марта 2005 года № 45, Министра финансов Республики Казахстан от 18 февраля 2005 года № 52. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 апреля 2005 года № 3554. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 12 мая 2016 года № 497, Министра по делам государственной службы Республики Казахстан от 22 июня 2016 года № 138, Министра финансов Республики Казахстан от 14 июня 2016 года № 309 и Председателя Комитета национальной безопасности Республики Казахстан от 7 сентября 2016 года № 63
  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра внутренних дел Республики Казахстан от 22 января 2003 года N 34, Председателя Комитета национальной безопасности Республики Казахстан от 23 января 2003 года N 16, Министра юстиции Республики Казахстан от 22 января 2003 года N 8, Председателя Агентства финансовой полиции Республики Казахстан от 22 января 2003 года N 10, Председателя Агентства таможенного контроля Республики Казахстан от 22 января 2003 года N 29 "Об утверждении Инструкции о порядке документирования обвиняемых, утерявших документы, удостоверяющие личность, в отношении которых избрана мера пресечения - арест"
    kaz: '"Бұлтартпау шарасы ретінде тұтқынға алу таңдап алынған, жеке басын куәландыратын құжаттарын жоғалтқан айыпталушыларды құжаттандыру тәртібі туралы нұсқаулықты бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2003 жылғы 22 қаңтардағы N 34, Қазақстан Республикасының Ұлттық қауіпсіздік комитеті төрағасының 2003 жылғы 23 қаңтардағы N 16, Қазақстан Республикасы Әділет министрінің 2003 жылғы 22 қаңтардағы N 8, Қазақстан Республикасының Қаржы полициясы агенттігі төрағасының 2003 жылғы 22 қаңтардағы N 10, Қазақстан Республикасының Кедендік бақылау агенттігі төрағасының 2003 жылғы 22 қаңтардағы N 29 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/23551/rus
