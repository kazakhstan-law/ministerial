act_code: '147227'
requisite: Совместный приказ и.о. Генерального Прокурора Республики Казахстан от 18 сентября 2020 года № 112 ДСП и Министра обороны Республики Казахстан от 25 сентября 2020 года № 478 ДСП. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 сентября 2020 года № 21317
title:
  rus: Об утверждении Правил и оснований получения органами военной разведки Министерства обороны Республики Казахстан из системы информационного обмена правоохранительных, специальных государственных и иных органов информации, необходимой для проведения оперативно-розыскной деятельности и решения иных возложенных на них задач
  kaz: Қазақстан Республикасы Қорғаныс Министрлігі Әскери барлау органдарының құқық қорғау, арнаулы мемлекеттік және өзге де органдардың ақпарат алмасу жүйесінен жедел-іздестіру қызметін жүргізу және оларға жүктелген өзге де міндеттерді шешу үшін қажетті ақпаратты алу қағидалары мен негіздерін бекіту туралы
