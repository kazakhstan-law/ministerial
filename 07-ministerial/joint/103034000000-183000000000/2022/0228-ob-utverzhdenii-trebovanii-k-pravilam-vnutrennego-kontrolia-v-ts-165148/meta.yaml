  requisite: Совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 14 сентября 2022 года № 32 и Министра культуры и спорта Республики Казахстан от 14 сентября 2022 года № 263. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 сентября 2022 года № 29585. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 апреля 2026 года № 4, Министра юстиции Республики Казахстан от 30 апреля 2026 года № 408, Заместителя Премьер-Министра – Министр искусственного интеллекта и цифрового развития Республики Казахстан от 22 апреля 2026 года № 216/НҚ, Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 8 апреля 2026 года № 1 и Министра туризма и спорта Республики Казахстан от 14 апреля 2026 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в совместный приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 28 февраля 2022 года № 17 и Министра культуры и спорта Республики Казахстан от 28 февраля 2022 года № 60 «Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для организаторов игорного бизнеса и лотерей»
    kaz: Қазақстан Республикасы Қаржылық мониторинг агенттігі Төрағасының 2022 жылғы 28 ақпандағы № 17 және Қазақстан Республикасы Мәдениет және спорт министрінің 2022 жылғы 28 ақпандағы № 60 «Ойын бизнесі мен лотереяларды ұйымдастырушылар үшін қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы» бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
