  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра внутренних дел Республики Казахстан от 1 января 2017 года № 1 и Министра культуры и спорта Республики Казахстан от 17 января 2017 года № 9 «Об утверждении Инструкции по обеспечению безопасности проведения спортивных и спортивно-массовых, зрелищных культурно-массовых мероприятий»
    kaz: «Спорттық және спорттық-бұқаралық, ойын-сауық мәдени-бұқаралық іс-шараларды өткізу қауіпсіздігін қамтамасыз ету жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2017 жылғы 1 қаңтардағы № 1 және Қазақстан Республикасы Мәдениет және спорт министрінің 2017 жылғы 17 қаңтардағы № 9 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
