act_code: '114849'
requisite: Совместный приказ Председателя Комитета национальной безопасности Республики Казахстан от 15 августа 2017 года № 62/қбп и Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 16 августа 2017 года № 7 қбпү. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 сентября 2017 года № 15654
title:
  rus: Об утверждении Правил проведения обязательной специальной проверки органами национальной безопасности Республики Казахстан иностранных работников при приеме на работу в государственные органы Республики Казахстан
  kaz: Қазақстан Республикасының мемлекеттік органдарына жұмысқа қабылдау кезінде шетелдік жұмыскерлерге Қазақстан Республикасының ұлттық қауіпсіздік органдарының міндетті арнайы тексеру жүргізу қағидаларын бекіту туралы
