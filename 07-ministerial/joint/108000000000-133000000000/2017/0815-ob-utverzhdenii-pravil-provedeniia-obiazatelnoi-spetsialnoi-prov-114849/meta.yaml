  code: '183353'
  requisite: Совместный приказ Председателя Комитета национальной безопасности Республики Казахстан от 6 июня 2023 года № 38/қбп и Председателя Агентства Республики Казахстан по делам государственной службы от 6 июня 2023 года № 3-қбп. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 июня 2023 года № 32878
  title:
    rus: О внесении изменений в совместный приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 16 августа 2017 года № 7/ДСП и Председателя Комитета национальной безопасности Республики Казахстан от 15 августа 2017 года № 62/ДСП «Об утверждении Правил проведения обязательной специальной проверки органами национальной безопасности Республики Казахстан иностранных работников при приеме на работу в государственные органы Республики Казахстан»
    kaz: «Қазақстан Республикасының мемлекеттік органдарына жұмысқа қабылдау кезінде шетелдік жұмыскерлерге Қазақстан Республикасының ұлттық қауіпсіздік органдарының міндетті арнайы тексеру жүргізу қағидаларын бекіту туралы» Қазақстан Республикасының Мемлекеттік қызмет істері агенттігі төрағасының 2017 жылғы 16 тамыздағы № 7/ҚБП және Қазақстан Республикасының Ұлттық қауіпсіздік комитеті Төрағасының 2017 жылғы 15 тамыздағы № 62/ҚБП бірлескен бұйрығына өзгерістер енгізу туралы
