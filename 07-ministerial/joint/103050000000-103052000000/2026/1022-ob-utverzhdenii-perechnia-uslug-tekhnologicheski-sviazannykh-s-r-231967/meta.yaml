title:
  rus: Об утверждении перечня услуг, технологически связанных с регулируемыми услугами подачи воды по каналам, подачи воды для орошения и регулирования поверхностного стока при помощи подпорных гидротехнических сооружений
  kaz: Суды каналдар арқылы беру, суару үшін су беру және тірек гидротехникалық құрылысжайларының көмегімен жерүсті ағынын реттеу қызметтерімен технологиялық байланысты қызметтер тізбесін бекіту туралы
