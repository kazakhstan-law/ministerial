act_code: '12605'
requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 1 июня 2002 года N 384 и Министра здравоохранения Республики Казахстан от 30 апреля 2002 года N 439. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 июня 2002 года N 1877. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 4 августа 2015 года № 665 и Министра здравоохранения и социального развития Республики Казахстан от 7 августа 2015 года № 659
title:
  rus: Об утверждении Правил по выявлению туберкулеза среди подозреваемых и обвиняемых, содержащихся под стражей в изоляторах временного содержания, и их конвоирования
  kaz: Уақытша ұстау изоляторларында қамауда ұсталатын сезіктілер мен айыпталушылар арасында туберкулезді анықтау және оларды айдап алып жүру жөніндегі тәртіпті бекіту туралы
