act_code: '7559'
requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 2 октября 2000 года N 526 и Председателя Агентства Республики Казахстан по делам здравоохранения от 5 октября 2000 года N 620. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 декабря 2000 года N 1316. Утратил силу с 1 января 2002 года - совместный приказ Министра юстиции Республики Казахстан от 6.12.2001г. № 141, Министра внутренних дел Республики Казахстан от 7.12.2001г. № 863 и Министра здравоохранения Республики Казахстан от 10.12.2001г. № 1123 ~V011713
title:
  rus: О специальных мерах профилактики инфекций, передаваемых преимущественно половым путем, в учреждениях уголовно-исполнительной системы МВД Республики Казахстан
  kaz: '"Қазақстан Республикасы Iшкісминiнiң Қылмыстық-атқару жyйесi мекемелерiндегi көбiнесе жыныстық жолмен жұғатын жұқпалы аурулардың алдын алудың арнайы шаралары туралы"'
