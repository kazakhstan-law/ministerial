  title:
    rus: О внесении изменений в совместный приказ Министра труда и социальной защиты населения Республики Казахстан от 4 ноября 2025 года № 347, Министра здравоохранения Республики Казахстан от 5 ноября 2025 года № 136, Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 11 ноября 2025 года № 571/НҚ «О реализации пилотного проекта в Акмолинской области  по внедрению электронной очереди при очном оказании государственной услуги «Установление инвалидности и/или степени утраты трудоспособности и/или определение необходимых мер социальной защиты»
    kaz: «Ақмола облысында «Мүгедектікті және/немесе еңбек ету қабілетінен айырылу дәрежесін белгілеу және/немесе қажетті әлеуметтік қорғау шараларын айқындау» мемлекеттік қызметін көзбе-көз көрсету кезінде электрондық кезекті енгізу жөніндегі пилоттық жобаны іске асыру туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2025 жылғы 4 қарашадағы № 347, Қазақстан Республикасы Денсаулық сақтау министрінің 2025 жылғы 5 қарашадағы № 136, Қазақстан Республикасы Премьер-Министрінің орынбасары – Жасанды интеллект және цифрлық даму министрінің 11 қарашадағы № 571/НҚ бірлескен бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/226269/rus
