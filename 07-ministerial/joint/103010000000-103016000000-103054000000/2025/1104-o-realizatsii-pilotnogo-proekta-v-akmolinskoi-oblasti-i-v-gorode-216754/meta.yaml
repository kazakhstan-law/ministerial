requisite: Совместный приказ Министра труда и социальной защиты населения Республики Казахстан от 4 ноября 2025 года № 347, Министра здравоохранения Республики Казахстан от 5 ноября 2025 года № 136 и Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 11 ноября 2025 года № 571/НҚ
title:
  rus: О реализации пилотного проекта в Акмолинской области и в городе Алматы по внедрению электронной очереди при очном оказании государственной услуги «Установление инвалидности и/или степени утраты трудоспособности и/или определение необходимых мер социальной защиты»
  kaz: Ақмола облысында және Алматы қаласында «Мүгедектікті және/немесе еңбек ету қабілетінен айырылу дәрежесін белгілеу және/немесе қажетті әлеуметтік қорғау шараларын айқындау» мемлекеттік қызметін көзбе-көз көрсету кезінде электрондық кезекті енгізу жөніндегі пилоттық жобаны іске асыру туралы
