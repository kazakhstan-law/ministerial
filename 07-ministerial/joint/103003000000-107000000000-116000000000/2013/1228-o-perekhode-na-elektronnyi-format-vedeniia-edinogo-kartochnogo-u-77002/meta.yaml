requisite: Совместный приказ Председателя Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовая полиция) от 28 декабря 2013 года № 425, Генерального Прокурора Республики Казахстан от 30 декабря 2013 года № 124 и Министра внутренних дел Республики Казахстан от 28 декабря 2013 года № 758. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2013 года № 9056. Утратил силу совместным приказом первого заместителя Председателя Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовая полиция) от 10 октября 2014 года № 287, Генерального Прокурора Республики Казахстан от 20 октября 2014 года № 123 и Министра внутренних дел Республики Казахстан от 16 октября 2014 года № 708
title:
  rus: О переходе на электронный формат ведения единого карточного учета заявлений, сообщений, жалоб и иной информации о преступлениях, происшествиях, уголовных дел, результатов их расследования и прокурорского надзора
  kaz: Қылмыстар, оқиғалар туралы өтініштерді, хабарламаларды, шағымдарды және өзге де ақпаратты, қылмыстық істерді, оларды тергеу және прокурорлық қадағалау нәтижелерін бірыңғай карточкалық есепке алуды электрондық форматта жүргізуге көшу туралы
