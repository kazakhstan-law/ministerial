requisite: Совместный приказ Председателя Агентства Республики Казахстан по чрезвычайным ситуациям от 14 апреля 2003 года N 251 и Министра внутренних дел Республики Казахстан от 8 мая 2003 года N 258. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 июня 2003 года N 2361. Утратил силу - совместным приказом И.о.Министра по чрезвычайным ситуациям РК от 25.07.2005г. N 42 и Министра внутренних дел РК 1.08.2005г. N 461
title:
