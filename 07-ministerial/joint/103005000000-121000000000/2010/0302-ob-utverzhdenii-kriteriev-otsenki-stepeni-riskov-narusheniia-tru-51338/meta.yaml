act_code: '51338'
requisite: Совместный приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 2 марта 2010 года № 04.2-40/53 и Министра экономики и бюджетного планирования Республики Казахстан от 2 марта 2010 года № 115. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 марта 2010 года № 6119. Утратил силу постановлением Правления Национального Банка Республики Казахстан от 30 сентября 2011 года № 156 и приказом Министра экономического развития и торговли Республики Казахстан от 1 декабря 2011 года № 372
title:
  rus: Об утверждении критериев оценки степени рисков нарушения трудового законодательства Республики Казахстан участниками регионального финансового центра города Алматы
  kaz: Алматы қаласының өңірлік қаржы орталығы қатысушыларымен Қазақстан Республикасы еңбек заңнамасын бұзу тәуекелдерінің дәрежесін бағалау критерийлерін бекіту туралы
