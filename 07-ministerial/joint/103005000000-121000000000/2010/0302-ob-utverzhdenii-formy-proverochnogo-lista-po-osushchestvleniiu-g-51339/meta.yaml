requisite: Совместный приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 2 марта 2010 года № 04.2-40/54 и Министра экономики и бюджетного планирования Республики Казахстан от 2 марта 2010 года № 114. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 марта 2010 года № 6120. Утратил силу постановлением Правления Национального Банка Республики Казахстан от 30 сентября 2011 года № 156 и приказом Министра экономического развития и торговли Республики Казахстан от 1 декабря 2011 года № 372
title:
  rus: Об утверждении формы проверочного листа по осуществлению государственного контроля уполномоченными должностными лицами Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы
  kaz: Қазақстан Республикасы Алматы қаласының өңірлік қаржы орталығының қызметін реттеу агенттігінің уәкілетті лауазымды тұлғаларымен мемлекеттік бақылау жүргізу бойынша тексеру парағының нысанын бекіту туралы
