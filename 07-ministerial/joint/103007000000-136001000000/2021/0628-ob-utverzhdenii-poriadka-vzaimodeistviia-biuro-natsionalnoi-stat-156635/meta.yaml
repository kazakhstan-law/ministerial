act_code: '156635'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 28 июня 2021 года № 134 и Министра по чрезвычайным ситуациям Республики Казахстан от 22 июня 2021 года № 310
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с Министерством по чрезвычайным ситуациям Республики Казахстан при проведении национальной переписи населения Республики Казахстан в 2021 году на объектах Министерства по чрезвычайным ситуациям Республики Казахстан
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігінің объектілерінде 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің Ұлттық статистика бюросы Қазақстан Республикасы Төтенше жағдайлар министрлігімен өзара іс-қимыл тәртібін бекіту туралы
