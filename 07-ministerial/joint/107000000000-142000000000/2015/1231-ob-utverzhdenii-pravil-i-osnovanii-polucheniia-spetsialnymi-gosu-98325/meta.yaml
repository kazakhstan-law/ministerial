requisite: Совместный приказ Генерального Прокурора Республики Казахстан от 31 декабря 2015 года № 170 ДСП, Директора Службы внешней разведки Республики Казахстан "Сырбар" от 31 декабря 2015 года № 21 ДСП, Начальника Службы государственной охраны Республики Казахстан от 28 декабря 2015 года № 169 ДСП и Председателя Комитета национальной безопасности Республики Казахстан от 30 декабря 2015 года № 111 ДСП. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12800
title:
  rus: Об утверждении Правил и оснований получения специальными государственными органами из системы информационного обмена правоохранительных, специальных государственных и иных органов информации, необходимой для проведения негласных следственных действий и оперативно-розыскной деятельности, а также для решения иных возложенных на них задач
  kaz: Арнаулы мемлекеттік органдардың құқық қорғау, арнаулы мемлекеттік және өзге де органдардың ақпарат алмасу жүйесінен жария емес тергеу әрекеттері мен жедел-іздестіру қызметін жүргізу үшін, сондай-ақ оларға жүктелген өзге де міндеттерді шешу үшін қажетті ақпаратты алу қағидалары мен негіздерін бекіту туралы
