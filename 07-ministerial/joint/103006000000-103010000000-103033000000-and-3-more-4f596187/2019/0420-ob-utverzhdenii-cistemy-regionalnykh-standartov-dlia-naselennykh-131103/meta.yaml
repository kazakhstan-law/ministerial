  title:
    rus: О внесении изменений в совместный приказ Министра национальной экономики Республики Казахстан от 20 апреля 2019 года № 29, Министра образования и науки Республики Казахстан от 23 апреля 2019 года № 164, Министра здравоохранения Республики Казахстан от 25 апреля 2019 года № ҚР ДСМ-50, Министра индустрии и инфраструктурного развития Республики Казахстан от 23 апреля 2019 года № 243, Министра культуры и спорта Республики Казахстан от 22 апреля 2019 года № 113 и Министра цифрового развития, оборонной и аэрокосмической промышленности Республики Казахстан от 25 апреля 2019 года № 56/НҚ «Об утверждении Cистемы региональных стандартов для населенных пунктов»
    kaz: «Елді мекендерге арналған өңірлік стандарттар жүйесін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 20 сәуірдегі № 29, Қазақстан Республикасы Білім және ғылым министрінің 2019 жылғы 23 сәуірдегі № 164, Қазақстан Республикасы Денсаулық сақтау министрінің 2019 жылғы 25 сәуірдегі № ҚР ДСМ-50, Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 23 сәуірдегі № 243, Қазақстан Республикасы Мәдениет және спорт министрінің 2019 жылғы 22 сәуірдегі № 113 және Қазақстан Республикасы Цифрлық даму, қорғаныс және аэроғарыш өнеркәсібі министрінің 2019 жылғы 25 сәуірдегі № 56/НҚ бірлескен бұйрығына өзгерістер енгізу туралы
