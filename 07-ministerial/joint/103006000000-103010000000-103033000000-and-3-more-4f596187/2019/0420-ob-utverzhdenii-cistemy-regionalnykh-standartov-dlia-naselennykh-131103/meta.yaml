requisite: Совместный приказ Министра национальной экономики Республики Казахстан от 20 апреля 2019 года № 29, Министра образования и науки Республики Казахстан от 23 апреля 2019 года № 164, Министра здравоохранения Республики Казахстан от 25 апреля 2019 года № ҚР ДСМ-50, Министра индустрии и инфраструктурного развития Республики Казахстан от 23 апреля 2019 года № 243, Министра культуры и спорта Республики Казахстан от 22 апреля 2019 года № 113 и Министра цифрового развития, оборонной и аэрокосмической промышленности Республики Казахстан от 25 апреля 2019 года № 56/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 апреля 2019 года № 18592. Утратил силу совместным приказом Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 5 мая 2026 года № 47, Министра просвещения Республики Казахстан от 8 мая 2026 года № 123-НҚ, Министра здравоохранения Республики Казахстан от от 8 мая 2026 года № 49, и.о. Министра транспорта Республики Казахстан от 23 июня 2026 года № 163, Заместителя Премьер-Министра - Министра культуры и информации Республики Казахстан от 12 июня 2026 года № 289-НҚ, и.о. Министра туризма и спорта Республики Казахстан от 30 апреля 2026 года № 77, Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 10 июня 2026 года № 303/НҚ и Министра промышленности и строительства Республики Казахстан от 29 апреля 2026 года № 210 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
