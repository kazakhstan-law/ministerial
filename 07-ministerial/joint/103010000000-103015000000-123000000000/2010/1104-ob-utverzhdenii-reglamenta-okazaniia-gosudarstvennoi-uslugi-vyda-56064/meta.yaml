requisite: Совместный приказ Председателя Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства от 4 ноября 2010 года № 483, Министра здравоохранения Республики Казахстан от 5 ноября 2010 года № 872 и и.о. Министра охраны окружающей среды Республики Казахстан от 5 ноября 2010 года № 282-ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 декабря 2010 года № 6674. Утратил силу совместным приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 4 июня 2019 года № 358, Министра здравоохранения Республики Казахстан от 19 июня 2019 года № ҚР ДСМ-95 и Министра энергетики Республики Казахстан от 5 июня 2019 года № 207 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Регламента оказания государственной услуги "Выдача лицензий на производство (выпуск) строительных материалов, изделий и конструкций (за исключением сертифицируемой продукции)"
