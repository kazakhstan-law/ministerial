act_code: '13054'
requisite: Совместный приказ Министра здравоохранения Республики Казахстан от 8 августа 2002 года N 772 и Министра государственных доходов Республики Казахстан от 8 августа 2002 года N 674. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 августа 2002 года N 1962. Утратил силу - совместным приказом И.о. Министра здравоохранения РК от 19 октября 2005 года N 533 и Министра финансов РК от 2 ноября 2005 года N 391
title:
  rus: Об утверждении Правил взаимодействия Министерства государственных доходов Республики Казахстан и Министерства здравоохранения Республики Казахстан при импорте и экспорте лекарственных средств, медицинской техники и изделий медицинского назначения
  kaz: Дәрiлiк құралдарды, медицина техникасы мен медициналық мақсаттағы бұйымдарды импорттау мен экспорттау кезiнде Қазақстан Республикасының Мемлекеттiк кiрiс министрлiгi мен Қазақстан Республикасы Денсаулық сақтау министрлiгiнiң Өзара iс-қимылдар ережесiн бекiту туралы
