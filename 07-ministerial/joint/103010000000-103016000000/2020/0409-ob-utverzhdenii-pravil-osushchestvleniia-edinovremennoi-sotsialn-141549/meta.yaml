caused_by:
  code: '147285'
  requisite: Совместный приказ Министра труда и социальной защиты населения Республики Казахстан от 10 октября 2020 года № 396 и Министра здравоохранения Республики Казахстан от 10 октября 2020 года № ҚР ДСМ-124/2020. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 октября 2020 года № 21402. Утратил силу совместным приказом Министра здравоохранения Республики Казахстан от 24 октября 2020 года № ҚР ДСМ-152/2020 и Министра труда и социальной защиты населения Республики Казахстан от 24 октября 2020 года № 413 (вводится в действие с 24 октября 2020 года)
  title:
    rus: О внесении изменений в совместный приказ Министра труда и социальной защиты населения Республики Казахстан от 9 апреля 2020 года № 129 и Министра здравоохранения Республики Казахстан от 9 апреля 2020 года № ҚР ДСМ-35/2020 года «Об утверждении Правил осуществления единовременной социальной выплаты работникам организаций здравоохранения, задействованным в противоэпидемических мероприятиях по борьбе с коронавирусной инфекцией СOVID-19, в случае их заражения или смерти от указанной инфекции или вирусной пневмонии»
    kaz: «Денсаулық сақтау ұйымдарының COVID-19 коронавирустық инфекциясына қарсы күрес жөніндегі эпидемияға қарсы іс-шараларға тартылған қызметкерлері аталған инфекцияны немесе вирустық пневмонияны жұқтырған немесе солардан қайтыс болған жағдайда оларға біржолғы әлеуметтік төлемді жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2020 жылғы 9 сәуірдегі № 129 және Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 9 сәуірдегі № ҚР ДСМ-35/2020 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/147285/rus
