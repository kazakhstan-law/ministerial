act_code: '141549'
requisite: Совместный приказ Министра труда и социальной защиты населения Республики Казахстан от 9 апреля 2020 года № 129 и Министра здравоохранения Республики Казахстан от 9 апреля 2020 года № ҚР ДСМ-35/2020. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 апреля 2020 года № 20355. Утратил силу совместным приказом Министра здравоохранения Республики Казахстан от 24 октября 2020 года № ҚР ДСМ-152/2020 и Министра труда и социальной защиты населения Республики Казахстан от 24 октября 2020 года № 413 (вводится в действие с 24 октября 2020 года)
title:
  rus: Об утверждении Правил осуществления единовременной социальной выплаты работникам системы здравоохранения, в случае их заражения коронавирусной инфекцией или вирусной пневмонией при проведении противоэпидемических мероприятий, а также их семьям, в случае смерти работника независимо от участия в противоэпидемических мероприятиях
  kaz: Денсаулық сақтау жүйесінің қызметкерлері эпидемияға қарсы іс-шаралар жүргізу кезінде коронавирустық инфекцияны немесе вирустық пневмонияны жұқтырған жағдайда оларға, сондай-ақ қызметкер қайтыс болған жағдайда эпидемияға қарсы іс-шараларға қатысу-қатыспауына қарамастан олардың отбасыларына біржолғы әлеуметтік төлемді жүзеге асыру қағидаларын бекіту туралы
