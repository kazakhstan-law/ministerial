requisite: Совместный приказ Министра финансов Республики Казахстан от 21 декабря 2002 года № 625, Министра юстиции Республики Казахстан от 3 декабря 2002 года № 186, Председателя Агентства финансовой полиции Республики Казахстан от 20 декабря 2002 года № 159. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 января 2003 года № 2107. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовой полиции) от 13 августа 2010 года № 143, Министра юстиции Республики Казахстан от 14 сентября 2010 года № 263 и Министра финансов Республики Казахстан от 21 июля 2010 года № 361
title:
