requisite: Совместный приказ Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарата Верховного Суда Республики Казахстан) от 2 сентября 2016 года № 6001-16-7-6/318 и Министра внутренних дел Республики Казахстан от 14 сентября 2016 года № 99 дсп. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 октября 2016 года № 14352
title:
  rus: Об утверждении Правил по обеспечению пропускного и внутриобъектового режимов для судей и работников судебной системы на территории и в зданиях Верховного Суда Республики Казахстан, местных судов Республики Казахстан, Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарата Верховного Суда Республики Казахстан) и его территориальных органов
  kaz: Қазақстан Республикасы Жоғарғы Сотының, Қазақстан Республикасы жергілікті соттарының, Қазақстан Республикасы Жоғарғы Сотының жанындағы Соттардың қызметін қамтамасыз ету департаментінің (Қазақстан Республикасы Жоғарғы Сотының аппаратының) және оның аумақтық органдарының аумағында және ғимараттарында судьялар және сот жүйесінің қызметкерлері үшін өткізу және объектішілік режимдерді қамтамасыз ету жөніндегі қағидаларды бекіту туралы
