act_code: '102939'
requisite: Совместный приказ Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарата Верховного Суда Республики Казахстан) от 3 мая 2016 года № 6001-16-7-6/183 и Министра внутренних дел Республики Казахстан от 5 мая 2016 года № 489. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 июня 2016 года № 13762. Утратил силу совместным приказом Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарат Верховного Суда Республики Казахстан) от 6 апреля 2018 года № 6001-18-7-6/121 и Министра внутренних дел Республики Казахстан от 6 апреля 2018 года № 265 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Правил по обеспечению пропускного и внутриобъектового режимов для посетителей на территории и в зданиях Верховного Суда, местных судов Республики Казахстан, Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарата Верховного Суда Республики Казахстан) и его территориальных органов
  kaz: Қазақстан Республикасы Жоғарғы Сотының, жергілікті соттарының, Қазақстан Республикасы Жоғарғы Сотының жанындағы Соттардың қызметін қамтамасыз ету департаментінің (Қазақстан Республикасы Жоғарғы Соты аппаратының) және оның аумақтық органдарының аумағында және ғимараттарында келушілер үшін арналған өткізу және объектішілік режимдерді қамтамасыз ету жөніндегі қағидаларды бекіту туралы
