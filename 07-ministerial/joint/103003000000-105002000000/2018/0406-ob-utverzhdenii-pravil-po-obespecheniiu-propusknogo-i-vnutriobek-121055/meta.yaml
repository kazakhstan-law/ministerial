act_code: '121055'
requisite: Совместный приказ Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарат Верховного Суда Республики Казахстан) от 6 апреля 2018 года № 6001-18-7-6/121 и Министра внутренних дел Республики Казахстан от 6 апреля 2018 года № 265. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 апреля 2018 года № 16799. Утратил силу совместным приказом Руководителя Судебной администрации Республики Казахстан от 30 июля 2026 года № 5 и Министра внутренних дел Республики Казахстан от 10 августа 2026 года № 568 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил по обеспечению пропускного и внутриобъектового режима на территории и в зданиях Верховного Суда Республики Казахстан, местных судов Республики Казахстан, Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарата Верховного Суда Республики Казахстан) и его территориальных органов
  kaz: Қазақстан Республикасы Жоғарғы Сотының, Қазақстан Республикасы жергілікті соттарының, Қазақстан Республикасы Жоғарғы Сотының жанындағы Соттардың қызметін қамтамасыз ету департаментінің (Қазақстан Республикасының Жоғарғы Соты аппаратының) және оның аумақтық органдарының аумағы мен ғимараттарында өткізу және объектішілік режимді қамтамасыз ету жөніндегі қағидалар
