act_code: '15298'
requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 11 марта 2003 года № 131, Министра индустрии и торговли Республики Казахстан от 31 марта 2003 года № 97 и Председателя Агентства таможенного контроля Республики Казахстан от 17 марта 2003 года № 98. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 апреля 2003 года № 2258. Утратил силу совместным приказом Министра финансов Республики Казахстан от 7 ноября 2014 года № 483, Министра внутренних дел Республики Казахстан от 11 ноября 2014 года № 795 и Приказ Министра по инвестициям и развитию Республики Казахстан от 24 ноября 2014 года № 170
title:
  rus: Об утверждении Инструкции "О взаимодействии и обмене информацией между Министерством внутренних дел, Министерством индустрии и торговли, Агентством таможенного контроля Республики Казахстан о ввозимом, вывозимом гражданском, служебном оружии и патронов к нему, охотничьего пороха, взрывчатых, ядовитых веществ, множительно-копировальной техники цветного изображения
  kaz: '"Қазақстан Республикасының Ішкі істер министрлігі, Индустрия және сауда министрлігі, Кедендік бақылау агенттігі арасындағы өзара іс-қимыл жасасудың және әкелінетін, әкетілетін азаматтық, қызметтік қару мен оның патрондары, аңшылық оқ-дәрі, жарылғыш, улы заттар, түрлі-түсті бейнелеуде көбейту-көшіру техникасы туралы ақпарат алмасу туралы" нұсқаулықты бекіту туралы"'
