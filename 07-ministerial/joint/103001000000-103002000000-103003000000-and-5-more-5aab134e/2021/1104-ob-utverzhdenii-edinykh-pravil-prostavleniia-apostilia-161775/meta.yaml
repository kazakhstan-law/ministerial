  title:
    rus: О внесении изменений в совместный приказ исполняющего обязанности Министра юстиции Республики Казахстан от 4 ноября 2021 года № 950, Министра внутренних дел Республики Казахстан от 15 ноября 2021 года № 702, Министра финансов Республики Казахстан от 16 ноября 2021 года  № 1182, Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарата Верховного Суда Республики Казахстан) от 16 ноября 2021 года № 30, Министра культуры и спорта Республики Казахстан            от 24 ноября 2021 года № 363, исполняющего обязанности Генерального Прокурора Республики Казахстан от 24 ноября 2021 года № 155, Министра образования и науки Республики Казахстан от 29 ноября 2021 года № 574 и Министра обороны Республики Казахстан от 8 декабря 2021 года № 851 «Об утверждении Единых правил проставления апостиля»
    kaz: «Апостиль қоюдың бірыңғай қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің м.а. 2021 жылғы 4 қарашадағы № 950, Қазақстан Республикасы Ішкі істер министрінің 2021 жылғы 15 қарашадағы № 702, Қазақстан Республикасы Қаржы министрінің 2021 жылғы 16 қарашадағы № 1182, Қазақстан Республикасы Жоғарғы Сотының жанындағы Соттардың қызметін қамтамасыз ету департаменті (Қазақстан Республикасы Жоғарғы Соты аппараты) басшысының 2021 жылғы 16 қарашадағы № 30, Қазақстан Республикасы Мәдениет және спорт министрінің 2021 жылғы 24 қарашадағы № 363, Қазақстан Республикасы Бас Прокурорының м.а. 2021 жылғы 24 қарашадағы № 155, Қазақстан Республикасы Білім және ғылым министрінің 2021 жылғы 29 қарашадағы № 574 және Қазақстан Республикасы Қорғаныс министрінің 2021 жылғы 8 желтоқсандағы № 851 бірлескен бұйрығына өзгерістер енгізу туралы
