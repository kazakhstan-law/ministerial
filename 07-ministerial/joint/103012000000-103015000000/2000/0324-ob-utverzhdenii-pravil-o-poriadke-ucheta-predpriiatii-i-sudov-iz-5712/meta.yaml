  code: '19800'
  requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства от 20 апреля 2004 года № 237. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 мая 2004 года № 2850. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 25 октября 2012 года № 18-03/543
  title:
    rus: О внесении изменений в совместный Приказ Министра природных ресурсов и охраны окружающей среды Республики Казахстан от 24 марта 2000 года № 120-П и Министра сельского хозяйства Республики Казахстан от 29 марта 2000 года № 82 "Об утверждении "Правил о порядке учета предприятий и судов, изготавливающих рыбную продукцию для экспорта в страны Европейского Союза, и выдачи Ветеринарного сертификата на данный вид продукции", зарегистрированный за № 1107
    kaz: Қазақстан Республикасы Табиғат ресурстары және қоршаған ортаны қорғау Министрінің 2000 жылғы 24 наурыздағы N 120-П және Қазақстан Республикасы Ауыл шаруашылығи Министрінің 2000 жылғы 29 наурыздағы N 82 "Қазақстан Республикасының Еуропа Одағы елдері үшін балық өнiмiн экспорттауға дайындайтын кәсіпорындар мен кемелерді есептеу және осы өнiм түрiне Ветеринарлық сертификат беру тәртібі туралы Ережесін бекіту туралы" N 1107 тiркелген бірлескен бұйрығына өзгерiс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/19800/rus
