act_code: '5712'
requisite: Совместный приказ Министра природных ресурсов и охраны окружающей среды Республики Казахстан от 24 марта 2000 года № 120-П и Министра сельского хозяйства Республики Казахстан от 29 марта 2000 года № 82. Зарегистрирован в Министерстве юстиции Республики Казахстан 7.04.2000 г. № 1107. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 25 октября 2012 года № 18-03/543
title:
  rus: Об утверждении "Правил о порядке учета предприятий и судов, изготавливающих рыбную продукцию для экспорта в страны Европейского Союза, и выдачи Ветеринарного сертификата на данный вид продукции"
  kaz: '"Европалық Одақ елдерiне экспортқа шығару үшiн балық өнiмдерiн дайындаушы, Қазақстан Республикасының кәсiпорындары мен кемелерiн есепке алу және өнiмнiң осы түрiне Ветеринарлық сертификат беру Тәртiбiн" бекiту туралы'
