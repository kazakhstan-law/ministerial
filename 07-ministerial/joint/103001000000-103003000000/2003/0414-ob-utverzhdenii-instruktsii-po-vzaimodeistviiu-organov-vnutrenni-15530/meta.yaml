caused_by:
  code: '21958'
  requisite: Совместный приказ Министра юстиции Республики Казахстан от 21 октября 2004 года N 306 и Министра внутренних дел Республики Казахстан от 1 ноября 2004 года N 604. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 ноября 2004 года N 3214. Утратил силу совместным приказом Министра юстиции Республики Казахстан от 19 мая 2011 года № 191 и Министра внутренних дел Республики Казахстан от 18 марта 2011 года № 118
  title:
    rus: О внесении изменения в совместный приказ Министра юстиции Республики Казахстан от 15 апреля 2003 года N 66 и Министра внутренних дел Республики Казахстан от 31 марта 2003 года N 164 "Об утверждении Инструкции по взаимодействию органов внутренних дел Республики Казахстан и органов уголовно-исполнительной системы Министерства юстиции Республики Казахстан по обеспечению контроля за прибытием к месту проживания лиц, освобожденных из мест лишения свободы, зарегистрированный за N 2287
    kaz: '"N 2287 болып тіркелген, бас бостандығынан айыру орындарынан босатылған адамдардың тұрғылықты жеріне келіп жетуіне бақылауды қамтамасыз ету жөніндегі Қазақстан Республикасы ішкі істер органдары мен Қазақстан Республикасы қылмыстық-атқару жүйесі органдарының өзара іс-қимылы жөніндегі Нұсқаулықты бекіту туралы" Қазақстан Республикасы Әділет министрінің 2003 жылғы 15 сәуірдегі N 66 және Қазақстан Республикасы Iшкі істер министрінің 2003 жылғы 31 наурыздағы N 164 бірлескен бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/21958/rus
