act_code: '15069'
requisite: Совместный приказ Министра юстиции Республики Казахстан от 1 апреля 2003 года N 58 и Министра внутренних дел Республики Казахстан от 2 апреля 2003 года N 173. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 апреля 2003 года N 2230. Утратил силу - совместным приказом Министра юстиции Республики Казахстан от 9 марта 2005 года N 77 и Министра внутренних дел Республики Казахстан от 10 марта 2005 года N 154
title:
  rus: Об утверждении Инструкции по взаимодействию органов уголовно-исполнительной системы Министерства юстиции Республики Казахстан и органов внутренних дел Республики Казахстан по контролю за образом жизни и поведением лиц, осужденных к наказаниям и иным мерам уголовно-правовой ответственности, не связанным с изоляцией от общества
  kaz: Қазақстан Республикасының Әділет министірлігі қылмыстық-атқару жүйесінің органдары мен Қазақстан Республикасының Ішкі істер органдарының қоғамнан оқшаулауға байланысты емес және қылмыстық-құқықтық жауапкершілігінің өзге шараларына сотталған адамдарының өмір салтына және мінез-құлқына бақылау бойынша өзара байланыс жөніндегі Нұсқаулықты бекіту туралы
