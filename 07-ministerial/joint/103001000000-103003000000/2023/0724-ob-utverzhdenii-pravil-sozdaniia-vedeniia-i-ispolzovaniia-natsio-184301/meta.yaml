    kaz: «Сәйкестендіру нөмірлерінің ұлттық тізілімдерін жасау, жүргізу және пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің міндетін атқарушының 2023 жылғы 24 шілдедегі № 597 және Қазақстан Республикасы Әділет министрінің 2023 жылғы 25 шілдедегі № 524 бірлескен бұйрығына толықтырулар енгізу туралы
