  title:
    rus: О внесении изменений в совместный приказ исполняющего обязанности Министра внутренних дел Республики Казахстан от 24 июля 2023 года № 597 и Министра юстиции Республики Казахстан от 25 июля 2023 года № 524 «Об утверждении Правил создания, ведения и использования Национальных реестров идентификационных номеров»
    kaz: «Жеке сәйкестендіру нөмірлерінің ұлттық тізілімдерін құру, жүргізу және пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің міндетін атқарушының 2023 жылғы 24 шілдедегі № 597 және Қазақстан Республикасы Әділет министрінің 2023 жылғы 25 шілдедегі № 524 бірлескен бұйрығына өзгерістер енгізу туралы
