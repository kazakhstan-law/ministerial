title:
  rus: Об утверждении Правил финансирования проектов цифровизации в области углеводородов и добычи урана в размере одного процента от затрат на добычу, понесенных недропользователем в период добычи углеводородов и урана по итогам предыдущего года
  kaz: Көмірсутектерді және уранды өндіру саласындағы цифрландыру жобаларын алдыңғы жылдың қорытындылары бойынша жер қойнауын пайдаланушының көмірсутектерді және уранды өндіру кезеңінде өндіру үшін шеккен шығындарының бір пайызы мөлшерінде қаржыландыру қағидаларын бекіту туралы
