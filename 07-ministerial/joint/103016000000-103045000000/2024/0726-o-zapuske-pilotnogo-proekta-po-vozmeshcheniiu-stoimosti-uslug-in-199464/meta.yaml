requisite: Совместный приказ Министра труда и социальной защиты населения Республики Казахстан от 26 июля 2024 года № 277 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан 31 июля 2024 года № 459/НҚ
title:
  rus: О запуске пилотного проекта по возмещению стоимости услуг индивидуального помощника местными исполнительными органами на территории городов Астана и Алматы, Акмолинской области через некоммерческое акционерное общество «Государственная корпорация «Правительство для граждан»
  kaz: «Азаматтарға арналған үкімет» мемлекеттік корпорациясы» коммерциялық емес акционерлік қоғамы арқылы Ақмола облысының, Астана және Алматы қалаларының аумағында жеке көмекші қызметтерінің құнын жергілікті атқарушы органдардың өтеуі жөніндегі пилоттық жобаны іске қосу туралы
