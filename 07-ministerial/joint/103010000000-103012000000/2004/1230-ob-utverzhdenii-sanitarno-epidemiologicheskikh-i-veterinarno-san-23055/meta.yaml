act_code: '23055'
requisite: Совместный приказ и.о. Министра здравоохранения Республики Казахстан от 30 декабря 2004 года № 905 и Министра сельского хозяйства Республики Казахстан от 10 января 2005 года № 9. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 февраля 2005 года № 3441. Утратил силу совместным приказом Министра здравоохранения Республики Казахстан от 30 июня 2010 года № 484 и Министра сельского хозяйства Республики Казахстан от 19 июля 2010 года № 454
title:
  rus: Об утверждении санитарно-эпидемиологических и ветеринарно-санитарных правил и норм "Организация эпидемиолого-эпизоотологического надзора и санитарно-противоэпидемических (профилактических) и ветеринарных мероприятий по сибирской язве в Республике Казахстан"
  kaz: '"Қазақстан Республикасында күйдіргі бойынша эпидемиологиялық-эпизоотологиялық және санитарлық-індетке қарсы (профилактикалық) әрі ветеринарлық іс-шараларды ұйымдастыру" санитарлық-эпидемиологиялық және ветеринарлық-санитарлық ережесі мен нормаларын бекіту туралы'
