act_code: '25568'
requisite: Совместный Приказ Генерального прокурора Республики Казахстан от 2 сентября 2005 г. № 46, вице-министра финансов - Председателя Комитета таможенного контроля Министерства финансов Республики Казахстан от 23 августа 2005 г. № 319, Председателя Комитета национальной безопасности Республики Казахстан от 5 сентября 2005 г. № 167, Председателя Налогового комитета Министерства финансов Республики Казахстан от 12 сентября 2005 г. № 404, Председателя Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовая полиция) от 9 сентября 2005 г. № 196. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 октября 2005 года № 3896. Утратил силу приказом Генерального Прокурора Республики Казахстан от 15 марта 2006 года № 17
title:
  rus: Об утверждении Правил взаимодействия органов прокуратуры, национальной безопасности, финансовой полиции, налоговой службы и таможенных органов при проведении совместных проверок налогоплательщиков, участвующих во внешнеэкономической деятельности, по вопросам государственного контроля при применении трансфертных цен
  kaz: Трансферттік бағаларды қолдану кезінде мемлекеттік бақылау мәселесі бойынша сыртқы экономикалық қызметке қатысушы салық төлеушілерге бірлескен тексерулер жүргізу кезіндегі прокуратура, ұлттық қауіпсіздік, қаржы полициясы, салық және кеден қызметтері органдарының өзара iс-қимыл жасау ережесiн бекiту туралы
