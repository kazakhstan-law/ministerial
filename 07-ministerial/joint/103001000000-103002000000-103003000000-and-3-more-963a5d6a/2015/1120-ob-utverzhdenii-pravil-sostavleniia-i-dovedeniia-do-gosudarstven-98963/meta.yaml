  title:
    rus: О признании утратившим силу совместного приказа Министра финансов Республики Казахстан от 20 ноября 2015 года № 576, Министра юстиции Республики Казахстан от 25 января 2016 года № 34, Генерального Прокурора Республики Казахстан от 20 января 2016 года № 6, Министра иностранных дел Республики Казахстан от 30 ноября 2015 года № 11-1-2/539, Председателя Комитета национальной безопасности Республики Казахстан от 14 января 2016 года № 17 и Министра внутренних дел Республики Казахстан от 25 ноября 2015 года № 962 «Об утверждении Правил составления и доведения до государственных органов перечня организаций и лиц, связанных с финансированием терроризма и экстремизма»
    kaz: «Терроризмді және экстремизмді қаржыландырумен байланысты ұйымдар мен тұлғалардың тізбесін жасау және оны мемлекеттік органдардың назарына жеткізу қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 20 қарашадағы № 576, Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 25 қарашадағы № 962, Қазақстан Республикасы Сыртқы істер министрінің 2015 жылғы 30 қарашадағы № 11-1-2/539, Қазақстан Республикасы Бас прокурорының 2016 жылғы 20 қаңтардағы № 6, Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2016 жылғы 14 қаңтардағы № 17, Қазақстан Республикасы Әділет министрінің 2016 жылғы 25 қаңтардағы № 34 бірлескен бұйрығының күші жойылды деп тану туралы
