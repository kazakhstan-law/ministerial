title:
  rus: Об утверждении порядка взаимодействия без интеграции цифровых систем между Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан и Министерством просвещения Республики Казахстан
  kaz: Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің Ұлттық статистика бюросы мен Қазақстан Республикасы Оқу-ағарту министрлігі арасындағы цифрлық жүйелердің интеграциялаусыз өзара іс-қимылы тәртібін бекіту туралы
