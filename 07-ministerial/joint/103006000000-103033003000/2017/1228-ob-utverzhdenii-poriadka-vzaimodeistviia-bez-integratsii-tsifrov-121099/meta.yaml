caused_by:
  code: '226067'
  requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 31 марта 2026 года № 41 и Министра просвещения Республики Казахстан от 30 мая 2026 года № 149-НҚ
  title:
    rus: «О внесении изменений в совместный приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 28 декабря 2017 года №214 и Министра образования и науки Республики Казахстан от 31 января 2018 года № 34 «Об утверждении порядка взаимодействия без интеграции информационных систем между Комитетом по статистике Министерства национальной экономики Республики Казахстан и Министерством образования и науки Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті мен Қазақстан Республикасы Білім және ғылым министрлігі арасындағы ақпараттық жүйелердің интеграциялаусыз өзара іс-қимылы тәртібін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2017 жылғы 28 желтоқсандағы №214 және Қазақстан Республикасы Білім және ғылым министрінің 2018 жылғы 31 қаңтардағы №34 бірлескен бұйрығына өзгерістер енгізу туралы»
