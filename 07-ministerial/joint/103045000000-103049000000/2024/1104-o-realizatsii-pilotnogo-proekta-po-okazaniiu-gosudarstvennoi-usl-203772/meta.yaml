title:
  rus: О реализации пилотного проекта по оказанию государственной услуги «Аккредитация субъектов научной и (или) научно-технической деятельности» посредством информационной системы «Единое окно» национальной инновационной системы
  kaz: Ұлттық инновациялық жүйенің «Бірыңғай терезесі» ақпараттық жүйесі арқылы «Ғылыми және (немесе) ғылыми-техникалық қызмет субъектілерін аккредиттеу» мемлекеттік қызметін көрсету жөніндегі пилоттық жобаны іске асыру туралы
