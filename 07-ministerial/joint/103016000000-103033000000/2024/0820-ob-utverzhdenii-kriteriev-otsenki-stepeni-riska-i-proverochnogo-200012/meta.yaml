act_code: '200012'
requisite: Совместный приказ и.о. Министра труда и социальной защиты населения Республики Казахстан от 20 августа 2024 года № 322 и Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 23 августа 2024 года № 68. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 августа 2024 года № 34976
title:
  rus: Об утверждении критериев оценки степени риска и проверочного листа в области социального обеспечения, в том числе обязательного социального страхования в части своевременного и правильного назначения социальных выплат, своевременного и полного перечисления получателю социальных выплат Государственной корпорацией
  kaz: Әлеуметтік қамсыздандыру, оның ішінде әлеуметтік төлемдердің уақтылы және дұрыс тағайындалуы, Мемлекеттік корпорацияның алушыға әлеуметтік төлемдерді уақтылы және толық аударуы  бөлігінде міндетті әлеуметтік сақтандыру саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
