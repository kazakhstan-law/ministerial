  requisite: Совместный приказ Министра труда и социальной защиты населения Республики Казахстан от 29 мая 2026 года № 218 и Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 29 мая 2026 года № 60. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 мая 2026 года № 38843
  title:
    rus: О внесении изменений в совместный приказ исполняющего обязанности Министра труда и социальной защиты населения Республики Казахстан от 20 августа 2024 года № 322 и Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 23 августа 2024 года № 68 «Об утверждении критериев оценки степени риска и проверочного листа в области социального обеспечения, в том числе обязательного социального страхования в части своевременного и правильного назначения социальных выплат, своевременного и полного перечисления получателю социальных выплат Государственной корпорацией
    kaz: «Әлеуметтік қамсыздандыру, оның ішінде әлеуметтік төлемдердің уақтылы және дұрыс тағайындалуы, Мемлекеттік корпорацияның алушыға әлеуметтік төлемдерді уақтылы және толық аударуы бөлігінде міндетті әлеуметтік сақтандыру саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрі міндетін атқарушысының 2024 жылғы 20 тамыздағы № 322 және Қазақстан Республикасы Премьер-Министрінің орынбасары - Ұлттық экономика министрінің 2024 жылғы 23 тамыздағы № 68 бірлескен бұйрығына өзгерістер енгізу туралы
