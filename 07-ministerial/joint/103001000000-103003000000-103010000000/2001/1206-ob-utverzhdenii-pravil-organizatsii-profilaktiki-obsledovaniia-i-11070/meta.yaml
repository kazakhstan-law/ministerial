act_code: '11070'
requisite: Совместный приказ Министра юстиции Республики Казахстан от 6 декабря 2001 года № 141, Министра внутренних дел Республики Казахстан от 7 декабря 2001 года № 863, Министра здравоохранения Республики Казахстан от 10 декабря 2001 года № 1123. Зарегистрирован Министерством юстиции Республики Казахстан 29 декабря 2001 года № 1713. Утратил силу совместным приказом Министра внутренних дел РК от 24 марта 2005 года № 186, Министра юстиции Республики Казахстан от 28 марта 2005 года № 97, Министра здравоохранения Республики Казахстан от 13 апреля 2005 года № 178
title:
  rus: Об утверждении Правил организации профилактики, обследования и лечения лиц, содержащихся в местах содержания под стражей, специальных учреждениях МВД и учреждениях уголовно-исполнительной системы Министерства юстиции Республики Казахстан, больных инфекциями, передаваемыми преимущественно половым путем
  kaz: Қазақстан Республикасы Iшкiiсминiнiң арнайы мекемелерiнде, қамауда ұстау орындарында және Әдiлет министрлiгiнiң қылмыстық-атқару жүйесi мекемелерiнде көбiнесе жыныстық жолмен жұғатын жұқпалы аурулармен ауыратын тұлғаларды тексеру және емдеудi ұйымдастыру, алдын алу Ережелерiн бекiту туралы
