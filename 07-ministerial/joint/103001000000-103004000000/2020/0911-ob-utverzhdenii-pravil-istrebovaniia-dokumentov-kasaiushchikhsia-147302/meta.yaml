act_code: '147302'
requisite: Совместный приказ Министра иностранных дел Республики Казахстан от 11 сентября 2020 года № 11-1-4/252 и Министра юстиции Республики Казахстан от 6 октября 2020 года № 460. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 октября 2020 года № 21405
title:
  rus: Об утверждении Правил истребования документов, касающихся обеспечения прав и законных интересов граждан Республики Казахстан, иностранных граждан и лиц без гражданства, через учреждения Министерства иностранных дел Республики Казахстан
  kaz: Қазақстан Республикасы Сыртқы iстер министрлiгiнің мекемелерi арқылы Қазақстан Республикасы азаматтарының, шетелдiк азаматтар мен азаматтығы жоқ тұлғалардың құқықтары мен заңды мүдделерiн қамтамасыз етуге қатысты құжаттарды талап ету қағидаларын бекіту туралы
