  kaz: Қазақстан Республикасы Сыртқы iстер министрлiгiнің мекемелерi арқылы Қазақстан Республикасы азаматтарының, шетелдiк азаматтар мен азаматтығы жоқ тұлғалардың құқықтары мен заңды мүдделерiн қамтамасыз етуге қатысты құжаттарды талап ету қағидаларын бекіту туралы
