  requisite: Совместный приказ Министра иностранных дел Республики Казахстан от 29 сентября 2025 года № 11-1-4/572 и Министра юстиции Республики Казахстан от 30 сентября 2025 года № 535. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 сентября 2025 года № 36980
  title:
    rus: О внесении изменения в совместный приказ Министра иностранных дел Республики Казахстан от 11 сентября 2020 года № 11-1-4/252 и Министра юстиции Республики Казахстан от 6 октября 2020 года № 460 «Об утверждении Правил истребования документов, касающихся обеспечения прав и законных интересов граждан Республики Казахстан, иностранных граждан и лиц без гражданства, через учреждения Министерства иностранных дел Республики Казахстан»
    kaz: «Қазақстан Республикасы Сыртқы iстер министрлiгiнің мекемелерi арқылы Қазақстан Республикасы азаматтарының, шетелдiк азаматтар мен азаматтығы жоқ тұлғалардың құқықтары мен заңды мүдделерiн қамтамасыз етуге қатысты құжаттарды талап ету қағидаларын бекіту туралы» Қазақстан Республикасы Сыртқы істер министрінің 2020 жылғы 11 қыркүйектегі № 11-1-4/252 және Қазақстан Республикасы Әділет министрінің 2020 жылғы 6 қазандағы № 460 бірлескен бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/214942/rus
