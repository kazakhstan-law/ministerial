act_code: '12572'
requisite: Совместный приказ Министра иностранных дел Республики Казахстан от 22 мая 2002 года N 08-1/1 и Министра юстиции Республики Казахстан от 28 июня 2002 года N 98. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 июня 2002 года N 1899. Утратил силу совместным приказом Министра иностранных дел Республики Казахстан от 11 сентября 2020 года № 11-1-4/252 и Министра юстиции Республики Казахстан от 6 октября 2020 года № 460 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил истребования документов, касающихся обеспечения прав и законных интересов граждан Республики Казахстан, иностранных граждан и лиц без гражданства через учреждения Министерства иностранных дел Республики Казахстан
  kaz: Қазақстан Республикасы Сыртқы iстер министрлiгінің мекемелерi арқылы Қазақстан Республикасы азаматтарының, шетелдiк азаматтар мен азаматтығы жоқ тұлғалардың құқықтары мен заңды мүдделерiн қамтамасыз етуге қатысты құжаттарды талап ету Ережесiн бекiту туралы
