  title:
    rus: «О внесении изменений и дополнения в совместный приказ Генерального Прокурора Республики Казахстан от 26 декабря 2022 года № 256, и.о. Председателя Агентства Республики Казахстан по финансовому мониторингу от 26 декабря 2022 года № 40, и.о. Министра внутренних дел Республики Казахстан от 28 декабря 2022 года № 1009, Министра по чрезвычайным ситуациям Республики Казахстан от 29 декабря 2022 года № 358 и Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 29 декабря 2022 года № 485 «Об утверждении Правил формирования и работы конкурсной комиссии, сроков проведения этапов конкурса, а также перечень документов, необходимых для участия в конкурсе на занятие вакантной и временно вакантной должности в правоохранительных органах»
    kaz: «Конкурстық комиссияны қалыптастыру және оның жұмыс істеу қағидаларын, конкурс кезеңдерін өткізу мерзімдерін, сондай-ақ құқық қорғау органдарындағы бос және уақытша бос лауазымға орналасуға арналған конкурсқа қатысу үшін қажетті құжаттар тізбесін бекіту туралы» Қазақстан Республикасы Бас прокурорының 2022 жылғы 26 желтоқсандағы № 256, Қазақстан Республикасы Қаржылық мониторинг агенттігі Төрағасының м.а. 2022 жылғы 26 желтоқсандағы № 40, Қазақстан Республикасы Ішкі істер министрінің м.а. 2022 жылғы 28 желтоқсандағы № 1009, Қазақстан Республикасы Төтенше жағдайлар министрінің 2022 жылғы 29 желтоқсандағы № 358 және Қазақстан Республикасы Сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі (Сыбайлас жемқорлыққа қарсы қызмет) Төрағасының 2022 жылғы 29 желтоқсандағы № 485 бірлескен бұйрығына өзгерістер мен толықтыру енгізу туралы»
