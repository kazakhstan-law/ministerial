title:
  rus: Об утверждении Правил формирования и работы конкурсной комиссии, сроков проведения этапов конкурса, а также перечень документов, необходимых для участия в конкурсе на занятие вакантной и временно вакантной должности в правоохранительных органах
  kaz: Конкурстық комиссияны қалыптастыру және оның жұмыс істеу қағидаларын, конкурс кезеңдерін өткізу мерзімдерін, сондай-ақ құқық қорғау органдарындағы бос және уақытша бос лауазымға орналасуға арналған конкурсқа қатысу үшін қажетті құжаттар тізбесін бекіту туралы
