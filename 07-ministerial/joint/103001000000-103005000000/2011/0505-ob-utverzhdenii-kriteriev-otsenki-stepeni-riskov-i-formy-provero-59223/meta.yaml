requisite: Совместный приказ Министра юстиции Республики Казахстан от 5 мая 2011 года № 177 и и.о. Министра экономического развития и торговли Республики Казахстан от 18 мая 2011 года № 138. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 мая 2011 года № 6975. Утратил силу совместным приказом Министра юстиции Республики Казахстан от 28 сентября 2018 года № 1460 и Министра национальной экономики Республики Казахстан от 1 ноября 2018 года № 54 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
