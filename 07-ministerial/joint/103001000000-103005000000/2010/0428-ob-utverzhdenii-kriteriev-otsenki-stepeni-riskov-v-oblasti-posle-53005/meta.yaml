requisite: Совместный приказ Министра юстиции Республики Казахстан от 28 апреля 2010 года № 148 и Министра экономического развития и торговли Республики Казахстан от 5 мая 2010 года № 30. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 июня 2010 года № 6273. Утратил силу совместным приказом Министра юстиции Республики Казахстан от 5 мая 2011 года № 177 и и.о. Министра экономического развития и торговли Республики Казахстан от 18 мая 2011 года № 138
title:
  rus: Об утверждении критериев оценки степени рисков в области последующего официального опубликования текстов нормативных правовых актов и формы проверочного листа на предмет соблюдения законодательства Республики Казахстан в области последующего официального опубликования текстов нормативных правовых актов
  kaz: Нормативтік құқықтық актілердің мәтiндерiн кейiннен ресми жариялау саласындағы тәуекел дәрежесін бағалау өлшемдерін және нормативтік құқықтық актілердің мәтiндерiн кейiннен ресми жариялау саласындағы Қазақстан Республикасы заңнамасын сақталу мәніне тексеру парағының нысанын бекіту туралы
