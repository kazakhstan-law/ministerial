  title:
    rus: О внесении изменения в Совместный приказ Министра энергетики Республики Казахстан от 8 октября 2024 года № 359, Председателя Комитета национальной безопасности Республики Казахстан от 8 октября 2024 года № 855/қе-қа, Министра финансов Республики Казахстан от 8 октября 2024 года № 680, Министра внутренних дел Республики Казахстан от 8 октября 2024 № 747 «О некоторых вопросах вывоза нефтепродуктов с территории Республики Казахстан»
    kaz: «Қазақстан Республикасы аумағынан мұнай өнімдерін әкетудің кейбір мәселелері туралы» Қазақстан Республикасы Энергетика министрінің 2024 жылғы 8 қазандағы № 359, Қазақстан Республикасы Ұлттық қауіпсіздік комитеті төрағасының 2024 жылғы 8 қазандағы № 855/қе-қа, Қазақстан Республикасы Қаржы министрінің 2024 жылғы 8 қазандағы № 680 және Қазақстан Республикасы Ішкі істер министрінің 2024 жылғы 8 қазандағы № 747 бірлескен бұйрығына өзгеріс енгізу туралы
