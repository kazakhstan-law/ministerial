title:
  rus: О реализации пилотного проекта по автоматизации жизненной ситуации «Применение искусственного интеллекта при передаче показаний с приборов учёта через мобильное приложение «электронного правительства» для расчёта потреблённого объёма газа»
  kaz: «Тұтынылған газ көлемін есептеу үшін «электрондық үкіметтің» мобильді қосымшасы арқылы есепке алу аспаптарынан көрсетілімдерді беру кезінде жасанды интеллектіні қолдану» өмірлік ахуалды автоматтандыру жөніндегі пилоттық жобаны іске асыру туралы
