requisite: Совместный приказ Министра связи и информации Республики Казахстан от 31 августа 2011 года № 264 и Министра экономического развития и торговли Республики Казахстан от 16 сентября 2011 года № 307. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 октября 2011 года № 7263. Утратил силу совместным приказом Министра по инвестициям и развитию Республики Казахстан от 29 июня 2015 года № 734 и и.о. Министра национальной экономики Республики Казахстан от 30 июня 2015 года № 493
title:
  rus: Об утверждении форм проверочных листов в сфере частного предпринимательства в области информатизации, связи, за соблюдением законодательства Республики Казахстан об электронном документе и электронной цифровой подписи
  kaz: Ақпараттандыру, байланыс саласындағы, электрондық құжат және электрондық цифрлық қолтаңба туралы Қазақстан Республикасы заңнамасының сақталуына жеке кәсіпкерлік саласындағы тексеру парақтарының нысандарын бекіту туралы
