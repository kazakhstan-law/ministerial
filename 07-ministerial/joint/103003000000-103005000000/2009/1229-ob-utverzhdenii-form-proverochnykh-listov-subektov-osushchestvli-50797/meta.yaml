act_code: '50797'
requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 29 декабря 2009 года № 506 и Министра экономики и бюджетного планирования Республики Казахстан от 10 февраля 2010 года № 42. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2010 года № 6071
title:
  rus: Об утверждении форм проверочных листов субъектов, осуществляющих деятельность по монтажу, наладке и техническому обслуживанию средств охранной сигнализации, за исключением деятельности при выполнении строительно-монтажных работ, субъектов охранной деятельности, а также субъектов с хранением гражданского и служебного оружия и патронов к нему, взрывчатых веществ и материалов, гражданских пиротехнических веществ и изделий с их применением, ядовитых веществ, множительно-копировальной техники цветного изображения и штемпельно-граверных предприятий по изготовлению печатей и штампов
  kaz: Құрылыс-монтаждау жұмысын орындау кезіндегі қызметті қоспағанда, күзет сигнализациясы құралдарын монтаждау, ретке келтіру және оларға техникалық қызмет көрсету жөніндегі қызметті жүзеге асыратын субъектілердің, күзет қызметі субъектілерінің, сондай-ақ азаматтық және қызметтік қару мен оның патрондарын, жарылғыш заттар мен материалдарды, азаматтық пиротехникалық заттар мен оларды қолданып жасалған бұйымдарды, улы заттарды, түрлі-түсті көбейту-көшіру техникасын сақтайтын субъектілердің және мөрлер мен мөртаңбаларды дайындау жөніндегі штемпельдік-граверлік кәсіпорындардың тексеру парақтарының нысандарын бекіту туралы
