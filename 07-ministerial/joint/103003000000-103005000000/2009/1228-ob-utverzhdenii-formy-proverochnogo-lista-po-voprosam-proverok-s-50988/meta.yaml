requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 28 декабря 2009 года № 503 и Министра экономики и бюджетного планирования Республики Казахстан от 16 февраля 2010 года № 61. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2010 года № 6077. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 15 августа 2019 года № 721 и Министра национальной экономики Республики Казахстан от 16 августа 2019 года № 75 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении формы проверочного листа по вопросам проверок субъектов, осуществляющих деятельность в сфере оборота наркотических средств, психотропных веществ и прекурсоров
  kaz: Есірткі құралдарының, психотроптық заттар мен прекурсорлардың айналымы саласындағы қызметті жүзеге асыратын субъектілерді тексеру мәселелері бойынша тексеру парағының нысанын бекіту туралы
