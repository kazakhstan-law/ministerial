act_code: '58876'
requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 28 марта 2011 года № 132 и Министра экономического развития и торговли Республики Казахстан от 11 апреля 2011 года № 100. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 апреля 2011 года № 6916. Утратил силу совместным приказом Министра внутренних дел РК от 29 мая 2013 года № 359 и Первого заместителя Премьер-Министра РК - Министра регионального развития РК от 27 июня 2013 года № 113/НҚ
title:
  rus: Об утверждении критериев оценки степени риска в сфере частного предпринимательства за деятельностью физических и юридических лиц, занятых в сфере оборота гражданского и служебного оружия и патронов к нему, гражданских пиротехнических веществ и изделий с их применением, за соблюдением установленных правил обращения и функционирования взрывчатых и ядовитых веществ, за охранной деятельностью, за множительно-копировальной техникой цветного изображения, а также деятельностью штемпельно-граверных предприятий и субъектов, осуществляющих деятельность по монтажу, наладке и техническому обслуживанию средств охранной сигнализации, за исключением деятельности при выполнении строительно-монтажных работ
  kaz: Жеке кәсіпкерлік саласында азаматтық және қызметтік қару мен оның патрондарының, азаматтық пиротехникалық заттар мен оларды қолданып жасалған бұйымдардың айналымы саласында жұмыспен қамтылған жеке және заңды тұлғалардың қызметінің, жарылғыш және улы заттартарды қолдану мен олардың жұмыс істеуінің белгіленген қағидаларының сақталуының, күзет қызметі, түрлі-түсті бейнелі көбейткіш-көшіргіш техниканың, сондай-ақ штемпельдік-гравюралық кәсіпорындардың қызметінің және құрылыс-монтаждау жұмысын орындау кезіндегі қызметті қоспағанда, күзет сигнализациясы құралдарын монтаждау, ретке келтіру және оларға техникалық қызмет көрсету жөніндегі қызметті жүзеге асыратын субъектілер қызметінің тәуекел дәрежесін бағалау критерийлерін бекіту туралы
