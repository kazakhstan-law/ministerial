act_code: '58958'
requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 28 марта 2011 года № 131 и Министра экономического развития и торговли Республики Казахстан от 11 апреля 2011 года № 101. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 апреля 2011 года № 6917. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 23 июня 2015 года № 556 и Министра национальной экономики Республики Казахстан от 29 июня 2015 года № 465
title:
  rus: Об утверждении форм проверочных листов в сфере частного предпринимательства за деятельностью по монтажу, наладке и техническому обслуживанию средств охранной сигнализации, охранной деятельностью, а также оборотом гражданского и служебного оружия и патронов к нему, взрывчатых веществ, гражданских пиротехнических веществ и изделий с их применением
  kaz: Күзет сигнализациясы құралдарын монтаждау, ретке келтіру және техникалық қызмет көрсету, күзет қызметі, сондай-ақ азаматтық және қызметтік қару мен оның патрондарының, жарылғыш заттар, азаматтық пиротехникалық заттар мен оларды қолданып жасалған бұйымдардың айналымы бойынша қызметіне жеке кәсіпкерлік саласында тексеру парақтарының нысандарын бекіту туралы
