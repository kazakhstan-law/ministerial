  code: '73947'
  requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 29 мая 2013 года № 359 и Первого заместителя Премьер-Министра Республики Казахстан - Министра регионального развития Республики Казахстан от 27 июня 2013 года № 113/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 августа 2013 года № 8592. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 23 июня 2015 года № 556 и Министра национальной экономики Республики Казахстан от 29 июня 2015 года № 465
  title:
    rus: Об утверждении критериев оценки степени риска в сфере частного предпринимательства в области деятельности по монтажу, наладке и техническому обслуживанию средств охранной сигнализации, охранной деятельности, оборота гражданского и служебного оружия и патронов к нему, взрывчатых веществ, гражданских пиротехнических веществ и изделий с их применением и внесении изменений в совместный приказ Министра внутренних дел Республики Казахстан от 28 марта 2011 года № 131 и Министра экономического развития и торговли Республики Казахстан от 11 апреля 2011 года № 101 "Об утверждении форм проверочных листов субъектов в сфере частного предпринимательства осуществляющих деятельность по монтажу, наладке и техническому обслуживанию средств охранной сигнализации, за исключением деятельности при выполнении строительно-монтажных работ, за охранной деятельностью, а также за деятельностью физических и юридических лиц, занятых в сфере оборота гражданского и служебного оружия и патронов к нему, с хранением и использованием взрывчатых веществ, гражданских пиротехнических веществ и изделий с их применением, ядовитых веществ, множительно-копировальной техники цветного изображения и штемпельно-граверных предприятий
    kaz: '"Күзет сигнализациясы құралдарын монтаждау, ретке келтіру және оларға техникалық қызмет көрсету, күзет қызметі, азаматтық және қызметтік қару мен оның патрондарының, жарылғыш заттар, азаматтық пиротехникалық заттар мен оларды қолданып жасалған бұйымдардың айналымы саласында жеке кәсіпкерлік саласында тәуекел дәрежесін бағалау критерийлерін бекіту туралы және "Жеке кәсіпкерлік саласында құрылыс-монтаждау жұмысын орындау кезіндегі қызметті қоспағанда, күзет сигнализациясы құралдарын монтаждау, ретке келтіру және оларға техникалық қызмет көрсету жөніндегі қызметті жүзеге асыратын, күзет қызметі субъектілерін, сондай-ақ азаматтық және қызметтік қару мен оның патрондарының, азаматтық пиротехникалық заттар мен оларды қолданып жасалған бұйымдардың айналымы саласында жұмыспен қамтылған, жарылғыш және улы заттарды қолданатын, сақтайтын жеке және заңды тұлғалардың, түрлі-түсті бейнелі көбейткіш-көшіргіш техниканың, сондай-ақ штемпельдік-гравюралық кәсіпорындардың қызметін тексеру парақтарының нысандарын бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2011 жылғы 28 наурыздағы № 131 және Қазақстан Республикасы Экономикалық даму және сауда министрінің 2011 жылғы 11 сәуірдегі № 101 бірлескен бұйрығына өзгерістер енгізу туралы"'
