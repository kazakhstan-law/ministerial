  code: '85824'
  requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 20 сентября 2014 года № 625 и Министра национальной экономики Республики Казахстан от 3 октября 2014 года № 42. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 ноября 2014 года № 9861. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 23 июня 2015 года № 556 и Министра национальной экономики Республики Казахстан от 29 июня 2015 года № 465
  title:
    rus: О внесении изменения в совместный приказ Министра внутренних дел Республики Казахстан от 28 марта 2011 года № 131 и Министра экономического развития и торговли Республики Казахстан от 11 апреля 2011 года № 101 "Об утверждении форм проверочных листов в сфере частного предпринимательства за деятельностью по монтажу, наладке и техническому обслуживанию средств охранной сигнализации, охранной деятельностью, а также оборотом гражданского и служебного оружия и патронов к нему, взрывчатых веществ, гражданских пиротехнических веществ и изделий с их применением"
    kaz: '"Күзет сигнализациясы құралдарын монтаждау, ретке келтіру және оларға техникалық қызметіне, күзет қызметіне, сондай-ақ азаматтық және қызметтік қару мен оның патрондарының, жарылғыш заттар, азаматтық пиротехникалық заттар мен оларды қолданып жасалған бұйымдардың айналымына жеке жеке кәсіпкерлік саласында тексеру парақтарының нысандарын бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2011 жылғы 28 наурыздағы № 131 және Қазақстан Республикасы Экономикалық даму және сауда министрінің 2011 жылғы 11 сәуірдегі № 101 бірлескен бұйрығына өзгеріс енгізу туралы"'
  link: https://zan.gov.kz/client/#!/doc/85824/rus
