requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 11 августа 2011 года № 410 и и.о. Министра экономического развития и торговли Республики Казахстан от 12 августа 2011 года № 241. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 августа 2011 года № 7142. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 28 июля 2014 года № 471 и Министра регионального развития Республики Казахстан от 4 августа 2014 года № 231/ОД
title:
  rus: Об утверждении критериев оценки степени риска субъектов частного предпринимательства, осуществляющих деятельность в сфере оборота наркотических средств, психотропных веществ и прекурсоров
  kaz: Есірткі құралдарының, психотроптық заттар мен прекурсорлардың айналымы саласындағы қызметті жүзеге асыратын жеке кәсіпкерлік субъектілерінің тәуекел дәрежесін бағалау өлшемдерін бекіту туралы
