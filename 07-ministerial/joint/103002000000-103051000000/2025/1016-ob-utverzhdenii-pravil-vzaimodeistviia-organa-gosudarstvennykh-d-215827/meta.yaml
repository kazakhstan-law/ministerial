act_code: '215827'
requisite: Совместный приказ Министра финансов Республики Казахстан от 16 октября 2025 года № 612 и Министра транспорта Республики Казахстан от 16 октября 2025 года № 343
title:
  rus: Об утверждении Правил взаимодействия органа государственных доходов с уполномоченным органом в сфере гражданской авиации по представлению заключения при проведении тематической проверки по подтверждению достоверности сумм налога на добавленную стоимость, предъявленных к возврату, подтверждающего факт осуществления рейса воздушным судном иностранной авиакомпании и количество реализованных горюче-смазочных материалов (в разрезе авиакомпаний)
  kaz: Мемлекеттік кірістер органының азаматтық авиация саласындағы уәкілетті органмен қайтаруға ұсынылған қосылған құн салығы сомасының анықтығын растау бойынша тақырыптық тексеру жүргiзу кезінде шетелдiк авиакомпания әуе кемесiнiң рейстi жүзеге асыру фактiсiн және өткiзiлген жанар-жағармай материалдарының (авиакомпаниялар бөлінісінде) мөлшерiн растайтын қорытындыны ұсыну бойынша өзара іс-қимыл қағидаларын бекіту туралы
