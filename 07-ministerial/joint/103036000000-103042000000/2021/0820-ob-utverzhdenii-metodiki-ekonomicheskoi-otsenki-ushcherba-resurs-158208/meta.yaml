    kaz: «Жер қойнауы ресурстары залалын экономикалық бағалау әдістемесін бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2021 жылғы 20 тамыздағы № 457 және Қазақстан Республикасы Энергетика министрінің 2021 жылғы 23 тамыздағы № 274 бірлескен бұйрығына өзгерістер енгізу туралы
