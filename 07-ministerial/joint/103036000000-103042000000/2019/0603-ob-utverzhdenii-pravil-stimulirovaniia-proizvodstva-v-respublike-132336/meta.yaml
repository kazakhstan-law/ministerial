  requisite: Совместный приказ и.о. Министра экологии, геологии и природных ресурсов Республики Казахстан от 18 мая 2021 года № 147 и и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 27 мая 2021 года № 268. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 мая 2021 года № 22878. Утратил силу совместным приказом Министра экологии и природных ресурсов Республики Казахстан от 12 октября 2023 года № 277 и Министра промышленности и строительства Республики Казахстан от 13 октября 2023 года № 26
  title:
    rus: 'О внесении изменений в совместный приказ исполняющего обязанности Министра энергетики Республики Казахстан от 3 июня 2019 года № 205 и Министра индустрии и инфраструктурного развития Республики Казахстан от 5 июня 2019 года № 368 «Об утверждении Правил стимулирования производства в Республике Казахстан кабельно-проводниковой продукции: экологически безопасной (негорючей и (или) с пониженной пожароопасностью и малым дымо- и газовыделением); отходы которой являются перерабатываемыми на территории Республики Казахстан»'
    kaz: «Қазақстан Республикасында экологиялық қауіпсіз (жанбайтын және (немесе) өрт қауіптілігі төмен және түтін мен газды аз бөлетін); қалдықтары Қазақстан Республикасының аумағында қайта өңделетін болып табылатын кәбілді-өткізгіш өнімнің өндірісін ынталандыру қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2019 жылғы 3 маусымдағы № 205 және Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 5 маусымдағы № 368 бірлескен бұйрығына өзгерістер енгізу туралы
