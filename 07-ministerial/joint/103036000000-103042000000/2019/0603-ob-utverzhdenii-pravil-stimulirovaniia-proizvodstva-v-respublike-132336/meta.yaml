requisite: Совместный приказ и.о. Министра энергетики Республики Казахстан от 3 июня 2019 года № 205 и Министра индустрии и инфраструктурного развития Республики Казахстан от 5 июня 2019 года № 368. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 июня 2019 года № 18822. Утратил силу совместным приказом Министра экологии и природных ресурсов Республики Казахстан от 12 октября 2023 года № 277 и Министра промышленности и строительства Республики Казахстан от 13 октября 2023 года № 26
title:
  rus: 'Об утверждении Правил стимулирования производства в Республике Казахстан кабельно-проводниковой продукции: экологически безопасной (негорючей и (или) с пониженной пожароопасностью и малым дымо- и газовыделением); отходы которой являются перерабатываемыми на территории Республики Казахстан'
  kaz: Қазақстан Республикасында экологиялық қауіпсіз (жанбайтын және (немесе) өрт қауіптілігі төмен және түтін мен газды аз бөлетін); қалдықтары Қазақстан Республикасының аумағында қайта өңделетін болып табылатын кәбілді-өткізгіш өнімнің өндірісін ынталандыру қағидаларын бекіту туралы
