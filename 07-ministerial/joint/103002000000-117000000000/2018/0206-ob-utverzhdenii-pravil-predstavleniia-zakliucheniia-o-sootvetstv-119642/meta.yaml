act_code: '119642'
requisite: Совместные приказ Министра финансов Республики Казахстан от 6 февраля 2018 года № 130 и постановление Правления Национального Банка Республики Казахстан от 26 февраля 2018 года № 23. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 марта 2018 года № 16569. Утратили силу совместными приказом Министра финансов Республики Казахстан от 25 ноября 2025 года № 724 и постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 27 ноября 2025 года № 74 (вводятся в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил представления заключения о соответствии размера страховых резервов по незаработанным премиям, непроизошедшим убыткам, заявленным, но неурегулированным убыткам, произошедшим, но незаявленным убыткам требованиям, установленным законодательством Республики Казахстан о страховании и страховой деятельности
  kaz: Еңбекпен табылмаған сыйлықақылар, болмаған залалдар, мәлімделген, бірақ реттелмеген залалдар, болған, бірақ мәлімделмеген залалдар бойынша сақтандыру резервтері мөлшерінің Қазақстан Республикасының сақтандыру және сақтандыру қызметі туралы заңнамасында белгіленген талаптарға сәйкестігі туралы қорытындыны ұсыну қағидаларын бекіту туралы
