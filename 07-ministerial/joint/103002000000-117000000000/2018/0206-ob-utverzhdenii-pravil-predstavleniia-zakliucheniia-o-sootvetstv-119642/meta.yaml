caused_by:
  code: '154573'
  requisite: Совместные приказ Министра финансов Республики Казахстан от 7 апреля 2021 года № 312 и постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 8 апреля 2021 года № 53. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 апреля 2021 года № 22525. Утратили силу совместными приказом Министра финансов Республики Казахстан от 25 ноября 2025 года № 724 и постановлением Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 27 ноября 2025 года № 74 (вводятся в действие с 1 января 2026 года)
  title:
    rus: О внесении изменения в совместные приказ Министра финансов Республики Казахстан от 6 февраля 2018 года № 130 и постановление Правления Национального Банка Республики Казахстан от 26 февраля 2018 года № 23 «Об утверждении Правил представления заключения о соответствии размера страховых резервов по незаработанным премиям, непроизошедшим убыткам, заявленным, но неурегулированным убыткам, произошедшим, но незаявленным убыткам требованиям, установленным законодательством Республики Казахстан о страховании и страховой деятельности»
    kaz: «Еңбекпен табылмаған сыйлықақылар, болмаған залалдар, мәлімделген, бірақ реттелмеген залалдар, болған, бірақ мәлімделмеген залалдар бойынша сақтандыру резервтері мөлшерінің Қазақстан Республикасының сақтандыру және сақтандыру қызметі туралы заңнамасында белгіленген талаптарға сәйкестігі туралы қорытындыны ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 6 ақпандағы № 130 және Қазақстан Республикасы Ұлттық Банкі Басқармасының 2018 жылғы 26 ақпандағы № 23 бірлескен бұйрығына және қаулысына өзгерту енгізу туралы
