act_code: '19893'
requisite: Совместный приказ Министра юстиции Республики Казахстан от 25 мая 2004 года № 145 и Министра здравоохранения Республики Казахстан от 7 мая 2004 года № 405. Зарегистрирован Министерством юстиции Республики Казахстан 27 мая 2004 года № 2876. Утратил силу совместным приказом Министра юстиции Республики Казахстан от 6 мая 2010 года № 157, Министра здравоохранения Республики Казахстан от 18 мая 2010 года № 350 и Министра внутренних дел Республики Казахстан от 14 июня 2010 года № 272
title:
  rus: Об утверждении нормативных правовых актов, регулирующих лечебно-профилактическое обеспечение и санитарно-эпидемиологическое благополучие лиц, содержащихся в исправительных учреждениях и следственных изоляторах органов юстиции Республики Казахстан
  kaz: Қазақстан Республикасы әділет органдарының түзеу мекемелерінде және тергеу изоляторында ұсталатын адамдарды емдеу-алдын-алу және санитарлық-эпидемиялогиялық саулығын қамтамасыз етуді реттейтін нормативтік құқықтық актілерді бекіту туралы
