  requisite: Совместный приказ Министра юстиции Республики Казахстан от 12 декабря 2008 года № 338 и Министра здравоохранения Республики Казахстан от 18 декабря 2008 года № 651. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 января 2009 года № 5506. Утратил силу совместным приказом Министра юстиции Республики Казахстан от 6 мая 2010 года № 157, Министра здравоохранения Республики Казахстан от 18 мая 2010 года № 350 и Министра внутренних дел Республики Казахстан от 14 июня 2010 года № 272
  title:
    rus: О внесении изменения в совместный приказ Министра юстиции Республики Казахстан от 25 мая 2004 года № 145 и Министра здравоохранения Республики Казахстан от 7 мая 2004 года № 405 «Об утверждении нормативных правовых актов, регулирующих лечебно-профилактическое обеспечение и санитарно-эпидемиологическое благополучие лиц, содержащихся в исправительных учреждениях и следственных изоляторах органов юстиции Республики Казахстан»
    kaz: '"Қазақстан Республикасы әділет органдарының түзеу мекемелерінде және тергеу изоляторында ұсталатын адамдарды емдеу-алдын алу және санитарлық-эпидемиялогиялық саулығын қамтамасыз етуді реттейтін нормативтік құқықтық актілерді бекіту туралы" Қазақстан Республикасы Әділет министрінің 2004 жылғы 25 мамырдағы N 145, Қазақстан Республикасы Денсаулық сақтау министрінің 2004 жылғы 7 мамырдағы N 405 бірлескен бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/43684/rus
