    kaz: '"Психикалық ауытқулардан зардап шегетiн бас бостандығынан айыруға сотталғандарды ұстау және емдеуге арналған психиатриялық емхана Ережесін бекiту туралы" Қазақстан Республикасының Әдiлет министрiнiң 2001 жылғы 11 желтоқсандағы N 156 және Қазақстан Республикасының Денсаулық сақтау министрiнiң 2001 жылғы 24 желтоқсандағы N 1153 бiрлескен бұйрығына өзгерiстер енгiзу туралы'
