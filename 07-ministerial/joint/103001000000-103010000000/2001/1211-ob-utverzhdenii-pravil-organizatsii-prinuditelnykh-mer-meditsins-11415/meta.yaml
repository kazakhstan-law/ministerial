  code: '13834'
  requisite: Совместный приказ Министра юстиции Республики Казахстан от 20 ноября 2002 года N 166, Министра здравоохранения Республики Казахстан от 25 сентября 2002 года N 891. Зарегистрирован Министерством юстиции Республики Казахстан 12 декабря 2002 года N 2082. Утратил силу совместным приказом Министра юстиции Республики Казахстан от 8 апреля 2005 года N 108, Министра здравоохранения Республики Казахстан от 13 апреля 2005года N 177
  title:
    rus: О внесении изменений в совместный приказ Министра юстиции Республики Казахстан от 11 декабря 2001 года N 155 и Министра здравоохранения Республики Казахстан от 23 января 2002 года N 68 "Об утверждении Правил организации принудительных мер медицинского характера в исправительных учреждениях уголовно-исполнительной системы Министерства юстиции Республики Казахстан"
    kaz: '"Қазақстан Республикасы Әдiлет министрлiгi Қылмыстық атқару жүйесi мекемелерiнде медициналық сипаттағы мәжбүрлеу шараларын ұйымдастыру Ережесiн бекiту туралы" Қазақстан Республикасының Әдiлет министрiнiң 2001 жылғы 11 желтоқсандағы N 155 және Қазақстан Республикасының Денсаулық сақтау министрiнiң 2002 жылғы 23 қаңтардағы N 68 бiрлескен бұйрығына өзгерiстер енгiзу туралы'
  link: https://zan.gov.kz/client/#!/doc/13834/rus
