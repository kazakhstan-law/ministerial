act_code: '11415'
requisite: Совместный приказ Министра юстиции Республики Казахстан от 11 декабря 2001 года N 155 и Министра здравоохранения Республики Казахстан от 23 января 2002 года N 68. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 февраля 2002 года N 1757. Утратил силу - совместным приказом Министра юстиции РК от 08.04.2005г. N 108, Министра здравоохранения РК от 13.04.2005г. N 177
title:
  rus: Об утверждении Правил организации принудительных мер медицинского характера в исправительных учреждениях уголовно-исполнительной системы Министерства юстиции Республики Казахстан
  kaz: Қазақстан Республикасы Әділет министрлігі Қылмыстық атқару жүйесі мекемелерінде медициналық сипаттағы мәжбүрлеу шараларын ұйымдастыру Ережесін бекіту туралы
