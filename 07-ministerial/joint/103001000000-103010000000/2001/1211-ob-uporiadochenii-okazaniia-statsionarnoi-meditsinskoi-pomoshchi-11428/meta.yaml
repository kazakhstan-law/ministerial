requisite: Совместный приказ Министра юстиции Республики Казахстан от 11 декабря 2001 года N 149 и Министра здравоохранения Республики Казахстан от 23 января 2002 года N 67. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 февраля 2002 года за N 1755. Утратил силу - совместным приказом Министра юстиции РК от 08.04.2005г. N 108, Министра здравоохранения РК от 13.04.2005г. N 177
title:
