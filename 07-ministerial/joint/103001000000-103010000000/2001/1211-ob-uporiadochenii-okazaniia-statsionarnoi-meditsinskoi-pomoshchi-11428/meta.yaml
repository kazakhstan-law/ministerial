  code: '13836'
  requisite: Совместный приказ Министра юстиции Республики Казахстан от 20 ноября 2002 года N 168 и Министра здравоохранения Республики Казахстан от 25 сентября 2002 года N 892. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 декабря 2002 года N 2084. Утратил силу совместным приказом Министра юстиции Республики Казахстан от 8 апреля 2005 года N 108, Министра здравоохранения Республики Казахстан от 13 апреля 2005 года N 177
  title:
    rus: О внесении изменений в совместный приказ Министра юстиции Республики Казахстан от 11 декабря 2001 года N 149 и Министра здравоохранения Республики Казахстан от 23 января 2002 года N 67 "Об упорядочении оказания стационарной медицинской помощи лицам, содержащимся в исправительных учреждениях уголовно-исполнительной системы Министерства юстиции Республики Казахстан"
    kaz: '"Қазақстан Республикасы Әдiлет министрлiгiнiң қылмыстық-атқару жүйесi мекемелерiнде ұсталатын тұлғаларға, стационарлық медициналық көмек көрсетудi бiр жүйеге келтiру туралы" Қазақстан Республикасының Әдiлет министрiнiң 2001 жылғы 11 желтоқсандағы N 149 және Қазақстан Республикасының Денсаулық сақтау министрiнiң 2002 жылғы 23 қаңтардағы N 67 бiрлескен бұйрығына өзгерiстер енгiзу туралы'
  link: https://zan.gov.kz/client/#!/doc/13836/rus
