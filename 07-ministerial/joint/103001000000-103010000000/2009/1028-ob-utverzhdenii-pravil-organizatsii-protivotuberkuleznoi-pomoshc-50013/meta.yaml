requisite: Совместный приказ и.о. Министра юстиции Республики Казахстан от 28 октября 2009 года № 141 и и.о. Министра здравоохранения Республики Казахстан от 2 декабря 2009 года № 810. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 января 2010 года № 6001. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 29 февраля 2012 года № 117 и Министра здравоохранения Республики Казахстан от 27 февраля 2012 года № 115
title:
