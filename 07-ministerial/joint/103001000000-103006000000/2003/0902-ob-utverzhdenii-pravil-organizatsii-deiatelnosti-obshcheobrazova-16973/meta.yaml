  title:
    rus: О внесении дополнения в совместный приказ И.о. Министра юстиции Республики Казахстан от 3 сентября 2003 года № 180 и Министра образования и науки Республики Казахстан от 29 августа 2003 года № 582 "Об утверждении Правил организации деятельности общеобразовательных и профессиональных школ в исправительных учреждениях уголовно-исполнительной системы"
    kaz: '"Қылмыстық-атқару жүйесінің түзеу мекемелерінде жалпы білім беретін және кәсіптік мектептердің қызметін ұйымдастыру ережесін бекіту туралы" Қазақстан Республикасы Әділет министрі міндетін атқарушының 2003 жылғы 3 қыркүйектегі N 180 және Қазақстан Республикасы Білім және ғылым министрінің 2003 жылғы 29 тамыздағы N 582 бірлескен бұйрығына толықтырулар енгізу туралы'
