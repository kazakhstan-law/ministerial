act_code: '16973'
requisite: Совместный приказ Министра юстиции Республики Казахстан от 3 сентября 2003 года N 180 и Министра образования и науки Республики Казахстан от 29 августа 2003 года N 582. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 сентября 2003 года за N 2495. Утратил силу совместным приказом Министра юстиции Республики Казахстан от 18 ноября 2009 года N 146 и Министра образования и науки Республики Казахстан от 20 декабря 2009 года N 580
