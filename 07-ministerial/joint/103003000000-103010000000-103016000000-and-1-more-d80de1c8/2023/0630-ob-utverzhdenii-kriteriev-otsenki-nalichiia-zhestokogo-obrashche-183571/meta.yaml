  title:
    rus: О внесении изменений в совместный приказ Министра внутренних дел Республики Казахстан от 30 июня 2023 года № 528, Министра здравоохранения Республики Казахстан от 1 июля 2023 года № 123, Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 30 июня 2023 года № 271 и Министра просвещения Республики Казахстан от 30 июня 2023 года №190 «Об утверждении Критериев оценки наличия жестокого обращения, приведшего к социальной дезадаптации и социальной депривации»
    kaz: «Әлеуметтік бейімсіздікке және әлеуметтік депривацияға әкеп соққан қатыгездікпен қараудың бар-жоғын бағалау критерийлерін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2023 жылғы 30 маусымдағы № 528, Қазақстан Республикасы Денсаулық сақтау министрінің 2023 жылғы 1 шілдедегі № 123, Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 30 маусымдағы № 271 және Қазақстан Республикасы Оқу-ағарту министрінің 2023 жылғы 30 маусымдағы № 190 бірлескен бұйрығына өзгерістер енгізу туралы
