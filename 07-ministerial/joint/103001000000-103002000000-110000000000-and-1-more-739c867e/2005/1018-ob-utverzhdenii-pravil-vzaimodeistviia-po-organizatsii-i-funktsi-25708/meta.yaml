requisite: Совместный приказ Министра юстиции Республики Казахстан от 18 октября 2005 года № 273, и.о. Министра финансов Республики Казахстан от 29 октября 2005 года № 386, Председателя Агентства Республики Казахстан по информатизации и связи от 27 октября 2005 года № 369-п и Председателя Агентства Республики Казахстан по управлению земельными ресурсами от 19 октября 2005 года № 161-п. Зарегистрирован в Министерстве юстиции Республики Казахстан от 1 ноября 2005 года № 3915. Утратил силу совместными приказами Министра юстиции Республики Казахстан от 13 апреля 2010 № 115, Министра связи и информации Республики Казахстан от 20 апреля 2010 № 15, Председателя Агентсва Республики Казахстан по управлению земельными ресурсами от 4 мая 2010 № 67-П, Министра финансов Республики Казахстан от 24 мая 2010 № 248
title:
  rus: Об утверждении Правил взаимодействия по организации и функционированию Центров обслуживания населения по принципу "одного окна" в городах Астане и Алматы по оказанию государственных услуг
  kaz: Астана және Алматы қалаларында "жалғыз терезе" қағидаты бойынша халыққа мемлекеттік қызмет көрсету орталықтарын ұйымдастыру және оның жұмыс істеуі жөніндегі өзара іс-қимыл ережесін бекіту туралы
