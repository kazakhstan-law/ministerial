  requisite: Совместный приказ Министра здравоохранения и социального развития Республики Казахстан от 18 сентября 2015 года № 731 и и.о. Министра по инвестициям и развитию Республики Казахстан от 15 сентября 2015 года № 920. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 октября № 12205. Утратил силу совместным приказом Министра по инвестициям и развитию Республики Казахстан от 30 июня 2017 года № 428 и Министра здравоохранения Республики Казахстан от 12 июля 2017 года № 501 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра транспорта и коммуникаций Республики Казахстан от 28 августа 2013 года № 666 и исполняющего обязанности Министра здравоохранения Республики Казахстан от 17 сентября 2013 года № 532 «Об утверждении Правил медицинского освидетельствования в гражданской авиации Республики Казахстан»
    kaz: «Қазақстан Республикасының азаматтық авиациясындағы медициналық куәландыру қағидасын бекіту туралы» Қазақстан Республикасы Көлік және коммуникация Министрінің 2013 жылғы 28 тамыздағы № 666 және Қазақстан Республикасы Денсаулық сақтау Министрінің міндетін атқарушының 2013 жылғы 17 қыркүйектегі № 532 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
