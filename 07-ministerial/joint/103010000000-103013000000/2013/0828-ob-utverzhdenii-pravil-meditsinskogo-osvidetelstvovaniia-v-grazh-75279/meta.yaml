act_code: '75279'
requisite: Совместный приказ Министра транспорта и коммуникаций Республики Казахстан от 28 августа 2013 года № 666 и и.о. Министра здравоохранения Республики Казахстан от 17 сентября 2013 года № 532. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 октября 2013 года № 8784. Утратил силу совместным приказом Министра здравоохранения Республики Казахстан от 12 июля 2017 года № 501 и Министра по инвестициям и развитию Республики Казахстан от 30 июня 2017 года № 428 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил медицинского освидетельствования в гражданской авиации Республики Казахстан
