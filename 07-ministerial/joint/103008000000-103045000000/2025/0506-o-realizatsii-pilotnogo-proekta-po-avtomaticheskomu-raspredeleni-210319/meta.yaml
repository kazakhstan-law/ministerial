act_code: '210319'
requisite: Совместный приказ Министра обороны Республики Казахстан от 6 мая 2025 года № 528 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 12 мая 2025 года № 211/НҚ. Действовал по 1 апреля 2026 года в соответствии с пунктом 7 настоящего приказа
title:
  rus: О реализации пилотного проекта по автоматическому распределению служебного жилища в проактивном формате для военнослужащих и лиц гражданского персонала (работников) Вооруженных Сил Республики Казахстан в рамках оказания государственных услуг «Постановка на учет нуждающихся в служебном жилище военнослужащих Вооруженных Сил Республики Казахстан», «Постановка на учет нуждающихся в служебном жилище лиц гражданского персонала (работников) Вооруженных Сил Республики Казахстан» и «Заключение и продление договора найма служебного жилища Вооруженных Сил Республики Казахстан»
  kaz: «Қазақстан Республикасы Қарулы Күштерінің қызметтік тұрғынжайға мұқтаж әскери қызметшілерін есепке қою», «Қазақстан Республикасы Қарулы Күштерінің қызметтік тұрғынжайға мұқтаж азаматтық персонал адамдарын (қызметкерлерін) есепке қою» және «Қазақстан Республикасы Қарулы Күштерінің қызметтік тұрғынжайын жалға алу шартын жасау және ұзарту» мемлекеттік қызметін көрсету шеңберінде Қазақстан Республикасы Қарулы Күштерінің әскери қызметшілері мен азаматтық персонал адамдары (қызметкерлері) үшін қызметтік тұрғынжайды проактивті форматта автоматты түрде бөлу жөніндегі пилоттық жобаны іске асыру туралы
