act_code: '210321'
requisite: Совместный приказ Министра обороны Республики Казахстан от 6 мая 2025 года № 529 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 12 мая 2025 года № 212/НҚ. Действовал по 1 апреля 2026 года в соответствии с пунктом 7 настоящего совместного приказа
title:
  rus: О реализации пилотного проекта взаимодействия государственных органов и организаций при исключении в проактивной форме услугополучателей в рамках оказания государственных услуг «Постановка на учет нуждающихся в служебном жилище военнослужащих Вооруженных Сил Республики Казахстан» и «Постановка на учет нуждающихся в служебном жилище лиц гражданского персонала (работников) Вооруженных Сил Республики Казахстан»
  kaz: «Қазақстан Республикасы Қарулы Күштерінің қызметтік тұрғынжайға мұқтаж әскери қызметшілерін есепке қою» және «Қазақстан Республикасы Қарулы Күштерінің қызметтік тұрғынжайға мұқтаж азаматтық персонал адамдарын (қызметкерлерін) есепке қою» мемлекеттік қызметін көрсету шеңберінде көрсетілетін қызметті алушыларды проактивті нысанда шығару кезінде мемлекеттік органдар мен ұйымдардың өзара іс-қимылы пилоттық жобасын іске асыру туралы
