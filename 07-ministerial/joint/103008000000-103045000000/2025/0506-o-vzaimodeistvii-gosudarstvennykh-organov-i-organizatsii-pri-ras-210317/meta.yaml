act_code: '210317'
requisite: Совместный приказ Министра обороны Республики Казахстан от 6 мая 2025 года № 530 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 12 мая 2025 года № 210/НҚ. Действовал по 1 апреля 2026 года в соответствии с пунктом 7 настоящего приказа
title:
  rus: О взаимодействии государственных органов и организаций при расторжении договора найма служебного жилища с услугополучателями в проактивной форме в рамках оказания государственной услуги «Заключение и продление договора найма служебного жилища Вооруженных Сил Республики Казахстан»
  kaz: «Қазақстан Республикасы Қарулы Күштерінің қызметтік тұрғынжайын жалға алу шартын жасау және ұзарту» мемлекеттік қызметін көрсету шеңберінде көрсетілетін қызметті алушылармен қызметтік тұрғынжайды жалға алу шартын проактивті нысанда бұзу кезінде мемлекеттік органдар мен ұйымдардың өзара іс-қимылы туралы
