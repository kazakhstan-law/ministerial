title:
  rus: «О запуске пилотных проектов по процессу переоформления государственных услуг в сферы санитарно-эпидемиологического благополучия населения в проактивном формате посредством использования информационно-аналитической системы «Smart Data Ukimet»
  kaz: «Халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы мемлекеттік көрсетілетін қызметтерді қайта рәсімдеу процесі бойынша пилоттық жобаларды «Smart Data Ukimet» ақпараттық-талдау жүйесін пайдалану арқылы проактивті форматта іске қосу туралы»
