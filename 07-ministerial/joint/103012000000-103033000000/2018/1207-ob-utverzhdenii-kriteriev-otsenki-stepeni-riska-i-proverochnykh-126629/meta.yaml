  title:
    rus: О внесении изменении и дополнения в совместный приказ Заместителя Премьер-Министра Республики Казахстан – Министра сельского хозяйства Республики Казахстан от 7 декабря 2018 года № 494 и Министра национальной экономики Республики Казахстан от 7 декабря 2018 года № 95 «Об утверждении критериев оценки степени риска и проверочных листов в области охраны, воспроизводства и использования животного мира»
    kaz: «Жануарлар дүниесiн қорғау, өсiмiн молайту және пайдалану саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің 2018 жылғы 7 желтоқсандағы № 494 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 7 желтоқсандағы № 95 бірлескен бұйрығына өзгерістер мен толықтыру енгізу туралы
