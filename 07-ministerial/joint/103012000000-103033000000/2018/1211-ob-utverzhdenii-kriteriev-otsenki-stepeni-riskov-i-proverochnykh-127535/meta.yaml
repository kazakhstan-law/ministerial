act_code: '127535'
requisite: Совместный приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 11 декабря 2018 года № 502 и Министра национальной экономики Республики Казахстан от 11 декабря 2018 года № 101. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 декабря 2018 года № 18000
title:
  rus: Об утверждении критериев оценки степени рисков и проверочных листов за использованием и охраной земель, государственного земельного кадастра
  kaz: Жерлердің пайдаланылуы мен қорғалуы, мемлекеттік жер кадастры үшін тәуекелдер дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
