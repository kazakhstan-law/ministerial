  title:
    rus: О внесении изменений в совместный приказ Заместителя Премьер-Министра Республики Казахстан – Министра сельского хозяйства Республики Казахстан от 11 декабря 2018 года № 502 и Министра национальной экономики Республики Казахстан от 11 декабря 2018 года № 101 «Об утверждении критериев оценки степени рисков и проверочных листов в области земельных правоотношений, за использованием и охраной земель, геодезии и картографии, государственного земельного кадастра и мониторинга земель»
    kaz: «Жер құқығы қатынастары, жерді пайдалану мен қорғау, геодезия және картография, мемлекеттік жер кадастры мен жерлердің мониторингі саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Қазақстан Республикасы Ауыл шаруашылығы министрінің 2018 жылғы 11 желтоқсандағы № 502 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 11 желтоқсандағы № 101 бірлескен бұйрығына өзгерістер енгізу туралы
