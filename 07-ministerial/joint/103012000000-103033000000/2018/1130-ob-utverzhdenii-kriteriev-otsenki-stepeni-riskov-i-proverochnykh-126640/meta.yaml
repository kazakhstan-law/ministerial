  title:
    rus: О внесении изменений и дополнения в совместный приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 30 ноября 2018 года № 485 и Министра национальной экономики Республики Казахстан от 30 ноября 2018 года № 93 «Об утверждении критериев оценки степени рисков и проверочных листов в области семеноводства»
