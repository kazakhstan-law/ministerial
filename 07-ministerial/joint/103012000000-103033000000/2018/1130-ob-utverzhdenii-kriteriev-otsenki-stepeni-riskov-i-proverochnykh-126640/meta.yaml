  title:
    rus: О внесении изменений и дополнений в совместный приказ Заместителя Премьер-Министра Республики Казахстан – Министра сельского хозяйства Республики Казахстан от 30 ноября 2018 года № 485 и Министра национальной экономики Республики Казахстан от 30 ноября 2018 года № 93 «Об утверждении критериев оценки степени рисков и проверочных листов в области семеноводства»
    kaz: «Тұқым шаруашылығы саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің 2018 жылғы 30 қарашадағы № 485 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 30 қарашадағы № 93 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
