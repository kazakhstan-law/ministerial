  title:
    rus: О внесении изменений в совместный приказ Заместителя Премьер-Министра Республики Казахстан – Министра сельского хозяйства Республики Казахстан от 12 августа 2016 года № 358 и исполняющего обязанности Министра национальной экономики Республики Казахстан от 24 августа 2016 года № 381 «Об утверждении критериев оценки степени риска и проверочного листа в сфере государственного контроля в области производства биотоплива»
    kaz: «Биоотын өндірісі бойынша мемлекеттік бақылау саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің 2016 жылғы 12 тамыздағы № 358 және Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2016 жылғы 24 тамыздағы № 381 бірлескен бұйрығына өзгерістер енгізу туралы
