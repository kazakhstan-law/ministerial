  title:
    rus: О внесении изменений в совместный приказ Министра сельского хозяйства Республики Казахстан от 25 декабря 2015 года № 15-3/1134 и Министра национальной экономики Республики Казахстан от 28 декабря 2015 года № 813 "Об утверждении критериев оценки степени рисков и проверочных листов в области регулирования рынка зерна, безопасности и качества хлопка"
