act_code: '98274'
requisite: Совместный приказ Министра сельского хозяйства Республики Казахстан от 25 декабря 2015 года № 15-3/1134 и Министра национальной экономики Республики Казахстан от 28 декабря 2015 года № 813. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2015 года № 12654. Утратил силу совместным приказом Министра сельского хозяйства Республики Казахстан от 10 июля 2019 года № 259 и Министра национальной экономики Республики Казахстан от 12 июля 2019 года № 63 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
