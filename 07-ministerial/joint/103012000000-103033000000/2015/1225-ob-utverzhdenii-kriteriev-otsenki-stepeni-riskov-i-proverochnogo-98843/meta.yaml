requisite: Совместный приказ Министра сельского хозяйства Республики Казахстан от 25 декабря 2015 года № 19-2/1131 и Министра национальной экономики Республики Казахстан от 28 декабря 2015 года № 809. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2015 года № 12661. Утратил силу совместным приказом Министра сельского хозяйства Республики Казахстан от 5 апреля 2019 года № 135 и Министра национальной экономики Республики Казахстан от 24 апреля 2019 года № 30 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
