  title:
    rus: О внесении изменений в совместный приказ Министра сельского хозяйства Республики Казахстан от 10 июля 2019 года № 259 и Министра национальной экономики Республики Казахстан от 12 июля 2019 года № 63 «Об утверждении критериев оценки степени рисков и проверочных листов в области регулирования рынка зерна, безопасности и качества хлопка»
    kaz: «Астық нарығын реттеу, мақтаның қауіпсіздігі мен сапасы саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2019 жылғы 10 шілдедегі № 259 және Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 12 шілдедегі № 63 бірлескен бұйрығына өзгерістер енгізу туралы
