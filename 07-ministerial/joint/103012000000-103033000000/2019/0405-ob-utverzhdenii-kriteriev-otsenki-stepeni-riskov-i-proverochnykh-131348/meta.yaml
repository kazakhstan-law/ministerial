  requisite: Совместный приказ Министра экологии и природных ресурсов Республики Казахстан от 17 мая 2023 года № 151 и и.о. Министра национальной экономики Республики Казахстан от 18 мая 2023 года № 72. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 мая 2023 года № 32533
  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра сельского хозяйства Республики Казахстан от 5 апреля 2019 года № 135 и Министра национальной экономики Республики Казахстан от 24 апреля 2019 года № 30 «Об утверждении критериев оценки степени рисков и проверочных листов в области использования и охраны водного фонда Республики Казахстан, безопасности плотин»
    kaz: «Қазақстан Республикасының су қорын пайдалану және қорғау, бөгеттердің қауіпсіздігі саласындағы тәуекелдер дәрежесін бағалау критерийлері және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2019 жылғы 5 сәуірдегі № 135 және Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 24 сәуірдегі № 30 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
