requisite: Совместный приказ Министра сельского хозяйства Республики Казахстан от 5 апреля 2019 года № 135 и Министра национальной экономики Республики Казахстан от 24 апреля 2019 года № 30. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 мая 2019 года № 18616
title:
  rus: Об утверждении критериев оценки степени рисков и проверочных листов в области охраны и использования водного фонда Республики Казахстан
  kaz: Қазақстан Республикасының су қорын қорғау және пайдалану саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
