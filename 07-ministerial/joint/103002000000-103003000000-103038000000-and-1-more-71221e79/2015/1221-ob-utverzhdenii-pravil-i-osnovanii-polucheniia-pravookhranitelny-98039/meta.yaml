  requisite: Совместный приказ Генерального Прокурора Республики Казахстан от 18 апреля 2017 года № 41, Министра внутренних дел Республики Казахстан от 20 февраля 2017 года № 128, Министра финансов Республики Казахстан от 4 апреля 2017 года № 215, Председателя Агентства по делам государственной службы и противодействию коррупции Республики Казахстан от 15 февраля 2017 года № 36. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 мая 2017 года № 15169
  title:
    rus: О внесении изменений в совместный приказ Генерального Прокурора Республики Казахстан от 21 декабря 2015 года № 150, Министра внутренних дел Республики Казахстан от 31 декабря 2015 года № 1119, Министра финансов Республики Казахстан от 30 декабря 2015 года № 733, Министра по делам государственной службы Республики Казахстан от 30 декабря 2015 года № 21 «Об утверждении Правил и оснований получения правоохранительными органами из системы информационного обмена правоохранительных, специальных государственных и иных органов информации, необходимой для проведения негласных следственных действий и оперативно-розыскной деятельности, а также для решения иных возложенных на них задач»
    kaz: «Құқық қорғау органдардың құқық қорғау, арнаулы мемлекеттік және өзге де органдардың ақпарат алмасу жүйесінен жария емес тергеу әрекеттері мен жедел-іздестіру қызметін жүргізу үшін, сондай-ақ өздеріне жүктелген өзге де шешу үшін қажетті ақпаратты алу қағидалары мен негіздерін бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2015 жылғы 21 желтоқсандағы № 150, Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 31 желтоқсандағы № 1119, Қазақстан Республикасы Қаржы министрінің 2015 жылғы 30 желтоқсандағы № 733, Қазақстан Респуликасы Мемлекеттік қызмет істері министрінің 2015 жылғы 30 желтоқсандағы № 21 бірлескен бұйрығына өзгерістер енгізу туралы
