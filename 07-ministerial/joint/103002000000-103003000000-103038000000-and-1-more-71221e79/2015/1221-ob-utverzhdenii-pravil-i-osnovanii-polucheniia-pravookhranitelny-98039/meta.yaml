act_code: '98039'
requisite: Совместный приказ Генерального Прокурора Республики Казахстан от 21 декабря 2015 года № 150 и Министра внутренних дел Республики Казахстан от 31 декабря 2015 года № 1119 и Министра финансов Республики Казахстан от 30 декабря 2015 года № 733 и Министра по делам государственной службы Республики Казахстан от 30 декабря 2015 года № 21. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 января 2016 года № 12860
title:
  rus: Об утверждении Правил и оснований получения правоохранительными органами из системы информационного обмена правоохранительных, специальных государственных  и иных органов информации, необходимой для проведения негласных следственных действий и оперативно-розыскной деятельности, а также для решения иных возложенных на них задач
  kaz: Құқық қорғау органдардың құқық қорғау, арнаулы мемлекеттік және өзге де органдардың ақпарат алмасу жүйесінен жария емес тергеу әрекеттері мен жедел-іздестіру қызметін жүргізу үшін, сондай-ақ өздеріне жүктелген өзге де міндеттерді шешу үшін қажетті ақпаратт алу қағидалары мен негіздерін бекіту туралы
