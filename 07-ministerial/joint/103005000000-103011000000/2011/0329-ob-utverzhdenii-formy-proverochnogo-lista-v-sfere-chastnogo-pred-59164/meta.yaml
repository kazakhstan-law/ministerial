  title:
    rus: О внесении изменения в совместный приказ Министра культуры Республики Казахстан от 29 марта 2011 года № 52 и Министра экономического развития и торговли Республики Казахстан от 1 апреля 2011 года № 81 "Об утверждении формы проверочного листа в сфере частного предпринимательства за охраной и использованием объектов историко-культурного наследия"
    kaz: '"Жеке кәсіпкерлік саласындағы тарихи-мәдени мұра объектілерін қорғау және пайдалануға арналған тексеру парағының нысанын бекіту туралы" Қазақстан Республикасы Мәдениет министрiнiң 2011 жылғы 29 наурыздағы № 52 және Қазақстан Республикасы Экономикалық даму және сауда министрінің 2011 жылғы 1 сәуірдегі № 81 бірлескен бұйрығына өзгерiс енгiзу туралы'
