act_code: '221881'
requisite: Совместный приказ Министра промышленности и строительства Республики Казахстан от 30 января 2026 года № 36 и Министра финансов Республики Казахстан от 2 февраля 2026 года № 68
title:
  rus: Об утверждении Правил взаимодействия Министерства промышленности и строительства Республики Казахстан и Министерства финансов Республики Казахстан по представлению органом государственных доходов сведений, составляющих налоговую тайну и конфиденциальную информацию
  kaz: Мемлекеттік кіріс органының салық құпиясын және құпия ақпаратты құрайтын мәліметтерді ұсынуы бойынша Қазақстан Республикасы Өнеркәсіп және құрылыс министрлігі мен Қазақстан Республикасы Қаржы министрлігінің өзара іс-қимыл жасау қағидаларын бекіту туралы
