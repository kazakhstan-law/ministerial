  title:
    rus: О внесении изменений в совместный приказ и.о. Министра энергетики Республики Казахстан от 4 декабря 2024 года № 440, Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 4 декабря 2024 года № 759/НҚ, и.о. Министра труда и социальной защиты населения от 4 декабря 2024 года № 446 и Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 5 декабря 2024 года № 107 «О запуске пилотного проекта по оказанию услуги «Предоставление ваучеров на товарный газ получателям государственной адресной социальной и жилищной помощи»
    kaz: «Мемлекеттік атаулы әлеуметтік көмек алушыларға және тұрғын үй көмегін алушыларға тауарлық газға ваучерлер беру» қызметін көрсету жөніндегі пилоттық жобаны іске қосу туралы» Қазақстан Республикасы Энергетика министрінің м.а. 2024 жылғы 4 желтоқсандағы № 440, Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2024 жылғы 4 желтоқсандағы № 759/НҚ, Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің м.а. 2024 жылғы 4 желтоқсандағы № 446 және Қазақстан Республикасы Премьер-Министрінің орынбасары – Ұлттық экономика министрінің 2024 жылғы 5 желтоқсандағы № 107 бірлескен бұйрығына өзгерістер енгізу туралы
