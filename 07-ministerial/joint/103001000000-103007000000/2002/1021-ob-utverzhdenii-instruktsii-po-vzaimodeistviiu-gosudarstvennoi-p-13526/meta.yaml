act_code: '13526'
requisite: Совместный приказ Министра юстиции Республики Казахстан от 22 октября 2002 года N 157 и Председателя Агентства Республики Казахстан по чрезвычайным ситуациям от 29 октября 2002 года N 803. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 ноября 2002 года N 2037. Утратил силу совместным приказом Министра по чрезвычайным ситуациям Республики Казахстан от 1 декабря 2009 года N 288 и и.о. Министра юстиции Республики Казахстан от 1 декабря 2009 года N 157
title:
  rus: Об утверждении Инструкции по взаимодействию Государственной противопожарной службы Агентства Республики Казахстан по чрезвычайным ситуациям и Комитета уголовно-исполнительной системы Министерства юстиции Республики Казахстан по обеспечению пожарной безопасности в органах и учреждениях, обеспечивающих исполнение уголовных наказаний
  kaz: Қазақстан Республикасы Төтенше жағдайлар жөніндегі агенттігінің Мемлекеттік өртке қарсы қызметі мен Қазақстан Республикасының Әділет министрлігі Қылмыстық-атқару жүйесі комитетінің қылмыстық жазаларды орындауды қамтамасыз ететін органдар мен мекемелерде өрт қауіпсіздігін қамтамасыз ету бойынша өзара іс-әрекет етуі жөніндегі нұсқаулықты бекіту туралы
