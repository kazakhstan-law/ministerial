  requisite: Совместный приказ Министра энергетики Республики Казахстан от 16 ноября 2018 года № 447 и Министра национальной экономики Республики Казахстан от 19 ноября 2018 года № 74. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 ноября 2018 года № 17794
  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра энергетики Республики Казахстан от 24 декабря 2015 года № 749 и Министра национальной экономики Республики Казахстан от 29 декабря 2015 года № 827 «Об утверждении проверочного листа за соблюдением законодательства Республики Казахстан о магистральном трубопроводе»
    kaz: «Қазақстан Республикасының магистральдық құбыр туралы заңнамасын сақтауды тексеру парағын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 24 желтоқсандағы № 749 және Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 29 желтоқсандағы № 827 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
