  title:
    rus: О внесении изменений и дополнения в совместный приказ Министра энергетики Республики Казахстан от 24 декабря 2015 года № 749 и Министра национальной экономики Республики Казахстан от 29 декабря 2015 года № 827 «Об утверждении проверочных листов за соблюдением законодательства Республики Казахстан о магистральном трубопроводе»
    kaz: «Қазақстан Республикасының магистральдық құбыр туралы заңнамасын сақтауды тексеру парақтарын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 24 желтоқсандағы № 749 және Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 29 желтоқсандағы № 827 бірлескен бұйрығына өзгерістер мен толықтыру енгізу туралы
