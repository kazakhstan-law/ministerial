  title:
    rus: О внесении изменений в совместный приказ Министра энергетики Республики Казахстан от 24 декабря 2015 года № 749 и Министра национальной экономики Республики Казахстан от 29 декабря 2015 года № 827 «Об утверждении критериев оценки степени риска и проверочных листов за соблюдением законодательства Республики Казахстан о магистральном трубопроводе»
    kaz: «Қазақстан Республикасының магистральдық құбыр туралы заңнамасынын сақталуының тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 24 желтоқсандағы № 749 және Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 29 желтоқсандағы № 827 бірлескен бұйрығына өзгерістер енгізу туралы
