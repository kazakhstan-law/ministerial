title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов за соблюдением законодательства Республики Казахстан о магистральном трубопроводе
  kaz: Қазақстан Республикасының магистральдық құбыр туралы заңнамасының сақталуының тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
