  title:
    rus: О внесении изменений и дополнения в совместный приказ Министра энергетики Республики Казахстан от 23 декабря 2015 года № 747 и Министра национальной экономики Республики Казахстан от 28 декабря 2015 года № 811 «Об утверждении критериев оценки степени риска и проверочных листов в области использования атомной энергии»
    kaz: «Атом энергиясын пайдалану саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 23 желтоқсандағы № 747 және Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 28 желтоқсандағы № 811 бірлескен бұйрығына өзгерістер мен толықтыру енгізу туралы
