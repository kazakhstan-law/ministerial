    kaz: «Атом энергиясын пайдалану саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 23 желтоқсандағы № 747 және Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 28 желтоқсандағы № 811 бірлескен бұйрығына өзгерістер енгізу туралы
