  title:
    rus: О внесении изменений в совместный приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 30 декабря 2015 года № 835 и Министра энергетики Республики Казахстан от 15 декабря 2015 года № 721 «Об утверждении критериев оценки степени риска и проверочного листа в области охраны окружающей среды, воспроизводства и использования природных ресурсов»
    kaz: «Қоршаған ортаны қорғау, табиғи ресурстарды молықтыру және пайдалану саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 30 желтоқсандағы № 835 және Қазақстан Республикасы Энергетика министрінің 2015 жылғы 15 желтоқсандағы № 721 бірлескен бұйрығына өзгерістер енгізу туралы
