  title:
    rus: О внесении изменений и дополнений в совместный приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 30 декабря 2015 года № 835 и Министра энергетики Республики Казахстан от 15 декабря 2015 года № 721 «Об утверждении Критериев оценки степени риска и проверочных листов в области охраны окружающей среды, воспроизводства и использования природных ресурсов»
    kaz: «Қоршаған ортаны қорғау, табиғи ресурстарды молайту мен пайдалану саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 30 желтоқсандағы № 835 және Қазақстан Республикасы Энергетика министрінің 2015 жылғы 15 желтоқсандағы № 721 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
