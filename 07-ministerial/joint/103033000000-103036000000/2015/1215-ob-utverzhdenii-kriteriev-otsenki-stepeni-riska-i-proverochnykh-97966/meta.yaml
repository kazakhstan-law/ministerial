title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов в области охраны окружающей среды, воспроизводства и использования природных ресурсов
  kaz: Қоршаған ортаны қорғау, табиғи ресурстарды молайту мен пайдалану саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
