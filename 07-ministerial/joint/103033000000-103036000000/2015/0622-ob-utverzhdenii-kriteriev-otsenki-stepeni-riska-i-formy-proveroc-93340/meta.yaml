requisite: Совместный приказ и.о. Министра национальной экономики Республики Казахстан от 30 июня 2015 года № 478 и Министра энергетики Республики Казахстан от 22 июня 2015 года № 419. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 августа 2015 года № 11828. Утратил силу совместным приказом Министра энергетики Республики Казахстан от 24 декабря 2015 года № 749 и Министра национальной экономики Республики Казахстан от 29 декабря 2015 года № 827
title:
  rus: Об утверждении критериев оценки степени риска и формы проверочного листа в сфере за соблюдением законодательства Республики Казахстан о магистральном трубопроводе
  kaz: Қазақстан Республикасының магистральдық құбыр туралы заңнамасын сақтау саласында тәуекел дәрежесін бағалау критерийлерін және тексеру парағының нысанын бекіту туралы
