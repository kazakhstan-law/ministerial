    kaz: «Электр энергетикасы саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2019 жылғы 26 тамыздағы № 290 және Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 27 тамыздағы № 78 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
