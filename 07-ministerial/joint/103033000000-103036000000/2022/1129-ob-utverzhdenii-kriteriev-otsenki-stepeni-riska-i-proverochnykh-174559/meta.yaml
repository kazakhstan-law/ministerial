  requisite: Совместный приказ Министра энергетики Республики Казахстан от 31 мая 2023 года № 204 и Министра национальной экономики Республики Казахстан от 1 июня 2023 года № 94. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 июня 2023 года № 32653
  title:
    rus: О внесении изменений в совместный приказ исполняющего обязанности Министра энергетики Республики Казахстан от 29 ноября 2022 года № 387 и исполняющего обязанности Министра национальной экономики Республики Казахстан от 30 ноября 2022 года № 96 «Об утверждении критериев оценки степени риска и проверочных листов в сфере контроля на соответствие квалификационным требованиям в сфере углеводородов»
    kaz: «Көмірсутектер саласындағы біліктілік талаптарына сәйкестігіне бақылау саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2022 жылғы 29 қарашадағы № 387 және Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2022 жылғы 30 қарашадағы № 96 бірлескен бұйрығына өзгерістер енгізу туралы
