  title:
    rus: О внесении изменений в совместный приказ и.о. Министра энергетики Республики Казахстан от 29 ноября 2022 года № 386 и и.о. Министра национальной экономики Республики Казахстан от 30 ноября 2022 года № 97 «Об утверждении критериев оценки степени риска и проверочных листов при проведении операций по недропользованию в области добычи урана»
    kaz: «Уран өндіру саласында жер қойнауын пайдалану бойынша операцияларды жүргізу кезіндегі тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Энергетика министрінің м.а. 2022 жылғы 29 қарашадағы № 386 және Қазақстан Республикасы Ұлттық экономика министрінің м.а. 2022 жылғы 30 қарашадағы № 97 бірлескен бұйрығына өзгерістер енгізу туралы
