title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов при проведении операций по недропользованию в области добычи урана
  kaz: Уран өндіру саласында жер қойнауын пайдалану бойынша операцияларды жүргізу кезіндегі тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
