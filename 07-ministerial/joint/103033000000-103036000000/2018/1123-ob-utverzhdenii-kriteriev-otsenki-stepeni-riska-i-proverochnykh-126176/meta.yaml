  requisite: Совместный приказ Министра энергетики Республики Казахстан от 31 мая 2023 года № 201 и Министра национальной экономики Республики Казахстан от 1 июня 2023 года № 95. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 июня 2023 года № 32655
  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра энергетики Республики Казахстан от 23 ноября 2018 года № 453 и исполняющего обязанности Министра национальной экономики Республики Казахстан от 23 ноября 2018 года № 77 «Об утверждении критериев оценки степени риска и проверочных листов при проведении операций по недропользованию в области углеводородов»
    kaz: «Көмірсутектер саласында жер қойнауын пайдалану бойынша операцияларды жүргізу кезіндегі тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2018 жылғы 23 қарашадағы № 453 және Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2018 жылғы 23 қарашадағы № 77 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
