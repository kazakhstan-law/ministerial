  code: '133381'
  requisite: Совместный приказ Министра энергетики Республики Казахстан от 12 июля 2019 года № 244 и Министра национальной экономики Республики Казахстан от 16 июля 2019 года № 64. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 июля 2019 года № 19050
  title:
    rus: О внесении изменений в совместный приказ Министра энергетики Республики Казахстан от 23 ноября 2018 года № 453 и исполняющего обязанности Министра национальной экономики Республики Казахстан от 23 ноября 2018 года № 77 «Об утверждении критериев оценки степени риска и проверочных листов при проведении операций по недропользованию в области углеводородов, добычи урана»
    kaz: «Көмірсутектер, уран өндіру саласында жер қойнауын пайдалану бойынша операцияларды жүргізу кезіндегі тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2018 жылғы 23 қарашадағы № 453 және Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2018 жылғы 23 қарашадағы № 77 бірлескен бұйрығына өзгерістер енгізу туралы
