  title:
    rus: О внесении изменения в совместный приказ Министра энергетики Республики Казахстан от 3 апреля 2020 года № 125 и Министра национальной экономики Республики Казахстан от 3 апреля 2020 года № 22 «Об установлении предельных цен на розничную реализацию сжиженного нефтяного газа для заправки автотранспорта на автогазозаправочных станциях»
    kaz: «Автогаз құю станцияларында автокөлікке құюға арналған сұйытылған мұнай газын бөлшек саудада өткізудің шекті бағаларын белгілеу туралы» Қазақстан Республикасы Энергетика министрінің 2020 жылғы 3 сәуірдегі № 125 және Қазақстан Республикасы Ұлттық экономика министрінің 2020 жылғы 3 сәуірдегі № 22 бірлескен бұйрығына өзгеріс енгізу туралы
