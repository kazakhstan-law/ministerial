act_code: '161136'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 3 ноября 2021 года № 232 и Председателя Комитета по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и инфраструктурного развития Республики Казахстан от 22 ноября 2021 года № 184-нқ
title:
  rus: Об утверждении порядка взаимодействия без интеграции информационных систем между Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан и Комитетом по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и инфраструктурного развития Республики Казахстан
  kaz: Қазақстан Республикасының Стратегиялық жоспарлау және реформалар агенттігінің Ұлттық статистика бюросы мен Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің Құрылыс және тұрғын үй-коммуналдық шаруашылық істері комитеті арасындағы ақпараттық жүйелерді интеграцияламай өзара іс-қимыл тәртібін бекіту туралы
