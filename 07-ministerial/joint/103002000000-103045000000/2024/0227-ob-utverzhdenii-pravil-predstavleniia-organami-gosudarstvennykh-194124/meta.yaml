act_code: '194124'
requisite: Совместный приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 27 февраля 2024 года № 94/НҚ и Министра финансов Республики Казахстан от 27 февраля 2024 года № 106
title:
  rus: Об утверждении Правил представления органами государственных доходов Министерству цифрового развития инноваций и аэрокосмической промышленности Республики Казахстан сведений о налогоплательщике (налоговом агенте), составляющих налоговую тайну, без получения письменного разрешения налогоплательщика (налогового агента) и перечня представляемых сведений
  kaz: Мемлекеттік кірістер органдарының салық төлеуші (салық агенті) туралы салықтық құпияны құрайтын мәліметтерді салық төлеушінің (салық агентінің) жазбаша рұқсатын алмастан Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлігіне ұсыну қағидаларын, сондай-ақ ұсынылатын мәліметтердің тізбесін бекіту туралы
