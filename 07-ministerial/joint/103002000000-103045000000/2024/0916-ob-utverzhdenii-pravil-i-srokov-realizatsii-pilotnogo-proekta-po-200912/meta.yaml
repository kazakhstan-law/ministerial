  kaz: «Бюджеттен қосылған құн салығын қайтару» («Цифрлық ҚҚС») мемлекеттік қызмет көрсетуді жаңғырту және жетілдіру жөніндегі пилоттық жобаны іске асыру қағидалары мен мерзімдерін бекіту туралы
