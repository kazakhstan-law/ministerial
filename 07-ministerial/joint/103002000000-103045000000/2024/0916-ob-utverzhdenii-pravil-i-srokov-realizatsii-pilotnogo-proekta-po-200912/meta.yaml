  title:
    rus: О внесении изменений в совместный приказ Министра финансов Республики Казахстан от 16 сентября 2024 года № 628 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 23 сентября 2024 года № 575/НҚ «Об утверждении Правил и сроков реализации пилотного проекта по модернизации и совершенствованию оказания государственной услуги «Возврат налога на добавленную стоимость из бюджета» («Цифровой НДС»)
    kaz: «Бюджеттен қосылған құн салығын қайтару» («Цифрлық ҚҚС») мемлекеттік қызмет көрсетуді жаңғырту және жетілдіру жөніндегі пилоттық жобаны іске асыру қағидалары мен мерзімдерін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2014 жылғы 16 қыркүйектегі №628 және Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2014 жылғы 23 қыркүйектегі № 575/НҚ бірлескен бұйрығына өзгерістер енгізу туралы
