requisite: Совместный приказ Министра по чрезвычайным ситуациям Республики Казахстан от 11 февраля 2011 года № 45 и Министра экономического развития и торговли Республики Казахстан от 17 февраля 2011 года № 39. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 февраля 2011 года № 6787. Утратил силу совместным приказом Министра по чрезвычайным ситуациям Республики Казахстан от 27 июня 2013 года № 292 и и.о. Министра регионального развития Республики Казахстан от 18 июля 2013 года № 141/НҚ
title:
