  title:
    rus: О внесении изменений в совместный приказ Заместителя Премьер-Министра РК - Министра  финансов РК от 28 марта 2014 года № 143 и Министра регионального развития РК от 28 марта 2014 года № 95/ОД "Об утверждении Перечня сведений, составляющих налоговую тайну, и правил их представления органами  налоговой службы уполномоченному органу по предпринимательству"
