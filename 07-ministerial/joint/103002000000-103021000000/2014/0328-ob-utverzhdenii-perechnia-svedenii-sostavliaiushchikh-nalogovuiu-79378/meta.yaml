act_code: '79378'
requisite: Совместный приказ Министра регионального развития Республики Казахстан от 28 марта 2014 года № 95/ОД и Заместителя Премьер-Министра Республики Казахстан - Министра финансов Республики Казахстан от 28 марта 2014 года № 143. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 апреля 2014 года № 9347. Утратил силу совместным приказом Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 16 мая 2019 года № 446 и Министра национальной экономики Республики Казахстан от 21 мая 2019 года № 40 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
