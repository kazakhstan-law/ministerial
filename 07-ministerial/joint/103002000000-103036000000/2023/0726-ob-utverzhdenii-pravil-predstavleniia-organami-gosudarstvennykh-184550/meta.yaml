act_code: '184550'
requisite: Совместный приказ Министра энергетики Республики Казахстан от 26 июля 2023 года № 276 и Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 27 июля 2023 года № 799
title:
  rus: Об утверждении Правил представления органами государственных доходов Министерству энергетики Республики Казахстан сведений о налогоплательщике (налоговом агенте), составляющих налоговую тайну, без получения письменного разрешения налогоплательщика (налогового агента) и конфиденциальной информации в сфере производства и оборота сжиженного газа и нефтепродуктов, а также перечня представляемых сведений
  kaz: Мемлекеттік кірістер органдарының салық төлеуші (салық агенті) туралы салықтық құпияны құрайтын мәліметтерді және сұйытылған газ бен мұнай өнімдерін өндіру және олардың айналымы саласындағы құпия ақпаратты салық төлеушінің (салық агентінің) жазбаша рұқсатын алмастан Қазақстан Республикасының Энергетика министрлігіне ұсынуы қағидаларын, сондай-ақ ұсынылатын мәліметтер тізбесін бекіту туралы
