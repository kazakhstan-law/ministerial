title:
  rus: Об утверждении Правил реализации пилотного проекта по введению маркировки товаров контрольными (идентификационными) знаками по товарной позиции «Предметы одежды, принадлежности к одежде и прочие изделия из натурального меха»
  kaz: «Табиғи теріден жасалған киім заттары, киімге керек-жарақтар және өзге де бұйымдар» тауар позициясы бойынша тауарларды бақылау (идентификациялау) белгілерімен таңбалауды енгізу жөніндегі пилоттық жобаны іске асыру қағидаларын бекіту туралы
