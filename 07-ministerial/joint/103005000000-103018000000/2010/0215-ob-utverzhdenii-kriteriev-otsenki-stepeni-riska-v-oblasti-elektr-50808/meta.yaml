requisite: Совместный и.о. приказ Министра энергетики и минеральных ресурсов Республики Казахстан от 15 февраля 2010 года № 36 и Министра экономики и бюджетного планирования Республики Казахстан от 18 февраля 2010 года № 75. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2010 года № 6066. Утратил силу совместным приказом Министра энергетики Республики Казахстан от 14 декабря 2015 года № 716 и Министра национальной экономики Республики Казахстан от 29 декабря 2015 года № 816
title:
  rus: Об утверждении критериев оценки степени риска в области электроэнергетики для объектов, осуществляющих эксплуатацию энергетического оборудования электрических станций, электрических и тепловых сетей, а также электрических и теплоиспользующих установок потребителей
  kaz: Электр станцияларының, электр және жылу желілерінің энергетикалық жабдықтарын, сондай-ақ тұтынушылардың электр және жылу пайдаланатын қондырғыларын пайдалануды жүзеге асыратын объектілерге арналған электр энергетикасы саласындағы тәуекелдер дәрежесін бағалау критерийлерін бекіту туралы
