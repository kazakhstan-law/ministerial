requisite: Совместный приказ и.о. Министра энергетики и минеральных ресурсов Республики Казахстан от 15 февраля 2010 года № 37 и Министра экономики и бюджетного планирования Республики Казахстан от 18 февраля 2010 года № 76. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2010 года № 6069. Утратил силу совместным приказом Министра энергетики Республики Казахстан от 14 декабря 2015 года № 717 и Министра национальной экономики Республики Казахстан от 29 декабря 2015 года № 828
title:
  rus: Об утверждении формы проверочного листа для объектов, осуществляющих эксплуатацию энергетического оборудования электрических станций, электрических и тепловых сетей, а также электрических и теплоиспользующих установок потребителей
  kaz: Электр станцияларының, электр және жылу желілерінің энергетикалық жабдықтарын пайдалануды жүзеге асыратын объектілерді, сондай-ақ тұтынушылардың электр және жылу пайдаланушы қондырғыларын тексеру парақтарының нысандарын бекіту туралы
