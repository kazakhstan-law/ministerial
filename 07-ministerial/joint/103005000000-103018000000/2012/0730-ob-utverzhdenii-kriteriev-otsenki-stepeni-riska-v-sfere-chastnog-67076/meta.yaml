requisite: Совместный приказ и.о. Министра нефти и газа Республики Казахстан от 30 июля 2012 года № 127 и и.о. Министра экономического развития и торговли Республики Казахстан от 31 июля 2012 года № 234. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 августа 2012 года № 7834. Утратил силу совместным приказом и.о. Министра национальной экономики Республики Казахстан от 30 июня 2015 года № 478 и Министра энергетики Республики Казахстан от 22 июня 2015 года № 419
title:
