  code: '114002'
  requisite: Совместный приказ Министра национальной экономики Республики Казахстан от 30 июня 2017 года № 265 и Министра энергетики Республики Казахстан от 12 июля 2017 года № 240. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 августа 2017 года № 15462. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 24 февраля 2020 года № 12 и Министра энергетики Республики Казахстан от 25 февраля 2020 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в некоторые совместные приказы Председателя Агентства Республики Казахстан по регулированию естественных монополий Министра нефти и газа Республики Казахстан и Министра энергетики и минеральных ресурсов Республики Казахстан
    kaz: Қазақстан Республикасының Табиғи монополияларды реттеу агенттігі төрағасының, Қазақстан Республикасы Мұнай және газ министрінің және Қазақстан Республикасы Энергетика және минералды ресурстар министрінің кейбір бірлескен бұйрықтарына өзгерістер енгізу туралы
