  requisite: Приказ Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 29 марта 1999 года N 04-ОД и Министерства энергетики, индустрии и торговли Республики Казахстан от 29 марта 1999 года N 73. Зарегистрирован в Министерстве юстиции Республики Казахстан 26.04.1999 г. за N 738. Утратил силу - совместным приказом Министра энергетики и минеральных ресурсов РК от 19.05.2005 г. N 152 и Председателя Агентства РК по регулированию естественных монополий от 31.05.2005 г. N 177-ОД
  title:
    rus: О внесении изменения в совместный приказ Комитета Республики Казахстан по регулированию естественных монополий и защите конкуренции и Министерства энергетики, индустрии и торговли Республики Казахстан "Об утверждении "Правил передачи электроэнергии по электрическим сетям регионального и/или местного уровней" от 20 ноября 1998 года N 23-ОД и N 239, зарегистрированного Министерством юстиции Республики Казахстан 4 марта 1999 года N 699
    kaz: Қазақстан Республикасының Әдiлет министрлiгi 1999 жылғы 4 наурызда 699-шы нөмiрмен тiркеген, Қазақстан Республикасының Табиғи монополияларды реттеу және бәсекелестiктi қорғау жөнiндегi комитетi мен Қазақстан Республикасының Энергетика, индустрия және сауда министрлiгiнiң "Электр энергиясын аймақтық және/немесе жергiлiктi деңгейлердегі электр жүйелерi бойынша беру Ережелерiн" бекiту туралы" 1998 жылғы 20-шы қарашадағы N 23-ОД және N 239-шы бiрлескен бұйрығына өзгерiс енгiзу туралы
