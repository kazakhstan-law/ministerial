caused_by:
  code: '104302'
  requisite: Совместный приказ Министра национальной экономики Республики Казахстан от 5 апреля 2016 года № 164 и Министра энергетики Республики Казахстан от 9 июня 2016 года № 239. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 июля 2016 года № 13890. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 24 февраля 2020 года № 12 и Министра энергетики Республики Казахстан от 25 февраля 2020 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в совместный приказ Министра энергетики и минеральных ресурсов Республики Казахстан от 1 декабря 2006 года № 318 и Председателя Агентства Республики Казахстан по регулированию естественных монополий от 29 ноября 2006 года № 276-ОД "Об утверждении перечня видов деятельности, технологически связанных с регулируемыми услугами (товарами, работами) в сферах электро-и теплоэнергетики"
    kaz: '"Электр және жылу энергетикасы салаларындағы реттеліп көрсетілетін қызметтермен (тауарлармен, жұмыстармен) технологиялық байланысты қызмет түрлерінің тізбесін бекіту туралы" Қазақстан Республикасы Энергетика және минералдық ресурстар министрінің 2006 жылғы 1 желтоқсандағы № 318 және Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2006 жылғы 29 қарашадағы № 276-НҚ бірлескен бұйрығына өзгеріс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/104302/rus
