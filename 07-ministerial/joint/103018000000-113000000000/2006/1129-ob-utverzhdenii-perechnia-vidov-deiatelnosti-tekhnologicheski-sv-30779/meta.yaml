caused_by:
  code: '44942'
  requisite: Совместный приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 26 февраля 2009 года N 70-ОД и Министра энергетики и минеральных ресурсов Республики Казахстан от 27 февраля 2009 года N 51. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 марта 2009 года N 5601. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 24 февраля 2020 года № 12 и Министра энергетики Республики Казахстан от 25 февраля 2020 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении дополнения и изменений в совместный приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 29 ноября 2006 года № 276-ОД и Министра энергетики и минеральных ресурсов Республики Казахстан от 1 декабря 2006 года № 318 "Об утверждении перечня видов деятельности, технологически связанных с регулируемыми услугами (товарами, работами) в сферах электро- и теплоэнергетики"
    kaz: '"Электр және жылу энергетикасы саласындағы реттеліп көрсетілетін қызметтерге (тауарларға, жұмыстарға) технологиялық байланысты қызмет түрлерінің тізбесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігінің 2006 жылғы 29 қарашадағы N 276-НҚ және Қазақстан Республикасы Энергетика және минералдық ресурстар министрлігінің 2006 жылғы 1 желтоқсандағы N 318 бірлескен бұйрығына толықтыру мен өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/44942/rus
