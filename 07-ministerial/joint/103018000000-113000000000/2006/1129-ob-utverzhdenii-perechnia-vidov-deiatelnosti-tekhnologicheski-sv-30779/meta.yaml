act_code: '30779'
requisite: Совместный приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 29 ноября 2006 года N 276-ОД и Министра энергетики и минеральных ресурсов Республики Казахстан от 1 декабря 2006 года N 318. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 декабря 2006 года N 4469. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 24 февраля 2020 года № 12 и Министра энергетики Республики Казахстан от 25 февраля 2020 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня видов деятельности, технологически связанных с регулируемыми услугами (товарами, работами) в сферах электро- и теплоэнергетики
  kaz: Электр- және жылу энергетикасы салаларындағы реттеліп көрсетілетін қызметтермен (тауарлармен, жұмыстармен) технологиялық байланысты қызмет түрлерінің тізбесін бекіту туралы
