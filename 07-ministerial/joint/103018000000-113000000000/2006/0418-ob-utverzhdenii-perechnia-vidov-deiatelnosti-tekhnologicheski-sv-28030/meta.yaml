caused_by:
  code: '54963'
  requisite: Совместный приказ и.о. Министра нефти и газа Республики Казахстан от 6 сентября 2010 года № 296 и Председателя Агентства Республики Казахстан по регулированию естественных монополий от 15 сентября 2010 года № 272-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 октября 2010 года № 6532. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 24 февраля 2020 года № 12 и Министра энергетики Республики Казахстан от 25 февраля 2020 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в совместный приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 18 апреля 2006 года № 112-ОД и Министра энергетики и минеральных ресурсов Республики Казахстан от 10 мая 2006 года № 148 "Об утверждении перечня видов деятельности, технологически связанных с регулируемыми услугами (товарами, работами) в сферах хранения, транспортировки газа или газового конденсата по магистральным и (или) распределительным трубопроводам, эксплуатации газораспределительных установок и связанных с ними газораспределительных газопроводов"
    kaz: '"Газды немесе газ конденсатын сақтау, магистральдық және (немесе) тарату құбыр жолдары арқылы тасымалдау, газ тарату қондырғыларын және олармен байланысты газ таратушы газ құбырларын пайдалану салаларындағы реттеліп көрсетілетін қызметтермен (тауарлармен, жұмыстармен) технологиялық байланысты қызмет түрлерінің тізбесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2006 жылғы 18 сәуірдегі № 112-НҚ және Қазақстан Республикасы Энергетика және минералдық ресурстар министрінің 2006 жылғы 10 мамырдағы № 148 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/54963/rus
