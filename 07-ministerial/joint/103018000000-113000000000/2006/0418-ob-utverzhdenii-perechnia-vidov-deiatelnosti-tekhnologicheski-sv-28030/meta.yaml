  requisite: Совместный приказ Министра национальной экономики Республики Казахстан от 22 июня 2016 года № 275 и Министра энергетики Республики Казахстан от 5 августа 2016 года № 378. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 сентября 2016 года № 14207. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 24 февраля 2020 года № 12 и Министра энергетики Республики Казахстан от 25 февраля 2020 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в некоторые совместные приказы Председателя Агентства Республики Казахстан по регулированию естественных монополий, Министра энергетики и минеральных ресурсов Республики Казахстан и Министра нефти и газа Республики Казахстан
    kaz: Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының, Қазақстан Республикасы Энергетика және минералдық ресурстар министрінің және Қазақстан Республикасы Мұнай және газ министрінің кейбір бірлескен бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
