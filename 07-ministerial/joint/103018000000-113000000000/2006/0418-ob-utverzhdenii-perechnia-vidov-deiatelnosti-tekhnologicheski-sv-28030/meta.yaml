act_code: '28030'
requisite: Совместный приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 18 апреля 2006 года № 112-ОД и Министра энергетики и минеральных ресурсов Республики Казахстан от 10 мая 2006 года № 148. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 мая 2006 года № 4244. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 24 февраля 2020 года № 12 и Министра энергетики Республики Казахстан от 25 февраля 2020 года № 60 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня видов деятельности, технологически связанных с регулируемыми услугами (товарами, работами) в сферах по хранению, транспортировке товарного газа по соединительным, магистральным газопроводам и (или) газораспределительным системам, эксплуатации групповых резервуарных установок, а также транспортировке сырого газа по соединительным газопроводам, за исключением хранения, транспортировки товарного газа в целях транзита через территорию Республики Казахстан и экспорта за пределы Республики Казахстан
  kaz: Қазақстан Республикасының аумағы арқылы транзиттеу және Қазақстан Республикасының шегінен тыс жерге экспорттау мақсатында тауарлық газды сақтауды, тасымалдауды қоспағанда, тауарлық газды сақтау, жалғастырушы, магистральдық газ құбырлары және (немесе) газ тарату жүйелері арқылы тасымалдау, топтық резервуарлық қондырғыларды пайдалану, сондай-ақ шикі газды жалғастырушы газ құбырлары арқылы тасымалдау салаларындағы реттелiп көрсетiлетiн қызметтермен (тауарлармен, жұмыстармен) технологиялық байланысты қызмет түрлерiнiң тiзбесiн бекiту туралы
