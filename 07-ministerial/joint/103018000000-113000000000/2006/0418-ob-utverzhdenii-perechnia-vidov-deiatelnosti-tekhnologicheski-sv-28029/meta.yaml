act_code: '28029'
requisite: Совместный приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 18 апреля 2006 года N 113-ОД и Министра энергетики и минеральных ресурсов Республики Казахстан от 10 мая 2006 года N 147. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 мая 2006 года N 4243. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 30 декабря 2013 года № 404-ОД и Министра нефти и газа Республики Казахстан от 30 декабря 2013 года № 244
title:
  rus: Об утверждении перечня видов деятельности, технологически связанных с регулируемыми услугами (товарами, работами) в сферах транспортировки нефти и (или) нефтепродуктов по магистральным трубопроводам
  kaz: Мұнайды және (немесе) мұнай өнімдерін магистральдық құбыр жолдары арқылы тасымалдау салаларындағы реттеліп көрсетілетін қызметтермен (тауарлармен, жұмыстармен) технологиялық байланысты қызмет түрлерінің тізбесін бекіту туралы
