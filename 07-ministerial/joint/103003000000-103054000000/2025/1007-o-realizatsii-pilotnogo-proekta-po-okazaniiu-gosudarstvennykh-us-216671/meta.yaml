act_code: '216671'
requisite: Совместный приказ Министра искусственного интеллекта и цифрового развития Республики Казахстан от 7 октября 2025 года № 500/НҚ и Министра внутренних дел Республики Казахстан от 31 октября 2025 года № 801
title:
  rus: О реализации пилотного проекта по оказанию государственных услуг «Регистрация по месту жительства граждан Республики Казахстан» и «Временная регистрация по месту временного пребывания (проживания) граждан Республики Казахстан» для физических лиц в электронной форме
  kaz: Жеке тұлғалар үшін «Қазақстан Республикасы азаматтарының тұрғылықты жері бойынша тіркеу» және «Қазақстан Республикасы азаматтарының уақытша болатын (тұратын) жері бойынша уақытша тіркеу» мемлекеттік көрсетілетін қызметтер көрсету жөніндегі пилоттық жобаны электрондық нысанда іске асыру туралы
