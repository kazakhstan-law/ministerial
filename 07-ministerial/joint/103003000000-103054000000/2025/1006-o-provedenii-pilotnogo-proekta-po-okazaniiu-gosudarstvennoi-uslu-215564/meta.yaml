requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 6 октября 2025 года № 751 и Заместителя Премьер–Министра - Министра искусственного интеллекта и цифрового развития Республики Казахстан от 7 октября 2025 года № 504
title:
  rus: О проведении пилотного проекта по оказанию государственной услуги «Выдача водительских удостоверений» в части подачи заявки на получение водительского удостоверения впервые в онлайн формате и перевода исключительно в онлайн формат замены водительских удостоверений посредством портала «электронного правительства» и других объектов информатизации
  kaz: «Жүргізуші куәліктерін беру» мемлекеттік қызметін алғаш рет жүргізуші куәлігін алу үшін онлайн форматта өтінім беру және «электрондық үкімет» порталы және басқа да ақпараттандыру обьектілері арқылы жүргізуші куәлігін ауыстыруды тек онлайн форматқа көшіру бөлігінде көрсету бойынша пилоттық жобаны өткізу туралы
