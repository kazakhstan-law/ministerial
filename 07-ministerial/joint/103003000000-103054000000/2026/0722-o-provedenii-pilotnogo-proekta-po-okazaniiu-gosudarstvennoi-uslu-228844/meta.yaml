title:
  rus: О проведении пилотного проекта по оказанию государственной услуги «Выдача паспортов, удостоверений личности гражданам Республики Казахстан» с использованием Программно-аппаратного комплекса «Биометрический терминал документирования»
  kaz: «Қазақстан Республикасының азаматтарына паспорттар, жеке куәліктер беру» мемлекеттік қызметін «Биометриялық құжаттандыру терминалы» бағдарламалық-аппараттық кешенін пайдалана отырып көрсету бойынша пилоттық жобаны жүргізу туралы
