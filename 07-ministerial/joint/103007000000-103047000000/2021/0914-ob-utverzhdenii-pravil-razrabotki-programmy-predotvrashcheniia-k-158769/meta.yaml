title:
  rus: Об утверждении Правил разработки программы предотвращения крупных экологических происшествий при управлении отходами горнодобывающей промышленности, а также внутреннего плана реагирования на такие происшествия
  kaz: Тау-кен өндіру өнеркәсібінің қалдықтарын басқару кезінде ірі экологиялық оқиғаларды болғызбау бағдарламасын, сондай-ақ осындай оқиғаларға ден қоюдың ішкі жоспарын әзірлеу қағидаларын бекіту туралы
