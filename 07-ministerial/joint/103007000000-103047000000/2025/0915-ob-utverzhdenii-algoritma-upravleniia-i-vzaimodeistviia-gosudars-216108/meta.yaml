  title:
    rus: О внесении изменений в совместный приказ Министра экологии и природных ресурсов Республики Казахстан от 15 сентября 2025 года № 240-Ө и Министра по чрезвычайным ситуациям Республики Казахстан от 10 октября 2025 года № 445 «Об утверждении алгоритма управления и взаимодействия государственных органов и организаций при реагировании на чрезвычайную ситуацию»
    kaz: «Төтенше жағдайға ден қою кезіндегі мемлекеттік органдар мен ұйымдарды басқару және өзара іс-қимыл алгоритмін бекіту туралы» Қазақстан Республикасы Экология және табиғи ресурстар министрінің 2025 жылғы 15 қыркүйектегі № 240-Ө және Қазақстан Республикасы Төтенше жағдайлар министрінің 2025 жылғы 10 қазандағы № 445 бірлескен бұйрығына өзгерістер енгізу туралы
