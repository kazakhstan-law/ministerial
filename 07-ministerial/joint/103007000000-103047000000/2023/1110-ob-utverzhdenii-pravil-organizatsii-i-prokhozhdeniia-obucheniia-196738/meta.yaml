requisite: Совместный приказ и.о. Министра по чрезвычайным ситуациям Республики Казахстан от 10 ноября 2023 года № 605 и Министра экологии и природных ресурсов Республики Казахстан от 14 ноября 2023 года № 320-П. Отменен совместным приказом Министра экологии и природных ресурсов Республики Казахстан от 17 января 2025 года № 10-П и Министра по чрезвычайным ситуациям Республики Казахстан от 25 января 2025 года № 25 (вступает в силу со дня подписания его последним из руководителей государственного органа)
title:
  rus: Об утверждении Правил организации и прохождения обучения работников государственной лесной охраны, лесной пожарной станции и руководителей природоохранных и лесных учреждений
