act_code: '226489'
requisite: Совместный приказ Министра обороны от 22 мая 2026 года № 539 и Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 11 июня 2026 года № 307/НҚ
title:
  rus: О запуске пилотного проекта по государственной услуге «Назначение единовременной выплаты на погребение и единовременного пособия членам семьи умершего пенсионера Министерства обороны» в части уведомления в проактивном формате посредством использования цифровой-аналитической системы «Smart Data Ukimet»
  kaz: «Қорғаныс министрлігінің зейнеткері қайтыс болған отбасы мүшелеріне жерлеу рәсіміне біржолғы төлем және біржолғы жәрдемақы тағайындау» мемлекеттік көрсетілетін қызметі бойынша пилоттық жобаны «Smart Data Ukimet» цифрлық-талдамалық жүйесін пайдалану арқылы проактивті форматта хабарлама беру бөлігінде іске қосу туралы
