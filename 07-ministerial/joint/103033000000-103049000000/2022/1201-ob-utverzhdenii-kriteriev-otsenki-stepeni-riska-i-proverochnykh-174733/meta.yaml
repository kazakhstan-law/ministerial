  title:
    rus: О внесении изменений в совместный приказ Министра науки и высшего образования Республики Казахстан от 1 декабря 2022 года №.166 и Министра национальной экономики Республики Казахстан от 2 декабря 2022 года № 116 «Об утверждении критериев оценки степени риска и проверочных листов за системой образования, в части высшего и послевузовского образования»
    kaz: «Жоғары және жоғары оқу орнынан кейінгі білім беру бөлігінде тәуекел дәрежесін бағалау өлшемшарттарын және білім беру жүйесіне тексеру парақтарын бекіту туралы» Қазақстан Республикасы Ғылым және жоғары білім министрінің 2022 жылғы 1 желтоқсандағы № 166 және Қазақстан Республикасы Ұлттық экономика министрінің 2022 жылғы 2 желтоқсандағы № 116 бірлескен бұйрығына өзгерістер енгізу туралы
