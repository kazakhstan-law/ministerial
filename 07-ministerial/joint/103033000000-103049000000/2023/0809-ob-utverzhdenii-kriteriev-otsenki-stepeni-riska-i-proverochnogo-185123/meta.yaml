requisite: Совместный приказ Министра науки и высшего образования Республики Казахстан от 9 августа 2023 года № 399 и Министра национальной экономики Республики Казахстан от 9 августа 2023 года № 147. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 августа 2023 года № 33286. Утратил силу совместным приказом Министра науки и высшего образования Республики Казахстан от 14 июня 2024 года № 297 и и.о. Министра национальной экономики Республики Казахстан от 24 июня 2024 года № 36 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
