    kaz: «Ғылыми сараптаманы ұйымдастыру мен жүргізу, сондай-ақ ғылыми сарапшыларды іріктеу қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2023 жылғы 11 шілдедегі № 473, Қазақстан Республикасы Ұлттық экономика министрінің м.а. 2023 жылғы 12 шілдедегі № 135 және Қазақстан Республикасының Сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі (Сыбайлас жемқорлыққа қарсы қызмет) Төрағасының 2023 жылғы 11 шілдедегі № 223 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
