act_code: '183489'
requisite: Совместный приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 29 июня 2023 года № 259 и и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 29 июня 2023 года № 474. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июня 2023 года № 32958
title:
  rus: Об утверждении Правил определения комиссией перечня категорий и численности иностранных граждан и лиц без гражданства, работающих в юридических лицах, являющихся участниками специальных экономических зон, с проектами стоимостью свыше одного миллиона месячных расчетных показателей, а также в организациях, привлекаемых указанными участниками специальных экономических зон (либо их подрядчиками) в качестве генерального подрядчика, подрядчика, субподрядчика или исполнителя услуг, в период выполнения строительно-монтажных работ на территории специальных экономических зон, и до истечения одного года после ввода объекта (объектов) в эксплуатацию
  kaz: Комиссияның құны миллион айлық есептік көрсеткіштен асатын жобалары бар арнайы экономикалық аймақтардың қатысушылары болып табылатын заңды тұлғаларда, сондай-ақ көрсетілген арнайы экономикалық аймақтардың қатысушылары (не олардың мердігерлері) бас мердігер, мердігер, қосалқы мердігер немесе арнайы экономикалық аймақтардың аумағында құрылыс-монтаждау жұмыстарын орындау кезеңінде қызметтерді орындаушы ретінде және объект (объектілер) пайдалануға берілгеннен кейін бір жыл өткенге дейін тартатын ұйымдарда жұмыс істейтін шетел азаматтары мен азаматтығы жоқ адамдар санатының тізбесін және санын айқындау қағидаларын бекіту туралы
