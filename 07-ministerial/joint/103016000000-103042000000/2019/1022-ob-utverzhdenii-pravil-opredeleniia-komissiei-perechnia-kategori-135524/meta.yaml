act_code: '135524'
requisite: Совместный приказ Министра труда и социальной защиты населения Республики Казахстан от 22 октября 2019 года № 567 и Министра индустрии и инфраструктурного развития Республики Казахстан от 23 октября 2019 года № 798. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 октября 2019 года № 19512. Утратил силу совместным приказом Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 29 июня 2023 года № 259 и и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 29 июня 2023 года № 474 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил определения комиссией перечня категорий и численности иностранцев и лиц без гражданства, работающих в юридических лицах, являющихся участниками специальных экономических зон, с проектами стоимостью свыше одного миллиона месячных расчетных показателей, а также в организациях, привлекаемых указанными участниками специальных экономических зон (либо их подрядчиками) в качестве генерального подрядчика, подрядчика, субподрядчика или исполнителя услуг, в период выполнения строительно-монтажных работ на территории специальных экономических зон, и до истечения одного года после ввода объекта (объектов) в эксплуатацию
  kaz: Комиссияның арнайы экономикалық аймақтардың қатысушылары болып табылатын заңды тұлғаларда құны бір миллион айлық есептік көрсеткіштен жоғары жобалармен, сондай-ақ арнайы экономикалық аймақтардың аумағында құрылыс-монтаж жұмыстарын орындау кезеңінде және объект (объектілер) пайдалануға берілгеннен кейін бір жыл өткенге дейін арнайы экономикалық аймақтардың аталған қатысушылары (не олардың мердігерлері) бас мердігер, мердігер, қосалқы мердігер немесе көрсетілетін қызметтерді орындаушы ретінде тартатын ұйымдарда жұмыс істейтін шетелдіктер мен азаматтығы жоқ адамдар санаттары мен санының тізбесін айқындау қағидаларын бекіту туралы
