act_code: '210473'
requisite: Совместный приказ Министра труда и социальной защиты населения Республики Казахстан от 19 мая 2025 года № 151, и.о. Министра науки и высшего образования Республики Казахстан от 20 мая 2025 года № 262, Министра просвещения Республики Казахстан от 21 мая 2025 года № 116, Министра промышленности и строительства Республики Казахстан от 21 мая 2025 года № 174, и.о. Министра туризма и спорта Республики Казахстан от 20 мая 2025 года № 71 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 19 мая 2025 года № 235/НҚ. Действовал в течение года со дня введения в действие в соответствии с пунктом 7 настоящего совместного приказа
title:
  rus: О реализации пилотного проекта по оказанию некоторых государственных услуг в сферах образования, социальной защиты населения, жилищных отношений и физической культуры на цифровой платформе Министерства труда и социальной защиты населения Республики Казахстан
  kaz: Қазақстан Республикасының Еңбек және халықты әлеуметтік қорғау министрлігінің цифрлық платформасында білім беру, халықты әлеуметтік қорғау, тұрғын-үй қатынастары және дене шынықтыру салаларындағы кейбір мемлекеттік көрсетілетін қызметтерді көрсету бойынша пилоттық жобаны жүзеге асыру туралы
