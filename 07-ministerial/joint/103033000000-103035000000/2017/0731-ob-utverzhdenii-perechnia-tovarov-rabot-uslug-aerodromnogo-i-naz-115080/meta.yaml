act_code: '115080'
requisite: Совместный приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 31 июля 2017 года № 515 и Министра национальной экономики Республики Казахстан от 14 августа 2017 года № 302. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 сентября 2017 года № 15658. Утратил силу совместным приказом Министра по инвестициям и развитию Республики Казахстан от 30 октября 2018 года № 750 и Министра национальной экономики Республики Казахстан от 31 октября 2018 года № 47 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
