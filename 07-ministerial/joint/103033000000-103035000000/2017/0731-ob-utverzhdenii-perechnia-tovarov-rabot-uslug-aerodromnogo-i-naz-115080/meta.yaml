  title:
    rus: О внесении изменений в совместный приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 31 июля 2017 года № 515 и Министра национальной экономики Республики Казахстан от 14 августа 2017 года № 302 «Об утверждении перечня услуг (работ) аэродромного и наземного обслуживания, входящих в состав аэропортовской деятельности»
    kaz: «Әуежай қызметінің құрамына кіретін әуеайлаққа және жерде қызмет көрсету қызметтері (жұмыстары) тізбесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2017 жылғы 31 шілдедегі № 515 және Қазақстан Республикасы Ұлттық экономика министрінің 2017 жылғы 14 тамыздағы № 302 бірлескен бұйрығына өзгерістер енгізу туралы
