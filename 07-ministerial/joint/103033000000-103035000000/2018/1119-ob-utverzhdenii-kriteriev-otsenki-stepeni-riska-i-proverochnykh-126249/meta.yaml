  title:
    rus: О внесении изменений в совместный приказ Министра по инвестициям и развитию Республики Казахстан от 19 ноября 2018 года № 807 и Министра национальной экономики Республики Казахстан от 26 ноября 2018 года № 81 «Об утверждении критериев оценки степени риска и проверочных листов в области архитектуры, градостроительства и строительства за деятельностью субъектов архитектурной, градостроительной и строительной деятельности»
    kaz: «Сәулет, қала құрылысы және құрылыс саласындағы субъектілерге қатысты тексеру жүргізу кезіндегі сәулет, қала құрылысы және құрылыс саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 19 қарашадағы № 807 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 26 қарашадағы № 81 бірлескен бұйрығына өзгерістер енгізу туралы
