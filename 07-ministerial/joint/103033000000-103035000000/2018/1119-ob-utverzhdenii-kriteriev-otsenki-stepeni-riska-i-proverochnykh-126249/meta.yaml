requisite: Совместный приказ Министра по инвестициям и развитию Республики Казахстан от 19 ноября 2018 года № 807 и Министра национальной экономики Республики Казахстан от 26 ноября 2018 года № 81. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 ноября 2018 года № 17818
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов в области архитектуры, градостроительства и строительства за деятельностью субъектов архитектурной, градостроительной и строительной деятельности
  kaz: Сәулет, қала құрылысы және құрылыс саласындағы субъектілерге қатысты тексеру жүргізу кезіндегі сәулет, қала құрылысы және құрылыс саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
