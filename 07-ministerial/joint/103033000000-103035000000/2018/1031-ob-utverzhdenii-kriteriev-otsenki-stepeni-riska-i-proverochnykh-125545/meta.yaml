act_code: '125545'
requisite: Совместный приказ Министра по инвестициям и развитию Республики Казахстан от 31 октября 2018 года № 757 и Министра национальной экономики Республики Казахстан от 31 октября 2018 года № 52. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 ноября 2018 года № 17665. Утратил силу совместным приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 30 декабаря 2022 года № 763 и Министра национальной экономики Республики Казахстан от 19 декабря 2022 года № 130 (вводится в действие с 1 января 2023 года)
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов в области архитектуры, градостроительства и строительства за деятельностью местных исполнительных органов по делам архитектуры, градостроительства, строительства и государственного архитектурно-строительного контроля и надзора
  kaz: Сәулет, қала құрылысы, құрылыс және мемлекеттік сәулет-құрылыс бақылау және қадағалау істері жөніндегі жергілікті атқарушы органдар қызметінің сәулет, қала құрылысы және құрылыс саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
