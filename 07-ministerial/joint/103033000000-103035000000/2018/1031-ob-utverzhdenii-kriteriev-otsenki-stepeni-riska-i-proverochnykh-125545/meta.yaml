  title:
    rus: О внесении изменений в совместный приказ Министра по инвестициям и развитию Республики Казахстан от 31 октября 2018 года № 757 и Министра национальной экономики Республики Казахстан от 31 октября 2018 года № 52 «Об утверждении критериев оценки степени риска и проверочных листов в области архитектуры, градостроительства и строительства за деятельностью местных исполнительных органов по делам архитектуры, градостроительства, строительства и государственного архитектурно-строительного контроля и надзора»
    kaz: «Сәулет, қала құрылысы, құрылыс және мемлекеттік сәулет-құрылыс бақылау және қадағалау істері жөніндегі жергілікті атқарушы органдар қызметінің сәулет, қала құрылысы және құрылыс саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 31 қазандағы № 757 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 31 қазандағы № 52 бірлескен бұйрығына өзгерістер енгізу туралы
