    kaz: «Жер қойнауын зерттеу мен пайдалану саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 23 желтоқсандағы № 1222 және Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 26 желтоқсандағы № 796 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
