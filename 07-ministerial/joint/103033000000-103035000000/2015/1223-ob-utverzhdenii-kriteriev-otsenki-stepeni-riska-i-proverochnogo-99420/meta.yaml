  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра по инвестициям и развитию Республики Казахстан от 23 декабря 2015 года № 1222 и Министра национальной экономики Республики Казахстан от 26 декабря 2015 года № 796 «Об утверждении критериев оценки степени риска и проверочного листа в области изучения и использования недр»
    kaz: «Жер қойнауын зерттеу және пайдалану саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 23 желтоқсандағы № 1222 және Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 26 желтоқсандағы № 796 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
