  title:
    rus: О внесении изменений в совместный приказ Министра по инвестициям и развитию Республики Казахстан от 29 декабря 2015 года № 1264 и исполняющего обязанности Министра национальной экономики Республики Казахстан от 31 декабря 2015 года № 842 «Об утверждении критериев оценки степени риска и проверочных листов за соблюдением законодательства Республики Казахстан о туристской деятельности»
    kaz: «Қазақстан Республикасының туристік қызмет туралы заңнамасының сақталуына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 29 желтоқсандағы № 1264 және Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 31 желтоқсандағы № 842 бірлескен бұйрығына өзгерістер енгізу туралы
