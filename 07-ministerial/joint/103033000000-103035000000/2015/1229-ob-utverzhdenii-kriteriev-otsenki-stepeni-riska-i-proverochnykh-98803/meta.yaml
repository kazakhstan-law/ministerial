act_code: '98803'
requisite: Совместный приказ Министра по инвестициям и развитию Республики Казахстан от 29 декабря 2015 года № 1264 и и.о. Министра национальной экономики Республики Казахстан от 31 декабря 2015 года № 842. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 февраля 2016 года № 12991
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов за соблюдением законодательства Республики Казахстан о туристской деятельности
  kaz: Қазақстан Республикасының туристік қызмет туралы заңнамасының сақталуына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
