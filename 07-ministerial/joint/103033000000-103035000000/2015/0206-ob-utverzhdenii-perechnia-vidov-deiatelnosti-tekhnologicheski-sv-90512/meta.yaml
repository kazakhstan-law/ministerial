requisite: Совместный приказ Министра по инвестициям и развитию Республики Казахстан от 15 апреля 2015 года № 446 и Министра национальной экономики Республики Казахстан от 6 февраля 2015 года № 80. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 мая 2015 года № 11232. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 6 апреля 2020 года № 25 и и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 13 апреля 2020 года № 199 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
