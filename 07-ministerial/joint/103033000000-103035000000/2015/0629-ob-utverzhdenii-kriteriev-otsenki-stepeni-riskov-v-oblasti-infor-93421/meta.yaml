requisite: Совместный приказ Министра по инвестициям и развитию Республики Казахстан от 29 июня 2015 года № 735 и и.о. Министра национальной экономики Республики Казахстан от 30 июня 2015 года № 494. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 августа 2015 года № 11891.  Утратил силу совместным приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 30 декабря 2015 года № 1275 и и.о. Министра национальной экономики Республики Казахстан от 31 декабря 2015 года № 841
title:
  rus: Об утверждении критериев оценки степени рисков в области информатизации, связи, за соблюдением законодательства Республики Казахстан об электронном документе и электронной цифровой подписи
  kaz: Электрондық құжат және электрондық цифрлық қолтаңба туралы Қазақстан Республикасы заңнамасының сақталуына, ақпараттандыру, байланыс саласындағы тәуекелдер дәрежесін бағалау критерийлерін бекіту туралы
