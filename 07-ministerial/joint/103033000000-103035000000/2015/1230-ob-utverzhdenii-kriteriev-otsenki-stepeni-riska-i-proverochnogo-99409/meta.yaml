requisite: Совместный приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 30 декабря 2015 года № 1282 и и.о. Министра национальной экономики Республики Казахстан от 31 декабря 2015 года № 844. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 февраля 2016 года № 13009. Утратил силу совместным приказом Министра информации и коммуникаций Республики Казахстан от 31 октября 2018 года № 455 и Министра национальной экономики Республики Казахстан от 31 октября 2018 года № 39 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
