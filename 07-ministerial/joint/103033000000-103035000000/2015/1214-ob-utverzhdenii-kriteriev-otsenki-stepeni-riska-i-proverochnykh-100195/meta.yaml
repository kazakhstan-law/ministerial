  code: '165333'
  requisite: Совместный приказ Заместителя Премьер-Министра - Министра торговли и интеграции Республики Казахстан от 14 марта 2022 года № 141-НҚ и Министра национальной экономики Республики Казахстан от 15 марта 2022 года № 22. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 марта 2022 года № 27145
  title:
    rus: О внесении изменений в совместный приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 14 декабря 2015 года № 1199 и Министра национальной экономики Республики Казахстан от 29 декабря 2015 года № 826 «Об утверждении критериев оценки степени риска и проверочных листов в области технического регулирования, метрологии и за соблюдением законодательства Республики Казахстан об аккредитации в области оценки соответствия»
    kaz: «Техникалық реттеу, метрология саласындағы және Қазақстан Республикасының сәйкестiктi бағалау саласындағы аккредиттеу туралы заңнамасының сақталуы бойынша тәуекел дәрежесінің бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 14 желтоқсандағы № 1199 және Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 29 желтоқсандағы № 826 бірлескен бұйрығына өзгерістер енгізу туралы
