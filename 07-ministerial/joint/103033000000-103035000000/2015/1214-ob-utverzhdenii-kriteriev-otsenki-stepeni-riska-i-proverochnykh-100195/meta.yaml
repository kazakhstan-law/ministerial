act_code: '100195'
requisite: Совместный приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 14 декабря 2015 года № 1199 и Министра национальной экономики Республики Казахстан от 29 декабря 2015 года № 826. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12735
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов в области технического регулирования
  kaz: Техникалық реттеу саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
