  code: '126797'
  requisite: Совместный приказ Министра по инвестициям и развитию Республики Казахстан от 29 ноября 2018 года № 833 и Министра национальной экономики Республики Казахстан от 29 ноября 2018 года № 90. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 ноября 2018 года № 17831
  title:
    rus: О внесении изменений и дополнений в совместный приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 14 декабря 2015 года № 1199 и Министра национальной экономики Республики Казахстан от 29 декабря 2015 года № 826 «Об утверждении критериев оценки степени риска и проверочных листов в области технического регулирования, метрологии и за соблюдением законодательства Республики Казахстан об аккредитации в области оценки соответствия»
    kaz: «Техникалық реттеу, метрология саласындағы және Қазақстан Республикасының сәйкестiктi бағалау саласындағы аккредиттеу туралы заңнамасының сақталуы бойынша тәуекел дәрежесінің бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрі міндетін атқарушының 2015 жылғы 14 желтоқсандағы № 1199 және Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 29 желтоқсандағы № 826 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
