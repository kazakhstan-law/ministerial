  requisite: Совместный приказ Министра информации и коммуникаций Республики Казахстан от 31 октября 2018 года № 456 и Министра национальной экономики Республики Казахстан от 31 октября 2018 года № 40. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 ноября 2018 года № 17675. Утратил силу совместным приказом Министра цифрового развития, оборонной и аэрокосмической промышленности Республики Казахстан от 4 июня 2019 года № 114/НҚ и Министра национальной экономики Республики Казахстан от 6 июня 2019 года № 52 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в совместный приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 30 декабря 2015 года № 1275 и исполняющего обязанности Министра национальной экономики Республики Казахстан от 31 декабря 2015 года № 841 «Об утверждении критериев оценки степени риска и проверочных листов в области информатизации, связи, за соблюдением законодательства Республики Казахстан об электронном документе и электронной цифровой подписи»
    kaz: «Ақпараттандыру, байланыс саласындағы, Қазақстан Республикасының электрондық құжат және электрондық цифрлық қолтаңба туралы заңнамасының сақталуына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 30 желтоқсандағы № 1275 және Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 31 желтоқсандағы № 841 бірлескен бұйрығына өзгерістер енгізу туралы
