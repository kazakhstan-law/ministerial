  title:
    rus: О внесении изменения в совместный приказ Министра цифрового развития, оборонной и аэрокосмической промышленности Республики Казахстан от 4 июня 2019 года № 114/НҚ и Министра национальной экономики Республики Казахстан от 6 июня 2019 года № 52 «Об утверждении критериев оценки степени риска и проверочных листов в сфере информатизации, связи, за соблюдением законодательства Республики Казахстан об электронном документе и электронной цифровой подписи»
    kaz: «Ақпараттандыру, байланыс саласындағы, Қазақстан Республикасының электрондық құжат және электрондық цифрлық қолтаңба туралы заңнамасының сақталуына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Цифрлық даму, қорғаныс және аэроғарыш өнеркәсібі министрінің 2019 жылғы 4 маусымдағы № 114/НҚ және Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 6 маусымдағы № 52 бірлескен бұйрығына өзгеріс енгізу туралы
