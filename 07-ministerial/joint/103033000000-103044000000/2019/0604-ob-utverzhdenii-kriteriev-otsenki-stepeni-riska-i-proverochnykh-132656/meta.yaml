requisite: Совместный приказ Министра цифрового развития, оборонной и аэрокосмической промышленности Республики Казахстан от 4 июня 2019 года № 114/НҚ и Министра национальной экономики Республики Казахстан от 6 июня 2019 года № 52. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 июня 2019 года № 18805
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов в сфере информатизации, связи, за соблюдением законодательства Республики Казахстан об электронном документе и электронной цифровой подписи
  kaz: Ақпараттандыру, байланыс саласындағы, Қазақстан Республикасының электрондық құжат және электрондық цифрлық қолтаңба туралы заңнамасының сақталуына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
