act_code: '189359'
requisite: Совместный приказ Министра просвещения Республики Казахстан от 30 ноября 2023 года № 351 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 30 ноября 2023 года № 591/НҚ
title:
  rus: О реализации пилотного проекта по оказанию государственных услуг «Постановка на очередь детей дошкольного возраста (до 6 лет) для направления в дошкольные организации» и «Прием документов и зачисление детей в дошкольные организации» посредством «Единой базы учета, очередности и выдачи направлений в дошкольные организации» в информационной системе «Национальная образовательная база данных»
  kaz: «Ұлттық білім беру дерекқоры» ақпараттық жүйесіндегі «Мектепке дейінгі ұйымдарға жолдамаларды берудің, кезектілік пен есепке алудың бірыңғай базасы» арқылы «Мектепке дейінгі ұйымдарға жіберу үшін мектеп жасына дейінгі (6 жасқа дейін) балаларды кезекке қою» және «Мектепке дейінгі ұйымдарға құжаттарды қабылдау және балаларды қабылдау» мемлекеттік қызметтерін көрсету жөніндегі пилоттық жобаны іске асыру туралы
