requisite: Совместный приказ Министра просвещения Республики Казахстан от 17 ноября 2023 года № 341 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 17 ноября 2023 года № 556/НҚ. Действовал в течение 12 (двенадцати) месяцев в соответствии с пунктом 9 настоящего совместного приказа
title:
  rus: О реализации пилотного проекта по оказанию государственной услуги «Предоставление бесплатного и льготного питания отдельным категориям обучающихся и воспитанников в общеобразовательных школах»
  kaz: «Жалпы білім беретін мектептердегі білім алушылар мен тәрбиеленушілердің жекелеген санаттарын тегін және жеңілдікпен тамақтандыруды ұсыну» мемлекеттік қызметін көрсету жөніндегі пилоттық жобаны іске асыру туралы
