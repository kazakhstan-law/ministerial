title:
  rus: Об утверждении минимальных требований к компьютерному и интерактивному оборудованию для государственных организаций образования, реализующих образовательные программы начального, основного среднего и общего среднего, специального, технического и профессионального образования
  kaz: Бастауыш, негізгі орта және жалпы орта, арнаулы, техникалық және кәсіптік білімнің білім беру бағдарламаларын іске асыратын мемлекеттік білім беру ұйымдары үшін компьютерлік және интерактивті жабдыққа қойылатын ең төменгі талаптарды бекіту туралы
