requisite: Совместный приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 17 апреля 2023 года № 262, Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 18 апреля 2023 года № 394 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 18 апреля 2023 года № 158/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 апреля 2023 года № 32333
title:
  rus: О реализации пилотного проекта по оказанию государственной услуги «Выдача разрешения на проезд по территории иностранного государства перевозчикам Республики Казахстан в соответствии с международными договорами, ратифицированными Республикой Казахстан»
  kaz: «Қазақстан Республикасы ратификациялаған халықаралық шарттарға сәйкес Қазақстан Республикасының тасымалдаушыларына шет мемлекеттің аумағы бойынша жол жүруге рұқсат беру» мемлекеттік қызмет көрсету жөніндегі пилоттық жобаны іске асыру туралы
