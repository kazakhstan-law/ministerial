  requisite: Совместный приказ Министра транспорта Республики Казахстан от 13 марта 2024 года № 111, Министра финансов Республики Казахстан от 14 марта 2024 года № 140 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 13 марта 2024 года № 143/НҚ
  title:
    rus: О внесении изменений в совместный приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 17 апреля 2023 года № 262, Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 18 апреля 2023 года № 394 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 18 апреля 2023 года № 158/НҚ «О реализации пилотного проекта по оказанию государственной услуги «Выдача разрешения на проезд по территории иностранного государства перевозчикам Республики Казахстан в соответствии с международными договорами, ратифицированными Республикой Казахстан»
    kaz: «Қазақстан Республикасы ратификациялаған халықаралық шарттарға сәйкес Қазақстан Республикасының тасымалдаушыларына шет мемлекеттің аумағы бойынша жол жүруге рұқсат беру» мемлекеттік қызмет көрсету жөніндегі пилоттық жобаны іске асыру туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2023 жылғы 17 сәуірдегі № 262, Қазақстан Республикасы Премьер-Министрінің орынбасары - Қаржы министрінің 2023 жылғы 18 сәуірдегі № 394 және Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2023 жылғы 18 сәуірдегі № 158/НҚ бірлескен бұйрығына өзгерістер енгізу туралы
