requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 30 октября 2018 года № 758 и Министра национальной экономики Республики Казахстан от 30 октября 2018 года № 31. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 октября 2018 года № 17647
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов в области пожарной безопасности и гражданской обороны
  kaz: Өрт қауіпсіздігі және азаматтық қорғаныс саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
