  requisite: Совместный приказ и.о. Министра по чрезвычайным ситуациям Республики Казахстан от 24 декабря 2024 года № 494 и и.о. Министра национальной экономики Республики Казахстан от 25 декабря 2024 года № 111. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2024 года № 35589
  title:
    rus: О внесении изменений в совместный приказ Министра внутренних дел Республики Казахстан от 30 октября 2018 года № 758 и Министра национальной экономики Республики Казахстан от 30 октября 2018 года № 31 «Об утверждении критериев оценки степени риска и проверочных листов, применяемых для проведения профилактического контроля с посещением субъекта (объекта) контроля и надзора в области пожарной безопасности и проверок на соответствие разрешительным требованиям по выданным разрешениям, профилактического контроля с посещением субъекта (объекта) контроля в области гражданской обороны»
    kaz: «Өрт қауіпсіздігі саласындағы бақылау мен қадағалау субъектісіне (объектісіне) бару арқылы профилактикалық бақылауды және берілген рұқсаттар бойынша рұқсат беру талаптарына сәйкестігін тексерулерді, азаматтық қорғаныс саласындағы бақылау субъектісіне (объектісіне) бару арқылы профилактикалық бақылауды жүргізу үшін қолданылатын тәуекел дәрежесін бағалау өлшемшарттары мен тексеру парақтарын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2018 жылғы 30 қазандағы № 758 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 30 қазандағы № 31 бірлескен бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/205425/rus
