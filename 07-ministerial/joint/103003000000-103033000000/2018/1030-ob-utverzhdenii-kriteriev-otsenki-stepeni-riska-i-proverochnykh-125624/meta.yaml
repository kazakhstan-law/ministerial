    kaz: Қазақстан Республикасы Ішкі істер министрінің 2018 жылғы 30 қазандағы № 758 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 30 қазандағы № 31 «Өрт қауіпсіздігі және азаматтық қорғаныс саласындағы тәуекел дәрежесін бағалау өлшемшарттары мен тексеру парақтарын бекіту туралы» бірлескен бұйрығына өзгерістер енгізу туралы
