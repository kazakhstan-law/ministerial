  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра внутренних дел Республики Казахстан от 30 октября 2018 года № 757 и Министра национальной экономики Республики Казахстан от 30 октября 2018 года № 32 «Об утверждении критериев оценки степени риска, проверочных листов по государственному контролю за охранной деятельностью, за деятельностью специализированных учебных центров по подготовке и повышению квалификации работников, занимающих должности руководителя и охранника в частной охранной организации, и за деятельностью по монтажу, наладке и техническому обслуживанию средств охранной сигнализации»
    kaz: «Күзет қызметін, жеке күзет ұйымында басшы және күзетші лауазымдарын атқаратын жұмыскерлерді даярлау және біліктілігін арттыру жөніндегі мамандандырылған оқу орталықтарының қызметін және күзет сигнализациясы құралдарын монтаждау, ретке келтіру және техникалық қызмет көрсету жөніндегі қызметті мемлекеттік бақылау бойынша тәуекел дәрежесін бағалау өлшемшарттарын, тексеру парақтарын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2018 жылғы 30 қазандағы № 757 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 30 қазандағы № 32 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
