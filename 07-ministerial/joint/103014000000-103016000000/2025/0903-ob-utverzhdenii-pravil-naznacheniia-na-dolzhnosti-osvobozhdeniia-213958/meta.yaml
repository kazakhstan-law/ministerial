    kaz: «Мемлекеттік дене шынықтыру-спорт ұйымдарының бірінші басшыларын лауазымға тағайындау, лауазымнан босату қағидаларын бекіту туралы» Қазақстан Республикасы Туризм және спорт министрінің 2025 жылғы 3 қыркүйектегі № 171 және Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің міндетін атқарушысының 2025 жылғы 3 қыркүйектегі № 264 бірлескен бұйрығына өзгерістер енгізу туралы
