act_code: '210780'
requisite: Совместный приказ Министра сельского хозяйства Республики Казахстан от 20 мая 2025 года № 168 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 23 мая 2025 года № 249/НҚ
title:
  rus: О запуске пилотного проекта по государственным услугам «Государственная регистрация (перерегистрация) пестицидов, временная регистрация пестицида биологического препарата с низким риском» и «Аттестация производителей оригинальных, элитных семян, семян первой, второй и третьей репродукций и реализаторов семян» в части переоформления свидетельства при изменении наименования юридического лица проактивным способом в информационно-аналитической системе «Smart Data Ukimet».
  kaz: «Smart Data Ukimet» ақпараттық-талдау жүйесінде заңды тұлғаның атауы проактивті тәсілмен өзгерген кезде куәлікті қайта рәсімдеу бөлігінде «Пестицидтерді мемлекеттік тіркеу (қайта тіркеу), пестицидтерді уақытша тіркеу, төмен қаупі бар биологиялық препаратты тіркеу» және «Бірегей және элиталық тұқымдар, бірінші, екінші және үшінші көбейтілген тұқым өндірушілерді, тұқым өткізушілерді аттестаттау» мемлекеттік көрсетілетін қызметтер бойынша пилоттық жобаны іске қосу туралы
