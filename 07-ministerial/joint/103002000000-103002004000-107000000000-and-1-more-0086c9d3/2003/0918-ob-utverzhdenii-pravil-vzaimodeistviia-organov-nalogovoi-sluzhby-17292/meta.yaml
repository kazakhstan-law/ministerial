act_code: '17292'
requisite: Совместный приказ Генерального прокурора Республики Казахстан от 16 октября 2003 года N 60, Министра финансов Республики Казахстан от 19 сентября 2003 года N 348, Председателя Агентства таможенного контроля Республики Казахстан от 9 октября 2003 года N 461 и Председателя Агентства финансовой полиции Республики Казахстан от 16 октября 2003 года N 163. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 октября 2003 года N 2545. Утратил силу - совместным приказом Генерального прокурора Республики Казахстан от 15 марта 2006 года N 17, Председателя Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовая полиция) от 11 апреля 2006 года N 61, Министра финансов Республики Казахстан от 13 апреля 2006 года N 128
title:
  rus: Об утверждении Правил взаимодействия органов налоговой службы, прокуратуры, таможенных органов и органов финансовой полиции по противодействию неправомерному возврату налога на добавленную стоимость при проведении налоговых проверок по оборотам, облагаемым по нулевой ставке в таможенном режиме экспорта товаров
  kaz: Тауарлардың экспорты кедендік режимінде нөлдік ставка бойынша салық салынатын айналымдар бойынша салық тексерулерін жүргізгенде қосылған құн салығын заңсыз қайтару қарсы іс-әрекет бойынша салық қызметі органдары, прокуратура, кеден органдары мен қаржы полициясы органдарының өзара іс-қимылының ережелерін бекіту туралы
