  title:
    rus: О внесении изменений в совместный приказ Генерального Прокурора Республики Казахстан от 25 сентября 2020 года № 115дсп, Министра финансов Республики Казахстан от 25 сентября 2020 года № 923дсп, Председателя Комитета национальной безопасности Республики Казахстан от 25 сентября 2020 года № 58/дсп и Министра внутренних дел Республики Казахстан от 11 сентября 2020 года № 156дсп «Об утверждении Правил подготовки заключения правоохранительными или специальными государственными органами Республики Казахстан об исключении физического лица, отбывшего уголовное наказание, из перечня организаций и лиц, связанных с финансированием терроризма и экстремизма»
    kaz: «Қазақстан Республикасының құқық қорғау немесе арнаулы мемлекеттік органдарының қылмыстық жазасын өтеген жеке тұлғаны терроризмді және экстремизмді қаржыландырумен байланысты ұйымдар мен тұлғалар тізбесінен алып тастау жөнінде қорытынды дайындау қағидаларын бекіту туралы» Қазақстан Республикасы Бас прокурорының 2020 жылғы 25 қыркүйектегі № 115қбпү, Қазақстан Республикасы Қаржы министрінің 2020 жылғы 25 қыркүйектегі № 923қбпү, Қазақстан Республикасы Ұлттық қауіпсіздік комитеті төрағасының 2020 жылғы 25 қыркүйектегі № 58/қбпү, Қазақстан Республикасы Ішкі істер министрінің 2020 жылғы 11 қыркүйектегі № 156қбпү бірлескен бұйрығына өзгерістер енгізу туралы
