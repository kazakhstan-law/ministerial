requisite: Совместный приказ Министра финансов Республики Казахстан от 25 сентября 2020 года № 923 дсп, Министра внутренних дел Республики Казахстан от 11 сентября 2020 года № 156 дсп, Председателя Комитета национальной безопасности Республики Казахстан от 25 сентября 2020 года № 58/дсп и Генерального Прокурора Республики Казахстан от 25 сентября 2020 года № 115 дсп. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 сентября 2020 года № 21318
title:
  rus: Об утверждении Правил подготовки заключения правоохранительными или специальными государственными органами Республики Казахстан об исключении физического лица, отбывшего уголовное наказание, из перечня организаций и лиц, связанных с финансированием терроризма и экстремизма
  kaz: Қазақстан Республикасының құқық қорғау немесе арнаулы мемлекеттік органдарының қылмыстық жазасын өтеген жеке тұлғаны терроризмді және экстремизмді қаржыландырумен байланысты ұйымдар мен тұлғалардың тізбесінен алып тастау жөнінде қорытынды дайындау қағидаларын бекіту туралы
