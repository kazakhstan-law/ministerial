requisite: Совместный приказ и.о. Министра труда и социальной защиты населения Республики Казахстан от 5 августа 2011 года № 285-Ө и и.о. Министра экономического развития и торговли Республики Казахстан от 5 августа 2011 года № 233. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 августа 2011 года № 7111. Утратил силу совместным приказом Министра здравоохранения и социального развития Республики Казахстан от 30 июня 2015 года № 541 и Министра национальной экономики Республики Казахстан от 2 июля 2015 года № 496
title:
