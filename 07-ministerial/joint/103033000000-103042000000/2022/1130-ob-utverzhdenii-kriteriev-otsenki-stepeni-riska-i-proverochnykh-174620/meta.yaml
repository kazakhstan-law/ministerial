  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 30 ноября 2022 года № 665 и исполняющего обязанности Министра национальной экономики Республики Казахстан от 30 ноября 2022 года № 103 «Об утверждении критериев оценки степени риска и проверочных листов в сферах естественных монополий (услуг аэропортов и аэронавигации) и за соблюдением порядка ценообразования и обязанностей субъекта общественно значимого рынка (услуг аэропортов)»
    kaz: «Табиғи монополиялар (әуежайлар мен аэронавигация қызметтері) салаларындағы субъектілердің және баға белгілеу тәртібінің және қоғамдық маңызы бар нарық (әуежайлар қызметтері) субъектісі міндеттерінің сақталуына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2022 жылғы 30 қарашадағы № 665 және Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2022 жылғы 30 қарашадағы № 103 бірлескен бұйрығына өзгерістер енгізу туралы
