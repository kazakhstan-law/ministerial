act_code: '174620'
requisite: Совместный приказ и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 30 ноября 2022 года № 665 и и.о. Министра национальной экономики Республики Казахстан от 30 ноября 2022 года № 103. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 декабря 2022 года № 30870
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов в сферах естественных монополий (услуг аэропортов и аэронавигации) и за соблюдением порядка ценообразования и обязанностей субъекта общественно значимого рынка (услуг аэропортов)
  kaz: Табиғи монополиялар (әуежайлар мен аэронавигация қызметтері) салаларындағы субъектілердің және баға белгілеу тәртібінің және қоғамдық маңызы бар нарық (әуежайлар қызметтері) субъектісі міндеттерінің сақталуына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
