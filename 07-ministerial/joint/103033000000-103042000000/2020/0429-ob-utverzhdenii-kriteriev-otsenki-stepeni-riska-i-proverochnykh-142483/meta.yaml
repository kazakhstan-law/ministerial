requisite: Совместный приказ и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 29 апреля 2020 года № 253 и Министра национальной экономики Республики Казахстан от 30 апреля 2020 года № 33. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 мая 2020 года № 20557
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов в пределах границ населенных пунктов на объектах социальной инфраструктуры в сферах управления жилищным фондом, газа и газоснабжения
  kaz: Елді мекендердің шекаралары шегінде тұрғын үй қорын басқару, газ және газбен жабдықтау салаларындағы әлеуметтік инфрақұрылым объектілерінде тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
