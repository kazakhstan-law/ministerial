  requisite: Совместный приказ Министра промышленности и строительства Республики Казахстан от 16 июля 2026 года № 364 и Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 22 июля 2026 года № 112. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 июля 2026 года № 39379
  title:
    rus: О внесении изменений и дополнений в совместный приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 29 апреля 2020 года № 253 и Министра национальной экономики Республики Казахстан от 30 апреля 2020 года № 33 «Об утверждении критериев оценки степени риска и проверочных листов в пределах границ населенных пунктов на объектах социальной инфраструктуры в сферах управления жилищным фондом, газа и газоснабжения»
    kaz: «Елді мекендердің шекаралары шегінде тұрғын үй қорын басқару, газ және газбен жабдықтау салаларындағы әлеуметтік инфрақұрылым объектілерінде тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2020 жылғы 29 сәуірдегі № 253 және Қазақстан Республикасы Ұлттық экономика министрінің 2020 жылғы 30 сәуірдегі № 33 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
