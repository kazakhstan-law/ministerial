  requisite: Совместный приказ и.о. Министра промышленности и строительства Республики Казахстан от 22 сентября 2023 года № 11 и Министра национальной экономики Республики Казахстан от 22 сентября 2023 года № 168. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 октября 2023 года № 33569
  title:
    rus: О внесении изменений в совместный приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 29 апреля 2020 года № 253 и Министра национальной экономики Республики Казахстан от 30 апреля 2020 года № 33 «Об утверждении критериев оценки степени риска и проверочных листов в пределах границ населенных пунктов на объектах социальной инфраструктуры в сферах управления жилищным фондом, газа и газоснабжения, в области промышленной безопасности по соблюдению требований безопасной эксплуатации опасных технических устройств»
    kaz: «Елді мекендердің шекаралары шегінде тұрғын үй қорын басқару, газ және газбен жабдықтау салаларындағы, өнеркәсіптік қауіпсіздік саласындағы әлеуметтік инфрақұрылым объектілерінде қауіпті техникалық құрылғыларды қауіпсіз пайдалану талаптарының сақталуы бойынша тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2020 жылғы 29 сәуірдегі № 253 және Қазақстан Республикасы Ұлттық экономика министрінің 2020 жылғы 30 сәуірдегі № 33 бірлескен бұйрығына өзгерістер енгізу туралы
