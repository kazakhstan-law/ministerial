requisite: Совместный приказ и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 15 мая 2020 года № 297 и Министра национальной экономики Республики Казахстан от 19 мая 2020 года № 40. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 мая 2020 года № 20718. Утратил силу совместным приказом и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 30 ноября 2022 года № 665 и и.о. Министра национальной экономики Республики Казахстан от 30 ноября 2022 года № 103 (вводится в действие с 1 января 2023 года)
title:
  rus: Об утверждении проверочных листов в сферах естественных монополий (услуг аэропортов и аэронавигации) и за соблюдением порядка ценообразования и обязанностей субъекта общественно значимого рынка (услуг аэропортов)
  kaz: Табиғи монополиялар салаларындағы (әуежайлар мен аэронавигация қызметтері) және қоғамдық маңызы бар нарық субъектісінің баға белгілеу тәртібінің (әуежайлар қызметтері) және міндеттерінің сақталуын тексеру парақтарын бекіту туралы
