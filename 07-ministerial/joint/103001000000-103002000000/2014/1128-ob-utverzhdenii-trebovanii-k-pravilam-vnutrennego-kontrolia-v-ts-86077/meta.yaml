  title:
    rus: О внесении изменения в совместный приказ Министра финансов Республики Казахстан от 28 ноября 2014 года № 531 и Министра юстиции Республики Казахстан от 11 декабря 2014 года № 360 «Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для нотариусов»
