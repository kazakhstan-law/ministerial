  title:
    rus: О внесении изменений в совместный приказ Министра финансов Республики Казахстан от 28 ноября 2014 года № 531 и Министра юстиции Республики Казахстан от 11 декабря 2014 года № 360 "Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для нотариусов"
    kaz: '"Нотариустарға арналған қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау ережелеріне қойылатын талаптарды бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2014 жылғы 28 қарашадағы № 531 және Қазақстан Республикасы Әділет министрінің 2014 жылғы 11 желтоқсандағы № 360 бірлескен бұйрығына өзгерістер енгізу туралы'
