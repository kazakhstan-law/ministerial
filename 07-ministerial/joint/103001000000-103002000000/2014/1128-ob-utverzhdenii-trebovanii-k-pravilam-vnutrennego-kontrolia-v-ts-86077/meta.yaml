requisite: Совместный приказ Министра финансов Республики Казахстан от 28 ноября 2014 года № 531 и Министра юстиции Республики Казахстан от 11 декабря 2014 года № 360. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 декабря 2014 года № 10000. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 августа 2021 года № 5 и и.о. Министра юстиции Республики Казахстан от 19 августа 2021 года № 722 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для нотариусов
  kaz: Нотариустарға арналған қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы
