  title:
    rus: О внесении изменений в совместный приказ Министра энергетики Республики Казахстан от 15 мая 2018 года № 182, Министра по инвестициям и развитию Республики Казахстан от 24 мая 2018 года № 376 и Министра внутренних дел Республики Казахстан от 19 мая 2018 года № 374 «Об утверждении Национального плана обеспечения готовности и действий к ликвидации разливов нефти на море , внутренних водоемах и в предохранительной зоне Республики Казахстан»
    kaz: «Теңізде, Қазақстан Республикасының ішкі су айдындарында және сақтық аймағында мұнай төгілуі салдарын жоюға арналған дайындықты және іс-қимылдарды қамтамасыз етудің ұлттық жоспарын бекіту туралы» 2018 жылғы 15 мамырдағы № 182 Қазақстан Республикасы Энергетика министрінің, 2018 жылғы 24 мамырдағы № 376 Қазақстан Республикасы Инвестициялар және даму министрінің және 2018 жылғы 19 мамырдағы № 374 Қазақстан Республикасы Ішкі істер министрінің бірлескен бұйрығына өзгерістер енгізу туралы
