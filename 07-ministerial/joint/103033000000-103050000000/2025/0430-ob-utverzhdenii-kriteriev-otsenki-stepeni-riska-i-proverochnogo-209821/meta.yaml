  title:
    rus: О внесении изменений в совместный приказ исполняющего обязанности Министра водных ресурсов и ирригации Республики Казахстан от 30 апреля 2025 года № 85-НҚ и исполняющего обязанности Министра национальной экономики Республики Казахстан от 2 мая 2025 года № 25 «Об утверждении критериев оценки степени риска и проверочного листа субъектам естественных монополий, осуществляющим услуги подачи воды по каналам и регулирования поверхностного стока при помощи подпорных гидротехнических сооружений»
    kaz: «Суды каналдар арқылы беру және тірек гидротехникалық құрылысжайларының көмегімен жерүсті ағынын реттеу қызметін көрсететін табиғи монополия субъектілерінің тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасы Су ресурстары және ирригация министрінің міндетін атқарушының 2025 жылғы 30 сәуірдегі № 85-НҚ және Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2025 жылғы 2 мамырдағы № 25 бірлескен бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/212378/rus
