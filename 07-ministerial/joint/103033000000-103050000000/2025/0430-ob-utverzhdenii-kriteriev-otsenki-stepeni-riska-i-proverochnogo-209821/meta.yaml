requisite: Совместный приказ и.о. Министра водных ресурсов и ирригации Республики Казахстан от 30 апреля 2025 года № 85-НҚ и и.о. Министра национальной экономики Республики Казахстан от 2 мая 2025 года № 25. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 мая 2025 года № 36074
title:
  rus: Об утверждении критериев оценки степени риска и проверочного листа субъектам естественных монополий, осуществляющим услуги подачи воды по каналам, подачи воды для орошения и регулирования поверхностного стока при помощи подпорных гидротехнических сооружений
  kaz: Суды каналдар арқылы беру, суару үшін су беру және тірек гидротехникалық құрылысжайларының көмегімен жерүсті ағынын реттеу қызметін көрсететін табиғи монополия субъектілерінің тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы
