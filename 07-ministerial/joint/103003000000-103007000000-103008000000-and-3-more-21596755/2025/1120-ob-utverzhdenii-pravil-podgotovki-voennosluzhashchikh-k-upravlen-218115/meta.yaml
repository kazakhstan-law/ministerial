title:
  rus: Об утверждении Правил подготовки военнослужащих к управлению транспортными средствами, приема экзаменов и выдачи водительских удостоверений военнослужащих на право управления транспортными средствами, принадлежащими Вооруженным Силам Республики Казахстан, другим войскам и воинским формированиям
  kaz: Әскери қызметшілерді көлік құралдарын басқаруға даярлау, емтихандар қабылдау және Қазақстан Республикасының Қарулы Күштеріне, басқа да әскерлері мен әскери құралымдарына тиесілі көлік құралдарын басқару құқығын беретін әскери қызметшілердің жүргізуші куәліктерін беру қағидаларын бекіту туралы
