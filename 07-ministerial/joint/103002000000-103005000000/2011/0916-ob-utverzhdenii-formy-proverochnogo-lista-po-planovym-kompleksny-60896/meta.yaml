requisite: Совместный приказ Министра финансов Республики Казахстан от 16 сентября 2011 года № 469 и и.о. Министра экономического развития и торговли Республики Казахстан от 16 сентября 2011 года № 304. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 октября 2011 года № 7252. Утратил силу совместным приказом Министра финансов Республики Казахстан от 15 января 2015 года № 25 и Министра национальной экономики Республики Казахстан от 22 января 2015 года № 40
title:
  rus: Об утверждении формы проверочного листа по плановым комплексным или плановым тематическим налоговым проверкам в сфере частного предпринимательства по вопросам исполнения норм налогового законодательства, а также иного законодательства Республики Казахстан, контроль за исполнением которого возложен на органы налоговой службы
  kaz: Салық заңнамасы, сондай-ақ Қазақстан Республикасының өзге де заңнамасының нормаларын орындау салық қызметі органдарына жүктелген бақылауды орындау мәселелері жөніндегі жеке кәсіпкерлік саласында жоспарлы кешендік немесе жоспарлы тақырыптық салық тексерулері жөніндегі тексеру парағының нысанын бекіту туралы
