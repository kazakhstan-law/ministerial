  title:
    rus: О внесении изменения и дополнения в совместный приказ Министра финансов Республики Казахстан от 16 сентября 2011 года № 468, И.о. Министра экономического развития и торговли Республики Казахстан от 16 сентября 2011 года № 302 "Об утверждении Критериев оценки степени рисков в сфере частного предпринимательства вопросам исполнения норм налогового законодательства, а также иного законодательства Республики Казахстан, контроль за исполнением которого возложен на органы налоговой службы"
    kaz: '"Салық заңнамасының, сондай-ақ орындауын бақылау салық қызметі органдарына жүктелген Қазақстан Республикасының өзге де заңнамасының нормаларын орындау мәселелері жөніндегі жеке кәсіпкерлік саласындағы тәуекелдер деңгейін бағалау өлшемдерін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2011 жылғы 16 қыркүйектегі № 468 және Қазақстан Республикасы Экономикалық даму және сауда министрінің м.а. 2011 жылғы 16 қыркүйектегі № 302 бірлескен бұйрығына өзгеріс пен толықтыру енгізу туралы'
