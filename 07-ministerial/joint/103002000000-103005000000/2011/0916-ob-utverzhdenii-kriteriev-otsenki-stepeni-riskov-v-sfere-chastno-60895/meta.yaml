act_code: '60895'
requisite: Совместный приказ Министра финансов Республики Казахстан от 16 сентября 2011 года № 468 и и.о. Министра экономического развития и торговли Республики Казахстан от 16 сентября 2011 года № 302. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 октября 2011 года № 7251. Утратил силу совместным приказом Министра финансов Республики Казахстан от 25 декабря 2015 года № 687 и и.о. Министра национальной экономики Республики Казахстан от 31 декабря 2015 года № 840
title:
  rus: Об утверждении Критериев оценки степени рисков в сфере частного предпринимательства по вопросам исполнения норм налогового законодательства, а также иного законодательства Республики Казахстан, контроль за исполнением которого возложен на органы налоговой службы
  kaz: Салық заңнамасының, сондай-ақ орындауын бақылау салық қызметі органдарына жүктелген Қазақстан Республикасының өзге де заңнамасының нормаларын орындау мәселелері жөніндегі жеке кәсіпкерлік саласындағы тәуекелдер деңгейін бағалау өлшемдерін бекіту туралы
