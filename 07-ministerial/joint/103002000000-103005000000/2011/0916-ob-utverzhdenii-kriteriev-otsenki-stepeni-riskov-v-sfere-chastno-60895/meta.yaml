  requisite: Совместный приказ Заместителя Премьер-Министра Республики Казахстан -  Министра финансов Республики Казахстан от 31 марта 2014 года № 144 и Министра регионального развития Республики Казахстан от 31 марта 2014 года № 96/ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 апреля 2014 года № 9301. Утратил силу совместным приказом Министра финансов Республики Казахстан от 25 декабря 2015 года № 687 и и.о. Министра национальной экономики Республики Казахстан от 31 декабря 2015 года № 840
  title:
    rus: О внесении изменения в совместный приказ Министра финансов Республики Казахстан от 16 сентября 2011 года № 468 и и.о. Министра экономического развития и торговли Республики Казахстан от 16 сентября 2011 года № 302 "Об утверждении Критериев оценки степени рисков в сфере частного предпринимательства вопросам исполнения норм налогового законодательства, а также иного законодательства Республики Казахстан, контроль за исполнением которого возложен на органы налоговой службы"
    kaz: '"Салық заңнамасының, сондай-ақ орындауын бақылау салық қызметті органдарына жүктелген Қазақстан Республикасының өзге де заңнамасының нормаларын орындау мәселелері жөніндегі жеке кәсіпкерлік саласындағы тәуекелдер деңгейін бағалау өлшемдерін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2011 жылғы 16 қыркүйектегі № 468 және Қазақстан Республикасы Экономикалық даму және сауда министрінің м.а. 2011 жылғы 16 қыркүйектегі № 302 бірлескен бұйрығына өзгеріс енгізу туралы'
