requisite: Совместный приказ Министра финансов Республики Казахстан от 10 июня 2011 года № 304 и и.о. Министра экономического развития и торговли Республики Казахстан от 23 июня 2011 года № 183. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 июля 2011 года № 7062. Утратил силу совместным приказом Заместителя Премьер-Министра Республики Казахстан - Министра финансов Республики Казахстан от 20 мая 2014 года № 237 и Министра регионального развития Республики Казахстан от 21 мая 2014 года № 144/ОД
title:
