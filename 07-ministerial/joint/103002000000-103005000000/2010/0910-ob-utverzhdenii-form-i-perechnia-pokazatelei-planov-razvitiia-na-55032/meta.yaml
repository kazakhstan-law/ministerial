requisite: Совместный приказ Министра экономического развития и торговли Республики Казахстан от 10 сентября 2010 года № 177 и Министра финансов Республики Казахстан от 24 сентября 2010 года № 478. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 октября 2010 года № 6545. Утратил силу совместным приказом Министра экономического развития и торговли Республики Казахстан от 15 октября 2012 года № 289 и Министра финансов Республики Казахстан от 15 октября 2012 года № 460
title:
  rus: Об утверждении форм и перечня показателей планов развития национальных управляющих холдингов, национальных холдингов и национальных компаний с участием государства в уставном капитале
  kaz: Ұлттық басқарушы холдингтердің, ұлттық холдингтердің және жарғылық капиталына мемлекет қатысатын ұлттық компаниялардың даму жоспарларының нысандары мен көрсеткіштерінің тізбесін бекіту туралы
