act_code: '69512'
requisite: Совместный приказ Министра финансов Республики Казахстан от 22 ноября 2012 года № 508 и Министра экономического развития и торговли Республики Казахстан от 20 ноября 2012 года № 309. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 декабря 2012 года № 8174. Утратил силу совместным приказом Министра экономики и бюджетного планирования Республики Казахстан от 4 июня 2013 года № 176 и Министра финансов Республики Казахстан от 6 июня 2013 года № 260
title:
  rus: Об утверждении структуры разделов, форм, перечня показателей отчета по исполнению планов развития национальных управляющих холдингов, национальных холдингов и национальных компаний, акционером которых является государство
  kaz: Акционері мемлекет болып табылатын ұлттық басқарушы холдингтердің, ұлттық холдингтердің және ұлттық компаниялардың даму жоспарларын орындау жөніндегі есеп бөлімдерінің құрылымын, нысандарын, көрсеткіштерінің тізбесін бекіту туралы
