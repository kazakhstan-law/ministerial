caused_by:
  code: '73379'
  requisite: Совместный приказ Министра экономики и бюджетного планирования Республики Казахстан от 4 июня 2013 года № 176 и Министра финансов Республики Казахстан от 6 июня 2013 года N 260. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 июля 2013 года № 8548. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 26 мая 2015 года № 402 и Министра финансов Республики Казахстан от 27 мая 2015 года № 327
  title:
    rus: Об утверждении структуры разделов, форм, перечня показателей отчета по исполнению планов развития национальных управляющих холдингов, национальных холдингов и национальных компаний, акционером которых является государство и о признании утратившим силу совместного приказа Министра финансов Республики Казахстан от 22 ноября 2012 года № 508 и Министра экономического развития и торговли Республики Казахстан от 20 ноября 2012 года № 309 "Об утверждении структуры разделов, форм, перечня показателей отчета по исполнению планов развития национальных управляющих холдингов, национальных холдингов и национальных компаний, акционером которых является государство"
    kaz: Акционері мемлекет болып табылатын ұлттық басқарушы холдингтердің, ұлттық холдингтердің және ұлттық компаниялардың даму жоспарларын орындау жөніндегі есеп бөлімдерінің құрылымын, нысандарын, көрсеткіштерінің тізбесін бекіту туралы және "Акционері мемлекет болып табылатын ұлттық басқарушы холдингтердің, ұлттық холдингтердің және ұлттық компаниялардың даму жоспарларын орындау жөніндегі есеп бөлімдерінің құрылымын, нысандарын, көрсеткіштерінің тізбесін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2012 жылғы 22 қарашадағы № 508 және Қазақстан Республикасы Экономикалық даму және сауда министрінің 2012 жылғы 20 қарашадағы № 309 бірлескен бұйрығының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/73379/rus
