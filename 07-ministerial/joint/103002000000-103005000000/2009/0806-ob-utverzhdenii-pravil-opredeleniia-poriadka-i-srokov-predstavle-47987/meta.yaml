requisite: Совместный приказ Министра экономики и бюджетного планирования Республики Казахстан от 6 августа 2009 года № 166 и Министра финансов Республики Казахстан от 25 августа 2009 года № 351. Зарегистрирован в Министерстве юстиции Республики Казахстан от 21 сентября 2009 года № 5797. Утратил силу совместным приказом Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 9 декабря 2025 года № 131 и Министра финансов Республики Казахстан от 10 декабря 2025 года № 765 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
