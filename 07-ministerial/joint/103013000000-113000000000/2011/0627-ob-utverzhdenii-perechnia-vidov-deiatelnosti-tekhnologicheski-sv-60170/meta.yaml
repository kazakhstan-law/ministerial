requisite: Совместный приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 27 июня 2011 года № 186-ОД и Министра транспорта и коммуникаций Республики Казахстан от 30 июня 2011 года № 405. Зарегистрирован Министерством юстиции Республики Казахстан 27 июля 2011 № 7088. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 6 апреля 2020 года № 25 и и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 13 апреля 2020 года № 199 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
