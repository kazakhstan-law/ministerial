  title:
    rus: О внесении изменений в совместный приказ Министра транспорта и коммуникаций Республики Казахстан от 20 июня 2006 года № 146 и Председателя Агентства Республики Казахстан по регулированию естественных монополий от 20 июня 2006 года № 161-ОД "Об утверждении перечня видов деятельности, технологически связанных с регулируемыми услугами (товарами, работами) аэронавигации"
    kaz: '"Аэронавигацияның реттеліп көрсетілетін қызметтеріне (тауарларына, жұмыстарына) технологиялық жағынан байланысты қызмет түрлерінің тізбесін бекіту туралы" Қазақстан Республикасы Көлік және коммуникация министрінің 2006 жылғы 20 маусымдағы № 146 және Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2006 жылғы 20 маусымдағы № 161-НҚ бірлескен бұйрығына өзгерістер енгізу туралы'
