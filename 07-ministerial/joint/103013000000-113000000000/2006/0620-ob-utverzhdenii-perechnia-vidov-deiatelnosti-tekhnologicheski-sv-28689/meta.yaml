act_code: '28689'
requisite: Совместный приказ Министра транспорта и коммуникаций Республики Казахстан от 20 июня 2006 года № 146 и Председателя Агентства Республики Казахстан по регулированию естественных монополий от 20 июня 2006 года № 161-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 июля 2006 года № 4282. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 6 апреля 2020 года № 25 и и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 13 апреля 2020 года № 199 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
