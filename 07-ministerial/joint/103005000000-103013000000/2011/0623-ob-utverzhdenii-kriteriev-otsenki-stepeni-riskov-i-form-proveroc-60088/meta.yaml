act_code: '60088'
requisite: Совместный приказ Министра транспорта и коммуникаций Республики Казахстан от 23 июня 2011 года № 385 и и.о. Министра экономического развития и торговли Республики Казахстан от 29 июня 2011 года № 192. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 июля 2011 № 7089. Утратил силу совместным приказом Министра по инвестициям и развитию Республики Казахстан от 29 июня 2015 года № 739 и Министра национальной экономики Республики Казахстан от 20 июля 2015 года № 543
title:
  rus: Об утверждении Критериев оценки степени рисков и форм проверочных листов в сфере частного предпринимательства по государственному контролю в области автомобильного и железнодорожного транспорта, государственному надзору в области торгового мореплавания и внутреннего водного транспорта
  kaz: Автомобиль және темір жол көлігі саласындағы мемлекеттік бақылау, сауда мақсатында теңізде жүзу және ішкі су көлігі саласындағы мемлекеттік қадағалау бойынша жеке кәсіпкерлік саласында тәуекел дәрежесін бағалау өлшемдерін және тексеру парақтарының нысанын бекіту туралы
