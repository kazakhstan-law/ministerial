  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра транспорта и коммуникаций Республики Казахстан от 23 июня 2011 года № 385 и исполняющего обязанности Министра экономического развития и торговли Республики Казахстан от 29 июня 2011 года № 192 "Об утверждении Критериев оценки степени рисков и форм проверочных листов в сфере частного предпринимательства по государственному контролю в области автомобильного и железнодорожного транспорта, государственному надзору в области торгового мореплавания и внутреннего водного транспорта"
    kaz: '"Автомобиль және темір жол көлігі саласындағы мемлекеттік бақылау, сауда мақсатында теңізде жүзу және ішкі су көлігі саласындағы мемлекеттік қадағалау бойынша жеке кәсіпкерлік саласында тәуекел дәрежесін бағалау өлшемдерін және тексеру парақтарының нысанын бекіту туралы" Көлік және коммуникация министрінің 2011 жылғы 23 маусымдағы № 385 және Экономикалық даму және сауда министрінің міндетін атқарушының 2011 жылғы 29 маусымдағы № 192 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы'
