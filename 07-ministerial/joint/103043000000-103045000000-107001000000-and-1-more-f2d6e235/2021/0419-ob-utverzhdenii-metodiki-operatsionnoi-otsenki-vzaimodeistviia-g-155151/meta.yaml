  requisite: Совместный приказ и.о. Министра культуры и информации Республики Казахстан от 29 апреля 2025 года № 199-НҚ, и.о. Председателя Агентства Республики Казахстан по делам государственной службы от 30 апреля 2025 года № 76, и.о. Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 29 апреля 2025 года № 189/НҚ и Председателя Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан от 29 апреля 2025 года № 28 о/д . Зарегистрирован в Министерстве юстиции Республики Казахстан 5 мая 2025 года № 36070
  title:
    rus: О внесении изменений и дополнения в совместный приказ Председателя Агентства Республики Казахстан по делам государственной службы от 19 апреля 2021 года № 66, Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 19 апреля 2021 года № 138/НҚ, Председателя Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан от 20 апреля 2021 года № 4 и Министра информации и общественного развития Республики Казахстан от 20 апреля 2021 года № 133 «Об утверждении Методики операционной оценки взаимодействия государственного органа с физическими и юридическими лицами»
    kaz: «Мемлекеттік органның жеке және заңды тұлғалармен өзара іс-қимылын операциялық бағалау әдістемесін бекіту туралы» Қазақстан Республикасы Мемлекеттік қызмет істері агенттігі Төрағасының 2021 жылғы 19 сәуірдегі № 66, Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2021 жылғы 19 сәуірдегі № 138/НҚ, Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөніндегі комитеті Төрағасының 2021 жылғы 20 сәуірдегі № 4 және Қазақстан Республикасы Ақпарат және қоғамдық даму министрінің 2021 жылғы 20 сәуірдегі № 133 бірлескен бұйрығына өзгерістер мен толықтыру енгізу туралы
