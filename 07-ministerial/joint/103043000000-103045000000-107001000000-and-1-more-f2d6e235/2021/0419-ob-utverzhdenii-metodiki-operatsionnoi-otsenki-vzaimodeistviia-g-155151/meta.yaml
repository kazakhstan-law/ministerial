  requisite: Совместный приказ Председателя Агентства Республики Казахстан по делам государственной службы от 27 января 2023 года № 21, Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 30 января 2023 года № 32/НҚ, и.о. Председателя Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан от 27 января 2023 года № 19 о/д и Министра информации и общественного развития Республики Казахстан от 27 января 2023 года № 41. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 января 2023 года № 31825
  title:
    rus: О внесении изменения в совместный приказ Председателя Агентства Республики Казахстан по делам государственной службы от 19 апреля 2021 года № 66, Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 19 апреля 2021 года № 138/НҚ, Председателя Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан от 20 апреля 2021 года № 4 и Министра информации и общественного развития Республики Казахстан от 20 апреля 2021 года № 133 «Об утверждении Методики операционной оценки взаимодействия государственного органа с физическими и юридическими лицами»
    kaz: «Мемлекеттік органның жеке және заңды тұлғалармен өзара іс-қимылын операциялық бағалау әдістемесін бекіту туралы» Қазақстан Республикасы Мемлекеттік қызмет істері агенттігі Төрағасының 2021 жылғы 19 сәуірдегі № 66, Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2021 жылғы 19 сәуірдегі № 138/НҚ, Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөніндегі комитеті Төрағасының 2021 жылғы 20 сәуірдегі № 4 және Қазақстан Республикасы Ақпарат және қоғамдық даму министрінің 2021 жылғы 20 сәуірдегі № 133 бірлескен бұйрығына өзгеріс енгізу туралы
