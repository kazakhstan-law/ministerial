title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов за соблюдением законодательства Республики Казахстан об аккредитации в области оценки соответствия
  kaz: Қазақстан Республикасының сәйкестікті бағалау саласындағы аккредиттеу туралы заңнамасының сақталуы бойынша тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
