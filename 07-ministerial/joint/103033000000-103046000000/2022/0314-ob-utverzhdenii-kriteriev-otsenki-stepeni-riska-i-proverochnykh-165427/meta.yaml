  title:
    rus: О внесении изменений и дополнения в совместный приказ Заместителя Премьер-Министра - Министра торговли и интеграции Республики Казахстан от 14 марта 2022 года № 140-НҚ и Министра национальной экономики Республики Казахстан от 15 марта 2022 года № 23 «Об утверждении критериев оценки степени риска и проверочных листов за соблюдением законодательства Республики Казахстан об аккредитации в области оценки соответствия»
    kaz: «Қазақстан Республикасының сәйкестікті бағалау саласындағы аккредиттеу туралы заңнамасының сақталуы бойынша тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Сауда және интеграция министрінің 2022 жылғы 14 наурыздағы № 140-НҚ және Қазақстан Республикасы Ұлттық экономика министрінің 2022 жылғы 15 наурыздағы № 23 бірлескен бұйрығына өзгерістер мен толықтыру енгізу туралы
