act_code: '156914'
requisite: Совместный приказ Министра торговли и интеграции Республики Казахстан от 30 июня 2021 года № 439-НҚ и Министра национальной экономики Республики Казахстан от 1 июля 2021 года № 68. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 июля 2021 года № 23431
title:
  rus: Об утверждении критериев оценки степени риска и проверочного листа за соблюдением законодательства Республики Казахстан в сфере регулирования торговой деятельности
  kaz: Қазақстан Республикасының сауда қызметін реттеу саласындағы заңнамасының сақталуына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы
