caused_by:
  code: '178114'
  requisite: Совместный приказ и.о. Министра торговли и интеграции Республики Казахстан от 16 января 2023 года № 13-НҚ и Министра национальной экономики Республики Казахстан от 18 января 2023 года № 4. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 января 2023 года № 31723
  title:
    rus: О внесении изменений в совместный приказ Министра торговли и интеграции Республики Казахстан от 30 июня 2021 года № 439-НҚ и Министра национальной экономики Республики Казахстан от 1 июля 2021 года № 68 «Об утверждении критериев оценки степени риска и проверочного листа за соблюдением законодательства Республики Казахстан о регулировании торговой деятельности в части соблюдения размера торговой надбавки на социально значимые продовольственные товары и вознаграждения»
    kaz: «Әлеуметтік маңызы бар азық-түлік тауарларына сауда үстемесі мен сыйақы мөлшерін сақтау бөлігінде Қазақстан Республикасының сауда қызметін реттеу туралы заңнамасының сақталуының тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2021 жылғы 30 маусымдағы № 439-НҚ және Қазақстан Республикасы Ұлттық экономика министрінің 2021 жылғы 1 шілдедегі № 68 бірлескен бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/178114/rus
