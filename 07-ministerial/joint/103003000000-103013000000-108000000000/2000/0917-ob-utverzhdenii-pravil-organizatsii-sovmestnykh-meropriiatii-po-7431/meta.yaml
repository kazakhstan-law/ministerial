requisite: Совместный приказ Министра транспорта и коммуникаций Республики Казахстан от 18 сентября 2000 года № 388-I, Министра внутренних дел Республики Казахстан от 27 сентября 2000 года № 520 и Председателя Комитета национальной безопасности Республики Казахстан от 18 октября 2000 года № 127. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 ноября 2000 года № 1294. Утратил силу совместным приказом председателя Комитета национальной безопасности Республики Казахстан от 30 ноября 2004 года № 216, Министра внутренних дел Республики Казахстан от 30 декабря 2004 года № 726 и И.о.Председателя Агентства Республики Казахстан по информатизации и связи от 18 ноября 2004 года № 257 п
title:
  rus: Об утверждении Правил организации совместных мероприятий по выявлению и пресечению незаконно эксплуатируемых радиоэлектронных средств на территории Республики Казахстан
