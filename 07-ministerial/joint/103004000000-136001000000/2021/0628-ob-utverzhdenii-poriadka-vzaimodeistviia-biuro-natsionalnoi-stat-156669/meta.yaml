act_code: '156669'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 28 июня 2021 года № 132 и Заместителя Премьер-Министра - Министра иностранных дел Республики Казахстан от 29 июня 2021 года № 11-1-4/265
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с Министерством иностранных дел Республики Казахстан при проведении национальной переписи населения Республики Казахстан в 2021 году
  kaz: 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының Қазақстан Республикасы Сыртқы істер министрлігімен өзара іс-қимыл тәртібін бекіту туралы
