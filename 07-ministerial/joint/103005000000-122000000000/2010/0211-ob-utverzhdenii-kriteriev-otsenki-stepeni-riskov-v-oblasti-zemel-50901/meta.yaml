act_code: '50901'
requisite: Совместный приказ Председателя Агентства Республики Казахстан по управлению земельными ресурсами от 11 февраля 2010 года № 19-П и Министра экономики и бюджетного планирования Республики Казахстан от 16 февраля 2010 года № 58. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 февраля 2010 года № 6082. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по управлению земельными ресурсами от 28 марта 2011 года № 70-ОД и Министра экономического развития и торговли Республики Казахстан от 1 апреля 2011 года № 82
title:
  rus: Об утверждении критериев оценки степени рисков в области земельных отношений, геодезии и картографии и форм проверочных листов для субъектов, осуществляющих деятельность, связанную с воздействием на состояние земельных ресурсов, в сфере регулирования земельных отношений и в области геодезии и картографии
  kaz: Жер қатынастары, геодезия және картография саласындағы тәуекел дәрежесін бағалау критерийлерін және жер ресурстарының жағдайына әсер ететін қызмет, жер қатынастарын реттеу және геодезия және картография саласындағы қызмет субъектілері үшін тексеру парақтарының нысандарын бекіту туралы
