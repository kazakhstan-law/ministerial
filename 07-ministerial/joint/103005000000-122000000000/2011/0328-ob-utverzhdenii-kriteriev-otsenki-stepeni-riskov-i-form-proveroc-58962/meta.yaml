requisite: Совместный приказ Председателя Агентства Республики Казахстан по управлению земельными ресурсами от 28 марта 2011 года № 70-ОД и Министра экономического развития и торговли Республики Казахстан от 1 апреля 2011 года № 82. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 мая 2011 года № 6943. Утратил силу приказом Министра национальной экономики Республики Казахстан от 23 июня 2015 года № 444
title:
  rus: Об утверждении критериев оценки степени рисков и форм проверочных листов в сфере частного предпринимательства за использованием и охраной земель, геодезической и картографической деятельностью
  kaz: Жерді пайдалану мен қорғау, геодезиялық және картографиялық қызметке қатысты жеке кәсіпкерлік саласындағы тәуекел дәрежесін бағалау критерийлерін және тексеру парақтарының нысандарын бекіту туралы
