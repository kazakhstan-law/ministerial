  title:
    rus: О внесении изменений и дополнений в совместный приказ Председателя Агентства Республики Казахстан по управлению земельными ресурсами от 28 марта 2011 года № 70-ОД и Министра экономического развития и торговли Республики Казахстан от 1 апреля 2011 года № 82 "Об утверждении критериев оценки степени рисков и форм проверочных листов в сфере частного предпринимательства за использованием и охраной земель, геодезической и картографической деятельностью"
    kaz: '"Жерді пайдалану мен қорғау, геодезиялық және картографиялық қызметке қатысты жеке кәсіпкерлік саласындағы тәуекел дәрежесін бағалау критерийлерін және тексеру парақтарының нысандарын бекіту туралы" Қазақстан Республикасы Жер ресурстарын басқару агенттігі Төрағасының 2011 жылғы 28 наурыздағы № 70-ОД және Қазақстан Республикасы Экономикалық даму және сауда Министрінің 2011 жылғы 01 сәуірдегі № 82 бірлескен бұйрығына өзгерiстер мен толықтырулар енгiзу туралы'
  link: https://zan.gov.kz/client/#!/doc/68311/rus
