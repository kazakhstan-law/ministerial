title:
  rus: Об утверждении Правил использования выплат целевых накоплений из единого накопительного пенсионного фонда в целях оплаты образования в соответствии с законодательством Республики Казахстан
  kaz: Қазақстан Республикасының заңнамасына сәйкес білім беру ақысын төлеу мақсатында бірыңғай жинақтаушы зейнетақы қорынан нысаналы жинақ төлемдерін пайдалану қағидаларын бекіту туралы
