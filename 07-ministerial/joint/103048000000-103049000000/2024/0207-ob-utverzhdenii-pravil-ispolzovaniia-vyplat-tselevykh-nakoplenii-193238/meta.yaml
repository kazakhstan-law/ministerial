  title:
    rus: О внесении изменений в совместный приказ Министра науки и высшего образования Республики Казахстан от 7 февраля 2024 года № 51 и Министра просвещения Республики Казахстан от 12 февраля 2024 года № 29 «Об утверждении Правил использования выплат целевых накоплений из единого накопительного пенсионного фонда в целях оплаты образования в соответствии с законодательством Республики Казахстан»
    kaz: «Қазақстан Республикасының заңнамасына сәйкес білім беру ақысын төлеу мақсатында бірыңғай жинақтаушы зейнетақы қорынан нысаналы жинақ төлемдерін пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Ғылым және жоғары білім министрінің 2024 жылғы 7 ақпандағы № 51 және Қазақстан Республикасы Оқу-ағарту министрінің 2024 жылғы 12 ақпанда № 29 бірлескен бұйрығына өзгерістер енгізу туралы
