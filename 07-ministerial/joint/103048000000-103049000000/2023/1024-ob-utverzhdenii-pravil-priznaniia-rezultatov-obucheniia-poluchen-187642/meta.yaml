  title:
    rus: О внесении изменений в совместный приказ Министра науки и высшего образования Республики Казахстан от 24 октября 2023 года № 544 и Министра просвещения Республики Казахстан от 24 октября 2023 года № 322 «Об утверждении Правил признания результатов обучения, полученных через неформальное образование, а также результатов признания профессиональной квалификации»
    kaz: «Формальды емес білім беру арқылы алынған оқыту нәтижелерін, сондай-ақ кәсіптік біліктілікті тану нәтижелерін тану қағидаларын бекіту туралы» Қазақстан Республикасы Ғылым және жоғары білім министрінің 2023 жылғы 24 қазандағы № 544 және Қазақстан Республикасы Оқу-ағарту министрінің 2023 жылғы 24 қазандағы № 322 бірлескен бұйрығына өзгерістер енгізу туралы
