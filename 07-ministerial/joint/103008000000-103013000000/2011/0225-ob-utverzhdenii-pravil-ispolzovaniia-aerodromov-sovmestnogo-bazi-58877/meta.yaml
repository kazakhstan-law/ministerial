  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра транспорта и коммуникаций Республики Казахстан от 25 февраля 2011 года № 91 и Министра обороны Республики Казахстан от 18 марта 2011 года № 128 «Об утверждении Правил использования аэродромов совместного базирования гражданской и государственной авиации Республики Казахстан»
    kaz: «Қазақстан Республикасының азаматтық және мемлекеттік авиациясының бiрлесiп орналастыру әуеайлақтарын пайдалану қағидасын бекіту туралы» Қазақстан Республикасы Көлік және коммуникация Министрінің 2011 жылғы 25 ақпандағы № 91 және Қазақстан Республикасы Қорғаныс Министрінің 2011 жылғы 18 наурыздағы № 128 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
