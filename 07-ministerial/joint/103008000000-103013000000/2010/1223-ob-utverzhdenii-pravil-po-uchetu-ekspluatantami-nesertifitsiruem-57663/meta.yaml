  title:
    rus: О внесении изменения в совместный приказ исполняющего обязанности Министра транспорта и коммуникаций Республики Казахстан от 23 декабря 2010 года № 578 и Министра обороны Республики Казахстан от 3 февраля 2011 года № 55 «Об утверждении Правил по учету эксплуатантами неклассифицируемых и временных аэродромов (вертодромов), посадочных площадок»
    kaz: «Пайдаланушылардың сыныпталмайтын және уақытша әуеайлақтарды (тікұшақ айлақтарын), қону алаңдарын есепке қағидаларын бекіту туралы» Қазақстан Республикасы Көлік және коммуникация министрінің міндетін атқарушының 2010 жылғы 23 желтоқсандағы № 578 және Қазақстан Республикасы Қорғаныс министрінің 2011 жылғы 3 ақпандағы № 55 бірлескен бұйрығына өзгеріс енгізу туралы
