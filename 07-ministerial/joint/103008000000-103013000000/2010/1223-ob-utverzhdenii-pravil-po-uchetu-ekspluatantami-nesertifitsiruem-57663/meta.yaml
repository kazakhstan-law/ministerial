title:
  rus: Об утверждении Правил по учёту эксплуатантами несертифицируемых аэродромов (вертодромов), временных аэродромов (вертодромов) и посадочных площадок
  kaz: Пайдаланушылардың сертификатталмайтын әуеайлақтарды (тікұшақ айлақтарын), уақытша әуеайлақтарды (тікұшақ айлақтарын) және қону алаңдарын есепке алу қағидаларын бекіту туралы
