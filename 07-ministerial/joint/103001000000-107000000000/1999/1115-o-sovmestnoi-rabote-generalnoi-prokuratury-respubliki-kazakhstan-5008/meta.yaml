act_code: '5008'
requisite: Совместный приказ Генерального прокурора Республики Казахстан N 95 от 15 ноября 1999 года и Министра юстиции Республики Казахстан N 90 от 15 ноября 1999 года. Зарегистрирован в Министерстве юстиции Республики Казахстан 15.11.99г. за N 976. Утратил силу - совместным приказом Генерального прокурора Республики Казахстан от 22 января 2001 года N 7-17-5-2001 и Министра юстиции Республики Казахстан от 29 декабря 2000 года N 108 ~V011419
title:
  rus: О совместной работе Генеральной прокуратуры Республики Казахстан и Министерства юстиции Республики Казахстан на 1999-2000гг. по проведению проверок соблюдения законодательства, регулирующего порядок государственной регистрации нормативных правовых актов
  kaz: '"Нормативтiк құқықтық актiлердi мемлекеттiк тiркеу тәртiбiн реттейтiн заңдардың сақталуына тексерулер өткiзу жөнiндегi, Қазақстан Республикасының Бас прокуратурасы мен Қазақстан Республикасы Әдiлет министрлiгiнiң 1999-2000 жылдарға аранлған бiрлескен жұмысы туралы"'
