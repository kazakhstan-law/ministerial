  kaz: «Kaspi Bank» АҚ постоматтары арқылы «Бала тууды тіркеу, оның ішінде азаматтық хал актілері жазбаларына өзгерістер, толықтырулар мен түзетулер енгізу» мемлекеттік қызметінің нәтижелерін беру жөніндегі пилоттық жобаны бекіту туралы
