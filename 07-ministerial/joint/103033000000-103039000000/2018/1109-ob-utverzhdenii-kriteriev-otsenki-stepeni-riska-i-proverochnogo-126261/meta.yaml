  requisite: Совместный приказ и.о. Министра культуры и информации Республики Казахстан от 6 ноября 2024 года № 524-НҚ и Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 8 ноября 2024 года № 100. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 ноября 2024 года № 35360
  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра информации и коммуникаций Республики Казахстан от 9 ноября 2018 года № 473 и Министра национальной экономики Республики Казахстан от 15 ноября 2018 года № 69 «Об утверждении критериев оценки степени риска и проверочного листа за соблюдением законодательства Республики Казахстан о средствах массовой информации»
    kaz: «Қазақстан Республикасының бұқаралық ақпарат құралдары туралы заңнамасының сақталуына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекiту туралы» Қазақстан Республикасы Ақпарат және коммуникациялар министрінің 2018 жылғы 9 қарашадағы № 473 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 15 қарашадағы № 69 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
