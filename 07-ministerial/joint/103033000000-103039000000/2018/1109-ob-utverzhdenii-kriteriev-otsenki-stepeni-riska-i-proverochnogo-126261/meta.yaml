  requisite: Совместный приказ Министра информации и общественного развития Республики Казахстан от 17 мая 2023 года № 199-НҚ и и.о. Министра национальной экономики Республики Казахстан от 18 мая 2023 года № 74. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 мая 2023 года № 32538
  title:
    rus: О внесении изменения в совместный приказ Министра информации и коммуникаций Республики Казахстан от 9 ноября 2018 года № 473 и Министра национальной экономики Республики Казахстан от 15 ноября 2018 года № 69 «Об утверждении критериев оценки степени риска и проверочного листа за соблюдением законодательства Республики Казахстан о средствах массовой информации»
    kaz: «Қазақстан Республикасының бұқаралық ақпарат құралдары туралы заңнамасының сақталуына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекiту туралы» Қазақстан Республикасы Ақпарат және коммуникациялар министрінің 2018 жылғы 9 қарашадағы № 473 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 15 қарашадағы № 69 бірлескен бұйрығына өзгеріс енгізу туралы
