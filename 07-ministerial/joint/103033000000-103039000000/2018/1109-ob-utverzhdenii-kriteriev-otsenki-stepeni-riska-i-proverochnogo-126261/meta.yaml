  requisite: Совместный приказ Министра информации и общественного развития Республики Казахстан от 30 ноября 2022 года № 529 и Министра национальной экономики Республики Казахстан от 1 декабря 2022 года № 112. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 декабря 2022 года № 30929
  title:
    rus: О внесении изменений в совместный приказ Министра информации и коммуникаций Республики Казахстан от 9 ноября 2018 года № 473 и Министра национальной экономики Республики Казахстан от 15 ноября 2018 года № 69 «Об утверждении критериев оценки степени риска и проверочного листа за соблюдением законодательства Республики Казахстан о средствах массовой информации»
    kaz: «Қазақстан Республикасының бұқаралық ақпарат құралдары туралы заңнамасының сақталуына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекiту туралы» Қазақстан Республикасы Ақпарат және коммуникациялар министрінің 2018 жылғы 9 қарашадағы № 473 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 15 қарашадағы № 69 бірлескен бұйрығына өзгерістер енгізу туралы
