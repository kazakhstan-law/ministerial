title:
  rus: Об утверждении критериев оценки степени риска и проверочного листа за соблюдением законодательства Республики Казахстан о масс-медиа
  kaz: Қазақстан Республикасының масс-медиа туралы заңнамасының сақталуына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекiту туралы
