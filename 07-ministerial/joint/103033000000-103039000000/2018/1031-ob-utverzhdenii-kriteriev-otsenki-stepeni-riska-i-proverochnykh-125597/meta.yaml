act_code: '125597'
requisite: Совместный приказ Министра информации и коммуникаций Республики Казахстан от 31 октября 2018 года № 455 и Министра национальной экономики Республики Казахстан от 31 октября 2018 года № 39. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 ноября 2018 года № 17674. Утратил силу совместным приказом Министра культуры и информации Республики Казахстан от 4 сентября 2024 года № 405-НҚ и Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 17 сентября 2024 года № 76 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов за соблюдением законодательства Республики Казахстан о телерадиовещании
  kaz: Қазақстан Республикасының телерадио хабарларын тарату туралы заңнамасының сақталуына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекiту туралы
