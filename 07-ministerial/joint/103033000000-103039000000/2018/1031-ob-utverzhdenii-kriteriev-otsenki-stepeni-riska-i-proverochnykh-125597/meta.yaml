  requisite: Совместный приказ Министра информации и общественного развития Республики Казахстан от 10 ноября 2020 года № 366 и Министра национальной экономики Республики Казахстан от 17 ноября 2020 года № 87. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 ноября 2020 года № 21667. Утратил силу совместным приказом Министра культуры и информации Республики Казахстан от 4 сентября 2024 года № 405-НҚ и Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 17 сентября 2024 года № 76 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в совместный приказ Министра информации и коммуникаций Республики Казахстан от 31 октября 2018 года № 455 и Министра национальной экономики Республики Казахстан от 31 октября 2018 года № 39 «Об утверждении критериев оценки степени риска и проверочных листов за соблюдением законодательства Республики Казахстан о телерадиовещании»
    kaz: «Қазақстан Республикасының телерадио хабарларын тарату туралы заңнамасының сақталуына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасы Ақпарат және коммуникациялар министрінің 2018 жылғы 31 қазандағы № 455 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 31 қазандағы № 39 бірлескен бұйрығына өзгерістер енгізу туралы
