  requisite: Совместный приказ Министра информации и общественного развития Республики Казахстан от 17 мая 2023 года № 198-НҚ и и.о. Министра национальной экономики Республики Казахстан от 18 мая 2023 года № 73. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 мая 2023 года № 32527. Утратил силу совместным приказом Министра культуры и информации Республики Казахстан от 4 сентября 2024 года № 405-НҚ и Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 17 сентября 2024 года № 76 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в совместный приказ Министра информации и коммуникаций Республики Казахстан от 31 октября 2018 года № 455 и Министра национальной экономики Республики Казахстан от 31 октября 2018 года № 39 «Об утверждении критериев оценки степени риска и проверочных листов за соблюдением законодательства Республики Казахстан о телерадиовещании»
    kaz: «Қазақстан Республикасының телерадио хабарларын тарату туралы заңнамасының сақталуына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Ақпарат және коммуникациялар министрінің 2018 жылғы 31 қазандағы № 455 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 31 қазандағы № 39 бірлескен бұйрығына өзгеріс енгізу туралы
