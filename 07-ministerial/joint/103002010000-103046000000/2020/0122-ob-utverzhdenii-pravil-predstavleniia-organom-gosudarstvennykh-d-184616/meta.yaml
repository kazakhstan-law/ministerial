  title:
    rus: О внесении изменений в Совместный приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 22 января 2020 года № 32 и Министра торговли и интеграции Республики Казахстан от 12 февраля 2020 года № 21-НҚ «Об утверждении Правил представления органом государственных доходов конфиденциальной информации Министерству торговли и интеграции Республики Казахстан»
    kaz: «Мемлекеттік кірістер органының Қазақстан Республикасы Сауда және интеграция министрлігіне құпия ақпараттарды беру қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитеті төрағасының 2020 жылғы 22 қаңтардағы № 32 және Қазақстан Республикасы Сауда және интеграция министрінің 2020 жылғы 12 ақпандағы № 21-НҚ бірлескен бұйрығына өзгерістер енгізу туралы бірлескен бұйрық
