  requisite: Совместный Приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 3 мая 2022 года № 283 и Первого вице-министра торговли и интеграции Республики Казахстан от 6 мая 2022 года № 218-ОД
  title:
    rus: О внесении изменения в совместный приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 22 января 2020 года № 32 и Министра торговли и интеграции Республики Казахстан от 12 февраля 2020 года № 21-НҚ «Об утверждении Правил представления органом государственных доходов конфиденциальной информации Министерству торговли и интеграции Республики Казахстан»
    kaz: «Мемлекеттік кірістер органының Қазақстан Республикасының Сауда және интеграция министрлігіне құпия ақпарат беру қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитеті төрағасының 2020 жылғы 22 қаңтардағы № 32 және Қазақстан Республикасының Сауда және интеграция министрінің 2020 жылғы 12 ақпандағы № 21-НҚ бірлескен бұйрығына өзгеріс енгізу туралы
