  requisite: Совместный Приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 1 июня 2021 года № 306 и Министра торговли и интеграции Республики Казахстан от 1 июня 2021 года № 387-ОД
  title:
    rus: О внесении изменений в совместный приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 22 января 2020 года № 32 и Министра торговли и интеграции Республики Казахстан от 12 февраля 2020 года № 21-НҚ «Об утверждении Правил представления органом государственных доходов конфиденциальной информации Министерству торговли и интеграции Республики Казахстан»
    kaz: «Мемлекеттік кірістер органының Қазақстан Республикасының Сауда және интеграция министрлігіне құпия ақпарат беру қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитеті төрағасының 2020 жылғы 22 қаңтардағы № 32 және Қазақстан Республикасының Сауда және интеграция министрінің 2020 жылғы 12 ақпандағы № 21-НҚ бірлескен бұйрығына өзгерістер енгізу туралы
