act_code: '211912'
requisite: Совместный Приказ Председателя Комитета телекоммуникаций Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 26 мая 2025 года № 265/НҚ и Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 27 мая 2025 года № 256
title:
  rus: Об утверждении Правил взаимодействия Комитета телекоммуникаций Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан и Комитета государственных доходов Министерства финансов Республики Казахстан по предоставлению конфиденциальной информации в сфере таможенного регулирования по абонентским устройствам сотовой связи
  kaz: Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлігінің Телекоммуникациялар комитеті мен Қазақстан Республикасы Қаржы министрлігінің Мемлекеттік кірістер комитетінің ұялы байланыстың абоненттік құрылғылары бойынша кедендік реттеу саласындағы құпия ақпаратты ұсыну жөніндегі өзара әрекеттесу Қағидаларын бекіту туралы
