  title:
    rus: О внесении изменений в совместный приказ Министра здравоохранения и социального развития Республики Казахстан от 21 сентября 2016 года № 819, Министра по инвестициям и развитию Республики Казахстан от 28 сентября 2016 года № 688 и Министра внутренних дел Республики Казахстан от 21 сентября 2016 года № 919 «Об утверждении Правил оперативного реагирования и оказания своевременной комплексной помощи лицам, пострадавшим в дорожно-транспортных происшествиях»
    kaz: «Жол-көлік оқиғаларына жедел ден қою және онда зардап шеккен адамдарға уақытылы кешенді көмек көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2016 жылғы 21 қыркүйектегі № 819, Қазақстан Республикасы Инвестициялар және даму министрінің 2016 жылғы 28 қыркүйектегі № 688 және Қазақстан Республикасы Ішкі істер министрінің 2016 жылғы 21 қыркүйектегі № 919 бірлескен бұйрығына өзгерістер енгізу туралы
