act_code: '71874'
requisite: Совместный приказ Генерального прокурора Республики Казахстан от 29 июня 2012 года № 78, Министра внутренних дел Республики Казахстан от 28 июня 2012 года № 378 и Министра здравоохранения Республики Казахстан от 28 июня  2012 года № 438. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 августа 2012 года № 7831. Утратил силу совместным приказом Министра внутренних дел от 22 декабря 2015 года № 1046, Министра здравоохранения и социального развития Республики Казахстан от 29 декабря 2015 года № 1070 и Генерального Прокурора Республики Казахстан от 8 января 2016 года № 1
title:
  rus: Об утверждении формы отчета № ДТП-1 "О лицах, пострадавших в дорожно-транспортных происшествиях" и информационных учетных документов № ДТП-1 "Карточка учета дорожно-транспортного происшествия" и № ДТП-2 "Карточка на лицо, раненое или погибшее в дорожно-транспортном происшествии", а также Инструкции о порядке их заполнения
  kaz: '"Жол көлік оқиғасы салдарынан зардап шеккен адамдар туралы" № ЖКО-1 нысанды есепті, "Жол көлік оқиғасын есепке алу карточкасы" № ЖКО-1 және "Жол көлік оқиғасы салдарынан жарақаттанған немесе қаза болған адам туралы карточка" № ЖКО-2 ақпараттық есепке алу құжаттарын, сонымен қатар оларды толтыру тәртібі туралы Нұсқаулықты бекіту туралы'
