act_code: '59152'
requisite: Совместный приказ Генерального прокурора Республики Казахстан от 6 апреля 2011 года № 27, Министра внутренних дел Республики Казахстан от 8 апреля 2011 года № 155 и Министра здравоохранения Республики Казахстан от 12 апреля 2011 года № 185. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 мая 2011 года № 6942. Утратил силу совместным приказом Генерального прокурора Республики Казахстан от 29 июня 2012 года № 78, Министра внутренних дел Республики Казахстан от 28 июня 2012 года № 378 и Министра здравоохранения Республики Казахстан от 28 июня  2012 года № 438
title:
  rus: Об утверждении формы отчета № ДТП-1 "О лицах, пострадавших в дорожно-транспортных происшествиях" и форм карточек № ДТП-1 "Карточка учета дорожно-транспортного происшествия" и № ДТП-2 "Карточка на лицо, пострадавшее в результате дорожно-транспортного происшествия" и Инструкции по их заполнению
  kaz: '"Жол-көлік оқиғаларынан зардап шеккен тұлғалар туралы" № ЖКО-1 есебінің нысанын және "Жол-көлік оқиғасын есепке алу карточкасы" № ЖКО-1, сондай-ақ "Жол-көлік оқиғасы нәтижесінен зардап шеккен тұлғаға арналған карточка" № ЖКО-2 карточкаларының нысандарын және оларды толтыру Нұсқаулығын бекіту туралы'
