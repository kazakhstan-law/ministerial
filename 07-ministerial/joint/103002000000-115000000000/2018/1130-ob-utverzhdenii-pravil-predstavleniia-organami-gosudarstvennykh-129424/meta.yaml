  code: '202618'
  requisite: Совместный приказ Министра финансов Республики Казахстан от 8 ноября 2024 года № 758 и нормативное постановление Высшей аудиторской палаты Республики Казахстан от 8 ноября 2024 года № 14-НҚ. Утратило силу совместным нормативным постановлением Высшей аудиторской палаты Республики Казахстан от 14 мая 2026 года № 4-НҚ и приказ Министра финансов Республики Казахстан от 15 мая 2026 года № 308 (вводятся в действие по истечении десяти календарных дней после дня их первого официального опубликования)
  title:
    rus: О внесении дополнения в Совместный приказ Министра финансов Республики Казахстан от 30 ноября 2018 года № 1040 и нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 4 марта 2019 года № 3-НҚ «Об утверждении Правил представления органами государственных доходов уполномоченному органу внешнего государственного аудита и финансового контроля информации в сфере таможенного регулирования и сведений о налогоплательщике (налоговом агенте), составляющих налоговую тайну, без получения письменного разрешения налогоплательщика (налогового агента) и перечня представляемых сведений»
    kaz: «Мемлекеттік кірістер органдарының сыртқы мемлекеттік аудит және қаржылық бақылау уәкілетті органына салық төлеушінің (салық агентінің) жазбаша рұқсатын алмастан кедендік реттеу саласындағы ақпаратты және салықтық құпияны құрайтын салық төлеуші (салық агенті) туралы мәліметтерді ұсыну қағидаларын және ұсынатын мәліметтер тізбесін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 30 қарашадағы № 1040 және Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің 2019 жылғы 4 наурыздағы № 3-НҚ бірлескен нормативтік қаулысы мен бұйрығына толықтыру енгізу туралы
