  code: '179136'
  requisite: Совместные нормативное постановление Высшей аудиторской палаты Республики Казахстан от 17 февраля 2023 года № 5-НҚ и приказ Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 13 марта 2023 года № 271. Утратило силу совместным нормативным постановлением Высшей аудиторской палаты Республики Казахстан от 14 мая 2026 года № 4-НҚ и приказ Министра финансов Республики Казахстан от 15 мая 2026 года № 308 (вводятся в действие по истечении десяти календарных дней после дня их первого официального опубликования)
  title:
    rus: О внесении изменений в совместный приказ Министра финансов Республики Казахстан от 30 ноября 2018 года № 1040 и нормативное постановление Счетного комитета по контролю за исполнением республиканского бюджета от 4 марта 2019 года № 3-НҚ «Об утверждении Правил представления органами государственных доходов уполномоченному органу внешнего государственного аудита и финансового контроля сведений о налогоплательщике (налоговом агенте), составляющих налоговую тайну, без получения письменного разрешения налогоплательщика (налогового агента) и перечня представляемых сведений
    kaz: «Мемлекеттік кірістер органдарының сыртқы мемлекеттік аудит және қаржылық бақылау уәкілетті органына салық төлеушінің (салық агентінің) жазбаша рұқсатын алмастан кедендік реттеу саласындағы ақпаратты және салықтық құпияны құрайтын салық төлеуші (салық агенті) туралы мәліметтерді ұсыну қағидаларын және ұсынатын мәліметтер тізбесін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 30 қарашадағы № 1040 бұйрығына және Республикалық бюджеттің атқарылуын бақылау жөніндегі есеп комитетінің 2019 жылғы 4 наурыздағы № 3-НҚ бірлескен нормативтік қаулысына өзгерістер енгізу туралы
