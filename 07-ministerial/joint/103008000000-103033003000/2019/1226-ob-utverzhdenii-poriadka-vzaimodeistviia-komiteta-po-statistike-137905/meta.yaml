requisite: Совместный приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 26 декабря 2019 года № 193 и Первого заместителя Министра обороны – начальника Генерального штаба Вооруженных Сил Республики Казахстан от 30 декабря 2019 года № 303
title:
  rus: Об утверждении Порядка взаимодействия Комитета по статистике Министерства национальной экономики Республики Казахстан с Министерством обороны Республики Казахстан при проведении национальной переписи населения Республики Казахстан в 2020 году на объектах Министерства обороны Республики Казахстан
  kaz: Қазақстан Республикасы Қорғаныс министрлігінің объектілерінде 2020 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитетінің Қазақстан Республикасы Қорғаныс министрлігімен өзара іс-қимыл тәртібін бекіту туралы
