  kaz: Радиоқызметтер үшін радиожиіліктер жолағын тарату, сондай-ақ Қазақстан Республикасының аумағында барлық мақсаттағы радиоэлектронды құралдарға радиожиіліктер (радиожиілік арналарын) бөлу және меншіктеу ережесін бекіту туралы
