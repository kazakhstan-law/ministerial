requisite: Совместный приказ Министра финансов Республики Казахстан от 26 февраля 2021 года № 159 и Председателя Агентства Республики Казахстан по делам государственной службы от 19 марта 2021 года № 52. Утратил силу совместным приказом Министра финансов Республики Казахстан от 20 апреля 2026 года № 256 и Председателя Агентства Республики Казахстан по делам государственной службы от 11 июня 2026 года № 98 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования и распространяется на правоотношения, возникшие с 1 января 2026 года)
title:
  rus: Об утверждении Правил, срока и формы представления уполномоченным органом по делам государственной службы сведений по политическим и административным государственным служащим из единой автоматизированной базы данных (информационной системы) по персоналу государственной службы
