requisite: Совместный приказ Председателя Комитета национальной безопасности Республики Казахстан от 20 марта 2002 года N 42 и Министра транспорта и коммуникаций Республики Казахстан от 29 марта 2002 года N 103-I. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 апреля 2002 года N 1831. Утратил силу - совместным приказом Председателя Комитета национальной безопасности РК от 20 сентября 2004 года N 179 и и.о. Председателя Агентства РК по информатизации и связи от 20 сентября 2004 года N 199-п (V043187)
title:
  rus: Об утверждении Правил взаимодействия государственных органов и организаций Республики Казахстан при установке и эксплуатации аппаратно-программных и технических средств проведения оперативно-розыскных мероприятий на сетях телекоммуникаций Республики Казахстан
  kaz: Қазақстан Республикасының уәкілетті мемлекеттік органдары мен ұйымдарының Қазақстан Республикасының телекоммуникация желілерінде жедел іздестіру шараларын жүргізуге арналған аппаратты-бағдарламалық және техникалық құралдарды қондыру және пайдалану кезіндегі өзара іс-қимылының Ережелерін бекіту туралы
