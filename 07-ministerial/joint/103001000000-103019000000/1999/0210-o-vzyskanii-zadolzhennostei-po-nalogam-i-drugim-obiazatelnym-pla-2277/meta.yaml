requisite: Совместный приказ Министра госдоходов Республики Казахстан от 10 февраля 1999 г. N 52 и Министра юстиции Республики Казахстан от 19 февраля 1999 г. N 12. Зарегистрирован в Министерстве юстиции Республики Казахстан 27.02.1999 г. N 693. Утратил силу - совместным приказом Министра финансов РК от 20.09.2005г. N 340 и Министра юстиции РК от 22.09.2005г. N 255
title:
  rus: О взыскании задолженностей по налогам и другим обязательным платежам в бюджет с организаций, не представивших декларации по налогам в течение последних 9 месяцев в налоговые органы
  kaz: Салық органдарына соңғы 9 ай ішінде салықтар бойынша декларациялар табыс етпеген ұйымдардан салықтар және бюджетке басқа да мiндеттi төлемдер бойынша берешектердi өндiру туралы
