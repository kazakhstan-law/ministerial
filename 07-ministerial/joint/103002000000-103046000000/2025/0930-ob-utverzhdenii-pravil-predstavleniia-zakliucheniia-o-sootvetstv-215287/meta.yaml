act_code: '215287'
requisite: Совместный приказ Министра торговли и интеграции Республики Казахстан от 30 сентября 2025 года № 281-ОД и Министра финансов Республики Казахстан от 2 октября 2025 года № 563
title:
  rus: Об утверждении Правил представления заключения о соответствии размера страховых резервов по незаработанным премиям, непроизошедшим убыткам, заявленным, но неурегулированным убыткам, произошедшим, но незаявленным убыткам по договорам страхования и перестрахования, заключаемым Экспортно-кредитным агентством Казахстана, требованиям, установленным законодательством Республики Казахстан о регулировании торговой деятельности
  kaz: Қазақстанның Экспорттық-кредиттік агенттігі жасасатын сақтандыру және қайта сақтандыру шарттары бойынша еңбекпен табылмаған сыйлықақылар, болмаған залалдар, мәлімделген, бірақ реттелмеген залалдар, болған, бірақ мәлімделмеген залалдар бойынша сақтандыру резервтері мөлшерінің Қазақстан Республикасының сауда қызметін реттеу туралы заңнамасында белгіленген талаптарға сәйкестігі туралы қорытындыны ұсыну қағидаларын бекіту туралы
