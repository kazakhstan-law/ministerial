requisite: Приказ Министра внутренних дел Республики Казахстан и Председателя Государственного следственного комитета от 2 мая 1996 года N 155/83. Зарегистрирован в Министерстве юстиции Республики Казахстан 26.10.1996 г. N 215. Утратил силу - приказом И.о. министра внутренних дел РК от 25.12.2004г. N 713
title:
  rus: Об утверждении Инструкции "О порядке взаимодействия органов Министерства внутренних дел Республики Казахстан и Государственного следственного комитета по отражению разбойных нападений на охраняемые учреждения банков
  kaz: Қазақстан Республикасы Мемлекеттiк тергеу комитетi мен iшкi iстер министрлiгi аумақтық органдарының күзетiлетiн банк мекемелерiне жасалатын қарақшылық шабуылдарды тойтаруда өзара iс-қимыл жасау тәртiбi жөнiндегi НҰСҚАУ
