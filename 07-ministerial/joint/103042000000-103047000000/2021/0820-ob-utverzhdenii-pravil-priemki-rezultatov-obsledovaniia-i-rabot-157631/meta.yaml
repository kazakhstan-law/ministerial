    kaz: «Жер қойнауын пайдалану жөніндегі операциялардың салдарын жою жөніндегі зерттеу және жұмыс нәтижелерін қабылдау қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің м.а. 2021 жылғы 20 тамыздағы № 458 және Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің 2021 жылғы 26 тамыздағы № 343 бірлескен бұйрығына толықтырулар енгізу туралы
