act_code: '157659'
requisite: Совместный приказ и.о. Министра экологии, геологии и природных ресурсов Республики Казахстан от 21 июля 2021 года № 263 и Министра индустрии и инфраструктурного развития Республики Казахстан от 29 июля 2021 года № 400. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 августа 2021 года № 23867
title:
  rus: Об утверждении Правил стимулирования производства в Республике Казахстан экологически чистых автомобильных транспортных средств (соответствующих экологическому классу, установленному техническим регламентом Евразийского экономического союза; с электродвигателями) и их компонентов, а также самоходной сельскохозяйственной техники, соответствующей экологическим требованиям, определенным техническими регламентами
  kaz: Қазақстан Республикасында экологиялық таза автомобиль көлік құралдарын (Еуразиялық экономикалық одақтың техникалық регламентінде белгіленген экологиялық сыныпқа сәйкес келетін; электр қозғалтқыштары бар) және олардың құрамдастарын, сондай-ақ техникалық регламенттерде айқындалған экологиялық талаптарға сәйкес келетін өздігінен жүретін ауыл шаруашылығы техникасын жасап шығаруды ынталандыру қағидаларын бекіту туралы
