  requisite: Совместный приказ Министра экологии и природных ресурсов Республики Казахстан от 12 мая 2023 года № 144 и и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 16 мая 2023 года № 357. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 мая 2023 года № 32508
  title:
    rus: О внесении изменения в совместный приказ и.о. Министра экологии, геологии и природных ресурсов Республики Казахстан от 21 июля 2021 года № 263 и Министра индустрии и инфраструктурного развития Республики Казахстан от 29 июля 2021 года № 400 «Об утверждении Правил стимулирования производства в Республике Казахстан экологически чистых автомобильных транспортных средств (соответствующих экологическому классу, установленному техническим регламентом Евразийского экономического союза; с электродвигателями) и их компонентов, а также самоходной сельскохозяйственной техники, соответствующей экологическим требованиям, определенным техническими регламентами»
    kaz: «Қазақстан Республикасында экологиялық таза автомобиль көлік құралдарын (Еуразиялық экономикалық одақтың техникалық регламентінде белгіленген экологиялық сыныпқа сәйкес келетін; электр қозғалтқыштары бар) және олардың құрамдастарын, сондай-ақ техникалық регламенттерде айқындалған экологиялық талаптарға сәйкес келетін өздігінен жүретін ауыл шаруашылығы техникасын жасап шығаруды ынталандыру қағидаларына өзгерістер енгізу туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің міндетін атқарушының 2021 жылғы 21 шiлдедегi № 263 және Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2021 жылғы 29 шiлдедегi № 400 бірлескен бұйрығына өзгеріс енгізу туралы
