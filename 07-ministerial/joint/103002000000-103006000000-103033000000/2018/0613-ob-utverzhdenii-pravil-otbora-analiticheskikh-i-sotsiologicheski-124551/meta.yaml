  title:
    rus: О внесении изменений в совместный приказ Министра национальной экономики Республики Казахстан от 13 июня 2018 года № 214, Министра финансов Республики Казахстан от 18 июня 2018 года № 605 и Министра образования и науки Республики Казахстан от 26 июня 2018 года № 307 «Об утверждении Методики по отбору аналитических и социологических исследований, финансируемых из республиканского бюджета, и совместных исследований с зарубежными организациями, а также определению структуры затрат аналитических и социологических исследований»
    kaz: «Республикалық бюджеттен қаржыландырылатын талдамалық және әлеуметтанушылық зерттеулерді және шетелдік ұйымдармен бірлескен зерттеулерді іріктеу, сондай-ақ талдамалық және әлеуметтанушылық зерттеулер шығындарының құрылымын айқындау жөніндегі әдістемені бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 13 маусымдағы № 214, Қазақстан Республикасы Қаржы министрінің 2018 жылғы 18 маусымдағы № 605 және Қазақстан Республикасы Білім және ғылым министрінің 2018 жылғы 26 маусымдағы № 307 бірлескен бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/157434/rus
