act_code: '124551'
requisite: Совместный приказ Министра национальной экономики Республики Казахстан от 13 июня 2018 года № 214, Министра финансов Республики Казахстан от 18 июня 2018 года № 605 и Министра образования и науки Республики Казахстан от 26 июня 2018 года № 307. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 июля 2018 года № 17195
title:
  rus: Об утверждении Правил отбора аналитических и социологических исследований, финансируемых из республиканского бюджета, и совместных исследований с зарубежными организациями, а также определения структуры затрат аналитических и социологических исследований
  kaz: Республикалық бюджеттен қаржыландырылатын талдамалық және әлеуметтанушылық зерттеулерді және шетелдік ұйымдармен бірлескен зерттеулерді іріктеу, сондай-ақ талдамалық және әлеуметтанушылық зерттеулер шығындарының құрылымын айқындау қағидаларын бекіту туралы
