  requisite: Совместный приказ Председателя Агентства Республики Казахстан по делам государственной службы от 9 июля 2021 года № 119 и Министра национальной экономики Республики Казахстан от 12 июля 2021 года № 69. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 июля 2021 года № 23643. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по делам государственной службы от 23 ноября 2022 года № 233 и Министра национальной экономики Республики Казахстан от 25 ноября 2022 года № 89 (вводится в действие с 1 января 2023 года)
  title:
    rus: О внесении изменений в совместный приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 31 октября 2018 года № 252 и Министра национальной экономики Республики Казахстан от 31 октября 2018 года № 45 «Об утверждении критериев оценки степени риска и проверочных листов за соблюдением законодательства в сфере государственной службы государственными органами и за соблюдением норм служебной этики государственными служащими»
    kaz: «Мемлекеттік органдардың мемлекеттік қызмет саласындағы заңнаманы сақтаудағы және мемлекеттік қызметшілердің қызметтік әдеп нормаларын сақтаудағы тәуекел дәрежесін бағалау өлшемшарттары мен тексеру парақтарын бекіту туралы» Қазақстан Республикасының Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі төрағасының 2018 жылғы 31 қазандағы № 252 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 31 қазандағы № 45 бірлескен бұйрығына өзгерістер енгізу туралы
