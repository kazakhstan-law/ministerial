act_code: '125547'
requisite: Совместный приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 31 октября 2018 года № 252 и Министра национальной экономики Республики Казахстан от 31 октября 2018 года № 45. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 октября 2018 года № 17654. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по делам государственной службы от 23 ноября 2022 года № 233 и Министра национальной экономики Республики Казахстан от 25 ноября 2022 года № 89 (вводится в действие с 1 января 2023 года)
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов за соблюдением законодательства в сфере государственной службы государственными органами и за соблюдением норм служебной этики государственными служащими
  kaz: Мемлекеттік органдардың мемлекеттік қызмет саласындағы заңнаманы сақтаудағы және мемлекеттік қызметшілердің қызметтік әдеп нормаларын сақтаудағы тәуекел дәрежесін бағалау өлшемшарттары мен тексеру парақтарын бекіту туралы
