act_code: '125588'
requisite: Совместный приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 31 октября 2018 года № 253 и Министра национальной экономики Республики Казахстан от 31 октября 2018 года № 51. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 ноября 2018 года № 17671. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по делам государственной службы от 23 ноября 2022 года № 233 и Министра национальной экономики Республики Казахстан от 25 ноября 2022 года № 89 (вводится в действие с 1 января 2023 года)
title:
  rus: Об утверждении критериев оценки степени риска и проверочного листа по соблюдению законодательства в сфере оказания государственных услуг
  kaz: Мемлекеттік қызметтер көрсету саласындағы заңнаманың сақталуы бойынша тәуекел дәрежесін бағалау критерийлерін және тексеру парағын бекіту туралы
