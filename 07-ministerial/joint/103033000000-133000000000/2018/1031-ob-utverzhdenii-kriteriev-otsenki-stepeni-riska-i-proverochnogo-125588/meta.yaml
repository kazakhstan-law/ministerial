caused_by:
  code: '160035'
  requisite: Совместный приказ Председателя Агентство Республики Казахстан по делам государственной службы от 1 ноября 2021 года № 190 и Министра национальной экономики Республики Казахстан от 2 ноября 2021 года № 99. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 ноября 2021 года № 25059. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по делам государственной службы от 23 ноября 2022 года № 233 и Министра национальной экономики Республики Казахстан от 25 ноября 2022 года № 89 (вводится в действие с 1 января 2023 года)
  title:
    rus: О внесении изменений в совместный приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 31 октября 2018 года № 253 и Министра национальной экономики Республики Казахстан от 31 октября 2018 года № 51 «Об утверждении критериев оценки степени риска и проверочного листа по соблюдению законодательства в сфере оказания государственных услуг»
    kaz: «Мемлекеттік қызметтер көрсету саласындағы заңнаманың сақталуы бойынша тәуекел дәрежесін бағалау критерийлерін және тексеру парағын бекіту туралы» Қазақстан Республикасының Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі төрағасының 2018 жылғы 31 қазандағы № 253 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 31 қазандағы № 51 бірлескен бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/160035/rus
