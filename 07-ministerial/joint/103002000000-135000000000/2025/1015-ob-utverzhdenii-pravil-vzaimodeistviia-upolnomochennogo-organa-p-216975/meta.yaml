act_code: '216975'
requisite: Совместные приказ Министра финансов Республики Казахстан от 15 октября 2025 года № 609 и постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 16 октября 2025 года № 66
title:
  rus: Об утверждении Правил взаимодействия уполномоченного органа по регулированию, контролю и надзору финансового рынка и финансовых организаций с органами государственных доходов и установлении формы, порядка и срока представления заключения о страховых обязательствах в отношении проверяемого налогоплательщика по соответствию требованиям, установленным законодательством Республики Казахстан о страховании и страховой деятельности
  kaz: Қаржы нарығы мен қаржы ұйымдарын реттеу, бақылау және қадағалау жөніндегі уәкілетті органның мемлекеттік кірістер органдарымен өзара іс-қимыл жасау қағидаларын бекіту және Қазақстан Республикасының сақтандыру және сақтандыру қызметі туралы заңнамасында белгіленген талаптарға сәйкестігі бойынша тексерілетін салық төлеушіге қатысты сақтандыру міндеттемелері туралы қорытындының нысанын, ұсыну тәртібі мен мерзімін белгілеу туралы
