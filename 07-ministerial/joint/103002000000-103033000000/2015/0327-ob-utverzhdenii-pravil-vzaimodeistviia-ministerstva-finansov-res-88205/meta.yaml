requisite: Совместный приказ Министра финансов Республики Казахстан от 27 марта 2015 года № 220 и и.о. Министра национальной экономики Республики Казахстан от 27 марта 2015 года № 256. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 апреля 2015 года № 10894. Утратил силу совместным приказом Министра финансов Республики Казахстан от 15 февраля 2018 года № 191 и и.о. Министра национальной экономики Республики Казахстан от 23 февраля 2018 года № 71 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Правил взаимодействия Министерства финансов Республики Казахстан с Министерством национальной  экономики Республики Казахстан при ввозе отдельных категорий товаров на единую таможенную территорию Таможенного союза в целях предоставления освобождений от обложения таможенными платежами и налогами
  kaz: Кеден одағының бірыңғай кедендік аумағына тауарлардың жекелеген санаттарын әкелу кезінде Қазақстан Республикасы Қаржы министрлігі мен Қазақстан Республикасының Ұлттық экономика министрлігімен кедендік төлемдер мен салықтар салудан босатуды ұсыну мақсатындағы өзара іс-қимылының қағидасын бекіту туралы
