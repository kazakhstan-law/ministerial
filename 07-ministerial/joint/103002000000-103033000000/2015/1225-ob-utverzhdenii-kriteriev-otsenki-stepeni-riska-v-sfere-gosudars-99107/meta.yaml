act_code: '99107'
requisite: Совместный приказ Министра финансов Республики Казахстан от 25 декабря 2015 года № 687 и и.о. Министра национальной экономики Республики Казахстан от 31 декабря 2015 года № 840. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 февраля 2016 года № 12983. Утратил силу совместным приказом Министра финансов Республики Казахстан от 20 февраля 2018 года № 251 и и.о. Министра национальной экономики Республики Казахстан от 24 февраля 2018 года № 74 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении критериев оценки степени риска в сфере государственного контроля за поступлением налогов и других обязательных платежей в бюджет, а также полнотой и своевременным перечислением обязательных пенсионных взносов, обязательных профессиональных пенсионных взносов в единый накопительный пенсионный фонд и социальных отчислений в Государственный фонд социального страхования
  kaz: Салық және бюджетке төленетін басқа да міндетті төлемдердің түсуін, сондай-ақ бірыңғай жинақтаушы зейнетақы қорына міндетті зейнетақы жарналарының, міндетті кәсіптік зейнетақы жарналарының және Мемлекеттік әлеуметтік сақтандыру қорына әлеуметтік аударымдардың толық және уақтылы аударылуын мемлекеттік бақылау саласындағы тәуекел дәрежесін бағалау өлшемшарттарын бекіту туралы
