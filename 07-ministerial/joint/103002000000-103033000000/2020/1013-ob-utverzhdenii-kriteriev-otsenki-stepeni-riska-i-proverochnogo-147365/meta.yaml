requisite: Совместный приказ Министра финансов Республики Казахстан от 13 октября 2020 года № 999 и Министра национальной экономики Республики Казахстан от 13 октября 2020 года № 77. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 октября 2020 года № 21422. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 16 августа 2021 года № 7 и Министра национальной экономики Республики Казахстан от 16 августа 2021 года № 80 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении критериев оценки степени риска и проверочного листа за соблюдением законодательства Республики Казахстан о противодействии легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма
  kaz: Қазақстан Республикасының қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл туралы заңнамасын сақтаудың тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы
