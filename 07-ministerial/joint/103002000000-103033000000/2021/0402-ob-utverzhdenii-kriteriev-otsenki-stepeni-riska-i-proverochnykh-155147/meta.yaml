act_code: '155147'
requisite: Совместный приказ Министра финансов Республики Казахстан от 2 апреля 2021 года № 298 и Министра национальной экономики Республики Казахстан от 21 апреля 2021 года № 45. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 апреля 2021 года № 22602
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов в области бухгалтерского учета и финансовой отчетности для организаций публичного интереса, за исключением финансовых организаций, деятельности аккредитованных профессиональных организаций бухгалтеров и аккредитованных организаций по профессиональной сертификации бухгалтеров
  kaz: Қаржы ұйымдарын қоспағанда, жария мүдделі ұйымдар, бухгалтерлердің аккредиттелген кәсіби ұйымдарының және бухгалтерлерді кәсіби сертификаттау жөніндегі аккредиттелген ұйымдардың қызметі үшін бухгалтерлік есеп және қаржылық есептілік саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
