  requisite: Совместный приказ Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 15 декабря 2022 года № 1284 и Министра национальной экономики Республики Казахстан от 15 декабря 2022 года № 128. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 декабря 2022 года № 31142
  title:
    rus: «О внесении изменений и дополнения в совместный приказ Министра финансов Республики Казахстан от 2 апреля 2021 года № 298 и Министра национальной экономики Республики Казахстан от 21 апреля 2021 года № 45 «Об утверждении проверочных листов в области бухгалтерского учета и финансовой отчетности для организаций публичного интереса, за исключением финансовых организаций, деятельности аккредитованных профессиональных организаций бухгалтеров и аккредитованных организаций по профессиональной сертификации бухгалтеров»
    kaz: «Қаржы ұйымдарын қоспағанда, жария мүдделі ұйымдар, бухгалтерлердің аккредиттелген кәсіби ұйымдарының және бухгалтерлерді кәсіби сертификаттау жөніндегі аккредиттелген ұйымдардың қызметі үшін бухгалтерлік есеп және қаржылық есептілік саласындағы тексеру парақтарын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2021 жылғы 2 сәуірдегі № 298 және Қазақстан Республикасы Ұлттық экономика министрінің 2021 жылғы 21 сәуірдегі № 45 бірлескен бұйрығына өзгерістер мен толықтыру енгізу туралы»
