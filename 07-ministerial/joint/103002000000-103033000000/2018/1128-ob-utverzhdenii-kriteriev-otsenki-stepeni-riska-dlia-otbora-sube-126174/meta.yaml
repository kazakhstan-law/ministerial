act_code: '126174'
requisite: Совместный приказ Министра финансов Республики Казахстан от 28 ноября 2018 года № 1030 и Министра национальной экономики Республики Казахстан от 28 ноября 2018 года № 86. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 ноября 2018 года № 17819. Утратил силу совместным приказом Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 20 сентября 2022 года № 972 и Министра национальной экономики Республики Казахстан от 21 сентября 2022 года № 66 (вводится в действие с 1 января 2023 года)
title:
  rus: Об утверждении критериев оценки степени риска для отбора субъектов (объектов) налоговой проверки, проводимой по особому порядку на основе оценки степени риска
  kaz: Тәуекел дәрежесін бағалау негізінде ерекше тәртіп бойынша жүргізілетін салықтық тексеру субъектілерін (объектілерін) іріктеу үшін тәуекел дәрежесін бағалау өлшемшарттарын бекіту туралы
