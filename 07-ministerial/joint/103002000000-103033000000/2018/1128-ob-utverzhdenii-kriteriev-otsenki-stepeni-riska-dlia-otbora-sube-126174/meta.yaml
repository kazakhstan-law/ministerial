  title:
    rus: О признании утратившим силу совместного приказа Министра финансов Республики Казахстан от 28 ноября 2018 года № 1030 и Министра национальной экономики Республики Казахстан от 28 ноября 2018 года № 86 «Об утверждении критериев оценки степени риска для отбора субъектов (объектов) налоговой проверки, проводимой по особому порядку на основе оценки степени риска»
    kaz: «Тәуекел дәрежесін бағалау негізінде ерекше тәртіп бойынша жүргізілетін салықтық тексеру субъектілерін (объектілерін) іріктеу үшін тәуекел дәрежесін бағалау өлшемшарттарын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 28 қарашадағы № 1030 және Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 28 қарашадағы № 86 бірлескен бұйрығының күші жойылды деп тану туралы
