act_code: '119104'
requisite: Совместный приказ Министра финансов Республики Казахстан от 19 февраля 2018 года № 231 и и.о. Министра национальной экономики Республики Казахстан от 23 февраля 2018 года № 72
title:
  rus: Об утверждении Правил взаимодействия Министерства финансов Республики Казахстан с Министерством национальной экономики Республики Казахстан в целях предоставления освобождения от обложения таможенными пошлинами и налогами отдельных категорий товаров, ввозимых на единую таможенную территорию Евразийского экономического союза, приобретенных за счет средств грантов
  kaz: Еуразиялық экономикалық одағының бірыңғай кедендік аумағына гранттар қаражаты есебінен сатып алынған тауарлардың жекелеген санаттарын әкелу кезінде кедендік баждар мен салықтар алудан босатуды ұсыну мақсатында Қазақстан Республикасы Қаржы министрлігінің Қазақстан Республикасының Ұлттық экономика министрлігімен өзара іс-қимыл қағидаларын бекіту туралы
