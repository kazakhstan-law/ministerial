  title:
    rus: О внесении изменений и дополнения в совместный приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 15 июля 2019 года № 724 и Министра национальной экономики Республики Казахстан от 16 июля 2019 года № 65 «Об утверждении проверочных листов в области аудиторской деятельности и деятельности профессиональных аудиторских организаций»
    kaz: «Аудиторлық қызмет және кәсіби аудиторлық ұйымдар қызметі саласындағы тексеру парақтарын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің бірінші орынбасары – Қазақстан Республикасы Қаржы министрінің 2019 жылғы 15 шілдедегі № 724 және Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 16 шілдедегі № 65 бірлескен бұйрығына өзгерістер мен толықтыру енгізу туралы
