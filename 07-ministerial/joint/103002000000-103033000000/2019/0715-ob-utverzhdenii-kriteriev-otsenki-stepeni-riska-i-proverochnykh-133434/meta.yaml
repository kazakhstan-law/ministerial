  title:
    rus: О внесении изменений в совместный приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 15 июля 2019 года № 724 и Министра национальной экономики Республики Казахстан от 16 июля 2019 года № 65 «Об утверждении критериев оценки степени риска и проверочных листов в области аудиторской деятельности»
