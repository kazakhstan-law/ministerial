act_code: '86448'
requisite: Совместный приказ Министра финансов Республики Казахстан от 28 ноября 2014 года № 532 и и.о. Министра национальной экономики Республики Казахстан от 28 ноября 2014 года № 119. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 декабря 2014 года № 9964. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 28 февраля 2022 года № 16 и Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 28 февраля 2022 года № 2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для товарной биржи
  kaz: Тауар биржасына арналған қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы
