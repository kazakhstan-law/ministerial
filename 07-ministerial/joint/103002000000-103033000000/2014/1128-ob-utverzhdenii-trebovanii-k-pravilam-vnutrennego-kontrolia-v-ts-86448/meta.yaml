  title:
    rus: О внесении изменений в совместный приказ Министра финансов Республики Казахстан от 28 ноября 2014 года № 532 и и.о. Министра национальной экономики Республики Казахстан от 28 ноября 2014 года № 119 "Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для товарной биржи"
    kaz: '"Тауар биржасына арналған қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау ережелеріне қойылатын талаптарды бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2014 жылғы 28 қарашадағы № 532 және Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2014 жылғы 28 қарашадағы № 119 бірлескен бұйрығына өзгерістер енгізу туралы'
