  title:
    rus: О внесении изменений в совместный приказ Министра финансов Республики Казахстан от 30 декабря 2016 года № 706 и Министра национальной экономики Республики Казахстан от 30 декабря 2016 года № 540 «Об утверждении Методики по оценке эффективности достижения целей и показателей бюджетных программ»
    kaz: «Мақсаттар мен бюджеттік бағдарламалар көрсеткіштеріне қол жеткізу тиімділігін бағалау жөніндегі әдістемені бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2016 жылғы 30 желтоқсандағы № 706 және Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 30 желтоқсандағы № 540 бірлескен бұйрығына өзгерістер енгізу туралы
