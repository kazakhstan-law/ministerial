act_code: '212016'
requisite: Совместный приказ Министра финансов Республики Казахстан от 27 июня 2025 года № 329 и и.о. Министра национальной экономики Республики Казахстан от 30 июня 2025 года № 64
title:
  rus: Об утверждении Правил вынесения на рассмотрение Республиканской бюджетной комиссии вопросов уменьшения размера выплат или освобождения от уплаты поступлений в республиканский бюджет дивидендов или части чистого дохода по перечню государственных предприятий, акционерных обществ, товариществ с ограниченной ответственностью, государственные пакеты акций (доли участия в уставном капитале) которых находятся в республиканской собственности
  kaz: Акцияларының (жарғылық капиталға қатысу үлестерінің) мемлекеттік пакеттері республикалық меншіктегі мемлекеттік кәсіпорындардың, акционерлік қоғамдардың, жауапкершілігі шектеулі серіктестіктердің тізбесі бойынша республикалық бюджетке дивидендтердің немесе таза кіріс бөлігінің түсімдері төлемдерінің мөлшерін азайту немесе оларды төлеуден босату мәселелерін республикалық бюджет комиссиясының қарауына шығару қағидаларын бекіту туралы
