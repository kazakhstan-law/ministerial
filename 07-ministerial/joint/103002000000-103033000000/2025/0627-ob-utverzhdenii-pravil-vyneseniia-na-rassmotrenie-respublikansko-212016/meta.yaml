  requisite: Совместный приказ Министра финансов Республики Казахстан от 26 декабря 2025 года № 812 и Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 29 декабря 2025 года № 135
  title:
    rus: О внесении изменения в совместный приказ Министра финансов Республики Казахстан от 27 июня 2025 года № 329 и исполняющего обязанности Министра национальной экономики Республики Казахстан от 30 июня 2025 года № 64 «Об утверждении Правил вынесения на рассмотрение Республиканской бюджетной комиссии вопросов уменьшения размера выплат или освобождения от уплаты поступлений в республиканский бюджет дивидендов или части чистого дохода по перечню государственных предприятий, акционерных обществ, товариществ с ограниченной ответственностью, государственные пакеты акций (доли участия в уставном капитале) которых находятся в республиканской собственности»
    kaz: «Акцияларының (жарғылық капиталға қатысу үлестерінің) мемлекеттік пакеттері республикалық меншіктегі мемлекеттік кәсіпорындардың, акционерлік қоғамдардың, жауапкершілігі шектеулі серіктестіктердің тізбесі бойынша республикалық бюджетке дивидендтердің немесе таза кіріс бөлігінің түсімдері төлемдерінің мөлшерін азайту немесе оларды төлеуден босату мәселелерін республикалық бюджет комиссиясының қарауына шығару қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2025 жылғы 27 маусымдағы № 329 және Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2025 жылғы 30 маусымдағы № 64 бірлескен бұйрығына өзгеріс енгізу туралы
