requisite: Совместный приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 11 сентября 2003 года N 222-ОД и Председателя Агентства Республики Казахстан по государственным закупкам от 10 сентября 2003 года N 96. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 октября 2003 года N 2528. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 18 сентября 2008 года № 295-ОД и Министра финансов Республики Казахстан от 18 февраля 2009 года № 76
title:
