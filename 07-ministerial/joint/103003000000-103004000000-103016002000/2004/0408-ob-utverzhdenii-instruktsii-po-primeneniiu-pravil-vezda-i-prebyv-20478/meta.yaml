act_code: '20478'
requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 9 апреля 2004 года № 215, Министра иностранных дел Республики Казахстан от 14 апреля 2004 года № 08-1/93 и Председателя Агентства Республики Казахстан по миграции и демографии от 14 апреля 2004 года № 35-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 июня 2004 года № 2889. Утратил силу совместным приказом Министерства внутренних дел Республики Казахстан от 7 марта 2012 года № 135 и Министерства иностранных дел Республики Казахстан от 28 апреля 2012 года № 08-1-1-1/154
title:
  rus: Об утверждении Инструкции по применению Правил въезда и пребывания иностранцев в Республике Казахстан, а также их выезда из Республики Казахстан и организации оперативно-служебной деятельности органов внутренних дел по предупреждению и пресечению незаконной миграции иностранцев на территории Республики Казахстан
  kaz: Шетелдіктердің Қазақстан Республикасына келу және онда болу, сондай-ақ Қазақстан Республикасынан кету тәртіптерін қолдану және шетелдіктердің Қазақстан Республикасының аумағындағы заңсыз көші-қонының алдын алу және жолын кесу жөніндегі ішкі істер органдарының жедел-қызметтік жұмысын ұйымдастыру туралы нұсқаулықты бекіту туралы
