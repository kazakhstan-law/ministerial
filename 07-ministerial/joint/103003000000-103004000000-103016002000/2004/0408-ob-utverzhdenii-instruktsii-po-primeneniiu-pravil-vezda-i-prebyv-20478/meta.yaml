  requisite: Совместный приказ и.о. Министра внутренних дел Республики Казахстан от 25 мая 2007 года № 216, Министра иностранных дел Республики Казахстан от 18 июня 2007 года № 08-1-1-1/186, Министра труда и социальной защиты населения Республики Казахстан от 4 июля 2007 года № 145-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 августа 2007 года № 4851. Утратил силу совместным приказом Министерства внутренних дел Республики Казахстан от 7 марта 2012 года № 135 и Министерства иностранных дел Республики Казахстан от 28 апреля 2012 года № 08-1-1-1/154
  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра внутренних дел Республики Казахстан от 9 апреля 2004 года № 215, Министра иностранных дел Республики Казахстан от 14 апреля 2004 года № 08-1/93 и Председателя Агентства Республики Казахстан по миграции и демографии от 14 апреля 2004 года № 35-п "Об утверждении Инструкции по применению Правил въезда и пребывания иностранных граждан в Республике Казахстан, а также их выезда из Республики Казахстан и организации оперативно-служебной деятельности органов внутренних дел по предупреждению и пресечению незаконной миграции иностранных граждан на территории Республики Казахстан"
    kaz: '"Шетелдік азаматтардың Қазақстан Республикасына келу және онда болу, сондай-ақ Қазақстан Республикасынан кету тәртіптерін қолдану және шетелдік азаматтардың Қазақстан Республикасының аумағындағы заңсыз көші-қонының алдын алу және жолын кесу жөніндегі ішкі істер органдарының жедел-қызметтік жұмысын ұйымдастыру туралы нұсқаулықты бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2004 жылғы 9 сәуірдегі № 215, Қазақстан Республикасы Сыртқы істер министрінің 2004 жылғы 14 сәуірдегі № 08-1/93 және Қазақстан Республикасының Көші-қон және демография жөніндегі агенттігі төрағасының 2004 жылғы 14 сәуірдегі № 35-п бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы'
