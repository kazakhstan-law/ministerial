  title:
    rus: О внесении дополнений в совместный приказ Министра здравоохранения Республики Казахстан от 18 июля 2025 года № 67 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 22 июля 2025 года № 380/НҚ «О проведении пилотного проекта по государственной регистрации лекарственных средств и медицинских изделий по принципу «единого окна»
    kaz: «Бір терезе» қағидаты бойынша дәрілік заттар мен медициналық бұйымдарды мемлекеттік тіркеу жөніндегі пилоттық жобаны жүргізу туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2025 жылғы 18 шілдедегі № 67 және Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2025 жылғы 22 шілдедегі № 380/НҚ бірлескен бұйрығына толықтырулар енгізу туралы
