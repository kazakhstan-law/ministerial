requisite: Совместный приказ Министра охраны окружающей среды Республики Казахстан от 2 декабря 2004 года N 315-п, и.о. Председателя Комитета по водным ресурсам Министерства сельского хозяйства Республики Казахстан от 17 ноября 2004 года N 239-п, Председателя Комитета государственного санитарно-эпидемиологического надзора Министерства здравоохранения Республики Казахстан 19 ноября 2004 года N 37. Зарегистрирован Министерством юстиции Республики Казахстан 13 декабря 2004 года N 3262. Утратило силу - совместным приказом Министра охраны окружающей среды Республики Казахстан от 13 июля 2007 года N 225-ө, Председателя Комитета санитарно-эпидемиологического надзора Министерства здравоохранения Республики Казахстан от 19 июля 2007 года N 67 и Председателя Комитета по водным ресурсам Министерства сельского хозяйства Республики Казахстан от 28 июня 2007 года N 117
title:
