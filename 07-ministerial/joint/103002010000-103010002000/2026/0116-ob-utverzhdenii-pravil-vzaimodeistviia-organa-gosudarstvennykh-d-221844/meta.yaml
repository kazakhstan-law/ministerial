act_code: '221844'
requisite: Совместный Приказ Председателя Комитета государственных доходов Республики Казахстан от 16 января 2026 года 15 и Председателя Комитета медицинского и фармацевтического контроля Министерства здравоохранения Республики Казахстан от 16 января 2026 года № 22-НҚ
title:
  rus: Об утверждении Правил взаимодействия органа государственных доходов с Комитетом медицинского и фармацевтического контроля Министерства здравоохранения Республики Казахстан по предоставлению конфиденциальной информации, касательно лекарственных средств и медицинских изделии в сфере таможенного регулирования
  kaz: Мемлекеттік кірістер органының Қазақстан Республикасы Денсаулық сақтау министрлігінің Медициналық және фармацевтикалық бақылау комитетімен кедендік реттеу саласында дәрілік заттар мен медициналық бұйымдарға қатысты құпия ақпараттарды ұсыну жөніндегі өзара іс-қимыл қағидаларын бекіту туралы
