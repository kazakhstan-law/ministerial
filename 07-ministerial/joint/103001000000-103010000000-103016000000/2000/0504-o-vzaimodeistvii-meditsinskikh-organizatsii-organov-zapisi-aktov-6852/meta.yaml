act_code: '6852'
requisite: Совместный приказ Министра труда и социальной защиты населения Республики Казахстан от 5 мая 2000 года № 106-П, Министра юстиции Республики Казахстан от 1 августа 2000 года № 75 и Председателя Агентства Республики Казахстан по делам здравоохранения от 15 мая 2000 года № 291. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 августа 2000 года за N 1234. Утратило силу совместным приказом Министра труда и социальной защиты населения Республики Казахстан от 29 мая 2006 года № 264-п и Министра юстиции Республики Казахстан от 11 декабря 2006 года № 318, Министра здравоохранения Республики Казахстан от 20 декабря 2006 года № 631
title:
  rus: О взаимодействии медицинских организаций, органов записи актов гражданского состояния, соответствующих служб силовых структур и организаций, осуществляющих выплату пенсий и пособий за счет средств республиканского бюджета, по обеспечению своевременности документооборота, регистрации и представления документов, удостоверяющих факт смерти, выезд на постоянное место жительства за пределы Республики Казахстан получателей пенсий и пособий
  kaz: '"Медициналық мекемелердiң, азаматтық хал актiлерiн тiркеу органдарының, әлеуеттi құрылымдар мен зейнетақыларды және жәрдемақыларды республикалық бюджеттiң қаражаты есебiнен жүзеге асыратын ұйымдардың тиiстi қызметтерiнiң құжат айналымдарын, қайтыс болу, Қазақстан Республикасынан тыс жерлерге тұрақты тұру үшiн көшiп кету фактiлерiн растайтын құжаттарды тiркеу мен ұсынуды уақытында қамтамасыз ету жөнiндегi өзара iс-әрекеттерi туралы"'
