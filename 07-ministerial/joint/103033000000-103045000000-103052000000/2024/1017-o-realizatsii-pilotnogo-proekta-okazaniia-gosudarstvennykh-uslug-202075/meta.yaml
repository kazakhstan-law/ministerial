act_code: '202075'
requisite: Совместный приказ Министра промышленности и строительства Республики Казахстан от 17 октября 2024 года № 366, Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 21 октября 2024 года № 94 и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 16 октября 2024 года № 654/НҚ
title:
  rus: О реализации пилотного проекта оказания государственных услуг «Предоставление исходных материалов при разработке проектов строительства и реконструкции (перепланировки и переоборудования)», «Согласование эскиза (эскизного проекта)» и «Выдача технических условий на подключение к источникам инженерного и коммунального обеспечения» посредством автоматизированной информационной системы государственного градостроительного кадастра
  kaz: Мемлекеттік қала құрылысы кадастрының автоматтандырылған ақпараттық жүйесі арқылы «Құрылыс және реконструкция (қайта жоспарлау және қайта жабдықтау) жобаларын әзірлеу кезінде бастапқы материалдарды ұсыну», «Эскизді (эскиздік жобаны) келісу» және «Инженерлік және коммуналдық қамтамасыз ету көздеріне қосылуға техникалық шарттар беру» мемлекеттік қызметтерін көрсету бойынша пилоттық жобаны іске асыру туралы
