act_code: '228658'
requisite: Совместный приказ Генерального Прокурора Республики Казахстан от 6 августа 2026 года № 130 и Председателя Агентства Республики Казахстан по финансовому мониторингу от 7 августа 2026 года № 14
title:
  rus: Об утверждении Правил и оснований получения уполномоченным органом по финансовому мониторингу из системы информационного обмена правоохранительных, специальных государственных и иных органов информации, необходимой для противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения
  kaz: Қаржы мониторингі жөніндегі уәкілетті органның құқық қорғау, арнаулы мемлекеттік және өзге де органдардың ақпарат алмасу жүйесінен қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл үшін қажетті ақпаратты алу қағидалары мен негіздерін бекіту туралы
