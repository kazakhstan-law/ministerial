  requisite: Совместный приказ и.о. Председателя Агентства Республики Казахстан по информатизации и связи от 22 сентября 2004 года № 203-п и и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 24 сентября 2004 года № 390-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 сентября 2004 года № 3095. Утратил силу совместным приказом Агентства Республики Казахстан по информатизации и связи от 28 мая 2009 года № 233, Агентства Республики Казахстан по защите конкуренции (Антимонопольное агентство) от 4 июня 2009 года № 177-ОД, Агентства Республики Казахстан по регулированию естественных монополий от 11 июня 2009 года № 211-ОД
  title:
    rus: О внесении изменений и дополнения в совместный приказ Председателя Агентства Республики Казахстан по информатизации и связи от 21 апреля 2004 года N 74-п и Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 14 мая 2004 года N 233-ОД "О введении операторами связи посекундной тарификации междугородных соединений и трафика между взаимодействующими сетями телекоммуникаций", зарегистрированный за N 2894
    kaz: '"Байланыс операторларының қалааралық қосылымдар мен өзара байланыстағы телекоммуникациялар желілерінің өзара трафигіне секундалық тарифтеуді енгізу туралы" Қазақстан Республикасының Ақпараттандыру және байланыс жөніндегі агенттігі төрағасының 2004 жылғы 21 сәуірдегі N 74-б және Қазақстан Республикасының Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2004 жылғы 14 мамырдағы N 233-НҚ бірлескен бұйрығына өзгертулер мен толықтыру енгізу туралы, тіркелген N 2894'
