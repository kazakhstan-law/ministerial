requisite: Совместный приказ Председателя Агентства Республики Казахстан по информатизации и связи от 21 апреля 2004 года № 74-п и Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 14 мая 2004 года № 233-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 июня 2004 года № 2894. Утратил силу совместным приказом Агентства Республики Казахстан по информатизации и связи от 28 мая 2009 года N 233, Агентства Республики Казахстан по защите конкуренции (Антимонопольное агентство) от 4 июня 2009 года № 177-ОД, Агентства Республики Казахстан по регулированию естественных монополий от 11 июня 2009 года № 211-ОД
title:
