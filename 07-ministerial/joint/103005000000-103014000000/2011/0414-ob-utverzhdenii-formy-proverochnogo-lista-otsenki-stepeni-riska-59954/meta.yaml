requisite: Совместный приказ Министра туризма и спорта Республики Казахстан от 14 апреля 2011 года № 02-02-18/57 и и.о. Министра экономического развития и торговли Республики Казахстан от 16 мая 2011 года № 135. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 июня 2011 года № 7027. Утратил силу совместным приказом Председателя Агентства Республики Казахстан по делам спорта и физической культуры от 7 февраля 2013 года № 35 и первого заместителя Премьер-Министра Республики Казахстан - Министра регионального развития Республики Казахстан от 16 апреля 2013 года № 01-04-03/50НҚ
title:
  rus: Об утверждении формы Проверочного листа оценки степени риска в сфере частного предпринимательства за исполнением законодательства Республики Казахстан в области физической культуры и спорта
