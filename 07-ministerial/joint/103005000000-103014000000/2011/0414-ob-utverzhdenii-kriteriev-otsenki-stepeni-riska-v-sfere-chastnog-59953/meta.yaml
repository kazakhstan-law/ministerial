requisite: Совместный приказ Министра туризма и спорта Республики Казахстан от 14 апреля 2011 года № 02-02-18/56 и и.о. Министра экономического развития и торговли Республики Казахстан от 16 мая 2011 года № 134. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 июня 2011 года № 7026. Утратил силу совместным приказом председателя Агентства Республики Казахстан по делам спорта и физической культуры от 7 февраля 2013 года № 35-1 и Министра регионального развития Республики Казахстан от 16 апреля 2013 года № 01-04-03/49НҚ
title:
  rus: Об утверждении Критериев оценки степени риска в сфере частного предпринимательства за исполнением законодательства Республики Казахстан в области физической культуры и спорта
  kaz: Қазақстан Республикасының дене шынықтыру және спорт саласындағы заңнамасын орындау үшін жеке кәсіпкерлік саласындағы тәуекел дәрежесін бағалау өлшемдерін бекіту туралы
