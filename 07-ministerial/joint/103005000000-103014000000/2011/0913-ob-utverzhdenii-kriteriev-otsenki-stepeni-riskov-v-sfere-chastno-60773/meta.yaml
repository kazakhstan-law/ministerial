title:
  rus: Об утверждении критериев оценки степени рисков в сфере частного предпринимательства за соблюдением законодательства Республики Казахстан о туристской деятельности
  kaz: Қазақстан Республикасының туристік қызмет туралы заңнамасының орындалуы үшін жеке кәсіпкерлік саласындағы тәуекелдер дәрежесін бағалау өлшемдерін бекіту туралы
