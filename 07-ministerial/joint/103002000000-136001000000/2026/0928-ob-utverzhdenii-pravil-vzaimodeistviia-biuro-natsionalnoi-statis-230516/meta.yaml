act_code: '230516'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 28 сентября 2026 года № 31 и Министра финансов Республики Казахстан от 28 сентября 2026 года № 648
title:
  rus: Об утверждении Правил взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан и Министерства финансов Республики Казахстан по представлению органами государственных доходов сведений о налогоплательщике (налоговом агенте), составляющих налоговую тайну, и конфиденциальной информации
  kaz: Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің Ұлттық статистика бюросы мен Қазақстан Республикасы Қаржы министрлігінің мемлекеттік кірістер органдарының салықтық құпияны құрайтын салық төлеуші (салық агенті) туралы мәліметтерді және құпия ақпаратты ұсынуы жөніндегі өзара іс-қимыл қағидаларын бекіту туралы
