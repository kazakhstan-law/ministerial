  requisite: Совместный приказ и.о. Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 7 июня 2024 года № 86 и Министра финансов Республики Казахстан от 14 июня 2024 года № 361
  title:
    rus: О внесении изменений и дополнений в совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 7 октября 2022 года № 129 и исполняющего обязанности Министра финансов Республики Казахстан от 7 октября 2022 года № 1045 «Об утверждении Правил представления органами государственных доходов в Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан сведений, составляющих налоговую тайну, без получения письменного разрешения налогоплательщика (налогового агента) и конфиденциальной информации, а также перечня представляемых сведений и конфиденциальной информации»
    kaz: «Мемлекеттік кірістер органдарының Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің Ұлттық статистика бюросына салық төлеушінің (салық агентінің) жазбаша рұқсатын алмастан салықтық құпияны құрайтын мәліметтерді және құпия ақпаратты ұсыну қағидаларын, сондай-ақ ұсынылатын мәліметтер мен құпия ақпараттардың тізбесін бекіту туралы» Қазақстан Республикасының Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросы басшысының 2022 жылғы 7 қазандағы № 129 және Қазақстан Республикасы Қаржы министрінің міндетін атқарушының 2022 жылғы 7 қазандағы № 1045 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
