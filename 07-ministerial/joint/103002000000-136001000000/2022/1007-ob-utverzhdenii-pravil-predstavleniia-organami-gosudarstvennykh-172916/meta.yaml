act_code: '172916'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 7 октября 2022 года № 129 и и.о. Министра финансов Республики Казахстан от 7 октября 2022 года № 1045
title:
  rus: Об утверждении Правил представления органами государственных доходов в Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан сведений, составляющих налоговую тайну, без получения письменного разрешения налогоплательщика (налогового агента) и конфиденциальной информации, а также перечня представляемых сведений и конфиденциальной информации
  kaz: Мемлекеттік кірістер органдарының Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің Ұлттық статистика бюросына салық төлеушінің (салық агентінің) жазбаша рұқсатын алмастан салықтық құпияны құрайтын мәліметтерді және құпия ақпаратты ұсыну қағидаларын, сондай-ақ ұсынылатын мәліметтер мен құпия ақпараттардың тізбесін бекіту туралы
