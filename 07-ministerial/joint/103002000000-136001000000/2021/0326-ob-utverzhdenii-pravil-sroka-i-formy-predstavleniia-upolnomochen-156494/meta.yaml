act_code: '156494'
requisite: Совместный приказ Министра финансов Республики Казахстан от 26 марта 2021 года № 258 и Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 31 марта 2021 года № 46. Утратил силу совместным приказом Министра финансов Республики Казахстан 1 октября 2025 года № 557 и Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан 22 октября 2025 года № 227 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил, срока и формы представления уполномоченным органом в области государственной статистики административных данных, учтенных в книге похозяйственного учета
  kaz: Мемлекеттік статистика саласындағы уәкілетті органның шаруашылық бойынша есепке алу кітабында есепке алынған әкімшілік деректерді ұсыну қағидаларын, мерзімін және нысанын бекіту туралы
