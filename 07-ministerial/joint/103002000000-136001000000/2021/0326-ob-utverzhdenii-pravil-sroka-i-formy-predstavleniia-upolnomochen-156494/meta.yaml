  code: '215952'
  requisite: Совместный приказ Министра финансов Республики Казахстан 1 октября 2025 года № 557 и Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан 22 октября 2025 года № 227
  title:
    rus: О признании утратившим силу совместного приказа Министра финансов Республики Казахстан от 26 марта 2021 года № 258 и Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 31 марта 2021 года № 46 «Об утверждении Правил, срока и формы представления уполномоченным органом в области государственной статистики административных данных, учтенных в книге похозяйственного учета»
    kaz: «Мемлекеттік статистика саласындағы уәкілетті органның шаруашылық бойынша есепке алу кітабында есепке алынған әкімшілік деректерді ұсыну қағидаларын, мерзімін және нысанын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2021 жылғы 26 наурыздағы № 258 және Қазақстан Республикасының Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросы Басшысының 2021 жылғы 31 наурыздағы № 46 бірлескен бұйрықтың күші жойылды деп тану туралы
