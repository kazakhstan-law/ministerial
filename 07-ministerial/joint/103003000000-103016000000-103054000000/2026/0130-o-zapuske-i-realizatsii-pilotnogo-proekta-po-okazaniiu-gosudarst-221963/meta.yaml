  code: '224173'
  requisite: Совместный приказ Министра труда и социальной защиты населения Республики Казахстан от 10 апреля 2026 года № 131, Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 10 апреля 2026 года № 100/НҚ и Министра внутренних дел Республики Казахстан от 10 апреля 2026 года № 263
  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра труда и социальной защиты населения Республики Казахстан от 30 января 2026 года № 41, Министра внутренних дел Республики Казахстан от 30 января 2026 года № 60 и Заместителя Премьер-Министра – Министра  искусственного интеллекта и цифрового развития Республики Казахстан от 30 января 2026 года № 47 «О запуске и реализации пилотного проекта по оказанию  государственных услуг «Выдача разрешения иностранцам и лицам без гражданства на постоянное жительство в Республике Казахстан» и «Присвоение или продление статуса кандаса»
    kaz: «Шетелдіктер мен азаматтығы жоқ адамдарға Қазақстан Республикасында тұрақты тұруға рұқсат беру» және «Қандас мәртебесін беру немесе ұзарту» мемлекеттік көрсетілетін қызметтері  бойынша пилоттық жобаны іске қосу және іске асыру туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2026 жылғы 30 қаңтардағы №41, Қазақстан Республикасы Ішкі істер министрінің 2026 жылғы 30 қаңтардағы №60 және Қазақстан Республикасы Премьер-Министрінің орынбасары - Жасанды интеллект және цифрлық даму министрінің 2026 жылғы 30 қаңтардағы №47 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
