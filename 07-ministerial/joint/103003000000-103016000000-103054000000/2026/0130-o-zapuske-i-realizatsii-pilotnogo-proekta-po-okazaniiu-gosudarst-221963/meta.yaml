act_code: '221963'
requisite: Совместный приказ Министра труда и социальной защиты населения Республики Казахстан 30 января 2026 года № 41, Министра внутренних дел Республики Казахстан 30 января 2026 года № 60 и Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан 30 января 2026 года № 47
title:
  rus: О запуске и реализации пилотного проекта по оказанию государственных услуг «Выдача разрешения иностранцам и лицам без гражданства на постоянное жительство в Республике Казахстан» и «Присвоение или продление статуса кандаса»
  kaz: «Шетелдіктер мен азаматтығы жоқ адамдарға Қазақстан Республикасында тұрақты тұруға рұқсат беру» және «Қандас мәртебесін беру немесе ұзарту» мемлекеттік көрсетілетін қызметтері бойынша пилоттық жобаны іске қосу және іске асыру туралы
