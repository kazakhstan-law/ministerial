  title:
    rus: О внесении изменений и дополнения в совместный приказ Министра образования и науки Республики Казахстан от 17 мая 2018 года № 211 и Министра энергетики Республики Казахстан от 15 мая 2018 года № 185 «Об утверждении Правил финансирования обучения казахстанских кадров недропользователями в течение периода добычи углеводородов и урана»
    kaz: «Жер қойнауын пайдаланушылардың көмірсутектерді және уранды өндіру кезеңінде қазақстандық кадрларды оқытуды қаржыландыру қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2018 жылғы 17 мамырдағы № 211 және Қазақстан Республикасы Энергетика министрінің 2018 жылғы 15 мамырдағы № 185 бірлескен бұйрығына өзгерістер мен толықтыру енгізу туралы
