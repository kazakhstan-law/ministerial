  title:
    rus: О внесении изменений в совместный приказ Министра энергетики Республики Казахстан от 15 мая 2018 года № 185 и Министра образования и науки Республики Казахстан от 17 мая 2018 года № 211 «Об утверждении Правил финансирования обучения казахстанских кадров в размере одного процента от затрат на добычу, понесенных недропользователем в период добычи углеводородов и (или) урана по итогам предыдущего года»
    kaz: «Алдыңғы жылдың қорытындылары бойынша жер қойнауын пайдаланушының көмірсутектерді және (немесе) уранды өндіру кезеңінде өндіру үшін шеккен шығындарының бір пайызы мөлшерінде қазақстандық кадрларды оқытуды қаржыландыру қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2018 жылғы 15 мамырдағы № 185 және Қазақстан Республикасы Білім және ғылым министрінің 2018 жылғы 17 мамырдағы № 211 бірлескен бұйрығына өзгерістер енгізу туралы
