title:
  rus: Об утверждении Правил финансирования обучения казахстанских кадров в размере одного процента от затрат на добычу, понесенных недропользователем в период добычи углеводородов и (или) урана по итогам предыдущего года
  kaz: Алдыңғы жылдың қорытындылары бойынша жер қойнауын пайдаланушының көмірсутектерді және (немесе) уранды өндіру кезеңінде өндіру үшін шеккен шығындарының бір пайызы мөлшерінде қазақстандық кадрларды оқытуды қаржыландыру қағидаларын бекіту туралы
