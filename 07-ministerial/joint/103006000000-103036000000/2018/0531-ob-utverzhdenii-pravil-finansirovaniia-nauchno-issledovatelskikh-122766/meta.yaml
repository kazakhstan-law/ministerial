act_code: '122766'
requisite: Совместный приказ Министра энергетики Республики Казахстан от 31 мая 2018 года № 222 и Министра образования и науки Республики Казахстан от 31 мая 2018 года № 244. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 июня 2018 года № 17096
title:
  rus: Об утверждении Правил финансирования научно-исследовательских, научно-технических и (или) опытно-конструкторских работ в размере одного процента от затрат на добычу, понесенных недропользователем в период добычи углеводородов по итогам предыдущего года
  kaz: Алдыңғы жылдың қорытындылары бойынша жер қойнауын пайдаланушы көмірсутектерді өндіру кезеңінде өндіру үшін шеккен шығындарының бір пайызы мөлшерінде ғылыми-зерттеу, ғылыми-техникалық және (немесе) тәжірибелік-конструкторлық жұмыстарды қаржыландыру қағидаларын бекіту туралы
