  title:
    rus: О внесении изменений в совместный приказ Министра энергетики Республики Казахстан от 31 мая 2018 года № 222 и Министра образования и науки Республики Казахстан от 31 мая 2018 года № 244 «Об утверждении Правил финансирования научно-исследовательских, научно-технических и (или) опытно-конструкторских работ недропользователями в период добычи углеводородов и урана»
    kaz: «Жер қойнауын пайдаланушылардың көмірсутектерді және уранды өндіру кезеңінде ғылыми-зерттеу, ғылыми-техникалық және (немесе) тәжірибелік-конструкторлық жұмыстарды қаржыландыру қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2018 жылғы 31 мамырдағы № 222 және Қазақстан Республикасы Білім және ғылым министрінің 2018 жылғы 31 мамырдағы № 244 бірлескен бұйрығына өзгерістер енгізу туралы
