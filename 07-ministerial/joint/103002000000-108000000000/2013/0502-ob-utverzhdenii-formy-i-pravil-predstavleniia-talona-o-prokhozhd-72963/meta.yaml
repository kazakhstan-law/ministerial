requisite: Совместный приказ Министра финансов Республики Казахстан от 2 мая 2013 года № 224 и Председателя Комитета национальной безопасности Республики Казахстан от 2 мая 2013 года № 219. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июня 2013 года № 8495. Утратил силу совместным приказом Министра финансов Республики Казахстан от 30 января 2018 года № 85 и Председателя Комитета национальной безопасности Республики Казахстан от 6 февраля 2018 года № 5 нс (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении формы и Правил представления талона о прохождении государственного контроля, выдаваемого территориальными подразделениями Пограничной службы Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінінің аумақтық бөлімшелері беретін мемлекеттік бақылаудан өткендігі туралы талон нысанын және оны табыс ету қағидаларын бекіту туралы
