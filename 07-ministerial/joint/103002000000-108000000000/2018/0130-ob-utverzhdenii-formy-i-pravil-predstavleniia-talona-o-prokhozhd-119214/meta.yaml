caused_by:
  code: '156012'
  requisite: Совместный приказ Министра финансов Республики Казахстан от 13 мая 2021 года № 450 и Председателя Комитета национальной безопасности Республики Казахстан от 17 мая 2021 года № 55/қе. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 мая 2021 года № 22773. Утратил силу совместным приказом Министра финансов Республики Казахстан от 7 ноября 2025 года № 681 и Председателя Комитета национальной безопасности Республики Казахстан от 10 ноября 2025 года № 102нқа/қе (вводится в действие с 1 января 2026 года)
  title:
    rus: О внесении изменений в совместный приказ Министра финансов Республики Казахстан от 30 января 2018 года № 85 и Председателя Комитета национальной безопасности Республики Казахстан от 6 февраля 2018 года № 5 нс «Об утверждении формы и Правил представления талона о прохождении государственного контроля, выдаваемого территориальными подразделениями Пограничной службы Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінінің аумақтық бөлімшелері беретін мемлекеттік бақылаудан өту туралы талонның нысаны және оны ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 30 қаңтардағы № 85 және Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2018 жылғы 6 ақпандағы № 5 нс бірлескен бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/156012/rus
