  title:
    rus: Об утверждении формы и Правил представления талона о прохождении государственного контроля (либо копии талона о прохождении государственного контроля), выдаваемого территориальными подразделениями (структурными подразделениями) Пограничной службы Комитета национальной безопасности Республики Казахстан
    kaz: Қазақстан Республикасының Ұлттық қауіпсіздік комитеті Шекара қызметінің аумақтық бөлімшелері (құрылымдық бөлімшелері) беретін мемлекеттік бақылаудан өткені туралы талонның (не мемлекеттік бақылаудан өткені туралы талон көшірмесінің) нысанын және ұсыну қағидаларын бекіту туралы
