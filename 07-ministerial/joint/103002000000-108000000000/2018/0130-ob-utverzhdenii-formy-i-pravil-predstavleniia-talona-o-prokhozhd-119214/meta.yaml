requisite: Совместный приказ Министра финансов Республики Казахстан от 30 января 2018 года № 85 и Председателя Комитета национальной безопасности Республики Казахстан от 6 февраля 2018 года № 5 нс. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 февраля 2018 года № 16413. Утратил силу совместным приказом Министра финансов Республики Казахстан от 7 ноября 2025 года № 681 и Председателя Комитета национальной безопасности Республики Казахстан от 10 ноября 2025 года № 102нқа/қе (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении формы и Правил представления талона о прохождении государственного контроля, выдаваемого структурными подразделениями территориального подразделения Пограничной службы Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Шекара қызметі аумақтық бөлімшесінің құрылымдық бөлімшелері беретін мемлекеттік бақылаудан өту туралы талонның нысаны және оны ұсыну қағидаларын бекіту туралы
