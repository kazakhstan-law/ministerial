requisite: Совместный приказ Министра культуры и информации Республики Казахстан от 29 марта 2013 года № 70 и Первого Заместителя Премьер-Министра Республики Казахстан - Министра регионального развития Республики Казахстан от 29 марта 2013 года № 01-04-03/27нқ. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 апреля 2013 года № 8440. Утратил силу совместным приказом и.о. Министра культуры и спорта Республики Казахстан от 25 июня 2015 года № 221 и и.о. Министра национальной экономики Республики Казахстан от 30 июня 2015 года № 476
title:
