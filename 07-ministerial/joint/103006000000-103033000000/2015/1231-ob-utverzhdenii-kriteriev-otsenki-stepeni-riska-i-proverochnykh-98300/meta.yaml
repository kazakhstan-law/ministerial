  title:
    rus: О внесении изменений и дополнений в совместный приказ исполняющего обязанности Министра образования и науки Республики Казахстан от 31 декабря 2015 года № 719 и исполняющего обязанности Министра национальной экономики Республики Казахстан от 31 декабря 2015 года № 843 «Об утверждении критериев оценки степени риска и проверочных листов за системой образования в части дошкольного воспитания и обучения, начального, основного среднего, общего среднего, технического и профессионального, послесреднего и дополнительного образования»
    kaz: «Мектепке дейінгі тәрбие мен оқыту, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі және қосымша білім беру бөлігінде білім беру жүйесінің тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің міндетін атқарушының 2015 жылғы 31 желтоқсандағы № 719 және Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 31 желтоқсандағы № 843 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
