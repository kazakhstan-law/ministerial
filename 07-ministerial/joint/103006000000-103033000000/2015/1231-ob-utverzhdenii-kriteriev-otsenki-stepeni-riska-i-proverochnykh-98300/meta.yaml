  title:
    rus: О внесении изменений в совместный приказ исполняющего обязанности Министра образования и науки Республики Казахстан от 31 декабря 2015 года № 719 и исполняющего обязанности Министра национальной экономики Республики Казахстан от 31 декабря 2015 года № 843 «Об утверждении критериев оценки степени риска и проверочных листов по проверкам за системой образования»
    kaz: «Білім беру жүйесіне тексеру жүргізу бойынша тәуекел дәрежесін бағалау өлшемшарттары мен тексеру парақтарын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің міндетін атқарушының 2015 жылғы 31 желтоқсандағы № 719 және Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 31 желтоқсандағы № 843 бірлескен бұйрығына өзгерістер енгізу туралы
