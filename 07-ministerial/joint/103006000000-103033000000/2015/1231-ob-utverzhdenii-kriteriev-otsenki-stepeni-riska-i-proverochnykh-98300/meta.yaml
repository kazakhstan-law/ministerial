act_code: '98300'
requisite: Совместный приказ и.о. Министра образования и науки Республики Казахстан от 31 декабря 2015 года № 719 и и.о. Министра национальной экономики Республики Казахстан от 31 декабря 2015 года № 843. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12777
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов за системой образования в части дошкольного воспитания и обучения, начального, основного среднего, общего среднего, технического и профессионального, послесреднего, дополнительного образования и предоставления образовательно-оздоровительных услуг несовершеннолетним
  kaz: Мектепке дейінгі тәрбие мен оқыту, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі, қосымша білім беру және кәмелетке толмағандарға білім беру-сауықтыру көрсетілетін қызметтерін ұсыну бөлігінде білім беру жүйесінің тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
