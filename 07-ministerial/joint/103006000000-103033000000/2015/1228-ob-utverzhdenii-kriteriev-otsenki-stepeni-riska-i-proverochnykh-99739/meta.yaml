  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра образования и науки Республики Казахстан от 28 декабря 2015 года № 708 и исполняющего обязанности Министра национальной экономики Республики Казахстан от 30 декабря 2015 года № 832 «Об утверждении критериев оценки степени риска и проверочного листа в области защиты прав ребенка»
    kaz: «Баланың құқықтарын қорғау саласындағы тәуекел дәрежесін бағалау критерийлерін және тексеру парағын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2015 жылғы 28 желтоқсандағы № 708 және Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 30 желтоқсандағы № 832 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
