act_code: '156644'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 28 июня 2021 года № 133 и Первого заместителя Министра обороны – начальника Генерального штаба Вооруженных Сил Республики Казахстан от 30 июня 2021 года № 112
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с Министерством обороны Республики Казахстан при проведении национальной переписи населения Республики Казахстан в 2021 году на объектах Министерства обороны Республики Казахстан
  kaz: Қазақстан Республикасы Қорғаныс министрлігінің объектілерінде 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің Ұлттық статистика бюросы Қазақстан Республикасы Қорғаныс министрлігімен өзара іс-қимыл тәртібін бекіту туралы
