title:
  rus: Об утверждении Правил финансирования научно-исследовательских, научно-технических и (или) опытно-конструкторских работ в размере одного процента от расходов на добычу, понесенных недропользователем в предыдущем году
  kaz: Жер қойнауын пайдаланушының алдыңғы жылы өндіруге арналған шығыстарының бір пайызы мөлшерінде ғылыми-зерттеу, ғылыми-техникалық және (немесе) тәжірибелік-конструкторлық жұмыстарды қаржыландыру қағидаларын бекіту туралы
