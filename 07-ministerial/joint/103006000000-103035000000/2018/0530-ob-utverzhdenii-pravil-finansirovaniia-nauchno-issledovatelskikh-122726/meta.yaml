  title:
    rus: О внесении изменений в Совместный приказ Министра по инвестициям и развитию Республики Казахстан от 30 мая 2018 года № 410 и Министра образования и науки Республики Казахстан от 31 мая 2018 года № 245 «Об утверждении Правил финансирования научно-исследовательских, научно-технических и (или) опытно конструкторских работ в размере одного процента от расходов на добычу, понесенных недропользователем в предыдущем году»
    kaz: «Жер қойнауын пайдаланушының алдыңғы жылы өндіруге арналған шығыстарының бір пайызы мөлшерінде ғылыми-зерттеу, ғылыми-техникалық және (немесе) тәжірибелік-конструкторлық жұмыстарды қаржыландыру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 30 мамырдағы № 410 және Қазақстан Республикасы Білім және ғылым министрінің 2018 жылғы 31 мамырдағы № 245 бірлескен бұйрығына өзгерістер енгізу туралы
