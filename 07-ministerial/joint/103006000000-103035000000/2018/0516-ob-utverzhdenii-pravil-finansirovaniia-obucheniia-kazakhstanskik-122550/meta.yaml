  title:
    rus: О внесении изменения в совместный приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 16 мая 2018 года № 333 и Министра образования и науки Республики Казахстан от 22 мая 2018 года № 217 «Об утверждении Правил финансирования обучения казахстанских кадров в размере одного процента от расходов на добычу, понесенных недропользователем в предыдущем году»
    kaz: «Жер қойнауын пайдаланушы алдыңғы жылы өндіруге арналған шығыстарының бір пайызы мөлшерінде қазақстандық кадрларды оқытуды қаржыландыру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 16 мамырдағы № 333 және Қазақстан Республикасы Білім және ғылым министрінің 2018 жылғы 22 мамырдағы № 217 бірлескен бұйрығына өзгеріс енгізу туралы
