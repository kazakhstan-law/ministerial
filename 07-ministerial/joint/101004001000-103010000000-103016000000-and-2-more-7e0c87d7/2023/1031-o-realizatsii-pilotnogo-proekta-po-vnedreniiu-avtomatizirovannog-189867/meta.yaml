act_code: '189867'
requisite: Совместный приказ Министра здравоохранения Республики Казахстан от 31 октября 2023 года № 160, Председателя Агентства Республики Казахстан по делам государственной службы от 31 октября 2023 года № 212, Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 8 ноября 2023 года № 530/НҚ, Министра труда и социальной защиты населения Республики Казахстан от 2 ноября 2023 года № 462 и Руководителя государственного учреждения «Медицинский центр Управления делами Президента Республики Казахстан» от 24 ноября 2023 года № 138
title:
  rus: О реализации пилотного проекта по внедрению автоматизированного процесса предоставления листа о временной нетрудоспособности в электронном виде государственным служащим, прикрепленным к РГП «Больница Медицинского центра Управления делами Президента Республики Казахстан» на ПХВ и проживающим в городе Астана
  kaz: «Қазақстан Республикасы Президентінің Іс басқармасы Медициналық орталығының ауруханасы» ШЖҚ РМК-ға бекітілген және Астана қаласында тұратын мемлекеттік қызметшілерге еңбекке уақытша жарамсыздық туралы парағын электрондық түрде ұсынудың автоматтандырылған процесін енгізу жөніндегі пилоттық жобаны іске асыру туралы
