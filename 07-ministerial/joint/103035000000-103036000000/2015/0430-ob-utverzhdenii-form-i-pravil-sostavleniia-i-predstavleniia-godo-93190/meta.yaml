act_code: '93190'
requisite: Совместный приказ Министра по инвестициям и развитию Республики Казахстан от 30 апреля 2015 года № 538 и Министра энергетики Республики Казахстан от 30 апреля 2015 года № 330. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 июня 2015 года № 11453. Утратил силу совместным приказом Министра по инвестициям и развитию Республики Казахстан от 18 мая 2018 года № 344 и Министра энергетики Республики Казахстан от 22 мая 2018 года № 199 (вводится в действие с 29.06.2018)
title:
  rus: Об утверждении форм и Правил составления и представления годовой, среднесрочной, долгосрочной программ закупа товаров, работ и услуг, отчетов недропользователей о приобретенных товарах, работах и услугах и об исполнении обязательств по местному содержанию в кадрах
  kaz: Жер қойнауын пайдаланушылардың тауарларды, жұмыстар мен көрсетілетін қызметтерді сатып алуының жылдық, орта мерзімді, ұзақ мерзімді бағдарламаларын, сатып алынған тауарлар, жұмыстар мен көрсетілген қызметтер туралы және кадрлардағы жергілікті қамту жөніндегі міндеттемелердің орындалуы туралы есептерін жасау және ұсыну нысандары мен қағидасын бекіту туралы
