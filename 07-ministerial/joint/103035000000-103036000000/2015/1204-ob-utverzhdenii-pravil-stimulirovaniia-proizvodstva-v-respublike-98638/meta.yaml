  requisite: Совместный приказ и.о. Министра энергетики Республики Казахстан от 3 июня 2019 года № 206 и Министра индустрии и инфраструктурного развития Республики Казахстан от 5 июня 2019 года № 367. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 июня 2019 года № 18818. Утратил силу совместным приказом и.о. Министра экологии, геологии и природных ресурсов Республики Казахстан от 21 июля 2021 года № 263 и Министра индустрии и инфраструктурного развития Республики Казахстан от 29 июля 2021 года № 400 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в совместный приказ исполняющего обязанности Министра энергетики Республики Казахстан от 4 декабря 2015 года № 697 и Министра по инвестициям и развитию Республики Казахстан от 23 декабря 2015 года № 1219 «Об утверждении Правил стимулирования производства в Республике Казахстан экологически чистых автомобильных транспортных средств (соответствующих экологическому классу 4 и выше; с электродвигателями) и их компонентов»
    kaz: «Қазақстан Республикасында экологиялық таза автомобиль көлік құралдарының (4 және одан да жоғары экологиялық сыныпқа сәйкес келетін; электр қозғалтқыштары бар) және олардың компоненттерінің өндірісін ынталандыру қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2015 жылғы 4 желтоқсандағы № 697 және Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 23 желтоқсандағы № 1219 бірлескен бұйрығына өзгерістер енгізу туралы
