caused_by:
  code: '146543'
  requisite: Совместный приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 22 сентября 2020 года № 230 и Министра индустрии и инфраструктурного развития Республики Казахстан от 22 сентября 2020 года № 492. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 сентября 2020 года № 21242. Утратил силу совместным приказом и.о. Министра экологии, геологии и природных ресурсов Республики Казахстан от 21 июля 2021 года № 263 и Министра индустрии и инфраструктурного развития Республики Казахстан от 29 июля 2021 года № 400 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в совместный приказ исполняющего обязанности Министра энергетики Республики Казахстан от 4 декабря 2015 года № 697 и Министра по инвестициям и развитию Республики Казахстан от 23 декабря 2015 года № 1219 «Об утверждении Правил стимулирования производства в Республике Казахстан экологически чистых автомобильных транспортных средств (соответствующих экологическому классу 4 и выше; с электродвигателями) и их компонентов, а также самоходной сельскохозяйственной техники, соответствующей экологическим требованиям, определенным техническими регламентами»
    kaz: «Қазақстан Республикасында экологиялық таза автомобиль көлік құралдарының (4 және одан жоғары экологиялық сыныпқа сәйкес келетін; электрлі қозғалтқыштары бар) және олардың құрамдастарының, сондай-ақ техникалық регламенттерде айқындалған экологиялық талаптарға сәйкес келетін өздігінен жүретін ауыл шаруашылығы техникасының өндірісін ынталандыру қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2015 жылғы 4 желтоқсандағы № 697 және Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 23 желтоқсандағы № 1219 бірлескен бұйрығына өзгеріс енгізу туралы
