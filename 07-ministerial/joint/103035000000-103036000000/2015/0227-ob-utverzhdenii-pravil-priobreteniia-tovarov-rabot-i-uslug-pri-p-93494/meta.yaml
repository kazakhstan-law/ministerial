  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра по инвестициям и развитию Республики Казахстан от 27 февраля 2015 года № 253 и Министра энергетики Республики Казахстан от 27 марта 2015 года № 241 «Об утверждении Правил приобретения товаров, работ и услуг при проведении операций по недропользованию»
    kaz: «Жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде тауарларды, жұмыстар мен көрсетілетін қызметтерді сатып алу қағидаларын бекіту туралы» Қазақстан Республикасының Инвестициялар және даму министрінің 2015 жылғы 27 ақпандағы № 253 және Қазақстан Республикасының Энергетика министрінің 2015 жылғы 27 наурыздағы № 241 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
