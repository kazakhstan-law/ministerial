  title:
    rus: О внесении изменений и дополнения в совместный приказ Министра по инвестициям и развитию Республики Казахстан от 27 февраля 2015 года № 253 и Министра энергетики Республики Казахстан от 27 марта 2015 года № 241 "Об утверждении Правил приобретения товаров, работ и услуг при проведении операций по недропользованию"
