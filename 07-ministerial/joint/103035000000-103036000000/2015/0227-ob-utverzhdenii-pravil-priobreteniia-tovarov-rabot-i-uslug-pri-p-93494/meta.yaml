requisite: Совместный приказ Министра по инвестициям и развитию Республики Казахстан от 27 февраля 2015 года № 253 и Министра энергетики Республики Казахстан от 27 марта 2015 года № 241. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 мая 2015 года № 11000. Утратил силу совместным приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 12 апреля 2019 года № 214 и Министра энергетики Республики Казахстан от 16 апреля 2019 года № 119 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
