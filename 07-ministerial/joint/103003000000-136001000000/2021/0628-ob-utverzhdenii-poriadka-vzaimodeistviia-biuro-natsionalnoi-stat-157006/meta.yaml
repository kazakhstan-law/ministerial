act_code: '157006'
requisite: Совместный приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 28 июня 2021 года № 131 и Министра внутренних дел Республики Казахстан от 9 июля 2021 года № 398
title:
  rus: Об утверждении Порядка взаимодействия Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан с Министерством внутренних дел Республики Казахстан при проведении национальной переписи населения Республики Казахстан в 2021 году на объектах Министерства внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы Ішкі істер министрлігінің объектілерінде 2021 жылы Қазақстан Республикасы халқының ұлттық санағын өткізу кезіндегі Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің Ұлттық статистика бюросы Қазақстан Республикасы Ішкі істер министрлігімен өзара іс-қимыл тәртібін бекіту туралы
