  code: '98765'
  requisite: Приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 27 января 2016 года № 34. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 февраля 2016 года № 13021. Утратил силу приказом Председателя Комитета государственных доходов Министерства финансов РК от 7 сентября 2016 года № 523
  title:
    rus: О внесении изменений в приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 7 ноября 2014 года № 26 «Об утверждении положений управлений государственных доходов по районам, городам, районам в городах, на территории специальных экономических зон, таможен Департаментов государственных доходов Комитета государственных доходов Министерства финансов Республики Казахстан»
    kaz: «Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитеті Мемлекеттік кірістер департаменттерінің аудандар, қалалар, қалалардағы аудандар бойынша, арнайы экономикалық аймақтардың аумағындағы мемлекеттік кірістер басқармалаларының, кедендердің ережелерін бекіту туралы» Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитеті төрағасының 2014 жылғы 7 қарашадағы № 26 бұйрығына өзгерістер енгізу туралы
