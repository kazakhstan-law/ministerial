  code: '90968'
  requisite: Приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 12 мая 2015 года № 239. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 июня 2015 года № 11385. Утратил силу приказом Председателя Комитета государственных доходов Министерства финансов РК от 7 сентября 2016 года № 523
  title:
    rus: О внесении дополнений в приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 7 ноября 2014 года № 26 «Об утверждении положений управлений государственных доходов по районам, городам, районам в городах, на территории специальных экономических зон, таможен Департаментов государственных доходов Комитета государственных доходов Министерства финансов Республики Казахстан»
    kaz: «Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитеті Мемлекеттік кірістер департаменттері кедендерінің, аудандар, қалалар, қалалардағы аудандар бойынша, арнайы экономикалық аймақтардың аумағындағы мемлекеттік кірістер басқармаларының ережелерін бекіту туралы» Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитеті Төрағасының 2014 жылғы 7 қарашадағы № 26 бұйрығына  толықтырулар енгізу туралы
