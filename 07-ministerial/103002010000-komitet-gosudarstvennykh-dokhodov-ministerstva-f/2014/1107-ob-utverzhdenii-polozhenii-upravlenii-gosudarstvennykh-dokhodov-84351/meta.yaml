act_code: '84351'
requisite: Приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 7 ноября 2014 года № 26. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 ноября 2014 года № 9868. Утратил силу приказом Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 7 сентября 2016 года № 523
title:
  rus: Об утверждении положений управлений государственных доходов по районам, городам, районам в городах, на территории специальных экономических зон Департаментов государственных доходов Комитета государственных доходов Министерства финансов Республики Казахстан
  kaz: Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитеті Мемлекеттік кірістер департаменттері аудандар, қалалар, қалалардағы аудандар бойынша, арнайы экономикалық аймақтардың аумағындағы мемлекеттік кірістер басқармалаларының, ережелерін бекіту туралы
