  code: '87425'
  requisite: Приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 27 января 2015 года № 48. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 марта 2015 года № 10396. Утратил силу приказом Председателя Комитета государственных доходов Министерства финансов РК от 7 сентября 2016 года № 523
  title:
    rus: О внесении изменения и дополнений в приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан  от 7 ноября 2014 года № 26 "Об утверждении положений управлений государственных доходов по районам, городам, районам в городах, на территории специальных экономических зон, таможен Департаментов государственных доходов Комитета государственных доходов Министерства финансов Республики Казахстан"
    kaz: '"Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитеті Мемлекеттік кірістер департаменттерінің аудандар, қалалар, қалалардағы аудандар бойынша, арнайы экономикалық аймақтардың аумағындағы мемлекеттік кірістер басқармалаларының, кедендердің ережелерін бекіту туралы" Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитеті Төрағасының 2014 жылғы 7 қарашадағы № 26 бұйрығына өзгеріс және толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/87425/rus
