title:
  rus: Об утверждении положений Департаментов государственных доходов Комитета государственных доходов Министерства финансов Республики Казахстан по областям, городам республиканского значения и столицы и их территориальных органов
  kaz: Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитетінің облыстар, республикалық маңызы бар қалалар және астана бойынша мемлекеттік кірістер департаменттерінің және олардың аумақтық органдарының ережелерін бекіту туралы
