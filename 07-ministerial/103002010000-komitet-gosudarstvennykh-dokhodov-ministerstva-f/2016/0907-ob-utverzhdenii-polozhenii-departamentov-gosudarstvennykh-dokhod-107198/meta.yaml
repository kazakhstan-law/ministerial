  title:
    rus: О внесении изменения в приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 7 сентября 2016 года № 522 «Об утверждении положений Департаментов государственных доходов Комитета государственных доходов Министерства финансов Республики Казахстан по областям, городам республиканского значения и столицы и их территориальных органов»
    kaz: «Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитетінің облыстар, республикалық маңызы бар қалалар және астана бойынша мемлекеттік кірістер департаменттерінің және олардың аумақтық органдарының ережелерін бекіту туралы» Қазақстан Республикасы Қаржы министрлігінің Мемлекеттік кірістер комитеті төрағасының 2016 жылғы 7 қыркүйектегі № 522 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/202102/rus
