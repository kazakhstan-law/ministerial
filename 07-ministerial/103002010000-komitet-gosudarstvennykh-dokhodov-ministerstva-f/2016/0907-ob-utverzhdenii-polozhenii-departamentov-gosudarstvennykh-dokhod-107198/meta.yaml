  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 7 сентября 2016 года № 522 «Об утверждении положений Департаментов государственных доходов Комитета государственных доходов Министерства финансов Республики Казахстан по областям, городам республиканского значения и столицы и их территориальных органов»
    kaz: «Қазақстан Республикасының Қаржы министрлігі Мемлекеттік кірістер комитетінің облыстар, республикалық маңызы бар қалалар және астана бойынша Мемлекеттік кірістер департаменттерінің және олардың аумақтық органдарының ережелерін бекіту туралы» Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитеті төрағасының 2016 жылғы 7 қыркүйектегі № 522 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/133436/rus
