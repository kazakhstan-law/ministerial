  requisite: Приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 12 ноября 2018 года № 506
  title:
    rus: О внесении изменений в приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 7 сентября 2016 года № 522 «Об утверждении положений Департаментов государственных доходов Комитета государственных доходов Министерства финансов Республики Казахстан по областям, городам Астана, Алматы и Шымкент и их территориальных органов»
    kaz: «Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитетінің Астана, Алматы және Шымкент қалалары, облыстар бойынша мемлекеттік кірістер департаменттерінің және олардың аумақтық органдарының ережелерін бекіту туралы» Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитеті төрағасының 2016 жылғы 7 қыркүйектегі № 522 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/125969/rus
