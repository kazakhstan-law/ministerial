  requisite: Приказ и.о. Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 29 ноября 2016 года № 687
  title:
    rus: О внесениии изменений и дополнений в приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 7 сентября 2016 года № 522 "Об утверждении положений Департаментов государственных доходов Комитета государственных доходов Министерства финансов Республики Казахстан по областям, городам Астана и Алматы, таможни "Достык" и их территориальных органов"
    kaz: '"Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитетінің "Достық" кедені, Астана және Алматы қалалары, облыстар бойынша мемлекеттік кірістер департаменттерінің және олардың аумақтық органдарының ережелерін бекіту туралы" Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитеті төрағасының 2016 жылғы 7 қыркүйектегі № 522 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/108124/rus
