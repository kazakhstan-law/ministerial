  requisite: Приказ и.о. Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 13 июня 2017 года № 264
  title:
    rus: О внесениии изменений в приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 7 сентября 2016 года № 522 «Об утверждении положений Департаментов государственных доходов Комитета государственных доходов Министерства финансов Республики Казахстан по областям, городам Астана и Алматы и их территориальных органов»
    kaz: «Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитетінің облыстар, Астана және Алматы қалалары бойынша мемлекеттік кірістер департаменттерінің және олардың аумақтық органдарының ережелерін бекіту туралы» 2016 жылғы 7 қыркүйектегі № 522 Қазақстан Республикасы Қаржы министрлігінің Мемлекеттік кірістер комитеті Төрағасының бұйрығына өзгерістер енгізу туралы
