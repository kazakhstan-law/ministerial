  title:
    rus: О внесении изменений и дополнений в приказы Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 7 сентября 2016 года № 522 «Об утверждении положений Департаментов государственных доходов Комитета государственных доходов Министерства финансов Республики Казахстан по областям, городам Астана, Алматы и Шымкент и их территориальных органов» и исполняющего обязаннности Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 21 октября 2016 года № 595 «Об утверждении положений государственных учреждений Комитета государственных доходов Министерства финансов Республики Казахстан»
    kaz: «Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитетінің Астана және Алматы қалалары, облыстар бойынша мемлекеттік кірістер департаменттерінің және олардың аумақтық органдарының ережелерін бекіту туралы» Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитеті төрағасының 2016 жылғы 7 қыркүйектегі № 522 және «Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитетінің мемлекеттік мекемелерінің ережелерін бекіту туралы» Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитеті төрағасының м.а. 2016 жылғы 21 қазандағы № 595 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/131473/rus
