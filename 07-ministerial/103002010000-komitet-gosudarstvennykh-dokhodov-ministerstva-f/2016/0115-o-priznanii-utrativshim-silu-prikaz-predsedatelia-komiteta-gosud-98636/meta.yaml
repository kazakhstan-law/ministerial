title:
  rus: О признании утратившим силу приказ Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 2 марта 2015 года № 113 "Об утверждении Правил отбора проб и образцов товаров должностными лицами органов государственных доходов"
  kaz: '"Мемлекеттік кірістер органдары лауазымды тұлғаларының тауарлардың сынамалары мен үлгілерін іріктеп алу қағидаларын бекіту туралы" Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитеті төрағасының 2015 жылғы наурыздағы № 113 бұйрығының күші жою туралы'
