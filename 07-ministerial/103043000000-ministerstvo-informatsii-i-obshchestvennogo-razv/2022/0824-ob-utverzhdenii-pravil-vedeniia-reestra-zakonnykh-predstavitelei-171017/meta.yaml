requisite: Приказ Министра информации и общественного развития Республики Казахстан от 24 августа 2022 года № 344. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 августа 2022 года № 29293. Утратил силу приказом и.о. Министра культуры и информации Республики Казахстан от 29 сентября 2023 года № 388-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил ведения реестра законных представителей иностранных онлайн-платформ и (или) сервисов обмена мгновенными сообщениями, осуществляющих взаимодействие с уполномоченным органом в области средств массовой информации
  kaz: Шетелдік онлайн-платформалардың және (немесе) лездік хабар алмасу сервистерінің бұқаралық ақпарат құралдары саласындағы уәкілетті органмен өзара іс-қимылды жүзеге асыратын заңды өкілдерінің тізілімін жүргізу қағидаларын бекіту туралы
