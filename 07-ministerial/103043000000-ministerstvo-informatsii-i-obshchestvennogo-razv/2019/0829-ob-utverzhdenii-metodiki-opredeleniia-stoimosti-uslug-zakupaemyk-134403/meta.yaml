requisite: Приказ Министра информации и общественного развития Республики Казахстан от 29 августа 2019 года № 313. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 августа 2019 года № 19310. Утратил силу приказом Министра информации и общественного развития Республики Казахстан от 14 июня 2021 года № 209 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики определения стоимости услуг, закупаемых для проведения государственной информационной политики в средствах массовой информации за счет средств республиканского бюджета
  kaz: Республикалық бюджет есебінен бұқаралық ақпарат құралдарында мемлекеттік ақпараттық саясатты жүргізу үшін сатып алынатын қызметтердің құнын айқындау әдістемесін бекіту туралы
