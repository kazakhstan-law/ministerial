  kaz: Көшірме жасауға немесе басып шығаруға жұмсалатын нақты шығындардың мөлшерін және оларды ақпарат иеленушіге төлеу қағидасын, сондай-ақ халықтың әлеуметтік жағынан осал топтарын көшірме жасауға немесе басып шығаруға жұмсалатын шығындарды төлеуден босату қағидасын бекіту туралы
