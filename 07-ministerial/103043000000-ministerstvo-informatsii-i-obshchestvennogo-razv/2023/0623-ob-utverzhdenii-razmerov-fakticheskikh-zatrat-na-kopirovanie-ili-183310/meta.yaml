  title:
    rus: О внесении изменений в приказ Министра информации и общественного развития Республики Казахстан от 23 июня 2023 года № 258-НҚ «Об утверждении размеров фактических затрат на копирование или печать и порядка их оплаты обладателю информации, а также порядка освобождения социально уязвимых слоев населения от оплаты фактических затрат на копирование или печать»
    kaz: «Көшірме жасауға немесе басып шығаруға жұмсалатын нақты шығындардың мөлшерін және оларды ақпарат иеленушіге төлеу тәртібін, сондай-ақ халықтың әлеуметтік жағынан осал топтарын көшірме жасауға немесе басып шығаруға жұмсалатын шығындарды төлеуден босату тәртібін бекіту туралы» Қазақстан Республикасы Ақпарат және қоғамдық даму министрінің 2023 жылғы 23 маусымдағы № 258-НҚ бұйрығына өзгерістер енгізу туралы
