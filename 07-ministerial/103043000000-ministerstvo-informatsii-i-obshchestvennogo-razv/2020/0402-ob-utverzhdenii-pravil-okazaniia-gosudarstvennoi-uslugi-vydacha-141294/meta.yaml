  title:
    rus: Об утверждении Правил осуществления учета иностранных периодических печатных изданий, распространяемых на территории Республики Казахстан и внесении изменений в приказ Министра информации и общественного развития Республики Казахстан от 2 апреля 2020 года № 101 «Об утверждении Правил оказания государственных услуг в области информации»
    kaz: Қазақстан Республикасының аумағында таратылатын шетелдік мерзімді баспасөз басылымдарын есепке алуды жүзеге асыру қағидаларын бекіту және «Ақпарат саласында мемлекеттік қызметтер көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Ақпарат және қоғамдық даму министрінің 2020 жылғы 2 сәуірдегі № 101 бұйрығына өзгерістер енгізу туралы
