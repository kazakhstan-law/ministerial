  title:
    rus: О внесении изменений и дополнений в приказ Министра информации и общественного развития Республики Казахстан от 05 мая 2020 года № 129 «Об утверждении Положения о Комитете по развитию межэтнических отношений Министерства информации и общественного развития Республики Казахстан»
    kaz: «Қазақстан Республикасы Ақпарат және қоғамдық даму министрлігінің Этносаралық қатынастарды дамыту комитетінің ережесін бекіту туралы» Қазақстан Республикасы Ақпарат және қоғамдық даму министрінің 2020 жылғы 5 мамырдағы № 129 бұйрығына өзгерістер мен толықтырулар енгізу туралы
