    kaz: «Қазақстан Республикасы Ақпарат және қоғамдық даму министрлігінің Этносаралық қатынастарды дамыту комитетінің ережесін бекіту туралы» Қазақстан Республикасы Ақпарат және қоғамдық даму министрінің 2020 жылғы 5 мамырдағы № 129 бұйрығына өзгерістер енгізу туралы
