  title:
    rus: О внесении изменения и дополнений в приказ Министра информации и общественного развития Республики Казахстан от 5 мая 2020 года № 129 «Об утверждении Положения республиканского государственного учреждения «Комитет по развитию межэтнических отношений Министерства информации и общественного развития Республики Казахстан»
    kaz: «Қазақстан Республикасы Ақпарат және қоғамдық даму министрлігінің Этносаралық қатынастарды дамыту комитетінің ережесін бекіту туралы» Қазақстан Республикасы Ақпарат және қоғамдық даму министрінің 2020 жылғы 5 мамырдағы № 129 бұйрығына өзгеріс пен толықтырулар енгізу туралы
