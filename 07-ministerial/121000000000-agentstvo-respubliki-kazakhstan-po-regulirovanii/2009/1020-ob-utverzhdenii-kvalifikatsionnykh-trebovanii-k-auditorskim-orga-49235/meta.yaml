act_code: '49235'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 20 октября 2009 года № 04.2-44/172. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 ноября 2009 года № 5927. Утратил силу постановлением Правления Национального Банка Республики Казахстан от 29 марта 2013 года № 87
title:
  rus: Об утверждении квалификационных требований к аудиторским организациям для допуска финансовых инструментов на специальную торговую площадку регионального финансового центра города Алматы
  kaz: Қаржы құралдарын Алматы қаласының өңірлік қаржы орталығының арнайы сауда алаңына жіберу үшін аудиторлық ұйымдарға қойылатын біліктілік талаптарын бекіту туралы
