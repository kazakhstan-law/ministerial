  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 20 марта 2009 года № 04.2-44/78 "Об утверждении Правил аккредитации в качестве участника регионального финансового центра города Алматы"
    kaz: '"Алматы қаласының өңiрлiк қаржы орталығының қатысушысы ретiнде аккредиттеу туралы ережесiн бекiту туралы" Қазақстан Республикасы Алматы қаласының өңірлік қаржы орталығының қызметін реттеу Агенттігі Төрағасының 2009 жылғы 20 наурыздағы № 04.2-44/78 бұйрығына өзгерістер енгізу туралы'
