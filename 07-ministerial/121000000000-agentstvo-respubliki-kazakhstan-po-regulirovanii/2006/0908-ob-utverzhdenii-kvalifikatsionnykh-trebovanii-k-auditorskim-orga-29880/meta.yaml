act_code: '29880'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 8 сентября 2006 года № 9. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 октября 2006 года № 4413. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию финансового центра города Алматы от 3 апреля 2008 года № 04.2-09/78
title:
  rus: Об утверждении квалификационных требований к аудиторским организациям для допуска финансовых инструментов на специальную торговую площадку регионального финансового центра города Алматы
  kaz: Қаржы құралдарының Алматы қаласының өңірлік қаржы орталығының арнайы сауда алаңына ену үшін аудиторлық ұйымдарға біліктілік талаптарын бекіту туралы
