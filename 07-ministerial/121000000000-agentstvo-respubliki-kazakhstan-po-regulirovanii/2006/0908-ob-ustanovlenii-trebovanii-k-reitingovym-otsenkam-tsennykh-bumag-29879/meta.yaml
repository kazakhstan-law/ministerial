  title:
    rus: О внесении изменений и дополнения в приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 8 сентября 2006 года № 6 "Об установлении требований к рейтинговым оценкам ценных бумаг и их эмитентам для допуска на специальную торговую площадку регионального финансового центра города Алматы"
    kaz: Қазақстан Республикасы Алматы қаласының өңірлік қаржы орталығының қызметін реттеу агенттігі Төрағасының 2006 жылғы 8 қыркүйектегі № 6 "Алматы қаласының өңірлік қаржы орталығының арнайы сауда алаңына кіруі үшін бағалы қағаздар мен олардың эмитенттерінің рейтингтік бағаларына талаптар бекіту туралы" бұйрығына өзгерістер мен толықтыру енгізу туралы
