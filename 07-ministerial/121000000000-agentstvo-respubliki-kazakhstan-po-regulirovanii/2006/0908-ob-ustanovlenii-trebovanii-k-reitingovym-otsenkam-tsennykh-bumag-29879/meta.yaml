requisite: Приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 8 сентября 2006 года № 6. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 октября 2006 года № 4412. Утратил силу постановлением Правления Национального Банка Республики Казахстан от 8 августа 2016 года № 183
title:
  rus: Об установлении требований к рейтинговым оценкам ценных бумаг и их эмитентов для допуска на специальную торговую площадку регионального финансового центра города Алматы
  kaz: Алматы қаласының өңірлік қаржы орталығының арнайы сауда алаңына жіберу үшін бағалы қағаздар мен олардың эмитенттерінің рейтингтік бағаларына қойылатын талаптарды белгілеу туралы
