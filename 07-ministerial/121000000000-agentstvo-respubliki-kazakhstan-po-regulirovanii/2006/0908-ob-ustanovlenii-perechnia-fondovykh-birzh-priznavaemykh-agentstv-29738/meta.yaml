  title:
    rus: О внесении изменения и дополнения в Приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 8 сентября 2006 года № 8 "Об установлении перечня фондовых бирж, признаваемых Агентством Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы"
    kaz: '"Қазақстан Республикасы Алматы қаласының өңірлік қаржы орталығының қызметін реттеу Агенттігімен танылатын қор биржаларының тізбесін бекіту туралы" Қазақстан Республикасының Алматы қаласының өңірлік қаржы орталығының қызметін реттеу агенттігі төрағасының 2006 жылғы 8 қыркүйектегі № 8 Бұйрығына өзгеріс және толықтыру енгізу туралы'
