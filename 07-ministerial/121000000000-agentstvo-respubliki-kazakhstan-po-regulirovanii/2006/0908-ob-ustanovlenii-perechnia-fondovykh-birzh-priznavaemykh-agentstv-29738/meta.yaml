act_code: '29738'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 8 сентября 2006 года № 8. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 сентября 2006 года № 4402. Утратил силу постановлением Правления Национального Банка Республики Казахстан от 8 августа 2016 года № 183
title:
  rus: Об установлении перечня фондовых бирж, признаваемых Агентством Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы
  kaz: Қазақстан Республикасы Алматы қаласының өңірлік қаржы орталығының қызметін реттеу Агенттігімен танылатын қор биржаларының тiзбесiн бекiту туралы
