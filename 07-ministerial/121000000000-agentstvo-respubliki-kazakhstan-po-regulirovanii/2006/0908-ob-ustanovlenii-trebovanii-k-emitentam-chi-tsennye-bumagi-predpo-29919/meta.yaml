  title:
    rus: О внесении изменений в некоторые приказы председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы
    kaz: Қазақстан Республикасы Алматы қаласының өңірлік қаржы орталығының қызметін реттеу агенттігі төрағасының кейбір бұйрықтарына өзгерістер енгізу туралы
