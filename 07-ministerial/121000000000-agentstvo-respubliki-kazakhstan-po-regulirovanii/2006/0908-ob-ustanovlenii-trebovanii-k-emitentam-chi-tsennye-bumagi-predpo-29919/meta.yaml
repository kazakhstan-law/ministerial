act_code: '29919'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 8 сентября 2006 года № 5. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 октября 2006 года № 4408. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 8 мая 2008 года № 04.2-09/119.
title:
  rus: Об установлении требований к эмитентам, чьи ценные бумаги предполагаются к включению или включены в список специальной торговой площадки регионального финансового центра города Алматы, а также к таким ценным бумагам
  kaz: '"Бағалы қағаздары Алматы қаласының өңiрлiк қаржы орталығының арнайы сауда алаңының тiзiмiне енгiзу болжамдалған немесе енгiзiлген эмитенттерге, сонымен қатар осындай бағалы қағаздарға қойылатын талаптар туралы"'
