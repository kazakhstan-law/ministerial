title:
  rus: Об утверждении перечня рейтинговых агентств, рейтинговые оценки которых признаются уполномоченным органом по регулированию деятельности регионального финансового центра города Алматы
  kaz: Рейтингтік бағалары Алматы қаласының өңірлік қаржы орталығының қызметін реттеу жөніндегі уәкілетті органдарымен танылатын, рейтингтік агенттіктердің тізбесін бекіту туралы
