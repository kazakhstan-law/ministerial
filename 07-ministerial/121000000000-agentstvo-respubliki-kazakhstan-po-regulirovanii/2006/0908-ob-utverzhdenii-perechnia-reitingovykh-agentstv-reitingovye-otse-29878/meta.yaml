  title:
    rus: О внесении изменения и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 8 сентября 2006 года № 7 "Об утверждении перечня рейтинговых агентств, рейтинговые оценки которых признаются уполномоченным органом по регулированию деятельности регионального финансового центра города Алматы"
    kaz: Қазақстан Республикасы Алматы қаласының өңірлік қаржы орталығының қызметін реттеу Агенттігі Төрағасының 2006 жылғы 8 қыркүйектегі N 7 "Рейтингтік бағалары Алматы қаласының өңірлік қаржы орталығының қызметін реттеу жөніндегі уәкілетті органдарымен танылатын, рейтингтік агенттіктердің тізбесін бекіту туралы" бұйрығына өзгеріс пен толықтырулар енгізу туралы
