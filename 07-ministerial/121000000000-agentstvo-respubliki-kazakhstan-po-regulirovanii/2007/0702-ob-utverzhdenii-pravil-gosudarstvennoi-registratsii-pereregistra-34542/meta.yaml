  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 23 февраля 2010 года № 04.2-40/44. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 апреля 2010 года № 6202. Утратил силу постановлением Правления Национального Банка Республики Казахстан от 25 февраля 2013 года № 62
  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 2 июля 2007 года № 02-02/158а "Об утверждении Правил государственной регистрации (перерегистрации) юридических лиц - участников регионального финансового центра города Алматы" и признании утратившими силу некоторых приказов Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы
    kaz: Заңды тұлғаларды - Алматы қаласының өңірлік қаржы орталығының қатысушыларын мемлекеттік тіркеу (қайта тіркеу) Ережесін бекіту туралы» Қазақстан Республикасы Алматы қаласының өңірлік қаржы орталығының қызметін реттеу Агенттігі Төрағасының 2007 жылғы 2 шілдедегі № 02-02/158а бұйрығына өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Алматы қаласының өңірлік қаржы орталығының қызметін реттеу Агенттігі Төрағасының кейбір бұйрықтарының күшін жою туралы
  link: https://zan.gov.kz/client/#!/doc/52625/rus
