  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 2 июля 2007 года N 02-02/158а "Об утверждении Правил государственной регистрации (перерегистрации) юридических лиц-участников регионального финансового центра города Алматы"
    kaz: '"Заңды тұлғаларды - Алматы қаласының өңірлік қаржы орталығының қатысушыларын мемлекеттік тіркеу (қайта тіркеу) Ережесін бекіту туралы" Қазақстан Республикасы Алматы қаласының өңірлік қаржы орталығының қызметін реттеу Агенттігі Төрағасының 2007 жылғы 2 шілдедегі N 02-02/158а бұйрығына өзгерістер мен толықтырулар енгізу туралы'
