  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 26 ноября 2007 года N 02-02/290 "Об утверждении некоторых стандартов оказания государственных услуг, предоставляемых Агентством Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы"
