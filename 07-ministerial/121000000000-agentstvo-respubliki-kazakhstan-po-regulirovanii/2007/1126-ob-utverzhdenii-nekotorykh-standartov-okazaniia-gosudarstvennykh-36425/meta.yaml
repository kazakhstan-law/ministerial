act_code: '36425'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 26 ноября 2007 года N 02-02/290. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 декабря 2007 года N 5060. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 23 февраля 2010 года N 04.2-40/44
title:
  rus: Об утверждении некоторых стандартов оказания государственных услуг, предоставляемых Агентством Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы
  kaz: Қазақстан Республикасы Алматы қаласының өңірлік қаржы орталығының қызметін реттеу Агенттігімен ұсынылатын мемлекеттік қызмет көрсетудің кейбір стандарттарын бекіту туралы
