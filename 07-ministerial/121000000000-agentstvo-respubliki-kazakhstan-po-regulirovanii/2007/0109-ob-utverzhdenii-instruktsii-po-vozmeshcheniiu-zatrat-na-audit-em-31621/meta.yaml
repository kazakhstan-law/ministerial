requisite: Приказ и.о Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 9 января 2007 года N 9. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 января 2007 года N 4514. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 8 мая 2008 года N 04.2-09/116.
