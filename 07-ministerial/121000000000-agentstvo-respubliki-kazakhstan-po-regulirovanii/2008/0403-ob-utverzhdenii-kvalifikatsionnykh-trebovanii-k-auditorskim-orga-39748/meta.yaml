act_code: '39748'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 3 апреля 2008 года N 04.2-09/78. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 мая 2008 года N 5217. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 20 октября 2009 года № 04.2-44/172.
title:
  rus: Об утверждении квалификационных требований к аудиторским организациям для допуска финансовых инструментов на специальную торговую площадку регионального финансового центра города Алматы
  kaz: Қаржы құралдарының Алматы қаласының өңірлік қаржы орталығының арнайы сауда алаңына ену үшін аудиторлық ұйымдарға біліктілік талаптарын бекіту туралы
