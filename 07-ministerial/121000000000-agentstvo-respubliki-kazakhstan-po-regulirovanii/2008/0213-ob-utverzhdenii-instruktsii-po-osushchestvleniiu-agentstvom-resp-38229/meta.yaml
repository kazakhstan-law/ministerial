act_code: '38229'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 13 февраля 2008 года N 02-02/27. Зарегистрирован в Министерстве юстиции Республики Казахстан 05 марта 2008 года N 5160. Утратил силу постановлением Правления Национального Банка Республики Казахстан от 11 декабря 2013 года № 274
title:
  rus: Об утверждении Инструкции по осуществлению Агентством Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы государственного контроля за соблюдением участниками регионального финансового центра города Алматы трудового законодательства Республики Казахстан
  kaz: Алматы қаласының өңірлік қаржы орталығының қатысушыларының Қазақстан Республикасы еңбек заңнамасының сақталуын мемлекеттік бақылауды Қазақстан Республикасы Алматы қаласының өңірлік қаржы орталығын реттеу Агенттігінің жүзеге асыруын бекіту туралы Нұсқаулық
