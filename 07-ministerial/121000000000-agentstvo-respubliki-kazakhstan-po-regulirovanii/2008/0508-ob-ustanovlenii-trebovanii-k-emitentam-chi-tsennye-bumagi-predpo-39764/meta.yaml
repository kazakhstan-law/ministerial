  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 28 августа 2008 года N 04.2-09/207. Зарегистрирован в Министерстве юстиции Республики Казахстан от 4 сентября 2008 года № 5300. Утратил силу постановлением Правления Национального Банка Республики Казахстан от 22 октября 2014 года № 189
  title:
    rus: О внесении дополнений и изменений в приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 8 мая 2008 года № 04.2-09/119 "Об установлении требований к эмитентам, чьи ценные бумаги предполагаются к включению или включены в список специальной торговой площадки регионального финансового центра города Алматы, а также к таким ценным бумагам"
    kaz: '"Бағалы қағаздары Алматы қаласының өңірлік қаржы орталығының арнайы сауда алаңының тізіміне енгізіледі деп көзделген немесе енгізілген эмитенттерге, сондай-ақ осындай бағалы қағаздарға қойылатын талаптарды белгілеу туралы" Қазақстан Республикасы Алматы қаласының өңірлік қаржы орталығының қызметін реттеу Агенттігі Төрағасының 2008 жылғы 8 мамырдағы № 04.2-09/119 бұйрығына толықтырулар мен өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/41452/rus
