  title:
    rus: О внесении изменений и дополнения в некоторые приказы Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы
    kaz: Қазақстан Республикасы Алматы қаласының өңірлік қаржы орталығының қызметін реттеу Агенттігі Төрағасының кейбір бұйрықтарына өзгерістер мен толықтыру енгізу туралы
