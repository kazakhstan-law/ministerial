  title:
    rus: О внесении изменений в некоторые нормативные правовые акты Республики Казахстан по вопросам допуска эмитентов и их ценных бумаг к обращению на фондовой бирже
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне эмитенттерді және олардың бағалы қағаздарын қор биржасында айналысқа жіберу мәселелері бойынша өзгерістер енгізу туралы
