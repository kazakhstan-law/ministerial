act_code: '39764'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 8 мая 2008 года № 04.2-09/119. Зарегистрирован в Министерстве юстиции Республики Казахстан от 22 мая 2008 года № 5223. Утратил силу постановлением Правления Национального Банка Республики Казахстан от 22 октября 2014 года № 189
title:
  rus: Об установлении требований к эмитентам, чьи ценные бумаги предполагаются к включению или включены в список специальной торговой площадки регионального финансового центра города Алматы, а также к таким ценным бумагам
  kaz: Бағалы қағаздары Алматы қаласының өңірлік қаржы орталығының арнайы сауда алаңының тізіміне енгізіледі деп көзделген немесе енгізілген эмитенттерге, сондай-ақ осындай бағалы қағаздарға қойылатын талаптарды белгілеу туралы
