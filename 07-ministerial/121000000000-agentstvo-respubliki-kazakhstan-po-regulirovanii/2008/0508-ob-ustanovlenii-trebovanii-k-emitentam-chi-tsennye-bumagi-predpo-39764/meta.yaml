  code: '68266'
  requisite: Постановление Правления Национального Банка Республики Казахстан от 24 августа 2012 года № 233. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 октября 2012 года № 8008. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 22 октября 2014 года № 189
  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию деятельности регионального финансового центра города Алматы от 8 мая 2008 года № 04.2-09/119 "Об установлении требований к эмитентам, чьи ценные бумаги предполагаются к включению или включены в список специальной торговой площадки регионального финансового центра города Алматы, а также к таким ценным бумагам"
    kaz: Қазақстан Республикасы Алматы қаласының өңірлік қаржы орталығының қызметін реттеу агенттігі Төрағасының "Бағалы қағаздары Алматы қаласының өңірлік қаржы орталығының арнайы сауда алаңының тізіміне енгізіледі деп көзделген немесе енгізілген эмитенттерге, сондай-ақ осындай бағалы қағаздарға қойылатын талаптарды белгілеу туралы" 2008 жылғы 8 мамырдағы № 04.2-09/119 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/68266/rus
