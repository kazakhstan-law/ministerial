  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 29 августа 2017 года № 172 «Об утверждении регламентов государственных услуг по вопросам государственной службы»
    kaz: «Мемлекеттік қызмет мәселелері бойынша мемлекеттік көрсетілетін қызметтердің регламенттерін бекіту туралы» Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі Төрағасының 2017 жылғы 29 тамыздағы № 172 бұйрығына өзгерістер енгізу туралы
