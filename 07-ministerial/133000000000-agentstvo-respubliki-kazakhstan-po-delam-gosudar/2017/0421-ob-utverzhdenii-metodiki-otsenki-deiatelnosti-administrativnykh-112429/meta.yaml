act_code: '112429'
requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 21 апреля 2017 года № 82. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 мая 2017 года № 15177. Утратил силу приказом Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 5 апреля 2018 года № 93 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Агентства Республики Казахстан по делам государственной службы и противодействию коррупции
  kaz: Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы
