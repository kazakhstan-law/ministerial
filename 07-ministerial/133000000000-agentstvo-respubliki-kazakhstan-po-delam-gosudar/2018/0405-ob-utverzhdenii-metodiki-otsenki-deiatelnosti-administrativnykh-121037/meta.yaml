  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 5 апреля 2018 года № 93 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Агентства Республики Казахстан по делам государственной службы»
    kaz: «Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі Төрағасының 2018 жылғы 5 сәуірдегі № 93 бұйрығына өзгерістер енгізу туралы
