act_code: '123111'
requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 13 июня 2018 года № 149. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 июня 2018 года № 17137. Утратил силу приказом Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 17 ноября 2022 года № 409 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил размещения в ведомственной информационно-справочной системе сведений о вакантных руководящих должностях антикоррупционной службы и требований, предъявляемых к кандидатам на их замещение
  kaz: Сыбайлас жемқорлыққа қарсы қызметтің бос басшылық лауазымдары туралы мәліметтерді және оларға орналасуға кандидаттарға қойылатын талаптарды ведомстволық ақпараттық-анықтамалық жүйеде орналастыру қағидаларын бекіту туралы
