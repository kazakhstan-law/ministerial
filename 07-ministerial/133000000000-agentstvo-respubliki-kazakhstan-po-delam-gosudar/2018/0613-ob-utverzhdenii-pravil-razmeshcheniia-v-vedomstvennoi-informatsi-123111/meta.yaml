    kaz: Қазақстан Республикасы Мемлекеттік қызмет істері министрінің және Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі төрағасының кейбір бұйрықтарына өзгерістер енгізу туралы
