requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 12 декабря 2018 года № 276. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 декабря 2018 года № 17987. Утратил силу приказом Председателя Агентства Республики Казахстан по делам государственной службы от 4 декабря 2019 года № 205 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении форм, предназначенных для свода административных данных по мониторингу состояния кадров государственной службы в Республике Казахстан
