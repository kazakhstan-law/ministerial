  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 13 марта 2018 года № 60 «Об утверждении Правил применения поощрений государственных служащих Агентства Республики Казахстан по делам государственной службы и противодействию коррупции»
    kaz: «Қазақстан Республикасының Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінің мемлекеттік қызметшілеріне көтермелеулерді қолдану қағидаларын бекіту туралы» Қазақстан Республикасының Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі төрағасының 2018 жылғы 13 наурыздағы № 60 бұйрығына өзгерістер енгізу туралы
