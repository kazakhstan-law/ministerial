  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 13 декабря 2016 года № 85 «Об утверждении Типовых квалификационных требований к административным государственным должностям корпуса «Б» и в приказ Председателя Агентства Республики Казахстан по делам государственной службы от 21 апреля 2020 года № 69 «Об утверждении Описания идентификационных карт, правил их выдачи и использования»
    kaz: «Б» корпусының мемлекеттік әкімшілік лауазымдарына үлгілік біліктілік талаптарын бекіту туралы» Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі төрағасының 2016 жылғы 13 желтоқсандағы № 85 бұйрығына және «Сәйкестендіру карталарының сипаттамасын, оларды беру мен пайдалану қағидаларын бекіту туралы» Қазақстан Республикасының Мемлекеттік қызмет істері агенттігі төрағасының 2020 жылғы 21 сәуірдегі № 69 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/143820/rus
