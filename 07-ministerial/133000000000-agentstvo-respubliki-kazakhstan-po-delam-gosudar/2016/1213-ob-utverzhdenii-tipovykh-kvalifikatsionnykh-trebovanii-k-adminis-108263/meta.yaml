  title:
    rus: О внесении изменений в приказы Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 13 декабря 2016 года № 85 «Об утверждении Типовых квалификационных требований к административным государственным должностям корпуса «Б» и от 21 февраля 2017 года № 40 «О некоторых вопросах занятия административной государственной должности»
    kaz: «Б» корпусының мемлекеттік әкімшілік лауазымдарына үлгілік біліктілік талаптарын бекіту туралы» Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі Төрағасының 2016 жылғы 13 желтоқсандағы № 85 және «Мемлекеттік әкімшілік лауазымға орналасудың кейбір мәселелері туралы» 2017 жылғы 21 ақпандағы № 40 бұйрықтарына өзгерістер енгізу туралы
