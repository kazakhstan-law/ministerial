  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 11 ноября 2016 года № 53 «Об утверждении натуральных норм обеспечения форменной одеждой (без погон) сотрудников Национального бюро по противодействию коррупции (Антикоррупционной службы) Агентства Республики Казахстан по делам государственной службы и противодействию коррупции»
    kaz: «Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінің Сыбайлас жемқорлыққа қарсы іс-қимыл Ұлттық бюросы (Сыбайлас жемқорлыққа қарсы қызмет) қызметкерлерін нысанды киіммен (погонсыз) қамтамасыз етудің заттай нормаларын бекіту туралы» Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі төрағасының 2016 жылғы 11 қарашадағы № 53 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/112927/rus
