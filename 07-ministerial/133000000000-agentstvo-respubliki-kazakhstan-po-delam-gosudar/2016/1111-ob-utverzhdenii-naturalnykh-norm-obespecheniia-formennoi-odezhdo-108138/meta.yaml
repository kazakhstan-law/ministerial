act_code: '108138'
requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 11 ноября 2016 года № 53. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 декабря 2016 года № 14505. Утратил силу приказом Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 4 июля 2022 года № 253 (вводится в действие со дня его первого официального опубликования)
title:
