  requisite: Приказ Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 26 января 2023 года № 42. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 января 2023 года № 31787
  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 21 октября 2016 года № 18 «О некоторых вопросах реализации кадровой политики в Национальном бюро по противодействию коррупции (Антикоррупционной службе) Агентства Республики Казахстан по делам государственной службы и противодействию коррупции» и признании утратившими силу его структурных элементов
    kaz: «Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінің Сыбайлас жемқорлыққа қарсы іс-қимыл ұлттық бюросында (Сыбайлас жемқорлыққа қарсы қызмет) кадр саясатын іске асырудың кейбір мәселелері туралы» Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі Төрағасының 2016 жылғы 21 қазандағы № 18 бұйрығына өзгерістер енгізу және оның құрылымдық элементтерінің күші жойылды деп тану туралы
