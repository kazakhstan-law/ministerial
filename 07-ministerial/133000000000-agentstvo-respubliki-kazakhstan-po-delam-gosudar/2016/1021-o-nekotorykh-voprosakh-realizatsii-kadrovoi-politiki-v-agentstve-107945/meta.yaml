title:
  rus: О некоторых вопросах реализации кадровой политики в Агентстве Республики Казахстан по противодействию коррупции (Антикоррупционной службе)
  kaz: Қазақстан Республикасы Сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінде (Сыбайлас жемқорлыққа қарсы қызмет) кадр саясатын іске асырудың кейбір мәселелері туралы
