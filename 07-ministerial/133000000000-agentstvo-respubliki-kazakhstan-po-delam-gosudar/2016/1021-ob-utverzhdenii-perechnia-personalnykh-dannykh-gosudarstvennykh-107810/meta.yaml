requisite: Приказ Председателя Агенства Республики Казахстан по делам государственной службы и противодействию коррупции от 21 октября 2016 года № 16. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 ноября 2016 года № 14455
title:
  rus: Об утверждении перечня персональных данных государственных служащих, необходимого и достаточного для выполнения осуществляемых Агентством Республики Казахстан по делам государственной службы и противодействию коррупции и его территориальными органами задач
  kaz: Қазақстан Республикасының Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі мен оның аумақтық органдары жүзеге асыратын міндеттерді орындау үшін қажетті және жеткілікті мемлекеттік қызметшілердің дербес деректерінің тізбесін бекіту туралы
