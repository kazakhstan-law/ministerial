  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 25 октября 2016 года № 24 «Об утверждении Реестра должностей гражданских служащих Агентства Республики Казахстан по делам государственной службы и противодействию коррупции»
    kaz: «Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінің азаматтық қызметшілер лауазымдарының тізілімін бекіту туралы» Қазақстан Республикасының Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі Төрағасының 2016 жылғы 25 қазандағы № 24 бұйрығына өзгерістер енгізу туралы
