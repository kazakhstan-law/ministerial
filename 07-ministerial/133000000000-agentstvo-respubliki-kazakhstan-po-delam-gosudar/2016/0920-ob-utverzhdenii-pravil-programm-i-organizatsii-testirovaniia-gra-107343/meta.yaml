  title:
    rus: О внесении изменений и дополнений в приказы председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 20 сентября 2016 года № 1 «Об утверждении Правил, программ и организации тестирования граждан, поступающих на правоохранительную службу» и от 21 февраля 2017 года № 40 «О некоторых вопросах занятия административной государственной должности»
    kaz: Қазақстан Республикасының Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі төрағасының «Құқық қорғау қызметіне кіретін азаматтарды тесттен өткізуді ұйымдастыру, бағдарламалары және қағидаларын бекіту туралы» 2016 жылғы 20 қыркүйектегі № 1 және «Мемлекеттік әкімшілік лауазымға орналасудың кейбір мәселелері туралы» 2017 жылғы 21 ақпандағы № 40 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
