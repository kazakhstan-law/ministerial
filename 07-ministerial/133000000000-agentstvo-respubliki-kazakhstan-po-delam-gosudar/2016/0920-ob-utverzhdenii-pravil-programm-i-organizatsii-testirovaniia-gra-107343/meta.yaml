    kaz: «Құқық қорғау қызметіне алғаш рет кіретін азаматтарды тесттен өткізу қағидаларын, бағдарламаларын және оны ұйымдастыруды бекіту туралы» Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі Төрағасының 2016 жылғы 20 қыркүйектегі № 1 бұйрығына өзгерістер енгізу туралы
