  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 21 декабря 2016 года № 96 «Об утверждении стандартов государственных услуг по вопросам государственной службы»
    kaz: «Мемлекеттік қызмет мәселелері бойынша мемлекеттік көрсетілетін қызмет стандарттарын бекіту туралы» Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі Төрағасының 2016 жылғы 21 желтоқсандағы № 96 бұйрығына өзгерістер мен толықтырулар енгізу туралы
