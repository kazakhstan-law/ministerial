  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 20 сентября 2016 года № 1 «Об утверждении Правил, программ и организации тестирования граждан, впервые поступающих на правоохранительную службу» и признании утратившими силу структурных элементов некоторых приказов Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции
    kaz: «Құқық қорғау қызметіне алғаш рет кіретін азаматтарды тесттен өткізу қағидаларын, бағдарламаларын және оны ұйымдастыруды бекіту туралы» Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі Төрағасының 2016 жылғы 20 қыркүйектегі № 1 бұйрығына өзгерістер мен толықтырулар енгізу туралы және Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі Төрағасының кейбір бұйрықтарының құрылымдық элементтерінің күші жойылды деп тану туралы
