act_code: '106781'
requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 6 октября 2016 года № 3. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 октября 2016 года № 14316. Утратил силу приказом Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 7 февраля 2025 года № 26 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
