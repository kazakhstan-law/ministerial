act_code: '83971'
requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 14 октября 2014 года № 12. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 октября 2014 года № 9797. Утратил силу приказом Министра по делам государственной службы Республики Казахстан от 27 января 2016 года № 17
title:
  rus: Об утверждении квалификационных требований к должностям государственных служащих Агентства Республики Казахстан по делам государственной службы и противодействию коррупции и его территориальных подразделений, осуществляющих правоохранительную деятельность
  kaz: Қазақстан Республикасының Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінің және оның аумақтық бөлімшелерінің құқық қорғау қызметін жүзеге асыратын мемлекеттік қызметшілердің лауазымдарына қойылатын бiлiктiлiк талаптарын бекіту туралы
