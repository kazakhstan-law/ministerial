  title:
    rus: О внесении изменений в приказ Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 14 октября 2014 года № 12 «Об утверждении квалификационных требований к должностям государственных служащих Агентства Республики Казахстан по делам государственной службы и противодействию коррупции и его территориальных подразделений, осуществляющих правоохранительную деятельность»
    kaz: «Қазақстан Республикасының Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінің және оның аумақтық бөлімшелерінің құқық қорғау қызметін жүзеге асыратын мемлекеттік қызметшілердің лауазымдарына қойылатын бiлiктiлiк талаптарын бекіту туралы» Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінің 2014 жылғы 14 қазандағы № 12 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/86467/rus
