act_code: '87742'
requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 31 декабря 2014 года № 88. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 февраля 2015 года № 10206. Утратил силу приказом Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 1 июля 2015 года № 207
title:
  rus: Об утверждении формы проверочного листа и критериев оценки степени рисков деятельности государственных органов по соблюдению законодательства в сфере оказания государственных услуг, государственной службы, служебной этики и противодействия коррупции
  kaz: Мемлекеттік қызметтер көрсету, мемлекеттік қызмет, қызмет этикасы және сыбайлас жемқорлыққа қарсы іс-қимыл саласындағы заңнамасының сақталуы бойынша тексеру парағының нысанын және мемлекеттік органдар қызметінің тәуекел дәрежесін бағалау критерийлерін бекіту туралы
