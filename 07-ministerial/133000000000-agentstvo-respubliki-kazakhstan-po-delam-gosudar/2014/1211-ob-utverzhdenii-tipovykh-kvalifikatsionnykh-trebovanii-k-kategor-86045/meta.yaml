  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 11 декабря 2014 года № 58 "Об утверждении Типовых квалификационных требований к категориям административных государственных должностей корпуса "Б"
    kaz: Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі Төрағасының "Б" корпусы мемлекеттік әкімшілік лауазымдарының санаттарына үлгілік біліктілік талаптарын бекіту туралы" 2014 жылғы 11 желтоқсандағы № 58 бұйрығына өзгерістер енгізу туралы
