requisite: Приказ Председателя Агентства Республики Казахстан по информатизации и связи от 18 января 2010 года № 6. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 февраля 2010 года № 6038. Утратил силу приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 26 ноября 2015 года № 1113
title:
  rus: Об утверждении Правил предоставления равных условий доступа к регулируемым услугам (товарам, работам) в сферах телекоммуникаций при условии отсутствия конкурентного оператора связи по причине технологической невозможности либо экономической нецелесообразности предоставления данных видов услуг, за исключением универсальных услуг телекоммуникаций, и предоставления в имущественный найм (аренду) или пользование кабельной канализации и иных основных средств, технологически связанных с присоединением сетей телекоммуникаций к сети телекоммуникаций общего пользования
  kaz: Телекоммуникациялардың әмбебап қызметтерін қоспағанда, қызметтердің берілген түрлерін ұсынудың технологиялық мүмкін болмауы не экономикалық тиімсіздігі себебінен бәсекелес байланыс операторы болмаған кезде телекоммуникациялар және телекоммуникациялар желілерін ортақ пайдаланудағы телекоммуникациялар желісіне қосуға технологиялық жағынан байланысты кәбілдік кәріздер мен өзге де негізгі құралдарды мүліктік жалдауға (жалға) немесе пайдалануға ұсыну салаларындағы реттелетін қызметтерге (тауарларға, жұмыстарға) қол жеткізудің тең жағдайларын ұсыну ережесін бекіту туралы
