  kaz: Компьютер жүйелерін Қазақстан Республикасының аумағында пайдалануға рұқсат етілген қазыналық жады бар бақылау-кассалық машиналардың мемлекеттік тізіліміне(нен) енгізуге (шығаруға) қорытынды беру ережесін бекіту туралы
