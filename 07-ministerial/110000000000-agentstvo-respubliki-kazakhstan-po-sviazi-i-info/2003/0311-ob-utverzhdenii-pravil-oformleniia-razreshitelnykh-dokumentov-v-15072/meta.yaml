    kaz: '"Байланыс саласындағы рұқсат құжаттарын ресімдеу және радиоэлектронды құралдар мен жоғары жиілікті құрылғыларды тіркеу Ережесін бекіту туралы" Қазақстан Республикасының Көлік және коммуникациялар министрлігінің Байланыс және ақпараттандыру жөніндегі комитеті Төрағасының 2003 жылғы 11 наурыздағы N 13-п (N 2234 тіркелген) бұйрығына өзгертулер енгізу туралы'
