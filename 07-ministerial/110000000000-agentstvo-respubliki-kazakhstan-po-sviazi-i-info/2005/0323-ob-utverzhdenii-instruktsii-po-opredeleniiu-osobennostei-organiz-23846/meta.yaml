requisite: Приказ Председателя Агентства Республики Казахстан по информатизации и связи от 23 марта 2005 года N 72-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 апреля 2005 года N 3605. Утратил силу приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 17 марта 2016 года № 275
title:
  rus: Об утверждении Инструкции по определению особенностей организации деятельности поставщиков информации, кредитных бюро и получателей кредитных отчетов (за исключением субъектов кредитных историй) на рынке информационных услуг
  kaz: Ақпараттық қызметтер көрсету рыногында ақпарат берушілердің, кредиттік бюролардың және кредиттік есептерді алушылардың (кредиттік тарих субъектілерін қоспағанда) қызметін ұйымдастырудың ерекшеліктерін айқындау жөніндегі Нұсқаулықты бекіту туралы
