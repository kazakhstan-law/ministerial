  title:
    rus: О внесении дополнений в приказ Председателя Агентства Республики Казахстан по информатизации и связи от 12 июля 2004 года № 145-п "Об утверждении Правил присоединения сетей телекоммуникаций к сети телекоммуникаций общего пользования и регулирования пропуска трафика по сети телекоммуникаций общего пользования Республики Казахстан"
    kaz: '"Телекоммуникация желiлерiн ортақ пайдаланымдағы телекоммуникация желiсiне қосу және Қазақстан Республикасының ортақ пайдаланымдағы телекоммуникация желiсi бойынша трафиктi өткiзудi реттеу ережелерiн бекiту туралы" Қазақстан Республикасы Ақпараттандыру және байланыс агенттігі төрағасының 2004 жылғы 12 шілдедегі № 145-ө бұйрығына толықтырулар енгізу туралы'
