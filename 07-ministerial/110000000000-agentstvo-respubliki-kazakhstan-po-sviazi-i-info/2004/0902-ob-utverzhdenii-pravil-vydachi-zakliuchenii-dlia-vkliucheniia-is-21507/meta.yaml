requisite: Приказ и.о. Председателя Агентства Республики Казахстан по информатизации и связи от 3 сентября 2004 года N 186-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 октября 2004 года N 3139. Утратил силу приказом Председателя Агентства Республики Казахстан по информатизации и связи от 27 июля 2009 года № 330
title:
  rus: Об утверждении Правил выдачи заключений для включения (исключения) компьютерных систем в (из) Государственный(-ого) реестр(а) контрольно-кассовых машин с фискальной памятью, разрешенных к использованию на территории Республики Казахстан
  kaz: Компьютер жүйелерін Қазақстан Республикасының аумағында пайдалануға рұқсат етілген фискалдық жады бар бақылау-кассалық машиналарының Мемлекеттік тізіліміне (нен) енгізуге (шығаруға) қорытынды беру ережесін бекіту туралы
