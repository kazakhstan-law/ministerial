requisite: Приказ Председателя Агентства Республики Казахстан по информатизации и связи от 1 декабря 2009 года № 480. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 января 2010 года № 5981. Утратил силу приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 26 января 2016 года № 63
title:
  rus: Об утверждении Правил испытаний, регистрации, передачи, хранения, обеспечения полноты депонирования и представления сведений о регистрации, передаче и хранении программных продуктов, программных кодов и нормативно-технической документации в депозитарий
  kaz: Бағдарламалық өнімдерді, бағдарламалық кодтарды сынақтан өткізу, оларды және нормативтік құжаттаманы тіркеу, беру, сақтау, депозитке берудің толықтығын қамтамасыз ету және оларды тіркеу, депозитарийге беру мен сақтау туралы мәліметтерді ұсыну ережесін бекіту туралы
