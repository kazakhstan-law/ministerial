requisite: Приказ Председателя Агентства Республики Казахстан по информатизации и связи от 13 июля 2009 года № 295. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 сентября 2009 года № 5792. Утратил силу приказом Министра транспорта и коммуникаций Республики Казахстан от 6 июня 2012 года № 313
title:
  rus: Об утверждении Правил присвоения полос частот, радиочастот (радиочастотных каналов), регистрации и эксплуатации радиоэлектронных средств, высокочастотных устройств, ввоза их из-за границы, проведения расчета электромагнитной совместимости радиоэлектронных средств и высокочастотных устройств
  kaz: Жиілік белдеулерін, радиожиіліктерді (радиожиілік арналарды) тағайындау, радиоэлектрондық құралдар, жоғары жиілікті құрылғыларды тіркеу және пайдалану, оларды шетелден әкелу, радиоэлектрондық құралдар мен жоғары жиілікті құрылғылардың электромагниттік үйлесімділігінің есебін жүргізу ережесін бекіту туралы
