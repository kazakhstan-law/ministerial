  title:
    rus: О внесении изменений в приказ Председателя Комитета по связи и информатизации Министерства транспорта и коммуникаций Республики Казахстан от 12 ноября 2002 года N 233-о "Об утверждении форм разрешений на использование радиочастотного спектра Республики Казахстан (зарегистрирован за N 2077)
    kaz: '"Қазақстан Республикасының радиожиілік спектрін пайдалануға рұқсаттардың нысанын бекіту туралы" Қазақстан Республикасы Көлік және коммуникациялар министрлігінің Байланыс және ақпараттандыру жөніндегі комитеті Төрағасының 2002 жылғы 12 қарашадағы N 233-о бұйрығына өзгертулер енгізу туралы (N 2077 тіркелген)'
