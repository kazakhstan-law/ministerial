act_code: '12606'
requisite: Приказ Председателя Комитета по стандартизации, метрологии и сертификации Министерства экономики и торговли Республики Казахстан от 17 мая 2002 года N 169. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 июня 2002 года N 1887. Утратил силу приказом и.о. Министра индустрии и торговли Республики Казахстан от 4 октября 2007 года N 292
title:
  rus: Об утверждении Правил проведения государственного надзора и контроля за соблюдением обязательных требований нормативных документов по стандартизации, сертификации и за сертифицированной продукцией (работами, услугами) в Республике Казахстан
  kaz: Қазақстан Республикасындағы Стандарттау, сертификаттау жөнiндегi нормативтiк құжаттардың мiндеттi талаптарының сақталуына және сертификатталған өнiмге (жұмыстарға, қызметтерге) мемлекеттік қадағалау мен бақылауды жүзеге асыру ережесiн бекiту туралы
