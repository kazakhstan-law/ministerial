act_code: '24286'
requisite: Приказ Председателя Комитета по техническому регулированию и метрологии Министерства индустрии и торговли Республики Казахстан от 13 мая 2005 года № 135. Зарегистрировано Министерством юстиции Республики Казахстан 31 мая 2005 года № 3658. Утратил силу приказом и.о. Министра индустрии и новых технологий Республики Казахстан от 23 апреля 2010 года № 39
title:
  rus: Об утверждении Правил учета и применения международных, региональных, национальных стандартов, классификаторов технико-экономической информации, правил и рекомендаций иностранных государств по стандартизации, подтверждению соответствия и аккредитации на территории Республики Казахстан
  kaz: Қазақстан Республикасы аумағында стандарттау, сәйкестікті растау және аккредиттеу жөніндегі халықаралық, өңірлік, ұлттық стандарттардың, техникалық-экономикалық ақпарат жіктеуіштерін, шет мемлекеттердің ережелері мен ұсыныстарын есепке алу және қолдану туралы Ережені бекіту туралы
