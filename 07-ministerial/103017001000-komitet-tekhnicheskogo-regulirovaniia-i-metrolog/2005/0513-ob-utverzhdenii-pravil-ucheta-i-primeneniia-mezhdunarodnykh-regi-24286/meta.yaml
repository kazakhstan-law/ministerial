  title:
    rus: О внесении дополнений и изменений в приказ Председателя Комитета по техническому регулированию и метрологии Министерства индустрии и торговли Республики Казахстан от 13 мая 2005 года № 135 "Об утверждении Правил учета и применения международных, региональных, национальных стандартов, классификаторов технико-экономической информации, правил и рекомендаций иностранных государств по стандартизации, подтверждению соответствия и аккредитации на территории Республики Казахстан"
    kaz: Қазақстан Республикасы аумағында стандарттау, сәйкестікті растау және аккредиттеу жөніндегі халықаралық, өңірлік, ұлттық стандарттардың, техникалық-экономикалық ақпарат жіктеуіштерін, шет мемлекеттердің ережелері мен ұсыныстарын есепке алу және қолдану туралы ережені бекіту туралы" Қазақстан Республикасы Индустрия және сауда министрлігі Техникалық реттеу және метрология комитеті Төрағасының 2005 жылғы 13 мамырдағы № 135 Бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/25707/rus
