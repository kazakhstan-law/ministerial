  code: '24869'
  requisite: Приказ и.о. Председателя Комитета по техническому регулированию и метрологии Министерства индустрии и торговли Республики Казахстан от 23 июня 2005 года N 171. Зарегистрировано Министерством юстиции Республики Казахстан 27 июля 2005 года N 3754. Утратил силу приказом Заместителя Премьер-Министра - Министра индустрии и новых технологий Республики Казахстан от 14 декабря 2010 года № 432
  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета по техническому регулированию и метрологии Министерства индустрии и торговли Республики Казахстан от 4 апреля 2005 года N 98 "Об утверждении Правил разработки, согласования, учета, утверждения, экспертизы, изменения, отмены и введения в действие государственных стандартов и классификаторов технико-экономической информации"
    kaz: Мемлекеттік стандарттар мен техникалық-экономикалық ақпарат жіктеуіштерін әзірлеу, келісу, есепке алу, бекіту, сараптау, өзгерту, жою және қолданысқа енгізу ережесін бекіту туралы" Қазақстан Республикасы Индустрия және сауда министрлігінің Техникалық реттеу және метрология комитеті төрағасының 2005 жылғы 4 сәуірдегі N 98 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/24869/rus
