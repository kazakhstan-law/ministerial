act_code: '23802'
requisite: Приказ Председателя Комитета по техническому регулированию и метрологии Министерства индустрии и торговли Республики Казахстан от 4 апреля 2005 года № 98. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 апреля 2005 года № 3587. Утратило силу - приказом и.о. Председателя Комитета по техническому регулированию и метрологии Министерства индустрии и торговли Республики Казахстан от 29 марта 2007 года № 172
title:
  rus: Об утверждении Правил разработки, согласования, учета, утверждения, экспертизы, изменения, отмены и введения в действие государственных стандартов и классификаторов технико-экономической информации
  kaz: Мемлекеттік стандарттарды және техникалық-экономикалық ақпарат жіктеуіштерін әзірлеу, келісу, есепке алу, бекіту, сараптау, өзгерту, жою және қолданысқа енгізу ережесін бекіту туралы
