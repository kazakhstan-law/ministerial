requisite: Приказ Председателя Комитета по техническому регулированию и метрологии Министерства индустрии и торговли Республики Казахстан от 13 мая 2005 года № 136. Зарегистрировано Министерством юстиции Республики Казахстан 31 мая 2005 года № 3657. Утратило силу - приказом и.о. Председателя Комитета по техническому регулированию и метрологии Министерства индустрии и торговли Республики Казахстан от 29 марта 2007 года № 172
