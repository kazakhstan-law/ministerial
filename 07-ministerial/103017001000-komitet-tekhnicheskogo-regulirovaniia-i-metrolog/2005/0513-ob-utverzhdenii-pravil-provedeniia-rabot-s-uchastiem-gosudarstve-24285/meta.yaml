  title:
    rus: О внесении дополнений в приказ Председателя Комитета по техническому регулированию и метрологии Министерства индустрии и торговли Республики Казахстан от 13 мая 2005 года N 136 "Об утверждении Правил проведения работ с участием государственных органов, технических комитетов по стандартизации и органов по подтверждению соответствия в сфере подтверждения соответствия и аккредитации"
    kaz: '"Мемлекеттік органдардың, стандарттау жөнiндегi техникалық комитеттердiң және сәйкестiктi растау жөнiндегi органдардың қатысуымен сәйкестiктi растау және аккредиттеу саласында жұмыстар жүргiзу ережесiн бекiту туралы" Қазақстан Республикасы Индустрия және сауда министрлігі Техникалық реттеу және метрология комитет Төрағасының 2005 жылғы 13 мамырдағы N 136 бұйрығына толықтырулар енгізу туралы'
