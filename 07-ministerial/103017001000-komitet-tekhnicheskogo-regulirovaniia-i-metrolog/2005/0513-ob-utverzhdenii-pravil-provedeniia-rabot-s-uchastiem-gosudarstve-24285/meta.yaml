act_code: '24285'
requisite: Приказ Председателя Комитета по техническому регулированию и метрологии Министерства индустрии и торговли Республики Казахстан от 13 мая 2005 года № 136. Зарегистрировано Министерством юстиции Республики Казахстан 31 мая 2005 года № 3657. Утратило силу - приказом и.о. Председателя Комитета по техническому регулированию и метрологии Министерства индустрии и торговли Республики Казахстан от 29 марта 2007 года № 172
title:
  rus: Об утверждении Правил проведения работ с участием государственных органов, технических комитетов по стандартизации и органов по подтверждению соответствия в сфере подтверждения соответствия и аккредитации
  kaz: Мемлекеттiк органдардың, стандарттау жөнiндегi техникалық комитеттердiң және сәйкестiктi растау жөнiндегi органдардың қатысуымен сәйкестiктi растау және аккредиттеу саласында жұмыстар жүргiзу ережесiн бекiту туралы
