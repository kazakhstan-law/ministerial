  title:
    rus: О некоторых решениях Комитета по техническому регулированию и метрологии Министерства индустрии и торговли Республики Казахстан
    kaz: Қазақстан Республикасы Индустрия және сауда министрлігінің Техникалық реттеу және метрология комитетінің кейбір шешімдері туралы
