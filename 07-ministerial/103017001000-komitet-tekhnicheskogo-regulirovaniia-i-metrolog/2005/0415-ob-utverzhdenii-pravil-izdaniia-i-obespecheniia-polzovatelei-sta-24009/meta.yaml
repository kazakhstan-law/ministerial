act_code: '24009'
requisite: Приказ И.о. Председателя Комитета по техническому регулированию и метрологии Министерства индустрии и торговли Республики Казахстан от 15 апреля 2005 года № 107. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 апреля 2005 года № 3598. Утратил силу приказом Министра индустрии и новых технологий Республики Казахстан от 14 сентября 2012 года № 318
title:
  rus: Об утверждении правил издания и обеспечения пользователей стандартами и нормативными документами по стандартизации, метрологии, сертификации, аккредитации, каталогами и указателями стандартов и информацией о них
  kaz: Стандарттарды және стандарттау, метрология, сертификаттау, аккредиттеу жөніндегі нормативтік құжаттарды, стандарттар каталогтары мен сілтемелерін шығару және пайдаланушыларды олармен және олар туралы ақпаратпен қамтамасыз ету ережесін бекіту туралы
