title:
  rus: Об утверждении Инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении в Управлении делами Президента Республики Казахстан
  kaz: Қазақстан Республикасы Президентінің Іс басқармасында террористік тұрғыдан осал объектілердің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
