  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Управляющего Делами Президента Республики Казахстан от 30 ноября 2022 года № 05/326 «Об утверждении Инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении в Управлении Делами Президента Республики Казахстан»
    kaz: «Қазақстан Республикасы Президентінің Іс Басқармасында террористік тұрғыдан осал объектілердің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Президенті Іс басқарушысының міндетін атқарушының 2022 жылғы 30 қарашадағы № 05/326 бұйрығына өзгерістер мен толықтырулар енгізу туралы
