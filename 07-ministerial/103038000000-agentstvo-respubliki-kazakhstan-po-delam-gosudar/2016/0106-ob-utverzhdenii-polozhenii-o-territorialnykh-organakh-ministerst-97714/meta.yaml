  title:
    rus: О внесении изменений в приказ Министра по делам государственной службы Республики Казахстан от 6 января 2016 года № 2 «Об утверждении положений о территориальных органах Министерствапо делам государственной службы Республики Казахстан»
    kaz: «Қазақстан Республикасы Мемлекеттік қызмет істері министрлігінің аумақтық департаменттері туралы ережелерін бекіту туралы» Қазақстан Республикасы Мемлекеттік қызмет істері министрінің 2016 жылғы 6 қаңтардағы № 2 бұйрығына өзгерістер енгізу туралы
