requisite: Приказ Министра по делам государственной службы Республики Казахстан от 26 апреля 2016 года № 86. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 мая 2016 года № 13749. Утратил силу приказом Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 6 января 2017 года № 1
title:
