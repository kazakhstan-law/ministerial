act_code: '101571'
requisite: Приказ Министра по делам государственной службы Республики Казахстан от 18 марта 2016 года № 61. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 апреля 2016 года № 13621. Утратил силу приказом Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 7 октября 2016 года № 4
title:
  rus: О некоторых вопросах организации работы с кадрами в Национальном бюро по противодействию коррупции (Антикоррупционной службе) Министерства по делам государственной службы Республики Казахстан
  kaz: Қазақстан Республикасы Мемлекеттік қызмет істері министрлігінің Сыбайлас жемқорлыққа қарсы іс-қимыл ұлттық бюросындағы (Сыбайлас жемқорлыққа қарсы қызметіндегі) кадрлармен жұмысты ұйымдастырудың кейбір мәселелері туралы
