act_code: '98296'
requisite: Приказ Министра по делам государственной службы Республики Казахстан от 27 января 2016 года № 17. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 января 2016 года № 12951. Утратил силу приказом Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 7 октября 2016 года № 4
title:
  rus: О некоторых вопросах организации отбора кандидатов в Национальное бюро по противодействию коррупции (Антикоррупционную службу) Министерства по делам государственной службы Республики Казахстан и его территориальные органы
  kaz: Қазақстан Республикасы Мемлекеттік қызмет істері министрлігінің Сыбайлас жемқорлыққа қарсы іс-қимыл ұлттық бюросына (Сыбайлас жемқорлыққа қарсы қызметі) және оның аумақтық органдарына кандидаттарды іріктеуді ұйымдастырудың кейбір мәселелері туралы
