    kaz: '"Қазақстан Республикасы Мемлекеттік қызмет істері министрлігінің Сыбайлас жемқорлыққа қарсы іс-қимыл ұлттық бюросы туралы ережені бекіту туралы" Қазақстан Республикасы Мемлекеттік қызмет істері министрінің 2016 жылғы 5 қаңтардағы № 1 бұйрығына өзгеріс енгізу туралы'
