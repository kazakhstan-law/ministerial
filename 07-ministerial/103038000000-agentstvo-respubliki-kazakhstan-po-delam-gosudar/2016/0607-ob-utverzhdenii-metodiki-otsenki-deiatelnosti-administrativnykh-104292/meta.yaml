requisite: Приказ Министра по делам государственной службы Республики Казахстан от 7 июня 2016 года № 116. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июля 2016 года № 13885. Утратил силу приказом Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 21 апреля 2017 года № 82 (вводится в действие со дня его первого официального опубликования)
title:
