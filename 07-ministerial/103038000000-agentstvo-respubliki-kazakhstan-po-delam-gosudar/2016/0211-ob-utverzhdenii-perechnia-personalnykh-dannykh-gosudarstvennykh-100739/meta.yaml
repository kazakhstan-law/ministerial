act_code: '100739'
requisite: Приказ Министра по делам государственной службы Республики Казахстан от 11 февраля 2016 года № 30. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 марта 2016 года № 13442. Утратил силу - приказом Председателя Агенства Республики Казахстан по делам государственной службы и противодействию коррупции от 21 октября 2016 года № 16
title:
  rus: Об утверждении перечня персональных данных государственных служащих, необходимого и достаточного для выполнения осуществляемых Министерством по делам государственной службы Республики Казахстан и его территориальными органами задач
  kaz: Қазақстан Республикасының Мемлекеттік қызмет істері министрлігі мен оның аумақтық органдары жүзеге асыратын міндеттерді орындау үшін қажетті және жеткілікті мемлекеттік қызметшілердің дербес деректерінің тізбесін бекіту туралы
