    kaz: «Мемлекеттік қызмет істері жөніндегі уәкілетті органның Әдеп жөніндегі комиссиясы туралы ережені бекіту туралы» Қазақстан Республикасының Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі төрағасының 2016 жылғы 21 қазандағы № 19 бұйрығына өзгерістер енгізу туралы
