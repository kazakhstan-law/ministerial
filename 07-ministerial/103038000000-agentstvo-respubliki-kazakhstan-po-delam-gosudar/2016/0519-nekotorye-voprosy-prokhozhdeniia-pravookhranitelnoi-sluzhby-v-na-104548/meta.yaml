act_code: '104548'
requisite: Приказ Министра по делам государственной службы Республики Казахстан от 19 мая 2016 года № 103. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 июня 2016 года № 13807. Утратил силу приказом Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 21 октября 2016 года № 17.
title:
  rus: Некоторые вопросы прохождения правоохранительной службы в Национальном бюро по противодействию коррупции (Антикоррупционной службы) Министерства по делам государственной службы Республики Казахстан
  kaz: Қазақстан Республикасы Мемлекеттік қызмет істері министрлігінің Сыбайлас жемқорлыққа қарсы іс-қимыл ұлттық бюросында (Сыбайлас жемқорлыққа қарсы қызмет) құқық қорғау қызметін өткерудің кейбір мәселелері
