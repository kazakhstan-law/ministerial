  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 7 октября 2016 года № 4 «О некоторых вопросах организации отбора кандидатов в Национальное бюро по противодействию коррупции (Антикоррупционную службу) Агентства Республики Казахстан по делам государственной службы и противодействию коррупции и его территориальные органы»
    kaz: «Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінің Сыбайлас жемқорлыққа қарсы іс-қимыл ұлттық набросана (Сыбайлас жемқорлыққа қарсы қызмет) және оның аумақтық органдарына кандидаттарды іріктеуді ұйымдастырудың кейбір мәселелері туралы» Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі Төрағасының 2016 жылғы 7 қазандағы № 4 бұйрығына өзгерістер мен толықтырулар енгізу туралы
