  title:
    rus: О внесении изменения в приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 13 октября 2016 года № 10 «Об утверждении положений о территориальных органах Агентства Республики Казахстан по делам государственной службы и противодействию коррупции»
    kaz: «Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінің аумақтық департаменттері туралы ережелерін бекіту туралы» Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі төрағасының 2016 жылғы 13 қазандағы № 10 бұйрығына өзгеріс енгізу туралы
