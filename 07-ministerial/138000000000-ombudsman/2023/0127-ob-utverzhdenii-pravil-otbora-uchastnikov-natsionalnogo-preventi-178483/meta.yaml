  title:
    rus: О внесении изменений и дополнения в распоряжение Уполномоченного по правам человека от 26 сентября 2013 года № 22 «Об утверждении Правил подготовки ежегодного консолидированного доклада по итогам превентивных посещений» и приказ Уполномоченного по правам человека в Республике Казахстан от 27 января 2023 года № 4 «Об утверждении Правил отбора участников национального превентивного механизма»
    kaz: «Алдын ала болу қорытындылары бойынша жыл сайынғы жинақталған баяндаманы дайындау қағидаларын бекіту туралы» Адам құқықтары жөніндегі уәкілдің 2013 жылғы 26 қыркүйектегі № 22 өкіміне және «Ұлттық превентивтік тетікке қатысушыларды іріктеу қағидаларын бекіту туралы» Қазақстан Республикасындағы Адам құқықтары жөніндегі уәкілдің 2023 жылғы 27 қаңтардағы № 4 бұйрығына өзгерістер мен толықтыру енгізу туралы
