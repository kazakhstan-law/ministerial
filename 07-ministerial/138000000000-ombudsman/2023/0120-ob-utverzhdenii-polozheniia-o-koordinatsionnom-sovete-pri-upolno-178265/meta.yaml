  title:
    rus: О внесении изменения и дополнений в приказы Уполномоченного по правам человека в Республике Казахстан от 20 января 2023 года № 1 «Об утверждении Положения о Координационном совете при Уполномоченном по правам человека в Республике Казахстан» и от 27 января 2023 года № 4 «Об утверждении Правил отбора участников национального превентивного механизма
    kaz: «Қазақстан Республикасындағы Адам құқықтары жөніндегі уәкіл жанындағы Үйлестіру кеңесі туралы ережені бекіту туралы» Адам құқықтары жөніндегі уәкілдің 2023 жылғы 20 қаңтардағы № 1 және «Ұлттық превентивтік тетікке қатысушыларды іріктеу қағидаларын бекіту туралы» Қазақстан Республикасындағы Адам құқықтары жөніндегі уәкілдің 2023 жылғы 27 қаңтардағы № 4 бұйрықтарына өзгеріс пен толықтырулар енгізу туралы
