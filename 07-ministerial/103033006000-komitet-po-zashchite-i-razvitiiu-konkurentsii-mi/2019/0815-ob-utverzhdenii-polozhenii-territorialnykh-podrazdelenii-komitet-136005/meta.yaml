  title:
    rus: О внесении изменения в приказ исполняющего обязанности председателя Комитета по защите и развитию конкуренции Министерства национальной экономики Республики Казахстан от 15 августа 2019 года № 1-ОД «Об утверждении положений территориальных подразделений Комитета по защите и развитию конкуренции Министерства национальной экономики Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық экономика министрлігінің Бәсекелестікті қорғау және дамыту комитеті аумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігінің Бәсекелестікті қорғау және дамыту комитеті төрағасының міндетін атқарушының 2019 жылғы 15 тамыздағы № 1-НҚ бұйрығына өзгеріс енгізу туралы
