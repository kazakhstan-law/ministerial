  requisite: Приказ Председателя Комитета по регулированию естественных монополий Министерства национальной экономики Республики Казахстан от 10 марта 2026 года № 56-ОД
  title:
    rus: О внесении изменения в приказ Председателя Комитета по регулированию естественных монополий Министерства национальной экономики Республики Казахстан от 23 августа 2019 года № 1-ОД «Об утверждении положений территориальных подразделений Комитета по регулированию естественных монополий Министерства национальной экономики Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық экономика министрлігінің Табиғи монополияларды реттеу комитетінің аумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігінің Табиғи монополияларды реттеу комитеті төрағасының 2019 жылғы 23 тамыздағы № 1-НҚ бұйрығына өзгеріс енгізу туралы
