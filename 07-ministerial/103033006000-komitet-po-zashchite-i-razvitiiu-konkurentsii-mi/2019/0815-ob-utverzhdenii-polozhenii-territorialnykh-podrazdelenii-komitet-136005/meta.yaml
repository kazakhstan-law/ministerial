title:
  rus: Об утверждении положений территориальных подразделений Комитета по защите и развитию конкуренции Министерства национальной экономики Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық экономика министрлігі Бәсекелестікті қорғау және дамыту комитетінің аумақтық бөлімшелерінің ережелерін бекіту туралы
