requisite: Приказ Председателя Комитета по водным ресурсам Министерства экологии, геологии и природных ресурсов Республики Казахстан от 13 августа 2019 года № 170. Отменен приказом и.о. Председателя Комитета водного хозяйства Министерства водных ресурсов и ирригации Республики Казахстан от 26 октября 2023 года № 1-НҚ (вступает в силу со дня подписания)
title:
  rus: Об утверждении положений бассейновых инспекций по регулированию использования и охране водных ресурсов Комитета по водным ресурсам Министерства экологии, геологии и природных ресурсов Республики Казахстан
  kaz: «Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігі Су ресурстары комитетінің Су ресурстарын пайдалануды реттеу және қорғау жөніндегі бассейндік инспекцияларының ережелерін бекіту туралы»
