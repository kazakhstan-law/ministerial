  title:
    rus: О внесении дополнений и изменений в приказ Председателя Комитета по водным ресурсам Министерства экологии, геологии и природных ресурсов Республики Казахстан от 13 августа 2019 года № 170 «Об утверждении положений бассейновых инспекций по регулированию использования и охране водных ресурсов Комитета по водным ресурсам Министерства экологии, геологии и природных ресурсов Республики Казахстан»
    kaz: «Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігі Су ресурстары комитетінің Су ресурстарын пайдалануды реттеу және қорғау жөніндегі бассейндік инспекцияларының ережелерін бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің Су ресурстары комитеті төрағасының 2019 жылғы 13 тамыздағы № 170 бұйрығына толықтырулар мен өзгерістер енгізу туралы
