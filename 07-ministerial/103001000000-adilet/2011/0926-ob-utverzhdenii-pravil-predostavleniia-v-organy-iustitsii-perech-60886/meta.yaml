  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 26 сентября 2011 года № 321 «Об утверждении Правил предоставления в органы юстиции перечней принятых приказов министров Республики Казахстан и иных руководителей центральных государственных органов, постановлений центральных государственных органов, Центральной избирательной комиссии, решений маслихатов, а также постановлений акиматов и решений акимов за прошедший квартал и их изучения»
    kaz: «Өткен тоқсандағы Қазақстан Республикасы министрлерінің және орталық мемлекеттік органдардың өзге де басшыларының қабылданған бұйрықтарының, орталық мемлекеттік органдардың, Орталық сайлау комиссиясының қаулылары, мәслихаттардың шешімдері, сондай-ақ әкімдіктердің қаулыларының және әкімдердің шешімдерінің тізбесін әділет органдарына ұсыну және оларды зерделеу ережесін бекіту туралы» Қазақстан Республикасы Әділет Министрінің 2011 жылғы 26 қыркүйектегі № 321 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/92402/rus
