act_code: '60886'
requisite: Приказ Министра юстиции Республики Казахстан от 26 сентября 2011 года № 321. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 сентября 2011 года № 7231. Утратил силу приказом Министра юстиции Республики Казахстан от 28 сентября 2016 года № 809
title:
  rus: Об утверждении Правил предоставления в органы юстиции перечней принятых приказов министров Республики Казахстан и иных руководителей центральных государственных органов, их ведомств, постановлений центральных государственных органов, Центральной избирательной комиссии, решений маслихатов, а также постановлений акиматов и решений акимов за прошедший квартал и их изучения
  kaz: Өткен тоқсандағы Қазақстан Республикасының министрлерінің және орталық мемлекеттік органдардың, олардың ведомстволарының өзге де басшыларының қабылданған бұйрықтарының, орталық мемлекеттік органдардың, Орталық сайлау комиссиясының қаулылары, мәслихаттардың шешімдері, сондай-ақ әкімдіктердің қаулыларының және әкімдердің шешімдерінің тізбесін әділет органдарына ұсыну және оларды зерделеу ережесін бекіту туралы
