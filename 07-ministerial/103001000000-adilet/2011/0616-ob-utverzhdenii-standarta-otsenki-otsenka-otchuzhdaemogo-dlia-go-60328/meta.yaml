title:
  rus: Об утверждении стандарта оценки "Оценка отчуждаемого для государственных нужд земельного участка или иного недвижимого имущества в связи с изъятием земельного участка для государственных нужд"
  kaz: '"Жер учаскесін мемлекет мұқтажы үшін, алып қоюға байланысты мемлекет мұқтажы үшін иеліктен шығарылатын жер учаскесін немесе өзге де жылжымайтын мүлікті бағалау" бағалау стандартын бекіту туралы'
