title:
  rus: Об утверждении Правил транспортировки, приема, учета, оценки, хранения и реализации драгоценных металлов, драгоценных камней и изделий из них, обращенных (поступивших) в собственность государства по отдельным основаниям
  kaz: Жекелеген негіздер бойынша мемлекет меншігіне айналдырылған (түскен) бағалы металдарды, асыл тастарды және олардан жасалған бұйымдарды тасымалдау, қабылдау, есепке алу, бағалау, сақтау және өткізу ережелерін бекіту туралы
