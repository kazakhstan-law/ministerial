act_code: '4282'
requisite: Приказ Председателя Комитета регистрационной службы Министерства юстиции Республики Казахстан от 15 сентября 1999 года № 198/1. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 октября 1999 года N 927. Утратил силу - приказом Председателя Комитета регистрационной службы Министерства юстиции РК от 14 сентября 2004 года N 293
title:
  rus: Об утверждении "Правил по определению стоимости недвижимого имущества физических лиц (квартир, частных жилых домов, дачных домиков и гаражей) для целей налогообложения РГП "Центрами по недвижимости Комитета регистрационной службы Министерства юстиции Республики Казахстан"
  kaz: '"Қазақстан Республикасы Әділет министрлігі Тіркеу қызметі комитетінің жылжымайтын мүлік жөніндегі орталықтарымен" РМК салық салу мақсатында жеке тұлғалардың жылжымайтын мүліктерінің (пәтерлер, меншікті тұрғын үйлер, саяжай үйлері және көлік-жайларының) құнын анықтау жөнінде уақытша қағидасын" бекіту туралы'
