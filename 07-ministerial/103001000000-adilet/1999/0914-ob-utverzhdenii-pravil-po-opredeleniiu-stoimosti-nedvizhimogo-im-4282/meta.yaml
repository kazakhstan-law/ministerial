caused_by:
  code: '6281'
  requisite: Приказ Председателя Комитета регистрационной службы Министерства юстиции Республики Казахстан от 19 мая 2000 года N 99 Зарегистрирован в Министерстве юстиции Республики Казахстан 15.06.2000 г. за N 1158. Утратил силу приказом Председателя Комитета регистрационной службы и оказания правовой помощи Министерства юстиции Республики Казахстан от 15 июня 2009 года N 105
  title:
    rus: О внесении изменений и дополнений в "Правила по определению стоимости недвижимого имущества физических лиц (квартир, частных домов, дачных домиков и гаражей) для целей налогообложения Республиканскими государственными предприятиями "Центрами по недвижимости Комитета регистрационной службы Министерства юстиции Республики Казахстан"
    kaz: '"Қазақстан Респуликасы Әдiлет министрлiгi Тiркеу қызмет комитетiнiң Жылжымайтын мүлiк жөнiндегi орталықтары" Республикалық мемлекеттiк кәсiпорындардың салық салу мақсаттары үшiн жеке тұлғалардың жылжымайтын мүлiктерiнiң (пәтерлердiң, жеке үйлердiң, саяжайлардың және көлiк жайлардың) құндарын белгiлеу жөнiндегi Қағидаға" мынадай өзгерiстер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/6281/rus
