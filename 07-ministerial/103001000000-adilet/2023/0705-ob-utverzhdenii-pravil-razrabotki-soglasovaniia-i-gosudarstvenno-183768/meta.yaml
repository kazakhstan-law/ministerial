  title:
    rus: О внесении изменений в приказы исполняющего обязанности Министра юстиции Республики Казахстан от 5 июля 2023 года № 464 «Об утверждении Правил разработки, согласования и государственной регистрации нормативных правовых актов» и Министра юстиции Республики Казахстан от 11 июля 2023 года № 472 «Об утверждении Правил ведения Государственного реестра нормативных правовых актов Республики Казахстан, Эталонного контрольного банка нормативных правовых актов Республики Казахстан, Инструкции по формированию Эталонного контрольного банка нормативных правовых актов Республики Казахстан, а также внесению в него сведений»
    kaz: «Нормативтік құқықтық актілерді әзірлеу, келісу және мемлекеттік тіркеу қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің міндетін атқарушының 2023 жылғы 5 шiлдедегi № 464 және «Қазақстан Республикасы нормативтiк құқықтық актілерiнiң мемлекеттiк тiзiлiмiн, Қазақстан Республикасы нормативтiк құқықтық актілерiнiң эталондық бақылау банкiн жүргiзу қағидаларын, Қазақстан Республикасы Нормативтік құқықтық актілерінің эталондық бақылау банкін қалыптастыру, сондай-ақ оған мәліметтер енгізу жөніндегі нұсқаулықты бекiту туралы» Қазақстан Республикасы Әділет министрінің 2023 жылғы 11 шiлдедегi № 472 бұйрықтарына өзгерістер енгізу туралы
