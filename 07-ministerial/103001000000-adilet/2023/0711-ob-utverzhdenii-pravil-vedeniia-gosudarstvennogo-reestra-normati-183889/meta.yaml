act_code: '183889'
requisite: Приказ Министра юстиции Республики Казахстан от 11 июля 2023 года № 472. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 июля 2023 года № 33059
title:
  rus: Об утверждении Правил ведения Государственного реестра нормативных правовых актов Республики Казахстан, Эталонного контрольного банка нормативных правовых актов Республики Казахстан, Инструкции по формированию Эталонного контрольного банка нормативных правовых актов Республики Казахстан, а также внесению в него сведений
  kaz: Қазақстан Республикасы нормативтiк құқықтық актілерiнiң мемлекеттiк тiзiлiмiн, Қазақстан Республикасы нормативтiк құқықтық актілерiнiң эталондық бақылау банкiн жүргiзу қағидаларын, Қазақстан Республикасы Нормативтік құқықтық актілерінің эталондық бақылау банкін қалыптастыру, сондай-ақ оған мәліметтер енгізу жөніндегі нұсқаулықты бекiту туралы
