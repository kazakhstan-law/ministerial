  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 11 июля 2023 года № 472 «Об утверждении Правил ведения Государственного реестра нормативных правовых актов Республики Казахстан, Эталонного контрольного банка нормативных правовых актов Республики Казахстан, Инструкции по формированию Эталонного контрольного банка нормативных правовых актов Республики Казахстан, а также внесению в него сведений»
    kaz: «Қазақстан Республикасы нормативтiк құқықтық актілерiнiң мемлекеттiк тiзiлiмiн, Қазақстан Республикасы нормативтiк құқықтық актілерiнiң эталондық бақылау банкiн жүргiзу қағидаларын, Қазақстан Республикасы Нормативтік құқықтық актілерінің эталондық бақылау банкін қалыптастыру, сондай-ақ оған мәліметтер енгізу жөніндегі нұсқаулықты бекiту туралы» Қазақстан Республикасы Әділет министрінің 2023 жылғы 11 шiлдедегi № 472 бұйрығына өзгерістер енгізу туралы
