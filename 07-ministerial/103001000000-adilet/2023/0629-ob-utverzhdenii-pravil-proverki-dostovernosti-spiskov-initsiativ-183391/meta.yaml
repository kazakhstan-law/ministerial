  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра юстиции Республики Казахстан от 29 мая 2020 года № 66 «Об утверждении правил оказания государственных услуг в сфере государственной регистрации юридических лиц и учетной регистрации филиалов и представительств» и приказ Министра юстиции Республики Казахстан от 29 июня 2023 года № 427 «Об утверждении Правил проверки достоверности списков инициативной группы граждан по созданию политической партии, членов политической партии»
    kaz: «Заңды тұлғаларды мемлекеттік тіркеу және филиалдар мен өкілдіктерді есептік тіркеу жөнінде мемлекеттік қызметтер көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің міндетін атқарушының 2020 жылғы 29 мамырдағы № 66 бұйрығына  және «Азаматтардың саяси партия құру жөніндегі бастамашылық тобы, саяси партия мүшелері тізімдерінің дұрыстығын тексеру қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2023 жылғы 29 маусымдағы № 427 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/226605/rus
