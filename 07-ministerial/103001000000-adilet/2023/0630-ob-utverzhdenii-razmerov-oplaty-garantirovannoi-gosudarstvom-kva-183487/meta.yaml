title:
  rus: Об утверждении размеров оплаты гарантированной государством квалифицированной юридической помощи, оказанной адвокатом, юридическим консультантом, и возмещения расходов, связанных с правовым консультированием, защитой и представительством, а также проведением примирительных процедур
  kaz: Адвокат, заң консультанты көрсеткен, мемлекет кепілдік берген білікті заң көмегіне ақы төлеудің және құқықтық консультация беруге, қорғауға және өкілдік етуге, сондай-ақ татуластыру рәсімдерін жүргізуге байланысты шығыстарды өтеудің мөлшерін бекіту туралы
