  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 30 июня 2023 года № 434 «Об утверждении размеров оплаты гарантированной государством юридической помощи, оказанной адвокатом, юридическим консультантом, и возмещения расходов, связанных с правовым консультированием, защитой и представительством, а также проведением примирительных процедур»
    kaz: «Адвокат, заң консультанты көрсеткен мемлекет кепілдік берген заң көмегіне ақы төлеудің және құқықтық консультация беруге, қорғауға және өкілдік етуге, сондай-ақ татуластыру рәсімдерін жүргізуге байланысты шығыстарды өтеудің мөлшерін бекіту туралы» Қазақстан Республикасы Әділет министрінің 2023 жылғы 30 маусымдағы № 434 бұйрығына өзгерістер енгізу туралы
