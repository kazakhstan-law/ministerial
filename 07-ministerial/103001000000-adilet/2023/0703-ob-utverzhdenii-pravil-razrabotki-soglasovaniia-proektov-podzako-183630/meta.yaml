  title:
    rus: О внесении дополнений в приказ Министра юстиции Республики Казахстан от 3 июля 2023 года № 448 «Об утверждении Правил разработки, согласования проектов подзаконных нормативных правовых актов» и приказ исполняющего обязанности Министра юстиции Республики Казахстан от 5 июля 2023 года № 464 «Об утверждении Правил разработки, согласования и государственной регистрации нормативных правовых актов»
    kaz: «Заңға тәуелді нормативтік құқықтық актілердің жобаларын әзірлеу, келісу қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2023 жылғы 3 шiлдедегi № 448 бұйрығына және «Нормативтік құқықтық актілерді әзірлеу, келісу және мемлекеттік тіркеу қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің міндетін атқарушының 2023 жылғы 5 шiлдедегi № 464 бұйрығына толықтырулар енгізу туралы
