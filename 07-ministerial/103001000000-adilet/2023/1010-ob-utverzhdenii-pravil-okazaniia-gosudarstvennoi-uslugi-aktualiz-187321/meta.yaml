  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра юстиции Республики Казахстан от 29 мая 2020 года № 66 «Об утверждении правил оказания государственных услуг в сфере государственной регистрации юридических лиц и учетной регистрации филиалов и представительств» и приказ Министра юстиции Республики Казахстан от 10 октября 2023 года № 726 «Об утверждении Правил оказания государственной услуги Актуализация (корректировка) наименования юридических лиц, филиалов и представительств»
    kaz: «Заңды тұлғаларды мемлекеттік тіркеу және филиалдар мен өкілдіктерді есептік тіркеу жөнінде мемлекеттік қызметтер көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің міндетін атқарушының 2020 жылғы 29 мамырдағы № 66 бұйрығына және «Заңды тұлғалардың, филиалдар мен өкілдіктердің атауын өзектендіру (түзету) мемлекеттік қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2023 жылғы 10 қазандағы № 726 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/228224/rus
