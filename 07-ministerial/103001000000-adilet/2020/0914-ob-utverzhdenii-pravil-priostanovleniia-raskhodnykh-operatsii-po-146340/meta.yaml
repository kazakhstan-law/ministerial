title:
  rus: Об утверждении Правил приостановления расходных операций по текущему счету, предназначенному для хранения взысканных сумм в пользу взыскателей, частного судебного исполнителя, действие лицензии которого приостановлено или прекращено либо которого лишили лицензии, а также исключили из членов Республиканской палаты и формы распоряжения
  kaz: Лицензиясының қолданысы тоқтатыла тұрған немесе тоқтатылған не лицензиясынан айырылған, сондай-ақ Республикалық палата мүшелігінен шығарылған жеке сот орындаушысының өндіріп алушылардың пайдасына өндіріп алынған сомаларды сақтауға арналған ағымдағы шоты бойынша шығыс операцияларын тоқтата тұру туралы қағидаларын және өкімнің нысанын бекіту туралы
