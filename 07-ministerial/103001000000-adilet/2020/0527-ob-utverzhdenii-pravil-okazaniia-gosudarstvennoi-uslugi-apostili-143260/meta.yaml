title:
  rus: Об утверждении правил оказания государственной услуги «Апостилирование официальных документов, исходящих из органов юстиции, регистрации актов гражданского состояния и иных государственных органов, а также нотариусов Республики Казахстан»
  kaz: «Қазақстан Республикасының әділет органдарынан, азаматтық хал актілерін тіркеу және өзге де мемлекеттік органдарынан, сондай-ақ нотариустардан шығатын ресми құжаттарға апостиль қою» мемлекеттік қызметін көрсету қағидасын бекіту туралы
