  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра юстиции Республики Казахстан от 27 мая 2020 года № 58 «Об утверждении правил оказания государственной услуги «Апостилирование официальных документов, исходящих из органов юстиции и иных государственных органов, а также нотариусов Республики Казахстан»
    kaz: «Қазақстан Республикасының әділет органдарынан және өзге мемлекеттік органдарынан, сондай-ақ нотариустардан шығатын ресми құжаттарға апостиль қою» мемлекеттік қызметін көрсету қағидасын бекіту туралы» Қазақстан Республикасы Әділет министрінің міндетін атқарушының 2020 жылғы 27 мамырдағы № 58 бұйрығына өзгеріс енгізу туралы
