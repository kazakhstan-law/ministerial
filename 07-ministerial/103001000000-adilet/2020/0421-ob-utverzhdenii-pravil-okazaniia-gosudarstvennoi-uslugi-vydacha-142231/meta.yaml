title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача лицензии на занятие судебно-экспертной деятельностью, в том числе судебно-медицинской, судебно-наркологической и судебно-психиатрической экспертизами»
  kaz: «Сот-сараптама қызметімен, оның ішінде сот-медициналық, сот-наркологиялық және сот-психиатриялық сараптамалармен айналысуға лицензия беру» мемлекеттік қызмет көрсету қағидасын бекіту туралы
