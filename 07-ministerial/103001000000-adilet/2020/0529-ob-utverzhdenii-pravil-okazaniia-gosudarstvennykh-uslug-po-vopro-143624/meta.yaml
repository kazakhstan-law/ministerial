  title:
    rus: О внесении изменений в приказы Министра юстиции Республики Казахстан от 29 мая 2020 года № 69 «Об утверждении правил оказания государственных услуг по вопросам исполнительного производства» и от 11 сентября 2020 года № 347 «Об утверждении Правил осуществления выбора единой электронной торговой площадки по реализации арестованного имущества»
    kaz: Қазақстан Республикасы Әділет министрінің «Атқарушылық іс жүргізу мәселелері бойынша мемлекеттiк көрсетілетін қызметтер қағидаларын бекіту туралы» 2020 жылғы 29 мамырдағы № 69 және «Тыйым салынған мүлікті өткізу бойынша бірыңғай электрондық сауда-саттық алаңын таңдауды жүзеге асыру қағидаларын бекіту туралы» 2020 жылғы 11 қыркүйектегі № 347 бұйрықтарына өзгерістер енгізу туралы
