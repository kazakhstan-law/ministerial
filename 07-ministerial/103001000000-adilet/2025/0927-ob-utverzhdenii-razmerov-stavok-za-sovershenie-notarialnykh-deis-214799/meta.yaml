  kaz: Жекеше нотариустардың нотариаттық әрекеттер жасағаны және өзге де көрсетілетін қызметтері үшiн, сондай-ақ нотариат куәландырған құжаттардың көшiрмелерiн (телнұсқаларын) бергенi және консультация беруді жүзеге асырғаны үшiн мөлшерлемелер мөлшерін бекіту туралы
