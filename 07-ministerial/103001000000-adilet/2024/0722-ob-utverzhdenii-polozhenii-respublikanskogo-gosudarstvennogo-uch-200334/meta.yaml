caused_by:
  code: '210406'
  requisite: Приказ Министра юстиции Республики Казахстан от 15 мая 2025 года № 267
  title:
    rus: О внесении изменения в приказ Министра юстиции Республики Казахстан от 22 июля 2024 года № 617 «Об утверждении положений республиканского государственного учреждения «Комитет по правам интеллектуальной собственности Министерства юстиции Республики Казахстан», республиканского государственного учреждения «Комитет принудительного исполнения Министерства юстиции Республики Казахстан», республиканское государственное учреждение «Комитет регистрационной службы и организации юридических услуг Министерства юстиции Республики Казахстан»
    kaz: «Қазақстан Республикасы Әділет министрлігінің Зияткерлiк меншiк құқығы комитеті» республикалық мемлекеттік мекемесінің, «Қазақстан Республикасы Әділет министрлігінің Мәжбүрлеп орындату комитеті» республикалық мемлекеттік мекемесінің, «Қазақстан Республикасы Әділет министрлігінің Тіркеу қызметі және заңгерлік қызметтер көрсетуді ұйымдастыру комитеті» республикалық мемлекеттік мекемесінің ережелерін бекіту туралы» Қазақстан Республикасы Әділет министрінің 2024 жылғы 22 шiлдедегi № 617 бұйрығына өзгеріс енгізу туралы
