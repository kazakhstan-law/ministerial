act_code: '200334'
requisite: Приказ Министра юстиции Республики Казахстан от 22 июля 2024 года № 617
title:
  rus: Об утверждении положений республиканского государственного учреждения «Комитет по правам интеллектуальной собственности Министерства юстиции Республики Казахстан», республиканского государственного учреждения «Комитет принудительного исполнения Министерства юстиции Республики Казахстан», республиканское государственное учреждение «Комитет регистрационной службы и организации юридических услуг Министерства юстиции Республики Казахстан»
  kaz: «Қазақстан Республикасы Әділет министрлігінің Зияткерлiк меншiк құқығы комитеті» республикалық мемлекеттік мекемесінің, «Қазақстан Республикасы Әділет министрлігінің Мәжбүрлеп орындату комитеті» республикалық мемлекеттік мекемесінің, «Қазақстан Республикасы Әділет министрлігінің Тіркеу қызметі және заңгерлік қызметтер көрсетуді ұйымдастыру комитеті» республикалық мемлекеттік мекемесінің ережелерін бекіту туралы
