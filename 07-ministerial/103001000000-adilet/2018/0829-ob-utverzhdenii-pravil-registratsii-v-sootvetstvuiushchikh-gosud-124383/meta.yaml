title:
  rus: Об утверждении Правил регистрации в соответствующих государственных реестрах передачи исключительного права, предоставления права на использование объекта промышленной собственности, открытую или принудительную лицензию
  kaz: Өнеркәсіптік меншік объектісіне айрықша құқық беруді, оны пайдалануға, ашық немесе мәжбүрлі лицензияға құқықты табыстауды тиісті мемлекеттік тізілімдерде тіркеу қағидаларын бекіту туралы
