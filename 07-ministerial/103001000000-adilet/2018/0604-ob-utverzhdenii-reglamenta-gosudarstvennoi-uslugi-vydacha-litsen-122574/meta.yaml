  kaz: «Сот-сараптама қызметімен, соның ішінде сот-медициналық, сот-наркологиялық және сот-психиатриялық сараптамалармен айналысуға лицензия беру» мемлекеттiк көрсетілетін қызметтің регламентін бекіту туралы
