act_code: '122574'
requisite: Приказ Министра юстиции Республики Казахстан от 4 июня 2018 года № 890. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 июня 2018 года № 17061. Утратил силу приказом Министра юстиции Республики Казахстан от 21 апреля 2020 года № 5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача лицензии на занятие судебно-экспертной деятельностью, в том числе судебно-медицинской, судебно-наркологической и судебно-психиатрической экспертизами»
  kaz: «Сот-сараптама қызметімен, соның ішінде сот-медициналық, сот-наркологиялық және сот-психиатриялық сараптамалармен айналысуға лицензия беру» мемлекеттiк көрсетілетін қызметтің регламентін бекіту туралы
