  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра юстиции Республики Казахстан от 31 июля 2018 года № 1192 «Об утверждении правил предоставления статистической и иной отчетной информации в области государственной регистрации прав на недвижимое имущество»
    kaz: «Жылжымайтын мүлікке құқықтарды мемлекеттік тіркеу саласындағы статистикалық және өзге де есептік ақпаратты беру қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің міндетін атқарушы 2018 жылғы 31 шілдедегі № 1192 бұйрығына өзгеріс енгізу туралы
