title:
  rus: Об утверждении Правил проведения экспертизы заявок на селекционные достижения, объекты промышленной собственности, товарные знаки, знаки обслуживания, географические указания, наименования мест происхождения товаров, о регистрации топологий интегральных микросхем
  kaz: Селекциялық жетiстiктердің, өнеркәсiптiк меншiк объектiлерiнің, тауар белгілерінің, қызмет көрсету белгілерінің, географиялық нұсқамалардың, тауар шығарылған жерлер атауларының, интегралдық микросхемалар топологияларын тіркеу өтінімдеріне сараптама жүргізу қағидаларын бекіту туралы
