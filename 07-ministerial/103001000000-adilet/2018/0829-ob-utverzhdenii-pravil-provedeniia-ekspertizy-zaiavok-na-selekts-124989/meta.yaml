  title:
    rus: О внесении изменений и дополнений в приказ Министра юстиции Республики Казахстан от 29 августа 2018 года № 1349 «Об утверждении Правил проведения экспертизы заявок на селекционные достижения, объекты промышленной собственности, товарные знаки, знаки обслуживания, географические указания, наименования мест происхождения товаров, о регистрации топологий интегральных микросхем»
    kaz: «Селекциялық жетiстiктердің, өнеркәсiптiк меншiк объектiлерiнің, тауар таңбалары және тауар шығарылған жерлердiң атауларының, интегралдық микросхемалар топологияларын тіркеу өтінімдеріне сараптама жасау қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2018 жылғы 29 тамыздағы № 1349 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/193152/rus
