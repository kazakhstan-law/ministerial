  title:
    rus: О внесении изменения в приказ Министра юстиции Республики Казахстан от 29 августа 2018 года № 1349 «Об утверждении Правил проведения экспертизы заявок на селекционные достижения, объекты промышленной собственности, товарные знаки и наименования мест происхождения товаров, регистрацию топологий интегральных микросхем»
    kaz: «Селекциялық жетiстiктердің, өнеркәсiптiк меншiк объектiлерiнің, тауар таңбалары және тауар шығарылған жерлердiң атауларының, интегралдық микросхемалар топологияларын тіркеу өтінімдеріне сараптама жасау қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2018 жылғы 29 тамыздағы № 1349 бұйрығына өзгерістер енгізу туралы
