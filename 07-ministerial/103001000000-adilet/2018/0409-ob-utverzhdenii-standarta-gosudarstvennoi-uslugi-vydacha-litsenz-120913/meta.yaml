act_code: '120913'
requisite: Приказ Министра юстиции Республики Казахстан от 9 апреля 2018 года № 546. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 апреля 2018 года № 16780. Утратил силу приказом Министра юстиции Республики Казахстан от 21 апреля 2020 года № 5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Выдача лицензии на занятие судебно-экспертной деятельностью, в том числе судебно-медицинской, судебно-наркологической и судебно-психиатрической экспертизами»
  kaz: «Сот-сараптама қызметiмен, оның ішінде сот-медициналық, сот-наркологиялық және сот-психиатриялық сараптамалармен айналысуға лицензия беру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
