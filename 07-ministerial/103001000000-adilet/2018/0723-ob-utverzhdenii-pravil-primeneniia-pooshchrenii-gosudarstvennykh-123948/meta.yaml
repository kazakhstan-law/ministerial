  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра юстиции Республики Казахстан от 23 июля 2018 года № 1140 «Об утверждении Правил применения поощрений государственных служащих Министерства юстиции Республики Казахстан»
    kaz: «Қазақстан Республикасы Әділет министрлігінің мемлекеттік қызметшілеріне көтермелеулерді қолдану қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің міндетін атқарушысының 2018 жылғы 23 шілдедегі № 1140 бұйрығына өзгерістер енгізу туралы
