  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 29 августа 2018 года № 1346 «Об утверждении Правил регистрации в Государственном реестре селекционных достижений передачи исключительного права, предоставления права на использование селекционного достижения, открытую или принудительную лицензию»
    kaz: «Селекциялық жетiстiкке айрықша құқық беруді, оны пайдалануға, ашық немесе мәжбүрлі лицензияға құқықты табыстауды Селекциялық жетiстiктердің мемлекеттік тізілімінде тіркеу қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2018 жылғы 29 тамыздағы № 1346 бұйрығына өзгерістер енгізу туралы
