title:
  rus: Об утверждении Правил регистрации в Государственном реестре селекционных достижений передачи исключительного права, предоставления права на использование селекционного достижения, открытую или принудительную лицензию
  kaz: Селекциялық жетiстiкке айрықша құқық беруді, оны пайдалануға, ашық немесе мәжбүрлі лицензияға құқықты табыстауды Селекциялық жетiстiктердің мемлекеттік тізілімінде тіркеу қағидаларын бекіту туралы
