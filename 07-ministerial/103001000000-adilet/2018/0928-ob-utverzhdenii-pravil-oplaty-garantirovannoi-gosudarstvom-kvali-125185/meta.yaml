title:
  rus: Об утверждении Правил оплаты гарантированной государством квалифицированной юридической помощи, оказываемой адвокатом, юридическим консультантом, и возмещения расходов, связанных с правовым консультированием, защитой и представительством, а также проведением примирительных процедур
  kaz: Адвокат, заң консультанты көрсететін мемлекет кепілдік берген білікті заң көмегіне ақы төлеу және құқықтық консультация беруге, қорғауға және өкілдік етуге, сондай-ақ татуластыру рәсімдерін жүргізуге байланысты шығыстарды өтеу қағидаларын бекіту туралы
