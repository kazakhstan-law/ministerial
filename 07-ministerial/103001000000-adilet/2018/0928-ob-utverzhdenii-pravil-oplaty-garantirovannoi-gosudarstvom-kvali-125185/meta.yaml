  title:
    rus: О внесении изменений и дополнений в приказ Министра юстиции Республики Казахстан от 28 сентября 2018 года № 1462 «Об утверждении Правил оплаты гарантированной государством юридической помощи, оказываемой адвокатом, юридическим консультантом, и возмещения расходов, связанных с правовым консультированием, защитой и представительством, а также проведением примирительных процедур»
    kaz: «Адвокат, заң консультанты көрсеткен, мемлекет кепілдік берген заң көмегіне ақы төлеудің және құқықтық консультация беруге, қорғауға және өкілдік етуге, сондай-ақ татуластыру рәсімдерін жүргізуге байланысты шығыстарды қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2018 жылғы 28 қыркүйектегі № 1462 бұйрығына өзгерістер мен толықтырулар енгізу туралы
