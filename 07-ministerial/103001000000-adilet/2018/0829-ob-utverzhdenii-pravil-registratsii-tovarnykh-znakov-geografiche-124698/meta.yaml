  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 29 августа 2018 года № 1340 «Об утверждении Правил регистрации товарных знаков и наименований мест происхождения товаров в Государственном реестре товарных знаков и Государственном реестре наименований мест происхождения товаров, форм свидетельств и выдачи охранных документов и их дубликатов, прекращения действия регистрации и признания ее недействительной»
    kaz: «Тауар таңбаларын және тауар шығарылған жерлердiң атауларын тауар таңбаларының мемлекеттік тізілімінде және тауар шығарылған жерлер атауларының мемлекеттік тізілімінде тіркеу және қорғау құжаттары мен олардың телнұсқаларын беру, тіркеудің қолданысын тоқтату және оны жарамсыз деп тану қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2018 жылғы 29 тамыздағы № 1340 бұйрығына өзгерістер енгізу туралы
