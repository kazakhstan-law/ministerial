act_code: '124698'
requisite: Приказ Министра юстиции Республики Казахстан от 29 августа 2018 года № 1340. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 сентября 2018 года № 17414
title:
  rus: Об утверждении Правил регистрации товарных знаков, географических указаний и наименований мест происхождения товаров в Государственном реестре товарных знаков, Государственном реестре географических указаний и Государственном реестре наименований мест происхождения товаров и выдачи охранных документов и их дубликатов, прекращения действия регистрации и признания ее недействительной, а также форм свидетельств
  kaz: Тауар белгілерін, географиялық нұсқамаларды және тауарлар шығарылған жерлердің атауларын Тауар белгілерінің мемлекеттік тізілімінде, Географиялық нұсқамалардың мемлекеттік тізілімінде және Тауарлар шығарылған жерлер атауларының мемлекеттік тізілімінде тіркеу және қорғау құжаттары мен олардың телнұсқаларын, сондай-ақ куәліктердің нысандарын беру, тіркеудің қолданысын тоқтату және оны жарамсыз деп тану қағидаларын бекіту туралы
