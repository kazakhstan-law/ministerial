  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 29 августа 2018 года № 1341 «Об утверждении Правил регистрации объектов промышленной собственности в Государственном реестре изобретений, Государственном реестре полезных моделей, Государственном реестре промышленных образцов и выдачи охранных документов и их дубликатов, признания недействительными и досрочного прекращения действия патентов»
    kaz: «Өнеркәсіптік меншік объектілерін Өнертабыстардың мемлекеттік тізілімінде, Пайдалы модельдердің мемлекеттік тізілімінде, Өнеркәсіптік үлгілердің мемлекеттік тізілімінде тіркеу және қорғау құжаттарын және олардың телнұсқаларын беру, патенттерді жарамсыз деп тану және олардың қолданылуын мерзімінен бұрын тоқтату қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2018 жылғы 29 тамыздағы № 1341 бұйрығына өзгерістер енгізу туралы
