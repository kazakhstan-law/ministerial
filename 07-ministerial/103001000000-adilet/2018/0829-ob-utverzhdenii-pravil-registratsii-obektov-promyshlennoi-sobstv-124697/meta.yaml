act_code: '124697'
requisite: Приказ Министра юстиции Республики Казахстан от 29 августа 2018 года № 1341. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 сентября 2018 года № 17415
title:
  rus: Об утверждении Правил регистрации объектов промышленной собственности в Государственном реестре изобретений, Государственном реестре полезных моделей, Государственном реестре промышленных образцов и выдачи охранных документов и их дубликатов, признания недействительными и досрочного прекращения действия патентов
  kaz: Өнеркәсіптік меншік объектілерін Өнертабыстардың мемлекеттік тізілімінде, Пайдалы модельдердің мемлекеттік тізілімінде, Өнеркәсіптік үлгілердің мемлекеттік тізілімінде тіркеу және қорғау құжаттарын және олардың телнұсқаларын беру, патенттерді жарамсыз деп тану және олардың қолданылуын мерзімінен бұрын тоқтату қағидаларын бекіту туралы
