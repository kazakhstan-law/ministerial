  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 28 августа 2018 года № 1313 «Об утверждении Правил предоставления выписок из Государственных реестров селекционных достижений, изобретений, полезных моделей, промышленных образцов, товарных знаков и наименований мест происхождения товаров, топологий интегральных микросхем»
    kaz: «Селекциялық жетістіктердің, өнертабыстардың, пайдалы модельдердің, өнеркәсіптік үлгілердің, тауар белгілерінің және тауар шығарылған жерлер атауларының, интегралдық микросхемалар топологияларының мемлекеттік тізілімдерінен үзінді көшірмелер беру қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2018 жылғы 28 тамыздағы № 1313 бұйрығына өзгерістер енгізу туралы
