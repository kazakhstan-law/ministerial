title:
  rus: Об утверждении Правил предоставления выписок из Государственных реестров селекционных достижений, изобретений, полезных моделей, промышленных образцов, товарных знаков и наименований мест происхождения товаров, топологий интегральных микросхем
  kaz: Селекциялық жетістіктердің, өнертабыстардың, пайдалы модельдердің, өнеркәсіптік үлгілердің, тауар белгілерінің және тауар шығарылған жерлер атауларының, интегралдық микросхемалар топологияларының мемлекеттік тізілімдерінен үзінді көшірмелер беру қағидаларын бекіту туралы
