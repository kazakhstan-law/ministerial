title:
  rus: Об утверждении Правил опубликования в бюллетене сведений, относящихся к регистрации селекционных достижений, объектов промышленной собственности, товарных знаков, географических указаний, наименований мест происхождения товаров и топологий интегральных микросхем
  kaz: Селекциялық жетістіктерді, өнеркәсіптік меншік объектілерін, тауар белгілерін, географиялық нұсқамаларды, тауар шығарылған жерлерінің атауларын және интегралдық микросхемалар топологияларын тіркеуге жататын мәліметтерді бюллетеньде жариялау қағидаларын бекіту туралы
