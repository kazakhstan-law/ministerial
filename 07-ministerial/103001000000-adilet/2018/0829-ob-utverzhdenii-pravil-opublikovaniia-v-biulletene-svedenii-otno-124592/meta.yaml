  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 29 августа 2018 года № 1348 «Об утверждении Правил опубликования в бюллетене сведений, относящихся к регистрации селекционных достижений, объектов промышленной собственности, товарных знаков и наименований мест происхождения товаров, о зарегистрированных топологиях»
    kaz: «Селекциялық жетістіктерді, өнеркәсіптік меншік объектілерін, тіркелген топологияларды, тауар белгілерін және тауар шығарылған жерлерінің атауларын тіркеуге жататын мәліметтерді бюллетеньде жариялау тәртібін бекіту туралы» Қазақстан Республикасы Әділет министрінің 2018 жылғы 29 тамыздағы № 1348 бұйрығына өзгерістер енгізу туралы
