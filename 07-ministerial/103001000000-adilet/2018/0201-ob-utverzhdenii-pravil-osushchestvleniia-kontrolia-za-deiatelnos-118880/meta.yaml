  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 1 февраля 2018 года № 171 «Об утверждении Правил осуществления контроля за деятельностью частных судебных исполнителей» и признании утратившим силу приказа Министра юстиции Республики Казахстан от 10 апреля 2026 года № 339 «О приостановлении действий некоторых структурных элементов приказа Министра юстиции Республики Казахстан от 1 февраля 2018 года № 171 «Об утверждении Правил осуществления контроля за деятельностью частных судебных исполнителей»
    kaz: «Жеке сот орындаушыларының қызметін бақылауды жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2018 жылғы 1 ақпандағы № 171 бұйрығына өзгерістер енгізу және ««Жеке сот орындаушыларының қызметін бақылауды жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2018 жылғы 1 ақпандағы № 171 бұйрығының кейбір құрылымдық элементтерінің әрекеттерін тоқтата тұру туралы» Қазақстан Республикасы Әділет министрінің 2026 жылғы 10 сәуірдегі № 339 бұйрығының күші жойылды деп тану туралы
