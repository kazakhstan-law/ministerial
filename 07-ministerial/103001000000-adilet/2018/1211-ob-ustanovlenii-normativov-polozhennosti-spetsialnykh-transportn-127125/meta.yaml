title:
  rus: Об установлении нормативов положенности специальных транспортных средств и определении критериев отнесения автотранспорта к специальным транспортным средствам в республиканском государственном предприятии, подведомственном Министерству юстиции Республики Казахстан
  kaz: Қазақстан Республикасы Әділет министрлігінің ведомстволық бағынысты, республикалық мемлекеттік кәсіпорындағы арнайы көлік құралдарының тиістілік нормативтерін белгілеу және автокөлікті арнайы көлік құралдарына жатқызу өлшемшарттарын айқындау туралы
