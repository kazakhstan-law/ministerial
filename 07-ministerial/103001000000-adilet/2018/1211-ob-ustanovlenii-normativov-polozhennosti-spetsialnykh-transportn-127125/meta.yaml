  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 11 декабря 2018 года № 1585 «Об установлении нормативов положенности специальных транспортных средств и определении критериев отнесения автотранспорта к специальным транспортным средствам в республиканском государственном предприятии, подведомственном Министерству юстиции Республики Казахстан»
    kaz: «Қазақстан Республикасы Әділет министрлігінің ведомстволық бағынысты, республикалық мемлекеттік кәсіпорындағы арнайы көлік құралдарының тиістілік нормативтерін белгілеу және автокөлікті арнайы көлік құралдарына жатқызу өлшемшарттарын айқындау туралы» Қазақстан Республикасы Әділет министрінің 2018 жылғы 11 желтоқсандағы № 1585 бұйрығына өзгерістер енгізу туралы
