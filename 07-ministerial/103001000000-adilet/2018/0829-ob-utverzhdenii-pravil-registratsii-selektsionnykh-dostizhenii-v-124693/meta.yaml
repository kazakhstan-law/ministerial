title:
  rus: Об утверждении Правил регистрации селекционных достижений в Государственном реестре селекционных достижений и выдачи охранных документов и их дубликатов, аннулирования и досрочного прекращения действия патентов
  kaz: Селекциялық жетістіктердің мемлекеттік тізіліміндегі селекциялық жетістіктерді тіркеу және қорғау құжаттары мен олардың телнұсқаларын беру, патенттердің күшін жою және қолданысын мерзімінен бұрын тоқтату қағидаларын бекіту туралы
