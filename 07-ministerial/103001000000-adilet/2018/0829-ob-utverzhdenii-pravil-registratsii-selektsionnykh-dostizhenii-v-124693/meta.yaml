  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 29 августа 2018 года № 1343 «Об утверждении Правил регистрации селекционных достижений в Государственном реестре селекционных достижений и выдачи охранных документов и их дубликатов, аннулирования и досрочного прекращения действия патентов»
    kaz: «Селекциялық жетістіктердің мемлекеттік тізіліміндегі селекциялық жетістіктерді тіркеу және қорғау құжаттары мен олардың телнұсқаларын беру, патенттердің күшін жою және қолданысын мерзімінен бұрын тоқтату қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2018 жылғы 29 тамыздағы № 1343 бұйрығына өзгерістер енгізу туралы
