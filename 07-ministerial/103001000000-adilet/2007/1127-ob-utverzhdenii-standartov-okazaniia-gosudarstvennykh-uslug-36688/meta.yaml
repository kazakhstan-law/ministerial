  title:
    rus: О внесении изменений и дополнений в приказ и.о. Министра юстиции Республики Казахстан от 12 октября 2007 года № 288 "Об утверждении стандартов оказания государственных услуг через центры обслуживания населения" и в приказ Министра юстиции Республики Казахстан от 27 ноября 2007 года № 319 "Об утверждении стандартов оказания государственных услуг"
    kaz: '"Халыққа қызмет көрсету орталықтары арқылы мемлекеттік қызмет көрсетудің стандарттарын бекіту туралы" Қазақстан Республикасы Әділет министрінің м.а. 2007 жылғы 12 қазандағы N 288 бұйрығына және "Мемлекеттік қызмет көрсету стандарттарын бекіту туралы" Қазақстан Республикасы Әділет министрінің 2007 жылғы 27 қарашадағы N 319 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
