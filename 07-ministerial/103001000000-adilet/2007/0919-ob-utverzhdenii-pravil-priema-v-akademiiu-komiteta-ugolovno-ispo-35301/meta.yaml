  title:
    rus: О внесении изменений и дополнений в приказ и.о. Министра юстиции Республики Казахстан от 19 сентября 2007 года № 265 "Об утверждении Правил приема в Костанайский юридический институт Комитета уголовно-исполнительной системы Министерства юстиции Республики Казахстан"
    kaz: '"Қазақстан Республикасы Әділет министрлігі Қылмыстық-атқару жүйесі комитетінің Қостанай заң институтына қабылдау ережесін бекіту туралы" Қазақстан Республикасы Әділет министрінің міндетін атқарушының 2007 жылғы 19 қыркүйектегі N 265 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
