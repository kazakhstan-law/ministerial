  title:
    rus: Об утверждении форм заявлений о регистрации договора уступки на объекты промышленной собственности и лицензионного или сублицензионного договоров на использование объектов промышленной собственности и внесении изменений в приказ и.о. Министра юстиции Республики Казахстан от 23 апреля 2010 года № 136 "Некоторые вопросы правовой охраны объектов промышленной собственности"
    kaz: Өнеркәсіптік меншік объектілеріне басқаға беру шартын және өнеркәсіптік меншік объектілерін пайдалануға лицензиялық немесе сублицензиялық шарттарды тіркеу туралы өтініштер нысандарын бекіту және "Өнеркәсіптік меншік объектілерін құқықтық қорғаудың кейбір мәселелері" Қазақстан Республикасы Әділет министрінің м.а. 2010 жылғы 23 сәуірдегі № 136 бұйрығына өзгерістер енгізу туралы
