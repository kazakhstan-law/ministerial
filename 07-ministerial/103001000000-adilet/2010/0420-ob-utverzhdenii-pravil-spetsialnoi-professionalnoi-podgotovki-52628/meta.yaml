  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 20 апреля 2010 года № 122 "Об утверждении Правил прохождения специальной профессиональной подготовки лицами, впервые поступающими на работу в органы судебной экспертизы Министерства юстиции Республики Казахстан"
    kaz: '"Қазақстан Республикасы Әділет министрлігінің сот сараптамасы органдарына алғаш жұмысқа кіретін адамдардың арнайы кәсіптік даярлықтан өту ережесін бекіту туралы" Қазақстан Республикасы Әділет министрінің 2010 жылғы 20 сәуірдегі № 122 бұйрығына өзгерістер енгізу туралы'
