  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 25 апреля 2017 года № 461 «Об утверждении Правил ведения единой базы данных аналитических и социологических исследований государственных органов Республики Казахстан, финансируемых из республиканского бюджета, в том числе совместных исследований с международными организациями»
    kaz: «Қазақстан Республикасы мемлекеттік органдарының республикалық бюджеттен қаржыландырылатын талдамалық және әлеуметтанушылық зерттеулерінің, оның ішінде халықаралық ұйымдарымен бірлескен зерттеулерінің бірыңғай дерекқорын жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2017 жылғы 25 сәуірдегі № 461 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/155391/rus
