act_code: '111710'
requisite: Приказ Министра юстиции Республики Казахстан от 25 апреля 2017 года № 461. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 апреля 2017 года № 15034
title:
  rus: Об утверждении Правил ведения единой базы данных аналитических, консалтинговых, социологических и иных исследований, финансируемых из республиканского и местных бюджетов, проводимых по заказу государственных органов и местных исполнительных органов Республики Казахстан, их подведомственных организаций, субъектов квазигосударственного сектора, в том числе совместных исследований с международными организациями
  kaz: Қазақстан Республикасының мемлекеттік органдары мен жергілікті атқарушы органдарының, олардың ведомстволық бағыныстағы ұйымдарының, квазимемлекеттік сектор субъектілерінің тапсырысы бойынша жүргізілетін, республикалық және жергілікті бюджеттерден қаржыландырылатын талдамалық, консалтингтік, әлеуметтік және өзге де зерттеулердің, оның ішінде халықаралық ұйымдармен бірлескен зерттеулердің бірыңғай дерекқорын жүргізу қағидаларын бекіту туралы
