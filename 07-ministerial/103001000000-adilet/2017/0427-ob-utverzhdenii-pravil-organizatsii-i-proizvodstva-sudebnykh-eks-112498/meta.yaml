  title:
    rus: О внесении изменений и дополнений в приказы Министра юстиции Республики Казахстан от 28 марта 2017 года № 310 «Об утверждении стандартов и требований к специально оснащенным помещениям для производства судебной экспертизы» и от 27 апреля 2017 года № 484 «Об утверждении Правил организации и производства судебных экспертиз и исследований в органах судебной экспертизы»
    kaz: Қазақстан Республикасы Әділет министрінің «Сот сараптамасын жүргізуге арналған арнайы жарақтандырылған үй-жайларға қойылатын стандарттар мен талаптарды бекіту туралы» 2017 жылғы 28 наурыздағы № 310 және «Сот сараптамасы органдарында сот сараптамалары мен зерттеулерді ұйымдастыру және жүргізу қағидаларын бекіту туралы» 2017 жылғы 27 сәуірдегі № 484 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
