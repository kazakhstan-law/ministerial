  title:
    rus: О внесении изменений в приказы Министра юстиции Республики Казахстан от 28 марта 2017 года № 310 «Об утверждении стандартов и требований к специально оснащенным помещениям для производства судебной экспертизы» и от 30 марта 2017 года № 325 «Об утверждении Правил определения стоимости производства судебной экспертизы в органах судебной экспертизы»
    kaz: Қазақстан Республикасы Әділет министрінің 2019 жылғы 28 наурыздағы № 310 «Сот сараптамасын жүргізуге арналған арнайы жарақтандырылған үй-жайларға қойылатын стандарттар мен талаптарды бекіту туралы» және 2019 жылғы 30 наурыздағы № 325 «Сот сараптамасы органдарында сот сараптамасын жүргізудің құнын айқындау қағидаларын бекіту туралы» бұйрықтарына өзгерістер енгізу туралы
