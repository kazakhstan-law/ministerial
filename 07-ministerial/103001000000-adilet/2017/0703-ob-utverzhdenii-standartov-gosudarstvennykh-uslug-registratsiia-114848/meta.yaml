requisite: Приказ Министра юстиции Республики Казахстан от 3 июля 2017 года № 857. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 августа 2017 года № 15587. Утратил силу приказом Министра юстиции Республики Казахстан от 11 октября 2018 года № 1481 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
