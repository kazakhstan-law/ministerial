act_code: '112554'
requisite: Приказ Министра юстиции Республики Казахстан от 25 апреля 2017 года № 462. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 мая 2017 года № 15153. Утратил силу приказом и.о. Министра юстиции Республики Казахстан от 28 сентября 2017 года № 1202 (вводится в действие для городов районного значения, сел, поселков, сельских округов с численностью населения более двух тысяч человек с 01.01.2018 и для городов районного значения, сел, поселков, сельских округов с численостью населения две тысячи и менее человек с 01.01.2020)
title:
  rus: Об утверждении Типового устава (общего положения) государственного учреждения, за исключением государственного учреждения, являющегося государственным органом и Типового устава государственного предприятия
  kaz: Мемлекеттік орган болып табылатын мемлекеттік мекемені қоспағанда, мемлекеттік мекеменің үлгілік жарғысын (жалпы ережесін) және Мемлекеттік кәсіпорынның үлгілік жарғысын бекіту туралы
