  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 6 мая 2013 года № 156 «Об утверждении Правил и сроков внесения в информационную систему правового кадастра идентификационных и технических сведений зданий, сооружений и (или) их составляющих на вновь созданное недвижимое имущество, проведения государственного технического обследования, Правил оказания государственной услуги «Выдача дубликата технического паспорта недвижимого имущества» и Правил присвоения кадастрового номера первичным и вторичным объектам недвижимости»
    kaz: «Құқықтық кадастрдың ақпараттық жүйесіне ғимараттардың, құрылысжайлардың және (немесе) олардың құрамдастарының жаңадан құрылған жылжымайтын мүлікке сәйкестендіру және техникалық мәліметтерін енгізу, мемлекеттік техникалық зерттеп-қарау жүргізу қағидалары мен мерзімдерін «Жылжымайтын мүліктің техникалық паспортының телнұсқасын беру» мемлекеттік қызмет көрсету қағидаларын және Жылжымайтын мүліктің бастапқы және кейінгі объектілеріне кадастрлық нөмір беру қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2013 жылғы 6 мамырдағы № 156 бұйрығына өзгерістер енгізу туралы
