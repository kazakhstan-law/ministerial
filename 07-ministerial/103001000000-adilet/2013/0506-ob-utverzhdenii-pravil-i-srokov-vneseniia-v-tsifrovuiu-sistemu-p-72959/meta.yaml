  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 6 мая 2013 года № 156 «Об утверждении Правил и сроков проведения государственного технического обследования недвижимого имущества и Правил присвоения кадастрового номера первичным и вторичным объектам недвижимости»
    kaz: «Жылжымайтын мүлікке мемлекеттік техникалық тексеру жүргізу қағидасы мен мерзімін және Жылжымайтын мүліктің бастапқы және кейінгі объектілеріне кадастрлық нөмір беру қағидасын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2013 жылғы 6 мамырдағы № 156 бұйрығына өзгерістер енгізу туралы
