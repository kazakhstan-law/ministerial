  title:
    rus: О внесении изменения в приказ Министра юстиции Республики Казахстан от 6 мая 2013 года № 156 «Об утверждении Правил и сроков внесения в информационную систему правового кадастра идентификационных и технических сведений недвижимого имущества на вновь созданное недвижимое имущество, проведения государственного технического обследования недвижимого имущества, Правил оказания государственной услуги «Выдача дубликата кадастрового паспорта объекта недвижимости» и Правил присвоения кадастрового номера первичным и вторичным объектам недвижимости»
    kaz: «Құқықтық кадастрдың ақпараттық жүйесіне құрылған жылжымайтын мүлікке жылжымайтын мүліктің сәйкестендіру және техникалық мәліметтерін енгізу, мемлекеттік техникалық зерттеп-қарауды жүргізу қағидалары мен мерзімдерін, «Жылжымайтын мүлік объектісінің кадастрлық паспортының телнұсқасын беру» мемлекеттік қызмет көрсету қағидаларын және Жылжымайтын мүліктің бастапқы және кейінгі объектілеріне кадастрлық нөмір беру қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2013 жылғы 6 мамырдағы № 156 бұйрығына өзгеріс енгізу туралы
