act_code: '72959'
requisite: Приказ Министра юстиции Республики Казахстан от 6 мая 2013 года № 156. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 мая 2013 года № 8469
title:
  rus: Об утверждении Правил и сроков внесения в цифровую систему правового кадастра идентификационных и технических сведений недвижимого имущества на вновь созданное недвижимое имущество, проведения государственного технического обследования недвижимого имущества, Правил оказания государственной услуги «Выдача дубликата кадастрового паспорта объекта недвижимости» и Правил присвоения кадастрового номера первичным и вторичным объектам недвижимости
  kaz: Жаңадан құрылған жылжымайтын мүлікке жылжымайтын мүліктің сәйкестендіру және техникалық мәліметтерін құқықтық кадастрдың цифрлық жүйесіне енгізу, жылжымайтын мүлікке мемлекеттік техникалық зерттеп-қарауды жүргізу қағидалары мен мерзімдерін, «Жылжымайтын мүлік объектісінің кадастрлық паспортының телнұсқасын беру» мемлекеттік қызмет көрсету қағидаларың және Бастапқы және кейінгі жылжымайтын мүлік объектілеріне кадастрлық нөмір беру қағидаларын бекіту туралы
