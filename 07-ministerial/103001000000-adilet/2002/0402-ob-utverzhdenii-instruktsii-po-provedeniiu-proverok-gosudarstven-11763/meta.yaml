title:
  rus: Об утверждении Инструкции по проведению проверок государственных органов Республики Казахстан органами юстиции по соблюдению законодательства, регулирующего издание, применение, государственную регистрацию и опубликование нормативных правовых актов
  kaz: Әдiлет органдарының Қазақcтан Республикасының мемлекеттiк органдарын нормативтiк құқықтық актiлердi шығаруды, қолдануды, мемлекеттiк тiркеу мен жариялауды реттейтiн заңнаманы сақтау бойынша тексерулердi жүргiзу жөнiндегi нұсқаулықты бекiту туралы
