  title:
    rus: О внесении изменений и дополнения в Приказ Министра юстиции Республики Казахстан от 3 апреля 2002 года № 48 "Об утверждении Инструкции по проведению проверок государственных органов Республики Казахстан органами юстиции по соблюдению законодательства, регулирующего издание, применение, государственную регистрацию и опубликование нормативных правовых актов"
    kaz: '"Әдiлет органдарының Қазақcтан Республикасының мемлекеттiк органдарын нормативтiк құқықтық актiлердi шығаруды, қолдануды, мемлекеттiк тiркеу мен жариялауды реттейтiн заңнаманы сақтау бойынша тексерулердi жүргiзу жөнiндегi Нұсқаулықты бекiту туралы" Қазақстан Республикасы Әділет министрінің 2002 жылғы 3 сәуірдегі N 48 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
