  title:
    rus: О внесении изменений и дополнений в Приказ Министра юстиции Республики Казахстан от 3 апреля 2002 года № 48 "Об утверждении Инструкции по проведению проверок государственных органов Республики Казахстан органами юстиции по соблюдению законодательства, регулирующего издание, применение, государственную регистрацию и опубликование нормативных правовых актов"
    kaz: '"Әділет органдарының Қазақcтан Республикасының мемлекеттік органдарын нормативтік құқықтық актілерді шығаруды, қолдануды, мемлекеттік тіркеу мен жариялауды реттейтін заңнаманы сақтау бойынша тексерулерді жүргізу жөніндегі Нұсқаулықты бекіту туралы" Қазақстан Республикасы Әділет министрінің 2002 жылғы 3 сәуірдегі N 48 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/22919/rus
