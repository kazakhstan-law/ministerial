  title:
    rus: О внесении изменения в приказ Министра юстиции Республики Казахстан от 3 апреля 2002 года № 48 "Об утверждении Инструкции по проведению проверок государственных органов Республики Казахстан органами юстиции по соблюдению законодательства, регулирующего издание, применение, государственную регистрацию и опубликование нормативных правовых актов" и признании утратившими силу некоторых приказов Министра юстиции Республики Казахстан
    kaz: '"Әдiлет органдарының Қазақcтан Республикасының мемлекеттiк органдарын нормативтiк құқықтық актiлердi шығаруды, қолдануды, мемлекеттiк тiркеу мен жариялауды реттейтiн заңнаманы сақтау бойынша тексерулердi жүргiзу жөнiндегi Нұсқаулықты бекiту туралы" Қазақстан Республикасы Әділет министрінің 2002 жылғы 3 сәуірдегі № 48 бұйрығына өзгеріс енгізу» және Қазақстан Республикасы Әділет министрінің кейбір бұйрықтарының күші жойылды деп тану туралы'
  link: https://zan.gov.kz/client/#!/doc/29900/rus
