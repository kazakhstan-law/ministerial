  title:
    rus: О внесении изменения в приказ Министра юстиции Республики Казахстан от 3 апреля 2002 года № 48 "Об утверждении Инструкции по проведению проверок государственных органов Республики Казахстан органами юстиции по соблюдению законодательства, регулирующего издание, применение, государственную регистрацию и опубликование нормативных правовых актов"
    kaz: Қазақстан Республикасы Әділет министрінің 2002 жылғы 3 сәуірдегі № 48 "Әділет органдарының Қазақстан Республикасының мемлекеттік органдарын нормативтік құқықтық актілерді шығаруды, қолдануды, мемлекеттік тіркеу мен жариялауды реттейтін заңнаманы сақтау бойынша тексерулерді жүргізу жөніндегі нұсқаулықты бекіту туралы" бұйрығына өзгеріс енгізу туралы
