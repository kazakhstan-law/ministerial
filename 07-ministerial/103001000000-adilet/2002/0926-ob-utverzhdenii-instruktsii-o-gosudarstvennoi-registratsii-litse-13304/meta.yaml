  requisite: Приказ Министра юстиции Республики Казахстан от 5 марта 2009 года № 21. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 апреля 2009 года № 5631. Утратил силу приказом и.о. Министра юстиции Республики Казахстан от 22 апреля 2010 года № 131
  title:
    rus: О внесении изменений и дополнений в приказы Министра юстиции Республики Казахстан от 27 сентября 2002 года № 145 "Об утверждении Инструкции о государственной регистрации лицензионных договоров на использование произведений и объектов смежных прав" и от 27 сентября 2002 года № 146 "Об утверждении Инструкции о государственной регистрации прав на произведения, охраняемые авторским правом и смежными правами"
    kaz: '"Туындылар мен сабақтас құқықтар объектілерін пайдалануға лицензиялық шарттарды мемлекеттік тіркеу туралы нұсқаулықты бекіту туралы" Қазақстан Республикасы Әділет министрінің 2002 жылғы 27 қыркүйектегі N 145 бұйрығына және "Авторлық құқықпен және сабақтас құқықтармен қорғалатын туындыларға құқықтарды мемлекеттік тіркеу туралы нұсқаулықты бекіту туралы" 2002 жылғы 27 қыркүйектегі N 146 бұйрығына өзгерістер мен толықтырулар енгізу туралы"'
  link: https://zan.gov.kz/client/#!/doc/45288/rus
