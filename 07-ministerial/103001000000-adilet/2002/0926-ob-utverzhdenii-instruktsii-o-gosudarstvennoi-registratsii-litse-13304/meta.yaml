requisite: Приказ Министра юстиции Республики Казахстан от 27 сентября 2002 года N 145. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 сентября 2002 года N 1987. Утратил силу приказом и.о. Министра юстиции Республики Казахстан от 22 апреля 2010 года N 131
title:
  rus: Об утверждении Инструкции о государственной регистрации лицензионных договоров на использование произведений и объектов смежных прав
  kaz: Туындылар мен сабақтас құқықтар объектілерін пайдалануға арналған лицензиялық шарттарды мемлекеттік тіркеу туралы нұсқаулықты бекіту туралы
