  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 23 ноября 2002 года № 179 "Об утверждении правил по применению субъектами оценочной деятельности требований к качеству выполнения работ по оценке, используемым принципам оценки", зарегистрированный за № 2071
    kaz: '"Бағалау қызметi субъектiлерiнiң, бағалау принциптерiмен пайдаланатын бағалау жөніндегі жұмыстарының орындалу сапасына қойылатын талаптарды қолдануы жөнiндегi ереженi бекiту туралы" N 2071 болып тiркелген Қазақстан Республикасы Әдiлет министрiнiң 2002 жылғы 23 қарашадағы N 179 бұйрығына өзгерiстер енгiзу туралы'
