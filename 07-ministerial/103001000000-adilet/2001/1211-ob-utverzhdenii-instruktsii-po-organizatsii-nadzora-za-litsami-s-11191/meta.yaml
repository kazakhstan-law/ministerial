  title:
    rus: О внесении изменений и дополнений в приказ Министра юстиции Республики Казахстан от 11 декабря 2001 года № 154 "Об утверждении Инструкции по организации надзора и охраны за лицами, содержащимися в исправительных учреждениях Министерства юстиции Республики Казахстан", зарегистрированный за № 1723
    kaz: № 1723 болып тіркелген "Қазақстан Республикасы Әділет министрлігі түзеу мекемелерінде ұсталатын адамдарды қадағалау мен күзетуді ұйымдастыру жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Әділет министрінің 2001 жылғы 11 желтоқсандағы № 154 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы
