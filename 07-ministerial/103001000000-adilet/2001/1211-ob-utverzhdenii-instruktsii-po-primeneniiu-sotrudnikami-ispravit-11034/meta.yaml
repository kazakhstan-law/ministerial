requisite: Приказ Министра юстиции Республики Казахстан от 11 декабря 2001 года № 146. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 декабря 2001 года № 1718. Утратил силу приказом и.о. Министра юстиции Республики Казахстан от 24 мая 2011 года № 194
title:
  rus: Об утверждении Инструкции по применению сотрудниками исправительных учреждений Комитета уголовно-исполнительной системы Министерства юстиции Республики Казахстан специальных средств
  kaz: Қазақстан Республикасы Әділет Министрлігі ҚАЖ Комитетінің түзеу мекемелері қызметкерлерінің арнайы құралдарды қолдану тәртібі туралы Нұсқаулықты бекіту туралы
