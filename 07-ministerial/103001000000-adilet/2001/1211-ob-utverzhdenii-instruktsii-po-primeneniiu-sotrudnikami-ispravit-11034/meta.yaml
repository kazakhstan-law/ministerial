  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 11 декабря 2001 года N 146 "Об утверждении Инструкции по применению сотрудниками исправительных учреждений Комитета уголовно-исполнительной системы Министерства юстиции Республики Казахстан специальных средств", зарегистрированный за N 1718
    kaz: N 1718 болып тіркелген "Қазақстан Республикасы Әділет министрлігінің ҚАЖ комитеті түзеу мекемелері қызметкерлерінің арнайы құралдарды қолдану жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Әділет министрінің 2001 жылғы 11 желтоқсандағы N 146 бұйрығына өзгерістер енгізу туралы
