  title:
    rus: О внесении изменения и дополнения в приказ Министра юстиции Республики Казахстан от 11 декабря 2001 года № 146 "Об утверждении Инструкции по применению сотрудниками исправительных учреждений Комитета уголовно-исполнительной системы Министерства юстиции Республики Казахстан специальных средств", зарегистрированный за № 1718
    kaz: № 1718 болып тіркелген "Қазақстан Республикасы Әділет министрлігі ҚАЖ комитетінің түзеу мекемелері қызметкерлерінің арнайы құралдарды қолдану тәртібі туралы нұсқаулықты бекіту туралы" Қазақстан Республикасы Әділет министрінің 2001 жылғы 11 желтоқсандағы № 146 бұйрығына өзгеріс пен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/19935/rus
