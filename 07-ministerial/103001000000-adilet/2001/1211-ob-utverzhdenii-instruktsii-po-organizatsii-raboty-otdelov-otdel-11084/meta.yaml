act_code: '11084'
requisite: Приказ Министра юстиции Республики Казахстан от 11 декабря 2001 года № 150. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 декабря 2001 года № 1719. Утратил силу приказом Министра внутренних дел Республики Казахстан от 25 октября 2012 года № 572
title:
  rus: Об утверждении Инструкции по организации работы отделов (отделений, групп) специального учета исправительных учреждений и следственных изоляторов (в части исполнения наказания в виде ареста) Министерства юстиции Республики Казахстан
  kaz: Қазақстан Республикасы Әдiлет министрiнiң түзеу мекемелерiндегi және қамауға алу түріндегі жазаны орындау бөлігінде тергеу изоляторларындағы арнайы есепке алу бөлімдерінің (бөлiмшелерiнiң, топтарының) жұмысын ұйымдастыру жөніндегі Нұсқаулықты бекiту туралы
