  title:
    rus: Об утверждении Правил изъятия государственных наград Республики Казахстан и документов к ним уголовно-исполнительными инспекциями Комитета уголовно-исполнительной системы Министерства юстиции Республики Казахстан
    kaz: Қазақстан Республикасы Әділет министрлігі Қылмыстық-атқару жүйесі комитетінің қылмыстық-атқару инспекцияларының мемлекеттік наградаларды және оларға қоса берілген құжаттарын алып қою ережелерін бекіту туралы
