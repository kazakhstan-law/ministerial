  title:
    rus: О внесении изменений и дополнений в приказ Министра юстиции Республики Казахстан от 11 декабря 2001 года № 150 "Об утверждении Инструкции по организации работы отделов (отделений, групп) специального учета исправительных учреждений Министерства юстиции Республики Казахстан"
    kaz: '"Қазақстан Республикасы Әділет министрлігінің түзеу мекемелеріндегі арнайы есепке алу бөлімдерінің (бөлімшелерінің, топтарының) жұмысын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Әділет министрінің 2001 жылғы 11 желтоқсандағы № 150 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
