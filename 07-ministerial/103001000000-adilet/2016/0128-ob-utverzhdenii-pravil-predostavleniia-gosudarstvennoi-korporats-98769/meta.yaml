requisite: Приказ Министра юстиции Республики Казахстан от 28 января 2016 года № 48. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 февраля 2016 года № 13042. Утратил силу приказом и.о. Министра юстиции Республики Казахстан от 31 июля 2018 года № 1192 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил предоставления Государственной корпорацией "Правительство для граждан" статистической и иной отчетной информации в области государственного технического обследования зданий, сооружений и (или) их составляющих
  kaz: '"Азаматтарға арналған үкімет" мемлекеттік корпорацияның ғимараттарды, құрылыстарды және (немесе) олардың құрамдастарын мемлекеттік техникалық зерттеп-қарау саласындағы статистикалық және өзге есептілікті ұсыну қағидаларын бекіту туралы"'
