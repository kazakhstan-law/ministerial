  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 28 января 2016 года № 48 «Об утверждении Правил предоставления Государственной корпорацией «Правительство для граждан» статистической и иной отчетной информации в области государственного технического обследования зданий, сооружений и (или) их составляющих»
    kaz: «Азаматтарға арналған үкімет» мемлекеттік корпорациясының ғимараттарды, құрылыстарды және (немесе) олардың құрамдастарын мемлекеттік техникалық зерттеп-қарау саласындағы статистикалық және өзге есептілікті ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2016 жылғы 28 қаңтардағы № 48 бұйрығына өзгерістер енгізу туралы
