requisite: Приказ Министра юстиции Республики Казахстан от 24 февраля 2012 года № 91. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 апреля 2012 года № 7518. Утратил силу приказом и.о. Министра юстиции Республики Казахстан от 25 августа 2018 года № 1302 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
