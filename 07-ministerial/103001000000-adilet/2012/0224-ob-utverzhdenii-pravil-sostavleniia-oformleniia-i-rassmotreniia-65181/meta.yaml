  kaz: Өнеркәсiп үлгiсiне өтiнiмдi жасау, ресiмдеу және қарау, мәлiметтердi Қазақстан Республикасының өнеркәсiптік үлгiлерiнiң мемлекеттiк тiзiлiмiне енгiзу, сондай-ақ қорғау құжатын беру қағидаларын бекіту туралы
