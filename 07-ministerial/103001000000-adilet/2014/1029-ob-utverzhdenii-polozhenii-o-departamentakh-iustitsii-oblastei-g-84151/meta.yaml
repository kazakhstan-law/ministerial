    kaz: «Қазақстан Республикасы Әділет министрлігінің облыстардағы, Астана және Алматы қалаларындағы Әділет департаменттері туралы ережелерін бекіту туралы» Қазақстан Республикасы Әділет Министрінің 2014 жылғы 29 қазандағы № 304 бұйрығына өзгеріс енгізу туралы
