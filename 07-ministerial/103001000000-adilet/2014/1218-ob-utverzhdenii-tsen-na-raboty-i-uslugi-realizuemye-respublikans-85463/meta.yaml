  title:
    rus: О внесении изменения в приказ Министра юстиции Республики Казахстан от 18 декабря 2014 года № 368 «Об утверждении цен на работы и услуги, реализуемые республиканским государственным предприятием на праве хозяйственного ведения «Национальный институт интеллектуальной собственности» Министерства юстиции Республики Казахстан»
    kaz: Қазақстан Республикасы Әділет министрлігінің «Ұлттық зияткерлік меншік институты» шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорны іске асыратын жұмыстарға және қызметтерге бағаларды бекіту туралы» Қазақстан Республикасы Әділет министрінің 2014 жылғы 18 желтоқсандағы № 368 бұйрығына өзгеріс енгізу туралы
