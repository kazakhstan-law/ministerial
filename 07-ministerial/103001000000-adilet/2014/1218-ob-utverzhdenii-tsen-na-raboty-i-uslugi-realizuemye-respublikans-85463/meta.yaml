title:
  rus: Об утверждении цен на работы и услуги, реализуемые республиканским государственным предприятием на праве хозяйственного ведения "Национальный институт интеллектуальной собственности" Министерства юстиции Республики Казахстан
  kaz: '"Қазақстан Республикасы Әділет министрлігінің "Ұлттық зияткерлік меншік институты" шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорны іске асыратын жұмыстарға және қызметтерге бағаларды бекіту туралы"'
