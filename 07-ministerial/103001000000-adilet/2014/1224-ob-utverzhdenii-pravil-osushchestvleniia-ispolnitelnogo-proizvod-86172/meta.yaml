requisite: Приказ Министра юстиции Республики Казахстан от 24 декабря 2014 года № 371. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 января 2015 года № 10114
title:
  rus: Об утверждении Правил осуществления исполнительного производства по взысканию с государства сумм капитализации соответствующих повременных платежей по возмещению вреда, причиненного жизни и здоровью работников, в случае отсутствия или недостаточности имущества у ликвидируемого юридическою лица, признанного в установленном порядке ответственным за данный вред
  kaz: Қызметкерлердің өмірі мен денсаулығына келтірілген зиян үшін белгіленген тәртіппен жауапты деп танылған таратылатын заңды тұлғаның мүлкі жоқ немесе жеткіліксіз болған жағдайда, осы зиянды өтеу жөніндегі тиісті мерзімдік төлемдерді капиталдандыру сомасын мемлекеттен өндіріп алу жөніндегі атқарушылық іс жүргізуді жүзеге асыру ережесін бекіту туралы
