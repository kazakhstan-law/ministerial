    kaz: «Жылжымайтын мүлік объектілеріне бастапқы және кейінгі мемлекеттік техникалық тексеру нұсқаулығын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2014 жылғы 13 ақпандағы № 57 бұйрығына өзгерістер мен толықтыру енгізу туралы
