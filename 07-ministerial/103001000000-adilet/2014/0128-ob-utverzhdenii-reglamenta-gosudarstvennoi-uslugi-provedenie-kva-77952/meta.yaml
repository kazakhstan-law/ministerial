title:
  rus: Об утверждении регламента государственной услуги "Проведение квалификационного экзамена и выдача лицензии, переоформление, выдача дубликатов лицензии на право занятия деятельностью частного судебного исполнителя"
  kaz: '"Жеке сот орындаушысы қызметімен айналысу құқығына біліктілік емтиханын өткізу және лицензия беру, қайта ресімдеу, лицензияның телнұсқаларын беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'
