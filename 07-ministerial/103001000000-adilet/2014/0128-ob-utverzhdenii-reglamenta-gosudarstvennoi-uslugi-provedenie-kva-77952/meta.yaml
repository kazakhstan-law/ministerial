    kaz: '"Жеке сот орындаушыcы қызметiмен айналысу құқығына біліктілік емтиханын өткізу және лицензия беру, қайта ресімдеу, лицензияның телнұсқаларын беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" Қазақстан Республикасы Әділет министрінің 2014 жылғы 28 қаңтардағы № 26 бұйрығына толықтырулар енгізу'
