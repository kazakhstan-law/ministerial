act_code: '22695'
requisite: Приказ и.о. Министра юстиции Республики Казахстан от 15 декабря 2004 года № 362. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 января 2005 года № 3372. Утратил силу приказом Министра юстиции Республики Казахстан от 23 июня 2023 года № 407 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по применению минимальных ставок авторского вознаграждения за использование произведений путем публичного исполнения, публичного сообщения, за воспроизведение и (или) распространение произведений
  kaz: Туындыларды көпшілік алдында орындау, көпшiлiкке хабарлау жолымен пайдаланғаны үшін, туындыларды қайта шығарғаны және (немесе) таратқаны үшiн авторлық сыйақының ең төменгi ставкаларын қолдану тәртiбi жөнiндегі нұсқаулықты бекiту туралы
