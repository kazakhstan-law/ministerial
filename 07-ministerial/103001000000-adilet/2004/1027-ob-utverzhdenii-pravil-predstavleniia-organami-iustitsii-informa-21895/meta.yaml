act_code: '21895'
requisite: Приказ Министра юстиции Республики Казахстан от 28 октября 2004 года N 316. Зарегистрирован Министерством юстиции Республики Казахстан от 11 ноября 2004 года N 3203. Утратил силу приказом и.о. Министра юстиции Республики Казахстан от 22 апреля 2010 года № 132
title:
  rus: Об утверждении Правил представления органами юстиции информации по регистрации прав на недвижимое имущество и сделок с ним в кредитные бюро на основании заключаемых с ними договоров
  kaz: Әділет органдарының жылжымайтын мүлікке құқықтарды және онымен жасалатын мәмілелерді тіркеу жөніндегі ақпаратты кредиттік бюроға олармен жасалған шарттардың негізінде ақпарат беру ережесін бекіту туралы
