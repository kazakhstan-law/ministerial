  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 28 октября 2004 года № 316 "Об утверждении Правил представления государственными предприятиями, осуществляющими регистрацию прав на недвижимое имущество и сделок с ним, информации в кредитные бюро на основании заключаемых с ними договоров"
    kaz: '"Жылжымайтын мүлікке құқықтарды және онымен жасалатын мәмілелерді тіркеуді жүзеге асыратын мемлекеттік кәсіпорындардың кредиттік бюроға олармен жасалған шарттардың негізінде ақпарат беру ережесін бекіту туралы" Қазақстан Республикасы Әділет министрінің 2004 жылғы 28 қазандағы № 316 бұйрығына өзгерістер енгізу туралы'
