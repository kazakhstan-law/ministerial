  title:
    rus: Об утверждении Перечня видов экспертиз, производимых в Центре судебной экспертизы Министерства юстиции Республики Казахстан, и экспертных специальностей, квалификация по которым присваивается Министерством юстиции Республики Казахстан
    kaz: Қазақстан Республикасы Әділет министрлігінің сот сараптамасы Орталығында жүргізілетін сараптамалар мен Қазақстан Республикасы Әділет министрлігінің біліктілік дәрежесін бекітетін сарапшылық мамандықтары түрлерінің Тізбесіне өзгерістер мен толықтырулар енгізу туралы
