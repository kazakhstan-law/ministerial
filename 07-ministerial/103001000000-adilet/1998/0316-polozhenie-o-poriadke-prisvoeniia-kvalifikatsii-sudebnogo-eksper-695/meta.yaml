act_code: '695'
requisite: Утверждено приказом Министра юстиции Республики Казахстан от 16 марта 1998 года № 181. Зарегистрированo в Министерстве юстиции Республики Казахстан 27 апреля 1998 года № 508. Приказ утратил силу приказом и.о. Министра юстиции Республики Казахстан от 5 августа 2005 года № 214
title:
  rus: Положение о порядке присвоения квалификации судебного эксперта в Центре судебной экспертизы Министерства юстиции Республики Казахстан
  kaz: Қазақстан Республикасы Әділет Министрлігінің Сот сараптамасы орталығында сот сарапшысы біліктілігін берудің тәртібі туралы ереже
