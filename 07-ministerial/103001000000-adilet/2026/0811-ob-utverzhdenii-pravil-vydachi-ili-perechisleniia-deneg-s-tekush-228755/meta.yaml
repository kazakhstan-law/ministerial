requisite: Приказ Министра юстиции Республики Казахстан от 11 августа 2026 года № 774. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 августа 2026 года № 39566
title:
  rus: Об утверждении Правил выдачи или перечисления денег с текущего счета частного судебного исполнителя, предназначенного для хранения взысканных сумм в пользу взыскателей, а также распределения взысканных денег по исполнительным производствам, находящимся у иных судебных исполнителей, и распределения денег для оплаты их деятельности
  kaz: «Өндіріп алушылардың пайдасына өндіріп алынған сомаларды сақтауға арналған жеке сот орындаушысының ағымдағы шотынан ақшаны беру немесе аудару, сондай-ақ өндіріп алынған ақшаны өзге сот орындаушыларындағы атқарушылық іс жүргізулер бойынша бөлу және олардың қызметіне ақы төлеуге арналған ақшаны бөлу қағидаларын бекіту туралы»
