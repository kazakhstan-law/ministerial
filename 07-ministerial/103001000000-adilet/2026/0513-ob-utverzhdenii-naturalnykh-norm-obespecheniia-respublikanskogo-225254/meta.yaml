act_code: '225254'
requisite: Приказ Министра юстиции Республики Казахстан от 13 мая 2026 года № 441
title:
  rus: «Об утверждении натуральных норм обеспечения Республиканского государственного казенного предприятия «Центр судебных экспертиз Министерства юстиции Республики Казахстан» служебными и дежурными автомобилями, телефонной связью, офисной мебелью и площадями для их размещения»
  kaz: «Қазақстан Республикасы Әділет министрлігінің Сот сараптамалары орталығы» Республикалық мемлекеттік қазыналық кәсіпорнын қызметтік және кезекші автомобильдермен, телефон байланысымен, кеңсе жиһазымен және оларды орналастыруға арналған алаңдармен қамтамасыз етудің заттай нормаларын бекіту туралы»
