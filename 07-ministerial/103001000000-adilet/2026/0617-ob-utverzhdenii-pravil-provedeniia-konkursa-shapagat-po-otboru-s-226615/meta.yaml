title:
  rus: Об утверждении Правил проведения конкурса «Шапағат» по отбору социально и экономически значимых, конкурентоспособных, экологически безопасных изобретений, а также присвоения звания «Заслуженный изобретатель» для авторов наиболее важных и широко используемых изобретений
  kaz: «Шапағат» конкурсын өткізу ережелерін бекіту туралы, әлеуметтік және экономикалық маңызы бар, бәсекеге қабілетті, экологиялық қауіпсіз өнертабыстарды іріктеу, сондай-ақ аса маңызды және кеңінен қолданылатын өнертабыстардың авторларына «Еңбек сіңірген өнертапқыш» атағын беру туралы
