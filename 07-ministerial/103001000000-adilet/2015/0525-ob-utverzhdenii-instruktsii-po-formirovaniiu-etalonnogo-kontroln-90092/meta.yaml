    kaz: '"Қазақстан Республикасы Нормативтік құқықтық актілерінің эталондық бақылау банкін қалыптастыру, сондай-ақ оған мәліметтер енгізу жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Әділет министрінің 2015 жылғы 25 мамырдағы № 286 бұйрығына өзгерістер енгізу туралы'
