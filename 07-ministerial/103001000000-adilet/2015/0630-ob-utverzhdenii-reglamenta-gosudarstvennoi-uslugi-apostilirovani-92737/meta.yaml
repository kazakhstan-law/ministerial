    kaz: «Қазақстан Республикасының әділет органдарынан және өзге мемлекеттік органдарынан, сондай-ақ нотариустардан шығатын ресми құжаттарға апостиль қою» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Қазақстан Республикасы Әділет министрінің 2015 жылғы 30 маусымдағы № 367 бұйрығына өзгерістер енгізу туралы
