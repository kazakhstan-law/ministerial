title:
  rus: Об утверждении регламента государственной услуги «Апостилирование официальных документов, исходящих из органов юстиции и иных государственных органов, а также нотариусов Республики Казахстан»
  kaz: «Қазақстан Республикасының әділет органдарынан және өзге мемлекеттік органдарынан, сондай-ақ нотариустардан шығатын ресми құжаттарға апостиль қою» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
