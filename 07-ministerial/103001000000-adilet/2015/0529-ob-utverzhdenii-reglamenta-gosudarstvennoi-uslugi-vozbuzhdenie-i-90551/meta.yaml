title:
  rus: Об утверждении регламента государственной услуги "Возбуждение исполнительного производства на основании исполнительного документа по заявлению взыскателя"
  kaz: '"Өндіріп алушының өтініші бойынша атқарушылық құжаттың негізінде атқарушылық іс жүргізуді қозғау" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'
