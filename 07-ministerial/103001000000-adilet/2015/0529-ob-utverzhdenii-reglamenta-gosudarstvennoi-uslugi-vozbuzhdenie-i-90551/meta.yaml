  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра юстиции Республики Казахстан от 29 мая 2015 года № 307 «Об утверждении регламента государственной услуги «Возбуждение исполнительного производства на основании исполнительного документа по заявлению взыскателя»
    kaz: «Өндіріп алушының өтініші бойынша атқарушылық құжаттың негізінде атқарушылық іс жүргізуді қозғау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Қазақстан Республикасы Әділет министрінің міндетін атқарушының 2015 жылғы 29 мамырдағы № 307 бұйрығына өзгеріс енгізу туралы
