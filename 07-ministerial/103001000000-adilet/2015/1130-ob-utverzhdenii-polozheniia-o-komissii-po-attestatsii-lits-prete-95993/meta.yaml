    kaz: «Жеке сот орындаушысы қызметімен айналысу құқығына үміткер тұлғаларды аттестаттау бойынша комиссия туралы ережені бекіту туралы» Қазақстан Республикасы Әділет министрінің міндетін атқарушының 2015 жылғы 30 қарашадағы № 599 бұйрығына өзгерістер енгізу туралы
