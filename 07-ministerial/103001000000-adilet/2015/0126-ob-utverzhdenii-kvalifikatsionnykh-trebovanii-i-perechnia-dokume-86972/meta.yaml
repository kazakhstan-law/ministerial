  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 26 января 2015 года № 48 «Об утверждении квалификационных требований и перечня документов, подтверждающих соответствие им, для осуществления судебно-экспертной деятельности, в том числе судебно-экспертной деятельности в области судебно-медицинской, судебно-психиатрической и судебно-наркологической экспертизы»
    kaz: «Сот-сараптама қызметі, соның ішінде сот-медициналық, сот-психиатриялық және сот-наркологиялық сараптамалар саласындағы сот-сараптама қызметiн жүзеге асыру үшiн қойылатын бiлiктiлiк талаптары мен оларға сәйкестiктi растайтын құжаттардың тiзбесiн бекіту туралы» Қазақстан Республикасы Әділет министрінің 2015 жылғы 26 қаңтардағы № 48 бұйрығына өзгерістер енгізу туралы
