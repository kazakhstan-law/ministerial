act_code: '86972'
requisite: Приказ Министра юстиции Республики Казахстан от 26 января 2015 года № 48. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 февраля 2015 года № 10309
title:
  rus: Об утверждении квалификационных требований и перечня документов, подтверждающих соответствие им, для осуществления судебно-экспертной деятельности, в том числе судебно-экспертной деятельности в области судебно-медицинской, судебно-психиатрической и судебно-наркологической экспертизы
  kaz: Сот-сараптама қызметі, соның ішінде сот-медициналық, сот-психиатриялық және сот-наркологиялық сараптамалар саласындағы сот-сараптама қызметiн жүзеге асыру үшiн қойылатын бiлiктiлiк талаптары мен оларға сәйкестiктi растайтын құжаттардың тiзбесiн бекіту туралы
