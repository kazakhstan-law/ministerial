  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 26 января 2015 года № 48 "Об утверждении квалификационных требований и перечня документов, подтверждающих соответствие им, для осуществления судебно-экспертной деятельности, за исключением судебно-экспертной деятельности в области судебно-медицинской, судебно-психиатрической и судебно-наркологической экспертизы"
    kaz: '"Cот-медициналық, сот-психиатриялық және сот-наркологиялық сараптама саласындағы сот-сараптама қызметiн қоспағанда, сот-сараптама қызметiн жүзеге асыру үшiн қойылатын бiлiктiлiк талаптары мен оларға сәйкестiктi растайтын құжаттардың тiзбесiн бекiту туралы" Қазақстан Республикасы Әдiлет министрiнiң 2015 жылғы 26 қаңтардағы № 48 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/103536/rus
