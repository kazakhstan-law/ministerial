    kaz: «Өндіріп алушының өтініші бойынша атқарушылық құжаттың негізінде атқарушылық іс жүргізуді қозғау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасының Әділет министрінің 2015 жылғы 20 сәуірдегі № 221 бұйрығына өзгеріс енгізу туралы
