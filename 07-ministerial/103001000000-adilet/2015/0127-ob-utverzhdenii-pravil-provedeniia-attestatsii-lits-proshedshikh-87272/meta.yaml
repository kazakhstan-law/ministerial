  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 27 января 2015 года № 56 «Об утверждении Правил проведения аттестации лиц, прошедших стажировку и претендующих на занятие адвокатской деятельностью и на право занятия нотариальной деятельностью»
    kaz: «Тағылымдамадан өткен және адвокаттық қызметпен айналысуға және нотариаттық қызметпен айналысу құқығына үміткер адамдарды аттестаттаудан өткізу қағидаларын бекіту туралы»  Қазақстан Республикасы Әділет министрінің 2015 жылғы 27 қаңтардағы № 56 бұйрығына өзгерістер енгізу туралы
