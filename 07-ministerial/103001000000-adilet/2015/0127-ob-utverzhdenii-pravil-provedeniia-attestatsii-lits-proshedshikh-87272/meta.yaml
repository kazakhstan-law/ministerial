  title:
    rus: «Об утверждении Правил проведения аттестации лиц, претендующих на занятие адвокатской деятельностью и внесения изменения в Приказ Министра юстиции Республики Казахстан от 27 января 2015 года № 56 «Об утверждении Правил проведения аттестации лиц, прошедших стажировку и претендующих на занятие адвокатской деятельностью и на право занятия нотариальной деятельностью»
    kaz: Адвокаттық қызметпен айналысуға үмiткер адамдарға аттестаттау жүргізу қағидаларын бекіту туралы және «Тағылымдамадан өткен және адвокаттық қызметпен айналысуға және нотариаттық қызметпен айналысу құқығына үміткер адамдарды аттестаттаудан өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2015 жылғы 27 қаңтардағы № 56 бұйрығына өзгерістер енгізу туралы
