  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 27 февраля 2015 года № 120 "Об утверждении Правил приема квалификационных экзаменов для присвоения квалификации судебного эксперта на право производства определенного вида судебной экспертизы"
    kaz: '"Сот сараптамасының белгiлi бiр түрiн жүргiзу құқығына сот сарапшысы бiлiктiлiгiн беру үшiн бiлiктiлiк емтихандарын қабылдау қағидасын бекiту туралы" Қазақстан Республикасы Әдiлет министрiнiң 2015 жылғы 27 ақпандағы № 120 бұйрығына өзгерістер енгізу туралы"'
