  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра юстиции Республики Казахстан от 28 мая 2015 года № 300 «Об утверждении регламентов государственных услуг по вопросам регистрации прав на недвижимое имущество и регистрации залога движимого имущества, не подлежащего обязательной государственной регистрации»
    kaz: «Жылжымайтын мүлікке құқықтарды тіркеу және міндетті мемлекеттік тіркеуге жатпайтын жылжымалы мүлік кепілін тіркеу мәселелері бойынша мемлекеттік көрсетілетін қызметтердің регламенттерін бекіту туралы» Қазақстан Республикасы Әділет министрінің міндетін атқарушының 2015 жылғы 28 мамырдағы № 300 бұйрығына өзгерістер енгізу туралы
