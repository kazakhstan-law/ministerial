act_code: '90713'
requisite: Приказ и.о. Министра юстиции Республики Казахстан от 29 мая 2015 года № 311. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 июня 2015 года № 11318. Утратил силу приказом Министра юстиции Республики Казахстан от 20 марта 2018 года № 446 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов государственных услуг «Проведение аттестации лиц, прошедших стажировку и претендующих на право занятия деятельностью частного судебного исполнителя» и «Выдача лицензии на занятие деятельностью частного судебного исполнителя»
  kaz: «Тағылымдамадан өткен және жеке сот орындаушысы қызметімен айналысу құқығына үміткер адамдарды аттестаттаудан өткізу» және «Жеке сот орындаушысы қызметімен айналысуға лицензия беру» мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы
