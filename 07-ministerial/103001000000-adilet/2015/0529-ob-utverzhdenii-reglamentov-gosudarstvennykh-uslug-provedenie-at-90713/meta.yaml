  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра юстиции Республики Казахстан от 29 мая 2015 года № 311 "Об утверждении регламентов государственных услуг "Проведение квалификационного экзамена для получения лицензии на право занятия деятельностью частного судебного исполнителя" и "Выдача лицензии на занятие деятельностью частного судебного исполнителя"
    kaz: '"Жеке сот орындаушысы қызметімен айналысу құқығына лицензия алу үшін біліктілік емтиханын өткізу" және "Жеке сот орындаушысы қызметімен айналысуға лицензия беру" мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы" Қазақстан Республикасы Әділет министрінің міндетін атқарушының 2015 жылғы 29 мамырдағы № 311 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/104886/rus
