  title:
    rus: Об утверждении Правил осуществления выбора единой электронной торговой площадки по реализации арестованного имущества и внесения изменений и дополнений в приказ Министра юстиции Республики Казахстан от 20 февраля 2015 года № 100 "Об утверждении Правил реализации арестованного имущества, в том числе на торгах в форме электронного аукциона"
    kaz: Тыйым салынған мүлікті өткізу бойынша бірыңғай электрондық сауда-саттық алаңын таңдауды жүзеге асыру қағидаларын бекіту және "Тыйым салынған мүлікті, оның ішінде электрондық аукцион нысанындағы сауда-саттықта өткізу қағидаларын бекіту туралы" Қазақстан Республикасы Әділет министрінің 2015 жылғы 20 ақпандағы № 100 бұйрығына өзгерістер мен толықтырулар енгізу туралы
