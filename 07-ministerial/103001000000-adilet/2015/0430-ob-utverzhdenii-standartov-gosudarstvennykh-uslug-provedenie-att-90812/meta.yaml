  requisite: Приказ Министра юстиции Республики Казахстан от 23 мая 2016 года № 340. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 июня 2016 года № 13779. Утратил силу приказом Министра юстиции Республики Казахстан от 11 января 2018 года № 61 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 30 апреля 2015 года № 249 "Об утверждении стандартов государственных услуг "Проведение квалификационного экзамена для получения лицензии на право занятия деятельностью частного судебного исполнителя" и "Выдача лицензии на занятие деятельностью частного судебного исполнителя"
    kaz: '"Жеке сот орындаушысы қызметімен айналысу құқығына лицензия алу үшін біліктілік емтиханын өткізу" және "Жеке сот орындаушысы қызметімен айналысуға лицензия беру" мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы" Қазақстан Республикасы Әділет министрінің 2015 жылғы 30 сәуірдегі № 249 бұйрығына өзгерістер енгізу туралы'
