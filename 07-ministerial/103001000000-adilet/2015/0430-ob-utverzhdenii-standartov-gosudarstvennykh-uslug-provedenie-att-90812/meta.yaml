requisite: Приказ Министра юстиции Республики Казахстан от 30 апреля 2015 года № 249. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 июня 2015 года № 11383. Утратил силу приказом Министра юстиции Республики Казахстан от 11 января 2018 года № 61 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандартов государственных услуг "Проведение аттестации лиц, прошедших стажировку и претендующих на право занятия деятельностью частного судебного исполнителя" и "Выдача лицензии на занятие деятельностью частного судебного исполнителя"
  kaz: '"Тағылымдамадан өткен және жеке сот орындаушысы қызметімен айналысу құқығына үміткер адамдарды аттестаттаудан өткізу" және "Жеке сот орындаушысы қызметімен айналысуға лицензия беру" мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы'
