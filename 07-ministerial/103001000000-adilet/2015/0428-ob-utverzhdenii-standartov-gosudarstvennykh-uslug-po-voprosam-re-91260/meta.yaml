act_code: '91260'
requisite: Приказ Министра юстиции Республики Казахстан от 28 апреля 2015 года № 246. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 июня 2015 года № 11408. Утратил силу приказом и.о. Министра юстиции Республики Казахстан от 29 мая 2020 года № 67 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандартов государственных услуг по вопросам регистрации прав на недвижимое имущество и регистрации залога движимого имущества, не подлежащего обязательной государственной регистрации
  kaz: Жылжымайтын мүлікке құқықтарды тіркеу және міндетті  мемлекеттік тіркеуге жатпайтын  жылжымалы мүлік кепілін тіркеу мәселелері бойынша мемлекеттік  көрсетілетін қызметтердің стандарттарын бекіту туралы
