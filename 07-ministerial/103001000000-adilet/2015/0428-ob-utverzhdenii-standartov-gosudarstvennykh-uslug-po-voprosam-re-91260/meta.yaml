  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 28 апреля 2015 года № 246 «Об утверждении стандартов государственных услуг по вопросам регистрации прав на недвижимое имущество и регистрации залога движимого имущества, не подлежащего обязательной государственной регистрации»
    kaz: «Жылжымайтын мүлікке құқықтарды тіркеу және міндетті мемлекеттік тіркеуге жатпайтын жылжымалы мүлік кепілін тіркеу мәселелері бойынша мемлекеттік көрсетілетін қызметтердің стандарттарын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2015 жылғы 28 сәуірдегі № 246 бұйрығына өзгерістер енгізу туралы
