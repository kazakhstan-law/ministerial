    kaz: «Қазақстан Республикасы сот - сараптамалық зерттеулер әдістемелерінің мемлекеттік тізілімін қалыптастыру және пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2015 жылғы 26 қаңтардағы № 49 бұйрығына өзгерістер енгізу туралы
