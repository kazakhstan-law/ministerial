  title:
    rus: О внесении изменений в приказ Министра юстиции Республики Казахстан от 27 февраля 2015 года № 119 "Об утверждении Правил проведения аттестации судебного эксперта аттестационными комиссиями Министерства юстиции Республики Казахстан"
    kaz: '"Қазақстан Республикасы Әдiлет министрлiгiнiң аттестаттау комиссияларының сот сарапшысын аттестаттауын жүргiзу қағидасын бекiту туралы" Қазақстан Республикасы Әдiлет министрiнiң 2015 жылғы 27 ақпандағы № 119 бұйрығына өзгерістер енгізу туралы'
