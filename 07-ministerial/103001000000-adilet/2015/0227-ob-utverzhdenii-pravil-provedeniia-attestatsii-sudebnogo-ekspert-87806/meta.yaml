    kaz: '"Қазақстан Республикасы Әділет министрлігінің аттестаттау комиссияларының сот сарапшысының аттестаттауын жүргізу қағидасын бекіту туралы" Қазақстан Республикасы әділет Министрінің 2015 жылғы 27 ақпандағы № 119 бұйрығына өзгеріс енгізу туралы'
