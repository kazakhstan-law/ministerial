requisite: Приказ Министра юстиции Республики Казахстан от 27 февраля 2015 года N 119. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 марта 2015 года № 10490. Утратил силу приказом Министра юстиции Республики Казахстан от 30 марта 2017 года № 336 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения аттестации судебного эксперта, в том числе внеочередной, аттестационными комиссиями Министерства юстиции Республики Казахстан
