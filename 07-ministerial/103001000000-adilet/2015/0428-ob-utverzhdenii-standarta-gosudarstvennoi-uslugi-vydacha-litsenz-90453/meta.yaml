requisite: Приказ Министра юстиции Республики Казахстан от 28 апреля 2015 года № 242. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 мая 2015 года № 11188. Утратил силу приказом Министра юстиции Республики Казахстан от 9 апреля 2018 года № 546 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Выдача лицензии на занятие судебно-экспертной деятельностью, в том числе судебно-медицинской, судебно-наркологической и судебно-психиатрической экспертизами»
  kaz: «Сот-сараптама қызметімен, соның ішінде сот-медициналық, сот-наркологиялық және сот-психиатриялық сараптамалармен айналысуға лицензия беру» мемлекеттік көрсетілетін қызмет стандартын бекiту туралы
