  title:
    rus: О внесении изменения в приказ Министра юстиции Республики Казахстан от 28 апреля 2015 года № 242 "Об утверждении стандарта государственной услуги по вопросам судебно-экспертной деятельности"
    kaz: '"Сот-сараптамалық қызмет мәселелері бойынша мемлекеттiк көрсетілетін қызмет стандартын бекіту туралы" Қазақстан Республикасы Әділет министрінің 2015 жылғы 28 сәуірдегі № 242 бұйрығына өзгеріс енгізу туралы'
