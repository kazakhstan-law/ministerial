act_code: '90587'
requisite: Приказ и.о. Министра юстиции Республики Казахстан от 26 мая 2015 года № 296. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 июня 2015 года № 11325. Утратил силу приказом Министра юстиции Республики Казахстан от 4 июня 2018 года № 890 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача лицензии на занятие судебно-экспертной деятельностью, в том числе судебно-медицинской, судебно-наркологической и судебно-психиатрической экспертизами»
  kaz: «Сот-сараптама қызметімен айналысу үшін лицензия беру, соның ішінде сот-медициналық, сот-наркологиялық және сот-психитатриалық сараптамалары» мемлекеттiк көрсетілетін қызметтің регламентін бекіту туралы
