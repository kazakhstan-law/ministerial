  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра юстиции Республики Казахстан от 26 мая 2015 года № 296 «Об утверждении регламента государственной услуги «Выдача лицензии на занятие судебно-экспертной деятельностью»
    kaz: «Сот-сараптама қызметімен айналысу үшін лицензия беру» мемлекеттiк көрсетілетін қызметтің регламентін бекіту туралы» Қазақстан Республикасы Әділет министрінің міндетін атқарушының 2015 жылғы 26 мамырдағы № 296 бұйрығына өзгерістер енгізу туралы
