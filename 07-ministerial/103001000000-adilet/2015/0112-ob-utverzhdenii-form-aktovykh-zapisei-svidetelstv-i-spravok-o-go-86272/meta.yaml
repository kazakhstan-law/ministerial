title:
  rus: Об утверждении форм актовых записей, свидетельств и справок о государственной регистрации актов гражданского состояния в электронной форме и на бумажном носителе
  kaz: Азаматтық хал актілерін мемлекеттік тіркеу туралы электрондық және қағаз жеткізгіштегі акт жазбаларының, куәліктер мен анықтамалардың нысандарын бекіту туралы
