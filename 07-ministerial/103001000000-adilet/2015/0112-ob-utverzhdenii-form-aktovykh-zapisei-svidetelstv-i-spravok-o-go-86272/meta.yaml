  title:
    rus: «О внесении изменений и дополнений в приказ Министра юстиции Республики Казахстан от 12 января 2015 года № 9 «Об утверждении форм актовых книг государственной регистрации актов гражданского состояния и форм свидетельств, выдаваемых на основании записей в этих книгах»
    kaz: «Азаматтық хал актілерін мемлекеттік тіркеу актісі кітаптарының нысандарын және осы кітаптардағы жазбалардың негізінде берілетін куәліктердің нысандарын бекіту туралы» Қазақстан Республикасы Әділет министрінің 2015 жылғы 12 қаңтардағы № 9 бұйрығына өзгерістер мен толықтырулар енгізу туралы
