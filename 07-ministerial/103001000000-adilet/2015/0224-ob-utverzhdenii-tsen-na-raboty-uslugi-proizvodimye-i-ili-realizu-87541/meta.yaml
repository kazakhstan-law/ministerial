act_code: '87541'
requisite: Приказ Министра юстиции Республики Казахстан от 24 февраля 2015 года № 108. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 марта 2015 года № 10419. Утратил силу приказом Министра юстиции Республики Казахстан от 28 января 2016 года № 45
title:
  rus: Об утверждении цен на работы, услуги, производимые и (или) реализуемые Республиканским государственным предприятием «Центр по недвижимости» Министерства юстиции Республики Казахстан по государственному техническому обследованию зданий, сооружений и (или) их составляющих, по определению стоимости объектов налогообложения
  kaz: Қазақстан Республикасы Әділет министрлігінің "Жылжымайтын мүлік орталығы" республикалық мемлекеттік қазыналық кәсіпорындары ғимараттарды, құрылыстарды және (немесе) олардың құрамдас бөліктерін мемлекеттік техникалық тексеру бойынша, салық салу объектілерінің құнын айқындау бойынша өндіретін және (немесе) өткізетін жұмыстарының, көрсетілетін қызметтерінің бағаларын бекіту туралы
