title:
  rus: Об утверждении Правил закупа услуг у субъектов здравоохранения в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде денсаулық сақтау субъектілерінен көрсетілетін қызметтерді сатып алу қағидаларын бекіту туралы
