  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 28 апреля 2017 года № 217 «Об утверждении стандартов государственных услуг в сфере санитарно-эпидемиологического благополучия населения»
    kaz: «Халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2017 жылғы 28 сәуірдегі № 217 бұйрығына өзгерістер енгізу туралы
