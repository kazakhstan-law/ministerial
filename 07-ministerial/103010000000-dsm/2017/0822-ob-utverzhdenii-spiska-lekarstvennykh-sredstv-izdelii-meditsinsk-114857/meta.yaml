title:
  rus: Об утверждении списка лекарственных средств, изделий медицинского назначения в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования, закупаемых у Единого дистрибьютора на 2018 год
  kaz: 2018 жылға арналған Бірыңғай дистрибьютордан сатып алынатын тегін медициналық көмектің кепілдік берілген көлемінің шеңберінде және әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттардың, медициналық мақсаттағы бұйымдардың тізімін бекіту туралы
