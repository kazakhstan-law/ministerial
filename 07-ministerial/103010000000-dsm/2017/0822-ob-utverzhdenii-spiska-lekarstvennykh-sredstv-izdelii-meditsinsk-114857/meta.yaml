  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 22 августа 2017 года № 631 «Об утверждении списка лекарственных средств, изделий медицинского назначения в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования, закупаемых у Единого дистрибьютора на 2018 год»
    kaz: «2018 жылға арналған Бірыңғай дистрибьютордан сатып алынатын тегін медициналық көмектің кепілдік берілген көлемінің шеңберінде және әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттардың, медициналық мақсаттағы бұйымдардың тізімін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2017 жылғы 22 тамыздағы № 631 бұйрығына өзгерістер мен толықтырулар енгізу туралы
