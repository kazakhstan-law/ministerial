  title:
    rus: О внесении изменений и дополнения в приказы Министра здравоохранения Республики Казахстан от 30 июня 2017 года № 478 «Об утверждении Правил и сроков исчисления (удержания) и перечисления отчислений и (или) взносов на обязательное социальное медицинское страхование и Правил осуществления возврата плательщикам излишне (ошибочно) зачисленных сумм отчислений, взносов и (или) пени за несвоевременную и (или) неполную уплату отчислений и (или) взносов» и от 16 августа 2017 года № 612 «Об утверждении перечня, форм, сроков представления финансовой и иной отчетности фондом социального медицинского страхования для обеспечения контрольных функций»
    kaz: Қазақстан Республикасы Денсаулық сақтау министрінің «Міндетті әлеуметтік медициналық сақтандыруға аударымдарды және (немесе) жарналарды есептеу (ұстап қалу) және аудару қағидалары мен мерзімдерін және аударымдардың, жарналардың және (немесе) аударымдарды және (немесе) жарналарды уақтылы және (немесе) толық төлемегені үшін өсімпұлдың артық (қате) есепке жатқызылған сомаларын төлеушілерге қайтаруды жүзеге асыру қағидаларын бекіту туралы» 2017 жылғы 30 маусымдағы № 478 және «Бақылау функцияларын қамтамасыз ету үшін әлеуметтік медициналық сақтандыру қорының қаржылық және өзге де есептілігінің тізбесін, нысандарын, оларды ұсыну мерзімдерін бекіту туралы» 2017 жылғы 16 тамыздағы № 612 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/171058/rus
