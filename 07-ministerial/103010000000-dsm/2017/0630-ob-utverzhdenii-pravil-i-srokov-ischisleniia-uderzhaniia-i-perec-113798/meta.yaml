title:
  rus: Об утверждении Правил и сроков исчисления (удержания) и перечисления отчислений и (или) взносов на обязательное социальное медицинское страхование и Правил осуществления возврата плательщикам излишне (ошибочно) зачисленных сумм отчислений, взносов и (или) пени за несвоевременную и (или) неполную уплату отчислений и (или) взносов
  kaz: Міндетті әлеуметтік медициналық сақтандыруға аударымдарды және (немесе) жарналарды есептеу (ұстап қалу) және аудару қағидалары мен мерзімдерін және Аударымдардың, жарналардың және (немесе) аударымдарды және (немесе) жарналарды уақтылы және (немесе) толық төлемегені үшін өсімпұлдың артық (қате) есепке жатқызылған сомаларын төлеушілерге қайтаруды жүзеге асыру қағидаларын бекіту туралы
