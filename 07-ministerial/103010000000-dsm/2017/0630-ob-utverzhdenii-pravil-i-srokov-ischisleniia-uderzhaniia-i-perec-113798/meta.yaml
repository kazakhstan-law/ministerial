    kaz: «Аударымдарды және (немесе) жарналарды есептеу (ұстап қалу) және аудару қағидалары мен мерзімдерін және Аударымдар және (немесе) жарналар бойынша берешекті өндіріп алу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2017 жылғы 30 маусымдағы № 478 бұйрығына өзгерістер енгізу туралы
