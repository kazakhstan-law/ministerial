  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 26 июля 2017 года № 557 «Об утверждении регламентов государственных услуг в сфере санитарно-эпидемиологического благополучия населения»
    kaz: «Халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2017 жылғы 26 шілдедегі № 557 бұйрығына өзгерістер енгізу туралы
