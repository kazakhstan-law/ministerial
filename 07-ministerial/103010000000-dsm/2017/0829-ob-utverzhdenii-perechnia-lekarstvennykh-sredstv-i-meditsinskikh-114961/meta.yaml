act_code: '114961'
requisite: Приказ Министра здравоохранения Республики Казахстан от 29 августа 2017 года № 666. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 сентября 2017 года № 15724. Утратил силу приказом Министра здравоохранения Республики Казахстан от 5 августа 2021 года № ҚР ДСМ – 75 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Перечня лекарственных средств и медицинских изделий в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования, в том числе отдельных категорий граждан с определенными заболеваниями (состояниями) бесплатными и (или) льготными лекарственными средствами, медицинскими изделиями и специализированными лечебными продуктами на амбулаторном уровне
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттармен және медициналық бұйымдармен қамтамасыз етілуге, оның ішінде белгілі бір аурулары (жай-күйі) бар азаматтардың жекелеген санаттарын, амбулаториялық деңгейде тегін және (немесе) жеңілдікпен берілетін дәрілік заттардың, медициналық бұйымдардың және мамандандырылған емдік өнімдердің тізбесін бекіту туралы
