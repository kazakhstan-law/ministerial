  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 29 августа 2017 года № 666 «Об утверждении Перечня лекарственных средств и изделий медицинского назначения для обеспечения граждан в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного cоциального медицинского страхования, в том числе отдельных категорий граждан с определенными заболеваниями (состояниями) бесплатными и (или) льготными лекарственными средствами, изделиями медицинского назначения и специализированными лечебными продуктами на амбулаторном уровне»
    kaz: «Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде азаматтарды, оның ішінде белгілі бір аурулары (жай-күйлері) бар азаматтардың жекелеген санаттарын амбулаториялық деңгейде тегін немесе жеңілдікпен берілетін дәрілік заттармен, медициналық мақсаттағы бұйымдармен және мамандандыралған емдік өнімдермен қамтамасыз етуге арналған дәрілік заттардың және медициналық мақсаттағы бұйымдардың тізбесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2017 жылғы 29 тамыздағы № 666 бұйрығына өзгерістер енгізу туралы
