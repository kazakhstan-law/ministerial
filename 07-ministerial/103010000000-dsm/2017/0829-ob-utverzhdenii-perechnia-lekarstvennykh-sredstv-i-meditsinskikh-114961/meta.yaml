  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 29 августа 2017 года № 666 «Об утверждении Перечня лекарственных средств и медицинских изделий в рамках гарантированного объема бесплатной медицинской помощи, в том числе отдельных категорий граждан с определенными заболеваниями (состояниями) бесплатными и (или) льготными лекарственными средствами и медицинскими изделиями на амбулаторном уровне»
    kaz: «Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде, дәрілік заттармен және медициналық бұйымдармен қамтамасыз етілуге, оның ішінде белгілі бір аурулары (жай-күйлері) бар азаматтардың жекелеген санаттарын, амбулаториялық деңгейде тегін және (немесе) жеңілдікпен берілетін дәрілік заттармен және медициналық бұйымдардың тізбесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2017 жылғы 29 тамыздағы № 666 бұйрығына өзгерістер енгізу туралы
