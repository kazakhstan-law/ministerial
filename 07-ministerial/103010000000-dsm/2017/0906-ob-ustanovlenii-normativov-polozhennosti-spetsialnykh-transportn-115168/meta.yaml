act_code: '115168'
requisite: Приказ Министра здравоохранения Республики Казахстан от 6 сентября 2017 года № 681. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 сентября 2017 года № 15823
title:
  rus: Об установлении нормативов положенности специальных транспортных средств и определении критериев отнесения автотранспорта к специальным транспортным средствам по сферам деятельности, отнесенным к их компетенции в республиканских государственных предприятиях, подведомственных Министерству здравоохранения Республики Казахстан
  kaz: Қазақстан Республикасы Денсаулық сақтау министрлігіне ведомстволық бағыныстағы республикалық мемлекеттік кәсіпорындардағы арнайы көлік құралдарының тиiстiлiк нормативтерiн белгілеу және олардың құзыретіне жатқызылған қызмет салалары бойынша автокөлікті арнайы көлік құралдарына жатқызу өлшемдерін айқындау туралы
