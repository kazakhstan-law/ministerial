title:
  rus: Об утверждении форм и сроков представления фондом социального медицинского страхования отчетности по средствам на оказание медицинской помощи
  kaz: Әлеуметтік медициналық сақтандыру қорының медициналық көмек көрсетуге арналған қаражат бойынша есептілікті ұсыну нысандары мен мерзімдерін бекіту туралы
