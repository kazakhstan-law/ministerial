  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 16 августа 2017 года № 612 «Об утверждении перечня, форм, сроков представления финансовой и иной отчетности фондом социального медицинского страхования для обеспечения контрольных функций»
    kaz: «Бақылау функцияларын қамтамасыз ету үшін әлеуметтік медициналық сақтандыру қорының қаржылық және өзге де есептілігінің тізбесін, нысандарын, оларды ұсыну мерзімдерін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2017 жылғы 16 тамыздағы № 612 бұйрығына өзгерістер мен толықтырулар енгізу туралы
