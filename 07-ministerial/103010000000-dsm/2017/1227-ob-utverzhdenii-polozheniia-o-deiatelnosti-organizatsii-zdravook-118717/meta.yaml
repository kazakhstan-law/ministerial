act_code: '118717'
requisite: Приказ Министра здравоохранения Республики Казахстан от 27 декабря 2017 года № 1008. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 января 2018 года № 16278. Утратил силу приказом Министра здравоохранения Республики Казахстан от 6 июня 2024 года № 20 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Положения о деятельности организации здравоохранения для детей-сирот, детей, оставшихся без попечения родителей от рождения до трех лет, с дефектами психического и физического развития от рождения до четырех лет, осуществляющие психолого-педагогическое сопровождение семей с риском отказа от ребенка
  kaz: Туғаннан бастап үш жасқа дейiнгi жетiм балаларға, ата-анасының қамқорлығынсыз қалған балаларға, туғаннан бастап төрт жасқа дейiнгi, психикасының және дене бiтiмiнiң дамуында кемiстiгi бар балаларға арналған, баладан бас тарту қаупі бар отбасыларды психологиялық-педагогикалық қолдауды жүзеге асыратын денсаулық сақтау ұйымдарының қызметі туралы ережені бекіту туралы
