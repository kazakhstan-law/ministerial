  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета здравоохранения Министерства здравоохранения, образования и спорта Республики Казахстан от 10 мая 1999 года N 238 "Об утверждении "Инструкции по хранению различных групп лекарственных средств и изделий медицинского назначения в аптечных организациях, фармацевтических предприятиях и лечебно-профилактических учреждениях" и "Инструкции о порядке хранения и обращения с лекарственными средствами, обладающими огнеопасными и взрывоопасными свойствами, в аптечных организациях и фармацевтических предприятиях"
    kaz: '"Дәріхана ұйымдарында, фармацевтика кәсіпорындары мен емдеу-профилактика мекемелерінде дәрілік заттардың түрлі топтары мен медициналық мақсаттағы бұйымдарды сақтау туралы Нұсқаулықты" және "Дәрiхана ұйымдары мен фармацевтика кәсiпорындарында тұтанғыш және жарылғыш қасиеттерi бар дәрiлiк заттарды сақтау мен ұқыпты ұстау тәртiбi туралы Нұсқаулықты бекіту туралы" Қазақстан Республикасы Денсаулық сақтау, білім және спорт министрлігінің Денсаулық сақтау комитеті төрағасының 1999 жылғы 10 мамырдағы N 238 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/24867/rus
