title:
  rus: Об утверждении Правил по хранению различных групп лекарственных средств и изделий медицинского назначения в организациях здравоохранения и Правил о порядке хранения и обращения с лекарственными средствами, обладающими огнеопасными и взрывоопасными свойствами, в аптечных организациях и фармацевтических предприятиях
  kaz: Денсаулық сақтау ұйымдарында дәрілік заттардың түрлі топтары мен медициналық мақсаттағы бұйымдарды сақтау туралы Ереже
