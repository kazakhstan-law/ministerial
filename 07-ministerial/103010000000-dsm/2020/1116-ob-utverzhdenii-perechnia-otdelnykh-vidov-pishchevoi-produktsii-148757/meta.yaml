title:
  rus: Об утверждении перечня отдельных видов пищевой продукции, подлежащей государственному контролю и надзору в сфере санитарно-эпидемиологического благополучия населения, в производстве которой используется нейодированная соль
  kaz: Халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы мемлекеттік бақылау мен қадағалауға жататын, өндірісінде йодталмаған тұз пайдаланылатын тағамдық өнімнің жекелеген түрлерінің тізбесін бекіту туралы
