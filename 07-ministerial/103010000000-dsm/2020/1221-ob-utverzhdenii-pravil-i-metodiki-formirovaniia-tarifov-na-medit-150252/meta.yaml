title:
  rus: Об утверждении правил и методики формирования тарифов на медицинские услуги, оказываемые в рамках гарантированного объема бесплатной медицинской помощи и (или) в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде көрсетілетін медициналық қызметтерге тарифтерді қалыптастыру қағидаларын және әдістемесін бекіту туралы
