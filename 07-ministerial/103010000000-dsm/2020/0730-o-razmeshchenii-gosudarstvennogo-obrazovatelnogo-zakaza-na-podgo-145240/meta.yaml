  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 30 июля 2020 года № ҚР ДСМ - 92/2020 «О размещении государственного образовательного заказа на подготовку специалистов с послесредним, высшим и послевузовским медицинским и фармацевтическим образованием на 2020-2021 учебный год»
    kaz: «Орта білімнен кейінгі, жоғары және жоғары оқу орнынан кейінгі медициналық және фармацевтикалық білімі бар мамандарды даярлауға 2020-2021 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 30 шілдедегі № ҚР ДСМ-92/2020 бұйрығына өзгерістер енгізу туралы
