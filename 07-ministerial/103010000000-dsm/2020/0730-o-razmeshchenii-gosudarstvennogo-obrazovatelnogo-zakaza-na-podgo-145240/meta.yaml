title:
  rus: О размещении государственного образовательного заказа на подготовку специалистов с послесредним, высшим и послевузовским медицинским и фармацевтическим образованием на 2020-2021 учебный год
  kaz: Орта білімнен кейінгі, жоғары және жоғары оқу орнынан кейінгі медициналық және фармацевтикалық білімі бар мамандарды даярлауға 2020-2021 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру туралы
