title:
  rus: Об утверждении правил осуществления ограничительных мероприятий, в том числе карантина, и перечень инфекционных заболеваний при угрозе возникновения и распространения которых вводятся ограничительные мероприятия, в том числе карантин
  kaz: Шектеу іс-шараларын, оның ішінде карантинді жүзеге асыру қағидаларын және пайда болу және таралу қаупі төнген кезде шектеу іс-шаралары, оның ішінде карантин енгізілетін инфекциялық аурулардың тізбесін бекіту туралы
