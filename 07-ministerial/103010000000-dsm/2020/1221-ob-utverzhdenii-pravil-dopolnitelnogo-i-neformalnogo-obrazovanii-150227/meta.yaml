act_code: '150227'
requisite: Приказ Министра здравоохранения Республики Казахстан от 21 декабря 2020 года № ҚР ДСМ-303/2020. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 декабря 2020 года № 21847
title:
  rus: Об утверждении правил дополнительного и неформального образования специалистов в области здравоохранения, квалификационных требований к организациям, реализующим образовательные программы дополнительного и неформального образования в области здравоохранения, а также правил признания результатов обучения, полученных специалистами в области здравоохранения через дополнительное и неформальное образование
  kaz: Денсаулық сақтау саласындағы мамандарға қосымша және формальды емес білім беру қағидаларын, денсаулық сақтау саласындағы қосымша және формальды емес білімнің білім беру бағдарламаларын іске асыратын ұйымдарға қойылатын біліктілік талаптарын, сондай-ақ қосымша және формальды емес білім беру арқылы денсаулық сақтау саласындағы мамандар алған оқудың нәтижелерін тану қағидаларын бекіту туралы
