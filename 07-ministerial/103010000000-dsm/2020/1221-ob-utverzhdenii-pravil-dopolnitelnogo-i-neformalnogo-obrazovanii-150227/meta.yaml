  title:
    rus: О внесении изменений и дополнения в приказ Министра здравоохранения Республики Казахстан от 21 декабря 2020 года № ҚР ДСМ-303/2020 «Об утверждении правил дополнительного и неформального образования специалистов в области здравоохранения, квалификационных требований к организациям, реализующим образовательные программы дополнительного и неформального образования в области здравоохранения, а также правил признания результатов обучения, полученных специалистами в области здравоохранения через дополнительное и неформальное образование»
    kaz: «Денсаулық сақтау саласындағы мамандарға қосымша және формальды емес білім беру қағидаларын, денсаулық сақтау саласындағы қосымша және формальды емес білімнің білім беру бағдарламаларын іске асыратын ұйымдарға қойылатын біліктілік талаптарын, сондай-ақ қосымша және формальды емес білім беру арқылы денсаулық сақтау саласындағы мамандар алған оқудың нәтижелерін тану қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 21 желтоқсандағы № ҚР ДСМ-303/2020 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/163708/rus
