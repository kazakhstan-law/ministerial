act_code: '146115'
requisite: Приказ Министра здравоохранения Республики Казахстан от 7 сентября 2020 года № ҚР ДСМ-100/2020. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 сентября 2020 года № 21181
title:
  rus: Об утверждении правил предоставления информации (экстренного извещения) о случаях наступления смерти беременных, рожениц, а также в случае смерти родильниц в течение сорока двух календарных дней после родов, внезапной смерти пациентов при оказании им плановой медицинской помощи (первичной медико-санитарной и специализированной помощи, в том числе высокотехнологичных медицинских услуг)
  kaz: Жүкті, босанатын әйелдердің қайтыс болу жағдайлары, сондай-ақ босанған әйелдер босанғаннан кейін күнтізбелік қырық екі күн ішінде қайтыс болған жағдайда, пациенттерге жоспарлы медициналық көмек (медициналық-санитариялық алғашқы көмек және мамандандырылған көмек, оның ішінде жоғары технологиялық медициналық көрсетілетін қызметтер) көрсету кезінде олардың кенеттен қайтыс болу жағдайлары туралы ақпарат (шұғыл хабархат) беру қағидаларын бекіту туралы
