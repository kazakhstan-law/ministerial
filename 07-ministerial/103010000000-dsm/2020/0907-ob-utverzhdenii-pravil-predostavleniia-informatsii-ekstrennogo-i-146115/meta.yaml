  title:
    rus: О внесении изменения в приказ Министра здравоохранения Республики Казахстан от 7 сентября 2020 года № ҚР ДСМ-100/2020 «Об утверждении правил предоставления информации (экстренного извещения) о случаях наступления смерти беременных, рожениц, а также в случае смерти родильниц в течение сорока двух календарных дней после родов, внезапной смерти пациентов при оказании им плановой медицинской помощи (первичной медико-санитарной и специализированной помощи, в том числе высокотехнологичных медицинских услуг)»
    kaz: «Жүкті, босанатын әйелдердің қайтыс болу жағдайлары, сондай-ақ босанған әйелдер босанғаннан кейін күнтізбелік қырық екі күн ішінде қайтыс болған жағдайда, пациенттерге жоспарлы медициналық көмек (медициналық-санитариялық алғашқы көмек және мамандандырылған көмек, оның ішінде жоғары технологиялық медициналық көрсетілетін қызметтер) көрсету кезінде олардың кенеттен қайтыс болу жағдайлары туралы ақпарат (шұғыл хабархат) беру қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 7 қыркүйектегі № ҚР ДСМ-100/2020 бұйрығына өзгеріс енгізу туралы
