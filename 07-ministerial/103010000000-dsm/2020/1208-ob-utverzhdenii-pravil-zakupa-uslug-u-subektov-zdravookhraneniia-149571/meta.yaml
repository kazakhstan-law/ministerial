title:
  rus: Об утверждении правил закупа услуг у субъектов здравоохранения по оказанию медицинской помощи в рамках гарантированного объема бесплатной медицинской помощи и (или) в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмек көрсету бойынша денсаулық сақтау субъектілерінен көрсетілетін қызметтерді сатып алу қағидаларын бекіту туралы
