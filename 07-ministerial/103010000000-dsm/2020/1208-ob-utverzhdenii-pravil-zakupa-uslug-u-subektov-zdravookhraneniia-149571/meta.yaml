  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 8 декабря 2020 года № ҚР ДСМ-242/2020 «Об утверждении правил закупа услуг у субъектов здравоохранения по оказанию медицинской помощи в рамках гарантированного объема бесплатной медицинской помощи и (или) в системе обязательного социального медицинского страхования»
    kaz: «Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмек көрсету бойынша денсаулық сақтау субъектілерінен көрсетілетін қызметтерді сатып алу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 8 желтоқсандағы № ҚР ДСМ-242/2020 бұйрығына өзгерістер мен толықтырулар енгізу туралы
