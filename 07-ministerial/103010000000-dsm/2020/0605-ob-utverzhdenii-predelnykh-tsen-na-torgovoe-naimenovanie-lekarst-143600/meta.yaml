  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 5 июня 2020 года № ҚР ДСМ-62/2020 «Об утверждении предельных цен на торговое наименование лекарственных средств в рамках гарантированного объема бесплатной медицинской помощи и медицинской помощи в системе обязательного социального медицинского страхования»
    kaz: «Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттардың саудалық атауына арналған шекті бағаларды бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 5 маусымдағы ҚР ДСМ-62/2020 бұйрығына өзгерістер енгізу туралы
