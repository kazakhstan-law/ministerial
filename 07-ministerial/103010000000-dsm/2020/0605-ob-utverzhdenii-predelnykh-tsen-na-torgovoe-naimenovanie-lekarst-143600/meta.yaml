requisite: Приказ Министра здравоохранения Республики Казахстан от 5 июня 2020 года № ҚР ДСМ-62/2020. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 июня 2020 года № 20828. Утратил силу приказом Министра здравоохранения Республики Казахстан от 5 августа 2021 года № ҚР ДСМ -77 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
