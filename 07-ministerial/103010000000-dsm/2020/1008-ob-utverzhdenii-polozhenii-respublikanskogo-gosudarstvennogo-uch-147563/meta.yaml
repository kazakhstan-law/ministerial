  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 8 октября 2020 года № 644 «Об утверждении положений республиканского государственного учреждения «Комитет санитарно эпидемиологического контроля Министерства здравоохранения Республики Казахстан» и его территориальных подразделений»
    kaz: «Қазақстан Республикасының Денсаулық сақтау министрлігі Санитариялық-эпидемиологиялық бақылау комитеті» республикалық мемлекеттік мекемесінің және оның аумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасының Денсаулық сақтау министрінің 2020 жылғы 8 қазандағы № 644 бұйрығына өзгерістер мен толықтырулар енгізу туралы
