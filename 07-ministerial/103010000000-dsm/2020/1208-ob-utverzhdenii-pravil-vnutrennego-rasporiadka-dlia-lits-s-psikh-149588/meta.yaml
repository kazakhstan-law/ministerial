title:
  rus: Об утверждении правил внутреннего распорядка для лиц с психическими, поведенческими расстройствами (заболеваниями), связанными с употреблением психоактивных веществ, для принудительного лечения в организациях, оказывающих медицинскую помощь в области психического здоровья
  kaz: Психикаға белсенді әсер ететін заттарды тұтынуға байланысты психикалық, мінез-құлықтық бұзылушылықтары (аурулары) бар адамдарды психикалық денсаулық саласында медициналық көмек көрсететін ұйымда мәжбүрлеп емдеу үшін ішкі тәртіп қағидаларын бекіту туралы
