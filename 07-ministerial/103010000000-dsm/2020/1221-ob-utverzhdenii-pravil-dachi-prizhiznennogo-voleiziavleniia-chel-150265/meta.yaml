  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 21 декабря 2020 года № ҚР ДСМ-308/2020 «Об утверждении Правил дачи прижизненного волеизъявления человека на посмертное донорство органов (части органа) и (или) тканей (части ткани) и уведомления супруга (супруги) или одного из близких родственников об этом»
    kaz: «Ағзалардың (ағза бөлігінің) және (немесе) тіндердің (тін бөлігінің) қайтыс болғаннан кейінгі донорлығына адамның тірі кезінде ерік білдіруін беру және бұл жөнінде жұбайын (зайыбын) немесе жақын туыстарының бірін хабардар ету қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 21 желтоқсандағы № ҚР ДСМ-308/2020 бұйрығына өзгерістер енгізу туралы
