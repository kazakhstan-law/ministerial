title:
  rus: Об утверждении Правил дачи прижизненного волеизъявления человека на посмертное донорство органов (части органа) и (или) тканей (части ткани) и уведомления супруга (супруги) или одного из близких родственников об этом
  kaz: Ағзалардың (ағза бөлігінің) және (немесе) тіндердің (тін бөлігінің) қайтыс болғаннан кейінгі донорлығына адамның тірі кезінде ерік білдіруін беру және бұл жөнінде жұбайын (зайыбын) немесе жақын туыстарының бірін хабардар ету қағидаларын бекіту туралы
