title:
  rus: Об утверждении положений республиканского государственного учреждения «Комитет медицинского и фармацевтического контроля Министерства здравоохранения Республики Казахстан» и его территориальных подразделений
  kaz: «Қазақстан Республикасының Денсаулық сақтау министрлігі Медициналық және фармацевтикалық бақылау комитеті» республикалық мемлекеттік мекемесінің және оның аумақтық бөлімшелерінің ережелерін бекіту туралы
