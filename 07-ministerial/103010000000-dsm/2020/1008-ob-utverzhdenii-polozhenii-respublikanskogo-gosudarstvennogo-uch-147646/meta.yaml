  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 8 октября 2020 года № 645 «Об утверждении положений республиканского государственного учреждения «Комитет медицинского и фармацевтического контроля Министерства здравоохранения Республики Казахстан» и его территориальных подразделений»
    kaz: «Қазақстан Республикасы Денсаулық сақтау министрлігінің Медициналық және фармацевтикалық бақылау комитеті» республикалық мемлекеттік мекемесінің және оның аумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 8 қазандағы № 645 бұйрығына өзгерістер мен толықтырулар енгізу туралы
