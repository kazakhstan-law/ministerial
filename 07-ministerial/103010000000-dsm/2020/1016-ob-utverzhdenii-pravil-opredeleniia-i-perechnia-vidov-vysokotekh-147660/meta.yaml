title:
  rus: Об утверждении правил определения и перечня видов высокотехнологичной медицинской помощи, а также критерии, согласно которым виды высокотехнологичной медицинской помощи переходят в перечень услуг специализированной медицинской помощи
  kaz: Жоғары технологиялық медициналық көмек түрлерін айқындау тәртібін және олардың тізбесін, сондай-ақ жоғары технологиялық медициналық көмек түрлерінің мамандандырылған медициналық көмектің көрсетілетін қызметтері тізбесіне өту өлшемшарттарын бекіту туралы
