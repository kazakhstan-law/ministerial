  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 16 октября 2020 года № ҚР ДСМ-134/2020 «Об утверждении правил определения и перечня видов высокотехнологичной медицинской помощи, а также критерии, согласно которым виды высокотехнологичной медицинской помощи переходят в перечень услуг специализированной медицинской помощи»
    kaz: «Жоғары технологиялық медициналық көмек түрлерін айқындау тәртібін және олардың тізбесін, сондай-ақ жоғары технологиялық медициналық көмек түрлерінің мамандандырылған медициналық көмектің көрсетілетін қызметтері тізбесіне өту өлшемшарттарын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 16 қазандағы № ҚР ДСМ-134/2020 бұйрығына өзгерістер енгізу туралы
