  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 24 декабря 2020 года № ҚР ДСМ-324/2020 «Об утверждении правил формирования перечня закупа лекарственных средств и медицинских изделий в рамках гарантированного объема бесплатной медицинской помощи и (или) в системе обязательного социального медицинского страхования»
    kaz: «Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттар мен медициналық бұйымдарды сатып алу тізбесін қалыптастыру қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2020 жылғы 24 желтоқсандағы № ҚР ДСМ-324/2020 бұйрығына өзгерістер мен толықтырулар енгізу туралы
