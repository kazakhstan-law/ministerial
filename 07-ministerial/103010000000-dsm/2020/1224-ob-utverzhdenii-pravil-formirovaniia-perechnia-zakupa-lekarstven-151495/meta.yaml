  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттар мен медициналық бұйымдарды сатып алу тізбесін қалыптастыру қағидаларын бекіту туралы
