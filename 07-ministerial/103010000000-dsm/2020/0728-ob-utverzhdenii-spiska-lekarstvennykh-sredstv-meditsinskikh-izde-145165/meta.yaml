requisite: Приказ Министра здравоохранения Республики Казахстан от 28 июля 2020 года № ҚР ДСМ - 90/2020. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 июля 2020 года № 21023. Утратил силу приказом Министра здравоохранения Республики Казахстан от 20 августа 2021 года № ҚР ДСМ-88 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении списка лекарственных средств, медицинских изделий в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования, закупаемых у Единого дистрибьютора на 2021 год
  kaz: 2021 жылға арналған Бірыңғай дистрибьютордан сатып алынатын тегін медициналық көмектің кепілдік берілген көлемінің шеңберінде және әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттардың, медициналық бұйымдардың тізімін бекіту туралы
