  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 30 ноября 2020 года № ҚР ДСМ - 227/2020 «Об утверждении правил, сроков проведения постаккредитационного мониторинга и отзыва свидетельства об аккредитации в области здравоохранения»
    kaz: «Денсаулық сақтау саласындағы аккредиттеуден кейінгі мониторинг жүргізу және аккредиттеу туралы куәлікті кері қайтарып алу қағидаларын, мерзімдерін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 30 қарашадағы № ҚР ДСМ-227/2020 бұйрығына өзгерістер енгізу туралы
