title:
  rus: Об утверждении правил изготовления лекарственных препаратов и медицинских изделий субъектами в сфере обращения лекарственных средств и медицинских изделий, имеющими лицензию на изготовление лекарственных препаратов и медицинских изделий
  kaz: Дәрілік препараттар мен медициналық бұйымдарды дайындауға лицензиясы бар, дәрілік заттар мен медициналық бұйымдардың айналысы саласындағы субъектілердің дәрілік препараттар мен медициналық бұйымдарды дайындау қағидаларын бекіту туралы
