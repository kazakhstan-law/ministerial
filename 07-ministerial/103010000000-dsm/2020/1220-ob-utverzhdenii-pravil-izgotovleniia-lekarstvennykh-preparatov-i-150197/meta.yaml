  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 20 декабря 2020 года № ҚР ДСМ-286/2020 «Об утверждении правил изготовления лекарственных препаратов и медицинских изделий субъектами в сфере обращения лекарственных средств и медицинских изделий, имеющими лицензию на изготовление лекарственных препаратов и медицинских изделий»
    kaz: «Дәрілік препараттар мен медициналық бұйымдарды дайындауға лицензиясы бар, дәрілік заттар мен медициналық бұйымдардың айналысы саласындағы субъектілердің дәрілік препараттар мен медициналық бұйымдарды дайындау қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 20 желтоқсандағы № ҚР ДСМ-286/2020 бұйрығына өзгерістер енгізу туралы
