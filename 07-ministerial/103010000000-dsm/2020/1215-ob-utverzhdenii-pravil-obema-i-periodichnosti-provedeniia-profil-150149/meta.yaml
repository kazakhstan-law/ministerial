title:
  rus: Об утверждении правил, объема и периодичности проведения профилактических медицинских осмотров целевых групп населения, включая детей дошкольного, школьного возрастов, а также учащихся организаций технического и профессионального, послесреднего и высшего образования
  kaz: Мектепке дейінгі, мектеп жасындағы балаларды, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі және жоғары білім беру ұйымдарының білім алушыларын қоса алғанда, халықтың нысаналы топтарына профилактикалық медициналық қарап-тексерулерді жүргізу қағидаларын, көлемі мен мерзімділігін бекіту туралы
