  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 30 октября 2020 года № ҚР ДСМ-174/2020 «Об утверждении целевых групп лиц, подлежащих скрининговым исследованиям, а также правил, объема и периодичности проведения данных исследований и в приказ Министра здравоохранения Республики Казахстан от 15 декабря 2020 года № ҚР ДСМ-264/2020 «Об утверждении правил, объема и периодичности проведения профилактических медицинских осмотров целевых групп населения, включая детей дошкольного, школьного возрастов, а также учащихся организаций технического и профессионального, послесреднего и высшего образования»
    kaz: «Скринингтік зерттеулерге жататын адамдардың нысаналы топтарын, сондай-ақ осы қарап-тексерулерді өткізудің қағидаларын, көлемі мен кезеңділігін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2020 жылғы 30 қазандағы № ҚР ДСМ-174/2020 және «Мектепке дейінгі, мектеп жасындағы балаларды, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі және жоғары білім беру ұйымдарының оқушыларын қоса алғанда, халықтың нысаналы топтарына профилактикалық медициналық қарап-тексерулер жүргізу қағидаларын, көлемі мен кезеңділігін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 15 желтоқсандағы № ҚР ДСМ-264/2020 бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/169716/rus
