  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 23 декабря 2020 года № ҚР ДСМ-316/2020 «Об утверждении правил присвоения и пересмотра статуса научной организации в области здравоохранения, а также правил проведения оценки результативности научной, научно-технической и инновационной деятельности»
    kaz: «Денсаулық сақтау саласындағы ғылыми ұйымға мәртебе беру және оны қайта қарау қағидаларын, сондай-ақ ғылыми, ғылыми-техникалық және инновациялық қызметтің нәтижелілігіне бағалауды жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 23 желтоқсандағы № ҚР ДСМ-316/2020 бұйрығына өзгерістер енгізу туралы
