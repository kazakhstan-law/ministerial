title:
  rus: Об утверждении правил присвоения и пересмотра статуса научной организации в области здравоохранения, а также правил проведения оценки результативности научной, научно-технической и инновационной деятельности
  kaz: Денсаулық сақтау саласындағы ғылыми ұйымға мәртебе беру және оны қайта қарау қағидаларын, сондай-ақ ғылыми, ғылыми-техникалық және инновациялық қызметтің нәтижелілігіне бағалауды жүргізу қағидаларын бекіту туралы
