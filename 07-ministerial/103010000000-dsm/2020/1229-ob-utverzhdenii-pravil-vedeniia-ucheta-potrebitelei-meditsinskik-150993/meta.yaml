  title:
    rus: О внесении изменений в приказы Министра здравоохранения Республики Казахстан от 30 июня 2017 года № 478 «Об утверждении Правил и сроков исчисления (удержания) и перечисления отчислений и (или) взносов на обязательное социальное медицинское страхование и Правил осуществления возврата плательщикам излишне (ошибочно) зачисленных сумм отчислений, взносов и (или) пени за несвоевременную и (или) неполную уплату отчислений и (или) взносов» и от 29 декабря 2020 года № ҚР ДСМ-333/2020 «Об утверждении правил ведения учета потребителей медицинских услуг и предоставления права на получение медицинской помощи в системе обязательного социального медицинского страхования»
    kaz: «Міндетті әлеуметтік медициналық сақтандыруға аударымдарды және (немесе) жарналарды есептеу (ұстап қалу) және аудару қағидалары мен мерзімдерін және Аударымдардың, жарналардың және (немесе) аударымдарды және (немесе) жарналарды уақтылы және (немесе) толық төлемегені үшін өсімпұлдың артық (қате) есепке жатқызылған сомаларын төлеушілерге қайтаруды жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2017 жылғы 30 маусымдағы № 478 және «Міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көрсетілетін қызметтерді тұтынушыларды есепке алуды жүргізу және медициналық көмек алуға құқық беру қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы  29 желтоқсандағы № ҚР ДСМ-333/2020 бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/211068/rus
