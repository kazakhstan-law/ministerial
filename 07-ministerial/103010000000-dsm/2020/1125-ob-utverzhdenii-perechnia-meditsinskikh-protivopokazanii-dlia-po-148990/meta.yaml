title:
  rus: Об утверждении перечня медицинских противопоказаний для получения разрешений в сферах оборота гражданского и служебного оружия, гражданских пиротехнических веществ
  kaz: Азаматтық және қызметтік қарудың, азаматтық пиротехникалық заттардың айналымы салаларында рұқсаттарды алу үшін медициналық қарсы көрсетілімдер тізбесін бекіту туралы
