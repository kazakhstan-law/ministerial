  title:
    rus: О внесении изменения в приказ Министра здравоохранения Республики Казахстан от 25 ноября 2020 года № ҚР ДСМ-206/2020 «Об утверждении перечня медицинских противопоказаний для получения разрешений в сферах оборота гражданского и служебного оружия, гражданских пиротехнических веществ»
    kaz: Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 25 қарашадағы № ҚР ДСМ-206/2020 бұйрығына өзгеріс енгізу туралы «Азаматтық және қызметтік қару, азаматтық пиротехникалық заттар айналымы салаларында рұқсат алу үшін медициналық қарсы көрсетілімдер тізбесін бекіту туралы»
