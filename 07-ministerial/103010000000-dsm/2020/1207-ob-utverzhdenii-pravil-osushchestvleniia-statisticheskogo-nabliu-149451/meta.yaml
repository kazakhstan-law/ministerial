title:
  rus: Об утверждении правил осуществления статистического наблюдения в области здравоохранения, формы статистического учета и отчетности в области здравоохранения, порядка их ведения, заполнения и сроков представления
  kaz: Денсаулық сақтау саласындағы статистикалық байқауды жүзеге асыру қағидаларын, денсаулық сақтау саласындағы статистикалық есепке алу мен есептілік нысандарын, оларды жүргізу, толтыру тәртібін және ұсыну мерзімдерін бекіту туралы
