  title:
    rus: О внесении изменения в приказ Министра здравоохранения Республики Казахстан от 7 декабря 2020 года № ҚР ДСМ-235/2020 «Об утверждении правил осуществления статистического наблюдения в области здравоохранения, формы статистического учета и отчетности в области здравоохранения, порядка их ведения, заполнения и сроков представления»
    kaz: «Денсаулық сақтау саласындағы статистикалық байқауды жүзеге асыру қағидаларын, денсаулық сақтау саласындағы статистикалық есепке алу мен есептілік нысандарын, оларды жүргізу, толтыру тәртібін және ұсыну мерзімдерін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 7 желтоқсандағы № ҚР ДСМ-235/2020 бұйрығына өзгерістер енгізу туралы
