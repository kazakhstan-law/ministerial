title:
  rus: Об утверждении номенклатуры специальностей и специализаций в области здравоохранения, номенклатуры и квалификационных характеристик должностей работников системы здравоохранения
  kaz: Денсаулық сақтау саласындағы мамандықтар мен мамандандырулар номенклатурасын, денсаулық сақтау жүйесінің қызметкерлері лауазымдарының номенклатурасы мен біліктілік сипаттамаларын бекіту туралы
