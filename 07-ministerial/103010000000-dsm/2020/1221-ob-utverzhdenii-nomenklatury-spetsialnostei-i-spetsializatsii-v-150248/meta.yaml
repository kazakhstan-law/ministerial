  title:
    rus: О внесении изменения в приказ Министра здравоохранения Республики Казахстан от 21 декабря 2020 года № ҚР ДСМ-305/2020 «Об утверждении номенклатуры специальностей и специализаций в области здравоохранения, номенклатуры и квалификационных характеристик должностей работников здравоохранения»
    kaz: «Денсаулық сақтау саласындағы мамандықтар мен мамандандырулар номенклатурасын, денсаулық сақтау қызметкерлері лауазымдарының номенклатурасы мен біліктілік сипаттамаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 21 желтоқсандағы № ҚР ДСМ-305/2020 туралы бұйрығына өзгеріс енгізу туралы
