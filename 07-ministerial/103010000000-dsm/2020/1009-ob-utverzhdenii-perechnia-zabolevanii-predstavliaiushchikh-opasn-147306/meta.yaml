act_code: '147306'
requisite: Приказ Министра здравоохранения Республики Казахстан от 9 октября 2020 года № ҚР ДСМ-121/2020. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 октября 2020 года № 21407
title:
  rus: Об утверждении перечня заболеваний, представляющих опасность для окружающих и объема медицинской помощи, при которых иностранцы и лица без гражданства, временно пребывающие в Республике Казахстан, лица, ищущие убежище, имеют право на получение гарантированного объема бесплатной медицинской помощи
  kaz: Тегін медициналық көмектің кепілдік берілген көлемін алуға құқығы бар Қазақстан Республикасында уақытша болатын шетелдіктер мен азаматтығы жоқ адамдардың, баспана іздеген адамдардың айналасындағыларға қауіп төндіретін аурулардың тізбесін және медициналық көмектің көлемін бекіту туралы
