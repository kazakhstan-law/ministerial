title:
  rus: Об утверждении правил организации оказания медицинской помощи лицам с хроническими заболеваниями, периодичности и сроков наблюдения, обязательного минимума и кратности диагностических исследований
  kaz: Созылмалы аурулары бар адамдарға медициналық көмек көрсетуді ұйымдастыру, байқаудың мерзімділігі мен мерзімдерін, диагностикалық зерттеулердің міндетті минимумы мен еселігі қағидаларын бекіту туралы
