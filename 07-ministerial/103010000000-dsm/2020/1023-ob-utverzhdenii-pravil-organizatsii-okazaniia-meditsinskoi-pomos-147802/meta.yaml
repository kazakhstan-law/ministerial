  title:
    rus: О внесении изменения в приказ Министра здравоохранения Республики Казахстан от 23 октября 2020 года № ҚР ДСМ-149/2020 «Об утверждении правил организации оказания медицинской помощи лицам с хроническими заболеваниями, периодичности и сроков наблюдения, обязательного минимума и кратности диагностических исследований»
    kaz: «Созылмалы аурулары бар адамдарға медициналық көмек көрсетуді ұйымдастыру, байқаудың мерзімділігі мен мерзімдерін, диагностикалық зерттеулердің міндетті минимумы мен еселігі қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 23 қазандағы № ҚР ДСМ-149/2020 бұйрығына өзгеріс енгізу туралы
