act_code: '142479'
requisite: Приказ Министра здравоохранения Республики Казахстан от 30 апреля 2020 года № ҚР ДСМ-43/2020. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 мая 2020 года № 20556
title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача лицензии на ввоз на территорию Республики Казахстан из государств, не являющихся членами Евразийского экономического союза, и вывоз с территории Республики Казахстан в эти государства органов (части органа) и (или) тканей (части ткани) человека, крови и ее компонентов»
  kaz: «Адамның ағзаларын (ағзасының бөлігін) және (немесе) тіндерін (тінінің бөлігін), қан мен оның компоненттерін Еуразиялық экономикалық одаққа мүше болып табылмайтын мемлекеттерден Қазақстан Республикасының аумағына әкелуге және Қазақстан Республикасының аумағынан осы мемлекеттерге әкетуге лицензия беру» мемлекеттік қызметті көрсету қағидаларын бекіту туралы
