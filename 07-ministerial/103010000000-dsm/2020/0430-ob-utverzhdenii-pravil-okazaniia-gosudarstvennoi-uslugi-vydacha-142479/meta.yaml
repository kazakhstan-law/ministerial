  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 30 апреля 2020 года № ҚР ДСМ-43/2020 «Об утверждении Правил оказания государственной услуги «Выдача лицензии на ввоз на территорию Республики Казахстан и (или) вывоз с территории Республики Казахстан органов (части органов) и (или) тканей человека, крови и ее компонентов»
    kaz: «Адамның ағзаларын (ағзаларының бөліктерін) және (немесе) тіндерін, қан мен оның компоненттерін Қазақстан Республикасының аумағына әкелуге және (немесе) Қазақстан Республикасының аумағынан әкетуге лицензия беру» мемлекеттік қызметті көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 30 сәуірдегі № ҚР ДСМ-43/2020 бұйрығына өзгерістер енгізу туралы
