title:
  rus: Об утверждении Правил уничтожения лекарственных средств и медицинских изделий, пришедших в негодность, с истекшим сроком годности, фальсифицированных и иных лекарственных средств и медицинских изделий не соответствующих требованиям законодательства Республики Казахстан
  kaz: Жарамсыз болып қалған, жарамдылық мерзімі өткен дәрілік заттар мен медициналық бұйымдарды, жалған және Қазақстан Республикасы заңнамасының талаптарына сәйкес келмейтін басқа да дәрілік заттар мен медициналық бұйымдарды жою қағидаларын бекіту туралы
