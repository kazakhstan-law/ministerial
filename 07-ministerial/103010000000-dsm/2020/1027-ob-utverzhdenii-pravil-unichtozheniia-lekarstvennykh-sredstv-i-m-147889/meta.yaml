  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 27 октября 2020 года № ҚР ДСМ-155/2020 «Об утверждении Правил уничтожения субъектами в сфере обращения лекарственных средств и медицинских изделий в распоряжении которых находятся лекарственные средства и медицинские изделия, пришедшие в негодность, с истекшим сроком годности, фальсифицированные лекарственные средства и медицинские изделия и другие, не соответствующие требованиям законодательства Республики Казахстан»
    kaz: «Дәрілік заттар мен медициналық бұйымдардың айналысы саласындағы субъектілердің өз иелігіндегі жарамсыз болып қалған, жарамдылық мерзімі өткен дәрілік заттар мен медициналық бұйымдарды, жалған және Қазақстан Республикасы заңнамасының талаптарына сәйкес келмейтін басқа да дәрілік заттар мен медициналық бұйымдарды жою қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2020 жылғы 27 қазандағы № ҚР ДСМ-155/2020 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/182915/rus
