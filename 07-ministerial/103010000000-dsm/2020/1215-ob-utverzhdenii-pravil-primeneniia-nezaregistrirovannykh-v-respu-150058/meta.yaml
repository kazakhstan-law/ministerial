act_code: '150058'
requisite: Приказ Министра здравоохранения Республики Казахстан от 15 декабря 2020 года № ҚР ДСМ-280/2020. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 декабря 2020 года № 21806
title:
  rus: Об утверждении правил применения незарегистрированных в Республике Казахстан лекарственных средств и медицинских изделий для оказания медицинской помощи по жизненным показаниям конкретного пациента либо оказания медицинской помощи ограниченному контингенту пациентов с редкими (орфанными) заболеваниями и (или) состояниями
  kaz: Нақты пациенттің тіршілік көрсеткіштері бойынша медициналық көмек көрсету не сирек (орфандық) аурулары және (немесе) жай-күйі бар пациенттердің шектеулі контингентіне медициналық көмек көрсету үшін Қазақстан Республикасында тіркелмеген дәрілік заттар мен медициналық бұйымдарды қолдану қағидаларын бекіту туралы
