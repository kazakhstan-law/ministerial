  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 15 октября 2020 года № ҚР ДСМ-131/2020 «Об утверждении целевых групп лиц, подлежащих обязательным медицинским осмотрам, а также правил и периодичности их проведения, объема лабораторных и функциональных исследований, медицинских противопоказаний, перечня вредных и (или) опасных производственных факторов, профессий и работ, при выполнении которых проводятся предварительные обязательные медицинские осмотры при поступлении на работу и периодические обязательные медицинские осмотры и правил оказания государственной услуги «Прохождение предварительных обязательных медицинских осмотров»
    kaz: «Міндетті медициналық қарап-тексерулерге жататын адамдардың нысаналы топтарын, сондай-ақ оларды жүргізу тәртібі мен мерзімділігін, зертханалық және функционалдық зерттеулердің көлемін, медициналық қарсы көрсетілімдерді, зиянды және (немесе) қауіпті өндірістік факторлардың, жұмысқа орналасқан кезде орындау кезінде міндетті алдын ала медициналық қарап-тексерулер және мерзімдік міндетті медициналық қарап-тексерулер жүргізілетін кәсіптер мен жұмыстардың тізбесін және «Алдын ала міндетті медициналық қарап-тексерулерден өткізу» мемлекеттік қызметін көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2020 жылғы 15 қазандағы № ҚР ДСМ-131/2020 бұйрығына өзгерістер енгізу туралы
