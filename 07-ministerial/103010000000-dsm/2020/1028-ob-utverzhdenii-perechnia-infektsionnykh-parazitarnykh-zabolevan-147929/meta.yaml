title:
  rus: Об утверждении перечня инфекционных, паразитарных заболеваний и заболеваний, представляющих опасность для окружающих, при лечении которых оказывается специализированная медицинская помощь в стационарных условиях в рамках гарантированного объема бесплатной медицинской помощи
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде емдеу кезінде стационарлық жағдайда мамандырылған медициналық көмек көрсетілетін инфекциялық, паразиттік аурулар және айналадағыларға қауіп төндіретін аурулардың тізбесін бекіту туралы
