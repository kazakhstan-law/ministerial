title:
  rus: Об утверждении правил и условий изъятия, заготовки, хранения, консервации, транспортировки, трансплантации органов (части органа) и (или) тканей (части ткани) от донора к реципиенту
  kaz: Ағзаларды (ағзаның бөлігін) және (немесе) тіндерді (тіннің бөлігін) алу, дайындау, сақтау, консервациялау, тасымалдау, донордан реципиентке трансплантаттау қағидалары мен шарттарын бекіту туралы
