  title:
    rus: Об утверждении стандарта организации оказания гематологической помощи взрослому населению Республики Казахстан и внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 25 ноября 2020 года № ҚР ДСМ-207/2020 «Об утверждении правил и условий изъятия, заготовки, хранения, консервации, транспортировки, трансплантации органов (части органа) и (или) тканей (части ткани) от донора к реципиенту
    kaz: Қазақстан Республикасының ересек халқына гематологиялық көмек көрсетуді ұйымдастыру стандартын бекіту туралы және «Ағзаларды (ағзаның бөлігін) және (немесе) тіндерді (тіннің бөлігін) алу, дайындау, сақтау, консервациялау, тасымалдау, донордан реципиентке трансплантаттау қағидалары мен шарттарын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 25 қарашадағы № ҚР ДСМ-207/2020 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/161929/rus
