    kaz: «Халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы мемлекеттік қызметтерді көрсетудің кейбір мәселелері туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 30 желтоқсандағы № ҚР ДСМ-336/2020 бұйрығына өзгерістер мен толықтыру енгізу туралы
