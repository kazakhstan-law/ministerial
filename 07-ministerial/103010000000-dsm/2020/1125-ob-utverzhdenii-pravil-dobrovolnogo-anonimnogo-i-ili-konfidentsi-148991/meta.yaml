title:
  rus: Об утверждении правил добровольного анонимного и (или) конфиденциального медицинского обследования и консультирования по вопросам ВИЧ-инфекции в рамках гарантированного объема бесплатной медицинской помощи в государственных организациях здравоохранения, осуществляющих деятельность в сфере профилактики ВИЧ-инфекции
  kaz: АИТВ инфекциясының профилактикасы саласында қызметті жүзеге асыратын мемлекеттік денсаулық сақтау ұйымдарында тегін медициналық көмектің кепілдік берілген көлемі шеңберінде АИТВ инфекциясы мәселелері бойынша ерікті түрде анонимдік және (немесе) құпия медициналық зерттеп-қаралу және консультация алу қағидаларын бекіту туралы
