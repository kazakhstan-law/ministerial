title:
  rus: Об утверждении правил применения лекарственных средств передовой терапии в рамках исключения из стандартной процедуры допуска лекарственного средства на рынок, а также перечень медицинских организаций, имеющих право осуществлять лечение в рамках Hospital exemption
  kaz: Дәрілік затты нарыққа жіберудің стандартты рәсімінен шегініс шеңберінде озық терапияның дәрілік заттарын пайдалану қағидаларын, сондай-ақ Hospital exemption шеңберінде емдеуді жүзеге асыру құқығы бар медициналық ұйымдардың тізбесін бекіту туралы
