  kaz: Темекі бұйымдарын, оның ішінде қыздырылатын темекісі бар бұйымдарды, қорқорға арналған темекіні, қорқор қоспасын, темекі қыздыруға арналған жүйелерді сату жүзеге асырылатын орындарда жазба үшін темекі шегудің зияны туралы ескертуді бекіту туралы
