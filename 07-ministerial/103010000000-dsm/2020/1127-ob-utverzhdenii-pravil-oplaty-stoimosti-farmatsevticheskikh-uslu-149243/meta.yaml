title:
  rus: Об утверждении Правил оплаты стоимости фармацевтических услуг в рамках гарантированного объема бесплатной медицинской помощи и (или) медицинской помощи в системе обязательного социального медицинского страхования субъектам в сфере обращения лекарственных средств и медицинских изделий
  kaz: Дәрілік заттар мен медициналық бұйымдардың айналысы саласындағы субъектілерге тегін медициналық көмектің кепілдік берілген көлемі және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесіндегі медициналық көмек шеңберінде фармацевтикалық көрсетілетін қызметтердің құнын төлеу қағидаларын бекіту туралы
