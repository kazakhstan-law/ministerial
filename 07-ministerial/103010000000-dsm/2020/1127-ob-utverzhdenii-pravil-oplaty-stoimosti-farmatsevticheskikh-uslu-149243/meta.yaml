  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 27 ноября 2020 года № ҚР ДСМ-210/2020 «Об утверждении Правил оплаты стоимости фармацевтических услуг в рамках гарантированного объема бесплатной медицинской помощи и (или) медицинской помощи в системе обязательного социального медицинского страхования субъектам в сфере обращения лекарственных средств и медицинских изделий»
    kaz: «Дәрілік заттар мен медициналық бұйымдардың айналысы саласындағы субъектілерге тегін медициналық көмектің кепілдік берілген көлемі және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесіндегі медициналық көмек шеңберінде фармацевтикалық көрсетілетін қызметтердің құнын төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 27 қарашадағы № ҚР ДСМ-210/2020 бұйрығына өзгерістер енгізу туралы
