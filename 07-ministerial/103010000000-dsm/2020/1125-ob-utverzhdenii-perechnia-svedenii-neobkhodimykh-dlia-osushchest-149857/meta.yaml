  kaz: Камералдық бақылауды жүзеге асыру үшін қажетті мәліметтердің тізбесін, сондай-ақ оларды кеден органдарының, техникалық реттеу саласындағы уәкілетті органның ұсыну қағидаларын бекіту туралы
