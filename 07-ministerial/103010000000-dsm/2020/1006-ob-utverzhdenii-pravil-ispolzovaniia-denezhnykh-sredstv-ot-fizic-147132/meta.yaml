act_code: '147132'
requisite: Приказ Министра здравоохранения Республики Казахстан от 6 октября 2020 года № ҚР ДСМ-115/2020. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 октября 2020 года № 21372
title:
  rus: Об утверждении правил использования денежных средств от физических и юридических лиц, в том числе пенсионных выплат и государственных социальных пособий, зачисляемых на контрольный счет наличности государственной психиатрической организации специализированного типа с интенсивным наблюдением, для использования лицами с психическими, поведенческими расстройствами (заболеваниями), находящимися на принудительном лечении
  kaz: Мәжбүрлеп емдеуде жатқан психикалық, мінез-құлықтық бұзылушылықтары (аурулары) бар адамдардың пайдалануы үшін қарқынды байқау жасалатын мамандандырылған үлгідегі мемлекеттік психиатриялық ұйымның қолма-қол ақшаны бақылау шотына есепке жатқызылатын, жеке және заңды тұлғалардан түсетін ақшалай қаражатты, оның ішінде зейнетақы төлемдері мен мемлекеттік әлеуметтік жәрдемақыларды пайдалану қағидаларын бекіту туралы
