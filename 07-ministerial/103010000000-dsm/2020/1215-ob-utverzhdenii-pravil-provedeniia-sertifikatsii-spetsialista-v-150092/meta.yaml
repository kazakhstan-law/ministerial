caused_by:
  code: '178415'
  requisite: Приказ Министра здравоохранения Республики Казахстан от 27 января 2023 года № 18. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 января 2023 года № 31805
  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 15 декабря 2020 года № ҚР ДСМ-274/2020 «Об утверждении правил проведения сертификации специалиста в области здравоохранения, подтверждения действия сертификата специалиста в области здравоохранения, включая иностранных специалистов, а также условия допуска к сертификации специалиста в области здравоохранения лица, получившего медицинское и (или) фармацевтическое образование в области здравоохранения за пределами Республики Казахстан»
    kaz: «Денсаулық сақтау саласындағы маманды сертификаттауды жүргізу, шетелдік мамандарды қоса алғанда, денсаулық сақтау саласындағы маман сертификатының қолданысын растау қағидаларын, сондай-ақ Қазақстан Республикасынан тыс жерлерде медициналық білім алған адамды денсаулық сақтау саласындағы маманды сертификаттауға жіберу шарттарын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 15 желтоқсандағы № ҚР ДСМ-274/2020 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/178415/rus
