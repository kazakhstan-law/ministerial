act_code: '150092'
requisite: Приказ Министра здравоохранения Республики Казахстан от 15 декабря 2020 года № ҚР ДСМ-274/2020. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 декабря 2020 года № 21818
title:
  rus: Об утверждении Правил проведения сертификации специалиста в области здравоохранения, подтверждения действия сертификата специалиста в области здравоохранения, включая иностранных специалистов, а также условия допуска к сертификации специалиста в области здравоохранения лица, получившего медицинское образование за пределами Республики Казахстан
  kaz: Денсаулық сақтау саласындағы маманды сертификаттауды жүргізу, шетелдік мамандарды қоса алғанда, денсаулық сақтау саласындағы маман сертификатының қолданысын растау қағидаларын, сондай-ақ Қазақстан Республикасынан тыс жерлерде медициналық білім алған адамды денсаулық сақтау саласындағы маманды сертификаттауға жіберу шарттарын бекіту туралы
