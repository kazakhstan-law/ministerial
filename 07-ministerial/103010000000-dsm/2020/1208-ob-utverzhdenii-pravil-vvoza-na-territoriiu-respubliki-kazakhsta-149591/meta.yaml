  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 8 декабря 2020 года № ҚР ДСМ-237/2020 «Об утверждении Правил ввоза на территорию Республики Казахстан и вывоза с территории Республики Казахстан лекарственных средств и медицинских изделий и оказания государственной услуги «Выдача согласования и (или) заключения (разрешительного документа) на ввоз (вывоз) зарегистрированных и не зарегистрированных в Республике Казахстан лекарственных средств и медицинских изделий»
    kaz: «Дәрілік заттар мен медициналық бұйымдарды Қазақстан Республикасының аумағына әкелу және Қазақстан Республикасының аумағынан әкету және «Қазақстан Республикасында тіркелген және тіркелмеген дәрілік заттар мен медициналық бұйымдарды әкелуге (әкетуге) келісім және (немесе) қорытынды (рұқсат беру құжатын) беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 8 желтоқсандағы № ҚР ДСМ-237/2020 бұйрығына өзгерістер мен толықтырулар енгізу туралы
