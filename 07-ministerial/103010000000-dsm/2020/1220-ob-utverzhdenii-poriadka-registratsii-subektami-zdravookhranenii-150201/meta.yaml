act_code: '150201'
requisite: Приказ Министра здравоохранения Республики Казахстан от 20 декабря 2020 года № ҚР ДСМ-284/2020. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 декабря 2020 года № 21841
title:
  rus: Об утверждении порядка регистрации субъектами здравоохранения оказывающими специализированную медицинскую помощь в области профессиональной патологии и экспертизы по месту их выявления всех случаев профессиональных заболеваний и (или) отравлений, в том числе подозрений на профессиональные заболевания и (или) отравления, обусловленные воздействием на работника вредных производственных факторов в связи с выполнением работником своих трудовых (служебных) обязанностей, либо иных действий, по собственной инициативе в интересах работодателя, в том числе после прекращения трудовых отношений с работодателем
  kaz: Денсаулық сақтау субъектілерінің кәсіптік аурулардың және (немесе) уланудың, оның ішінде жұмыскердің өз еңбек (қызметтік) міндеттерін не жұмыс берушінің мүддесі үшін өз бастамасы бойынша өзге де әрекеттерді орындауына байланысты жұмыскерге зиянды өндірістік факторлардың әсер етуіне байланысты кәсіптік ауруларға және (немесе) улануға күдіктенудің барлық оқиғаларын, оның ішінде жұмыс берушімен еңбек қатынастары тоқтатылғаннан кейін олардың анықталған жері бойынша кәсіптік патология және сараптама саласында мамандандырылған медициналық көмек көрсететін тіркеу тәртібін бекіту туралы
