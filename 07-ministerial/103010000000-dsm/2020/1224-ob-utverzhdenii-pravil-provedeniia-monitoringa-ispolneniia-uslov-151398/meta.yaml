  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан «Об утверждении правил оплаты услуг субъектов здравоохранения в рамках гарантированного объема бесплатной медицинской помощи и (или) в системе обязательного социального медицинского страхования» от 20 декабря 2020 года № ҚР ДСМ-291/2020 и «Об утверждении Правил проведения мониторинга исполнения условий договора закупа медицинских услуг у субъектов здравоохранения в рамках гарантированного объема бесплатной медицинской помощи и (или) в системе обязательного социального медицинского страхования» от 24 декабря 2020 года № ҚР ДСМ-321/2020
    kaz: «Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде денсаулық сақтау субъектілерінің көрсетілетін қызметтеріне ақы төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 20 желтоқсандағы № ҚР ДСМ-291/2020 бұйрығына және «Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде денсаулық сақтау субъектілерінен медициналық қызметтерді сатып алу шарты талаптарының орындалу мониторингін жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің м.а. 2020 жылғы 24 желтоқсандағы № ҚР ДСМ-321/2020 бұйрығына өзгерістер енгізу туралы
