  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 30 ноября 2020 года № ҚР ДСМ-220/2020 «Об утверждении перечня продукции и эпидемически значимых объектов, подлежащих государственному контролю и надзору в сфере санитарно-эпидемиологического благополучия населения»
    kaz: «Халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы мемлекеттік бақылау мен қадағалауға жататын өнімдер мен эпидемиялық мәні бар объектілердің тізбесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 30 қарашадағы № ҚР ДСМ-220/2020 бұйрығына өзгерістер енгізу туралы
