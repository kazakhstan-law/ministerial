title:
  rus: Об утверждении перечня продукции и эпидемически значимых объектов, подлежащих государственному контролю и надзору в сфере санитарно-эпидемиологического благополучия населения
  kaz: Халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы мемлекеттік бақылау мен қадағалауға жататын өнімдер мен эпидемиялық мәні бар объектілердің тізбесін бекіту туралы
