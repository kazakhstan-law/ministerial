  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 2 апреля 2020 года № ҚР ДСМ-26/2020 «Об утверждении Правил оказания государственной услуги «Выдача информации об участии в качестве потребителя медицинских услуг и о перечисленных суммах отчислений и (или) взносов в системе обязательного социального медицинского страхования»
    kaz: «Міндетті әлеуметтік медициналық сақтандыру жүйесіне медициналық көрсетілетін қызметті тұтынушы ретінде қатысу туралы және аударымдардың және (немесе) жарналардың аударылған сомалары туралы ақпарат беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 2 сәуірдегі № ҚР ДСМ-26/2020 бұйрығына өзгерістер енгізу туралы
