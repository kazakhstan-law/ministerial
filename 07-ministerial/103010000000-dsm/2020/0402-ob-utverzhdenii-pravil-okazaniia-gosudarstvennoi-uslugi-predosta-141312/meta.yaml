title:
  rus: Об утверждении Правил оказания государственной услуги «Предоставление информации об участии в качестве потребителя медицинских услуг и о перечисленных суммах отчислений и (или) взносов в системе обязательного социального медицинского страхования»
  kaz: «Міндетті әлеуметтік медициналық сақтандыру жүйесіне медициналық көрсетілетін қызметті тұтынушы ретінде қатысу туралы және аударымдардың және (немесе) жарналардың аударылған сомалары туралы ақпарат ұсыну» мемлекеттік қызмет көрсету қағидаларын бекіту туралы
