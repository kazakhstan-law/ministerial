  title:
    rus: О внесении изменений и дополнения в приказ Министра здравоохранения Республики Казахстан от 30 декабря 2020 года № ҚР ДСМ-335/2020 «Об утверждении правил применения технических средств контроля, приборов наблюдения и фиксации, фото-, видеоаппаратуры, применяемых в медицинских организациях в целях обеспечения защиты прав пациентов и медицинских работников»
    kaz: «Пациенттер мен медицина қызметкерлерінің құқықтарын қорғауды қамтамасыз ету мақсатында медициналық ұйымдарда қолданылатын техникалық бақылау құралдарын, байқау және тіркеу аспаптарын, фото-, бейне аппаратураларды қолдану қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 30 желтоқсандағы № ҚР ДСМ-335/2020 бұйрығына өзгерістер мен толықтыру енгізу туралы
