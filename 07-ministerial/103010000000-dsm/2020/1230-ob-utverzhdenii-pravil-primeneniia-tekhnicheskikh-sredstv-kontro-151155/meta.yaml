title:
  rus: Об утверждении правил применения технических средств контроля, приборов наблюдения и фиксации, фото-, видеоаппаратуры, применяемых в медицинских организациях в целях обеспечения защиты прав пациентов и медицинских работников
  kaz: Пациенттер мен медицина қызметкерлерінің құқықтарын қорғауды қамтамасыз ету мақсатында медициналық ұйымдарда қолданылатын техникалық бақылауқұралдарын, байқау және тіркеу аспаптарын, фото-, бейнеаппаратураларды қолдану қағидаларын бекіту туралы
