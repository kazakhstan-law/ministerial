  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 24 декабря 2020 года № ҚР ДСМ-322/2020 «Об утверждении правил приостановления, запрета или изъятия из обращения либо ограничения применения лекарственных средств и медицинских изделий»
    kaz: «Дәрілік заттар мен медициналық бұйымдарды қолдануды тоқтата тұру, тыйым салу немесе айналыстан алып қою не шектеу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушы 2020 жылғы 24 желтоқсандағы № ҚР ДСМ-322/2020 бұйрығына өзгерістер енгізу туралы
