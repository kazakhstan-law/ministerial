requisite: Приказ Министра здравоохранения Республики Казахстан от 4 ноября 2020 года № ҚР ДСМ-181/2020. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 ноября 2020 года № 21596
title:
  rus: Об утверждении правил осуществления в рамках фармацевтической инспекции оценки материалов и соответствия условий проведения доклинических (неклинических) исследований требованиям надлежащей лабораторной практики (GLP) Республики Казахстан и (или) Евразийского экономического союза
  kaz: Клиникаға дейінгі (клиникалық емес) зерттеулердің материалдарын және оларды жүргізу шарттарының Қазақстан Республикасының және (немесе) Еуразиялық экономикалық одақтың тиісті зертханалық практиканың (GLP) талаптарына сәйкестігін бағалауды фармацевтикалық инспекция шеңберінде жүзеге асыру қағидаларын бекіту туралы
