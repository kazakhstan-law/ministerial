title:
  rus: Об утверждении Правил проведения конкурса на вакантную должность руководителя, единолично осуществляющего функции исполнительного органа или руководителя коллегиального исполнительного органа государственного предприятия на праве хозяйственного ведения с наблюдательным советом в области здравоохранения
  kaz: Денсаулық сақтау саласындағы байқау кеңесі бар шаруашылық жүргізу құқығындағы мемлекеттік кәсіпорынның атқарушы органының немесе алқалы атқарушы органы басшысының функцияларын жеке-дара жүзеге асыратын басшының бос лауазымына конкурс өткізу қағидаларын бекіту туралы
