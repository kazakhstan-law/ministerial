  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 11 декабря 2020 года № ҚР ДСМ-249/2020 «Об утверждении правил оценки знаний и навыков обучающихся, оценки профессиональной подготовленности выпускников образовательных программ в области здравоохранения и специалистов в области здравоохранения»
    kaz: «Денсаулық сақтау саласындағы білім беру бағдарламалары білім алушыларының білімі мен дағдыларын бағалау, түлектерінің кәсіптік даярлығын бағалау, денсаулық сақтау саласындағы мамандардың кәсіптік даярлығын бағалау қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 11 желтоқсандағы № ҚР ДСМ-249/2020 бұйрығына өзгерістер енгізу туралы
