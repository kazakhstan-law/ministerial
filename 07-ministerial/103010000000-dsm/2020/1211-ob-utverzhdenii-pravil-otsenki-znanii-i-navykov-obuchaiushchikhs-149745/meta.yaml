title:
  rus: Об утверждении правил оценки знаний и навыков обучающихся, оценки профессиональной подготовленности выпускников образовательных программ в области здравоохранения и специалистов в области здравоохранения
  kaz: Денсаулық сақтау саласындағы білім беру бағдарламалары білім алушыларының білімі мен дағдыларын бағалау, түлектерінің кәсіптік даярлығын бағалау, денсаулық сақтау саласындағы мамандардың кәсіптік даярлығын бағалау қағидаларын бекіту туралы
