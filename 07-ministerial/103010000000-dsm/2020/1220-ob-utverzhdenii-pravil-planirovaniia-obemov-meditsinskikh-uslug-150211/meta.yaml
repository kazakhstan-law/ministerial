title:
  rus: Об утверждении правил планирования объемов медицинских услуг в рамках гарантированного объема бесплатной медицинской помощи и (или) в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көрсетілетін қызметтердің көлемін жоспарлау қағидаларын бекіту туралы
