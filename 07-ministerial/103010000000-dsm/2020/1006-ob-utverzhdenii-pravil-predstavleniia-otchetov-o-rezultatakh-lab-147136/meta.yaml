title:
  rus: Об утверждении Правил представления отчетов о результатах лабораторных исследований по предельно допустимому содержанию никотина во всех марках табака и табачных изделий, в том числе изделий с нагреваемым табаком
  kaz: Темекінің және темекі бұйымдарының, оның ішінде қыздырылатын темекісі бар бұйымдардың барлық маркаларындағы никотиннің рұқсат етілетін шекті құрамы бойынша зертханалық зерттеулердің нәтижелері туралы есептерді ұсыну қағидаларын бекіту туралы
