  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 6 октября 2020 года № ҚР ДСМ-114/2020 «Об утверждении Правил представления отчетов о результатах лабораторных исследований по предельно допустимому содержанию никотина во всех марках табака и табачных изделий, в том числе изделий с нагреваемым табаком»
    kaz: «Темекінің және темекі бұйымдарының, оның ішінде қыздырылатын темекісі бар бұйымдардың барлық маркаларындағы никотиннің рұқсат етілетін шекті құрамы бойынша зертханалық зерттеулердің нәтижелері туралы есептерді ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 6 қазандағы № ҚР ДСМ-114/2020 бұйрығына өзгерістер енгізу туралы
