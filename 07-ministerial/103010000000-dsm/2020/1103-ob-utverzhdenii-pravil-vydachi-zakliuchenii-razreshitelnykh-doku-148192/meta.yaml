act_code: '148192'
requisite: Приказ Министра здравоохранения Республики Казахстан от 3 ноября 2020 года № ҚР ДСМ-177/2020. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 ноября 2020 года № 21592
title:
  rus: Об утверждении правил выдачи заключений (разрешительных документов) на ввоз на территорию Республики Казахстан из государств, не являющихся членами Евразийского экономического союза, и вывоз с территории Республики Казахстан в эти государства образцов биологических материалов человека, гемопоэтических стволовых клеток, костного мозга, донорских лимфоцитов в целях проведения неродственной трансплантации, половых клеток и эмбрионов
  kaz: Туыстық емес трансплантаттауды жүргізу мақсатында адамның биологиялық материалдарының үлгілерін, гемопоэздік дің жасушаларын, сүйек кемігін, донорлық лимфоциттерді, жыныстық жасушалар мен эмбриондарды Еуразиялық экономикалық одаққа мүше болып табылмайтын мемлекеттерден Қазақстан Республикасының аумағына әкелуге және Қазақстан Республикасының аумағынан осы мемлекеттерге әкетуге қорытындылар (рұқсат беру құжаттарын) беру қағидаларын бекіту туралы
