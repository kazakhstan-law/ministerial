title:
  rus: Об утверждении правил регулирования, формирования предельных цен и наценки на лекарственные средства, а также медицинские изделия в рамках гарантированного объема бесплатной медицинской помощи и (или) в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттардың, сондай-ақ медициналық бұйымдардың шекті бағалары мен үстеме бағаларын реттеу және қалыптастыру қағидаларын бекіту туралы
