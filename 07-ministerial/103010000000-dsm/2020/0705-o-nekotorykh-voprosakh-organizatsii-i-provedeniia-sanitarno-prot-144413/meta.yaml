title:
  rus: О некоторых вопросах организации и проведения санитарно-противоэпидемических и санитарно-профилактических мероприятий
  kaz: Санитариялық-эпидемияға қарсы және санитариялық-профилактикалық іс-шараларды ұйымдастыру мен жүргізудің кейбір мәселелері туралы
