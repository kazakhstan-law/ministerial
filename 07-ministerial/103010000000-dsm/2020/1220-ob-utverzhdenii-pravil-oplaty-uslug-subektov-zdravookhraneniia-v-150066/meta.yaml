  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 20 декабря 2020 года № ҚР ДСМ-291/2020 «Об утверждении правил оплаты услуг субъектов здравоохранения в рамках гарантированного объема бесплатной медицинской помощи и (или) в системе обязательного социального медицинского страхования»
    kaz: «Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде денсаулық сақтау субъектілерінің көрсетілетін қызметтеріне ақы төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 20 желтоқсандағы № ҚР ДСМ-291/2020 бұйрығына өзгерістер мен толықтырулар енгізу туралы
