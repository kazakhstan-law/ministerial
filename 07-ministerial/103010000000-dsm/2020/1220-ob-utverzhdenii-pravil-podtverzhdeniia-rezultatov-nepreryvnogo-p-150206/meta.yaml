title:
  rus: Об утверждении Правил подтверждения результатов непрерывного профессионального развития, присвоения и подтверждения уровня квалификации работников системы здравоохранения
  kaz: Денсаулық сақтау жүйесі қызметкерлерінің үздіксіз кәсіптік даму нәтижелерін растау, біліктілік деңгейін беру және растау қағидаларын бекіту туралы
