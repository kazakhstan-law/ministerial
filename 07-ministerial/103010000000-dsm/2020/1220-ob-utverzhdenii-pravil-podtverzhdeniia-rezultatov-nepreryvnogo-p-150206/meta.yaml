caused_by:
  code: '208757'
  requisite: Приказ Министра здравоохранения Республики Казахстан от 1 апреля 2025 года № 29. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 апреля 2025 года № 35913
  title:
    rus: О внесении изменений и дополнения в приказ министра здравоохранения Республики Казахстан от 11 декабря 2020 года № ҚР ДСМ-249/2020 «Об утверждении правил оценки знаний и навыков обучающихся, оценки профессиональной подготовленности выпускников образовательных программ в области здравоохранения и специалистов в области здравоохранения» и приказ министра здравоохранения Республики Казахстан от 20 декабря 2020 года № ҚР ДСМ-283/2020 «Об утверждении правил подтверждения результатов непрерывного профессионального развития, присвоения и подтверждения уровня квалификации работников здравоохранения»
    kaz: «Денсаулық сақтау саласындағы білім беру бағдарламалары білім алушыларының білімі мен дағдыларын бағалау, түлектерінің кәсіптік даярлығын бағалау, денсаулық сақтау саласындағы мамандардың кәсіптік даярлығын бағалау қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 11 желтоқсандағы № ҚР ДСМ-249/2020 бұйрығына және «Денсаулық сақтау қызметкерлерінің үздіксіз кәсіптік даму нәтижелерін растау, біліктілік деңгейін беру және растау қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 20 желтоқсандағы № ҚР ДСМ-283/2020 бұйрығына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/208757/rus
