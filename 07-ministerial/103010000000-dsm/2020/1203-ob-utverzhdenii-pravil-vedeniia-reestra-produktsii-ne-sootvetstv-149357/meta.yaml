    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 3 декабря 2020 года № ҚР ДСМ-229/2020 «Об утверждении правил ведения реестра продукции, не соответствующей требованиям нормативных правовых актов в сфере санитарно-эпидемиологического благополучия населения»
