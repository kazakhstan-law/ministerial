title:
  rus: Об утверждении правил ведения учета субъектов здравоохранения, оказывающих медицинскую помощь в рамках гарантированного объема бесплатной медицинской помощи и (или) в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмек көрсететін денсаулық сақтау субъектілерін есепке алуды жүргізу қағидаларын бекіту туралы
