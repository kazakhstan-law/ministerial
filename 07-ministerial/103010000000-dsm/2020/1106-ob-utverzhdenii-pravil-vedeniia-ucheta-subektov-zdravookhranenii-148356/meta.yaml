  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 6 ноября 2020 года № ҚР ДСМ-186/2020 «Об утверждении правил ведения учета субъектов здравоохранения, оказывающих медицинскую помощь в рамках гарантированного объема бесплатной медицинской помощи и (или) в системе обязательного социального медицинского страхования»
    kaz: «Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмек көрсететін денсаулық сақтау субъектілерін есепке алуды жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 6 қарашадағы № ҚР ДСМ-186/2020 бұйрығына өзгерістер енгізу туралы
