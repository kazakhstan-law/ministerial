  title:
    rus: О внесении изменений и дополнения в приказ Министра здравоохранения Республики Казахстан от 4 апреля 2020 года № ҚР ДСМ-28/2020 «О некоторых вопросах финансовой поддержки работников организаций здравоохранения, задействованных в противоэпидемических мероприятиях в рамках борьбы с коронавирусом COVID-19»
    kaz: «COVID-19 короновирусымен күрес шеңберінде эпидемияға қарсы іс-шараларға тартылған денсаулық сақтау ұйымдарының жұмыскерлерін қаржылық қолдаудың кейбір мәселелері туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 4 сәуірдегі № ҚР ДСМ-28/2020 бұйрығына өзгерістер мен толықтыру енгізу туралы
