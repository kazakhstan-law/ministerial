  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 15 декабря 2020 года № ҚР ДСМ-278/2020 «Об утверждении правил поощрения работников субъектов здравоохранения, оказывающих медицинские услуги в рамках гарантированного объема бесплатной медицинской помощи и (или) в системе обязательного социального медицинского страхования»
    kaz: «Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық қызметтер көрсететін денсаулық сақтау субъектілерінің жұмыскерлерін көтермелеу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 15 желтоқсандағы № ҚР ДСМ-278/2020 бұйрығына өзгерістер енгізу туралы
