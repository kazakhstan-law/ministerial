  title:
    rus: О внесении дополнения в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 30 октября 2020 года № ҚР ДСМ-175/2020 «Об утверждении форм учетной документации в области здравоохранения, а также инструкций по их заполнению» и о признании утратившим силу приказа Министра здравоохранения Республики Казахстан от 24 июня 2003 года № 469 «Об утверждении Инструкции по заполнению и ведению учетной формы 026/у-3 «Паспорта здоровья ребенка»
    kaz: «Денсаулық сақтау саласындағы есепке алу құжаттамасының нысандарын, сондай-ақ оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2020 жылғы 30 қазандағы № ҚР ДСМ-175/2020 бұйрығына толықтыру енгізу туралы және Қазақстан Республикасының Денсаулық сақтау министрлігінің «Бала денсаулығы паспорты» 026/у-3 есеп нысанын толтыру және жүргізу жөніндегі Нұсқаулықты бекіту туралы» 2003 жылғы 24 маусымдағы № 469 бұйрығының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/190463/rus
