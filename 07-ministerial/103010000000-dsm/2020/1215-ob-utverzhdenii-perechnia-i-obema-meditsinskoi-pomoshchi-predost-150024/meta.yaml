act_code: '150024'
requisite: Приказ Министра здравоохранения Республики Казахстан от 15 декабря 2020 года № ҚР ДСМ-267/2020. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 декабря 2020 года № 21801
title:
  rus: Об утверждении перечня и объема медицинской помощи, предоставляемой иностранцам и лицам без гражданства, свобода которых ограничена, а также отбывающим наказание по приговору суда в местах лишения свободы, задержанным, заключенным под стражу и помещенным в специальные учреждения в рамках гарантированного объема бесплатной медицинской помощи
  kaz: Бас бостандығы шектелген, сондай-ақ сот үкімімен бас бостандығынан айыру орындарында жазасын өтеп жүрген, ұсталған, күзетпен қамауға алынған және арнаулы мекемелерге орналастырылған шетелдіктер мен азаматтығы жоқ адамдардың уәкілетті орган айқындайтын тегін медициналық көмектің кепілдік берілген көлемі шеңберінде көрсетілетін медициналық көмектің тізбесі мен көлемін бекіту туралы
