caused_by:
  code: '166350'
  requisite: Приказ Министра здравоохранения Республики Казахстан от 7 апреля 2022 года № ҚР ДСМ- 35. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 апреля 2022 года № 27526
  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 11 декабря 2020 года № ҚР ДСМ-248/2020 «Об утверждении правил проведения клинических исследований лекарственных средств и медицинских изделий, клинико-лабораторных испытаний медицинских изделий для диагностики вне живого организма (in vitro) и требования к клиническим базам и оказания государственной услуги «Выдача разрешения на проведение клинического исследования и (или) испытания фармакологических и лекарственных средств, медицинских изделий»
    kaz: «Дәрілік заттар мен медициналық бұйымдарға клиникалық зерттеулер, тірі организмнен тыс (in vitro) диагностика үшін медициналық бұйымдарға клиникалық-зертханалық сынаулар жүргізу қағидаларын және клиникалық базалар мен «Фармакологиялық және дәрілік заттарды, медициналық бұйымдарды клиникалық зерттеуді және (немесе) сынауды жүргізуге рұқсат беру» мемлекеттік қызмет көрсетуге қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2020 жылғы 11 желтоқсандағы № ҚР ДСМ-248/2020 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/166350/rus
