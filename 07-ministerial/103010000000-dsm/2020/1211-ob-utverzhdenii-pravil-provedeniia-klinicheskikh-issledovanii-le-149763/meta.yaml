act_code: '149763'
requisite: Приказ Министра здравоохранения Республики Казахстан от 11 декабря 2020 года № ҚР ДСМ-248/2020. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 декабря 2020 года № 21772
title:
  rus: Об утверждении правил проведения клинических исследований лекарственных средств и медицинских изделий, клинико-лабораторных испытаний медицинских изделий для диагностики вне живого организма (in vitro) и требований к клиническим базам и оказания государственной услуги «Выдача разрешения на проведение интервенционного клинического исследования фармакологического или лекарственного средства, медицинского изделия»
  kaz: Дәрілік заттар мен медициналық бұйымдарға клиникалық зерттеулер, организмнен тыс (in vitro) диагностикалауға арналған медициналық бұйымдарға клиникалық-зертханалық сынақтар жүргізу қағидаларын және клиникалық базаларға қойылатын талаптарды және «Фармакологиялық немесе дәрілік затқа, медициналық бұйымға интервенциялық клиникалық зерттеу жүргізуге рұқсат беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы
