requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 27 марта 2006 года № 130. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 апреля 2006 года № 4191. Утратил силу приказом Министра здравоохранения Республики Казахстан от от 30 июня 2010 года № 476
title:
  rus: Об утверждении санитарно-эпидемиологических правил и норм "Санитарно-эпидемиологические требования к содержанию подвальных помещений при проведении дезинсекционных мероприятий для уничтожения бытовых насекомых, синантропных мух и комаров"
  kaz: '"Тұрмыстық жәндiктердi, синантроптық масалар мен сары масаларды жоюға арналған дезинсекциялық іс-шараларды жүргізуде жертөле үй-жайларына қойылатын санитарлық-эпидемиологиялық талаптар" санитарлық-эпидемиологиялық ережесi мен нормаларын бекiту туралы'
