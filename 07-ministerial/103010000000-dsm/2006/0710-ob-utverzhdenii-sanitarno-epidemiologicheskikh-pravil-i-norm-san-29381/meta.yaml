title:
  rus: Об утверждении санитарно-эпидемиологических правил и норм "Санитарно-эпидемиологические требования к содержанию и эксплуатации моек, станций (мастерских) технического обслуживания и ремонта автомобильных транспортных средств"
  kaz: '"Автомобиль көлік құралдарын жууды, техникалық қызмет көрсету және жөндеу станцияларын шеберханаларын күтіп ұстауға және пайдалануға қойылатын санитарлық-эпидемиологиялық талаптар" туралы санитарлық-эпидемиологиялық ережесі мен нормаларын бекіту туралы"'
