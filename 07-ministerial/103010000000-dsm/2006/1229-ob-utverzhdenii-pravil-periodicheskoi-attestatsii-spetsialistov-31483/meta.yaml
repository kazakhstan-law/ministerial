    kaz: Қазақстан Республикасы Әділет министрлігінде 2007 жылғы 25 қаңтардағы N 4525 тіркелген "Фармацевтикалық қызметті жүзеге асыратын мамандарды мерзімдік аттестаттау ережесін бекіту туралы" Қазақстан Республикасы Денсаулық сақтау министрінің 2006 жылғы 29 желтоқсандағы N 658 бұйрығына өзгерістер енгізу туралы
