requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 15 августа 2006 года № 349. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 сентября 2006 года № 4385. Утратил силу приказом Министра здравоохранения Республики Казахстан от от 30 июня 2010 года № 476
title:
  rus: Об утверждении санитарно-эпидемиологических правил и норм "Санитарно-эпидемиологические требования к условиям работы и медицинского обеспечения при проведении инфекционного контроля за внутрибольничными инфекциями в медицинских организациях Республики Казахстан"
  kaz: '"Қазақстан Республикасының медициналық ұйымдарында ауруханаішілік жұқпалы ауруларға инфекциялық бақылауды жүргізу кезінде жұмыс жағдайы мен медициналық қамтамасыз етуге қойылатын санитарлық-эпидемиологиялық талаптар" санитарлық-эпидемиологиялық ережесі мен нормаларын бекіту туралы'
