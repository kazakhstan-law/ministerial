  title:
    rus: О внесении дополнений и изменений в приказ и.о. Министра здравоохранения Республики Казахстан от 15 августа 2006 года N 349 "Об утверждении санитарно-эпидемиологических правил и норм "Санитарно-эпидемиологические требования к условиям работы и медицинского обеспечения при проведении инфекционного контроля за внутрибольничными инфекциями в медицинских организациях Республики Казахстан"
    kaz: '"Қазақстан Республикасының медициналық ұйымдарында ауруханаішілік жұқпалы ауруларға инфекциялық бақылауды жүргізу кезінде жұмыс жағдайы мен медициналық қамтамасыз етуге қойылатын санитарлық-эпидемиологиялық талаптар" санитарлық-эпидемиологиялық ережесі мен нормаларын бекіту туралы" Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2006 жылғы 15 тамыздағы N 349 бұйрығына толықтырулар мен өзгерістер енгізу туралы'
