  code: '106201'
  requisite: Приказ и.о. Министра здравоохранения и социального развития Республики Казахстан от 10 августа 2016 года № 711. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 сентября 2016 года № 14225. Утратил силу приказом Министра здравоохранения Республики Казахстан от 29 августа 2017 года № 666 (вводится в действие с 1 января 2018 года)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 4 ноября 2011 года № 786 "Об утверждении Перечня лекарственных средств и изделий медицинского назначения для бесплатного обеспечения населения в рамках гарантированного объема бесплатной медицинской помощи на амбулаторном уровне с определенными заболеваниями (состояниями) и специализированными лечебными продуктами"
    kaz: '"Тегін медициналық көмектің кепілдік берілген көлемінің шеңберінде амбулаториялық деңгейде белгілі бір аурулары (жай-күйі) бар халықты тегін қамтамасыз ету үшін дәрілік заттардың және медициналық мақсаттағы бұйымдардың және мамандырылған емдік өнімдердің тізбесін бекіту туралы" Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2011 жылғы 4 қарашадағы № 786 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/106201/rus
