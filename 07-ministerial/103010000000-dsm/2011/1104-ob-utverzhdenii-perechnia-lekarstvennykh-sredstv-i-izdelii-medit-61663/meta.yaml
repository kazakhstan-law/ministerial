  title:
    rus: «О внесении изменений в приказ и.о. Министра здравоохранения Республики Казахстан от 4 ноября 2011 года №  786 «Об утверждении Перечня лекарственных средств и изделий медицинского назначения для бесплатного обеспечения населения  в рамках гарантированного объема бесплатной медицинской помощи на амбулаторном уровне с определенными заболеваниями (состояниями) и специализированными лечебными продуктами»
    kaz: «Тегін медициналық көмектің кепілдік берілген көлемінің шеңберінде амбулаториялық деңгейде белгілі бір аурулары (жай-күйі) бар халықты тегін қамтамасыз ету үшін дәрілік заттардың және медициналық мақсаттағы бұйымдардың және бейімделген емдік өнімдердің тізбесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау Министрінің м.а. 2011 жылғы 4 қарашадағы № 786 бұйрығына өзгерістер енгізу туралы»
