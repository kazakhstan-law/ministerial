act_code: '61663'
requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 4 ноября 2011 года № 786. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 ноября 2011 года № 7306. Утратил силу приказом Министра здравоохранения Республики Казахстан от 29 августа 2017 года № 666 (вводится в действие с 1 января 2018 года)
title:
  rus: Об утверждении Перечня лекарственных средств и изделий медицинского назначения в рамках гарантированного объема бесплатной медицинской помощи, в том числе отдельных категорий граждан с определенными заболеваниями (состояниями) бесплатными или льготными лекарственными средствами и специализированными лечебными продуктами на амбулаторном уровне
  kaz: Тегін медициналық көмектің кепілдік берілген көлемінің шеңберінде дәрілік заттармен және медициналық мақсаттағы бұйымдармен, оның ішінде белгілі бір аурулары (жай-күйлері) бар азаматтардың жекелеген санаттарына амбулаториялық деңгейде тегін немесе жеңілдікпен берілетін дәрілік заттармен және мамандандырылған емдік өнімдердің тізбесін бекіту туралы
