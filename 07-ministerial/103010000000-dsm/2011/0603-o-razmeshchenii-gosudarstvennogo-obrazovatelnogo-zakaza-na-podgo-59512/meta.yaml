act_code: '59512'
requisite: Приказ Министра здравоохранения Республики Казахстан от 3 июня 2011 года № 349. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 июня 2011 года № 7042.
title:
  rus: О размещении государственного образовательного заказа на подготовку специалистов с высшим медицинским и фармацевтическим образованием в республиканских государственных предприятиях на праве хозяйственного ведения "Казахский национальный медицинский университет имени С.Д. Асфендиярова" и "Южно-Казахстанская государственная фармацевтическая академия", в акционерном обществе Медицинский университет Астана", финансируемых из республиканского бюджета на 2011-2012 учебный год
  kaz: Республикалық бюджеттен қаржыландырылатын "С.Ж. Асфендияров атындағы Қазақ ұлттық медицина университеті" мен "Оңтүстік Қазақстан мемлекеттік фармацевтика академиясы" шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорындарында, "Астана медицина университеті" акционерлік қоғамында жоғары медициналық және фармацевтикалық білімі бар мамандарды даярлауға 2011-2012 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру туралы
