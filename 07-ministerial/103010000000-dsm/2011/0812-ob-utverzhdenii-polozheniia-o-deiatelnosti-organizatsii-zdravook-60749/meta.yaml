    kaz: '"Қазақстан Республикасының халқына онкологиялық көмек көрсететін денсаулық сақтау ұйымдарының қызметі туралы ережені бекіту туралы" Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2011 жылғы 12 тамыздағы № 540 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
