requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 1 июля 2011 года № 442. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 августа 2011 года № 7109. Отменен приказом Министра здравоохранения Республики Казахстан от 18 мая 2012 года № 362
title:
  rus: Об утверждении санитарно-эпидемиологических правил и норм по организации и проведению санитарно-противоэпидемических (профилактических) мероприятий по предупреждению заболеваемости острыми кишечными инфекциями, сальмонеллезом, брюшным тифом и паратифами
  kaz: Жіті ішек инфекцияларымен, сальмонеллезбен, іш сүзегімен және қылаумен сырқаттанушылықтың алдын алу жөніндегі санитариялық-эпидемияға қарсы (профилактикалық) іс-шараларды ұйымдастыру және жүргізу бойынша санитариялық-эпидемиологиялық ережесі мен нормаларын бекіту туралы
