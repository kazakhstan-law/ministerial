  requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 9 ноября 2015 года № 852. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 декабря 2015 года № 12379. Утратил силу приказом Министра здравоохранения Республики Казахстан от 24 сентября 2018 года № ҚР ДСМ-17 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 6 января 2011 года № 15 "Об утверждении Положения о деятельности психиатрических организаций в Республике Казахстан"
    kaz: '"Қазақстан Республикасындағы психиатриялық ұйымдардың қызметі туралы ережені бекіту туралы" Қазақстан Республикасының Денсаулық сақтау және әлеуметтік даму министрінің міндетін атқарушының 2011 жылғы 6 қаңтардағы № 15 бұйрығына өзгерістер енгізу туралы'
