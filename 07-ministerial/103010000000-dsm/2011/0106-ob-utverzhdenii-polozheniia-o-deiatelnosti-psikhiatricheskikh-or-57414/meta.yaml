act_code: '57414'
requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 6 января 2011 года № 15. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 февраля 2011 года № 6776. Утратил силу приказом Министра здравоохранения Республики Казахстан от 24 сентября 2018 года № ҚР ДСМ-17 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Положения о деятельности психиатрических организаций в Республике Казахстан
  kaz: Қазақстан Республикасындағы психиатриялық ұйымдардың қызметі туралы ережені бекіту туралы
