  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 6 июня 2011 года № 355 «Об утверждении Положения о деятельности центров по профилактике и борьбе с синдромом приобретенного иммунодефицита»
    kaz: '"Жұқтырылған иммун тапшылығы синдромының профилактикасы және оған қарсы күрес жөніндегі орталықтардың қызметі туралы ережені бекіту туралы" Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2011 жылғы 6 маусымдағы № 355 бұйрығына өзгеріс енгізу туралы'
