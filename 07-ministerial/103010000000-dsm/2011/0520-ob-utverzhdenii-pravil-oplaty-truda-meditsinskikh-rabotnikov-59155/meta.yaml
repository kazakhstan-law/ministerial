  requisite: Приказ Министра здравоохранения Республики Казахстан от 16 сентября 2011 года № 622. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 сентября 2011 года № 7213. Утратил силу приказом Министра здравоохранения Республики Казахстан от 21 декабря 2020 года № ҚР ДСМ-309/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в приказы Министра здравоохранения Республики Казахстан от 20 мая 2011 года № 310 "Об утверждении Правил оплаты труда медицинских работников" и от 26 ноября 2009 года № 801 "Об утверждении Методики формирования тарифов и планирования затрат на медицинские услуги, оказываемые в рамках гарантированного объема бесплатной медицинской помощи"
    kaz: '"Медицина қызметкерлеріне еңбекақы төлеу қағидасын бекіту туралы" 2011 жылғы 20 мамырдағы № 310 және "Тегiн медициналық көмектiң кепiлдiк берiлген көлемiнiң шеңберiнде көрсетiлетiн медициналық қызметтерге тарифтер жасау мен шығындарды жоспарлау әдiстемесiн бекіту туралы" Қазақстан Республикасы Денсаулық сақтау министрінің 2009 жылғы 26 қарашадағы № 801 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/60737/rus
