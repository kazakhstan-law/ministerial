act_code: '59994'
requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 1 июля 2011 года № 440. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 июля 2011 года № 7085. Отменен приказом Министра здравоохранения Республики Казахстан от 18 мая 2012 года № 362
title:
  rus: Об утверждении санитарных правил "Санитарно-эпидемиологические требования к содержанию и эксплуатации объектов по добыче и переработке хризотил - асбеста, производству хризотилсодержащих изделий и материалов, условиям работы с ними"
  kaz: '"Хризотил-асбест өндiретiн және қайта өңдейтін, құрамында хризотил бар бұйымдар мен материалдарды өндіретін объектілерді күтіп-ұстауға және пайдалануға, олармен жұмыс істеу жағдайларына қойылатын санитариялық- эпидемиологиялық талаптар" санитариялық ережесін бекіту туралы'
