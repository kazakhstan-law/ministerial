  title:
    rus: О внесении изменения в приказ Министра здравоохранения Республики Казахстан от 30 июля 2019 года № ҚР ДСМ-107 «О размещении государственного образовательного заказа на подготовку специалистов с послесредним, высшим и послевузовским медицинским и фармацевтическим образованием на 2019-2020 учебный год»
    kaz: «Орта білімнен кейінгі, жоғары және жоғары оқу орнынан кейінгі медициналық және фармацевтикалық білімі бар мамандарды даярлауға 2019-2020 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2019 жылғы 30 шілдедегі № ҚР ДСМ-107 бұйрығына өзгеріс енгізу туралы
