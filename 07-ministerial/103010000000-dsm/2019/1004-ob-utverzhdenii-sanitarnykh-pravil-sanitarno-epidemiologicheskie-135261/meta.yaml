requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 4 октября 2019 года № ҚР ДСМ-135. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 октября 2019 года № 19454. Утратил силу приказом Министра здравоохранения Республики Казахстан от 2 февраля 2021 года № ҚР ДСМ-13 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Санитарных правил «Санитарно-эпидемиологические требования к организации и проведению санитарно-противоэпидемических и санитарно-профилактических мероприятий в отношении больных инфекционными заболеваниями, против которых проводятся профилактические прививки»
  kaz: «Қарсы профилактикалық егулер жүргізілетін инфекциялық аурулармен ауыратын науқастарға қатысты санитариялық-эпидемияға қарсы және санитариялық-профилактикалық іс-шараларды ұйымдастыруға және өткізуге қойылатын санитариялық-эпидемиологиялық талаптар» санитариялық қағидаларын бекіту туралы
