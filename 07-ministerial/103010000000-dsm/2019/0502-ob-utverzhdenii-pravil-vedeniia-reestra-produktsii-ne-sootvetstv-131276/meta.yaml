act_code: '131276'
requisite: Приказ Министра здравоохранения Республики Казахстан от 2 мая 2019 года № ҚР ДСМ-59. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 мая 2019 года № 18629. Утратил силу приказом Министра здравоохранения Республики Казахстан от 3 декабря 2020 года № ҚР ДСМ-229/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил ведения реестра продукции, не соответствующей требованиям нормативных правовых актов в сфере санитарно-эпидемиологического благополучия населения, гигиенических нормативов и технических регламентов
  kaz: «Халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы нормативтік құқықтық актілердің, гигиеналық нормативтер мен техникалық регламенттердің талаптарына сәйкес келмейтін өнімнің тізілімін жүргізу қағидаларын бекіту туралы»
