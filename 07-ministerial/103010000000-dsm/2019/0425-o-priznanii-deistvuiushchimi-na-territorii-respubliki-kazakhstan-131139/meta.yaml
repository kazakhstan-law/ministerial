requisite: Приказ Министра здравоохранения Республики Казахстан от 25 апреля 2019 года № ҚР ДСМ-52. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 апреля 2019 года № 18604
title:
  rus: О признании действующими на территории Республики Казахстан требований ведущих фармакопей мира, а также международных и межгосударственных стандартов на лекарственные средства и медицинские изделия
  kaz: Әлемнің жетекші фармакопеяларының талаптарын, сондай-ақ дәрілік заттар мен медициналық бұйымдарға арналған халықаралық және мемлекетаралық стандарттарды Қазақстан Республикасының аумағында қолданылады деп тану туралы
