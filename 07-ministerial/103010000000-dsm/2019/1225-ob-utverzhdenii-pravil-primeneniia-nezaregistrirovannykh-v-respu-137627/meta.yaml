act_code: '137627'
requisite: Приказ Министра здравоохранения Республики Казахстан от 25 декабря 2019 года № ҚР ДСМ-151. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 декабря 2019 года № 19780. Утратил силу приказом Министра здравоохранения Республики Казахстан от 25 декабря 2019 года № ҚР ДСМ-151 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил применения незарегистрированных в Республике Казахстан лекарственных средств и медицинских изделий для оказания медицинской помощи по жизненным показаниям конкретного пациента либо оказания медицинской помощи ограниченному контингенту пациентов с редкой и (или) особо тяжелой патологией
  kaz: Нақты пациенттің тіршілік көрсеткіштері бойынша медициналық көмек көрсету не сирек кездесетін және (немесе) аса ауыр патологиясы бар пациенттердің шектеулі контингентіне медициналық көмек көрсету үшін Қазақстан Республикасында тіркелмеген дәрілік заттар мен медициналық бұйымдарды қолдану қағидаларын бекіту туралы
