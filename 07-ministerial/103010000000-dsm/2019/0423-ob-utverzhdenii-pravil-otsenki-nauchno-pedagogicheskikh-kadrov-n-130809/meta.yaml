requisite: Приказ Министра здравоохранения Республики Казахстан от 23 апреля 2019 года № ҚР ДСМ-46. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 апреля 2019 года № 18577. Утратил силу приказом Министра здравоохранения Республики Казахстан от 11 декабря 2020 года № ҚР ДСМ-249/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил оценки научно-педагогических кадров научных организаций и организаций образования в области здравоохранения, правил оценки знаний и навыков обучающихся по программам медицинского образования
  kaz: Денсаулық сақтау саласындағы ғылыми ұйымдар мен білім беру ұйымдарының ғылыми-педагог кадрларын бағалау қағидаларын, білім алушылардың медициналық білім беру бағдарламалары бойынша білімі мен дағдыларын бағалау қағидаларын бекіту туралы
