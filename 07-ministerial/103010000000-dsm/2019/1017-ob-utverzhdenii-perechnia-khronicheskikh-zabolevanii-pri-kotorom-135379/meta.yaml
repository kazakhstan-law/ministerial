act_code: '135379'
requisite: Приказ Министра здравоохранения Республики Казахстан от 17 октября 2019 года № ҚР ДСМ-136. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 октября 2019 года № 19484. Утратил силу приказом Министра здравоохранения Республики Казахстан от 23 сентября 2020 года № ҚР ДСМ-109/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня хронических заболеваний, при котором проводится динамическое наблюдение больных, перечня социально-значимых заболеваний при которых оказывается медико-социальная помощь, перечня диагностических услуг, в том числе лабораторной диагностики, перечня инфекционных заболеваний и заболеваний, представляющих опасность для окружающих, перечня заболеваний, не подлежащих динамическому наблюдению в рамках гарантированного объема бесплатной медицинской помощи, перечня отдельных категорий населения, подлежащих экстренной и плановой стоматологической помощи, перечня заболеваний (состояний), подлежащих медицинской реабилитации и восстановительному лечению по направлению специалиста первичной медико-санитарной помощи или медицинской организации
  kaz: Динамикалық байқау жүргізілетін науқастардың созылмалы аурулар тізбесін, медициналық-әлеуметтік көмек көрсетілетін әлеуметтік мәні бар аурулар тізбесін, диагностикалық қызметтер, оның ішінде зертханалық диагностика тізбесін, инфекциялық аурулар мен айналадағыларға қауіп төндіретін аурулар тізбесін, тегін медициналық көмектің кепілдік берілген көлемі шеңберінде динамикалық байқауға жатпайтын аурулар мен шұғыл және жоспарлы стоматологиялық көмек алуға жататын халықтың жекелеген санаттары тізбесін, алғашқы медициналық-санитариялық көмек маманының немесе медициналық ұйымның жолдамасы бойынша медициналық оңалту және қалпына келтіру еміне жататын аурулар (жай-күйлер) тізбесін бекіту туралы
