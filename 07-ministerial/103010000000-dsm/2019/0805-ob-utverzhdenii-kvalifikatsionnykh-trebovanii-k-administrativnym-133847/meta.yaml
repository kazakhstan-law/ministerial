  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 5 августа 2019 года № 429 «Об утверждении квалификационных требований к административным государственным должностям корпуса «Б» заместителей Председателя Комитета контроля качества и безопасности товаров и услуг Министерства здравоохранения Республики Казахстан, руководителей территориальных подразделений и их заместителей»
    kaz: «Қазақстан Республикасы Денсаулық сақтау министрлігінің Тауарлар мен көрсетілетін қызметтердің сапасы мен қауіпсіздігін бақылау комитеті төрағасы орынбасарларының, аумақтық бөлімшелердің басшылары мен олардың орынбасарларының «Б» корпусы мемлекеттік әкімшілік лауазымдарына қойылатын біліктілік талаптарын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушысының 2019 жылғы 5 тамыздағы № 429 бұйрығына өзгерістер енгізу туралы
