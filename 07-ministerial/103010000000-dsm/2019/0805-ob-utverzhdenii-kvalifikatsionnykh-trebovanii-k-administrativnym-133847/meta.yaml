requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 5 августа 2019 года № 429. Утратил силу приказом Министра здравоохранения Республики Казахстан от 11 июня 2025 года № 380 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении квалификационных требований к административным государственным должностям корпуса «Б» заместителей Председателя Комитета контроля качества и безопасности товаров и услуг Министерства здравоохранения Республики Казахстан, руководителей территориальных подразделений и их заместителей
  kaz: Қазақстан Республикасы Денсаулық сақтау министрлігінің Тауарлар мен көрсетілетін қызметтердің сапасы мен қауіпсіздігін бақылау комитеті төрағасы орынбасарларының, аумақтық бөлімшелердің басшылары мен олардың орынбасарларының «Б» корпусы мемлекеттік әкімшілік лауазымдарына қойылатын біліктілік талаптарын бекіту туралы
