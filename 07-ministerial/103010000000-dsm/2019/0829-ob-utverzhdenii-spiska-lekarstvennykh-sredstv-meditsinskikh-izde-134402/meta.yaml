  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 29 августа 2019 года № ҚР ДСМ-117 «Об утверждении списка лекарственных средств, медицинских изделий в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования, закупаемых у Единого дистрибьютора на 2020 год»
    kaz: «2020 жылға арналған Бірыңғай дистрибьютордан сатып алынатын тегін медициналық көмектің кепілдік берілген көлемінің шеңберінде және әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттардың, медициналық бұйымдардың тізімін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2019 жылғы 29 тамыздағы № ҚР ДСМ-117 бұйрығына өзгерістер мен толықтырулар енгізу туралы
