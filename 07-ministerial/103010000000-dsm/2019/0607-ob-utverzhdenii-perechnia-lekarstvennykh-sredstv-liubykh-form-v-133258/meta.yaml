  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 7 июня 2019 года № ҚР ДСМ-92 «Об утверждении Перечня лекарственных средств любых форм, в том числе фармацевтических субстанций (активных фармацевтических субстанций), медицинских изделий, включая протезно-ортопедические изделия и сурдотифлотехнику, а также материалов и комплектующих для их производства, материалов, оборудования и комплектующих для их производства лекарственных средств любых форм, медицинских изделий, включая протезно-ортопедические изделия, сурдотифлотехнику, специальных средств передвижения, предоставляемых инвалидам, обороты по реализации которых и импорт освобождаются от налога на добавленную стоимость»
    kaz: «Сату жөніндегі айналымдары және импорты қосылған құн салығынан босатылатын протездік-ортопедиялық бұйымдар мен сурдотифлотехниканы қоса алғанда, кез келген нысандағы дәрілік заттарды, оның ішінде фармацевтикалық субстанцияларды (активті фармацевтикалық субстанцияларды), медициналық бұйымдарды, сондай-ақ оларды өндіруге арналған материалдар мен жинақтаушылардың, кез келген нысандағы дәрілік заттарды, протездiк-ортопедиялық бұйымдарды, сурдотифлотехниканы, мүгедектерге берілетін арнайы қозғалыс құралдарын қоса алғанда, медициналық бұйымдарды өндіруге арналған материалдардың, жабдықтар мен жинақтаушы заттардың тізбесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2019 жылғы 7 маусымдағы № ҚР ДСМ-92 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/167849/rus
