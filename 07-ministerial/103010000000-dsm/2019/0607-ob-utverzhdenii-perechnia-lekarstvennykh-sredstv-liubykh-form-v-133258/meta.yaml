act_code: '133258'
requisite: Приказ Министра здравоохранения Республики Казахстан от 7 июня 2019 года № ҚР ДСМ-92. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 июня 2019 года № 18829. Утратил силу приказом Министра здравоохранения Республики Казахстан от 31 марта 2026 года № 39 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Перечня лекарственных средств любых форм, в том числе фармацевтических субстанций (активных фармацевтических субстанций), медицинских изделий, включая протезно-ортопедические изделия и сурдотифлотехнику, а также материалов и комплектующих для их производства, материалов, оборудования и комплектующих для их производства лекарственных средств любых форм, медицинских изделий, включая протезно-ортопедические изделия, сурдотифлотехнику, специальных средств передвижения, предоставляемых лицам с инвалидностью, обороты по реализации которых и импорт освобождаются от налога на добавленную стоимость
  kaz: Сату жөніндегі айналымдары және импорты қосылған құн салығынан босатылатын протездік-ортопедиялық бұйымдар мен сурдотифлотехниканы қоса алғанда, кез келген нысандағы дәрілік заттарды, оның ішінде фармацевтикалық субстанцияларды (активті фармацевтикалық субстанцияларды), медициналық бұйымдарды, сондай-ақ оларды өндіруге арналған материалдар мен жинақтаушылардың, кез келген нысандағы дәрілік заттарды, протездiк-ортопедиялық бұйымдарды, сурдотифлотехниканы, мүгедектігі бар адамдарға берілетін арнайы қозғалыс құралдарын қоса алғанда, медициналық бұйымдарды өндіруге арналған материалдардың, жабдықтар мен жинақтаушы заттардың тізбесін бекіту туралы
