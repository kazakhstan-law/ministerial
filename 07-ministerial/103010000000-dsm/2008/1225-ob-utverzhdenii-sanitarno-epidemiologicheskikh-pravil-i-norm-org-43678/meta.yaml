title:
  rus: Об утверждении санитарно-эпидемиологических правил и норм "Организация и проведение санитарно-противоэпидемических (профилактических) мероприятий в очагах Конго-Крымcкой геморрагической лихорадки в Республике Казахстан"
  kaz: '"Қазақстан Республикасында Конго - Қырым геморрагиялық қызбасының ошақтарында санитарлық-iндетке қарсы (профилактикалық) iс-шараларды ұйымдастыру және өткізу" санитарлық–эпидемиологиялық ережесі мен нормаларын бекіту туралы'
