act_code: '38231'
requisite: Приказ Министра здравоохранения Республики Казахстан от 19 февраля 2008 года N 83. Зарегистрирован в Министерстве юстиции Республики Казахстан 06 марта 2008 года N 5162. Утратил силу приказом Министра здравоохранения Республики Казахстан от 22 апреля 2014 года № 206
title:
  rus: Об утверждении Стандарта оказания государственной услуги по государственной регистрации продуктов детского питания, пищевых и биологически активных добавок к пище (нутрицевтиков), красителей, материалов и изделий, контактирующих с водой и продуктами питания, химических веществ, отдельных видов продукции и веществ, оказывающих вредное воздействие на здоровье человека
  kaz: Балалардың тағамы өнімдерін, тағамдық және биологиялық жұғымды қоспаларды (нутрицевтиктерді), сумен және тағам өнімдерімен байланыста болатын бояғыштарды, материалдар мен бұйымдарды, химиялық заттарды, адамның денсаулығына зиянды әсер ететін өнімдер мен заттардың жекеленген түрлерін мемлекеттік тіркеу жөніндегі мемлекеттік қызмет көрсету стандартын бекіту туралы
