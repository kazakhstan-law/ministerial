  kaz: Жіті ішек жұқпалары, сальмонеллез, іш сүзегі және қылау ауруларын төмендету жөніндегі іс-шараларды ұйымдастыру және жүргізу бойынша санитарлық-эпидемиологиялық ережелері мен нормаларын бекіту туралы
