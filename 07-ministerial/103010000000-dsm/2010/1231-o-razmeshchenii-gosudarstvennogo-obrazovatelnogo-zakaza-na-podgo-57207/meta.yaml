act_code: '57207'
requisite: Приказ Министра здравоохранения Республики Казахстан от 31 декабря 2010 года № 1008. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 января 2011 года № 6751
title:
  rus: О размещении государственного образовательного заказа на подготовку специалистов с высшим медицинским и фармацевтическим образованием в республиканских государственных предприятиях на праве хозяйственного ведения "Казахский национальный медицинский университет имени С.Д. Асфендиярова" и "Южно-Казахстанская государственная фармацевтическая академия", финансируемых из республиканского бюджета на 2010-2011 учебный год
  kaz: Республикалық бюджеттен қаржыландыратын "С.Ж. Асфендияров атындағы Қазақ ұлттық медицина университеті" мен "Оңтүстік Қазақстан мемлекеттік фармацевтика академиясы" шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорындарында жоғары медициналық және фармацевтикалық білімі бар мамандарды даярлауға 2010-2011 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру туралы
