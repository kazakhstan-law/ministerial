title:
  rus: Об утверждении санитарных правил "Санитарно-эпидемиологические требования к водоисточникам, хозяйственно-питьевому водоснабжению, местам культурно-бытового водопользования и безопасности водных объектов"
  kaz: '"Су көздеріне, шаруашылық-ауыз сумен жабдықтауға, мәдени-тұрмыстық су пайдалану орындарына және су объектілерінің қауіпсіздігіне қойылатын санитариялық-эпидемиологиялық талаптар" санитариялық ережесін бекіту туралы'
