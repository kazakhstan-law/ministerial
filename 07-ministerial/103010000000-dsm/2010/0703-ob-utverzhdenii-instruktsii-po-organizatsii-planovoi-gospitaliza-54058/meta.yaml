    kaz: '"Тегін медициналық көмектің кепілдік берілген көлемінің шеңберінде стационарға жоспарлы емдеуге жатқызу бюросы порталы арқылы ұйымдастыру жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Денсаулық сақтау министрінің 2010 жылғы 3 шілдедегі № 492 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
