    kaz: «Дәрілік заттардың, медициналық мақсаттағы бұйымдар мен медициналық техниканың айналысы саласындағы объектілерге қойылатын санитариялық-эпидемиологиялық талаптар» санитариялық ережесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2010 жылғы 13 тамыздағы № 636 бұйрығына өзгерістер енгізу туралы
