  kaz: '"Дәрілік заттардың, медициналық мақсаттағы бұйымдар мен медициналық техниканың айналысы саласындағы объектілерге қойылатын санитариялық-эпидемиологиялық талаптар" санитариялық ережесін бекіту туралы'
