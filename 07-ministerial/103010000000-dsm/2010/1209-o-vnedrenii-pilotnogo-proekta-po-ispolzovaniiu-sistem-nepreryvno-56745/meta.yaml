title:
  rus: О внедрении пилотного проекта по использованию систем непрерывной подкожной инфузии инсулина в лечении сахарного диабета 1 типа у детей до 15 лет в городах Астана и Алматы
  kaz: Астана және Алматы қалаларындағы 15 жасқа дейінгі балалардың 1 типтегі қант диабетін емдеуге инсулиннің үздіксіз теріасты инфузиясының жүйесін пайдалану жөніндегі пилоттық жобаны енгізу туралы
