title:
  rus: Об утверждении санитарных правил "Санитарно-эпидемиологические требования к вагону-ресторану пассажирского поезда и условиям перевозки организованных детских коллективов железнодорожным транспортом"
  kaz: '"Жолаушы поезының вагон-мейрамханасына және ұйымдастырылған балалар ұжымдарын темір жол көлігімен тасымалдау жағдайларына қойылатын санитариялық-эпидемиологиялық талаптар" санитариялық ережелерін бекіту туралы'
