    kaz: «Биологиялық өлімді немесе бас миының біржола семуін (мидың өлімін) растау ережесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2010 жылғы 11 тамыздағы № 622 бұйрығына өзгерістер енгізу туралы
