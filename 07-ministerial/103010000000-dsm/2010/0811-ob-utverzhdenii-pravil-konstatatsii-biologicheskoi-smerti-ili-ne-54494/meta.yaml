act_code: '54494'
requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 11 августа 2010 года № 622. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 сентября 2010 года № 6449. Утратил силу приказом и.о. Министра здравоохранения Республики Казахстан от 27 октября 2020 года № ҚР ДСМ-156/2020 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:
  rus: Об утверждении Правил констатации биологической смерти или необратимой гибели головного мозга (смерти мозга), и прекращения искусственных мер по поддержанию жизненно важных функций органов после констатации биологической смерти или необратимой гибели головного мозга (смерти мозга)
  kaz: Биологиялық өлімді немесе бас миының біржола семуін (мидың өлімін) растау және биологиялық өлім немесе бас миының біржола семуі (мидың өлімі) расталғаннан кейін ағзалардың өмірлік маңызды функцияларын қолдау жөніндегі жасанды шараларды тоқтату қағидаларын бекіту туралы
