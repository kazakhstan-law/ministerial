title:
  rus: Об утверждении санитарных правил "Санитарно-эпидемиологические требования к организации и проведению санитарно-противоэпидемических (профилактических) мероприятий в отношении больных вирусными гепатитами"
  kaz: '"Вирустық гепатиттермен ауыратын науқастарға қатысты санитариялық-эпидемияға қарсы (профилактикалық) іс-шараларды ұйымдастыруға және өткізуге қойылатын санитариялық-эпидемиологиялық талаптар" санитариялық ережесін бекіту туралы'
