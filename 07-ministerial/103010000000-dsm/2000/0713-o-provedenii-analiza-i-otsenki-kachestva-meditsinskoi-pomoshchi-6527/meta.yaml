    kaz: Әдiлет министрлiгiнде 2000 жылғы 14 шiлдеде № 1195 болып тiркелген Қазақстан Республикасы Денсаулық сақтау iсi жөнiндегi агенттiгінің 2000 жылғы 14 шілдедегi № 439 "Қазақстан Республикасының халқына көрсетілетін медициналық көмектің сапасына талдау және бағалау жүргiзу туралы" бұйрығына өзгерiстер енгізу туралы
