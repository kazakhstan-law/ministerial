act_code: '7823'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по делам здравоохранения от 30 ноября 2000 года № 756. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2000 года № 1346. Утратил силу приказом Министра здравоохранения Республики Казахстан от 2 ноября 2009 года № 634 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
