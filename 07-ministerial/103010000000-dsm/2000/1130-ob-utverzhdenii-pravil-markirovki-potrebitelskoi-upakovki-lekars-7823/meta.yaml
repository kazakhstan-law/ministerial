  title:
    rus: Об утверждении Инструкции по составлению текстов инструкций по применению лекарственного средства для специалистов и потребителей (аннотация-вкладыш) и внесении изменений в приказ и.о. Председателя Агентства Республики Казахстан по делам здравоохранения от 30 ноября 2000 года N 756 "Об утверждении Правил маркировки, оформления потребительской упаковки и инструкции для потребителя по применению лекарственного средства (аннотации-вкладыша)", зарегистрированного в Министерстве юстиции Республики Казахстан от 30 декабря 2000 года N 1346
    kaz: Дәрілік затты қолдану жөніндегі мамандар мен тұтынушыларға арналған нұсқаулықтардың мәтіндерін әзірлеу жөніндегі нұсқаулықты (аннотация - қосымша бет) бекіту туралы және "Дәрілік затты қолдану жөнінде тұтынушыларға арналған тұтыну орамы мен нұсқаулықты (аннотация-қосымша) ресімдеу, таңбалау Ережелерін бекіту туралы" Қазақстан Республикасының Денсаулық сақтау ісі жөніндегі агенттігі төрағасының міндетін атқарушының 2000 жылғы 30 қарашадағы N 756 бұйрығына (Қазақстан Республикасының Әділет министрлігінде 2000 жылғы 30 желтоқсандағы N 1346 мемлекеттік тіркелген) өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/18808/rus
