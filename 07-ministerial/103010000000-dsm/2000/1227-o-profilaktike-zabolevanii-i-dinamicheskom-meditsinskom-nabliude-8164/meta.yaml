  title:
    rus: О внесении дополнения в приказ Председателя Агентства Республики Казахстан по делам здравоохранения от 27 декабря 2000 года № 853 "О профилактике заболеваний и динамическом медицинском наблюдении за отдельными категориями больных" (зарегистрированный в Министерстве юстиции Республики Казахстан 23 января 2001 года за № 1372)
    kaz: '"Жекелеген санаттардағы науқастар ауруларының алдын алу және динамикалық медициналық бақылау туралы" Қазақстан Республикасы Денсаулық сақтау ісі жөніндегі агенттігі төрағасының 2000 жылғы 27 желтоқсанындағы № 853 бұйрығына толықтыру енгізу туралы (Қазақстан Республикасының Әділет министрлігінде 2001 жылғы 23 қаңтарда 1372 номермен тіркелген)'
