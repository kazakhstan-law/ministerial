requisite: Приказ Председателя Агентства Республики Казахстан по делам здравоохранения от 30 ноября 2000 года N 761. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 января 2001 года N 1353. Утратил силу приказом Министра здравоохранения Республики Казахстан от 29 апреля 2010 года № 310.
title:
