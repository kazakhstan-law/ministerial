title:
  rus: Об утверждении санитарных правил и норм "Санитарно-гигиенические и противоэпидемические требования к устройству и эксплуатации отделений (кабинетов) бальнеотерапевтических процедур"
  kaz: '"Бальнеотерапевтiк емшара жүргiзетiн бөлiмдердiң (кабинеттердiң) құрылымына және оларды пайдалану барысында қойылатын санитарлық-гигиеналық және эпидемияға қарсы бағытталған талаптар" санитарлық ережелерi мен нормаларын бекiту туралы'
