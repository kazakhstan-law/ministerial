  title:
    rus: О внесении изменения в приказ Главного государственного санитарного врача Республики Казахстан от 4 сентября 2002 года N 38 "Об утверждении санитарных правил и норм "Cанитарно-гигиенические требования к устройству, содержанию и эксплуатации продовольственных рынков", зарегистрированный в Министерстве юстиции Республики Казахстан за N 2017
    kaz: Қазақстан Республикасының Әдiлет министрлігінде N 2017 тiркелген "Азық-түлiк рыногын құру, ұстау және пайдалануға қойылатын санитарлық-гигиеналық талаптар" санитарлық ережелер мен нормаларды бекiту туралы" Қазақстан Республикасы Бас мемлекеттік санитарлық дәрігерінің 2002 жылғы 4 қыркүйектегi N 38 бұйрығына өзгерiс енгiзу туралы
