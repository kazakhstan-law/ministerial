title:
  rus: Об утверждении санитарно-эпидемиологических правил и норм "Санитарно-эпидемиологические требования к содержанию и эксплуатации объектов по производству мяса и мясной продукции, их хранению и транспортировке"
  kaz: '"Ет және ет өнімдерін өндіру, сақтау және тасымалдау объектілерін күтіп-ұстауға және пайдалануға қойылатын санитарлық-эпидемиологиялық талаптар" санитарлық-эпидемиологиялық ережелері мен нормаларын бекіту туралы'
