title:
  rus: Об утверждении санитарно-эпидемиологических правил и норм "Санитарно-эпидемиологические требования к содержанию зон санитарной охраны источников водоснабжения и водопроводов хозяйственно-питьевого назначения"
  kaz: '"Су көздерінің және шаруашылық - ауыз су құбырларының санитарлық қорғау аумағын күтіп-ұстауға қойылатын санитарлық-эпидемиологиялық талаптар" санитарлық-эпидемиологиялық ережелері мен нормаларын бекіту туралы'
