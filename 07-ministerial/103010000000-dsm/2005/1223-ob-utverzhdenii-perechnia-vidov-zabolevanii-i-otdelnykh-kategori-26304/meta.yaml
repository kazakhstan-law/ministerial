  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 23 декабря 2005 года № 637 "Об утверждении Перечня видов заболеваний и отдельных категорий населения, при амбулаторном лечении которых лекарственные средства и специализированное лечебное питание по рецептам отпускаются бесплатно и на льготных условиях"
    kaz: '"Аурулар түрлерінің және амбулаториялық емделу кезінде дәрілік заттар мен арнайы емдік тағам рецепт бойынша тегін немесе жеңілдікті жағдайда берілетін халықтың жекелеген санаттарының тізбесін бекіту туралы" Қазақстан Республикасы Денсаулық сақтау министрінің 2005 жылғы 23 желтоқсандағы N 637 бұйрығына өзгерістер енгізу туралы'
