title:
  rus: Об утверждении Перечня видов заболеваний и отдельных категорий населения, при амбулаторном лечении которых лекарственные средства и cпециализированное лечебное питание по рецептам отпускаются бесплатно и на льготных условиях
  kaz: Аурулар түрлерінің және амбулаториялық емделу кезінде дәрілік заттар, арнайы емдік тағам рецепт бойынша тегін немесе жеңілдікті жағдайда берілетін халықтың жекелеген санаттарының тізбесін бекіту туралы
