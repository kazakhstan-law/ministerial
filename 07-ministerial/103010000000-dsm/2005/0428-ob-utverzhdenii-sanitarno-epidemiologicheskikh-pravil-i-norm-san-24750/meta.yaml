title:
  rus: Об утверждении санитарно-эпидемиологических правил и норм "Санитарно-эпидемиологические требования к содержанию и эксплуатации объектов по производству молока и молочной продукции, их хранению и транспортировке"
  kaz: '"Сүт және сүт өнiмдерiн өндiру, сақтау және тасымалдау объектiлерiн күтiп-ұстауға және пайдалануға қойылатын санитарлық-эпидемиологиялық талаптар" санитарлық-эпидемиологиялық ережелерi мен нормаларын бекiту туралы'
