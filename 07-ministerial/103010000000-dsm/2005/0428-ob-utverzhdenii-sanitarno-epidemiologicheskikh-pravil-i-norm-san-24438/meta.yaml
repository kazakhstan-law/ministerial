title:
  rus: Об утверждении санитарно-эпидемиологических правил и норм "Санитарно-эпидемиологические требования к использованию для пищевых целей утиных, гусиных яиц, а также куриных яиц из неблагополучных хозяйств по инфекционным заболеваниям"
  kaz: '"Үйрек, қаз жұмыртқаларын сондай-ақ жұқпалы аурулар бойынша қолайсыз шаруашылықтардан әкелiнген тауық жұмыртқаларын тағамдық мақсатта пайдалануға қойылатын санитарлық-эпидемиологиялық талаптар" санитарлық-эпидемиологиялық ережелері мен нормаларын бекіту туралы'
