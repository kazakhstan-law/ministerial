requisite: Приказ Министра здравоохранения Республики Казахстан от 22 сентября 2005 года № 465. Зарегистрирован в Министерстве юстиции Республики Казахстан от 13 октября 2005 года № 3886. Утратил силу приказом Министра здравоохранения Республики Казахстан от 6 ноября 2009 года № 666.
title:
  rus: Об утверждении Правил заготовки, переработки, хранения, реализации крови и ее компонентов, препаратов крови, консервирующих средств в организациях, осуществляющих деятельность в области службы крови
  kaz: Қан қызметі саласындағы қызметті жүзеге асыратын ұйымдарда қан мен оның компоненттерін, қан препараттарын, консервациялау құралдарын дайындау, өңдеу, сақтау, өткізу ережесін бекіту туралы
