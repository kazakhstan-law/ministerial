title:
  rus: Об утверждении Перечня видов заболеваний и отдельных категорий населения, при амбулаторном лечении которых лекарственные средства и специализированное лечебное питание по рецептам отпускаются бесплатно и на льготных условиях
  kaz: Амбулаториялық емдеу кезінде дәрілік заттар мен мамандандырылған емдік тағам рецептер бойынша тегін әрі жеңілдікті шарттармен босатылатын аурулардың түрлері мен халықтың жекелеген санаттарының тізбесін бекіту туралы
