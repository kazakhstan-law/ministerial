title:
  rus: Об утверждении санитарно-эпидемиологических правил и норм "Санитарно-эпидемиологические требования к содержанию и эксплуатации центров управления и организации воздушного движения гражданской авиации и условиям труда диспетчеров"
  kaz: '"Азаматтық авиацияның әуе қозғалыстарын ұйымдастыру және басқару орталықтарын пайдалануға және күтіп-ұстауға және диспетчерлердің еңбек жағдайларына қойылатын санитарлық-эпидемиологиялық талаптар" санитарлық-эпидемиологиялық ережесі мен нормаларын бекіту туралы"'
