title:
  rus: Об утверждении санитарно-эпидемиологических правил и норм "Санитарно-эпидемиологические требования к эксплуатации радиоэлектронных средств и условиям работы с источниками электромагнитного излучения"
  kaz: '"Радиоэлектрондық құралдарды пайдалануға және электромагниттік сәуле шығару көздерімен жұмыс істеу жағдайларына қойылатын санитарлық-эпидемиологиялық талаптар" санитарлық-эпидемиологиялық ережесі мен нормаларын бекіту туралы'
