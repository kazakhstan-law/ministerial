title:
  rus: Об утверждении санитарно-эпидемиологических правил и норм "Санитарно-эпидемиологические требования к содержанию, эксплуатации объектов по ремонту электровозов, тепловозов и условиям труда рабочих"
  kaz: '"Электровоздарды, тепловоздарды жөндеу объектілерін күтіп-ұстауға, пайдалануға және жұмысшылардың еңбек жағдайларына қойылатын санитарлық-эпидемиологиялық талаптар" санитарлық-эпидемиологиялық ережесі мен нормаларын бекіту туралы'
