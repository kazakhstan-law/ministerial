  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 27 февраля 2007 года № 142 "Об утверждении Правил государственной регистрации, перерегистрации и отзыва решения о государственной регистрации продуктов детского питания, пищевых и биологически активных добавок к пище (нутрицевтиков), генетически модифицированных источников, красителей, материалов и изделий, контактирующих с водой и продуктами питания, химических веществ, отдельных видов продукции и веществ, оказывающих вредное воздействие на здоровье человека"
    kaz: '"Балалардың тағамы өнімдерін, тағамдық және биологиялық жұғымды қоспаларды (нутрицевтиктерді), генетикалық түрлендірілген көздерді, сумен және тағам өнімдерімен байланыста болатын бояғыштарды, материалдар мен бұйымдарды, химиялық заттарды, адамның денсаулығына зиянды әсер ететін өнімдер мен заттардың жекелеген түрлерін мемлекеттік тіркеу, қайта тіркеу және мемлекеттік тіркеу туралы шешімді кері қайтару ережесін бекіту туралы" Қазақстан Республикасы Денсаулық сақтау министрінің 2007 жылғы 27 ақпандағы N 142 бұйрығына өзгерістер енгізу туралы'
