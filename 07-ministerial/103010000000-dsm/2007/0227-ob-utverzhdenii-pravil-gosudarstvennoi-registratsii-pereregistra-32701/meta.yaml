act_code: '32701'
requisite: Приказ Министра здравоохранения Республики Казахстан от 27 февраля 2007 года № 142. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 апреля 2007 года N 4603. Утратил силу приказом Министра здравоохранения Республики Казахстан от 19 октября 2009 года № 546
title:
  rus: Об утверждении Правил государственной регистрации, перерегистрации и отзыва решения о государственной регистрации продуктов детского питания, пищевых и биологически активных добавок к пище (нутрицевтиков), генетически модифицированных источников, красителей, материалов и изделий, контактирующих с водой и продуктами питания, химических веществ, отдельных видов продукции и веществ, оказывающих вредное воздействие на здоровье человека
  kaz: Балалардың тағамы өнімдерін, тағамдық және биологиялық жұғымды қоспаларды (нутрицевтиктерді), генетикалық түрлендірілген көздерді, сумен және тағам өнімдерімен байланыста болатын бояғыштарды, материалдар мен бұйымдарды, химиялық заттарды, адамның денсаулығына зиянды әсер ететін өнімдер мен заттардың жекеленген түрлерін мемлекеттік тіркеу, қайта тіркеу және мемлекеттік тіркеу туралы шешімді кері қайтару ережесін бекіту туралы
