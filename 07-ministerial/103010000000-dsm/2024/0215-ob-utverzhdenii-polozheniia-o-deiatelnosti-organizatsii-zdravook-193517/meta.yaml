  title:
    rus: О внесении дополнения в приказ Министерства здравоохранения от 15 февраля 2024 года № 85 «Об утверждении Положения о деятельности организаций здравоохранения для детей-сирот, детей, оставшихся без попечения родителей, от рождения до трех лет, детей с нарушениями психического и физического развития от рождения до четырех лет»
    kaz: «Туғаннан үш жасқа дейінгі жетім балаларға, ата-анасының қамқорлығынсыз қалған балаларға, туғаннан төрт жасқа дейінгі психикалық және физикалық дамуы бұзылған балаларға арналған денсаулық сақтау ұйымдарының қызметі туралы ережені бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрлігінің 2024 жылғы 15 ақпандағы № 85 бұйрығына толықтыру енгізу туралы
