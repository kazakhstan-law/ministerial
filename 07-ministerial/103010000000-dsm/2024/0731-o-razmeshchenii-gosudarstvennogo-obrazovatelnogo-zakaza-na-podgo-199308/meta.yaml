  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 31 июля 2024 года № 500 «О размещении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским медицинским и фармацевтическим образованием на 2024-2025 учебный год»
    kaz: «Жоғары және жоғары оқу орнынан кейінгі медициналық және фармацевтикалық білімі бар мамандарды даярлауға 2024-2025 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2024 жылғы 31 шілдедегі № 500 бұйрығына өзгеріс енгізу туралы
