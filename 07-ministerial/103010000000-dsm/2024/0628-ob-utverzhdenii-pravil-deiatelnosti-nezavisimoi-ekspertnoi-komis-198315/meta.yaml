  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 28 июня 2024 года № 40 «Об утверждении правил деятельности независимой экспертной комиссии и минимальных требований по установлению наличия (отсутствия) факта причинения вреда жизни и здоровью пациента в результате осуществления медицинской деятельности»
    kaz: «Тәуелсіз сараптама комиссиясы қызметінің қағидалары және медициналық қызметті жүзеге асыру нәтижесінде пациенттің өмірі мен денсаулығына зиян келтіру фактісінің болуын (болмауын) анықтау жөніндегі ең төменгі талаптарды бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2024 жылғы 28 маусымдағы № 40 бұйрығына өзгерістер енгізу туралы
