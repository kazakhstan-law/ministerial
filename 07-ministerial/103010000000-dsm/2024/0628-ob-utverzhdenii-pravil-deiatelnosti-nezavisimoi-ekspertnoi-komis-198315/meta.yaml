title:
  rus: Об утверждении правил деятельности независимой экспертной комиссии и минимальных требований по установлению наличия (отсутствия) факта причинения вреда жизни и здоровью пациента в результате осуществления медицинской деятельности
  kaz: Тәуелсіз сараптама комиссиясы қызметінің қағидалары және медициналық қызметті жүзеге асыру нәтижесінде пациенттің өмірі мен денсаулығына зиян келтіру фактісінің болуын (болмауын) анықтау жөніндегі ең төменгі талаптарды бекіту туралы
