  title:
    rus: О внесении дополнения и изменения в приказ Министра здравоохранения Республики Казахстан от 9 ноября 2024 года № 777 «Об утверждении квалификационных требований к административным государственным должностям корпуса «Б» руководителей территориальных подразделений Комитета медицинского и фармацевтического контроля Министерства здравоохранения Республики Казахстан и их заместителей»
    kaz: «Қазақстан Республикасы Денсаулық сақтау министрлігі Медициналық және фармацевтикалық бақылау комитеті аумақтық бөлімшелері басшыларының және олардың орынбасарларының «Б» корпусы мемлекеттік әкімшілік лауазымдарына қойылатын біліктілік талаптарын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2024 жылғы 9 қарашадағы №777 бұйрығына толықтыру мен өзгеріс енгізу туралы
