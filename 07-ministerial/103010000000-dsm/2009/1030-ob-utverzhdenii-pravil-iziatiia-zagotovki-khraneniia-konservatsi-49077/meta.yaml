act_code: '49077'
requisite: Приказ Министра здравоохранения Республики Казахстан от 30 октября 2009 года № 623. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 ноября 2009 года № 5909. Утратил силу приказом Министра здравоохранения Республики Казахстан от 26 марта 2019 года № ҚР ДСМ-13 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил изъятия, заготовки, хранения, консервации, транспортировки, проведения трансплантации тканей (части ткани) и (или) органов (части органов) от донора к реципиенту
  kaz: Тіндерді (тіннің бөлігін) және (немесе) ағзаларды (ағзалардың бөлігін) алудың, дайындаудың, сақтаудың, консервациялаудың, тасымалдаудың, донордан реципиентке транспланттауды жүргізудің қағидаларын бекіту туралы
