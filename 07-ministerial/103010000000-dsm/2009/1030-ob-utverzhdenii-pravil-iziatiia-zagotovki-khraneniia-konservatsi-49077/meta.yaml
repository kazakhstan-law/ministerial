  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 30 октября 2009 года № 623 "Об утверждении Правил изъятия, консервации, проведения трансплантации тканей и (или) органов (части органов) от человека к человеку и от животных к человеку"
    kaz: '"Тіндерді және (немесе) ағзаларды (ағзалардың бөліктерін) алудың, консервациялаудың, адамнан адамға және жануарлардан адамға транспланттауды жүргізудің тәртібін бекіту туралы" Қазақстан Республикасы Денсаулық сақтау министрінің 2009 жылғы 30 қазандағы № 623 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
