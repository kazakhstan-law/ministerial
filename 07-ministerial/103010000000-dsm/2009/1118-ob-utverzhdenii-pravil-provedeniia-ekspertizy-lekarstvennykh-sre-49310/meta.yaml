  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 18 ноября 2009 года № 736 «Об утверждении Правил проведения экспертизы лекарственных средств, изделий медицинского назначения и медицинской техники»
    kaz: «Дәрілік заттарға, медициналық мақсаттағы бұйымдарға және медициналық техникаға сараптама жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2009 жылғы 18 қарашадағы № 736 бұйрығына өзгерістер енгізу туралы
