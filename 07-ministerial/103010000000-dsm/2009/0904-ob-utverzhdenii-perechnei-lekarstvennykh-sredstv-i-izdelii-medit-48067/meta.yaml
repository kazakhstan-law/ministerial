    kaz: '"Амбулаториялық деңгейде тегін медициналық көмектің кепілдік берілген көлемі шеңберінде халыққа тегін және жеңілдікпен қамтамасыз етуге арналған дәрілік заттар және медициналық мақсаттағы бұйымдардың тізбесін бекіту туралы" Қазақстан Республикасы Денсаулық сақтау министрінің 2009 жылғы 4 қыркүйектегі № 446 бұйрығына өзгерістер енгізу туралы'
