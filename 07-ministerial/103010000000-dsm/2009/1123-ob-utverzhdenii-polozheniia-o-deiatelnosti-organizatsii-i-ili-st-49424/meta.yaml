  kaz: Патологиялық-анатомиялық диагностиканы жүзеге асыратын денсаулық сақтау ұйымдарының және (немесе) құрылымдық бөлімшелерінің қызметі және Патологиялық-анатомиялық ашып қарауды жүргізу туралы ережелерді бекіту туралы
