  kaz: Салалық көтермелеу жүйесінің кейбір мәселелері туралы және көрсетілетін медициналық көмектің көлеміне, сапасына қарай медицина қызметкерлеріне еңбекақы төлеу және салалық көтермелеу жүйесі қағидаларын бекіту туралы
