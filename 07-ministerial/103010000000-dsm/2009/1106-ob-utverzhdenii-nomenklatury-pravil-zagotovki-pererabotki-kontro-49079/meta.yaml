  title:
    rus: О внесении изменений в приказ и.о. Министра здравоохранения Республики Казахстан от 6 ноября 2009 года № 666 "Об утверждении Номенклатуры, Правил заготовки, переработки, хранения, реализации крови и ее компонентов, а также Правил хранения, переливания крови, ее компонентов и препаратов"
    kaz: '"Қанды, оның компоненттерін дайындау, өңдеу, сақтау, өткізу номенклатурасын, сондай-ақ қанды, оның компоненттері мен препараттарын сақтау, құю ережелерін бекіту туралы" Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2009 жылғы 6 қарашадағы № 666 бұйрығына өзгерістер енгізу туралы'
