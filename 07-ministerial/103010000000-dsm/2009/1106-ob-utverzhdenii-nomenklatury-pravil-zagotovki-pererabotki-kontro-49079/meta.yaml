requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 6 ноября 2009 года № 666. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 ноября 2009 года № 5925. Утратил силу приказом Министра здравоохранения Республики Казахстан от 20 октября 2020 года № ҚР ДСМ - 140/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
