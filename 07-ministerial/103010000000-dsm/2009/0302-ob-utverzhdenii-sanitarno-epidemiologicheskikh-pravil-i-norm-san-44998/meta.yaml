title:
  rus: Об утверждении санитарно-эпидемиологических правил и норм "Санитарно-эпидемиологические требования к содержанию и эксплуатации объектов, осуществляющих техническое обслуживание, реконструкцию и модернизацию пассажирских вагонов"
  kaz: '"Жолаушылар вагондарына техникалық қызмет көрсетуді, қайта жаңартуды және жаңғыртуды жүзеге асыратын объектілерді пайдалануға және күтіп-ұстауға қойылатын санитарлық-эпидемиологиялық талаптар" санитарлық-эпидемиологиялық ережесі мен нормаларын бекіту туралы'
