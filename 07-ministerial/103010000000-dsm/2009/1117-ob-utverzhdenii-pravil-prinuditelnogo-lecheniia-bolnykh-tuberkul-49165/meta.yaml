title:
  rus: Об утверждении Правил принудительного лечения больных туберкулезом в специализированных противотуберкулезных организациях и их выписки
  kaz: Туберкулезбен ауыратын науқастарды мамандандырылған туберкулезге қарсы ұйымдарда мәжбүрлеп емдеу және оларды шығару қағидаларын бекіту туралы
