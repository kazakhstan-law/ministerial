  title:
    rus: О внесении дополнения в приказ и.о. Министра здравоохранения Республики Казахстан от 17 ноября 2009 года № 729 "Об организации принудительного лечения, а также режима пребывания больных в специализированных противотуберкулезных организациях"
    kaz: '"Туберкулезге қарсы мамандандырылған ұйымдарда мәжбүрлеп емдеуді ұйымдастыру, сондай-ақ онда науқастардың болу режимі туралы" Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2009 жылғы 17 қарашадағы № 729 бұйрығына толықтыру енгізу туралы'
