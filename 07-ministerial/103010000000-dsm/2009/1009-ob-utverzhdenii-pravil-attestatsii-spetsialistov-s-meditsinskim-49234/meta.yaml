  code: '61135'
  requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 22 сентября 2011 года № 642. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 октября 2011 года № 7267. Утратил силу приказом Министра здравоохранения Республики Казахстан от 10 октября 2025 года № 105 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в приказ и.о. Министра здравоохранения Республики Казахстан от 9 октября 2009 года № 515 "Об утверждении Правил аттестации специалистов с медицинским образованием для осуществления реализации лекарственных средств, изделий медицинского назначения в отдаленных от районного центра населенных пунктах через аптечные пункты в организациях здравоохранения, оказывающих первичную медико-санитарную, консультативно-диагностическую помощь и передвижные аптечные пункты, в случае отсутствия специалиста с фармацевтическим образованием"
    kaz: '"Фармацевтикалық білімі бар маман болмаған жағдайда аудан орталықтарынан шалғайдағы елді мекендерде дәрілік заттарды, медициналық мақсаттағы бұйымдарды бастапқы медициналық-санитариялық, консультациялық-диагностикалық көмек көрсететін денсаулық сақтау ұйымдарындағы дәріхана пункттері арқылы және жылжымалы дәріхана пункттері арқылы өткізуді іске асыру үшін медициналық білімі бар мамандарды аттестаттау ережесін бекіту туралы" Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2009 жылғы 9 қазандағы № 515 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/61135/rus
