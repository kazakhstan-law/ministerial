act_code: '49234'
requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 9 октября 2009 года № 515. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 ноября 2009 года № 5871. Утратил силу приказом Министра здравоохранения Республики Казахстан от 10 октября 2025 года № 105 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил аттестации специалистов с медицинским образованием для осуществления реализации лекарственных средств, медицинских изделий в отдаленных от районного центра населенных пунктах через аптечные пункты в организациях здравоохранения, оказывающих первичную медико-санитарную, консультативно-диагностическую помощь, и передвижные аптечные пункты, в случае отсутствия специалиста с фармацевтическим образованием
  kaz: Фармацевтикалық білімі бар маман болмаған жағдайда аудан орталықтарынан шалғайдағы елді мекендерде дәрілік заттарды, медициналық бұйымдарды алғашқы медициналық-санитариялық, консультациялық-диагностикалық көмек көрсететін денсаулық сақтау ұйымдарындағы дәріхана пункттері арқылы және жылжымалы дәріхана пункттері арқылы өткізуді іске асыру үшін медициналық білімі бар мамандарды аттестаттау қағидаларын бекіту туралы
