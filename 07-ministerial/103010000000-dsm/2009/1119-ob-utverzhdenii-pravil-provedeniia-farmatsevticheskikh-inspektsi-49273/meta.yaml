  title:
    rus: О внесении изменения в приказ Министра здравоохранения Республики Казахстан от 19 ноября 2009 года № 742 «Об утверждении Правил проведения инспектирования в сфере обращения лекарственных средств, изделий медицинского назначения и медицинской техники»
    kaz: «Дәрілік заттарды, медициналық мақсаттағы бұйымдар мен медицина техникасының айналысы саласында инспекциялауды жүргізу ережесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2009 жылғы 19 қарашадағы № 742 бұйрығына өзгерістер енгізу туралы
