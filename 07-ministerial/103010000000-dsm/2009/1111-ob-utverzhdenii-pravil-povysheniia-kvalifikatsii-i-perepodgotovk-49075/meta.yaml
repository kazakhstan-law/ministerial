title:
  rus: Об утверждении Правил повышения квалификации и переподготовки медицинских и фармацевтических кадров, а также квалификационных требований к организациям, реализующим программы дополнительного медицинского и фармацевтического образования
  kaz: Медицина және фармацевтика кадрларының біліктілігін арттыру және оларды қайта даярлау қағидаларын, сондай-ақ қосымша медициналық және фармацевтикалық білім беру бағдарламаларын іске асыратын ұйымдарға қойылатын біліктілік талаптарын бекіту туралы
