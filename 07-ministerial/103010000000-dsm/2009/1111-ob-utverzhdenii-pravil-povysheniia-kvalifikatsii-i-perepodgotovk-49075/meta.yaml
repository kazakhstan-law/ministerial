  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 11 ноября 2009 года № 691 «Об утверждении Правил повышения квалификации и переподготовки медицинских и фармацевтических кадров и квалификационных требований к организациям, реализующим программы дополнительного медицинского и фармацевтического образования»
    kaz: «Медицина және фармацевтика кадрларының біліктілігін арттыру және қайта даярлау қағидаларын және қосымша медициналық және фармацевтикалық білім беру бағдарламаларын іске асыратын ұйымдарға қойылатын біліктілік талаптарын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2009 жылғы 11 қарашадағы № 691 бұйрығына өзгерістер енгізу туралы
