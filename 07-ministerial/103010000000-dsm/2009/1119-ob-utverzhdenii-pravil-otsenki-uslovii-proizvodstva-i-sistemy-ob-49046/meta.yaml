  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 19 ноября 2009 года № 743 «Об утверждении Правил оценки условий производства и системы обеспечения качества при государственной регистрации лекарственных средств, изделия медицинского назначения и медицинской техники»
    kaz: «Дәрілік заттарды, медициналық мақсаттағы бұйымдар мен медициналық техникасын мемлекеттік тіркеу кезінде өндіріс жағдайларын және сапаны қамтамасыз ету жүйесін бағалау ережесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2009 жылғы 19 қарашадағы № 743 бұйрығына өзгерістер енгізу туралы
