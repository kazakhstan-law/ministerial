title:
  rus: Об утверждении Положения о деятельности организаций и (или) структурных подразделений организаций здравоохранения, осуществляющих лабораторную диагностику, а также объема и видов проводимых ими исследований
  kaz: Зертханалық диагностиканы жүзеге асыратын денсаулық сақтау ұйымдарының және (немесе) осы ұйымдардың құрылымдық бөлімшелерінің қызметі туралы ережені, сондай-ақ олар жүргізетін зерттеулердің көлемі мен түрлері туралы ережені бекіту туралы
