  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 26 ноября 2009 года № 801 «Об утверждении Правил формирования тарифов на медицинские услуги, оказываемые в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования и Методики формирования тарифов на медицинские услуги, оказываемые в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования»
    kaz: «Тегін медициналық көмектің кепілдік берілген көлемінің шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде көрсетілетін медициналық қызметтерге арналған тарифтерді қалыптастыру қағидаларын және Тегін медициналық көмектің кепілдік берілген көлемінің шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде көрсетілетін медициналық қызметтерге арналған тарифтерді қалыптастыру әдістемесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2009 жылғы 26 қарашадағы № 801 бұйрығына өзгерістер мен толықтырулар енгізу туралы
