act_code: '48667'
requisite: Приказ Министра здравоохранения Республики Казахстан от 19 октября 2009 года № 546. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 ноября 2009 года № 5858. Утратил силу приказом Министра национальной экономики Республики Казахстан от 4 июня 2015 года № 420
title:
  rus: Об установлении Правил государственной регистрации и отзыва решения о государственной регистрации продуктов детского питания, пищевых и биологически активных добавок к пище, генетически модифицированных объектов, красителей, средств дезинфекции, дезинсекции и дератизации, материалов и изделий, контактирующих с водой и продуктами питания, химических веществ, отдельных видов продукции и веществ, оказывающих вредное воздействие на здоровье человека
  kaz: Балалардың тамағы өнімдерін, тағамға тағамдық және биологиялық активті қоспаларды, генетикалық түрлендірілген объектілерді, бояғыштарды, дезинфекциялау, дезинсекциялау және дератизациялау құралдарын, сумен және тағам өнімдерімен жанасатын материалдар мен бұйымдарды, химиялық заттарды, адамның денсаулығына зиянды әсер ететін өнімдер мен заттардың жекелеген түрлерін мемлекеттік тіркеу және мемлекеттік тіркеу туралы шешімді кері қайтарып алу ережесін белгілеу туралы
