  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 19 октября 2009 года № 546 "Об установлении Правил государственной регистрации, перерегистрации и отзыва решения о государственной регистрации продуктов детского питания, пищевых и биологически активных добавок к пище, генетически модифицированных объектов, красителей, средств дезинфекции, дезинсекции и дератизации, материалов и изделий, контактирующих с водой и продуктами питания, химических веществ, отдельных видов продукции и веществ, оказывающих вредное воздействие на здоровье человека"
    kaz: '"Балалардың тамағы өнімдерін, тағамға тағамдық және биологиялық активті қоспаларды, генетикалық түрлендірілген объектілерді, бояғыштарды, дезинфекциялау, дезинсекциялау және дератизациялау құралдарын, сумен және тағам өнімдерімен жанасатын материалдар мен бұйымдарды, химиялық заттарды, адамның денсаулығына зиянды әсер ететін өнімдер мен заттардың жекелеген түрлерін мемлекеттік тіркеу, қайта тіркеу және мемлекеттік тіркеу туралы шешімді кері қайтарып алу ережесін белгілеу туралы" Қазақстан Республикасы Денсаулық сақтау министрінің 2009 жылғы 19 қазандағы № 546 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
