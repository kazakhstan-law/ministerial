requisite: Приказ Министра здравоохранения Республики Казахстан от 19 ноября 2009 года № 740. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 ноября 2009 года № 5901. Утратил силу приказом Министра здравоохранения Республики Казахстан от 6 июня 2012 года № 394
title:
  rus: Об утверждении Правил производства и контроля качества, а также проведения испытаний стабильности и установления срока хранения и повторного контроля лекарственных средств, изделий медицинского назначения и медицинской техники
  kaz: Дәрілік заттарды, медициналық мақсаттағы бұйымдар мен медициналық техниканы өндіру және олардың сапасын бақылау, сондай-ақ тұрақтылығына сынақтар жүргізу және сақталу мерзімі мен қайта бақылау мерзімін белгілеу ережесін бекіту туралы
