title:
  rus: Об утверждении Правил формирования расчета стоимости медицинских изделий, планируемых к оснащению организаций здравоохранения, Государственной экспертной организацией в сфере обращения лекарственных средств и медицинских изделий в рамках реализации инвестиционных проектов и проектов государственно-частного партнерства
  kaz: Инвестициялық жобаларды және мемлекеттік - жекешелік әріптестік жобаларын іске асыру шеңберінде денсаулық сақтау ұйымдарын дәрілік заттар мен медициналық бұйымдардың айналысы саласындағы мемлекеттік сараптама ұйымымен жарақтандыру жоспарланатын медициналық бұйымдар құнының есебін қалыптастыру қағидаларын бекіту туралы
