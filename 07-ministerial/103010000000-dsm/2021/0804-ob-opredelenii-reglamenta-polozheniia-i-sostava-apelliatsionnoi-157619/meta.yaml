title:
  rus: Об определении регламента, положения и состава апелляционной комиссии государственного органа в сферах оказания медицинских услуг (помощи) и обращения лекарственных средств и медицинских изделий по рассмотрению жалобы на акт о результатах проверки и предписание об устранении выявленных нарушений
  kaz: Медициналық қызметтер (көмек) көрсету және дәрілік заттар мен медициналық бұйымдардың айналысы салаларындағы мемлекеттік органның тексеру нәтижелері туралы актіге және анықталған бұзушылықтарды жою туралы нұсқамаға шағымды қарау жөніндегі апелляциялық комиссиясының регламентін, ережесі мен құрамын айқындау туралы
