title:
  rus: Об утверждении Санитарных правил «Санитарно-эпидемиологические требования к организации и проведению санитарно-противоэпидемических, санитарно-профилактических мероприятий по вирусным гепатитам и ВИЧ-инфекции»
  kaz: «Вирустық гепатиттер мен АИТВ инфекциясы бойынша санитариялық-эпидемияға қарсы, санитариялық-профилактикалық іс-шараларды ұйымдастыруға және жүргізуге қойылатын санитариялық - эпидемиологиялық талаптар» санитариялық қағидаларын бекіту туралы
