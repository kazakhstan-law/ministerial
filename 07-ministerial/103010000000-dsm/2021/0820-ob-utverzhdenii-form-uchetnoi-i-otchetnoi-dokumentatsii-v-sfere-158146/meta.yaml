  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 20 августа 2021 года № ҚР ДСМ-84 «Об утверждении форм учетной и отчетной документации в сфере санитарно-эпидемиологического благополучия населения»
    kaz: «Халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы есепке алу және есеп беру құжаттамасының нысандарын бекіту туралы» Қазақстан Республикасының Денсаулық сақтау министрінің 2021 жылғы 20 тамыздағы № ҚР ДСМ-84 бұйрығына өзгерістер мен толықтырулар енгізу туралы
