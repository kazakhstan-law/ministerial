  title:
    rus: О приостановлении действия главы 4 Правил маркировки и прослеживаемости лекарственных средств, утвержденных приказом Министра здравоохранения Республики Казахстан от 27 января 2021 года № ҚР ДСМ-11 «Об утверждении правил маркировки и прослеживаемости лекарственных средств и маркировки медицинских изделий»
    kaz: «Дәрілік заттарды таңбалау мен қадағалау және медициналық бұйымдарды таңбалау қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2021 жылғы 27 қаңтардағы № ҚР ДСМ-11 бұйрығымен бекітілген Дәрілік заттарды таңбалау және қадағалау қағидаларының 4-тарауының қолданылуын тоқтата тұру туралы
