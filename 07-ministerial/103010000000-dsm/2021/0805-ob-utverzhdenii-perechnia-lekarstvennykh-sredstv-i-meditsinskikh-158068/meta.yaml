  title:
    rus: О внесении изменения в приказ Министра здравоохранения Республики Казахстан от 5 августа 2021 года № ҚР ДСМ-75 «Об утверждении Перечня лекарственных средств и медицинских изделий для бесплатного и (или) льготного амбулаторного обеспечения отдельных категорий граждан Республики Казахстан с определенными заболеваниями (состояниями)»
    kaz: «Қазақстан Республикасының белгілі бір аурулары (жай-күйлері) бар азаматтарының жекелеген санаттарын тегін және (немесе) жеңілдікті амбулаториялық қамтамасыз етуге арналған дәрілік заттар мен медициналық бұйымдардың тізбесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2021 жылғы 5 тамыздағы   № ҚР ДСМ-75 бұйрығына өзгеріс енгізу туралы
