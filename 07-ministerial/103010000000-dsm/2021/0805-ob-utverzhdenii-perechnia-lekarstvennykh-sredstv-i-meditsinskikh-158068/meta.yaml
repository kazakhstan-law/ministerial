title:
  rus: Об утверждении Перечня лекарственных средств и медицинских изделий для бесплатного и (или) льготного амбулаторного обеспечения отдельных категорий граждан Республики Казахстан с определенными заболеваниями (состояниями)
  kaz: Қазақстан Республикасының белгілі бір аурулары (жай-күйлері) бар азаматтарының жекелеген санаттарын тегін және (немесе) жеңілдікті амбулаториялық қамтамасыз етуге арналған дәрілік заттар мен медициналық бұйымдардың тізбесін бекіту туралы
