act_code: '156193'
requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 27 мая 2021 года № ҚР ДСМ -47. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 мая 2021 года № 22833
title:
  rus: Об утверждении Санитарных правил «Санитарно-эпидемиологические требования к организации и проведению санитарно-противоэпидемических, санитарно-профилактических мероприятий при острых респираторных вирусных инфекциях, гриппе и их осложнениях (пневмонии), менингококковой инфекции, коронавирусной инфекции COVID-19, ветряной оспе и скарлатине»
  kaz: «Жіті респираторлық вирустық инфекциялар, тұмау және олардың асқынулары (пневмония), менингококк инфекциясы, COVID-19 коронавирустық инфекциясы, желшешек, скарлатина кезінде санитариялық-эпидемияға қарсы, санитариялық-профилактикалық іс-шараларды ұйымдастыруға және жүргізуге қойылатын санитариялық-эпидемиологиялық талаптар» санитариялық қағидаларын бекіту туралы
