  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 4 сентября 2021 года № ҚР ДСМ-96 «Об утверждении предельных цен на международное непатентованное наименование лекарственного средства или техническую характеристику медицинского изделия в рамках гарантированного объема бесплатной медицинской помощи и (или) в системе обязательного социального медицинского страхования»
    kaz: «Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттың халықаралық патенттелмеген атауына немесе медициналық бұйымның техникалық сипаттамасына шекті бағаларды бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2021 жылғы 4 тамыздағы № ҚР ДСМ-96 бұйрығына өзгерістер мен толықтырулар енгізу туралы
