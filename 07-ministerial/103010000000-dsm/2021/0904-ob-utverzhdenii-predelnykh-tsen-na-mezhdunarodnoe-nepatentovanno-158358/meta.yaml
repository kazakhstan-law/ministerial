act_code: '158358'
requisite: Приказ Министра здравоохранения Республики Казахстан от 4 сентября 2021 года № ҚР ДСМ-96. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 сентября 2021 года № 24253
title:
  rus: Об утверждении предельных цен на международное непатентованное наименование лекарственного средства или техническую характеристику медицинского изделия в рамках гарантированного объема бесплатной медицинской помощи и (или) в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттың халықаралық патенттелмеген атауына немесе медициналық бұйымның техникалық сипаттамасына шекті бағаларды бекіту туралы
