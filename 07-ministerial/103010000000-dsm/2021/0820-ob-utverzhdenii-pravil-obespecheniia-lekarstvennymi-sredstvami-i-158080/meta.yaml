act_code: '158080'
requisite: Приказ Министра здравоохранения Республики Казахстан от 20 августа 2021 года № ҚР ДСМ-89. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 августа 2021 года № 24069
title:
  rus: Об утверждении правил обеспечения лекарственными средствами и медицинскими изделиями в рамках гарантированного объема бесплатной медицинской помощи, дополнительного объема медицинской помощи лицам, содержащимся в следственных изоляторах и учреждениях уголовно-исполнительной (пенитенциарной) системы, за счет бюджетных средств и (или) в системе обязательного социального медицинского страхования, а также правил и методики формирования потребности в лекарственных средствах и медицинских изделиях в рамках гарантированного объема бесплатной медицинской помощи, дополнительного объема медицинской помощи лицам, содержащимся в следственных изоляторах и учреждениях уголовно-исполнительной (пенитенциарной) системы, за счет бюджетных средств и (или) в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі, қылмыстық-атқару (пенитенциарлық) жүйесінің тергеу изоляторлары мен мекемелерінде ұсталатын адамдарға бюджет қаражаты есебінен медициналық көмектің қосымша көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттармен және медициналық бұйымдармен қамтамасыз ету қағидаларын, сондай-ақ Тегін медициналық көмектің кепілдік берілген көлемі, қылмыстық-атқару (пенитенциарлық) жүйесінің тергеу изоляторлары мен мекемелерінде ұсталатын адамдарға бюджет қаражаты есебінен медициналық көмектің қосымша көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттар мен медициналық бұйымдарға қажеттілікті қалыптастыру қағидалары мен әдістемесін бекіту туралы
