title:
  rus: Об утверждении правил направления граждан Республики Казахстан на лечение за рубеж и (или) привлечения зарубежных специалистов для проведения лечения в отечественных медицинских организациях в рамках гарантированного объема бесплатной медицинской помощи
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде Қазақстан Республикасының азаматтарын шетелге емделуге жіберу және (немесе) емдеуді отандық медициналық ұйымдарда жүргізу үшін шетелдік мамандарды тарту қағидаларын әзірлеуді бекіту туралы
