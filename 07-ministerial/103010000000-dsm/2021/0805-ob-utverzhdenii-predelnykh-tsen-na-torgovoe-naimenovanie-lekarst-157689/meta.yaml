  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 5 августа 2021 года № ҚР ДСМ-77 «Об утверждении предельных цен на торговое наименование лекарственных средств и медицинских изделий в рамках гарантированного объема бесплатной медицинской помощи и (или) в системе обязательного социального медицинского страхования»
    kaz: «Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттардың және медициналық бұйымдардың саудалық атауына шекті бағаларды бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2021 жылғы 5 тамыздағы № ҚР ДСМ-77 бұйрығына өзгерістер енгізу туралы
