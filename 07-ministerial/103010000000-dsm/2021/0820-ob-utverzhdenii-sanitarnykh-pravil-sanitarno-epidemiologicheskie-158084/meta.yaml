title:
  rus: Об утверждении Санитарных правил «Санитарно-эпидемиологические требования к объектам производства кондитерских изделий, условиям производства, расфасовки, транспортировки, хранения, реализации, утилизации и уничтожения кондитерских изделий»
  kaz: «Кондитерлік өнімдерді өндіру объектілеріне, кондитерлік өнімдерді өндіру, өлшеп-орау, тасымалдау, сақтау, өткізу, кәдеге жарату және жою шарттарына қойылатын санитариялық-эпидемиологиялық талаптар» санитариялық қағидаларын бекіту туралы
