  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 6 августа 2021 года № ҚР ДСМ-80 «Об утверждении минимальных требований к медицинским информационным системам в области здравоохранения»
    kaz: «Денсаулық сақтау саласындағы медициналық ақпараттық жүйелерге қойылатын ең төмен талаптарды бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2021 жылғы 6 тамыздағы № ҚР ДСМ-80 бұйрығына өзгерістер енгізу туралы
