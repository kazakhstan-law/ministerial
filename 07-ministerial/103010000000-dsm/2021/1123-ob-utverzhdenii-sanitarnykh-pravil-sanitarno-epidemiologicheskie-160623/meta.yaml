title:
  rus: Об утверждении Санитарных правил «Санитарно-эпидемиологические требования к объектам производства алкогольной продукции, безалкогольной продукции и питьевой воды, расфасованной в емкости, условиям производства и хранения алкогольной продукции, безалкогольной продукции и питьевой воды, расфасованной в емкости»
  kaz: «Алкоголь өнімдерін, алкогольсіз өнімдерді және ыдыстарға құйылған ауыз суды өндіру объектілеріне, алкоголь өнімдерін, алкогольсіз өнімдерді және ыдыстарға құйылған ауыз суды өндіру және сақтау шарттарына қойылатын санитариялық-эпидемиологиялық талаптар» санитариялық қағидаларын бекіту туралы
