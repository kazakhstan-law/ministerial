  title:
    rus: О внесении изменений и дополнения в приказ министра здравоохранения Республики Казахстан «Об утверждении перечня медицинских специальностей программ резидентуры» от 25 мая 2021 года № ҚР ДСМ - 43 и «Об утверждении типовых учебных программ по медицинским и фармацевтическим специальностям» от 9 января 2023 года № 4
    kaz: «Резидентура бағдарламаларының медициналық мамандықтар тізбесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2021 жылғы 25 мамырдағы № ҚР ДСМ - 43 бұйрығына және «Медициналық және фармацевтикалық мамандықтар бойынша үлгілік оқу бағдарламаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2023 жылғы 9 қаңтардағы № 4 бұйрығына өзгерістер мен толықтыру енгізу туралы
