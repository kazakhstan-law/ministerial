  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 27 августа 2021 года № ҚР ДСМ-94 «Об утверждении предельных цен производителя на торговое наименование лекарственного средства, предельных цен на торговое наименование лекарственного средства для розничной и оптовой реализации»
    kaz: «Дәрілік заттың саудалық атауына өндірушінің шекті бағаларын, бөлшек және көтерме саудада өткізу үшін дәрілік заттың саудалық атауына шекті бағаларды бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2021 жылғы 27 тамыздағы № ҚР ДСМ-94 бұйрығына өзгеріс енгізу туралы
