title:
  rus: О размещении государственного образовательного заказа на подготовку специалистов с послесредним, высшим и послевузовским медицинским и фармацевтическим образованием на 2021-2022 учебный год
  kaz: Орта білімнен кейінгі, жоғары және жоғары оқу орнынан кейінгі медициналық және фармацевтикалық білімі бар мамандарды даярлауға 2021-2022 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру туралы
