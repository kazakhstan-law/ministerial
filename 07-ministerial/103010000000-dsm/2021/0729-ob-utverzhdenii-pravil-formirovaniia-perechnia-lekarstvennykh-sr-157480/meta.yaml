act_code: '157480'
requisite: Приказ Министра здравоохранения Республики Казахстан от 29 июля 2021 года № ҚР ДСМ -68. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июля 2021 года № 23783. Утратил силу приказом Министра здравоохранения Республики Казахстан от 10 июля 2024 года № 54 ( вводится в действие по истечении десяти календарных дней после первого официального опубликования)
title:
  rus: Об утверждении Правил формирования перечня лекарственных средств и медицинских изделий для бесплатного и (или) льготного амбулаторного обеспечения отдельных категорий граждан Республики Казахстан с определенными заболеваниями (состояниями)
  kaz: Қазақстан Республикасының белгілі бір аурулары (жай-күйлері) бар азаматтарының жекелеген санаттарын тегін және (немесе) жеңілдікпен амбулаториялық қамтамасыз етуге арналған дәрілік заттар мен медициналық бұйымдардың тізбесін қалыпастыру қағидаларын бекіту туралы
