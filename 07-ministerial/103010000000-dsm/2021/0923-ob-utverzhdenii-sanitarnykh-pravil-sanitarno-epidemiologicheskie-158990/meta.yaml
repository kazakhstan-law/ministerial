  requisite: Приказ Министра здравоохранения Республики Казахстан от 2 июля 2024 года № 50. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июля 2024 года № 34702
  title:
    rus: «О внесении изменений и дополнений в приказы Министра здравоохранения Республики Казахстан от 11 января 2021 года № ҚР ДСМ – 5 «Об утверждении Санитарных правил «Санитарно-эпидемиологические требования к транспортным средствам для перевозки пассажиров и грузов», от 23 сентября 2021 года № ҚР ДСМ – 98 «Об утверждении Санитарных правил «Санитарно-эпидемиологические требования к объектам по обслуживанию транспортных средств и пассажиров»
    kaz: Қазақстан Республикасы Денсаулық сақтау министрінің «Жолаушылар мен жүктерді тасымалдауға арналған көлік құралдарына қойылатын санитариялық-эпидемиологиялық талаптар» санитариялық қағидаларын бекіту туралы» 2021 жылғы 11 қаңтардағы № ҚР ДСМ-5, «Көлік құралдарына және жолаушыларға қызмет көрсету жөніндегі объектілерге қойылатын санитариялық-эпидемиологиялық талаптар» санитариялық қағидаларын бекіту туралы» 2021 жылғы 23 қыркүйектегі № ҚР ДСМ-98 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/198547/rus
