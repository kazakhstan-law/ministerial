title:
  rus: Об утверждении Санитарных правил «Санитарно-эпидемиологические требования к объектам по обслуживанию транспортных средств и пассажиров»
  kaz: «Көлік құралдарына және жолаушыларға қызмет көрсету жөніндегі объектілерге қойылатын санитариялық-эпидемиологиялық талаптар» санитариялық қағидаларын бекіту туралы
