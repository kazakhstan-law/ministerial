act_code: '216701'
requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 6 ноября 2025 года № 138
title:
  rus: Об определении перечня состояний, угрожающих жизни в экстренной форме, включенных в специализированную медицинскую помощь в стационарных условиях, для лиц, не являющихся потребителями услуг в системе обязательного социального медицинского страхования, в том числе проведение лечебно-диагностических мероприятий в приемном отделении круглосуточного стационара до установления диагноза, не требующего лечения в условиях круглосуточного стационара
  kaz: Міндетті әлеуметтік медициналық сақтандыру жүйесінде көрсетілетін қызметтерді тұтынушылар болып табылмайтын адамдар үшін стационарлық жағдайлардағы мамандандырылған медициналық көмекке енгізілген, шұғыл нысанда өмірге қауіп төндіретін жай-күйлер тізбесін айқындау, оның ішінде тәулік бойы стационар жағдайларында емдеуді қажет етпейтін диагнозды анықтағанға дейін тәулік бойы стационардың қабылдау бөлімінде емдік-диагностикалық ісшаралар жүргізу туралы
