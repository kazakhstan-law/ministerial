title:
  rus: Об утверждении Правил планирования расходов из бюджета в фонд социального медицинского страхования путем выделения трансфертов юридическим лицам, составления отчетности об использовании бюджетных средств, форм и сроков ее представления, а также требований к предоставляемой информации о ходе и результатах использования бюджетных средств
  kaz: Заңды тұлғаларға берілетін трансферттерді бөлу арқылы бюджеттен әлеуметтік медициналық сақтандыру қорына шығыстарды жоспарлау, бюджет қаражатының пайдаланылуы туралы есептілік жасау, оның нысандары мен ұсынылу мерзімдерін, сондай-ақ бюджет қаражатын пайдаланудың барысы мен нәтижелері туралы берілетін ақпаратқа қойылатын талаптардың қағидаларын бекіту туралы
