title:
  rus: Об установлении величины процентной ставки комиссионного вознаграждения некоммерческого акционерного общества «Фонд социального медицинского страхования» на 2025 год, в рамках предельной величины, установленной Правительством Республики Казахстан
  kaz: Қазақстан Республикасының Үкіметі белгілеген шекті шама шеңберінде «Әлеуметтік медициналық сақтандыру қоры» коммерциялық емес акционерлік қоғамының 2025 жылға арналған комиссиялық сыйақысының пайыздық мөлшерлемесінің шамасын белгілеу туралы
