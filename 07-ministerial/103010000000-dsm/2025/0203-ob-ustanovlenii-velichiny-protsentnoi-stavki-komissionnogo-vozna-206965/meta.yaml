    kaz: «Қазақстан Республикасының Үкіметі белгілеген шекті шама шеңберінде «Әлеуметтік медициналық сақтандыру қоры» коммерциялық емес акционерлік қоғамының 2025 жылға арналған комиссиялық сыйақысының пайыздық мөлшерлемесінің шамасын белгілеу туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2025 жылғы 3 ақпандағы № 76 бұйрығына өзгеріс енгізу туралы
