  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 27 августа 2025 года № 84 «О размещении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским медицинским и фармацевтическим образованием на 2025-2026 учебный год»
    kaz: «Жоғары және жоғары оқу орнынан кейінгі медициналық және фармацевтикалық білімі бар мамандарды даярлауға 2025-2026 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2025 жылғы 27 тамыздағы № 84 бұйрығына өзгеріс енгізу туралы
