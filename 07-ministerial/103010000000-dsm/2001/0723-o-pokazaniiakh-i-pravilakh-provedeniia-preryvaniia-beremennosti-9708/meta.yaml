  title:
    rus: О внесении изменений в Приказ Председателя Агентства Республики Казахстан по делам здравоохранения от 24 июля 2001 года N 687 "О показаниях и правилах проведения прерывания беременности в Республике Казахстан"
    kaz: '"Қазақстан Республикасында жүктiлiктi жасанды тоқтату операциясын жүргiзудiң көрсеткiштерi мен ережесi туралы" Қазақстан Республикасының Денсаулық сақтау iсi жөнiндегi агенттігі төрағасының 2001 жылғы 24 шiлдедегі N 687 бұйрығына өзгерiстер енгiзу туралы'
