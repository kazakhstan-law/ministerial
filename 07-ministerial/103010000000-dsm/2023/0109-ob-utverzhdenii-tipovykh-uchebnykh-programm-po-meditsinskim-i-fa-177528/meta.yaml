    rus: О внесении изменений и дополнения в приказ министра здравоохранения Республики Казахстан «Об утверждении перечня медицинских специальностей программ резидентуры» от 25 мая 2021 года № ҚР ДСМ - 43 и «Об утверждении типовых учебных программ по медицинским и фармацевтическим специальностям» от 9 января 2023 года № 4
