  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 04 августа 2023 года № 460 «О размещении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским медицинским и фармацевтическим образованием на 2023-2024 учебный год»
    kaz: «Жоғары және жоғары оқу орнынан кейінгі медициналық және фармацевтикалық білімі бар мамандарды даярлауға 2023-2024 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2023 жылғы 4 тамыздағы № 460 бұйрығына өзгеріс енгізу туралы
