  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 7 июня 2023 года №110 «Об утверждении правил организации и проведения закупа лекарственных средств, медицинских изделий и специализированных лечебных продуктов в рамках гарантированного объема бесплатной медицинской помощи, дополнительного объема медицинской помощи для лиц, содержащихся в следственных изоляторах и учреждениях уголовно-исполнительной (пенитенциарной) системы, за счет бюджетных средств и (или) в системе обязательного социального медицинского страхования, фармацевтических услуг»
    kaz: «Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде, тергеу изоляторлары мен қылмыстық-атқару (пенитенциарлық) жүйесінің мекемелерінде ұсталатын адамдар үшін медициналық көмектің қосымша көлемін бюджет қаражаты есебінен және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттарды, медициналық бұйымдарды және арнайы емдік өнімдерді сатып алуды, фармацевтикалық көрсетілетін қызметтерді сатып алуды ұйымдастыру және өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2023 жылғы 7 маусымдағы №110 бұйрығына өзгерістер мен толықтырулар енгізу туралы
