title:
  rus: Об утверждении методики расчета индикаторов и рейтинговой оценки деятельности субъектов здравоохранения, претендующих на оказание медицинской помощи в рамках гарантированного объема бесплатной медицинской помощи и (или) в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмек көрсетуге үміткер денсаулық сақтау субъектілері қызметінің индикаторларын есептеу және рейтингтік бағалау әдістемесін бекіту туралы
