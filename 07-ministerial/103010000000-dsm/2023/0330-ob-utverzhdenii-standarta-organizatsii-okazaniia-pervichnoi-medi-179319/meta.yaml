    kaz: «Қазақстан Республикасында медициналық-санитариялық алғашқы көмек көрсетуді ұйымдастыру стандартын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2023 жылғы 30 наурыздағы № 49 бұйрығына өзгеріс енгізу туралы
