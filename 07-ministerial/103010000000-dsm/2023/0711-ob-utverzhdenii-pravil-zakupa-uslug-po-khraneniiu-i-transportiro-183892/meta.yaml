act_code: '183892'
requisite: Приказ Министра здравоохранения Республики Казахстан от 11 июля 2023 года № 127. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 июля 2023 года № 33071
title:
  rus: Об утверждении Правил закупа услуг по хранению и транспортировке лекарственных средств и медицинских изделий, услуг по учету и реализации лекарственных средств и медицинских изделий единым дистрибьютором в рамках гарантированного объема бесплатной медицинской помощи, дополнительного объема медицинской помощи для лиц, содержащихся в следственных изоляторах и учреждениях уголовно-исполнительной (пенитенциарной) системы, за счет бюджетных средств и (или) в системе обязательного социального медицинского страхования
  kaz: Бірыңғай дистрибьютордың тегін медициналық көмектің кепілдік берілген көлемі, қылмыстық-атқару (пенитенциарлық) жүйесінің тергеу изоляторлары мен мекемелерінде ұсталатын адамдарға бюджет қаражаты есебінен медициналық көмектің қосымша көлемі шеңберінде және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттар мен медициналық бұйымдарды сақтау және тасымалдау жөніндегі көрсетілетін қызметтерді, дәрілік заттар мен медициналық бұйымдарды есепке алу және өткізу жөніндегі көрсетілетін қызметтерді сатып алу қағидаларын бекіту туралы
