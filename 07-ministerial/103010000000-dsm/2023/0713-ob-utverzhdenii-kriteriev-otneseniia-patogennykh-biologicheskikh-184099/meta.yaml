title:
  rus: Об утверждении критериев отнесения патогенных биологических агентов к вызывающим особо опасные инфекционные заболевания и перечня патогенных биологических агентов с учетом классификации патогенных биологических агентов по патогенности и степени опасности
  kaz: Патогенді биологиялық агенттердің патогендігі және қауіптілік дәрежесі бойынша сыныптамасын ескере отырып, патогенді биологиялық агенттерді аса қауіпті инфекциялық аурулар туғызатындарға жатқызу өлшемшарттарын және патогенді биологиялық агенттердің тізбесін бекіту туралы
