title:
  rus: Об утверждении Правил проведения медицинского осмотра лица, претендующего на получение права управления транспортными средствами, повторного медицинского осмотра водителя механических транспортных средств
  kaz: Көлік құралдарын басқару құқығын алуға үміткер адамды медициналық қарап тексеруден, механикалық көлік құралдары жүргізушісін қайта медициналық қарап тексеруден өткізу қағидаларын бекіту туралы
