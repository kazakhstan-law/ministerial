  title:
    rus: О внесении изменения в приказ Министра здравоохранения Республики Казахстан от 12 апреля 2013 года № 223 "Об утверждении Правил организации и осуществления мониторинга цен на лекарственные средства, изделия медицинского назначения, а также их формирования в рамках гарантированного объема бесплатной медицинской помощи"
    kaz: '"Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде дәрілік заттардың, медициналық мақсаттағы бұйымдардың бағаларын мониторинг ұйымдастыру мен жүзеге асыру, сондай-ақ оларды қалыптастыру қағидасын бекіту туралы" Қазақстан Республикасы Денсаулық сақтау министрінің 2013 жылғы 12 сәуірдегі № 223 бұйрығына өзгеріс енгізу туралы'
