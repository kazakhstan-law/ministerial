requisite: Приказ Министра здравоохранения Республики Казахстан от 12 апреля 2013 года № 223. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 мая 2013 года № 8467. Утратил силу приказом и.о. Министра здравоохранения и социального развития Республики Казахстан от 30 июля 2015 года № 639
title:
  rus: Об утверждении Правил организации и осуществления мониторинга цен на лекарственные средства, изделия медицинского назначения, а также их формирования в рамках гарантированного объема бесплатной медицинской помощи
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде дәрілік заттардың, медициналық мақсаттағы бұйымдардың бағаларын мониторинг ұйымдастыру мен жүзеге асыру, сондай-ақ оларды қалыптастыру қағидасын бекіту туралы
