  title:
    rus: О внесении изменений и дополнения в приказ Министра здравоохранения Республики Казахстан от 12 апреля 2013 года № 223 "Об утверждении Правил организации и осуществления мониторинга цен на лекарственные средства, изделия медицинского назначения, а также их формирования в рамках гарантированного объема бесплатной медицинской помощи"
    kaz: '"Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде дәрілік заттардың, медициналық мақсаттағы бұйымдардың бағаларына мониторинг ұйымдастыру мен жүзеге асыру, сондай-ақ оларды қалыптастыру қағидасын бекіту туралы" Қазақстан Республикасы Денсаулық сақтау Министрінің 2013 жылғы 12 сәуірдегі № 223 бұйрығына өзгерістер мен толықтыру енгізу туралы'
