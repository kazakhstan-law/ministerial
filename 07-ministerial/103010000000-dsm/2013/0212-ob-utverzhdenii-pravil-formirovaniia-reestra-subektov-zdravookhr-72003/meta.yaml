  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 12 февраля 2013 года № 75 «Об утверждении Правил формирования реестра субъектов здравоохранения, осуществляющих оптовую и розничную реализацию изделий медицинского назначения и медицинской техники в уведомительном порядке»
    kaz: «Хабарлама тәртібінде медициналық мақсаттағы бұйымдар мен медициналық техниканы көтерме және бөлшек саудада өткізуді жүзеге асыратын денсаулық сақтау субъектілерінің тізілімін құру қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2013 жылғы 12 ақпандағы № 75 бұйрығына өзгерістер енгізу туралы
