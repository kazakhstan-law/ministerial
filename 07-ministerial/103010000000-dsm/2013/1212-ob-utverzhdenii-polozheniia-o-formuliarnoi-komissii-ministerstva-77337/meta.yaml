    kaz: «Қазақстан Республикасы Денсаулық сақтау министрлігінің Формулярлық комиссиясы туралы ережені бекіту туралы» Қазақстан Республикасы Денсаулық сақтау Министрінің міндетін атқарушының 2013 жылғы 12 желтоқсандағы № 723 бұйрығына өзгерістер мен толықтырулар енгізу туралы
