act_code: '73398'
requisite: Приказ Министра здравоохранения Республики Казахстан от 18 июня 2013 года № 352. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 июля 2013 года № 8541
title:
  rus: О размещении государственного образовательного заказа на подготовку специалистов с высшим медицинскими фармацевтическим образованием в республиканских государственных предприятиях на праве хозяйственного ведения "Казахский национальный медицинский университет имени С.Д. Асфендиярова" и "Южно-Казахстанская государственная фармацевтическая академия", в акционерном обществе "Медицинский университет Астана", финансируемых из республиканского бюджета на 2013-2014 учебный год
  kaz: Республикалық бюджеттен қаржыландырылатын "С.Ж. Асфендияров атындағы Қазақ ұлттық медицина университеті", "Оңтүстік Қазақстан мемлекеттік фармацевтика академиясы" шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорындарында, "Астана медицина университеті" акционерлік қоғамында жоғары медициналық және фармацевтикалық білімі бар мамандарды даярлауға 2013-2014 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру туралы
