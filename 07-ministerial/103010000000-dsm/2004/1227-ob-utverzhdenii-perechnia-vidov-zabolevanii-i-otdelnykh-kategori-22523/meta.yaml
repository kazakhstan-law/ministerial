title:
  rus: Об утверждении Перечня видов заболеваний и отдельных категорий населения, при амбулаторном лечении которых лекарственные средства и специализированные продукты детского и лечебного питания отпускаются по рецептам бесплатно
  kaz: Амбулаториялық емдеу кезiнде дәрілік заттар мен балаларға арналған және шипалы тағамдық арнаулы азық-түлiк тегiн босатылатын науқастар түрлерінің және тұрғындарының жекелеген санаттарының тiзбесiн бекiту туралы
