  title:
    rus: О внесении изменения в приказ и. о. Министра здравоохранения Республики Казахстан от 27 декабря 2004 года № 891 "Об утверждении Перечня видов заболеваний и отдельных категорий населения, при амбулаторном лечении которых лекарственные средства и специализированные продукты детского и лечебного питания отпускаются по рецептам бесплатно"
    kaz: Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының "Амбулаториялық емдеу кезінде дәрілік заттар мен балаларға арналған және шипалы тағамдық арнаулы азық-түлік тегін босатылатын науқастар түрлерінің және тұрғындарының жекелеген санаттарының тізбесін бекіту туралы" 2004 жылғы 27 желтоқсандағы N 891 бұйрығына өзгеріс енгізу туралы
