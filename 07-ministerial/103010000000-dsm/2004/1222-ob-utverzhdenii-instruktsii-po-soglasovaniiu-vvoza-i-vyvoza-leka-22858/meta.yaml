  title:
    rus: О внесении дополнений и изменений в приказ и.о. Министра здравоохранения Республики Казахстан от 22 декабря 2004 года № 885 "Об утверждении Инструкции по согласованию ввоза и вывоза лекарственных средств, медицинской техники, изделий медицинского назначения и парафармацевтиков"
    kaz: '"Дәрілік заттарды, медицина техникасын, медициналық мақсаттағы бұйымдарды және парафармацевтиктерді әкелу және әкету келісу жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2004 жылғы 22 желтоқсандағы № 885 бұйрығына толықтырулар мен өзгерістер енгізу туралы'
