requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 22 декабря 2004 года N 885. Зарегистрирован Министерством юстиции Республики Казахстан 28 января 2005 года N 3404. Утратил силу приказом Министра здравоохранения Республики Казахстан от 16 ноября 2009 года N 710
title:
  rus: Об утверждении Инструкции по согласованию ввоза и вывоза лекарственных средств, медицинской техники, изделий медицинского назначения и парафармацевтиков, товаров, поставляемых в организации здравоохранения и объектам фармацевтической деятельности
  kaz: Денсаулық сақтау ұйымдарына және фармацевтикалық қызмет объектілеріне жеткізілетін дәрілік заттарды, медициналық мақсаттағы бұйымдарды және парафармацевтиктерді тауарларды әкелу және сыртқа шығару жөніндегі нұсқаулықты бекіту туралы
