act_code: '19208'
requisite: Приказ Министра здравоохранения Республики Казахстан от 12 марта 2004 года № 243. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 марта 2004 года № 2780. Утратил силу приказом Министра здравоохранения Республики Казахстан от 16 ноября 2009 года № 709 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Перечня вредных производственных факторов, профессий, при которых обязательны предварительные и периодические медицинские осмотры и Инструкции по проведению обязательных предварительных и периодических медицинских осмотров работников, подвергающихся воздействию вредных, опасных и неблагоприятных производственных факторов
  kaz: Олардың кезінде алдын ала және мерзімдік медициналық қараулар міндетті зиянды өндірістік факторлардың, кәсіптердің тізбесі мен Зиянды, қауіпті және қолайсыз өндірістік факторлардың әсеріне ұшыраған қызметкерлерді міндетті алдын ала және мерзімдік медициналық қарауларды жүргізу жөніндегі нұсқаулықты бекіту туралы
