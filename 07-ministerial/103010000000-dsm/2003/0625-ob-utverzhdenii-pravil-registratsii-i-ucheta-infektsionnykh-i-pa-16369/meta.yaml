requisite: Приказ Министра здравоохранения Республики Казахстан от 26 июня 2003 года № 479. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 июля 2003 года № 2412. Утратил силу приказом Министра здравоохранения Республики Казахстан от 12 ноября 2009 года № 706
title:
  rus: Об утверждении Правил регистрации и учета инфекционных и паразитарных заболеваний среди населения Республики Казахстан и перечня инфекционных и паразитарных заболеваний среди населения, подлежащих регистрации и учету в Республике Казахстан
  kaz: Қазақстан Республикасы халқының арасындағы жұқпалы және паразиттік ауруларды тіркеу мен есепке алу Ережесін және Қазақстан Республикасында тіркеу мен есепке алуға жататын халқының арасындағы жұқпалы және паразиттік ауруларының тізбесін бекіту туралы
