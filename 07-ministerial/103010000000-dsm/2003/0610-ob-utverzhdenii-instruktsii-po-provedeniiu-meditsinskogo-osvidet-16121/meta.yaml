act_code: '16121'
requisite: Приказ Министра здравоохранения Республики Казахстан от 11 июня 2003 года N 446. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 июля 2003 года N 2389. Утратил силу приказом Министра здравоохранения Республики Казахстан от 13 июля 2017 года № 504 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
