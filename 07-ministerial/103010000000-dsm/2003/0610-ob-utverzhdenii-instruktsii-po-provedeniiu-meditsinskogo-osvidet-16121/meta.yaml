  title:
    rus: О внесении изменения в приказ Министра здравоохранения Республики Казахстан от 11 июня 2003 года N 446 "Об утверждении Инструкции по проведению медицинского освидетельствования для установления факта употребления психоактивного вещества и состояния опьянения"
    kaz: Қазақстан Республикасы Денсаулық сақтау министрінің "Психиатриялық белсенді заттарды пайдалану фактісін, мас болу жағдайын анықтау және куәландыру жүргізу үшін азаматтарды медициналық куәландыруға жіберу тәртібі туралы" 2003 жылғы 11 маусымдағы N 446 бұйрығына өзгеріс енгізу туралы
