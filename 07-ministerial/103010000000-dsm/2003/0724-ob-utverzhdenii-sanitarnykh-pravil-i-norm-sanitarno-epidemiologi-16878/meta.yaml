title:
  rus: Об утверждении санитарных правил и норм "Санитарно-эпидемиологические требования к устройству, содержанию и условиям обучения в общеобразовательных и интернатных организациях"
  kaz: '"Оқушыларға жалпы білім беретін және интернаттық ұйымдардың құрылымына, ұсталуына және оқыту жағдайларына қойылатын санитарлық-эпидемиологиялық талаптар" санитарлық ережелері мен нормаларын бекіту туралы'
