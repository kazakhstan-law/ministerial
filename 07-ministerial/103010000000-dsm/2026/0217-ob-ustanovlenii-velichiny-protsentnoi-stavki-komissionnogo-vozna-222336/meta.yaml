    kaz: «Қазақстан Республикасының Үкіметі белгілеген шекті шама шеңберінде «Әлеуметтік медициналық сақтандыру қоры» коммерциялық емес акционерлік қоғамының 2026 жылға арналған комиссиялық сыйақысының пайыздық мөлшерлемесінің шекті шамасын белгілеу туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2026 жылғы 17 ақпандағы № 100 бұйрығына өзгеріс енгізу туралы
