act_code: '79366'
requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 26 марта 2014 года № 151. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 апреля 2014 года № 9372. Утратил силу приказом Министра здравоохранения Республики Казахстан от 3 ноября 2020 года № ҚР ДСМ-177/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи заключений (разрешительных документов) на ввоз на территорию Республики Казахстан и вывоз с территории Республики Казахстан гемопоэтических стволовых клеток, костного мозга в случае их перемещения с целью проведения неродственной трансплантации, а также образцов клеток, тканей, биологических жидкостей и секретов, в том числе продуктов жизнедеятельности человека, физиологических и патологических выделений, мазков, соскобов, смывов, предназначенных для диагностических научных целей или полученных в процессе проведения биомедицинских исследований
  kaz: Туыстас емес транспланттауды жүргізу мақсатында гемопоэздік дің жасушаларын, сүйек кемігін өткізген жағдайда, оларды, сондай-ақ диагностикалық ғылыми мақсаттарға арналған немесе биомедициналық зерттеулер жүргізу процесінде алынған жасушалардың, тіндердің, биологиялық сұйықтықтар мен сөлдердің, оның ішінде адамның тіршілік әрекеті өнімдерінің, физиологиялық және патологиялық шығындылардың, сүртінділердің, қырындылардың, шайындылардың үлгілерін Қазақстан Республикасының аумағына әкелуге және Қазақстан Республикасының аумағынан әкетуге қорытындылар (рұқсат беру құжаттарын) беру қағидаларын бекіту туралы
