  requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 25 июля 2016 года № 650. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 августа 2016 года № 14152. Утратил силу приказом Министра здравоохранения Республики Казахстан от 3 ноября 2020 года № ҚР ДСМ-177/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения Республики  Казахстан от 26 марта 2014 года № 151 «Об утверждении Правил выдачи заключений (разрешительных документов) на ввоз на территорию Республики Казахстан и вывоз с территории  Республики Казахстан гемопоэтических стволовых клеток, костного мозга в случае их перемещения с целью проведения неродственной трансплантации, а также образцов клеток, тканей, биологических жидкостей и секретов, в том числе продуктов жизнедеятельности человека, физиологических и патологических выделений, мазков, соскобов, смывов, предназначенных для  диагностических научных целей или полученных в процессе проведения биомедицинских исследований»
    kaz: «Туыстас емес транспланттауды жүргізу мақсатында гемопоэздік дің жасушаларын, сүйек кемігін өткізген жағдайда, оларды, сондай-ақ диагностикалық мақсаттарға арналған немесе биомедициналық зерттеулер жүргізу процесінде алынған жасушалардың, тіндердің, биологиялық сұйықтықтар мен сөлдердің, оның ішінде адамның тіршілік әрекеті өнімдерінің, физиологиялық және патологиялық шығындылардың, сүртінділердің, қырындылардың, шайындылардың үлгілерін Қазақстан Республикасының аумағына әкелуге және Қазақстан Республикасының аумағынан әкетуге қорытындылар (рұқсат беру құжаттарын) беру қағидаларын бекіту туралы» Қазақстан Республикасы  Денсаулық сақтау министрінің міндетін атқарушының 2014 жылғы 26 наурыздағы № 151 бұйрығына өзгерістер енгізу туралы
