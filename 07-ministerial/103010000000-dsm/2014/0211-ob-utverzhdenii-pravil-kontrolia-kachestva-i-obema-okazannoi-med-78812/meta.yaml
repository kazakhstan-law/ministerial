title:
  rus: Об утверждении Правил контроля качества и объема оказанной медицинской помощи и оплаты за оказанные медицинские услуги в рамках гарантированного объема бесплатной медицинской помощи, осуществляемые за счет средств местного бюджета
  kaz: Жергілікті бюджет қаражатының есебінен жүзеге асырылатын тегін медициналық көмектің кепілдік берілген көлемі шеңберінде көрсетілген медициналық көмектің сапасы мен көлемін және көрсетілетін медициналық қызмет үшін ақы төлеуді бақылау қағидаларын бекіту туралы
