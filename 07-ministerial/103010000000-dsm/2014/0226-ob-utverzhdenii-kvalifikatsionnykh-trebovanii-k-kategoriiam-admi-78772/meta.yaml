requisite: Приказ Министра здравоохранения Республики Казахстан от 26 февраля 2014 года № 110. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 марта 2014 года № 9266. Утратил силу приказом Министра здравоохранения и социального развития Республики Казахстан от 20 апреля 2016 года № 306
title:
  rus: Об утверждении квалификационных требований к категориям административных государственных должностей корпуса "Б" Комитета контроля медицинской и фармацевтической деятельности Министерства здравоохранения Республики Казахстан
  kaz: Қазақстан Республикасы Денсаулық сақтау министрлігі Медициналық және фармацевтикалық қызметті бақылау комитетінің "Б" корпусы мемлекеттік әкімшілік лауазымдарының санаттарына қойылатын біліктілік талаптарын бекіту туралы
