requisite: Приказ и.о. Министра здравоохранения и социального развития Республики Казахстан от 12 декабря 2014 года № 322. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 января 2015 года № 10078. Утратил силу приказом и.о. Министра здравоохранения и социального развития Республики Казахстан от 28 июля 2015 года № 627
title:
  rus: Об утверждении Методики расчета и порядка выплаты лизинговых платежей организациям здравоохранения, оказывающим гарантированный объем бесплатной медицинской помощи, за медицинскую технику, приобретенную на условиях финансового лизинга
  kaz: Қаржы лизингі шарттарында сатып алынған медициналық техника үшін тегін медициналық көмектің кепілдік берілген көлемін көрсететін денсаулық сақтау ұйымдарына лизинг төлемдерін есептеу әдістемесін және төлеу тәртібін бекіту туралы
