requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 18 декабря 2014 года № 330. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 января 2015 года № 10091. Утратил силу приказом Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 9 июня 2023 года № 213 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил субсидирования обязательных пенсионных взносов получателям социальных выплат на случай потери дохода в связи с уходом за ребенком по достижении им возраста полутора лет из Государственного фонда социального страхования
  kaz: Мемлекеттік әлеуметтік сақтандыру қорынан бала бір жарым жасқа толғанға дейін оның күтіміне байланысты табысынан айрылған жағдайда төленетін әлеуметтiк төлемдерді алушыларға міндетті зейнетақы жарналарын субсидиялау қағидаларын бекіту туралы
