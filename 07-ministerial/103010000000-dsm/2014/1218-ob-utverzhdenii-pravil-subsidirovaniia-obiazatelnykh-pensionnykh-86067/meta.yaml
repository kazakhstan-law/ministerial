    kaz: Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің, Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрі міндетін атқарушының және Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің кейбір бұйрықтарына өзгерістер енгізу туралы
