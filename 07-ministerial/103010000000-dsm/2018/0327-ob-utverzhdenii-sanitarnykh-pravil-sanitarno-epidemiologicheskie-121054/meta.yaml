  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 27 марта 2018 года № 126 «Об утверждении Санитарных правил «Санитарно-эпидемиологические требования к организации и проведению санитарно-противоэпидемических, санитарно-профилактических мероприятий по предупреждению инфекционных заболеваний»
    kaz: «Инфекциялық аурулардың алдын алу бойынша санитариялық-эпидемияға қарсы, санитариялық-профилактикалық іс-шараларды ұйымдастыруға және жүргізуге қойылатын санитариялық-эпидемиологиялық талаптар» санитариялық қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2018 жылғы 27 наурыздағы № 126 бұйрығына өзгерістер енгізу туралы
