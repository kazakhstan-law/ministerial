act_code: '121054'
requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 27 марта 2018 года № 126. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 апреля 2018 года № 16793. Утратил силу приказом Министра здравоохранения Республики Казахстан от 5 октября 2022 года № ҚР ДСМ-111 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Санитарных правил «Санитарно-эпидемиологические требования к организации и проведению санитарно-противоэпидемических, санитарно-профилактических мероприятий по предупреждению инфекционных заболеваний»
  kaz: «Инфекциялық аурулардың алдын алу бойынша санитариялық-эпидемияға қарсы, санитариялық-профилактикалық іс-шараларды ұйымдастыруға және жүргізуге қойылатын санитариялық-эпидемиологиялық талаптар» санитариялық қағидаларын бекіту туралы
