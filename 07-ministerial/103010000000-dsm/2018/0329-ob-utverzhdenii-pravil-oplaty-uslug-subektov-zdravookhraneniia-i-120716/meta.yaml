caused_by:
  code: '125616'
  requisite: Приказ Министра здравоохранения Республики Казахстан от 6 октября 2018 года № ҚР ДСМ-24. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 ноября 2018 года № 17693. Утратил силу приказом Министра здравоохранения Республики Казахстан от 27 ноября 2020 года № ҚР ДСМ-210/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 29 марта 2018 года № 138 «Об утверждении Правил оплаты услуг субъектов здравоохранения и Правил оплаты стоимости фармацевтических услуг субъектам в сфере обращения лекарственных средств, изделий медицинского назначения и медицинской техники»
    kaz: «Денсаулық сақтау субъектілерінің көрсетілетін қызметтеріне ақы төлеу қағидаларын және Дәрілік заттардың, медициналық мақсаттағы бұйымдар мен медициналық техниканың айналысы саласындағы субъектілерге фармацевтикалық көрсетілетін қызметтердің құнын төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2018 жылғы 29 наурыздағы № 138 бұйрығына өзгерістер енгізу туралы
