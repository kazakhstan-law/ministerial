  code: '126436'
  requisite: Приказ Министра здравоохранения Республики Казахстан от 6 декабря 2018 года № ҚР ДСМ-35. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 декабря 2018 года № 17872. Утратил силу приказом Министра здравоохранения Республики Казахстан от 13 декабря 2022 года № ҚР ДСМ-158 (вводится в действие со дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в приказы Министра здравоохранения Республики Казахстан от 26 ноября 2009 года № 801 «Об утверждении Правил формирования тарифов на медицинские услуги, оказываемые в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования и Методики формирования тарифов на медицинские услуги, оказываемые в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования» и от 29 марта 2018 года № 138 «Об утверждении Правил оплаты услуг субъектов здравоохранения и Правил оплаты стоимости фармацевтических услуг субъектам в сфере обращения лекарственных средств, изделий медицинского назначения и медицинской техники
    kaz: Қазақстан Республикасы Денсаулық сақтау министрінің «Тегін медициналық көмектің кепілдік берілген көлемінің шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде көрсетілетін медициналық қызметтерге арналған тарифтерді қалыптастыру қағидаларын және Тегін медициналық көмектің кепілдік берілген көлемінің шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде көрсетілетін медициналық қызметтерге арналған тарифтерді қалыптастыру әдістемесін бекіту туралы» 2009 жылғы 26 қарашадағы № 801 және «Денсаулық сақтау субъектілерінің көрсетілетін қызметтеріне ақы төлеу қағидаларын және Дәрілік заттардың, медициналық мақсаттағы бұйымдар мен медициналық техниканың айналысы саласындағы субъектілерге фармацевтикалық көрсетілген қызметтердің құнын төлеу қағидаларын бекіту туралы» 2018 жылғы 29 наурыздағы № 138 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
