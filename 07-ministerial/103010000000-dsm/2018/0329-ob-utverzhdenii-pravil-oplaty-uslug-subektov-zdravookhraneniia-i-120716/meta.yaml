  kaz: Денсаулық сақтау субъектілерінің көрсетілетін қызметтеріне ақы төлеу қағидаларын және Дәрілік заттар мен медициналық бұйымдардың айналысы саласындағы субъектілерге фармацевтикалық көрсетілген қызметтердің құнын төлеу қағидаларын бекіту туралы
