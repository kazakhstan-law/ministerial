act_code: '120716'
requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 29 марта 2018 года № 138. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 марта 2018 года № 16685. Утратил силу приказом Министра здравоохранения Республики Казахстан от 27 ноября 2020 года № ҚР ДСМ-210/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оплаты услуг субъектов здравоохранения и Правил оплаты стоимости фармацевтических услуг субъектам в сфере обращения лекарственных средств и медицинских изделий
  kaz: Денсаулық сақтау субъектілерінің көрсетілетін қызметтеріне ақы төлеу қағидаларын және Дәрілік заттар мен медициналық бұйымдардың айналысы саласындағы субъектілерге фармацевтикалық көрсетілген қызметтердің құнын төлеу қағидаларын бекіту туралы
