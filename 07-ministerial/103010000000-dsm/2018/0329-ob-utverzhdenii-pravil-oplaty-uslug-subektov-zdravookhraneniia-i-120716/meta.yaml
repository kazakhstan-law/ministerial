  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 29 марта 2018 года № 138 «Об утверждении Правил оплаты услуг субъектов здравоохранения и Правил оплаты стоимости фармацевтических услуг субъектам в сфере обращения лекарственных средств и медицинских изделий»
    kaz: «Денсаулық сақтау субъектілерінің көрсетілетін қызметтеріне ақы төлеу қағидаларын және Дәрілік заттар мен медициналық бұйымдардың айналысы саласындағы субъектілерге фармацевтикалық көрсетілген қызметтердің құнын төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2018 жылғы 29 наурыздағы № 138 бұйрығына өзгерістер енгізу туралы
