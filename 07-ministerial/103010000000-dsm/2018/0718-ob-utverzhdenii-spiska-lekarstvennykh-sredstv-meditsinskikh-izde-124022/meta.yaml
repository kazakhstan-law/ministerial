title:
  rus: Об утверждении списка лекарственных средств, медицинских изделий в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования, закупаемых у Единого дистрибьютора на 2019 год
  kaz: 2019 жылға арналған Бірыңғай дистрибьютордан сатып алынатын тегін медициналық көмектің кепілдік берілген көлемінің шеңберінде және әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттардың, медициналық бұйымдардың тізімін бекіту туралы
