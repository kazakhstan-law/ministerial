  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 18 июля 2018 года № 434 «Об утверждении списка лекарственных средств, изделий медицинского назначения в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования, закупаемых у Единого дистрибьютора на 2019 год»
    kaz: «2019 жылға арналған Бірыңғай дистрибьютордан сатып алынатын тегін медициналық көмектің кепілдік берілген көлемінің шеңберінде және әлеуметтік медициналық сақтандыру жүйесінде дәрілік заттардың, медициналық мақсаттағы бұйымдардың тізімін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2018 жылғы 18 шілдедегі № 434 бұйрығына өзгерістер мен толықтырулар енгізу туралы
