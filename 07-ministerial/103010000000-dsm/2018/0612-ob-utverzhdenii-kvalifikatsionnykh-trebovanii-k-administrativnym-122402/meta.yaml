  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 12 июня 2018 года № 358 «Об утверждении квалификационных требований к административным государственным должностям корпуса «Б» заместителей председателя Комитета фармации Министерства здравоохранения Республики Казахстан, руководителей территориальных подразделений и их заместителей»
    kaz: «Қазақстан Республикасы Денсаулық сақтау министрлігінің Фармация комитеті төрағасы орынбасарларының, аумақтық бөлімшелердің басшылары мен олардың орынбасарларының «Б» корпусы мемлекеттік әкімшілік лауазымдарына қойылатын біліктілік талаптарын бекіту туралы» Қазақстан Республикасының министрінің міндетін атқарушының 2018 жылғы 12 маусымдағы № 358 бұйрығына өзгерістер енгізу туралы
