requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 12 июня 2018 года № 358. Утратил силу приказом и.о. Министра здравоохранения Республики Казахстан от 5 августа 2019 года № 429 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении квалификационных требований к административным государственным должностям корпуса «Б» заместителей председателя Комитета фармации Министерства здравоохранения Республики Казахстан, руководителей территориальных подразделений и их заместителей
  kaz: Қазақстан Республикасы Денсаулық сақтау министрлігінің Фармация комитеті төрағасы орынбасарларының, аумақтық бөлімше басшылары мен олардың орынбасарларының «Б» корпусы мемлекеттік әкімшілік лауазымдарына қойылатын біліктілік талаптарын бекіту туралы
