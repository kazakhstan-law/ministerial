  requisite: Приказ Министра здравоохранения Республики Казахстан от 24 июня 2019 года № ҚР ДСМ-96. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 июня 2019 года № 18897. Утратил силу приказом Министра здравоохранения Республики Казахстан от 11 декабря 2020 года № ҚР ДСМ-248/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в Приказ Министра здравоохранения Республики Казахстан от 2 апреля 2018 года № 142 «Об утверждении Правил проведения медико-биологических экспериментов, доклинических (неклинических) и клинических исследований, а также требований к доклиническим и клиническим базам»
    kaz: «Медициналық – биологиялық эксперименттер, клиникаға дейінгі (клиникалық емес) және клиникалық зерттеулер жүргізу қағидаларын, сондай-ақ клиникаға дейінгі және клиникалық базаларға қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2018 жылғы 2 сәуірдегі № 142 бұйрығына өзгерістер енгізу туралы
