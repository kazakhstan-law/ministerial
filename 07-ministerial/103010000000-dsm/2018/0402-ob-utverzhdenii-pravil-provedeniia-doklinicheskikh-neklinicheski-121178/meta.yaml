  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 2 апреля 2018 года № 142 «Об утверждении Правил проведения доклинических (неклинических) исследований, клинических исследований, клинико-лабораторных испытаний медицинских изделий для диагностики in vitro, а также требований к доклиническим и клиническим базам»
    kaz: «In vitro диагностикасы үшін медициналық бұйымдарға клиникаға дейінгі (клиникалық емес) зерттеулер, клиникалық зерттеулер, клиникалық-зертханалық сынаулар жүргізу қағидаларын, сондай-ақ клиникаға дейінгі және клиникалық базаларға қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2018 жылғы 2 сәуірдегі № 142 бұйрығына өзгерістер енгізу туралы
