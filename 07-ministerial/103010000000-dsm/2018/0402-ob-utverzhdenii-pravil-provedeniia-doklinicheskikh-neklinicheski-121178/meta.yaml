act_code: '121178'
requisite: Приказ Министра здравоохранения Республики Казахстан от 2 апреля 2018 года № 142. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 апреля 2018 года № 16768. Утратил силу приказом Министра здравоохранения Республики Казахстан от 11 декабря 2020 года № ҚР ДСМ-248/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения доклинических (неклинических) исследований, клинических исследований, клинико-лабораторных испытаний медицинских изделий для диагностики in vitro, а также требований к доклиническим и клиническим базам и оказания государственной услуги «Выдача разрешения на проведение клинического исследования и (или) испытания фармакологических и лекарственных средств, медицинских изделий»
  kaz: In vitro диагностикасы үшін медициналық бұйымдарға клиникаға дейінгі (клиникалық емес) зерттеулер, клиникалық зерттеулер, клиникалық-зертханалық сынаулар жүргізу қағидалары, сондай-ақ клиникаға дейінгі және клиникалық базаларға қойылатын талаптарды және «Фармакологиялық және дәрілік заттарды, медициналық бұйымдарды клиникалық зерттеуді және (немесе) сынауды жүргізуге рұқсат беру» мемлекеттік қызметін көрсетуді бекіту туралы
