requisite: Приказ Министра здравоохранения Республики Казахстан от 18 апреля 2018 года № 175. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июня 2018 года № 16991. Утратил силу приказом Министра здравоохранения Республики Казахстан от 16 мая 2022 года № ҚР ДСМ-44 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Санитарных правил «Санитарно-эпидемиологические требования к организации и проведению санитарно-противоэпидемических и санитарно-профилактических мероприятий по предупреждению паразитарных заболеваний»
  kaz: «Паразиттік аурулардың алдын алу бойынша санитариялық-эпидемияға қарсы және санитариялық-профилактикалық іс-шараларды ұйымдастыруға және жүргізуге қойылатын санитариялық-эпидемиологиялық талаптар» санитариялық қағидаларын бекіту туралы
