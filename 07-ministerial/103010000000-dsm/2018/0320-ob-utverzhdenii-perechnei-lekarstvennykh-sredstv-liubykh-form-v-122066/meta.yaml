act_code: '122066'
requisite: Приказ Министра здравоохранения Республики Казахстан от 20 марта 2018 года № 124. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 апреля 2018 года № 16840. Утратил силу приказом Министра здравоохранения Республики Казахстан от 7 июня 2019 года № ҚР ДСМ-92 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечней лекарственных средств любых форм, в том числе используемых (применяемых) в области ветеринарии, изделий медицинского (ветеринарного) назначения и медицинской (ветеринарной) техники, сурдотифлотехники, лекарственных субстанций, материалов, оборудования и комплектующих для производства лекарственных средств любых форм, в том числе используемых (применяемых) в области ветеринарии, изделий медицинского (ветеринарного) назначения и медицинской (ветеринарной) техники, обороты по реализации которых и импорт освобождаются от налога на добавленную стоимость
  kaz: Өткізу бойынша айналымдары және импорты қосылған құн салығынан босатылатын кез келген нысандағы дәрілік заттардың, оның ішінде ветеринария саласында пайдаланылатын (қолданылатын), медициналық (ветеринарлық) мақсаттағы бұйымдардың,  медициналық (ветеринарлық) техниканың, сурдотифлотехниканың,  дәрілік субстанциялардың, кез келген нысандағы дәрілік заттарды өндіруге арналған материалдардың, жабдықтар мен жинақтаушы заттардың оның ішінде ветеринария саласында пайдаланылатын (қолданылатын), медициналық (ветеринарлық) мақсаттағы бұйымдар мен медициналық (ветеринарлық) техниканың тізбесін бекіту туралы
