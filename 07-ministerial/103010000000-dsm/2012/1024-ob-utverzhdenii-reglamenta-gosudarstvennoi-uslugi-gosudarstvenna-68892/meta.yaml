act_code: '68892'
requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 24 октября 2012 года № 743. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 ноября 2012 года № 8112. Утратил силу приказом Председателя Агентства Республики Казахстан по защите прав потребителей от 20 июня 2014 года № 145
title:
  rus: Об утверждении регламента государственной услуги "Государственная регистрация и перерегистрация продуктов детского питания, пищевых и биологически активных добавок к пище, генетически модифицированных объектов, красителей, средств дезинфекции, дезинсекции и дератизации, материалов и изделий, контактирующих с водой и продуктами питания, химических веществ, отдельных видов продукции и веществ, оказывающих вредное воздействие на здоровье человека"
  kaz: '"Балалар тамағы өнімдерін, тағамға тағамдық және биологиялық активті қоспаларды, генетикалық түрлендірілген объектілерді, бояғыштарды, дезинфекция, дезинсекция және дератизация құралдарын, сумен және тамақ өнімдерімен жанасатын материалдар мен бұйымдарды, химиялық заттарды, адам денсаулығына зиянды әсер ететін өнімдер мен заттардың жекелеген түрлерін мемлекеттік тіркеу" мемлекеттік қызмет регламентін бекіту туралы'
