act_code: '66680'
requisite: Приказ Министра здравоохранения Республики Казахстан от 9 июля 2012 года № 463. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 июля 2012 года № 7800
title:
  rus: О размещении государственного образовательного заказа на подготовку специалистов с высшим медицинским и фармацевтическим образованием в республиканских государственных предприятиях на праве хозяйственного ведения "Казахский национальный медицинский университет имени С.Д. Асфендиярова" и "Южно-Казахстанская государственная фармацевтическа академия», в акционерном обществе "Медицинский университет Астана", финансируемых из республиканского бюджета на 2012-2013 учебный год
  kaz: Республикалық бюджеттен қаржыландырылатын "С.Ж. Асфендияров атындағы Қазақ ұлттық медицина университеті", "Оңтүстік Қазақстан мемлекеттік фармацевтика академиясы" шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорындарында, "Астана медицина университеті" акционерлік қоғамында жоғары медициналық және фармацевтикалық білімі бар мамандарды даярлауға 2012-2013 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру туралы
