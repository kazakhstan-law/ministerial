requisite: Приказ Министра здравоохранения Республики Казахстан от 14 ноября 2012 года № 796. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 декабря 2012 года № 8175. Утратил силу приказом Министра здравоохранения и социального развития Республики Казахстан от 7 октября 2015 года № 785
title:
  rus: Об утверждении критериев оценки степени риска в сферах оказания медицинских услуг, обращения лекарственных средств, изделий медицинского назначения и медицинской техники и форм проверочных листов для государственных организаций здравоохранения
  kaz: Мемлекеттік денсаулық сақтау ұйымдарына арналған медициналық қызметтерді көрсету, дәрілік заттардың айналысы, медициналық мақсаттағы бұйымдар және медициналық мақсаттағы техника саласындағы тәуекел дәрежесін бағалау өлшемдерін және тексеру парақтарының нысандарын бекіту туралы
