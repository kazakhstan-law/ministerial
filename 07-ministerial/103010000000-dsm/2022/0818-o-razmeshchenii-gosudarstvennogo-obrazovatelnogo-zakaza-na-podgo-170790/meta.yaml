  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 18 августа 2022 года № ҚР ДСМ-85 «О размещении государственного образовательного заказа на подготовку специалистов с послесредним, высшим и послевузовским медицинским и фармацевтическим образованием на 2022-2023 учебный год»
    kaz: «Орта білімнен кейінгі, жоғары және жоғары оқу орнынан кейінгі медициналық және фармацевтикалық білімі бар мамандар даярлауға 2022-2023 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2022 жылғы 18 тамыздағы № ҚР ДСМ-85 бұйрығына өзгерістер енгізу туралы
