title:
  rus: О размещении государственного образовательного заказа на подготовку специалистов с послесредним, высшим и послевузовским медицинским и фармацевтическим образованием на 2022-2023 учебный год
  kaz: Орта білімнен кейінгі, жоғары және жоғары оқу орнынан кейінгі медициналық және фармацевтикалық білімі бар мамандар даярлауға 2022-2023 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру туралы
