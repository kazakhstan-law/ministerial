title:
  rus: Об утверждении типовых штатов и штатных нормативов медицинских организаций, оказывающих медицинскую помощь лицам, содержащимся в следственных изоляторах и в учреждениях уголовно-исполнительной (пенитенциарной) системы
  kaz: Қылмыстық-атқару (пенитенциарлық) жүйесінің тергеу изоляторлары мен мекемелерінде ұсталатын адамдарға медициналық көмек көрсететін медициналық ұйымдардың үлгілік штаттары мен штат нормативтерін бекіту туралы
