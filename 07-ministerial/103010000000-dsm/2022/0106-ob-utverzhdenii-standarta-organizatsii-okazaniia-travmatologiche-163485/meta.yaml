    kaz: «Қазақстан Республикасында травматологиялық және ортопедиялық көмек көрсетуді ұйымдастыру стандартын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2022 жылғы 6 қаңтардағы № ҚР ДСМ-1 бұйрығына өзгеріс енгізу туралы
