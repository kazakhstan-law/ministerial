  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра здравоохранения Республики Казахстан от 6 января 2022 года № ҚР ДСМ-1 «Об утверждении Стандарта организации оказания травматологической и ортопедической помощи в Республике Казахстан»
    kaz: «Қазақстан Республикасында травматологиялық және ортопедиялық көмек көрсетуді ұйымдастыру стандартын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің міндетін атқарушының 2022 жылғы 6 қаңтардағы № ҚР ДСМ-1 бұйрығына өзгерістер мен толықтырулар енгізу туралы
