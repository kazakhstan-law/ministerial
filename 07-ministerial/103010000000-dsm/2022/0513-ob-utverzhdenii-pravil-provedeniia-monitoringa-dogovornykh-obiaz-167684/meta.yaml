  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 13 мая 2022 года № ҚР ДСМ-43 «Об утверждении правил проведения мониторинга договорных обязательств по качеству и объему медицинских услуг субъектов здравоохранения в рамках дополнительного объема медицинской помощи лицам, содержащимся в следственных изоляторах и учреждениях уголовно-исполнительной (пенитенциарной) системы»
    kaz: «Қылмыстық-атқару (пенитенциарлық) жүйесінің тергеу изоляторлары мен мекемелерінде ұсталатын адамдарға медициналық көмектің қосымша көлемі шеңберінде денсаулық сақтау субъектілері көрсететін қызметтерге ақы төлеу уәкілетті орган айқындайтын тәртіппен медициналық көрсетілетін қызметтердің сапасы мен көлемі жөніндегі шарттық міндеттемелерге мониторинг жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2022 жылғы 13 мамырдағы № ҚР ДСМ-43 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/198170/rus
