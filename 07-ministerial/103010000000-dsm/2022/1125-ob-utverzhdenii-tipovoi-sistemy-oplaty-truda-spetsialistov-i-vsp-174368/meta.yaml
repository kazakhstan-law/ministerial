  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 25 ноября 2022 года № ҚР ДСМ-140 «Об утверждении типовой системы оплаты труда специалистов и вспомогательного персонала государственных предприятий на праве хозяйственного ведения, осуществляющих обращение (выполняющих вспомогательную функцию при осуществлении обращения) с патогенными биологическими агентами I и II групп патогенности»
    kaz: «Шаруашылық жүргізу құқығындағы мемлекеттік кәсіпорындардың патогендігі I және II топтардағы патогенді биологиялық агенттермен жұмыс істеуді жүзеге асыратын (жұмыс істеуді жүзеге асыру кезінде қосалқы функцияны орындайтын) мамандары мен көмекші персоналының еңбегіне ақы төлеудің үлгілік жүйесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2022 жылғы 25 қарашадағы № ҚР ДСМ-140 бұйрығына өзгерістер енгізу туралы
