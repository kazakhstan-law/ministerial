title:
  rus: Об утверждении перечня товаров, не относящихся к лекарственным средствам и медицинским изделиям, разрешенных к оптовой и розничной реализации субъектами в сфере обращения лекарственных средств и медицинских изделий
  kaz: Дәрілік заттар мен медициналық бұйымдардың айналысы саласындағы субъектілерге көтерме және бөлшек саудада өткізуге рұқсат етілген дәрілік заттар мен медициналық бұйымдарға жатпайтын тауарлардың тізбесін бекіту туралы
