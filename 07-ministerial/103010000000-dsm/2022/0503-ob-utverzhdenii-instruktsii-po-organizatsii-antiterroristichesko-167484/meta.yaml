title:
  rus: Об утверждении инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, осуществляющих деятельность в области здравоохранения Республики Казахстан
  kaz: Қазақстан Республикасының денсаулық сақтау саласындағы қызметті жүзеге асыру бойынша террористік тұрғыдан осал объектілердің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
