    kaz: «Қазақстан Республикасының денсаулық сақтау саласындағы қызметті жүзеге асыру бойынша террористік тұрғыдан осал объектілердің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2022 жылғы 3 мамырдағы № ҚР ДСМ-40 бұйрығына өзгерістер мен толықтырулар енгізу туралы
