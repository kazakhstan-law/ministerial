  title:
    rus: О внесении изменений в приказ Министра здравоохранения Республики Казахстан от 3 мая 2022 года № ҚР ДСМ–40 «Об утверждении инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, осуществляющих деятельность в области здравоохранения Республики Казахстан»
    kaz: «Қазақстан Республикасының денсаулық сақтау саласындағы қызметті жүзеге асыру бойынша террористік тұрғыдан осал объектілердің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2022 жылғы 3 мамырдағы № ҚР ДСМ-40 бұйрығына өзгерістер енгізу туралы
