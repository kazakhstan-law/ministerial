requisite: Приказ Министра здравоохранения Республики Казахстан от 17 июня 2022 года № 477
title:
  rus: Об утверждении минимальных нормативов оснащения медицинской техникой и изделиями медицинского назначения медицинских организаций, оказывающих медицинскую помощь лицам, содержащимся в следственных изоляторах и учреждениях уголовно-исполнительной (пенитенциарной) системы
  kaz: Қылмыстық-атқару (пенитенциарлық) жүйесінің тергеу изоляторлары мен мекемелерінде ұсталатын адамдарға медициналық көмек көрсететін медициналық ұйымдарды медициналық техникамен және медициналық мақсаттағы бұйымдармен жарақтандырудың ең төмен нормативтерін бекіту туралы
