    kaz: «Ауруына байланысты жазасын өтеуден босатуға ұсынылатын сотталғандарды медициналық куәландырудан өткізу қағидаларын және жазасын өтеуден босатуға негіз болып табылатын аурулардың тізбесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2022 жылғы 30 маусымдағы № ҚР ДСМ--58 бұйрығына өзгерістер енгізу туралы
