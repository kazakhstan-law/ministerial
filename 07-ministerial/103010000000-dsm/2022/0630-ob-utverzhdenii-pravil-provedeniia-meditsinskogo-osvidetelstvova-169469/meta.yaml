title:
  rus: «Об утверждении правил проведения медицинского освидетельствования осужденных, представляемых к освобождению от отбывания наказания в связи с заболеванием, и перечня заболеваний, являющихся основанием освобождения от отбывания наказания»
  kaz: «Ауруына байланысты жазасын өтеуден босатуға ұсынылатын сотталғандарды медициналық куәландырудан өткізу қағидаларын және жазасын өтеуден босатуға негіз болып табылатын аурулардың тізбесін бекіту туралы»
