requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 12 августа 2022 года № ҚР ДСМ-81. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 августа 2022 года № 29117
title:
  rus: Об утверждении правил и методики формирования тарифов на медицинские услуги, предоставляемые в рамках дополнительного объема медицинской помощи лицам, содержащимся в следственных изоляторах и учреждениях уголовно-исполнительной (пенитенциарной) системы, за счет бюджетных средств
  kaz: Қылмыстық-атқару (пенитенциарлық) жүйесінің тергеу изоляторлары мен мекемелерінде ұсталатын адамдарға бюджет қаражаты есебінен медициналық көмектің қосымша көлемі шеңберінде ұсынылатын медициналық көрсетілетін қызметтерге арналған тарифтерді қалыптастыру қағидаларымен әдістемесін бекіту туралы
