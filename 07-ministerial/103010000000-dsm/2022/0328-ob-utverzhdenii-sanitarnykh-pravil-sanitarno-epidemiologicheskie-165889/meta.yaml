title:
  rus: Об утверждении Санитарных правил «Санитарно-эпидемиологические требования к организации и проведению санитарно-противоэпидемических, санитарно-профилактических мероприятий по предупреждению инфекционных заболеваний (туберкулез)»
  kaz: «Инфекциялық аурулардың (туберкулез) алдын алу жөніндегі санитариялық-эпидемияға қарсы, санитариялық-профилактикалық іс-шараларды ұйымдастыруға және жүргізуге қойылатын санитариялық-эпидемиологиялық талаптар» санитариялық қағидаларын бекіту туралы
