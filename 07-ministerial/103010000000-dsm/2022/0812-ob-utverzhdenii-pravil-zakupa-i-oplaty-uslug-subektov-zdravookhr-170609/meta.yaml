act_code: '170609'
requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 12 августа 2022 года № ҚР ДСМ-82. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 августа 2022 года № 29113
title:
  rus: Об утверждении правил закупа и оплаты услуг субъектов здравоохранения по оказанию медицинской помощи лицам, содержащимся в следственных изоляторах и учреждениях уголовно-исполнительной (пенитенциарной) системы, за счет бюджетных средств
  kaz: Қылмыстық-атқару (пенитенциарлық) жүйесінің тергеу изоляторлары мен мекемелерінде ұсталатын адамдарға медициналық көмек көрсету бойынша денсаулық сақтау субъектілерінің көрсетілетін қызметтерін бюджет қаражаты есебінен сатып алу және олардың ақысын төлеу қағидаларын бекіту туралы
