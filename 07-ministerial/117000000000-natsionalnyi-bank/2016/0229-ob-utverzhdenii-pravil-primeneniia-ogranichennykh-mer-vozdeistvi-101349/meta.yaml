act_code: '101349'
requisite: Постановление Правления Национального Банка Республики Казахстан от 29 февраля 2016 года № 68. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 апреля 2016 года № 13601. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 29 октября 2018 года № 272 (вводится в действие с 1 января 2019 года)
title:
  rus: Об утверждении Правил применения ограниченных мер воздействия в отношении банка, организации, осуществляющей отдельные виды банковских операций, а также банковского холдинга, организаций, входящих в состав банковского конгломерата, крупных участников банка и Правил применения принудительных мер к лицам, обладающим признаками крупного участника или банковского холдинга, а также к крупным участникам банка, банковским холдингам или юридическим лицам, входящим в состав банковского конгломерата
  kaz: Банкке, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымға, сондай-ақ банк холдингіне, банк конгломератының құрамына кіретін ұйымдарға, банктің ірі қатысушыларына қатысты шектеулі ықпал ету шараларын қолдану қағидаларын және Ірі қатысушы немесе банк холдингі белгілері бар тұлғаларға, сондай-ақ банктің ірі қатысушыларына, банк холдингтеріне немесе банк конгломераттарының құрамына кіретін заңды тұлғаларға мәжбүрлеу шараларын қолдану қағидаларын бекіту туралы
