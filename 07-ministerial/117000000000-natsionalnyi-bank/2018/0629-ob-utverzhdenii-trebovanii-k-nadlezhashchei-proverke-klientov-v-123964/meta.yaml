  title:
    rus: О внесении изменений в постановление Правления Национального Банка Республики Казахстан и постановления Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка по вопросам регулирования финансового рынка и противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения на финансовом рынке
    kaz: Қазақстан Республикасы Ұлттық Банкі Басқармасының қаулысына және Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі Басқармасының қаулыларына қаржы нарығын реттеу және қаржы нарығында қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл мәселелері бойынша өзгерістер енгізу туралы
