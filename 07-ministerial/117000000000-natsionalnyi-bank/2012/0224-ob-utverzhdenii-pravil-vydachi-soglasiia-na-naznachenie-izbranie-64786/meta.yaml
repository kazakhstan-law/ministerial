  title:
    rus: О внесении изменений и дополнения в некоторые нормативные правовые акты Республики Казахстан по вопросам согласования руководящих работников финансовых организаций, холдингов и Акционерного общества «Фонд гарантирования страховых выплат»
    kaz: Қазақстан Республикасының кейбір нормативтік құқықтық актілеріне қаржы ұйымдарының, холдингтердің және «Сақтандыру төлемдеріне кепілдік беру қоры» акционерлік қоғамының басшы қызметкерлерін келісу мәселелері бойынша өзгерістер мен толықтыру енгізу туралы
