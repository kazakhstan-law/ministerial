requisite: Постановление Правления Национального Банка Республики Казахстан от 24 февраля 2012 года № 95. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 апреля 2012 года № 7561. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 26 декабря 2016 года № 305
title:
  rus: Об утверждении Правил выдачи согласия на назначение (избрание) руководящих работников финансовых организаций, банковских, страховых холдингов и перечня документов, необходимых для получения согласия
  kaz: Қаржы ұйымдарының, банк, сақтандыру холдингтерінің басшы қызметкерлерін тағайындауға (сайлауға) келісім беру қағидаларын және келісім алу үшін қажетті құжаттар тізбесін бекіту туралы
