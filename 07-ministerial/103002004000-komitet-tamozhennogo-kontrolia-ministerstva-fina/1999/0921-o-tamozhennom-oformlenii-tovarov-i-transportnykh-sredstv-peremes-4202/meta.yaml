  title:
    rus: О внесении дополнений и изменений в приказ Председателя Таможенного комитета Министерства государственных доходов Республики Казахстан от 22 сентября 1999 года N 462-П "О таможенном оформлении товаров и транспортных средств, перемещаемых физическими лицами через пункты пропуска "Коргас", "Бахты", "Достык", "Майкапшагай", "Колжат", зарегистрированный в Министерстве юстиции Республики Казахстан от 4 октября 1999 года N 918
    kaz: Қазақстан Республикасының Әділет министрлігінде 1999 жылы 4 қазанда N 918 болып Тіркелген "Қорғас", "Бахты", "Достық", "Майқапшағай", "Қолжат" өткізу пункттері арқылы жеке адамдар өткізетін тауарлар мен көлік құралдарын кедендік ресімдеу туралы" Қазақстан Республикасы Мемлекеттік кіріс министрлігінің Кеден комитеті төрағасының 1999 жылғы 22 қыркүйектегі N 462-Ө бұйрығына толықтыру мен өзгеріс енгізу туралы
