  title:
    rus: О внесении изменений и дополнения в приказ Председателя Таможенного комитета Министерства государственных доходов Республики Казахстан от 22 сентября 1999 года N 462-П "О таможенном оформлении товаров и транспортных средств, перемещаемых физическими лицами через пункты пропуска "Коргас", "Бахты", "Достык", "Майкапшагай", "Колжат", зарегистрированный в Министерстве юстиции Республики Казахстан 4 октября 1999 года N 918
    kaz: Қазақстан Республикасының Әділет министрлігінде 1999 жылғы 4 қазанда N 918 болып тіркелген "Жеке тұлғалар "Қорғас", "Бахты", "Достық", "Майқапшағай", "Қалжат" өткізу пункттері арқылы өткізетін тауарлар мен көлік құралдарын кедендік ресімдеу туралы" Қазақстан Республикасы Мемлекеттік кіріс министрлігінің Кеден комитеті төрағасының 1999 жылғы 22 қыркүйектегі N 462-Ө бұйрығына өзгерістер мен толықтыру енгізу туралы
