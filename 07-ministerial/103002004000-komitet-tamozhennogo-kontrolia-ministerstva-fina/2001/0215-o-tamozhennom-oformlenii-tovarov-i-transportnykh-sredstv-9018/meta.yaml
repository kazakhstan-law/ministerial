    kaz: Қазақстан Республикасының Әдiлет министрлігінде 2001 жылғы 30 наурызда N 1442 болып тiркелген "Тауарлар мен көлiк құралдарын кедендiк ресiмдеу туралы" Қазақстан Республикасы мемлекеттiк кiрiс министрлiгiнiң Кеден комитетi төрағасының 2001 жылғы 15 ақпандағы N 54 бұйрығына толықтыру енгізу туралы
