  requisite: Приказ Вице-Министра финансов - Председателя Комитета таможенного контроля Министерства финансов Республики Казахстан от 7 сентября 2005 года № 345. Зарегистрирован в Министерстве юстиции Республики Казахстан от 30 сентября 2005 года № 3862. Утратил силу приказом Министра финансов Республики Казахстан от 11 июля 2011 года № 360
  title:
    rus: О внесении изменений в приказ И.о. Председателя Агентства таможенного контроля Республики Казахстан от 27 сентября 2004 года № 400 "Об утверждении Правил проведения радиационного контроля таможенными органами на государственной границе Республики Казахстан"
    kaz: '"Кеден органдарының Қазақстан Республикасының мемлекеттік шекарасында радиациялық бақылау жүргізу ережесін бекіту туралы" Қазақстан Республикасы Кедендік бақылау агенттігінің төрағасы міндетін атқарушының 2004 жылғы 27 қыркүйектегі № 400 бұйрығына өзгерістер енгізу туралы'
