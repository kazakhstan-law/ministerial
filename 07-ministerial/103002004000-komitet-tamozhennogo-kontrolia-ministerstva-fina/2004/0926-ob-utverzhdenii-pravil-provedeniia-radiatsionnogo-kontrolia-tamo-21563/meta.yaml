act_code: '21563'
requisite: Приказ и.о. Председателя Агентства таможенного контроля Республики Казахстан от 27 сентября 2004 года № 400. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 сентября 2004 года за № 3116. Утратил силу приказом Министра финансов Республики Казахстан от 11 июля 2011 года № 360
title:
  rus: Об утверждении Правил проведения радиационного контроля таможенными органами в пунктах пропуска через государственную (таможенную) границу Республики Казахстан
  kaz: Кеден органдарының Қазақстан Республикасының мемлекеттік (кеден) шекарасы арқылы өткізу пункттерінде радиациялық бақылау жүргізу ережесін бекіту туралы
