  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства таможенного контроля Республики Казахстан от 15 сентября 2004 года N 385 "О внедрении в эксплуатацию комплекса электронного декларирования "Web-декларант" в Департаментах таможенного контроля и таможнях Агентства таможенного контроля Республики Казахстан"
    kaz: '"Қазақстан Республикасының Қаржы министрлігі Кедендік бақылау комитетінің Агенттігі бақылау департаменттері мен кедендерінде "Web-декларант" электронды декларациялау кешенін пайдалануға енгізу туралы" Қазақстан Республикасының Қаржы министрлігі Кедендік бақылау Агенттігі төрағасының 2004 жылғы 15 қыркүйектегі N 385 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
