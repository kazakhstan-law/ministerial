act_code: '21279'
requisite: Приказ Председателя Агентства таможенного контроля Республики Казахстан от 15 сентября 2004 года N 385. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 сентября 2004 года N 3071. Утратил силу приказом Министра финансов Республики Казахстан от 21 сентября 2010 года N 474
title:
  rus: О внедрении в эксплуатацию комплекса электронного декларирования "Web-декларант" в Департаментах таможенного контроля и таможнях Агентства таможенного контроля Республики Казахстан
  kaz: Қазақстан Республикасының Кедендік бақылау агенттігінің Кедендік бақылау департаменттері мен кедендерінде "Web-декларант" электронды декларациялау кешенін пайдалануға енгізу туралы
