  title:
    rus: О внесении дополнения в приказ И.о. Председателя Агентства таможенного контроля Республики Казахстан от 26 июня 2004 года N 280 "Об утверждении Перечня территориальных подразделений уполномоченного органа по вопросам таможенного дела, осуществляющие таможенное оформление делящихся и радиоактивных материалов"
    kaz: '"Кеден ісі мәселелері жөніндегі уәкілетті органның бөлінетін және радиоактивті материалдарды кедендік ресімдеуді жүзеге асыратын аумақтық бөлімшелерінің тізбесін бекіту туралы" Қазақстан Республикасы Кедендік бақылау агенттігінің төрағасы міндетін атқарушының 2004 жылғы 26 маусымдағы N 280 бұйрығына толықтырулар енгізу туралы'
