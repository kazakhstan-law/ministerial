title:
  rus: Об утверждении Перечня территориальных подразделений уполномоченного органа по вопросам таможенного дела, осуществляющих таможенное оформление делящихся и радиоактивных материалов
  kaz: Кеден ісі мәселелері жөніндегі уәкілетті органның радиоактивті материалдарды кедендік ресімдеуді жүзеге асыратын аумақтық бөлімшелерінің тізбесін бекіту туралы
