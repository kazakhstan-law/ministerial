  title:
    rus: О внесении изменений и дополнений в приказ и.о. Председателя Агентства таможенного контроля Республики Казахстан от 29 мая 2003 года N 258 "Об утверждении Правил отнесения участников внешнеэкономической деятельности к категории минимального риска и применения упрощенного порядка таможенного оформления" (зарегистрированный в Министерстве юстиции Республики Казахстан за N 2349)
    kaz: '"Сыртқы экономикалық қызметке қатысушыларды ең төменгі деңгейдегі тәуекел санатына жатқызу және кезеңдік ресімдеудің оңайлатылған тәртібін қолдану ережесін бекіту туралы"»Қазақстан Республикасының Кедендік бақылау агенттігі төрағасының 2003 жылғы 29 мамырдағы N 258 бұйрығына (Қазақстан Республикасының Әділет министрлігінде 2003 жылғы 5 маусымда N 2349 тіркелген) өзгерістер мен толықтырулар енгізу туралы'
