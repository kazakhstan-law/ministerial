    kaz: N 2349 тіркелген Қазақстан Республикасы Кедендік бақылау агенттігінің төрағасы міндетін атқарушының "Сыртқы экономикалық қызметке қатысушыларды ең аз тәуекел санатына жатқызудың және кедендік ресімдеудің ережесін бекіту туралы" 2003 жылғы 29 мамырдағы N 258 бұйрығына өзгерістер енгізу туралы
