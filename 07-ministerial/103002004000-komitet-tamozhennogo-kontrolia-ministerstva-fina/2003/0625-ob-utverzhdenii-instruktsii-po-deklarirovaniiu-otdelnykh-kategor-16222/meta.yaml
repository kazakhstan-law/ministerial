title:
  rus: Об утверждении Инструкции по декларированию отдельных категорий товаров в определенных таможенных органах Республики Казахстан
  kaz: Қазақстан Республикасының белгілі бір кедендерінде тауарлардың жекелеген санатын декларациялау бойынша нұсқаулықты бекіту туралы
