  title:
    rus: О внесении дополнений в Приказ Председателя Агентства таможенного контроля Республики Казахстан от 26 июня 2003 года N 326 "Об утверждении Инструкции по декларированию отдельных категорий товаров в определенных таможенных органах Республики Казахстан", зарегистрированный в Министерстве юстиции Республики Казахстан за N 2401
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде N 2401 болып тiркелген "Қазақстан Республикасының белгiлi бiр кеден органдарында тауарлардың жекелеген санаттарын декларациялау жөнiндегi нұсқаулықты бекiту туралы" Қазақстан Республикасының Кедендiк бақылау агенттiгi төрағасының 2003 жылғы 26 маусымдағы N 326 бұйрығына толықтырулар енгiзу туралы
