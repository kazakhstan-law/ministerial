title:
  rus: Об утверждении Правил перечисления таможенных платежей, налогов и пени в бюджет и зачета, возврата излишне уплаченных таможенных платежей, налогов и пени из бюджета
  kaz: Кедендік төлемдерді, салықтарды және өсімпұлдарды бюджетке аударудың және артық төленген кедендік төлемдерді, салықтарды және өсімпұлдарды есепке алу мен бюджеттен қайтарып алудың ережесін бекіту туралы
