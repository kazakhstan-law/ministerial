  title:
    rus: О внесении изменений и дополнений в приказ - Председателя Агентства таможенного контроля Республики Казахстан от 27 мая 2003 года № 247 "Об утверждении Правил перечисления таможенных платежей, налогов и пени в государственный бюджет и зачета, возврата излишне уплаченных таможенных платежей, налогов и пени из государственного бюджета"
    kaz: '"Кедендік төлемдерді, салықтарды және өсімпұлдарды мемлекеттік бюджетке аударудың және артық төленген кедендік төлемдерді, салықтарды және өсімпұлдарды есепке алу мен мемлекеттік бюджеттен қайтарып алудың ережесін бекіту туралы" Қазақстан Республикасының Кедендік бақылау агенттігі төрағасының 2003 жылғы 27 мамырдағы № 247 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/25497/rus
