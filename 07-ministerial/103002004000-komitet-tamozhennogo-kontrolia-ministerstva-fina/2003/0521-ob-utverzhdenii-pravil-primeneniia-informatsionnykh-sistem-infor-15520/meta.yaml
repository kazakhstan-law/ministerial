  title:
    rus: О внесении изменения в приказ Председателя Агентства таможенного контроля Республики Казахстан от 22 мая 2003 года № 227 "Об утверждении Правил применения информационных систем, информационных технологий и средств их обеспечения для таможенных целей" (зарегистрированный в Министерстве юстиции Республики Казахстан 24 мая 2003 года № 2307)
    kaz: '"Ақпараттық жүйелердi, ақпараттық технологияларды және кедендiк мақсаттар үшiн оларды қамтамасыз ету құралдарын пайдаланудың ережесiн бекiту туралы" Қазақстан Республикасының Кедендiк бақылау агенттiгi төрағасының 2003 жылғы 22 мамырдағы N 227 бұйрығына (Қазақстан Республикасының Әдiлет министрлiгiнде 2003 жылғы 24 мамырда N 2307 болып тiркелген) өзгерiстер енгiзу туралы'
