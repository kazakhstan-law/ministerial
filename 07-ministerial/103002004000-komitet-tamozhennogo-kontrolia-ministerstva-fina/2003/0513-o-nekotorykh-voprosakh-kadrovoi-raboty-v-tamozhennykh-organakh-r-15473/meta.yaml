  title:
    rus: О внесении изменения в приказ Председателя Агентства таможенного контроля Республики Казахстан от 14 мая 2003 года N 202 "О некоторых вопросах кадровой работы в таможенных органах Республики Казахстан" (зарегистрированный в Министерстве юстиции Республики Казахстан 20 мая 2003 года за N 2286)
    kaz: '"Қазақстан Республикасының кеден органдарындағы кадр жұмысының кейбір мәселелері туралы" Қазақстан Республикасының Кедендік бақылау агенттігі төрағасының 2003 жылғы 14 мамырдағы N 202 бұйрығына (Қазақстан Республикасының Әділет министрлігінде 2003 жылғы 20 мамырда N 2286 болып тіркелген) өзгерістер енгізу туралы'
