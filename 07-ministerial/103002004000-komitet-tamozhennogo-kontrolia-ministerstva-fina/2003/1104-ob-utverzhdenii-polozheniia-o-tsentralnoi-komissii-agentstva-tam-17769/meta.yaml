act_code: '17769'
requisite: Приказ Председателя Агентства таможенного контроля Республики Казахстан от 4 ноября 2003 года N 497. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 ноября 2003 года N 2571. Утратил силу приказом Председателя Комитета таможенного контроля Министерства финансов РК от 14 ноября 2007 года N 344
title:
  rus: Об утверждении Положения о Центральной Комиссии Агентства таможенного контроля Республики Казахстан по аттестации специалистов по таможенному оформлению и Инструкции по проведению квалификационных экзаменов на получение квалификации специалиста по таможенному оформлению
  kaz: Қазақстан Республикасы Кедендік бақылау агенттігінің Кедендік ресімдеу жөніндегі мамандарды аттестациядан өткізу жөніндегі Орталық комиссиясы туралы ережені және Кедендік ресімдеу жөніндегі маманның біліктілік алуға арналған біліктілік емтихандарын жүргізу жөніндегі нұсқаулықты бекіту туралы
