  requisite: Приказ Председателя Агентства таможенного контроля Республики Казахстан от 27 августа 2004 года N 367. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 сентября 2004 года N 3066. Утратил силу приказом Министра финансов Республики Казахстан от 21 сентября 2010 года N 474
  title:
    rus: О внесении изменений в приказ Председателя Агентства таможенного контроля Республики Казахстан от 7 июля 2003 года N 335 "Об утверждении Инструкции по осуществлению таможенного контроля за товарами, перемещаемыми через таможенную границу Республики Казахстан", зарегистрированный за N 2425
    kaz: N 2425 болып тіркелген "Қазақстан Республикасының кеден шекарасы арқылы тасымалданатын тауарларды кедендік бақылауды жүзеге асыру жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасының Кедендік бақылау агенттігі төрағасының 2003 жылғы 7 шілдедегі N 335 бұйрығына өзгерістер енгізу туралы
