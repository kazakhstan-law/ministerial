act_code: '25589'
requisite: Приказ и.о. Председателя Комитета таможенного контроля Министерства финансов Республики Казахстан от 29 сентября 2005 года № 385. Зарегистрирован в Министерстве юстиции Республики Казахстан от 14 октября 2005 года № 3892. Утратил силу приказом Министра финансов Республики Казахстан от 21 сентября 2010 года № 474
