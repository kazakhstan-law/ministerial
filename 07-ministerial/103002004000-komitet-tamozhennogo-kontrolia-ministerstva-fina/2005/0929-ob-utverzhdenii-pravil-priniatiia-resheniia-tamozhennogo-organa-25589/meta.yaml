  title:
    rus: '"О внесении изменений и дополнения в приказы Председателя Агентства таможенного контроля Республики Казахстан от 15 мая 2003 года № 210 "Об утверждении Правил принятия и формы предварительного решения" и исполняющего обязанности Председателя Комитета таможенного контроля Министерства финансов Республики Казахстан от 29 сентября 2005 года № 385 "Об утверждении Правил принятия решения таможенного органа по классификации товаров и его формы"'
    kaz: '"Алдын ала шешімді қабылдау ережелері мен нысандарын бекіту туралы" Қазақстан Республикасы Кедендік бақылау агенттігі төрағасының 2003 жылғы 15 мамырдағы N 210 және "Кеден органының тауарды жiктеу жөніндегі шешiмiн қабылдау ережесiн және оның нысанын бекiту туралы" Қазақстан Республикасы Қаржы министрлігі Кедендік бақылау комитетінің төрағасы міндетін атқарушының 2005 жылғы 29 қыркүйектегі N 385 бұйрықтарына өзгерістер мен толықтыру енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/37514/rus
