  title:
    rus: О внесении изменений и дополнений в приказ Вице-Министра финансов - Председателя Комитета Таможенного контроля Министерства финансов Республики Казахстан от 29 июня 2005 года № 240 "Об утверждении Правил отнесения участников внешнеэкономической деятельности к категории минимального риска и применения упрощенного порядка таможенного оформления"
    kaz: '"Сыртқы экономикалық қызметке қатысушыларды ең аз тәуекел санатына жатқызу және кедендiк ресiмдеудiң оңайлатылған тәртiбiн қолдану ережесiн бекіту туралы" Қазақстан Республикасы Қаржы вице-министрi - Қаржы министрлiк Кедендiк бақылау комитетi төрағасының 2005 жылғы 29 маусымдағы бұйрығына өзгерiстер мен толықтырулар енгiзу туралы'
