  title:
    rus: О внесении дополнений в приказ Вице-Министра финансов - Председателя Комитета таможенного контроля Министерства финансов Республики Казахстан от 5 мая 2005 года N 167 "О декларировании отдельных категорий товаров в определенных таможенных органах Республики Казахстан"
    kaz: '"Қазақстан Республикасының жекелеген кеден органдарында тауарлардың жекелеген санаттарын декларациялау туралы" Қазақстан Республикасы Қаржы вице-министрі - Қаржы министрлігінің Кедендік бақылау комитеті төрағасының 2005 жылғы 5 мамырдағы N 167 бұйрығына толықтырулар енгізу туралы'
