  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства таможенного контроля Республики Казахстан от 13 мая 2003 года N 199 "Об утверждении Правил применения обеспечения уплаты таможенных платежей и налогов таможенными органами", зарегистрированный за N 2299 и признании утратившими силу некоторых нормативных правовых актов
    kaz: N 2299 тіркелген "Кеден органдарының кедендік төлемдер мен салықтардың төленуін қамтамасыз етуді қолдануы ережесін бекіту туралы" Қазақстан Республикасының Кедендік бақылау агенттігі төрағасының 2003 жылғы 13 мамырдағы N 199 бұйрығына өзгерістер мен толықтырулар енгізу және кейбір нормативтік-құқықтық кесімдердің күші жойылды деп тану туралы
