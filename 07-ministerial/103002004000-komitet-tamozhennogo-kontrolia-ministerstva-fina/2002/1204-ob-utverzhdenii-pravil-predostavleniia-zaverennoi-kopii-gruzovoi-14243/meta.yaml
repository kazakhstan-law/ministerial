  title:
    rus: О внесении дополнения в приказ Председателя Агентства таможенного контроля Республики Казахстан от 4 декабря 2002 года N 133 "Об утверждении Правил предоставления заверенной копии грузовой таможенной декларации", зарегистрированный в Министерстве юстиции Республики Казахстан от 14 января 2003 года N 2118
    kaz: Қазақстан Республикасының Әділет министрлігінде 2003 жылғы 14 қаңтарда N 2118 болып тіркелген "Жүк кедендік декларацияның куәландырылған көшірмесін ұсынудың ережесін бекіту туралы" Қазақстан Республикасының Кедендік бақылау агенттігі төрағасының 2002 жылғы 4 желтоқсандағы N 133 бұйрығына толықтыру енгізу туралы
