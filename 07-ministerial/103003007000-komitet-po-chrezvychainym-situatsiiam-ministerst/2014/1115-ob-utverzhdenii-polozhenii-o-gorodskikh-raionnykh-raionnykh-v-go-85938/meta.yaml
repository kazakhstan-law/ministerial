title:
  rus: Об утверждении положений о городских, районных (районных в городах) управлений, отделов по чрезвычайным ситуациям Комитета по чрезвычайным ситуациям Министерства внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы Ішкі істер министрлігінің Төтенше жағдайлар комитеті қалалық, аудандық (қалалардағы аудандық) төтенше жағдайлар басқармалары мен бөлімдері туралы ережелерді бекіту туралы
