  requisite: Приказ от 26.05.2015 №124, Комитет по чрезвычайным ситуациям Министерства внутренних дел Республики Казахстан. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 июля 2015 года № 11529
  title:
    rus: О внесении изменений и дополнения в приказ Председателя Комитета по чрезвычайным ситуациям Министерства внутренних дел Республики Казахстан от 15 ноября 2014 года № 38 «Об утверждении положений о городских, районных (районных в городах) управлениях, отделах по чрезвычайным ситуациям Комитета по чрезвычайным ситуациям Министерства внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасы Ішкі істер министрлігінің Төтенше жағдайлар комитеті қалалық, аудандық (қалалардағы аудандық) төтенше жағдайлар басқармалары мен бөлімдері туралы ережелерді бекіту туралы» Қазақстан Республикасы Ішкі істер министрлігі Төтенше жағдайлар комитеті төрағасының 2014 жылғы 15 қарашадағы № 38 бұйрығына өзгерістер мен толықтыру енгізу туралы
