requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 30 марта 2010 года № 100-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 апреля 2010 года № 6193. Утратил силу приказом Министра внутренних дел Республики Казахстан от 29 ноября 2010 года № 498.
title:
  rus: Об утверждении образцов удостоверения беженца, проездного документа, свидетельства лица, ищущего убежище, направлений в органы внутренних дел для регистрации лица, ищущего убежище и беженца
  kaz: Босқын куәлігі, жол жүру құжаты, пана іздеген адамның куәлігі, пана іздеген адамды тіркеу үшін ішкі істер органдарына жолдама, босқынды тіркеу үшін ішкі істер органдарына жолдама үлгілерін бекіту туралы
