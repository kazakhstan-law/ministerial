    kaz: «Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігі Халықты әлеуметтік қорғау саласындағы реттеу және бақылау комитетінің кейбір мәселелері туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2022 жылғы 16 маусымдағы № 205 бұйрығына толықтырулар мен өзгерістер енгізу туралы
