  title:
    rus: О внесении изменений в приказ Министра труда и социальной защиты населения Республики Казахстан от 16 июня 2022 года № 205 «О некоторых вопросах Комитета труда и социальной защиты Министерства труда и социальной защиты населения Республики Казахстан»
    kaz: «Еңбек және халықты әлеуметтік қорғау министрлігі Еңбек және әлеуметтік қорғау комитетінің кейбiр мәселелерi туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2022 жылғы 16 маусымдағы № 205 бұйрығына өзгерістер енгізу туралы
