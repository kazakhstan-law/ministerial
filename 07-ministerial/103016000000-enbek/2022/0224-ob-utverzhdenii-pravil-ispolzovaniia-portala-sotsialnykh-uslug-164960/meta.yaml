requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 24 февраля 2022 года № 73. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 февраля 2022 года № 26973. Утратил силу приказом и.о. Министра труда и социальной защиты населения Республики Казахстан от 17 августа 2023 года № 345 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
