  requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 20 января 2023 года № 21. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 января 2023 года № 31750. Утратил силу приказом Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 30 июня 2023 года № 285 (вводится в действие с 1 июля 2023 года)
  title:
    rus: О внесении изменений в приказы исполняющего обязанности Министра труда и социальной защиты населения Республики Казахстан от 16 февраля 2022 года № 60 «Об утверждении Правил допуска поставщиков товаров и (или) услуг на портал социальных услуг, их регистрации или снятия с регистрации на портале социальных услуг» и Министра труда и социальной защиты населения Республики Казахстан от 24 февраля 2022 года № 73» «Об утверждении Правил использования портала социальных услуг»
    kaz: «Тауарларды және (немесе) көрсетілетін қызметтерді берушілерді әлеуметтік көрсетілетін қызметтер порталына жіберу, оларды әлеуметтік көрсетілетін қызметтер порталында тіркеу немесе тіркеуден шығару қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрі міндетін атқарушының 2022 жылғы 16 ақпандағы № 60 бұйрығына және «Әлеуметтік қызметтер порталын пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2022 жылғы 24 ақпандағы № 73 бұйрығына өзгерістер енгізу туралы
