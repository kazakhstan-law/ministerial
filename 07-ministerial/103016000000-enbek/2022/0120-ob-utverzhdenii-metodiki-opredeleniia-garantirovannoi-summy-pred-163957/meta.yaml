requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 20 января 2022 года № 20. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 января 2022 года № 26601. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 2 июня 2023 года № 199 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Методики определения гарантированной суммы, предоставляемой в качестве возмещения стоимости товаров и (или) услуг, приобретаемых лицами с инвалидностью через портал социальных услуг
  kaz: Мүгедектігі бар адамдар әлеуметтік көрсетілетін қызметтер порталы арқылы сатып алатын тауарлардың және (немесе) көрсетілетін қызметтердің құнын өтеу ретінде ұсынылатын кепілдік берілген соманы айқындау әдістемесін бекіту туралы
