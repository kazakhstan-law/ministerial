    kaz: Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің, Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің және Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің міндетін атқарушысының кейбір бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
