requisite: Приказ и.о. Министра труда и социальной защиты населения Республики Казахстан от 16 февраля 2022 года № 60. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 февраля 2022 года № 26834. Утратил силу приказом Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 30 июня 2023 года № 285 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил допуска поставщиков товаров и (или) услуг на портал социальных услуг, их регистрации или снятия с регистрации на портале социальных услуг
  kaz: Тауарларды және (немесе) көрсетілетін қызметтерді берушілерді әлеуметтік көрсетілетін қызметтер порталына жіберу, оларды әлеуметтік көрсетілетін қызметтер порталында тіркеу немесе тіркеуден шығару қағидаларын бекіту туралы
