  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра труда и социальной защиты населения Республики Казахстан от 6 января 2022 года № 1 «Об утверждении Правил возмещения стоимости гарантированного социального пакета из средств государственного бюджета при их реализации получателям государственной адресной социальной помощи через портал социальных услуг»
    kaz: «Мемлекеттік атаулы әлеуметтік көмек алушыларға әлеуметтік қызметтер порталы арқылы кепілдік берілген әлеуметтік топтаманы өткізген кезде оның құнын мемлекеттік бюджет қаражатынан өтеу қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрі міндетін атқарушының 2022 жылғы 6 қаңтардағы № 1 бұйрығына өзгерістер енгізу туралы
