requisite: Приказ и.о. Министра труда и социальной защиты населения Республики Казахстан от 6 января 2022 года № 1. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 января 2022 года № 26492. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 29 декабря 2022 года № 530 (вводится в действие 1 января 2023 года)
title:
  rus: Об утверждении Правил возмещения стоимости гарантированного социального пакета из средств государственного бюджета при их реализации получателям государственной адресной социальной помощи через портал социальных услуг
  kaz: Мемлекеттік атаулы әлеуметтік көмек алушыларға әлеуметтік қызметтер порталы арқылы кепілдік берілген әлеуметтік топтаманы өткізген кезде оның құнын мемлекеттік бюджет қаражатынан өтеу қағидаларын бекіту туралы
