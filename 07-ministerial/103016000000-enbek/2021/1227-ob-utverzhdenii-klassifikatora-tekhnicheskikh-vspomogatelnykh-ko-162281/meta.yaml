title:
  rus: Об утверждении классификатора технических вспомогательных (компенсаторных) средств, специальных средств передвижения и услуг, предоставляемых лицам с инвалидностью
  kaz: Мүгедектігі бар адамдарға ұсынылатын техникалық көмекші (орнын толтырушы) құралдардың, арнаулы жүріп-тұру құралдарының және көрсетілетін қызметтердің сыныптауышын бекіту туралы
