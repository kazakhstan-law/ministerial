  requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 18 января 2005 года № 10-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 марта 2005 г. за № 3473. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 19 апреля 2007 года № 90-п
  title:
    rus: О внесении изменений и дополнения в приказ Министра труда и социальной защиты населения Республики Казахстан от 19 марта 1999 года № 44-п "Об утверждении Инструкции по осуществлению выплаты пенсий за выслугу лет и государственных социальных пособий военнослужащим, сотрудникам органов внутренних дел, Комитета национальной безопасности Республики Казахстан, Республиканской гвардии, Службы охраны Президента Республики Казахстан из Государственного центра по выплате пенсий"
    kaz: '"Әскери қызметшiлерге, iшкi iстер органдары, Қазақстан Республикасының Ұлттық қауiпсiздiк комитетi, Республикалық ұлан, Қазақстан Республикасы Президентiнiң Күзет қызметiнiң қызметкерлерiне Зейнетақы төлеу жөнiндегi мемлекеттік орталықтан еңбек сiңiрген жылдары үшiн зейнетақы және мемлекеттiк әлеуметтiк жәрдемақы төлеудi жүзеге асыру жөнiндегi Нұсқаулықты бекiту туралы" Қазақстан Республикасы Еңбек және халықты әлеуметтiк қорғау Министрiнiң 1999 жылғы 19 наурыздағы N 44-б бұйрығына өзгерiстер мен толықтыру енгiзу туралы'
  link: https://zan.gov.kz/client/#!/doc/24188/rus
