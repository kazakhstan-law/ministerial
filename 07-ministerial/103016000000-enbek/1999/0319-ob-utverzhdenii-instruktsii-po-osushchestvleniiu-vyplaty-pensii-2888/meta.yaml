  title:
    rus: О внесении дополнений и изменений в приказ Министра труда и социальной защиты населения Республики Казахстан от 19 марта 1999 года № 44-п "Об утверждении Инструкции по осуществлению выплаты пенсий за выслугу лет и государственных социальных пособий военнослужащим, сотрудникам органов внутренних дел, Комитета уголовно-исполнительной системы Министерства юстиции Республики Казахстан, органов финансовой полиции и государственной противопожарной службы из Государственного центра по выплате пенсий"
    kaz: '"Әскери қызметшілерге, ішкі істер органдарының, Қазақстан Республикасы Әділет министрлігі Қылмыстық-атқару жүйесі комитетінің, қаржы полициясы мен мемлекеттік өртке қарсы қызмет органдарының қызметшілеріне Зейнетақы төлеу жөніндегі мемлекеттік орталықтан еңбек сіңірген жылдары үшін зейнетақы және мемлекеттік әлеуметтік жәрдемақы төлеуді жүзеге асыру жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 1999 жылғы 19 наурыздағы N 44-ө бұйрығына толықтырулар мен өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/25088/rus
