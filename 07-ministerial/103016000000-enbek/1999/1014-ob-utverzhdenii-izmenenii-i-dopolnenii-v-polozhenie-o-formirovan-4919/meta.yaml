act_code: '4919'
requisite: Приказ Комитета по регулированию деятельности накопительных пенсионных фондов Министерства труда и социальной защиты населения Республики Казахстан от 15 октября 1999 года N 83-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 21.12.99г. N 1005. Утратил силу - постановлением Правления Национального Банка Республики Казахстан от 21 апреля 2003 года N 127 (V032316)
title:
  rus: Об утверждении изменений и дополнений в "Положение о формировании собственного капитала накопительного пенсионного фонда в Республике Казахстан", утвержденное приказом Национального пенсионного агентства от 27 августа 1997 года N 2-П
  kaz: '"Ұлттық зейнетақы агенттiгiнiң 1997 жылғы 27 тамыздағы N 2-Ө бұйрығымен бекiтiлген "Қазақстан Республикасында Жинақтаушы зейнетақы қорының өз капиталын қалыптастыру туралы ережеге" өзгерiстер мен толықтыруларды бекiту туралы"'
