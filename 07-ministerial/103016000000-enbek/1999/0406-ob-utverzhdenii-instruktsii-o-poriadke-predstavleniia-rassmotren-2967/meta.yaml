title:
  rus: Об утверждении Инструкции о порядке представления, рассмотрения и согласования нормативных материалов по нормированию и оплате труда для субъектов, на продукцию (услуги, работы) которых вводится государственное регулирование цен (тарифов)
  kaz: Өнімдеріне (қызмет көрсетулеріне, жұмысына) бағаларды (тарифтерді) мемлекеттік реттеу енгізілетін субъектілер үшін еңбекті нормалау және оған ақы төлеу жөніндегі нормативтік материалдарды ұсынудың, қараудың және келісудің тәртібі туралы Нұсқаулықты бекіту туралы
