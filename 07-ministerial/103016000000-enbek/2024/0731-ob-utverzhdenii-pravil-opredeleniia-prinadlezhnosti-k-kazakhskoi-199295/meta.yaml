act_code: '199295'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 31 июля 2024 года № 282. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 июля 2024 года № 34845
title:
  rus: Об утверждении Правил определения принадлежности к казахской национальности лиц, претендующих на получение статуса кандаса и гражданства Республики Казахстан в упрощенном (регистрационном) порядке, в случае отсутствия соответствующей записи в документах, удостоверяющих личность, а также в других документах, подтверждающих национальность претендентов
  kaz: Жеке басын куәландыратын құжаттарда, сондай-ақ үміткерлердің ұлтын растайтын басқа да құжаттарда тиісті жазба болмаған жағдайда, қандас мәртебесін және жеңілдетілген тәртіппен (тіркеу тәртібімен) Қазақстан Республикасының азаматтығын алуға үміткер адамдардың ұлты қазақ екенін айқындау қағидаларын бекіту туралы
