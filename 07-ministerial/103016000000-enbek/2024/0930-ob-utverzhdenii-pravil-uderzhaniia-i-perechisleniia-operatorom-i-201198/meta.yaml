act_code: '201198'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 30 сентября 2024 года № 392. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 сентября 2024 года № 35173
title:
  rus: Об утверждении Правил удержания и перечисления оператором интернет-платформы индивидуального подоходного налога, обязательных пенсионных взносов, обязательных пенсионных взносов работодателя, социальных отчислений и взносов на обязательное социальное медицинское страхование, а также правила и случаи распределения и перечисления сумм, уплаченных оператором интернет-платформы в Государственный фонд социального страхования, социального медицинского страхования, единый накопительный пенсионный фонд, и правила возврата плательщику единого платежа, оператору интернет-платформы суммы, превышающей размеры взносов и отчислений в Государственный фонд социального страхования, социального медицинского страхования, единый накопительный пенсионный фонд
  kaz: Интернет-платформа операторының жеке табыс салығын, міндетті зейнетақы жарналарын, жұмыс берушінің міндетті зейнетақы жарналарын, әлеуметтік аударымдар мен міндетті әлеуметтік медициналық сақтандыру жарналарын ұстап қалу және аудару қағидалары, сондай-ақ интернет-платформа операторы төлеген сомаларды Мемлекеттік әлеуметтік сақтандыру қорына, Әлеуметтік медициналық сақтандыру қорына, Бірыңғай жинақтаушы зейнетақы қорына бөлу және аудару қағидалары мен талаптары, сондай-ақ Мемлекеттік әлеуметтік сақтандыру қорына, Әлеуметтік медициналық сақтандыру қорына, Бірыңғай жинақтаушы зейнетақы қорына және төлеушінің орналасқан жері бойынша тиісті бюджетке аударымдар мен жарналардың мөлшерінен асатын төлем сомасын бірыңғай төлемді төлеушіге, интернет-платформа операторына қайтару қағидаларын бекіту туралы
