  title:
    rus: О внесении изменений в приказ Министра труда и социальной защиты населения Республики Казахстан от 30 сентября 2024 года № 392 «Об утверждении Правил определения исполнителем ставок социальных отчислений, обязательных пенсионных взносов, взносов на обязательное социальное медицинское страхование, удержания и перечисления оператором интернет-платформы индивидуального подоходного налога, обязательных пенсионных взносов, социальных отчислений и взносов на обязательное социальное медицинское страхование, а также распределения и перечисления сумм, уплаченных оператором интернет-платформы, возврата ошибочно (излишне) уплаченных сумм социальных отчислений, обязательных пенсионных взносов, взносов на обязательное социальное медицинское страхование и (или) пени за их несвоевременную и (или) неполную уплату оператору интернет-платформы»
    kaz: «Орындаушының әлеуметтік аударымдардың, міндетті зейнетақы жарналардың, міндетті әлеуметтік медициналық сақтандыруға жарналардың мөлшерлемелерін айқындауы, интернет-платформа операторының жеке табыс салығын, міндетті зейнетақы жарналарын, әлеуметтік аударымдарды және міндетті әлеуметтік медициналық сақтандыруға жарналарды ұстап қалуы және аударуы, сондай-ақ интернет-платформа операторы төлеген сомаларды бөлу және аудару, қате (артық) төленген әлеуметтік аударымдардың, міндетті зейнетақы жарналарының, міндетті әлеуметтік медициналық сақтандыруға жарналардың сомаларын және (немесе) интернет-платформа операторына уақтылы және (немесе) толық төлемегені үшін өсімпұлдарды қайтару қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2024 жылғы 30 қыркүйектегі № 392 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/215714/rus
