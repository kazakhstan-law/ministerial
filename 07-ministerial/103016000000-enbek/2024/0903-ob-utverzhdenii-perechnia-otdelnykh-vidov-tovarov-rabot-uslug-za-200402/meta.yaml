  title:
    rus: О внесении изменения в приказ Министра труда и социальной защиты населения Республики Казахстан от 3 сентября 2024 года № 345 «Об утверждении перечня отдельных видов товаров, работ, услуг, закупаемых у общественных объединений лиц с инвалидностью Республики Казахстан и (или) организаций, созданных общественными объединениями лиц с инвалидностью Республики Казахстан, производящих и (или) поставляющих товары, выполняющих работы, оказывающих услуги»
    kaz: «Тауарларды өндіретін және (немесе) беретін, жұмыстарды орындайтын, қызметтерді көрсететін Қазақстан Республикасының мүгедектігі бар адамдар қоғамдық бірлестіктері және (немесе) Қазақстан Республикасының мүгедектігі бар адамдар қоғамдық бірлестіктері құрған ұйымдардан сатып алынатын тауарлардың, жұмыстардың, көрсетілетін қызметтердің жекелеген түрлерінің тізбесін бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің  2024 жылғы 3 қыркүйектегі № 345 бұйрығына өзгеріс енгізу туралы
