title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача разрешения по распоряжению имуществом, снятию пенсий, пособий, социальных выплат, поступивших на счет недееспособного или ограниченно дееспособного совершеннолетнего лица, и на отчуждение имущества граждан, признанных по решению суда недееспособными или ограниченно дееспособными»
  kaz: «Әрекетке қабілетсіз немесе әрекет қабілеті шектеулі кәмелетке толған адамның мүлкіне билік ету, шотына түскен зейнетақыларды, жәрдемақыларды, әлеуметтік төлемдерді алу бойынша және соттың шешімімен әрекетке қабілетсіз немесе әрекет қабілеті шектеулі деп танылған азаматтардың мүлкін иеліктен шығаруға рұқсат беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы
