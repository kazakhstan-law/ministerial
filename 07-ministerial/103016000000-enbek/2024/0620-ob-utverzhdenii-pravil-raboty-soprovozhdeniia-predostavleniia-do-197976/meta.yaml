    kaz: «Электрондық еңбек биржасы» жұмыспен қамтудың бірыңғай цифрлық платформасы мен «Еңбек нарығы» автоматтандырылған ақпараттық жүйесінің арасындағы жұмыс, сүйемелдеу, қолжетімділікті ұсыну және ақпараттық өзара іс-қимылды қамтамасыз ету қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2024 жылғы 20 маусымдағы № 206 бұйрығына өзгерістер енгізу туралы
