title:
  rus: Об утверждении Правил работы, сопровождения, предоставления доступа и обеспечения информационного взаимодействия между единой цифровой платформой занятости «Электронная биржа труда» и автоматизированной информационной системы «Рынок труда»
  kaz: «Электрондық еңбек биржасы» жұмыспен қамтудың бірыңғай цифрлық платформасы мен «Еңбек нарығы» автоматтандырылған ақпараттық жүйесінің арасындағы жұмыс, сүйемелдеу, қолжетімділікті ұсыну және ақпараттық өзара іс-қимылды қамтамасыз ету қағидаларын бекіту туралы
