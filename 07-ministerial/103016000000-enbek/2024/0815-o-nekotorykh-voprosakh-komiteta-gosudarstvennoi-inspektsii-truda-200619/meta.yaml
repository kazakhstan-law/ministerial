  title:
    rus: О внесении дополнений в приказ Министра труда и социальной защиты населения Республики Казахстан от 15 августа 2024 года № 317 «О некоторых вопросах Комитета государственной инспекции труда Министерства труда и социальной защиты населения Республики Казахстан»
    kaz: «Қазақстан Республикасының Еңбек және халықты әлеуметтік қорғау министрлігі Мемлекеттік еңбек инспекциясы комитетінің кейбір мәселелері туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2024 жылғы 15 тамыздағы № 317 бұйрығына толықтырулар енгізу туралы
