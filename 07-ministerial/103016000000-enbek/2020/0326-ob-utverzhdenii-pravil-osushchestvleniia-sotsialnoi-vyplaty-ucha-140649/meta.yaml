act_code: '140649'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 26 марта 2020 года № 110. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 марта 2020 года № 20174
title:
  rus: Об утверждении Правил осуществления социальной выплаты участникам системы обязательного социального страхования и физическим лицам, получающим доходы по договорам гражданско-правового характера, предметом которых является выполнение работ (оказание услуг), за которых налоговыми агентами уплачены обязательные пенсионные взносы на период чрезвычайного положения
  kaz: Төтенше жағдай кезеңінде міндетті әлеуметтік сақтандыру жүйесіне қатысушыларға және нысанасы жұмыстарды орындау (қызметтерді көрсету) болып табылатын азаматтық-құқықтық сипаттағы шарттар бойынша кіріс алатын, салық агенттері олар үшін міндетті зейнетақы жарналарын төлеген жеке тұлғаларға әлеуметтік төлемдерді жүзеге асыру қағидаларын бекіту туралы
