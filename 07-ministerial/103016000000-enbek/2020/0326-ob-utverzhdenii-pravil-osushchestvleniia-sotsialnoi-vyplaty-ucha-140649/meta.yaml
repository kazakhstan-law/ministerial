  title:
    rus: О внесении изменений и дополнений в приказ Министра труда и социальной защиты населения Республики Казахстан от 26 марта 2020 года № 110 «Об утверждении Правил осуществления социальной выплаты участникам системы обязательного социального страхования и физическим лицам, получающим доходы по договорам гражданско-правового характера, предметом которых является выполнение работ (оказание услуг), за которых налоговыми агентами уплачены обязательные пенсионные взносы на период чрезвычайного положения»
    kaz: «Төтенше жағдай кезеңінде міндетті әлеуметтік сақтандыру жүйесіне қатысушыларға және нысанасы жұмыстарды орындау (қызметтерді көрсету) болып табылатын азаматтық-құқықтық сипаттағы шарттар бойынша кіріс алатын, салық агенттері олар үшін міндетті зейнетақы жарналарын төлеген жеке тұлғаларға әлеуметтік төлемдерді жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2020 жылғы 26 наурыздағы № 110 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/143077/rus
