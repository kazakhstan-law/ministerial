  title:
    rus: О внесении изменения в приказ Министра труда и социальной защиты населения Республики Казахстан от 25 марта 2020 года № 109 «О некоторых вопросах оказания государственных услуг в социально-трудовой сфере и обеспечения продуктово-бытовым набором некоторых категорий населения на период чрезвычайного положения»
    kaz: «Төтенше жағдай кезеңінде әлеуметтік-еңбек саласында мемлекеттік қызметтер көрсетудің және халықтың жекелеген санаттарын азық-түлік және тұрмыстық жиынтығымен қамтамасыз етудің кейбір мәселелері туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2020 жылғы 25 наурыздағы № 109 бұйрығына өзгеріс енгiзу туралы
