    kaz: «Мүгедектерге тауарлар мен қызметтерді әлеуметтік қызметтер порталы арқылы сатқан кезде олардың құнын мемлекеттік бюджет қаражатынан өтеу қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2020 жылғы 20 қаңтардағы № 14 бұйрығына өзгерістер енгізу туралы
