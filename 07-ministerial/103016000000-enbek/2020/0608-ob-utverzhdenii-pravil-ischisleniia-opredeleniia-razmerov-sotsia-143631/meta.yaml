caused_by:
  code: '164238'
  requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 31 января 2022 года № 36. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 февраля 2022 года № 26702
  title:
    rus: О внесении изменений и дополнений в приказ Министра труда и социальной защиты населения Республики Казахстан от 8 июня 2020 года № 217 «Об утверждении Правил исчисления (определения) размеров социальных выплат, назначения, перерасчета, приостановления, возобновления, прекращения и осуществления социальных выплат из Государственного фонда социального страхования» и в приказ Министра труда и социальной защиты населения Республики Казахстан от 11 июня 2020 года № 224 «О некоторых вопросах системы социального страхования и оказания государственных услуг в социально-трудовой сфере»
    kaz: «Әлеуметтік төлемдердің мөлшерлерін есептеу (айқындау), Мемлекеттік әлеуметтік сақтандыру қорынан төленетін әлеуметтік төлемдерді тағайындау, қайта есептеу, тоқтата тұру, қайта бастау, тоқтату және жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2020 жылғы 8 маусымдағы № 217 бұйрығы мен «Міндетті әлеуметтік сақтандыру жүйесінің және әлеуметтік-еңбек саласында мемлекеттік қызметтер көрсетудің кейбір мәселелері туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2020 жылғы 11 маусымдағы № 224 бұйрығына өзгерістер мен толықтырулар енгізу туралы
