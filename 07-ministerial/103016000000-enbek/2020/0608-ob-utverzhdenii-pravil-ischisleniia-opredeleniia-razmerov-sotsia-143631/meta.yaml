  title:
    rus: О внесении изменений и дополнения в приказ Министра труда и социальной защиты населения Республики Казахстан от 8 июня 2020 года № 217 «Об утверждении Правил исчисления (определения) размеров социальных выплат, назначения, перерасчета, приостановления, возобновления, прекращения и осуществления социальных выплат из Государственного фонда социального страхования»
    kaz: «Әлеуметтік төлемдердің мөлшерлерін есептеу (айқындау), Мемлекеттік әлеуметтік сақтандыру қорынан төленетін әлеуметтік төлемдерді тағайындау, қайта есептеу, тоқтата тұру, қайта бастау, тоқтату және жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2020 жылғы 8 маусымдағы № 217 бұйрығына өзгерістер мен толықтыру енгізу туралы
