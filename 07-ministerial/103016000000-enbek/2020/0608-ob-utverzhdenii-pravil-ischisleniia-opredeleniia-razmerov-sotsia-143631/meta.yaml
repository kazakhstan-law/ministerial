caused_by:
  code: '153998'
  requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 30 марта 2021 года № 94. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 марта 2021 года № 22440
  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 14 апреля 2015 года № 223 «Об утверждении Правил предоставления государственной базовой пенсионной выплаты за счет бюджетных средств, а также назначения и осуществления пенсионных выплат по возрасту, государственных социальных пособий по инвалидности, по случаю потери кормильца, государственных специальных пособий» и приказ Министра труда и социальной защиты населения Республики Казахстан от 8 июня 2020 года № 217 «Об утверждении Правил исчисления (определения) размеров социальных выплат, назначения, перерасчета, приостановления, возобновления, прекращения и осуществления социальных выплат из Государственного фонда социального страхования»
    kaz: «Мемлекеттiк базалық зейнетақы төлемiн бюджет қаражаты есебiнен беру, сондай-ақ жасына байланысты зейнетақы төлемдерін, мүгедектігі бойынша, асыраушысынан айрылу жағдайы бойынша берілетін мемлекеттік әлеуметтік жәрдемақыларды, мемлекеттік арнайы жәрдемақыларды тағайындау және жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 14 сәуірдегі № 223 бұйрығы мен «Әлеуметтік төлемдердің мөлшерлерін есептеу (айқындау), Мемлекеттік әлеуметтік сақтандыру қорынан төленетін әлеуметтік төлемдерді тағайындау, қайта есептеу, тоқтата тұру, қайта бастау, тоқтату және жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2020 жылғы 8 маусымдағы № 217 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/153998/rus
