caused_by:
  code: '176587'
  requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 28 декабря 2022 года № 528. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 декабря 2022 года № 31443
  title:
    rus: О внесении изменений и дополнений в приказ Министра труда и социальной защиты населения Республики Казахстан от 8 июня 2020 года № 217 «Об утверждении Правил исчисления (определения) размеров социальных выплат, назначения, перерасчета, приостановления, возобновления, прекращения и осуществления социальных выплат из Государственного фонда социального страхования» и в приказ Министра здравоохранения и социального развития Республики Казахстан от 18 декабря 2014 года № 330 «Об утверждении Правил субсидирования обязательных пенсионных взносов получателям социальных выплат на случай потери дохода в связи с уходом за ребенком по достижении им возраста одного года из Государственного фонда социального страхования»
    kaz: «Әлеуметтік төлемдердің мөлшерлерін есептеу (айқындау), Мемлекеттік әлеуметтік сақтандыру қорынан төленетін әлеуметтік төлемдерді тағайындау, қайта есептеу, тоқтата тұру, қайта бастау, тоқтату және жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2020 жылғы 8 маусымдағы № 217 бұйрығына және «Мемлекеттік әлеуметтік сақтандыру қорынан бала бір жасқа толғанға дейін оның күтіміне байланысты табысынан айрылған жағдайда төленетін әлеуметтiк төлемдерді алушыларға міндетті зейнетақы жарналарын субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2014 жылғы 18 желтоқсандағы № 330 бұйрығына өзгерістер мен толықтырулар енгізу туралы
