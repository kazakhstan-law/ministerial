act_code: '143631'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 8 июня 2020 года № 217. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 июня 2020 года № 20838. Утратил силу приказом Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 22 июня 2023 года № 237 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил исчисления (определения) размеров социальных выплат, назначения, перерасчета, приостановления, возобновления, прекращения и осуществления социальных выплат из Государственного фонда социального страхования
  kaz: Әлеуметтік төлемдердің мөлшерлерін есептеу (айқындау), Мемлекеттік әлеуметтік сақтандыру қорынан төленетін әлеуметтік төлемдерді тағайындау, қайта есептеу, тоқтата тұру, қайта бастау, тоқтату және жүзеге асыру қағидаларын бекіту туралы
