act_code: '138828'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 20 января 2020 года № 15. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 января 2020 года № 19900. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 20 января 2022 года № 20 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Правил расчета размера гарантированной суммы, предоставляемой в качестве возмещения стоимости санаторно-курортного лечения, протезно-ортопедической помощи, технических вспомогательных (компенсаторных) средств, специальных средств передвижения, приобретаемых через портал социальных услуг
  kaz: Әлеуметтік қызметтер порталы арқылы сатып алынатын санаториялық-курорттық емдеудің, протездік-ортопедиялық көмектің, техникалық көмекші (орнын толтырушы) құралдардың, арнаулы жүріп-тұру құралдарының құнын өтеу ретінде ұсынылатын кепілдендірілген соманың мөлшерін есептеу қағидаларын бекіту туралы
