act_code: '34899'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 19 июля 2007 года N 165-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 августа 2007 года N 4886. Утратил силу приказом Министра здравоохранения и социального развития Республики Казахстан от 21 декабря 2015 года № 982
title:
  rus: Об утверждении Правил разработки, апробации, пересмотра, утверждения и применения Единого тарифно-квалификационного справочника работ и профессий рабочих, тарифно-квалификационных характеристик профессий рабочих, Квалификационного справочника должностей руководителей, специалистов и других служащих, а также типовых квалификационных характеристик должностей руководителей, специалистов и других служащих организаций
  kaz: Жұмысшылардың жұмыстары мен кәсіптерінің бірыңғай тарифтік-біліктілік анықтамалығын, жұмысшы кәсіптерінің тарифтік-біліктілік сипаттамаларын және Басшылардың, мамандардың және басқа да Қызметшілер лауазымдарының біліктілік анықтамалығын, сондай-ақ ұйымдар басшыларының, мамандарының және басқа да қызметшілері лауазымдарының үлгілік біліктілік сипаттамаларын әзірлеу, сынақтау, қайта қарау, бекіту және қолдану ережесін бекіту туралы
