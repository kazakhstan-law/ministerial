  kaz: Жасы он сегізге толмаған қызметкерлердің еңбегін пайдалануға тыйым салынатын жұмыстардың тізімін, жасы он сегізге толмаған қызметкерлер тасымалдайтын және қозғайтын ауырлықтың шекті нормаларын бекіту туралы
