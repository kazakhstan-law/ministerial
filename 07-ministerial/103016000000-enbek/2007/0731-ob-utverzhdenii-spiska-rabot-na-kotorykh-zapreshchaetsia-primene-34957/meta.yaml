requisite: Приказ и.о. Министра труда и социальной защиты населения Республики Казахстан от 31 июля 2007 года № 185-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 сентября 2007 года № 4912. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 25 ноября 2011 года № 418-ө
title:
