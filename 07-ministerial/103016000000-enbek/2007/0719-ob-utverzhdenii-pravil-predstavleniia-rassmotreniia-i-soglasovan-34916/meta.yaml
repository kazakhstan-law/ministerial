requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 19 июля 2007 года N 167-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 августа 2007 года N 4889. Утратил силу приказом Министра здравоохранения и социального развития Республики Казахстан от 15 декабря 2015 года № 971
title:
  rus: Об утверждении Правил представления, рассмотрения и согласования норм труда и (или) параметров по системе оплаты труда работников организаций, на услуги (товары, работы) которых вводится государственное регулирование тарифов (цен, ставок сборов)
  kaz: Көрсетілетін қызметтеріне (тауарларына, жұмыстарына) тарифтерді (бағаларды, алым мөлшерлемелерін) мемлекеттік реттеу енгізілетін ұйымдар қызметкерлерінің еңбек нормаларын және (немесе) еңбегіне ақы төлеу жүйесі бойынша параметрлерін ұсыну, қарау және келісу қағидаларын бекіту туралы
