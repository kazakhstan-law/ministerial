  title:
    rus: О внесении дополнений и изменений в приказы Министра труда и социальной защиты населения Республики Казахстан от 19 июля 2007 года № 166-п "Об утверждении Правил утверждения, замены и пересмотра типовых норм и нормативов по труду государственными органами соответствующих сфер деятельности" и от 19 июля 2007 года № 167-п "Об утверждении Правил представления, рассмотрения и согласования норм труда и параметров по системе оплаты труда работников организаций, на услуги (товары, работы) которых вводится государственное регулирование тарифов (цен, ставок сборов)"
    kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің "Тиісті қызмет салаларының мемлекеттік органдарының еңбек жөніндегі үлгі нормалар мен нормативтерді бекіту, ауыстыру және қайта қарау ережесін бекіту туралы" 2007 жылғы 19 шілдедегі № 166-ө және "Қызметтеріне (тауарларына, жұмыстарына) тарифтерді (бағаларды, алым ставкаларын) мемлекеттік реттеу енгізілетін ұйымдар қызметкерлерінің еңбек нормаларын және (немесе) еңбекақы жүйесі жөніндегі параметрлерін ұсыну, қарау және келісу ережесін бекіту туралы" 2007 жылғы 19 шілдедегі № 167-ө бұйрықтарына толықтырулар мен өзгерістер енгізу туралы
