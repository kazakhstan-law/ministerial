act_code: '34901'
requisite: Приказ и.о. Министра труда и социальной защиты населения Республики Казахстан от 31 июля 2007 года № 182-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 августа 2007 года № 4888. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 23 июля 2019 года № 373 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Списка производств, цехов, профессий и должностей, перечня тяжелых работ, работ с вредными (особо вредными) и (или) опасными условиями труда, работа в которых дает право на сокращенную продолжительность рабочего времени, дополнительный оплачиваемый ежегодный трудовой отпуск и на повышенный размер оплаты труда, а также Правил предоставления сокращенной продолжительности рабочего времени, дополнительного оплачиваемого ежегодного трудового отпуска и повышенного размера оплаты труда
  kaz: Жұмыс уақытының қысқартылған ұзақтығына, жыл сайынғы ақылы қосымша еңбек демалысына және еңбекақының жоғары мөлшеріне құқық беретін өндірістердің, цехтардың, кәсіптер мен лауазымдардың тізімін, ауыр жұмыстардың, еңбек жағдайлары зиянды (ерекше зиянды) және (немесе) қауіпті жұмыстардың тізбесін, сондай-ақ Жұмыс уақытының қысқартылған ұзақтығын, жыл сайынғы ақылы қосымша еңбек демалысын және еңбекақының жоғары мөлшерін беру қағидаларын бекіту туралы
