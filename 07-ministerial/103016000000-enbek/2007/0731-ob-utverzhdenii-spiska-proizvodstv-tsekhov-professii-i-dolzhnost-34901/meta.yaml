  title:
    rus: О внесении изменений и дополнений в приказ и.о. Министра труда и социальной защиты населения Республики Казахстан от 31 июля 2007 года № 182-п "Об утверждении Списка производств, цехов, профессий и должностей, перечня тяжелых работ, работ с вредными (особо вредными) и (или) опасными условиями труда, работа в которых дает право на сокращенную продолжительность рабочего времени и на дополнительный оплачиваемый ежегодный трудовой отпуск и Инструкции по его применению"
    kaz: '"Жұмыс уақытының қысқартылған ұзақтығына және жыл сайынғы ақылы қосымша еңбек демалысына құқық беретін өндірістердің, цехтардың, кәсіптер мен лауазымдардың тізімін, ауыр жұмыстардың, еңбек жағдайлары зиянды (ерекше зиянды) және (немесе) қауіпті жұмыстардың тізбесін және оны қолдану жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрі міндетін атқарушының 2007 жылғы 31 шілдедегі N 182-ө бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/42013/rus
