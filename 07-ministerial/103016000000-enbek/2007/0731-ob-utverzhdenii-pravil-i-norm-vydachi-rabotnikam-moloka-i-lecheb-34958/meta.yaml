act_code: '34958'
requisite: Приказ и.о. Министра труда и социальной защиты населения Республики Казахстан от 31 июля 2007 года № 184-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 сентября 2007 года № 4913. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 14 мая 2012 года № 184-ө-м
title:
  rus: Об утверждении Правил и норм выдачи работникам молока и лечебно-профилактического питания, за счет средств работодателя и Правил обеспечения работников специальной одеждой, специальной обувью и другими средствами индивидуальной и коллективной защиты, санитарно-бытовыми помещениями и устройствами, за счет средств работодателя
  kaz: Жұмыс берушінің қаражаты есебінен қызметкерлерге сүт және емдеу-алдын-алу тағамдарын беру нормалары мен ережесін және Жұмыс берушінің қаражаты есебінен қызметкерлерді арнайы киіммен, арнайы аяқ киіммен және басқа да жеке және ұжымдық қорғану құралдарымен, санитарлық-тұрмыстық үй-жайлармен, құрылғылармен қамтамасыз ету ережесін бекіту туралы
