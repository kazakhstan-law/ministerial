  title:
    rus: '"О внесении изменений и дополнений в приказ и.о. Министра труда и социальной защиты населения Республики Казахстан от 31 июля 2007 года N 184-п "Об утверждении Правил и норм выдачи молока и лечебно-профилактического питания, за счет средств работодателя и Правил обеспечения работников специальной одеждой, специальной обувью и другими средствами индивидуальной и коллективной защиты, санитарно-бытовыми помещениями и устройствами, за счет средств работодателя"'
    kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрі міндетін атқарушының 2007 жылғы 31 шілдедегі "Жұмыс берушінің қаражаты есебінен қызметкерлерге сүт және емдеу-алдын-алу тағамдарын беру нормалары мен ережесін және Жұмыс берушінің қаражаты есебінен қызметкерлерді арнайы киіммен, арнайы аяқ киіммен және басқа да жеке және ұжымдық қорғану құралдарымен, санитарлық-тұрмыстық үй-жайлармен және құрылғылармен қамтамасыз ету ережесін бекіту туралы" N 184-ө бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/36611/rus
