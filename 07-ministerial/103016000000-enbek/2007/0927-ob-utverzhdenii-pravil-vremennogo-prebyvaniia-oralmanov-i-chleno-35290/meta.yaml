  requisite: Приказ и.о. Министра труда и социальной защиты населения Республики Казахстан от 12 августа 2010 года № 275-ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 сентяря 2010 года № 6456. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 12 февраля 2014 года № 35-Ө
  title:
    rus: О внесении дополнений и изменений в приказы и.о. Министра труда и социальной защиты населения Республики Казахстан от 27 сентября 2007 года № 223-п "Об утверждении Правил пребывания лиц и членов их семей, ходатайствующих о признании их оралманами, в Центре временного размещения" и от 27 сентября 2007 года № 225-п "Об утверждении Правил временного пребывания оралманов и членов их семей в центре адаптации и интеграции оралманов и оказания им адаптационных услуг"
    kaz: '"Өздерін оралман деп тануға ұсынған адамдар мен олардың отбасы мүшелерінің уақытша орналастыру орталығында болу Ережесін бекіту туралы" 2007 жылғы 27 қыркүйектегі 1223-ө және "Оралмандар мен олардың отбасы мүшелерінің оралмандарды бейімдеу және кіріктіру орталығында уақытша болуы және оларға бейімдеу қызметтерін көрсету ережесін бекіту туралы" Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрі міндетін атқарушының 2007 жылғы 27 қыркүйектегі № 225-ө бұйрықтарына толықтырулар мен өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/54450/rus
