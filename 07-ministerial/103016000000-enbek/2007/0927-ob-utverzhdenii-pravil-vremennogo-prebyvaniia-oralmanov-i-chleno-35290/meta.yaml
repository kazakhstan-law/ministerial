requisite: Приказ и.о. Министра труда и социальной защиты населения Республики Казахстан от 27 сентября 2007 года N 225-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 октября 2007 года N 4965. Утратил силу приказом Министра внутренних дел Республики Казахстан oт 30 марта 2011 года № 135
title:
  rus: Об утверждении Правил временного пребывания оралманов и членов их семей в центре адаптации и интеграции оралманов и оказания им адаптационных услуг
  kaz: Оралмандар мен олардың отбасы мүшелерінің оралмандарды бейімдеу және кіріктіру орталығында уақытша болуы және оларға бейімдеу қызметтерін көрсету ережесін бекіту туралы
