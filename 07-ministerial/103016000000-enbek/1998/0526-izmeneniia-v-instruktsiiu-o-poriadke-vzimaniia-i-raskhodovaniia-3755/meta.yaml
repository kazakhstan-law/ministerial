act_code: '3755'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 27 мая 1998г. N 120-П. Зарегистрирован в Министерстве юстиции РК 29.06.1998 г. N 89. Утратил силу - приказом Министра труда и социальной защиты населения Республики Казахстан от 4 ноября 2004 г. N 256-п
title:
  rus: Изменения в Инструкцию "О порядке взимания и расходования компенсационных выплат за замещение рабочих мест иностранными специалистами и рабочими, аккумулирования и использования экономического сбора и залоговых взносов, взимаемых за ввозимую и вывозимую рабочую силу", зарегистрированную в Министерстве юстиции Республики Казахстан 7 августа 1997 года за N 348
  kaz: Шетелдік мамандар мен жұмысшылардың жұмыс орындарын уақытша алғандығы үшін өтемақылық төлемдерді өндіріп алудың және оны жұмсаудың, Қазақстан Республикасына әкелінетін және әкелінетін жұмыс күші үшін кепілдеме және кепіл жарналарын шоғырландырудың және экономикалық алымдар мен кепіл жарналарды пайдаланудың тәртібі жөніндегі Қазақстан Республикасының Әділет министрлігінде 1997 жылдың 7 тамызында N 348 Нұсқаулығына тіркелген өзгерістер
