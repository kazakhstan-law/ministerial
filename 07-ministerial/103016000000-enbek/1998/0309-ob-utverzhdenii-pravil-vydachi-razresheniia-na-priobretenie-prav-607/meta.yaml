caused_by:
  code: '23005'
  requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 27 декабря 2004 года N 376. Зарегистрировано Министерством юстиции Республики Казахстан 7 февраля 2005 года N 3427. Утратило силу - постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года N 58
  title:
    rus: О внесении изменений и дополнений в приказ Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 9 марта 1998 года № 31-П "Об утверждении Положения "О порядке предоставления разрешения на осуществление права прямого или косвенного владения, распоряжения и/или управления более чем 25 процентами акций с правом голоса открытого накопительного пенсионного фонда в период его деятельности"
    kaz: Қазақстан Республикасының Еңбек және халықты әлеуметтік қорғау министрлігі Ұлттық зейнетақы агенттігінің "Ашық жинақтаушы зейнетақы қорының дауыс беру құқығы бар акцияларының 25 процентінен көбіне тікелей немесе жанама иелік ету, билік жүргізу және/немесе басқару құқығын жүзеге асыруға рұқсат беру тәртібі туралы" Ережені бекіту туралы" 1998 жылғы 9-наурыздағы N 31-П бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/23005/rus
