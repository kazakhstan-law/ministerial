act_code: '607'
requisite: Приказ Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 9 марта 1998 года № 31-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 марта 1998 года № 484. Утратил силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 25 февраля 2006 года № 58
title:
  rus: Об утверждении Правил выдачи разрешения на приобретение права прямого или косвенного владения, распоряжения и/или управления более чем 25 процентами акций с правом голоса открытого накопительного пенсионного фонда в период его деятельности"
  kaz: Ашық жинақтаушы зейнетақы қорының дауыс беру құқығы бар акцияларының 25 процентінен көбіне тікелей немесе жанама иелік ету, билік жүргізу және/немесе басқару құқығын Сатып алуға рұқсат беру ережесі
