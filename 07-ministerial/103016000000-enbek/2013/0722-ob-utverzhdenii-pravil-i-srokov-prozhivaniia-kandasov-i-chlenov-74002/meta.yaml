title:
  rus: Об утверждении Правил и сроков проживания кандасов и членов их семей в Центре адаптации и интеграции кандасов, а также Правил оказания кандасам и членам их семей адаптационных и интеграционных услуг
  kaz: Қандастар мен олардың отбасы мүшелерінің Қандастарды бейімдеу және ықпалдастыру орталығында тұру мерзімдері мен қағидаларын, сондай-ақ қандастар мен олардың отбасы мүшелеріне бейімдеу және ықпалдастыру қызметтерін көрсету қағидаларын бекіту туралы
