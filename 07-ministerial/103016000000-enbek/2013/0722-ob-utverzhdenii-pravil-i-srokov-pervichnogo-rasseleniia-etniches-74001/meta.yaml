  title:
    rus: О внесении изменений и дополнений в некоторые приказы Министра труда и социальной защиты населения Республики Казахстан и Министра здравоохранения и социального развития Республики Казахстан
    kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің және Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму Министрінің кейбір бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
