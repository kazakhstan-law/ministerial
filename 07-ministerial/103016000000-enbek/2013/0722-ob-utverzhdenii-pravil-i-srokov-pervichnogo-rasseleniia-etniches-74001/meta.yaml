act_code: '74001'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 22 июля 2013 года № 328-Ө-М. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 августа 2013 года № 8599
title:
  rus: Об утверждении Правил и сроков первичного расселения этнических казахов и членов их семей, по их желанию, до присвоения статуса кандаса, а также внутренних мигрантов в случае переселения в рамках региональной квоты приема переселенцев в центрах временного размещения
  kaz: Этникалық қазақтарды және олардың отбасы мүшелерін қандас мәртебесін алғанға дейін олардың қалауы бойынша, сондай-ақ қоныс аударушыларды қабылдаудың өңірлік квотасы шеңберінде ішкі қоныс аударушылар қоныс аударған жағдайда уақытша орналастыру орталықтарына алғашқы қоныстандыру қағидалары мен мерзімдерін бекіту туралы
