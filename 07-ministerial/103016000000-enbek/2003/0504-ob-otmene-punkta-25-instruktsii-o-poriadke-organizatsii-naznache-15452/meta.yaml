act_code: '15452'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 5 мая 2003 года № 92-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 мая 2003 года № 2284. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 29 декабря 2006 года № 311-п
title:
  rus: Об отмене пункта 25 Инструкции о порядке организации назначения и выплаты пенсионных выплат, государственных социальных пособий и государственных специальных пособий из Центра, утвержденной приказом Министра труда и социальной защиты населения Республики Казахстан от 25 марта 2001 года № 17-п, зарегистрированного в Министерстве юстиции Республики Казахстан 26 марта 2001 года за № 1432
  kaz: Қазақстан Республикасының Еңбек және халықты әлеуметтік қорғау министрінің 2001 жылғы 25 наурыздағы № 17-ө бұйрығымен бекітілген Қазақстан Республикасының Әділет министрлігінде 2001 жылы 26 наурызда № 1432 тіркелген Орталықтан төленетін зейнетақы төлемдерін, мемлекеттік әлеуметтік жәрдемақылар мен мемлекеттік арнайы жәрдемақыларды тағайындауды және төлеуді ұйымдастыру тәртібі туралы нұсқаулықтың 25-бабының күшін жою туралы
