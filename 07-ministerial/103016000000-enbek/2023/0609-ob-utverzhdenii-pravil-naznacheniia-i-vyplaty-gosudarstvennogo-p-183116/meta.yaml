act_code: '183116'
requisite: Приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 9 июня 2023 года № 215. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 июня 2023 года № 32851
title:
  rus: Об утверждении Правил назначения и выплаты государственного пособия, назначаемого и выплачиваемого матери или отцу, усыновителю (удочерителю), опекуну (попечителю), воспитывающим ребенка с инвалидностью (детей с инвалидностью), государственного пособия лицам, осуществляющим уход за лицом с инвалидностью первой группы
  kaz: Мүгедектігі бар баланы (мүгедектігі бар балаларды) тәрбиелеп отырған анаға немесе әкеге, бала асырап алушыға, қорғаншыға (қамқоршыға) тағайындалатын және төленетін мемлекеттік жәрдемақы, бірінші топтағы мүгедектігі бар адамға күтім жасайтын адамдарға берілетін мемлекеттік жәрдемақы тағайындау және төлеу қағидаларын бекіту туралы
