title:
  rus: Об утверждении Правил предоставления санаторно-курортного лечения лицам с инвалидностью и детям с инвалидностью в соответствии с индивидуальной программой абилитации и реабилитации лица с инвалидностью
  kaz: Мүгедектігі бар адамды абилитациялаудың және оңалтудың жеке бағдарламасына сәйкес мүгедектігі бар адамдар мен мүгедектігі бар балаларға санаторийлік-курорттық емдеуді ұсыну қағидаларын бекіту туралы
