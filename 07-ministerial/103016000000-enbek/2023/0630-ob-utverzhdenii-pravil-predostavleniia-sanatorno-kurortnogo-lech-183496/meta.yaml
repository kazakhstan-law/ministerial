  requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 14 мая 2024 года № 149. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 мая 2024 года № 34366
  title:
    rus: О внесении изменения и дополнений в приказы Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 30 июня 2023 года № 283 «Об утверждении Правил предоставления санаторно-курортного лечения лицам с инвалидностью и детям с инвалидностью в соответствии с индивидуальной программой абилитации и реабилитации лица с инвалидностью» и Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 30 июня 2023 года № 285 «Об утверждении Правил регистрации поставщиков товаров и (или) услуг или их снятия с регистрации на портале социальных услуг, а также допуска товаров и (или) услуг на портал социальных услуг»
    kaz: «Мүгедектігі бар адамды абилитациялаудың және оңалтудың жеке бағдарламасына сәйкес мүгедектігі бар адамдар мен мүгедектігі бар балаларға санаторийлік-курорттық емдеуді ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 30 маусымдағы № 283 бұйрығына және «Тауарларды және (немесе) көрсетілетін қызметтерді берушілерді әлеуметтік көрсетілетін қызметтер порталында тіркеу немесе оларды тіркеуден шығару, сондай-ақ тауарларды және (немесе) көрсетілетін қызметтерді әлеуметтік көрсетілетін қызметтер порталына жіберу қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 30 маусымдағы № 285 бұйрығына өзгеріс пен толықтырулар енгізу туралы
