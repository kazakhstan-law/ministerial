  title:
    rus: О внесении изменений и дополнений в приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 22 июня 2023 года № 230 «Об утверждении Правил деятельности организаций, оказывающих специальные социальные услуги» и приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 29 июня 2023 года № 263 «Об утверждении стандартов оказания специальных социальных услуг в области социальной защиты населения»
    kaz: «Арнаулы әлеуметтік қызметтер көрсететін ұйымдар қызметінің қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 22 маусымдағы № 230 бұйрығы және «Халықты әлеуметтік қорғау саласында арнаулы әлеуметтік қызметтер көрсету стандарттарын бекіту туралы Қазақстан Республикасы Премьер-Министрінің орынбасары - Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 29 маусымдағы № 263 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201195/rus
