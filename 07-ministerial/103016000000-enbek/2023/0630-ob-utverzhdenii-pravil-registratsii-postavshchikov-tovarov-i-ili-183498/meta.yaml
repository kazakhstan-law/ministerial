  title:
    rus: О внесении изменений в приказ Министра труда и социальной защиты населения Республики Казахстан от 26 мая 2023 года № 180 «Об утверждении типового положения о Комиссии по вопросам портала социальных услуг» и приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 30 июня 2023 года № 285 «Об утверждении Правил регистрации поставщиков товаров и (или) услуг или их снятия с регистрации на портале социальных услуг, а также допуска товаров и (или) услуг на портал социальных услуг»
    kaz: «Әлеуметтік көрсетілетін қызметтер порталы мәселелері жөніндегі комиссия туралы үлгілік ережені бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 26 мамырдағы № 180 бұйрығына және «Тауарларды және (немесе) көрсетілетін қызметтерді берушілерді әлеуметтік көрсетілетін қызметтер порталында тіркеу немесе оларды тіркеуден шығару, сондай-ақ тауарларды және (немесе) көрсетілетін қызметтерді әлеуметтік көрсетілетін қызметтер порталына жіберу қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 30 маусымдағы № 285 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/207735/rus
