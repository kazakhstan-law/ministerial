act_code: '183498'
requisite: Приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 30 июня 2023 года № 285. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июня 2023 года № 32989
title:
  rus: Об утверждении Правил регистрации поставщиков товаров и (или) услуг, услуг по перевозке лиц с инвалидностью на инватакси или их снятия с регистрации на портале социальных услуг, а также допуска товаров и (или) услуг на портал социальных услуг
  kaz: Тауарларды және (немесе) көрсетілетін қызметтерді, мүгедектігі бар адамдарды инватаксимен тасымалдау жөніндегі көрсетілетін қызметтерді берушілерді әлеуметтік көрсетілетін қызметтер порталында тіркеу немесе оларды тіркеуден шығару, сондай-ақ тауарларды және (немесе) көрсетілетін қызметтерді әлеуметтік көрсетілетін қызметтер порталына жіберу қағидаларын бекіту туралы
