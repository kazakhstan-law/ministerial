title:
  rus: Об утверждении Правил аккредитации центров признания профессиональных квалификаций, переоформления, отзыва, возобновления и прекращения действия аттестата аккредитации, а также типовой формы и условий постаккредитационного договора
  kaz: Кәсіптік біліктілікті тану орталықтарын аккредиттеу, аккредиттеу аттестатын қайта рәсімдеу, кері қайтарып алу, оның қолданысын қайта бастау және тоқтату қағидаларын, сондай-ақ аккредиттеуден кейінгі шарттың үлгілік нысаны мен талаптарын бекіту туралы
