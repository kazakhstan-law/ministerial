    kaz: «Учаскелік комиссиялар туралы үлгілік ережені, сондай-ақ өтініш берушінің материалдық жағдайын тексеру нәтижелері бойынша атаулы әлеуметтік көмекке мұқтаждықты айқындау өлшемшарттарын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 23 мамырдағы № 167 бұйрығына өзгерістер енгізу туралы
