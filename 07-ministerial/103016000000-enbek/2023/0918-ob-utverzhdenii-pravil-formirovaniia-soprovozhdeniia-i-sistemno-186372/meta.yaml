title:
  rus: Об утверждении Правил формирования, сопровождения и системно-технического обслуживания цифровой платформы Национальной системы квалификаций, интеграции с иными информационными системами, а также анализа и обработки данных по вопросам Национальной системы квалификаций
  kaz: Ұлттық біліктілік жүйесінің цифрлық платформасын қалыптастыру, қолдап отыру және оған жүйелік-техникалық қызмет көрсету, өзге де ақпараттық жүйелермен интеграциялау, сондай-ақ Ұлттық біліктілік жүйесінің мәселелері бойынша деректерді талдау және өңдеу қағидаларын бекіту туралы
