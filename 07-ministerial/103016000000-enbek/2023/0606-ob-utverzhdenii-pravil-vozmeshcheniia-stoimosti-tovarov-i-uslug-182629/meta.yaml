  title:
    rus: О внесении изменений и дополнений в приказы Министра труда и социальной защиты населения Республики Казахстан от 2 июня 2023 года № 199 «Об утверждении Методики определения гарантированной суммы, предоставляемой в качестве возмещения стоимости товаров и (или) услуг, услуг по перевозке лиц с инвалидностью на инватакси, приобретаемых лицами с инвалидностью через портал социальных услуг» и от 6 июня 2023 года № 205 «Об утверждении Правил возмещения стоимости товаров и услуг, услуг по перевозке лиц с инвалидностью на инватакси из средств государственного бюджета при реализации их лицам с инвалидностью через портал социальных услуг»
    kaz: «Мүгедектігі бар адамдар әлеуметтік көрсетілетін қызметтер порталы арқылы сатып алатын тауарлардың және (немесе) көрсетілетін қызметтердің, мүгедектігі бар адамдарды инватаксимен тасымалдау жөніндегі көрсетілетін қызметтердің құнын өтеу ретінде ұсынылатын кепілдік берілген соманы айқындау әдістемесін бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 2 маусымдағы № 199 және «Мүгедектігі бар адамдарға тауарлар мен қызметтерді, мүгедектігі бар адамдарды инватаксимен тасымалдау жөніндегі көрсетілетін қызметтерді әлеуметтік көрсетілетін қызметтер порталы арқылы өткізу кезінде олардың құнын мемлекеттік бюджет қаражатынан өтеу қағидаларын бекіту туралы» 2023 жылғы 6 маусымдағы № 205 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/223284/rus
