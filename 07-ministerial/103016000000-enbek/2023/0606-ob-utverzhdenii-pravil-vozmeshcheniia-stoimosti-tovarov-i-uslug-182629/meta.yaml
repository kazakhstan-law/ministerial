title:
  rus: Об утверждении Правил возмещения стоимости товаров и услуг, услуг по перевозке лиц с инвалидностью на инватакси из средств государственного бюджета при реализации их лицам с инвалидностью через портал социальных услуг
  kaz: Мүгедектігі бар адамдарға тауарлар мен көрсетілетін қызметтерді, мүгедектігі бар адамдарды инватаксимен тасымалдау жөніндегі көрсетілетін қызметтерді әлеуметтік көрсетілетін қызметтер порталы арқылы өткізу кезінде олардың құнын мемлекеттік бюджет қаражатынан өтеу қағидаларын бекіту туралы
