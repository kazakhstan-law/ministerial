  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 21 июня 2023 года № 227 «Об утверждении Правил назначения и выплаты государственной адресной социальной помощи» и в приказ Министра труда и социальной защиты населения Республики Казахстан от 26 мая 2026 года № 195 «О внесении изменений в некоторые приказы»
    kaz: «Мемлекеттік атаулы әлеуметтік көмекті тағайындау және төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 21 маусымдағы № 227 бұйрығына және «Кейбір бұйрықтарға өзгерістер енгізу туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2026 жылғы 26 мамырдағы № 195 бұйрығына өзгерістер енгізу туралы
