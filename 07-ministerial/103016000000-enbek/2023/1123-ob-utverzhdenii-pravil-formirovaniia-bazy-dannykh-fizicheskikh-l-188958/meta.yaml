  title:
    rus: О внесении изменений и дополнения в приказ Министра труда и социальной защиты населения Республики Казахстан от 23 ноября 2023 года № 485 «Об утверждении Правил формирования базы данных вкладчиков (получателей) по обязательным пенсионным взносам, обязательным профессиональным пенсионным взносам и Правил обмена информацией между информационными системами центрального исполнительного органа и единого накопительного пенсионного фонда о движениях по индивидуальным пенсионным счетам, а также получателях и размерах пенсионных выплат»
    kaz: «Міндетті зейнетақы жарналары, міндетті кәсіптік зейнетақы жарналары бойынша салымшылардың (алушылардың) дерекқорын қалыптастыру қағидаларын және Орталық атқарушы орган мен бірыңғай жинақтаушы зейнетақы қорының ақпараттық жүйелері арасында жеке зейнетақы шоттары бойынша қозғалыстар туралы, сондай-ақ зейнетақы төлемдерін алушылар мен олардың мөлшері туралы ақпарат алмасу қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 23 қарашадағы № 485 бұйрығына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/193005/rus
