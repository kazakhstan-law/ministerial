act_code: '188958'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 23 ноября 2023 года № 485. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 ноября 2023 года № 33675
title:
  rus: Об утверждении Правил формирования базы данных физических лиц, за которых перечислены обязательные пенсионные взносы, обязательные пенсионные взносы работодателя, обязательные профессиональные пенсионные взносы и Правил обмена информацией между информационными системами центрального исполнительного органа и единого накопительного пенсионного фонда о движениях по индивидуальным пенсионным счетам, условным пенсионным счетам, а также о получателях и размерах пенсионных выплат
  kaz: Міндетті зейнетақы жарналары, жұмыс берушінің міндетті зейнетақы жарналары, міндетті кәсіптік зейнетақы жарналары аударылған жеке тұлғалардың дерекқорын қалыптастыру қағидаларын және Орталық атқарушы органның және бірыңғай жинақтаушы зейнетақы қорының ақпараттық жүйелері арасында жеке зейнетақы шоттары, шартты зейнетақы шоттары бойынша қозғалыс туралы, сондай-ақ алушылар мен зейнетақы төлемдерінің мөлшерлері туралы ақпарат алмасу қағидаларын бекіту туралы
