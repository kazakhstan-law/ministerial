  title:
    rus: О внесении изменений в приказ Министра труда и социальной защиты населения Республики Казахстан от 23 мая 2023 года № 167 «Об утверждении Типового положения об участковых комиссиях, а также критериев определения нуждаемости в государственной адресной социальной помощи по результатам обследования материального положения заявителя» и в приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 29 июня 2023 года № 267 «Об утверждении Методики определения социального благополучия семьи (лица)»
    kaz: «Учаскелік комиссиялар туралы үлгілік ережені, сондай-ақ өтініш берушінің материалдық жағдайын тексеру нәтижелері бойынша атаулы әлеуметтік көмекке мұқтаждықты айқындау өлшемшарттарын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 23 мамырдағы № 167 бұйрығына және «Отбасының (адамның) әлеуметтік саламаттылығын айқындау әдістемесін бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 29 маусымдағы № 267 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/226614/rus
