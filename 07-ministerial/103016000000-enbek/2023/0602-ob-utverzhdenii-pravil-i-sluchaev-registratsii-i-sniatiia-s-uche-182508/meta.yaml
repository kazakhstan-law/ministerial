title:
  rus: Об утверждении Правил и случаев регистрации и снятия с учета в качестве безработных членов семей военнослужащих, сотрудников специальных государственных и правоохранительных органов, органов гражданской защиты, а также лиц, находящихся на их иждивении, не осуществляющих трудовую деятельность
  kaz: Әскери қызметшілердің, арнаулы мемлекеттік органдар және құқық қорғау органдары, азаматтық қорғау органдары қызметкерлерінің отбасы мүшелерін, сондай-ақ олардың асырауындағы, еңбек қызметін жүзеге асырмайтын адамдарды жұмыссыздар ретінде тіркеу және есептен шығару қағидалары мен жағдайларын бекіту туралы
