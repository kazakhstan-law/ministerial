  title:
    rus: О внесении изменений в приказ Министра труда и социальной защиты населения Республики Казахстан от 2 июня 2023 года № 197 «Об утверждении Правил и случаев регистрации и снятия с учета в качестве безработных членов семей военнослужащих, сотрудников специальных государственных и правоохранительных органов, а также лиц, находящихся на их иждивении, не осуществляющих трудовую деятельность»
    kaz: «Әскери қызметшілердің, арнаулы мемлекеттік және құқық қорғау органдары қызметкерлерінің отбасы мүшелерін, сондай-ақ олардың асырауындағы, еңбек қызметін жүзеге асырмайтын адамдарды жұмыссыздар ретінде тіркеу және есептен шығару қағидалары мен жағдайларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 2 маусымдағы № 197 бұйрығына өзгерістер енгізу туралы
