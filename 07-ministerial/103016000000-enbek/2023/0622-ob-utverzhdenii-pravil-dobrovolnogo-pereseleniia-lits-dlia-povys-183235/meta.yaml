  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра здравоохранения и социального развития Республики Казахстан от 15 января 2016 года № 20 «Об утверждении Правил включения в региональную квоту приема кандасов и переселенцев» и приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 22 июня 2023 года № 234 «Об утверждении Правил добровольного переселения лиц для повышения мобильности рабочей силы»
    kaz: «Қандастар мен қоныс аударушыларды қабылдаудың өңірлік квотасына енгізу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің міндетін атқарушының 2016 жылғы 15 қаңтардағы № 20 бұйрығына және «Жұмыс күшінің ұтқырлығын арттыру үшін адамдардың ерікті түрде қоныс аудару қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 22 маусымдағы № 234 бұйрығына өзгерістер мен толықтырулар енгізу туралы
