act_code: '183266'
requisite: Приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 22 июня 2023 года № 232. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 июня 2023 года № 32890
title:
  rus: Об утверждении Правил исчисления (определения) размеров, назначения, осуществления, приостановления, перерасчета, возобновления, прекращения и пересмотра решения о назначении (отказе в назначении) государственной базовой пенсионной выплаты, пенсионных выплат по возрасту
  kaz: Мемлекеттік базалық зейнетақы төлемінің, жасына байланысты зейнетақы төлемдерінің мөлшерін есептеу (айқындау), оларды тағайындау, жүзеге асыру, тоқтата тұру, қайта есептеу, қайта бастау, тоқтату және тағайындау (тағайындаудан бас тарту) туралы шешімді қайта қарау қағидаларын бекіту туралы
