act_code: '183348'
requisite: Приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 27 июня 2023 года № 248. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 июня 2023 года № 32912
title:
  rus: Об утверждении Правил исчисления (определения) размеров, назначения, осуществления, приостановления, перерасчета, возобновления, прекращения и пересмотра решения о назначении (отказе в назначении) социальных выплат по случаю потери дохода в связи с беременностью и родами, усыновлением (удочерением) новорожденного ребенка (детей), социальной выплаты по случаю потери дохода в связи с уходом за ребенком по достижении им возраста полутора лет
  kaz: Жүктілікке және босануға, жаңа туған баланы (балаларды) асырап алуға байланысты кірісінен айырылу жағдайы бойынша әлеуметтік төлемдерді, бала бір жарым жасқа толғанға дейін оның күтіміне байланысты кірісінен айырылу жағдайы бойынша әлеуметтік төлемнің мөлшерін есептеу (айқындау), тағайындау, жүзеге асыру, тоқтата тұру, қайта есептеу, қайта бастау, тоқтату және оларды тағайындау (тағайындаудан бас тарту) туралы шешімді қайта қарау қағидаларын бекіту туралы
