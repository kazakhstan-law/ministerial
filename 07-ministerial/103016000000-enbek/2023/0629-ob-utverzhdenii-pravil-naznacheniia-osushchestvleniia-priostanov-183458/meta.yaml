  title:
    rus: О внесении изменений и дополнений в приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 27 июня 2023 года № 257 «Об утверждении Правил исчисления (определения) размеров, назначения, выплаты, приостановления, перерасчета, возобновления, прекращения и пересмотра решения о назначении (отказе в назначении) государственных социальных пособий по инвалидности и по случаю потери кормильца» и  в приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 29 июня 2023 года № 269 «Об утверждении Правил назначения, осуществления, приостановления, перерасчета, возобновления, прекращения государственного специального пособия и пересмотра решения о его выплате»
    kaz: «Мүгедектігі бойынша және асыраушысынан айырылу жағдайы бойынша мемлекеттік әлеуметтік жәрдемақылар мөлшерін есептеу (айқындау), оларды тағайындау, төлеу, тоқтата тұру, қайта есептеу, қайта бастау, тоқтату және тағайындау (тағайындаудан бас тарту) туралы шешімді қайта қарау қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Еңбек және  халықты әлеуметтік қорғау министрінің 2023 жылғы 27 маусым № 257 бұйрығы мен «Мемлекеттік арнаулы жәрдемақыны тағайындау, жүзеге асыру, тоқтата тұру, қайта есептеу, қайта бастау, тоқтату және оны төлеу туралы шешімді қайта қарау қағидаларын айқындау туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 29 маусымдағы №269 бұйрығына өзгерістер мен толықтырулар енгізу туралы
