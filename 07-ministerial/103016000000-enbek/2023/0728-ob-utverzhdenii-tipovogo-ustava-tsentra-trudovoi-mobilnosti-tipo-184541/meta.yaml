  title:
    rus: О внесении изменений и дополнений в приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 28 июля 2023 года № 322 «Об утверждении типового устава центра трудовой мобильности, типового положения карьерного центра, типового положения о региональной комиссии по вопросам занятости населения, типового положения о районной (городской) комиссии по вопросам занятости населения»
    kaz: «Еңбек мобильділігі орталығының үлгілік жарғысын, мансап орталығының үлгілік ережесін, халықты жұмыспен қамту мәселелері жөніндегі өңірлік комиссия туралы үлгілік ережені, халықты жұмыспен қамту мәселелері жөніндегі аудандық (қалалық) комиссия туралы үлгілік ережені бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 28 шілдедегі № 322 бұйрығына өзгерістер мен толықтырулар енгізу туралы
