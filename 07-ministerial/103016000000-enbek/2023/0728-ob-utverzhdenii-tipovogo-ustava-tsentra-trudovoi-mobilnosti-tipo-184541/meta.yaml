act_code: '184541'
requisite: Приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 28 июля 2023 года № 322. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 августа 2023 года № 33211
title:
  rus: Об утверждении типового устава центра трудовой мобильности, типового положения карьерного центра, типового положения о региональной комиссии по вопросам занятости населения, типового положения о районной (городской) комиссии по вопросам занятости населения
  kaz: Еңбек мобильділігі орталығының үлгілік жарғысын, мансап орталығының үлгілік ережесін, халықты жұмыспен қамту мәселелері жөніндегі өңірлік комиссия туралы үлгілік ережені, халықты жұмыспен қамту мәселелері жөніндегі аудандық (қалалық) комиссия туралы үлгілік ережені бекіту туралы
