title:
  rus: Об утверждении Правил предоставления услуг индивидуального помощника для лиц с инвалидностью первой группы, имеющих затруднение в передвижении, в соответствии с индивидуальной программой абилитации и реабилитации лица с инвалидностью
  kaz: Мүгедектігі бар адамды абилитациялау мен оңалтудың жеке бағдарламасына сәйкес жүріп-тұруы қиын бірінші топтағы мүгедектігі бар адамдар үшін жеке көмекшінің қызметтерін ұсыну қағидаларын бекіту туралы
