act_code: '183263'
requisite: Приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 22 июня 2023 года № 236. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 июня 2023 года № 32887
title:
  rus: Об утверждении Правил выдачи или продления справок иностранцу или лицу без гражданства о соответствии его квалификации для самостоятельного трудоустройства, перечня приоритетных отраслей экономики (видов экономической деятельности) и востребованных в них профессий для самостоятельного трудоустройства иностранцев и лиц без гражданства
  kaz: Өз бетінше жұмысқа орналасуы үшін шетелдікке немесе азаматтығы жоқ адамға біліктілігінің сәйкестігі туралы анықтама беру немесе ұзарту қағидаларын, шетелдіктің немесе азаматтығы жоқ адамның өз бетінше жұмысқа орналасуы үшін басым салалардың (экономикалық қызмет түрлерінің) және олардағы сұранысқа ие кәсіптердің тізбесін бекіту туралы
