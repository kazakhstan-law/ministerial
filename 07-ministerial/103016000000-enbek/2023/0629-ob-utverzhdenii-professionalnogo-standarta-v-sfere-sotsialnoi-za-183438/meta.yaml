  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра – Министра труда и социальной защиты населения Республики Казахстан от 29 июня 2023 года № 262 «Об утверждении профессионального стандарта в сфере социальной защиты» и приказ Министра труда и социальной защиты населения Республики Казахстан от 30 апреля 2024 года № 125 «Об утверждении профессионального стандарта «Социальная работа и другие профессии социальной сферы»
    kaz: «Әлеуметтік қорғау саласындағы кәсіптік стандартты бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 29 маусымдағы № 262 және «Әлеуметтік жұмыс және әлеуметтік саланың басқа да кәсіптері» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2024 жылғы 30 сәуірдегі № 125 бұйрықтарына өзгерістер енгізу туралы
