  requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 30 сентября 2025 года № 302. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 октября 2025 года № 37020
  title:
    rus: О внесении изменений и дополнений в приказы Министра труда и социальной защиты населения Республики Казахстан от 15 апреля 2022 года № 123 «Об утверждении Правил выдачи, продления и отзыва разрешения трудовому иммигранту» и Заместителя Премьер-Министра-Министра труда и социальной защиты населения Республики Казахстан от 30 июня 2023 года № 279 «Об утверждении Правил и условий выдачи или продления разрешений работодателям на привлечение иностранной рабочей силы, а также осуществления внутрикорпоративного перевода»
    kaz: «Еңбекші көшіп келушілерге рұқсаттар беру, ұзарту және кері қайтарып алу қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2022 жылғы 15 сәуірдегі № 123 және «Жұмыс берушілерге шетелдік жұмыс күшін тартуға рұқсат беру және ұзарту, сондай-ақ корпоративішілік ауыстыруды жүзеге асыру қағидалары мен шарттарын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 30 маусымдағы № 279 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/215123/rus
