act_code: '183493'
requisite: Приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 30 июня 2023 года № 279. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июня 2023 года № 32977
title:
  rus: Об утверждении Правил и условий выдачи или продления разрешений работодателям на привлечение иностранной рабочей силы, а также осуществления внутрикорпоративного перевода
  kaz: Жұмыс берушілерге шетелдік жұмыс күшін тартуға рұқсат беру және ұзарту, сондай-ақ корпоративішілік ауыстыруды жүзеге асыру қағидалары мен шарттарын бекіту туралы
