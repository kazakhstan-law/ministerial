  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 30 июня 2023 года № 281 «Об утверждении правил и методики формирования тарифов на специальные социальные услуги» и в приказ Министра труда и социальной защиты населения Республики Казахстан от 28 декабря 2024 года № 504 «Об утверждении Правил оплаты специальных социальных услуг в области социальной защиты населения»
    kaz: Қазақстан Республикасы Премьер-Министрінің орынбасары - Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 30 маусымдағы № 281 «Арнаулы әлеуметтік қызметтерге тарифтерді қалыптастырудың ережесі мен әдістемесін бекіту туралы» бұйрығына және Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2024 жылғы 28 желтоқсандағы № 504 «Арнаулы әлеуметтік көрсетілетін қызметтерге ақы төлеу қағидаларын бекіту туралы» бұйрығына өзгерістер енгізу туралы
