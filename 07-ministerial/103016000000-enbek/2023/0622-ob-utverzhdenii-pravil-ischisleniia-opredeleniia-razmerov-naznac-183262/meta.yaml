act_code: '183262'
requisite: Приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 22 июня 2023 года № 238. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 июня 2023 года № 32886
title:
  rus: Об утверждении Правил исчисления (определения) размеров, назначения, осуществления, приостановления, перерасчета, возобновления, прекращения и пересмотра решения о назначении (отказе в назначении) социальной выплаты по случаю утраты трудоспособности
  kaz: Еңбекке қабілеттілігінен айырылу жағдайы бойынша әлеуметтік төлемдердің мөлшерлерін есептеу (айқындау), тағайындау, жүзеге асыру, тоқтата тұру, қайта есептеу, қайта бастау, тоқтату және тағайындау (тағайындаудан бас тарту) туралы шешімді қайта қарау қағидаларын бекіту туралы
