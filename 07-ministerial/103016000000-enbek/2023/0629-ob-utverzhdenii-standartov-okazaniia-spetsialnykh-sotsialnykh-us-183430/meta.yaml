  title:
    rus: О внесении изменений и дополнений в приказы Заместителя Премьер-Министра – Министра труда и социальной защиты населения Республики Казахстан от 29 июня 2023 года № 260 «Об утверждении Правил проведения медико-социальной экспертизы» и от 29 июня 2023 года № 263 «Об утверждении стандартов оказания специальных социальных услуг в области социальной защиты населения»
    kaz: «Медициналық-әлеуметтік сараптама жүргізу қағидаларын бекіту туралы» 2023 жылғы 29 маусымдағы № 260 және «Халықты әлеуметтік қорғау саласында арнаулы әлеуметтік қызметтер көрсету стандарттарын бекіту туралы» 2023 жылғы 29 маусымдағы № 263 Қазақстан Республикасы Премьер-Министрінің орынбасары - Еңбек және халықты әлеуметтік қорғау министрінің бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
