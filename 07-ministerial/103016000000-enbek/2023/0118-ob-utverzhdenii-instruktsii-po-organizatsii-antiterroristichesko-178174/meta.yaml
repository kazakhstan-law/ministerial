  title:
    rus: О внесении изменения в приказ Министра труда и социальной защиты населения Республики Казахстан от 18 января 2023 года № 14 «Об утверждении инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, находящихся в ведении Министерства труда и социальной защиты населения Республики Казахстан и Комитета труда и социальной защиты Министерства труда и социальной защиты населения Республики Казахстан»
    kaz: «Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігі мен Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігі Еңбек және әлеуметтік қорғау комитетінің қарамағындағы террористік тұрғыдан осал объектілердің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 18 қаңтардағы № 14 бұйрығына өзгеріс енгізу туралы
