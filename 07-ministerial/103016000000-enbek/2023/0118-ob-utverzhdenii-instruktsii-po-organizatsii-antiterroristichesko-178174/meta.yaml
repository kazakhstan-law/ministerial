act_code: '178174'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 18 января 2023 года № 14. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 января 2023 года № 31743
title:
  rus: Об утверждении инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, находящихся в ведении Министерства труда и социальной защиты населения Республики Казахстан, Комитета государственной инспекции труда Министерства труда и социальной защиты населения Республики Казахстан и Комитета регулирования и контроля в сфере социальной защиты населения Министерства труда и социальной защиты населения Республики Казахстан
  kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігінің, Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігінің Мемлекеттік еңбек инспекциясы комитетінің және Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігінің Халықты әлеуметтік қорғау саласындағы реттеу және бақылау комитетінің қарамағындағы террористік тұрғыдан осал объектілердің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
