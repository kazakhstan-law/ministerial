  title:
    rus: О внесении изменений в приказ Министра труда и социальной защиты населения Республики Казахстан от 28 сентября 2023 года № 408 «Об утверждении правил и критериев оценки результатов работы независимых экспертов медико-социальной экспертизы» и приказ исполняющего обязанности Министра труда и социальной защиты населения Республики Казахстан от 29 сентября 2023 года № 411 «Об утверждении правил оплаты услуг независимых экспертов медико-социальной экспертизы и тарифы на услуги независимых экспертов медико-социальной экспертизы»
    kaz: «Медициналық-әлеуметтік сараптаманың тәуелсіз сарапшылары жұмысының нәтижелерін бағалау қағидалары мен өлшемшарттарын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 28 қыркүйектегі № 408 бұйрығына және «Медициналық-әлеуметтік сараптаманың тәуелсіз сарапшыларының қызметтеріне ақы төлеу қағидаларын және медициналық-әлеуметтік сараптаманың тәуелсіз сарапшылары көрсететін қызметтерге тарифтерді бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрі міндетін атқарушысының 2023 жылғы 29 қыркүйектегі № 411 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/206989/rus
