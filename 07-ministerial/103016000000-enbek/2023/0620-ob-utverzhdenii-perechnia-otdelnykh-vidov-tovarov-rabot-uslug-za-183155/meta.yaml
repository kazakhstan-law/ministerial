act_code: '183155'
requisite: Приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 20 июня 2023 года № 225. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 июня 2023 года № 32862. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 3 сентября 2024 года № 345 (вводится в действие с 1 января 2025 года)
title:
  rus: Об утверждении перечня отдельных видов товаров, работ, услуг, закупаемых у общественных объединений лиц с инвалидностью Республики Казахстан и (или) организаций, созданных общественными объединениями лиц с инвалидностью Республики Казахстан, производящих и (или) поставляющих товары, выполняющих работы, оказывающих услуги
  kaz: Тауарларды өндіретін және (немесе) беретін, жұмыстарды орындайтын, қызметтерді көрсететін Қазақстан Республикасының мүгедектігі бар адамдар қоғамдық бірлестіктері және (немесе) Қазақстан Республикасының мүгедектігі бар адамдар қоғамдық бірлестіктері құрған ұйымдардан сатып алынатын тауарлардың, жұмыстардың, көрсетілетін қызметтердің жекелеген түрлерінің тізбесін бекіту туралы
