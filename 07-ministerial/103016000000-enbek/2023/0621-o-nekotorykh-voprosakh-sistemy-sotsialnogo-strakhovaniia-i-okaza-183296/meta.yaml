  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 21 июня 2023 года № 229 «О некоторых вопросах системы социального страхования и оказания государственных услуг в социально-трудовой сфере» и в приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 29 июня 2023 года № 270 «Об утверждении Правил уплаты, перечисления и распределения, а также возврата излишне (ошибочно) уплаченных сумм единого платежа и (или) пени за несвоевременную и (или) неполную уплату единого платежа»
    kaz: «Әлеуметтік сақтандыру жүйесінің және әлеуметтік-еңбек саласында мемлекеттік қызметтер көрсетудің кейбір мәселелері туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 21 маусымдағы № 229 бұйрығына және «Бірыңғай төлемнің артық (қате) төленген және (немесе) бірыңғай төлемді уақтылы және (немесе) толық төлемегені үшін өсімпұлдың сомаларын төлеу, аудару және бөлу, сондай-ақ қайтару қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 29 маусымдағы № 270 бұйрығына өзгерістер енгізу туралы
