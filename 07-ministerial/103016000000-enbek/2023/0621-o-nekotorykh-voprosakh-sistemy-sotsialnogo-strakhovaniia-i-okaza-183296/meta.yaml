  title:
    rus: О внесении изменения в приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 21 июня 2023 года № 229 «О некоторых вопросах системы социального страхования и оказания государственных услуг в социально-трудовой сфере» и признании утратившим силу приказа Министра здравоохранения и социального развития Республики Казахстан от 31 мая 2016 года № 467 «Об утверждении форм информации о перечисленных суммах социальных отчислений за участников системы обязательного социального страхования и заявки для ее получения»
    kaz: «Әлеуметтік сақтандыру жүйесінің және әлеуметтік-еңбек саласында мемлекеттік қызметтер көрсетудің кейбір мәселелері туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 21 маусымдағы № 229 бұйрығына өзгеріс енгізу және «Міндетті әлеуметтік сақтандыру жүйесіне қатысушылар үшін аударылған әлеуметтік аударымдар сомалары және оны алу үшін өтінім туралы ақпарат нысандарын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2016 жылғы 31 мамырдағы № 467 бұйрығының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/193017/rus
