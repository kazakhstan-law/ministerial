  title:
    rus: О внесении изменений и дополнений в приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 27 июня 2023 года № 256 «Об утверждении Правил назначения и осуществления единовременной выплаты на погребение из средств республиканского бюджета» и  в приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 27 июня 2023 года № 257 «Об утверждении Правил исчисления (определения) размеров, назначения, выплаты, приостановления, перерасчета, возобновления, прекращения и пересмотра решения о назначении (отказе в назначении) государственных социальных пособий по инвалидности и по случаю потери кормильца»
    kaz: «Республикалық бюджет қаражатынан жерлеуге біржолғы төлемді тағайындау және жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 27 маусымдағы № 256 бұйрығы мен «Мүгедектігі бойынша және асыраушысынан айырылу жағдайы бойынша мемлекеттік әлеуметтік жәрдемақылар мөлшерін есептеу (айқындау), оларды тағайындау, төлеу, тоқтата тұру, қайта есептеу, қайта бастау, тоқтату және тағайындау (тағайындаудан бас тарту) туралы шешімді қайта қарау қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 27 маусымдағы № 257 бұйрығына өзгерістер мен толықтырулар енгізу туралы
