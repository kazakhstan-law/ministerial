title:
  rus: Об утверждении Правил исчисления (определения) размеров, назначения, выплаты, приостановления, перерасчета, возобновления, прекращения и пересмотра решения о назначении (отказе в назначении) государственных социальных пособий по инвалидности и по случаю потери кормильца
  kaz: Мүгедектігі бойынша және асыраушысынан айырылу жағдайы бойынша мемлекеттік әлеуметтік жәрдемақылар мөлшерін есептеу (айқындау), оларды тағайындау, төлеу, тоқтата тұру, қайта есептеу, қайта бастау, тоқтату және тағайындау (тағайындаудан бас тарту) туралы шешімді қайта қарау қағидаларын бекіту туралы
