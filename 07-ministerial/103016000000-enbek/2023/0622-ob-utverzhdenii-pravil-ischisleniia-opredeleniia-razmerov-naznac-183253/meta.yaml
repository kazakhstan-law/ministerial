  kaz: Асыраушысынан айырылу жағдайы бойынша әлеуметтік төлемнің мөлшерін есептеу (айқындау), оны тағайындау, жүзеге асыру, тоқтата тұру, қайта есептеу, қайта бастау, тоқтату және тағайындау (тағайындаудан бас тарту) туралы шешімді қайта қарау қағидаларын бекіту туралы
