title:
  rus: О некоторых вопросах по сохранности обязательных пенсионных взносов, обязательных профессиональных пенсионных взносов в едином накопительном пенсионном фонде в размере фактически внесенных обязательных пенсионных взносов, обязательных профессиональных пенсионных взносов с учетом уровня инфляции
  kaz: Инфляцияның деңгейін ескере отырып, бірыңғай жинақтаушы зейнетақы қорындағы міндетті зейнетақы жарналарының, міндетті кәсіптік зейнетақы жарналарының нақты енгізілген міндетті зейнетақы жарналары, міндетті кәсіптік зейнетақы жарналары мөлшерінде сақталуы бойынша кейбір мәселелер туралы
