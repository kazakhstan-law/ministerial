  title:
    rus: О внесении изменения в приказ Министра труда и социальной защиты населения Республики Казахстан от 24 мая 2023 года № 170 «Об утверждении перечня производств, работ, профессий работников, занятых на работах с вредными условиями труда, в пользу которых агентами по уплате обязательных профессиональных пенсионных взносов за счет собственных средств осуществляются обязательные профессиональные пенсионные взносы»
    kaz: «Өндірістердің, жұмыстардың, пайдасына міндетті кәсіптік зейнетақы жарналарын төлеу жөніндегі агенттер меншікті қаражаты есебінен міндетті кәсіптік зейнетақы жарналарын жүзеге асыратын, еңбек жағдайлары зиянды жұмыстармен айналысатын жұмыскерлер кәсіптерінің тізбесін бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 24 мамырдағы № 170 бұйрығына өзгеріс енгізу туралы
