act_code: '183500'
requisite: Приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 30 июня 2023 года № 287. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июня 2023 года № 32993
title:
  rus: Об утверждении Правил обеспечения лиц с инвалидностью протезно-ортопедической помощью, техническими вспомогательными (компенсаторными) средствами, специальными средствами передвижения в соответствии с индивидуальной программой абилитации и реабилитации лица с инвалидностью, включая сроки их замены
  kaz: Мүгедектігі бар адамды абилитациялаудың және оңалтудың жеке бағдарламасына сәйкес мүгедектігі бар адамдарды протездік-ортопедиялық көмекпен, техникалық көмекші (компенсаторлық) құралдармен, арнаулы жүріп-тұру құралдарымен, оларды ауыстыру мерзімдерін қоса алғанда, қамтамасыз ету қағидаларын бекіту туралы
