  title:
    rus: О внесении изменений в приказы Министра труда и социальной защиты населения Республики Казахстан от 26 мая 2023 года № 181 «Об утверждении Правил исчисления совокупного дохода лица (семьи), претендующего на получение государственной адресной социальной помощи» и Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 21 июня 2023 года № 227 «Об утверждении Правил назначения и выплаты государственной адресной социальной помощи»
    kaz: «Мемлекеттік атаулы әлеуметтік көмек алуға үміткер адамның (отбасының) жиынтық кірісін есептеу қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 26 мамырдағы № 181 және «Мемлекеттік атаулы әлеуметтік көмекті тағайындау және төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 21 маусымдағы № 227 бұйрықтарына өзгерістер енгізу туралы
