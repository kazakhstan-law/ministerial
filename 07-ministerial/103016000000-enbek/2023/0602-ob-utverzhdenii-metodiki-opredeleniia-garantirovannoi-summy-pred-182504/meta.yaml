act_code: '182504'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 2 июня 2023 года № 199. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июня 2023 года № 32681
title:
  rus: Об утверждении Методики определения гарантированной суммы, предоставляемой в качестве возмещения стоимости товаров и (или) услуг, услуг по перевозке лиц с инвалидностью на инватакси, приобретаемых лицами с инвалидностью через портал социальных услуг
  kaz: Мүгедектігі бар адамдар әлеуметтік көрсетілетін қызметтер порталы арқылы сатып алатын тауарлардың және (немесе) көрсетілетін қызметтердің, мүгедектігі бар адамдарды инватаксимен тасымалдау жөніндегі көрсетілетін қызметтердің құнын өтеу ретінде ұсынылатын кепілдік берілген соманы айқындау әдістемесін бекіту туралы
