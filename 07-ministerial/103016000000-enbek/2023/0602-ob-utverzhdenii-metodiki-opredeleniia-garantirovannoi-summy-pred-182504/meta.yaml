  requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 29 августа 2025 года № 261. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 августа 2025 года № 36764
  title:
    rus: О внесении изменений и дополнений в приказ Министра труда и социальной защиты населения Республики Казахстан от 2 июня 2023 года № 199 «Об утверждении Методики определения гарантированной суммы, предоставляемой в качестве возмещения стоимости товаров и (или) услуг, приобретаемых лицами с инвалидностью через портал социальных услуг», приказ Министра труда и социальной защиты населения Республики Казахстан от 6 июня 2023 года № 205 «Об утверждении Правил возмещения стоимости товаров и услуг из средств государственного бюджета при реализации их лицам с инвалидностью через портал социальных услуг» и приказ Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 30 июня 2023 года № 285 «Об утверждении Правил регистрации поставщиков товаров и (или) услуг или их снятия с регистрации на портале социальных услуг, а также допуска товаров и (или) услуг на портал социальных услуг
    kaz: «Мүгедектігі бар адамдар әлеуметтік көрсетілетін қызметтер порталы арқылы сатып алатын тауарлардың және (немесе) көрсетілетін қызметтердің құнын өтеу ретінде ұсынылатын кепілдік берілген соманы айқындау әдістемесін бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 2 маусымдағы № 199 бұйрығына, «Мүгедектігі бар адамдарға тауарлар мен қызметтерді әлеуметтік көрсетілетін қызметтер порталы арқылы өткізу кезінде олардың құнын мемлекеттік бюджет қаражатынан өтеу қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 6 маусымдағы № 205 бұйрығына және «Тауарларды және (немесе) көрсетілетін қызметтерді берушілерді әлеуметтік көрсетілетін қызметтер порталында тіркеу немесе оларды тіркеуден шығару, сондай-ақ тауарларды және (немесе) көрсетілетін қызметтерді әлеуметтік көрсетілетін қызметтер порталына жіберу қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 30 маусымдағы № 285 бұйрығына өзгерістер мен толықтырулар енгізу туралы
