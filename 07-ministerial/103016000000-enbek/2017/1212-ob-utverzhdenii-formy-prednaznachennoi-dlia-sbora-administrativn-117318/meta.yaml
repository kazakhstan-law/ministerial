  title:
    rus: О внесении изменений в приказ Министра труда и социальной защиты населения Республики Казахстан от 12 декабря 2017 года № 427 «Об утверждении формы, предназначенной для сбора административных данных, представляемой Департаментами Комитета труда, социальной защиты и миграции Министерства труда и социальной защиты населения Республики Казахстан»
    kaz: «Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігі Еңбек, әлеуметтік қорғау және көші-қон комитетінің департаменттері ұсынған әкімшілік деректерді жинауға арналған нысанды бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2017 жылғы 12 желтоқсандағы № 427 бұйрығына өзгерістер енгізу туралы
