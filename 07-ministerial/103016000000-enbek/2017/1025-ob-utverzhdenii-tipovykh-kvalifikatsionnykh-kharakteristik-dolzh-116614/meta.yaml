  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра труда и социальной защиты населения Республики Казахстан от 25 октября 2017 года № 360 «Об утверждении Типовых квалификационных характеристик должностей руководителей, специалистов и других служащих организаций социальной защиты и занятости населения»
    kaz: «Халықты әлеуметтік қорғау және жұмыспен қамту ұйымдарының басшылары, мамандары және басқа да қызметшілері лауазымдарының үлгілік біліктілік сипаттамаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрі міндетін атқарушының 2017 жылғы 25 қазандағы № 360 бұйрығына өзгерістер мен толықтыру енгізу туралы
