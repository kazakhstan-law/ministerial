  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра труда и социальной защиты населения Республики Казахстан от 4 августа 2017 года № 236 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства труда и социальной защиты населения Республики Казахстан»
    kaz: «Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігінің «Б» корпусының мемлекеттік әкімшілік қызметшілерінің жұмысын бағалау әдістемесін бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрі міндетін атқарушының 2017 жылғы 4 тамыздағы № 236 бұйрығына өзгеріс енгізу туралы
