act_code: '114639'
requisite: Приказ и.о. Министра труда и социальной защиты населения Республики Казахстан от 3 августа 2017 года № 232. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 сентября 2017 года № 15629. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 23 ноября 2023 года № 485 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил формирования базы данных вкладчиков (получателей) по обязательным пенсионным взносам, обязательным профессиональным пенсионным взносам и единого списка физических лиц, заключивших договор о пенсионном обеспечении за счет обязательных пенсионных взносов, обязательных профессиональных пенсионных взносов, и Правил обмена информацией между информационными системами центрального исполнительного органа и единого накопительного пенсионного фонда о движениях по индивидуальным пенсионным счетам, а также о получателях и размерах пенсионных выплат
  kaz: Салымшылардың (алушылардың) міндетті зейнетақы жарналары, міндетті кәсіптік зейнетақы жарналары бойынша дерекқорын қалыптастыру қағидаларын және міндетті зейнетақы жарналары, міндетті кәсіптік зейнетақы жарналары есебінен зейнетақымен қамсыздандыру туралы шарт жасасқан жеке тұлғалардың бірыңғай тізімін және Орталық атқарушы орган мен бірыңғай жинақтаушы зейнеақы қорынын ақпараттық жүйелері арасында жеке зейнетақы шоттары бойынша қозғалыстары туралы, сондай-ақ зейнетақы төлемдерін алушылар мен олардың мөлшері туралы ақпарат алмасу қағидаларын бекіту туралы
