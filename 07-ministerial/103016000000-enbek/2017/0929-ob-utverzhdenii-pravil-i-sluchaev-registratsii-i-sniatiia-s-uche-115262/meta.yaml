act_code: '115262'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 29 сентября 2017 года № 320. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 октября 2017 года № 15865. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 2 июня 2023 года № 197 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил и случаев регистрации и снятия с учета в качестве безработных членов семей военнослужащих, сотрудников специальных государственных и правоохранительных органов, а также лиц, находящихся на их иждивении, не осуществляющих трудовую деятельность
  kaz: Әскери қызметшілердің, арнаулы мемлекеттік және құқық қорғау органдары қызметкерлерінің отбасы мүшелерін, сондай-ақ олардың асырауындағы, еңбек қызметін жүзеге асырмайтын адамдарды жұмыссыздар ретінде тіркеу және есептен шығару қағидалары мен жағдайларын бекіту туралы
