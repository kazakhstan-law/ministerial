  title:
    rus: О внесении изменений в некоторые приказы Министра здравоохранения и социального развития Республики Казахстан, Министра труда и социальной защиты населения Республики Казахстан и исполняющего обязанности Министра труда и социальной защиты населения Республики Казахстан
    kaz: Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің, Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің және Қазақстан Республикасы Еңбек және әлеуметтік қорғау министрінің міндетін атқарушының кейбір бұйрықтарына өзгерістер енгізу туралы
