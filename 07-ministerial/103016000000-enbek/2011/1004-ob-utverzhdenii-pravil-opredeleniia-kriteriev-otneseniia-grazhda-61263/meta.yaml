act_code: '61263'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 5 октября 2011 года № 353-ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 ноября 2011 года № 7285. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 8 декабря 2017 года № 423 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил определения критериев отнесения граждан Республики Казахстан к самостоятельно занятым, безработным и малообеспеченным при реализации активных мер содействия занятости
  kaz: Жұмыспен қамтуға жәрдемдесудің белсенді шараларын іске асыру кезінде Қазақстан Республикасы азаматтарын өз бетінше жұмыспен айналысушылар, жұмыссыздар және табысы аз адамдарға жатқызу критерийлерін айқындау жөніндегі қағиданы бекіту туралы
