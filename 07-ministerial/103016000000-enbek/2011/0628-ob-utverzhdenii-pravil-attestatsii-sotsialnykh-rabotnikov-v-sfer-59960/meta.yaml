  title:
    rus: О внесении изменений и дополнения в приказ Министра труда и социальной защиты населения Республики Казахстан от 28 июня 2011 года № 237-ө «Об утверждении Правил аттестации социальных работников в сфере социальной защиты населения»
    kaz: «Халықты әлеуметтік қорғау саласындағы әлеуметтік қызметкерлерді аттестаттау қағидасын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2011 жылғы 28 маусымдағы № 237-ө бұйрығына өзгерістер мен толықтыру енгізу туралы
