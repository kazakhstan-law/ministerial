  kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігі Еңбек, әлеуметтік қорғау және көші-қон комитетінің аумақтық бөлімшелеріне техникалық қызмет көрсетуді және олардың жұмыс істеуін қамтамасыз ететін жұмыскерлердің жүктеме және сан нормативтерін бекіту туралы
