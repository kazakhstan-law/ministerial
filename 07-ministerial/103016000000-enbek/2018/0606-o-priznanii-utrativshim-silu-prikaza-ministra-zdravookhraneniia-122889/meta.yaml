act_code: '122889'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 6 июня 2018 года № 230. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 июня 2018 года № 17108
title:
  rus: О признании утратившим силу приказа Министра здравоохранения и социального развития Республики Казахстан от 17 июня 2016 года № 532 «Об утверждении форм административного учета для представления сведений о востребованных специальностях и вакантных рабочих местах для включения в базу данных текущих вакансий и прогнозируемых рабочих мест»
  kaz: «Ағымдағы бос орындар және болжанатын жұмыс орындары дерекқорына қосу үшін қажетті мамандықтар мен бос жұмыс орындары туралы мәліметтер беруге арналған әкімшілік есепке алу нысандарын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2016 жылғы 17 маусымдағы № 532 бұйрығының күшін жою туралы
