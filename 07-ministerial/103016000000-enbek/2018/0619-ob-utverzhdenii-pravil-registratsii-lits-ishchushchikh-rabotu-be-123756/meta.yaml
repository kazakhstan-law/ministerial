  title:
    rus: О внесении изменений и дополнения в приказы Министра труда и социальной защиты населения Республики Казахстан от 19 июня 2018 года № 259 «Об утверждении Правил регистрации лиц, ищущих работу, безработных и осуществления трудового посредничества, оказываемого центрами занятости населения» и от 25 марта 2021 года № 84 «О некоторых вопросах оказания государственных услуг в социально-трудовой сфере»
    kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің «Жұмыс іздеп жүрген адамдарды, жұмыссыздарды тіркеу және халықты жұмыспен қамту орталықтары көрсететін еңбек делдалдығын жүзеге асыру қағидаларын бекіту туралы» 2018 жылғы 19 маусымдағы № 259 және «Әлеуметтік-еңбек саласында мемлекеттік қызметтерді көрсетудің кейбір мәселелері туралы» 2021 жылғы 25 наурыздағы № 84 бұйрықтарына өзгерістер мен толықтыру енгізу туралы
