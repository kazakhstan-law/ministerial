requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 19 июня 2018 года № 259. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 июля 2018 года № 17199. Утратил силу приказом Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 9 июня 2023 года № 214 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил регистрации лиц, ищущих работу, безработных и осуществления трудового посредничества, оказываемого центрами занятости населения
