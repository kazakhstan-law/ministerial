  title:
    rus: О внесении изменений в приказ Министра труда и социальной защиты населения Республики Казахстан от 24 декабря 2018 года № 571 «Об утверждении Правил применения поощрений государственных служащих Министерства труда и социальной защиты населения Республики Казахстан»
    kaz: «Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігінің мемлекеттік қызметшілерін көтермелеуді қолдану қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2018 жылғы 24 желтоқсандағы № 571 бұйрығына өзгерістер енгізу туралы
