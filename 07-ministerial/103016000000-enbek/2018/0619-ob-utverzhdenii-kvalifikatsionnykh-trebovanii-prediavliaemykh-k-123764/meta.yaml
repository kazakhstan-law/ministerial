requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 19 июня 2018 года № 254. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 июля 2018 года № 17168. Утратил силу приказом Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 16 июня 2023 года № 223 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении квалификационных требований, предъявляемых к частным агентствам занятости, претендующим на участие в аутсорсинге услуг в сфере занятости населения
  kaz: Халықты жұмыспен қамту саласында көрсетілетін қызметтердің аутсорсингіне қатысуға үміткер жұмыспен қамтудың жекеше агенттіктеріне қойылатын біліктілік талаптарын бекіту туралы
