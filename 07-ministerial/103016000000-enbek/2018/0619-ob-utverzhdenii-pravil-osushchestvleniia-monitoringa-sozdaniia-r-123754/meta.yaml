  title:
    rus: О внесении изменения в приказ Министра труда и социальной защиты населения Республики Казахстан от 19 июня 2018 года № 260 «Об утверждении Правил осуществления мониторинга создания рабочих мест центральными и местными исполнительными органами, ответственными за реализацию государственных и правительственных программ, предоставления сведений о создании рабочих мест»
    kaz: «Мемлекеттік және үкіметтік бағдарламаларды іске асыруға жауапты орталық және жергілікті атқарушы органдардың жұмыс орындарын құруына, жұмыс орындарын құру туралы мәліметтер ұсынуына мониторингті жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2018 жылғы 19 маусымдағы № 260 бұйрығына өзгеріс енгізу туралы
