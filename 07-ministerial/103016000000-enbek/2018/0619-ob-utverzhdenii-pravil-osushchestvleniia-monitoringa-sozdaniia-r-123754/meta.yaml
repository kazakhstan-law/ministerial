title:
  rus: Об утверждении Правил осуществления мониторинга создания рабочих мест центральными и местными исполнительными органами, ответственными за реализацию государственных и правительственных программ, предоставления сведений о создании рабочих мест
  kaz: Мемлекеттік және үкіметтік бағдарламаларды іске асыруға жауапты орталық және жергілікті атқарушы органдардың жұмыс орындарын құруына, жұмыс орындарын құру туралы мәліметтер ұсынуына мониторингті жүзеге асыру қағидаларын бекіту туралы
