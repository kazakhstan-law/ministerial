requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 16 мая 2018 года № 188. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 июня 2018 года № 17073. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 22 ноября 2021 года № 437 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
