  title:
    rus: О внесении изменений и дополнений в приказ Министра труда и социальной защиты населения Республики Казахстан от 28 января 2009 года № 29-п «Об утверждении Типового положения об участковых комиссиях»
    kaz: «Учаскелік комиссиялар туралы үлгілік ережені бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2009 жылғы 28 қаңтардағы № 29-ө бұйрығына өзгерістер мен толықтырулар енгізу туралы
