requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 28 января 2009 года № 29-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 февраля 2009 года № 5562. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 23 мая 2023 года № 167 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Типового положения об участковых комиссиях, а также критериев определения нуждаемости в государственной адресной социальной помощи по результатам обследования материального положения заявителя
  kaz: Учаскелік комиссиялар туралы үлгілік ережені, сонымен қатар өтініш берушінің материалдық жағдайын тексеру қорытындысы бойынша мемлекеттік атаулы әлеуметтік көмекке мұқтаждығын айқындау өлшемшарттарын бекіту туралы
