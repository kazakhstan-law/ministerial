  title:
    rus: О внесении изменений в приказы Министра труда и социальной защиты населения Республики Казахстан от 28 июля 2009 года № 237-п «Об утверждении Правил исчисления совокупного дохода лица (семьи), претендующего на получение государственной адресной социальной помощи» и от 10 августа 2018 года № 347 «Об утверждении форм отчетной документации в области адресной социальной помощи»
    kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің «Мемлекеттік атаулы әлеуметтік көмек алуға үміткер адамның (отбасының) жиынтық табысын есептеудің ережесін бекіту туралы» 2009 жылғы 28 шілдедегі № 237-ө және «Атаулы әлеуметтік көмек саласындағы есепті құжаттамалардың нысандарын бекіту туралы» 2018 жылғы 10 тамыздағы № 347 бұйрықтарына өзгерістер енгізу туралы
