  title:
    rus: О внесении изменений в приказ исполняющей обязанности ответственного секретаря Министерства труда и социальной защиты населения Республики Казахстан от 25 сентября 2019 года № 514 «Об утверждении квалификационных требований к административным должностям корпуса «Б» Министерства труда и социальной защиты населения Республики Казахстан»
    kaz: «Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігінің «Б» корпусы мемлекеттік әкімшілік лауазымдарына қойылатын біліктілік талаптарын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігі жауапты хатшысы міндетін атқарушының 2019 жылғы 25 қыркүйектегі № 514 бұйрығына өзгерістер енгізу туралы
