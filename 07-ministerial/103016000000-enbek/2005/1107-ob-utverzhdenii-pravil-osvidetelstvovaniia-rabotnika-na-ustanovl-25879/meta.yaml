  kaz: Еңбек (қызмет) мiндеттерiн атқарған кезде болған мертiгу немесе денсаулығының өзге зақымдалуы салдарынан еңбек қабiлетiнен айрылу дәрежесiн белгiлеуге және көмек нен күтiмнiң қосымша түрлерiне мұқтаждығын айқындауға қызметкердi куәландыру ережесiн бекiту туралы
