act_code: '8537'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 25 марта 2001 года № 17-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 марта 2001 года № 1432. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 29 декабря 2006 года № 311-П (вступает в силу с 1 января 2007 года)
title:
  rus: Об утверждении Инструкции о порядке организации назначения и выплаты пенсионных выплат, государственной базовой пенсионной выплаты, государственных социальных пособий и государственных специальных пособий из Центра
  kaz: Орталықтан төленетін зейнетақы төлемдерін, мемлекеттік базалық зейнетақы төлемдерін, мемлекеттік әлеуметтік жәрдемақылар мен мемлекеттік арнаулы жәрдемақыларды тағайындау мен төлеуді ұйымдастырудың тәртібі туралы нұсқаулықты бекіту туралы
