  title:
    rus: О внесении изменения и дополнений в приказ Министра труда и социальной защиты населения Республики Казахстан от 25 марта 2001 года № 17-п "Об утверждении Инструкции о порядке организации назначения и выплаты пенсионных выплат, государственных социальных пособий и государственных специальных пособий из Центра"
    kaz: '"Орталықтан төленетін зейнетақы төлемдерін, мемлекеттік әлеуметтік жәрдемақылар мен мемлекеттік арнаулы жәрдемақыларды тағайындау мен төлеуді ұйымдастырудың тәртібі туралы нұсқаулықты бекіту туралы" Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау Министрінің 2001 жылғы 25 наурыздағы № 17-б бұйрығына өзгеріс және толықтырулар енгізу туралы'
