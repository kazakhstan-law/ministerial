  title:
    rus: О внесении изменений и дополнений в приказ Комитета по регулированию деятельности накопительных пенсионных фондов Министерства труда и социальной защиты населения Республики Казахстан от 11 января 2000 года N 6-П "Об утверждении Инструкции о порядке представления в накопительные пенсионные фонды документов на получение пенсионных выплат или изъятие пенсионных накоплений"
    kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтiк қорғау министрлiгiнiң Жинақтаушы зейнетақы қорларының қызметiн реттеу жөнiндегi комитетiнiң "Жинақтаушы зейнетақы қорларына зейнетақы төлемдерiн алу немесе жинақталған зейнетақы қаражатын алып қою құжаттарын ұсыну тәртiбi туралы нұсқаулықты бекiту жөнiнде" 2000 жылғы 11 қаңтардағы N 6-Ө бұйрығына өзгерiстер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/13376/rus
