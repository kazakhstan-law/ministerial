title:
  rus: Об утверждении Правил представления в накопительные пенсионные фонды документов на получение пенсионных выплат или изъятие пенсионных накоплений
  kaz: '"Жинақтаушы зейнетақы қорларына зейнетақы төлемдерін алу немесе жинақталған зейнетақы қаражатын алып қою құжаттарын ұсыну Ережесiн бекіту жөнінде"'
