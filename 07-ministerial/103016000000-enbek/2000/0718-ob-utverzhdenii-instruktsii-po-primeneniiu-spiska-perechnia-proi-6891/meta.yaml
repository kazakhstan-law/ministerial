  title:
    rus: О внесении изменений и дополнений в Приказ Министра труда и социальной защиты населения Республики Казахстан от 19.07.2000 г. N 175-п "Об утверждении Инструкции по применению Списка (Перечня) производств, цехов, профессий и должностей с вредными (особо вредными) и (или) тяжелыми (особо тяжелыми), опасными (особо опасными) условиями труда, работа в которых дает право на ежегодный оплачиваемый дополнительный трудовой отпуск и сокращенную продолжительность рабочего времени"
    kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігінің "Еңбек жағдайлары зиянды (ерекше зиянды) және (немесе) ауыр (ерекше ауыр), қауiптi (ерекше қауiптi) жұмыстарда iстеген адамдарға жыл сайынғы қосымша ақылы еңбек демалысына және жұмыс уақытының ұзақтығын қысқартуға құқық беретiн өндiрiстердiң, цехтардың, кәсіптер мен қызметтердiң Тiзiмiн (Тiзбесiн) қолдану жөнiндегi Нұсқаулықты бекіту туралы" 2000 жылғы 19 шілдедегі N 175-ө бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/12166/rus
