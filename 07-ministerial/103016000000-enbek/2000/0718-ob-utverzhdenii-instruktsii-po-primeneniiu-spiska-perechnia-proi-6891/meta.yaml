  title:
    rus: О внесении изменений в Приказ Министра труда и социальной защиты населения Республики Казахстан от 19.07.2000 г. N 175-п "Об утверждении Инструкции по применению Списка (Перечня) производств, цехов, профессий и должностей с вредными (особо вредными) и (или) тяжелыми (особо тяжелыми), опасными (особо опасными) условиями труда, работа в которых дает право на ежегодный оплачиваемый дополнительный трудовой отпуск и сокращенную продолжительность рабочего времени", зарегистрирован 3 августа 2000 года N 1211
    kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтiк қорғау министрiнiң "Еңбек жағдайлары зиянды (ерекше зиянды) және (немесе) ауыр (ерекше ауыр), қауiптi (ерекше қауiптi) жұмыстарда iстеген адамдарға жыл сайынғы қосымша ақылы еңбек демалысына және жұмыс уақытының ұзақтығын қысқартуға құқық беретiн өндiрiстердiң, цехтардың, кәсiптер мен қызметтердiң Тiзiмiн (Тiзбесiн) қолдану жөнiндегi нұсқаулықты бекiту туралы" 2000 жылы 3 тамызда N 1211 тiркелген, 2000 жылғы 19 шiлдедегi N 175-ө бұйрығына өзгерiстер мен толықтырулар енгiзу туралы
