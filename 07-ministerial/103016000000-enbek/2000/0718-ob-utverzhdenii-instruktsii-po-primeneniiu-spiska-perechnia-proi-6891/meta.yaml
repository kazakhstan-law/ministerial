act_code: '6891'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 19 июля 2000 года № 175-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 августа 2000 года № 1211. Утратил силу приказом и.о. Министра труда и социальной защиты населения Республики Казахстан от 31 июля 2007 года № 182-П (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по применению Списка (Перечня) производств, цехов, профессий и должностей с вредными (особо вредными) и (или) тяжелыми (особо тяжелыми), опасными (особо опасными) условиями труда, работа в которых дает право на ежегодный оплачиваемый дополнительный трудовой отпуск и сокращенную продолжительность рабочего времени
  kaz: Еңбек жағдайлары зиянды (ерекше зиянды) және ауыр (ерекше ауыр), қауiптi ерекше қауiптi) жұмыстарда iстеген адамдарға жыл сайынғы қосымша ақылы еңбек демалысына және жұмыс уақытының ұзақтығын қысқартуға құқық беретiн өндiрiстердiң, цехтардың, кәсіптер мен қызметтердiң Тiзiмiн (Тiзбесiн) қолдану жөнiндегi Нұсқаулықты бекіту туралы
