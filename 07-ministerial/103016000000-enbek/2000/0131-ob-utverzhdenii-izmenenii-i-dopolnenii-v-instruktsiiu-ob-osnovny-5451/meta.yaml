act_code: '5451'
requisite: Приказ Комитета по регулированию деятельности накопительных пенсионных фондов Министерства труда и социальной защиты населения Республики Казахстан от 31 января 2000 г. N 9-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 февраля 2000г. N 1067. Утратил силу - постановлением Правления Национального Банка Республики Казахстан от 21 апреля 2003 года N 127 (V032316)
title:
  rus: Об утверждении изменений и дополнений в "Инструкцию об основных требованиях по формированию собственного капитала накопительных пенсионных фондов в Республике Казахстан", утвержденное приказом Национального пенсионного агентства от 27 августа 1997 года N 2-П
  kaz: Ұлттық зейнетақы агенттiгiнiң 1997 жылғы 27 тамыздағы N 2-Ө бұйрығымен бекiтiлген "Қазақстан Республикасында Жинақтаушы зейнетақы қорларының өз капиталын қалыптастырудың негізгi талаптары туралы нұсқаулыққа" өзгерiстерiн және толықтыруларын бекiту туралы
