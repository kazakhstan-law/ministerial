requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 7 апреля 2014 года № 152-Ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 апреля 2014 года № 9334. Утратил силу приказом Министра здравоохранения и социального развития Республики Казахстан от 28 октября 2014 года № 192
title:
  rus: Об утверждении квалификационных требований к административным государственным должностям корпуса "Б" Комитета по миграции Министерства труда и социальной защиты населения Республики Казахстан
  kaz: '"Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігі Көші-қон комитетінің "Б" корпусы мемлекеттік әкімшілік лауазымдарына қойылатын біліктілік талаптарын бекіту туралы'
