requisite: Приказ Директора Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 26 сентября 1997 г. N 7-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 октября 1997 г. N 386. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 31 декабря 2024 года № 512 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
