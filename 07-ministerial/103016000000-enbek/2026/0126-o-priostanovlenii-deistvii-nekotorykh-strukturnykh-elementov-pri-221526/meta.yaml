act_code: '221526'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 26 января 2026 года № 24. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 января 2026 года № 37880
title:
  rus: О приостановлении действий некоторых структурных элементов приказа Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 30 июня 2023 года № 275 «Об утверждении Правил организации субсидируемых рабочих мест и субсидирования заработной платы лиц, трудоустроенных на субсидируемые рабочие места»
  kaz: «Субсидияланатын жұмыс орындарын ұйымдастыру және субсидияланатын жұмыс орындарына жұмысқа орналасқан адамдардың жалақысын субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Еңбек және халықты әлеуметтік қорғау министрінің 2023 жылғы 30 маусымдағы № 275 бұйрығының кейбір құрылымдық элементтерінің әрекеттерін тоқтата тұру туралы
