act_code: '66063'
requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 4 мая 2012 года № 168-ө-м. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 июня 2012 года № 7706
title:
  rus: Об утверждении Правил исчисления социальной помощи в виде ежемесячных выплат гражданам Республики Казахстан после завершения периода капитализации платежей по возмещению вреда, причиненного жизни или здоровью работников юридическими лицами, ликвидированными вследствие банкротства
  kaz: Қызметкерлердің өмірі мен денсаулығына келтірілген зиянды өтеу жөніндегі төлемдерді капиталдандыру кезеңі аяқталғаннан кейін банкроттық салдарынан таратылған заңды тұлғалардың Қазақстан Республикасының азаматтарына ай сайынғы төлемдер түріндегі әлеуметтік көмекті есептеу қағидаларын бекіту туралы
