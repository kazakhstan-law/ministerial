  title:
    rus: О внесение изменений и дополнения в приказ Министра труда и социальной защиты населения Республики Казахстан от 4 мая 2012 года № 168-ө-м «Об утверждении Правил исчисления социальной помощи в виде ежемесячных выплат гражданам Республики Казахстан после завершения периода капитализации платежей по возмещению вреда, причиненного жизни или здоровью работников юридическими лицами, ликвидированными вследствие банкротства»
    kaz: «Қызметкерлердің өмірі мен денсаулығына келтірілген зиянды өтеу жөніндегі төлемдерді капиталдандыру кезеңі аяқталғаннан кейін банкроттық салдарынан таратылған заңды тұлғалардың Қазақстан Республикасының азаматтарына ай сайынғы төлемдер түріндегі әлеуметтік көмекті есептеу қағидаларын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2012 жылғы 4 мамырдағы № 168-ө-м бұйрығына өзгерістер мен толықтыру енгізу туралы
