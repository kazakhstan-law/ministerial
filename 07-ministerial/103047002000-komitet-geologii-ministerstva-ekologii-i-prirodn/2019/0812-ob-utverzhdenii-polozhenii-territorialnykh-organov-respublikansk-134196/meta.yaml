  requisite: Приказ Председателя Комитета геологии Министерства экологии, геологии и природных ресурсов Республики Казахстан от 12 апреля 2022 года № 29-НҚ. Утратил силу приказом Председателя Комитета геологии Министерства индустрии и инфраструктурного развития Республики Казахстан от 15 марта 2023 года № 11-НҚ (вводится в действие со дня его подписания)
  title:
    rus: О внесении изменений в приказ Председателя Комитета геологии Министерства экологии, геологии и природных ресурсов Республики Казахстан от 12 августа 2019 года № 68-ОД «Об утверждении положений территориальных органов республиканского государственного учреждения Комитета геологии Министерства экологии, геологии и природных ресурсов Республики Казахстан»
    kaz: «Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігі Геология комитеті мемлекеттік мекемесінің аумақтық органдарының ережелерін бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің Геология комитеті төрағасаның 2019 жылғы 12 тамыздағы № 68-НҚ бұйрығына өзгерістер енгізу туралы
