act_code: '134196'
requisite: Приказ Председателя Комитета геологии Министерства экологии, геологии и природных ресурсов Республики Казахстан от 12 августа 2019 года № 68-ОД. Утратил силу приказом Председателя Комитета геологии Министерства индустрии и инфраструктурного развития Республики Казахстан от 15 марта 2023 года № 11-НҚ (вводится в действие со дня его подписания)
title:
  rus: Об утверждении положений территориальных органов республиканского государственного учреждения Комитета геологии Министерства экологии, геологии и природных ресурсов Республики Казахстан
