requisite: Приказ Председателя Агентства Республики Казахстан по защите конкуренции (Антимонопольное агентство) от 14 ноября 2012 года N 443-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 декабря 2012 года № 8176. Утратил силу приказом Министра национальной экономики Республики Казахстан от 24 февраля 2017 № 78
title:
  rus: Об утверждении формы ежеквартальной информации по монопольным видам продукции, об объемах производства и реализации, отпускных ценах и уровне доходности реализуемых монопольных товаров и инструкции по ее заполнению
  kaz: Өнімнің монополиялық түрлері бойынша өндіру мен өткізу көлемдері, өткізілетін монополиялық тауарлардың босатылу бағалары мен табыстылық деңгейі туралы тоқсан сайынғы ақпараттың нысанын және оны толтыру бойынша нұсқаулықты бекіту туралы
