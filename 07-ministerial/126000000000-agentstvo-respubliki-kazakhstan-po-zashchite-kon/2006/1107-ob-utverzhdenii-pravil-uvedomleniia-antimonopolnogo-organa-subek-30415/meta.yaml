requisite: Приказ Председателя Комитета по защите конкуренции Министерства индустрии и торговли Республики Казахстан от 7 ноября 2006 года N 251-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 ноября 2006 года N 4464. Утратил силу - приказом И.о. Председателя Комитета по защите конкуренции Министерства индустрии и торговли Республики Казахстан от 29 августа 2007 года N 277-ОД.
title:
  rus: Об утверждении Правил уведомления антимонопольного органа субъектами рынка, включенными в Государственный реестр субъектов рынка, занимающих доминирующее (монопольное) положение на соответствующем товарном рынке, о предстоящем повышении цен на товары (работы, услуги)
  kaz: Тауарларға (жұмыстарға, қызметтерге) бағаны алдағы көтеру туралы тиісті тауар нарығындағы басым (монополиялық) жағдайға ие нарық субъектілерінің мемлекеттік тізіліміне енгізілген нарық субъектілерінің монополияға қарсы органды хабарландыру ережесін бекіту туралы
