  title:
    rus: О внесении изменений в приказ Начальника Службы государственной охраны Республики Казахстан от 19 ноября 2014 года № 142дсп «Об утверждении Инструкции по применению Правил передачи, реализации, утилизации и списания имущества, а также предоставления в имущественный наем (аренду) недвижимого имущества специальных государственных органов Республики Казахстан»
    kaz: «Қазақстан Республикасы арнаулы мемлекеттік органдарының мүліктерін беру, өткізу, кәдеге жарату және есептен шығару, сондай-ақ жылжымайтын мүлкін мүліктік жалдауға (жалға алуға) беру қағидаларын қолдану жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Мемлекеттік күзет қызметі бастығының 2014 жылғы 19 қарашадағы № 142қбп бұйрығына өзгерістер енгізу туралы
