title:
  rus: Об утверждении Инструкции по применению Правил передачи, реализации, утилизации и списания имущества, а также предоставления в имущественный наем (аренду) недвижимого имущества специальных государственных органов Республики Казахстан
  kaz: Қазақстан Республикасы арнаулы мемлекеттік органдарының мүліктерін беру, өткізу, кәдеге жарату және есептен шығару, сондай-ақ жылжымайтын мүлкін мүліктік жалдауға беру (жалға алу) қағидаларын қолдану жөніндегі нұсқаулықты бекіту туралы
