title:
  rus: Об утверждении Правил денежного обеспечения и определения стажа службы (работы) для исчисления должностных окладов и пособий для оздоровления сотрудников Службы государственной охраны Республике Казахстан, в том числе прикомандированных к международным организациям
  kaz: Қазақстан Республикасы Мемлекеттік күзет қызметінің қызметкерлерін, соның ішінде халықаралық ұйымдарға іссапарға жіберілгендерді ақшалай қамтамасыз ету және лауазымдық жалақылары мен сауықтыруға арналған жәрдемақысын есептеу үшін қызмет (жұмыс) өтілін анықтау қағидаларын бекіту туралы
