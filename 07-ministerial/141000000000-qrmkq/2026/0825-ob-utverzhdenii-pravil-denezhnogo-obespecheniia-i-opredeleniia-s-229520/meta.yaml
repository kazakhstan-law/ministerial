  title:
    rus: О внесении изменений в приказ Начальника Службы государственной охраны Республики Казахстан от 25 августа 2026 года № 11-261 дсп «Об утверждении Правил денежного обеспечения и определения стажа службы (работы) для исчисления должностных окладов и пособий для оздоровления сотрудников Службы государственной охраны Республики Казахстан, в том числе прикомандированных к международным организациям»
    kaz: «Қазақстан Республикасы Мемлекеттік күзет қызметі қызметкерлерінің, соның ішінде халықаралық ұйымдарға іссапарға жіберілгендердің лауазымдық жалақылары мен сауықтыру жәрдемақыларын есептеу үшін ақшалай қамтамасыз ету және қызмет (жұмыс) өтілін анықтау қағидаларын бекіту туралы» Қазақстан Республикасы Мемлекеттік күзет қызметі Бастығының 2026 жылғы 25 тамыздағы № 11-261 қбп бұйрығына өзгерістер енгізу туралы
