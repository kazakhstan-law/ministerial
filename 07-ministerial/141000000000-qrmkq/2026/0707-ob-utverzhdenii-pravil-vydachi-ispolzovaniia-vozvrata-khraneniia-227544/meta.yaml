title:
  rus: Об утверждении Правил выдачи, использования, возврата, хранения, учета и уничтожения служебных удостоверений, жетонов сотрудников Службы государственной охраны Республики Казахстан, а также их описания и образцов
  kaz: Қазақстан Республикасы Мемлекеттік күзет қызметі қызметкерлерінің қызметтік куәліктерін, жетондарын беру, пайдалану, қайтару, сақтау, есепке алу және жою қағидаларын, сондай-ақ олардың сипаттамасы мен үлгілерін бекіту туралы
