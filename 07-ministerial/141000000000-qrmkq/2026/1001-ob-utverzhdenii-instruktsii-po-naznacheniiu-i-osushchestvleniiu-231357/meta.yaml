act_code: '231357'
requisite: Приказ Начальника Службы государственной охраны Республики Казахстан от 1 октября 2026 года № 11-197. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 октября 2026 года № 40123
title:
  rus: Об утверждении Инструкции по назначению и осуществлению пенсионных выплат за выслугу лет сотрудникам и военнослужащим Службы государственной охраны Республики Казахстан, единовременной выплаты (компенсации) на погребение и единовременного пособия членам семьи умершего получателя пенсионных выплат из числа сотрудников и военнослужащих Службы государственной охраны Республики Казахстан
  kaz: Қазақстан Республикасы Мемлекеттік күзет қызметінің қызметкерлері мен әскери қызметшілеріне еңбек сіңірген жылдары үшін зейнетақы төлемдерін тағайындау және жүзеге асыру, Қазақстан Республикасы Мемлекеттік күзет қызметінің қызметкерлері мен әскери қызметшілері қатарынан қайтыс болған зейнетақы төлемдерін алушыны жерлеуге арналған біржолғы төлемді (өтемақыны) және оның отбасы мүшелеріне берілетін біржолғы жәрдемақыны тағайындау жөніндегі нұсқаулықты бекіту туралы
