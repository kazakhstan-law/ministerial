title:
  rus: Об утверждении Инструкции по согласованию производства всех видов ремонтных, строительных, монтажных и иных работ на специальных трассах и прилегающих к ним территориях и акваториях при проведении охранных мероприятий
  kaz: Күзет іс-шараларын жүргізу кезінде арнайы трассалардағы және оларға іргелес жатқан аумақтар мен акваториялардағы жөндеу, құрылыс, монтаж және өзге де жұмыстардың барлық түрлерінің жүргізілуін келісу бойынша нұсқаулықты бекіту туралы
