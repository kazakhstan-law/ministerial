  title:
    rus: О внесении изменений в приказ Начальника Службы государственной охраны Республики Казахстан от 25 марта 2015 года № 47 "Об утверждении Инструкции по согласованию производства всех видов ремонтных, строительных, монтажных и иных работ на специальных трассах и прилагающих к ним территориях и акваториях при проведении охранных мероприятий"
    kaz: '"Күзет іс-шараларын өткізу кезінде арнаулы трассаларда және оларға іргелес аумақтарда, су айдындарында жөндеу, құрылыс, монтаж және басқа да жұмыстардың барлық түрлерінің өндірісін келісу жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Мемлекеттік күзет қызметі бастығының 2015 жылғы 25 наурыздағы № 47 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/102102/rus
