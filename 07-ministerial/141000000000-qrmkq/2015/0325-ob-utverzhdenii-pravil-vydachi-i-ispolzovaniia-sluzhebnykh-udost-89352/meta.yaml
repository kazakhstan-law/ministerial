title:
  rus: Об утверждении Правил выдачи и использования служебных удостоверений сотрудников и военнослужащих Службы государственной охраны Республики Казахстан и жетонов, описания служебных удостоверений и образцов жетонов
  kaz: Қазақстан Республикасы Мемлекеттік күзет қызметі қызметкерлерінің және әскери қызметшілерінің қызметтік куәліктері мен жетондарын беру және пайдалану қағидаларын, қызметтік куәліктер мен жетондар үлгілерінің сипаттамасын бекіту туралы
