  title:
    rus: О внесении изменений в приказ Начальника Службы государственной охраны Республики Казахстан от 25 марта 2015 года № 37 дсп «Об утверждении Правил выдачи и использования служебных удостоверений сотрудников и военнослужащих Службы государственной охраны Республики Казахстан и жетонов, описания служебных удостоверений и образцов жетонов»
    kaz: «Қазақстан Республикасы Мемлекеттік күзет қызметі қызметкерлерінің және әскери қызметшілерінің қызметтік куәліктері мен жетондарын беру және пайдалану қағидаларын, қызметтік куәліктер мен жетондар үлгілерінің сипаттамасын бекіту туралы» Қазақстан Республикасы Мемлекеттік күзет қызметі Бастығының 2015 жылғы 25 наурыздағы № 37 қбп бұйрығына өзгерістер енгізу туралы
