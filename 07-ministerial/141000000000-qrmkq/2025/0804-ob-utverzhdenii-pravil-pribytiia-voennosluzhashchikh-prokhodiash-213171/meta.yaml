  title:
    rus: О внесении изменений в приказ Начальника Службы государственной охраны Республики Казахстан от 4 августа 2025 года № 11-242 дсп «Об утверждении Правил прибытия военнослужащих, проходящих воинскую службу в резерве в воинские части Службы государственной охраны Республики Казахстан в случае объявления сборов при кризисных ситуациях»
    kaz: «Қазақстан Республикасы Мемлекеттік күзет қызметінің әскери бөлімдерінде резервтегі әскери қызметшілердің дағдарыстық ахуал кезіндегі жиындар жарияланған жағдайда келу қағидаларын бекіту туралы» Қазақстан Республикасы Мемлекеттік күзет қызметі бастығының 2025 жылы 4 тамыздағы № 11-242 қбп бұйрығына өзгерістер енгізу туралы
