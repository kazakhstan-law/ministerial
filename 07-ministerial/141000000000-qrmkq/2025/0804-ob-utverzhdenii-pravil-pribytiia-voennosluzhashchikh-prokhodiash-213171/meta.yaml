title:
  rus: Об утверждении Правил прибытия военнослужащих, проходящих воинскую службу в резерве в воинские части Службу государственной охраны Республики Казахстан в случае объявления сборов при кризисных ситуациях
  kaz: Қазақстан Республикасы Мемлекеттік күзет қызметінің әскери бөлімдерінде резервтегі әскери қызметті өткеріп жүрген әскери қызметшілердің дағдарыстық ахуал кезіндегі жиындар жарияланған жағдайда келу қағидаларын бекіту туралы
