act_code: '193798'
requisite: Приказ Начальника Службы государственной охраны Республики Казахстан от 28 февраля 2024 года № 11-39. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 февраля 2024 года № 34068
title:
  rus: Об утверждении Правил возмещения расходов, связанных с подготовкой к перевозке тела, перевозкой тела, погребением сотрудников Службы государственной охраны Республики Казахстан, погибших при прохождении службы или умерших в результате увечья (ранения, травмы, контузии), заболевания, изготовлением и установкой надгробного памятника
  kaz: Қызмет өткеру кезінде қаза тапқан немесе мертігу (жаралану, жарақат алу, контузия), ауруы салдарынан қайтыс болған Қазақстан Республикасы Мемлекеттік күзет қызметі қызметкерлерінің мәйіттерін жеткізуді әзірлеуге, мәйіттерін жеткізуге, жерлеуге, құлпытас дайындауға және оны орнатуға байланысты шығыстарды өтеу қағидаларын бекіту туралы
