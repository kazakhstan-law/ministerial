requisite: Приказ Начальника Службы государственной охраны Республики Казахстан от 27 февраля 2024 года № 11-65дсп
title:
  rus: Об утверждении Правил возложения на сотрудника Службы государственной охраны Республики Казахстан временного исполнения обязанностей по вакантной (незанятой) должности подлежащей замещению высшим офицерским составом
  kaz: Қазақстан Республикасы Мемлекеттік күзет қызметінің қызметкеріне жоғары офицерлік құрам алмастыруға тиісті бос (тағайындалмаған) лауазым бойынша міндеттерді уақытша атқаруды жүктеу қағидаларын бекіту туралы
