title:
  rus: Об утверждении Правил применения беспилотных воздушных судов при подготовке и проведении охранных мероприятий, а также для пресечения нарушения использования воздушного пространства в зоне проведения охранных мероприятий или над территорией охраняемых объектов
  kaz: Күзет іс-шараларын дайындау және өткізу кезінде, сондай-ақ күзет іс-шаралары аймағында немесе күзетілетін объектілер аумағында әуе кеңістігін пайдалануды бұзудың жолын кесу кезінде пилотсыз әуе кемерлерін пайдалану қағидаларын бекіту туралы
