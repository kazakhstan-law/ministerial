title:
  rus: Об утверждении Правил выплаты денежной компенсации при отсутствии возможности обеспечения питанием по установленным нормам продовольственного пайка отдельным категориям сотрудников Службы государственной охраны Республики Казахстан
  kaz: Қазақстан Республикасы Мемлекеттік күзет қызметі қызметкерлерінің жекелеген санаттарына азық-түлік үлесінің белгіленген нормалары бойынша тамақпен қамтамасыз ету мүмкіндігі болмаған кезде ақшалай өтемақы төлеу қағидаларын бекіту туралы
