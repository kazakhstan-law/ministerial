act_code: '183914'
requisite: Приказ Начальника Службы государственной охраны Республики Казахстан от 30 июня 2023 года № 11-257дсп. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 июля 2023 года № 33066
title:
  rus: Об утверждении Правил возмещения ущерба, причиненного здоровью и имуществу сотрудника, военнослужащего Службы государственной охраны Республики Казахстан, а также ущерба, причиненного здоровью и имуществу, членов семьи и близких родственников сотрудника, военнослужащего Службы государственной охраны Республики Казахстан в связи с выполнением им служебных обязанностей
  kaz: Қазақстан Республикасы Мемлекеттік күзет қызметі қызметкерлерінің, әскери қызметшісінің денсаулығы мен мүлкіне келтірілген залалды, сондай-ақ Қазақстан Республикасы Мемлекеттік күзет қызметі қызметкерлерінің, әскери қызметшісінің қызметтік міндеттерін орындауына байланысты отбасы мүшелері мен жақын туыстарының денсаулығына және мүлкіне келтірілген залалды өтеу қағидаларын бекіту туралы
