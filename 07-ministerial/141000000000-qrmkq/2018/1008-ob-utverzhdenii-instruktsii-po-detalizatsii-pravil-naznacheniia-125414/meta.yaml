  title:
    rus: О внесении изменений в приказ Начальника Службы государственной охраны Республики Казахстан № 11-238 дсп от 8 октября 2018 года «Об утверждении Инструкции по детализации Правил назначения и осуществления пенсионных выплат военнослужащим, сотрудникам специальных государственных и правоохранительных органов, государственной фельдъегерской службы, а также лицам, права которых иметь специальные звания, классные чины и носить форменную одежду упразднены с 1 января 2012 года»
    kaz: «Әскери қызметшілерге, арнаулы мемлекеттік фельдъегерлік қызмет қызметкерлеріне, сондай-ақ арнаулы атақтар, сыныптық шендер алу және нысанды киім киіп жүру құқықтары 2012 жылғы 1 қантардан бастап жойылған адамдарға зейнетақы төлемдерін тағайындау және оларды жүзеге асыру қағидаларын ңақтылау жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Мемлекеттік күзет қызметі Бастығының 2018 жылғы 8 қазандағы № 11-238 қбп бұйрығына өзгірістер енгізу туралы
