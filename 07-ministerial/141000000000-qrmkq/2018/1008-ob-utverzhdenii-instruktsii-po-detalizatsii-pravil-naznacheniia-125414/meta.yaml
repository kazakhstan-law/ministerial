act_code: '125414'
requisite: Приказ Начальника Службы государственной охраны Республики Казахстан от 8 октября 2018 года № 11-238 дсп. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 октября 2018 года № 17601
title:
  rus: Об утверждении Инструкции по детализации Правил назначения и осуществления пенсионных выплат военнослужащим, сотрудникам специальных государственных и правоохранительных органов, государственной фельдъегерской службы, а также лицам, права которых иметь специальные звания, классные чины и носить форменную одежду упразднены с 1 января 2012 года
  kaz: Әскери қызметшілерге, арнаулы мемлекеттік және құқық қорғау органдары, мемлекеттік фельдъегерлік қызмет қызметкерлеріне, сондай-ақ арнаулы атақтар, сыныптық шендер алу және нысанды киім киіп жүру құқықтары 2012 жылғы 1 қаңтардан бастап жойылған адамдарға зейнетақы төлемдерін тағайындау және оларды жүзеге асыру қағидаларын қағидаларының нақтылау жөніндегі Нұсқаулықты бекіту туралы
