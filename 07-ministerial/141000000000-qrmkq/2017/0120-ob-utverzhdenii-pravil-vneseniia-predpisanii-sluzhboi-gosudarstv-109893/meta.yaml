title:
  rus: Об утверждении Правил внесения предписаний Службой государственной охраны Республики Казахстан об устранении обстоятельств, способствующих совершению правонарушений, посягающих на жизнь, здоровье, права, свободы, личное достоинство и собственность охраняемых лиц
  kaz: Күзетілетін адамдардың өміріне, денсаулығына, құқығына бостандығына, жеке қадір-қасиетіне және меншігіне қол сұғылатын құқық бұзушылықтарды жасауға ықпал ететін жағдайларды жою туралы Қазақстан Республикасы Мемлекеттік күзет қызметінің нұсқамаларын еңгізу қағидаларын бекіту туралы
