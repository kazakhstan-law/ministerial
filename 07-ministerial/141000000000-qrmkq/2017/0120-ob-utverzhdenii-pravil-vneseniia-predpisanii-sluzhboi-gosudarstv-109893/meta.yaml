  title:
    rus: О внесении изменений в приказ Начальника Службы государственной охраны Республики Казахстан от 20 января 2017 года № 11-11 дсп «Об утверждении Правил внесения предписаний Службой государственной охраны Республики Казахстан об устранении обстоятельств, способствующих совершению правонарушений, посягающих на жизнь, здоровье, права, свободы, личное достоинство и собственность охраняемых лиц»
    kaz: «Күзетілетін адамдардың өміріне, денсаулығына, құқығына, бостандығына, жеке басының қадір-қасиетіне және меншігіне қол сұғатын құқық бұзушылықтың жасалуына итермелейтін жағдаяттарды жою туралы Қазақстан Республикасы Мемлекеттік күзет қызметінің нұсқамаларын енгізу қағидасын бекіту туралы» Қазақстан Республикасы Мемлекеттік күзет қызметі Бастығының 2017 жылғы 20 қаңтардағы № 11-11 қбп бұйрығына өзгерістер енгізу туралы
