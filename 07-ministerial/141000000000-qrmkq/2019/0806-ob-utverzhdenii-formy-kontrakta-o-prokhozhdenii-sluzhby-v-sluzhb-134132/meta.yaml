title:
  rus: Об утверждении формы контракта о прохождении службы в Службе государственной охраны Республики Казахстан и Правил заключения, продления, изменения, расторжения и прекращения контракта о прохождении службы в Службе государственной охраны Республики Казахстан
  kaz: Қазақстан Республикасы Мемлекеттік күзет қызметінде қызмет өткеру туралы келісімшарттың нысанын және Қазақстан Республикасы Мемлекеттік күзет қызметінде қызмет өткеру туралы келісімшартты жасасу, ұзарту, өзгерту, бұзу және тоқтату қағидасын бекіту туралы
