  title:
    rus: О внесении изменений в приказ Начальника Службы государственной охраны Республики Казахстан от 6 августа 2019 года № 11-194 дсп «Об утверждении формы контракта о прохождении службы в Службе государственной охраны Республики Казахстан и Правил заключения, продления, изменения, расторжения и прекращения контракта о прохождении службы в Службе государственной охраны Республики Казахстан»
    kaz: «Қазақстан Республикасы Мемлекеттік күзет қызметінде қызмет өткеру туралы келісімшарттың нысанын және Қазақстан Республикасы Мемлекеттік күзет қызметінде қызмет өткеру туралы келісімшартты жасасу, ұзарту, өзгерту, бұзу және тоқтату қағидасын бекіту туралы» Қазақстан Республикасы Мемлекеттік күзет қызметі бастығының 2019 жылғы 6 тамыздағы № 11-194 қбп бұйрығына өзгерістер енгізу туралы
