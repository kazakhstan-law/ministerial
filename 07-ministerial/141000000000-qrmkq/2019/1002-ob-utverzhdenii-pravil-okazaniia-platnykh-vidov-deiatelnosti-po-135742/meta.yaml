  title:
    rus: О внесении изменений в приказ Начальника Службы государственной охраны Республики Казахстан от 2 октября 2019 года № 11-240 дсп «Об утверждении Правил оказания платных видов деятельности по реализации услуг государственными учреждениями Службы государственной охраны Республики Казахстан по оказанию медицинской помощи в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования ими денег от реализации услуг»
    kaz: «Қазақстан Республикасы Мемлекеттік күзет қызметі мемлекеттік мекемелерінің тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмек көрсету бойынша ақылы қызмет түрлерін сату жөніндегі қызметті лөрсету және олардың көрсетілетін қызметтерді сатудан түсетін ақшаны жұмсау қағидаларын бекіту туралы» Қазақстан Республикасы Мемлекеттік күзет қызметі Бастығының 2019 жылғы 2 қазандағы № 11-240 қбп бұйрығына өзгерістер енгізу туралы
