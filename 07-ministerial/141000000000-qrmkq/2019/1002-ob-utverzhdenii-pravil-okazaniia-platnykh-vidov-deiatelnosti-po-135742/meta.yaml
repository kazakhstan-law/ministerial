act_code: '135742'
requisite: Приказ Начальника Службы государственной охраны Республики Казахстан от 2 октября 2019 года № 11-240дсп. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 октября 2019 года № 19525
title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации услуг государственными учреждениями Службы государственной охраны Республики Казахстан по оказанию медицинской помощи в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования и расходования ими денег от реализации услуг
  kaz: Қазақстан Республикасы Мемлекеттік күзет қызметі мемлекеттік мекемелерінің тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмек көрсету бойынша ақылы қызмет түрлерін сату жөніндегі қызметті көрсету және олардың көрсетілетін қызметтерді сатудан түсетін ақшаны жұмсау қағидаларын бекіту туралы
