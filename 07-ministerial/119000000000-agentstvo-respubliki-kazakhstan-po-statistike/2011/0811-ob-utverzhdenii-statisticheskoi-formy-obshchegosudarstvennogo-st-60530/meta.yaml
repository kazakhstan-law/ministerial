title:
  rus: Об утверждении статистической формы общегосударственного статистического наблюдения "Отчет о сети, кадрах и деятельности в организациях здравоохранения" (код 7011104, индекс 1-здрав, периодичность годовая) и инструкции по ее заполнению
  kaz: '"Денсаулық сақтау ұйымдарының желілері, кадрлары және қызметі туралы есеп" (коды 7011104, индексі 1-денсаулық, кезеңділігі жылдық) жалпымемлекеттік статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы'
