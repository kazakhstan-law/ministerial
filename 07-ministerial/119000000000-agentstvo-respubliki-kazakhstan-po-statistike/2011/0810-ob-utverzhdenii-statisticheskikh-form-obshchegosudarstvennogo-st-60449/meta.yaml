    kaz: Қазақстан Республикасы Статистика агенттігі төрағасының 2012 жылғы 1 қарашадағы № 303 "Еңбек және халықтың жұмыспен қамтылуы статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы" бұйрығына өзгерістер енгізу туралы
