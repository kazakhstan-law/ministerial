requisite: Приказ Председателя Агентства Республики Казахстан по статистике от 15 марта 2011 года № 73. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 апреля 2011 года № 6904. Утратил силу приказом Председателя Агентства Республики Казахстан по статистике от 14 марта 2012 года № 75
title:
  rus: Об утверждении статистической формы ведомственного статистического наблюдения "Отчет о сети, кадрах и деятельности в здравоохранении" (код 7011204, индекс 1-здрав, периодичность годовая) и инструкции по ее заполнению, разработанных Министерством здравоохранения Республики Казахстан
  kaz: Қазақстан Республикасы Денсаулық сақтау министрлігі әзірлеген "Денсаулық сақтау желілері, кадрлары және қызметі туралы есеп (коды 7011204, индексі 1-денсаулық, кезеңділігі жылдық) ведомстволық статистикалық байқаудың статистикалық нысанын және оны толтыру жөніндегі нұсқаулықты бекіту туралы"
