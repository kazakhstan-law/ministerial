requisite: Приказ и.о. Председателя Агентства Республики Казахстан по статистике от 26 декабря 2011 года № 382. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 февраля 2012 года № 7427. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 30 июня 2015 года № 100
title:
  rus: Об утверждении статистической формы "Отчет о беженцах" (код 7291203, индекс 8-М, периодичность полугодовая) ведомственного статистического наблюдения и инструкции по ее заполнению, разработанных Комитетом миграционной полиции Министерства внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасының Ішкі істер министрлігі Көші-қон полициясы комитеті әзірлеген "Босқындар туралы есеп" (коды 7291203, индексі 8-КҚ, кезеңділігі жартыжылдық) ведомстволық статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы
