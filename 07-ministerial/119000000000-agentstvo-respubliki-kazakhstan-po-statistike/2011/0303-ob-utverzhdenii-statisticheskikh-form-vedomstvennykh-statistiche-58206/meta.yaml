    kaz: «Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігі әзірлеген ведомстволық статистикалық байқау бойынша статистикалық нысан мен оны толтыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Статистика агенттігі төрағасының 2011 жылғы 3 наурыздағы № 60 бұйрығына өзгерістер енгізу туралы
