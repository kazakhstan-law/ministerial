act_code: '67661'
requisite: Приказ Председателя Агентства Республики Казахстан по статистике от 6 сентября 2012 года № 254. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 сентября 2012 года № 7922. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 31 мая 2016 года № 100
title:
  rus: Об утверждении статистической формы общегосударственного статистического наблюдения "Анкета по социально-статистическому обследованию населения по уровню преступности и фиксации его результатов" (код 1962105, индекс УП-01, периодичность единовременная) и инструкции по ее заполнению
  kaz: '"Халықты қылмыстылық деңгейі және оның нәтижелерінің тіркелуі бойынша әлеуметтік-статистикалық зерттеу туралы сауалнама" (коды 1962105, индексі ҚД-01, кезеңділігі біржолғы) жалпымемлекеттік статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы'
