act_code: '69307'
requisite: Приказ Председателя Агентства Республики Казахстан по статистике от 1 ноября 2012 года № 304. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 декабря 2012 года № 8162. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 14 ноября 2014 года № 50
title:
  rus: Об утверждении статистической формы общегосударственного статистического наблюдения "Приложение к статистической форме 1-ПФ "Отчет о финансово-хозяйственной деятельности предприятия" (код 1971104, индекс приложение к статистической форме 1-ПФ, периодичность годовая) и инструкции по ее заполнению
  kaz: '"Кәсіпорындардың қаржы-шаруашылық қызметі туралы есеп" 1-ӨҚ статистикалық нысанына қосымша" (коды 1971104, индексі 1-ӨҚ статистикалық нысанына қосымша", кезеңділігі жылдық) жалпымемлекеттік статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы'
