requisite: Приказ Председателя Агентства Республики Казахстан по статистике от 10 января 2012 года № 9. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 апреля 2012 года № 7500. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 22 сентября 2016 года № 215
title:
