act_code: '69105'
requisite: Приказ Председателя Агентства Республики Казахстан по статистике от 15 октября 2012 года № 283. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 декабря 2012 года № 8158. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 24 ноября 2021 года № 36 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении статистических форм ведомственных статистических наблюдений и инструкций по их заполнению, разработанных Национальным Банком Республики Казахстан
  kaz: Қазақстан Республикасының Ұлттық Банкі әзірлеген ведомстволық статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы
