requisite: Приказ Председателя Агентства Республики Казахстан по статистике от 12 июля 2012 года № 181. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 августа 2012 года № 7884. Утратил силу приказом и.о. Председателя Агентства Республики Казахстан по статистике от 22 июля 2013 года № 158
title:
  rus: Об утверждении статистической формы общегосударственного статистического наблюдения "Отчет о ценах и объемах закупа и реализации социально-значимых продовольственных товаров стабилизационных фондов" (код 2031101, индекс 1-СФ, периодичность месячная) и инструкции по ее заполнению
  kaz: '"Тұрақтандыру қорларының әлеуметтік маңызы бар азық-түлік тауарларын сатып алу және өткізу бағасы мен көлемі туралы есеп" (коды 2031101, индексі 1-ТҚ, кезеңділігі айлық) жалпымемлекеттік статистикалық байқаудың статистикалық нысанын және оны толтыру жөніндегі нұсқаулықты бекіту туралы'
