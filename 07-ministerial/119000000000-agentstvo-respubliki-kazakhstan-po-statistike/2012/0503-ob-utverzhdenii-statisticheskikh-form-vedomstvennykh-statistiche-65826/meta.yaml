requisite: Приказ Председателя Агентства Республики Казахстан по статистике от 3 мая 2012 года № 104. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 июня 2012 года № 7691. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 3 февраля 2017 года № 26 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
