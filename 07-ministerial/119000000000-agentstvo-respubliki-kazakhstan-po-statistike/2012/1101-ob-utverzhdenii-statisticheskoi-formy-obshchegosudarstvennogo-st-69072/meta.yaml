requisite: Приказ Председателя Агентства Республики Казахстан по статистике от 1 ноября 2012 года № 302. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 декабря 2012 года № 8126. Утратил силу приказом Министра национальной экономики Республики Казахстан от 27 мая 2016 года № 223
title:
  rus: Об утверждении статистической формы общегосударственного статистического наблюдения "Отчет о численности и потребности в кадрах крупных и средних предприятий" (код 1941110, индекс 1-Т (вакансия), периодичность один раз в год) и инструкции по ее заполнению"
  kaz: '"Ірі және орта кәсіпорындардағы кадрларға қажеттілік және саны туралы есеп" (коды 1941110, индексі 1-E (бос жұмыс орны), кезеңділігі жылына бір рет)" жалпымемлекеттік статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы'
