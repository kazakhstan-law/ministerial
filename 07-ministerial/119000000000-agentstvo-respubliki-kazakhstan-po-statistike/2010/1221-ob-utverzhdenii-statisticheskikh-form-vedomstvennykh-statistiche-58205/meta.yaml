  title:
    rus: О внесении изменений в приказ исполняющего обязанности Председателя Агентства Республики Казахстан по статистике от 21 декабря 2010 года № 351 «Об утверждении статистических форм ведомственных статистических наблюдений, разработанных Национальным Банком Республики Казахстан и инструкций по их заполнению»
    kaz: «Қазақстан Республикасының Ұлттық Банкі әзірлеген ведомстволық статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Статистика агенттігі төрағасының міндетін атқарушының 2010 жылғы 21 желтоқсандағы № 351 бұйрығына өзгерістер енгізу туралы
