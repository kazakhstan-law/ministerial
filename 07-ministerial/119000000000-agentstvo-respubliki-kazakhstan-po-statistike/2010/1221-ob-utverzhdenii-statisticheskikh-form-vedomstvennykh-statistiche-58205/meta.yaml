  requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 2 декабря 2016 года № 297. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 января 2017 года № 14687. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 24 ноября 2021 года № 36 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Председателя Агентства Республики Казахстан по статистике от 21 декабря 2010 года № 351 «Об утверждении статистических форм ведомственных статистических наблюдений и инструкций по их заполнению разработанных Национальным Банком Республики Казахстан»
    kaz: «Қазақстан Республикасының Ұлттық Банкі әзірлеген ведомстволық статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Статистика агенттігі төрағасының міндетін атқарушының 2010 жылғы 21 желтоқсандағы № 351 бұйрығына өзгерістер енгізу туралы
