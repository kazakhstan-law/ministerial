act_code: '58205'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по статистике от 21 декабря 2010 года № 351. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 апреля 2011 года № 6863. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 24 ноября 2021 года № 36 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении статистических форм ведомственных статистических наблюдений, разработанных Национальным Банком Республики Казахстан и инструкций по их заполнению
  kaz: Қазақстан Республикасының Ұлттық Банкі әзірлеген ведомстволық статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы
