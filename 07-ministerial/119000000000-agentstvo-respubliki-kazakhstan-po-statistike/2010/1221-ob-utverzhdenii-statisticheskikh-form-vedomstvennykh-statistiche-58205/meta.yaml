  requisite: Приказ Председателя Агентства Республики Казахстан по статистике от 28 ноября 2012 года № 325. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 декабря 2012 года № 8172. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 24 ноября 2021 года № 36 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Председателя Агентства Республики Казахстан по статистике от 21 декабря 2010 года № 351 "Об утверждении статистических форм и инструкций по их заполнению ведомственных статистических наблюдений, разработанных Национальным Банком Республики Казахстан"
    kaz: '"Қазақстан Республикасының Ұлттық Банкі әзірлеген ведомстволық статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы" Қазақстан Республикасы Статистика агенттігі төрағасының міндетін атқарушының 2010 жылғы 21 желтоқсандағы № 351 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
