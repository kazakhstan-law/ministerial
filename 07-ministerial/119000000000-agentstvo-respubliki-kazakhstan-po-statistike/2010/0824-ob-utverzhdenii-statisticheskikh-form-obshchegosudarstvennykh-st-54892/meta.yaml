    kaz: Қазақстан Республикасы Статистика агенттігі төрағасының міндетін атқарушының 2010 жылғы 24 тамыздағы № 232 "Байланыс статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы" бұйрығына өзгерістер енгізу туралы
