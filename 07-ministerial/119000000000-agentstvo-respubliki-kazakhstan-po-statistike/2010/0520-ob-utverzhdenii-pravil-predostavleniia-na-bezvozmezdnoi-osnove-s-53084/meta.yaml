  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по статистике от 20 мая 2010 года № 113 "Об утверждении Правил предоставления на безвозмездной основе статистической информации, не предусмотренной графиком распространения официальной статистической информации и разработанной на основании первичных статистических данных, представляемых респондентами в соответствии с графиком представления респондентами первичных статистических данных"
    kaz: '"Ресми статистикалық ақпаратты тарату кестесінде көзделмеген және респонденттердің алғашқы статистикалық деректерді ұсыну графигіне сәйкес респонденттер ұсынатын алғашқы статистикалық деректердің негізінде әзірленген статистикалық ақпаратты өтеусіз негізде ұсыну ережесін бекіту туралы" Қазақстан Республикасы Статистика агенттігі төрағасының 2010 жылғы 20 мамырдағы № 113 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/103942/rus
