  title:
    rus: О внесении изменения в приказ Председателя Агентства Республики Казахстан по статистике от 20 мая 2010 года № 113 «Об утверждении Правил предоставления на безвозмездной основе статистической информации, не предусмотренной графиком распространения официальной статистической информации и разработанной на основании первичных статистических данных, представляемых респондентами в соответствии с графиком представления респондентами первичных статистических данных»
    kaz: «Ресми статистикалық ақпаратты тарату графигінде көзделмеген және респонденттердің алғашқы статистикалық деректерді ұсыну графигіне сәйкес респонденттер ұсынатын алғашқы статистикалық деректер негізінде әзірленген статистикалық ақпаратты өтеусіз негізде беру қағидаларын бекіту туралы» Қазақстан Республикасы Статистика агенттігі төрағасының 2010 жылғы 20 мамырдағы № 113 бұйрығына өзгеріс енгізу туралы
