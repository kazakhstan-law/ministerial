requisite: Приказ Председателя Агентства Республики Казахстан по статистике от 23 октября 2013 года № 247. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 января 2014 года № 9067. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 6 февраля 2015 года № 30
title:
  rus: Об утверждении статистической формы общегосударственного статистического наблюдения "Качество жизни лиц в возрасте 18 лет и старше, имеющих инвалидность, с учетом гендерной специфики (вопросник)" (код 3035105, индекс ИВ, периодичность единовременная) и инструкции по ее заполнению
  kaz: '"Гендерлік ерекшелігі есебімен мүгедектігі бар 18 және одан жоғары жастағы тұлғалардың өмір сапасы (сұрақнама)" жалпымемлекеттік статистикалық байқаудың статистикалық нысаны (коды 3035105, индексі ЕМ, кезеңділігі біржолғы) мен оны толтыру жөніндегі нұсқаулықты бекіту туралы'
