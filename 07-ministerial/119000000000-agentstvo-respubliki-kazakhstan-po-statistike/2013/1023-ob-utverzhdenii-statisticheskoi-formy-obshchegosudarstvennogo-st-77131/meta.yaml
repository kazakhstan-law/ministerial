act_code: '77131'
requisite: Приказ Председателя Агентства Республики Казахстан по статистике от 23 октября 2013 года № 246. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 января 2014 года № 9066. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 6 февраля 2015 года № 30
title:
  rus: Об утверждении статистической формы общегосударственного статистического наблюдения "Качество жизни детей до 18 лет, имеющих инвалидность, с учетом гендерной специфики (вопросник)" (код 3025105, индекс ИД, периодичность единовременная) и инструкции по ее заполнению
  kaz: '"Гендерлік ерекшелігі есебімен мүгедектігі бар 18 жасқа дейінгі балалардың өмір сапасы (сұрақнама)" жалпымемлекеттік статистикалық байқаудың статистикалық нысаны (коды 3025105, индексі БМ, кезеңділігі біржолғы) мен оны толтыру жөніндегі нұсқаулықты бекіту туралы'
