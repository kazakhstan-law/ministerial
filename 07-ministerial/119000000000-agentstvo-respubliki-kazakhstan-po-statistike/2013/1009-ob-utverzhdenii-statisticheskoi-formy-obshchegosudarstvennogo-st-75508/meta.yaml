requisite: Приказ Председателя Агентства Республики Казахстан по статистике от 9 октября 2013 года № 233. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 ноября 2013 года № 8870. Утратил силу приказом и.о. Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 12 декабря 2014 года № 81
title:
