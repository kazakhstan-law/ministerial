  kaz: '"Көтерме сауда саласында қызмет көрсететін кәсіпорынның есебі" жалпымемлекеттік статистикалық байқаудың статистикалық нысаны (коды 3011104, индексі 1-ІС (Қосымша) мен оны толтыру жөніндегі нұсқаулықты бекіту туралы'
