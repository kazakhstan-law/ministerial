  title:
    rus: О внесении дополнений в приказ и.о. Министра энергетики и минеральных ресурсов Республики Казахстан от 27 октября 2005 года № 283 "Об утверждении Инструкции по классификации запасов месторождений, перспективных и прогнозных ресурсов нефти и природного углеводородного газа"
    kaz: '"Мұнай мен табиғи көмірсутек газы кенорындарының қорларын, перспективалық және болжамдық ресурстарын сыныптау жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Энергетика және минералдық ресурстар министрі міндетін атқарушының 2005 жылғы 27 қазандағы N 283 бұйрығына толықтырулар енгізу туралы"'
