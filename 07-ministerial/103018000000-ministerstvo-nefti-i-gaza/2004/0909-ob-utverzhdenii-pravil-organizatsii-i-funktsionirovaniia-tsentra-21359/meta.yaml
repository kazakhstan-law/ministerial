  title:
    rus: О внесении изменения в приказ и.о. Министра энергетики и минеральных ресурсов Республики Казахстан от 10 сентября 2004 года N 212 "Об утверждении Правил организации и функционирования централизованных торгов электрической энергией в Республике Казахстан"
    kaz: '"Қазақстан Республикасында электр энергиясының орталықтандырылған сауда-саттығын ұйымдастыру мен жұмыс істеу ережесін бекіту туралы" Қазақстан Республикасы Энергетика және минералдық ресурстар министрі міндетін атқарушының 2004 жылғы 10 қыркүйектегі N 212 бұйрығына өзгеріс енгізу туралы'
