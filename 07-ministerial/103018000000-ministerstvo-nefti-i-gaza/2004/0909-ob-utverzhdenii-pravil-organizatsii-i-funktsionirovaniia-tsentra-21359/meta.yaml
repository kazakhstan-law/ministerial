  title:
    rus: О внесении изменений и дополнений в приказ И.о. Министра энергетики и минеральных ресурсов Республики Казахстан от 10 сентября 2004 года N 212 "Об утверждении Правил организации и функционирования централизованных торгов электрической энергией в Республике Казахстан"
    kaz: '"Қазақстан Республикасында электр энергиясының орталықтандырылған сауда-саттығын ұйымдастыру мен жұмыс істеу ережесін бекіту туралы" Қазақстан Республикасының Энергетика және минералдық ресурстар министрінің міндетін атқарушының 2004 жылғы 10 қыркүйектегі N 212 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
