  title:
    rus: О признании утратившими силу приказа исполняющего обязанности Министра нефти и газа Республики Казахстан от 30 июля 2012 года № 132 «Об утверждении Правил подтверждения соответствия и присвоения квалификации специалистов нефтегазовой отрасли» и приказа Министра энергетики Республики Казахстан от 22 июня 2015 года № 411 «О внесении изменения в приказ исполняющего обязанности Министра нефти и газа Республики Казахстан от 30 июля 2012 года № 132 «Об утверждении Правил подтверждения соответствия и присвоения квалификации специалистов нефтегазовой отрасли»
    kaz: «Мұнай-газ саласындағы мамандардың сәйкестігін растау және біліктілікті беру қағидасын бекіту туралы» Қазақстан Республикасы Мұнай және газ министрінің міндетін атқарушының 2012 жылғы 30 шілдедегі № 132 бұйрығының және «Мұнай-газ саласындағы мамандардың сәйкестігін растау және біліктілікті беру қағидаларын бекіту туралы» Қазақстан Республикасы Мұнай және газ Министрінің міндетін атқарушының 2012 жылғы 30 шілдедегі № 132 бұйрығына өзгеріс енгізу туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 22 маусымдағы № 411 бұйрығының күші жойылды деп тану туралы
