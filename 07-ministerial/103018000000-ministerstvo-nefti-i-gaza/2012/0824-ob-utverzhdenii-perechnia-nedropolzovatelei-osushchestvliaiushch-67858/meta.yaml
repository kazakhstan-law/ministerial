act_code: '67858'
requisite: Приказ Министра нефти и газа Республики Казахстан от 24 августа 2012 года № 146. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 сентября 2012 года № 7927. Утратил силу приказом Министра энергетики Республики Казахстан от 24 февраля 2021 года № 64 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня недропользователей, осуществляющих передачу сырой нефти для переработки на нефтеперерабатывающий завод, расположенный за пределами территории Таможенного союза, либо реализацию третьему лицу для последующей передачи для переработки на нефтеперерабатывающем заводе, расположенном за пределами территории Таможенного союза и применяющих таможенную процедуру экспорта к сырой нефти, ранее помещенной под таможенную процедуру переработки вне таможенной территории, а также перечня нефтеперерабатывающих заводов расположенных за пределами Таможенного союза и их условия переработки сырой нефти
  kaz: Шикі мұнайды Кеден одағының аумағынан тысқары орналасқан мұнай өңдеу зауытында өңдеуге беруді, немесе Кеден одағының аумағынан тысқары орналасқан мұнай өңдеу зауыттарында одан әрі өңдеу үшін үшінші тұлғаға өткізуді және Кеден аумағынан тысқары өңдеуге кедендік процедураға бұрын орналастырылған шикі мұнайға кедендік экспорттау процедурасын қолдануды жүзеге асыратын жер қойнауын пайдаланушылардың тізбесін, сондай-ақ Кеден одағынан тысқары орналасқан мұнай өңдеу зауыттарының тізбесі мен олардың шикі мұнайды өңдеу шарттарын бекіту туралы
