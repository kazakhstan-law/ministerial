act_code: '70381'
requisite: Приказ Министра нефти и газа Республики Казахстан от 29 ноября 2012 года № 182. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 декабря 2012 года № 8222. Утратил силу приказом Министра нефти и газа Республики Казахстан от 10 февраля 2014 года № 23
title:
  rus: Об утверждении Регламента электронной государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на проектирование (технологическое) и (или) эксплуатация горных (разведка, добыча полезных ископаемых), нефтехимических, химических производств, проектирование (технологическое) нефтегазоперерабатывающих производств, эксплуатация магистральных газопроводов, нефтепроводов, нефтепродуктопроводов"
  kaz: '"Тау-кен (пайдалы қазбаларды барлау, өндіру), мұнай-химия, химия өндiрiстерiн жобалау (технологиялық) және (немесе) пайдалану, мұнайгаз өңдеу өндірістерін жобалауға (технологиялық), магистральдық газ құбырларын, мұнай құбырларын, мұнай өнiмдерi құбырларын пайдалануға арналған лицензияларды беру, қайта ресімдеу, лицензиялар дубликаттарын беру" электрондық мемлекеттік қызметтің регламентін бекіту туралы'
