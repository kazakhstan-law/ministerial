act_code: '35969'
requisite: Приказ и.о. Министра энергетики и минеральных ресурсов Республики Казахстан от 13 ноября 2007 года № 262. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 ноября 2007 года № 5009. Утратил силу приказом Министра индустрии и новых технологий Республики Казахстан от 24 апреля 2012 года № 137
title:
  rus: Об учреждении формы поощрения Министерства энергетики и минеральных ресурсов Республики Казахстан в виде Почетных нагрудных знаков "Қазақстан Республикасының еңбек сіңірген энергетигі" ("Заслуженный энергетик Республики Казахстан") и "Қазақстан Республикасының құрметті энергетигі" ("Почетный энергетик Республики Казахстан")
  kaz: '"Қазақстан Республикасының еңбек сіңірген энергетигі" ("Заслуженный энергетик Республики Казахстан") және "Қазақстан Республикасының құрметті энергетигі" ("Почетный энергетик Республики Казахстан") түріндегі омырауға тағатын құрмет белгісімен Қазақстан Республикасы Энергетика және минералдық ресурстар министрлігінің марапаттау нысанын белгілеу туралы'
