title:
  rus: Об утверждении Правил рассмотрения заявления на установление сроков и обязательного количества выхода продуктов переработки, образующихся в результате операций по переработке товаров на/вне таможенной территории Республики Казахстан
  kaz: Қазақстан Республикасы кеден аумағында/аумағынан тыс тауарларды қайта өңдеу жөніндегі операциялар нәтижесінде пайда болатын қайта өңдеу өнімдерінің мерзімдері мен міндетті түсім санын белгілеуге арналған өтініштерді қарау Ережесін бекіту туралы
