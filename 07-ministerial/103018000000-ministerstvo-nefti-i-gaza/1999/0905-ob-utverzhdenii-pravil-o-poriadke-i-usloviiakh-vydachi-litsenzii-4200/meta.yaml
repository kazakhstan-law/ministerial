requisite: Приказ Министра энергетики, индустрии и торговли Республики Казахстан от 6 сентября 1999 года № 259. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 сентября 1999 года № 916. Отменен - постановлением Правительства Республики Казахстан от 9 февраля 2005 года № 124
title:
  rus: Об утверждении Правил о порядке и условиях выдачи лицензий на виды деятельности в сфере промышленности и Правил о порядке оформления лицензий на сбор (заготовку), хранение, переработку и реализацию лома и отходов цветных и черных металлов, а также оформления разрешений на реализацию за пределы Республики Казахстан лома и отходов цветных и черных металлов
  kaz: Өнеркәсіп саласындағы қызмет түрлеріне арналған лицензияларды берудің тәртібі мен шарттары туралы, түсті және қара металдардың сынықтары мен қалдықтарын жинау (дайындау), сақтау, өңдеу және сатуға арналған лицензияларды, сондай-ақ түсті және қара металдардың сынықтары мен қалдықтарын Қазақстан Республикасынан тысқары сатуға арналған ережелерді бекіту туралы
