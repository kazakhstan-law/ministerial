requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 1 июня 2023 года № 130/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 июня 2023 года № 32678.  Утратил силу приказом Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 30 апреля 2026 года № 224/НҚ (вводится в действие с 1 мая 2026 года)
title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача разрешения на выпуск и обращение обеспеченных цифровых активов»
  kaz: «Қамтамасыз етілген цифрлық активтерді шығаруға және олардың айналысына рұқсат беру» мемлекеттік қызметін көрсету қағидаларын бекіту туралы
