  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 26 апреля 2023 года № 78/НҚ «Об утверждении Правил оформления решения о выпуске обеспеченных цифровых активов» и внесении изменения в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 1 июня 2023 года № 130/НҚ «Об утверждении Правил оказания государственной услуги «Выдача разрешения на выпуск и обращение обеспеченных цифровых активов»
    kaz: «Қамтамасыз етілген цифрлық активтерді шығару туралы шешімді ресімдеу қағидаларын бекіту туралы» Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрі міндетін атқарушысының 2023 жылғы 26 сәуірдегі № 78/НҚ бұйрығына өзгеріс енгізу және «Қамтамасыз етілген цифрлық активтерді шығаруға және олардың айналысына рұқсат беру» мемлекеттік қызметін көрсету қағидаларын бекіту туралы» Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2023 жылғы 1 маусымдағы № 130/НҚ бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201147/rus
