    kaz: «Бюджет қаражаты есебінен орындалатын аэротүсірілім, геодезиялық және картографиялық жұмыстардың құнын айқындау әдістемесін бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің міндетін атқарушының 2023 жылғы 30 наурыздағы № 119/НҚ бұйрығына өзгеріс енгізу туралы
