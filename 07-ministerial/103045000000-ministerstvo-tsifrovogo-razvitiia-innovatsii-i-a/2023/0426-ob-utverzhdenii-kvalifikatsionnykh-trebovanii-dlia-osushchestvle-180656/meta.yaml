  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 26 апреля 2023 года № 165/НҚ «Об утверждении квалификационных требований для осуществления деятельности по цифровому майнингу и перечня документов, подтверждающих соответствие им»
    kaz: Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің міндетін атқарушының 2023 жылғы 26 сәуірдегі № 165/НҚ «Цифрлық майнинг жөніндегі қызметті жүзеге асыру үшін біліктілік талаптарын және оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы» бұйрығына өзгерістер енгізу туралы
