  title:
    rus: О внесении изменений в приказы исполняющего обязанности Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 26 апреля 2023 года № 165/НҚ «Об утверждении квалификационных требований для осуществления деятельности по цифровому майнингу и перечня документов, подтверждающих соответствие им» и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 28 апреля 2023 года № 169/НҚ «Об утверждении Правил лицензирования деятельности по цифровому майнингу»
    kaz: «Цифрлық майнинг жөніндегі қызметті жүзеге асыру үшін біліктілік талаптарын және оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің міндетін атқарушының 2023 жылғы 26 сәуірдегі № 165/НҚ және «Цифрлық майнинг бойынша қызметті лицензиялау қағидаларын бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2023 жылғы 28 сәуірдегі № 169/НҚ бұйрықтарына өзгерістер енгізу туралы
