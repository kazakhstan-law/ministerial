  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 26 апреля 2023 года № 166/НҚ «Об утверждении Правил представления сведений о доходах цифровых майнеров и цифровых майнинговых пулов для целей их налогообложения»
    kaz: «Салық салу мақсаттары үшін цифрлық майнерлер мен цифрлық майнингтік пулдардың кірістері туралы мәліметтерді ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің міндетін атқарушының 2023 жылғы 26 сәуірдегі № 166/НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы
