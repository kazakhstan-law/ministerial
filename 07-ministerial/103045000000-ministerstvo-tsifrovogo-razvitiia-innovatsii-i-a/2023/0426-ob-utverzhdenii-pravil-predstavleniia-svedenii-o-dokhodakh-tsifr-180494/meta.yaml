  title:
    rus: О внесении изменений и дополнений в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 7 апреля 2023 года № 138/НҚ «Об утверждении Правил учета и ведения реестра аппаратно-программного комплекса для цифрового майнинга» и в приказ исполняющего обязанности Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 26 апреля 2023 года № 166/НҚ «Об утверждении Правил представления сведений о доходах цифровых майнеров и цифровых майнинговых пулов для целей их налогообложения»
    kaz: «Цифрлық майнингке арналған аппараттық-бағдарламалық кешенді есепке алу және тізілімін жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2023 жылғы 7 сәуірдегі № 138/НҚ бұйрығына және «Салық салу мақсаттары үшін цифрлық майнерлер мен цифрлық майнингтік пулдардың кірістері туралы мәліметтерді ұсыну қағидаларын бекіту туралы» Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің міндетін атқарушының 2023 жылғы 26 сәуірдегі № 166/НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы
