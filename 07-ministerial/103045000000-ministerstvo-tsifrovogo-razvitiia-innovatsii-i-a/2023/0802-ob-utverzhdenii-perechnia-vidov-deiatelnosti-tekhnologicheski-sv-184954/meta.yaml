act_code: '184954'
requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 2 августа 2023 года № 311/НҚ. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 14 мая 2024 года № 273/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня видов деятельности, технологически связанных с производством товаров, работ, услуг по сопровождению, системно-техническому обслуживанию и управлению проектами по развитию объектов информационно-коммуникационной инфраструктуры «электронного правительства» и Национального шлюза Республики Казахстан
  kaz: «Электрондық үкімет» ақпараттық-коммуникациялық инфрақұрылымы объектілерін және Қазақстан Республикасының ұлттық шлюзін дамыту жөніндегі жобаларды сүйемелдеу, жүйелік-техникалық қызмет көрсету және басқару бойынша тауарларды, жұмыстарды, көрсетілетін қызметтерді өндірумен технологиялық тұрғыдан байланысты қызмет түрлерінің тізбесін бекіту туралы
