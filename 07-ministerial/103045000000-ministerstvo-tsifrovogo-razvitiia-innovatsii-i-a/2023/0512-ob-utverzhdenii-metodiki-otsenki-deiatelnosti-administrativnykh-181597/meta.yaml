  title:
    rus: О внесении изменения в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 12 мая 2023 года № 176/НҚ «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан и его ведомств»
    kaz: «Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлігінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2023 жылғы 12 мамырдағы № 176/НҚ бұйрығына өзгеріс енгізу туралы
