title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан и его ведомств
  kaz: Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлігі мен оның ведомстволарының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы
