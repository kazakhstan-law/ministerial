act_code: '187678'
requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 20 октября 2023 года № 493/НҚ
title:
  rus: Об определении критериев отнесения автотранспорта к специальным транспортным средствам в республиканском государственном предприятии на праве хозяйственного ведения «Государственная радиочастотная служба», находящегося в ведении Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан
  kaz: Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлігінің қарамағындағы «Мемлекеттік радиожиілік қызметі» шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорнында автокөлікті арнайы көлік құралдарына жатқызу өлшемшарттарын айқындау туралы
