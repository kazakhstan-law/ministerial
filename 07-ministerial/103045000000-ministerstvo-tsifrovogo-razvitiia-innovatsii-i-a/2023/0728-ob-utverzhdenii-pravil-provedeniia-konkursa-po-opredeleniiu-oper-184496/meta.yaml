  requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 14 мая 2025 года № 219/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 мая 2025 года № 36108
  title:
    rus: О внесении изменений в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 28 июля 2023 года № 289/НҚ «Об утверждении Правил проведения конкурса по определению операторов универсального обслуживания, включая расчет размера субсидий и порядок возложения уполномоченным органом обязанности по оказанию универсальных услуг на операторов связи, требований к операторам связи по оказанию универсальных услуг связи и перечня универсальных услуг связи»
    kaz: «Субсидиялар мөлшерін есептеуді қоса алғанда, әмбебап қызмет көрсету операторларын айқындау жөнінде конкурс өткізу қағидаларын және уәкілетті органның байланыс операторларына әмбебап қызметтер көрсету жөніндегі міндетті жүктеу тәртібін, байланыс операторларына қойылатын әмбебап байланыс қызметтерін көрсету жөніндегі талаптарды, әмбебап байланыс қызметтері тізбесін бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2023 жылғы 28 шiлдедегi № 289/НҚ бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/210137/rus
