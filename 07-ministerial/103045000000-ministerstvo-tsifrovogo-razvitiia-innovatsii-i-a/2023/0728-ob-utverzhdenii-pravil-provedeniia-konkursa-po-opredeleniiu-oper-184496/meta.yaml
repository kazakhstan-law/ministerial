act_code: '184496'
requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 28 июля 2023 года № 289/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 июля 2023 года № 33201
title:
  rus: Об утверждении Правил проведения конкурса по определению операторов универсального обслуживания, включая расчет размера субсидий и порядок возложения уполномоченным органом обязанности по оказанию универсальных услуг на операторов связи, требований к операторам связи по оказанию универсальных услуг связи и перечня универсальных услуг связи
  kaz: Субсидиялар мөлшерін есептеуді қоса алғанда, әмбебап қызмет көрсету операторларын айқындау жөнінде конкурс өткізу қағидаларын және уәкілетті органның байланыс операторларына әмбебап қызметтер көрсету жөніндегі міндетті жүктеу тәртібін, байланыс операторларына қойылатын әмбебап байланыс қызметтерін көрсету жөніндегі талаптарды, әмбебап байланыс қызметтері тізбесін бекіту туралы
