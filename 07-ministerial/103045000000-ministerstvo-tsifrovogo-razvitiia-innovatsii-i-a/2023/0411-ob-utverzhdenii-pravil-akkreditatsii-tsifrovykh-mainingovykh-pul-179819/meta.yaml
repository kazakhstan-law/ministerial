  title:
    rus: О внесении изменений и дополнения в приказы Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 11 апреля 2023 года № 142/НҚ «Об утверждении Правил аккредитации цифровых майнинговых пулов» и от 28 апреля 2023 года № 169/НҚ «Об утверждении Правил лицензирования деятельности по цифровому майнингу»
    kaz: «Цифрлық майнингтік пулдарды аккредиттеу» мемлекеттік қызметті көрсету қағидаларын бекіту туралы» Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2023 жылғы 11 сәуірдегі № 142/НҚ бұйрығына және «Цифрлық майнинг бойынша қызметті лицензиялау қағидаларын бекіту туралы» 2023 жылғы 28 сәуірдегі № 169/НҚ бұйрығына өзгерістер мен толықтыру енгізу туралы
