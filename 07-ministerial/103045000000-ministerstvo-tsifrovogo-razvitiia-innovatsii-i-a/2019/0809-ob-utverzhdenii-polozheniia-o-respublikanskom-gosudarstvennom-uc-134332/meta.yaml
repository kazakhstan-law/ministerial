act_code: '134332'
requisite: Приказ и.о. Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 9 августа 2019 года № 189/НҚ. Утратил силу приказом Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 22 октября 2025 года № 533/НҚ (вступает в силу со дня его подписания)
title:
  rus: Об утверждении Положения о республиканском государственном учреждении «Комитет телекоммуникаций Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан
  kaz: Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлігінің Телекоммуникациялар комитеті» республикалық мемлекеттік мекемесі туралы ережені бекіту туралы
