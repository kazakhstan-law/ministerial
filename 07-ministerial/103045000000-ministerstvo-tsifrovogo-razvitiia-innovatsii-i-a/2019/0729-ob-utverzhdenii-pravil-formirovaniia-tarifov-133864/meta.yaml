  title:
    rus: О внесении изменений в приказы исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 105 «Об утверждении Инструкции по расчету ставки прибыли на регулируемую базу задействованных активов субъектов естественных монополий в области телекоммуникаций и универсальных услуг почтовой связи», исполняющего обязанности Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 29 июля 2019 года № 181/НҚ «Об утверждении правил формирования тарифов»
    kaz: «Телекоммуникациялар мен пошта байланысының әмбебап көрсетілетін қызметтері саласындағы табиғи монополиялар субъектілерінің қолданысқа енгізілген активтердің реттелетiн базасына келетін пайда мөлшерлемесін есептеу жөнiндегi нұсқаулықты бекiту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2016 жылғы 28 қаңтардағы № 105, «Тарифтерді қалыптастыру қағидаларын бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің міндетін атқарушының 2019 жылғы 29 шілдедегі № 181/НҚ бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/154564/rus
