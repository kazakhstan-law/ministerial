  title:
    rus: О внесении изменений и дополнений в приказы исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 120 «Об утверждении Правил предоставления в пользование кабельной канализации», исполняющего обязанности Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 29 июля 2019 года № 180/НҚ «Об утверждении Правил осуществления деятельности субъектами естественных монополий»
    kaz: «Кәбілдік кәрізді пайдалануға беру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2016 жылғы 28 қаңтардағы № 120, «Табиғи монополиялар субъектілерінің қызметін жүзеге асыру қағидаларын бекіту туралы», Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің міндетін атқарушының 2019 жылғы 29 шілдедегі № 180/НҚ бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/178271/rus
