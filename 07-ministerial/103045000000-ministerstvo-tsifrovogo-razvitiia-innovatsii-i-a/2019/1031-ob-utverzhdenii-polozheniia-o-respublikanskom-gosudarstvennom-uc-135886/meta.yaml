  code: '140591'
  requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 20 марта 2020 года № 108/НҚ. Утратил силу приказом Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 22 октября 2025 года № 528/НҚ (вводится в действие со дня его подписания)
  title:
    rus: О внесении изменений и дополнений в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 31 октября 2019 года № 288/НҚ «Об утверждении Положения республиканского государственного учреждения «Комитет государственных услуг Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан»
    kaz: «Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлігінің Мемлекеттік көрсетілетін қызметтер комитеті» республикалық мемлекеттік мекемесінің ережесін бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2019 жылғы 31 қазандағы № 288/НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/140591/rus
