act_code: '135886'
requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 31 октября 2019 года № 288/НҚ. Утратил силу приказом Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 22 октября 2025 года № 528/НҚ (вводится в действие со дня его подписания)
title:
  rus: Об утверждении Положения о республиканском государственном учреждении «Комитет государственных услуг Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан»
  kaz: «Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлігінің Мемлекеттік көрсетілетін қызметтер комитеті» республикалық мемлекеттік мекемесі туралы ережені бекіту туралы
