    kaz: «Мемлекеттік органдардың архитектураларын әзірлеу, іске асыру, іске асырылуын қолдап отыру, мониторингтеу және дамыту қағидаларын бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2019 жылғы 12 тамыздағы № 193/НҚ бұйрығына өзгеріс енгізу туралы
