title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов при проведении операций по недропользованию в области углеводородов
  kaz: Көмірсутектер саласында жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
