  code: '137157'
  requisite: Приказ и.о. Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 4 декабря 2019 года № 334/НҚ. Утратил силу приказом Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 21 октября 2025 года № 527/НҚ (вступает в силу со дня его подписания)
  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 22 июля 2019 года № 169/НҚ «Об утверждении Положения республиканского государственного учреждения «Комитет по информационной безопасности Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан»
    kaz: «Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлігінің Ақпараттық қауіпсіздік комитеті» республикалық мемлекеттік мекемесінің ережесін бекіту туралы Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің міндетін атқарушының 2019 жылғы 22 шілдедегі № 169/НҚ бұйрығына өзгерiстер мен толықтырулар енгiзу туралы
