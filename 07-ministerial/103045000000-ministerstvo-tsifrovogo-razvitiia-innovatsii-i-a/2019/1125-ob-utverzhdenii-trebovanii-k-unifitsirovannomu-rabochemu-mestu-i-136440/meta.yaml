title:
  rus: Об утверждении требований к унифицированному рабочему месту или терминальной системе государственных органов и местных исполнительных органов, а также компонентам объектов информационно-коммуникационной инфраструктуры
  kaz: Мемлекеттік органдардың және жергілікті атқарушы органдардың үйлестірілген жұмыс орнына немесе терминалды жүйесіне, сондай-ақ ақпараттық-коммуникациялық инфрақұрылым объектілерінің компоненттеріне қойылатын талаптарды бекіту туралы
