  title:
    rus: О внесении изменений в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 25 ноября 2019 года №322/НҚ «Об утверждении требований к унифицированному рабочему месту или терминальной системе государственных органов и местных исполнительных органов»
    kaz: «Мемлекеттік органдардың және жергілікті атқарушы органдардың үйлестірілген жұмыс орнына немесе терминалды жүйесіне қойылатын талаптарды бекіту туралы» Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2019 жылғы 25 қарашадағы № 322/НҚ бұйрығына өзгерістер енгізу туралы
