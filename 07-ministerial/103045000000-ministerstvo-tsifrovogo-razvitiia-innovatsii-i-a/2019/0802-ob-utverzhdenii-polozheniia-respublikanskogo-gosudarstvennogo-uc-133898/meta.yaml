  title:
    rus: О внесении дополнений в приказ исполняющего обязанности Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 2 августа 2019 года № 186/НҚ «Об утверждении Положения республиканского государственного учреждения «Комитет геодезии и картографии Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан»
    kaz: «Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлiгiнiң Геодезия және картография комитеті» республикалық мемлекеттік мекемесінің ережесін бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің міндетін атқарушының 2019 жылғы 2 тамыздағы № 186/НҚ бұйрығына толықтырулар енгізу туралы
