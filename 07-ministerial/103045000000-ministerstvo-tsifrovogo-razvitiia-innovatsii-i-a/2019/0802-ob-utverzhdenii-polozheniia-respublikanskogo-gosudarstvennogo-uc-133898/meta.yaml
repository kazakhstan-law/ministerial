title:
  rus: Об утверждении Положения республиканского государственного учреждения «Комитет геодезии и картографии Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан»
  kaz: «Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлiгiнiң Геодезия және картография комитеті» республикалық мемлекеттік мекемесінің ережесін бекіту туралы
