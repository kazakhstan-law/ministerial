    kaz: «Электрондық үкіметтің» ақпараттандыру объектілерін құруға және дамытуға арналған техникалық тапсырмаларды жасау және қарау қағидаларын бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2019 жылғы 29 маусымдағы № 143/НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы
