  title:
    rus: О внесении изменений и дополнения в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 12 июля 2019 года № 158/НҚ «Об утверждении Методики расчета стоимости информационно-коммуникационных услуг для государственных органов»
    kaz: «Мемлекеттік органдар үшін ақпараттық-коммуникациялық көрсетілетін қызметтердің құнын есептеу әдістемесін бекіту туралы» Қазақстан Республикасы цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің міндетін атқарушының 2019 жылғы 12 шілдедегі № 158/НҚ бұйрығына өзгерістер мен толықтыру енгізу туралы
