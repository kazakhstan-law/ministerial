act_code: '134333'
requisite: Приказ и.о. Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 9 августа 2019 года № 190/НҚ. Утратил силу приказом Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 22 октября 2025 года № 534/НҚ (вступает в силу со дня его подписания)
title:
  rus: Об утверждении положений территориальных органов Комитета телекоммуникаций Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан
