  code: '177701'
  requisite: Приказ и.о. Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 19 декабря 2022 года № 497/НҚ.  Утратил силу приказом Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 22 октября 2025 года № 534/НҚ (вступает в силу со дня его подписания)
  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 9 августа 2019 года № 190/НҚ «Об утверждении положений территориальных органов Комитета телекоммуникаций Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан»
    kaz: «Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлігінің Телекоммуникациялар комитеті аумақтық органдарының ережелерін бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің міндетін атқарушының 2019 жылғы 9 тамыздағы № 190/НҚ бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/177701/rus
