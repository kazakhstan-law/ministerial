  requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 9 февраля 2021 года № 46/НҚ. Утратил силу приказом Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 21 октября 2025 года № 526/НҚ (вводится в действие со дня его подписания)
  title:
    rus: О внесении изменения и дополнения в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 26 июля 2019 года № 177/НҚ «Об утверждении Положения республиканского государственного учреждения Аэрокосмический комитет Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан»
    kaz: «Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлігінің Аэроғарыш комитеті республикалық мемлекеттік мекемесінің ережесін бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2019 жылғы 26 шілдедегі № 177/НҚ бұйрығына өзгеріс пен толықтыру енгізу туралы
