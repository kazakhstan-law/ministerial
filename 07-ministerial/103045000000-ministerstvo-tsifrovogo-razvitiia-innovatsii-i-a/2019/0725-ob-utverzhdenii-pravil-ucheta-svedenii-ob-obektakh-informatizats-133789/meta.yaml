act_code: '133789'
requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 25 июля 2019 года № 174/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 июля 2019 года № 19104. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 12 июля 2024 года № 420/НҚ (вводится в действие с 22 июля 2024 года и подлежит официальному опубликованию)
title:
  rus: Об утверждении Правил учета сведений об объектах информатизации «электронного правительства» и размещения электронных копий технической документации объектов информатизации «электронного правительства»
  kaz: «Электрондық үкіметтің» ақпараттандыру объектілері туралы мәліметтерді есепке алу және «электрондық үкіметтің» ақпараттандыру объектілерінің техникалық құжаттамасының электрондық көшірмелерін орналастыру қағидаларын бекіту туралы
