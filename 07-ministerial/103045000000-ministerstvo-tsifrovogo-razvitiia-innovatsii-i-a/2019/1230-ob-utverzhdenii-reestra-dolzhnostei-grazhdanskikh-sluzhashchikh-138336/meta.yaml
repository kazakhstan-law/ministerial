  title:
    rus: О внесении изменений и дополнения в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 30 декабря 2019 года № 373/НҚ «Об утверждении реестра должностей гражданских служащих Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан»
    kaz: «Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлігінің азаматтық қызметшілері лауазымдарының тізілімін бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2019 жылғы 30 желтоқсандағы № 373/НҚ бұйрығына өзгерістер мен толықтыру енгізу туралы
