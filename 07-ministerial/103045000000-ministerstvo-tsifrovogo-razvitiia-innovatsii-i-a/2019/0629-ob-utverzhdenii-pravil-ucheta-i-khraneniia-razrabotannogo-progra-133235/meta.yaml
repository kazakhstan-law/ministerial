act_code: '133235'
requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 29 июня 2019 года № 146/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 июля 2019 года № 18949. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 29 февраля 2024 года № 110/НҚ (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:
