  title:
    rus: О внесении изменения в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 29 июня 2019 года № 146/НҚ «Об утверждении Правил учета и хранения разработанного программного обеспечения, исходных программных кодов (при наличии), комплекса настроек лицензионного программного обеспечения объектов информатизации «электронного правительства»
    kaz: «Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің «Электрондық үкіметтің» ақпараттандыру объектілерінің әзірленген бағдарламалық қамтылымын, бастапқы бағдарламалық кодтарын (болған кезде), лицензиялық бағдарламалық қамтылымын баптау кешенін есепке алу және сақтау қағидаларын бекіту туралы» 2019 жылғы 29 маусымдағы № 146/НҚ бұйрығына өзгеріс енгізу туралы
