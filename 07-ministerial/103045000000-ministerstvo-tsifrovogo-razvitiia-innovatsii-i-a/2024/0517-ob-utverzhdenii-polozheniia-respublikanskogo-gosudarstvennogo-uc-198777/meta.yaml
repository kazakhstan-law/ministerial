  kaz: «Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлігінің Жасанды интеллект және инновацияларды дамыту комитеті» республикалық мемлекеттік мекемесінің ережесін бекіту туралы
