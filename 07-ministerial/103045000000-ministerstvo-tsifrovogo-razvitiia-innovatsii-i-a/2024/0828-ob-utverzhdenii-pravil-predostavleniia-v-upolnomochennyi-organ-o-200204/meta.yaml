act_code: '200204'
requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 28 августа 2024 года № 523/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 августа 2024 года № 35006
title:
  rus: Об утверждении Правил предоставления в уполномоченный орган операторами связи и (или) владельцами сетей связи, осуществляющими деятельность на территории Республики Казахстан, агрегированных данных при угрозе возникновения и возникновении чрезвычайных ситуаций социального, природного и техногенного характера, вызванных стихийными бедствиями (землетрясения, сели, лавины, наводнения и другие), кризисными экологическими ситуациями, природными пожарами, эпидемиями
  kaz: Қазақстан Республикасының аумағында қызметін жүзеге асыратын байланыс операторларының және (немесе) байланыс желілері иелерінің дүлей зілзалалардан (жер сілкінісі, селдер, көшкіндер, су тасқыны және басқалар), дағдарыстық экологиялық жағдайлардан, табиғи өрттерден, эпидемиялардан болған әлеуметтік, табиғи және техногендік сипаттағы төтенше жағдайлардың туындау қатері төнген және туындаған кезде біріктірілген деректерді уәкілетті органға беру қағидаларын  бекіту туралы
