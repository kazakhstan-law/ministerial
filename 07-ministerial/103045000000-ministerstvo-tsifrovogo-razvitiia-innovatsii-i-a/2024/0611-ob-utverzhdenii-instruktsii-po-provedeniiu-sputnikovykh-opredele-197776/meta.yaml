title:
  rus: Об утверждении инструкции по проведению спутниковых определений координат пасcивных пунктов государственной геодезической сети с применением глобальных навигационных спутниковых систем
  kaz: Жаһандық навигациялық спутниктік жүйелерді қолдана отырып, мемлекеттік геодезиялық желінің пассивті пункттерінің координаталарын спутниктік айқындауды жүргізу жөніндегі нұсқаулықты бекіту туралы
