title:
  rus: Об утверждении цен на товары (работы, услуги), производимые и (или) реализуемые некоммерческим акционерным обществом «Государственная корпорация «Правительство для граждан», отнесенные к государственной монополии в сфере государственной регистрации прав на недвижимое имущество»
  kaz: «Жылжымайтын мүлікке құқықтарды мемлекеттік тіркеу саласында мемлекеттік монополияға жатқызылған, «Азаматтарға арналған үкімет» мемлекеттік корпорациясы» коммерциялық емес акционерлік қоғамы өндіретін және (немесе) өткізетін тауарлардың (жұмыстардың, көрсетілетін қызметтердің) бағаларын бекіту туралы
