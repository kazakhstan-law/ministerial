  title:
    rus: О внесении изменения в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 12 июля 2024 года № 422/НҚ «Об утверждении цен на товары (работы, услуги), производимые и (или) реализуемые некоммерческим акционерным обществом «Государственная корпорация «Правительство для граждан», отнесенные к государственной монополии в сфере пенсионного и социального обеспечения»
    kaz: «Зейнетақымен және әлеуметтік қамсыздандыру саласындағы мемлекеттік монополияға жатқызылған «Азаматтарға арналған үкімет» мемлекеттік корпорациясы» коммерциялық емес акционерлік қоғамы өндіретін және (немесе) өткізетін тауарларға (жұмыстарға, көрсетілетін қызметтерге) бағаларды бекіту туралы» Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2024 жылғы 12 шiлдедегi № 422/НҚ бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/215242/rus
