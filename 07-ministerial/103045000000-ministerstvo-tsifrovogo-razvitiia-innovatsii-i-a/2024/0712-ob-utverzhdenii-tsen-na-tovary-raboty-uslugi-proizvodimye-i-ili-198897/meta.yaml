title:
  rus: Об утверждении цен на товары (работы, услуги), производимые и (или) реализуемые некоммерческим акционерным обществом «Государственная корпорация «Правительство для граждан», отнесенные к государственной монополии в сфере пенсионного и социального обеспечения
  kaz: Зейнетақымен және әлеуметтік қамсыздандыру саласындағы мемлекеттік монополияға жатқызылған «Азаматтарға арналған үкімет» мемлекеттік корпорациясы» коммерциялық емес акционерлік қоғамы өндіретін және (немесе) өткізетін тауарларға (жұмыстарға, көрсетілетін қызметтерге) бағаларды бекіту туралы
