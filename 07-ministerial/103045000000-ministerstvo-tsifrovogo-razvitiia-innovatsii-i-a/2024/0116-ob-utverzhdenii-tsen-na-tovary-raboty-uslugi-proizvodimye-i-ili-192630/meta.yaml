act_code: '192630'
requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 16 января 2024 года № 23/НҚ
title:
  rus: Об утверждении цен на товары (работы, услуги), производимые и (или) реализуемые некоммерческим акционерным обществом «Государственная корпорация «Правительство для граждан», отнесенные к государственной монополии в сфере деятельности по ведению государственного земельного кадастра Республики Казахстан
  kaz: Қазақстан Республикасының Мемлекеттік жер кадастрын жүргізу жөніндегі қызмет саласындағы мемлекеттік монополияға жатқызылған «Азаматтарға арналған үкімет» мемлекеттік корпорациясы» коммерциялық емес акционерлік қоғамы өндіретін және (немесе) өткізетін тауарларға (жұмыстарға, көрсетілетін қызметтерге) бағаларын бекіту туралы
