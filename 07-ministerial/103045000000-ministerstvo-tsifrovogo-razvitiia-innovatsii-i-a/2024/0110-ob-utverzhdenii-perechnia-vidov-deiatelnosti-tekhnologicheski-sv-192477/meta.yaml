title:
  rus: Об утверждении Перечня видов деятельности, технологически связанных с услугами, осуществляемыми субъектом специального права товариществом с ограниченной ответственностью «Институт космической техники и технологий»
  kaz: Арнайы құқық субъектісі «Ғарыштық техника және технологиялар институты» жауапкершілігі шектеулі серіктестігі жүзеге асыратын қызметтермен технологиялық тұрғыдан байланысты қызмет түрлерінің тізбесін бекіту туралы
