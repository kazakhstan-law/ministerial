  title:
    rus: О внесении дополнения в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 10 января 2024 года № 11/НҚ «Об утверждении Перечня видов деятельности, технологически связанных с услугами, осуществляемыми субъектом специального права товариществом с ограниченной ответственностью «Институт космической техники и технологий»
    kaz: «Арнайы құқық субъектісі «Ғарыштық техника және технологиялар институты» жауапкершілігі шектеулі серіктестігі жүзеге асыратын қызметтермен технологиялық тұрғыдан байланысты қызмет түрлерінің тізбесін бекіту туралы» Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2024 жылғы 10 қаңтардағы № 11/НҚ бұйрығына толықтыру енгізу туралы
