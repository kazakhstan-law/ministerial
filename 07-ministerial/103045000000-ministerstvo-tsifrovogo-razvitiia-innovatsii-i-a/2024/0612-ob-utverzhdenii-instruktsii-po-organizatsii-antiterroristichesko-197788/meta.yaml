act_code: '197788'
requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 12 июня 2024 года № 316/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 июня 2024 года № 34506
title:
  rus: Об утверждении Инструкции по организации антитеррористической защиты объектов Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан и его ведомств, уязвимых в террористическом отношении
  kaz: Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлігінің объектілерін және оның террористік тұрғыдан осал ведомстволарын терроризмге қарсы қорғауды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
