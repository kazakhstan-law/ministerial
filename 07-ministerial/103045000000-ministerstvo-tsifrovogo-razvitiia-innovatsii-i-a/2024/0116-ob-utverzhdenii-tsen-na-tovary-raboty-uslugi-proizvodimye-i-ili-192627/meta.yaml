title:
  rus: Об утверждении цен на товары (работы, услуги), производимые и (или) реализуемые некоммерческим акционерным обществом «Государственная корпорация «Правительство для граждан», отнесенные к государственной монополии в сфере государственной регистрации юридических лиц, являющихся коммерческими организациями, и учетной регистрации их филиалов и представительств
  kaz: Коммерциялық ұйымдар болып табылатын заңды тұлғаларды мемлекеттік тіркеу және олардың филиалдары мен өкілдіктерін есептік тіркеу саласындағы мемлекеттік монополияға жатқызылған «Азаматтарға арналған үкімет» мемлекеттік корпорациясы» коммерциялық емес акционерлік қоғамы өндіретін және (немесе) өткізетін тауарларға (жұмыстарға, көрсетілетін қызметтерге) бағаларды бекіту туралы
