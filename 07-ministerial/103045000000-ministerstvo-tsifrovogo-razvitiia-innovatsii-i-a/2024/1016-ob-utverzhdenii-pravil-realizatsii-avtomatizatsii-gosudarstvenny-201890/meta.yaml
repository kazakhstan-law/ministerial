  title:
    rus: О внесении изменений в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 16 октября 2024 года № 653/НҚ «Об утверждении Правил реализации автоматизации государственных функций и оказания вытекающих из них государственных услуг путем разработки и размещения платформенных программных продуктов»
    kaz: «Платформалық бағдарламалық өнімдерді әзірлеу және орналастыру арқылы мемлекеттік функцияларды автоматтандыруды іске асыру және олардан туындайтын мемлекеттік қызметтерді көрсету қағидаларын бекіту туралы» Қазақстан Республикасы цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2024 жылғы 16 қазандағы № 653/НҚ бұйрығына өзгерістер енгізу туралы
