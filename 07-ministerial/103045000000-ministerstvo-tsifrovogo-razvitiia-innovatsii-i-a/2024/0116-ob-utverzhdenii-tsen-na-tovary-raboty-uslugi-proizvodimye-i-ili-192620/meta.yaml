act_code: '192620'
requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 16 января 2024 года № 21/НҚ
title:
  rus: Об утверждении цен на товары (работы, услуги), производимые и (или) реализуемые некоммерческим акционерным обществом «Государственная корпорация «Правительство для граждан», отнесенные к государственной монополии в сфере внесения в информационную систему правового кадастра идентификационных и технических сведений зданий, сооружений и (или) их составляющих на вновь созданное недвижимое имущество и государственному техническому обследованию зданий, сооружений и (или) их составляющих
  kaz: Ғимараттардың, құрылыстардың және (немесе) олардың құрамдастарының жаңадан құрылған жылжымайтын мүлікке сәйкестендіру және техникалық мәліметтерін құқықтық кадастр ақпараттық жүйесіне енгізу және ғимараттарды, құрылыстардың және (немесе) олардың құрамдастарын мемлекеттік техникалық тексеру бойынша мемлекеттік монополияға жатқызылған «Азаматтарға арналған үкімет» мемлекеттік корпорациясы» коммерциялық емес акционерлік қоғамы өндіретін және (немесе) өткізетін тауарларға (жұмыстарға, көрсетілетін қызметтерге) бағаларын бекіту туралы
