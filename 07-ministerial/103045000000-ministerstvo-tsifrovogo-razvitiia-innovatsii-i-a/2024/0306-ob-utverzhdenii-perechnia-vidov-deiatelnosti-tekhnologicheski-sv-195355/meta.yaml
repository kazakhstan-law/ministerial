act_code: '195355'
requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 6 марта 2024 года № 121/НҚ. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 14 мая 2024 года № 273/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня видов деятельности, технологически связанных с производством услуг по обеспечению безопасности хранения государственных электронных информационных ресурсов, размещенных на информационно-коммуникационной инфраструктуре «электронного правительства»
  kaz: «Электрондық үкіметтің» ақпараттық-коммуникациялық инфрақұрылымында орналастырылған мемлекеттік электрондық ақпараттық ресурстарды сақтау қауіпсіздігін қамтамасыз ету жөніндегі көрсетілетін қызметтерді өндірумен технологиялық байланысты қызмет түрлерінің тізбесін бекіту туралы
