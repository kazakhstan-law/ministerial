  title:
    rus: О внесении изменения и дополнений в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 14 мая 2024 года № 273/НҚ «Об утверждении перечня видов деятельности, технологически связанных с услугами, осуществляемыми субъектом специального права акционерным обществом «Национальные информационные технологии»
    kaz: «Арнайы құқық субъектісі «Ұлттық ақпараттық технологиялар» акционерлік қоғамы жүзеге асыратын көрсетілетін қызметтермен технологиялық байланысты қызмет түрлерінің тізбесін бекіту туралы» Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2024 жылғы 14 мамырдағы № 273/НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы
