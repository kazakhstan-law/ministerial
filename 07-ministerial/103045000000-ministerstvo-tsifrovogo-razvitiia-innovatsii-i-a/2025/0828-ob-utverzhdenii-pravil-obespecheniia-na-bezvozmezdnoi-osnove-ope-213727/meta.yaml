requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 28 августа 2025 года № 444/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 августа 2025 года № 36729
title:
  rus: Об утверждении Правил обеспечения на безвозмездной основе операторами связи применения средств защиты информации на линиях и каналах связи, не входящих в единую транспортную среду государственных органов и осуществляющих передачу информации с использованием радиоэлектронных средств, при оказании услуг связи государственным органам
  kaz: Байланыс операторларының мемлекеттік органдардың бірыңғай көліктік ортасына кірмейтін және мемлекеттік органдарға байланыс қызметтерін көрсету кезінде радиоэлектрондық құралдарды пайдаланып ақпарат беруді жүзеге асыратын байланыс жолдары мен арналарында ақпаратты қорғау құралдарын қолдануды өтеусіз негізде қамтамасыз ету қағидаларын бекіту туралы
