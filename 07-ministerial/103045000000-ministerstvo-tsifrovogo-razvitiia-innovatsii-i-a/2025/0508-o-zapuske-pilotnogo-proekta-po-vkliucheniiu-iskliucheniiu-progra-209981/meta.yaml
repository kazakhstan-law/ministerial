title:
  rus: О запуске пилотного проекта по включению (исключению) программного обеспечения и продукции электронной промышленности в реестр (из реестра) доверенного программного обеспечения и продукции электронной промышленности в проактивном формате посредством использования информационно-аналитической системы «Smart Data Ukimet»
  kaz: «Smart Data Ukimet» ақпараттық-талдамалық жүйесін пайдалану арқылы сенімді бағдарламалық қамтамасыз ету тізіліміне (тізілімнен) бағдарламалық қамтамасыз етуді және электрондық өнеркәсіп өнімін қосу (алып тастау) жөніндегі пилоттық жобаны іске қосу туралы
