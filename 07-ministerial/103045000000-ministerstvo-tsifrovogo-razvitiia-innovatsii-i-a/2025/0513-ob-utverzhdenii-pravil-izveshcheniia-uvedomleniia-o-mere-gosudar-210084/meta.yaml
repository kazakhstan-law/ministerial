requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 13 мая 2025 года № 214/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 мая 2025 года № 36105
title:
  rus: Об утверждении Правил извещения (уведомления) о мере государственной поддержки физических лиц, учета и (или) получения такой меры, осуществляющихся посредством «социального кошелька» и получения мер государственной поддержки физического лица посредством иных объектов информатизации
  kaz: «Әлеуметтік әмиян» арқылы жүзеге асырылатын жеке тұлғаларды мемлекеттік қолдау шарасы туралы хабарлау (хабархат), осындай шараны есепке алу және (немесе) алу және жеке тұлғаны мемлекеттік қолдау шараларын өзге ақпараттандыру объектілері арқылы алу қағидаларын бекіту туралы
