  title:
    rus: О внесении изменений в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 1 октября 2020 года № 366/НҚ «Об утверждении Правил оплаты услуг национального института развития в области технологического развития при предоставлении инновационных грантов»
    kaz: «Инновациялық гранттар беру кезінде технологиялық даму саласындағы ұлттық даму институты қызметтеріне ақы төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2020 жылғы 1 қазандағы № 366/НҚ бұйрығына өзгерістер енгізу туралы
