act_code: '142509'
requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 30 апреля 2020 года № 168/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 мая 2020 года № 20563
title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача заключений на ввоз на территорию Республики Казахстан радиоэлектронных средств и высокочастотных устройств гражданского назначения, в том числе встроенных либо входящих в состав других товаров, в случаях, отличных от импорта, и (или) выдача лицензии на их импорт»
  kaz: «Импорттан өзгеше жағдайларда, азаматтық мақсаттағы, оның ішінде басқа тауарлардың құрамына кіріктірілген не кіретін радиоэлектрондық құралдар мен жоғары жиілікті құрылғыларды Қазақстан Республикасының аумағына әкелуге қорытындылар және (немесе) олардың импортына лицензия беру» мемлекеттік қызметін көрсету қағидаларын бекіту туралы
