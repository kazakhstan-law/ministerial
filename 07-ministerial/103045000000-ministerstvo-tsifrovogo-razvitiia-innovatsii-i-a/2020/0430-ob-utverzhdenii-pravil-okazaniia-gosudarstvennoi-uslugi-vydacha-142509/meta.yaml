  requisite: Приказ Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 14 августа 2026 года № 486/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 августа 2026 года № 39611
  title:
    rus: О внесении изменений в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 30 апреля 2020 года № 168/НҚ «Об утверждении Правил оказания государственной услуги «Выдача заключений на ввоз на территорию Республики Казахстан радиоэлектронных средств и высокочастотных устройств гражданского назначения, в том числе встроенных либо входящих в состав других товаров, в случаях, отличных от импорта, и (или) выдача лицензии на их импорт»
    kaz: «Импорттан өзгеше жағдайларда, азаматтық мақсаттағы, оның ішінде басқа тауарлардың құрамына кіріктірілген не кіретін радиоэлектрондық құралдар мен жоғары жиілікті құрылғыларды Қазақстан Республикасының аумағына әкелуге қорытындылар және (немесе) олардың импортына лицензия беру» мемлекеттік қызметін көрсету қағидаларын бекіту туралы» Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2020 жылғы 30 сәуірдегі № 168/НҚ бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/228995/rus
