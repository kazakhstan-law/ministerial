    kaz: Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2020 жылғы 13 қазандағы № 386/НҚ «Интернетке қол жеткізудің бірыңғай шлюзінің және «электрондық үкіметтің» электрондық поштасының бірыңғай шлюзінің жұмыс істеу қағидаларын бекіту туралы» бұйрығына өзгерістер мен толықтыру енгізу туралы
