    kaz: «Интернетке қол жеткізудің бірыңғай шлюзінің және «электрондық үкіметтің» электрондық поштасының бірыңғай шлюзінің жұмыс істеу қағидаларын бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2020 жылғы 13 қазандағы № 386 НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы
