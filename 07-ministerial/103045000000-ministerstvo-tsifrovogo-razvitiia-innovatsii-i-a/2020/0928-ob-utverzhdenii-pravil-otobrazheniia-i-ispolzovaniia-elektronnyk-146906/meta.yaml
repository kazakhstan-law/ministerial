  title:
    rus: О внесении изменений в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 28 сентября 2020 года № 352/НҚ «Об утверждении Правил формирования, проверки и использования электронных документов с применением сервиса цифровых документов»
    kaz: «Цифрлық құжаттар сервисін қолдана отырып, электрондық құжаттарды қалыптастыру, тексеру және пайдалану қағидаларын бекіту туралы» Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2020 жылғы 28 қыркүйектегі № 352/НҚ бұйрығына өзгерістер енгізу туралы
