  code: '164997'
  requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 28 февраля 2022 года № 67/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 марта 2022 года № 27027. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 14 марта 2023 года № 89/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 9 апреля 2020 года № 131/НҚ «Об утверждении Правил оказания государственной услуги «Регистрация, учет и выдача разрешения на проведение аэросъемочных работ» и признании утратившими силу некоторых приказов и структурных элементов некоторых приказов в сфере геодезии и картографии»
    kaz: «Аэротүсірілім жұмыстарын жүргізуді тіркеу, есепке алу және оларға рұқсат беру» мемлекеттік қызметін көрсету қағидаларын бекіту және геодезия және картография саласындағы кейбір бұйрықтардың және кейбір бұйрықтардың құрылымдық элементтерінің күші жойылды деп тану туралы» Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2020 жылғы 9 сәуірдегі № 131/НҚ бұйрығына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/164997/rus
