requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 19 октября 2020 года № 392/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 октября 2020 года № 21480. Утратил силу приказом и.о. Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 25 июля 2024 года № 440/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил по подтверждению соответствия информационных систем, технических, программно-технических и программных средств (изделий), технических средств защиты информации требованиям информационной безопасности
  kaz: Ақпараттық жүйелердің, техникалық, бағдарламалық-техникалық және бағдарламалық құралдардың (бұйымдардың), ақпаратты қорғаудың техникалық құралдарының ақпараттық қауіпсіздік талаптарына сәйкестігін растау жөніндегі қағидаларды бекіту туралы
