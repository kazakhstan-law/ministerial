  kaz: Азаматтардың дербес деректеріне қолжетімділігі бар, сондай-ақ мемлекеттік қызметтер көрсету процесіне қатысатын «Азаматтарға арналған үкімет» мемлекеттік корпорациясының қызметкерлеріне тексеріс жүргізу қағидаларын бекіту туралы
