requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 21 октября 2020 года № 394/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 октября 2020 года № 21495. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 20 марта 2023 года № 99/НҚ (вводится в действие с 1 апреля 2023 года)
