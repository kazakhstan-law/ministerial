act_code: '168217'
requisite: Приказ и.о. Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 26 мая 2022 года № 187/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 мая 2022 года № 28239
title:
  rus: Об утверждении Правил оказания услуг по содействию в развитии бизнес-инкубирования, а также определения стоимости таких услуг, за исключением услуг, оказываемых международным технологическим парком «Астана Хаб»
  kaz: Бизнес-инкубациялауды дамытуға жәрдемдесу бойынша қызметтер көрсету, сондай-ақ «Астана Хаб» халықаралық технологиялық паркі көрсететін қызметтерді қоспағанда, осындай қызметтердің құнын айқындау қағидаларын бекіту туралы
