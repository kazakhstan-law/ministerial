  requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 27 марта 2023 года № 105/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 марта 2023 года № 32166
  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 26 мая 2022 года № 187/НҚ «Об утверждении Правил оказания услуг по содействию в развитии бизнес-инкубирования, а также определения стоимости таких услуг, за исключением услуг, оказываемых международным технологическим парком «Астана Хаб»
    kaz: Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрі міндетін атқарушының «Бизнес-инкубациялауды дамытуға жәрдемдесу бойынша қызметтер көрсету, сондай-ақ «Астана Хаб» халықаралық технологиялық паркі көрсететін қызметтерді қоспағанда, осындай қызметтердің құнын айқындау қағидаларын бекіту туралы» 2022 жылғы 26 мамырдағы № 187/НҚ бұйрығына өзгеріс енгізу туралы
