  title:
    rus: О внесении изменений в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 29 сентября 2022 года № 355/НҚ «Об утверждении Перечня разрешений, по которым проверка заявителя на соответствие квалификационным или разрешительным требованиям и выдача разрешения либо мотивированного отказа осуществляются в автоматическом режиме проверки заявителя и выдачи разрешения в государственной информационной системе разрешений и уведомлений»
    kaz: Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2022 жылғы 29 қыркүйектегі № 355/НҚ «Өтініш берушінің біліктілік немесе рұқсат беру талаптарына сәйкестігін тексеру және рұқсатты не уәжді бас тартуды беру рұқсаттар мен хабарламалардың мемлекеттік ақпараттық жүйесінде өтініш берушіні тексерудің және рұқсат берудің автоматты режимінде жүзеге асырылатын рұқсаттар тізбесін бекіту туралы» бұйрығына өзгерістер енгізу туралы
