requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 29 сентября 2022 года № 355/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 сентября 2022 года № 29901
title:
  rus: Об утверждении Перечня разрешений, по которым проверка заявителя на соответствие квалификационным или разрешительным требованиям и выдача разрешения либо мотивированного отказа осуществляются в автоматическом режиме проверки заявителя и выдачи разрешения в государственной информационной системе разрешений и уведомлений
  kaz: Өтініш берушінің біліктілік немесе рұқсат беру талаптарына сәйкестігін тексеру және рұқсатты не уәжді бас тартуды беру рұқсаттар мен хабарламалардың мемлекеттік ақпараттық жүйесінде өтініш берушіні тексерудің және рұқсат берудің автоматты режимінде жүзеге асырылатын рұқсаттар тізбесін бекіту туралы
