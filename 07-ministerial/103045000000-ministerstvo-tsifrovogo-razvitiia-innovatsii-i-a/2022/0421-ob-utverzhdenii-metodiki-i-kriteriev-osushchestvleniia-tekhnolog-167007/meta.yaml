  title:
    rus: О внесении изменений в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 21 апреля 2022 года № 133/НҚ «Об утверждении Методики и критериев осуществления технологического прогнозирования, функционирования отраслевых центров технологических компетенций, организации технологических платформ и разработки целевых технологических программ»
    kaz: «Технологиялық болжауды жүзеге асырудың, салалық технологиялық құзырет орталықтарының жұмыс істеуінің, технологиялық платформаларды ұйымдастырудың және нысаналы технологиялық бағдарламаларды әзірлеудің әдістемесі мен өлшемшарттарын бекіту туралы» Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2022 жылғы 21 сәуірдегі № 133/НҚ бұйрығына өзгерістер енгізу туралы
