title:
  rus: Об утверждении Методики и критериев осуществления технологического прогнозирования, функционирования отраслевых центров технологических компетенций, организации технологических платформ и разработки целевых технологических программ
  kaz: Технологиялық болжауды жүзеге асырудың, салалық технологиялық құзырет орталықтарының жұмыс істеуінің, технологиялық платформаларды ұйымдастырудың және нысаналы технологиялық бағдарламаларды әзірлеудің әдістемесі мен өлшемшарттарын бекіту туралы
