    kaz: «Геодезия және картография саласындағы ұйымдардың басшылары мен мамандары лауазымдарының үлгілік біліктілік сипаттамаларын бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің міндетін атқарушының 2021 жылғы 28 шілдедегі № 268/НҚ бұйрығына өзгеріс енгізу туралы
