  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 28 июля 2021 года № 268/НҚ «Об утверждении Типовых квалификационных характеристик должностей руководителей и специалистов организаций в области геодезии и картографии»
    kaz: «Геодезия және картография саласындағы ұйымдардың басшылары мен мамандары лауазымдарының үлгілік біліктілік сипаттамаларын бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің міндетін атқарушының 2021 жылғы 28 шілдедегі № 268/НҚ бұйрығына өзгерістер енгізу туралы
