  title:
    rus: О внесении изменений в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 16 июня 2021 года № 213/НҚ «Об утверждении Правил обращения посредством видеоконференцсвязи или видеообращения участников административной процедуры к руководителям государственных органов и их заместителям»
    kaz: «Әкімшілік рәсімге қатысушылардың мемлекеттік органдардың басшыларына және олардың орынбасарларына бейнеконференц-байланыс немесе бейнежолданым арқылы жолданым беру қағидаларын бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2021 жылғы 16 маусымдағы № 213/НҚ бұйрығына өзгерістер енгізу туралы
