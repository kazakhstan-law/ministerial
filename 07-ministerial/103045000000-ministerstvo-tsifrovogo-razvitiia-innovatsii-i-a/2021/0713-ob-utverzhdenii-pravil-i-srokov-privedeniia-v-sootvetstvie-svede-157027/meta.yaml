  title:
    rus: О внесении изменений в приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 13 июля 2021 года № 246/НҚ «Об утверждении Правил и сроков приведения в соответствие сведений о заявителе или о лице, осуществляющем уход за инвалидом первой группы с детства, в информационных системах»
    kaz: «Ақпараттық жүйелердегі өтініш беруші туралы немесе бала кезінен бірінші топтағы мүгедекке күтімді жүзеге асыратын адам туралы мәліметтерді сәйкес келтіру мерзімдері мен қағидаларын бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2021 жылғы 13 шілдедегі № 246/НҚ бұйрығына өзгерістер енгізу туралы
