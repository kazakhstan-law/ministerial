act_code: '204508'
requisite: Приказ Председателя Комитета технического регулирования и метрологии Министерства торговли и интеграции Республики Казахстан от 20 декабря 2024 года № 442-НҚ
title:
  rus: Об утверждении Правил внутреннего расследования в отношении руководителей и их заместителей республиканского государственного предприятия на праве хозяйственного ведения «Казахстанский институт стандартизации и метрологии» Комитета технического регулирования и метрологии Министерства торговли и интеграции Республики Казахстан и республиканского государственного предприятия на праве хозяйственного ведения «Национальный центр аккредитации» Комитета технического регулирования и метрологии Министерства торговли и интеграции Республики Казахстан
  kaz: Қазақстан Республикасы Сауда және интеграция министрлігі Техникалық реттеу және метрология комитетінің «Қазақстандық стандарттау және метрология институты» шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорнының және Қазақстан Республикасы Сауда және интеграция министрлігі Техникалық реттеу және метрология комитетінің «Ұлттық аккредиттеу орталығы» шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорнының басшыларына және олардың орынбасарларына қатысты ішкі тергеп-тексеру қағидаларын бекіту туралы
