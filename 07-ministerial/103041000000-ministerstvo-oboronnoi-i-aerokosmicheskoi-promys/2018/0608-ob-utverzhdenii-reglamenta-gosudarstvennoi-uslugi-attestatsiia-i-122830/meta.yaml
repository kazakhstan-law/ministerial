act_code: '122830'
requisite: Приказ Министра оборонной и аэрокосмической промышленности Республики Казахстан от 8 июня 2018 года № 97/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 июня 2018 года № 17106. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 5 октября 2020 года № 374/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Аттестация информационной системы, информационно-коммуникационной платформы «электронного правительства» и интернет-ресурса государственного органа на соответствие требованиям информационной безопасности»
  kaz: «Ақпараттық жүйені, «электрондық үкіметтің» ақпараттық-коммуникациялық платформасын және мемлекеттік органның интернет-ресурсын ақпараттық қауіпсіздік талаптарына сәйкестікке аттестаттау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
