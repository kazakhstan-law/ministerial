act_code: '121138'
requisite: Приказ Министра оборонной и аэрокосмической промышленности Республики Казахстан от 10 апреля 2018 года № 66/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 апреля 2018 года № 16802. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 26 ноября 2019 года № 324/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства оборонной и аэрокосмической промышленности Республики Казахстан
  kaz: Қазақстан Республикасының Қорғаныс және аэроғарыш өнеркәсібі министрлігінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы
