act_code: '120042'
requisite: Приказ Министра оборонной и аэрокосмической промышленности Республики Казахстан от 16 марта 2018 года № 42/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 марта 2018 года № 16674. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 14 апреля 2020 года № 140/НҚ (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов государственных услуг, оказываемых Аэрокосмическим комитетом Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан
  kaz: Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлігінің Аэроғарыш комитеті көрсететін мемлекеттік көрсетілетін қызмет регламенттерін бекіту туралы
