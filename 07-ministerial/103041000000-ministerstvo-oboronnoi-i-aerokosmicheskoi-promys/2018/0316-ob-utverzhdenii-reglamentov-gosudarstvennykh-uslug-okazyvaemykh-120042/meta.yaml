caused_by:
  code: '135018'
  requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 26 сентября 2019 года № 246/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 октября 2019 года № 19431. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 14 апреля 2020 года № 140/НҚ (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра оборонной и аэрокосмической промышленности Республики Казахстан от 16 марта 2018 года № 42/НҚ «Об утверждении регламентов государственных услуг, оказываемых Аэрокосмическим комитетом Министерства оборонной и аэрокосмической промышленности Республики Казахстан и признании утратившими силу некоторых приказов»
    kaz: «Қазақстан Республикасы Қорғаныс және аэроғарыш өнеркәсібі министрлігінің Аэроғарыш комитеті көрсететін мемлекеттік көрсетілетін қызмет регламенттерін бекіту және кейбір бұйрықтардың күші жойылды деп тану туралы» Қазақстан Республикасы Қорғаныс және аэроғарыш өнеркәсібі министрінің 2018 жылғы 16 наурыздағы № 42/НҚ бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/135018/rus
