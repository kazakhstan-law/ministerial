  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 24 апреля 2015 года № 484 «Об утверждении Правил государственной регистрации космических объектов и прав на них и формы регистра космических объектов» и признании утратившими силу структурных элементов некоторых приказов министерств по инвестициям и развитию Республики Казахстан, оборонной и аэрокосмической промышленности Республики Казахстан, цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан
    kaz: «Ғарыш объектілерін және оларға құқықтарды мемлекеттік тіркеу қағидаларын және ғарыш объектілері тіркелімінің нысанын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 24 сәуірдегі № 484 бұйрығына өзгерістер енгізу және Қазақстан Республикасы Инвестициялар және даму, Қазақстан Республикасының Қорғаныс және аэроғарыш өнеркәсібі, Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрліктерінің кейбір бұйрықтарының құрылымдық элементтерінің күші жойылды деп тану туралы
