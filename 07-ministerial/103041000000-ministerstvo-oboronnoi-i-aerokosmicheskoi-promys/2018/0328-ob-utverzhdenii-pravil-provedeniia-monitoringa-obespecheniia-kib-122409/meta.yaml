title:
  rus: Об утверждении Правил проведения мониторинга обеспечения кибербезопасности цифровых объектов «цифрового правительства» и критически важных цифровых объектов
  kaz: «Цифрлық үкіметтің» цифрлық объектілерінің және аса маңызды цифрлық объектілерінің киберқауіпсіздігін қамтамасыз ету мониторингін жүргізу қағидаларын бекіту туралы
