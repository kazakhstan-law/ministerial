caused_by:
  code: '204598'
  requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 20 декабря 2024 года № 829/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 декабря 2024 года № 35510. Утратил силу приказом Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 2 июня 2026 года № 279/НҚ (вводится в действие с 12 июля 2026 года)
  title:
    rus: О внесении изменения в приказ Министра оборонной и аэрокосмической промышленности Республики Казахстан от 28 марта 2018 года № 53/НҚ «Об утверждении Правил формирования и ведения реестра доверенного программного обеспечения и продукции электронной промышленности, а также критериев по включению программного обеспечения и продукции электронной промышленности в реестр доверенного программного обеспечения и продукции электронной промышленности»
    kaz: Қазақстан Республикасы Қорғаныс және аэроғарыш өнеркәсібі министрінің 2018 жылғы 28 наурыздағы № 53/НҚ «Сенім білдірілген бағдарламалық қамтылым және электрондық өнеркәсіп өнімдері тізілімін қалыптастыру және жүргізу қағидаларын, сондай-ақ бағдарламалық қамтылым мен электрондық өнеркәсіп өнімдерін сенім білдірілген бағдарламалық қамтылым және электрондық өнеркәсіп өнімдері тізіліміне енгізу критерийлерін бекіту туралы» бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/204598/rus
