caused_by:
  code: '133093'
  requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 2 июля 2019 года № 147/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июля 2019 года № 18980. Утратил силу приказом Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 2 июня 2026 года № 279/НҚ (вводится в действие с 12 июля 2026 года)
  title:
    rus: О внесении изменений в приказ Министра оборонной и аэрокосмической промышленности Республики Казахстан от 28 марта 2018 года № 53/НҚ «Об утверждении Правил формирования и ведения реестра доверенной продукции электронной промышленности и программного обеспечения, а также критериев включения продукции электронной промышленности и программного обеспечения в реестр доверенной продукции электронной промышленности и программного обеспечения»
    kaz: «Электрондық өнеркәсіп пен бағдарламалық қамтылымның сенім білдірілген өнімінің тізілімін қалыптастыру және жүргізу қағидаларын, сондай-ақ электрондық өнеркәсіп пен бағдарламалық қамтылымның өнімін электрондық өнеркәсіп пен бағдарламалық қамтылымның сенім білдірілген өнімінің тізіліміне енгізу өлшемшарттарын бекіту туралы» Қазақстан Республикасы Қорғаныс және аэроғарыш өнеркәсібі министрінің 2018 жылғы 28 наурыздағы № 53/НҚ бұйрығына өзгерістер енгізу туралы
