caused_by:
  code: '146974'
  requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 29 сентября 2020 года № 357/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 октября 2020 года № 21349
  title:
    rus: О внесении изменений в приказ Министра оборонной и аэрокосмической промышленности Республики Казахстан от 16 марта 2018 года № 44/НҚ «Об утверждении Правил создания и обеспечения функционирования единой национальной резервной платформы хранения электронных информационных ресурсов»
    kaz: «Электрондық ақпараттық ресурстарды сақтаудың бірыңғай ұлттық резервтік платформасын құру және оның жұмыс істеуін қамтамасыз ету қағидаларын бекіту туралы» Қазақстан Республикасының Қорғаныс және аэроғарыш өнеркәсібі министрінің 2018 жылғы 16 наурыздағы № 44/НҚ бұйрығына өзгерістер енгізу туралы.
