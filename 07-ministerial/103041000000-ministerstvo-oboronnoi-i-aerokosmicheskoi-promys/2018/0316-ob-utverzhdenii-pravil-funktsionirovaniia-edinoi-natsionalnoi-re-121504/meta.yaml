    rus: О внесении изменений в приказ Министра оборонной и аэрокосмической промышленности Республики Казахстан от 16 марта 2018 года № 44/НҚ «Об утверждении Правил функционирования единой национальной резервной платформы хранения электронных информационных ресурсов»
    kaz: «Электрондық ақпараттық ресурстарды сақтаудың бірыңғай ұлттық резервтік платформасының жұмыс істеу қағидаларын бекіту туралы» Қазақстан Республикасының Қорғаныс және аэроғарыш өнеркәсібі министрінің 2018 жылғы 16 наурыздағы № 44/НҚ бұйрығына өзгерістер енгізу туралы
