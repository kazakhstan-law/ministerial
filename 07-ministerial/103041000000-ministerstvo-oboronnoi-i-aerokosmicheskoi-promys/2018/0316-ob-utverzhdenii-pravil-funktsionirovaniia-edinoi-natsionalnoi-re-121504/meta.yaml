title:
  rus: Об утверждении Правил функционирования единой национальной резервной платформы хранения цифровых ресурсов, периодичность резервного копирования цифровых ресурсов критически важных цифровых объектов
  kaz: Цифрлық ресурстарды сақтаудың бірыңғай ұлттық резервтік платформасының жұмыс істеу қағидаларын, аса маңызды цифрлық объектілердің цифрлық ресурстарын резервтік кешіру кезеңділігін бекіту туралы
