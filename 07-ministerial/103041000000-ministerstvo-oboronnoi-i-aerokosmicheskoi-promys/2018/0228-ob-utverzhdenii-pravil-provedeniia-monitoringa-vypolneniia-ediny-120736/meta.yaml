  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра оборонной и аэрокосмической промышленности Республики Казахстан от 28 февраля 2018 года № 33/НҚ «Об утверждении Правил проведения мониторинга выполнения единых требований в области информационно-коммуникационных технологий и обеспечения информационной безопасности»
    kaz: Қазақстан Республикасының Қорғаныс және аэроғарыш өнеркәсібі министрінің міндетін атқарушы 2018 жылғы 28 ақпандағы №33/НҚ «Ақпараттық-коммуникациялық технологиялар және ақпараттық қауіпсіздікті қамтамасыз ету саласындағы бірыңғай талаптардың орындалуына мониторинг жүргізу қағидаларын бекіту туралы» бұйрығына өзгерістер енгізу туралы
