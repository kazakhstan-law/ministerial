requisite: Приказ Министра оборонной и аэрокосмической промышленности Республики Казахстан от 14 декабря 2018 года № 215/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 декабря 2018 года № 17968. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 24 апреля 2020 года № 233 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
