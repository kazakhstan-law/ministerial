  requisite: Приказ Министра оборонной и аэрокосмической промышленности Республики Казахстан от 22 мая 2017 года № 92/НҚ. Утратил силу приказом и.о. Министра цифрового развития, оборонной и аэрокосмической промышленности Республики Казахстан от 9 апреля 2019 года № 30/НҚ
  title:
    rus: О внесении изменения и дополнения в приказ Министра оборонной и аэрокосмической промышленности Республики Казахстан от 16 ноября 2016 года № 1/НҚ «Об утверждении Положения об Аэрокосмическом комитете Министерства оборонной и аэрокосмической промышленности Республики Казахстан»
    kaz: «Қазақстан Республикасы Қорғаныс және аэроғарыш өнеркәсібі министрлігінің Аэроғарыш комитеті туралы ережені бекіту туралы» Қазақстан Республикасы Қорғаныс және аэроғарыш өнеркәсібі министрінің 2016 жылғы 16 қарашадағы № 1/НҚ бұйрығына өзгеріс пен толықтыру енгізу туралы
