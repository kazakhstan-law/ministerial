title:
  rus: Об утверждении Положения республиканского государственного учреждения "Комитет по информационной безопасности Министерства оборонной и аэрокосмической промышленности Республики Казахстан"
  kaz: '"Қазақстан Республикасы Қорғаныс және аэроғарыш өнеркәсібі министрлігінің Ақпараттық қауіпсіздік комитеті" республикалық мемлекеттік мекемесінің ережесін бекіту туралы'
