  title:
    rus: О внесении изменения в приказ Министра оборонной и аэрокосмической промышленности Республики Казахстан от 17 ноября 2016 года № 5/НҚ «Об утверждении Положения республиканского государственного учреждения «Комитет по информационной безопасности Министерства оборонной и аэрокосмической промышленности Республики Казахстан»
    kaz: «Қазақстан Республикасы Қорғаныс және аэроғарыш өнеркәсібі министрлігінің Ақпараттық қауіпсіздік комитеті» республикалық мемлекеттік мекемесінің ережесін бекіту туралы» Қазақстан Республикасы Қорғаныс және аэроғарыш өнеркәсібі министрінің 2016 жылғы 17 қарашадағы № 5/НҚ бұйрығына өзгеріс енгізу туралы
