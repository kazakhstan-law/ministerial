  code: '142212'
  requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 24 апреля 2020 года № 233. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 апреля 2020 года № 20493
  title:
    rus: Об утверждении Правил оказания государственной услуги «Выдача лицензии на осуществление деятельности по разработке, производству, ремонту, приобретению и реализации боеприпасов, вооружения и военной техники, запасных частей, комплектующих изделий приборов к ним, а также специальных материалов и оборудования для их производства, включая монтаж, наладку, модернизацию, установку, использование, хранение, ремонт и сервисное обслуживание»
    kaz: «Оқ-дәрілерді, қару-жарақ пен әскери техниканы, олардың қосалқы бөлшектерін, жинақтаушы бұйымдары мен аспаптарын, сондай-ақ монтаждауды, реттеуді, жаңғыртуды, орнатуды, пайдалануды, сақтауды, жөндеуді және сервистік қызмет көрсетуді қоса алғанда, оларды өндіруге арналған арнайы материалдар мен жабдықтарды әзірлеу, өндіру, жөндеу, сатып алу және сату жөніндегі қызметті жүзеге асыруға лицензия беру» мемлекеттік қызметті көрсету қағидаларын бекіту туралы
  link: https://zan.gov.kz/client/#!/doc/142212/rus
