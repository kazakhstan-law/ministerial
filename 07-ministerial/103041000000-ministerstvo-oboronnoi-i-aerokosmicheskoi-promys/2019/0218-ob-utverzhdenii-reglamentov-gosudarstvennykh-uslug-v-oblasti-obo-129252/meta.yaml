requisite: Приказ и.о. Министра оборонной и аэрокосмической промышленности Республики Казахстан от 18 февраля 2019 года № 28/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 февраля 2019 года № 18329. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 24 апреля 2020 года № 233 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов государственных услуг в области оборота вооружений, военной техники и отдельных видов оружия
  kaz: Қару-жарақ, әскери техника және жекелеген қару түрлерінің айналымы саласындағы мемлекеттiк көрсетілетін қызметтер регламенттерiн бекiту туралы
