act_code: '111994'
requisite: Приказ Министра оборонной и аэрокосмической промышленности Республики Казахстан от 12 апреля 2017 года № 62 НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 мая 2017 года № 15095. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 10 сентября 2020 года № 331/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи служебного удостоверения Министерства оборонной и аэрокосмической промышленности Республики Казахстан и его описания
  kaz: Қазақстан Республикасы Қорғаныс және аэроғарыш өнеркәсібі министрлігінің қызметтік куәлігін беру қағидаларын және оның сипаттамасын бекіту туралы
