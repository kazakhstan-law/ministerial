act_code: '113335'
requisite: Приказ Министра оборонной и аэрокосмической промышленности Республики Казахстан от 1 июня 2017 года № 100/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июля 2017 года № 15312. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 3 февраля 2020 года № 40/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил применения поощрения государственных служащих Министерства оборонной и аэрокосмической промышленности Республики Казахстан
  kaz: Қазақстан Республикасы Қорғаныс және аэроғарыш өнеркәсібі министрлігінің мемлекеттік қызметшілерін көтермелеуді қолдану қағидаларын бекіту туралы
