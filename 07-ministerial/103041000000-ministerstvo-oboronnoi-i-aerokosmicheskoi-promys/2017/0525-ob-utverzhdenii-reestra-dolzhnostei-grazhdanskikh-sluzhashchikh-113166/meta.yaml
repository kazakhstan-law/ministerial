requisite: Приказ Министра оборонной и аэрокосмической промышленности Республики Казахстан от 25 мая 2017 года № 95/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 июня 2017 года № 15269. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 30 декабря 2019 года № 373/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении реестра должностей гражданских служащих Министерства оборонной и аэрокосмической промышленности Республики Казахстан
  kaz: Қазақстан Республикасы Қорғаныс және аэроғарыш өнеркәсібі министрлігінің азаматтық қызметшілері лауазымдарының тізілімін бекіту туралы
