requisite: Приказ Министра оборонной и аэрокосмической промышленности Республики Казахстан от 25 августа 2017 года № 154/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 сентября 2017 года № 15711. Утратил силу приказом Министра оборонной и аэрокосмической промышленности Республики Казахстан от 10 апреля 2018 года № 66/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства оборонной и аэрокосмической промышленности Республики Казахстан
  kaz: Қазақстан Республикасының Қорғаныс және аэроғарыш өнеркәсібі министрлігінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы
