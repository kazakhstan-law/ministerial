act_code: '117805'
requisite: Приказ Министра оборонной и аэрокосмической промышленности Республики Казахстан от 27 декабря 2017 года № 239/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 января 2018 года № 16201. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 13 ноября 2019 года № 302/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня открытых данных Министерства оборонной и аэрокосмической промышленности Республики Казахстан, размещаемых на интернет-портале открытых данных
  kaz: Қазақстан Республикасы Қорғаныс және аэроғарыш өнеркәсібі министрлігінің ашық деректердің интернет-порталында орналастырылатын ашық деректерінің тізбесін бекіту туралы
