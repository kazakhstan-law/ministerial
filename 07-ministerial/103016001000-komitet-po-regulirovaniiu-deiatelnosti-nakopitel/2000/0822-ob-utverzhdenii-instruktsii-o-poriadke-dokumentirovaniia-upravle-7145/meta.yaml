act_code: '7145'
requisite: Приказ Комитета по регулированию деятельности накопительных пенсионных фондов Министерства труда и социальной защиты населения Республики Казахстан от 23 августа 2000 года N 92-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 октября 2000 года N 1249. Утратил силу - постановлением Правления Агентства РК по регулированию и надзору финансового рынка и финансовых организаций от 27 декабря 2004 года N 377 (V043422)
title:
  rus: Об утверждении Инструкции о порядке документирования, управления документацией, организации и сроках хранения документов в накопительных пенсионных фондах
  kaz: '"Жинақтаушы зейнетақы қорлары да құжаттамалаудың, құжаттаманы басқарудың, құжаттарды ұйымдастырудың және сақтау мерзiмдерiнiң тәртiбi туралы нұсқаулықты бекiту туралы"'
