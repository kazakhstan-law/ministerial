  title:
    rus: О внесении изменения в приказ Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 18 декабря 1998 года N 171-П "Об утверждении Инструкции о порядке информирования накопительными пенсионными фондами вкладчиков и получателей о состоянии их пенсионных накоплений"
    kaz: '"Жинақтаушы зейнетақы қорларының салымшылары мен алушыларын олардың зейнетақы жинақтарының жайы жөнiнде ақпараттау тәртiбi туралы Нұсқаулықты бекiту" туралы Қазақстан Республикасының Еңбек және халықты әлеуметтiк қорғау Министрлiгiнiң Ұлттық зейнетақы агенттiгiнiң 1998 жылғы 18 желтоқсандағы N 171 бұйрығына өзгерту енгiзу туралы'
