act_code: '2154'
requisite: Приказ Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 18 декабря 1998 года № 175-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 января 1999 года № 670. Утратил силу постановлением Правления Нацбанка Республики Казахстан от 4 июля 2003 года № 213
title:
  rus: Об утверждении изменений и дополнений в "Положение по ведению бухгалтерского учета и финансовой отчетности в накопительных пенсионных фондах", утвержденное приказом Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 13 октября 1997 года № 10-П (Государственная регистрация от 13 ноября 1997 года № 417)
  kaz: Қазақстан Республикасының Еңбек және халықты әлеуметтік қорғау министрлiгi Ұлттық зейнетақы агенттiгiнiң 1997 жылғы 13 қазандағы № 10-ө бұйрығымен бекiтiлген (1997 жылғы 13 қарашадағы мемлекеттік тiркеу № 417) "Жинақтаушы зейнетақы қорларындағы бухгалтерлiк есеп жүргiзу және қаржылық есеп беру жөніндегi ережеге" өзгерiстер мен толықтырулар енгiзу туралы
