act_code: '2119'
requisite: Приказ Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 18 декабря 1998 года № 174-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 22.01.1999 г. № 673. Утратил силу - постановлением Правления Национального Банка Республики Казахстан от 21.04.2003г. № 138 (V032345)
title:
  rus: Об утверждении Изменений и дополнений в "Основные требования к Пенсионным правилам накопительного пенсионного фонда", утвержденные приказом Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан № 3-П от 27 августа 1997 года
  kaz: Қазақстан Республикасының Еңбек және халықты әлеуметтік қорғау министрлігі Ұлттық зейнетақы агенттігінің 1997 жылғы 27 тамыздағы № 3-Ө бұйрығымен бекітілген (1997 жылғы 12 қыркүйектегі мемлекеттік тіркелім № 367), 1998 жылғы 9 наурыздағы № 29-Ө өзгерістермен және толықтырулармен (1998 жылғы 18 наурыздағы мемлекеттік тіркелім № 73) "Жинақтаушы зейнетақы қорының ережелеріне қойылатын негізгі талаптарға" өзгерістер мен толықтыруларды бекіту туралы
