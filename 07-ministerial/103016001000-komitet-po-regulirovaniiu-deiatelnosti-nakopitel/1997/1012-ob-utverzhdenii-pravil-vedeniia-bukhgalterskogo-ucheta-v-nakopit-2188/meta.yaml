title:
  rus: Об утверждении Правил ведения бухгалтерского учета в накопительных пенсионных фондах и представления финансовой отчетности
  kaz: Жинақтаушы зейнетақы қорларында бухгалтерлiк есеп жүргiзу және қаржылық есеп тапсыру ережелерi
