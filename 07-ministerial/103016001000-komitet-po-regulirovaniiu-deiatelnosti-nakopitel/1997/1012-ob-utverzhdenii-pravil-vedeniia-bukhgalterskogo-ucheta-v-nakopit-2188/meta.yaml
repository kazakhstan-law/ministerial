  code: '5960'
  requisite: Приказ Председателя Комитета по регулированию деятельности накопительных пенсионных фондов Министерства труда и социальной защиты населения Республики Казахстан от 21.03.2000г. N 20-п Зарегистрирован в Министерстве юстиции Республики Казахстан 13.05.2000г. за N 1132. Утратил силу - постановлением Правления Нацбанка РК от 4 июля 2003 г. N 213
  title:
    rus: О внесении изменений и дополнений в "Правила ведения бухгалтерского учета в накопительных пенсионных фондах и представления финансовой отчетности", утвержденные приказом Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 13 октября 1997 года N 10-П с изменениями и дополнениями от 18 декабря 1998 года, приказ N 68-П (государственная регистрация 21 января 1999 года N 670)
    kaz: Қазақстан Республикасының Еңбек және халықты әлеуметтiк қорғау министрлiгi Ұлттық зейнетақы агенттiгiнің 1997 жылғы 13 қазандағы N 10-Ө бұйрығымен бекiтiлген, 1998 жылғы 18 желтоқсандағы N 68-Ө өзгерiстермен және толықтырулармен (1999 жылғы 21 қаңтардағы мемлекеттiк тiркеу N 670) "Жинақтаушы зейнетақы қорларындағы бухгалтерлiк есеп жүргiзу және қаржылық есеп беру жөнiндегi ережеге" өзгерiстер мен толықтырулар енгiзу туралы"
  link: https://zan.gov.kz/client/#!/doc/5960/rus
