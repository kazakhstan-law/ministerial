act_code: '1327'
requisite: Приказ Национального пенсионного агентства Министерства труда и социальной защиты населения Республики Казахстан от 3 декабря 1997 г. N 31-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 11.02.1998 г. за N 452. Утратил силу - постановлением Правления Национального Банка Республики Казахстан от 29 мая 2003 года N 176 (V032386)
title:
  rus: О квалификационных требованиях, предъявляемых к лицензиату, учредителям и руководящим работникам накопительных пенсионных фондов и документах, подтверждающих указанные требования для получения лицензии на осуществление деятельности по привлечению пенсионных взносов и осуществлению пенсионных выплат
  kaz: '"Зейнетақы жарналарын тарту және зейнетақы төлемдерiн жүзеге асыру жөнiндегi қызметтi жүзеге асыруға лицензия алу үшiн лицензиатқа, жинақтаушы зейнетақы қорларының құрылтайшыларына және басшы қызметкерлерiне қойылатын бiлiктiлiк талаптары және аталған талаптарды растайтын құжаттар туралы"'
