  title:
    rus: О внесении изменений и дополнений в приказ "О квалификационных требованиях, предъявляемых к лицензиату, учредителям и руководящим работникам накопительных пенсионных фондов, и документах, подтверждающих указанные требования для получения лицензии на осуществление деятельности по привлечению пенсионных взносов и осуществлению пенсионных выплат"
    kaz: '"Зейнетақы жарналарын тарту және зейнетақы төлемдерін жүзеге асыру жөніндегі қызметті жүзеге асыруға лицензия алу үшін лицензиатқа, жинақтаушы зейнетақы қорларының құрылтайшыларына және басшы қызметкерлеріне қойылатын біліктілік талаптары және аталған талаптарды растайтын құжаттар туралы" бұйрыққа өзгерістер мен толықтырулар енгізу туралы'
