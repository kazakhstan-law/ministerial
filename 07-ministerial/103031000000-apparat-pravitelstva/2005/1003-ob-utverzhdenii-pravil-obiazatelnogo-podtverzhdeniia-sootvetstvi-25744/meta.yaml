act_code: '25744'
requisite: Приказ Руководителя Канцелярии Премьер-Министра Республики Казахстан от 3 октября 2005 года № 25-1-90. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 ноября 2005 года № 3923. Утратил силу приказом Руководителя Канцелярии Премьер-Министра Республики Казахстан от 14 июня 2013 года № 25-1-21
title:
  rus: Об утверждении Правил обязательного подтверждения соответствия информационных систем, технических, программно-технических и программных средств (изделий), технических средств защиты информации требованиям информационной безопасности
  kaz: Ақпараттық жүйелердің, техникалық, бағдарламалық-техникалық және бағдарламалық құралдардың (бұйымдардың), ақпаратты қорғаудың техникалық құралдарының ақпараттық қауіпсіздік талаптарына сәйкестігін міндетті растау ережесін бекіту туралы
