requisite: Приказ Руководителя Канцелярии Премьер-Министра Республики Казахстан от 14 июня 2013 года № 25-1-21. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 июля 2013 года № 8543. Утратил силу приказом Руководителя Канцелярии Премьер-Министра Республики Казахстан от 15 марта 2021 года № 10-4-10 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по подтверждению соответствия информационных систем, технических, программно-технических и программных средств (изделий), технических средств защиты информации требованиям информационной безопасности
  kaz: Ақпараттық жүйелердің, техникалық, бағдарламалық-техникалық және бағдарламалық құралдардың (бұйымдардың), ақпаратты қорғаудың техникалық құралдарының ақпараттық қауіпсіздік талаптарына сәйкестігін растау жөніндегі Нұсқаулығын бекіту туралы
