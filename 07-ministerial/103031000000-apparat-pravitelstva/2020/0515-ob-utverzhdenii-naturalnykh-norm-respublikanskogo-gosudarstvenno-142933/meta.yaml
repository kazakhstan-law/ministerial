requisite: Приказ Руководителя Канцелярии Премьер-Министра Республики Казахстан от 15 мая 2020 года № 10-4-28. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 мая 2020 года № 20659. Утратил силу приказом Заместителя Премьер-Министра - Руководителя Аппарата Правительства Республики Казахстан от 17 марта 2023 года № 10-4-37 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
