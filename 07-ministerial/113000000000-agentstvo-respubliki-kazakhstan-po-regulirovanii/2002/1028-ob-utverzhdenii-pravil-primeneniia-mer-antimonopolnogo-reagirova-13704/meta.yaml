  title:
    rus: О внесении изменения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 28 октября 2002 года № 216-ОД "Об утверждении Правил применения мер антимонопольного реагирования на нарушения антимонопольного законодательства"
    kaz: '"Монополияға қарсы заң бұзушылықтарға монополияға қарсы ден қою шараларын қолдану ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2002 жылғы 28 қазандағы № 216-НҚ бұйрығына өзгеріс енгізу туралы'
