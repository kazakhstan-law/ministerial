act_code: '23523'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 4 марта 2005 года № 70-ОД. Зарегистрирован Министерством юстиции Республики Казахстан 28 марта 2005 года № 3516. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 19 июля 2013 года № 216-ОД
title:
