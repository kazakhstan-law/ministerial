  title:
    rus: '"О внесении изменений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 4 марта 2005 года № 70-ОД "Об утверждении Правил представления и рассмотрения ходатайств о даче согласия на осуществление субъектами естественных монополий иной деятельности"'
    kaz: '"Табиғи монополиялар субъектілерінің өзге қызметті жүзеге асыруға келісім беру туралы өтініштерін ұсыну және оны қарау ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2005 жылғы 4 наурыздағы № 70-НҚ бұйрығына өзгерістер енгізу туралы'
