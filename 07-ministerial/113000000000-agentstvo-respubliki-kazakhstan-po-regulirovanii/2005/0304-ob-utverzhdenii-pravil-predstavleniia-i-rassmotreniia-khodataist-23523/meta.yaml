  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 30 марта 2006 года № 89-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 апреля 2006 года № 4184. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 19 июля 2013 года № 216-ОД
  title:
    rus: О внесении изменений и дополнения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 4 марта 2005 года N 70-ОД "Об утверждении Правил представления и рассмотрения ходатайств о даче согласия на осуществление субъектами естественных монополий иной деятельности"
    kaz: '"Табиғи монополиялар субъектілерінің өзге қызметті жүзеге асыруға келісім беру туралы өтініштерін ұсыну және оны қарау ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттiгi төрағасының 2005 жылғы 4 наурыздағы N 70-НҚ бұйрығына өзгерістер мен толықтыру енгізу туралы'
