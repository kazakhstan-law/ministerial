  title:
    rus: О внесении изменений и дополнений в некоторые приказы Председателя Агентства Республики Казахстан по регулированию естественных монополий
    kaz: Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының кейбір бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
