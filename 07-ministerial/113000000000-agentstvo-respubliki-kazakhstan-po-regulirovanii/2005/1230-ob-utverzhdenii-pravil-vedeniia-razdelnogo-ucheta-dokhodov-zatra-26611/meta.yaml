act_code: '26611'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 30 декабря 2005 года № 384-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 января 2006 года № 4060. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественных монополий, оказывающими услуги магистральной железнодорожной сети
  kaz: Магистральдық темiр жол желiсiнiң қызметтерiн көрсететiн табиғи монополиялар субъектiлерiнiң кірістерді, шығындар мен тартылған активтерді бөлек есепке алуды жүргізу қағидаларын бекіту туралы
