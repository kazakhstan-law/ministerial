  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 30 декабря 2005 года № 384-ОД  «Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественных монополий, оказывающими услуги магистральной железнодорожной сети»
    kaz: «Магистральдық темiр жол желiсiнiң қызметтерiн көрсететiн табиғи монополиялар субъектiлерiнiң табыстарды, шығындар мен қолданысқа енгiзiлген активтердi бөлектеп есепке алуды жүргiзу ережесiн бекiту туралы» Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2005 жылғы 30 желтоқсандағы № 384-НҚ бұйрығына өзгерістер енгізу туралы
