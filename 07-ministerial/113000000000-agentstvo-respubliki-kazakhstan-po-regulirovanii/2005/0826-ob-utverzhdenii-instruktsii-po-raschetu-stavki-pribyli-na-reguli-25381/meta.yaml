act_code: '25381'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 26 августа 2005 года N 255-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан от 28 сентября 2005 года N 3859. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 16 апреля 2013 года № 117-ОД
title:
  rus: Об утверждении Инструкции по расчету ставки прибыли на регулируемую базу задействованных активов субъектов естественных монополий, оказывающих общедоступные услуги почтовой связи
  kaz: Почта байланысының жалпыға қол жетімді қызметтерін көрсететін табиғи монополиялар субъектілерінің қолданысқа енгізілген активтерінің реттелетін базасына пайда ставкасын есептеу жөніндегі нұсқаулықты бекіту туралы
