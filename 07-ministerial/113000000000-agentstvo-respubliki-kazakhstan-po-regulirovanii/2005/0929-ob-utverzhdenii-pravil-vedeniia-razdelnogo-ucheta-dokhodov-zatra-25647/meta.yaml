act_code: '25647'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 29 сентября 2005 года № 284-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан от 21 октября 2005 года № 3908. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 26 июля 2013 года № 227-ОД
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественной монополии, оказывающими услуги по транспортировке нефти и (или) нефтепродуктов по магистральным трубопроводам
  kaz: Мұнайды және (немесе) мұнай өнімдерін магистральдық таратушы құбырлары арқылы тасымалдау жөнінде қызметтер көрсететін табиғи монополия субъектілерінің табыстарды, шығындар мен қолданысқа енгізілген активтерді бөлектеп есепке алуды жүргізу ережесін бекіту туралы
