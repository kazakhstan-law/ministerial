act_code: '25117'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 7 июля 2005 года № 214-OД. Зарегистрирован в Министерстве юстиции Республики Казахстан от 29 июля 2005 года № 3761. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 17 мая 2010 года № 164-ОД
title:
  rus: Об утверждении Правил предоставления равных условий доступа к регулируемым услугам (товарам, работам) в сфере телекоммуникаций при условии отсутствия конкурентного оператора связи по причине технологической невозможности либо экономической нецелесообразности предоставления данных видов услуг, за исключением универсальных услуг телекоммуникаций, а также в сфере предоставления в имущественный найм (аренду) или пользование кабельной канализации и иных основных средств, технологически связанных с присоединением сетей телекоммуникаций к сети телекоммуникаций общего пользования
  kaz: Телекоммуникациялар көрсететiн әмбебап қызметтердi қоспағанда, қызметтердiң осы түрлерiн ұсынудың технологиялық мүмкiн болмауы не экономикалық тиiмсiздiгі себебiнен бәсекелес байланыс операторы болмаған кезде телекоммуникациялар саласындағы, сондай-ақ телекоммуникациялар желiлерiн ортақ пайдаланудағы телекоммуникациялар желiсiне қосуға технологиялық жағынан байланысты кәбiлдiк кәрiздер мен өзге де негiзгі құралдарды мүлiктiк жалдауға (жалға) немесе пайдалануға беру саласындағы реттелетiн қызметтерге (тауарларға, жұмыстарға) қол жеткiзудiң тең жағдайларын ұсыну ережесiн бекiту туралы
