  title:
    rus: О внесении изменений в некоторые приказы уполномоченного органа, осуществляющего контроль и регулирование деятельности в сферах естественных монополий
    kaz: Табиғи монополиялар салаларында қызметті бақылау мен реттеуді жүзеге асыратын уәкілетті органның кейбір бұйрықтарына өзгерістер енгізу туралы
