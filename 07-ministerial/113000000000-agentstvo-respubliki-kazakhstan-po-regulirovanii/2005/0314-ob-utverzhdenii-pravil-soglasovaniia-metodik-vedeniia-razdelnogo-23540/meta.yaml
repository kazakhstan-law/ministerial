  title:
    rus: О внесении изменений в некоторые приказы уполномоченного органа, осуществляющего руководство в сферах естественных монополий и на регулируемых рынках
    kaz: Табиғи монополиялар салаларындағы және реттелетін нарықтарда басшылықты жүзеге асыратын уәкілетті органның кейбір бұйрықтарына өзгерістер енгізу туралы
