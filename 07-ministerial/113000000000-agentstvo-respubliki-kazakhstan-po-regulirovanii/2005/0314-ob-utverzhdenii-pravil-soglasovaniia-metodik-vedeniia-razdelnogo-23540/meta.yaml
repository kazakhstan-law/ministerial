act_code: '23540'
requisite: Приказ и.о.Председателя Агентства Республики Казахстан по регулированию естественных монополий от 14 марта 2005 года N 85-ОД. Зарегистрирован Министерством юстиции Республики Казахстан 31 марта 2005 года N 3531. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 января 2018 года № 22 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил согласования методик ведения раздельного учета доходов, затрат и задействованных активов по регулируемым видам услуг субъектов естественных монополий
  kaz: Табиғи монополиялар субъектілері қызметтерінің реттеліп көрсетілетін түрлері бойынша табыстарды, шығындар мен қолданысқа енгізілген активтерді бөлектеп есепке алуды жүргізу әдістемесін келісу ережесін бекіту туралы
