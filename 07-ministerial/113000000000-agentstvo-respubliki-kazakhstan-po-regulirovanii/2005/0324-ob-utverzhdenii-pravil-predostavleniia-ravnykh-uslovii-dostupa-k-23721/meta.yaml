  title:
    rus: О внесении дополнения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 24 марта 2005 года № 100-ОД "Об утверждении Правил предоставления равных условий доступа к регулируемым услугам (товарам, работам) в сфере транспортировки нефти и (или) нефтепродуктов по магистральным трубопроводам"
    kaz: '"Мұнайды және (немесе) мұнай өнімдерін магистральдық труба құбырлары арқылы тасымалдау саласындағы реттеліп көрсетілетін қызметтерге (тауарларға, жұмыстарға) қол жеткізуге тең жағдайлар беру ережесін бекіту туралы" Қазақстан Республикасының Табиғи монополияларды реттеу агенттігі төрағасының 2005 жылғы 24 наурыздағы N 100-НҚ бұйрығына толықтыру енгізу туралы'
