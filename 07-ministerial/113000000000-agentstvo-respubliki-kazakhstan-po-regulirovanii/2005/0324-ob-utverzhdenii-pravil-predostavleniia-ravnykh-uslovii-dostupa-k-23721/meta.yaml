  kaz: Мұнайды және (немесе) мұнай өнімдерін магистральдық труба құбырлары арқылы тасымалдау саласындағы реттеліп көрсетілетін қызметтерге (тауарларға, жұмыстарға) қол жеткізуге тең жағдайлар беру ережесін бекіту туралы
