requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 24 марта 2005 года № 100-ОД. Зарегистрирован Министерством юстиции Республики Казахстан 31 марта 2005 года № 3534. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 27 марта 2012 года № 53-ОД
title:
