act_code: '25562'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 13 сентября 2005 года № 266-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан от 5 октября 2005 года № 3872. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 24 июля 2013 года № 221-ОД
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественных монополий, оказывающими услуги по производству и (или) передаче и (или) распределению тепловой энергии
  kaz: Жылу энергиясын өндіру және (немесе) беру және (немесе) бөлу бойынша қызметтер көрсететін табиғи монополиялар субъектілерінің табыстарды, шығындар мен қолданысқа енгізілген активтерді бөлектеп есепке алуды жүргізу ережесін бекіту туралы
