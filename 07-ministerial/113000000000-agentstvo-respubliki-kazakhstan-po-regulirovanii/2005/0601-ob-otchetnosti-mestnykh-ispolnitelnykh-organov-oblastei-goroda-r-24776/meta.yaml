act_code: '24776'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 1 июня 2005 года N 183-ОД. Зарегистрирован Министерством юстиции Республики Казахстан 11 июля 2005 года N 3724. Утратил силу приказом Председателя Агентства РК по регулированию естественных монополий от 17 июля 2006 года N 174-ОД
title:
  rus: Об отчетности местных исполнительных органов областей (города республиканского значения, столицы) о деятельности субъектов естественных монополий, включенных в местные разделы Государственного регистра субъектов естественных монополий
  kaz: Табиғи монополиялар субъектілерінің Мемлекеттік тіркелімінің жергілікті бөлімдеріне енгізілген табиғи монополиялар субъектілерінің қызметі туралы облыстардың (республикалық маңызы бар қаланың, астананың) жергілікті атқарушы органдарының есептілігі туралы
