  title:
    rus: О внесении дополнений и изменения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 1 июня 2005 года N 183-ОД "Об отчетности местных исполнительных органов областей (города республиканского значения, столицы) о деятельности субъектов естественных монополий, включенных в местные разделы Государственного регистра субъектов естественных монополий"
    kaz: '"Табиғи монополиялар субъектiлерiнiң мемлекеттiк тiркелiмiнiң жергiлiктi бөлiмдерiне енгiзiлген табиғи монополиялар субьектiлерiнiң қызметi туралы облыстардың (республикалық маңызы бар қаланың, астананың) жергiлiктi атқарушы органдарының есептiлiгi туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттiгi төрағасының 2005 жылғы 1 маусымдағы N 183-НҚ бұйрығына толықтырулар мен өзгерiс енгiзу туралы'
  link: https://zan.gov.kz/client/#!/doc/26893/rus
