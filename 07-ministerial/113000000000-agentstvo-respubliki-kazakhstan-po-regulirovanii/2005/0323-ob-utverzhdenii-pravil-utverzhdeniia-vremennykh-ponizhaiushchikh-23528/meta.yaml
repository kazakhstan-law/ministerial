  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 23 марта 2005 года № 93-ОД "Об утверждении Правил утверждения временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на услуги по транспортировке воды по магистральным трубопроводам и (или) каналам"
    kaz: '"Суды магистральдық құбыржолдары және (немесе) арналар арқылы тасымалдау жөніндегі қызметтердің тарифтеріне (бағаларына, алым ставкаларына) уақытша төмендету коэффициенттерін бекіту ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2005 жылғы 23 наурыздағы № 93-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы"'
