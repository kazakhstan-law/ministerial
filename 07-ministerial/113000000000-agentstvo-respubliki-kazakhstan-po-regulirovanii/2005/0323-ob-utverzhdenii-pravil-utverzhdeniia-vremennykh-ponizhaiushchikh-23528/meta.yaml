requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 23 марта 2005 года № 93-ОД. Зарегистрирован Министерством юстиции Республики Казахстан 31 марта 2005 года № 3536. Утратил силу приказом Министра национальной экономики Республики Казахстан от 4 мая 2018 года № 176 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
