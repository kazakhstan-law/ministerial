  kaz: Суды магистральдық труба құбырлары және (немесе) арналар арқылы тасымалдау жөніндегі қызметтердің тарифтеріне (бағаларына, алым ставкаларына) уақытша төмендету коэффициенттерін бекіту ережесін бекіту туралы
