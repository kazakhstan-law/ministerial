  title:
    rus: О внесении изменений в приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 14 марта 2005 года N 81-ОД "Об утверждении Правил предоставления равных условий доступа к регулируемым услугам (товарам, работам) в сфере аэронавигации"
    kaz: '"Аэронавигация саласындағы реттеліп көрсетілетін қызметтерге (тауарларға, жұмыстарға) қол жеткізуге тең жағдайлар беру ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының міндетін атқарушысының 2005 жылғы 14 наурыздағы N 81-НҚ бұйрығына өзгерістер енгізу туралы'
