act_code: '25479'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 12 сентября 2005 года № 265-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 октября 2005 года № 3876. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественных монополий, оказывающих общедоступные услуги почтовой связи
  kaz: Жалпыға қол жетімді почта байланысының қызметтерін көрсететін табиғи монополиялар субъектілерінің табыстарды, шығындар мен қолданысқа енгізілген активтерді бөлектеп есепке алуды жүргізу ережесін бекіту туралы
