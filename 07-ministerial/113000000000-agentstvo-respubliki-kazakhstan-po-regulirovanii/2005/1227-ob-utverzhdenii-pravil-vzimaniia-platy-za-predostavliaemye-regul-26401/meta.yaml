act_code: '26401'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 27 декабря 2005 года № 373-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 января 2006 года № 4021. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил взимания платы за предоставляемые регулируемые коммунальные услуги (товары, работы) по среднемесячным показаниям приборов учета в случае выхода прибора учета из строя
  kaz: Есептеу құралы істен шыққан жағдайда есептеу құралдарының орташа айлық көрсеткіштері бойынша ұсынылып отырған реттеліп көрсетілетін коммуналдық қызметтер (тауарлар, жұмыстар) үшін ақы өндіріп алу ережесін бекіту туралы
