  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 27 декабря 2005 года № 373-ОД "Об утверждении Правил взимания платы за предоставляемые регулируемые коммунальные услуги (товары, работы) по среднемесячным показаниям приборов учета в случае выхода прибора учета из строя"
    kaz: '"Есептеу құралы істен шыққан жағдайда есептеу құралдарының орташа айлық көрсеткіштері бойынша ұсынылып отырған реттеліп көрсетілетін коммуналдық қызметтер (тауарлар, жұмыстар) үшін ақы өндіріп алу ережесін бекіту туралы" Қазақстан Республикасының Табиғи монополияларды реттеу агенттігі төрағасының 2005 жылғы 27 желтоқсандағы № 373-НҚ бұйрығына өзгерістер енгізу туралы"'
