  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 26 февраля 2009 года № 66-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 марта 2009 года № 5586. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 27 марта 2012 года № 53-ОД
  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 23 марта 2005 года № 95-ОД "Об утверждении Правил предоставления равных условий доступа к регулируемым услугам (товарам, работам) в сфере водохозяйственной и (или) канализационной систем"
    kaz: '"Су шаруашылығы және (немесе) кәріз жүйелері саласында реттеліп көрсетілетін) қызметтерге (тауарларға, жұмыстарға) қол жеткізуге тең жағдайлар беру ережесін) бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2005 жылғы 23 наурыздағы N 95-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
