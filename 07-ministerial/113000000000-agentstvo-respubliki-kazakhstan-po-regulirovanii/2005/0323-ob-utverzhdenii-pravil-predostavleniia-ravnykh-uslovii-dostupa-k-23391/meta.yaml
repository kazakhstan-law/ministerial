requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 23 марта 2005 года № 95-ОД. Зарегистрирован Министерством юстиции Республики Казахстан 29 марта 2005 года № 3523. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 27 марта 2012 года № 53-ОД
title:
  rus: Об утверждении Правил предоставления равных условий доступа к регулируемым услугам (товарам, работам) в сфере водохозяйственной и (или) канализационной систем
  kaz: Су шаруашылығы және (немесе) кәріз жүйелері саласында реттеліп көрсетілетін қызметтерге (тауарларға, жұмыстарға) қол жеткізуге тең жағдайлар беру ережесін бекіту туралы
