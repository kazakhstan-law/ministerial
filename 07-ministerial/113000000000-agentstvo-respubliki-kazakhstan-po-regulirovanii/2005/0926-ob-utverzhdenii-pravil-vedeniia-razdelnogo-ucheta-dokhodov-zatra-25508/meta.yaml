act_code: '25508'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 26 сентября 2005 года № 280-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан от 30 сентября 2005 года № 3866. Утратил силу приказом и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 31 июля 2013 года № 241-ОД
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественных монополий, оказывающими услуги морских портов
  kaz: Теңiз порттарының қызметтерiн көрсететiн табиғи монополиялар субъектiлерiнiң табыстарды, шығындар мен қолданысқа енгiзiлген активтердi бөлектеп есепке алуды жүргiзу ережесiн бекiту туралы
