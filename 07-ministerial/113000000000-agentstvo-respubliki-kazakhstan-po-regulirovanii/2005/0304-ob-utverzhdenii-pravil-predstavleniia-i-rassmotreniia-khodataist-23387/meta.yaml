  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 4 марта 2005 года № 71-ОД "Об утверждении Правил представления и рассмотрения ходатайств по совершению сделок субъектом естественной монополии"
    kaz: '"Табиғи монополия субъектісінің мәмілелері жасау жөнінде өтініштер беру және оны қару ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2005 жылғы 4 наурыздағы N 71-НҚ бұйрығына өзгерістер енгізу туралы'
