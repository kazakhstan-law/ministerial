act_code: '25743'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 29 сентября 2005 года № 286-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан от 4 ноября 2005 года № 3922. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по расчету ставки прибыли на регулируемую базу задействованных активов субъектов естественной монополии, оказывающих услуги по транспортировке газа по магистральным трубопроводам
  kaz: Газды магистральдық таратушы құбырлары арқылы тасымалдау жөнінде қызметтер көрсететін табиғи монополия субъектілерінің қолданысқа енгізілген активтерінің реттелетін базасына пайда ставкасын есептеу жөніндегі нұсқаулықты бекіту туралы
