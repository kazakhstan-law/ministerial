  title:
    rus: О внесении дополнений и изменений в приказ И.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 19 марта 2005 года N 91-ОД "Об утверждении Правил повышения или снижения тарифов (цен, ставок сборов) или их предельных уровней на предоставляемые регулируемые услуги (товары, работы)"
    kaz: '"Ұсынылатын реттеліп көрсетілетін қызметтердің (тауарлардың, жұмыстардың) тарифтерін (бағаларын, алымдар ставкаларын) немесе олардың шекті деңгейлерін көтеру немесе төмендету ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттіттігі төрағасының міндетін атқарушысының 2005 жылғы 19 наурыздағы N 91-НҚ бұйрығына толықтырулар мен өзгерістер енгізу туралы'
