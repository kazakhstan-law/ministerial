act_code: '23525'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 19 марта 2005 года № 91-ОД. Зарегистрирован Министерством юстиции Республики Казахстан 31 марта 2005 года № 3530. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил повышения или снижения тарифов (цен, ставок сборов) или их предельных уровней на предоставляемые регулируемые услуги (товары, работы)
  kaz: Ұсынылатын реттеліп көрсетілетін қызметтердің (тауарлардың, жұмыстардың) тарифтерін (бағаларын, алымдар ставкаларын) немесе олардың шекті деңгейлерін көтеру немесе төмендету қағидаларын бекіту туралы
