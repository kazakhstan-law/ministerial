  title:
    rus: О внесении изменений в приказ исполняющего обязанности Председателя Агентства Республики Казахстан по регулированию естественных монополий от 19 марта 2005 года № 91-ОД «Об утверждении Правил повышения или снижения тарифов (цен, ставок сборов) или их предельных уровней на предоставляемые регулируемые услуги (товары, работы)»
    kaz: «Ұсынылатын реттеліп көрсетілетін қызметтердің (тауарлардың, жұмыстардың) тарифтерін (бағаларын, алымдар ставкаларын) немесе олардың шекті деңгейлерін көтеру немесе төмендету ережесін бекіту туралы» Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының міндетін атқарушының 2005 жылғы 19 наурыздағы № 91-НҚ бұйрығына өзгерістер енгізу туралы
