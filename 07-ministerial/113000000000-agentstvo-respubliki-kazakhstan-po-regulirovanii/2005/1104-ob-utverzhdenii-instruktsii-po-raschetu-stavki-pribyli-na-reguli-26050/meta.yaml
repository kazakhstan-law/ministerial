title:
  rus: Об утверждении Инструкции по расчету ставки прибыли на регулируемую базу задействованных активов субъектов естественных монополий, оказывающих регулируемые услуги аэронавигации
  kaz: Аэронавигацияның реттеліп көрсетілетін қызметтерін көрсететін табиғи монополиялар субъектілерінің қолданысқа енгізілген активтерінің реттелетін базасына пайда ставкасын есептеу жөніндегі нұсқаулықты бекіту туралы
