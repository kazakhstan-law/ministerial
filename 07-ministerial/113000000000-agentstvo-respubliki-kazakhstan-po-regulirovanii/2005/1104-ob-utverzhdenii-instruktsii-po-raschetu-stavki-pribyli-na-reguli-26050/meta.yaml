  title:
    rus: О внесении изменения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 4 ноября 2005 года № 306-ОД "Об утверждении Инструкции по расчету ставки прибыли на регулируемую базу задействованных активов субъектов естественных монополий, оказывающих регулируемые услуги аэронавигации"
    kaz: '"Аэронавигацияның реттеліп көрсетілетін қызметтерін көрсететін табиғи монополиялар субъектілерінің қолданысқа енгізілген активтерінің реттелетін базасына пайда ставкасын есептеу жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2005 жылғы 4 қарашадағы № 306-НҚ бұйрығына өзгеріс енгізу туралы'
