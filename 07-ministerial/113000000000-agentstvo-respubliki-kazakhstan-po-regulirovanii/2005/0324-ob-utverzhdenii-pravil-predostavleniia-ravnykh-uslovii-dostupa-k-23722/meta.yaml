act_code: '23722'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 24 марта 2005 года № 99-ОД. Зарегистрирован Министерством юстиции Республики Казахстан 31 марта 2005 года № 3537. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 27 марта 2012 года № 53-ОД
title:
  rus: Об утверждении Правил предоставления равных условий доступа к регулируемым услугам (товарам, работам) в сфере хранения, транспортировки газа или газового конденсата по магистральным и (или) распределительным трубопроводам, эксплуатации газораспределительных установок и связанных с ними газораспределительных газопроводов
  kaz: Газды немесе газ конденсатын сақтау, магистральдық және (немесе) бөлуші труба құбырлары арқылы тасымалдау, газ бөлуші қондырғыларды және олармен байланысты газ бөлуші газ құбырларын пайдалану саласындағы реттеліп көрсетілетін қызметтерге (тауарларға, жұмыстарға) қол жеткізуге тең жағдайлар беру ережесін бекіту туралы
