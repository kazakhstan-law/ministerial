  code: '18344'
  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 14 ноября 2003 года N 269-ОД. Зарегистрированный Министерством юстиции Республики Казахстан 12 декабря 2003 года N 2608. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 19 июля 2013 года № 215-ОД
  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 19 марта 2003 года N 82-ОД "Об утверждении Инструкции по утверждению тарифов (цен, ставок сборов) и тарифных смет на услуги (товары, работы) субъектов естественных монополий", зарегистрированный в Министерстве юстиции Республики Казахстан от 29 апреля 2003 года N 2256
    kaz: Қазақстан Республикасының Әдiлет министрлiгінде 2003 жылғы 29 сәуiрде N 2256 тiркелген, "Табиғи монополиялар субъектiлерiнiң қызметтерiне тарифтер (бағалар, алымдар ставкаларын) және тарифтiк сметаларды бекiту туралы нұсқаулықты бекiту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестiктi қорғау жөнiндегi агенттігі төрағасының 2003 жылғы 19 наурыздағы N 82-НҚ бұйрығына өзгерiстер енгiзу туралы
  link: https://zan.gov.kz/client/#!/doc/18344/rus
