  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 19 марта 2003 года N 82-ОД "Об утверждении Инструкции по утверждению тарифов (цен, ставок сборов) и тарифных смет на услуги (товары, работы) субъектов естественных монополий"
    kaz: '"Табиғи монополиялар субъектілерінің қызметтеріне (тауарларына, жұмыстарына) тарифтер (бағалар, алымдар ставкаларын) және тарифтік сметалар бекіту жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасының Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 19 наурыздағы N 82-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
