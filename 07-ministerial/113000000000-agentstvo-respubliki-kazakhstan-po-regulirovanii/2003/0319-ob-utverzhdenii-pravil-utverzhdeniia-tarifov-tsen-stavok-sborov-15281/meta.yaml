title:
  rus: Об утверждении Правил утверждения тарифов (цен, ставок сборов) и тарифных смет на регулируемые услуги (товары, работы) субъектов естественных монополий
  kaz: Табиғи монополиялар субъектілерінің реттеліп көрсетілетін қызметтеріне (тауарларына, жұмыстарына) тарифтер (бағалар, алымдар ставкаларын) және тарифтік сметалар бекіту жөніндегі ережені бекіту туралы
