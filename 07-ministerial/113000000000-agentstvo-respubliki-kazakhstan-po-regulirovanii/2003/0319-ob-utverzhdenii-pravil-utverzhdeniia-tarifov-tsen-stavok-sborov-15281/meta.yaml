  title:
    rus: О внесении изменения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 19 марта 2003 года № 82-ОД "Об утверждении Инструкции по утверждению тарифов (цен, ставок сборов) и тарифных смет на услуги (товары, работы) субъектов естественных монополий", зарегистрированный за № 2256
    kaz: '"Табиғи монополия субъектілерінің қызметтеріне (тауарларына, жұмыстарына) тарифтер (бағалар, алымдар ставкаларын) және тарифтік сметалар бекіту жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 19 наурыздағы № 82-НҚ бұйрығына өзгеріс енгізу туралы'
