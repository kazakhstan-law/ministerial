  code: '17250'
  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 9 октября 2003 года N 253-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 октября 2003 года N 2533. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 19 июля 2013 года № 215-ОД
  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 19 марта 2003 года N 82-ОД "Об утверждении Инструкции по утверждению тарифов (цен, ставок сборов) на производство и предоставление услуг (товаров, работ) субъектами естественной монополии", зарегистрированный в Министерстве юстиции Республики Казахстан от 29 апреля 2003 года N 2256
    kaz: Қазақстан Республикасының Әділет министрлігінде 2003 жылғы 29 сәуірде N 2256 тіркелген "Табиғи монополиялар субъектілерінің қызметтерін (тауарларын, жұмыстарын) өндіруге және ұсынуға тарифтер (бағалар, алымдар ставкаларын) бекіту жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 19 мамырдағы N 82-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/17250/rus
