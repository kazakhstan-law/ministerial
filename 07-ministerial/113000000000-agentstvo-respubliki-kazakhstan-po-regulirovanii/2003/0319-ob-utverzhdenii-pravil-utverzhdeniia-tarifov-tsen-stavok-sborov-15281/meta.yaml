requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 19 марта 2003 года № 82-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 апреля 2003 года № 2256. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 19 июля 2013 года № 215-ОД
title:
  rus: Об утверждении Правил утверждения тарифов (цен, ставок сборов) и тарифных смет на регулируемые услуги (товары, работы) субъектов естественных монополий
  kaz: Табиғи монополиялар субъектілерінің реттеліп көрсетілетін қызметтеріне (тауарларына, жұмыстарына) тарифтер (бағалар, алымдар ставкаларын) және тарифтік сметалар бекіту жөніндегі ережені бекіту туралы
