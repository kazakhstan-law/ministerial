    kaz: '"Тарифтерді (бағаларды, алым ставкаларын) оңайлатылған тәртіппен бекіту ережесін бекіту туралы" Қазақстан Республикасының Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 19 наурыздағы N 80-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
