  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 24 декабря 2010 года № 347-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 января 2011 года № 6748. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 21 февраля 2025 года № 7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 27 января 2003 года № 17-ОД "Об утверждении Инструкции по расчету ставки прибыли (чистого дохода) на регулируемую базу задействованных активов для субъектов естественной монополии, оказывающих услуги водохозяйственной и (или) канализационной систем и субъектов естественной монополии энергетического сектора"
    kaz: '"Су шаруашылығы және (немесе) канализациялық жүйелерге және энергетика секторындағы табиғи монополия субъектілеріне қызмет көрсететін табиғи монополия субъектілері үшін іске қосылған активтердің реттелетін базасына арналған пайда (таза табыс) ставкаларын есептеу жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 27 қаңтардағы № 17-НҚ бұйрығына өзгерістер және толықтыру енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/57288/rus
