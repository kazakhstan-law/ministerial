  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 27 января 2003 года N 17-ОД "Об утверждении Инструкции по расчету ставки прибыли (чистого дохода) на регулируемую базу задействованных активов для субъектов естественной монополии, оказывающих услуги водохозяйственной и (или) канализационной систем и субъектов естественной монополии энергетического сектора"
    kaz: '"Су шаруашылығы және (немесе) канализациялық жүйелерге және энергетика секторындағы табиғи монополия субъектілеріне қызмет көрсететін табиғи монополия субъектілері үшін іске қосылған активтердің реттелетін базасына арналған пайда (таза табыс) ставкаларын есептеу жөніндегі нұсқаулықты бекіту туралы" Қазақстан республикасы Табиғи монополияларды реттеу жіне бәсекелесті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 27 қаңтардағы N 17-НҚ бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/43679/rus
