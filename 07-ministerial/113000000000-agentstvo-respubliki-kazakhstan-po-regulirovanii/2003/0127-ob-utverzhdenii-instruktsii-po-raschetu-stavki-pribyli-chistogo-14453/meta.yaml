act_code: '14453'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 27 января 2003 года № 17-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 февраля 2003 года № 2154. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по расчету ставки прибыли (чистого дохода) на регулируемую базу задействованных активов для субъектов естественной монополии, оказывающих услуги водоснабжения и (или) водоотведения и субъектов естественной монополии энергетического сектора
  kaz: Сумен жабдықтауға және (немесе) суды бұруға және энергетика секторындағы табиғи монополия субъектiлерiне қызмет көрсететiн табиғи монополия субъектiлерi үшiн iске қосылған активтердiң реттелетiн базасына арналған пайда (таза табыс) ставкаларын есептеу жөнiндегi нұсқаулықты бекiту туралы
