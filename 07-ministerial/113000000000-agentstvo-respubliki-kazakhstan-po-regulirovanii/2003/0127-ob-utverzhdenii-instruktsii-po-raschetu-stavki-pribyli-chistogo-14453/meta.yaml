  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 27 января 2003 года № 17-ОД "Об утверждении Инструкции по расчету ставки прибыли (чистого дохода) на регулируемую базу задействованных активов для субъектов естественной монополии, оказывающих услуги водохозяйственной и (или) канализационной систем и субъектов естественной монополии энергетического сектора"
    kaz: '"Су шаруашылығы және (немесе) канализациялық жүйелерге және энергетика секторындағы табиғи монополия субъектiлерiне қызмет көрсететiн табиғи монополия субъектiлерi үшiн iске қосылған активтердiң реттелетiн базасына арналған пайда (таза табыс) ставкаларын есептеу жөнiндегi нұсқаулықты бекiту туралы" Қазақстан Республикасының Табиғи монополияларды реттеу және бәсекелестiктi қорғау жөнiндегi агенттiгi төрағасының 2003 жылғы 27 қаңтардағы № 17-НҚ бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/67057/rus
