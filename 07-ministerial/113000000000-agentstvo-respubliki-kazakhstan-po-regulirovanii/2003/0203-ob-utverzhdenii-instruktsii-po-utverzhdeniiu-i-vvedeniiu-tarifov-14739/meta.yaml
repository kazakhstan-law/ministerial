act_code: '14739'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 3 февраля 2003 года N 30-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 февраля 2003 года N 2173. Утратил силу приказом Председателя Агентства РК по регулированию естественных монополий от 12 июня 2006 года N 149-ОД
title:
  rus: Об утверждении Инструкции по утверждению и введению тарифов (цен, ставок сбора) на среднесрочный период на услуги (товары, работы) субъектов естественной монополии
  kaz: Табиғи монополия субъектiлерiнiң қызметтерiне (тауарларға, жұмыстарға) орта мерзiмдi кезеңге арналған тарифтердi (бағаларды, алым ставкаларын) бекiту және енгiзу жөнiндегi нұсқаулықты бекiту туралы
