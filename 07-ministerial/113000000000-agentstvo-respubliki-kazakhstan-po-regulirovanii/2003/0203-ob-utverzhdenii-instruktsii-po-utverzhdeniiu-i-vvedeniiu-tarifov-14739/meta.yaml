  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 15 апреля 2004 года N 190-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 апреля 2004 года N 2832. Утратил силу приказом Председателя Агентства РК по регулированию естественных монополий от 12 июня 2006 года N 149-ОД
  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 3 февраля 2003 года N 30-ОД "Об утверждении Инструкции по утверждению и введению тарифов (цен, ставок сборов) на среднесрочный период на услуги (товары, работы) субъектов естественной монополии", зарегистрированный в Министерстве юстиции Республики Казахстан за N 2173
    kaz: '"Табиғи монополия субъектiлерiнiң қызметтерiне (тауарларына жұмыстарына) орташа мерзiмдiк кезеңге арналған тарифтер (бағалар, алымдар ставкаларын) бекiту және енгiзу жөнiндегi нұсқаулықты бекiту туралы" Қазақстан Республикасының Әдiлет министрлiгiнде N 2173 нөмiрмен тiркелген Қазақстан Республикасының Табиғи монополияларды реттеу және бәсекелестiктi қорғау жөнiндегi агенттiгi төрағасының 2003 жылғы 3 ақпандағы N 30-НҚ бұйрығына өзгерiстер енгiзу туралы'
