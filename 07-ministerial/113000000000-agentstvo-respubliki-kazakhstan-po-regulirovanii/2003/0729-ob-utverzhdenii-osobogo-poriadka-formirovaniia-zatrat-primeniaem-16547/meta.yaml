  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 21 апреля 2005 года № 142-ОД. Зарегистрирован Министерством юстиции Республики Казахстан 27 апреля 2005 года № 3600. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 25 апреля 2013 года № 130-ОД
  title:
    rus: О внесении изменений и дополнений в приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 30 июля 2003 года N 185-ОД "Об утверждении Правил об особом порядке формирования затрат, применяемом при утверждении тарифов (цен, ставок сборов) на услуги (товары, работы) субъектов естественной монополии"
    kaz: '"Табиғи монополия субъектілерінің қызметтеріне (тауарларына, жұмыстарына) тарифтер (бағалар, алым ставкаларын) бекіту кезінде қолданылатын шығындарды қалыптастырудың ерекше тәртібі жөніндегі Ережені бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының міндетін атқарушының 2003 жылғы 30 шілдедегі N 185-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/23916/rus
