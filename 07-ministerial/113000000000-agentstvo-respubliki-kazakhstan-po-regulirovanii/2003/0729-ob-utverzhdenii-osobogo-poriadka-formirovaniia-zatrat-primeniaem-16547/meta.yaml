  code: '28650'
  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 16 июня 2006 года № 156-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июля 2006 года № 4279
  title:
    rus: О внесении изменения в приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 30 июля 2003 года № 185-ОД "Об утверждении Правил об особом порядке формирования затрат, применяемом при утверждении тарифов (цен, ставок сборов) на регулируемые услуги (товары, работы) субъектов естественных монополий"
    kaz: '"Табиғи монополия субъектілерінің реттеліп көрсетілетін қызметтеріне (тауарларына, жұмыстарына) тарифтер (бағалар, алым ставкаларын) бекіту кезінде қолданылатын шығындарды қалыптастырудың ерекше тәртібі жөніндегі ережені бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының міндетін атқарушының 2003 жылғы 30 шілдедегі № 185-НҚ бұйрығына өзгеріс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/28650/rus
