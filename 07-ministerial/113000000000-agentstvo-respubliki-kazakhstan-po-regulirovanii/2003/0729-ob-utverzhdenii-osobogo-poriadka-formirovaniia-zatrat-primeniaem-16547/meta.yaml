act_code: '16547'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 30 июля 2003 года № 185-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 августа 2003 года № 2438. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 25 апреля 2013 года № 130-ОД
title:
  rus: Об утверждении Особого порядка формирования затрат, применяемом при утверждении тарифов (цен, ставок сборов) на регулируемые услуги (товары, работы) субъектов естественных монополий
  kaz: '"Табиғи монополиялар субъектiлерiнiң реттелiп көрсетiлетiн қызметтерiне (тауарларына, жұмыстарына) тарифтер (бағалар, алым ставкаларын) бекiту кезiнде қолданылатын шығындарды қалыптастырудың ерекше тәртiбiн бекiту туралы"'
