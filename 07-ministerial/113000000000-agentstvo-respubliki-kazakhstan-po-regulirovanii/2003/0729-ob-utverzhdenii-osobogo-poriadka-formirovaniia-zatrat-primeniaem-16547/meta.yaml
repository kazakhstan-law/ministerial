caused_by:
  code: '18211'
  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 14 ноября 2003 года № 270-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 декабря 2003 года № 2607. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 25 апреля 2013 года № 130-ОД
  title:
    rus: О внесении дополнения в приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 30 июля 2003 года № 185-ОД "Об утверждении Правил об особом порядке формирования затрат, применяемом при утверждении тарифов (цен, ставок сборов) на услуги (товары, работы) субъектов естественной монополии", зарегистрированный в Министерстве юстиции Республики Казахстан от 12 августа 2003 года № 2438
    kaz: '"Табиғи монополия субъектiлерiнiң қызметтерiне (тауарларына, жұмыстарына) тарифтер (бағалар, алым ставкаларын) бекiту кезiнде қолданылатын шығындарды қалыптастырудың ерекше тәртiбi жөнiндегi ереженi бекiту туралы" Қазақстан Республикасының Табиғи монополияларды реттеу және бәсекелестiктi қорғау жөнiндегi агенттiгi төрағасының мiндетiн атқарушының 2003 жылғы 30 шiлдедегi, Қазақстан Республикасының Әдiлет министрлiгiнде 2003 жылғы 12 тамызда № 2438 нөмiрмен тiркелген № 185-НҚ бұйрығына толықтыру енгiзу туралы'
  link: https://zan.gov.kz/client/#!/doc/18211/rus
