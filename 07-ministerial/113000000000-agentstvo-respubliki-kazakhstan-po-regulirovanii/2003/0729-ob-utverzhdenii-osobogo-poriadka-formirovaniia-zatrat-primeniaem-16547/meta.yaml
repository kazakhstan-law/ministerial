  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 17 февраля 2009 года N 48-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 марта 2009 года N 5590. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 25 апреля 2013 года № 130-ОД
  title:
    rus: О внесении дополнений и изменения в приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 30 июля 2003 года № 185-ОД "Об утверждении Правил об особом порядке формирования затрат, применяемом при утверждении тарифов (цен, ставок сборов) на регулируемые услуги (товары, работы) субъектов естественных монополий"
    kaz: '"Табиғи монополиялар субъектілерінің реттеліп көрсетілетін қызметтеріне (тауарларына, жұмыстарына) тарифтер (бағалар, алым ставкаларын) бекіту кезінде қолданылатын шығындарды қалыптастырудың ерекше тәртібі жөніндегі ережені бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының міндетін атқарушының 2003 жылғы 30 шілдедегі N 185-НҚ бұйрығына толықтырулар мен өзгеріс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/44803/rus
