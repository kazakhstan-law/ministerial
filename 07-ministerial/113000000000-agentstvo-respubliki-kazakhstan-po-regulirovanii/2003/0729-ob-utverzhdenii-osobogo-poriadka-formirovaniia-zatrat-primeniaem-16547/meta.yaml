  code: '29605'
  requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 14 августа 2006 года № 203-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 сентября 2006 года № 4377. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 25 апреля 2013 года № 130-ОД
  title:
    rus: О внесении изменений в приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 30 июля 2003 года № 185-ОД "Об утверждении Правил об особом порядке формирования затрат, применяемом при утверждении тарифов (цен, ставок сборов) на регулируемые услуги (товары, работы) субъектов естественных монополий"
    kaz: '"Табиғи монополиялар субъектiлерiнiң реттеліп көрсетілетін қызметтеріне (тауарларына, жұмыстарына) тарифтер (бағалар, алым ставкаларын) бекiту кезiнде қолданылатын шығындарды қалыптастырудың ерекше тәртiбi жөніндегі ереженi бекiту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының міндетін атқарушының 2003 жылғы 30 шілдедегі № 185-НҚ бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/29605/rus
