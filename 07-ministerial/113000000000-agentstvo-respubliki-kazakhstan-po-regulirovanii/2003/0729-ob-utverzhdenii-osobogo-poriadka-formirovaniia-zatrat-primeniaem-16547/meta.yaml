  code: '26946'
  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 17 марта 2006 года N 78-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 марта 2006 года N 4162. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 25 апреля 2013 года № 130-ОД.
  title:
    rus: О внесении изменений и дополнений в приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 30 июля 2003 года N 185-ОД "Об утверждении Правил об особом порядке формирования затрат, применяемом при утверждении тарифов (цен, ставок сборов) на регулируемые услуги (товары, работы) субъектов естественной монополии"
    kaz: '"Табиғи монополия субъектiлерiнiң реттелiп көрсетiлетiн қызметтерiне (тауарларына, жұмыстарына) тарифтер (бағалар, алым ставкаларын) бекiту кезiнде қолданылатын шығындарды қалыптастырудың ерекше тәртiбi жөнiндегi ереженi бекiту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестiктi қорғау жөнiндегi агенттiгi төрағасының мiндетiн атқарушының 2003 жылғы 30 шiлдедегi N 185-НҚ бұйрығына өзгерiстер мен толықтырулар енгiзу туралы'
  link: https://zan.gov.kz/client/#!/doc/26946/rus
