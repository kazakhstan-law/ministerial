  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 15 февраля 2013 года N 48-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 марта 2013 года N 8392. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 25 апреля 2013 года № 130-ОД
  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 30 июля 2003 года № 185-ОД "Об утверждении Правил об особом порядке формирования затрат, применяемом при утверждении тарифов (цен, ставок сборов) на регулируемые услуги (товары, работы) субъектов естественных монополий"
    kaz: '"Табиғи монополиялар субъектiлерiнiң реттелiп көрсетiлетiн қызметтерiне (тауарларына, жұмыстарына) тарифтер (бағалар, алым ставкаларын) бекiту кезiнде қолданылатын шығындарды қалыптастырудың ерекше тәртiбi жөнiндегi ереженi бекiту туралы" Қазақстан Республикасының Табиғи монополияларды реттеу және бәсекелестiктi қорғау жөнiндегi агенттiгi төрағасының міндетін атқарушының 2003 жылғы 30 шiлдедегi № 185-НҚ бұйрығына өзгерістер мен толықтыру енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/71818/rus
