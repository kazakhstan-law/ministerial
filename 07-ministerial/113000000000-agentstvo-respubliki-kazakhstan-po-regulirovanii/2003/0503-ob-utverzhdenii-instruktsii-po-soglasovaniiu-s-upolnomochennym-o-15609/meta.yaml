act_code: '15609'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 4 мая 2003 года № 121-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 мая 2003 года № 2325. Утратил силу - приказом Председателя Агентства РК по регулированию естественных монополий от 4 марта 2005 года № 70-ОД
title:
  rus: Об утверждении Инструкции по согласованию с уполномоченным органом осуществления субъектом естественной монополии иной деятельности, технологически связанной с основной деятельностью и (или) отнесенной к сфере естественной монополии, а также осуществления деятельности, установленной законодательством Республики Казахстан о почте
  kaz: Табиғи монополия субъектісінің негізгі қызметімен технологиялық байланысты және (немесе) табиғи монополия субъектісі саласына қатысты өзге қызметті жүзеге асыруды, сондай-ақ Қазақстан Республикасының пошта туралы заңнамасында белгіленген қызметті жүзеге асыруды уәкілетті органмен келісу жөніндегі нұсқаулықты бекіту туралы
