  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 5 ноября 2003 года N 263-ОД "Об утверждении Правил установления и отмены временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на услуги аэропортов и аэронавигации"
    kaz: '"Әуежайлар мен аэронавигация қызметтерінің тарифтеріне (бағаларына, алым ставкаларына) уақытша төмендету коэффициенттерін белгілеу және алып тастау ережесін бекіту туралы" Қазақстан Республикасының Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 5 қарашадағы N 263 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/23695/rus
