  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 5 ноября 2003 года № 263-ОД "О Правилах утверждения временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на регулируемые услуги аэропортов и аэронавигации"
    kaz: '"Әуежайлар мен аэронавигацияның реттеліп көрсетілетін қызметтерінің тарифтеріне (бағаларына, алым ставкаларына) уақытша төмендету коэффициенттерін бекіту ережесі туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 5 қарашадағы № 263-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
