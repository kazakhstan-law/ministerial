act_code: '14989'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 24 февраля 2003 года № 49-ОД. Зарегистрированный Министерством юстиции Республики Казахстан 21 марта 2003 года № 2214. Утратил силу приказом Министра национальной экономики Республики Казахстан от 15 июня 2015 года № 430
title:
  rus: Об утверждении Правил представления и рассмотрения ходатайств о даче согласия на реорганизацию и ликвидацию субъектов естественных монополий
  kaz: Табиғи монополиялар субъектілерін қайта ұйымдастыруға және таратуға келісім беру туралы өтініштерді ұсыну және қарау ережесін бекіту туралы
