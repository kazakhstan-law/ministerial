  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 29 сентября 2005 года № 283-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 октября 2005 года № 3878. Утратил силу приказом Министра национальной экономики Республики Казахстан от 15 июня 2015 года № 430
  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 24 февраля 2003 года № 49-ОД "Об утверждении Инструкции по согласованию с уполномоченным органом реорганизации или ликвидации субъектов естественной монополии"
    kaz: '"Табиғи монополия субъектілерін қайта ұйымдастыруды немесе таратуды уәкілетті органмен келісу жөніндегі Нұсқаулықты бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 24 ақпандағы № 49-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/25481/rus
