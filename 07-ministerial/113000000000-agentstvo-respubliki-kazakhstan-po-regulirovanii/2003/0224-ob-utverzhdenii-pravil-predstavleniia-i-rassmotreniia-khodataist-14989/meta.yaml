  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 24 февраля 2003 года N 49-ОД "Об утверждении Правил представления и рассмотрения ходатайств о даче согласия на реорганизацию и ликвидацию субъектов естественных монополий"
    kaz: '"Табиғи монополиялар субъектілерін қайта ұйымдастыруға және таратуға келісім беру туралы өтініштерді ұсыну және қарау ережесін бекіту туралы" Қазақстан Республикасының Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 24 ақпандағы N 49-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/34849/rus
