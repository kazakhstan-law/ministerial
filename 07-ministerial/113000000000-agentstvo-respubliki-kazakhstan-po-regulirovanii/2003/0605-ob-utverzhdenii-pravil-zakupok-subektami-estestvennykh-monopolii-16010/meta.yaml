  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 2 марта 2004 года № 99-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 марта 2004 года № 2772. Утратил силу приказом и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 17 февраля 2012 года № 25-ОД
  title:
    rus: О внесении дополнения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 6 июня 2003 года N 149-ОД "Об утверждении Правил закупок субъектами естественных монополий материальных, финансовых ресурсов и услуг, затраты на которые учитываются при формировании тарифов (цен, ставок сборов) на оказываемые ими услуги", зарегистрированный в Министерстве юстиции Республики Казахстан 20 июня 2003 года за N 2373
    kaz: Қазақстан Республикасының Әділет министрлігінде 2003 жылғы 20 маусымда N 2373 нөмірмен тіркелген "Табиғи монополиялар субъектілерінің, шығындары олар көрсететін қызметтерге тарифтер (бағалар, алымдар ставкаларын) қалыптастыру кезінде ескерілетін материалдық, қаржылық ресурстарды және қызметтерді сатып алу ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 6 маусымдағы N 149-НҚ бұйрығына толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/19193/rus
