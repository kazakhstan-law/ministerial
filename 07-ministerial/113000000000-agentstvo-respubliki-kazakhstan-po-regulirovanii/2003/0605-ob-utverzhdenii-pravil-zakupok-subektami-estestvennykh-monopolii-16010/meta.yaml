  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию  естественных монополий от 16 июля 2007 года № 189-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 августа 2007 года № 4852. Утратил силу приказом и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 17 февраля 2012 года № 25-ОД
  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 6 июня 2003 года N 149-ОД "Об утверждении Правил закупок субъектами естественных монополий товаров, работ и услуг, затраты на которые учитываются при утверждении тарифов (цен, ставок сборов) или их предельных уровней и тарифных смет на регулируемые услуги"
    kaz: '"Табиғи монополиялар субъектілерінің шығындары реттеліп көрсетілетін қызметтерге тарифтер (бағалар, алым ставкаларын) қалыптастыру кезінде ескерілетін материалдық, қаржылық ресурстарды және қызметтерді сатып алу ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 6 маусымдағы N 149-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы"'
  link: https://zan.gov.kz/client/#!/doc/34673/rus
