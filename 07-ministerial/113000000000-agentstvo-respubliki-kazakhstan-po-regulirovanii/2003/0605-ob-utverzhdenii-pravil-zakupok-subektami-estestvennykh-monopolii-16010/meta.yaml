  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 3 марта 2006 года № 63-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 марта 2006 года № 4123. Утратил силу приказом и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 17 февраля 2012 года № 25-ОД
  title:
    rus: О внесении дополнения и изменений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 6 июня 2003 года N 149-ОД "Об утверждении Правил закупок субъектами естественных монополий товаров, работ и услуг, затраты на которые учитываются при утверждении тарифов (цен, ставок сборов) или их предельных уровней и тарифных смет на регулируемые услуги"
    kaz: '"Табиғи монополиялар субъектiлерiнiң шығындары реттелiп көрсетiлетін қызметтерге тарифтер (бағалар, алым ставкаларын) немесе олардың шектi деңгейлерi мен тарифтiк сметалар бекiту кезiнде ескерiлетiн тауарларды, жұмыстар мен қызметтердi сатып алу ережесiн бекiту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестiктi қорғау жөнiндегi агенттiгi төрағасының 2003 жылғы 6 маусымдағы N 149-НҚ бұйрығына толықтыру мен өзгерiстер енгiзу туралы'
  link: https://zan.gov.kz/client/#!/doc/26822/rus
