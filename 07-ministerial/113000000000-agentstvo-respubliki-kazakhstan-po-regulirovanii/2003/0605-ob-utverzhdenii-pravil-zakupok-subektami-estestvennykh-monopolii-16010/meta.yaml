  requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 5 марта 2005 года № 73-ОД. Зарегистрирован Министерством юстиции Республики Казахстан 23 марта 2005 года № 3512. Утратил силу приказом и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 17 февраля 2012 года № 25-ОД
  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 6 июня 2003 года N 149-ОД "Об утверждении Правил закупок субъектами естественных монополий материальных, финансовых ресурсов и услуг, затраты на которые учитываются при формировании тарифов (цен, ставок сборов) на оказываемые ими услуги"
    kaz: '"Табиғи монополиялар субъектілерінің шығындары олар көрсететін қызметтерге тарифтер (бағалар, алымдар ставкаларын) қалыптастыру кезінде ескерілетін материалдық, қаржылық ресурстарды және қызметтерді сатып алу ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 6 маусымдағы N 149-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/23386/rus
