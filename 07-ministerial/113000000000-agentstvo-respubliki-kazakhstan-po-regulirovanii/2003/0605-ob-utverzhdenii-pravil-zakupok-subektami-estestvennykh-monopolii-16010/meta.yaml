  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 12 декабря 2003 года № 321-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2003 года № 2660. Утратил силу приказом и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 17 февраля 2012 года № 25-ОД
  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 6 июня 2003 года № 149-ОД "Об утверждении Правил закупок субъектами естественных монополий материальных, финансовых ресурсов и услуг, затраты на которые учитываются при формировании тарифов (цен, ставок сборов) на оказываемые ими услуги", зарегистрированный в Министерстве юстиции Республики Казахстан 20 июня 2003 года за № 2373
    kaz: Қазақстан Республикасының Әділет министрлігінде 2003 жылғы 20 маусымда № 2373 тіркелген "Табиғи монополиялар субъектілерінің, шығындарды олар көрсететін қызметтерге тарифтер (бағалар, алымдар ставкаларын) қалыптастыру кезінде ескерілетін материалдық, қаржылық ресурстарды және қызметтерді сатып алу ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 6 маусымдағы № 149-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/18164/rus
