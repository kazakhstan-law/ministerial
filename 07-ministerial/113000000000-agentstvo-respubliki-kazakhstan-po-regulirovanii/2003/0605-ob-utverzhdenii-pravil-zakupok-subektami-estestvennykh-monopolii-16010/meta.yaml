act_code: '16010'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 6 июня 2003 года N 149-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 июня 2003 года N 2373. Утратил силу приказом и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 17 февраля 2012 года № 25-ОД
title:
  rus: Об утверждении Правил закупок субъектами естественных монополий товаров, работ и услуг, затраты на которые учитываются при утверждении тарифов (цен, ставок сборов) или их предельных уровней и тарифных смет на регулируемые услуги
  kaz: Табиғи монополиялар субъектілерінің, шығындары реттеліп көрсетілетін қызметтерге тарифтер (бағалар, алым ставкаларын) немесе олардың шекті деңгейлері мен тарифтік сметалар бекіту кезінде ескерілетін тауарларды, жұмыстар мен қызметтерді сатып алу ережесiн бекiту туралы
