act_code: '17730'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 5 ноября 2003 года № 262-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 декабря 2003 года № 2598. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О Правилах утверждения временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на регулируемые услуги морского порта
  kaz: Теңіз портының реттеліп көрсетілетін қызметтерінің тарифтеріне (бағаларына, алым ставкаларына) уақытша төмендету коэффициенттерін бекіту ережесі туралы
