  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 5 ноября 2003 года N 262-ОД "О Правилах утверждения временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на регулируемые услуги по перевалке грузов, выполняемые силами и средствами морского порта"
    kaz: '"Теңiз портының күштерiмен және құралдарымен орындалатын жүктердi ауыстырып тиеу жөнiндегi реттеліп көрсетілетін қызметтер тарифтерiне (бағаларына, алымдар ставкаларына) уақытша төмендету коэффициентiн бекіту ережесі туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі 2003 жылғы 5 қарашадағы N 262-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/39751/rus
