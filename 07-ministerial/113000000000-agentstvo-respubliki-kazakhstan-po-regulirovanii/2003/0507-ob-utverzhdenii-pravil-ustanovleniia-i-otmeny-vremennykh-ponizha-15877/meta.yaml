requisite: Приказ и.о.Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 8 мая 2003 года N 128-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 июня 2003 года N 2358. Утратил силу - приказом Председателя Агентства РК по регулированию естественных монополий от 23 марта 2005 года N 93-ОД
title:
  rus: Об утверждении Правил установления и отмены временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на услуги по транспортировке воды по магистральным трубопроводам и (или) каналам
  kaz: Суды магистралды труба құбыры және (немесе) арна арқылы тасымалдау жөніндегі қызметтердің тарифтеріне (бағаларына, алым ставкаларына) уақытша төмендету коэффициентін белгілеу және алып тастау ережесін бекіту туралы
