act_code: '14465'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 27 января 2003 года N 16-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 февраля 2003 года N 2157. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 8 мая 2013 года № 142-ОД
title:
  rus: Об утверждении Инструкции по рассмотрению и утверждению инвестиционных программ и (или) инвестиционных проектов субъектов естественных монополий
  kaz: Табиғи монополиялар субъектiлерiнiң инвестициялық бағдарламаларын және (немесе) инвестициялық жобалар қарау және бекіту жөніндегі нұсқаулықты бекіту туралы
