  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 27 января 2003 года N 16-ОД "Об утверждении Инструкции по рассмотрению и согласованию инвестиционных программ (проектов) субъектов естественной монополии"
    kaz: '"Табиғи монополия субъектiлерiнiң инвестициялық бағдарламаларын (жобаларын) қарау және келiсу жөнiндегi нұсқаулықты бекiту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестiктi қорғау жөнiндегі агенттiгi төрағасының 2003 жылғы 27 қаңтардағы N 16-НҚ бұйрығына өзгерiстер мен толықтырулар енгізу туралы'
