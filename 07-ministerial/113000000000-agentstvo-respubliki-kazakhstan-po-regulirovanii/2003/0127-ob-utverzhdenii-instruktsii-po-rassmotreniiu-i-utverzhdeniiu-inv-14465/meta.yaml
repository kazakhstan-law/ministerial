  code: '20128'
  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 24 мая 2004 года N 238. Зарегистрирован Министерством юстиции от 11 июня 2004 года N 2898. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 8 мая 2013 года № 142-ОД
  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 27 января 2003 года N 16-ОД "Об утверждении Инструкции по рассмотрению и согласованию инвестиционных программ (проектов) субъектов естественной монополии", зарегистрированный в Министерстве юстиции Республики Казахстан за N 2157
    kaz: '"Табиғи монополия субъектілерінің инвестициялық бағдарламаларын (жобаларын) қарау және келісу жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасының Әділет министрлігінде N 2157 нөмірмен тіркелген Қазақстан Республикасының Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 27 қаңтардағы N 16-НҚ бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/20128/rus
