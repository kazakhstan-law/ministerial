  requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 8 декабря 2006 года № 292-ОД. Зарегистрован в Министерстве юстиции Республики Казахстан 5 января 2007 года № 4504. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 28 марта 2014 года № 64-ОД
  title:
    rus: О внесении изменения и дополнения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 26 февраля 2003 года № 57-ОД "Об утверждении Правил включения и исключения из Государственного регистра субъектов естественных монополий"
    kaz: '"Табиғи монополиялар субъектілерін Мемлекеттік тіркелімге енгізу және шығару ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 26 ақпандағы № 57-НҚ бұйрығына өзгеріс пен толықтыру енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/31027/rus
