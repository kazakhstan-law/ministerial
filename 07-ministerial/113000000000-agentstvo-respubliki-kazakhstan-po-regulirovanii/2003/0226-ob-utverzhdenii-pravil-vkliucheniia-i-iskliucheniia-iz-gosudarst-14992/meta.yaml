  title:
    rus: О внесении изменений и дополнения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 26 февраля 2003 года № 57-ОД "Об утверждении Правил включения и исключения из Государственного регистра субъектов естественной монополии"
    kaz: '"Табиғи монополия субъектілерін Мемлекеттік тіркелімге енгізу және шығару ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы N 57-НҚ бұйрығына өзгерістер мен толықтыру енгізу туралы'
