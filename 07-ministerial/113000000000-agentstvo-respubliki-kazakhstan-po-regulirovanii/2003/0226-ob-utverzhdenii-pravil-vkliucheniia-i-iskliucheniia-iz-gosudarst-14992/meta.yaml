  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 11 июля 2006 года № 171-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 июля 2006 года № 4306. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 28 марта 2014 года № 64-ОД
  title:
    rus: О внесении изменений и дополнения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 26 февраля 2003 года № 57-ОД "Об утверждении Правил включения и исключения из Государственного регистра субъектов естественных монополий"
    kaz: '"Табиғи монополиялар субъектілерін Мемлекеттік тіркелімге енгізу және шығару ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 26 ақпандағы № 57-НҚ бұйрығына өзгерістер мен толықтыру енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/28987/rus
