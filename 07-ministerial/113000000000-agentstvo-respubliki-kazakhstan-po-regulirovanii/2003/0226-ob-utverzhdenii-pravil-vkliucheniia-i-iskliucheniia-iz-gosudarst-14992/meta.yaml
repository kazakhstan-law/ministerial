act_code: '14992'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 26 февраля 2003 года № 57-ОД. Зарегистрированный Министерством юстиции Республики Казахстан 21 марта 2003 года № 2217. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 28 марта 2014 года № 64-ОД
