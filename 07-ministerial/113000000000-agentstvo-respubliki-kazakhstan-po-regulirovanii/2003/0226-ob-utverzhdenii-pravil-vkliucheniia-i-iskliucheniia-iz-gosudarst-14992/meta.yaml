  title:
    rus: О внесении изменения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 26 февраля 2003 года N 57-ОД "Об утверждении Правил включения и исключения из Государственного регистра субъектов естественных монополий"
    kaz: '"Табиғи монополиялар субъектілерін Мемлекеттік тіркелімге енгізу және шығару ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 26 ақпандағы N 57-НҚ бұйрығына өзгеріс енгізу туралы'
