  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 20 декабря 2013 года № 388-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 января 2014 года № 9094. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 28 марта 2014 года № 64-ОД
  title:
    rus: О внесении изменения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 26 февраля 2003 года № 57-ОД "Об утверждении Правил включения и исключения из Государственного регистра субъектов естественных монополий"
    kaz: '"Табиғи монополиялар субъектiлерiн Мемлекеттiк тiркелiмге енгiзу және шығару ережесiн бекiту туралы" Қазақстан Республикасының Табиғи монополияларды реттеу және бәсекелестiктi қорғау жөнiндегi агенттiгi төрағасының 2003 жылғы 26 ақпандағы № 57-НҚ бұйрығына өзгеріс енгізу туралы'
