  code: '22224'
  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 8 декабря 2004 года N 476-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 декабря 2004 года N 3272. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 28 марта 2014 года № 64-ОД
  title:
    rus: О внесении изменения и дополнения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 26 февраля 2003 года N 57-ОД "Об утверждении Правил включения и исключения из Государственного регистра субъектов естественной монополии", зарегистрированный за N 2217
    kaz: '"Табиғи монополия субъектілерін Мемлекеттік тіркелімге енгізу және шығару ережесін бекіту туралы" N 2217 нөмірмен тіркелген Қазақстан Республикасының Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының 2003 жылғы 26 ақпандағы N 57-НҚ бұйрығына өзгеріс және толықтыру енгізу туралы"'
  link: https://zan.gov.kz/client/#!/doc/22224/rus
