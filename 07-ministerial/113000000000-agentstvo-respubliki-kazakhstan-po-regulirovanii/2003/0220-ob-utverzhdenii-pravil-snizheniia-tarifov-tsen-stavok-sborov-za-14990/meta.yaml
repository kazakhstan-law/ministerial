act_code: '14990'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 20 февраля 2003 года № 46-ОД. Зарегистрированный Министерством юстиции Республики Казахстан 21 марта 2003 года № 2215. Утратил силу - приказом и.о.Председателя Агентства РК по регулированию естественных монополий от 19 марта 2005 года № 91-ОД
title:
  rus: Об утверждении Правил снижения тарифов (цен, ставок сборов) за предоставляемые услуги (товары, работы) для всех потребителей субъектов естественной монополии, в период действия тарифов (цен, ставок сборов)
  kaz: Тарифтер (бағалар, алымдар ставкалары) қолданыстағы кезеңде табиғи монополия субъектiлерiнiң барлық тұтынушыларға ұсынылған қызметтер (тауарлар, жұмыстар) үшiн тарифтердi (бағаларды, алым ставкаларын) төмендету ережесiн бекiту туралы
