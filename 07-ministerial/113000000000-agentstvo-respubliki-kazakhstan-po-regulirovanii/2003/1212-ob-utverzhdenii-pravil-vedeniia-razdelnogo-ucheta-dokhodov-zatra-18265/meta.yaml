  code: '23526'
  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 18 марта 2005 года № 90-ОД. Зарегистрирован Министерством юстиции Республики Казахстан 31 марта 2005 года № 3532. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 12 декабря 2003 года N 312-ОД "Об утверждении Правил раздельного учета доходов, затрат и задействованных активов операторами связи по видам услуг телекоммуникаций, регулируемых в соответствии с законодательством о естественных монополиях и антимонопольным законодательством"
    kaz: '"Табиғи монополиялар туралы заңнамаға және монополияға қарсы заңнамаға сәйкес реттеліп көрсетілетін телекоммуникациялар қызметтерінің түрлері бойынша байланыс операторларының табыстарды, шығындар мен қолданысқа енгізілген активтерді бөлектеп есепке алу ережесін бекіту туралы" Қазақстан Республикасының Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының міндетін атқарушының 2003 жылғы 12 желтоқсандағы N 312-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/23526/rus
