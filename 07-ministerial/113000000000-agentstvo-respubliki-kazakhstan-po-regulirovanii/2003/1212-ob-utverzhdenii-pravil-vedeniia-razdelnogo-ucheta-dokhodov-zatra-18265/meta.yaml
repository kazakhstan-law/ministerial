  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 5 апреля 2007 года № 88-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 апреля 2007 года № 4626. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении дополнения и изменений в приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 12 декабря 2003 года № 312-ОД "Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов операторами связи по регулируемым видам услуг телекоммуникаций и услуг, технологически связанных с предоставлением услуг телекоммуникаций"
    kaz: '"Телекоммуникациялар қызметтерінің және телекоммуникациялардың қызметтер ұсынуына технологиялық байланысты қызметтерінің реттеліп көрсетілетін түрлері бойынша байланыс операторларының табыстарды, шығындар мен қолданысқа енгізілген активтерді бөлектеп есепке алуды жүргізу ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының міндетін атқарушының 2003 жылғы 12 желтоқсандағы № 312-НҚ бұйрығына толықтыру мен өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/33001/rus
