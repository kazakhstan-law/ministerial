act_code: '18265'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 12 декабря 2003 года № 312-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2003 года № 2649. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов операторами связи по регулируемым видам услуг телекоммуникаций и услуг, технологически связанных с предоставлением услуг телекоммуникаций
  kaz: Телекоммуникациялар қызметтерінің және телекоммуникациялардың қызметтер ұсынуына технологиялық байланысты қызметтерінің реттеліп көрсетілетін түрлері бойынша байланыс операторларының табыстарды, шығындар мен қолданысқа енгізілген активтерді бөлектеп есепке алуды жүргізу ережесін бекіту туралы
