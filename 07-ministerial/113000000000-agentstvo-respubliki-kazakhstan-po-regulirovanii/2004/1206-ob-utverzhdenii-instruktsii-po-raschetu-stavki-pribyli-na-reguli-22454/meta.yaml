  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 6 декабря 2004 года № 472-ОД "Об утверждении Инструкции по расчету ставки прибыли на регулируемую базу задействованных активов субъектов естественной монополий, оказывающих услуги магистральной железнодорожной сети и подъездных путей"
    kaz: '"Магистральдық темір жол желісі мен кірме жолдар қызметтерін көрсетуші табиғи монополиялар субъектілерінің іске қосылған активтерінің реттелетін базасына пайда ставкасын есептеу жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2004 жылғы 6 желтоқсандағы N 472-НҚ бұйрығына өзгеріс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/55962/rus
