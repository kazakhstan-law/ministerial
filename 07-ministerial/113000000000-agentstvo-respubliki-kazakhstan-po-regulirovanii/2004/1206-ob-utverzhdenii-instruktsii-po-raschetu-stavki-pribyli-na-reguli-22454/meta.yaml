act_code: '22454'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 6 декабря 2004 года № 472-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 декабря 2004 года № 3300. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по расчету ставки прибыли на регулируемую базу задействованных активов субъектов естественной монополии, оказывающих услуги магистральной железнодорожной сети и подъездных путей
  kaz: Магистральдық темір жол желісі мен кірме жолдар қызметтерін көрсетуші табиғи монополиялар субъектілерінің іске қосылған активтерінің реттелетін базасына пайда ставкасын есептеу жөніндегі нұсқаулықты бекіту туралы
