act_code: '21564'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 26 августа 2004 года № 360-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 сентября 2004 года № 3117. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 26 июля 2013 года № 231-ОД
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественной монополии, оказывающими услуги по хранению, транспортировке газа или газового конденсата по магистральным и (или) распределительным трубопроводам, эксплуатации газораспределительных установок и связанных с ними газораспределительных газопроводов
  kaz: Магистралдық және (немесе) бөлуші труба құбырлары арқылы газды немесе газ конденсатын сақтау, тасымалдау, газ бөлуші құрылғыларды және олармен байланысты газ бөлуші газ құбырларын пайдалану жөнінде қызметтер көрсететін табиғи монополия субъектілерінің табыстарды, шығындарды және іске қосылған активтерді бөлектеп есепке алуды жүргізу ережесін бекіту туралы
