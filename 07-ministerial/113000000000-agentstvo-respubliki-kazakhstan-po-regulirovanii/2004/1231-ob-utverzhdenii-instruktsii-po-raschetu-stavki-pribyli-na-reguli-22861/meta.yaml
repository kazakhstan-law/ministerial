requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 31 декабря 2004 года № 519-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 февраля 2005 года № 3418. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по расчету ставки прибыли на регулируемую базу задействованных активов на услуги телекоммуникаций, отнесенных к сферам естественных монополий
