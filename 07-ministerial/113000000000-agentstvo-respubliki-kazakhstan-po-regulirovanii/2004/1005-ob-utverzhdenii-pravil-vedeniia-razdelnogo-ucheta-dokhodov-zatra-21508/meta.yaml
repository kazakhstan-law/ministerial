act_code: '21508'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 6 октября 2004 года N 417-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 октября 2004 года N 3140. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 24 июля 2013 года № 219-ОД
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественной монополии, оказывающими услуги по передаче электрической энергии по сетям межрегионального уровня и другие услуги
  kaz: Аймақаралық деңгейдегі желілер арқылы электр энергиясын беру жөніндегі қызметтер мен басқа да қызметтер көрсететін табиғи монополия субъектілерінің табыстарды, шығындар мен іске қосылған активтерді бөлектеп есепке алуды жүргізу ережесін бекіту туралы
