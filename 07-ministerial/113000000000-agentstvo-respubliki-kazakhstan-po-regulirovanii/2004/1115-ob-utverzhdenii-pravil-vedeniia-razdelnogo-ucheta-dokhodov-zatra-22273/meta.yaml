  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 15 ноября 2004 года № 448-ОД "Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественной монополии, оказывающими услуги аэронавигации"
    kaz: '"Аэронавигация қызметтерін көрсететін табиғи монополиялар субъектілерінің табыстарды, шығындар мен іске қосылған активтерді бөлектеп есепке алуды жүргізу ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2004 жылғы 15 қарашадағы № 448-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/33503/rus
