requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 15 ноября 2004 года № 448-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 декабря 2004 года № 3277. Утратил силу приказом и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 31 июля 2013 года № 240-ОД
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественных монополий, оказывающими услуги аэронавигации
  kaz: Аэронавигация қызметтерін көрсететін табиғи монополия субъектілерінің табыстарды, шығындар мен іске қосылған активтерді бөлектеп есепке алуды жүргізу ережесін бекіту туралы
