act_code: '22287'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 8 декабря 2004 года N 477-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 декабря 2004 года за N 3278. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 21 февраля 2007 года N 54-ОД
title:
  rus: Об утверждении Правил утверждения тарифов (цен, ставок сборов) на услуги по передаче электрической и (или) тепловой энергии, предусматривающих порядок компенсирования затрат потребителей за присоединение дополнительных мощностей
  kaz: Қосымша қуаттарды қосқаны үшін тұтынушылардың шығындарын өтеу тәртібін көздейтін электр және (немесе) жылу энергиясын беру жөніндегі қызметтерге тарифтер (бағалар, алым ставкаларын) бекіту ережесін бекіту туралы
