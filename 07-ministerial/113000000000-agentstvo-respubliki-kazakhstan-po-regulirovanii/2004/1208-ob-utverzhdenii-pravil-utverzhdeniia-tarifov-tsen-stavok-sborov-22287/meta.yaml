  title:
    rus: О внесении дополнений и изменений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 8 декабря 2004 года № 477-ОД "Об утверждении Правил утверждения тарифов (цен, ставок сборов) на услуги по передаче электрической и (или) тепловой энергии, предусматривающих порядок компенсирования затрат потребителей за присоединение дополнительных мощностей"
    kaz: '"Қосымша қуаттарды қосқаны үшін тұтынушылардың шығындарын өтеу тәртібін көздейтін электр және (немесе) жылу энергиясын беру жөніндегі қызметтерге тарифтер (бағалар, алым ставкаларын) бекіту ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2004 жылғы 8 желтоқсандағы № 477-НҚ бұйрығына толықтырулар мен өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/25629/rus
