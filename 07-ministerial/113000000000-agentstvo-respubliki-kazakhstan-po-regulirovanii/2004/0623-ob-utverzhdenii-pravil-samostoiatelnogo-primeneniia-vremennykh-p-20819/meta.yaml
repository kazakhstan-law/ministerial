act_code: '20819'
requisite: Приказ И.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 24 июня 2004 года N 274-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 августа 2004 года N 2981. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 января 2018 года № 22 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил самостоятельного применения временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на регулируемые услуги аэропортов и аэронавигации
  kaz: Әуежайлар мен аэронавигацияның реттеліп көрсетілетін қызметтерінің тарифтеріне (бағаларына, алым ставкаларына) уақытша төмендету коэффициенттерін дербес қолдану ережесін бекіту туралы
