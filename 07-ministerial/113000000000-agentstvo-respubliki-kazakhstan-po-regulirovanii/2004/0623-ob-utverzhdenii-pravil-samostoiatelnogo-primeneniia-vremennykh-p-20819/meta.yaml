  title:
    rus: О внесении изменений и дополнений в приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 24 июня 2004 года N 274-ОД "Об утверждении Правил самостоятельного применения временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на регулируемые услуги аэропортов и аэронавигации"
    kaz: '"Әуежайлар мен аэронавигацияның реттеліп көрсетілетін қызметтерінің тарифтеріне (бағаларына, алым ставкаларына) уақытша төмендету коэффициентерін дербес қолдану ережесін бекіту туралы" Қазақстан Республикасының Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының міндетін атқарушының 2004 жылғы 24 маусымдағы N 274-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/30354/rus
