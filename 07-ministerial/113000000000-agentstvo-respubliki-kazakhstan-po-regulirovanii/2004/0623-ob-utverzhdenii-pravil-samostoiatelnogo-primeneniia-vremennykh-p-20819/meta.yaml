  code: '23697'
  requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 11 марта 2005 года № 77-ОД. Зарегистрирован Министерством юстиции Республики Казахстан 29 марта 2005 года № 3526. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 января 2018 года № 22 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 24 июня 2004 года № 274-ОД "Об утверждении Правил самостоятельного применения временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на услуги аэропортов и аэронавигации, подлежащие государственному регулированию"
    kaz: '"Мемлекеттік реттеуге жататын әуежайлар мен аэронавигация қызметтерінің тарифтеріне (бағаларына, алым ставкаларына) уақытша төмендету коэффициентін дербес қолдану ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының міндетін атқарушының 2004 жылғы 24 маусымдағы № 274-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/23697/rus
