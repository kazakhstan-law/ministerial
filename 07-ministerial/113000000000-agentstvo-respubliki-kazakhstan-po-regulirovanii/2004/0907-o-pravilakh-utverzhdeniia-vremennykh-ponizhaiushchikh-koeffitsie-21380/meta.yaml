  title:
    rus: О внесении изменений и дополнений в приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 8 сентября 2004 года N 375-ОД "Об утверждении Правил установления и отмены временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на услуги магистральной железнодорожной сети"
    kaz: '"Магистралдық темір жол желісі қызметтерінің тарифтеріне (бағаларына, алым ставкаларына) уақытша төмендету коэффициенттерін белгілеу және алып тастау ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының міндетін атқарушының 2004 жылғы 8 қыркүйектегі N 375-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
