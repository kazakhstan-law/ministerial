act_code: '21380'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренций от 8 сентября 2004 года N 375-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 сентября 2004 года № 3092. Утратил силу приказом и.о. Министра национальной экономики Республики Казахстан от 31 июля 2015 года № 580
title:
  rus: О Правилах утверждения временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на регулируемые услуги магистральной железнодорожной сети и железнодорожных путей с объектами железнодорожного транспорта по договорам концессии
  kaz: Магистральдық темір жол желісінің және концессия шарттары бойынша темір жол көлігінің объектілері бар темір жолдардың реттеліп көрсетілетін қызметтерінің тарифтеріне (бағаларына, алым ставкаларына) уақытша төмендету коэффициенттерін бекіту ережесі туралы
