  title:
    rus: О внесении изменений и дополнений в приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 8 сентября 2004 года № 375-ОД "О Правилах утверждения временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на регулируемые услуги магистральной железнодорожной сети"
    kaz: '"Магистральдық темір жол желісінің реттеліп көрсетілетін қызметтерінің тарифтеріне (бағаларына, алым ставкаларына) уақытша төмендету коэффициенттерін бекіту ережесі туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының міндетін атқарушының 2004 жылғы 8 қыркүйектегі N 375-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
