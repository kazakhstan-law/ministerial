act_code: '22709'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 28 декабря 2004 года № 506-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 января 2005 года № 3383. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 26 июля 2013 года № 232-ОД
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественной монополии, оказывающими услуги по транспортировке воды
  kaz: Су тасымалдау бойынша қызметтер көрсететін табиғи монополия субъектілерінің табыстарды, шығындар мен іске қосылған активтерді бөлектеп есепке алуды жүргізу ережесін бекіту туралы
