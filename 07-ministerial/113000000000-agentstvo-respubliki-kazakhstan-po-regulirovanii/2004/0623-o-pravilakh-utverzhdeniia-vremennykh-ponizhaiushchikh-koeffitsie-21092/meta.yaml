act_code: '21092'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 24 июня 2004 года № 282-ОД. Зарегистрирован Министерством юстиции Республики Казахстан 3 августа 2004 года № 2983. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 30 ноября 2009 года № 377-ОД
title:
  rus: О Правилах утверждения временных понижающих коэффициентов к тарифам на регулируемые услуги телекоммуникаций
  kaz: Телекоммуникациялардың реттеліп көрсетілетін қызметтерінің тарифтеріне уақытша төмендету коэффициенттерін бекіту ережесі туралы
