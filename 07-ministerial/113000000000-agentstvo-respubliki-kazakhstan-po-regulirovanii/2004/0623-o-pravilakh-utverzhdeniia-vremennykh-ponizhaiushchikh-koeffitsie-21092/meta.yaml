  code: '23392'
  requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 11 марта 2005 года № 76-ОД. Зарегистрирован Министерством юстиции Республики Казахстан 29 марта 2005 года № 3524. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 30 ноября 2009 года № 377-ОД
  title:
    rus: О внесении изменений и дополнений в приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 24 июня 2004 года № 282-ОД "Об утверждении Правил установления и отмены временных понижающих коэффициентов к тарифам на услуги телекоммуникаций, отнесенные к сфере естественной монополии"
    kaz: '"Табиғи монополия саласына жатқызылған телекоммуникациялар қызметтерінің тарифтеріне уақытша төмендету коэффициенттерін белгілеу және алып тастау ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының міндетін атқарушының 2004 жылғы 24 маусымдағы N 282-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/23392/rus
