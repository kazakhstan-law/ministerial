act_code: '19473'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 25 марта 2004 года № 149-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 апреля 2004 года № 2813. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О Правилах утверждения временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на регулируемые услуги по транспортировке природного газа по магистральным и (или) распределительным трубопроводам
  kaz: Табиғи газды магистральдық және (немесе) бөлуші труба құбырлары арқылы тасымалдау жөніндегі реттеліп көрсетілетін қызметтердің тарифтеріне (бағаларына, алымдар ставкаларына) уақытша төмендету коэффициенттерін бекіту ережесі туралы
