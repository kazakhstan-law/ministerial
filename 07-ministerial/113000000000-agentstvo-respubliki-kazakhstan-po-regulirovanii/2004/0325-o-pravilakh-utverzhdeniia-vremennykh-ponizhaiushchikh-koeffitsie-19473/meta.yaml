  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 27 июля 2010 года № 240-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 августа 2010 года № 6436. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 25 марта 2004 года № 149-ОД "О Правилах утверждения временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на регулируемые услуги по транспортировке природного газа по магистральным и (или) распределительным трубопроводам"
    kaz: '"Табиғи газды магистральдық және (немесе) бөлуші құбыржолдары арқылы тасымалдау жөніндегі реттеліп көрсетілетін қызметтердің тарифтеріне (бағаларына, алымдар ставкаларына) уақытша төмендету коэффициенттерін бекіту ережесі туралы" Қазақстан Республикасының Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының міндетін атқарушының 2004 жылғы 25 наурыздағы № 149-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/54418/rus
