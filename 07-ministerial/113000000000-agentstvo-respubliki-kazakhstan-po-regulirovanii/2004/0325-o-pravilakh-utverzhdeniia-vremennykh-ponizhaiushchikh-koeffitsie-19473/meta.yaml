  title:
    rus: О внесении изменений и дополнений в приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 25 марта 2004 года N 149-ОД "Об утверждении Правил установления и отмены временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на услуги по транспортировке природного газа по магистральным и (или) распределительным трубопроводам"
    kaz: '"Табиғи газды магистралдық және (немесе) бөлуші труба құбырлары арқылы тасымалдау жөніндегі қызметтердің тарифтеріне (бағаларына, алымдар ставкаларына) уақытша төмендету коэффициенттерін белгілеу және алып тастау ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау жөніндегі агенттігі төрағасының міндетін атқарушының 2004 жылғы 25 наурыздағы N 149-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/23524/rus
