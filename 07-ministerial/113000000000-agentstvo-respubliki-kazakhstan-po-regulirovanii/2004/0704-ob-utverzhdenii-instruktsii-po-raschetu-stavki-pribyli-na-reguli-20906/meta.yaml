act_code: '20906'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 5 июля 2004 года № 304-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 августа 2004 года № 2997. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по расчету ставки прибыли на регулируемую базу задействованных активов субъектов естественной монополии, оказывающих услуги по транспортировке нефти по магистральным трубопроводам
  kaz: Магистралдық труба құбырлары арқылы мұнай тасымалдау бойынша қызметтер көрсетуші табиғи монополиялар субъектілерінің іске қосылған активтерінің реттелетін базасына пайда ставкасын есептеу жөніндегі нұсқаулықты бекіту туралы
