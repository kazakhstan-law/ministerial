requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 28 декабря 2004 года № 505-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 января 2005 года № 3389. Утратил силу приказом и.о. Министра национальной экономики Республики Казахстан от 31 июля 2015 года № 581
title:
  rus: Об утверждении Правил установления и отмены временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на услуги по передаче электрической энергии и (или) технической диспетчеризации отпуска в сеть
  kaz: Электр энергиясын беру және (немесе) желіге босатуды техникалық диспетчерлеу жөніндегі қызмет тарифтеріне (бағаларына, алым ставкаларына) уақытша төмендету коэффициенттерін белгілеу және алып тастау ережесін бекіту туралы
