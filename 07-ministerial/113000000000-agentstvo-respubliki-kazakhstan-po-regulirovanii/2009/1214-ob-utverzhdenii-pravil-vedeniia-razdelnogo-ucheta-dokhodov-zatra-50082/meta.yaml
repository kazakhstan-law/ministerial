act_code: '50082'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 14 декабря 2009 года № 398-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 января 2010 года № 6003. Утратил силу приказом и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 31 июля 2013 года № 238-ОД
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественных монополий, оказывающими регулируемые услуги подъездных путей
  kaz: Кірме жолдардың реттеліп көрсетілетін қызметтерін көрсететін табиғи монополиялар субъектілерінің кірістерді, шығындар мен қолданысқа енгізілген активтерді бөлек есепке алуды жүргізу ережесін бекіту туралы
