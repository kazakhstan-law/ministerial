  title:
    rus: О внесении дополнения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 20 февраля 2009 года № 57-ОД "Об утверждении Правил дифференциации энергоснабжающими организациями тарифов на электрическую энергию по зонам суток и (или) в зависимости от объемов ее потребления физическими лицами"
    kaz: '"Тәулік зоналары бойынша және (немесе) оны жеке тұлғалардың тұтыну көлеміне қарай электр энергиясына арналған тарифтерді энергиямен жабдықтаушы ұйымдардың саралау ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2009 жылғы 20 ақпандағы № 57-НҚ бұйрығына толықтыру енгізу туралы'
