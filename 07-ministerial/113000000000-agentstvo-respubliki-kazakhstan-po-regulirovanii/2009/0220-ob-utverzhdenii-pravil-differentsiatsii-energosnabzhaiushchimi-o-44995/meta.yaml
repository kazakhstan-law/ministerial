title:
  rus: Об утверждении Правил дифференциации энергоснабжающими организациями тарифов на электрическую энергию в зависимости от объемов ее потребления физическими лицами
  kaz: Энергиямен жабдықтаушы ұйымдардың электр энергиясына тарифтерді жеке тұлғалардың оны тұтыну көлеміне қарай саралау қағидаларын бекіту туралы
