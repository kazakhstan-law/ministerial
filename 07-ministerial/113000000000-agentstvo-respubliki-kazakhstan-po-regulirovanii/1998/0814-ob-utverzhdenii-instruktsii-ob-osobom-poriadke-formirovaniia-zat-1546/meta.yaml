title:
  rus: Об утверждении Инструкции "Об особом порядке формирования затрат, учитываемых при расчете цен (тарифов) на производство и предоставление услуг (товаров, работ) субъектами естественной монополии"
  kaz: Табиғи монополия субъектiлерiнiң қызметтердi (тауарларды, жұмыстарды) өндiру мен көрсету бағаларын (тарифтерiн) есептегенде ескерiлетiн шығындарды қалыптастырудың ерекше тәртiбi туралы Нұсқаулықты бекiту туралы
