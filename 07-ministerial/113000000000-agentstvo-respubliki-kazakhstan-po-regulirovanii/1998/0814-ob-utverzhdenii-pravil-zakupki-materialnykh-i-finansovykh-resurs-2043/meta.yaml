requisite: Приказ Комитета Республики Казахстан по регулированию естественных монополий и защите конкуренции от 15 августа 1998 года № 03/1-ОД. Зарегистрирован Министерством юстиции Республики Казахстан 11 мая 1998 года № 639. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 6 июня 2003 года № 149-ОД
title:
