  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета Республики Казахстан по регулированию естественных монополий и защите конкуренции от 19 августа 1998 года N 03-5 ОД "Об утверждении Правил формирования и ведения Государственного регистра субъектов естественной монополии Республики Казахстан"
    kaz: '"Қазақстан Республикасы Табиғи монополия субъектiлерiнiң мемлекеттiк тiркелiмiн қалыптастырудың және жүргiзудiң ережесiн бекiту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестiктi қорғау жөнiндегi комитетi төрағасының 1998 жылғы 19 тамыздағы N 03-5-НҚ бұйрығына өзгерiстер мен толықтырулар енгiзу туралы'
