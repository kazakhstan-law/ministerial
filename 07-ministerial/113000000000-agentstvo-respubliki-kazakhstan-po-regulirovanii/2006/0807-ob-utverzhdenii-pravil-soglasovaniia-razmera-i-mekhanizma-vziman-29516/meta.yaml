title:
  rus: Об утверждении Правил согласования размера и механизма взимания платы за приобретение и установку приборов учета регулируемых коммунальных услуг (товаров, работ)
  kaz: Реттеліп көрсетілетін коммуналдық қызметтердің (тауарлардың, жұмыстардың) есептеу құралдарын сатып алу және орнату үшін ақыны өндіріп алу мөлшері мен тетігін келісу ережесін бекіту туралы
