  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Председателя Агентства Республики Казахстан по регулированию естественных монополий от 7 августа 2006 года № 192-ОД "Об утверждении Правил согласования размера и механизма взимания платы за приобретение и установку приборов учета регулируемых коммунальных услуг (товаров, работ)"
