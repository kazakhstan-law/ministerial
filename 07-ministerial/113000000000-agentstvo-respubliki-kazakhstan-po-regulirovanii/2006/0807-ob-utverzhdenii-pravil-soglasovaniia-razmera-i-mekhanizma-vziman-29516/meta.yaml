requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 7 августа 2006 года № 192-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 августа 2006 года № 4358. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
