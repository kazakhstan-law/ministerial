act_code: '29514'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 10 августа 2006 года № 198-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 августа 2006 года № 4356. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 28 декабря 2011 года № 417-ОД
title:
  rus: Об утверждении Правил проведения ежегодного отчета о деятельности субъекта естественной монополии по предоставлению регулируемых услуг (товаров, работ) перед потребителями и иными заинтересованными лицами
  kaz: Тұтынушылар мен өзге де мүдделі тұлғалар алдында табиғи монополия субъектісінің реттеліп көрсетілетін қызметтерін (тауарларын, жұмыстарын) ұсыну жөніндегі қызметі туралы жыл сайынғы есепті өткізу ережесін бекіту туралы
