  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 5 февраля 2009 года № 30-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 февраля 2009 года № 5557. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в некоторые приказы уполномоченного органа, осуществляющего руководство в сферах естественных монополий и на регулируемых рынках
    kaz: Табиғи монополиялар салаларындағы және реттелетін нарықтардағы басшылықты жүзеге асыратын уәкілетті органның кейбір бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
