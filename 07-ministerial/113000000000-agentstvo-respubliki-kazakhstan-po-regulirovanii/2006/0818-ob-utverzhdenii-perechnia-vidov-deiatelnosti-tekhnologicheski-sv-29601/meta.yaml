  code: '36128'
  requisite: Совместный приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 28 ноября 2007 года N 302-ОД и Министра транспорта и коммуникаций Республики Казахстан от 17 ноября 2007 года N 240. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 декабря 2007 года N 5039. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 6 апреля 2020 года № 25 и и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 13 апреля 2020 года № 199 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения и дополнений в совместный приказ исполняющего обязанности Председателя Агентства Республики Казахстан по регулированию естественных монополий от 18 августа 2006 года N 208-ОД и Министра транспорта и коммуникаций Республики Казахстан от 21 августа 2006 года N 212 "Об утверждении перечня видов деятельности, технологически связанных с регулируемыми услугами (товарами, работами) магистральной железнодорожной сети"
    kaz: '"Магистральдық темір жол желісінің реттеліп көрсетілетін қызметтерімен (тауарларымен, жұмыстарымен) технологиялық жағынан байланысты қызмет түрлерінің тізбесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының міндетін атқарушысының 2006 жылғы 18 тамыздағы N 208-НҚ және Қазақстан Республикасы Көлік және коммуникация министрінің 2006 жылғы 21 тамыздағы N 212 бірлескен бұйрығына өзгеріс пен толықтырулар енгізу туралы"'
  link: https://zan.gov.kz/client/#!/doc/36128/rus
