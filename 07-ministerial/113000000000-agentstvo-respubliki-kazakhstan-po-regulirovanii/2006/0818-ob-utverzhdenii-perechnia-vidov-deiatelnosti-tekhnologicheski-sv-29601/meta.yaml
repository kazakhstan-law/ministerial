act_code: '29601'
requisite: Совместный приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 18 августа 2006 года N 208-ОД и Министра транспорта и коммуникаций Республики Казахстан от 21 августа 2006 года № 212. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 сентября 2006 года № 4373. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 6 апреля 2020 года № 25 и и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 13 апреля 2020 года № 199 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня видов деятельности, технологически связанных с регулируемыми услугами (товарами, работами) магистральной железнодорожной сети
  kaz: Магистральдық темір жол желісінің реттеліп көрсетілетін қызметтерімен (тауарларымен, жұмыстарымен) технологиялық жағынан байланысты қызмет түрлерінің тізбесін бекіту туралы
