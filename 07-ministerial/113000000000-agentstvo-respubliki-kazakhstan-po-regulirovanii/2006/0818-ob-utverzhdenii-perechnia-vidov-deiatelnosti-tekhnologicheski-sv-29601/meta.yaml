  code: '59552'
  requisite: Совместный приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 7 июня 2011 года № 163-ОД и Министра транспорта и коммуникаций Республики Казахстан от 10 июня 2011 года № 352. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 июня 2011 года № 7035. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 6 апреля 2020 года № 25 и и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 13 апреля 2020 года № 199 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении дополнений в совместный приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 18 августа 2006 года № 208-ОД и Министра транспорта и коммуникаций Республики Казахстан от 21 августа 2006 года № 212 "Об утверждении перечня видов деятельности, технологически связанных с регулируемыми услугами (товарами, работами) магистральной железнодорожной сети"
    kaz: '"Магистральдық темір жол желісінің реттеліп көрсетілетін қызметтерімен (тауарларымен, жұмыстарымен) технологиялық жағынан байланысты қызмет түрлерінің тізбесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының міндетін атқарушының 2006 жылғы 18 тамыздағы № 208-НҚ және Қазақстан Республикасы Көлік және коммуникация министрінің 2006 жылғы 21 тамыздағы № 212 бірлескен бұйрығына толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/59552/rus
