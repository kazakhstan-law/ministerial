act_code: '27008'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 17 марта 2006 года № 77-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 марта 2006 года № 4166. Утратил силу приказом Министра национальной экономики Республики Казахстан от 21 июля 2015 года № 550
title:
  rus: Об утверждении Правил проведения финансовой и (или) технической экспертиз деятельности субъектов естественных монополий и представления заключений субъектами естественных монополий
  kaz: Табиғи монополиялар субъектілерінің қызметіне қаржылық және (немесе) техникалық сараптамалар жүргізу және табиғи монополиялар субъектілерінің қорытындылар ұсыну ережесін бекіту туралы
