  code: '93485'
  requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 24 июля 2015 года № 566. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 августа 2015 года № 11972. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: «Об утверждении Правил размещения отчета об исполнении тарифной сметы на регулируемые услуги субъектов естественных монополий, Правил уведомления потребителей о ходе исполнения субъектом естественной монополии тарифной сметы на регулируемые услуги и о внесении изменений и дополнений в некоторые приказы Агентства Республики Казахстан по регулированию естественных монополий»
    kaz: «Табиғи монополиялар субъектілерінің реттеліп көрсетілетін қызметтеріне тарифтік сметаны орындау туралы есепті орналастыру қағидаларын, Табиғи монополия субъектісінің реттеліп көрсетілетін қызметтерге тарифтік сметаны орындау барысы туралы тұтынушыларды хабардар ету қағидаларын бекіту туралы және Қазақстан Республикасы Табиғи монополияларды реттеу агенттігінің кейбір бұйрықтарына өзгерістер мен толықтырулар енгізу туралы»
  link: https://zan.gov.kz/client/#!/doc/93485/rus
