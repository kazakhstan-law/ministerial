requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 12 июня 2006 года № 149-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 июля 2006 года № 4287. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 17 июля 2013 года № 213-ОД (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил утверждения предельного уровня тарифов (цен, ставок сборов) и тарифных смет на регулируемые услуги (товары, работы) субъектов естественных монополий
  kaz: Табиғи монополиялар субъектілерінің реттеліп көрсетілетін қызметтері (тауарлары, жұмыстары) тарифтерінің (бағаларының, алымдар ставкаларының) және тарифтік сметаларының шекті деңгейін бекіту ережесін бекіту туралы
