  title:
    rus: О внесении изменений и дополнения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 12 июня 2006 года № 149-ОД "Об утверждении Правил утверждения предельного уровня тарифов (цен, ставок сборов) и тарифных смет на регулируемые услуги (товары, работы) субъектов естественных монополий"
    kaz: '"Табиғи монополиялар субъектілерінің реттеліп көрсетілетін қызметтері (тауарлары, жұмыстары) тарифтерінің (бағаларының, алымдар ставкаларының) және тарифтік сметаларының шекті деңгейін бекіту ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2006 жылғы 12 маусымдағы 149-НҚ бұйрығына өзгерістер мен толықтыру енгізу туралы"'
