  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 12 июня 2006 года N 149-ОД "Об утверждении Правил утверждения предельного уровня тарифов (цен, ставок сборов) и тарифных смет на регулируемые услуги (товары, работы) субъектов естественных монополии"
    kaz: '"Табиғи монополиялар субъектілерінің реттеліп көрсетілетін қызметтері (тауарлары, жұмыстары) тарифтерінің (бағаларының, алым ставкаларының) және тарифтік сметаларының шекті деңгейін бекіту ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу және бәсекелестікті қорғау агенттігі төрағасының 2006 жылғы 12 маусымдағы N 149-НҚ бұйрығына өзгерістер мен толықтыулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/34099/rus
