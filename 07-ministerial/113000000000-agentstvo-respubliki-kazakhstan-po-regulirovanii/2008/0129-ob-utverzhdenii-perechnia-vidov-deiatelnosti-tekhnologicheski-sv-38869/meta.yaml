requisite: Совместный приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 29 января 2008 года N 31-ОД и Министра транспорта и коммуникаций Республики Казахстан от 13 марта 2008 года N 116. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 апреля 2008 года N 5186. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 6 апреля 2020 года № 25 и и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 13 апреля 2020 года № 199 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
