  code: '99287'
  requisite: Совместный приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 8 февраля 2016 года № 165 и и.о. Министра национальной экономики Республики Казахстан от 12 февраля 2016 года № 73. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2016 года № 13131. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 6 апреля 2020 года № 25 и и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 13 апреля 2020 года № 199 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении дополнений в совместный приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 29 января 2008 года № 31-ОД и Министра транспорта и коммуникаций Республики Казахстан от 13 марта 2008 года № 116 "Об утверждении перечня видов деятельности, технологически связанных с регулируемыми услугами (товарами, работами) портов"
    kaz: '"Порттардың реттеліп көрсетілетін қызметтерімен (тауарларымен, жұмыстарымен) технологиялық жағынан байланысты қызмет түрлерінің тізбесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі Төрағасының 2008 жылғы 29 қаңтардағы № 31-НҚ және Қазақстан Республикасы Көлік және коммуникация Министрінің 2008 жылғы 13 наурыздағы № 116 бірлескен бұйрығына толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/99287/rus
