act_code: '8933'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий, защите конкуренции и поддержке малого бизнеса от 25 апреля 2001 года N 86-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 18.05.2001 г. N 1511. Утратил силу приказом Председателя Комитета по защите конкуренции Министерства индустрии и торговли Республики Казахстан от 22 сентября 2006 года N 230-ОД
title:
  rus: Об утверждении Правил формирования и ведения Государственного реестра субъектов рынка, занимающих доминирующее (монопольное) положение на определенном товарном рынке
  kaz: Белгiлi бiр тауар рыногында үстем (монополиялық) жағдайға ие рынок субъектiлерiнiң мемлекеттiк тiзiлiмiн қалыптастыру және жүргiзу ережесiн бекiту туралы
