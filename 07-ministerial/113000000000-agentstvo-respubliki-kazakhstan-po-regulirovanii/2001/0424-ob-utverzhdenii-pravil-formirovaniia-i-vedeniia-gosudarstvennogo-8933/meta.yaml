  code: '21067'
  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий и защите конкуренции от 6 июля 2004 года N 312-ОД. Зарегистрирован Министерством юстиции Республики Казахстан 3 августа 2004 года N 2978. Утратил силу приказом Председателя Комитета по защите конкуренции Министерства индустрии и торговли Республики Казахстан от 22 сентября 2006 года N 230-ОД
  title:
    rus: О внесении изменения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий, защите конкуренции и поддержке малого бизнеса от 25 апреля 2001 года N 86-ОД "Об утверждении Правил формирования и ведения Государственного реестра субъектов рынка, занимающих доминирующее (монопольное) положение на определенном товарном рынке", зарегистрированный за N 1511
    kaz: '"Белгілі бір тауар рыногында үстем (монополиялық) жағдайға ие рынок субъектілерінің Мемлекеттік тізілімін қалыптастыру және жүргізу ережесін бекіту туралы" N 1511 нөмірмен тіркелген Қазақстан Республикасының Табиғи монополияларды реттеу, бәсекелестікті қорғау және шағын бизнесті қолдау жөніндегі агенттігі төрағасының 2001 жылғы 25 сәуірдегі N 86-НҚ бұйрығына өзгеріс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/21067/rus
