  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий, защите конкуренции и поддержке малого бизнеса от 25 апреля 2001 года N 86-ОД "Об утверждении Правил формирования и ведения Государственного реестра субъектов рынка, занимающих доминирующее (монопольное) положение на определенном товарном рынке"
    kaz: '"Белгiлi бiр тауар рыногында үстем (монополиялық) жағдайға ие рынок субьектiлерiнiң Мемлекеттiк тiзiлiмiн қалыптастыру және жүргiзу ережесiн бекiту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу, бәсекелестiктi қорғау және шағын бизнестi қолдау жөнiндегi агенттiгi төрағасының 2001 жылғы 25 сәуiрдегi N 86-НҚ бұйрығына өзгерiстер енгiзу туралы'
