  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий, защите конкуренции и поддержке малого бизнеса от 25 апреля 2001 года N 86-ОД "Об утверждении Правил формирования и ведения Государственного реестра субъектов рынка, занимающих доминирующее (монопольное) положение на определенном товарном рынке"
    kaz: '"Белгiлi бiр тауар рыногында үстем (монополиялық жағдайға ие рынок субъектiлерiнiң мемлекеттiк тiзiлiмiн қалыптастыру және жүргiзу ережесiн бекiту туралы" Қазақстан Республикасының Табиғи монополияларды реттеу, бәсекелестiктi қорғау және шағын бизнестi қолдау жөнiндегi агенттiгi төрағасының 2001 жылғы 25 сәуiрдегi N 86-НҚ бұйрығына өзгерiстер мен толықтырулар енгiзу туралы'
  link: https://zan.gov.kz/client/#!/doc/12822/rus
