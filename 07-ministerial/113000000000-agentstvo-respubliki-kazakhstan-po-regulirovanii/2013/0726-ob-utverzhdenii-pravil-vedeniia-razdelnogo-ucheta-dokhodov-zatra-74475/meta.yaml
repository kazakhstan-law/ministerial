act_code: '74475'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 26 июля 2013 года № 232-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 сентября 2013 года № 8693. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественной монополии, оказывающими услуги водоснабжения и (или) водоотведения
  kaz: Сумен жабдықтау және (немесе) суды бұру қызметтерін көрсететін табиғи монополия субъектілерінің кірістерді, шығындар мен тартылған активтерді бөлек есепке алуын жүргізу қағидаларын бекіту туралы
