act_code: '74619'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 26 июля 2013 года № 227-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 сентября 2013 года № 8711. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественной монополии, оказывающими услуги по транспортировке нефти и (или) нефтепродуктов по магистральным трубопроводам
  kaz: Мұнайды және (немесе) мұнай өнімдерін магистральдық құбыржолдар арқылы тасымалдау қызметтерін көрсететін табиғи монополия субъектілерінің кірістерді, шығындар мен тартылған активтерді бөлек есепке алуын жүргізу қағидаларын бекіту туралы
