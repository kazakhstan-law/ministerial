  title:
    rus: О внесении изменений в некоторые приказы Председателя Агентства Республики Казахстан по регулированию естественных монополий
    kaz: Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының кейбір бұйрықтарына өзгерістер енгізу туралы
