  title:
    rus: О внесении изменений в приказ исполняющего обязанности Председателя Агентства Республики Казахстан по регулированию естественных монополий от 17 сентября 2013 года № 283-ОД "Об утверждении Правил утверждения нормативных технических потерь, технических и технологических норм расхода сырья, материалов, топлива, энергии субъектов естественных монополий"
    kaz: '"Табиғи монополиялар субъектілерінің нормативтік техникалық ысыраптарын, шикізат, материалдар, отын, энергия шығысының техникалық және технологиялық нормаларын бекіту қағидаларын бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының міндетін атқарушының 2013 жылғы 17 қыркүйектегі № 283-НҚ бұйрығына өзгерістер енгізу туралы'
