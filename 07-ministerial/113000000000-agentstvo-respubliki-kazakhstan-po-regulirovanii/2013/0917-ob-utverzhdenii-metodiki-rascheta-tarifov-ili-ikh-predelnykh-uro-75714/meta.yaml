act_code: '75714'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 17 сентября 2013 года № 284-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 ноября 2013 года № 8887. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики расчета тарифов или их предельных уровней на регулируемые услуги субъектов естественной монополии по снабжению тепловой энергией
  kaz: Табиғи монополия субъектілерінің жылу энергиясымен жабдықтау жөніндегі реттеліп көрсетілетін қызметтеріне тарифтер немесе олардың шектi деңгейлерiн есептеу әдістемесін бекіту туралы
