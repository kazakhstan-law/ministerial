act_code: '74556'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 19 июля 2013 года № 215-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 августа 2013 года № 8642. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил утверждения тарифов (цен, ставок сборов) и тарифных смет на регулируемые услуги (товары, работы) субъектов естественных монополий
  kaz: Табиғи монополиялар субъектілерінің реттеліп көрсетілетін қызметтеріне (тауарларына, жұмыстарына) тарифтерді (бағаларды, алымдар ставкаларын) және тарифтік сметаларды бекіту қағидаларын бекіту туралы
