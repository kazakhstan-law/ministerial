act_code: '72852'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 18 апреля 2013 года N 122-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 мая 2013 года N 8478. Утратил силу приказом Министра национальной экономики Республики Казахстан от 1 февраля 2017 года № 36
title:
  rus: Об утверждении Методики расчета цен на товары (работы, услуги) субъектов регулируемого рынка
  kaz: Реттелетін нарық субъектілерінің тауарларына (жұмыстарына, қызметтеріне) бағалар есептеу әдістемесін бекіту туралы
