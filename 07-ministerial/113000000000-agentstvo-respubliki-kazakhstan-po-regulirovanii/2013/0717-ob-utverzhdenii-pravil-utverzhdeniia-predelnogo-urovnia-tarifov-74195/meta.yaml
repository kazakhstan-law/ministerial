act_code: '74195'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 17 июля 2013 года № 213-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 августа 2013 года № 8625. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил утверждения предельного уровня тарифов (цен, ставок сборов) и тарифных смет на регулируемые услуги (товары, работы) субъектов естественных монополий
  kaz: Табиғи монополиялар субъектілерінің реттеліп көрсетілетін қызметтеріне (тауарларына, жұмыстарына) тарифтердің (бағалардың, алымдар мөлшерлемелерінің) шекті деңгейін және тарифтік сметаларды бекіту қағидаларын бекіту туралы
