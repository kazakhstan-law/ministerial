  title:
    rus: О внесении изменения в  приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 17 июля 2013 года № 213-ОД «Об утверждении Правил утверждения предельного уровня тарифов (цен, ставок сборов) и тарифных смет на регулируемые услуги (товары, работы) субъектов естественных монополий»
    kaz: «Табиғи монополиялар субъектілерінің реттеліп көрсетілетін қызметтеріне (тауарларына, жұмыстарына) тарифтердің (бағалардың, алымдар ставкаларының) шекті деңгейін және тарифтік сметаларды бекіту қағидаларын бекіту туралы» Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2013 жылғы 17 шілдедегі № 213-НҚ бұйрығына өзгеріс енгізу туралы
