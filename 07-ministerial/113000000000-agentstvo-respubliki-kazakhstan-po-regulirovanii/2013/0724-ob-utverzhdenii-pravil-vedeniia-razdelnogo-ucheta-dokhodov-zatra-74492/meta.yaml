act_code: '74492'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 24 июля 2013 года № 219-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 августа 2013 года № 8681. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественных монополий, оказывающими услуги по передаче электрической энергии по национальной электрической сети и другие услуги
  kaz: Ұлттық электр желісі арқылы электр энергиясын беру жөніндегі қызметтер мен басқа да қызметтерді көрсететін табиғи монополия субъектілерінің кірістерді, шығындар мен тартылған активтерді бөлек есепке алуын жүргізу қағидаларын бекіту туралы
