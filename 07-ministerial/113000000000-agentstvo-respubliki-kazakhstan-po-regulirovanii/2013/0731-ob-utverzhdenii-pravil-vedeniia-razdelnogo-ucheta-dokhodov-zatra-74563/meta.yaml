act_code: '74563'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 31 июля 2013 года № 240-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 сентября 2013 года № 8723. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественных монополий, оказывающими услуги аэронавигации
  kaz: Аэронавигация қызметтерін көрсететін табиғи монополия субъектілерінің кірістердің, шығындар мен қолданысқа енгізілген активтердің бөлек есебін жүргізу қағидаларын бекіту туралы
