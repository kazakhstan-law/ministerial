act_code: '74558'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по регулированию естественных монополий от 31 июля 2013 года № 238-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан от 17 сентября 2013 года № 8715. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественных монополий, оказывающими регулируемые услуги подъездных путей
  kaz: Кірме жолдардың реттеліп көрсетілетін қызметтерін көрсететін табиғи монополиялар субъектілерінің кірістерді, шығындар мен тартылған активтерді бөлек есепке алуды жүргізу қағидаларын бекіту туралы
