act_code: '77377'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 3 декабря 2013 года № 372-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 февраля 2014 года № 9120. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении некоторых методик уполномоченного органа, осуществляющего руководство в сферах естественных монополий и на регулируемых рынках
  kaz: Табиғи монополиялар салаларындағы және реттелетін нарықтардағы басшылықты жүзеге асыратын уәкілетті органның кейбір әдістемелерін бекіту туралы
