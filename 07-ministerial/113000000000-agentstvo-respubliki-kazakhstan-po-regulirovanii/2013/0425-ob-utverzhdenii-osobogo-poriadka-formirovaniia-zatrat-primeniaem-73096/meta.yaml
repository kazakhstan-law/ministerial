act_code: '73096'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 25 апреля 2013 года № 130-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 мая 2013 года № 8480. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Особого порядка формирования затрат, применяемом при утверждении тарифов (цен, ставок сборов) или их предельных уровней на регулируемые услуги (товары, работы) субъектов естественных монополий
  kaz: Табиғи монополиялар субъектiлерiнiң реттелiп көрсетiлетiн қызметтерiне (тауарларына, жұмыстарына) тарифтерді (бағаларды, алымдар мөлшерлемелерін) немесе олардың шекті деңгейлерін бекiту кезiнде қолданылатын шығындарды қалыптастырудың ерекше тәртiбiн бекiту туралы
