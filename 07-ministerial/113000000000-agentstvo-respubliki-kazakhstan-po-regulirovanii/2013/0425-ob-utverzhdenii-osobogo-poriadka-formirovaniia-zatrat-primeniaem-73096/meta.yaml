  title:
    rus: О внесении изменения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 25 апреля 2013 года № 130-ОД «Об утверждении Особого порядка формирования затрат, применяемом при утверждении тарифов (цен, ставок сборов) на регулируемые услуги (товары, работы) субъектов естественных монополий»
    kaz: «Табиғи монополиялар субъектілерінің реттеліп көрсетілетін қызметтеріне (тауарларына, жұмыстарына) тарифтерді (бағаларды, алымдар мөлшерлемелерін) бекіту кезінде қолданылатын шығындарды қалыптастырудың ерекше тәртібін бекіту туралы» Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2013 жылғы 25 сәуірдегі № 130-НҚ бұйрығына өзгеріс енгізу туралы
