  requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 27 июня 2018 года № 230. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 июля 2018 года № 17211. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 25 апреля 2013 года № 130-ОД «Об утверждении Особого порядка формирования затрат, применяемом при утверждении тарифов (цен, ставок сборов) на регулируемые услуги (товары, работы) субъектов естественных монополий»
    kaz: «Табиғи монополиялар субъектiлерiнiң реттелiп көрсетiлетiн қызметтерiне (тауарларына, жұмыстарына) тарифтерді (бағаларды, алымдар мөлшерлемелерін) бекiту кезiнде қолданылатын шығындарды қалыптастырудың ерекше тәртiбiн бекiту туралы» Қазақстан Республикасы Табиғи монополияларды реттеу агенттiгi төрағасының 2013 жылғы 25 сәуірдегі № 130-НҚ бұйрығына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/123575/rus
