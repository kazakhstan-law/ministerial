  title:
    rus: О внесении дополнения и изменения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 25 апреля 2013 года № 130-ОД "Об утверждении Особого порядка формирования затрат, применяемом при утверждении тарифов (цен, ставок сборов) на регулируемые услуги (товары, работы) субъектов естественных монополий"
    kaz: '"Табиғи монополиялар субъектiлерiнiң реттелiп көрсетiлетiн қызметтерiне (тауарларына, жұмыстарына) тарифтерді (бағаларды, алымдар мөлшерлемелерін) бекiту кезiнде қолданылатын шығындарды қалыптастырудың ерекше тәртiбiн бекiту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттiгi төрағасының 2013 жылғы 25 сәуірдегі № 130-НҚ бұйрығына толықтыру мен өзгеріс енгізу туралы'
