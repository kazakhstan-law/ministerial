act_code: '74620'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 26 июля 2013 года № 231-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 сентября 2013 года № 8712. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественной монополии, оказывающими услуги по хранению, транспортировке товарного газа по соединительным, магистральным газопроводам и (или) газораспределительным системам, эксплуатации групповых резервуарных установок, а также транспортировке сырого газа по соединительным газопроводам
  kaz: Тауарлық газды сақтау, жалғастырушы магистральдық газ құбырлары және (немесе) газ тарату жүйелері арқылы тасымалдау, топтық резервуарлық қондырғыларды пайдалану, сондай-ақ шикі газды жалғастырушы газ құбырлары арқылы тасымалдау қызметтерін көрсететін табиғи монополия субъектілерінің кірістерді, шығындар мен тартылған активтерді бөлек есепке алуын жүргізу қағидаларын бекіту туралы
