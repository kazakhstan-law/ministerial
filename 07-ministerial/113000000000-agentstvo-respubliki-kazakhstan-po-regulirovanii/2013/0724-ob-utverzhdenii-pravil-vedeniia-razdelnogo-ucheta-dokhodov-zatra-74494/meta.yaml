act_code: '74494'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 24 июля 2013 года № 221-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 сентября 2013 года № 8690. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественных монополий, оказывающими услуги по производству и (или) передаче и (или) распределению тепловой энергии
  kaz: Жылу энергиясын өндіру және (немесе) беру және (немесе) тарату қызметтерін көрсететін табиғи монополиялар субъектілерінің кірістерді, шығындар мен тартылған активтерді бөлек есепке алуын жүргізу қағидаларын бекіту туралы
