act_code: '34959'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 27 августа 2007 года N 226-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 сентября 2007 года N 4915. Утратил силу приказом Министра национальной экономики Республики Казахстан от 21 июля 2015 года № 550
title:
  rus: Об утверждении Правил согласования штатных расписаний и предельного уровня оплаты труда руководящих работников административного персонала субъектов естественных монополий, являющихся юридическими лицами с участием государства в уставном капитале и аффилиированных с ними лицами
  kaz: Жарғылық капиталына мемлекеттің қатысуымен заңды тұлғалар болып табылатын табиғи монополиялар субъектілерінің және олармен аффилиирленген тұлғалардың әкімшілік персоналының басшы қыметкерлерінің штат кестелерін және оларға еңбекақы төлеудің шекті деңгейін келісу ережесін бекіту туралы
