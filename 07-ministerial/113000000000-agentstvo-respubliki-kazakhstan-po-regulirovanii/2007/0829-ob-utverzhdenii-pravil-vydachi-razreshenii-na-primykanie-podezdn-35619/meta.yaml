  title:
    rus: О внесении изменения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 29 августа 2007 года № 227-ОД "Об утверждении Правил выдачи разрешений на примыкание подъездных путей к магистральным и станционным путям"
    kaz: '"Магистральдық және станциялық жолдарға кірме жолдарды жалғастыруға рұқсат беру ережесін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2007 жылғы 29 тамыздағы № 227-НҚ бұйрығына өзгеріс енгізу туралы'
