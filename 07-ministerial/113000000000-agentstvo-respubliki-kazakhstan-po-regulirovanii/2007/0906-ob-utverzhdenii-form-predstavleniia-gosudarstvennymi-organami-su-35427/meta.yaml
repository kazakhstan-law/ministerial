  code: '42456'
  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 3 ноября 2008 года № 336-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 ноября 2008 года № 5378
  title:
    rus: О внесении дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 6 сентября 2007 года № 237-ОД "Об утверждении форм представления государственными органами, субъектами рынка и их объединениями данных в регулирующий орган для проведения им анализа соответствующих товарных рынков в целях обеспечения недискриминационного доступа к товарам (работам, услугам) и инфраструктуре субъектов товарных рынков"
    kaz: '"Тауар нарықтары субъектілерінің тауарларына (жұмыстарына, көрсетілетін қызметтеріне) және инфрақұрылымына кемсітусіз қол жеткізуді қамтамасыз ету мақсатында мемлекеттік органдар, нарық субъектілері мен олардың бірлестіктері реттеуші органға оның тиісті тауар нарықтарына талдау жүргізуі үшін ұсынатын деректердің нысандарын бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2007 жылғы 6 қыркүйектегі N 237-НҚ бұйрығына толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/42456/rus
