act_code: '35427'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 6 сентября 2007 года № 237-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 октября 2007 года № 4972. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 16 января 2009 года № 5-ОД
title:
  rus: Об утверждении форм представления государственными органами, субъектами рынка и их объединениями данных в регулирующий орган для проведения им анализа соответствующих товарных рынков в целях обеспечения недискриминационного доступа к товарам (работам, услугам) и инфраструктуре субъектов товарных рынков
  kaz: Тауар нарықтары субъектілерінің тауарларына (жұмыстарына, көрсетілетін қызметтеріне) және инфрақұрылымына кемсітусіз қол жеткізуді қамтамасыз ету мақсатында мемлекеттік органдар, нарық субъектілері мен олардың бірлестіктері реттеуші органға оның тиісті тауар нарықтарына талдау жүргізуі үшін ұсынатын деректердің нысандарын бекіту туралы
