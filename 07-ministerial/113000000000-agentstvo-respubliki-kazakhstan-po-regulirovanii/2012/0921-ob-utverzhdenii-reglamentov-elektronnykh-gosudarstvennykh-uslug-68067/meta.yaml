act_code: '68067'
requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 21 сентября 2012 года № 243-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 сентября 2012 года № 7951. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 3 марта 2014 года № 51-ОД
title:
  rus: Об утверждении Регламентов электронных государственных услуг, оказываемых Агентством Республики Казахстан по регулированию естественных монополий
  kaz: Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі көрсететін электрондық мемлекеттік қызметтерінің регламенттерін бекіту туралы
