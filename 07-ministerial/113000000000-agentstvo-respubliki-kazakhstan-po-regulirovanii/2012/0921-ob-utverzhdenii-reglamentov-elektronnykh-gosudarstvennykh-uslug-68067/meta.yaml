  requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 13 февраля 2013 года № 47-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 марта 2013 года № 8374. Утратил силу приказом Председателя Агентства Республики Казахстан по регулированию естественных монополий от 3 марта 2014 года № 51-ОД
  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 21 сентября 2012 года № 243-ОД "Об утверждении Регламентов электронных государственных услуг, оказываемых Агентством Республики Казахстан по регулированию естественных монополий"
    kaz: '"Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі көрсететін электрондық мемлекеттік қызметтерінің регламенттерін бекіту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2012 жылғы 21 қыркүйектегі № 243-НҚ бұйрығына өзгерістер енгізу туралы'
