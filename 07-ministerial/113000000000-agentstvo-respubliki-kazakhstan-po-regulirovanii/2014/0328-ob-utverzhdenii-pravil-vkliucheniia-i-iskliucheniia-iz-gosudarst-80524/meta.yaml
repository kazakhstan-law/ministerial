  title:
    rus: О внесении изменения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 28 марта 2014 года № 64-ОД "Об утверждении Правил включения и исключения из Государственного регистра субъектов естественных монополий"
    kaz: '"Табиғи монополиялар субъектiлерiн мемлекеттiк тiркелiмге енгiзу және одан шығару қағидаларын бекiту туралы" Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі Төрағасының 2014 жылғы 28 наурыздағы № 64-НҚ бұйрығына өзгеріс енгізу туралы'
