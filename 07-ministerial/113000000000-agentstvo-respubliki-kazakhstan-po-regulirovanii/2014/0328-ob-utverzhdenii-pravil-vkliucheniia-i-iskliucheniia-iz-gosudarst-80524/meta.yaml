requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 28 марта 2014 года № 64-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 мая 2014 года № 9404. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
