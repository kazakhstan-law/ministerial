  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 28 марта 2014 года № 64-ОД «Об утверждении Правил включения и исключения из Государственного регистра субъектов естественных монополий»
    kaz: «Табиғи монополиялар субъектiлерiн Мемлекеттiк тiркелiмге енгiзу және одан шығару қағидаларын бекiту туралы» Қазақстан Республикасы Табиғи монополияларды қорғау агенттігі төрағасының 2014 жылғы 28 наурыздағы № 64-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы
