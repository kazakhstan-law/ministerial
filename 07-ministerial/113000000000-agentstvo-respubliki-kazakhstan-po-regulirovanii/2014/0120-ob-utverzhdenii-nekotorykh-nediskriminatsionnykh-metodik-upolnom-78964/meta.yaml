  title:
    rus: О внесении изменений и дополнения в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 20 января 2014 года № 13-ОД «Об утверждении некоторых Методик уполномоченного органа, осуществляющего руководство в сферах естественных монополий и регулируемых рынках»
    kaz: «Табиғи монополиялар салаларындағы және реттелетін нарықтардағы басшылықты жүзеге асыратын мемлекеттік органның бір қатар әдістемелерін бекіту туралы» Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2014 жылғы 20 қаңтардағы № 13-НҚ бұйрығына өзгерістер мен толықтыру енгізу туралы
