requisite: Приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 20 января 2014 года № 13-ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 апреля 2014 года № 9302. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении некоторых недискриминационных методик уполномоченного органа, осуществляющего руководство в сферах естественных монополий
