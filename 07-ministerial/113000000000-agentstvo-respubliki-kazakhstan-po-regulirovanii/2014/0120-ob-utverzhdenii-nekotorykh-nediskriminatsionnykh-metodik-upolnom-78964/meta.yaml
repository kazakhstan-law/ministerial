  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по регулированию естественных монополий от 20 января 2014 года № 13-ОД «Об утверждении некоторых недискриминационных методик уполномоченного органа, осуществляющего руководство в сферах естественных монополий»
    kaz: «Табиғи монополиялар салаларында басшылықты жүзеге асыратын уәкілетті органның кейбір кемсітпейтін әдістемелерін бекіту туралы» Қазақстан Республикасы Табиғи монополияларды реттеу агенттігі төрағасының 2014 жылғы 20 қаңтардағы № 13-НҚ бұйрығына өзгерістер енгізу туралы
