title:
  rus: Об утверждении положений о республиканском государственном учреждении «Комитет атомного надзора и контроля Агентства Республики Казахстан по атомной энергии» и о его территориальном подразделении»
  kaz: Қазақстан Республикасы Атом энергиясы жөніндегі агенттігінің Атомдық қадағалау және бақылау комитеті» республикалық мемлекеттік мекемесі туралы және оның аумақтық бөлімшесі туралы ережелерді бекіту туралы
