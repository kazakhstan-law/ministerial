  title:
    rus: О внесении изменений и дополнения в приказ Председателя Агентства Республики Казахстан по атомной энергии от 9 июня 2025 года № 05-н/қ «Об утверждении Положения о республиканском государственном учреждении «Комитет атомного надзора и контроля Агентства Республики Казахстан по атомной энергии»
    kaz: «Қазақстан Республикасы Атом энергиясы жөніндегі агенттігінің Атомдық қадағалау мен бақылау комитеті» республикалық мемлекеттік мекемесі туралы ережені бекіту туралы» Қазақстан Республикасы Атом энергиясы жөніндегі агенттігі төрағасының 2025 жылғы 9 маусымдағы № 05-н/қ бұйрығына өзгерістер мен толықтыру енгізу туралы
