act_code: '231604'
requisite: Приказ Председателя Агентства Республики Казахстан по атомной энергии от 13 октября 2026 года № 113-н/қ. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 октября 2026 года № 40162
title:
  rus: Об утверждении Правил приобретения товаров, работ и услуг Национальным оператором атомных электростанций, а также юридическими лицами, более пятидесяти процентов голосующих акций (долей участия в уставном капитале) которых прямо или косвенно принадлежат Национальному оператору атомных электростанций
  kaz: Атом электр станциялары ұлттық операторының, сондай-ақ дауыс беретін акцияларының (жарғылық капиталға қатысу үлестерінің) елу пайыздан астамы тікелей немесе жанама түрде Атом электр станциялары ұлттық операторына тиесілі заңды тұлғалардың тауарларды, жұмыстар мен көрсетілетін қызметтерді сатып алу қағидаларын бекіту туралы
