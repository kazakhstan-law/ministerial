title:
  rus: Об утверждении Правил формирования и ведения реестра товаров, работ и услуг, используемых при проведении операций по недропользованию по урану, и их производителей, включая критерии их оценки для внесения в данный реестр
  kaz: Уран бойынша жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде пайдаланылатын тауарлардың, жұмыстар мен көрсетілетін қызметтердің және оларды өндірушілердің тізіліміне енгізу үшін оларды бағалау өлшемшарттарын қоса алғанда, аталған тізілімді қалыптастыру және жүргізу қағидаларын бекіту туралы
