title:
  rus: Об утверждении Правил синхронизации работ систем электронного закупа в отношении урана с работой реестра товаров, работ и услуг, используемых при проведении операций по недропользованию, и их производителей
  kaz: Уранға қатысты электрондық сатып алу жүйелерінің жұмыстарын жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде пайдаланылатын тауарлардың, жұмыстар мен көрсетілетін қызметтердің және оларды өндірушілердің тізілімінің жұмысымен үйлестіру қағидаларын бекіту туралы
