  title:
    rus: О внесении изменений и дополнений в Приказ Председателя Комитета по работе с несостоятельными должниками Министерства государственных доходов Республики Казахстан от 11 июля 2002 года N 70 "Об утверждении Правил согласования заключительного отчета конкурсного управляющего в процедурах банкротства и внесудебной ликвидации должника"
    kaz: '"Банкроттық рәсімдеріне және борышкерді соттан тыс тарату конкурстық басқарушының қорытынды есебін келісу туралы ережені бекіту туралы" Қазақстан Республикасы Мемлекеттік кіріс министрлігі Дәрменсіз борышкерлермен жұмыс жөніндегі комитеті Төрағасының 2002 жылғы 11 шілдедегі N 70 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
