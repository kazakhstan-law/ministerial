act_code: '13002'
requisite: Приказ Председателя Комитета по работе с несостоятельными должниками Министерства государственных доходов Республики Казахстан от 11 июля 2002 года N 70. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 августа 2002 года N 1944. Утратил силу приказом Министра финансов Республики Казахстан от 12 августа 2008 года N 398 (порядок введения в действие см. п.4).
title:
