act_code: '13001'
requisite: Приказ Председателя Комитета по работе с несостоятельными должниками Министерства государственных доходов Республики Казахстан от 11 июля 2002 года N 69. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 августа 2002 года N 1942. Утратил силу - приказом Председателя Комитета по работе с несостоятельными должниками Министерства финансов Республики Казахстан от 20 марта 2006 года N 12
title:
  rus: Об утверждении Инструкции по продлению и завершению сроков реабилитационной процедуры, конкурсного производства и внесудебной ликвидации должника
  kaz: Оңалту рәсiмі, конкурстық іс жүргізу және борышкердi соттан тыс тарату мерзімдерін ұзарту және аяқтау туралы нұсқаулық
