  code: '14781'
  requisite: Приказ Председателя Комитета по работе с несостоятельными должниками Министерства финансов Республики Казахстан от 25 февраля 2003 года N 16. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 марта 2003 года N 2206. Утратил силу - приказом Председателя Комитета по работе с несостоятельными должниками Министерства финансов Республики Казахстан от 20 марта 2006 года N 12
  title:
    rus: О внесении изменений в Приказ Председателя Комитета по работе с несостоятельными должниками Министерства государственных доходов Республики Казахстан от 11 июля 2002 года N 69 "Об утверждении Инструкции по продлению и завершению сроков реабилитационной процедуры, конкурсного производства и внесудебной ликвидации должника", зарегистрированный в Министерстве юстиции Республики Казахстан за N 1942
    kaz: Қазақстан Республикасы Әділет Министрлігінде N 1942 тіркелген Қазақстан Республикасы Мемлекеттік кіріс Министрлігінің Дәрменсіз борышкерлермен жұмыс жөніндегі Комитеті Төрағасының 2002 жылғы 11 шілдедегі N 69 "Конкурстық істің және оңалту рәсімдерінің соттан тыс борышкерлерді таратудағы мерзімдерінің аяқталуы және ұзартылуы Нұсқаулығын бекіту туралы" Бұйрығына өзгертулер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/14781/rus
