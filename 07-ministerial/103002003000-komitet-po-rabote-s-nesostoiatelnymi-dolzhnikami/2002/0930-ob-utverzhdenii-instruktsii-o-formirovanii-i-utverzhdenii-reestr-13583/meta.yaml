  title:
    rus: О внесении изменения в Приказ Председателя Комитета по работе с несостоятельными должниками Министерства финансов Республики Казахстан от 1 октября 2002 года N 4 "Об утверждении Инструкции о формировании и утверждении реестра требований кредиторов в процедурах банкротства", зарегистрированный в Министерстве юстиции Республики Казахстан за N 2034
    kaz: Қазақстан Республикасы Әділет Министрлігінде N 2034 тіркелген Қазақстан Республикасы Қаржы Министрлігінің Дәрменсіз борышкерлермен жұмыс жөніндегі Комитеті Төрағасының 2002 жылғы 1 қазандағы N 4 "Банкроттық рәсімдердегі кредиторлардың талаптары тізімін бекіту және қалыптастыру Нұсқаулығын бекіту туралы" бұйрығына өзгерістер енгізу туралы
