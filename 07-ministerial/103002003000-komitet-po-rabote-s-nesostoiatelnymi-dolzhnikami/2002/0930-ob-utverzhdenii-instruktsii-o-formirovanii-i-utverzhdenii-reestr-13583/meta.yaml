  code: '18588'
  requisite: Приказ Председателя Комитета по работе с несостоятельными должниками Министерства финансов Республики Казахстан от 23 января 2004 года N 7. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 февраля 2004 года N 2699. Утратил силу - приказом Председателя Комитета по работе с несостоятельными должниками Министерства финансов Республики Казахстан от 20 марта 2006 года N 12
  title:
    rus: О внесении изменений в приказ Председателя Комитета по работе с несостоятельными должниками Министерства финансов Республики Казахстан от 1 октября 2002 года N 4 "Об утверждении Инструкции о формировании и утверждении реестра требований кредиторов в процедурах банкротства", зарегистрированный в Министерстве юстиции Республики Казахстан за N 2034
    kaz: Қазақстан Республикасы Әділет министрлігінде N 2034 тіркелген "Банкроттық рәсімдердегі кредиторлардың талаптары тізімін бекіту және қалыптастыру Нұсқаулығын бекіту туралы" Қазақстан Республикасы Қаржы министрлігінің дәрменсіз борышкерлермен жұмыс жөніндегі Комитеті Төрағасының 2002 жылғы 1 қазандағы N 4 бұйырығына өзгерістер енгізу туралы
