act_code: '13583'
requisite: Приказ Председателя Комитета по работе с несостоятельными должниками Министерства финансов Республики Казахстан от 1 октября 2002 года N 4. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 ноября 2002 года N 2034. Утратил силу - приказом Председателя Комитета по работе с несостоятельными должниками Министерства финансов Республики Казахстан от 20 марта 2006 года N 12
title:
  rus: Об утверждении Инструкции о формировании и утверждении реестра требований кредиторов в процедурах банкротства
  kaz: Банкроттық рәсімдерінде кредиторлар талаптарының тізілімін калыптастыру және бекіту жөніндегі Нұсқаулықтың бекітілуі туралы
