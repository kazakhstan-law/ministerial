  code: '14780'
  requisite: Приказ Председателя Комитета по работе с несостоятельными должниками Министерства финансов Республики Казахстан от 25 февраля 2003 года N 15. Зарегистрирован в Министерстве юстиции Республики Казахстан от 14 марта 2003 года N 2205. Утратил силу - приказом Председателя Комитета по работе с несостоятельными должниками Министерства финансов Республики Казахстан от 20 марта 2006 года N 12
  title:
    rus: О внесении изменений в Приказ Председателя Комитета по работе с несостоятельными должниками Министерства государственных доходов Республики Казахстан от 11 июля 2002 года N 67 "Об утверждении Инструкции по формированию и утверждению комитета кредиторов в процедурах банкротства, реабилитационной процедуре и во внесудебной процедуре ликвидации", зарегистрированный в Министерстве юстиции Республики Казахстан за N 1943
    kaz: Қазақстан Республикасы Әділет Министрлігінде N 1943 тіркелген Қазақстан Республикасы Мемлекеттік кіріс Министрлігінің Дәрменсіз борышкерлермен жұмыс жөніндегі Комитеті Төрағасының 2002 жылғы 11 шілдедегі N 67 "Соттан тыс тарату рәсімінде және оңалту рәсімінде, банкроттық рәсімдегі, комитет кредиторларын бекіту және құру Нұсқаулығын бекіту туралы" Бұйрығына өзгертулер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/14780/rus
