act_code: '13015'
requisite: Приказ Председателя Комитета по работе с несостоятельными должниками Министерства государственных доходов Республики Казахстан от 11 июля 2002 года N 67. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 августа 2002 года N 1943. Утратил силу - приказом Председателя Комитета по работе с несостоятельными должниками Министерства финансов Республики Казахстан от 20 марта 2006 года N 12
title:
  rus: Об утверждении Инструкции по формированию и утверждению комитета кредиторов в процедурах банкротства, реабилитационной процедуре и во внесудебной процедуре ликвидации
  kaz: Оңалту рәсімдерін және соттан тыс таратылуын, банкроттық рәсімдерінде кредиторлар комитетін қалыптастыру және бекіту туралы нұсқаулық
