act_code: '231451'
requisite: Приказ и.о. Министра экологии и природных ресурсов Республики Казахстан от 8 октября 2026 года № 261-П
title:
  rus: Об утверждении образцов форменной одежды со знаками различия (без погон), правил ношения и нормы обеспечения ею должностных лиц ведомства уполномоченного органа и его территориальных подразделений, осуществляющих государственный контроль и надзор в области охраны, воспроизводства и использования животного мира (за исключением рыбных ресурсов и других водных животных), а также работников государственных учреждений и организаций, осуществляющих непосредственную охрану животного мира (за исключением рыбных ресурсов и других водных животных)
  kaz: Жануарлар дүниесін (балық ресурстарын және басқа да су жануарларын қоспағанда) қорғау, өсімін молайту және пайдалану саласындағы мемлекеттік бақылауды және қадағалауды жүзеге асыратын уәкілетті орган ведомствосының және оның аумақтық бөлімшелерінің лауазымды адамдарының, сондай-ақ жануарлар дүниесін (балық ресурстарын және басқа да су жануарларын қоспағанда) қорғауды тікелей жүзеге асыратын мемлекеттік мекемелер мен ұйымдар жұмыскерлерінің айырым белгілері бар нысанды киім (погонсыз) үлгілерін, оны киіп жүру тәртібін және онымен қамтамасыз ету нормаларын бекіту туралы
