act_code: '231398'
requisite: Приказ Министра экологии и природных ресурсов Республики Казахстан от 6 октября 2026 года № 253. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 октября 2026 года № 40136
title:
  rus: Об утверждении Правил подтверждения производителями масел, полимерной, стеклянной, бумажной и (или) картонной упаковок, аккумуляторных батарей, использования для их производства не менее тридцати процентов отработанных масел, отходов пластмасс, стекла, бумаги и картона, использованных аккумуляторных батарей, переработанных и утилизированных на территории Республики Казахстан
  kaz: Майларды, полимерлік, әйнек, қағаз және (немесе) картон қаптамаларды, аккумуляторлық батареяларды өндірушілердің оларды өндіру үшін Қазақстан Республикасының аумағында қайта өңделген және кәдеге жаратылған пайдаланылған майлардың, пластмасса, әйнек, қағаз және картон қалдықтарының, пайдаланылған аккумуляторлық батареялардың кемінде отыз пайызын пайдалануын растау қағидаларын бекіту туралы
