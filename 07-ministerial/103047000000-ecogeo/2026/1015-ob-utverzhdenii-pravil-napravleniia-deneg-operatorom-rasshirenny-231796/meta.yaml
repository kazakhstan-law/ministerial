act_code: '231796'
requisite: Приказ и.о. Министра экологии и природных ресурсов Республики Казахстан от 15 октября 2026 года № 274. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 октября 2026 года № 40195
title:
  rus: Об утверждении Правил направления денег оператором расширенных обязательств производителей (импортеров), поступивших на его банковский счет от производителей и импортеров на организационно-техническое и информационное обеспечение системы сбора, транспортировки, подготовки к повторному использованию, сортировки, обработки, переработки, обезвреживания и (или) утилизации отходов и вторичных ресурсов, финансирование рекламной деятельности, образовательных, маркетинговых мероприятий в сфере обращения с отходами и вторичными ресурсами
  kaz: Өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелері операторының өндірушілер мен импорттаушылардан өзінің банктік шотына қалдықтарды және қайталама ресурстарды жинау, тасымалдау, қайта пайдалануға дайындау, сұрыптау, өңдеу, қайта өңдеу, залалсыздандыру және (немесе) кәдеге жарату жүйесін ұйымдастыру-техникалық және ақпараттық қамтамасыз ету, қалдықтармен және қайталама ресурстармен жұмыс істеу саласындағы жарнама қызметін, білім беру, маркетингтік іс-шараларды қаржыландыруға түскен ақшаны бағыттау қағидаларын бекіту туралы
