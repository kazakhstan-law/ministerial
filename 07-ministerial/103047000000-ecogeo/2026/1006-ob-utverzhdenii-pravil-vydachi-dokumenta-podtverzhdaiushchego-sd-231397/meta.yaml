requisite: Приказ Министра экологии и природных ресурсов Республики Казахстан от 6 октября 2026 года № 252. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 октября 2026 года № 40135
title:
  rus: Об утверждении Правил выдачи документа, подтверждающего сдачу на утилизацию вышедших из эксплуатации транспортного средства и (или) самоходной сельскохозяйственной техники, в том числе предусматривающего право на получение скидочных сертификатов на приобретение на территории Республики Казахстан транспортного средства, произведенного в Республике Казахстан
  kaz: Пайдаланудан шыққан көлік құралын және (немесе) өздігінен жүретін ауыл шаруашылығы техникасын кәдеге жаратуға тапсырылғанын растайтын құжатты, оның ішінде Қазақстан Республикасының аумағында өндірілген көлік құралын сатып алуға арналған жеңілдік сертификаттарын алу құқығын көздейтін құжатты беру қағидаларын бекіту туралы
