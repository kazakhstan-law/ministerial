requisite: Приказ и.о. Министра экологии и природных ресурсов Республики Казахстан от 31 августа 2026 года № 190. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 сентября 2026 года № 39806
title:
  rus: Об утверждении Правил регистрации в административном органе, разведенных в неволе и (или) полувольных условиях животных, виды которых включены в приложение II Конвенции о международной торговле видами дикой фауны и флоры, находящимися под угрозой исчезновения, которые могут быть предметом торговли
  kaz: Құрып кету қаупі төнген жабайы фауна мен флора түрлерімен халықаралық сауда туралы конвенцияның II қосымшасына енгізілген, сауда нысаны болуы мүмкін еріксіз және (немесе) жартылай ерікті жағдайларда өсірілген жануарлар түрлерін әкімшілік органында тіркеу қағидаларын бекіту туралы
