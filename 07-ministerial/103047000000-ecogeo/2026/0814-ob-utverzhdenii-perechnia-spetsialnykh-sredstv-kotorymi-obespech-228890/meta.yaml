title:
  rus: Об утверждении Перечня специальных средств, которыми обеспечиваются должностные лица, осуществляющие государственный контроль и надзор в области охраны, воспроизводства и использования животного мира, и должностные лица государственной охраны животного мира
  kaz: Жануарлар дүниесін қорғау, өсімін молайту және пайдалану саласындағы мемлекеттік бақылау мен қадағалауды жүзеге асыратын лауазымды адамдарды және жануарлар дүниесін мемлекеттік қорғаудың лауазымды адамдарын қамтамасыз ететін арнайы құралдар тізбесін бекіту туралы
