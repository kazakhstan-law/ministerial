act_code: '171410'
requisite: Приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 26 августа 2022 года № 585 п
title:
  rus: Об утверждении норм оснащенности материально-техническими средствами территориальных подразделений ведомства уполномоченного органа, местных исполнительных органов, осуществляющих деятельность в области охраны, воспроизводства и использования животного мира, и специализированных организаций
  kaz: Уәкілетті органның ведомствосының аумақтық бөлімшелерін, жануарлар дүниесін қорғау, өсімін молайту және пайдалану саласындағы қызметті жүзеге асыратын жергілікті атқарушы органдарды және мамандандырылған ұйымдарды материалдық-техникалық құралдармен жарақтандыру нормаларын бекіту туралы
