  title:
    rus: О внесении изменений в приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 20 мая 2022 года № 170 «Об утверждении Правил проведения общественного контроля в области ответственного обращения с животными, а также выдачи физическим лицам удостоверений общественных инспекторов в области ответственного обращения с животными»
