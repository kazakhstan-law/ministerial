title:
  rus: Об утверждении Перечня должностей должностных лиц, имеющих право на ношение форменной одежды (без погон), правила ношения форменной одежды (без погон), образцов форменной одежды (без погон)
  kaz: Нысанды киім (погонсыз) киіп жүруге құқығы бар лауазымды тұлғалар лауазымдарының тізбесін, нысанды киім (погонсыз) киіп жүру қағидаларын, нысанды киім (погонсыз) үлгілерін бекіту туралы
