  title:
    rus: О внесении изменений в приказы Министра экологии, геологии и природных ресурсов Республики Казахстан от 10 марта 2022 года № 74 «Об утверждении Правил отнесения категорий государственных служащих подразделений государственного экологического контроля уполномоченного органа в области охраны окружающей среды к должностным лицам, осуществляющим государственный экологический контроль» и от 26 декабря 2022 года № 775 «Об утверждении Перечня должностей должностных лиц, имеющих право на ношение форменной одежды (без погон), правила ношения форменной одежды (без погон), образцов форменной одежды (без погон)»
    kaz: Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің «Қоршаған ортаны қорғау саласындағы уәкілетті органның мемлекеттік экологиялық бақылау бөлімшелері мемлекеттік қызметшілерінің санаттарын мемлекеттік экологиялық бақылауды жүзеге асыратын лауазымды адамдарға жатқызу қағидаларын бекіту туралы» 2022 жылғы 10 наурыздағы № 74 және «Нысанды киім (погонсыз) киіп жүруге құқығы бар лауазымды тұлғалар лауазымдарының тізбесін, нысанды киім (погонсыз) киіп жүру қағидаларын, нысанды киім (погонсыз) үлгілерін бекіту туралы» 2022 жылғы 26 желтоқсандағы № 775 бұйрықтарына өзгерістер енгізу туралы
