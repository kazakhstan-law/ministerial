act_code: '173605'
requisite: Приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 9 ноября 2022 года № 689. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 ноября 2022 года № 30484
title:
  rus: Об утверждении перечня отдельных видов продукции (товаров), производимые на территории Республики Казахстан и (или) ввозимые на территорию Республики Казахстан физическими и юридическими лицами, по которым обеспечивают сбор, транспортировку, подготовку к повторному использованию, сортировку, обработку, переработку, обезвреживание и (или) утилизацию отходов, образующихся после утраты потребительских свойств такой продукции (товаров)
  kaz: Тұтынушылық қасиеттері жоғалғаннан кейін пайда болатын қалдықтарды жинауды, тасымалдауды, қайта пайдалануға дайындауды, сұрыптауды, өңдеуді, қайта өңдеуді, залалсыздандыруды және (немесе) кәдеге жаратуды қамтамасыз ететін жеке және заңды тұлғалар Қазақстан Республикасының аумағында өндіретін және (немесе) Қазақстан Республикасының аумағына әкелетін өнімнің (тауарлардың) жекелеген түрлерінің тізбесін бекіту туралы
