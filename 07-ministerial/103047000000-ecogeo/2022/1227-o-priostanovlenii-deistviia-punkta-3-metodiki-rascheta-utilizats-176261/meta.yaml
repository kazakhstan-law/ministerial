requisite: Приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 27 декабря 2022 года № 778. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 декабря 2022 года № 31321. Утратил силу приказом и.о. Министра экологии и природных ресурсов Республики Казахстан от 13 октября 2023 года № 281
title:
  rus: О приостановлении действия пункта 3 Методики расчета утилизационного платежа, утвержденной приказом и.о. Министра экологии, геологии и природных ресурсов Республики Казахстан от 2 ноября 2021 года № 448
  kaz: Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің міндетін атқарушының 2021 жылғы 2 қарашадағы № 448 бұйрығымен бекітілген Кәдеге жарату төлемін есептеу әдістемесінің 3-тармағының қолданысын тоқтата тұру туралы
