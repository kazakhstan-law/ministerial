    kaz: «Қалдықтарды жинаудың, тасымалдаудың, қайта пайдалануға дайындаудың, сұрыптаудың, өңдеудің, қайта өңдеудің, залалсыздандырудың және (немесе) кәдеге жаратудың меншікті жүйесі бар өндірушілер (импорттаушылар) қоршаған ортаны қорғау саласындағы уәкілетті орган айқындаған тәртіпке сәйкес өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелері жөніндегі міндеттемелердің орындалғанын растау ретінде қоршаған ортаны қорғау саласындағы уәкілетті органға өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелері қолданылатын өнімнің (тауарлардың) тұтынушылық қасиеттері жоғалғаннан кейін түзілген қалдықтардың жиналғанын, тасымалданғанын, қайта пайдалануға дайындалғанын, сұрыпталғанын, өңделгенін, қайта өңделгенін, залалсыздандырылғанын және (немесе) кәдеге жаратылғанын растайтын құжаттарын ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің 2022 жылғы 9 қарашадағы № 690 бұйрығына өзгерістер енгізу туралы
