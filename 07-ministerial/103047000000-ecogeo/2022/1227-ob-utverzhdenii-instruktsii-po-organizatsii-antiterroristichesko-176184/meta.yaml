title:
  rus: Об утверждении инструкции по организации антитеррористической защиты объектов Министерства экологии, геологии и природных ресурсов Республики Казахстан и его ведомств, уязвимых в террористическом отношении
  kaz: Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің және оның ведомстволарының террористік тұрғыдан осал объектілерінің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулығын бекіту туралы
