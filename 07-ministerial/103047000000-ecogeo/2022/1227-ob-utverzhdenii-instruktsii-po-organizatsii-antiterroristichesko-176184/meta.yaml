  title:
    rus: О внесении изменений в приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 27 декабря 2022 года № 776 «Об утверждении инструкции по организации антитеррористической защиты объектов Министерства экологии, геологии и природных ресурсов Республики Казахстан и его ведомств, уязвимых в террористическом отношении»
    kaz: «Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің және оның ведомстволарының террористік тұрғыдан осал объектілерінің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулығын бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің 2022 жылғы 27 желтоқсандағы № 776 бұйрығына өзгерістер енгізу туралы
