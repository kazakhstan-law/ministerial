title:
  rus: Об утверждении Правил отнесения категорий государственных служащих подразделений государственного экологического контроля уполномоченного органа в области охраны окружающей среды к должностным лицам, осуществляющим государственный экологический контроль
  kaz: Қоршаған ортаны қорғау саласындағы уәкілетті органның мемлекеттік экологиялық бақылау бөлімшелері мемлекеттік қызметшілерінің санаттарын мемлекеттік экологиялық бақылауды жүзеге асыратын лауазымды адамдарға жатқызу қағидаларын бекіту туралы
