  title:
    rus: Об утверждении Перечня отдельных видов отходов, которые утрачивают статус отходов и переходят в категорию готовой продукции или вторичного ресурса (материального или энергетического), критерий для отдельных видов отходов, которые утрачивают статус отходов и переходят в категорию готовой продукции или вторичного ресурса (материального или энергетического), о внесении изменений в приказ исполняющего обязанности Министра экологии, геологии и природных ресурсов Республики Казахстан от 18 января 2022 года № 14 «Об утверждении формы отчета по инвентаризации отходов и инструкции по ее заполнению» и о признании утратившим силу приказа исполняющего обязанности Министра энергетики Республики Казахстан от 19 июля 2016 года № 332 «Об утверждении критериев отнесения отходов потребления ко вторичному сырью»
    kaz: Қалдықтардың мәртебесін жоғалтатын және дайын өнім немесе қайталама ресурс (материалдық немесе энергетикалық) санатына ауысатын қалдықтардың жекелеген түрлерінің тізбесін, қалдықтардың мәртебесін жоғалтатын және дайын өнім немесе қайталама ресурс (материалдық немесе энергетикалық) санатына ауысатын қалдықтардың жекелеген түрлері үшін өлшемшарттарын бекіту туралы, «Қалдықтарды түгендеу жөніндегі есеп нысанын және оны толтыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің міндетін атқарушының 2022 жылғы 18 қаңтардағы № 14 бұйрығына өзгерістер енгізу туралы және «Тұтыну қалдықтарын қайталама шикізатқа жатқызу өлшемшарттарын бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2016 жылғы 19 шілдедегі № 332 бұйрығының күші жойылды деп тану туралы
