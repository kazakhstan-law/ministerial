    kaz: «2022 жылғы 1 шілдеден бастап 2023 жылғы 1 шілдеге дейін балық ресурстарын және басқа да су жануарларын алып қою лимиттерін бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің 2022 жылғы 9 маусымдағы № 208 бұйрығына өзгерістер енгізу туралы
