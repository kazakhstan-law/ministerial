title:
  rus: Об утверждении Правил по установлению доплат и надбавок за условия труда гражданским служащим, работникам организаций, содержащихся за счет средств государственного бюджета, работникам казенных предприятий в сфере лесного, рыбного и охотничьего хозяйства
  kaz: Орман, балық және аңшылық шаруашылығы саласындағы азаматтық қызметшілерге, мемлекеттік бюджет қаражаты есебінен ұсталатын ұйымдардың қызметкерлеріне, қазыналық кәсіпорындардың қызметкерлеріне еңбек жағдайлары үшін қосымша ақылар мен үстемеақылар белгілеу қағидаларын бекіту туралы
