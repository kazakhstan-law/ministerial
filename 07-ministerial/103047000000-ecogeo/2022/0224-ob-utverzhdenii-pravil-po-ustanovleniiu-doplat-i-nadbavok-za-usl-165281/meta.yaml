  title:
    rus: О внесении дополнения в приказ исполняющего обязанности Министра экологии, геологии и природных ресурсов Республики Казахстан от 24 февраля 2022 года № 58 «Об утверждении Правил по установлению доплат и надбавок за условия труда гражданским служащим, работникам организаций, содержащихся за счет средств государственного бюджета, работникам казенных предприятий в сфере лесного, рыбного и охотничьего хозяйства»
    kaz: «Орман, балық және аңшылық шаруашылығы саласындағы азаматтық қызметшілерге, мемлекеттік бюджет қаражаты есебінен ұсталатын ұйымдардың қызметкерлеріне, қазыналық кәсіпорындардың қызметкерлеріне еңбек жағдайлары үшін қосымша ақылар мен үстемеақылар белгілеу қағидаларын бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрі міндетін атқарушының 2022 жылғы 24 ақпандағы № 58 бұйрығына толықтыру енгізу туралы
