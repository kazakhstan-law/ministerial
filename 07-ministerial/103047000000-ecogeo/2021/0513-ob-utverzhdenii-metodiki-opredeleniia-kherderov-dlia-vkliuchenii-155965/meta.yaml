title:
  rus: Об утверждении Методики определения хердеров для включения в перечень диспергентов и хердеров для ликвидации аварийных разливов нефти на море и в предохранительной зоне Республики Казахстан
  kaz: Қазақстан Республикасының теңізінде және сақтық аймағында мұнайдың авариялық төгілуін жоюға арналған диспергенттер мен хердерлердің тізбесіне енгізу үшін хердерлерді айқындау әдістемесін бекіту туралы
