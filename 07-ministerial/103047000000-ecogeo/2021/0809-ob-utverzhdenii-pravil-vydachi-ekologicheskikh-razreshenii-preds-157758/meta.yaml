    kaz: «Экологиялық рұқсаттар, қоршаған ортаға әсер ету туралы декларацияны ұсыну, әсер етуге экологиялық рұқсат бланкілерінің нысанын және оларды толтыру тәртібін бекіту қағидаларын» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің 2021 жылғы 9 тамыздағы № 319 бұйрығына өзгеріс енгізу туралы
