  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра экологии, геологии и природных ресурсов Республики Казахстан от 9 августа 2021 года № 319 «Об утверждении Правил выдачи экологических разрешений, представления декларации о воздействии на окружающую среду, а также форм бланков экологического разрешения на воздействие и порядка их заполнения»
    kaz: «Экологиялық рұқсаттар беру, қоршаған ортаға әсер ету туралы декларацияны ұсыну қағидаларын, әсер етуге экологиялық рұқсат бланкілерінің нысанын және оларды толтыру тәртібін бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің міндетін атқарушының 2021 жылғы 9 тамыздағы № 319 бұйрығына өзгерістер енгізу туралы
