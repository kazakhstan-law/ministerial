  title:
    rus: О внесении изменений в приказ Министерства экологии, геологии и природных ресурсов Республики Казахстан от 14 июня 2021 года № 250 «Об утверждении Правил разработки программы производственного экологического контроля объектов I и II категорий, ведения внутреннего учета, формирования и предоставления периодических отчетов по результатам производственного экологического контроля»
    kaz: «I және II санаттағы объектілерді өндірістік экологиялық бақылау, ішкі есепке алуды жүргізу, өндірістік экологиялық бақылау нәтижелері бойынша мерзімді есептерді жасау және ұсыну бағдарламасын әзірлеу қағидаларын бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің 2021 жылғы 14 шілдедегі № 250 бұйрығына өзгерістер енгізу туралы
