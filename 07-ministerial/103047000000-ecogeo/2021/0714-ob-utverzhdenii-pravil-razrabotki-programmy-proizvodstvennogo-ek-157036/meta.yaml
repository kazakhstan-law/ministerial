title:
  rus: Об утверждении Правил разработки программы производственного экологического контроля объектов I и II категорий, ведения внутреннего учета, формирования и предоставления периодических отчетов по результатам производственного экологического контроля
  kaz: I және II санаттағы объектілерді өндірістік экологиялық бақылау, ішкі есепке алуды жүргізу, өндірістік экологиялық бақылау нәтижелері бойынша мерзімдік есептерді қалыптастыру және ұсыну бағдарламасын әзірлеу қағидаларын бекіту туралы
