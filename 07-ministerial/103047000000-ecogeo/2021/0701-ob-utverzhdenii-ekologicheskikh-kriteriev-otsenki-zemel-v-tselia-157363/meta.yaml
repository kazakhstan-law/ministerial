requisite: Приказ и.о. Министра экологии, геологии и природных ресурсов Республики Казахстан от 1 июля 2021 года № 228. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 июля 2021 года № 23748
title:
  rus: Об утверждении Экологических критериев оценки земель в целях определения необходимости их перевода из более ценных в менее ценные, консервации, а также отнесения к зоне экологического бедствия или зоне чрезвычайной экологической ситуации
  kaz: Жерді неғұрлым құнды жерден құндылығы төменіне ауыстыру, консервациялау қажеттілігін айқындау, сондай-ақ экологиялық зілзала аймағына немесе төтенше экологиялық жағдай аймағына жатқызу мақсатында жерді бағалаудың экологиялық өлшемшарттарын бекіту туралы
