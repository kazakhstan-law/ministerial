  title:
    rus: О внесении изменений в приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 20 октября 2021 года № 413 «Об утверждении Правил оказания государственной услуги «Выдача путевки на проведение любительского (спортивного) рыболовства, разрешаемого для нужд местного населения, проживающего в охранной зоне Маркакольского государственного природного заповедника»
    kaz: «Марқакөл мемлекеттік табиғи қорығының корғау аймағында тұратын жергілікті халықтың мұқтажы үшін рұқсат етілетін әуесқойлық (спорттық) балық аулауды жүргізуге жолдама беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің 2021 жылғы 20 қазандағы № 413 бұйрығына өзгерістер енгізу туралы
