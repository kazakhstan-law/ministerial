title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача путевки на проведение любительского (спортивного) рыболовства, разрешаемого для нужд местного населения, проживающего в охранной зоне Маркакольского государственного природного заповедника»
  kaz: «Марқакөл мемлекеттік табиғи қорығының қорғау аймағында тұратын жергілікті халықтың мұқтажы үшін рұқсат етілетін әуесқойлық (спорттық) балық аулауды жүргізуге жолдама беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы
