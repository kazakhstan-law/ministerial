title:
  rus: Об утверждении Правил выдачи разрешений на ввоз на территорию Республики Казахстан из государств – членов Евразийского экономического союза и вывоз с территории Республики Казахстан в эти государства озоноразрушающих веществ и содержащей их продукции
  kaz: Озонды бұзатын заттарды және құрамында олар бар өнімдерді Еуразиялық экономикалық одаққа мүше мемлекеттерден Қазақстан Республикасының аумағына әкелуге және Қазақстан Республикасының аумағынан осы мемлекеттерге әкетуге рұқсаттар беру қағидаларын бекіту туралы
