  title:
    rus: О внесении изменений в приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 12 июля 2021 года № 244 «Об утверждении Правил выдачи разрешений на ввоз на территорию Республики Казахстан из государств – членов Евразийского экономического союза и вывоз с территории Республики Казахстан в эти государства озоноразрушающих веществ и содержащей их продукции» и приказ и.о. Министра экологии, геологии и природных ресурсов Республики Казахстан от 19 июля 2021 года № 258 «Об утверждении Правил выдачи разрешений на производство работ с использованием озоноразрушающих веществ, ремонт, монтаж, обслуживание оборудования, содержащего озоноразрушающие вещества, транспортировку, хранение, рекуперацию, восстановление, утилизацию озоноразрушающих веществ»
    kaz: «Озонды бұзатын заттарды және құрамында олар бар өнімдерді Еуразиялық экономикалық одаққа мүше мемлекеттерден Қазақстан Республикасының аумағына әкелуге және Қазақстан Республикасының аумағынан осы мемлекеттерге әкетуге рұқсаттар беру қағидаларын бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің 2021 жылғы 12 шiлдедегі № 244 бұйрығына және «Озонды бұзатын заттарды пайдалана отырып, жұмыстар жүргізуге, құрамында озонды бұзатын заттары бар жабдықтарды жөндеуге, монтаждауға, оларға қызмет көрсетуге, озонды бұзатын заттарды тасымалдауға, сақтауға, рекуперациялауға, қалпына келтіруге, кәдеге жаратуға рұқсаттар беру қағидаларын бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің м.а. 2021 жылғы 19 шiлдедегі № 258 бұйрығына өзгерістер енгізу туралы
