    kaz: «2021 жылғы 1 шілдеден бастап 2022 жылғы 1 шілдеге дейін балық ресурстарын және басқа да су жануарларын алып қою лимиттерін бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің 2021 жылғы 14 маусымдағы № 198 бұйрығына өзгерістер енгізу туралы
