requisite: Приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 16 ноября 2021 года № 470. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 ноября 2021 года № 25210
title:
  rus: Об утверждении Правил компенсации производителям социально значимых продовольственных товаров расходов, связанных с внесением утилизационного платежа производителями (импортерами) полимерной, стеклянной, бумажной, картонной и (или) металлической упаковок, упаковки из комбинированных материалов, применяемых для упаковывания социально значимых продовольственных товаров
  kaz: Әлеуметтік маңызы бар азық-түлік тауарларын орау үшін қолданылатын полимер, шыны, қағаз, картон және (немесе) металл орамаларды, құрамдастырылған материалдардан жасалған ораманы өндірушілердің (импорттаушылардың) кәдеге жарату төлемін енгізуіне байланысты шығыстарды әлеуметтік маңызы бар азық-түлік тауарларын өндірушілерге өтеу қағидаларын бекіту туралы
