title:
  rus: Об утверждении Требований к раздельному сбору отходов, в том числе к видам или группам (совокупности видов) отходов, подлежащих обязательному раздельному сбору с учетом технической, экономической и экологической целесообразности
  kaz: Қалдықтарды бөлек жинауға, оның ішінде техникалық, экономикалық және экологиялық орындылығы ескеріле отырып, міндетті бөлек жинауға жататын қалдықтардың түрлеріне немесе топтарына (түрлерінің жиынтығына) қойылатын талаптарды бекіту туралы
