  title:
    rus: О внесении изменений в приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 15 декабря 2021 года № 497-п «Об утверждении натуральных норм специальных транспортных средств Министерства экологии и природных ресурсов Республики Казахстан»
    kaz: «Қазақстан Республикасы Экология және табиғи ресурстар министрлігінің арнайы көлік құралдарының заттай нормаларын бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің 2021 жылғы 15 желтоқсандағы № 497-п бұйрығына өзгерістер енгізу туралы
