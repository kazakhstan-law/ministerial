title:
  rus: Об утверждении Правил выдачи разрешений на производство работ с использованием озоноразрушающих веществ, ремонт, монтаж, обслуживание оборудования, содержащего озоноразрушающие вещества, транспортировку, хранение, рекуперацию, восстановление, утилизацию озоноразрушающих веществ
  kaz: Озонды бұзатын заттарды пайдалана отырып, жұмыстар жүргізуге, құрамында озонды бұзатын заттары бар жабдықтарды жөндеуге, монтаждауға, оларға қызмет көрсетуге, озонды бұзатын заттарды тасымалдауға, сақтауға, рекуперациялауға, қалпына келтіруге, кәдеге жаратуға рұқсаттар беру қағидаларын бекіту туралы
