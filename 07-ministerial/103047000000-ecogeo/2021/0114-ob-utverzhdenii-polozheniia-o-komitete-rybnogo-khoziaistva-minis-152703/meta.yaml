title:
  rus: Об утверждении Положения о Комитете рыбного хозяйства Министерства экологии, геологии и природных ресурсов Республики Казахстан
  kaz: Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің Балық шаруашылығы комитеті туралы ережені бекіту туралы
