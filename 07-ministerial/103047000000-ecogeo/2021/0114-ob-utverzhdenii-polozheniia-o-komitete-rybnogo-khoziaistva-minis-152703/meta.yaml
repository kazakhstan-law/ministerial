  title:
    rus: О внесении изменения в приказ исполняющего обязанности Ответственного секретаря Министерства экологии, геологии и природных ресурсов Республики Казахстан от 14 января 2021 года № 5-п «Об утверждении Положения о Комитете рыбного хозяйства Министерства экологии, геологии и природных ресурсов Республики Казахстан»
    kaz: «Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің Балық шаруашылығы комитеті туралы ережені бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігі Жауапты хатшысының міндетін атқарушының 2021 жылғы 14 қаңтардағы № 5-Ө бұйрығына өзгеріс енгізу туралы
