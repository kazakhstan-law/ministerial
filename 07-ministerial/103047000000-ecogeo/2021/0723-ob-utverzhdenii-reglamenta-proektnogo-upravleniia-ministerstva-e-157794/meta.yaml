  title:
    rus: О внесении изменений и дополнений в приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 23 июля 2021 года № 269-п «Об утверждении Регламента проектного управления Министерства экологии, геологии и природных ресурсов Республики Казахстан»
    kaz: «Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің жобалық басқару регламентін бекіту туралы» Қазақстан Республикасының Экология, геология және табиғи ресурстар министрінің 2021 жылғы 23 шілдедегі № 269-ө бұйрығына өзгерістер мен толықтырулар енгізу туралы
