act_code: '161376'
requisite: Приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 3 декабря 2021 года № 483. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 декабря 2021 года № 25656. Утратил силу приказом и.о. Министра сельского хозяйства Республики Казахстан от 14 августа 2026 года № 306 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня видов деятельности, технологически связанных с производством товаров, работ, услуг субъекта государственной монополии в области охраны, воспроизводства и использования животного мира
  kaz: Жануарлар дүниесін қорғау, өсімін молайту және пайдалану саласындағы мемлекеттік монополия субъектісінің қызметінен тауарларды, жұмыстарды, көрсетілетін қызметтерді өндірумен технологиялық тұрғыдан байланысты қызмет түрлерінің тізбесін бекіту туралы
