  title:
    rus: О внесении изменений в приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 12 июля 2021 года № 245 «Об утверждении квалификационных требований к лицензируемому виду деятельности в области охраны окружающей среды по их подвидам»
