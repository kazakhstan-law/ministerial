  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра экологии, геологии и природных Республики Казахстан от 19 июля 2021 года № 257 «Об утверждении Правил разработки целевых показателей качества окружающей среды, в том числе минимального перечня индикаторов, для которых устанавливаются целевые показатели качества окружающей среды»
    kaz: «Қоршаған орта сапасының нысаналы көрсеткіштерін, оның ішінде қоршаған орта сапасының нысаналы көрсеткіштері белгіленетін индикаторлардың ең аз тізбесін әзірлеу қағидаларын бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің міндетін атқарушының 2021 жылғы 19 шiлдедегі № 257 бұйрығына өзгерістер мен толықтырулар енгізу туралы
