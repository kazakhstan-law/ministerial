title:
  rus: Об утверждении Правил ведения государственного климатического кадастра, а также состава данных государственного климатического кадастра и порядок предоставления государственным органам, иным организациям и физическим лицам его данных
  kaz: Мемлекеттік климаттық кадастрды жүргізу қағидаларын, сондай-ақ мемлекеттік климаттық кадастр деректерінің құрамын және мемлекеттік органдарға, өзге де ұйымдар мен жеке тұлғаларға оның деректерін беру тәртібін бекіту туралы
