title:
  rus: Об утверждении Методики по определению диспергентов для включения их в перечень диспергентов для ликвидации аварийных разливов нефти на море и в предохранительной зоне Республики Казахстан
  kaz: Қазақстан Республикасының теңізінде және сақтық аймағында мұнайдың авариялық төгілуін жоюға арналған диспергенттердің тізбесіне енгізу үшін диспергенттерді айқындау жөніндегі әдістемені бекіту туралы
