caused_by:
  code: '216405'
  requisite: Приказ Министра экологии и природных ресурсов Республики Казахстан от 31 октября 2025 года № 296. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 ноября 2025 года № 37323
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра экологии, геологии и природных ресурсов Республики Казахстан от 31 января 2020 года № 28 «Об утверждении Правил аккредитации республиканских ассоциаций общественных объединений охотников и субъектов охотничьего хозяйства, а также общественных объединений рыболовов и субъектов рыбного хозяйства, проведении их аккредитации»
    kaz: «Аңшылардың және аңшылық шаруашылығы субъектілерінің қоғамдық бірлестіктерінің, сондай-ақ балық аулаушылар мен балық шаруашылығы субъектілерінің қоғамдық бірлестіктерінің республикалық қауымдастықтарын аккредиттеу, оларды аккредиттеуден өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің міндетін атқарушының 2020 жылғы 31 қаңтардағы № 28 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/216405/rus
