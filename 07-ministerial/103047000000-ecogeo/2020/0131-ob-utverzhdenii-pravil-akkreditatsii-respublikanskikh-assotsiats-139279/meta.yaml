requisite: Приказ и.о. Министра экологии, геологии и природных ресурсов Республики Казахстан от 31 января 2020 года № 28. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 января 2020 года № 19960
title:
  rus: Об утверждении Правил аккредитации республиканских ассоциаций общественных объединений охотников и субъектов охотничьего хозяйства, проведении их аккредитации
  kaz: Аңшылардың және аңшылық шаруашылығы субъектілерінің қоғамдық бірлестіктерінің республикалық қауымдастықтарын аккредиттеу, оларды аккредиттеуден өткізу қағидаларын бекіту туралы
