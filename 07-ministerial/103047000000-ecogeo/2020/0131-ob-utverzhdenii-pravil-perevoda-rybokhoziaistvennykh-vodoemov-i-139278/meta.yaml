act_code: '139278'
requisite: Приказ и.о. Министра экологии, геологии и природных ресурсов Республики Казахстан от 31 января 2020 года № 27. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 января 2020 года № 19957. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 3 октября 2025 года № 350 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил перевода рыбохозяйственных водоемов и (или) участков, закрепленных для ведения рыболовства, в рыбохозяйственные водоемы и (или) участки для ведения рыбоводства (аквакультуры)
  kaz: Балық аулауды жүргізу үшін бекітіп берілген балық шаруашылығы су айдындарын және (немесе) учаскелерін балық өсіруді (акваөсіруді) жүргізуге арналған балық шаруашылығы су айдындарына және (немесе) учаскелеріне ауыстыру қағидаларын бекіту туралы
