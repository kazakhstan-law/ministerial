  requisite: Приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 16 марта 2022 года № 78. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 марта 2022 года № 27224. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 3 октября 2025 года № 350 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра экологии, геологии и природных ресурсов Республики Казахстан от 31 января 2020 года № 27 «Об утверждении Правил перевода рыбохозяйственных водоемов и (или) участков, закрепленных для ведения промыслового рыболовства, в рыбохозяйственные водоемы и (или) участки для ведения рыбоводства (аквакультуры)»
    kaz: «Кәсіпшілік балық аулауды жүргізу үшін бекітіп берілген балық шаруашылығы су айдындарын және (немесе) учаскелерін балық өсіруді (акваөсіруді) жүргізуге арналған балық шаруашылығы су айдындарына және (немесе) учаскелеріне ауыстыру қағидаларын бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің міндетін атқарушының 2020 жылғы 31 қаңтардағы № 27 бұйрығына өзгерістер енгізу туралы
