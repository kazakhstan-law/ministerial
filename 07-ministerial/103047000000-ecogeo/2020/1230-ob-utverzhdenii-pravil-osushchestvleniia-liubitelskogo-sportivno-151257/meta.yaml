act_code: '151257'
requisite: Приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 30 декабря 2020 года № 344. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 января 2021 года № 22020
title:
  rus: Об утверждении Правил осуществления любительского (спортивного) рыболовства, мелиоративного лова, научно-исследовательского лова, лова в воспроизводственных целях на водных объектах, входящих в состав особо охраняемых природных территорий со статусом юридического лица
  kaz: Заңды тұлға мәртебесі бар ерекше қорғалатын табиғи аумақтардың құрамына кіретін су объектілерінде әуесқойлық (спорттық) балық аулауды, мелиорациялық аулауды, ғылыми-зерттеу үшін аулауды, өсімін молайту мақсатында аулауды жүзеге асыру қағидаларын бекіту туралы
