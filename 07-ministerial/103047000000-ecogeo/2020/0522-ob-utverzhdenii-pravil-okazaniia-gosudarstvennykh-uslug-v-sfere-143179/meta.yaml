title:
  rus: Об утверждении Правил оказания государственных услуг в сфере геологии и пользования водными ресурсами
  kaz: Геология және су ресурстарын пайдалану саласындағы мемлекеттiк көрсетілетін қызметтерді көрсету қағидаларын бекiту туралы
