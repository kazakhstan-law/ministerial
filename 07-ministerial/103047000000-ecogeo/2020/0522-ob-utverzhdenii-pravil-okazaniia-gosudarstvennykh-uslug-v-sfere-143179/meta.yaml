caused_by:
  code: '195922'
  requisite: Приказ Министра промышленности и строительства Республики Казахстан от 18 апреля 2024 года № 142. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 апреля 2024 года № 34280
  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра экологии, геологии и природных ресурсов Республики Казахстан от 22 мая 2020 года № 117 «Об утверждении Правил оказания государственных услуг в сфере геологии и пользования водными ресурсами»
    kaz: «Геология және су ресурстарын пайдалану саласындағы мемлекеттiк көрсетілетін қызметтерді көрсету қағидаларын бекiту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің міндетін атқарушының 2020 жылғы 22 мамырдағы № 117 бұйрығына өзгерістер мен толықтырулар енгізу туралы
