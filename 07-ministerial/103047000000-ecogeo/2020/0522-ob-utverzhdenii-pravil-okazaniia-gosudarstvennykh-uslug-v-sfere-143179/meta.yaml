  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра экологии, геологии и природных ресурсов Республики Казахстан от 22 мая 2020 года № 117 «Об утверждении Правил оказания государственных услуг в сфере геологии и пользования водными ресурсами»
    kaz: «Геология және су ресурстарын пайдалану саласында мемлекеттік қызметтер көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің міндетін атқарушының 2020 жылғы 22 мамырдағы № 117 бұйрығына өзгерістер енгізу туралы
