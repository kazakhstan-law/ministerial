act_code: '143795'
requisite: Приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 10 июня 2020 года № 138. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 июня 2020 года № 20856
title:
  rus: Об утверждении Правил выдачи административным органом разрешений на импорт на территорию Республики Казахстан, экспорт и (или) реэкспорт с территории Республики Казахстан объектов растительного мира, их частей и дериватов, подпадающих под действие Конвенции о международной торговле видами дикой фауны и флоры, находящимися под угрозой исчезновения
  kaz: Әкімшілік органның құрып кету қаупі төнген жабайы фауна мен флора түрлерімен халықаралық сауда туралы конвенцияның күші қолданылатын өсімдіктер дүниесі объектілерін, олардың бөліктері мен дериваттарын Қазақстан Республикасының аумағына импорттауға, Қазақстан Республикасының аумағынан экспорттауға және (немесе) кері экспорттауға арналған рұқсаттар беру қағидаларын бекіту туралы
