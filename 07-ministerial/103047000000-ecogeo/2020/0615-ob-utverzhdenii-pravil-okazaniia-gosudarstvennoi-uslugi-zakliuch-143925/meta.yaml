  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра экологии, геологии и природных ресурсов Республики Казахстан от 15 июня 2020 года № 145 «Об утверждении Правил оказания государственной услуги «Заключение уполномоченного органа государств-членов Евразийского экономического союза на транзит опасных отходов через таможенную территорию Евразийского экономического союза»
    kaz: «Еуразиялық экономикалық одақтың кедендік аумағы арқылы қауіпті қалдықтардың транзитіне Еуразиялық экономикалық одаққа мүше мемлекеттердің уәкілетті органының қорытындысы» мемлекеттік көрсетілетін қызмет қағидаларын бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрінің міндетін атқарушының 2020 жылғы 15 маусымдағы № 145 бұйрығына өзгерістер мен толықтырулар енгізу туралы
