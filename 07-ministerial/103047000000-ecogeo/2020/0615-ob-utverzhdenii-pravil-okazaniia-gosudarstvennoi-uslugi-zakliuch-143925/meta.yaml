title:
  rus: Об утверждении Правил оказания государственной услуги «Заключение уполномоченного органа государств - членов Евразийского экономического союза на транзит опасных отходов через таможенную территорию Евразийского экономического союза»
  kaz: «Еуразиялық экономикалық одақтың кедендік аумағы арқылы қауіпті қалдықтардың транзитіне Еуразиялық экономикалық одаққа мүше мемлекеттердің уәкілетті органының қорытындысы» мемлекеттік көрсетілетін қызмет қағидаларын бекіту туралы
