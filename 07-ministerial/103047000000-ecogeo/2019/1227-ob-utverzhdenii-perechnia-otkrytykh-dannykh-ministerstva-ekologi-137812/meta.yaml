  title:
    rus: О внесении изменения в приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 27 декабря 2019 года № 126 «Об утверждении Перечня открытых данных Министерства экологии, геологии и природных ресурсов Республики Казахстан, размещаемых на интернет-портале открытых данных»
    kaz: «Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің ашық деректердің интернет-порталында орналастырылатын ашық деректер тізбесін бекіту туралы» Қазақстан Республикасының Экология, геология және табиғи ресурстар министрінің 2019 жылғы 27 желтоқсандағы № 126 бұйрығына өзгеріс енгізу туралы
