act_code: '137812'
requisite: Приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 27 декабря 2019 года № 126. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2019 года № 19801. Утратил силу приказом Министра экологии, геологии и природных ресурсов Республики Казахстан от 11 апреля 2022 года № 113 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Перечня открытых данных Министерства экологии, геологии и природных ресурсов Республики Казахстан, размещаемых на интернет-портале открытых данных
