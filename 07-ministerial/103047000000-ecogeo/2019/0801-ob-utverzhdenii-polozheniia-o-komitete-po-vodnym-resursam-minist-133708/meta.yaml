    kaz: «Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің Су ресурстары комитеті туралы ережені бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің Жауапты хатшысының 2019 жылғы 1 тамыздағы № 8-П бұйрығына өзгерістер мен толықтырулар енгізу туралы
