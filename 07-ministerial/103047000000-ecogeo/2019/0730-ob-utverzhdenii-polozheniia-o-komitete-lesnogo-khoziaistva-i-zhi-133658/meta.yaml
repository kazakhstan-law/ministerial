  title:
    rus: О внесении изменения и дополнений в приказ Ответственного секретаря Министерства экологии, геологии и природных ресурсов Республики Казахстан от 30 июля 2019 года № 4-П «Об утверждении Положения о Комитете лесного хозяйства и животного мира Министерства экологии, геологии и природных ресурсов Республики Казахстан»
    kaz: «Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің Орман шаруашылығы және жануарлар дүниесі комитетінің ережесін бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігі Жауапты хатшысының 2019 жылғы 30 шілдедегі № 4-ө бұйрығына өзгеріс пен толықтырулар енгізу туралы
