  code: '170402'
  requisite: Приказ Министра экологии, геологии и природных ресурсов Республики Казахстан от 1 июля 2022 года № 253-П. Утратил силу приказом Министра экологии и природных ресурсов Республики Казахстан от 24 февраля 2023 года № 65-П
  title:
    rus: О внесении изменений и дополнений в приказ Ответственного секретаря Министерства экологии, геологии и природных ресурсов Республики Казахстан от 30 июля 2019 года № 5-П «Об утверждении Положения республиканского государственного учреждения Комитет экологического регулирования и контроля Министерства экологии, геологии и природных ресурсов Республики Казахстан и его территориальных органов»
    kaz: «Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің Экологиялық реттеу және бақылау комитеті республикалық мемлекеттік мекемесінің және оның аумақтық органдарының ережесін бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігі Жауапты хатшысының 2019 жылғы 30 шілдедегі № 5-Ө бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/170402/rus
