act_code: '134001'
requisite: Приказ Ответственного секретаря Министерства экологии, геологии и природных ресурсов Республики Казахстан от 30 июля 2019 года № 5-П. Утратил силу приказом Министра экологии и природных ресурсов Республики Казахстан от 24 февраля 2023 года № 65-П.
title:
  rus: Об утверждении Положения республиканского государственного учреждения Комитет экологического регулирования и контроля Министерства экологии, геологии и природных ресурсов Республики Казахстан и его территориальных органов
  kaz: Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің Экологиялық реттеу және бақылау комитеті республикалық мемлекеттік мекемесінің және оның аумақтық органдарының ережесін бекіту туралы
