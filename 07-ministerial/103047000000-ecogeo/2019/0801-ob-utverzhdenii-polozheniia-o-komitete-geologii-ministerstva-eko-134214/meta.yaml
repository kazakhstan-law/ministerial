  title:
    rus: О внесении изменений и дополнения в приказ Ответственного секретаря Министерства экологии, геологии и природных ресурсов Республики Казахстан от 1 августа 2019 года № 7-П «Об утверждении Положения о Комитете геологии Министерства экологии, геологии и природных ресурсов Республики Казахстан»
    kaz: «Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің Геология комитеті туралы ережені бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің Жауапты хатшынысының 2019 жылғы 1 тамыздағы № 7-Ө бұйрығына өзгерістер мен толықтыру енгізу туралы
