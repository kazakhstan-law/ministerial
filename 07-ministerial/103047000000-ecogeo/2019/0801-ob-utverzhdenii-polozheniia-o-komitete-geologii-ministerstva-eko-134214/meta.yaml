    kaz: «Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің Геология комитеті туралы ережені бекіту туралы» Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің жауапты хатшысының 2019 жылғы 1 тамыздағы № 7-Ө бұйрығына өзгерістер енгізу туралы
