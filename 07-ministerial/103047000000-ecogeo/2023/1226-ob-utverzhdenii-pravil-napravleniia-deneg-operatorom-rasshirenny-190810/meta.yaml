  title:
    rus: О внесении изменения в приказ Министра экологии и природных ресурсов Республики Казахстан от 26 декабря 2023 года № 375 «Об утверждении Правил направления денег оператором расширенных обязательств производителей (импортеров), поступивших на его банковский счет от производителей и импортеров на организацию сбора, транспортировки, подготовки к повторному использованию, сортировки, обработки, переработки, обезвреживания и (или) утилизации за пределами Республики Казахстан отходов, образующихся после утраты потребительских свойств продукции (товаров), на которую (которые) распространяются расширенные обязательства производителей (импортеров), для которых на территории Республики Казахстан отсутствуют объекты по обезвреживанию, переработке и (или) утилизации, путем выплат»
    kaz: «Қазақстан Республикасының аумағында залалсыздандыру, қайта өңдеу және (немесе) кәдеге жарату жөніндегі объектілері жоқ, өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелерінің қолданылатын өнімнің (тауарлардың) тұтынушылық қасиеттері жоғалғаннан кейін түзілетін қалдықтарды Қазақстан Республикасының шегінен тысқары жерде жинауды, тасымалдауды, қайтадан пайдалануға дайындауды, сұрыптауды, өңдеуді, қайта өңдеуді, залалсыздандыруды және (немесе) кәдеге жаратуды ұйымдастыруға өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелері операторы өзінің банктік шотына кәдеге жарату төлемі түрінде келіп түскен ақшаны бағыттау қағидаларын бекіту туралы» Қазақстан Республикасы Экология және табиғи ресурстар министрінің 2023 жылғы 26 желтоқсандағы № 375 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/218754/rus
