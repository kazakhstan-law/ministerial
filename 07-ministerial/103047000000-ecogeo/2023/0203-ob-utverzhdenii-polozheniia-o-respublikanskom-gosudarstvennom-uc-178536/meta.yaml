title:
  rus: Об утверждении Положения о республиканском государственном учреждении «Комитет лесного хозяйства и животного мира Министерства экологии и природных ресурсов Республики Казахстан»
  kaz: Қазақстан Республикасы Экология және табиғи ресурстар министрлігінің «Орман шаруашылығы және жануарлар дүниесі комитеті» республикалық мемлекеттік мекемесінің ережесін бекіту туралы
