  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра экологии и природных ресурсов Республики Казахстан от 03 февраля 2023 года № 32-Ө «Об утверждении Положения о Республиканском государственном учреждении «Комитет лесного хозяйства и животного мира Министерства экологии и природных ресурсов Республики Казахстан»
    kaz: «Қазақстан Республикасы Экология және табиғи ресурстар министрлігінің «Орман шаруашылығы және жануарлар дүниесі комитеті» республикалық мемлекеттік мекемесінің ережесін бекіту туралы» Қазақстан Республикасы Экология және табиғи ресурстар министрінің міндетін атқарушының 2023 жылғы 3 ақпандағы № 32-Ө бұйрығына өзгерістер мен толықтырулар енгізу туралы
