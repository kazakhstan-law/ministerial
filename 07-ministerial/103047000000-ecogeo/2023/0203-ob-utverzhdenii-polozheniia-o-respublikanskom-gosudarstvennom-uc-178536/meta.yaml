  title:
    rus: О внесении изменения в приказ исполнящего обязанности Министра экологии и природных ресурсов Республики Казахстан от 3 февраля 2023 года № 32-Ө «Об утверждении Положения о республиканском государственном учреждении «Комитет лесного хозяйства и животного мира Министерства экологии и природных ресурсов Республики Казахстан»
    kaz: «Қазақстан Республикасы Экология және табиғи ресурстар министрлігінің «Орман шаруашылығы және жануарлар дүниесі комитеті» республикалық мемлекеттік мекемесінің ережесін бекіту туралы» Қазақстан Республикасы Экология және табиғи ресурстар министрі міндетін атқарушысының 2023 жылғы 3 ақпандағы № 32-Ө бұйрығына өзгеріс енгізу туралы
