  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра экологии и природных ресурсов Республики Казахстан от 30 марта 2023 года № 105 «Об утверждении Правил аккредитации специализированных организаций, осуществляющих ресурсные обследования»
    kaz: «Ресурстық зерттеп-қарауды жүзеге асыратын мамандандырылған ұйымдарды аккредиттеу қағидаларын бекіту туралы» Қазақстан Республикасы Экология және табиғи ресурстар министрінің міндетін атқарушының 2023 жылғы 30 наурыздағы № 105 бұйрығына өзгерістер енгізу туралы
