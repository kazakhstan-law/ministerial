  title:
    rus: О внесении изменений и дополнений в приказ Министра экологии и природных ресурсов Республики Казахстан от 27 ноября 2023 года № 332 «Об утверждении Правил направления денег оператором расширенных обязательств производителей (импортеров), поступивших на его банковский счет от производителей и импортеров на организацию сбора, транспортировки, подготовки к повторному использованию, сортировки, обработки, переработки, обезвреживания и (или) утилизации отходов, образующихся после утраты потребительских свойств продукции (товаров), на которую (которые) распространяются расширенные обязательства производителей (импортеров) путем выплат»
    kaz: Өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелері операторының өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелері қолданылатын өнімнің (тауарлардың) тұтынушылық қасиеттері жоғалғаннан кейін түзілетін қалдықтарды жинауды, тасымалдауды, қайтадан пайдалануға дайындауды, сұрыптауды, өңдеуді, қайта өңдеуді, залалсыздандыруды және (немесе) кәдеге жаратуды төлемдер жасау арқылы ұйымдастыруға өндірушілерден және импорттаушылардан келіп түскен ақшаны оның банктік шотына жіберу қағидаларын бекіту туралы» Қазақстан Республикасы Экология және табиғи ресурстар министрінің 2023 жылғы 27 қарашадағы № 332 бұйрығына өзгерістер мен толықтырулар енгізу туралы
