act_code: '216247'
requisite: Приказ Министра экологии и природных ресурсов Республики Казахстан от 29 октября 2025 года № 290. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 октября 2025 года № 37271
title:
  rus: О признании утратившим силу приказа Заместителя Премьер-Министра – Министра сельского хозяйства Республики Казахстан от 18 мая 2017 года № 204 «Об утверждении натуральных норм потребности для специализированной организации в авиационной технике, специальном транспорте, оборудовании средств связи, навигационном оборудовании и специальных средствах для проведения работ по охране животного мира и особо охраняемых природных территорий»
  kaz: «Мамандандырылған ұйым үшін жануарлар дүниесі мен ерекше қорғалатын табиғи аумақтарды қорғау жөніндегі жұмыстарды жүргізуге арналған авиациялық техникаға, арнайы көлікке, байланыс құралдары жабдығына, навиғациялық жабдықтар мен арнайы құралдарға қажеттіліктің заттай нормаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің 2017 жылғы 18 мамырдағы № 204 бұйрығының күшін жою туралы
