act_code: '213361'
requisite: Приказ и.о. Министра экологии и природных ресурсов Республики Казахстан от 14 августа 2025 года № 224. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 августа 2025 года № 36622
title:
  rus: Об утверждении Правил установления стоимости и предмета капитальных расходов, осуществляемых в рамках договора лизинга в сфере лесного хозяйства и животного мира, особо охраняемых природных территорий и развития государственной наблюдательной сети для гидрометеорологического мониторинга и мониторинга состояния окружающей среды
  kaz: Орман шаруашылығы және жануарлар дүниесі, ерекше қорғалатын табиғи аумақтар және гидрометеорологиялық мониторинг пен қоршаған ортаның жай-күйі мониторингісі үшін мемлекеттік бақылау желісін дамыту саласында лизинг шарты шеңберінде жүзеге асырылатын күрделі шығыстардың құнын және нысанын айқындау қағидаларын бекіту туралы
