act_code: '211876'
requisite: Приказ Министра экологии и природных ресурсов Республики Казахстан от 27 июня 2025 года № 175. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 июля 2025 года № 36373
title:
  rus: Об утверждении Правил осуществления платных видов деятельности по реализации товаров (работ, услуг) государственными учреждениями в сферах лесного хозяйства, особо охраняемых природных территорий, деньги от реализации которых остаются в их распоряжении, использования денег от реализации государственными учреждениями в сферах лесного хозяйства, особо охраняемых природных территорий товаров (работ, услуг), остающихся в их распоряжении
  kaz: Өткізуден түскен ақша өз иелігінде қалатын орман шаруашылығы, ерекше қорғалатын табиғи аумақтар салаларындағы мемлекеттік мекемелердің тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуі бойынша ақылы қызмет түрлерін жүзеге асыру, орман шаруашылығы, ерекше қорғалатын табиғи аумақтар салаларындағы мемлекеттік мекемелердің тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуінен түскен, өз иелігінде қалатын ақшаны пайдалану қағидаларын бекіту туралы
