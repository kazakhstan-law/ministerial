title:
  rus: Об утверждении Правил по установлению соответствия количества фасованной изготовителем или продавцом продукции в упаковках любого вида, а также завезенной импортером расфасованной продукции при ее реализации и продукции, отчуждаемой при совершении торговых операций, в целях государственного метрологического контроля
  kaz: Дайындаушы немесе сатушы өлшеп-ораған кез келген түрдегі қаптамадағы өнімнің, сондай-ақ өткізу кезіндегі импорттаушы әкелген өлшеніп-оралған өнімнің және сауда операцияларын жасау кезінде иеліктен шығарылатын өнім санының сәйкестігін мемлекеттік метрологиялық бақылау мақсатында анықтау жөніндегі тәртіпті айқындау қағидаларын бекіту туралы
