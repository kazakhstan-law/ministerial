  title:
    rus: О внесении изменений и дополнений в приказ Министра торговли и интеграции Республики Казахстан от 29 декабря 2021 года № 658-НҚ «Об утверждении положений Республиканского государственного учреждения «Комитет торговли Министерства торговли и интеграции Республики Казахстан» и его территориальных подразделений»
    kaz: «Қазақстан Республикасы Сауда және интеграция министрлігінің Сауда комитеті» республикалық мемлекеттік мекемесінің және оның аумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2021 жылғы 29 желтоқсандағы № 658-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы
