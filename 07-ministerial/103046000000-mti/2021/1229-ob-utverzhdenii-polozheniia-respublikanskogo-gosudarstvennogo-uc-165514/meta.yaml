act_code: '165514'
requisite: Приказ Министра торговли и интеграции Республики Казахстан от 29 декабря 2021 года № 658-НҚ
title:
  rus: Об утверждении положения республиканского государственного учреждения «Комитет торговли Министерства торговли и интеграции Республики Казахстан»
  kaz: «Қазақстан Республикасы Сауда және интеграция министрлігінің Сауда комитеті» республикалық мемлекеттік мекемесінің ережесін бекіту туралы
