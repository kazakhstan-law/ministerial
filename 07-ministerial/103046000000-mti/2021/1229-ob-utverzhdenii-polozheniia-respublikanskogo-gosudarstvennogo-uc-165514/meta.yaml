  title:
    rus: О внесении изменения в приказ Министра торговли и интеграции Республики Казахстан от 29 декабря 2021 года № 658-НҚ «Об утверждении положения республиканского государственного учреждения «Комитет торговли Министерства торговли и интеграции Республики Казахстан»
    kaz: «Қазақстан Республикасы Сауда және интеграция министрлігінің Сауда комитеті» республикалық мемлекеттік мекемесінің ережесін бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2021 жылғы 29 желтоқсандағы № 658-НҚ бұйрығына өзгеріс енгізу туралы
