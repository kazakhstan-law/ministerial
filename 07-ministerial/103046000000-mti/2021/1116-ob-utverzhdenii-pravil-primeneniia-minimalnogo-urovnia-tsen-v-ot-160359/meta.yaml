  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра торговли и интеграции Республики Казахстан от 16 ноября 2021 года № 594-НҚ «Об утверждении Правил применения минимального уровня цен в отношении отдельных видов товаров, импортируемых с территории государств-членов Евразийского экономического союза на территорию Республики Казахстан для определения стоимости приобретенных товаров»
    kaz: «Сатып алынған тауарлардың құнын айқындау үшін Еуразиялық экономикалық одаққа мүше мемлекеттердің аумағынан Қазақстан Республикасының аумағына импортталатын тауарлардың жекелеген түрлеріне қатысты бағалардың ең төменгі деңгейін қолдану қағидаларын бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің міндетін атқарушының 2021 жылғы 16 қарашадағы № 594-НҚ бұйрығына өзгерістер енгізу туралы
