act_code: '160359'
requisite: Приказ и.о. Министра торговли и интеграции Республики Казахстан от 16 ноября 2021 года № 594-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 ноября 2021 года № 25228. Действовал до 31 декабря 2025 года включительно в соответствии с пунктом 4 настоящего приказа
title:
  rus: Об утверждении Правил применения минимального уровня цен в отношении отдельных видов товаров, импортируемых с территории государств-членов Евразийского экономического союза на территорию Республики Казахстан для определения стоимости приобретенных товаров
  kaz: Сатып алынған тауарлардың құнын айқындау үшін Еуразиялық экономикалық одаққа мүше мемлекеттердің аумағынан Қазақстан Республикасының аумағына импортталатын тауарлардың жекелеген түрлеріне қатысты бағалардың ең төменгі деңгейін қолдану қағидаларын бекіту туралы
