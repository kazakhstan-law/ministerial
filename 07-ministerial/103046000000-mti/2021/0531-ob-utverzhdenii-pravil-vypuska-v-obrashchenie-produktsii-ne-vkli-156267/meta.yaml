act_code: '156267'
requisite: Приказ Министра торговли и интеграции Республики Казахстан от 31 мая 2021 года № 380-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 июня 2021 года № 22903
title:
  rus: Об утверждении Правил выпуска в обращение продукции, не включенной в Единый перечень, включенной в Единый перечень, но в отношении которой не приняты или не введены в действие технические регламенты, а также перечня продукции, в отношении которой принимается декларация об общей безопасности, формы декларации об общей безопасности
  kaz: Бірыңғай тізбеге енгізілмеген, сондай-ақ Бірыңғай тізбеге енгізілген, бірақ өзіне қатысты техникалық регламенттер қабылданбаған немесе қолданысқа енгізілмеген өнімді айналысқа шығару қағидаларын, сондай-ақ өзіне қатысты жалпы қауіпсіздік туралы декларация қабылданатын өнім тізбесін, жалпы қауіпсіздік туралы декларацияның нысанын бекіту туралы
