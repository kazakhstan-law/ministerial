  title:
    rus: О внесении изменения в приказ Министра торговли и интеграции Республики Казахстан от 31 мая 2021 года № 380-НҚ «Об утверждении Правил выпуска в обращение продукции, не включенной в Единый перечень, включенной в Единый перечень, но в отношении которой не приняты или не введены в действие технические регламенты, а также перечня продукции, в отношении которой принимается декларация об общей безопасности, формы декларации об общей безопасности»
    kaz: «Бірыңғай тізбеге енгізілмеген, сондай-ақ Бірыңғай тізбеге енгізілген, бірақ өзіне қатысты техникалық регламенттер қабылданбаған немесе қолданысқа енгізілмеген өнімді айналысқа шығару қағидаларын, сондай-ақ өзіне қатысты жалпы қауіпсіздік туралы декларация қабылданатын өнім тізбесін, жалпы қауіпсіздік туралы декларацияның нысанын бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2021 жылғы 31 мамырдағы № 380-НҚ бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/171568/rus
