  title:
    rus: О внесении изменений и дополнений в приказ Министра по инвестициям и развитию Республики Казахстан от 27 декабря 2018 года № 932 «Об утверждении Правил разработки, метрологической аттестации, утверждения и регистрации в реестре государственной системы обеспечения единства измерений методик выполнения измерений и референтных методик выполнения измерений и оказания государственной услуги «Регистрация в реестре Государственной системы измерений Республики Казахстан методики выполнения измерений, разработанной и аттестованной в странах Содружества Независимых Государств» и изменения в приказ исполняющего обязанности Министра торговли и интеграции Республики Казахстан от 29 июня 2021 года № 433-НҚ «Об утверждении Правил оценки соответствия»
    kaz: «Өлшемдерді орындау әдістемелерін және өлшемдерді орындаудың референттік әдістемелерін әзірлеу, метрологиялық аттестаттау, бекіту және өлшем бірлігін қамтамасыз ету мемлекеттік жүйесінің тізілімінде тіркеу және «Қазақстан Республикасының Мемлекеттік өлшемдер жүйесі тізілімінде Тәуелсіз Мемлекеттер Достастығының елдерінде әзірленген және аттестатталған өлшемдерді орындау әдістемесін тіркеу» мемлекеттік қызметті көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 27 желтоқсандағы № 932 бұйрығына өзгерістер және толықтырулар және «Сәйкестікті бағалау қағидаларын бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің міндетін атқарушысының 2021 жылғы 29 маусымдағы № 433-НҚ бұйрығына өзгеріс енгізу туралы
