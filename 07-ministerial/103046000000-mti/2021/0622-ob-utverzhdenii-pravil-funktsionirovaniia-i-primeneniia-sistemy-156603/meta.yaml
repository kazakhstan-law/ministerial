title:
  rus: Об утверждении Правил функционирования и применения системы добровольной сертификации, а также ведения реестра зарегистрированных систем добровольной сертификации и предоставления сведений, содержащихся в указанном реестре
  kaz: Ерікті түрде сертификаттау жүйесінің жұмыс істеу және қолданылу, сондай-ақ тіркелген ерікті түрде сертификаттау жүйелерінің тізілімін жүргізу және көрсетілген тізілімдегі мәліметтерді беру қағидаларын бекіту туралы
