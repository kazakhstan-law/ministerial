  title:
    rus: О внесении изменений и дополнений в приказ Министра торговли и интеграции Республики Казахстан от 8 июня 2021 года № 399-НҚ «Об утверждении разрешительных требований к экспертам-аудиторам по подтверждению соответствия, перечня документов, подтверждающих соответствие им, а также правил аттестации, продления действия аттестатов экспертов-аудиторов по подтверждению соответствия и оказания государственной услуги «Аттестация эксперта-аудитора по подтверждению соответствия»
    kaz: «Сәйкестікті растау жөніндегі сарапшы-аудиторларға қойылатын рұқсат беру талаптарын, оларға сәйкестікті растайтын құжаттар тізбесін, сондай-ақ сәйкестікті растау жөніндегі сарапшы-аудиторларды аттестаттау, аттестаттарының қолданысын ұзарту және «Сәйкестікті растау жөніндегі сарапшы-аудиторды аттестаттау» мемлекеттік қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2021 жылғы 8 маусымдағы № 399-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы
