  title:
    rus: О внесении изменений и дополнений в приказ Министра торговли и интеграции Республики Казахстан от 13 июля 2021 года № 454-НҚ «Об утверждении Правил по определению страны происхождения товара, статуса товара Евразийского экономического союза или иностранного товара, выдаче сертификата о происхождении товара и отмене его действия, установлении форм сертификата по определению страны происхождения товара»
    kaz: «Тауардың шығарылған елін, Еуразиялық экономикалық одақ тауарының немесе шетел тауарының мәртебесін айқындау, тауардың шығарылуы туралы сертификат беру және оның күшін жою, тауардың шығарылған елін айқындау жөніндегі сертификаттың нысанын белгілеу жөніндегі қағидаларды бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2021 жылғы 13 шілдедегі № 454-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/204950/rus
