  title:
    rus: О внесении изменения в приказ Министра торговли и интеграции Республики Казахстан от 13 июля 2021 года № 454-НҚ «Об утверждении Правил по определению страны происхождения товара, статуса товара Евразийского экономического союза или иностранного товара, выдаче сертификата о происхождении товара и отмене его действия, установлении форм сертификата по определению страны происхождения товара» и об отмене приказа Министра торговли и интеграции Республики Казахстан от 23 февраля 2024 года 108-НҚ «О внесении изменения в Приказ Министра торговли и интеграции Республики Казахстан от 13 июля 2021 года № 454-НҚ «Об утверждении Правил по определению страны происхождения товара, статуса товара Евразийского экономического союза или иностранного товара, выдаче сертификата о происхождении товара и отмене его действия, установлении форм сертификата по определению страны происхождения товара»
    kaz: «Тауардың шығарылған елін, Еуразиялық экономикалық одақ тауарының немесе шетел тауарының мәртебесін айқындау, тауардың шығарылуы туралы сертификат беру және оның күшін жою, тауардың шығарылған елін айқындау жөніндегі сертификаттың нысанын белгілеу жөніндегі қағидаларды бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2021 жылғы 13 шілдедегі № 454-НҚ бұйрығына өзгеріс енгізу және «Тауардың шығарылған елін, Еуразиялық экономикалық одақ тауарының немесе шетел тауарының мәртебесін айқындау, тауардың шығарылуы туралы сертификат беру және оның күшін жою, тауардың шығарылған елін айқындау жөніндегі сертификаттың нысанын белгілеу жөніндегі қағидаларды бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2021 жылғы 13 шілдедегі № 454-НҚ бұйрығына өзгеріс енгізу туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2024 жылғы 23 ақпандағы № 108-НҚ бұйрығын жою туралы
