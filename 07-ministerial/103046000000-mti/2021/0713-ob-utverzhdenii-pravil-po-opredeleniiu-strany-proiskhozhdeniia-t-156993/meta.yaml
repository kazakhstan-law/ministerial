title:
  rus: Об утверждении Правил по определению страны происхождения товаров, выдаче сертификата о происхождении товара и отмене его действия, установлению форм сертификата о происхождении товаров
  kaz: Тауарларды шығарған елді айқындау, тауардың шығу тегі туралы сертификат беру және оның қолданысының күшін жою, тауарлардың шығу тегі туралы сертификаттың нысандарын белгілеу жөніндегі қағидаларды бекіту туралы
