  title:
    rus: О внесении изменения в приказ Министра торговли и интеграции Республики Казахстан от 1 июня 2021 года № 384-НҚ «Об утверждении Правил принятия решений о включении или исключении органов по оценке соответствия в национальную часть (из национальной части) единого реестра органов по оценке соответствия Евразийского экономического союза»
    kaz: «Сәйкестікті бағалау жөніндегі органдарды Еуразиялық экономикалық одақтың сәйкестікті бағалау жөніндегі органдарының бірыңғай тізілімінің ұлттық бөлігіне (ұлттық бөлігінен) енгізу немесе алып тастау туралы шешімдер қабылдау қағидаларын бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2021 жылғы 1 маусымдағы № 384-НҚ бұйрығына өзгеріс енгізу туралы
