act_code: '156895'
requisite: Приказ Министра торговли и интеграции Республики Казахстан от 1 июля 2021 года № 440-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 июля 2021 года № 23412. Утратил силу приказом Министра торговли и интеграции Республики Казахстан от 15 июля 2025 года № 210-НҚ (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении разрешительных требований к экспертам-аудиторам по определению страны происхождения товара, статуса товара Евразийского экономического союза или иностранного товара, перечня документов, подтверждающих соответствие им, а также Правил аттестации, продления действия аттестатов экспертов-аудиторов по определению страны происхождения товара, статуса товара Евразийского экономического союза или иностранного товара и оказания государственной услуги «Аттестация эксперта-аудитора по определению страны происхождения товара, статуса товара Евразийского экономического союза или иностранного товара»
  kaz: Тауардың шығарылған елін, Еуразиялық экономикалық одақ тауарының немесе шетел тауарының мәртебесін айқындау жөніндегі сарапшы-аудиторларға қойылатын рұқсат беру талаптарын, оларға сәйкестікті растайтын құжаттардың тізбесін, сондай-ақ Тауардың шығарылған елін, Еуразиялық экономикалық одақ тауарының немесе шетел тауарының мәртебесін айқындау жөніндегі сарапшы-аудиторларды аттестаттау, олардың қолданысын ұзарту және «Тауардың шығарылған елін, Еуразиялық экономикалық одақ тауарының немесе шетел тауарының мәртебесін айқындау жөніндегі сарапшы-аудиторды аттестаттау» мемлекеттік қызметін көрсету қағидаларын бекіту туралы
