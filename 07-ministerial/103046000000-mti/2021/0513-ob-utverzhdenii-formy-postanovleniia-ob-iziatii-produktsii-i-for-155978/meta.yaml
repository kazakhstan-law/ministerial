  title:
    rus: О внесении изменений и дополнений в некоторые приказы и признании утратившим силу приказ Министра торговли и интеграции Республики Казахстан от 13 мая 2021 года № 333-НҚ «Об утверждении формы постановления об изъятии продукции и формы постановления о запрете выпуска в обращение продукции»
    kaz: Кейбір бұйрықтарға өзгерістер мен толықтырулар енгізу және «Өнімді алып қою туралы қаулының нысанын және өнімді айналысқа шығаруға тыйым салу туралы қаулының нысанын бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2021 жылғы 13 мамырдағы № 333-НҚ бұйрығының күшін жою туралы
