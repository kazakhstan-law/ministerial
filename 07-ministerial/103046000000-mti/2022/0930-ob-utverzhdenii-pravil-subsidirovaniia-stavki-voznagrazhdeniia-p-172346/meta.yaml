  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра - Министра торговли и интеграции Республики Казахстан от 30 сентября 2022 года № 389-НҚ «Об утверждении Правил субсидирования ставки вознаграждения по выдаваемым кредитам и совершаемым лизинговым сделкам банками второго уровня, Банком Развития Казахстана, иными юридическими лицами, осуществляющими лизинговую деятельность, зарубежным покупателям отечественных высокотехнологичных товаров и услуг обрабатывающей промышленности, которые подлежат страхованию со стороны Экспортно-кредитного агентства Казахстана, с учетом принятых международных обязательств, перечня отечественных высокотехнологичных товаров и услуг обрабатывающей промышленности для целей субсидирования ставки вознаграждения по выдаваемым кредитам и совершаемым лизинговым сделкам банками второго уровня, Банком Развития Казахстана, иными юридическими лицами, осуществляющими лизинговую деятельность, зарубежным покупателям отечественных высокотехнологичных товаров и услуг обрабатывающей промышленности, которые подлежат страхованию со стороны Экспортно-кредитного агентства Казахстана»
    kaz: «Қабылданған халықаралық міндеттемелерді ескере отырып, Қазақстанның Экспорттық-кредиттік агенттігі тарапынан сақтандырылуға жататын өңдеу өнеркәсібінің отандық жоғары технологиялық тауарлары мен көрсетілетін қызметтерін шетелдік сатып алушыларға екінші деңгейдегі банктер, Қазақстанның Даму Банкі, лизингтік қызметті жүзеге асыратын өзге де заңды тұлғалар беретін кредиттер және жасайтын лизингтік мәмілелер бойынша сыйақы мөлшерлемесін субсидиялау қағидаларын, Қазақстанның Экспорттық-кредиттік агенттігі тарапынан сақтандырылуға жататын өңдеу өнеркәсібінің отандық жоғары технологиялық тауарлары мен көрсетілетін қызметтерін шетелдік сатып алушыларға екінші деңгейдегі банктер, Қазақстанның Даму Банкі, лизингтік қызметті жүзеге асыратын өзге де заңды тұлғалар беретін кредиттер және жасайтын лизингтік мәмілелер бойынша сыйақы мөлшерлемесін субсидиялау мақсаттары үшін өңдеу өнеркәсібінің отандық жоғары технологиялық тауарлары мен көрсетілетін қызметтерінің тізбесін бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Сауда және интеграция министрінің 2022 жылғы 30 қыркүйектегі № 389-НҚ бұйрығына өзгерістер енгізу туралы
