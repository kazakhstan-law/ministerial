act_code: '172346'
requisite: Приказ Заместителя Премьер-Министра - Министра торговли и интеграции Республики Казахстан от 30 сентября 2022 года № 389-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 сентября 2022 года № 29930
title:
  rus: Об утверждении Правил субсидирования ставки вознаграждения по выдаваемым кредитам и совершаемым лизинговым сделкам банками второго уровня, Банком Развития Казахстана, иными юридическими лицами, осуществляющими лизинговую деятельность, зарубежным покупателям высокотехнологичных товаров и услуг казахстанского происхождения обрабатывающей промышленности, которые подлежат страхованию со стороны Экспортно-кредитного агентства Казахстана, с учетом принятых международных обязательств, перечня высокотехнологичных товаров и услуг казахстанского происхождения обрабатывающей промышленности для целей субсидирования ставки вознаграждения по выдаваемым кредитам и совершаемым лизинговым сделкам банками второго уровня, Банком Развития Казахстана, иными юридическими лицами, осуществляющими лизинговую деятельность, зарубежным покупателям высокотехнологичных товаров и услуг казахстанского происхождения обрабатывающей промышленности, которые подлежат страхованию со стороны Экспортно-кредитного агентства Казахстана
  kaz: Қабылданған халықаралық міндеттемелерді ескере отырып, Қазақстанның Экспорттық-кредиттік агенттігі тарапынан сақтандырылуға жататын өңдеу өнеркәсібінің Қазақстанда шығарылған жоғары технологиялық тауарларын және көрсетілетін қызметтерін шетелдік сатып алушыларға екінші деңгейдегі банктер, Қазақстанның Даму Банкі, лизингтік қызметті жүзеге асыратын өзге де заңды тұлғалар беретін кредиттер және жасайтын лизингтік мәмілелер бойынша сыйақы мөлшерлемесін субсидиялау қағидаларын, Қазақстанның Экспорттық-кредиттік агенттігі тарапынан сақтандырылуға жататын өңдеу өнеркәсібінің Қазақстанда шығарылған жоғары технологиялық тауарларын және көрсетілетін қызметтерін шетелдік сатып алушыларға екінші деңгейдегі банктер, Қазақстанның Даму Банкі, лизингтік қызметті жүзеге асыратын өзге де заңды тұлғалар беретін кредиттер және жасайтын лизингтік мәмілелер бойынша сыйақы мөлшерлемесін субсидиялау мақсаттары үшін өңдеу өнеркәсібінің Қазақстанда шығарылған жоғары технологиялық тауарларын және көрсетілетін қызметтерінің тізбесін бекіту туралы
