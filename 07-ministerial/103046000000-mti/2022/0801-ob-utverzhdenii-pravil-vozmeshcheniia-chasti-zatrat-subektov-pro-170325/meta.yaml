  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра торговли и интеграции Республики Казахстан от 1 августа 2022 года № 314-НҚ «Об утверждении Правил возмещения части затрат субъектов промышленно-инновационной деятельности по продвижению товаров и услуг казахстанского происхождения обрабатывающей промышленности, а также информационно-коммуникационных услуг на внешние рынки в рамках принятых международных обязательств, перечня товаров и услуг казахстанского происхождения обрабатывающей промышленности, а также информационно-коммуникационных услуг, по которым частично возмещаются затраты по их продвижению на внешние рынки»
    kaz: «Қабылданған халықаралық міндеттемелер шеңберінде өңдеуші өнеркәсіптің Қазақстанда шығарылған тауарлары мен көрсетілетін қызметтерін, сондай-ақ ақпараттық-коммуникациялық көрсетілетін қызметтерді сыртқы нарықтарға ілгерілету бойынша өнеркәсіптік-инновациялық қызмет субъектілері шығындарының бір бөлігін өтеу қағидаларын, өңдеуші өнеркәсіптің Қазақстанда шығарылған тауарлары мен көрсетілетін қызметтерінің, сондай-ақ оларды сыртқы нарықтарға ілгерілету бойынша шығындары ішінара өтелетін ақпараттық-коммуникациялық көрсетілетін қызметтердің тізбесін бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің м.а. 2022 жылғы 1 тамыздағы № 314-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/224055/rus
