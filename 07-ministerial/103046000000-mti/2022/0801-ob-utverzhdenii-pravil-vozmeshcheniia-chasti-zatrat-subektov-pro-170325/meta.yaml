  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра торговли и интеграции Республики Казахстан от 1 августа 2022 года № 314-НҚ «Об утверждении Правил возмещения части затрат субъектов промышленно-инновационной деятельности по продвижению отечественных товаров и услуг обрабатывающей промышленности, а также информационно-коммуникационных услуг на внешние рынки в рамках принятых международных обязательств, перечня отечественных товаров и услуг обрабатывающей промышленности, а также информационно-коммуникационных услуг, по которым частично возмещаются затраты по их продвижению на внешние рынки»
    kaz: «Қабылданған халықаралық міндеттемелер шеңберінде өңдеуші өнеркәсіптің отандық тауарлары мен көрсетілетін қызметтерін, сондай-ақ ақпараттық-коммуникациялық көрсетілетін қызметтерді сыртқы нарықтарға ілгерілету бойынша өнеркәсіптік-инновациялық қызмет субъектілері шығындарының бір бөлігін өтеу қағидаларын, өңдеуші өнеркәсіптің отандық тауарлары мен көрсетілетін қызметтерінің, сондай-ақ оларды сыртқы нарықтарға ілгерілету бойынша шығындары ішінара өтелетін ақпараттық-коммуникациялық көрсетілетін қызметтердің тізбесін бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің міндетін атқарушының 2022 жылғы 1 тамыздағы № 314-НҚ бұйрығына өзгерістер енгізу туралы»
