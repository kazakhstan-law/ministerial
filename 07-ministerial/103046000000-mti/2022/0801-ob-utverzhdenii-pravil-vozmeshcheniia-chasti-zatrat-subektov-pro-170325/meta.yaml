act_code: '170325'
requisite: Приказ и.о. Министра торговли и интеграции Республики Казахстан от 1 августа 2022 года № 314-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 августа 2022 года № 28994
title:
  rus: Об утверждении Правил возмещения части затрат субъектов промышленно-инновационной деятельности по продвижению товаров и услуг казахстанского происхождения обрабатывающей промышленности, а также информационно-коммуникационных услуг на внешние рынки в рамках принятых международных обязательств, перечня товаров и услуг казахстанского происхождения обрабатывающей промышленности, а также информационно-коммуникационных услуг, по которым частично возмещаются затраты по их продвижению на внешние рынки.
  kaz: Қабылданған халықаралық міндеттемелер шеңберінде өңдеуші өнеркәсіптің Қазақстанда шығарылған тауарлары мен көрсетілетін қызметтерін, сондай-ақ ақпараттық-коммуникациялық көрсетілетін қызметтерді сыртқы нарықтарға ілгерілету бойынша өнеркәсіптік-инновациялық қызмет субъектілері шығындарының бір бөлігін өтеу қағидаларын, өңдеуші өнеркәсіптің Қазақстанда шығарылған тауарлары мен көрсетілетін қызметтерінің, сондай-ақ оларды сыртқы нарықтарға ілгерілету бойынша шығындары ішінара өтелетін ақпараттық-коммуникациялық көрсетілетін қызметтердің тізбесін бекіту туралы
