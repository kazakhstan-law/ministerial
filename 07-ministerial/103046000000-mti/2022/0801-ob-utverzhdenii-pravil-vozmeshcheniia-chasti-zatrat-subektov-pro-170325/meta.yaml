requisite: Приказ и.о. Министра торговли и интеграции Республики Казахстан от 1 августа 2022 года № 314-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 августа 2022 года № 28994
title:
  rus: Об утверждении Правил возмещения части затрат субъектов промышленно-инновационной деятельности по продвижению товаров и услуг казахстанского происхождения обрабатывающей промышленности, а также цифровых услуг на внешние рынки в рамках принятых международных обязательств
  kaz: Қабылданған халықаралық міндеттемелер шеңберінде өңдеуші өнеркәсіптің Қазақстанда шығарылған тауарлары мен көрсетілетін қызметтерін, сондай-ақ цифрлық көрсетілетін қызметтерді сыртқы нарықтарға ілгерілету бойынша өнеркәсіптік-инновациялық қызмет субъектілері шығындарының бір бөлігін өтеу қағидаларын бекіту туралы»;
