requisite: Приказ Министра торговли и интеграции Республики Казахстан от 10 февраля 2020 года № 18-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 февраля 2020 года № 20041. Утратил силу приказом Министра торговли и интеграции Республики Казахстан от 15 октября 2025 года № 297-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства торговли и интеграции Республики Казахстан, его ведомств и их территориальных подразделений
  kaz: Қазақстан Республикасы Сауда және интеграция министрлігінің, оның ведомстволары мен олардың аумақтық бөлімшелерінің «Б» корпусының мемлекеттік әкімшілік қызметшілерінің жұмысын бағалау әдістемесін бекіту туралы
