  title:
    rus: О внесении изменения в приказ Министра торговли и интеграции Республики Казахстан от 10 февраля 2020 года № 18-НҚ «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства торговли и интеграции Республики Казахстан, его ведомств и их территориальных подразделений»
    kaz: «Қазақстан Республикасы Сауда және интеграция министрлігінің, оның ведомстволары мен олардың аумақтық бөлімшелерінің «Б» корпусының мемлекеттік әкімшілік қызметшілерінің жұмысын бағалау әдістемесін бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2020 жылғы 10 ақпандағы № 18-НҚ бұйрығына өзгеріс енгізу туралы
