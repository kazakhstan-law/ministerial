title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача лицензии на осуществление деятельности по изготовлению Государственного флага Республики Казахстан и Государственного герба Республики Казахстан»
  kaz: «Қазақстан Республикасының Мемлекеттік Туын және Қазақстан Республикасының Мемлекеттік Елтаңбасын жасау жөніндегі қызметті жүзеге асыруға лицензия беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы
