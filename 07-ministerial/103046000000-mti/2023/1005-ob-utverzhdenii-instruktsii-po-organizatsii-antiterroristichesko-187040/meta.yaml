requisite: Приказ Министра торговли и интеграции Республики Казахстан от 5 октября 2023 года № 366-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 октября 2023 года № 33534
title:
  rus: Об утверждении инструкции по организации антитеррористической защиты объектов Министерства торговли и интеграции Республики Казахстан, уязвимых в террористическом отношении, и объектов внутренней торговли, уязвимых в террористическом отношении
  kaz: Қазақстан Республикасы Сауда және интеграция министрлігінің террористік тұрғыдан осал объектілерін және террористік тұрғыдан осал ішкі сауда объектілерін терроризмге қарсы қорғауды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
