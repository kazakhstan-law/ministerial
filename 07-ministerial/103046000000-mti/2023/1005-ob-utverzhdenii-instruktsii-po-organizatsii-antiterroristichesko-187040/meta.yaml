  title:
    rus: О внесении изменений в приказ Министра торговли и интеграции Республики Казахстан от 5 октября 2023 года № 366-НҚ «Об утверждении инструкции по организации антитеррористической защиты объектов Министерства торговли и интеграции Республики Казахстан, уязвимых в террористическом отношении, и объектов внутренней торговли, уязвимых в террористическом отношении»
    kaz: «Қазақстан Республикасы Сауда және интеграция министрлігінің террористік тұрғыдан осал объектілерін және ішкі сауда саласындағы қызметті жүзеге асыратын террористік тұрғыдан осал объектілерді терроризмге қарсы қорғауды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2023 жылғы 5 қазандағы № 366-НҚ бұйрығына өзгерістер енгізу туралы
