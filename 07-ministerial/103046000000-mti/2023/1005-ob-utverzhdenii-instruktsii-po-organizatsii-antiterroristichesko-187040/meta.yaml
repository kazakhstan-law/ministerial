  title:
    rus: О внесении изменений и дополнений в приказ Министра торговли и интеграции Республики Казахстан от 5 октября 2023 года № 366-НҚ «Об утверждении инструкции по организации антитеррористической защиты объектов Министерства торговли и интеграции Республики Казахстан, уязвимых в террористическом отношении, и объектов внутренней торговли, уязвимых в террористическом отношении»
    kaz: «Қазақстан Республикасы Сауда және интеграция министрлігінің террористік тұрғыдан осал объектілерін және террористік тұрғыдан осал ішкі сауда объектілерін терроризмге қарсы қорғауды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2023 жылғы 5 қазандағы № 366-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы
