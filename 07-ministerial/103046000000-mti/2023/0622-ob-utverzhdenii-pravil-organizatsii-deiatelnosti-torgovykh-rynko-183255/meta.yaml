  title:
    rus: О внесении изменений и дополнений в приказы исполняющего обязанности Министра национальной экономики Республики Казахстан от 27 марта 2015 года № 264 «Об утверждении Правил внутренней торговли» и исполняющего обязанности Министра торговли и интеграции Республики Казахстан от 22 июня 2023 года № 242-НҚ «Об утверждении Правил организации деятельности торговых рынков, требований к содержанию территории, оборудованию и оснащению торгового рынка»
    kaz: «Ішкі сауда қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 27 наурыздағы № 264 бұйрығына және «Сауда базарларының қызметін ұйымдастыру қағидаларын, сауда базарының аумағын күтіп-ұстауға, оны жабдықтауға және жарақтандыруға қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің міндетін атқарушының 2023 жылғы 22 маусымдағы № 242-НҚ бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/214797/rus
