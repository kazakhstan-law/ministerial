act_code: '186134'
requisite: Приказ Министра торговли и интеграции Республики Казахстан от 12 сентября 2023 года № 337-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 сентября 2023 года № 33414
title:
  rus: О признании утратившим силу приказа Заместителя Премьер-Министра - Министра торговли и интеграции Республики Казахстан от 3 ноября 2022 года № 421-НҚ «Об утверждении типовых квалификационных характеристик должностей руководителей организации в сфере регулирования торговой деятельности»
  kaz: «Сауда қызметін реттеу саласындағы ұйымның басшылары лауазымдарының үлгілік біліктілік сипаттамаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Сауда және интеграция министрінің 2022 жылғы 3 қарашадағы № 421-НҚ бұйрығының күшін жою туралы
