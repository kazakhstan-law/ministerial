  title:
    rus: О внесении изменения в приказ Министра торговли и интеграции Республики Казахстан от 29 марта 2024 года № 160-НҚ «Об утверждении Правил формирования системы управления рисками и внутреннего контроля, а также формирования резервов и проведения по ним актуарных расчетов для Экспортно-кредитного агентства Казахстана»
    kaz: «Қазақстанның Экспорттық-кредиттік агенттік үшін тәуекелдерді басқару және ішкі бақылау жүйесін қалыптастыру, сондай-ақ резервтер қалыптастыру және олар бойынша актуарлық есеп-қисаптар жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2024 жылғы 29 наурыздағы № 160-НҚ бұйрығына өзгеріс енгізу туралы
