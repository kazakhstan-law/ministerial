act_code: '195094'
requisite: Приказ Министра торговли и интеграции Республики Казахстан от 29 марта 2024 года № 160-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 апреля 2024 года № 34206
title:
  rus: Об утверждении Правил формирования системы управления рисками и внутреннего контроля, а также формирования резервов и проведения по ним актуарных расчетов для Экспортно-кредитного агентства Казахстана
  kaz: «Қазақстанның экспорттық-кредиттік агенттігі үшін тәуекелдерді басқару және ішкі бақылау жүйесін қалыптастыру, сондай-ақ резервтер қалыптастыру және олар бойынша актуарлық есеп-қисаптап жүргізу қағидаларын бекіту туралы»
