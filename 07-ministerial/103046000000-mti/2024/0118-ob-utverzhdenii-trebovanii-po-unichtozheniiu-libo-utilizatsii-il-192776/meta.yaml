act_code: '192776'
requisite: Приказ Министра торговли и интеграции Республики Казахстан от 18 января 2024 года № 44-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 января 2024 года № 33924
title:
  rus: Об утверждении требований по уничтожению либо утилизации или переработке, или обратному вывозу за пределы Республики Казахстан изъятой продукции, не подлежащей применению в хозяйственной и иной деятельности, не соответствующей требованиям технических регламентов и представляющей угрозу правам и законным интересам физических и юридических лиц, жизни и здоровью человека, окружающей среде
  kaz: Техникалық регламенттердің талаптарына сәйкес келмейтін, жеке және заңды тұлғалардың құқықтары мен заңды мүдделеріне, адамның өмірі мен денсаулығына, қоршаған ортаға қауіп төндіретін, шаруашылық және өзге де қызметте қолдануға жатпайтын, алып қойылған өнімді жою не кәдеге жарату немесе қайта өңдеу немесе Қазақстан Республикасының шегінен тыс жерге кері әкету жөніндегі талаптарды бекіту туралы
