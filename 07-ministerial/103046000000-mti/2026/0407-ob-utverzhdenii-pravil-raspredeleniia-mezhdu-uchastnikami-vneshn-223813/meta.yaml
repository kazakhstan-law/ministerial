act_code: '223813'
requisite: Приказ Министра торговли и интеграции Республики Казахстан от 7 апреля 2026 года № 162-НҚ
title:
  rus: Об утверждении Правил распределения между участниками внешнеторговой деятельности количественных ограничений (квот) на ввоз графитированных электродов диаметром более 520 мм, но не более 650 мм, или иного поперечного сечение площадью более 2700 см², но не более 3300 см², происходящих из Китайской Народной Республики, без уплаты антидемпинговой пошлины
  kaz: Сыртқы сауда қызметіне қатысушылар арасында демпингке қарсы баж төлемей Қытай Халық Республикасынан шыққан диаметрі 520 мм-ден асатын, бірақ 650 мм-ден аспайтын, немесе өзге көлденең қимасының ауданы 2700 см²-ден асатын, бірақ 3300 см²-ден аспайтын графиттелген электродтарды әкелуге сан жағынан шектеулерді (квоталарды) бөлу қағидаларын бекіту туралы
