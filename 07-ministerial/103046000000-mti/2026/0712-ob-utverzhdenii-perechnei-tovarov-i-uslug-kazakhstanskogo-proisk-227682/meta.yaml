title:
  rus: Об утверждении перечней товаров и услуг казахстанского происхождения обрабатывающей промышленности, а также цифровых услуг казахстанского происхождения, по которым частично возмещаются затраты по их продвижению на внешние рынки
  kaz: Сыртқы нарықтарға ілгерілету бойынша шығындары ішінара өтелетін өңдеу өнеркәсібінің Қазақстанда шығарылған тауарлары мен көрсетілетін қызметтерінің, сондай-ақ Қазақстанда шығарылған цифрлық көрсетілетін қызметтердің тізбелерін бекіту туралы
