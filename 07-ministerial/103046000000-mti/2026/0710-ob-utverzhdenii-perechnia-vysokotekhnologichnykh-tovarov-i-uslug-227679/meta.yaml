act_code: '227679'
requisite: Приказ Министра торговли и интеграции Республики Казахстан от 10 июля 2026 года № 218-НҚ
title:
  rus: Об утверждении Перечня высокотехнологичных товаров и услуг казахстанского происхождения обрабатывающей промышленности для целей субсидирования ставки вознаграждения по выдаваемым кредитам и совершаемым лизинговым сделкам банками второго уровня, Банком Развития Казахстана, иными юридическими лицами, осуществляющими лизинговую деятельность, зарубежным покупателям высокотехнологичных товаров и услуг казахстанского происхождения обрабатывающей промышленности, которые подлежат страхованию со стороны Экспортно-кредитного агентства Казахстана
  kaz: Қазақстанның Экспорттық-кредиттік агенттігі тарапынан сақтандырылуға жататын өңдеу өнеркәсібінің Қазақстанда шығарылған жоғары технологиялық тауарларын және көрсетілетін қызметтерін шетелдік сатып алушыларға екінші деңгейдегі банктер, Қазақстанның Даму Банкі, лизингтік қызметті жүзеге асыратын өзге де заңды тұлғалар беретін кредиттер және жасайтын лизингтік мәмілелер бойынша сыйақы мөлшерлемесін субсидиялау мақсаттары үшін өңдеу өнеркәсібінің Қазақстанда шығарылған жоғары технологиялық тауарларының және көрсетілетін қызметтерінің тізбесін бекіту туралы
