title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства торговли и интеграции Республики Казахстан, его ведомств и их территориальных подразделений
  kaz: Қазақстан Республикасы Сауда және интеграция министрлігінің, оның ведомстволары мен олардың аумақтық бөлімшелерінің «Б» корпусының мемлекеттік әкімшілік қызметшілері қызметін бағалау әдістемесін бекіту туралы
