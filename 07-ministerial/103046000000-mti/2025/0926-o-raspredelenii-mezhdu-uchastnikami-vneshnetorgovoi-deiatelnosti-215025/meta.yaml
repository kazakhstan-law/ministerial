title:
  rus: О распределении между участниками внешнеторговой деятельности количественных ограничений (квот) на ввоз бывших в употреблении литых алюминиевых колесных дисков, происходящих из Японии, без уплаты антидемпинговой пошлины и утверждении Правил их распределения
  kaz: Сыртқы сауда қызметіне қатысушылар арасында демпингке қарсы баж төлемей Жапониядан шыққан, пайдалануда болған құйылған алюминий доңғалақ дискілерін әкелуге сан жағынан шектеулерді (квоталарды) бөлу және оларды бөлу қағидаларын бекіту туралы
