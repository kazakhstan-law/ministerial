  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра торговли и интеграции Республики Казахстан от 25 июля 2019 года № 9 «Об утверждении положений Республиканского государственного учреждения «Комитет технического регулирования и метрологии Министерства торговли и интеграции Республики Казахстан» и его территориальных подразделений»
    kaz: «Қазақстан Республикасы Сауда және интеграция министрлігінің Техникалық реттеу және метрология комитеті республикалық мемлекеттік мекемесінің және оның аумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің міндетін атқарушының 2019 жылғы 25 шілдедегі № 9 бұйрығына өзгерістер енгізу туралы
