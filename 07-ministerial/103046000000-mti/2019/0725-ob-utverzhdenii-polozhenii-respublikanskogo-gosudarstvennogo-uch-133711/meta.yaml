  requisite: Приказ Министра торговли и интеграции Республики Казахстан от 24 ноября 2023 года № 413-НҚ
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра торговли и интеграции Республики Казахстан от 25 июля 2019 года № 9 «Об утверждении положений Республиканского государственного учреждения «Комитет технического регулирования и метрологии Министерства торговли и интеграции Республики Казахстан» и его территориальных подразделений», а также в приказ Заместителя Премьер-Министра - Министра торговли и интеграции Республики Казахстан от 29 декабря 2022 года № 508-НҚ «О некоторых вопросах структурных подразделений Министерства торговли и интеграции Республики Казахстан»
    kaz: «Қазақстан Республикасы Сауда және интеграция министрлігінің Техникалық реттеу және метрология комитеті» республикалық мемлекеттік мекемесінің және оның аумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің міндетін атқарушының 2019 жылғы 25 шілдедегі № 9 бұйрығына, сондай-ақ «Қазақстан Республикасы Сауда және интеграция министрлігінің құрылымдық бөлімшелерінің кейбір мәселелері туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Сауда және интеграция министрінің 2022 жылғы 29 желтоқсандағы № 508-НҚ бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/189040/rus
