act_code: '133711'
requisite: Приказ и.о. Министра торговли и интеграции Республики Казахстан от 25 июля 2019 года № 9
title:
  rus: Об утверждении положений Республиканского государственного учреждения «Комитет технического регулирования и метрологии Министерства торговли и интеграции Республики Казахстан» и его территориальных подразделений
  kaz: «Қазақстан Республикасы Сауда және интеграция министрлігі Техникалық peттеу және метрология комитеті» республикалық мемлекеттік мекемесінің және оның aумақтық бөлімшелерінің ережелерін бекіту туралы
