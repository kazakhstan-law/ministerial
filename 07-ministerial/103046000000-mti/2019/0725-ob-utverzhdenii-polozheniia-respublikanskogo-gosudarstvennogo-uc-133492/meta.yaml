requisite: Приказ и.о. Министра торговли и интеграции Республики Казахстан от 25 июля 2019 года № 7
title:
  rus: Об утверждении положения республиканского государственного учреждения «Комитет по защите прав потребителей Министерства торговли и интеграции Республики Казахстан»
  kaz: «Қазақстан Республикасы Сауда және интеграция министрлігінің Тұтынушылардың құқықтарын қорғау комитеті» республикалық мемлекеттік мекемесінің ережесін бекіту туралы
