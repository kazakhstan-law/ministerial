  requisite: Приказ Министра торговли и интеграции Республики Казахстан от 15 ноября 2019 года № 103
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра торговли и интеграции Республики Казахстан от 25 июля 2019 года № 7 «Об утверждении положения Республиканского государственного учреждения «Комитет по защите прав потребителей Министерства торговли и интеграции Республики Казахстан» и его территориальных подразделений»
    kaz: «Қазақстан Республикасы Сауда және интеграция министрлігі Тұтынушылардың құқықтарын қорғау комитеті» республикалық мемлекеттік мекемесінің және оның aумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің міндетін атқарушының 2019 жылғы 25 шілдедегі № 7 бұйрығына өзгерістер енгізу туралы
