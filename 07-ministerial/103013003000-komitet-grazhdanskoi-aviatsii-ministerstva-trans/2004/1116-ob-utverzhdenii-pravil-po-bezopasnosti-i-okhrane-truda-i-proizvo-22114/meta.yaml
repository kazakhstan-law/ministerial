act_code: '22114'
requisite: Приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 16 ноября 2004 года N 222. Зарегистрирован Министерством юстиции Республики Казахстан 26 ноября 2004 года N 3224. Утратил силу приказом и.о. Министра транспорта и коммуникаций Республики Казахстан от 30 сентября 2010 года № 442.
title:
  rus: Об утверждении Правил по безопасности и охране труда и производственной санитарии при техническом обслуживании авиационной техники в эксплуатационных предприятиях, ремонтных заводах, учебно-летных организациях, в летно-испытательных подразделениях гражданской авиации Республики Казахстан
  kaz: Қазақстан Республикасы Азаматтық авиациясының пайдалану кәсiпорындарында, жөндеу зауыттарында, жаттығу-ұшу ұйымдарында, ұшу-сынақ бөлiмшелерiнде авиациялық техникаға техникалық қызмет көрсету кезiндегi еңбек қауiпсiздiгi мен өндiрiстiк санитария жөнiндегi ережесiн бекiту туралы
