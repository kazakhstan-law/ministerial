    kaz: '"Қазақстан Республикасының әуежайларында жолаушыларға қызмет көрсетуді ұйымдастырудың ережесін бекіту туралы" Қазақстан Республикасы Көлік және коммуникациялар министрлігі Азаматтық авиация комитеті төрағасының 2004 жылғы 29 қарашадағы N 236 бұйрығына өзгерістер енгізу туралы'
