  title:
    rus: О внесении дополнений в приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 22 июня 2004 года № 113 "Об утверждении Перечня должностей руководителей и специалистов служб авиационной безопасности организаций гражданской авиации Республики Казахстан"
    kaz: '"Қазақстан Республикасы Азаматтық авиация үйымдарының авиациялық қауiпсiздiк қызметiнiң басшылары және мамандары лауазымдарының тiзбесiн бекiту туралы" Қазақстан Республикасы Көлiк және коммуникациялар министрлiгi Азаматтық авиация комитетi төрағасының 2004 жылғы 22 маусымдағы № 113 бұйрығына толықтырулар енгiзу туралы'
