requisite: Приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 22 июня 2004 года N 113. Зарегистрирован Министерством юстиции Республики Казахстан 14 июля 2004 года N 2948. Утратил силу приказом Министра транспорта и коммуникаций Республики Казахстан от 5 мая 2011 года № 253
title:
  rus: Об утверждении Перечня должностей руководителей и специалистов служб авиационной безопасности организаций гражданской авиации Республики Казахстан
  kaz: Қазақстан Республикасы Азаматтық авиация ұйымдарының авиациялық қауіпсіздік қызметінің басшылары және мамандары лауазымдарының тізбесін бекіту туралы
