  title:
    rus: О внесении изменения в приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 22 июня 2004 года № 113 "Об утверждении Перечня должностей руководителей и специалистов служб авиационной безопасности организаций гражданской авиации Республики Казахстан"
    kaz: '"Қазақстан Республикасы Азаматтық авиация ұйымдарының авиациялық қауіпсіздік қызметінің басшылары және мамандары лауазымдарының тізбесін бекіту туралы" Қазақстан Республикасы Көлік және коммуникациялар министрлігі Азаматтық авиация комитеті төрағасының 2004 жылғы 22 маусымдағы N 113 бұйрығына өзгеріс енгізу туралы'
