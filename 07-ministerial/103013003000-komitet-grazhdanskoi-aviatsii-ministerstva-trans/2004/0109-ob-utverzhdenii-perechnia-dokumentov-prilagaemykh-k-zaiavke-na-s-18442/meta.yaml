title:
  rus: Об утверждении Перечня документов, прилагаемых к заявке на сертификацию услуг по техническому обслуживанию и ремонту авиационной техники и Сертификационных требований, предъявляемых к организациям, осуществляющим техническое обслуживание и ремонт авиационной техники
  kaz: Авиациялық техникаға техникалық қызмет көрсету және жөндеу жөніндегі қызметтерді сертификаттау бойынша өтінімге қоса берілетін құжаттардың тізбесін және Авиациялық техникаға техникалық қызмет көрсетуді және жөндеуді жүзеге асыратын ұйымдарға қойылатын сертификаттық талаптарды бекіту туралы
