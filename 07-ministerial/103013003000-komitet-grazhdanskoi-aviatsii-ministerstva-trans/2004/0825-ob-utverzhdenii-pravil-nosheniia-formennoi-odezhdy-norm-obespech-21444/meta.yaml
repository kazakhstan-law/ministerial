  title:
    rus: О внесении изменения и дополнений в приказ исполняющего обязанностей Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 26 августа 2004 года № 157 "Об утверждении Правил ношения форменной одежды, норм обеспечения и перечня должностей (профессий) работников гражданской авиации Республики Казахстан, имеющих право ее ношения"
    kaz: '"Нысанды киім кию, қамтамасыз ету нормалары ережесін және нысанды киім киюге құқығы бар Қазақстан Республикасының азаматтық авиация қызметкерлері лауазымдарының (кәсіптерінің) тізбесін бекіту туралы" Қазақстан Республикасының Көлік және коммуникациялар министрлігі Азаматтық авиация комитетінің төрағасы міндетін атқарушының 2004 жылғы 26 тамыздағы N 157 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/41023/rus
