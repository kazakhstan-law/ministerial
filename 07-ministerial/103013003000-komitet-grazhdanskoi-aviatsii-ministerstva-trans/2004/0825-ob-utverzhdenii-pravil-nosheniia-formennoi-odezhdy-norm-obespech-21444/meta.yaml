act_code: '21444'
requisite: Приказ и.о. Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 26 августа 2004 года № 157. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 сентября 2004 года № 3109. Утратил силу приказом и.о. Министра транспорта и коммуникаций Республики Казахстан от 13 августа 2010 года № 364
title:
  rus: Об утверждении Правил ношения форменной одежды, норм обеспечения и перечня должностей (профессией) работников гражданской авиации Республики Казахстан, имеющих право ее ношения
  kaz: Нысанды киім кию, қамтамасыз ету нормалары ережесін және нысанды киім киюге құқығы бар Қазақстан Республикасының азаматтық авиация қызметкерлері лауазымдарының (кәсіптерінің) тізбесін бекіту туралы
