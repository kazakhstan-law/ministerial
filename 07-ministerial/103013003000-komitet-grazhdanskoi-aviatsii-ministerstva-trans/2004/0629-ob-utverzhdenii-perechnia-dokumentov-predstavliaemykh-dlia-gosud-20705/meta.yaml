requisite: Приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 30 июня 2004 года № 116. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 июля 2004 года № 2968. Утратил силу приказом и.о. Министра транспорта и коммуникаций Республики Казахстан от 9 декабря 2010 года № 559
title:
  rus: Об утверждении Перечня документов, представляемых для государственной регистрации гражданских воздушных судов, прав на них и сделок с ними, и исключения их из Государственного реестра гражданских воздушных судов Республики Казахстан
  kaz: Қазақстан Республикасының азаматтық әуе кемелерін, оларға арналған құқықтарды және олармен жасалатын мәмілелерді мемлекеттік тіркеу және де оларды азаматтық әуе кемелері Мемлекеттік тізілімінен алып тастау үшін ұсынылатын құжаттар тізбесін бекіту туралы
