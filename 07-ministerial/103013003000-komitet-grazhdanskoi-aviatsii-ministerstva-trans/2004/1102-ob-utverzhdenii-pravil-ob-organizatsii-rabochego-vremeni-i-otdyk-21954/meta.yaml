  title:
    rus: О внесении дополнений и изменений в приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 2 ноября 2004 года № 207 "Об утверждении Правил об организации рабочего времени и отдыхе членов экипажей воздушных судов гражданской авиации Республики Казахстан"
    kaz: '"Қазақстан Республикасының азаматтық авиациясының әуе кемелері экипаждары мүшелерінің жұмыс уақыты мен демалуын ұйымдастыру туралы Ережені бекіту туралы" Қазақстан Республикасының Көлік және коммуникация министрлігі Азаматтық авиация комитеті төрағасының 2004 жылғы 2 қарашадағы N 207 бұйрығына толықтырулар мен өзгертулер енгізу туралы'
