act_code: '21954'
requisite: Приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 2 ноября 2004 года N 207. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 ноября 2004 года N 3205. Утратил силу приказом и.о. Министра транспорта и коммуникаций Республики Казахстан от 30 сентября 2010 года № 442
title:
  rus: Об утверждении Правил об организации рабочего времени и отдыхе членов экипажей воздушных судов гражданской авиации Республики Казахстан
  kaz: Қазақстан Республикасының азаматтық авиациясының әуе кемелері экипаждары мүшелерінің жұмыс уақыты мен демалуын ұйымдастыру туралы Ережені бекіту туралы
