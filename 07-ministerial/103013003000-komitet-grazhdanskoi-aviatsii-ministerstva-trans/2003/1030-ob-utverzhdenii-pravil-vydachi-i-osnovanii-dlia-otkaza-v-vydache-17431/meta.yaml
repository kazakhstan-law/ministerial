  title:
    rus: О внесении дополнений и изменений в приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 30 октября 2003 года № 502 "Об утверждении Правил выдачи и оснований для отказа в выдаче разрешений на выполнение нерегулярных полетов"
    kaz: '"Тұрақты емес ұшуларды орындауға арналған рұқсаттарды беру және беруден бас тартуға арналған негіздердің ережелерін бекіту туралы" Қазақстан Республикасы Көлік және коммуникация министрлігі Азаматтық авиация комитеті Төрағасының 2003 жылғы 30 қазандағы N 502 бұйрығына толықтырулар мен өзгерістер енгізу туралы'
