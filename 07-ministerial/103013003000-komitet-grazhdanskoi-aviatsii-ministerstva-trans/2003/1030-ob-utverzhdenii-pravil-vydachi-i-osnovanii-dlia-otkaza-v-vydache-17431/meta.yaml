  title:
    rus: О внесении изменения в приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 30 октября 2003 года № 502 "Об утверждении Правил выдачи и оснований для отказа в выдаче разрешений на выполнение нерегулярных полетов", зарегистрированного в Министерстве юстиции Республики Казахстан от 13 ноября 2003 года № 2558
    kaz: 2003 жылғы 13 қарашада N 2558 Қазақстан Республикасы Әділет Министрлігінде тіркелген Қазақстан Республикасы Көлік және коммуникациялар министрлігінің Азаматтық авиация комитеті төрағасының 2003 жылғы 30 қазандағы N 502 бұйрығымен бекітілген Тұрақты емес ұшуларды орындауға рұқсат беру ережесі және беруден бас тарту үшін негіздерге өзгеріс енгізу туралы
