  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 30 октября 2003 года № 502 "Об утверждении Правил выдачи и оснований для отказа в выдаче разрешений на выполнение нерегулярных полетов"
    kaz: '"Тұрақты емес ұшуларды орындауға арналған рұқсаттарды беру және беруден бас тартуға арналған негіздердің ережелерін бекіту туралы" Қазақстан Республикасы Көлік және коммуникациялар министрлігі Азаматтық авиация комитеті төрағасының 2003 жылғы 30 қазандағы N 502 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
