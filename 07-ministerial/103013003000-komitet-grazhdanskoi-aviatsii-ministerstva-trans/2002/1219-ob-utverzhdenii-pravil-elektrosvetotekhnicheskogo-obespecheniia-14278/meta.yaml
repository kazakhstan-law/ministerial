  title:
    rus: О внесении изменений в приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 19 декабря 2002 года № 832-ю "Об утверждении Правил электросветотехнического обеспечения полетов в гражданской авиации Республики Казахстан"
    kaz: '"Қазақстан Республикасының азаматтық авиациясында электр жарығымен техникалық ұшуды қамтамасыз ету ережесін бекіту туралы" Қазақстан Республикасы Көлік және коммуникациялар министрлігінің Азаматтық авиация комитеті төрағасының 2002 жылғы 19 желтоқсандағы № 832-ю бұйрығына өзгерістер енгізу туралы'
