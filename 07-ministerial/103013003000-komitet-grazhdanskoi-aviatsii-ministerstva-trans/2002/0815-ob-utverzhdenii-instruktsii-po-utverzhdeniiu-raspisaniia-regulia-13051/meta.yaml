  title:
    rus: О внесении изменения в приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 16 августа 2002 года № 672 "Об утверждении Инструкции по утверждению расписания регулярных полетов на внутренних и международных авиамаршрутах Республики Казахстан"
    kaz: '"Қазақстан Республикасының iшкi және халықаралық авиабағыттарындағы тұрақты рейстердiң кестелерiн бекiту жөнiндегi нұсқаулықты бекіту туралы" Қазақстан Республикасы Көлік және коммуникациялар министрлігінің Азаматтық авиация комитеті төрағасының 2002 жылғы 16 тамыздағы № 672 бұйрығына өзгеріс енгізу туралы'
