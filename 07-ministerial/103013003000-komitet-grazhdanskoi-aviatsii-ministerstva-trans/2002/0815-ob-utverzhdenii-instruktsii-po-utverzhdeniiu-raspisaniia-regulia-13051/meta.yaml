act_code: '13051'
requisite: Приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 16 августа 2002 года № 672. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 августа 2002 года № 1955. Утратил силу приказом и.о. Министра транспорта и коммуникаций Республики Казахстан от 13 августа 2010 года № 363
title:
  rus: Об утверждении Инструкции по утверждению расписания регулярных полетов на внутренних и международных авиамаршрутах Республики Казахстан
  kaz: Қазақстан Республикасының iшкi және халықаралық авиабағыттарындағы тұрақты рейстердiң кестелерiн бекiту жөнiндегi нұсқаулықты бекiту туралы
