  title:
    rus: О внесений дополнений в приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 24 апреля 2002 года N 528 "Об утверждении Перечня должностей (профессий) авиационного персонала гражданской и экспериментальной авиации Республики Казахстан, подлежащих аттестации"
    kaz: '"Қазақстан Республикасының азаматтық және эксперименталдық авиацияда аттестациялаудан өтуге тиiстi авиациялық персоналдың қызметтер (мамандықтар) тiзiмдемесiн бекiту туралы" Қазақстан Республикасы Көлiк және коммуникациялар министрлiгiнiң Азаматтық авиация комитетi төрағасының 2002 жылғы 24 сәуiрiндегi N 528 бұйрығына толықтырулар енгiзу туралы'
