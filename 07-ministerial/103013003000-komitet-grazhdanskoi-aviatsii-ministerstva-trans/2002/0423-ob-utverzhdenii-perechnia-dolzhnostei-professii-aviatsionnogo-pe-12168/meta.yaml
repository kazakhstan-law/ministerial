requisite: Приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 24 апреля 2002 года N 528. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 мая 2002 года N 1858. Утратил силу приказом и.о. Министра транспорта и коммуникаций Республики Казахстан от 30 сентября 2010 года № 442.
title:
  rus: Об утверждении Перечня должностей (профессий) авиационного персонала гражданской и экспериментальной авиации Республики Казахстан, подлежащих аттестации
  kaz: Аттестацияға жататын Қазақстан Республикасы азаматтық және эксперименталды авиациясының авиациялық қызметшілері лауазымдарының (кәсібінің) тізімдемесін бекіту туралы
