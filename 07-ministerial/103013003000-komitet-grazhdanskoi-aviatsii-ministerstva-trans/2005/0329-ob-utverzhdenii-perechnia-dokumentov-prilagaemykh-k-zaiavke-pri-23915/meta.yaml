requisite: Приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 29 марта 2005 года № 64. Зарегистрирован Министерством юстиции Республики Казахстан 21 апреля 2005 года № 3573. Утратил силу приказом и.о. Министра транспорта и коммуникаций Республики Казахстан от 11 февраля 2010 года № 79
title:
  rus: Об утверждении Перечня документов, прилагаемых к заявке при сертификации услуг по обслуживанию пассажиров, обработке багажа, грузов, почты и на внесение изменений и (или) дополнений в сертификат или получения дубликата и Программы сертификационного обследования услуг по обслуживанию пассажиров, обработке багажа, грузов, почты
  kaz: Жолаушыларға қызмет көрсету, багажды, жүктердi, почтаны өңдеу жөнiндегi қызметтердi сертификаттау, сертификатқа өзгерiстер мен қосымшалар енгiзу немесе телнұсқа алу кезiндегi ұсынысқа қосымша берiлген құжаттар тiзбесi мен Жолаушыларға қызмет көрсету, багажды, жүктердi, почтаны өңдеу жөнiндегi қызметтердi сертификаттық тексеру бағдарламасын бекiту туралы
