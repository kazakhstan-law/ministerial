act_code: '25590'
requisite: Приказ Председателя комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 5 октября 2005 года № 206. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 октября 2005 года № 3897. Утратил силу приказом и.о. Министра транспорта и коммуникаций Республики Казахстан от 11 февраля 2010 года № 79
title:
  rus: Об утверждении Перечня документов, прилагаемых к заявке при сертификации услуг по светотехническому обеспечению полетов и энергоснабжению объектов аэропорта, аэродрома, аэронавигации, на внесение изменений и (или) дополнений в сертификат или получения дубликата и Программы сертификационного обследования услуг по светотехническому обеспечению полетов и энергоснабжению объектов аэропорта, аэродрома, аэронавигации
  kaz: Ұшуды жарықтехникалық қамсыздандыру және әуежай, әуеайлақ, әуенавигация объектілерін энергиямен жабдықтау жөніндегі қызметтерді сертификаттау, сертификатқа өзгерістер мен қосымшалар енгізу немесе телнұсқа алу кезіндегі ұсынысқа қосымша берілген құжаттар тізбесі мен ұшуды жарықтехникалық қамсыздандыру және әуежай, әуеайлақ, әуенавигация объектілерін энергиямен жабдықтау жөніндегі қызметтерді сертификаттық тексеру бағдарламасын бекіту туралы
