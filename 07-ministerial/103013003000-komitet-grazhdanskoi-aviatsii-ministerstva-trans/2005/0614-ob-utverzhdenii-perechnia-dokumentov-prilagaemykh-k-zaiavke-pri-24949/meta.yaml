act_code: '24949'
requisite: Приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 14 июня 2005 года № 119. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 июля 2005 года за № 3729. Утратил силу приказом и.о. Министра транспорта и коммуникаций Республики Казахстан от 11 февраля 2010 года № 79
title:
  rus: Об утверждении Перечня документов, прилагаемых к заявке при сертификации услуг по обеспечению гражданских воздушных судов авиационным топливом и специальными жидкостями, на внесение изменений и (или) дополнений в сертификат или получения дубликата и Программы сертификационного обследования услуг по обеспечению гражданских воздушных судов авиационным топливом и специальными жидкостями
  kaz: Азаматтық әуе кемелерін авиациялық отынмен және арнайы сұйықтықтармен қамтамасыз ету жөніндегі қызметтерді сертификаттау, сертификатқа өзгерістер мен қосымшалар енгізу немесе телнұсқа алу кезіндегі ұсынысқа қосымша берілген құжаттар тізбесі мен Азаматтық әуе кемелерін авиациялық отынмен және арнайы сұйықтықтармен қамтамасыз ету жөніндегі қызметтерді сертификаттық тексеру бағдарламасы
