requisite: Приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 26 апреля 2005 года № 86. Зарегистрирован Министерством юстиции Республики Казахстан 6 мая 2005 года № 3628. Утратил силу приказом и.о. Министра транспорта и коммуникаций Республики Казахстан от 11 февраля 2010 года № 79
title:
  rus: Об утверждении Перечня документов, прилагаемых к заявке при сертификации услуг по обеспечению гражданских воздушных судов и других потребителей специальными автотранспортными средствами, на внесение изменений и (или) дополнений в сертификат или получения дубликата и Программы сертификационного обследования услуг по обеспечению гражданских воздушных судов и других потребителей специальными автотранспортными средствами
  kaz: Азаматтық әуе кемелерін және өзге тұтынушыларды арнайы автокөліктік құралдармен қамтамасыз ету жөніндегі қызметтерді сертификаттау, сертификатқа өзгерістер мен қосымшалар енгізу немесе телнұсқа алу кезіндегі ұсынысқа қосымша берілген құжаттар тізбесі мен Азаматтық әуе кемелерін және өзге тұтынушыларды арнайы автокөліктік құралдармен қамтамасыз ету жөніндегі қызметтерді сертификаттық тексеру бағдарламасын бекіту туралы
