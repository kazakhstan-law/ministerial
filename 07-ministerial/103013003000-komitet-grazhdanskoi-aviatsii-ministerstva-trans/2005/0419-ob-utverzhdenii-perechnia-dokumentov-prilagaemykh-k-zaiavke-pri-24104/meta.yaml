requisite: Приказ Председателя Комитета гражданской авиации Министерства транспорта и коммуникаций Республики Казахстан от 19 апреля 2005 года № 79. Зарегистрирован Министерством юстиции Республики Казахстан 13 мая 2005 года № 3640. Утратил силу приказом Министра транспорта и коммуникаций Республики Казахстан от 30 июня 2010 года № 299
title:
  rus: Об утверждении Перечня документов, прилагаемых к заявке при сертификации услуг по техническому обслуживанию, содержанию и ремонту аэродрома, на внесение изменений и (или) дополнений в сертификат или получения дубликата и Программы сертификационного обследования услуг по техническому обслуживанию, содержанию и ремонту аэродрома
  kaz: Әуеайлаққа техникалық қызмет көрсету, күтіп ұстау және жөндеу жөніндегі қызметтерді сертификаттау, сертификатқа өзгерістер мен қосымшалар енгізу немесе телнұсқа алу кезіндегі ұсынысқа қосымша берілген құжаттар тізілімі мен Әуеайлаққа техникалық қызмет көрсету, күтіп ұстау және жөндеу жөніндегі қызметтерді сертификаттық тексеру бағдарламасы
