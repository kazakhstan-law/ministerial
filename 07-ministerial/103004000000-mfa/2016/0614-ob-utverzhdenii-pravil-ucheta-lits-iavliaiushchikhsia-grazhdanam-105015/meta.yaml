title:
  rus: Об утверждении Правил учета лиц, являющихся гражданами Республики Казахстан, постоянно проживающих за пределами Республики Казахстан, иностранных граждан, желающих усыновить детей-сирот, детей, оставшихся без попечения родителей, являющихся гражданами Республики Казахстан
  kaz: Жетім балаларды, ата-аналарының қамқорлығынсыз қалған балаларды асырап алуға тілек білдірген, Қазақстан Республикасының азаматтары болып табылатын, Қазақстан Республикасынан тыс жерде тұрақты тұратын адамдарды, шетел азаматтарды есепке алу қағидаларын бекіту туралы
