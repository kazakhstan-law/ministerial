  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра иностранных дел Республики Казахстан от 14 июня 2016 года № 11-1-2/262 «Об утверждении Правил учета лиц, являющихся гражданами Республики Казахстан, постоянно проживающих за пределами Республики Казахстан, иностранцев, желающих усыновить детей-сирот, детей, оставшихся без попечения родителей, являющихся гражданами Республики Казахстан»
    kaz: «Жетім балаларды, ата-аналарының қамқорлығынсыз қалған балаларды асырап алуға тілек білдірген, Қазақстан Республикасының азаматтары болып табылатын, Қазақстан Республикасынан тыс жерде тұрақты тұратын адамдарды, шетелдiктердi есепке алу қағидаларын бекіту туралы» Қазақстан Республикасы Сыртқы істер министрінің міндетін атқарушының 2016 жылғы 14 маусымдағы № 11-1-2/262 бұйрығына өзгеріс енгізу туралы
