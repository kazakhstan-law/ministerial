  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра иностранных дел Республики Казахстан от 26 декабря 2016 года № 11-1-2/619 «Об утверждении Правил использования средств, предусмотренных в республиканском бюджете по программе «Представление интересов Республики Казахстан за рубежом»
    kaz: «Шетелде Қазақстан Республикасының мүдделерін білдіру» бағдарламасы бойынша республикалық бюджетте көзделген қаражатты пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Сыртқы істер министрінің міндетін атқарушының 2016 жылғы 26 желтоқсандағы № 11-1-2/619 бұйрығына өзгерістер енгізу туралы
