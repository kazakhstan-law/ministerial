act_code: '109402'
requisite: Приказ и.о. Министра иностранных дел Республики Казахстан от 26 декабря 2016 года № 11-1-2/619. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 января 2017 года № 14748
title:
  rus: Об утверждении Правил реализации мероприятий по защите прав и интересов граждан Республики Казахстан, оказавшихся в затруднительном положении, в том числе вследствие форс-мажорных обстоятельств, а также принятия мер в отношении умерших граждан Республики Казахстан в государстве пребывания
  kaz: Болу мемлекетінде қиын жағдайға ұшыраған, оның ішінде форс-мажор жағдайлары салдарынан қиын жағдайға ұшыраған Қазақстан Республикасы азаматтарының құқықтары мен мүдделерін қорғау, сондай-ақ қайтыс болған Қазақстан Республикасы азаматтарына қатысты шаралар қабылдау бойынша іс-шараларды іске асыру қағидаларын бекіту туралыы
