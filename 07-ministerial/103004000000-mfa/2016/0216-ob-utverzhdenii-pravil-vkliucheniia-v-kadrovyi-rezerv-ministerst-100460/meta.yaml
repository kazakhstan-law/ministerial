  code: '157938'
  requisite: Приказ и.о. Министра иностранных дел Республики Казахстан от 16 июля 2021 года № 11-1-4/291. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 июля 2021 года № 23662
  title:
    rus: О внесении изменений и дополнения в приказ Министра иностранных дел Республики Казахстан от 16 февраля 2016 года № 11-1-2/53 «Об утверждении Правил включения в кадровый резерв Министерства иностранных дел Республики Казахстан» и приказ Министра иностранных дел Республики Казахстан от 17 августа 2020 года № 11-1-4/227 «Об утверждении Правил ротации персонала дипломатической службы Республики Казахстан»
    kaz: «Қазақстан Республикасы Сыртқы істер министрлігінің кадрлық резервіне қосу қағидасын бекіту туралы» Қазақстан Республикасы Сыртқы істер министрінің 2016 жылғы 16 ақпандағы № 11-1-2/53 бұйрығына және «Қазақстан Республикасының дипломатиялық қызмет персоналын ротациялау қағидасын бекіту туралы» Қазақстан Республикасы Сыртқы істер министрінің 2020 жылғы 17 тамыздағы № 11-1-4/227 бұйрығына өзгерістер мен толықтыру енгізу туралы
