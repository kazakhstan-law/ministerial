requisite: Приказ и.о. Министра иностранных дел Республики Казахстан от 9 декабря 2016 года № 11-1-2/585. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 февраля 2017 года № 14797. Утратил силу приказом Министра иностранных дел Республики Казахстан от 15 сентября 2017 года № 11-1-2/420 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).
title:
  rus: Об утверждении Правил приема от лиц, постоянно проживающих за пределами Республики Казахстан, заявлений по вопросам гражданства Республики Казахстан и вместе с необходимыми документами направления их на рассмотрение Президента Республики Казахстан
  kaz: Қазақстан Республикасынан тыс жерде тұрақты тұратын адамдардан Қазақстан Республикасының азаматтығы мәселелері жөнінде өтініштер қабылдау және оларды қажетті құжаттармен бірге Қазақстан Республикасы Президентінің қарауына жіберу қағидаларын бекiту туралы
