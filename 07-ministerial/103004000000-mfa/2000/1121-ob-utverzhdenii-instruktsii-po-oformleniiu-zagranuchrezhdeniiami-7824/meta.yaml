act_code: '7824'
requisite: Приказ Министра иностранных дел Республики Казахстан от 21 ноября 2000 года № 263. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 декабря 2000 года № 1347. Утратил силу приказом Государственного секретаря - Министра иностранных дел Республики Казахстан от 19 января 2011 года № 08-1-1-1/13
title:
  rus: Об утверждении Инструкции по оформлению загранучреждениями Республики Казахстан документов по вопросам гражданства Республики Казахстан
  kaz: Қазақстан Республикасының шетелдегі мекемелері Қазақстан Республикасының азаматтығы мәселелерiне қатысты құжаттарды ресiмдеу жөнiндегі нұсқаулығын бекiту туралы
