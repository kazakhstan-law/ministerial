  code: '16334'
  requisite: Приказ Министра иностранных дел Республики Казахстан от 17 июля 2003 года № 08-1/90. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 июля 2003 года № 2407. Утратил силу приказом Государственного секретаря - Министра иностранных дел Республики Казахстан от 19 января 2011 года № 08-1-1-1/13
  title:
    rus: О внесении дополнения и изменения в приказ Министра иностранных дел Республики Казахстан от 21 ноября 2000 года № 263 "Об утверждении Инструкции по оформлению дипломатическими представительствами, консульскими учреждениями и полномочными представительствами Республики Казахстан документов по вопросам гражданства Республики Казахстан", зарегистрированный в Министерстве юстиции Республики Казахстан за № 1347
    kaz: Қазақстан Республикасы Әділет министрлігінде N 1347 тіркелген "Қазақстан Республикасының дипломатиялық өкілдiктерiнiң, консулдық мекемелерiнiң және өкiлеттi өкiлдiктерiнiң Қазақстан Республикасының азаматтығы мәселелерiне қатысты құжаттарды ресiмдеу жөнiндегi нұсқаулығын бекiту туралы" Қазақстан Республикасы Сыртқы істер министрлігінің 2000 жылғы 21 қарашадағы N 263 бұйрығына толықтыру мен өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/16334/rus
