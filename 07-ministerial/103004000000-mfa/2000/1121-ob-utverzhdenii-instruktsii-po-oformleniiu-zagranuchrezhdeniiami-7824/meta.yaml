  requisite: Приказ Министра иностранных дел Республики Казахстан от 23 января 2006 года № 08-1/16. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 января 2006 года № 4049. Утратил силу приказом Государственного секретаря - Министра иностранных дел Республики Казахстан от 19 января 2011 года № 08-1-1-1/13
  title:
    rus: О внесении изменений и дополнений в приказ Министра иностранных дел Республики Казахстан от 21 ноября 2000 года № 263 "Об утверждении Инструкции по оформлению дипломатическими представительствами, консульскими учреждениями и полномочными представительствами Республики Казахстан документов по вопросам гражданства Республики Казахстан"
    kaz: Қазақстан Республикасы Сыртқы істер министрінің "Қазақстан Республикасының дипломатиялық өкілдіктерінің, консулдық мекемелерінің және өкілетті өкілдіктерінің Қазақстан Республикасының азаматтығы мәселелері бойынша құжаттарды ресімдеу жөніндегі нұсқаулықты бекіту туралы" 2000 жылғы 21 қарашадағы № 263 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/26626/rus
