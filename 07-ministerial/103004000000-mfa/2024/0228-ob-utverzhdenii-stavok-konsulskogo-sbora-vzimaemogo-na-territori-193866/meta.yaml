  title:
    rus: О внесении изменений в приказы Министерства иностранных дел Республики Казахстан от 20 мая 2019 года № 11-1-4/227 «Об утверждении ставок консульского сбора за совершение консульских действий на территории иностранного государства» и от 28 февраля 2024 года № 11-1-4/71 «Об утверждении ставок консульского сбора, взимаемого на территории Республики Казахстан»
    kaz: Қазақстан Республикасы Сыртқы істер министрлігінің «Шет мемлекеттің аумағында консулдық әрекеттер жасағаны үшін консулдық алым мөлшерлемелерін бекіту туралы» 2019 жылғы 20 мамырдағы № 11-1-4/227 және «Қазақстан Республикасының аумағында алынатын консулдық алым мөлшерлемелерін бекіту туралы» 2024 жылғы 28 ақпандағы № 11-1-4/71 бұйрықтарына өзгерістер енгізу туралы
