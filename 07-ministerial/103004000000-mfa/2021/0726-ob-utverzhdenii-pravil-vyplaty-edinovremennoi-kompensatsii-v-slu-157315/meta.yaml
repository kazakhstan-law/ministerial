act_code: '157315'
requisite: Приказ и.о. Министра иностранных дел Республики Казахстан от 26 июля 2021 года № 11-1-4/302. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 июля 2021 года № 23728
title:
  rus: Об утверждении Правил выплаты единовременной компенсации в случае гибели сотрудника дипломатической службы или работника дипломатической службы при исполнении служебных обязанностей за границей либо смерти в течение года вследствие травмы, полученной при исполнении служебных обязанностей за границей, установления ему инвалидности, наступившей в результате заболевания, увечья (ранения, травмы, контузии), полученных при исполнении служебных обязанностей за границей, и получения увечья (ранения, травмы, контузии), не повлекшего (не повлекшей) инвалидности, при исполнении служебных обязанностей за границей
  kaz: Дипломатиялық қызмет қызметкері немесе дипломатиялық қызмет жұмыскері шет елде қызметтік міндеттерін орындау кезінде қаза тапқан не шет елде қызметтік міндеттерін орындау кезінде алған жарақаты салдарынан бір жыл ішінде қайтыс болған, оған шет елде қызметтік міндеттерін орындау кезінде ауруы, мертігуі (жаралануы, жарақаттануы, контузия алуы) салдарынан болған мүгедектік белгіленген жағдайда және шет елде қызметтік міндеттерін орындау кезінде мүгедектікке алып келмеген мертігуі (жаралануы, жарақаттануы, контузия алуы) жағдайында біржолғы өтемақы төлеу қағидаларын бекіту туралы
