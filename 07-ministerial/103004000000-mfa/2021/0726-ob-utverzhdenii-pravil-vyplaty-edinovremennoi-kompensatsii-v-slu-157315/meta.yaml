  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра иностранных дел Республики Казахстан от 26 июля 2021 года № 11-1-4/302 «Об утверждении Правил выплаты единовременной компенсации в случае гибели сотрудника дипломатической службы или работника дипломатической службы при исполнении служебных обязанностей за границей либо смерти в течение года вследствие травмы, полученной при исполнении служебных обязанностей за границей, установления ему инвалидности, наступившей в результате заболевания, увечья (ранения, травмы, контузии), полученных при исполнении служебных обязанностей за границей, и получения увечья (ранения, травмы, контузии), не повлекшего (не повлекшей) инвалидности, при исполнении служебных обязанностей за границей»
    kaz: «Қазақстан Республикасы дипломатиялық қызметінің қызметкері немесе Қазақстан Республикасы дипломатиялық қызметінің жұмыскері шетелде қызметтік міндеттерін орындау кезінде қаза тапқан не шетелде қызметтік міндеттерін орындау кезінде алған жарақаты салдарынан бір жыл ішінде қайтыс болған, оған шетелде қызметтік міндеттерін орындау кезінде ауруы, мертігуі (жаралануы, жарақаттануы, контузия алуы) салдарынан болған мүгедектік белгіленген жағдайда және және шетелде қызметтік міндеттерін орындау кезінде мүгедектікке әкеп соқпаған мертігуі (жаралануы, жарақаттануы, контузия алуы) жағдайында біржолғы өтемақы төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Сыртқы істер министрінің міндетін атқарушының 2021 жылғы 26 шiлдедегi № 11-1-4/302 бұйрығына өзгерістер енгізу туралы
