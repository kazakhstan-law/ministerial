act_code: '157022'
requisite: Приказ Заместителя Премьер—Министра Республики Казахстан - Министра иностранных дел Республики Казахстан от 30 июня 2021 года № 11-1-4/270дсп. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июня 2021 года № 23212
title:
  rus: Об утверждении Правил и размеров оплаты дошкольного воспитания и обучения, начального, основного среднего и общего среднего образования детей персонала дипломатической службы Республики Казахстан за счет бюджетных средств во время работы в загранучреждении Республики Казахстан
  kaz: Қазақстан Республикасының шетелдегі мекемесінде жұмыс істеген уақытында Қазақстан Республикасының дипломатиялық қызметі персоналының балаларын мектепке дейінгі тәрбиелеу мен оқытуға, бастауыш, негізгі орта және жалпы орта білім беруге ақы төлеу қағидалары мен мөлшерлерін бюджет қаражаты есебінен бекіту туралы
