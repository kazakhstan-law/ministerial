act_code: '115333'
requisite: Приказ Министра иностранных дел Республики Казахстан от 15 сентября 2017 года № 11-1-2/420. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 октября 2017 года № 15884
title:
  rus: Об утверждении Правил приема и рассмотрения загранучреждениями Республики Казахстан заявлений по вопросам гражданства Республики Казахстан, регистрации утраты гражданства Республики Казахстан и определения принадлежности (непринадлежности) к гражданству Республики Казахстан
  kaz: Қазақстан Республикасының шет елдердегі мекемелерінің Қазақстан Республикасының азаматтығы мәселелері бойынша өтініштерді қабылдау және қарау, Қазақстан Республикасының азаматтығын жоғалтуын тіркеу және Қазақстан Республикасының азаматтығына жататынын (жатпайтынын) айқындау қағидаларын бекіту туралы
