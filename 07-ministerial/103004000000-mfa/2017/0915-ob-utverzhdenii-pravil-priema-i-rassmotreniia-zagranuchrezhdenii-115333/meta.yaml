  title:
    rus: О внесении изменений в приказ Министра иностранных дел Республики Казахстан от 15 сентября 2017 года № 11-1-2/420 «Об утверждении Правил приема, оформления и рассмотрения загранучреждениями Республики Казахстан заявлений по вопросам гражданства Республики Казахстан, утраты и лишения гражданства Республики Казахстан и определения принадлежности к гражданству Республики Казахстан»
    kaz: «Қазақстан Республикасының азаматтығы, Қазақстан Республикасының азаматтығын жоғалту мен одан айыру және Қазақстан Республикасының азаматтығына жататындығын айқындау мәселелері бойынша өтініштерді Қазақстан Республикасының шет елдердегі мекемелерінің қабылдау, ресімдеу және қарау қағидаларын бекіту туралы» Қазақстан Республикасы Сыртқы істер министрінің 2017 жылғы 15 қыркүйектегі № 11-1-2/420 бұйрығына өзгерістер енгізу туралы
