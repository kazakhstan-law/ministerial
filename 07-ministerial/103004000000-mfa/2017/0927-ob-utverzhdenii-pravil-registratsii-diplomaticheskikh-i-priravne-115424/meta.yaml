act_code: '115424'
requisite: Приказ Министра иностранных дел Республики Казахстан от 27 сентября 2017 года № 11-1-2/442. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 сентября 2017 года № 15833
title:
  rus: Об утверждении Правил регистрации дипломатических и приравненных к ним представительств иностранных государств, международных организаций и (или) их представительств, а также консульских учреждений иностранных государств и аккредитации глав, членов персонала дипломатических и приравненных к ним представительств иностранных государств, международных организаций и (или) их представительств, работников консульских учреждений иностранных государств в Республике Казахстан
  kaz: Шет мемлекеттердің дипломатиялық және оларға теңестірілген өкілдіктерін, халықаралық ұйымдарды және (немесе) олардың өкілдіктерін, сондай-ақ шет мемлекеттердің консулдық мекемелерін тіркеу және Қазақстан Республикасындағы шет мемлекеттердің дипломатиялық және оларға теңестірілген өкілдіктерінің, халықаралық ұйымдардың және (немесе) олардың өкілдіктерінің басшыларын, персоналы мүшелерін, шет мемлекеттердің консулдық мекемелерінің жұмыскерлерін аккредиттеу қағидаларын бекіту туралы
