  title:
    rus: О внесении изменений в приказ Министра иностранных дел Республики Казахстан от 27 сентября 2017 года № 11-1-2/442 «Об утверждении Правил регистрации дипломатического представительства, международной организации и (или) ее представительства, консульского учреждения и аккредитации глав, членов персонала дипломатических представительств, международных организаций и (или) их представительств, работников консульских учреждений в Республике Казахстан»
    kaz: «Дипломатиялық өкілдікті, халықаралық ұйымды және (немесе) оның өкілдігін, консулдық мекемені тіркеу, Қазақстан Республикасындағы дипломатиялық өкілдіктердің, халықаралық ұйымдардың және (немесе) олардың өкілдіктерінің басшыларын, персоналы мүшелерін, консулдық мекемелердің жұмыскерлерін аккредиттеу қағидаларын бекіту туралы» Қазақстан Республикасы Сыртқы істер министрінің 2017 жылғы 27 қыркүйектегі № 11-1-2/442 бұйрығына өзгерістер енгізу туралы
