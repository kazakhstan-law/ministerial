act_code: '54095'
requisite: Приказ Государственного секретаря - Министра иностранных дел Республики Казахстан от 14 июля 2010 года № 08-1-1-1/249. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 августа 2010 года № 6372. Утратил силу приказом Министра иностранных дел Республики Казахстан от 20 мая 2019 года № 11-1-4/227 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении ставок консульского сбора за совершение консульских действий на территории иностранного государства
  kaz: Шет мемлекеттің аумағында консулдық әрекеттер жасағаны үшін консулдық алым мөлшерлемелерін бекіту туралы
