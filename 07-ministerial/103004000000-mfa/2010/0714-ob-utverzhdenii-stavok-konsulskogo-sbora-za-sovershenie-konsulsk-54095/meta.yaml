  code: '73097'
  requisite: Приказ Министра иностранных дел Республики Казахстан от 29 мая 2013 года № 08-1-1-1/205. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 июня 2013 года № 8512. Утратил силу приказом Министра иностранных дел Республики Казахстан от 20 мая 2019 года № 11-1-4/227 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в приказ Государственного секретаря - Министра иностранных дел Республики Казахстан от 14 июля 2010 года № 08-1-1-1/249 "Об утверждении размеров ставок консульских сборов, взимаемых за совершение консульских действий, а также ставок консульского сбора за срочность"
    kaz: '"Консулдық іс-әрекеттерді жасау үшін алынатын консулдық алымдар ставкаларының, сонымен қатар жеделдік үшін консулдық алым ставкаларының мөлшерлерін бекіту туралы" Қазақстан Республикасының Мемлекеттік хатшысы - Сыртқы істер министрінің 2010 жылғы 14 шілдедегі № 08-1-1-1/249 бұйрығына өзгерістер мен толықтыру енгізу туралы'
