act_code: '131677'
requisite: Приказ Министра иностранных дел Республики Казахстан от 22 февраля 2019 года № 11-1-4/76. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 мая 2019 года № 18706. Утратил силу приказом Министра иностранных дел Республики Казахстан от 27 мая 2020 года № 11-1-4/168 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Постановка на учет лиц, являющихся гражданами Республики Казахстан, постоянно проживающих за пределами Республики Казахстан, иностранцев, желающих усыновить детей-сирот, детей, оставшихся без попечения родителей, являющихся гражданами Республики Казахстан»
  kaz: «Жетім балаларды, ата-аналарының қамқорлығынсыз қалған балаларды асырап алуға тілек білдірген, Қазақстан Республикасының азаматтары болып табылатын, Қазақстан Республикасынан тыс жерде тұрақты тұратын адамдарды, шетелдіктерді есепке қою» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
