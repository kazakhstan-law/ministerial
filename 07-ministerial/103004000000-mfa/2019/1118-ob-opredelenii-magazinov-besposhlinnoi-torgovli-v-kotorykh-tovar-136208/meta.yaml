act_code: '136208'
requisite: Приказ Министра иностранных дел Республики Казахстан от 18 ноября 2019 года № 11-1-4/603. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 ноября 2019 года № 19627
title:
  rus: Об определении магазинов беспошлинной торговли, в которых товары, помещенные под таможенную процедуру беспошлинной торговли, реализуются дипломатическим представительствам, консульским учреждениям, представительствам государств при международных организациях, международным организациям или их представительствам, расположенным на таможенной территории Евразийского экономического союза, а также членам дипломатического персонала дипломатического представительства, консульским должностным лицам и членам их семей, которые проживают вместе с ними, персоналу (сотрудникам, должностным лицам) представительств государств при международных организациях, международных организаций или их представительств.
  kaz: Еуразиялық экономикалық одақтың кедендік аумағында орналасқан дипломатиялық өкілдіктерге, консулдық мекемелерге, халықаралық ұйымдар жанындағы мемлекеттер өкілдіктеріне, халықаралық ұйымдарға немесеолардың өкілдіктеріне, сондай-ақ дипломатиялық өкілдіктердің дипломатиялық персоналының мүшелеріне, консулдық лауазымды тұлғаларға және олармен бірге тұратын отбасы мүшелеріне, халықаралық ұйымдар жанындағы мемлекеттік өкілдіктер, халықаралық ұйымдар немесе олардың өкілдіктерінің персоналына (қызметкерлері, лауазымды тұлғалары) бажсыз сауда кедендік рәсімімен орналастырылған тауарларды өткізу үшін бажсыз сауда дүкендерін анықтау туралы
