  title:
    rus: О внесении изменений в приказ Министра иностранных дел Республики Казахстан от 12 июня 2023 года № 11-1-4/291 «Об утверждении Положения о представительской экипировке сотрудников дипломатической службы Республики Казахстан»
    kaz: «Қазақстан Республикасы дипломатиялық қызметі қызметкерлерінің өкілдік керек-жарағы туралы ережені бекіту туралы» Қазақстан Республикасы Сыртқы істер министрінің 2023 жылғы 12 маусымдағы № 11-1-4/291 бұйрығына өзгерістер енгізу туралы
