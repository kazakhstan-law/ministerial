title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства иностранных дел Республики Казахстан и Методики оценки деятельности административных государственных служащих корпуса «Б» загранучреждений Республики Казахстан
  kaz: Қазақстан Республикасы Сыртқы істер министрлігі «Б» корпусының мемлекеттік әкімшілік қызметшілерінің жұмысын бағалау әдістемесін және Қазақстан Республикасы шет елдердегі мекемелері «Б» корпусының мемлекеттік әкімшілік қызметшілерінің жұмысын бағалау әдістемесін бекіту туралы
