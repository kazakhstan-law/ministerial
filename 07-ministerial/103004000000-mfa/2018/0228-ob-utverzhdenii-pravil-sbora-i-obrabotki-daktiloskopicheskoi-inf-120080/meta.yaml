title:
  rus: Об утверждении Правил сбора и обработки дактилоскопической информации у граждан Республики Казахстан, претендующих на получение паспорта гражданина Республики Казахстан за границей, иностранных граждан и лиц без гражданства при получении виз Республики Казахстан
  kaz: Шетелде Қазақстан Республикасы азаматының паспортын алуға үміткер Қазақстан Республикасының азаматтарынан, Қазақстан Республикасының визаларын алу кезінде шетел азаматтары мен азаматтығы жоқ адамдардан дактилоскопиялық ақпарат жинау және өңдеу қағидаларын бекіту туралы
