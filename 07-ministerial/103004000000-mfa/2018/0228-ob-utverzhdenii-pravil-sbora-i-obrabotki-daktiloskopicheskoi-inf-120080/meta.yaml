  title:
    rus: О внесении изменений в приказ Министра иностранных дел Республики Казахстан от 28 февраля 2018 года № 11-1-4/71 «Об утверждении Правил сбора и обработки дактилоскопической информации у граждан Республики Казахстан, претендующих на получение паспорта гражданина Республики Казахстан за границей, иностранцев и лиц без гражданства при получении виз Республики Казахстан»
    kaz: «Шетелде Қазақстан Республикасы азаматының паспортын алуға үміткер Қазақстан Республикасының азаматтарынан, Қазақстан Республикасының визаларын алу кезінде шетелдіктер мен азаматтығы жоқ адамдардан дактилоскопиялық ақпарат жинау және өңдеу қағидаларын бекіту туралы» Қазақстан Республикасы Сыртқы істер министрінің 2018 жылғы 28 ақпандағы № 11-1-4/71 бұйрығына өзгерістер енгізу туралы
