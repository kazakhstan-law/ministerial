requisite: Приказ Министра иностранных дел Республики Казахстан от 3 августа 2009 года № 08-1-1-1/236. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 сентября 2009 года № 5775.  Утратил силу приказом Министра иностранных дел Республики Казахстан от 27 сентября 2017 года № 11-1-2/442 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по регистрации дипломатического представительства, международной организации и/или ее представительства, консульского учреждения, аккредитации глав, членов персонала дипломатических представительств, международных организаций и/или их представительств, работников консульских учреждений, военных, морских и авиационных атташе в Республике Казахстан
  kaz: Дипломатиялық өкілдіктерді, халықаралық ұйым және/немесе оның өкілдігін, консулдық мекемені тіркеу, дипломатиялық өкілдіктердің, халықаралық ұйымдар және/немесе олардың өкілдіктерінің басшылары мен персонал мүшелерін, консулдық мекемелердің қызметкерлерін, әскери, теңіз және әуе атташелерін Қазақстан Республикасында аккредиттеу жөніндегі нұсқаулықты бекіту туралы
