title:
  rus: Об утверждении перечня дипломатических и приравненных к ним представительств иностранных государств, консульских учреждений иностранного государства, аккредитованных в Республике Казахстан, в отношении которых устанавливаются ограничения по возврату налога на добавленную стоимость
