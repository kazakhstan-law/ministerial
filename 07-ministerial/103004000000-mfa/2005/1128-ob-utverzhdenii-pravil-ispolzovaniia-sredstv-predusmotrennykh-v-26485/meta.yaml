  title:
    rus: О внесении дополнения в приказ Министра иностранных дел Республики Казахстан от 28 ноября 2005 года № 08-1/361 "Об утверждении Правил использования средств, предусмотренных в республиканском бюджете по программе "Оказание финансовой помощи гражданам Республики Казахстан, незаконно ввезенным в иностранные государства и ставшим жертвами торговли, а также пострадавшим за рубежом от других преступлений и оказавшимся в форс-мажорных обстоятельствах"
    kaz: '"Республикалық бюджетте "Шет мемлекеттерге заңсыз әкелінген және адам саудасының құрбандары болған, сондай-ақ шетелде басқа да қылмыстардан зардап шеккен және форс-мажорлы жағдайға ұшыраған Қазақстан Республикасы азаматтарына қаржылай көмек көрсету" бағдарламасы бойынша көзделген қаражатты пайдалану ережесін бекіту туралы" Қазақстан Республикасы Сыртқы істер министрінің 2005 жылғы 28 қарашадағы № 08-1/361 бұйрығына толықтыру енгізу туралы"'
  link: https://zan.gov.kz/client/#!/doc/28387/rus
