requisite: Приказ Министра иностранных дел Республики Казахстан от 28 ноября 2005 года № 08-1/361. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 января 2006 года № 4037. Утратил силу приказом и.о. Министра иностранных дел Республики Казахстан от 26 декабря 2016 года № 11-1-2/619
title:
  rus: Об утверждении Правил использования средств, предусмотренных в республиканском бюджете по программе "Защита и обеспечение прав и интересов граждан Республики Казахстан за рубежом"
  kaz: Республикалық бюджетте "Шет елдерде Қазақстан Республикасы азаматтарының құқықтары мен мүдделерін қорғау және қамтамасыз ету" бағдарламасы бойынша көзделген қаражатты пайдалану Ережесін бекіту туралы
