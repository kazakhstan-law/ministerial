requisite: Приказ и.о. Министра иностранных дел Республики Казахстан от 30 июля 2015 года № 11-1-2/314. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 сентября 2015 года № 12036. Утратил силу приказом Министра иностранных дел Республики Казахстан от 23 февраля 2018 года № 11-1-4/66-2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Перечня дипломатических и приравненных к ним представительств иностранных государств, консульских учреждений иностранного государства, аккредитованных в Республике Казахстан, в отношении которых осуществляется возврат налога на добавленную стоимость
  kaz: Қосылған құн салығын қайтару жүзеге асырылатын Қазақстан Республикасында аккредиттелген шет мемлекеттердің дипломатиялық және оларға теңестірілген өкілдіктерінің, шет мемлекеттердің консулдық мекемелерінің тізбесін бекіту туралы
