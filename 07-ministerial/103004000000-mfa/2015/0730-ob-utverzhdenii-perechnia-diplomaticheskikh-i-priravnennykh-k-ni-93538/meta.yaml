  requisite: Приказ Министра иностранных дел Республики Казахстан от 5 июля 2017 года № 11-1-2/277. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 августа 2017 года № 15439. Утратил силу приказом Министра иностранных дел Республики Казахстан от 23 февраля 2018 года № 11-1-4/66-2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения и дополнений в приказы исполняющего обязанности Министра иностранных дел Республики Казахстан от 16 июля 2015 года № 11-1-2/295 «Об утверждении перечня представительств, в отношении которых устанавливаются ограничения по возврату налога на добавленную стоимость» и от 30 июля 2015 года № 11-1-2/314 «Об утверждении перечня дипломатических и приравненных к ним представительств иностранных государств, консульских учреждений иностранного государства, аккредитованных в Республике Казахстан, в отношении которых осуществляется возврат налога на добавленную стоимость»
    kaz: «Қосылған құн салығын қайтару бойынша шектеулер белгіленетін өкілдіктердің тізбесін бекіту туралы» Қазақстан Республикасы Сыртқы істер министрінің міндетін атқарушының 2015 жылғы 16 шілдедегі № 11-1-2/295 және «Қосылған құн салығын қайтару жүзеге асырылатын Қазақстан Республикасында аккредиттелген шет мемлекеттердің дипломатиялық және оларға теңестірілген өкілдіктерінің, шет мемлекеттердің консулдық мекемелерінің тізбесін бекіту туралы» Қазақстан Республикасы Сыртқы істер министрінің міндетін атқарушының 2015 жылғы 30 шілдедегі № 11-1-2/314 бұйрықтарына өзгеріс пен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/114040/rus
