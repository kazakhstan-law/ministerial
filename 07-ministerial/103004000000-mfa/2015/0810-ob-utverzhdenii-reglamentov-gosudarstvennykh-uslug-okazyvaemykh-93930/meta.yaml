  title:
    rus: О внесении изменений в приказ Министра иностранных дел Республики Казахстан от 4 января 2018 года № 11-1-4/1 «Об утверждении Правил приема и направления документов граждан Республики Казахстан, выехавших за пределы Республики Казахстан по временным делам и изъявивших желание остаться там на постоянное место жительство»
    kaz: «Қазақстан Республикасынан тыс жерге уақытша жұмыстармен шыққан және онда тұрақты тұру үшін қалуға тілек білдірген Қазақстан Республикасы азаматтарының құжаттарын қабылдау және жолдау қағидаларын бекіту туралы» Қазақстан Республикасы Сыртқы істер министрінің 2018 жылғы 4 қаңтардағы № 11-1-4/1 бұйрығына өзгерістер енгізу туралы
