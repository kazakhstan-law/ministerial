act_code: '98159'
requisite: Приказ Министра иностранных дел Республики Казахстан от 19 ноября 2015 года № 11-1-2/517. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 января 2016 года № 12830. Утратил силу приказом Министра иностранных дел Республики Казахстан от 3 июня 2020 года № 11-1-4/183 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Прием и направление документов граждан Республики Казахстан, выехавших за пределы Республики Казахстан по временным делам и изъявивших желание остаться там на постоянное место жительство»
  kaz: «Қазақстан Республикасынан тыс жерге уақытша жұмыстармен кеткен және сол жерде тұрғылықты тұруға ниет білдірген Қазақстан Республикасы азаматтарының құжаттарын қабылдау және жолдау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
