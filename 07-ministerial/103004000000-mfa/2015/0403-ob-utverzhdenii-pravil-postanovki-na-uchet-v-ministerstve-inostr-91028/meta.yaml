title:
  rus: Об утверждении Правил постановки на учет в Министерстве иностранных дел Республики Казахстан и осуществления загранучреждениями Республики Казахстан контроля за детьми, являющимися гражданами Республики Казахстан, переданными на усыновление иностранным гражданам
  kaz: Шетел азаматтары асырап алған Қазақстан Республикасының азаматтары болып табылатын балаларды Қазақстан Республикасының Сыртқы істер министрлігінде есепке қою және Қазақстан Республикасының шетелдегі мекемелерінің бақылауды жүзеге асыру қағидаларын бекіту туралы
