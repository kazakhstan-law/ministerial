  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра иностранных дел Республики Казахстан от 3 апреля 2015 года № 11-1-2/130 «Об утверждении Правил постановки на учет в Министерстве иностранных дел Республики Казахстан и осуществления загранучреждениями Республики Казахстан контроля за детьми, являющимися гражданами Республики Казахстан, переданными на усыновление иностранцам»
    kaz: «Шетелдіктер асырап алған Қазақстан Республикасының азаматтары болып табылатын балаларды Қазақстан Республикасының Сыртқы істер министрлігінде есепке қою және Қазақстан Республикасының шетелдегі мекемелерінің бақылауды жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Сыртқы істер министрінің міндетін атқарушының 2015 жылғы 3 сәуірдегі № 11-1-2/130 бұйрығына өзгерістер мен толықтырулар енгізу туралы
