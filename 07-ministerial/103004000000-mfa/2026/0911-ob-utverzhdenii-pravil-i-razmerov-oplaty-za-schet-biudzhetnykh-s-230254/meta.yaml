requisite: Приказ Министра иностранных дел Республики Казахстан от 11 сентября 2026 года № 11-1-4/514 дсп
title:
  rus: Об утверждении Правил и размеров оплаты за счет бюджетных средств дошкольного воспитания и обучения, начального, основного среднего и общего среднего образования детей персонала дипломатической службы Республики Казахстан во время работы в загранучреждении Республики Казахстан
  kaz: Қазақстан Республикасының шет елдегі мекемесінде жұмыс істеген уақытында Қазақстан Республикасының дипломатиялық қызметі персоналының балаларына мектепке дейінгі тәрбиелеу мен оқыту, бастауыш, негізгі орта және жалпы орта білім беру бюджетінің қаражаты есебінен ақы төлеу қағидалары мен мөлшерін бекіту туралы
