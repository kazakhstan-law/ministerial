  title:
    rus: О внесении изменений и дополнения в приказы Министра иностранных дел Республики Казахстан от 17 июня 1999 года № 655 "Об утверждении Правил об учете иностранных граждан, желающих усыновить (удочерить) детей, являющихся гражданами Республики Казахстан" и от 11 апреля 2003 года № 08-1/31 "Об утверждении Инструкции по постановке на учет детей, являющихся гражданами Республики Казахстан, переданных на усыновление (удочерение) иностранцам
    kaz: '"Қазақстан Республикасы Сыртқы істер министрінің "Қазақстан Республикасының азаматтары болып табылатын ұл (қыз) балаларды асырауға тілек білдірген шетелдік азаматтарды есепке алу жөніндегі ережені бекіту туралы" 1999 жылғы 17 маусымдағы № 655 және "Шетелдіктердің асырап алуына берілген Қазақстан Республикасының азаматтары болып табылатын ұл (қыз) балаларды есепке алу туралы нұсқаулықты бекіту туралы" 2003 жылғы 11 сәуірдегі № 08-1/31 бұйрықтарына өзгерістер мен толықтыру енгізу туралы"'
  link: https://zan.gov.kz/client/#!/doc/26439/rus
