act_code: '72334'
requisite: Приказ Министра иностранных дел Республики Казахстан от 9 апреля 2013 года № 08-1-1-1/114. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 апреля 2013 года № 8438
title:
  rus: Об утверждении Правил использования средств, предусмотренных в республиканском бюджете по программе «Заграничные командировки» и специфики 162 программ «Услуги по координации внешнеполитической деятельности» и «Обеспечение специальной, инженерно-технической и физической защиты дипломатических представительств за рубежом» в целях командирования уполномоченных лиц за пределы территории Республики Казахстан
  kaz: Уәкілетті адамдарды Қазақстан Республикасының аумағынан тыс жерлерге іссапарға жіберу мақсатында республикалық бюджетте «Шетелдік іссапарлар» бағдарламасы және «Сыртқы саяси қызметтерді үйлестіру жөніндегі қызметтер» және «Шетелдегі дипломатиялық өкілдіктердің арнайы, инженерлік-техникалық және нақты қорғалуын қамтамасыз ету» бағдарламаларының 162-ерекшелігі бойынша көзделген қаражатты пайдалану қағидаларын бекіту туралы
