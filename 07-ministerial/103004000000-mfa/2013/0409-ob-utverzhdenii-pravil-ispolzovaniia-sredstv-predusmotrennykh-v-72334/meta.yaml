  title:
    rus: О внесении изменений и дополнений в приказ Министра иностранных дел Республики Казахстан от 9 апреля 2013 года № 08-1-1-1/114 «Об утверждении Правил использования средств, предусмотренных в республиканском бюджете по программе «Заграничные командировки» и специфики 162 программ «Услуги по координации внешнеполитической деятельности» и «Обеспечение специальной, инженерно-технической и физической защиты дипломатических представительств за границей», в целях командирования уполномоченных лиц за пределы территории Республики Казахстан»
    kaz: «Қазақстан Республикасының аумағынан тыс жерлерге уәкілетті адамдарды іссапарға жіберу мақсатында республикалық бюджетте «Шетелдік іссапарлар» бағдарламасы және «Сыртқы саяси қызметтерді үйлестіру жөніндегі қызметтер» және «Шетелдегі дипломатиялық өкілдіктердің арнайы, инженерлік-техникалық және нақты қорғалуын қамтамасыз ету» бағдарламаларының 162 ерекшелігі бойынша көзделген қаражатты пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Сыртқы істер министрінің 2013 жылғы 9 сәуірдегі № 08-1-1-1/114 бұйрығына өзгерістер мен толықтырулар енгізу туралы
