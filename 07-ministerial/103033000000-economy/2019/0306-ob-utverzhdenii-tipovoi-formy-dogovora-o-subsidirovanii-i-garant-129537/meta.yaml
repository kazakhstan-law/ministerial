  title:
    rus: О внесении изменения в приказ Министра национальной экономики Республики Казахстан от 6 марта 2019 года № 18 «Об утверждении типовой формы Договора о субсидировании и гарантировании в рамках Государственной программы поддержки и развития бизнеса «Дорожная карта бизнеса-2020», форм Договора субсидирования, Договора гарантии, Договора о предоставлении гранта на реализацию новых бизнес-идей, Договора о предоставлении гранта на реализацию индустриально инновационных проектов в рамках бизнес-инкубирования»
    kaz: «Бизнестің жол картасы-2020» бизнесті қолдау мен дамытудың мемлекеттік бағдарламасы шеңберінде субсидиялау және кепілдік беру туралы шарттың үлгілік нысанын, Субсидиялау шартының, Кепілдік шартының, Жаңа бизнес-идеяларды іске асыруға грант беру туралы шарттың, Бизнес-инкубациялау шеңберінде индустриялық-инновациялық жобаларды іске асыруға грант беру туралы шарттың нысандарын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 6 наурыздағы № 18 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/132058/rus
