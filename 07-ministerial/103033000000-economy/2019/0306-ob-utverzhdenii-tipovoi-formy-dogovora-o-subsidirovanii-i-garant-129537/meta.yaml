act_code: '129537'
requisite: Приказ Министра национальной экономики Республики Казахстан от 6 марта 2019 года № 18. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 марта 2019 года № 18377. Утратил силу приказом Министра национальной экономики Республики Казахстан от 29 января 2020 года № 5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении типовой формы Договора о субсидировании и гарантировании в рамках Государственной программы поддержки и развития бизнеса «Дорожная карта бизнеса-2020», форм Договора субсидирования, Договора гарантии, Договора о предоставлении гранта на реализацию новых бизнес-идей, Договора о предоставлении гранта на реализацию индустриально-инновационных проектов в рамках бизнес-инкубирования
  kaz: «Бизнестің жол картасы-2020» бизнесті қолдау мен дамытудың мемлекеттік бағдарламасы шеңберінде субсидиялау және кепілдік беру туралы шарттың үлгілік нысанын, Субсидиялау шартының, Кепілдік шартының, Жаңа бизнес-идеяларды іске асыруға грант беру туралы шарттың, Бизнес-инкубациялау шеңберінде индустриялық-инновациялық жобаларды іске асыруға грант беру туралы шарттың нысандарын бекіту туралы
