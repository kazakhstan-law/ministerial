act_code: '129306'
requisite: Приказ Министра национальной экономики Республики Казахстан от 14 февраля 2019 года № 14. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2019 года № 18328. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 2 июня 2025 года № 48 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил разработки, утверждения планов развития контролируемых государством акционерных обществ и товариществ с ограниченной ответственностью, государственных предприятий, мониторинга и оценки их реализации, а также разработки и представления отчетов по их исполнению
  kaz: Мемлекет бақылайтын акционерлік қоғамдар мен жауапкершілігі шектеулі серіктестіктердің, мемлекеттік кәсіпорындардың даму жоспарларын әзірлеу, бекіту, олардың іске асырылуын мониторингілеу және бағалау, сондай-ақ олардың орындалуы жөніндегі есептерді әзірлеу және ұсыну қағидаларын бекіту туралы
