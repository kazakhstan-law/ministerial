  requisite: Приказ Министра национальной экономики Республики Казахстан от 27 апреля 2020 года № 31. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 апреля 2020 года № 20504. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 2 июня 2025 года № 48 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении дополнения в приказ Министра национальной экономики Республики Казахстан от 14 февраля 2019 года № 14 «Об утверждении Правил разработки, утверждения планов развития контролируемых государством акционерных обществ и товариществ с ограниченной ответственностью, государственных предприятий, мониторинга и оценки их реализации, а также разработки и представления отчетов по их исполнению»
    kaz: «Мемлекет бақылайтын акционерлік қоғамдар мен жауапкершілігі шектеулі серіктестіктердің, мемлекеттік кәсіпорындардың даму жоспарларын әзірлеу, бекіту, олардың іске асырылуын мониторингілеу және бағалау, сондай-ақ олардың орындалуы жөніндегі есептерді әзірлеу және ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 14 ақпандағы № 14 бұйрығына толықтыру енгізу туралы
