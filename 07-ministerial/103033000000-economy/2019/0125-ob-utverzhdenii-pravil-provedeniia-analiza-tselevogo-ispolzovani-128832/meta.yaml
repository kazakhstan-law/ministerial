  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 25 января 2019 года № 10 «Об утверждении Правил проведения анализа целевого использования средств банками второго уровня, предоставленных в рамках механизма кредитования приоритетных проектов» и признании утратившим силу приказа Министра национальной экономики Республики Казахстан от 25 декабря 2015 года № 794 «Об утверждении формы Типового кредитного договора, заключаемого между уполномоченной организацией по микрокредитованию и микрофинансовой организацией для микрокредитования субъектов малого предпринимательства в рамках Единой программы поддержки и развития бизнеса «Дорожная карта бизнеса 2020»
    kaz: «Басым жобаларға кредит беру тетігінің шеңберінде ұсынылған қаражатты екінші деңгейдегі банктердің мақсатты пайдалануын талдау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2019 жылғы 25 қаңтардағы № 10 бұйрығына өзгерістер енгізу және «Бизнестің жол картасы 2020» бизнесті қолдау мен дамытудың бірыңғай бағдарламасы шеңберінде шағын кәсіпкерлік субъектілерін микрокредиттеу үшін микрокредит беру жөніндегі уәкілетті ұйым мен микроқаржы ұйымы арасында жасалатын үлгілік кредиттік шарт нысанын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 25 желтоқсандағы № 794 бұйрығының күші жойылды деп тану туралы
