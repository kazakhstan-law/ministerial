  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 25 января 2019 года № 10 «Об утверждении Правил проведения анализа целевого использования средств банками второго уровня, предоставленных в рамках механизма кредитования приоритетных проектов»
    kaz: «Басым жобаларға кредит беру тетігінің шеңберінде ұсынылған қаражатты екінші деңгейдегі банктердің мақсатты пайдалануын талдау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2019 жылғы 25 қаңтардағы № 10 бұйрығына өзгеріс енгізу туралы
