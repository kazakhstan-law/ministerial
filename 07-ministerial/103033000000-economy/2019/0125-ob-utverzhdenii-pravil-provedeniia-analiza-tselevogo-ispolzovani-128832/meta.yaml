requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 25 января 2019 года № 10. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 января 2019 года № 18237. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 20 января 2025 года № 3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения анализа целевого использования средств банками второго уровня, предоставленных в рамках механизма кредитования приоритетных проектов
