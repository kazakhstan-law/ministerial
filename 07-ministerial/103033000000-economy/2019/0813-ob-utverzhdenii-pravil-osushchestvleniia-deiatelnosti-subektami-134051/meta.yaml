  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 13 августа 2019 года № 73 «Об утверждении Правил осуществления деятельности субъектами естественных монополий» и в приказ Министра национальной экономики Республики Казахстан от 5 января 2021 года № 2 «Об утверждении типовых форм технических условий на подключение к инженерным сетям»
    kaz: «Табиғи монополиялар субъектілерінің қызметін жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 13 тамыздағы № 73 бұйрығына және «Инженерлік желілерге қосуға арналған техникалық шарттардың үлгілік нысандарын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2021 жылғы 5 қаңтардағы № 2 бұйрығына өзгерістер енгізу туралы
