  title:
    rus: О внесении изменений в приказы Министра национальной экономики Республики Казахстан от 13 августа 2019 года № 73 «Об утверждении Правил осуществления деятельности субъектами естественных монополий» и от 6 января 2021 года № 3 «Об утверждении типовых регламентов оказания услуг с четким порядком действий сотрудников субъектов естественных монополий»
    kaz: Қазақстан Республикасы Ұлттық экономика министрінің «Табиғи монополиялар субъектілерінің қызметін жүзеге асыру қағидаларын бекіту туралы» 2019 жылғы 13 тамыздағы № 73 және «Табиғи монополиялар субъектілері қызметкерлерінің нақты іс-қимыл тәртібі бар қызметтер көрсетудің үлгілік регламенттерін бекіту туралы» 2021 жылғы 6 қаңтардағы № 3 бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/170287/rus
