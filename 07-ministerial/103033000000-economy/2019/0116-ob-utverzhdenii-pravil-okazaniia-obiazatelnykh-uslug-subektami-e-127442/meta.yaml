title:
  rus: Об утверждении Правил оказания обязательных услуг субъектами естественных монополий и квазигосударственного сектора в рамках защиты конкуренции и ограничения монополистической деятельности
  kaz: Бәсекелестікті қорғау және монополистік қызметті шектеу шеңберінде табиғи монополиялар және квазимемлекеттік сектор субъектілерінің міндетті қызметтерді көрсету қағидаларын бекіту туралы
