  title:
    rus: Об утверждении перечня обязательных услуг, оказываемых субъектами естественных монополий и квазигосударственного сектора, в рамках защиты конкуренции и ограничения монополистической деятельности и о внесении изменений и дополнения в приказ Министра национальной экономики Республики Казахстан от 16 января 2019 года № 6 «Об утверждении Правил оказания обязательных услуг субъектами естественных монополий и квазигосударственного сектора в рамках защиты конкуренции и ограничения монополистической деятельности»
    kaz: Бәсекелестікті қорғау және монополистік қызметті шектеу шеңберінде табиғи монополиялар және квазимемлекеттік сектор субъектілері көрсететін міндетті қызметтер тізбесін бекіту туралы және «Бәсекелестікті қорғау және монополистік қызметті шектеу шеңберінде табиғи монополиялар және квазимемлекеттік сектор субъектілерінің міндетті қызметтерді көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 16 қаңтардағы № 6 бұйрығына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/183919/rus
