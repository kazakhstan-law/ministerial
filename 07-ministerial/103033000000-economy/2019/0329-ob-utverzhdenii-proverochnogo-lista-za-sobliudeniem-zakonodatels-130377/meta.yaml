  title:
    rus: О внесении изменений и дополнений в приказ Министра национальной экономики Республики Казахстан от 29 марта 2019 года № 22 «Об утверждении критериев оценки степени риска и проверочного листа за соблюдением законодательства Республики Казахстан о рекламе»
    kaz: «Қазақстан Республикасының жарнама туралы заңнамасының сақталуына тәуекел дәрежесін бағалау өлшемшарттары мен тексеру парағын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 29 наурыздағы № 22 бұйрығына өзгерістер мен толықтырулар енгізу туралы
