  title:
    rus: О внесении изменения в приказ заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 30 сентября 2024 года № 80 «О внесении изменений и дополнений в приказ Министра национальной экономики Республики Казахстан от 19 ноября 2019 года № 90 «Об утверждении Правил формирования тарифов»
    kaz: «Тарифтерді қалыптастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 19 қарашадағы № 90 бұйрығына өзгерістер мен толықтырулар енгізу туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Ұлттық экономика министрінің 2024 жылғы 30 қыркүйектегі № 80 бұйрығына өзгеріс енгізу туралы
