  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 2 июля 2019 года № 60 «Об утверждении Требований к разработке  или корректировке заключения центрального уполномоченного органа по государственному планированию для предоставления государственных гарантий по поддержке экспорта»
    kaz: «Экспортты қолдау бойынша мемлекеттік кепілдіктер беру үшін мемлекеттік жоспарлау жөніндегі орталық уәкілетті органның қорытындысын әзірлеуге немесе түзетуге қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 2 шілдедегі № 60 бұйрығына өзгерістер енгізу туралы
