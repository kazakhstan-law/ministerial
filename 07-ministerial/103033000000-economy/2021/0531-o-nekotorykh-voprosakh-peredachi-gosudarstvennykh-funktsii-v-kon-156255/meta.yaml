  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 31 мая 2021 года № 55 «О некоторых вопросах передачи государственных функций в конкурентную среду» и приказ Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 9 апреля 2026 года № 24 «О внесении изменений и дополнения в приказ Министра национальной экономики Республики Казахстан от 31 мая 2021 года № 55 «О некоторых вопросах передачи государственных функций в конкурентную среду»
    kaz: «Мемлекеттік функцияларды бәсекелес ортаға берудің кейбір мәселелері туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2021 жылғы 31 мамырдағы № 55 бұйрығына және «Мемлекеттік функцияларды бәсекелес ортаға берудің кейбір мәселелері туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2021 жылғы 31 мамырдағы № 55 бұйрығына өзгерістер мен толықтыру енгізу туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Ұлттық экономика министрінің 2026 жылғы 9 сәуірдегі № 24 бұйрығына өзгерістер енгізу туралы
