  title:
    rus: О внесении изменения в приказ Министра национальной экономики Республики Казахстан от 1 октября 2021 года № 89 «Об утверждении Правил определения стоимости исследований, консалтинговых услуг и государственного задания Министерства национальной экономики Республики Казахстан»
    kaz: «Қазақстан Республикасының Ұлттық экономика министрлігі зерттеулерінің, консалтингтік көрсетілетін қызметтері мен мемлекеттік тапсырмасының құнын айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2021 жылғы 1 қазандағы № 89 бұйрығына өзгеріс енгізу туралы
