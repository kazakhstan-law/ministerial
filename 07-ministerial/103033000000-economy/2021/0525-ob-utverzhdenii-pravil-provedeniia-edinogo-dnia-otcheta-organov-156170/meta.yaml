act_code: '156170'
requisite: Приказ Министра национальной экономики Республики Казахстан от 25 мая 2021 года № 53. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 мая 2021 года № 22839
title:
  rus: Об утверждении Правил проведения Единого дня отчета органов контроля и надзора, за исключением Национального Банка Республики Казахстан и уполномоченного органа по регулированию, контролю и надзору финансового рынка и финансовых организаций
  kaz: Қазақстан Республикасының Ұлттық Банкі мен қаржы нарығын және қаржы ұйымдарын реттеу, бақылау мен қадағалау жөніндегі уәкілетті органды қоспағанда, бақылау және қадағалау органдарының Бірыңғай есеп беру күнін өткізу қағидаларын бекіту туралы
