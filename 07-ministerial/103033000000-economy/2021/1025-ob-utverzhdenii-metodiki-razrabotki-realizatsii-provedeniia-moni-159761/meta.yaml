  requisite: Приказ Министра национальной экономики Республики Казахстан от 17 марта 2023 года № 36. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 марта 2023 года № 32097. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 4 марта 2026 года № 15 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в приказ Министра национальной экономики Республики Казахстан от 25 октября 2021 года № 93 «Об утверждении Методики разработки, мониторинга, реализации, оценки и контроля Национального плана развития Республики Казахстан, Плана территориального развития страны, концепций, планов развития государственных органов, планов развития области, города республиканского значения, столицы»
    kaz: «Қазақстан Республикасының Ұлттық даму жоспарын, Елдің аумақтық даму жоспарын, тұжырымдамаларды, мемлекеттік органдардың даму жоспарларын, облыстың, республикалық маңызы бар қаланың, астананың даму жоспарларын әзірлеу, мониторингтеу, іске асыру, бағалау және бақылау әдістемесін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2021 жылғы 25 қазандағы № 93 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/179151/rus
