act_code: '159761'
requisite: Приказ Министра национальной экономики Республики Казахстан от 25 октября 2021 года № 93. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 октября 2021 года № 24908. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 4 марта 2026 года № 15 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики разработки, реализации, проведения мониторинга и корректировки Национального плана развития Республики Казахстан, планов развития государственных органов, планов развития областей, городов республиканского значения, столицы
  kaz: Қазақстан Республикасының Ұлттық даму жоспарын, мемлекеттік органдардың даму жоспарларын, облыстардың, республикалық маңызы бар қалалардың, астананың даму жоспарларын әзірлеу, іске асыру, мониторингін жүргізу және түзету әдістемесін бекіту туралы
