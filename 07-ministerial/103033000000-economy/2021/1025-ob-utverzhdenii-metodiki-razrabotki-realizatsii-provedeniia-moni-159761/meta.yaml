  requisite: Приказ Министра национальной экономики Республики Казахстан от 25 июля 2023 года № 142. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 июля 2023 года № 33176. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 4 марта 2026 года № 15 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказы Министра национальной экономики Республики Казахстан от 25 октября 2021 года № 93 «Об утверждении Методики разработки, мониторинга, реализации, оценки и контроля Национального плана развития Республики Казахстан, Плана территориального развития страны, концепции развития отрасли/сферы, планов развития государственных органов, планов развития области, города республиканского значения, столицы» и от 3 сентября 2021 года № 83 «Об утверждении Правил разработки доктрин (стратегий), государственных программ, комплексных планов, дорожных карт»
    kaz: Қазақстан Республикасы Ұлттық экономика министрінің «Қазақстан Республикасының Ұлттық даму жоспарын, Елдің аумақтық даму жоспарын, тұжырымдамаларды, мемлекеттік органдардың даму жоспарларын, облыстың, республикалық маңызы бар қаланың, астананың даму жоспарларын әзірлеу, мониторингтеу, іске асыру, бағалау және бақылау әдістемесін бекіту туралы» 2021 жылғы 25 қазандағы № 93 және «Доктриналарды (стратегияларды), мемлекеттік бағдарламаларды, кешенді жоспарларды, жол карталарын әзірлеу қағидаларын бекіту туралы» 2021 жылғы 3 қыркүйектегі № 83 бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/184402/rus
