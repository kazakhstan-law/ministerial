  requisite: Приказ Министра национальной экономики Республики Казахстан от 6 апреля 2022 года № 32. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 апреля 2022 года № 27487. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 4 марта 2026 года № 15 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в приказ Министра национальной экономики Республики Казахстан от 25 октября 2021 года № 93 «Об утверждении Методики разработки, мониторинга, реализации, оценки и контроля Национального плана развития Республики Казахстан, Плана территориального развития страны, концепции развития отрасли/сферы, планов развития государственных органов, планов развития области, города республиканского значения, столицы»
    kaz: «Қазақстан Республикасының Ұлттық даму жоспарын, Елдің аумақтық даму жоспарын, саланы/аяны дамыту тұжырымдамасын, мемлекеттік органдардың даму жоспарларын, облыстың, республикалық маңызы бар қаланың, астананың даму жоспарларын әзірлеу, мониторингтеу,іске асыру, бағалау және бақылау әдістемесін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2021 жылғы 25 қазандағы № 93 бұйрығына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/166215/rus
