title:
  rus: Об утверждении типовых регламентов оказания услуг с четким порядком действий сотрудников субъектов естественных монополий
  kaz: Табиғи монополиялар субъектілері қызметкерлерінің нақты іс-қимыл тәртібі бар қызметтер көрсетудің үлгілік регламенттерін бекіту туралы
