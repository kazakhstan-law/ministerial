  title:
    rus: О внесении изменений в приказы Министра национальной экономики Республики Казахстан от 24 июня 2019 года № 58 «Об утверждении типовых договоров предоставления регулируемых услуг» и от 6 января 2021 года № 3 «Об утверждении типовых регламентов оказания услуг с четким порядком действий сотрудников субъектов естественных монополий»
    kaz: Қазақстан Республикасы Ұлттық экономика министрінің «Реттеліп көрсетілетін қызметтерді ұсынудың үлгілік шарттарын бекіту туралы» 2019 жылғы 24 маусымдағы № 58 және «Табиғи монополиялар субъектілері қызметкерлерінің нақты іс-қимыл тәртібі бар қызметтер көрсетудің үлгілік регламенттерін бекіту туралы» 2021 жылғы 6 қаңтардағы № 3 бұйрықтарына өзгерістер енгізу туралы
