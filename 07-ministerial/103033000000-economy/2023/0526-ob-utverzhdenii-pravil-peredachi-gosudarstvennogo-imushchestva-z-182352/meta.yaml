  title:
    rus: О внесении изменений и дополнения в приказы Министра национальной экономики Республики Казахстан от 16 января 2015 года № 17 «Об утверждении Правил передачи государственного имущества в доверительное управление и Типового договора доверительного управления государственным имуществом» и от 26 мая 2023 года № 85 «Об утверждении Правил передачи государственного имущества, закрепленного за государственными юридическими лицами, из одного вида государственной собственности в другой»
    kaz: Қазақстан Республикасы Ұлттық экономика министрінің «Мемлекеттік мүлікті сенімгерлік басқаруға беру қағидаларын және Мемлекеттік мүлікті сенімгерлік басқарудың үлгілік шартын бекіту туралы» 2015 жылғы 16 қаңтардағы № 17 және «Мемлекеттік заңды тұлғаларға бекітіліп берілген мемлекеттік мүлікті мемлекеттік меншіктің бір түрінен екіншісіне беру қағидаларын бекіту туралы» 2023 жылғы 26 мамырдағы № 85 бұйрықтарына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/201727/rus
