  title:
    rus: О признании утратившими силу приказов Министра национальной экономики Республики Казахстан от 12 мая 2023 года № 63 «Об утверждении критериев оценки степени риска и проверочных листов в области поддержки и защиты субъектов предпринимательства» и Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 18 марта 2024 года № 11 «О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 12 мая 2023 года № 63 «Об утверждении критериев оценки степени риска и проверочных листов в области поддержки и защиты субъектов предпринимательства»
    kaz: «Кәсіпкерлік субъектілерін қолдау және қорғау саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2023 жылғы 12 мамырдағы № 63 және «Кәсіпкерлік субъектілерін қолдау және қорғау саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2023 жылғы 12 мамырдағы № 63 бұйрығына өзгерістер енгізу туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Ұлттық экономика министрінің 2024 жылғы 18 наурыздағы № 11 бұйрықтарының күшін жою туралы
