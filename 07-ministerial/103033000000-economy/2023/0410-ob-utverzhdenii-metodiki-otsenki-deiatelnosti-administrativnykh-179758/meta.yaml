  title:
    rus: О внесении изменения в приказ Министра национальной экономики Республики Казахстан от 10 апреля 2023 года № 106 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства национальной экономики Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық экономика министрлігінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2023 жылғы 10 сәуірдегі № 106 бұйрығына өзгеріс енгізу туралы
