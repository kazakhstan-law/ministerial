  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 25 мая 2023 года № 79 «Об утверждении Правил определения лимита правительственного долга и долга местного исполнительного органа, лимитов предоставления государственных гарантий и поручительств государства»
    kaz: Қазақстан Республикасы Ұлттық экономика министрінің «Үкіметтік борыштың және жергілікті атқарушы орган борышының лимитін, мемлекеттік кепілдіктер мен мемлекет кепілгерліктерін беру лимиттерін айқындау қағидаларын бекіту туралы» 2023 жылғы 25 мамырдағы № 79 бұйрығына өзгерістер енгізу туралы
