title:
  rus: Об утверждении Инструкции по организации антитеррористической защиты Министерства национальной экономики Республики Казахстан и подведомственных объектов, уязвимых в террористическом отношении
  kaz: Қазақстан Республикасы Ұлттық экономика министрлігінің және террористік тұрғыдан осал ведомстволық бағынысты объектілердің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
