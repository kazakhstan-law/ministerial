  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 29 июня 2023 года № 127 «Об утверждении Типового положения об экспертных советах по вопросам предпринимательства и Правил проведения аккредитации, в том числе форма свидетельства об аккредитации, основания и порядок отмены аккредитации объединений субъектов частного предпринимательства и иных некоммерческих организаций»
    kaz: «Кәсіпкерлік мәселелері жөніндегі сараптама кеңестері туралы үлгілік ережені және Жеке кәсіпкерлік субъектілерінің бірлестіктері мен өзге де коммерциялық емес ұйымдарды аккредиттеуден өткізу қағидаларын, оның ішінде аккредиттеу туралы куәліктің нысанын, аккредиттеудің күшін жою негіздері мен тәртібін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2023 жылғы 29 маусымдағы № 127 бұйрығына өзгерістер енгізу туралы
