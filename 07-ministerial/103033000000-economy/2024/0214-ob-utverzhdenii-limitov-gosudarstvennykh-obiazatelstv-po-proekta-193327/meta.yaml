  title:
    rus: О внесении изменения в приказ Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 14 февраля 2024 года № 48 «Об утверждении лимитов государственных обязательств по проектам государственно-частного партнерства, в том числе государственных концессионных обязательств, местных исполнительных органов на 2024-2026 годы»
    kaz: «Жергілікті атқарушы органдардың 2024-2026 жылдарға арналған мемлекеттік-жекешелік әріптестік жобалары бойынша мемлекеттік міндеттемелерінің, оның ішінде мемлекеттік концессиялық міндеттемелерінің лимиттерін бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Ұлттық экономика министрінің 2024 жылғы 14 ақпандағы № 48 бұйрығына өзгеріс енгізу туралы
