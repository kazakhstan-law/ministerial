act_code: '200668'
requisite: Приказ Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 13 сентября 2024 года № 74. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 сентября 2024 года № 35069
title:
  rus: Об утверждении формы полугодового плана проведения периодических проверок, форм актов о назначении, продлении, приостановлении и возобновлении проверок, формы уведомления о продлении срока проверки, форм заключений о результатах периодической, внеплановой проверки и дистанционного контроля в области защиты субъектов предпринимательства
  kaz: Кәсіпкерлік субъектілерін қорғау саласындағы жартыжылдық мерзімдік тексерулер жүргізу жоспарының нысанын, тексерулер тағайындау, ұзарту, тоқтата тұру және қайта бастау туралы актілердің нысандарын, тексеру мерзімін ұзарту туралы хабарламаның нысанын, мерзімдік, жоспардан тыс тексерудің және қашықтан бақылаудың нәтижелері туралы қорытындының нысандарын бекіту туралы
