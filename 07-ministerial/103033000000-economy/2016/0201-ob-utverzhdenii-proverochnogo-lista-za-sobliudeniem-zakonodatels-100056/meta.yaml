  code: '194209'
  requisite: Совместный приказ Министра торговли и интеграции Республики Казахстан от 23 февраля 2024 года № 109-НҚ и Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 7 марта 2024 года № 9. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 марта 2024 года № 34137. Утратил силу совместным приказом и.о. Министра торговли и интеграции Республики Казахстан от 18 ноября 2025 года № 327-НҚ и Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 25 ноября 2025 года № 124 (вводится в действие с 31 декабря 2025)
  title:
    rus: О внесении дополнения в приказ Министра национальной экономики Республики Казахстан от 1 февраля 2016 года № 49 «Об утверждении проверочного листа за соблюдением законодательства Республики Казахстан о регулировании торговой деятельности»
    kaz: «Қазақстан Республикасының сауда қызметін реттеу туралы заңнамасының сақталуына тексеру парағын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 1 ақпандағы № 49 бұйрығына толықтыру енгізу туралы
