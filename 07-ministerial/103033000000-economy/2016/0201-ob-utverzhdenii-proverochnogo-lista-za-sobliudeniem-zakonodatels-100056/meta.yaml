caused_by:
  code: '201369'
  requisite: Совместный приказ и.о. Министра торговли и интеграции Республики Казахстан от 30 сентября 2024 года № 344-НҚ и Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 4 октября 2024 года № 86. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 октября 2024 года № 35212
  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 1 февраля 2016 года № 49 «Об утверждении проверочного листа за соблюдением законодательства Республики Казахстан о регулировании торговой деятельности» и изменений и дополнений в совместный приказ Министра торговли и интеграции Республики Казахстан от 30 июня 2021 года № 439-НҚ и Министра национальной экономики Республики Казахстан от 1 июля 2021 года № 68 «Об утверждении критериев оценки степени риска и проверочного листа за соблюдением законодательства Республики Казахстан о регулировании торговой деятельности в части соблюдения размера торговой надбавки на социально значимые продовольственные товары и вознаграждения»
    kaz: «Қазақстан Республикасының сауда қызметін реттеу туралы заңнамасының сақталуына тексеру парағын бекіту туралы» Қазақстан Республикасының Ұлттық экономика министрінің 2016 жылғы 1 ақпандағы № 49 бұйрығына өзгерістер енгізу және «Әлеуметтік маңызы бар азық-түлік тауарларына сауда үстемесі мен сыйақы мөлшерін сақтау бөлігінде Қазақстан Республикасының сауда қызметін реттеу туралы заңнамасының сақталуының тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2021 жылғы 30 маусымдағы № 439-НҚ және Қазақстан Республикасы Ұлттық экономика министрінің 2021 жылғы 1 шілдедегі № 68 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
