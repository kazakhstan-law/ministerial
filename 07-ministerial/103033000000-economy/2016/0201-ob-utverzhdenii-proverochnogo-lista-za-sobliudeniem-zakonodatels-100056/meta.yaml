  code: '179398'
  requisite: Совместный приказ и.о. Заместителя Премьер-Министра - Министра торговли и интеграции Республики Казахстан от 31 марта 2023 года № 128-НҚ и и.о. Министра национальной экономики Республики Казахстан от 31 марта 2023 года № 43. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 марта 2023 года № 32208. Утратил силу совместным приказом и.о. Министра торговли и интеграции Республики Казахстан от 18 ноября 2025 года № 327-НҚ и Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 25 ноября 2025 года № 124 (вводится в действие с 31 декабря 2025)
  title:
    rus: О внесении изменения в приказ Министра национальной экономики Республики Казахстан от 1 февраля 2016 года № 49 «Об утверждении проверочного листа за соблюдением законодательства Республики Казахстан о регулировании торговой деятельности»
    kaz: «Қазақстан Республикасының сауда қызметін реттеу туралы заңнамасының сақталуына тексеру парағын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 1 ақпандағы № 49 бұйрығына өзгеріс енгізу туралы
