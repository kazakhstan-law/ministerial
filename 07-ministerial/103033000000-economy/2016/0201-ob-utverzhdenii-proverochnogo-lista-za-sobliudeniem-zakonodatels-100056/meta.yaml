act_code: '100056'
requisite: Приказ Министра национальной экономики Республики Казахстан от 1 февраля 2016 года № 49. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 марта 2016 года № 13417. Утратил силу совместным приказом и.о. Министра торговли и интеграции Республики Казахстан от 18 ноября 2025 года № 327-НҚ и Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 25 ноября 2025 года № 124 (вводится в действие с 31 декабря 2025)
title:
  rus: Об утверждении проверочного листа за соблюдением законодательства Республики Казахстан о регулировании торговой деятельности в части размера предельно допустимых розничных цен на социально значимые продовольственные товары
  kaz: Әлеуметтік маңызы бар азық-түлік тауарларына шекті жол берілетін бөлшек сауда бағаларының мөлшері бөлігінде Қазақстан Республикасының сауда қызметін реттеу туралы заңнамасының сақталуын тексеру парағын бекіту туралы
