act_code: '107269'
requisite: Приказ Министра национальной экономики Республики Казахстан от 29 сентября 2016 года № 430. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 октября 2016 года № 14375. Утратил силу приказом Министра национальной экономики Республики Казахстан от 28 марта 2022 года № 25 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки эффективности реализации мер государственной поддержки индустриально-инновационной деятельности, осуществляемых государственными органами, местными исполнительными органами областей, городов республиканского значения, столицы, а также субъектами индустриально-инновационной системы, осуществляющими поддержку индустриально-инновационной деятельности
  kaz: Мемлекеттік органдар, облыстардың, республикалық маңызы бар қалалардың, астананың жергілікті атқарушы органдары, сондай-ақ индустриялық-инновациялық қызметті қолдауды жүзеге асыратын индустриялық-инновациялық жүйе субъектілері жүзеге асыратын индустриялық-инновациялық қызметті мемлекеттік қолдау шараларының іске асырылу тиімділігін бағалау әдістемесін бекіту туралы
