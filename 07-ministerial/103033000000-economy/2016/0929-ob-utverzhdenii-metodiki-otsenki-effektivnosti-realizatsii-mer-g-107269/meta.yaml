  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 29 сентября 2016 года № 430 «Об утверждении Методики оценки эффективности реализации мер государственной поддержки индустриально-инновационной деятельности, осуществляемых государственными органами, местными исполнительными органами областей, городов республиканского значения, столицы, а также субъектами индустриально-инновационной системы, осуществляющими поддержку индустриально-инновационной деятельности»
    kaz: «Мемлекеттік органдар, облыстардың, республикалық маңызы бар қалалардың, астананың жергілікті атқарушы органдары, сондай-ақ индустриялық-инновациялық қызметті қолдауды жүзеге асыратын индустриялық-инновациялық жүйе субъектілері жүзеге асыратын индустриялық-инновациялық қызметті мемлекеттік қолдау шараларының іске асырылу тиімділігін бағалау әдістемесін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 29 қыркүйектегі № 430 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/121897/rus
