title:
  rus: Об утверждении стандарта государственной услуги «Приобретение прав на земельные участки, которые находятся в государственной собственности, не требующее проведения торгов (конкурсов, аукционов)»
  kaz: «Сауда-саттықты (конкурстарды, аукциондарды) өткізуді талап етпейтін мемлекет меншігіндегі жер учаскелеріне құқықтарды алу» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
