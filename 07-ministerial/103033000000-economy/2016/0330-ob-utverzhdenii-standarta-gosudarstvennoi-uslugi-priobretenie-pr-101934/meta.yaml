requisite: Приказ Министра национальной экономики Республики Казахстан от 30 марта 2016 года № 151. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 апреля 2016 года № 13652. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 1 октября 2020 года № 301 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Приобретение прав на земельные участки, которые находятся в государственной собственности, не требующее проведения торгов (конкурсов, аукционов)»
  kaz: «Сауда-саттықты (конкурстарды, аукциондарды) өткізуді талап етпейтін мемлекет меншігіндегі жер учаскелеріне құқықтарды алу» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
