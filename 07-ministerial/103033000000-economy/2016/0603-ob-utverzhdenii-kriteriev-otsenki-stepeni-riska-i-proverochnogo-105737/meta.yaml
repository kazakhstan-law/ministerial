title:
  rus: Об утверждении критериев оценки степени риска и проверочного листа в области архитектуры, градостроительства и строительства за деятельностью местных исполнительных органов по делам архитектуры, градостроительства, строительства и государственного архитектурно-строительного контроля и надзора
  kaz: Сәулет, қала құрылысы, құрылыс және мемлекеттік сәулет-құрылыс бақылау және қадағалау істері жөніндегі жергілікті атқарушы органдардың сәулет, қала құрылысы және құрылыс қызметі саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы
