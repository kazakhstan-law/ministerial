act_code: '101625'
requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 17 марта 2016 года № 137. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 апреля 2016 года № 13610. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 4 февраля 2021 года № 44 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
