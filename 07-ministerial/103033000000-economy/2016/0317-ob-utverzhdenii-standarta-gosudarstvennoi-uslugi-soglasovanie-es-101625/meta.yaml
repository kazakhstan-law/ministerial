  requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 28 июня 2019 года № 453. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 июля 2019 года № 18951. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 4 февраля 2021 года № 44 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 27 марта 2015 года № 257 «Об утверждении стандартов государственных услуг «Выдача справки по определению адреса объектов недвижимости на территории Республики Казахстан», «Предоставление исходных материалов при разработке проектов строительства и реконструкции (перепланировки и переоборудования)» и «Выдача решения на реконструкцию (перепланировку, переоборудование) помещений (отдельных частей) существующих зданий, не связанных с изменением несущих и ограждающих конструкций, инженерных систем и оборудования» и в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 17 марта 2016 года № 137 «Об утверждении стандарта государственной услуги «Согласование эскиза (эскизного проекта)»
    kaz: «Қазақстан Республикасының аумағында жылжымайтын мүлік объектілерінің мекенжайын айқындау жөнінде анықтама беру», «Құрылыс және реконструкция (қайта жоспарлау, қайта жабдықтау) жобаларын әзірлеу кезінде бастапқы материалдарды ұсыну» және «Тіреу және қоршау конструкцияларын, инженерлік жүйелер мен жабдықтарды өзгертуге байланысты емес қолданыстағы ғимараттардың үй-жайларын (жекелеген бөліктерін) реконструкциялауға (қайта жоспарлауға, қайта жабдықтауға) шешім беру» мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 27 наурыздағы № 257 бұйрығы мен «Эскизді (эскиздік жобаны) келісуден өткізу» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2016 жылғы 17 наурыздағы № 137 бұйрығына өзгерістер енгізу туралы
