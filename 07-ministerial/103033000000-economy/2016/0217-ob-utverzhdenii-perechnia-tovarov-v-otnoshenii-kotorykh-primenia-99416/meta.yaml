  title:
    rus: О внесении изменения в приказ Министра национальной экономики Республики Казахстан от 17 февраля 2016 года № 81 «Об утверждении Перечня товаров, в отношении которых применяются вывозные таможенные пошлины, размера ставок и срока их действия и Правил расчета размера ставок вывозных таможенных пошлин на сырую нефть и товары, выработанные из нефти» и признании утратившим силу приказа Министра торговли и интеграции Республики Казахстан от 3 апреля 2020 года № 65-НҚ «О приостановлении некоторых норм приказа Министра национальной экономики Республики Казахстан от 17 февраля 2016 года № 81 «Об утверждении Перечня товаров, в отношении которых применяются вывозные таможенные пошлины, размера ставок и срока их действия и Правил расчета размера ставок вывозных таможенных пошлин на сырую нефть и товары, выработанные из нефти»
    kaz: «Әкету кедендік бажы қолданылатын тауарлар тізбесін, мөлшерлемелер көлемін және олардың қолданылу мерзімін және Шикі мұнай мен мұнайдан өндірілген тауарларға әкету кедендік бажы мөлшерлемелерінің көлемін есептеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 17 ақпандағы № 81 бұйрығына өзгеріс енгізу туралы және «Әкету кедендік бажы қолданылатын тауарлар тізбесін, мөлшерлемелер көлемін және олардың қолданылу мерзімін және Шикі мұнай мен мұнайдан өндірілген тауарларға әкету кедендік бажы мөлшерлемелерінің көлемін есептеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 17 ақпандағы № 81 бұйрығының кейбір нормаларының қолданылуын тоқтата тұру туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2020 жылғы 3 сәуірдегі № 65-НҚ бұйрығының күші жойылды деп тану туралы
