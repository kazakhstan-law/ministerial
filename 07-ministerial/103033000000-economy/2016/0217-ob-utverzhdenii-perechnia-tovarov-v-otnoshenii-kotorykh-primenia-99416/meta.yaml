requisite: Приказ Министра национальной экономики Республики Казахстан от 17 февраля 2016 года № 81. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 февраля 2016 года № 13217. Утратил силу приказом Министра торговли и интеграции Республики Казахстан от 29 июля 2026 года № 228-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официально опубликования)
title:
  rus: Об утверждении Перечня товаров, в отношении которых применяются вывозные таможенные пошлины, размера ставок и срока их действия и Правил расчета размера ставок вывозных таможенных пошлин на сырую нефть и нефтепродукты
  kaz: Әкету кедендік бажы қолданылатын тауарлар тізбесін, мөлшерлемелер көлемін және олардың қолданылу мерзімін және Шикі мұнай мен мұнай өнімдеріне әкету кедендік бажы мөлшерлемелерінің көлемін есептеу қағидаларын бекіту туралы
