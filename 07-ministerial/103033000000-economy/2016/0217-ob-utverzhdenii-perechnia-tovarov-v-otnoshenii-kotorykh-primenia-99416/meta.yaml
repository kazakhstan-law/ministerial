  title:
    rus: О приостановлении некоторых норм приказа Министра национальной экономики Республики Казахстан от 17 февраля 2016 года № 81 «Об утверждении Перечня товаров, в отношении которых применяются вывозные таможенные пошлины, размера ставок и срока их действия и Правил расчета размера ставок вывозных таможенных пошлин на сырую нефть и товары, выработанные из нефти»
    kaz: «Әкету кедендік бажы қолданылатын тауарлар тізбесін, мөлшерлемелер көлемін және олардың қолданылу мерзімін және Шикі мұнай мен мұнайдан өндірілген тауарларға әкету кедендік бажы мөлшерлемелерінің көлемін есептеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 17 ақпандағы № 81 бұйрығының кейбір нормаларының қолданылуын тоқтата тұру туралы
  link: https://zan.gov.kz/client/#!/doc/141296/rus
