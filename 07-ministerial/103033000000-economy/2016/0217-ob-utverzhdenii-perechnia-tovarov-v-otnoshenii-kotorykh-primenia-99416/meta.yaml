  requisite: Приказ Министра национальной экономики Республики Казахстан от 30 января 2017 года № 27. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 февраля 2017 года № 14829. Утратил силу приказом Министра торговли и интеграции Республики Казахстан от 29 июля 2026 года № 228-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официально опубликования)
  title:
    rus: О внесении изменений в приказы исполняющего обязанности Министра национальной экономики Республики Казахстан от 30 марта 2015 года № 279 «Об утверждении Правил предоставления тарифных льгот и Перечня товаров, в отношении которых предоставляются тарифные льготы» и Министра национальной экономики Республики Казахстан от 17 февраля 2016 года № 81 «Об утверждении Перечня товаров, в отношении которых применяются вывозные таможенные пошлины, размер ставок и срок их действия и Правил расчета размера ставок вывозных таможенных пошлин на сырую нефть и товары, выработанные из нефти»
    kaz: «Тарифтік жеңілдіктер беру қағидаларын және тарифтік жеңілдіктер берілетін тауарлардың тізбесін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 30 наурыздағы № 279 және «Әкету кедендік бажы қолданылатын тауарлар тізбесін, мөлшерлемелер көлемін және олардың қолданылу мерзімін және Шикі мұнай мен мұнайдан өндірілген тауарларға әкету кедендік бажы мөлшерлемелерінің көлемін есептеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 17 ақпандағы № 81 бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/109964/rus
