  title:
    rus: О внесении дополнений в приказ Министра национальной экономики Республики Казахстан от 15 марта 2016 года № 134 «Об утверждении Правил ценообразования на товары, работы, услуги, производимые и реализуемые субъектом государственной монополии»
    kaz: «Мемлекеттiк монополия субъектiсi өндiретiн және өткiзетiн тауарларға, жұмыстарға, көрсетілетін қызметтерге баға белгiлеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 15 наурыздағы № 134 бұйрығына толықтырулар енгізу туралы
