  title:
    rus: О внесении изменений и дополнений в приказ Министра национальной экономики Республики Казахстан от 15 марта 2016 года № 134 «Об утверждении Правил ценообразования на товары, работы, услуги, производимые и реализуемые субъектом государственной монополии»
    kaz: «Мемлекеттік монополия субъектісі өндіретін және өткізетін тауарларға, жұмыстарға, көрсетілетін қызметтерге баға белгілеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 15 наурыздағы № 134 бұйрығына өзгерістер мен толықтырулар енгізу туралы
