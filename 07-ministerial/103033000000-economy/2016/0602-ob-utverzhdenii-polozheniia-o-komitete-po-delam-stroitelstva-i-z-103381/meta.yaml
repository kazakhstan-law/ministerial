  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 2 июня 2016 года № 234 «Об утверждении Положения о Комитете по делам строительства и жилищно-коммунального хозяйства Министерства национальной экономики Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық экономика министрлігінің Құрылыс және тұрғын үй-коммуналдық шаруашылық істері комитеті туралы ережені бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2016 жылғы 2 маусымдағы № 234 бұйрығына өзгерістер енгізу туралы
