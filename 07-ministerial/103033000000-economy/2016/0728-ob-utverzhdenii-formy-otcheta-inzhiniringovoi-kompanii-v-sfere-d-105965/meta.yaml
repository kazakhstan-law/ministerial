  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 28 июля 2016 года № 339 «Об утверждении формы отчета инжиниринговой компании в сфере долевого участия в жилищном строительстве о результатах мониторинга за ходом строительства многоквартирного жилого дома»
    kaz: «Тұрғын үй құрылысына үлестік қатысу саласындағы инжинирингтік компанияның көппәтерлі тұрғын үй құрылысының барысын мониторингілеу нәтижелері туралы есеп нысанын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 28 шілдедегі № 339 бұйрығына өзгерістер енгізу туралы
