  title:
    rus: О внесении изменения в приказ Министра национальной экономики Республики Казахстан от 28 июля 2016 года № 339 «Об утверждении формы отчета инжиниринговой компании в сфере долевого участия в жилищном строительстве о результатах мониторинга за ходом строительства жилого дома (жилого здания)»
    kaz: «Тұрғын үй құрылысына үлестік қатысу саласындағы инжинирингтік компанияның тұрғын үйдің (тұрғын ғимараттың) құрылысының барысын мониторингтеу нәтижелері туралы есебінің нысанын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 28 шілдедегі № 339 бұйрығына өзгеріс енгізу туралы
