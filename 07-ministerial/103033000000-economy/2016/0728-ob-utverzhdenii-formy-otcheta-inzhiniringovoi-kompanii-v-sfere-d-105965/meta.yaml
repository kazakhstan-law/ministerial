title:
  rus: Об утверждении формы отчета инжиниринговой компании в сфере долевого участия в жилищном строительстве о результатах мониторинга за ходом строительства многоквартирного жилого дома или комплекса индивидуальных жилых домов
  kaz: Тұрғын үй құрылысына үлестік қатысу саласындағы инжинирингтік компанияның көппәтерлі тұрғын үй немесе жеке тұрғын үйлер кешені құрылысының барысын мониторингілеу нәтижелері туралы есеп нысанын бекіту туралы
