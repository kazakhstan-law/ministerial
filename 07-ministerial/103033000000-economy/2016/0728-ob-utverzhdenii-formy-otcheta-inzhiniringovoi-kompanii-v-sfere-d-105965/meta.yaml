  title:
    rus: О внесении изменений в некоторые приказы Министерства национальной экономики Республики Казахстан в сфере долевого участия в жилищном строительстве
    kaz: Қазақстан Республикасы Ұлттық экономика министрлігінің тұрғын үй құрылысына үлестік қатысу саласындағы кейбір бұйрықтарына өзгерістер енгізу туралы
