requisite: Приказ Министра национальной экономики Республики Казахстан от 5 апреля 2016 года № 76-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 мая 2016 года № 13678. Утратил силу приказом Министра национальной экономики Республики Казахстан от 26 июня 2020 года № 49 (приказ вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
