  title:
    rus: О внесении изменений и дополнения в приказ Министра национальной экономики Республики Казахстан от 30 сентября 2016 года № 432 «Об утверждении Правил рассмотрения документов по проекту строительства жилого дома (жилого здания) для заключения договора о предоставлении гарантии»
    kaz: «Кепілдік беру туралы шартты жасасу үшін тұрғын үй (тұрғын ғимарат) құрылысының жобасы бойынша құжаттарды қарау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 30 қыркүйектегі № 432 бұйрығына өзгерістер мен толықтыру енгізу туралы
