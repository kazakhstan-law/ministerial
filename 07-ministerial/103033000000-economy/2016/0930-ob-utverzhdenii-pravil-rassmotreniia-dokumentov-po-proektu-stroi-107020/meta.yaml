  title:
    rus: О внесении изменений и дополнений в приказы Министра национальной экономики Республики Казахстан от 28 июля 2016 года № 343 «Об утверждении типовой формы договора о предоставлении гарантии» и от 30 сентября 2016 года № 432 «Об утверждении Правил рассмотрения документов по проекту строительства многоквартирного жилого дома или комплекса индивидуальных жилых домов для заключения договора о предоставлении гарантии»
    kaz: «Кепілдік беру туралы шарттың үлгілік нысанын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 28 шілдедегі № 343 және «Кепілдік беру туралы шарт жасасу үшін көппәтерлі тұрғын үй немесе жеке тұрғын үй кешені құрылысының жобасы бойынша құжаттарды қарау қағидаларын бекіту туралы» 2016 жылғы 30 қыркүйектегі № 432 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
