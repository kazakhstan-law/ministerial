title:
  rus: Об утверждении Правил рассмотрения документов по проекту строительства многоквартирного жилого дома или комплекса индивидуальных жилых домов для заключения договора о предоставлении гарантии или договоров в рамках реновации
  kaz: Кепілдік беру туралы шарт немесе реновациялау шеңберінде шарттар жасасу үшін көппәтерлі тұрғын үй немесе жеке тұрғын үйлер кешені құрылысының жобасы бойынша құжаттарды қарау қағидаларын бекіту туралы
