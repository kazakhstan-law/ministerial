  title:
    rus: О внесении изменений и дополнений в приказы Министра национальной экономики Республики Казахстан от 28 июля 2016 года № 338 «Об утверждении Методики определения размера гарантийного взноса» и от 30 сентября 2016 года № 432 «Об утверждении Правил рассмотрения документов по проекту строительства многоквартирного жилого дома для заключения договора о предоставлении гарантии»
    kaz: Қазақстан Республикасы Ұлттық экономика министрінің «Кепілдік жарнаның мөлшерін айқындау әдістемесін бекіту туралы» 2016 жылғы 28 шілдедегі № 338 және «Кепілдік беру туралы шарт жасасу үшін көппәтерлі тұрғын үй құрылысының жобасы бойынша құжаттарды қарау қағидаларын бекіту туралы» 2016 жылғы 30 қыркүйектегі № 432 бұйрықтарға өзгерістер мен толықтырулар енгізу туралы
