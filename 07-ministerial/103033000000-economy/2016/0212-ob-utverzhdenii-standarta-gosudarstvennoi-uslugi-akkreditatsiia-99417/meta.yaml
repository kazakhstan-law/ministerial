act_code: '99417'
requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 12 февраля 2016 года № 75. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 февраля 2016 года № 13211. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 4 февраля 2021 года № 44 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги "Аккредитация негосударственных аттестационных центров по аттестации инженерно-технических работников, участвующих в процессе проектирования и строительства"
  kaz: '"Жобалау және құрылыс салу процесіне қатысушы инженер-техник жұмыскерлерді аттестаттау жөніндегі мемлекеттік емес аттестаттау орталықтарын аккредиттеу" мемлекеттік көрсетілетін қызмет стандартын бекіту туралы'
