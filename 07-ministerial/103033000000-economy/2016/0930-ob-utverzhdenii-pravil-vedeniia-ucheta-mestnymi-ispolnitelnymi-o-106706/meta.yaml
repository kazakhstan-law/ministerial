  title:
    rus: О внесении изменения в приказ Министра национальной экономики Республики Казахстан от 30 сентября 2016 года № 434 «Об утверждении Правил ведения учета местными исполнительными органами договоров о долевом участии в жилищном строительстве, а также договоров о переуступке прав требований по ним»
    kaz: «Жергілікті атқарушы органдардың тұрғын үй құрылысына үлестік қатысу туралы шарттарды, сондай-ақ олар бойынша талап ету құқықтарын басқаға беру туралы шарттарды есепке алуды жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 30 қыркүйектегі № 434 бұйрығына өзгерістер енгізу туралы
