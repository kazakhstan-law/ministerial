  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 30 сентября 2016 года № 434 «Об утверждении Правил ведения учета местными исполнительными органами договоров о долевом участии в жилищном строительстве, а также договоров о переуступке прав требований по ним» и приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 29 августа 2019 года № 678 «Об утверждении Правил ведения единой информационной системы долевого участия в жилищном строительстве»
    kaz: «Жергілікті атқарушы органдардың тұрғын үй құрылысына үлестік қатысу туралы шарттарды, сондай-ақ олар бойынша талап ету құқықтарын басқаға беру туралы шарттарды есепке алуды жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 30 қыркүйектегі № 434 бұйрығына және «Тұрғын үй құрылысына үлестік қатысудың бірыңғай ақпараттық жүйесін жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 29 тамыздағы № 678 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/196051/rus
