title:
  rus: Об утверждении Правил ведения учета местными исполнительными органами договоров о долевом участии в жилищном строительстве и договоров о долевом участии в жилищном строительстве в рамках реновации, а также договоров о переуступке прав требований по ним
  kaz: Жергілікті атқарушы органдардың тұрғын үй құрылысына үлестік қатысу туралы шарттарды және реновациялау шеңберінде тұрғын үй құрылысына үлестік қатысу туралы шарттарды, сондай-ақ олар бойынша талап ету құқықтарын басқаға беру туралы шарттарды есепке алуды жүргізу қағидаларын бекіту туралы
