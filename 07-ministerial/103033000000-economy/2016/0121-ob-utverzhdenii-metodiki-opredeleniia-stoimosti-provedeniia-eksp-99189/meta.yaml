  requisite: Приказ Министра национальной экономики Республики Казахстан от 15 ноября 2022 года № 79. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 ноября 2022 года № 30536. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 23 октября 2025 года № 112 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказы исполняющего обязанности Министра национальной экономики Республики Казахстан от 24 июля 2015 года № 564 «Об утверждении методики определения стоимости услуг по консультативному сопровождению проектов государственно-частного партнерства, в том числе концессионных проектов» и от 21 января 2016 года № 22 «Об утверждении Методики определения стоимости проведения экспертизы и оценки документации по вопросам бюджетных инвестиций, государственно-частного партнерства, в том числе концессий, инвестиционных проектов для предоставления государственных гарантий, и бюджетного кредитования бюджетных инвестиционных проектов, требующих разработки технико-экономического обоснования, и реализации государственной инвестиционной политики финансовыми агентствами за счет средств республиканского бюджета»
    kaz: «Мемлекеттік-жекешелік әріптестік жобаларын, оның ішінде концессиялық жобаларды консультациялық сүйемелдеу бойынша көрсетілетін қызметтер құнын айқындау әдістемесін бекіту туралы» 2015 жылғы 24 шілдедегі № 564 және «Бюджеттік инвестициялар, мемлекеттік-жекешелік әріптестік, оның ішінде концессиялар, мемлекеттік кепілдіктер беру үшін инвестициялық жобалар және техникалық-экономикалық негіздеме әзірлеуді талап ететін бюджеттік инвестициялық жобаларды бюджеттік кредиттеу, қаржы агенттерінің мемлекеттік инвестициялық саясатты іске асыруы мәселелері бойынша республикалық бюджет қаражаты есебінен сараптама жүргізу және құжаттаманы бағалау құнын айқындау әдістемесін бекіту туралы» 2016 жылғы 21 қаңтардағы № 22 Қазақстан Республикасы Ұлттық экономика министрі міндетін атқарушының бұйрықтарына өзгерістер енгізу туралы
