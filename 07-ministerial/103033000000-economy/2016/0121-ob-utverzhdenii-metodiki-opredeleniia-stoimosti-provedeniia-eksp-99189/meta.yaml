  code: '126179'
  requisite: Приказ Министра национальной экономики Республики Казахстан от 25 октября 2018 года № 29. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 ноября 2018 года № 17782. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 23 октября 2025 года № 112 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 21 января 2016 года № 22 «Об утверждении Методики определения стоимости проведения экспертизы и оценки документации по вопросам бюджетных инвестиций, государственно-частного партнерства, в том числе концессий, инвестиционных проектов для предоставления государственных гарантий, и бюджетного кредитования бюджетных инвестиционных проектов, требующих разработки технико-экономического обоснования, и реализации государственной инвестиционной политики финансовыми агентствами за счет средств республиканского бюджета»
    kaz: «Бюджеттік инвестициялар, мемлекеттік-жекешелік әріптестік, оның ішінде концессиялар, мемлекеттік кепілдіктер беру үшін инвестициялық жобалар және техникалық-экономикалық негіздеме әзірлеуді талап ететін бюджеттік инвестициялық жобаларды бюджеттік кредиттеу, қаржы агенттерінің мемлекеттік инвестициялық саясатты іске асыруы мәселелері бойынша республикалық бюджет қаражаты есебінен сараптама жүргізу және құжаттаманы бағалау құнын айқындау әдістемесін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2016 жылғы 21 қаңтардағы № 22 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/126179/rus
