act_code: '99189'
requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 21 января 2016 года № 22. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 февраля 2016 года № 13095. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 23 октября 2025 года № 112 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики определения стоимости проведения экспертизы и оценки документации по вопросам бюджетных инвестиций, государственно-частного партнерства, в том числе концессий, инвестиционных проектов для предоставления государственных гарантий, и бюджетного кредитования бюджетных инвестиционных проектов, требующих разработки технико-экономического обоснования, и реализации государственной инвестиционной политики финансовыми агентствами за счет средств республиканского бюджета
  kaz: Бюджеттік инвестициялар, мемлекеттік-жекешелік әріптестік, оның ішінде концессиялар, мемлекеттік кепілдіктер беру үшін инвестициялық жобалар және техникалық-экономикалық негіздеме әзірлеуді талап ететін бюджеттік инвестициялық жобаларды бюджеттік кредиттеу, қаржы агенттерінің мемлекеттік инвестициялық саясатты іске асыруы мәселелері бойынша республикалық бюджет қаражаты есебінен сараптама жүргізу және құжаттаманы бағалау құнын айқындау әдістемесін бекіту туралы
