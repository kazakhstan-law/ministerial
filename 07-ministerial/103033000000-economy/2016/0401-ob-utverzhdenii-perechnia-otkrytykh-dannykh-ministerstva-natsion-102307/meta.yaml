  title:
    rus: О внесении изменений и дополнений в приказ Министра национальной экономики Республики Казахстан от 1 апреля 2016 года № 162 «Об утверждении Перечня открытых данных Министерства национальной экономики Республики Казахстан, размещаемых на интернет-портале открытых данных»
    kaz: «Ашық деректердің интернет-порталында орналастырылатын Қазақстан Республикасы Ұлттық экономика министрлігінің ашық деректер тізбесін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 1 сәуірдегі № 162 бұйрығына өзгерістер мен толықтырулар енгізу туралы
