  title:
    rus: О внесении изменений и дополнения в приказы Министра национальной экономики Республики Казахстан от 28 июля 2016 года № 340 «Об утверждении типовой формы договора залога голосующих акций (долей участия в уставном капитале) уполномоченной компании» и от 30 сентября 2016 года № 433 «Об утверждении типовой формы договора залога земельного участка вместе с объектом незавершенного строительства
    kaz: Қазақстан Республикасы Ұлттық экономика министрінің «Уәкілетті компанияның дауыс беретін акцияларының (жарғылық капиталға қатысу үлестерінің) кепіл шартының үлгілік нысанын бекіту туралы» 2016 жылғы 28 шілдедегі № 340 және «Құрылысы аяқталмаған объектімен бірге жер учаскесін кепілге қою шартының үлгілік нысанын бекіту туралы» 2016 жылғы 30 қыркүйектегі № 433 бұйрықтарына өзгерістер мен толықтыру енгізу туралы»
