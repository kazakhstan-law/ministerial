act_code: '100212'
requisite: Приказ Министра национальной экономики Республики Казахстан от 3 марта 2016 года № 121. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 марта 2016 года № 13459. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 4 февраля 2021 года № 44 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги "Аккредитация юридических лиц, осуществляющих технический надзор и техническое обследование по объектам первого и второго уровней ответственности"
  kaz: '"Бірінші және екінші жауапкершілік деңгейіндегі объектілер бойынша техникалық қадағалауды және техникалық зерттеп-қарауды жүзеге асыратын заңды тұлғаларды аккредиттеу" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'
