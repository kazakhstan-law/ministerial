act_code: '100221'
requisite: Приказ Министра национальной экономики Республики Казахстан от 2 марта 2016 года № 120. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 марта 2016 года № 13447. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 4 февраля 2021 года № 44 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги "Аккредитация негосударственных аттестационных центров по аттестации инженерно-технических работников, участвующих в процессе проектирования и строительства"
  kaz: '"Жобалау және құрылыс салу процесіне қатысушы инженер-техник жұмыскерлерді аттестаттау жөніндегі мемлекеттік емес аттестаттау орталықтарын акредиттеу" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'
