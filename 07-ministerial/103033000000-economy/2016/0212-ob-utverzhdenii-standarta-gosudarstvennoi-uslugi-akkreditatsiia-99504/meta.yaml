act_code: '99504'
requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 12 февраля 2016 года № 72. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 февраля 2016 года № 13210. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 4 февраля 2021 года № 44 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Аккредитация юридических лиц, осуществляющих технический надзор и техническое обследование по объектам первого и второго уровней ответственности»
  kaz: «Бірінші және екінші жауапкершілік деңгейіндегі объектілер бойынша техникалық қадағалауды және техникалық зерттеп-қарауды жүзеге асыратын заңды тұлғаларды аккредиттеу» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
