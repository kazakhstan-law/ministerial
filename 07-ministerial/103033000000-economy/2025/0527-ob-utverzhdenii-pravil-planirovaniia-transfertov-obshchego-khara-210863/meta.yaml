act_code: '210863'
requisite: Приказ Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 27 мая 2025 года № 40
title:
  rus: Об утверждении Правил планирования трансфертов общего характера, включающий порядок взаимодействия центральных и местных исполнительных органов, других организаций, порядок представления и согласования центральными уполномоченными органами соответствующей отрасли (сферы) и местными исполнительными органами форм, перечней показателей, необходимых для расчета трансфертов общего характера, и порядок проведения мониторинга их использования
  kaz: Орталық және жергілікті атқарушы органдардың, басқа да ұйымдардың өзара іс-қимыл тәртібін, тиісті саланың (аяның) орталық уәкілетті органдарының және жергілікті атқарушы органдардың жалпы сипаттағы трансферттерді есептеу үшін қажетті нысандарды, көрсеткіштер тізбелерін ұсыну және келісу тәртібін және олардың пайдаланылуына мониторинг жүргізу тәртібін қамтитын жалпы сипаттағы трансферттерді жоспарлау қағидаларын бекіту туралы
