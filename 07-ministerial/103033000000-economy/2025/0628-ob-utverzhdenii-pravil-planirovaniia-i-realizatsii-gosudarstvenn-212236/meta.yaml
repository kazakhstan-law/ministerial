  requisite: Приказ Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 28 ноября 2025 года № 127
  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 28 июня 2025 года № 59 «Об утверждении Правил планирования и реализации государственных инвестиционных проектов, разработки или корректировки, проведения необходимых экспертиз инвестиционного предложения, технико-экономического и финансово-экономического обоснований, определения целесообразности бюджетного кредитования, формирования портфеля государственных инвестиционных проектов, а также корректировки утвержденных (уточненных) параметров, отбора, мониторинга и оценки реализации государственных инвестиционных проектов»
    kaz: «Мемлекеттік инвестициялық жобаларды жоспарлау және іске асыру, инвестициялық ұсынысты, техникалық-экономикалық және қаржылық-экономикалық негіздемелерді әзірлеу немесе түзету, қажетті сараптамалар жүргізу, бюджеттік кредиттеудің орындылығын айқындау, мемлекеттік инвестициялық жобалар портфелін қалыптастыру, сондай-ақ мемлекеттік инвестициялық жобалардың бекітілген (нақтыланған) параметрлерін түзету, іріктеу, іске асырылуын мониторингтеу және бағалау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2025 жылғы 28 маусымдағы № 59 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/219355/rus
