act_code: '212236'
requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 28 июня 2025 года № 59
title:
  rus: Об утверждении Правил планирования и реализации государственных инвестиционных проектов, разработки или корректировки, проведения необходимых экспертиз инвестиционного предложения, технико-экономического и финансово-экономического обоснований, определения целесообразности бюджетного кредитования, формирования портфеля государственных инвестиционных проектов, а также корректировки утвержденных (уточненных) параметров, отбора, мониторинга и оценки реализации государственных инвестиционных проектов
  kaz: Мемлекеттік инвестициялық жобаларды жоспарлау және іске асыру, инвестициялық ұсынысты, техникалық-экономикалық және қаржылық-экономикалық негіздемелерді әзірлеу немесе түзету, қажетті сараптамалар жүргізу, бюджеттік кредиттеудің орындылығын айқындау, мемлекеттік инвестициялық жобалар портфелін қалыптастыру, сондай-ақ мемлекеттік инвестициялық жобалардың бекітілген (нақтыланған) параметрлерін түзету, іріктеу, іске асырылуын мониторингтеу және бағалау қағидаларын бекіту туралы
