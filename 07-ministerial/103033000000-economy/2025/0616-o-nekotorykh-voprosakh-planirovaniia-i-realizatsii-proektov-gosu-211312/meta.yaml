  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 16 июня 2025 года № 52 «О некоторых вопросах планирования и реализации проектов государственно-частного партнерства» и приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 25 ноября 2015 года № 713 «Об утверждении Правил приема объектов государственно-частного партнерства в государственную собственность»
    kaz: «Мемлекеттік-жекешелік әріптестік жобаларын жоспарлаудың және іске асырудың кейбір мәселелері туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Ұлттық экономика министрінің 2025 жылғы 16 маусымдағы № 52 бұйрығына және «Мемлекеттік-жекешелік әріптестік объектілерін мемлекеттік меншікке қабылдау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 25 қарашадағы № 713 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/221378/rus
