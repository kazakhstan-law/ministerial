  kaz: Энергетикалық және коммуналдық инфрақұрылымды жаңғырту және салу жобалары бойынша қарыз бойынша сыйақы мөлшерлемесінің бір бөлігін қаржыландыру және (немесе) субсидиялау тетігін айқындау үшін табиғи монополиялар субъектілерінің өтінімдерін қарау қағидаларын бекіту туралы
