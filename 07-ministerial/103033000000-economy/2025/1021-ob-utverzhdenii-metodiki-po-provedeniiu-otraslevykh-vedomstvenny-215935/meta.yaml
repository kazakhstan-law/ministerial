  title:
    rus: О внесении изменений в приказы Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 21 октября 2025 года №111 «Об утверждении Методики по проведению отраслевых (ведомственных) функциональных обзоров деятельности государственных органов» и от 2 апреля 2026 года № 22 «Об утверждении Типовых регламентов акиматов области (города республиканского значения, столицы) и района (города областного значения)»
    kaz: Қазақстан Республикасы Премьер-Министрінің орынбасары – Ұлттық экономика министрінің «Мемлекеттік органдар қызметіне салалық (ведомстволық) функционалдық шолулар жүргізу жөніндегі Әдістемені бекіту туралы» 2025 жылғы 21 қазандағы № 111 және «Облыс (республикалық маңызы бар қала, астана) және аудан (облыстық маңызы бар қала) әкімдіктерінің үлгілік регламенттерін бекіту туралы» 2026 жылғы 2 сәуірдегі №22 бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/227087/rus
