  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 30 апреля 2025 года № 20 «Об утверждении Правил и формы предоставления информации субъектами квазигосударственного сектора об использовании средств чистого дохода, оставшихся после выплаты дивидендов или отчислений в соответствующий бюджет»
