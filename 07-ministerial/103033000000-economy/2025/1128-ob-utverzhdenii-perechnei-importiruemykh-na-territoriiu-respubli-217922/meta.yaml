act_code: '217922'
requisite: Приказ Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 28 ноября 2025 года № 126
title:
  rus: Об утверждении Перечней, импортируемых на территорию Республики Казахстан товаров для целей производства продукции, за исключением товаров, импортируемых с территории государств – членов Евразийского экономического союза, предназначенных для переработки, а также налогоплательщиков Республики Казахстан, импортирующих такие товары
  kaz: Еуразиялық экономикалық одаққа мүше мемлекеттердің аумағынан импортталатын, қайта өңдеуге арналған тауарларды қоспағанда, Қазақстан Республикасының аумағына өнім өндіру мақсатында импортталатын тауарлардың, сондай-ақ осындай тауарларды импорттайтын Қазақстан Республикасы салық төлеушілерінің тізбелерін бекіту туралы
