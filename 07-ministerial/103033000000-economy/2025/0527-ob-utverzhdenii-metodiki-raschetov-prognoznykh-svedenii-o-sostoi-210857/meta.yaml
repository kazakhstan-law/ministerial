act_code: '210857'
requisite: Приказ Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 27 мая 2025 года № 37
title:
  rus: Об утверждении Методики расчетов прогнозных сведений о состоянии государственных финансов и Методики определения лимитов правительственного долга, долга местных исполнительных органов, предоставления государственных гарантий, предоставления государственных гарантий по поддержке экспорта, предоставления государственных гарантий по поддержке частного предпринимательства, государственных обязательств по проектам государственно-частного партнерства Правительства Республики Казахстан, государственных обязательств по проектам государственно-частного партнерства местных исполнительных органов, предоставления поручительств государства, внешнего долга субъектов квазигосударственного сектора, определения критериев и формирования перечня субъектов квазигосударственного сектора, которым предоставлено право привлечения внешних займов
  kaz: Мемлекеттік қаржының жай-күйі туралы болжамды мәліметтерді есептеу әдістемесін және Үкіметтік борыштың, жергілікті атқарушы органдар борышының, мемлекеттік кепілдіктер беру, экспортты қолдау бойынша мемлекеттік кепілдіктер беру, жеке кәсіпкерлікті қолдау бойынша мемлекеттік кепілдіктер беру, Қазақстан Республикасы Үкіметінің мемлекеттік-жекешелік әріптестік жобалары бойынша мемлекеттік міндеттемелерінің, жергілікті атқарушы органдардың мемлекеттік-жекешелік әріптестік жобалары бойынша мемлекеттік міндеттемелерінің, мемлекет кепілгерлігін беру, квазимемлекеттік сектор субъектілерінің сыртқы борышының лимиттерін айқындау, сыртқы қарыздарды тарту құқығы берілген квазимемлекеттік сектор субъектілерінің өлшемшарттарын айқындау және тізбесін қалыптастыру әдістемесін бекіту туралы
