  title:
    rus: О внесении изменений в приказы Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 29 мая 2025 года № 157 «Об утверждении Правил представления заявок на привлечение связанных грантов» и от 24 июня 2025 года № 181 «Об утверждении Правил привлечения, использования, мониторинга и оценки использования несвязанных грантов»
    kaz: Қазақстан Республикасы Премьер-Министрінің орынбасары – Ұлттық экономика министрінің «Байланысты гранттарды тартуға арналған өтінімдерді ұсыну қағидаларын бекіту туралы» 2025 жылғы 29 мамырдағы № 157 және «Байланысты емес гранттарды тарту, пайдалану, пайдаланылуын мониторингтеу және бағалау қағидаларын бекіту туралы» 2025 жылғы 24 маусымдағы № 181 бұйрықтарына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/227011/rus
