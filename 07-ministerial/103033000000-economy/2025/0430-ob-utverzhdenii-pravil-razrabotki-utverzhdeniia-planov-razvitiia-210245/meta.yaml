  title:
    rus: О внесении изменений и дополнений к приказу Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 30 апреля 2025 года № 18 «Об утверждении Правил разработки, утверждения планов развития контролируемых государством акционерных обществ и товариществ с ограниченной ответственностью, государственных предприятий, мониторинга и оценки их реализации, а также разработки и представления отчетов по их исполнению»
    kaz: «Мемлекет бақылайтын акционерлік қоғамдар мен жауапкершілігі шектеулі серіктестіктердің, мемлекеттік кәсіпорындардың даму жоспарларын әзірлеу, бекіту, олардың іске асырылуын мониторингілеу және бағалау, сондай-ақ олардың орындалуы жөніндегі есептерді әзірлеу және ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Ұлттық экономика министрінің 2025 жылғы 30 сәуірдегі № 18 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/221989/rus
