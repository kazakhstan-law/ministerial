requisite: Приказ Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 12 августа 2025 года № 78. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 августа 2025 года № 36613
title:
  rus: Об утверждении Правил субсидирования ставки вознаграждения по займам, получаемым субъектами естественных монополий, а также по государственным ценным бумагам, выпускаемым местными исполнительными органами, по проектам, реализуемым в рамках национального проекта по модернизации энергетического и коммунального секторов
  kaz: Энергетикалық және коммуналдық секторларды жаңғырту жөніндегі ұлттық жоба шеңберінде іске асырылатын жобалар бойынша табиғи монополиялар субъектілері алатын қарыздар, сондай-ақ жергілікті атқарушы органдар шығаратын мемлекеттік бағалы қағаздар бойынша сыйақы мөлшерлемесін субсидиялау қағидаларын бекіту туралы
