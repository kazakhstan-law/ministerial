title:
  rus: Об утверждении Правил формирования отчета по выполнению планов мероприятий или планов развития субъектов квазигосударственного сектора, отчета о результатах мониторинга реализации планов мероприятий или планов развития субъектов квазигосударственного сектора и оценки реализации планов мероприятий или планов развития субъектов квазигосударственного сектора, а также долгосрочных стратегий развития автономных организаций образования, которым планируются расходы из республиканского или местного бюджета
  kaz: Квазимемлекеттік сектор субъектілерінің іс-шаралар жоспарларының немесе даму жоспарларының орындалуы жөніндегі есепті, квазимемлекеттік сектор субъектілерінің іс-шаралар жоспарларының немесе даму жоспарларының іске асырылу мониторингінің нәтижелері туралы есепті және республикалық немесе жергілікті бюджеттен шығыстар жоспарланатын квазимемлекеттік сектор субъектілерінің іс-шаралар жоспарларының немесе даму жоспарларының, сондай-ақ дербес білім беру ұйымдарының ұзақ мерзімді даму стратегияларының іске асырылуын бағалауды қалыптастыру қағидаларын бекіту туралы
