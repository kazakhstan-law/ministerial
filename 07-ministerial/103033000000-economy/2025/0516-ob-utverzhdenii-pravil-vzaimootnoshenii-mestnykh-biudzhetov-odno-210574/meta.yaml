  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра – Министра национальной экономики от 16 мая 2025 года № 29 «Об утверждении Правил взаимоотношений местных бюджетов одного уровня друг с другом по совместному решению вопросов местного значения на территории агломерации, порядка составления и представления отчетности о реализации соглашения о совместном решении вопросов местного значения на территории агломерации и требований к содержанию соглашения о совместном решении вопросов местного значения на территории агломерации»
    kaz: «Агломерация аумағындағы жергілікті маңызы бар мәселелерді бірлесіп шешу бойынша бір деңгейдегі жергілікті бюджеттердің бір-бірімен өзара қарым-қатынас жасау қағидаларын, агломерация аумағындағы жергілікті маңызы бар мәселелерді бірлесіп шешу туралы келісімнің іске асырылуы туралы есептілікті жасау мен ұсыну тәртібін және агломерация аумағындағы жергілікті маңызы бар мәселелерді бірлесіп шешу туралы келісімнің мазмұнына қойылатын талаптарды бекіту туралы» Премьер-Министрдің орынбасары – Ұлттық экономика министрінің 2025 жылғы 16 мамырдағы № 29 бұйрығына өзгерістер енгізу туралы
