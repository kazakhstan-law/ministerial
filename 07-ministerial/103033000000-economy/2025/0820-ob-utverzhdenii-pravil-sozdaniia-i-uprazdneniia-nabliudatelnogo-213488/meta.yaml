title:
  rus: Об утверждении Правил создания и упразднения наблюдательного совета, требования, предъявляемые к лицам, избираемым в состав наблюдательного совета, а также порядок конкурсного отбора членов наблюдательного совета и досрочного прекращения их полномочий
  kaz: Байқау кеңесін құру және тарату тәртібін, байқау кеңесінің құрамына сайланатын адамдарға қойылатын талаптарды, сондай-ақ байқау кеңесінің мүшелерін конкурстық іріктеу және олардың өкілеттіктерін мерзімінен бұрын тоқтату тәртібін бекіту туралы
