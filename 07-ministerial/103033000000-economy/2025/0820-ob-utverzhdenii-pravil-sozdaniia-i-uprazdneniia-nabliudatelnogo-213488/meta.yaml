  title:
    rus: О внесении изменений в приказы Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 29 августа 2025 года № 87 «О некоторых вопросах юридических лиц со стопроцентным участием государства, за исключением Фонда национального благосостояния и единого накопительного пенсионного фонда» и от 20 августа 2025 года № 80 «Об утверждении Правил создания и упразднения наблюдательного совета, требования, предъявляемые к лицам, избираемым в состав наблюдательного совета, а также порядок конкурсного отбора членов наблюдательного совета и досрочного прекращения их полномочий»
    kaz: Қазақстан Республикасы Премьер-Министрінің орынбасары – Ұлттық экономика министрінің «Ұлттық әл-ауқат қорын және бірыңғай жинақтаушы зейнетақы қорын қоспағанда, мемлекет жүз пайыз қатысатын заңды тұлғалардың кейбір мәселелері туралы» 2025 жылғы 29 тамыздағы № 87 және «Байқау кеңесін құру және тарату тәртібін, байқау кеңесінің құрамына сайланатын адамдарға қойылатын талаптарды, сондай-ақ байқау кеңесінің мүшелерін конкурстық іріктеу және олардың өкілеттіктерін мерзімінен бұрын тоқтату тәртібін бекіту туралы» 2025 жылғы 20 тамыздағы № 80 бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/227464/rus
