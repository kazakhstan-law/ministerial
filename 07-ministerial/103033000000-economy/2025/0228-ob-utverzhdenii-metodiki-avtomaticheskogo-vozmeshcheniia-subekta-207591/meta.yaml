act_code: '207591'
requisite: Приказ Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 28 февраля 2025 года № 9. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 марта 2025 года № 35767
title:
  rus: Об утверждении Методики автоматического возмещения субъектам предпринимательства с установленной мощностью электрических установок до 200 кВт путем перерасчета и (или) возврата ранее произведенной суммы за использованную электрическую энергию потребителем в случае превышения энергопередающими организациями среднего показателя количества отключений на одного потребителя за один календарный год и среднего показателя продолжительности отключений на одного потребителя за один календарный год
  kaz: Энергия беруші ұйымдар күнтізбелік бір жылда бір тұтынушыға шаққанда ажырату санының орташа көрсеткішінен және күнтізбелік бір жылда бір тұтынушыға шаққанда ажырату ұзақтығының орташа көрсеткішінен асырған жағдайда тұтынушы пайдаланған электр энергиясы үшін бұрын жүргізілген соманы қайта есептеу және  (немесе) қайтару арқылы электр қондырғыларының белгіленген қуаты 200 кВт-қа дейінгі кәсіпкерлік субъектілеріне автоматты түрде өтеу әдістемесін бекіту туралы
