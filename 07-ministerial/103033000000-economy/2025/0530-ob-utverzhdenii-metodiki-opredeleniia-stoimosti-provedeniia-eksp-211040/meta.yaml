  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 30 мая 2025 года № 46 «Об утверждении Методики определения стоимости проведения экспертизы и оценки документации по вопросам бюджетных инвестиций, государственно-частного партнерства, в том числе концессий, инвестиционных проектов для предоставления государственных гарантий, и бюджетного кредитования бюджетных инвестиционных проектов, требующих разработки технико-экономического обоснования, и реализации государственной инвестиционной политики финансовыми агентствами за счет средств республиканского бюджета»
    kaz: «Бюджеттік инвестициялар, мемлекеттік-жекешелік әріптестік, оның ішінде концессиялар, мемлекеттік кепілдіктер беру үшін инвестициялық жобалар және техникалық-экономикалық негіздеме әзірлеуді талап ететін бюджеттік инвестициялық жобаларды бюджеттік кредиттеу, қаржы агенттерінің мемлекеттік инвестициялық саясатты іске асыруы мәселелері бойынша республикалық бюджет қаражаты есебінен сараптама жүргізу және құжаттаманы бағалау құнын айқындау әдістемесін бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Ұлттық экономика министрінің 2025 жылғы 30 мамырдағы № 46 бұйрығына өзгерістер енгізу туралы
