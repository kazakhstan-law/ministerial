  title:
    rus: О внесении изменений и дополнений в приказ Министра национальной экономики Республики Казахстан от 3 апреля 2015 года № 307 «Об утверждении стандартов государственных услуг в сфере санитарно-эпидемиологического благополучия населения»
    kaz: «Халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 3 сәуірдегі № 307 бұйрығына өзгерістер мен толықтырулар енгізу туралы
