title:
  rus: Об утверждении критериев оценки степени рисков и формы проверочного листа по вопросам проверок за деятельностью местных исполнительных органов по делам архитектуры, градостроительства, строительства и государственного архитектурно-строительного контроля и надзора
  kaz: Сәулет, қала құрылысы, құрылыс және мемлекеттік сәулет-құрылыс бақылауы және қадағалау істері жөніндегі жергілікті атқарушы органдардың тәуекелдер дәрежелерін бағалау критерийлерін және қызметін тексеру мәселелері бойынша тексеру парағының нысанын бекіту туралы
