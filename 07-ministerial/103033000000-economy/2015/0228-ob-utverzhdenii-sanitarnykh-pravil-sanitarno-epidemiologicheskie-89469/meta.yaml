act_code: '89469'
requisite: Приказ Министра национальной экономики Республики Казахстан от 28 февраля 2015 года № 177. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 апреля 2015 года № 10925. Утратил силу приказом Министра здравоохранения Республики Казахстан от 16 июня 2021 года № ҚР ДСМ - 49 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Санитарных правил "Санитарно-эпидемиологические требования к условиям труда и бытового обслуживания при строительстве, реконструкции, ремонте и вводе, эксплуатации объектов строительства"
  kaz: '"Құрылыс объектілерін салу, реконструкциялау, жөндеу және іске қосу, пайдалану кезінде еңбек және тұрмыстық қызмет көрсету жағдайларына қойылатын санитариялық-эпидемиологиялық талаптар" санитариялық қағидаларын бекіту туралы'
