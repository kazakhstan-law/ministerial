requisite: Приказ Министра национальной экономики Республики Казахстан от 9 декабря 2015 года № 759. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 декабря 2015 года № 12420. Утратил силу приказом и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 11 августа 2021 года № 431 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Аккредитация юридических лиц, претендующих на проведение комплексной вневедомственной экспертизы проектов строительства объектов»
  kaz: «Объектілер құрылысының жобаларына ведомстводан тыс кешенді сараптама жүргізуге үміткер заңды тұлғаларды аккредиттеу» мемлекеттік көрсетілетін қызметінің регламентін бекіту туралы
