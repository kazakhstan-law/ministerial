  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 19 марта 2015 года № 232 «Санитарные правила «Санитарно-эпидемиологические требования к объектам в сфере обращения лекарственных средств, изделий медицинского назначения и медицинской техники»
    kaz: «Дәрілік заттардың, медициналық мақсаттағы бұйымдар мен медициналық техниканың айналысы саласындағы объектілерге қойылатын санитариялық-эпидемиологиялық талаптар» санитариялық қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 19 наурыздағы № 232 бұйрығына өзгерістер енгізу туралы
