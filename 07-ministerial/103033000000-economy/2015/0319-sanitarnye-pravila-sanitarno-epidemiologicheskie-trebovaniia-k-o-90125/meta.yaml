title:
  rus: Санитарные правила «Санитарно-эпидемиологические требования к объектам в сфере обращения лекарственных средств и медицинских изделий»
  kaz: «Дәрілік заттар мен медициналық бұйымдардың айналысы саласындағы объектілерге қойылатын санитариялық-эпидемиологиялық талаптар» санитариялық қағидалары
