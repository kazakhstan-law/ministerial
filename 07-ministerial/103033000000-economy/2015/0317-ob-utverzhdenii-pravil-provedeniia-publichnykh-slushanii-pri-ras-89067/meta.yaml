act_code: '89067'
requisite: Приказ Министра национальной экономики Республики Казахстан от 17 марта 2015 года № 219. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 апреля 2015 года № 10742. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения публичных слушаний при рассмотрении заявок на утверждение тарифов (цен, ставок сборов) или их предельных уровней на регулируемые услуги (товары, работы) субъектов естественных монополий, а также проекта цены на товары (работы, услуги) субъекта регулируемого рынка в области электроэнергетики
  kaz: Табиғи монополиялар субъектiлерiнiң реттелiп көрсетілетін қызметтерiне (тауарларына, жұмыстарына) тарифтерді (бағаларды, алымдар мөлшерлемелерін) немесе олардың шекті деңгейлерiн бекiтуге арналған өтiнiмдерді, сондай-ақ электр энергетикасы саласындағы реттелетін нарық субъектісінің тауарларына (жұмыстарына, көрсетілетін қызметтеріне) бағаның жобасын қарау кезiнде жария тыңдаулар өткiзу қағидаларын бекіту туралы
