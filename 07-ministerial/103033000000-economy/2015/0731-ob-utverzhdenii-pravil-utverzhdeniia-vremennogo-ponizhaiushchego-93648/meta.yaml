title:
  rus: Об утверждении Правил утверждения временного понижающего коэффициента к тарифам (ценам, ставкам сборов) на услуги по передаче электрической энергии и (или) технической диспетчеризации отпуска в сеть
  kaz: Электр энергиясын беру және (немесе) желіге босатуды техникалық диспетчерлеу жөніндегі қызмет тарифтеріне (бағаларына, алым ставкаларына) уақытша төмендету коэффициентін бекіту туралы қағидаларын бекіту туралы
