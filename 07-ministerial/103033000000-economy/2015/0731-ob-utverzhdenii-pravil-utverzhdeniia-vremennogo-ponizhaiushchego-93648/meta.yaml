  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 31 июля 2015 года № 581 «Об утверждении Правил утверждения временного понижающего коэффициента к тарифам (ценам, ставкам сборов) на услуги по передаче электрической энергии и (или) технической диспетчеризации отпуска в сеть»
    kaz: «Электр энергиясын беру және (немесе) желіге босатуды техникалық диспетчерлеу жөніндегі қызмет тарифтеріне (бағаларына, алым ставкаларына) уақытша төмендету коэффициентін бекіту туралы қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 31 шілдедегі № 581 бұйрығына өзгеріс енгізу туралы
