    kaz: «Қазақстан Республикасы Ұлттық экономика министрлігі көрсететін мемлекеттік қызметтер стандарттарын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 21 сәуірдегі № 347 бұйрығына өзгерістер енгізу туралы
