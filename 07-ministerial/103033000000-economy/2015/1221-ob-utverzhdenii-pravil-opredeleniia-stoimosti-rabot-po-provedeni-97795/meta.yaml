  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 21 декабря 2015 года № 780 «Об утверждении правил определения стоимости работ по проведению комплексной вневедомственной экспертизы проектов строительства объектов, а также комплексной градостроительной экспертизы проектов градостроительного планирования территорий различного уровня»
    kaz: «Объектілер құрылысының жобаларына ведомстводан тыс кешенді сараптама, сондай-ақ, әртүрлі деңгейдегі аумақтардың қала құрылысын жоспарлау жобаларына кешенді қала құрылысы сараптамасын жүргізу жөніндегі жұмыстардың құнын айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 21 желтоқсандағы № 780 бұйрығына өзгеріс енгізу туралы
