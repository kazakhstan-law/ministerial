requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 21 декабря 2015 года № 780. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2015 года № 12681. Утратил силу приказом и.о. Министра промышленности и строительства Республики Казахстан от 10 апреля 2026 года № 163 (вводится в действие с 1 июля 2026 года)
title:
  rus: Об утверждении правил определения стоимости работ по проведению комплексной вневедомственной экспертизы проектов строительства объектов, а также комплексной градостроительной экспертизы проектов градостроительного планирования территорий различного уровня
  kaz: Объектілер құрылысының жобаларына ведомстводан тыс кешенді сараптама, сондай-ақ әртүрлі деңгейдегі аумақтардың қала құрылысын жоспарлау жобаларына кешенді қала құрылысы сараптамасын жүргізу жөніндегі жұмыстардың құнын айқындау қағидаларын  бекіту туралы
