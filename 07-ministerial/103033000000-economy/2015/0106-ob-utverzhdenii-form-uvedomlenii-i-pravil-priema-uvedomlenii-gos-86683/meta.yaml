title:
  rus: Об утверждении форм уведомлений и Правил приема уведомлений государственными органами, а также об определении государственных органов, осуществляющих прием уведомлений
  kaz: Хабарламалар нысандарын және Мемлекеттік органдардың хабарламаларды қабылдау қағидаларын бекіту туралы, сондай-ақ хабарламаларды қабылдауды жүзеге асыратын мемлекеттік органдарды айқындау туралы
