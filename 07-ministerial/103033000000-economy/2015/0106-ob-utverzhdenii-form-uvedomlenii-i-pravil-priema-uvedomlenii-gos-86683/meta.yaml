  title:
    rus: О внесении изменений в приказы Министра национальной экономики Республики Казахстан от 6 января 2015 года № 3 «Об утверждении форм заявлений для получения и переоформления лицензии и (или) приложения к лицензии, форм лицензий и (или) приложений к лицензиям» и от 6 января 2015 года № 4 «Об утверждении форм уведомлений и Правил приема уведомлений государственными органами, а также об определении государственных органов, осуществляющих прием уведомлений»
    kaz: «Лицензияны және (немесе) лицензияға қосымшаны алуға және қайта ресімдеуге арналған өтініштердің нысандарын, лицензиялардың және (немесе) лицензияларға қосымшалардың нысандарын бекіту туралы» 2015 жылғы 6 қаңтардағы № 3 және «Хабарламалар нысандарын және Мемлекеттік органдардың хабарламаларды қабылдау қағидаларын бекіту туралы, сондай-ақ хабарламаларды қабылдауды жүзеге асыратын мемлекеттік органдарды айқындау туралы» 2015 жылғы 6 қаңтардағы № 4 Қазақстан Республикасы Ұлттық экономика министрінің бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/170529/rus
