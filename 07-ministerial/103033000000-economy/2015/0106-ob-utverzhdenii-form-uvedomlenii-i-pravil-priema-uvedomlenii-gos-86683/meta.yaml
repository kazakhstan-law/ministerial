    kaz: «Хабарламалар нысандарын және мемлекеттік органдардың хабарламаларды қабылдау қағидаларын бекіту туралы, сондай-ақ хабарламаларды қабылдауды жүзеге асыратын мемлекеттік органдарды айқындау туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 6 қаңтардағы № 4 бұйрығына өзгерістер мен толықтырулар енгізу туралы
