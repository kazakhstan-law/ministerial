  title:
    rus: Об утверждении Правил ведения реестра саморегулируемых организаций и о внесении дополнений в приказ Министра национальной экономики Республики Казахстан от 6 января 2015 года № 4 "Об утверждении форм уведомлений и Правил приема уведомлений государственными органами, а также об определении государственных органов, осуществляющих прием уведомлений"
    kaz: Өзін-өзі реттейтін ұйымдардың тізілімін жүргізу қағидаларын бекіту және "Хабарламалар нысандарын және Мемлекеттік органдардың хабарламаларды қабылдау қағидаларын бекіту, сондай-ақ хабарламаларды қабылдауды жүзеге асыратын мемлекеттік органдарды айқындау туралы" Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 6 қаңтардағы № 4 бұйрығына толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/100202/rus
