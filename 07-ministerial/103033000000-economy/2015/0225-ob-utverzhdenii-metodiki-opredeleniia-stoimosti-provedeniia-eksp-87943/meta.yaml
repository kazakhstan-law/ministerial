act_code: '87943'
requisite: Приказ Министра национальной экономики Республики Казахстан от 25 февраля 2015 года № 129. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 марта 2015 года № 10495. Утратил силу приказом и.о. Министра национальной экономики РК от 21.01.2016 № 22
title:
  rus: Об утверждении Методики определения стоимости проведения экспертизы и оценки документации по вопросам бюджетных инвестиций, концессий, инвестиционных проектов для предоставления государственных гарантий, и бюджетного кредитования бюджетных инвестиционных проектов, требующих разработки технико-экономического обоснования, и реализации государственной инвестиционной политики финансовыми агентствами за счет средств республиканского бюджета
  kaz: Бюджеттік инвестициялар, концессиялар және техникалық-экономикалық негіздеме әзірлеуді талап ететін бюджеттік инвестициялық жобаларды бюджеттік кредиттеу, қаржы агенттерінің республикалық бюджет қаражаты есебінен мемлекеттік инвестициялық саясатты іске асыруы мәселелері бойынша сараптама жүргізу мен құжаттаманы бағалау құнын айқындау әдістемесін бекіту туралы
