  requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 2 апреля 2020 года № 122/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 апреля 2020 года № 20353. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 13 марта 2023 года № 90/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 20 июля 2016 года № 319 «Об утверждении Правил об охране, сносе или перезакладке (переносе) геодезических пунктов» и признании утратившими силу структурных элементов некоторых приказов Министерства национальной экономики Республики Казахстан и Министерства сельского хозяйства Республики Казахстан
    kaz: «Геодезиялық пункттерді қорғау, бұзу немесе қайта салу (орнын ауыстыру) туралы қағидаларды бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің 2016 жылғы 20 шілдедегі № 319 бұйрығына өзгерістер енгізу және Қазақстан Республикасы Ұлттық экономика министрлігі мен Қазақстан Республикасы Ауыл шаруашылығы министрлігі бұйрықтарының кейбір құрылымдық элементтерінің күші жойылды деп тану туралы
