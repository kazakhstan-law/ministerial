act_code: '90886'
requisite: Приказ Министра национальной экономики Республики Казахстан от 24 апреля 2015 года № 357. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 июня 2015 года № 11262. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 9 апреля 2020 года № 131/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
