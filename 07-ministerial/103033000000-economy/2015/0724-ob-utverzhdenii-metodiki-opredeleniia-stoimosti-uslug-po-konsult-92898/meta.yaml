  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 24 июля 2015 года № 564 "Об утверждении методики определения стоимости услуг по консультативному сопровождению концессионных проектов"
    kaz: '"Концессиялық жобаларды консультациялық сүйемелдеу бойынша көрсетілетін қызметтер құнын айқындау әдістемесін бекіту туралы" Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 24 шілдедегі № 564 бұйрығына өзгерістер енгізу туралы'
