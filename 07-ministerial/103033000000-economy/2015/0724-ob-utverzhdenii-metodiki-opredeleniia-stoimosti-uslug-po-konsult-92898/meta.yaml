  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 24 июля 2015 года № 564 «Об утверждении методики определения стоимости услуг по консультативному сопровождению проектов государственно-частного партнерства, в том числе концессионных проектов»
    kaz: «Мемлекеттік-жекешелік әріптестік жобаларын, оның ішінде концессиялық жобаларды консультациялық сүйемелдеу бойынша көрсетілетін қызметтер құнын айқындау әдістемесін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 24 шілдедегі № 564 бұйрығына өзгеріс енгізу туралы
