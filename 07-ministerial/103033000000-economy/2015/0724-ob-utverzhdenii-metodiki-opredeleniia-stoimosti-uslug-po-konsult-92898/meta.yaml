title:
  rus: Об утверждении методики определения стоимости услуг по консультативному сопровождению проектов государственно-частного партнерства, в том числе концессионных проектов
  kaz: Мемлекеттік-жекешелік әріптестік жобаларын, оның ішінде концессиялық жобаларды консультациялық сүйемелдеу бойынша көрсетілетін қызметтер құнын айқындау әдістемесін бекіту туралы
