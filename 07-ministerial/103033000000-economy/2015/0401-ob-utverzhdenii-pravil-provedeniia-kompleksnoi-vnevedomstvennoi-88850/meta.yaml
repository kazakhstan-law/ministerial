  requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 7 июня 2019 года № 375. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 июня 2019 года № 18814. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 15 мая 2026 года № 240 (вводится в действие с 1 июля 2026 года и подлежит официальному опубликованию)
  title:
    rus: О внесении изменений и дополнений в приказ Министра национальной экономики Республики Казахстан от 1 апреля 2015 года № 299 «Об утверждении Правил проведения комплексной вневедомственной экспертизы технико-экономических обоснований и проектно-сметной документации, предназначенных для строительства новых, а также изменения (реконструкции, расширения, технического перевооружения, модернизации и капитального ремонта) существующих зданий и сооружений, их комплексов, инженерных и транспортных коммуникаций независимо от источников финансирования»
    kaz: «Қаржыландыру көздеріне қарамастан, жаңа үйлер мен ғимараттарды, олардың кешендерін, инженерлік және көлік коммуникацияларын салуға, сондай-ақ бұрыннан барын өзгертуге (реконструкциялауға, кеңейтуге, техникалық қайта жарақтандыруға, жаңғыртуға және күрделі жөндеуге) арналған техникалық-экономикалық негіздемелерге және жобалау-сметалық құжаттамаға ведомстводан тыс кешенді сараптама жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 1 сәуірдегі № 299 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/132290/rus
