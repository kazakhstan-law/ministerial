act_code: '88850'
requisite: Приказ Министра национальной экономики Республики Казахстан от 1 апреля 2015 года № 299. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 апреля 2015 года № 10722. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 15 мая 2026 года № 240 (вводится в действие с 1 июля 2026 года и подлежит официальному опубликованию)
title:
  rus: Об утверждении Правил проведения комплексной вневедомственной экспертизы технико-экономических обоснований и проектно-сметной документации, предназначенных для строительства новых, а также изменения (реконструкции, расширения, технического перевооружения, модернизации и капитального ремонта) существующих зданий и сооружений, их комплексов, инженерных и транспортных коммуникаций независимо от источников финансирования
  kaz: Қаржыландыру көздеріне қарамастан, жаңа үйлер мен ғимараттарды, олардың кешендерін, инженерлік және көлік коммуникацияларын салуға, сондай-ақ бұрыннан барын өзгертуге (реконструкциялауға, кеңейтуге, техникалық қайта жарақтандыруға, жаңғыртуға және күрделі жөндеуге) арналған техникалық-экономикалық негіздемелерге және жобалау-сметалық құжаттамаға ведомстводан тыс кешенді сараптама жүргізу қағидаларын бекіту туралы
