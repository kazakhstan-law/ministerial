  title:
    rus: О внесении изменений и дополнений в приказы Министерства национальной экономики Республики Казахстан от 27 марта 2015 года № 248 «Об утверждении Правил разработки и представления отчетов по исполнению планов развития контролируемых государством акционерных обществ, товариществ с ограниченной ответственностью и государственных предприятий» и от 27 марта 2015 года № 249 «Об утверждении Правил разработки, утверждения планов развития контролируемых государством акционерных обществ и товариществ с ограниченной ответственностью, государственных предприятий, а также мониторинга и оценки их реализации»
    kaz: Қазақстан Республикасы Ұлттық экономика министрлігінің «Мемлекет бақылайтын акционерлік қоғамдардың, жауапкершілігі шектеулі серіктестіктердің және мемлекеттік кәсіпорындардың даму жоспарларының орындалуы жөніндегі есептерді әзірлеу және ұсыну қағидаларын бекіту туралы» 2015 жылғы 27 наурыздағы № 248 және «Мемлекет бақылайтын акционерлік қоғамдардың және жауапкершілігі шектеулі серіктестіктердің, мемлекеттік кәсіпорындардың даму жоспарларын әзірлеу, бекіту, сондай-ақ оларды іске асырудың мониторингі мен оны бағалау қағидаларын бекіту туралы» 2015 жылғы 27 наурыздағы № 249 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/119824/rus
