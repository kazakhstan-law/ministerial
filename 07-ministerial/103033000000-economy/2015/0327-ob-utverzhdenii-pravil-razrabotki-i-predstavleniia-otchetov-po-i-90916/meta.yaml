title:
  rus: Об утверждении Правил разработки и представления отчетов по исполнению планов развития контролируемых государством акционерных обществ, товариществ с ограниченной ответственностью и государственных предприятий
  kaz: Мемлекет бақылайтын акционерлік қоғамдардың, жауапкершілігі шектеулі серіктестіктердің және мемлекеттік кәсіпорындардың даму жоспарларының орындалуы жөніндегі есептерді әзірлеу және ұсыну қағидаларын бекіту туралы
