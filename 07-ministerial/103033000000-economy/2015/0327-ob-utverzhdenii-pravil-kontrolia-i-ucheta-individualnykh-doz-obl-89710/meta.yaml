title:
  rus: Об утверждении Правил контроля и учета индивидуальных доз облучения, полученных гражданами при работе с источниками ионизирующего излучения, проведении медицинских рентгенорадиологических процедур, а также обусловленных природным и техногенным радиационным фоном
  kaz: Иондаушы сәулелендiру көздерiмен жұмыс iстеу, медициналық рентген-радиологиялық процедуралар жүргiзу кезiнде, сондай-ақ табиғи және техногендік радиациялық аяға байланысты азаматтар алған жеке сәуле мөлшерлерiн бақылау және есепке алу қағидаларын бекіту туралы
