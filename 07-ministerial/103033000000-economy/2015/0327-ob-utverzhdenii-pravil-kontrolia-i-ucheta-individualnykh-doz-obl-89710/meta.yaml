  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 27 марта 2015 года № 259 «Об утверждении Правил контроля и учета индивидуальных доз облучения, полученных гражданами при работе с источниками ионизирующего излучения, проведении медицинских рентгенорадиологических процедур, а также обусловленных техногенным радиационным фоном»
    kaz: «Иондаушы сәулелендiру көздерiмен жұмыс iстеу, медициналық рентген-радиологиялық процедуралар жүргiзу кезiнде, сондай-ақ техногендік радиациялық аяға байланысты азаматтар алған жеке сәуле мөлшерлерiн бақылау және есепке алу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 27 наурыздағы № 259 бұйрығына өзгерістер енгізу туралы
