title:
  rus: Об утверждении Правил оказания инжиниринговых услуг по управлению проектом строительства объектов и квалификационных требований предъявляемых организациям, оказывающим услуги по управлению проектом
  kaz: Объектілер құрылысын салу үшін жобаны басқару жөніндегі инжинирингтік қызметтер көрсету қағидаларын және жобаны басқару жөніндегі қызметтер көрсететін ұйымдарға қойылатын біліктілік талаптарын бекіту туралы
