  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 30 марта 2015 года № 282 «Об утверждении правил установления пороговых значений розничных цен на социально значимые продовольственные товары и размера предельно допустимых розничных цен на них»
    kaz: «Әлеуметтік маңызы бар азық-түлік тауарларына бөлшек сауда бағаларының шекті мәндерін және оларға бөлшек сауда бағаларының шекті рұқсат етілген мөлшерін белгілеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 30 наурыздағы № 282 бұйрығына өзгеріс енгізу туралы
