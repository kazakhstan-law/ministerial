  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 30 марта 2015 года № 282 «Об утверждении Правил установления пороговых значений розничных цен на социально значимые продовольственные товары и размера предельно допустимых розничных цен на них» и в приказ исполняющего обязанности Министра торговли и интеграции Республики Казахстан от 22 июня 2023 года № 242-НҚ «Об утверждении Правил организации деятельности торговых рынков, требований к содержанию территории, оборудованию и оснащению торгового рынка»
    kaz: «Әлеуметтік маңызы бар азық-түлік тауарларына бөлшек сауда бағаларының шекті мәндерін және оларға бөлшек сауда бағаларының шекті рұқсат етілген мөлшерін белгілеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 30 наурыздағы № 282 бұйрығына және «Сауда базарларының қызметін ұйымдастыру қағидаларын, сауда базарының аумағын күтіп-ұстауға, оны жабдықтауға және жарақтандыруға қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің міндетін атқарушының 2023 жылғы 22 маусымдағы № 242-НҚ бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/188272/rus
