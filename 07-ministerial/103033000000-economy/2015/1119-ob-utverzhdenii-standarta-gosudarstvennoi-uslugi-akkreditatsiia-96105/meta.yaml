requisite: Приказ Министра национальной экономики Республики Казахстан от 19 ноября 2015 года № 700. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 ноября 2015 года № 12322. Утратил силу приказом и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 11 августа 2021 года № 431 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Аккредитация юридических лиц, претендующих на проведение комплексной вневедомственной экспертизы проектов строительства объектов»
  kaz: «Объектілер құрылысының жобаларына ведомстводан тыс кешенді сараптама жүргізуге үміткер заңды тұлғаларды аккредиттеу» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
