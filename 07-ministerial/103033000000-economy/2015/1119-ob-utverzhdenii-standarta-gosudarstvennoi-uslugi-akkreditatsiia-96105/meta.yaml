  requisite: Приказ и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 11 августа 2021 года № 431. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 августа 2021 года № 23971. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 19 мая 2026 года № 246 (вводится в действие с 1 июля 2026 года и подлежит официальному опубликованию)
  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 27 февраля 2015 года № 151 «Об утверждении Правил аккредитации экспертных организаций» и признании утратившими силу некоторых приказов Министра национальной экономики Республики Казахстан
    kaz: «Сараптама ұйымдарын аккредиттеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 27 ақпандағы № 151 бұйрығына өзгерістер енгізу және Қазақстан Республикасы Ұлттық экономика министрінің кейбір бұйрықтарының күші жойылды деп тану туралы
