requisite: Приказ Министра национальной экономики Республики Казахстан от 7 августа 2015 года № 599. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 сентября 2015 года № 12070. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил перерасчета стоимости услуг по теплоснабжению с учетом фактической температуры наружного воздуха и возврата средств потребителям по результатам перерасчета
  kaz: Сыртқы ауаның нақты температурасын ескере отырып, жылумен жабдықтау бойынша көрсетілетін қызметтердің құнын қайта есептеу және қайта есептеу нәтижелері бойынша тұтынушыларға қаражатты қайтару қағидаларын бекіту туралы
