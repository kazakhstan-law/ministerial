  kaz: Табиғи монополиялар субъектілерінің реттеліп көрсетілетін қызметтеріне (тауарларына, жұмыстарына) тарифтердің (бағалардың, алымдар мөлшерлемелерінің) шекті деңгейін есептеудің кемсiтпейтiн әдістемесін бекіту туралы
