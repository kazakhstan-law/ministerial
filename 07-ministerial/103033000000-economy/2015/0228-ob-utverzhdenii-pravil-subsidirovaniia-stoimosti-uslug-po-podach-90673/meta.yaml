requisite: Приказ Министра национальной экономики Республики Казахстан от 28 февраля 2015 года № 161. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 июня 2015 года № 11299. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 29 августа 2025 года № 339 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил субсидирования стоимости услуг по подаче питьевой воды из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения
  kaz: Ауыз сумен жабдықтаудың баламасыз көздері болып табылатын ерекше маңызды топтық және оқшау сумен жабдықтау жүйелерінен ауыз су беру жөніндегі көрсетілетін қызметтер құнын субсидиялау қағидаларын бекіту туралы
