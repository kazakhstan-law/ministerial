  title:
    rus: О внесении изменения в приказ Министра национальной экономики Республики Казахстан от 28 февраля 2015 года № 161 «Об утверждении Правил субсидирования стоимости услуг по подаче питьевой воды из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения»
    kaz: Ауыз сумен жабдықтаудың баламасыз көздері болып табылатын ерекше манызды топтық және оқшау сумен жабдықтау жүйелерінен ауыз су беру жөніндегі көрсетілетін қызметтер құнын субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 28 ақпандағы № 161 бұйрығына өзгеріс енгізу туралы
