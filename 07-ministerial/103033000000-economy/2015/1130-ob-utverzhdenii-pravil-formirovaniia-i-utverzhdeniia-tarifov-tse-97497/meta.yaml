requisite: Приказ Министра национальной экономики Республики Казахстан от 30 ноября 2015 года № 743. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 декабря 2015 года № 12526. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил формирования и утверждения тарифов (цен, ставок сборов) на регулируемые услуги (товары, работы) субъектов естественных монополий, осуществляющих свою деятельность по договору государственно-частного партнерства, в том числе по договору концессии
  kaz: Өз қызметін мемлекеттік-жекешелік әріптестік шарты, оның ішінде концессия шарты бойынша жүзеге асыратын табиғи монополиялар субъектілерінің реттеліп көрсетілетін қызметтеріне (тауарларына, жұмыстарына) тарифтерді (бағаларды, алымдар мөлшерлемелерін) қалыптастыру және бекіту қағидаларын бекіту туралы
