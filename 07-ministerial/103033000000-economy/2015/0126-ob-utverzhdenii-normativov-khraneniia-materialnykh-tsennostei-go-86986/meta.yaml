title:
  rus: Об утверждении нормативов хранения материальных ценностей государственного материального резерва, за исключением лекарственных средств и медицинских изделий мобилизационного резерва
  kaz: Жұмылдыру резервінің дәрілік заттары мен медициналық бұйымдарын қоспағанда, мемлекеттік материалдық резервтің материалдық құндылықтарын сақтау нормативтерін бекіту туралы
