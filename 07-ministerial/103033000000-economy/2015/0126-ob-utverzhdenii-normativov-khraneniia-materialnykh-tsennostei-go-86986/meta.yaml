    kaz: «Мемлекеттік материалдық резервтің материалдық құндылықтарын сақтау нормативтерін  бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 26 қаңтардағы № 44 бұйрығына өзгерістер мен толықтырулар енгізу туралы
