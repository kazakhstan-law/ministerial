  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 30 ноября 2015 года № 745 «Об утверждении Правил выдачи уведомления о наличии в действиях (бездействии) субъекта рынка, занимающего доминирующее или монопольное положение, признаков злоупотребления доминирующим или монопольным положением в нарушение законодательства Республики Казахстан в области защиты конкуренции и его формы»
    kaz: «Үстем немесе монополиялық жағдайға ие нарық субъектісінің әрекеттерінде (әрекетсіздігінде) Қазақстан Республикасының бәсекелестікті қорғау саласындағы заңнамасын бұзатын үстем немесе монополиялық жағдайды теріс пайдалану белгілерінің бар екені туралы хабарлама беру қағидаларын және оның нысанын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 30 қарашадағы № 745 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/113376/rus
