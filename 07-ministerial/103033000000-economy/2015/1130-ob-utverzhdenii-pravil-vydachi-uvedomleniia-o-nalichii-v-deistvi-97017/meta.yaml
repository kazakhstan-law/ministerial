title:
  rus: Об утверждении Правил выдачи уведомления о наличии в действиях (бездействии) признаков нарушения законодательства Республики Казахстан в области защиты конкуренции и его формы
  kaz: Әрекеттерінде (әрекетсіздігінде) Қазақстан Республикасының бәсекелестікті қорғау саласындағы заңнамасын бұзушылық белгілерінің болуы туралы хабарламаны беру қағидаларын және оның нысанын бекіту туралы
