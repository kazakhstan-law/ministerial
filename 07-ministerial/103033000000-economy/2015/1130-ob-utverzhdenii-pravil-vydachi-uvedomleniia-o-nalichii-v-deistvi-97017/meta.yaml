  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 30 ноября 2015 года № 745 «Об утверждении Правил выдачи уведомления о наличии в действиях (бездействии) субъекта рынка признаков нарушения законодательства Республики Казахстан в области защиты конкуренции и его формы»
    kaz: «Нарық субъектіcінің әрекеттерінде (әрекетсіздігінде) Қазақстан Республикасының бәсекелестікті қорғау саласындағы заңнамасын бұзу белгілерінің бар екені туралы хабарламаны және оның нысанын беру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 30 қарашадағы № 745 бұйрығына өзгерістер енгізу туралы
