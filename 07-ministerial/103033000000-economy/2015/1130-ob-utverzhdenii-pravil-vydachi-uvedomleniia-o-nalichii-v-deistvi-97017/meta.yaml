  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 30 ноября 2015 года № 745 «Об утверждении Правил выдачи уведомления о наличии в действиях (бездействии) субъекта рынка, государственного, местного исполнительного органов, организации, наделенной государством функциями регулирования деятельности субъектов рынка, признаков нарушения законодательства Республики Казахстан в области защиты конкуренции и его формы»
    kaz: «Нарық субъектісінің, мемлекеттік, жергілікті атқарушы органдардың, мемлекет нарық субъектілерінің қызметін реттеу функцияларын берген ұйымның әрекеттерінде (әрекетсіздігінде) Қазақстан Республикасының бәсекелестікті қорғау саласындағы заңнамасын бұзушылық белгілерінің бар екені туралы хабарламаны беру қағидаларын және оның нысанын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 30 қарашадағы № 745 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/146815/rus
