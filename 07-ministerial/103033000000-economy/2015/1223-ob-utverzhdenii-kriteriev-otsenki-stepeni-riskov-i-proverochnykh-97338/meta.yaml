requisite: Приказ Министра национальной экономики Республики Казахстан от 23 декабря 2015 года № 784. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12785. Утратил силу совместным приказом Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 11 декабря 2018 года № 502 и Министра национальной экономики Республики Казахстан от 11 декабря 2018 года № 101 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении  критериев оценки степени рисков и проверочных листов субъектов земельных отношений за использованием и охраной земель, геодезической и картографической деятельности
  kaz: Жер қатынастары субъектілерінің жерді пайдалану мен қорғау, геодезия және   картография қызметі бойынша тәуекел дәрежесін бағалау өлшемшарттарын  және тексеру парақтарын бекіту туралы
