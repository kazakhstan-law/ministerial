  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 2 декабря 2015 года № 752 «Об утверждении некоторых методик уполномоченного органа, осуществляющего руководство в сферах естественных монополий и регулируемых рынков»
    kaz: «Табиғи монополиялар салаларындағы және реттелетін нарықтардағы басшылықты жүзеге асыратын уәкілетті органның кейбір әдістемелерін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 2 желтоқсандағы № 752 бұйрығына өзгерістер енгізу туралы
