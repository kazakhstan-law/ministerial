  title:
    rus: О внесении изменений в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 6 октября 2015 года № 151 «Об утверждении статистических форм общегосударственных статистических наблюдений по статистике предприятий и инструкций по их заполнению»
    kaz: '"Кәсіпорындар статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы" Қазақстан Республикасы Ұлттық экономика министрлігінің Статистика комитеті төрағасының 2015 жылғы 6 қазандағы № 151 бұйрығына өзгерістер енгізу туралы'
