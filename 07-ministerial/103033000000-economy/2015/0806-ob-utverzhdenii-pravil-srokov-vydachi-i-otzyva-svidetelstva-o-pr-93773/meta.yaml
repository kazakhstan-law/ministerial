  title:
    rus: О внесении изменения в приказ Министра национальной экономики Республики Казахстан от 6 августа 2015 года № 596 «Об утверждении Правил, сроков выдачи и отзыва свидетельства о присвоении квалификационной категории для специалистов в сфере санитарно-эпидемиологического благополучия населения»
    kaz: «Халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы мамандар үшін біліктілік санатын беру туралы куәлікті беру және кері қайтарып алу қағидаларын, мерзімдерін бекіту туралы» Қазақстан Республикасының Ұлттық экономика министрінің 2015 жылғы 6 тамыздағы № 596 бұйрығына өзгеріс енгізу туралы
