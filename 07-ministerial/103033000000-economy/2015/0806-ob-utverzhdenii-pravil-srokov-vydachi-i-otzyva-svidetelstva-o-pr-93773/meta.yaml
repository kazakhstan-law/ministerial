title:
  rus: Об утверждении Правил, сроков выдачи и отзыва свидетельства о присвоении квалификационной категории для специалистов в сфере санитарно-эпидемиологического благополучия населения
  kaz: Халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы мамандар үшін біліктілік санатын беру туралы куәлікті беру және кері қайтарып алу қағидаларын, мерзімдерін бекіту туралы
