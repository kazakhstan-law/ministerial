requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 25 ноября 2015 года № 719. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12707
title:
  rus: Об утверждении Перечня  товаров, относящихся к предметам военной или специальной формы, форменной одежды, знаков различия военнослужащих Вооруженных Сил, других войск и воинских формирований, сотрудников правоохранительных и специальных государственных органов Республики Казахстан, запрещенных к продаже
  kaz: Cатуға тыйым салынған Қазақстан Республикасының Қарулы Күштері, басқа да әскерлер мен әскери құралымдардың әскери қызметшілерінің, құқық қорғау органдары, арнаулы мемлекеттік органдар қызметкерлерінің әскери немесе арнаулы нысанды, нысанды киім-кешегінің заттарына, айырым белгiлерiне жататын тауарлар тізбесін бекіту туралы
