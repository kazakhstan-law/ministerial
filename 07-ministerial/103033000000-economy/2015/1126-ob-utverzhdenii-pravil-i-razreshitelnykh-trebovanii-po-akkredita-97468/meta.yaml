title:
  rus: Об утверждении Правил и разрешительных требований по аккредитации негосударственных аттестационных центров по аттестации инженерно-технических работников, участвующих в процессе проектирования и строительства
  kaz: Жобалау және құрылыс салу процесіне қатысушы инженер-техник жұмыскерлерді аттестаттау бойынша мемлекеттік емес аттестаттау орталықтарын аккредиттеу жөніндегі қағидаларды және рұқсат беру талаптарын бекіту туралы
