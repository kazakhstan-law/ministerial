act_code: '87407'
requisite: Приказ Министра национальной экономики Республики Казахстан от 3 февраля 2015 года № 71. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 марта 2015 года № 10401. Утратил силу приказом и.о. Министра промышленности и строительства Республики Казахстан от 22 июня 2026 года № 321 (вводится в действие с 1 июля 2026 года)
title:
  rus: Об утверждении Правил оказания инжиниринговых услуг в сфере архитектурной, градостроительной и строительной деятельности
  kaz: Сәулет, қала құрылысы және құрылыс қызметі саласында инжинирингтік қызметтер көрсету қағидаларын бекіту туралы
