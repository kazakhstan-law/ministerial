  requisite: Приказ и.о. Министра промышленности и строительства Республики Казахстан от 19 июля 2024 года № 269. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 июля 2024 года № 34775
  title:
    rus: О внесении изменений и дополнений в приказ Министра национальной экономики Республики Казахстан от 3 февраля 2015 года № 71 «Об утверждении Правил оказания инжиниринговых услуг в сфере архитектурной, градостроительной и строительной деятельности» и приказ Министра национальной экономики Республики Казахстан от 19 марта 2015 года № 229 «Об утверждении Правил организации деятельности и осуществления функций заказчика (застройщика)»
    kaz: «Сәулет, қала құрылысы және құрылыс қызметі саласында инжинирингтік қызметтер көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 3 ақпандағы № 71 бұйрығына және «Тапсырыс берушінің (құрылыс салушының) қызметін ұйымдастырудың және функцияларын жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 19 наурыздағы № 229 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/198933/rus
