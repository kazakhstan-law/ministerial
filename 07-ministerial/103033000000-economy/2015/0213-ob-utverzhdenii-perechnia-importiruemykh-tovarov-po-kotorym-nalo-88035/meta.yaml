act_code: '88035'
requisite: Приказ Министра национальной экономики Республики Казахстан от 13 февраля 2015 года № 93. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 марта 2015 года № 10538. Утратил силу приказом и.о. Министра национальной экономики Республики Казахстан от 21 февраля 2018 года № 67 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Перечня импортируемых товаров, по которым налог на добавленную стоимость уплачивается методом зачета в порядке, установленном Кодексом Республики Казахстан от 12 июня 2001 года «О налогах и других обязательных платежах в бюджет» (Налоговый кодекс)», Законом Республики Казахстан от 10 декабря 2008 года «О введении в действие Кодекса Республики Казахстан «О налогах и других обязательных платежах в бюджет» (Налоговый кодекс)», и правил его формирования
  kaz: Қосылған құн салығы «Салық және бюджетке төленетін басқа да міндетті төлемдер туралы» Қазақстан Республикасының 2001 жылғы 12 маусымдағы Кодексінде (Салық кодексі), «Салық және бюджетке төленетін басқа да міндетті төлемдер туралы» Қазақстан Республикасының кодексін (Салық кодексі) қолданысқа енгізу туралы» Қазақстан Республикасының 2008 жылғы 10 желтоқсандағы Заңында белгіленген тәртіппен есепке алу әдісімен төленетін импортталатын тауарлардың тізбесін және оны қалыптастыру қағидасын бекіту туралы
