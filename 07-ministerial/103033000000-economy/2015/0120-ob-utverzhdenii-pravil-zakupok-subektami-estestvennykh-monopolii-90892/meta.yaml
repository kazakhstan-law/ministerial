requisite: Приказ Министра национальной экономики Республики Казахстан от 20 января 2015 года № 18. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 мая 2015 года № 11014. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил закупок субъектами естественных монополий товаров, работ и услуг, затраты на которые учитываются при утверждении тарифов (цен, ставок сборов) или их предельных уровней и тарифных смет на регулируемые услуги
  kaz: Реттеліп көрсетiлетiн қызметтерге тарифтерді (бағаларды, алымдар мөлшерлемелерін) немесе олардың шекті деңгейлерін және тарифтік сметаларды бекіту кезінде шығындары ескерiлетiн тауарларды, жұмыстар мен көрсетiлетiн қызметтерді табиғи монополиялар субъектiлерiнiң сатып алу қағидаларын бекіту туралы
