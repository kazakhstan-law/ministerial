  title:
    rus: Об утверждении Правил гигиенического обучения лиц декретированной группы населения и Программ гигиенического обучения лиц декретированной группы населения и внесении изменения и дополнения в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 24 февраля 2015 года № 126 «Об утверждении Правил выдачи, учета и ведения личных медицинских книжек»
    kaz: Халықтың декреттелген тобындағы адамдарды гигиеналық оқыту қағидаларын және Халықтың декреттелген тобындағы адамдарды гигиеналық оқыту бағдарламаларын бекіту және «Жеке медициналық кітапшаларды беру, есепке алу және жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндеттерін атқарушының 2015 жылғы 24 ақпандағы № 126 бұйрығына өзгеріс пен толықтыру енгізу туралы
