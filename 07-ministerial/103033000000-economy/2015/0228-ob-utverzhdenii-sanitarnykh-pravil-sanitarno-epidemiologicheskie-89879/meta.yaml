requisite: Приказ Министра национальной экономики Республики Казахстан от 28 февраля 2015 года № 176. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 мая 2015 года № 10936. Утратил силу приказом Министра здравоохранения Республики Казахстан от 23 апреля 2018 года № 187 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Санитарных правил "Санитарно-эпидемиологические требования к сбору, использованию, применению, обезвреживанию, транспортировке, хранению и захоронению отходов производства и потребления"
  kaz: '"Өндіріс және тұтыну қалдықтарын жинауға, пайдалануға, қолдануға, залалсыздандыруға, тасымалдауға, сақтауға және көмуге қойылатын санитариялық-эпидемиологиялық талаптар" санитариялық қағидаларын бекіту туралы'
