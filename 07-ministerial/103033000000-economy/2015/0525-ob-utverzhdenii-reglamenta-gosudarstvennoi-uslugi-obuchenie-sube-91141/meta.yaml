title:
  rus: Об утверждении регламента государственной услуги "Обучение субъектов частного предпринимательства в рамках Единой программы поддержки и развития бизнеса "Дорожная карта бизнеса 2020"
  kaz: '"Бизнестің жол картасы 2020" бизнесті қолдау мен дамытудың бірыңғай бағдарламасы шеңберінде жеке кәсіпкерлік субъектілерін оқыту" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'
