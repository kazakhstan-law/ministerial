title:
  rus: Об утверждении Правил утверждения временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на регулируемые услуги магистральной железнодорожной сети и железнодорожных путей с объектами железнодорожного транспорта по договорам концессии
  kaz: Магистральдық темір жол желісінің және концессия шарттары бойынша темір жол көлігінің объектілері бар темір жолдардың реттеліп көрсетілетін қызметтерінің тарифтеріне (бағаларына, алым ставкаларына) уақытша төмендету коэффициенттерін бекіту қағидаларын бекіту туралы
