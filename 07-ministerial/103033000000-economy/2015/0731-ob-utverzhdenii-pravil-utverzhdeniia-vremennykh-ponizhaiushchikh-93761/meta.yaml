  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 31 июля 2015 года № 580 «Об утверждении Правил утверждения временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на регулируемые услуги магистральной железнодорожной сети и железнодорожных путей с объектами железнодорожного транспорта по договорам концессии»
    kaz: «Магистральдық темір жол желісінің және концессия шарттары бойынша темір жол көлігінің объектілері бар темір жолдардың реттеліп көрсетілетін қызметтерінің тарифтеріне (бағаларына, алым ставкаларына) уақытша төмендету коэффициенттерін бекіту қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 31 шілдедегі № 580 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/105096/rus
