requisite: Приказ Министра национальной экономики Республики Казахстан от 27 февраля 2015 года № 149. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 апреля 2015 года № 10663. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 2 июня 2025 года № 48 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил разработки, утверждения планов развития национальных управляющих холдингов, национальных холдингов и национальных компаний и планов мероприятий национальных управляющих холдингов, национальных холдингов, национальных компаний, акционером которых является государство, а также мониторинга и оценки их реализации
  kaz: Ұлттық басқарушы холдингтердің, ұлттық холдингтердің және ұлттық компаниялардың даму жоспарларын және акционері мемлекет болып табылатын ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың іс-шаралар жоспарларын әзірлеу, бекіту, сондай-ақ олардың іске асырылуын мониторингтеу және бағалау қағидаларын бекіту туралы
