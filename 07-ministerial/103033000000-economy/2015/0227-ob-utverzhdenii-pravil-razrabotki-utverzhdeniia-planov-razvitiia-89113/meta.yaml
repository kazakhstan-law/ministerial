  title:
    rus: О внесении изменения в приказ Министра национальной экономики Республики Казахстан от 27 февраля 2015 года № 149 «Об утверждении Правил разработки, утверждения стратегий развития и планов развития национальных управляющих холдингов, национальных холдингов, национальных компаний, акционером которых является государство, а также мониторинга и оценки их реализации»
    kaz: «Акционері мемлекет болып табылатын ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың даму стратегиялары мен даму жоспарларын әзірлеу, бекіту, сондай-ақ олардың іске асырылуын мониторингілеу және бағалау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 27 ақпандағы № 149 бұйрығына өзгеріс енгізу туралы"
