  title:
    rus: Об определении предельно допустимых уровней содержания никотина и смолистых веществ в курительных табачных изделиях, в том числе изделиях с нагреваемым табаком, табаком для кальяна, кальянной смеси, системе для нагрева табака
    kaz: Шегілетін темекі бұйымдары, оның ішінде қыздырылатын темекісі, қорқорға арналған темекісі бар бұйымдар, қорқор қоспасы, темекіні қыздыруға арналған жүйе құрамындағы никотин мен шайырлы заттардың рұқсат етілетін шекті деңгейлерін анықтау туралы
