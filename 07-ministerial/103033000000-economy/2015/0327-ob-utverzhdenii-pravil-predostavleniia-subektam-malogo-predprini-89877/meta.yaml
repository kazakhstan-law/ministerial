title:
  rus: Об утверждении Правил предоставления субъектам малого предпринимательства в имущественный наем (аренду) или доверительное управление неиспользуемых объектов государственной собственности для организации производственной деятельности и развития сферы услуг населению с последующей безвозмездной передачей в собственность
  kaz: Өндірістік қызметті ұйымдастыру және халыққа қызметтер көрсету саласын дамыту үшін кейіннен меншікке өтеусіз бере отырып, мемлекеттік меншіктің пайдаланылмайтын объектілерін шағын кәсіпкерлік субъектілеріне мүліктік жалға (жалдауға) немесе сенімгерлік басқаруға беру қағидаларын бекіту туралы
