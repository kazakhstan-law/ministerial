  requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 21 мая 2019 года № 318. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 мая 2019 года № 18712. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 3 июня 2026 года № 282 (вводится в действие с 1 июля 2026 года)
  title:
    rus: Об утверждении стандарта государственной услуги «Выдача разрешения на вырубку деревьев» и о внесении изменений и дополнения в приказ Министра национальной экономики Республики Казахстан от 20 марта 2015 года № 235 «Об утверждении Типовых правил содержания и защиты зеленых насаждений, правил благоустройства территорий городов и населенных пунктов»
    kaz: «Ағаштарды кесуге рұқсат беру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы және «Жасыл екпелерді күтіп-ұстаудың және қорғаудың үлгілік қағидаларын, қалалар мен елді мекендердің аумақтарын абаттандырудың қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 20 наурыздағы № 235 бұйрығына өзгерістер мен толықтыру енгізу туралы
