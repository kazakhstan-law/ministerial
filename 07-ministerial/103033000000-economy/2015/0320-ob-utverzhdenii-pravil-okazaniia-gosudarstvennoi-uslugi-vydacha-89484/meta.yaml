  title:
    rus: О внесении изменений и дополнений в приказ Министра национальной экономики Республики Казахстан от 20 марта 2015 года № 235 «Об утверждении Типовых правил содержания и защиты зеленых насаждений, правил благоустройства территорий городов и населенных пунктов» и о внесении изменения в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 21 мая 2019 года № 318 «Об утверждении стандарта государственной услуги «Выдача разрешения на вырубку деревьев» и о внесении изменений и дополнения в приказ Министра национальной экономики Республики Казахстан от 20 марта 2015 года № 235 «Об утверждении Типовых правил содержания и защиты зеленых насаждений, правил благоустройства территорий городов и населенных пунктов»
    kaz: «Жасыл екпелерді күтіп-ұстаудың және қорғаудың үлгілік қағидаларын, қалалар мен елді мекендердің аумақтарын абаттандырудың қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 20 наурыздағы № 235 бұйрығына өзгерістер мен толықтырулар енгізу туралы және «Ағаштарды кесуге рұқсат беру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы және «Жасыл екпелерді күтіп-ұстаудың және қорғаудың үлгілік қағидаларын, қалалар мен елді мекендердің аумақтарын абаттандырудың қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 20 наурыздағы № 235 бұйрығына өзгерістер мен толықтыру енгізу туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 21 мамырдағы № 318 бұйрығына өзгеріс енгізу туралы
