  title:
    rus: О внесении изменений и дополнений в приказ Министра национальной экономики Республики Казахстан от 20 марта 2015 года № 235 «Об утверждении Типовых правил содержания и защиты зеленых насаждений, правил благоустройства территорий городов и населенных пунктов и Правил оказании государственной услуги «Выдача разрешения на вырубку деревьев»
    kaz: «Жасыл екпелерді күтіп-ұстаудың және қорғаудың үлгілік қағидаларын, қалалар мен елді мекендердің аумақтарын абаттандырудың қағидаларын және «Ағаштарды кесуге рұқсат беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 20 наурыздағы № 235 бұйрығына өзгерістер мен толықтырулар енгізу туралы
