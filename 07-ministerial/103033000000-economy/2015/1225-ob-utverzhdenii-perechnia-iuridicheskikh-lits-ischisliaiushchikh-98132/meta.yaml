act_code: '98132'
requisite: Приказ Министра национальной экономики Республики Казахстан от 25 декабря 2015 года № 793. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 января 2016 года № 12922. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 20 февраля 2018 года № 122 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня юридических лиц, исчисляющих налог по ставкам физических лиц по объектам налогообложения, предоставленным в рамках реализации отраслевой программы развития регионов по договорам долгосрочной аренды жилища физическому лицу, являющемуся участником такой программы
  kaz: Өңірлерді дамытудың салалық бағдарламасының қатысушысы болып табылатын жеке тұлғаға тұрғынжайды ұзақ мерзімді жалға беру шарттары бойынша осы бағдарламаны іске асыру шеңберінде берілген салық салу объектілері бойынша салықты жеке тұлғалардың мөлшерлемелері бойынша есептейтін заңды тұлғалардың тізбесін бекіту туралы
