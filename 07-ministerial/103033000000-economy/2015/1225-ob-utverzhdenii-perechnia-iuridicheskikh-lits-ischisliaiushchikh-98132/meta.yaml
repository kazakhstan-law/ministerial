  title:
    rus: О внесении изменений и дополнений в приказ Министра национальной экономики Республики Казахстан от 25 декабря 2015 года № 793 "Об утверждении перечня юридических лиц, исчисляющих налоги по ставкам физических лиц по объектам налогообложения, представленных в рамках реализации отраслевой программы развития регионов по договорам долгосрочной аренды жилища физическому лицу, являющемуся участником такой программы"
    kaz: '"Өңірлерді дамытудың салалық бағдарламасының қатысушысы болып табылатын жеке тұлғаға тұрғынжайды ұзақ мерзімді жалға беру шарттары бойынша осы бағдарламаны іске асыру шеңберінде берілген салық салу объектілері бойынша салықтарды жеке тұлғалардың мөлшерлемелері бойынша есептейтін заңды тұлғалардың тізбесін бекіту туралы" Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 25 желтоқсандағы № 793 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
