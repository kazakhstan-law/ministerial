  title:
    rus: О внесении изменений и дополнений в приказ председателя Комитета по делам строительства, жилищно-коммунального хозяйства и управления земельными ресурсами Министерства национальной экономики Республики Казахстан от 15 декабря 2015 года № 399-нқ "Об утверждении Государственного норматива по определению стоимости проектных работ для строительства в Республике Казахстан"
    kaz: '"Қазақстан Республикасында құрылысқа арналған жобалау жұмыстарының құнын айқындау жөніндегі Мемлекеттік нормативті бекіту туралы" Қазақстан Республикасы Ұлттық экономика министрлігі Құрылыс, тұрғын үй-коммуналдық шаруашылық істері және жер ресурстарын басқару комитеті төрағасының 2015 жылғы 15 желтоқсандағы № 399-нқ бұйрығына өзгерістер мен толықтырулар енгізу туралы'
