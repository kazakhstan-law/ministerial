requisite: Приказ Министра национальной экономики Республики Казахстан от 25 февраля 2015 года № 131. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 апреля 2015 года № 10644. Утратил силу приказом Министра здравоохранения Республики Казахстан от 17 ноября 2021 года № ҚР ДСМ-116 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Санитарных правил "Санитарно-эпидемиологические требования к организации и проведению санитарно-противоэпидемических (профилактических) мероприятий по предупреждению инфекционных заболеваний (чума, холера)"
  kaz: '"Инфекциялық аурулардың (обаның, тырысқақтың) алдын алу бойынша санитариялық-эпидемияға қарсы (профилактикалық) іс-шараларды ұйымдастыруға және өткізуге қойылатын санитариялық-эпидемиологиялық талаптар" санитариялық қағидаларын бекіту туралы'
