  code: '117358'
  requisite: Приказ Министра национальной экономики Республики Казахстан от 7 декабря 2017 года № 396. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 декабря 2017 года № 16128. Утратил силу приказом Министра национальной экономики Республики Казахстан от 27 мая 2020 года № 43 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 27 марта 2015 года № 275 «Об утверждении стандарта государственной услуги «Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»
    kaz: «Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын көрсету» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 27 наурыздағы № 275 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/117358/rus
