act_code: '89578'
requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 27 марта 2015 года № 275. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 апреля 2015 года № 10805. Утратил силу приказом Министра национальной экономики Республики Казахстан от 27 мая 2020 года № 43 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын көрсету
