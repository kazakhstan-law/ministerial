  requisite: Приказ Министра национальной экономики Республики Казахстан от 22 июня 2016 года № 270. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 июля 2016 года № 13950. Утратил силу приказом Министра национальной экономики Республики Казахстан от 27 мая 2020 года № 43 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 27 марта 2015 года № 275 «Об утверждении стандарта государственной услуги «Предоставление мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»
    kaz: «Ауылдық елдi мекендерге жұмыс iстеу және тұру үшiн келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 27 наурыздағы № 275 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/104718/rus
