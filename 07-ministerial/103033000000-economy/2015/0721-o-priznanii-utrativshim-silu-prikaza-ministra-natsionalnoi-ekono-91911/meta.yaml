title:
  rus: О признании утратившим силу приказа Министра национальной экономики Республики Казахстан от 30 декабря 2014 года № 187 «Об утверждении Правил определения обоснованной величины объема потребления физическими лицами регулируемых услуг в сфере водоснабжения»
  kaz: «Сумен жабдықтау саласындағы реттеліп, көрсетілетін қызметтерді жеке адамдардың тұтыну көлемінің негізделген шамасын айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2014 жылғы 30 желтоқсандағы № 187 бұйрығының күшін жою туралы
