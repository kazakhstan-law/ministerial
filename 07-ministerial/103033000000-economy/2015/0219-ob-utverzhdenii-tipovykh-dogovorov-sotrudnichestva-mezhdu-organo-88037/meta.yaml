title:
  rus: Об утверждении типовых договоров сотрудничества между органом управления объектом кондоминиума и субъектами рынка, поставляющими коммунальные услуги конечным потребителям
  kaz: Кондоминиум объектісін басқару органы мен түпкі тұтынушыларға коммуналдық көрсетілетін қызметтер жеткізетін нарық субъектілері арасындағы ынтымақтастықтың үлгі шарттарын бекіту туралы
