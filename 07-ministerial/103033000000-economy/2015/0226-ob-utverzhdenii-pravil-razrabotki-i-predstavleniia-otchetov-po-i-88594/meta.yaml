  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 26 февраля 2015 года № 139 «Об утверждении Правил разработки и представления отчетов по исполнению стратегий развития и планов развития национальных управляющих холдингов, национальных холдингов, национальных компаний, акционером которых является государство» и в приказ Министра национальной экономики Республики Казахстан от 27 февраля 2015 года № 149 «Об утверждении Правил разработки, утверждения стратегий развития и планов развития национальных управляющих холдингов, национальных холдингов, национальных компаний, акционером которых является государство, а также мониторинга и оценки их реализации»
    kaz: Қазақстан Республикасы Ұлттық экономика министрінің «Акционері мемлекет болып табылатын ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың даму стратегиялары мен даму жоспарларының орындалуы жөніндегі есептерді әзірлеу және ұсыну қағидаларын бекіту туралы» 2015 жылғы 26 ақпандағы № 139 бұйрығына және «Акционері мемлекет болып табылатын ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың даму стратегиялары мен даму жоспарларын әзірлеу, бекіту, сондай-ақ олардың іске асырылуын мониторингілеу және бағалау қағидаларын бекіту туралы» 2015 жылғы 27 ақпандағы № 149 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/124700/rus
