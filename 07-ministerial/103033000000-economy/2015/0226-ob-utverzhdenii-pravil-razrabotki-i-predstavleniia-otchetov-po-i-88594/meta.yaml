  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 26 февраля 2015 года № 139 «Об утверждении Правил разработки и представления отчетов по исполнению стратегий развития и планов развития национальных управляющих холдингов, национальных холдингов, национальных компаний, акционером которых является государство» и о внесении изменений и дополнений в приказ Министра национальной экономики Республики Казахстан от 27 февраля 2015 года № 149 «Об утверждении Правил разработки, утверждения стратегий развития и планов развития национальных управляющих холдингов, национальных холдингов, национальных компаний, акционером которых является государство, а также мониторинга и оценки их реализации»
    kaz: «Акционері мемлекет болып табылатын ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың даму стратегиялары мен даму жоспарларының орындалуы жөніндегі есептерді әзірлеу және ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 26 ақпандағы № 139 бұйрығына өзгерістер енгізу және «Акционері мемлекет болып табылатын ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың даму стратегиялары мен даму жоспарларын әзірлеу, бекіту, сондай-ақ олардың іске асырылуын мониторингілеу және бағалау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 27 ақпандағы № 149 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/109687/rus
