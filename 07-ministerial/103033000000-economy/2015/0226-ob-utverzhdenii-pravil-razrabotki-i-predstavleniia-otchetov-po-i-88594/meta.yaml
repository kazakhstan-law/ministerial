  title:
    rus: О внесении изменений и дополнений в приказы Министра национальной экономики Республики Казахстан от 26 февраля 2015 года № 139 «Об утверждении Правил разработки и представления отчетов по исполнению стратегий развития и планов развития национальных управляющих холдингов, национальных холдингов, национальных компаний, акционером которых является государство» и от 27 февраля 2015 года № 149 «Об утверждении Правил разработки, утверждения стратегий развития и планов развития национальных управляющих холдингов, национальных холдингов, национальных компаний, акционером которых является государство, а также мониторинга и оценки их реализации»
    kaz: «Акционері мемлекет болып табылатын ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың даму стратегиялары мен даму жоспарларының орындалуы жөніндегі есептерді әзірлеу және ұсыну қағидаларын бекіту туралы» 2015 жылғы 26 ақпандағы № 139 және «Акционері мемлекет болып табылатын ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың даму стратегиялары мен даму жоспарларын әзірлеу, бекіту, сондай-ақ олардың іске асырылуын мониторингілеу және бағалау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 27 ақпандағы № 149 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/129563/rus
