  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 26 февраля 2015 года № 139 «Об утверждении Правил разработки и представления отчетов по исполнению стратегий развития и планов развития национальных управляющих холдингов, национальных холдингов, национальных компаний, акционером которых является государство»
    kaz: «Акционері мемлекет болып табылатын ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың даму стратегиялары мен даму жоспарларының орындалуы жөніндегі есептерді әзірлеу және ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 26 ақпандағы № 139 бұйрығына өзгерістер енгізу туралы
