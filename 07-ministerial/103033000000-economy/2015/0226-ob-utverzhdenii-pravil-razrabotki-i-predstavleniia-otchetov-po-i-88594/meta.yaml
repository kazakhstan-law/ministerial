title:
  rus: Об утверждении Правил разработки и представления отчетов по исполнению планов развития национальных управляющих холдингов, национальных холдингов и национальных компаний и планов мероприятий национальных управляющих холдингов, национальных холдингов, национальных компаний, акционером которых является государство
  kaz: Ұлттық басқарушы холдингтердің, ұлттық холдингтердің және ұлттық компаниялардың даму жоспарларының орындалуы жөніндегі есептерді және акционері мемлекет болып табылатын ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың іс-шаралар жоспарларын әзірлеу және ұсыну қағидаларын бекіту туралы
