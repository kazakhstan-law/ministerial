  code: '150765'
  requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 25 декабря 2020 года № 678. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 декабря 2020 года № 21948. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 15 мая 2026 года № 238 (вводится в действие с 1 июля 2026 года)
  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 19 ноября 2015 года № 705 «Об утверждении Правил формирования Единого государственного электронного банка предпроектной и проектной (проектно-сметной) документации на строительство объектов, финансируемых за счет государственных инвестиций и средств субъектов квазигосударственного сектора»
    kaz: «Мемлекеттік инвестициялар және квазимемлекеттік сектор субъектілерінің қаражаты есебінен қаржыландырылатын объектілердің құрылысына жобалау алдындағы және жобалау (жобалау-сметалық) құжаттамасының Бірыңғай мемлекеттік электрондық банкін қалыптастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 19 қарашадағы № 705 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/150765/rus
