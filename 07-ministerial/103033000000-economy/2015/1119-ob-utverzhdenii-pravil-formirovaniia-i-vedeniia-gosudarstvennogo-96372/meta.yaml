act_code: '96372'
requisite: Приказ Министра национальной экономики Республики Казахстан от 19 ноября 2015 года № 705. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 декабря 2015 года № 12422. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 15 мая 2026 года № 238 (вводится в действие с 1 июля 2026 года)
title:
  rus: Об утверждении Правил формирования и ведения государственного банка проектов строительства, а также предоставления технико-экономических обоснований, типовых проектов и проектной (проектно-сметной) документации
  kaz: Құрылыс жобаларының мемлекеттік банкін қалыптастыру және жүргізу, сондай-ақ техникалық экономикалық негіздемелерді, үлгілік жобаларды және жобалау (жобалау-сметалық) құжаттамасын ұсыну қағидаларын бекіту туралы
