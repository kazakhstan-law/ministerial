caused_by:
  code: '142914'
  requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 12 мая 2020 года № 187/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 мая 2020 года № 20654. Утратил силу приказом и.о. Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 31 марта 2023 года № 130/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 23 декабря 2014 года № 164 «Об утверждении Правил формирования, сбора, хранения и использования документов Национального картографо-геодезического фонда Республики Казахстан» и признании утратившими силу структурных элементов некоторых приказов в сфере геодезии и картографии
    kaz: «Қазақстан Республикасы Ұлттық картографиялық-геодезиялық қорының құжаттарын қалыптастыру, жинау, сақтау және пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2014 жылғы 23 желтоқсандағы № 164 бұйрығына өзгерістер енгізу және геодезия және картография саласындағы кейбір бұйрықтардың құрылымдық элементтерінің күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/142914/rus
