  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 27 марта 2015 года № 272 «Об утверждении стандартов государственных услуг в сфере земельных отношений, геодезии и картографии»
    kaz: «Жер қатынастары, геодезия және картография саласындағы мемлекеттік көрсетілетін қызметтердің стандарттарын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 27 наурыздағы № 272 бұйрығына өзгерістер енгізу туралы
