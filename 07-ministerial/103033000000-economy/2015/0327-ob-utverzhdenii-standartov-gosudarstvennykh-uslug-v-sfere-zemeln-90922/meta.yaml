act_code: '90922'
requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 27 марта 2015 года № 272. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 мая 2015 года № 11050. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 1 октября 2020 года № 301 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении стандартов государственных услуг в сфере земельных отношений, геодезии и картографии
  kaz: Жер қатынастары, геодезия және картография саласындағы мемлекеттік көрсетілетін қызметтердің стандарттарын бекіту туралы
