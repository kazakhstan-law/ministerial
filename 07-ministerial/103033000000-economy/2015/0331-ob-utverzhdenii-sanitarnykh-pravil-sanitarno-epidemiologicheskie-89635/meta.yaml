title:
  rus: Об утверждении Санитарных правил "Санитарно-эпидемиологические требования к организации и проведению санитарно-противоэпидемических (профилактических) мероприятий по предупреждению паразитарных заболеваний"
  kaz: '"Паразиттік аурулардың алдын алу бойынша санитариялық-эпидемияға қарсы (профилактикалық) іс-шараларды ұйымдастыруға және жүргізуге қойылатын санитариялық-эпидемиологиялық талаптар" санитариялық қағидаларын бекіту туралы'
