requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 24 февраля 2015 года № 121. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 марта 2015 года № 10529. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 24 апреля 2017 года № 234 (вводится в действие по истечении десяти календарных дней после дня его первого офицального опубликования)
title:
  rus: Об утверждении форм заключений о качестве строительно-монтажных работ и соответствии выполненных работ проекту, декларации о соответствии, акта приемки объекта в эксплуатацию
  kaz: Құрылыс-монтаждау жұмыстарының сапасы және орындалған жұмыстардың жобаға сәйкестігі туралы қорытындылардың, сәйкестік туралы декларацияның, объектіні пайдалануға қабылдау актісінің нысандарын бекіту туралы
