    rus: Об утверждении Гигиенических нормативов показателей безопасности хозяйственно-питьевого и культурно-бытового водопользования
    kaz: Ауыз су және шаруашылық-тұрмыстық суды пайдалану қауіпсіздігі көрсеткіштерінің гигиеналық нормативтерін бекіту туралы
