act_code: '89509'
requisite: Приказ от 16.03.2015 № 209, Министерство национальной экономики Республики Казахстан. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 апреля 2015 года № 10774. Утратил силу приказом Министра здравоохранения Республики Казахстан от 20 февраля 2023 года № 26 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Санитарных правил "Санитарно-эпидемиологические требования к водоисточникам, местам водозабора для хозяйственно-питьевых целей, хозяйственно-питьевому водоснабжению и местам культурно-бытового водопользования и безопасности водных объектов"
  kaz: '"Су көздеріне, шаруашылық-ауыз су мақсаты үшін су жинау орындарына, шаруашылық-ауыз сумен жабдықтауға және суды мәдени-тұрмыстық пайдалану орындарына және су объектілерінің қауіпсіздігіне қойылатын санитариялық-эпидемиологиялық талаптар" санитариялық қағидаларын бекіту туралы'
