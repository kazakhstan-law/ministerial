  title:
    rus: О внесении изменений в приказы исполняющего обязанности Министра национальной экономики Республики Казахстан от 27 марта 2015 года № 264 «Об утверждении Правил внутренней торговли» и исполняющего обязанности Министра торговли и интеграции Республики Казахстан от 22 июня 2023 года № 242-НҚ «Об утверждении Правил организации деятельности торговых рынков, требований к содержанию территории, оборудованию и оснащению торгового рынка» и признании утратившими силу приказов Министра национальной экономики Республики Казахстан от 28 февраля 2015 года № 160 «Об утверждении минимальных нормативов обеспеченности населения торговой площадью» и Заместителя Премьер-Министра - Министра торговли и интеграции Республики Казахстан от 9 марта 2023 года № 100-НҚ «О внесении изменения в приказ Министра национальной экономики Республики Казахстан от 28 февраля 2015 года № 160 «Об утверждении минимальных нормативов обеспеченности населения торговой площадью»
    kaz: «Ішкі сауда қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 27 наурыздағы № 264 және «Сауда базарларының қызметін ұйымдастыру қағидаларын, сауда базарының аумағын күтіп-ұстауға, оны жабдықтауға және жарақтандыруға қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің міндетін атқарушының 2023 жылғы 22 маусымдағы № 242-НҚ бұйрықтарына өзгерістер енгізу және «Халықты сауда алаңымен қамтамасыз етудің ең төменгі нормативтерін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 28 ақпандағы № 160 және «Халықты сауда алаңымен қамтамасыз етудің ең төмен нормативтерін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 28 ақпандағы № 160 бұйрығына өзгеріс енгізу туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Сауда және интеграция министрінің 2023 жылғы 9 наурыздағы № 100-НҚ бұйрықтарының күші жойылды деп тану туралы
