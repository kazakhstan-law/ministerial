  title:
    rus: О внесении изменения в приказ Министра национальной экономики Республики Казахстан от 2 декабря 2015 года № 114-нқ «Об утверждении реестра должностей гражданских служащих Министерства национальной экономики Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық экономика министрлігінің азаматтық қызметшілер лауазымдарының тізілімін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 2 желтоқсандағы № 114-нқ бұйрығына өзгеріс енгізу туралы
