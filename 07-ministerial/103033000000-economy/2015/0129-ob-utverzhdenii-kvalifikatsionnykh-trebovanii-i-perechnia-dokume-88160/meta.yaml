title:
  rus: Об утверждении квалификационных требований и перечня документов, подтверждающих соответствие им, для деятельности по покупке электрической энергии в целях энергоснабжения, эксплуатации магистральных газопроводов, нефтепроводов, нефтепродуктопроводов
  kaz: Энергиямен жабдықтау мақсатында электр энергиясын сатып алу, магистральдық газ құбырларын, мұнай құбырларын, мұнай өнiмдерi құбырларын пайдалану қызметі үшін біліктілік талаптары мен оларға сәйкестiкті растайтын құжаттар тiзбесін бекіту туралы
