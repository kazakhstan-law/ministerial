  title:
    rus: О внесении изменений и дополнений в приказы Министра национальной экономики Республики Казахстан от 29 января 2015 года № 60 «Об утверждении квалификационных требований и перечня документов, подтверждающих соответствие им, для деятельности по покупке электрической энергии в целях энергоснабжения, эксплуатации магистральных газопроводов, нефтепроводов, нефтепродуктопроводов» и от 5 июня 2020 года № 47 «Об утверждении Правил оказания государственной услуги «Выдача лицензии на деятельность по покупке электрической энергии в целях энергоснабжения»
    kaz: «Энергиямен жабдықтау мақсатында электр энергиясын сатып алу, магистральдық газ құбырларын, мұнай құбырларын, мұнай өнiмдерi құбырларын пайдалану қызметі үшін біліктілік талаптары мен оларға сәйкестiкті растайтын құжаттар тiзбесін бекіту туралы» 2015 жылғы 29 қаңтардағы № 60 және «Энергиямен жабдықтау мақсатында электр энергиясын сатып алу қызметіне лицензия беру» мемлекеттік қызметін көрсету қағидаларын бекіту туралы» 2020 жылғы 5 маусымдағы № 47 Қазақстан Республикасы Ұлттық экономика министрінің бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/206617/rus
