title:
  rus: Об утверждении Типовых правил расчета норм потребления коммунальных услуг по электроснабжению для потребителей, не имеющих приборов учета и коммунальных услуг по реализации тепловой энергии для потребителей, не имеющих приборов коммерческого учета
  kaz: Есептеу аспаптары жоқ тұтынушылар үшін электрмен жабдықтау бойынша коммуналдық қызметтерді және коммерциялық есепке алу аспаптары жоқ тұтынушылар үшін жылу энергиясын сату бойынша коммуналдық қызметтерді тұтыну нормаларын есептеудің үлгілік қағидаларын бекіту туралы
