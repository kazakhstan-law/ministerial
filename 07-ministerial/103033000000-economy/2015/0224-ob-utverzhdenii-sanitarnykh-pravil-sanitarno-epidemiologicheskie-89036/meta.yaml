requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 24 февраля 2015 года № 124. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 апреля 2015 года № 10725. Утратил силу приказом Министра здравоохранения Республики Казахстан от 20 августа 2021 года № ҚР ДСМ-83 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Санитарных правил «Санитарно-эпидемиологические требования к объектам производства кондитерских изделий, условиям производства, расфасовки, транспортировки, хранения, реализации, утилизации и уничтожения кондитерских изделий»
  kaz: «Кондитерлік бұйымдарды өндіру объектілеріне, кондитерлік бұйымдарды өндіру, өлшеп-орау, тасымалдау, сақтау, өткізу, кәдеге жарату және жою шарттарына қойылатын санитариялық-эпидемиологиялық талаптар» санитариялық қағидаларын бекіту туралы
