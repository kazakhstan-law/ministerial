requisite: Приказ Министра национальной экономики Республики Казахстан от 5 марта 2015 года № 187. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 апреля 2015 года № 10684. Утратил силу приказом Министра здравоохранения Республики Казахстан от 29 мая 2025 года № 48 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм автомобильных и механических транспортных средств для обслуживания государственных учреждений - противочумных станций Комитета по защите прав потребителей Министерства национальной экономики Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық экономика министрлігі Тұтынушылардың құқықтарын қорғау комитетінің мемлекеттік мекемелері - обаға қарсы күрес станцияларына қызмет көрсетуге арналған автомобиль және механикалық көлік құралдарының заттай нормаларын бекіту туралы
