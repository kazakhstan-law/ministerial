requisite: Приказ Министра национальной экономики Республики Казахстан от 31 марта 2015 года № 293. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 апреля 2015 года № 10633. Утратил силу приказом Министра национальной экономики Республики Казахстан от 20 марта 2015 года № 238
title:
  rus: Об утверждении Правил оформления и выдачи исходных материалов (данных) для проектирования, а также прохождения разрешительных процедур на строительство новых и изменение существующих объектов (зданий, сооружений, их комплексов и коммуникаций)
  kaz: Жобалау үшін бастапқы материалдарды (деректерді) ресімдеудің және берудің, сондай-ақ жаңа объектілер салуға және қазіргі бар объектілерді (ғимараттар, құрылыстар, олардың кешендерін және коммуникацияларды) өзгертуге рұқсат беретін рәсімдерден өтудің қағидаларын бекіту туралы
