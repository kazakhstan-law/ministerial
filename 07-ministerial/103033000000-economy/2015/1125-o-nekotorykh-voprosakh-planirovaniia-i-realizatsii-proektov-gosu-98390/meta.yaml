  requisite: Приказ Министра национальной экономики Республики Казахстан от 8 декабря 2020 года № 89. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 декабря 2020 года № 21738. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 23 декабря 2025 года № 133 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 5 декабря 2014 года № 129 «Об утверждении Правил разработки или корректировки, проведения необходимых экспертиз инвестиционного предложения государственного инвестиционного проекта, а также планирования, рассмотрения, отбора, мониторинга и оценки реализации бюджетных инвестиций и определения целесообразности бюджетного кредитования» и в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 25 ноября 2015 года № 725 «О некоторых вопросах планирования и реализации проектов государственно-частного партнерства»
    kaz: «Мемлекеттік инвестициялық жобаның инвестициялық ұсынысын әзірлеу немесе түзету, оған қажетті сараптамаларды жүргізу, сондай-ақ бюджеттік инвестицияларды жоспарлау, қарау, іріктеу, іске асырылуын мониторингілеу және бағалау және бюджеттік кредиттеудiң орындылығын айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2014 жылғы 5 желтоқсандағы № 129 бұйрығына және Қазақстан Республикасы Ұлттық экономика министрінің бұйрығына «Мемлекеттік-жекешелік әріптестік жобаларын жоспарлаудың және іске асырудың кейбір мәселелері туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 25 қарашадағы № 725 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/149503/rus
