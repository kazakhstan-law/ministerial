requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 25 ноября 2015 года № 725. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12717. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 16 июня 2025 года № 52 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
