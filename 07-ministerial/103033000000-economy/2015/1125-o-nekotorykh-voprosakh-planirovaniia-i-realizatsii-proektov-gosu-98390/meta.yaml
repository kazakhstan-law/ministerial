  requisite: Приказ Министра национальной экономики Республики Казахстан от 6 декабря 2022 года № 120. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 декабря 2022 года № 30996. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 12 января 2026 года № 3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра экономики и бюджетного планирования Республики Казахстан от 23 февраля 2009 года № 24 «Об утверждении Методики определения стоимости объекта концессии и суммарной стоимости государственной поддержки деятельности концессионеров и источников возмещения затрат» и приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 25 ноября 2015 года № 725 «О некоторых вопросах планирования и реализации проектов государственно-частного партнерства»
    kaz: «Концессия объектісінің құнын және концессионерлер қызметін мемлекеттік қолдаудың жиынтық құнын және шығындардың орнын толтыру көздерін айқындау әдістемесін бекіту туралы» Қазақстан Республикасының Экономика және бюджеттік жоспарлау министрінің 2009 жылғы 23 ақпандағы № 24 бұйрығына және «Мемлекеттік-жекешелік әріптестік жобаларын жоспарлаудың және іске асырудың кейбір мәселелері туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 25 қарашадағы № 725 бұйрығына өзгерістер енгізу туралы»
  link: https://zan.gov.kz/client/#!/doc/174992/rus
