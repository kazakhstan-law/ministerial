  title:
    rus: О внесении изменений в приказы Министра национальной экономики Республики Казахстан от 19 марта 2015 года № 229 «Об утверждении Правил организации деятельности и осуществления функций заказчика (застройщика)» и от 20 ноября 2015 года № 707 «Об утверждении Правил определения стоимости строительства объектов за счет государственных инвестиций и средств субъектов квазигосударственного сектора»
    kaz: Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 19 наурыздағы № 229 «Тапсырыс берушінің (құрылыс салушының) қызметін ұйымдастырудың және функцияларын жүзеге асырудың қағидаларын бекіту туралы» және 2015 жылғы 20 қарашадағы № 707 «Мемлекеттік инвестициялар және квазимемлекеттік сектор субъектілерінің қаражаты есебінен объектілер құрылысының құнын айқындау қағидаларын бекіту туралы» бұйрықтарына өзгерістер енгізу туралы
