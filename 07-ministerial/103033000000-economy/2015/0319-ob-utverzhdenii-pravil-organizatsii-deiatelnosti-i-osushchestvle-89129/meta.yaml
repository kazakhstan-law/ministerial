title:
  rus: Об утверждении Правил организации деятельности и осуществления функций заказчика (застройщика)
  kaz: Тапсырыс берушінің (құрылыс салушының) қызметін ұйымдастырудың және функцияларын жүзеге асырудың қағидаларын бекіту туралы
