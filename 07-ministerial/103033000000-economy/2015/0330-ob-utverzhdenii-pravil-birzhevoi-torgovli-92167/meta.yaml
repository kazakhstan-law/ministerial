  title:
    rus: О внесении изменений в некоторые приказы Министерства национальной экономики Республики Казахстан и признании утратившим силу приказа Министра национальной экономики Республики Казахстан от 26 февраля 2015 года № 140 «Об утверждении ежедневных электронных форм отчетности товарных бирж, правил их представления»
    kaz: Қазақстан Республикасы Ұлттық экономика министрлігінің кейбір бұйрықтарына өзгерістер енгізу және «Тауар биржаларының күнделікті электрондық есептілік нысандарын, оларды ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 26 ақпандағы № 140 бұйрығының күші жойылды деп тану туралы
