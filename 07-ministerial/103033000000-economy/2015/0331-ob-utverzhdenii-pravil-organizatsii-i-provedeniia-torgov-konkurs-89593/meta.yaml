  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 31 марта 2015 года № 290 «Об утверждении Правил организации и проведения торгов (конкурсов, аукционов) по продаже земельного участка или права аренды земельного участка, в том числе в электронном виде»
    kaz: «Жер учаскесін немесе жер учаскесін жалдау құқығын сату жөніндегі сауда-саттықты (конкурстарды, аукциондарды), оның ішінде электрондық түрде, ұйымдастыру мен өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 31 наурыздағы № 290 бұйрығына өзгерістер енгізу туралы
