requisite: Приказ Министра национальной экономики Республики Казахстан от 26 ноября 2015 года № 731. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 декабря 2015 года № 12426. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 23 октября 2025 года № 112 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики определения лимитов государственных обязательств по проектам государственно-частного партнерства, в том числе государственных концессионных обязательств, Правительства Республики Казахстан и местных исполнительных органов
  kaz: Қазақстан Республикасы Үкiметiнің және жергiлiктi атқарушы органдардың мемлекеттік-жекешелік әріптестік жобалары бойынша мемлекеттік міндеттемелерінің, оның ішінде мемлекеттiк концессиялық мiндеттемелерiнiң лимиттерiн айқындау әдiстемесiн бекіту туралы
