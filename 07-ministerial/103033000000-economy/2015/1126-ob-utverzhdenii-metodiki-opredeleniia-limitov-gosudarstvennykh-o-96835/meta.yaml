  title:
    rus: О внесении изменения в приказ Министра национальной экономики Республики Казахстан от 26 ноября 2015 года № 731 «Об утверждении Методики определения лимитов государственных обязательств по проектам государственно-частного партнерства, в том числе государственных концессионных обязательств, Правительства Республики Казахстан и местных исполнительных органов»
    kaz: «Қазақстан Республикасы Үкiметiнің және жергiлiктi атқарушы органдардың мемлекеттік-жекешелік әріптестік жобалары бойынша мемлекеттік міндеттемелерінің, оның ішінде мемлекеттiк концессиялық мiндеттемелерiнiң лимиттерiн айқындау әдiстемесiн бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 26 қарашадағы № 731 бұйрығына өзгеріс енгізу туралы
