requisite: Приказ И.о Министра национальной экономики Республики Казахстан от 27 марта 2015 года № 249. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 апреля 2015 года № 10927. Утратил силу приказом Министра национальной экономики Республики Казахстан от 14 февраля 2019 года № 14 (вводится в действие по истечении шести месяцев после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил разработки, утверждения планов развития контролируемых государством акционерных обществ и товариществ с ограниченной ответственностью, государственных предприятий, а также мониторинга и оценки их реализации
  kaz: Мемлекет бақылайтын акционерлік қоғамдар мен жауапкершілігі шектеулі серіктестіктердің, мемлекеттік кәсіпорындардың даму жоспарларын әзірлеу, бекіту, сондай-ақ олардың іске асырылуын мониторингтеу және бағалау қағидаларын бекіту туралы
