title:
  rus: Об утверждении формы Типового кредитного  договора, заключаемого между уполномоченной организацией по микрокредитованию и микрофинансовой организацией для   микрокредитования субъектов малого предпринимательства в рамках Единой программы поддержки и развития бизнеса «Дорожная карта бизнеса 2020»
  kaz: «Бизнестің жол картасы 2020» бизнесті қолдау мен дамытудың бірыңғай бағдарламасы шеңберінде шағын кәсіпкерлік субъектілерін микрокредиттеу үшін микрокредит беру жөніндегі уәкілетті ұйым мен микроқаржы ұйымы арасында жасалатын үлгілік кредиттік шарт нысаны бекіту туралы
