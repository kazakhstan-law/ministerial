act_code: '89063'
requisite: Приказ Министра национальной экономики Республики Казахстан от 18 февраля 2015 года № 107. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 марта 2015 года № 10521. Утратил силу приказом Министра здравоохранения Республики Казахстан от 2 июля 2024 года № 52 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил осуществления санитарно-карантинного контроля над завозом и распространением инфекционных и паразитарных заболеваний на Государственной границе Республики Казахстан, совпадающей с таможенной границей Таможенного союза, и обеспечения санитарной охраны границы и территории Республики Казахстан
  kaz: Кеден одағының кедендік шекарасымен тұспа-тұс келетін Қазақстан Республикасының Мемлекеттік шекарасында инфекциялық және паразиттік аурулардың әкелінуін және таралуын санитариялық-карантиндік бақылауды жүзеге асыру және Қазақстан Республикасының шекарасы мен аумағын санитариялық қорғауды қамтамасыз ету қағидаларын бекіту туралы
