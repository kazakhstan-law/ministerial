    kaz: '"Халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы" Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 4 мамырдағы № 374 бұйрығына өзгерістер енгізу туралы'
