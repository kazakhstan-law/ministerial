act_code: '90073'
requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 27 марта 2015 года № 257. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 мая 2015 года № 11018. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 4 февраля 2021 года № 44 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандартов государственных услуг «Выдача справки по определению адреса объектов недвижимости на территории Республики Казахстан», «Предоставление исходных материалов при разработке проектов строительства и реконструкции (перепланировки и переоборудования)» и «Выдача решения на реконструкцию (перепланировку, переоборудование) помещений (отдельных частей) существующих зданий, не связанных с изменением несущих и ограждающих конструкций, инженерных систем и оборудования»
  kaz: «Қазақстан Республикасының аумағында жылжымайтын мүлік объектілерінің мекенжайын айқындау бойынша анықтама беру», «Құрылыс және реконструкция (қайта жоспарлау, қайта жабдықтау) жобаларын әзірлеу кезінде бастапқы материалдарды ұсыну» және «Тіреу және қоршау конструкцияларын, инженерлік жүйелер мен жабдықтарды өзгертпей қолданыстағы ғимараттардағы үй-жайларды (жекелеген бөліктерін) реконструкциялауға (қайта жоспарлауға, қайта жабдықтауға) шешім беру» мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы
