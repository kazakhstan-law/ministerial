caused_by:
  code: '99569'
  requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 21 января 2016 года № 23. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 февраля 2016 года № 13160. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 4 февраля 2021 года № 44 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 27 марта 2015 года № 257 "Об утверждении стандартов государственных услуг "Выдача справки по определению адреса объектов недвижимости на территории Республики Казахстан", "Выдача архитектурно-планировочного задания" и "Выдача решения на реконструкцию (перепланировку, переоборудование) помещений (отдельных частей) существующих зданий, не связанных с изменением несущих и ограждающих конструкций, инженерных систем и оборудования"
    kaz: '"Қазақстан Республикасының аумағында жылжымайтын мүлік объектілерінің мекенжайын айқындау жөнінде анықтама беру", "Сәулет-жоспарлау тапсырмасын беру" және "Тіреу және қоршау конструкцияларын, инженерлік жүйелер мен жабдықтарды өзгертуге байланысты емес қолданыстағы ғимараттардың үй-жайларын (жекелеген бөліктерін) реконструкциялауға (қайта жоспарлауға, қайта жабдықтауға) шешім беру" мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы" Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2015 жылғы 27 наурыздағы № 257 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/99569/rus
