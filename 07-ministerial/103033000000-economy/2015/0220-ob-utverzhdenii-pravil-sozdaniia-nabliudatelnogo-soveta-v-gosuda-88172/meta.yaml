title:
  rus: Об утверждении Правил создания наблюдательного совета в государственных предприятиях на праве хозяйственного ведения, требований, предъявляемых к лицам, избираемым в состав наблюдательного совета, а также Правил конкурсного отбора членов наблюдательного совета и досрочного прекращения их полномочий
  kaz: Шаруашылық жүргізу құқығындағы мемлекеттік кәсіпорындарда байқау кеңесін құру қағидаларын, байқау кеңесінің құрамына сайланатын адамдарға қойылатын талаптарды, сондай-ақ Байқау кеңесінің мүшелерін конкурстық іріктеу және олардың өкілеттігін мерзімінен бұрын тоқтату қағидаларын бекіту туралы
