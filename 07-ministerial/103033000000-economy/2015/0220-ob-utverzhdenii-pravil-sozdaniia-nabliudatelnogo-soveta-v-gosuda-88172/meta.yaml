  title:
    rus: О внесении изменений и дополнения в приказ Министра национальной экономики Республики Казахстан от 20 февраля 2015 года № 113 «Об утверждении Правил создания наблюдательного совета в государственных предприятиях на праве хозяйственного ведения, требований, предъявляемых к лицам, избираемым в состав наблюдательного совета, а также Правил конкурсного отбора членов наблюдательного совета и досрочного прекращения их полномочий»
    kaz: «Шаруашылық жүргізу құқығындағы мемлекеттік кәсіпорындарда байқау кеңесін құру қағидаларын, байқау кеңесінің құрамына сайланатын адамдарға қойылатын талаптарды, сондай-ақ Байқау кеңесінің мүшелерін конкурстық іріктеу және олардың өкілеттігін мерзімінен бұрын тоқтату қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 20 ақпандағы № 113 бұйрығына өзгерістер мен толықтыру енгізу туралы
