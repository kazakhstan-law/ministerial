title:
  rus: Об утверждении Санитарных правил «Санитарно-эпидемиологические требования к производству, реализации и хранению парфюмерно-косметической продукции и средств гигиены полости рта»
  kaz: «Парфюмерлік-косметикалық өнімдер мен ауыз қуысы гигиенасы құралдарын өндіруге, өткізуге және сақтауға қойылатын санитариялық-эпидемиологиялық талаптар» санитариялық қағидаларын бекіту туралы
