  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 20 января 2015 года № 30 «Об утверждении Правил распределения объемов тарифных квот между участниками внешнеэкономической деятельности на ввоз в Республику Казахстан отдельных видов мяса»
    kaz: «Қазақстан Республикасына еттiң кейбір түрлерiн әкелуге арналған тарифтiк квоталардың көлемдерін сыртқы экономикалық қызметке қатысушылар арасында бөлу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 20 қаңтардағы № 30 бұйрығына өзгерістер енгізу туралы
