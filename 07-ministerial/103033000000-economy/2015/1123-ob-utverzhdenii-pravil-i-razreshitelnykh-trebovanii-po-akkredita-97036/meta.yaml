  title:
    rus: Об утверждении правил оказания государственных услуг в сфере выдачи лицензий в архитектурной, градостроительной и строительной деятельности и о внесении изменений и дополнений в некоторые приказы Министра национальной экономики Республики Казахстан
    kaz: Сәулет, қала салу және құрылыс қызметінде лицензия беру саласындағы мемлекеттік қызметтер көрсету қағидаларын бекіту туралы және Қазақстан Республикасы Ұлттық экономика министрінің кейбір бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
