act_code: '97036'
requisite: Приказ Министра национальной экономики Республики Казахстан от 23 ноября 2015 года № 709. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 декабря 2015 года № 12535
title:
  rus: Об утверждении Правил и разрешительных требований по аккредитации организаций, осуществляющих инжиниринговые услуги по техническому надзору и экспертные работы по техническому обследованию надежности и устойчивости зданий и сооружений на технически и технологически сложных объектах первого и второго уровней ответственности
  kaz: Бірінші және екінші жауапкершілік деңгейіндегі техникалық және технологиялық күрделі объектілердегі ғимараттар мен құрылыстардың сенімділігін және орнықтылығын техникалық зерттеп-қарау бойынша техникалық қадағалау және сараптама жұмыстары жөніндегі инжинирингтік қызметтер көрсетуді жүзеге асыратын ұйымдарды аккредиттеу жөніндегі қағидаларды және рұқсат беру талаптарын бекіту туралы
