  title:
    rus: О внесении изменений в приказы Министра национальной экономики Республики Казахстан от 19 ноября 2015 года № 703 «Об утверждении Типового положения о территориальных советах местного самоуправления» и от 7 августа 2017 года № 294 «Об утверждении Типового положения об аппарате акима города районного значения, села, поселка, сельского округа»
    kaz: Қазақстан Республикасы Ұлттық экономика министрінің «Жергілікті өзін-өзі басқарудың аумақтық кеңестері туралы үлгілік ережені бекіту туралы» 2015 жылғы 19 қарашадағы № 703 және «Аудандық маңызы бар қала, ауыл, кент, ауылдық округ әкімінің аппараты туралы үлгі ережені бекіту туралы» 2017 жылғы 7 тамыздағы № 294 бұйрықтарына өзгерістер енгізу туралы
