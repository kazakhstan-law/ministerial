title:
  rus: Об утверждении квалификационных требований, предъявляемых к деятельности по лицензированию экспорта и импорта товаров, перечня документов, подтверждающих соответствие им, форм заявлений для получения лицензии и (или) приложения к лицензии, форм лицензий и (или) приложения к лицензии
  kaz: Тауарлар экспорты мен импортын лицензиялау жөніндегі қызметке қойылатын біліктілік талаптары мен оларға сәйкестікті растайтын құжаттар тізбесін, лицензияны және (немесе) лицензияға қосымшаны алуға арналған өтініштердің нысандарын, лицензия және (немесе) лицензияға қосымшаның нысандарын бекіту туралы
