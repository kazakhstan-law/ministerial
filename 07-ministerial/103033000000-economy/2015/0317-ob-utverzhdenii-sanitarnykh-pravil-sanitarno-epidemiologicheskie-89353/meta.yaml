title:
  rus: Об утверждении Санитарных правил «Санитарно-эпидемиологические требования к организации и проведению санитарно-противоэпидемических (профилактических) мероприятий в отношении больных инфекционными заболеваниями, против которых проводятся профилактические прививки»
  kaz: «Қарсы профилактикалық егулер жүргізілетін инфекциялық аурулармен ауыратын науқастарға қатысты санитариялық-эпидемияға қарсы (профилактикалық) іс-шараларды ұйымдастыруға және өткізуге қойылатын санитариялық-эпидемиологиялық талаптар» санитариялық қағидаларын бекіту туралы
