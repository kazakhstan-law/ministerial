  title:
    rus: О внесении изменений и дополнения в совместный приказ Министра национальной экономики Республики Казахстан от 22 декабря 2015 года № 783 и Министра по инвестициям и развитию Республики Казахстан от 28 декабря 2015 года № 1262 «Об утверждении Правил адресации объектов недвижимости на территории Республики Казахстан»
    kaz: «Қазақстан Республикасының аумағындағы жылжымайтын мүлік объектілерін адрестеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 22 желтоқсандағы № 783 және Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 28 желтоқсандағы № 1262 бірлескен бұйрығына өзгерістер мен толықтыру енгізу туралы
