  title:
    rus: О внесении изменения в приказ Министра национальной экономики Республики Казахстан от 25 февраля 2015 года № 134 «Об утверждении норматива отчисления части чистого дохода республиканских государственных предприятий, за исключением республиканских государственных предприятий, созданных Национальным Банком Республики Казахстан»
    kaz: «Қазақстан Республикасының Ұлттық Банкі құрған республикалық мемлекеттік кәсіпорындарды қоспағанда, республикалық мемлекеттік кәсіпорындардың таза кірісінің бір бөлігін аудару нормативін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 25 ақпандағы № 134 бұйрығына өзгеріс енгізу туралы
