act_code: '88136'
requisite: Приказ Министра национальной экономики Республики Казахстан от 25 февраля 2015 года № 134. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 марта 2015 года № 10545. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 27 мая 2025 года № 34 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норматива отчисления части чистого дохода республиканских государственных предприятий, за исключением республиканских государственных предприятий, созданных Национальным Банком Республики Казахстан
  kaz: Қазақстан Республикасының Ұлттық Банкі құрған республикалық мемлекеттік кәсіпорындарды қоспағанда, республикалық мемлекеттік кәсіпорындардың таза кірісінің бір бөлігін аудару нормативін бекіту туралы
