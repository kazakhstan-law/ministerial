  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 25 февраля 2015 года № 134 «Об утверждении норматива отчисления части чистого дохода республиканских государственных предприятий»
    kaz: «Республикалық мемлекеттік кәсіпорындардың таза кірісінің бір бөлігін аудару нормативін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 25 ақпандағы № 134 бұйрығына өзгерістер енгізу туралы
