  requisite: Приказ Министра национальной экономики Республики Казахстан от 12 декабря 2017 года № 404. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 января 2018 года № 16188. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 27 мая 2025 года № 34 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в приказ Министра национальной экономики Республики Казахстан от 25 февраля 2015 года № 134 «Об утверждении норматива отчисления части чистого дохода республиканских государственных предприятий»
    kaz: «Республикалық мемлекеттік кәсіпорындардың таза кірістерінің бір бөлігін аудару нормативін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 25 ақпандағы № 134 бұйрығына өзгерістер мен толықтыру енгізу туралы
