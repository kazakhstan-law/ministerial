  code: '125439'
  requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 9 октября 2018 года № 701. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 октября 2018 года № 17577. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 20 марта 2026 года № 123 (вводится в действие с 1 июля 2026 года)
  title:
    rus: О внесении изменений и дополнений в приказ Министра национальной экономики Республики Казахстан от 30 ноября 2015 года № 750 «Об утверждении Правил организации застройки и прохождения разрешительных процедур в сфере строительства» и приказ Министра по инвестициям и развитию Республики Казахстан от 13 декабря 2017 года № 867 «Об утверждении Правил приемки построенного объекта в эксплуатацию собственником самостоятельно, а также формы акта приемки»
    kaz: «Құрылыс саласындағы құрылыс салуды ұйымдастыру және рұқсат беру рәсімдерінен өту қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 30 қарашадағы № 750 бұйрығына және «Меншік иесінің салынған объектіні пайдалануға дербес қабылдау қағидаларын, сондай-ақ қабылдау актісінің нысанын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 13 желтоқсандағы № 867 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/125439/rus
