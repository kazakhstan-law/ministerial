  code: '179252'
  requisite: Приказ Министра национальной экономики Республики Казахстан от 23 февраля 2023 года № 26. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 марта 2023 года № 32002. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 18 июля 2025 года № 68 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказы Министра национальной экономики Республики Казахстан от 25 мая 2016 года № 127-нқ «Об утверждении Правил применения поощрения государственных служащих Министерства национальной экономики Республики Казахстан» и от 18 апреля 2018 года № 157 «Об утверждении Правил определения предельного объема внешнего долга квазигосударственного сектора и Перечня субъектов квазигосударственного сектора, в отношении которых определяется предельный объем внешнего долга»
    kaz: Қазақстан Республикасы Ұлттық экономика министрінің «Қазақстан Республикасы Ұлттық экономика министрлігінің мемлекеттік қызметшілерін көтермелеуді қолдану қағидаларын бекіту туралы» 2016 жылғы 25 мамырдағы № 127-нқ және «Квазимемлекеттік сектордың сыртқы борышының шекті көлемін айқындау қағидаларын және Оларға қатысты сыртқы борыштың шекті көлемі айқындалатын квазимемлекеттік сектор субъектілерінің тізбесін бекіту туралы» 2018 жылғы 18 сәуірдегі № 157 бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/179252/rus
