title:
  rus: Об утверждении Правил определения предельного объема внешнего долга квазигосударственного сектора и Перечня субъектов квазигосударственного сектора, в отношении которых определяется предельный объем внешнего долга
  kaz: Квазимемлекеттік сектордың сыртқы борышының шекті көлемін айқындау қағидаларын және Оларға қатысты сыртқы борыштың шекті көлемі айқындалатын квазимемлекеттік сектор субъектілерінің тізбесін бекіту туралы
