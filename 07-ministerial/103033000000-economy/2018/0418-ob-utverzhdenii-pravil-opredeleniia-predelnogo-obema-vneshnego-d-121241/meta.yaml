  title:
    rus: О внесении изменения в приказ Министра национальной экономики Республики Казахстан от 18 апреля 2018 года № 157 «Об утверждении Правил определения предельного объема внешнего долга квазигосударственного сектора и Перечня субъектов квазигосударственного сектора, в отношении которых определяется предельный объем внешнего долга»
    kaz: «Квазимемлекеттік сектордың сыртқы борышының шекті көлемін айқындау қағидаларын және Оларға қатысты сыртқы борыштың шекті көлемі айқындалатын квазимемлекеттік сектор субъектілерінің тізбесін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 18 сәуірдегі № 157 бұйрығына өзгеріс енгізу туралы
