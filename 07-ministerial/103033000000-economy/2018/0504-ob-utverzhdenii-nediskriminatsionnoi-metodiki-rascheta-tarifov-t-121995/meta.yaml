act_code: '121995'
requisite: Приказ Министра национальной экономики Республики Казахстан от 4 мая 2018 года № 175. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 мая 2018 года № 16921. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Недискриминационной методики расчета тарифов (цен, ставок сборов) или их предельных уровней на регулируемые услуги (товары, работы) водоснабжения и (или) водоотведения
  kaz: Сумен жабдықтаудың және (немесе) суды бұрудың реттеліп көрсетілетін қызметтеріне (тауарларына, жұмыстарына) тарифтерді (бағаларды, алымдар мөлшерлемелерін) немесе олардың шектi деңгейлерiн есептеудің кемсітпейтін әдістемесін бекіту туралы
