  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 3 марта 2018 года № 92 «Об утверждении типовых квалификационных характеристик должностей руководителей, специалистов и других служащих организаций в сферах государственной статистической деятельности и регулирования торговой деятельности»
    kaz: «Мемлекеттік статистикалық қызмет және сауда қызметін реттеу салаларындағы ұйымдардың басшылары, мамандары және басқа да қызметшілері лауазымдарының үлгілік біліктілік сипаттамаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 3 наурыздағы № 92 бұйрығына өзгерістер енгізу туралы
