  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 27 ноября 2018 года № 84 «Об утверждении Правил кредитования/микрокредитования в городах и моногородах и Правил гарантирования по кредитам/микрокредитам, выдаваемым микрофинансовыми организациями/банками второго уровня в городах» и о признании утратившими силу приказов Министра национальной экономики Республики Казахстан от 8 ноября 2016 года № 470 «Об утверждении формы Договора субсидирования по микрокредитованию» и от 30 марта 2018 года № 129 «Об утверждении Правил конкурсного отбора и поддержки деятельности бизнес-инкубаторов»
    kaz: «Қалаларда және моноқалаларда кредит беру/микрокредит беру қағидаларын және Қалаларда микроқаржы ұйымдары /екінші деңгейдегі банктер беретін кредиттер/микрокредиттер бойынша кепілдік беру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2018 жылғы 27 қарашадағы № 84 бұйрығына өзгерістер енгізу туралы және Қазақстан Республикасы Ұлттық экономика министрінің «Микрокредит беру бойынша субсидиялау шартының нысанын бекіту туралы» 2016 жылғы 8 қарашадағы № 470 және «Конкурстық іріктеу және бизнес-инкубаторлар қызметін қолдау қағидаларын бекіту туралы» 2018 жылғы 30 наурыздағы № 129 бұйрықтарының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/135651/rus
