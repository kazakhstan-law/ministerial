act_code: '126498'
requisite: Приказ Министра национальной экономики Республики Казахстан от 27 ноября 2018 года № 84. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 ноября 2018 года № 17810. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 20 января 2025 года № 3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил кредитования/микрокредитования в городах и моногородах и Правил гарантирования по кредитам/микрокредитам, выдаваемым микрофинансовыми организациями/банками второго уровня в городах
  kaz: Қалаларда және моноқалаларда кредит беру/микрокредит беру қағидаларын және Қалаларда микроқаржы ұйымдары /екінші деңгейдегі банктер беретін кредиттер/микрокредиттер бойынша кепілдік беру қағидаларын бекіту туралы
