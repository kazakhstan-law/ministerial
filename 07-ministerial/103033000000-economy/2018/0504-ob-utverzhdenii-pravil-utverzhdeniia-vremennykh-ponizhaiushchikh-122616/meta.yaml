requisite: Приказ Министра национальной экономики Республики Казахстан от 4 мая 2018 года № 176. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 мая 2018 года № 16968. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил утверждения временных понижающих коэффициентов к тарифам (ценам, ставкам сборов) на услуги по подаче воды по магистральным трубопроводам и (или) каналам и Методики расчета уровня временного понижающего коэффициента к тарифам (ценам, ставкам сборов) на услуги по подаче воды по магистральным трубопроводам и (или) каналам
  kaz: Суды магистральдық труба құбырлары және (немесе) арналар арқылы беру жөніндегі қызметтердің тарифтеріне (бағаларына, алым мөлшерлемелеріне) уақытша төмендету коэффициенттерін бекіту қағидаларын және Суды магистральдық труба құбырлары және (немесе) арналар арқылы беру жөніндегі қызметтердің тарифтеріне (бағаларына, алым мөлшерлемелеріне) уақытша төмендету коэффициентінің деңгейін есептеу әдістемесін бекіту туралы
