requisite: Приказ Министра национальной экономики Республики Казахстан от 13 апреля 2018 года № 153. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 апреля 2018 года № 16848. Утратил силу приказом Министра национальной экономики Республики Казахстан от 12 июля 2023 года № 136 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства национальной экономики Республики Казахстан
