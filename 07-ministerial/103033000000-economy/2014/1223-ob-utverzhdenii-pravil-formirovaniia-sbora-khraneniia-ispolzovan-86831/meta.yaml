title:
  rus: Об утверждении Правил формирования, сбора, хранения, использования и выдачи документов Национального картографо-геодезического фонда Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық картографиялық-геодезиялық қорының құжаттарын қалыптастыру, жинау, сақтау, пайдалану және беру қағидаларын бекіту туралы
