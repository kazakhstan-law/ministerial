    kaz: Сәулет, қала салу және құрылыс қызметінде лицензия беру саласындағы мемлекеттік қызметтер көрсету қағидаларын бекіту туралы және Қазақстан Республикасы Ұлттық экономика министрінің кейбір бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
