act_code: '83149'
requisite: Приказ Министра национальной экономики Республики Казахстан от 21 августа 2014 года № 1. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 сентября 2014 года № 9725
title:
  rus: Об утверждении перечня бюджетных инвестиционных и концессионных проектов, финансирование разработки или корректировки, а также проведение необходимых экспертиз технико-экономических обоснований бюджетных инвестиционных проектов и конкурсных документаций концессионных проектов, консультативное сопровождение концессионных проектов которых осуществляется за счет средств распределяемой бюджетной программы 062 "Разработка или корректировка, а также проведение необходимых экспертиз технико-экономических обоснований бюджетных инвестиционных проектов и конкурсных документаций концессионных проектов, консультативное сопровождение концессионных проектов" Министерства национальной экономики Республики Казахстан на 2014 год
  kaz: Бюджеттік инвестициялық жобалардың техникалық-экономикалық негіздемелерін және концессиялық жобалардың конкурстық құжаттамаларын әзірлеу немесе түзету, сондай-ақ қажетті сараптамалар жүргізу, концессиялық жобаларын консультативтік сүйемелдеу Қазақстан Республикасы Ұлттық экономика министрлігінің 2014 жылға арналған 062 "Бюджеттік инвестициялық жобалардың техникалық-экономикалық негіздемелерін және концессиялық жобалардың конкурстық құжаттамаларын әзірлеу немесе түзету, сондай-ақ қажетті сараптамаларын жүргізу, концессиялық жобаларды консультативтік сүйемелдеу" бөлінетін бюджеттік бағдарламасы есебінен қаржыландырылатын бюджеттік инвестициялық және концессиялық жобалардың тізбесін бекіту туралы
