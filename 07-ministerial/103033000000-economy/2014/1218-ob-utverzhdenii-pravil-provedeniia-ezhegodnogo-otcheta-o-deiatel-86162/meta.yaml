requisite: Приказ Министра национальной экономики Республики Казахстан от 18 декабря 2014 года № 150. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 января 2015 года № 10110. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения ежегодного отчета о деятельности субъекта естественной монополии по предоставлению регулируемых услуг (товаров, работ) перед потребителями и иными заинтересованными лицами
  kaz: Тұтынушыларға және өзге де мүдделі тұлғаларға реттеліп көрсетілетін қызметтерді (тауарларды, жұмыстарды) ұсыну жөніндегі табиғи монополия субъектісінің қызметі туралы жыл сайынғы есепті өткізу қағидаларын бекіту туралы
