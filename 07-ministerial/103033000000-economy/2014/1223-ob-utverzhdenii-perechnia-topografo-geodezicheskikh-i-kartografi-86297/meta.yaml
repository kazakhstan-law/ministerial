requisite: Приказ Министра национальной экономики Республики Казахстан от 23 декабря 2014 года № 163. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 января 2015 года № 10139. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 3 марта 2023 года № 72/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
