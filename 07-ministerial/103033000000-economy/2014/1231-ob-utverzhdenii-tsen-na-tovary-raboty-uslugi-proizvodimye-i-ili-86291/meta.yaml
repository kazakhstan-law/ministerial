act_code: '86291'
requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 31 декабря 2014 года № 199. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 января 2015 года № 10161. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 26 сентября 2024 года № 29 (вводится в действие с 1 сентября 2024 года)
title:
  rus: Об утверждении цен на товары (работы, услуги), производимые и (или) реализуемые субъектом государственной монополии в области государственной статистики
  kaz: Мемлекеттік статистика саласындағы мемлекеттік монополия субъектісі өндіретін және (немесе) өткізетін тауарлардың (жұмыстардың, көрсетілетін қызметтердің) бағаларын бекіту туралы
