  requisite: Приказ Министра национальной экономики Республики Казахстан от 19 июня 2018 года № 221. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 июля 2018 года № 17149. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 26 сентября 2024 года № 29 (вводится в действие с 1 сентября 2024 года)
  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 31 декабря 2014 года № 199 «Об утверждении цен на товары (работы, услуги), производимые и (или) реализуемые субъектом государственной монополии в области государственной статистики»
    kaz: «Мемлекеттік статистика саласындағы мемлекеттік монополия субъектісі өндіретін және (немесе) өткізетін тауарлардың (жұмыстардың, көрсетілетін қызметтердің) бағаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2014 жылғы 31 желтоқсандағы № 199 бұйрығына өзгеріс енгізу туралы
