  code: '119466'
  requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 16 февраля 2018 года № 61. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 марта 2018 года № 16532. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 23 декабря 2025 года № 133 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в приказ Министра национальной экономики Республики Казахстан от 5 декабря 2014 года № 129 «Об утверждении Правил разработки или корректировки, проведения необходимых экспертиз инвестиционного предложения государственного инвестиционного проекта, а также планирования, рассмотрения, отбора, мониторинга и оценки реализации бюджетных инвестиций» и признании утратившими силу некоторых приказов Министра национальной экономики Республики Казахстан
    kaz: «Мемлекеттік инвестициялық жобаның инвестициялық ұсынысын әзірлеу немесе түзету, оған қажетті сараптамаларды жүргізу, сондай-ақ бюджеттік инвестицияларды жоспарлау, қарау, іріктеу, іске асырылуын мониторингілеу және бағалау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2014 жылғы 5 желтоқсандағы № 129 бұйрығына өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Ұлттық экономика министрінің кейбір бұйрықтарының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/119466/rus
