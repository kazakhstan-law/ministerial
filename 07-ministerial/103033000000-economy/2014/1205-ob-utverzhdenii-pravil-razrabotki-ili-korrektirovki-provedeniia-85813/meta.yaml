  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 5 декабря 2014 года № 129 «Об утверждении Правил разработки или корректировки, проведения необходимых экспертиз инвестиционного предложения государственного инвестиционного проекта, а также планирования, рассмотрения, отбора, мониторинга и оценки реализации бюджетных инвестиций»
    kaz: «Мемлекеттік инвестициялық жобаның инвестициялық ұсынысын әзірлеу немесе түзету, қажетті сараптамаларды жүргізу, сондай-ақ бюджеттік инвестицияларды жоспарлау, қарау, іріктеу, мониторингілеу және іске асырылуын бағалау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2014 жылғы 5 желтоқсандағы № 129 бұйрығына өзгерістер енгізу туралы
