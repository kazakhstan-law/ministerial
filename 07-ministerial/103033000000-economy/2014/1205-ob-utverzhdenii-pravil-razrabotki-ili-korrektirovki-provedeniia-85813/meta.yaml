  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра ‒ Министра национальной экономики Республики Казахстан от 5 декабря 2014 года № 129 «Об утверждении Правил разработки или корректировки, проведения необходимых экспертиз инвестиционного предложения государственного инвестиционного проекта, а также планирования, рассмотрения, отбора, мониторинга и оценки реализации бюджетных инвестиций и определения целесообразности бюджетного кредитования»
    kaz: «Мемлекеттік инвестициялық жобаның инвестициялық ұсынысын әзірлеу немесе түзету, оған қажетті сараптамаларды жүргізу, сондай-ақ бюджеттік инвестицияларды жоспарлау, қарау, іріктеу, іске асырылуын мониторингілеу және бағалау және бюджеттік кредиттеудiң орындылығын айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары ‒ Ұлттық экономика министрінің 2014 жылғы 5 желтоқсандағы № 129 бұйрығына өзгерістер енгізу туралы
