requisite: Приказ Министра национальной экономики Республики Казахстан от 29 декабря 2014 года № 177. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 марта 2015 года № 10561. Утратил силу приказом Министра национальной экономики Республики Казахстан от 30 ноября 2015 года № 743
title:
  rus: Об утверждении Правил формирования и утверждения тарифов (цен, ставок сборов) на регулируемые услуги (товары, работы) субъектов естественных монополий, осуществляющих свою деятельность по договорам концессии
  kaz: Өз қызметін концессия шарттары бойынша жүзеге асыратын табиғи монополиялар субъектілерінің реттеліп көрсетілетін қызметтеріне (тауарларына, жұмыстарына) тарифтерді (бағаларды, алымдар мөлшерлемелерін) қалыптастыру және бекіту қағидаларын бекіту туралы
