    kaz: '"Қазақстан Республикасы Ұлттық экономика министрлігінің Табиғи монополияларды реттеу және бәсекелестікті қорғау комитетінің ережесін бекіту туралы" Қазақстан Республикасының Ұлттық экономика министрінің 2014 жылғы 30 қыркүйектегі № 34 бұйрығына өзгерістер мен толықтыру енгізу туралы'
