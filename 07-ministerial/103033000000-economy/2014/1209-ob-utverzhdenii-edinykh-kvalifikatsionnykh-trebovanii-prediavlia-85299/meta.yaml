  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра национальной экономики Республики Казахстан от 9 декабря 2014 года № 136 «Об утверждении единых квалификационных требований и перечня документов, подтверждающих соответствие им, для осуществления деятельности в сфере архитектуры, градостроительства и строительства»
    kaz: «Сәулет, қала құрылысы және құрылыс саласында қызметті жүзеге асыруға қойылатын бірыңғай біліктілік талаптарын және оларға сәйкестікті растайтын құжаттардың тізбесін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2014 жылғы 9 желтоқсандағы № 136 бұйрығына өзгерiстер енгізу туралы
