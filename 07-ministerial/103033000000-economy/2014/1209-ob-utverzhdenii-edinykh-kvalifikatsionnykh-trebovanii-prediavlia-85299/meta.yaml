requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 9 декабря 2014 года № 136. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 декабря 2014 года № 9994. Утратил силу приказом и.о. Министра промышленности и строительства Республики Казахстан от 22 апреля 2026 года № 197 (вводится в действие с 1 июля 2026 года и подлежит официальному опубликованию)
title:
  rus: Об утверждении единых квалификационных требований, предъявляемых для осуществления лицензируемой архитектурной, градостроительной и строительной деятельности
  kaz: Лицензияланатын сәулет, қала құрылысы және құрылыс қызметін жүзеге асыру үшін қойылатын бірыңғай біліктілік талаптарын бекіту туралы
