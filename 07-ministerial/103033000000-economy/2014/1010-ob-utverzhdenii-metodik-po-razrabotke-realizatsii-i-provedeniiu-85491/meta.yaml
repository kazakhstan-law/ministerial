act_code: '85491'
requisite: Приказ Министра национальной экономики Республики Казахстан от 10 октября 2014 года № 50. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 ноября 2014 года № 9872. Утратил силу приказом Министра национальной экономики Республики Казахстан от 4 февраля 2016 года № 58
title:
  rus: Об утверждении Методик по разработке, реализации и проведению мониторинга Стратегического плана развития Республики Казахстан, Прогнозной схемы территориально-пространственного развития страны, государственных программ, стратегических планов государственных органов и программ развития территорий
  kaz: Қазақстан Республикасының Стратегиялық даму жоспарын, Елді аумақтық-кеңістікте дамытудың болжамды схемасын, мемлекеттік бағдарламаларды, мемлекеттік органдардың стратегиялық жоспарларын және аумақтарды дамыту бағдарламаларын әзірлеу, іске асыру және мониторинг жүргізу жөніндегі әдістемелерді бекіту туралы
