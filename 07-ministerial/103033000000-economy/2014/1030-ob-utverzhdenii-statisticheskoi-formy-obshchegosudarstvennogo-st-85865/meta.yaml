  kaz: '"Ғылыми-зерттеу және тәжірибелік-конструкторлық жұмыстар туралы есеп" (коды 0511104, индексі 1-ғылым, кезеңділігі жылдық) жалпымемлекеттік статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы'
