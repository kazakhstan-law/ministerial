title:
  rus: Об утверждении Правил утверждения инвестиционных программ (проектов) субъекта естественной монополии, их корректировки, а также проведения анализа информации об их исполнении
  kaz: Табиғи монополия субъектісінің инвестициялық бағдарламаларын (жобаларын) бекіту, оларды түзету, сондай-ақ олардың орындалуы туралы ақпаратқа талдау жүргізу қағидаларын бекіту туралы
