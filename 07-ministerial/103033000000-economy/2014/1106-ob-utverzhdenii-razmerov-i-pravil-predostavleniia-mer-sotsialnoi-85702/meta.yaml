requisite: Приказ Министра национальной экономики Республики Казахстан от 6 ноября 2014 года № 72. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 декабря 2014 года № 9946
title:
  rus: Об утверждении размеров и Правил предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты
  kaz: Ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтiк қолдау шараларын ұсыну мөлшерін және қағидаларын бекіту туралы
