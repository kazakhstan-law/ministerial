  title:
    rus: О внесении изменений и дополнений в приказ Министра национальной экономики Республики Казахстан от 6 ноября 2014 года № 72 «Об утверждении Правил предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»
    kaz: «Ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2014 жылғы 6 қарашадағы № 72 бұйрығына өзгерістер мен толықтырулар енгізу туралы
