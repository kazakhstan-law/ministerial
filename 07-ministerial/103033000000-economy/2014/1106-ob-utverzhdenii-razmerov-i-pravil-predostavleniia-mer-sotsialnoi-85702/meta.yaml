  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 6 ноября 2014 года № 72 «Об утверждении Правил предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты»
    kaz: «Ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтiк қолдау шараларын көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2014 жылғы 6 қарашадағы № 72 бұйрығына өзгерістер енгізу туралы
