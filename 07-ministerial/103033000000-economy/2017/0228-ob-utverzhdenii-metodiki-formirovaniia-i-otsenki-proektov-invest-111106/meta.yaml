requisite: Приказ Министра национальной экономики Республики Казахстан от 28 февраля 2017 года № 96. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 марта 2017 года № 14928. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики формирования и оценки проектов инвестиционных программ (проектов) субъектов естественных монополий, а также мониторинга и оценки показателей эффективности их реализации
  kaz: Табиғи монополиялар субъектілерінің инвестициялық бағдарламаларының (жобаларының) жобаларын қалыптастыру және бағалау, сондай-ақ оларды іске асыру тиімділігінің көрсеткіштерін мониторингілеу және бағалау әдістемесін бекіту туралы
