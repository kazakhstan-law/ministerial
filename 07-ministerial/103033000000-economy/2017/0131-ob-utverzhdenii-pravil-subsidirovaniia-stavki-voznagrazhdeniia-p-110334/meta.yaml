  title:
    rus: О приостановлении действия некоторых структурных элементов приказа Министра национальной экономики Республики Казахстан от 31 января 2017 года № 35 «Об утверждении Правил субсидирования ставки вознаграждения по выдаваемым кредитам банками второго уровня субъектам частного предпринимательства для целей жилищного строительства»
    kaz: «Тұрғын үй құрылысы мақсаттары үшін жеке кәсіпкерлік субъектілеріне екінші деңгейдегі банктер беретін кредит бойынша сыйақы мөлшерлемесін субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2017 жылғы 31 қаңтардағы № 35 бұйрығына өзгерістер енгізу туралы» бұйрығының кейбір құрылымдық элементтерінің қолданысын тоқтата тұру туралы
