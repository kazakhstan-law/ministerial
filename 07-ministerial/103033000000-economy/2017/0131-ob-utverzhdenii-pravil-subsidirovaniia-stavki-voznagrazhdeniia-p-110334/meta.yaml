title:
  rus: Об утверждении Правил субсидирования ставки вознаграждения по выдаваемым кредитам банками второго уровня субъектам частного предпринимательства для целей жилищного строительства
  kaz: Тұрғын үй құрылысы мақсаттары үшін жеке кәсіпкерлік субъектілеріне екінші деңгейдегі банктер беретін кредиттер бойынша сыйақы мөлшерлемелерін субсидиялау қағидаларын бекіту туралы
