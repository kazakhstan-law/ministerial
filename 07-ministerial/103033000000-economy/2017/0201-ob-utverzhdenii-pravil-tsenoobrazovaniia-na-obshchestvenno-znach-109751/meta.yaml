  title:
    rus: «О внесении изменений и дополнений в приказы Министра национальной экономики Республики Казахстан от 1 февраля 2017 года № 36 «Об утверждении Правил ценообразования на общественно значимых рынках» и от 13 августа 2019 года № 73 «Об утверждении Правил осуществления деятельности субъектами естественных монополий»
    kaz: «Қоғамдық маңызы бар нарықтарда баға белгілеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2017 жылғы 1 ақпандағы № 36 және «Табиғи монополиялар субъектілерінің қызметін жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 13 тамыздағы № 73 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
