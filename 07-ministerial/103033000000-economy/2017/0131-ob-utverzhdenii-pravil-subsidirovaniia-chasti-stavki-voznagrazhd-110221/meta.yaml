  kaz: Ипотекалық тұрғын үй қарыздары бойынша сыйақы мөлшерлемесінің бір бөлігін квазимемлекеттік сектор субъектілері арқылы субсидиялау қағидаларын және квазимемлекеттік сектор субъектісінің көрсетілетін қызметтерінің құнын есептеу әдістемесін бекіту туралы
