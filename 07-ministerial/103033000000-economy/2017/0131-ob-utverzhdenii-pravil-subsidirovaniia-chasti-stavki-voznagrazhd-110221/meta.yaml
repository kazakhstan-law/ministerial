  title:
    rus: О внесении изменений и дополнений в приказ Министра национальной экономики Республики Казахстан от 31 января 2017 года № 34 «Об утверждении Правил предоставления субсидий для возмещения части ставки вознаграждения по ипотечным жилищным займам, выданным банками второго уровня населению, через субъекты квазигосударственного сектора»
    kaz: «Халыққа екінші деңгейдегі банктер берген ипотекалық тұрғын үй қарыздары бойынша сыйақы мөлшерлемесінің бір бөлігін өтеу үшін квазимемлекеттік сектор субъектілері арқылы субсидиялар беру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2017 жылғы 31 қаңтардағы № 34 бұйрығына өзгерістер мен толықтырулар енгізу туралы
