  title:
    rus: О внесении изменения в приказ Министра национальной экономики Республики Казахстан от 28 февраля 2017 года № 103 «Об утверждении Методики по проведению обследования товарных рынков, на которых будут создаваться государственные предприятия и юридические лица, более пятидесяти процентов акций (долей участия в уставном капитале) которых принадлежат государству, и аффилированные с ними юридические лица и (или) осуществляться ими дополнительные виды деятельности»
    kaz: «Мемлекеттік кәсіпорындар және акцияларының (жарғылық капиталға қатысу үлестерінің) елу пайыздан астамы мемлекетке тиесілі заңды тұлғалар және олармен үлестес заңды тұлғалар құрылатын және (немесе) олар қосымша қызмет түрлерін жүзеге асыратын тауар нарықтарына зерттеп-қарау жүргізу жөніндегі әдістемені бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2017 жылғы 28 ақпандағы № 103 бұйрығына өзгеріс енгізу туралы
