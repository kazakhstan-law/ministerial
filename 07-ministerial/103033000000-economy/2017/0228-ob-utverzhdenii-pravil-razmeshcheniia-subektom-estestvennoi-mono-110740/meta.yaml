requisite: Приказ Министра национальной экономики Республики Казахстан от 28 февраля 2017 года № 93. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 марта 2017 года № 14931. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил размещения субъектом естественной монополии информации о тарифах и тарифных смет на регулируемые услуги (товары, работы), Правил ежегодного размещения субъектом естественной монополии отчета о деятельности по предоставлению регулируемых услуг (товаров, работ) перед потребителями и иными заинтересованными лицами, Правил ежегодного размещения субъектом естественной монополии отчета о деятельности по предоставлению регулируемых коммунальных услуг (товаров, работ) перед потребителями и иными заинтересованными лицами
  kaz: Табиғи монополия субъектісінің реттеліп көрсетілетін қызметтерге (тауарларға, жұмыстарға) тарифтер мен тарифтік сметалар туралы ақпаратты орналастыру қағидаларын, Табиғи монополия субъектісінің тұтынушылар және өзге де мүдделі тұлғалар алдында реттеліп көрсетілетін қызметтерді (тауарларды, жұмыстарды) ұсыну жөніндегі қызметі туралы есепті жыл сайын орналастыру қағидаларын, Табиғи монополия субъектісінің тұтынушылардың және өзге де мүдделі тұлғалардың алдында реттеліп көрсетілетін коммуналдық қызметтерді (тауарларды, жұмыстарды) ұсыну жөніндегі қызметі туралы есепті жыл сайын орналастыру қағидаларын бекіту туралы
