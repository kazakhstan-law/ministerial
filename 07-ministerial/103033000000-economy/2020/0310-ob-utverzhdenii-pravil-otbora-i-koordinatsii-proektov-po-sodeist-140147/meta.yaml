requisite: Приказ Министра национальной экономики Республики Казахстан от 10 марта 2020 года № 14. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 марта 2020 года № 20106
title:
  rus: Об утверждении Правил отбора и координации проектов по содействию устойчивому развитию и росту Республики Казахстан, осуществляемых совместно с международными финансовыми организациями в рамках рамочных соглашений о партнерстве между Правительством Республики Казахстан и международными финансовыми организациями
  kaz: Қазақстан Республикасының Үкіметі мен халықаралық қаржы ұйымдары арасындағы әріптестік туралы негіздемелік келісімдер шеңберінде халықаралық қаржы ұйымдарымен бірлесіп жүзеге асырылатын Қазақстан Республикасының орнықты дамуы мен өсуіне жәрдемдесу жөніндегі жобаларды іріктеу және үйлестіру қағидаларын бекіту туралы
