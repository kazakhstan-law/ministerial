  title:
    rus: О внесении изменений и дополнений в приказ Министра национальной экономики Республики Казахстан от 29 января 2020 года № 5 «Об утверждении типовых форм Договора о субсидировании и гарантировании, Договора субсидирования, Договора субсидирования по исламскому финансированию, Договора субсидирования ставки купонного вознаграждения по облигациям, Договора гарантии, Договора о предоставлении гранта на реализацию новых бизнес-идей в рамках Государственной программы поддержки и развития бизнеса «Дорожная карта бизнеса-2025»
    kaz: «Бизнестің жол картасы-2025» бизнесті қолдау мен дамытудың мемлекеттік бағдарламасы шеңберінде Субсидиялау және кепілдік беру туралы шарттың, Субсидиялау шартының, Исламдық қаржыландыру бойынша субсидиялау шартының, Облигациялар бойынша купондық сыйақы мөлшерлемесін субсидиялау шартының, Кепілдік шартының, Жаңа бизнес-идеяларды іске асыруға грант беру туралы шарттың үлгілік нысандарын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2020 жылғы 29 қаңтардағы № 5 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/169191/rus
