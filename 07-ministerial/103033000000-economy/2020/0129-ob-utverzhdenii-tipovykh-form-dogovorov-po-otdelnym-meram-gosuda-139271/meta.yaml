title:
  rus: Об утверждении типовых форм договоров по отдельным мерам государственной поддержки частного предпринимательства
  kaz: Жеке кәсіпкерлікті мемлекеттік қолдаудың жекелеген шаралары жөніндегі шарттардың үлгілік нысандарын бекіту туралы
