  title:
    rus: О внесении изменений в приказ Министра национальной экономики Республики Казахстан от 13 августа 2019 года № 73 «Об утверждении Правил осуществления деятельности субъектами естественных монополий» и в приказ Министра национальной экономики Республики Казахстан от 5 июня 2020 года № 47 «Об утверждении Правил оказания государственной услуги «Выдача лицензии на деятельность по покупке электрической энергии в целях энергоснабжения»
    kaz: «Табиғи монополиялар субъектілерінің қызметін жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2019 жылғы 13 тамыздағы № 73 бұйрығына және «Энергиямен жабдықтау мақсатында электр энергиясын сатып алу қызметіне лицензия беру» мемлекеттік қызметін көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2020 жылғы 5 маусымдағы № 47 бұйрығына өзгерістер енгізу туралы
