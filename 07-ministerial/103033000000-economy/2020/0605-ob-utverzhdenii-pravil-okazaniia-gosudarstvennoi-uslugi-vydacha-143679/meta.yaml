title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача лицензии на деятельность по покупке электрической энергии в целях энергоснабжения»
  kaz: «Энергиямен жабдықтау мақсатында электр энергиясын сатып алу қызметіне лицензия беру» мемлекеттік қызметін көрсету қағидаларын бекіту туралы
