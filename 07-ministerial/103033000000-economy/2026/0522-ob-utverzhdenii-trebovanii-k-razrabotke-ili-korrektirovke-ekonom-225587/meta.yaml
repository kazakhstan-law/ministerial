title:
  rus: Об утверждении Требований к разработке или корректировке экономического заключения центрального уполномоченного органа по бюджетной политике и отраслевого заключения центрального уполномоченного органа соответствующей отрасли для предоставления государственных гарантий по поддержке частного предпринимательства
  kaz: Жеке кәсіпкерлікті қолдау бойынша мемлекеттік кепілдіктерді ұсыну үшін бюджеттік саясаты жөніндегі орталық уәкілетті органның экономикалық қорытындысын және тиісті саладағы орталық уәкілетті органының салалық қорытындысын әзірлеуге немесе түзетуге қойылатын талаптарды бекіту туралы
