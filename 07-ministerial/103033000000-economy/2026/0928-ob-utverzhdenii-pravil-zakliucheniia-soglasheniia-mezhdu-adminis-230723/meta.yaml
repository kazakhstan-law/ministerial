act_code: '230723'
requisite: Приказ Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 28 сентября 2026 года № 156
title:
  rus: Об утверждении Правил заключения соглашения между администратором бюджетных программ и субъектом квазигосударственного сектора на выполнение работ по реализации проектов строительства «под ключ», регистрации, исполнения, а также проведения платежей по договорам по проектам строительства «под ключ» и (или) договорам принятия государственных обязательств по проектам строительства «под ключ»
  kaz: Бюджеттік бағдарламалардың әкімшісі мен квазимемлекеттік сектор субъектісі арасында «толық бітіріп берілетін» құрылыс жобаларын іске асыру жөніндегі жұмыстарды орындауға келісім жасасу, «толық бітіріп берілетін» құрылыс жобалары бойынша шарттарды және (немесе) «толық бітіріп берілетін» құрылыс жобалары бойынша мемлекеттік міндеттемелерді қабылдау шарттарын тіркеу, орындау, сондай-ақ олар бойынша төлемдер жүргізу қағидаларын бекіту туралы
