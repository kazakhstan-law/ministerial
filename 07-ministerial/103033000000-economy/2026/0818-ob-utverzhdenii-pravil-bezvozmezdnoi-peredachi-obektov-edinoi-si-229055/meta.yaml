act_code: '229055'
requisite: Приказ Заместителя Премьер-Министра – Министра национальной экономики Республики Казахстан от 18 августа 2026 года № 131. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 августа 2026 года № 39623
title:
  rus: Об утверждении Правил безвозмездной передачи объектов единой системы снабжения товарным газом, проекта строительства объектов единой системы снабжения товарным газом местными исполнительными органами национальному оператору в сфере газа и газоснабжения или газотранспортной и (или) газораспределительной организации, пятьдесят и более процентов голосующих акций (долей участия в уставном капитале) которых принадлежат национальному оператору в сфере газа и газоснабжения
  kaz: Жергілікті атқарушы органдардың тауарлық газбен жабдықтаудың бірыңғай жүйесі объектілерін, тауарлық газбен жабдықтаудың бірыңғай жүйесі объектілерін салу жобаcын газ және газбен жабдықтау саласындағы ұлттық операторға немесе дауыс беретін акцияларының (жарғылық капиталға қатысу үлестерінің) елу және одан да көп пайызы газ және газбен жабдықтау саласындағы ұлттық операторға тиесілі газ тасымалдау және (немесе) газ тарату ұйымына өтеусіз беру қағидаларын бекіту туралы
