  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета лесного и охотничьего хозяйства Министерства сельского хозяйства Республики Казахстан от 23 мая 2006 года № 121 "Об утверждении Правил выдачи разрешений на ввоз и вывоз объектов животного мира (кроме рыбы и других водных животных), их частей и производных, в том числе видов животных, отнесенных к категорий редких и находящихся под угрозой исчезновения"
    kaz: '"Жануарлар дүниесі объектілерін (балықтан және өзге су жануарларынан басқа), оның ішінде жануарлардың сирек кездесетін және құрып кету каупі төнген санаттарға жатқызылған түрлерін, олардың бөліктері мен олардан жасалған өнімдерді әкелуге және әкетуге рұқсаттар беру ережесін бекіту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрлігі Орман және аңшылық шаруашылығы комитеті төрағасының 2006 жылғы 23 мамырдағы № 121 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
