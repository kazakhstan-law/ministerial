title:
  rus: Об утверждении Правил выдачи разрешений на ввоз и вывоз объектов животного мира (кроме рыбы и других водных животных), их частей и производных, в том числе видов животных, отнесенных к категорий редких и находящихся под угрозой исчезновения
  kaz: Жануарлар дүниесі объектілерін (балықтан және өзге су жануарларынан басқа), оның ішінде жануарлардың сирек кездесетін және құрып кету қаупі төнген санаттарға жатқызылған түрлерін, олардың бөліктері мен олардан жасалған өнімдерді әкелуге және әкетуге рұқсаттар беру ережесін бекіту туралы
