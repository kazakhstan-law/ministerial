requisite: Приказ Председателя Комитета лесного и охотничьего хозяйства Министерства сельского хозяйства Республики Казахстан от 27 февраля 2007 года № 79. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 марта 2007 года № 4586. Утратил силу приказом Председателя Комитета лесного и охотничьего хозяйства Министерства сельского хозяйства Республики Казахстан от 29 апреля 2010 года № 179
title:
