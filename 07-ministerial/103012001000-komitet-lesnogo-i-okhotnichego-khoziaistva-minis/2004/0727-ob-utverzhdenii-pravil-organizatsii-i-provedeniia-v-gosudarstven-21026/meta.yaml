act_code: '21026'
requisite: Приказ Председателя Комитета лесного и охотничьего хозяйства Министерства сельского хозяйства Республики Казахстан от 28 июля 2004 года N 153. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 августа 2004 года N 3028. Утратило силу - приказом Председателя Комитета лесного и охотничьего хозяйства Министертсва сельского хозяйства Республики Казахстан от 27 февраля 2007 года N 79
title:
  rus: Об утверждении Правил организации и проведения в государственных природных заповедниках, на специально выделенных участках, не включающих особо ценные экологические системы и объекты, спортивного и любительского лова рыбы
  kaz: Мемлекеттік табиғи қорықтарда, ерекше бағалы экологиялық жүйелер мен объектілерді қамтымайтын арнайы бөлінген учаскелерде спорттық және әуесқойлық балық аулауды ұйымдастыру және өткізу Ережесін бекіту туралы
