  title:
    rus: О внесении изменения в приказ Председателя Комитета по регулированию естественных монополий и защите конкуренции Министерства национальной экономики Республики Казахстан от 13 октября 2014 года № 8-ОД "Об утверждении Положений территориальных Департаментов Комитета по регулированию естественных монополий и защите конкуренции Министерства национальной экономики Республики Казахстан"
    kaz: '"Қазақстан Республикасы Ұлттық экономика министрлігі Табиғи монополияларды реттеу және бәсекелестікті қорғау комитетінің аумақтық Департаменттерінің ережелерін бекіту туралы" Қазақстан Республикасы Ұлттық экономика министрлігінің Табиғи монополияларды реттеу және бәсекелестікті қорғау комитеті төрағасының 2014 жылғы 13 қазандағы № 8-НҚ бұйрығына өзгеріс енгізу туралы'
