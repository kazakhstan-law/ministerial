act_code: '79350'
requisite: Приказ Председателя Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовая полиция) от 22 апреля 2014 года № 146. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 мая 2014 года № 9472. Утратил силу приказом Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 17 февраля 2021 года № 63 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил перевода курсантов (слушателей) Академии финансовой полиции Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовой полиции)
  kaz: Қазақстан Республикасы Экономикалық қылмысқа және сыбайлас жемқорлыққа қарсы күрес агенттігінің (қаржы полициясының) Қаржы полициясы академиясының курсанттарын (тыңдаушыларын) ауыстыру қағидаларын бекіту туралы
