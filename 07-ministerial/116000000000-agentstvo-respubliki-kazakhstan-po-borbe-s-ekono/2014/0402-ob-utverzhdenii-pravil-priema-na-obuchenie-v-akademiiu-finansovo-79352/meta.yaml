requisite: Приказ Председателя Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовая полиция) от 2 апреля 2014 года № 124. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 мая 2014 года № 9473. Утратил силу приказом Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 17 февраля 2021 года № 63 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
