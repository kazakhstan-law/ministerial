act_code: '79360'
requisite: Приказ Председателя Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовая полиция) от 8 апреля 2014 года № 133. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 мая 2014 года № 9461. Утратил силу приказом Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 17 февраля 2021 года № 63 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил заключения, изменения, расторжения и прекращения контракта с лицами, поступающими в Академию финансовой полиции Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовой полиции), реализующую профессиональные учебные программы высшего образования в сокращенные сроки
  kaz: Жоғары білімнің кәсіби оқу бағдарламаларын қысқартылған мерзімде іске асыратын Қазақстан Республикасы Экономикалық қылмысқа және сыбайлас жемқорлыққа қарсы күрес агенттігінің (қаржы полициясының) Қаржы полициясы академиясына оқуға түсетін адамдармен келісімшарт жасасу, өзгерту, бұзу және тоқтату қағидаларын бекіту туралы
