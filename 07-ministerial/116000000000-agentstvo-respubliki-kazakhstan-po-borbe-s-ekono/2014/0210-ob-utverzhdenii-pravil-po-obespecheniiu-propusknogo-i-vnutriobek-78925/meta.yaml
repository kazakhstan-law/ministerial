title:
  rus: Об утверждении Правил по обеспечению пропускного и внутриобъектового режимов и охраны административного здания Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовой полиции)
  kaz: Қазақстан Республикасы Экономикалық қылмысқа және сыбайлас жемқорлыққа қарсы күрес агенттігінің (қаржы полициясының) өткізу мен ішкі объектілік режимдерін және әкімшілік ғимаратын күзетуді қамтамасыз ету қағидаларын бекіту туралы
