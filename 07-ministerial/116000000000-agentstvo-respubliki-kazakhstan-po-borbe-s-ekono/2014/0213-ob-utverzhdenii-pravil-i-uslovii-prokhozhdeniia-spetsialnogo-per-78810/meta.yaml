act_code: '78810'
requisite: Приказ Председателя Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовая полиция) от 13 февраля 2014 года № 56. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 марта 2014 года № 9239. Утратил силу приказом Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 17 февраля 2021 года № 63 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и условий прохождения специального первоначального обучения для лиц, впервые поступающих в органы финансовой полиции на должности среднего начальствующего состава
  kaz: Қаржы полициясы органдарының орта басшы құрамдағы лауазымдарына бірінші рет қабылданатын адамдар үшін арнайы бастапқы оқудан өту қағидалары мен шарттарын бекіту туралы
