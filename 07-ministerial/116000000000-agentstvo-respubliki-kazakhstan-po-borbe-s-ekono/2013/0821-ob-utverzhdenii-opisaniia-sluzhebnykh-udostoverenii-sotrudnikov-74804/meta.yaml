act_code: '74804'
requisite: Приказ Председателя Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовая полиция) от 21 августа 2013 года № 258. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 сентября 2013 года № 8743. Утратил силу приказом Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 17 февраля 2021 года № 63 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Описания служебных удостоверений сотрудников органов финансовой полиции Республики Казахстан и Инструкции по их выдаче
  kaz: Қазақстан Республикасы Қаржы полициясы органдары қызметкерлерінің қызметтік куәліктерінің сипаттамаларын және оларды беру жөніндегі нұсқаулықты бекіту туралы
