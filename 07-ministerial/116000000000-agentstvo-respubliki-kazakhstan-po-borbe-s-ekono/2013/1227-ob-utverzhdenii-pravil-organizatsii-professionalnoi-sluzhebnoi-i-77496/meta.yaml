act_code: '77496'
requisite: Приказ Председателя Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовая полиция) от 27 декабря 2013 года № 423. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 января 2014 года № 9107. Утратил силу приказом Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 17 февраля 2021 года № 63 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации профессиональной служебной и физической подготовки в органах финансовой полиции Республики Казахстан, Правил и условий прохождения тестирования, пороговых значений для категорий должностей органов финансовой полиции Республики Казахстан, нормативов по физической и боевой подготовке сотрудников органов финансовой полиции Республики Казахстан при прохождении аттестации
  kaz: Қазақстан Республикасының қаржы полициясы органдарындағы кәсіби қызметтік және дене шынықтыру даярлықтарын ұйымдастыру қағидасын, Аттестаттаудан өту кезіндегі тестілеуден өтудің қағидалары мен шарттарын, Қазақстан Республикасы қаржы полициясы органдарының лауазымдық санаттары үшін шекті мәндерін, Қазақстан Республикасы қаржы полициясы органдары қызметкерлерінің дене шынықтыру және жауынгерлік даярлық бойынша нормативтерін бекіту туралы
