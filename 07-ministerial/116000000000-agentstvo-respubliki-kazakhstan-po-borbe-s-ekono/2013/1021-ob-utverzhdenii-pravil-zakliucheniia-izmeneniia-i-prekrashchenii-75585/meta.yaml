act_code: '75585'
requisite: Приказ Председателя Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовая полиция) от 21 октября 2013 года № 341. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 ноября 2013 года № 8909. Утратил силу приказом Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 17 февраля 2021 года № 63 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил заключения, изменения и прекращения контракта с лицами, поступающими в Академию финансовой полиции Агентства Республики Казахстан по борьбе с экономической и коррупционной преступностью (финансовой полиции), реализующие профессиональные учебные программы высшего образования
  kaz: Қазақстан Республикасы Экономикалық қылмысқа және сыбайлас жемқорлыққа қарсы күрес агенттігінің (қаржы полициясының) Қаржы полициясы академиясына оқуға түсетін, жоғары білім берудің кәсіптік оқу бағдарламаларын іске асыратын адамдармен келісім-шарт жасасу, өзгерту және бұзу ережесін бекіту туралы
