act_code: '77988'
requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы от 3 февраля 2014 года № 04-2-4/19. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 февраля 2014 года № 9136. Утратил силу приказом Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 6 января 2015 года № 2
title:
  rus: Об утверждении Регламента работы дисциплинарных советов Агентства Республики Казахстан по делам государственной службы в областях, городах Астане и Алматы
  kaz: Қазақстан Республикасы Мемлекеттік қызмет істері агенттігінің облыстардағы, Астана және Алматы қалаларындағы тәртіптік кеңестерінің жұмыс Регламентін бекіту туралы
