act_code: '22539'
requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы от 24 декабря 2004 года № 02-01-02/138. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 января 2005 года № 3339. Утратил силу приказом и.о. Председателя Агентства Республики Казахстан по делам государственной службы от 17 мая 2011 года № 02-01-02/96
title:
  rus: Об утверждении Правил организации переподготовки и повышения квалификации государственных служащих Республики Казахстан в Академии государственного управления при Президенте Республики Казахстан, региональных центрах переподготовки и повышения квалификации государственных служащих, других организациях образования
  kaz: Қазақстан Республикасы Президентінің жанындағы Мемлекеттік басқару академиясында, мемлекеттік қызметшілерді қайта даярлау және олардың біліктілігін арттырудың аумақтық орталықтарында, өзге білім беру ұйымдарында Қазақстан Республикасының мемлекеттік қызметшілерін қайта даярлау және олардың біліктілігін арттыруды ұйымдастыру ережесін бекіту туралы
