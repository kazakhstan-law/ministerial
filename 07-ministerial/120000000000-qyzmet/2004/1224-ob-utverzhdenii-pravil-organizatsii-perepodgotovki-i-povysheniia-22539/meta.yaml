  requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы от 17 марта 2005 года № 02-01-02/35. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 апреля 2005 года № 3549. Утратил силу приказом и.о. Председателя Агентства Республики Казахстан по делам государственной службы от 17 мая 2011 года № 02-01-02/96
  title:
    rus: О внесении дополнения в приказ Председателя Агентства Республики Казахстан по делам государственной службы от 24 декабря 2004 года № 02-01-02/138 "Об утверждении Правил организации переподготовки и повышения квалификации государственных служащих Республики Казахстан в Академии государственной службы при Президенте Республики Казахстан, региональных центрах переподготовки и повышения квалификации государственных служащих, других организациях образования"
    kaz: '"Қазақстан Республикасы Президентінің жанындағы Мемлекеттік қызмет Академиясында, мемлекеттік қызметшілерді қайта даярлау және олардың біліктілігін арттырудың аумақтық орталықтарында, өзге білім беру ұйымдарында Қазақстан Республикасының мемлекеттік қызметшілерін қайта даярлау және олардың біліктілігін арттыруды ұйымдастыру ережесін бекіту туралы" Қазақстан Республикасының Мемлекеттік қызмет істері жөніндегі агенттігі төрағасының 2004 жылғы 24 желтоқсандағы N 02-01-02/138 бұйрығына толықтыруды енгізу туралы'
