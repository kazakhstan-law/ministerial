  requisite: Приказ и.о. Председателя Агентства Республики Казахстан по делам государственной службы от 22 июля 2009 года № 02-01-02/127. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 августа 2009 года № 5736. Утратил силу приказом и.о. Председателя Агентства Республики Казахстан по делам государственной службы от 17 мая 2011 года № 02-01-02/96
  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам государственной службы от 24 декабря 2004 года № 02-01-02/138 "Об утверждении Правил организации переподготовки и повышения квалификации государственных служащих Республики Казахстан в Академии государственного управления при Президенте Республики Казахстан, региональных центрах переподготовки и повышения квалификации государственных служащих, других организациях образования"
    kaz: Қазақстан Республикасы Мемлекеттік қызмет істері агенттігі Төрағасының 2004 жылғы 24 желтоқсандағы N 02-01-02/138 "Қазақстан Республикасы Президентінің жанындағы Мемлекеттік басқару академиясында, мемлекеттік қызметшілерді қайта даярлау және олардың біліктілігін арттырудың аумақтық орталықтарында, өзге білім беру ұйымдарында Қазақстан Республикасының мемлекеттік қызметшілерін қайта даярлау және олардың біліктілігін арттыруды ұйымдастыру ережесін бекіту туралы" бұйрығына өзгерістер енгізу туралы
