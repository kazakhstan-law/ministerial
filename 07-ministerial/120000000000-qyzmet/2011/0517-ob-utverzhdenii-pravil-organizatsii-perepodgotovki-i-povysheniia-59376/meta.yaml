act_code: '59376'
requisite: Приказ И.о. Председателя Агентства Республики Казахстан по делам государственной службы от 17 мая 2011 года № 02-01-02/96. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 июня 2011 года № 7007. Утратил силу приказом Председателя Агентства Республики Казахстан по делам государственной службы от 25 декабря 2013 года № 06-7/190
title:
  rus: Об утверждении Правил организации переподготовки и повышения квалификации государственных служащих Республики Казахстан в Академии государственного управления при Президенте Республики Казахстан, региональных центрах переподготовки и повышения квалификации государственных служащих, других организациях образования
  kaz: Қазақстан Республикасы Президентiнiң жанындағы Мемлекеттiк басқару академиясында, мемлекеттiк қызметшiлердi қайта даярлау және олардың бiлiктiлiгiн арттырудың аумақтық орталықтарында, өзге бiлiм беру ұйымдарында Қазақстан Республикасының мемлекеттiк қызметшiлерiн қайта даярлау және олардың бiлiктiлiгiн арттыруды ұйымдастыру ережесiн бекiту туралы
