  title:
    rus: «О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам государственной службы от 21 июля 2022 года № 163 «Об утверждении положений о территориальных органах Агентства Республики Казахстан по делам государственной службы» и об отмене приказа Председателя Агентства Республики Казахстан по делам государственной службы от 25 июля 2019 года № 136 «Об утверждении положений о территориальных органах Агентства Республики Казахстан по делам государственной службы»
    kaz: «Қазақстан Республикасының Мемлекеттік қызмет істері агенттігінің аумақтық органдары туралы ережелерді бекіту туралы» Қазақстан Республикасының Мемлекеттік қызмет істері агенттігі Төрағасының 2022 жылғы 21 шiлдедегi № 163 бұйрығына өзгерістер енгізу туралы және «Қазақстан Республикасының Мемлекеттік қызмет істері агенттігінің аумақтық органдары туралы ережелерді бекіту туралы» Қазақстан Республикасының Мемлекеттік қызмет істері агенттігі төрағасының 2019 жылғы 25 шілдедегі № 136 бұйрығының күшін жою туралы
  link: https://zan.gov.kz/client/#!/doc/174384/rus
