  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по делам государственной службы от 21 июля 2022 года № 163 «Об утверждении положений о территориальных органах Агентства Республики Казахстан по делам государственной службы»
    kaz: «Қазақстан Республикасының Мемлекеттік қызмет істері агенттігінің аумақтық органдары туралы ережелерді бекіту туралы» Қазақстан Республикасының Мемлекеттік қызмет істері агенттігі Төрағасының 2022 жылғы 21 шiлдедегi № 163 бұйрығына өзгерістер мен толықтырулар енгізу туралы
