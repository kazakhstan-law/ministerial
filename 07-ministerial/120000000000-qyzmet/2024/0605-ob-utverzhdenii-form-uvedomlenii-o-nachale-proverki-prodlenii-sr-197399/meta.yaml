act_code: '197399'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по делам государственной службы от 5 июня 2024 года № 90. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 июня 2024 года № 34458. Утратил силу приказом и.о. Председателя Агентства Республики Казахстан по делам государственной службы от 16 июля 2026 года № 127 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении форм уведомлений о начале проверки, продлении сроков и (или) приостановлении (возобновлении) сроков проверки, об изменении состава проверяющих должностных лиц уполномоченного органа или его территориального подразделения, справки о результатах проверки и представления об устранении нарушений, выявленных по результатам проверки
  kaz: Тексерудің басталуы, тексеру мерзімдерін ұзарту және (немесе) тоқтата тұру (қайта бастау) туралы, уәкілетті органның немесе оның аумақтық бөлімшесінің тексеруші лауазымды адамдары құрамының өзгергені туралы хабарламалардың, тексеру нәтижелері туралы анықтаманың және тексеру нәтижелері бойынша анықталған бұзушылықтарды жою туралы ұсынудың нысандарын бекіту туралы
