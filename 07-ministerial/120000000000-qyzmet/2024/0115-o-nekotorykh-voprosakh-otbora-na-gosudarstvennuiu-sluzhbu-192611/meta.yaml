  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 21 февраля 2017 года № 40 «О некоторых вопросах занятия административной государственной должности» и приказ Председателя Агентства Республики Казахстан по делам государственной службы от 15 января 2024 года № 13 «О некоторых вопросах отбора на государственную службу»
    kaz: Қазақстан Республикасының Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі Төрағасының «Мемлекеттік әкімшілік лауазымға орналасудың кейбір мәселелері туралы» 2017 жылғы 21 ақпандағы № 40 бұйрығына және Қазақстан Республикасының Мемлекеттік қызмет істері агенттігі Төрағасының «Мемлекеттік қызметке іріктеудің кейбір мәселелері туралы» 2024 жылғы 15 қаңтардағы № 13 бұйрығына өзгерістер енгізу туралы
