act_code: '203076'
requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы от 22 августа 2024 года № 2-кбп. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 августа 2024 года № 34979
title:
  rus: Об утверждении перечня компетенций для занятия отдельных политических государственных должностей и административных государственных должностей корпуса «А», правил проведения оценки компетенций кандидатов на занятие отдельных политических государственных должностей и административных государственных должностей корпуса «А»
  kaz: Жекелеген мемлекеттік саяси лауазымдарға және «А» корпусының мемлекеттік әкімшілік лауазымдарына орналасуға арналған құзыреттер тізбесін, жекелеген мемлекеттік саяси лауазымдарға және «А» корпусының мемлекеттік әкімшілік лауазымдарына орналасуға үміткерлердің құзыреттеріне бағалау жүргізу қағидаларын бекіту туралы
