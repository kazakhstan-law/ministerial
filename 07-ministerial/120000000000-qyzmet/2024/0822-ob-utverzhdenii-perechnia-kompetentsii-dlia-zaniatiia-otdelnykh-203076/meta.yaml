  requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы от 24 сентября 2024 года № 7-қбп. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 сентября 2024 года № 35103
  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по делам государственной службы от 22 августа 2024 года № 2-қбп «Об утверждении перечня компетенций для занятия отдельных политических государственных должностей и административных государственных должностей корпуса «А», правил проведения оценки компетенций кандидатов на занятие отдельных политических государственных должностей и административных государственных должностей корпуса «А»
    kaz: «Жекелеген мемлекеттік саяси лауазымдарға және «А» корпусының мемлекеттік әкімшілік лауазымдарына орналасуға арналған құзыреттер тізбесін, жекелеген мемлекеттік саяси лауазымдарына және «А» корпусының мемлекеттік әкімшілік лауазымдарына орналасуға үміткерлердің құзыреттеріне бағалау жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Мемлекеттік қызмет істері агенттігі Төрағасының 2024 жылғы 22 тамыздағы № 2-қбп бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/203080/rus
