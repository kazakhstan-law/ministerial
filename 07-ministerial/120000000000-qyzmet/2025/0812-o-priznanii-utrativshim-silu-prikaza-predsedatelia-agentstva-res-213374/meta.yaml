act_code: '213374'
requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы от 12 августа 2025 года № 134. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 августа 2025 года № 36630
title:
  rus: О признании утратившим силу приказа Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 28 октября 2016 года № 26 «Об утверждении Правил распределения распределяемой бюджетной программы по переподготовке и повышению квалификации государственных служащих»
  kaz: Қазақстан Республикасы Мемлекеттік қызмет істері және сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінің Төрағасының 2016 жылғы 28 қазандағы № 26 «Мемлекеттік қызметшілерді қайта даярлау мен біліктілігін арттыру бойынша бөлінетін бюджеттік бағдарламаларды бөлу қағидаларын бекіту туралы» бұйрығының күшін жою туралы
