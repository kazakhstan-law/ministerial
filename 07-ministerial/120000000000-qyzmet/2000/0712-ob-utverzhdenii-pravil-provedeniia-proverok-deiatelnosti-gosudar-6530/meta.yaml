  requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы от 7 апреля 2005 года N 02-01-02/46. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 мая 2005 года N 3625. Утратил силу приказом и.о. Председателя Агентства Республики Казахстан по делам государственной службы от 6 августа 2013 года № 06-7/112
  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам государственной службы от 13 июля 2000 года N 02-1-7/81 "Об утверждении Правил о порядке проведения проверок деятельности государственных органов Республики Казахстан по вопросам соблюдения законодательства о государственной службе и антикоррупционного законодательства"
    kaz: '"Мемлекеттік қызмет туралы заңдарды және сыбайлас жемқорлыққа қарсы заңдарды сақтау мәселесі жөнінде Қазақстан Республикасы мемлекеттік органдарының қызметіне тексеру жүргізудің тәртібі туралы ережені бекіту туралы" Қазақстан Республикасының Мемлекеттік қызмет істері жөніндегі агенттігі төрағасының 2000 жылғы 13 шілдедегі N 02-1-7/81 бұйрығына өзгерістер енгізу туралы'
