title:
  rus: Об утверждении Правил проведения проверок деятельности государственных органов Республики Казахстан по вопросам соблюдения законодательства о государственной службе и антикоррупционного законодательства
  kaz: Мемлекеттік қызмет туралы заңдарды және сыбайлас жемқорлыққа қарсы заңдарды сақтау мәселесі жөнінде Қазақстан Республикасы мемлекеттік органдарының қызметіне тексеру жүргізудің ережесін бекіту туралы
