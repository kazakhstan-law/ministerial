  requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы от 14 марта 2002 г. N 02-2-4/31. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 марта 2002 года N 1791. Утратил силу приказом и.о. Председателя Агентства Республики Казахстан по делам государственной службы от 6 августа 2013 года № 06-7/112
  title:
    rus: О внесении изменения в Приказ Председателя Агентства Республики Казахстан по делам государственной службы от 13 июля 2000 года N 02-1-7/81 "Об утверждении Правил о порядке проведения проверок деятельности государственных органов Республики Казахстан по вопросам соблюдения законодательства о государственной службе и антикоррупционного законодательства"
    kaz: '"Мемлекеттiк қызмет туралы заңдарды және сыбайлас жемқорлыққа қарсы заңдарды сақтау мәселесi жөнiнде Қазақстан Республикасы мемлекеттiк органдарының қызметiне тексеру жүргiзудің тәртiбi туралы ереженi бекiту туралы" Қазақстан Республикасының Мемлекеттiк қызмет iстерi жөнiндегi агенттігі төрағасының 2000 жылы 13 шiлдедегi N 02-1-7/81 бұйрығына өзгерiс енгiзу туралы'
