title:
  rus: Об утверждении форм, предназначенных для сбора административных данных по мониторингу состояния кадрового состава политических и административных государственных служащих, а также политических и административных государственных должностей государственной службы
  kaz: Мемлекеттік саяси және әкімшілік қызметшілердің кадр құрамының жай-күйінің, сондай-ақ мемлекеттік қызметтің мемлекеттік саяси және әкімшілік лауазымдарының мониторингі бойынша әкімшілік деректерді жинауға арналған нысандарды бекіту туралы
