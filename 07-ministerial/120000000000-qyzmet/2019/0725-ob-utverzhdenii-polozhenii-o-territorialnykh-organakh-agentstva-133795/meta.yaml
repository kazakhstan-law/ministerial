  title:
    rus: О внесении изменения в приказ Председателя Агентства Республики Казахстан по делам государственной службы от 25 июля 2019 года № 136 «Об утверждении положений о территориальных органах Агентства Республики Казахстан по делам государственной службы»
    kaz: «Қазақстан Республикасының Мемлекеттік қызмет істері агентігінің аумақтық органдары туралы ережелерді бекіту туралы» Қазақстан Республикасының Мемлекеттік қызмет істері агенттігі төрағасының 2019 жылғы 25 шілдедегі № 136 бұйрығына өзгеріс енгізу туралы
