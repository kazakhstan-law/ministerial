  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по делам государственной службы от 17 апреля 2001 года N 02-2-4/67 "Об утверждении Инструкции, Программ тестирования и Пороговых значений результатов тестирования кандидатов на занятие вакантных административных государственных должностей"
    kaz: Қазақстан Республикасы Мемлекеттiк қызмет iстерi жөнiндегi агенттiгi төрағасының "Бос әкiмшiлiк мемлекеттiк лауазымдарға орналасуға үмiткерлердi тестiлеу Нұсқауын, Программасын және тестiлеу Нәтижелерiнiң шекаралық мәндерiн бекiту туралы" 2001 жылғы 17 сәуiрдегi N 02-2-4/67 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы
