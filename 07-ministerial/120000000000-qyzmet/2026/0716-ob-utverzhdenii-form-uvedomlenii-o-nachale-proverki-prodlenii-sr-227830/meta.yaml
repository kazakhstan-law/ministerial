act_code: '227830'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по делам государственной службы от 16 июля 2026 года № 127. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 июля 2026 года № 39323
title:
  rus: Об утверждении форм уведомлений о начале проверки, продлении сроков и (или) приостановлении (возобновлении) сроков проверки, об изменении состава проверяющих должностных лиц уполномоченного органа по делам государственной службы, его территориального подразделения, справки о результатах проверки и представления об устранении нарушений, выявленных по результатам проверки
  kaz: Тексеруді бастау, тексеру мерзімдерін ұзарту және (немесе) тоқтата тұру (қайта бастау), мемлекеттік қызмет істері жөніндегі уәкілетті органның, оның аумақтық бөлімшесінің тексеруші лауазымды адамдары құрамының өзгергені туралы хабарламалардың, тексеру нәтижелері туралы анықтаманың және тексеру нәтижелері бойынша анықталған бұзушылықтарды жою туралы ұсынудың нысандарын бекіту туралы
