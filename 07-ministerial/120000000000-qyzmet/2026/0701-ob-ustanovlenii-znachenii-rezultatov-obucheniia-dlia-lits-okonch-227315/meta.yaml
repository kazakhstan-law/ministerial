act_code: '227315'
requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы от 1 июля 2026 года № 115. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 июля 2026 года № 39206
title:
  rus: Об установлении значений результатов обучения для лиц, окончивших обучение в организациях образования при Президенте Республики Казахстан по программам послевузовского образования и в организациях образования по программам высшего и (или) послевузовского образования, на занятие административных государственных должностей корпуса «Б» без проведения конкурса
  kaz: Қазақстан Республикасының Президенті жанындағы білім беру ұйымдарында жоғары оқу орнынан кейінгі білім беру бағдарламалары бойынша оқуын аяқтаған адамдар және білім беру ұйымдарында жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру бағдарламалары бойынша оқуын бітірген адамдар үшін «Б» корпусының әкімшілік мемлекеттік лауазымдарына конкурс өткізілмей қабылдауға арналған оқу нәтижелерінің мәндерін белгілеу туралы
