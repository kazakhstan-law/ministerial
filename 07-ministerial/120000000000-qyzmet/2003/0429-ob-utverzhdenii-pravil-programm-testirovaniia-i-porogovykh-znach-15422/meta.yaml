  requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы от 19 апреля 2004 года N 02-01-02/42. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 апреля 2004 года N 2827. Утратил силу приказом Председателя Агентства Республики Казахстан по делам государственной службы от 21 января 2008 года N 02-01-02/11ч
  title:
    rus: О внесении дополнений и изменений в приказ Председателя Агентства Республики Казахстан по делам государственной службы от 30 апреля 2003 года N 02-01-02/60 "Об утверждении Инструкции, Программ тестирования и Пороговых значений результатов тестирования кандидатов на занятие вакантных административных государственных должностей и административных государственных служащих, подлежащих аттестации", зарегистрированный за N 2291
    kaz: N 2291 тіркелген Қазақстан Республикасының Мемлекеттік қызмет істері жөніндегі агенттігі Төрағасының 2003 жылғы 30 сәуірдегі N 02-01-02/60 "Бос мемлекеттік әкімшілік лауазымдарына орналасуға үміткерлерге және аттестациядан өтуге тиісті мемлекеттік әкімшілік қызметшілерге Нұсқау, Тестілеу бағдарламаларын және Тестілеу нәтижелерінің шекаралық мәнін бекіту туралы" бұйрығына толықтырулар мен өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/19545/rus
