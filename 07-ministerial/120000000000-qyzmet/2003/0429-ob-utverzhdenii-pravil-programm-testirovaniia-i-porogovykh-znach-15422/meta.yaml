  requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы от 5 мая 2005 года № 02-01-02/59. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 мая 2005 года № 3624. Утратил силу приказом Председателя Агентства Республики Казахстан по делам государственной службы от 21 января 2008 года № 02-01-02/11
  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам государственной службы от 30 апреля 2003 года N 02-01-02/60 "Об утверждении Инструкции, Программ тестирования и Пороговых значений результатов тестирования кандидатов на занятие вакантных административных государственных должностей и административных государственных служащих, подлежащих аттестации"
    kaz: Қазақстан Республикасының Мемлекеттiк қызмет iстерi жөніндегi агенттігі төрағасының 2003 жылғы 30 сәуiрдегі N 02-01-02/60 "Бос әкімшiлiк мемлекеттiк лауазымдарға орналасуға үміткерлерді және аттестациядан өтуге тиiсті болған әкімшілік мемлекеттік қызметшілердi тестiлеуді өткізу, нұсқау, тестiлеу программалары және тестiлеу нәтижесiнiң шекаралық мәнiн бекіту туралы" бұйрығына өзгерiстер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/23879/rus
