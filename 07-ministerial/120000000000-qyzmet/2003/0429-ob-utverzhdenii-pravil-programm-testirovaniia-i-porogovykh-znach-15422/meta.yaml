    kaz: Аттестациядан өтуге тиiс мемлекеттік әкiмшiлiк қызметшiлердi тестiлеу ережесiн, программасын бекiту және Қазақстан Республикасы Мемлекеттiк қызмет iстерi жөнiндегi агенттігi төрағасының кейбiр бұйрықтарына өзгерiстер мен толықтырулар енгiзу туралы
