title:
  rus: Об утверждении Правил, Программ тестирования и Пороговых значений результатов тестирования кандидатов на занятие вакантных административных государственных должностей
  kaz: Бос әкімшілік мемлекеттік лауазымдарға орналасуға үміткерлерді тестілеуді өткізу ереже, тестілеу программалары және тестілеу нәтижесінің шекаралық мәнін бекіту туралы
