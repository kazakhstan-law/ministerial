title:
  rus: Об утверждении Инструкции по организации антитеррористической защиты объектов органов по делам государственной службы Республики Казахстан, уязвимых в террористическом отношении
  kaz: Қазақстан Республикасының мемлекеттік қызмет істері органдарының террористік тұрғыдан осал объектілерінің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
