  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам государственной службы от 27 января 2023 года № 22 «Об утверждении Инструкции по организации антитеррористической защиты объектов органов по делам государственной службы Республики Казахстан, уязвимых в террористическом отношении»
    kaz: «Қазақстан Республикасының мемлекеттік қызмет істері органдарының террористік тұрғыдан осал объектілерінің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Мемлекеттік қызмет істері агенттігі Төрағасының 2023 жылғы 27 қаңтардағы № 22 бұйрығына өзгерістер енгізу туралы
