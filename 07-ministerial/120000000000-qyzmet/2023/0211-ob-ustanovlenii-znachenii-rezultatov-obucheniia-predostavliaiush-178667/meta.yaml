act_code: '178667'
requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы от 11 февраля 2023 года № 38. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 февраля 2023 года № 31904. Утратил силу приказом Председателя Агентства Республики Казахстан по делам государственной службы от 1 июля 2026 года № 115 (вводится в действие после дня его первого официального опубликования и распространяется на правоотношения, возникшие с 1 июля 2026 года)
title:
  rus: Об установлении значений результатов обучения, предоставляющих лицам, завершившим обучение в организациях образования и в организациях образования при Президенте Республики Казахстан в рамках государственного заказа по программам высшего или послевузовского образования, возможность занятия административных государственных должностей корпуса «Б» без проведения конкурса
  kaz: Жоғары немесе жоғары оқу орнынан кейінгі білім беру бағдарламалары бойынша мемлекеттік тапсырыс шеңберінде білім беру ұйымдарында және Қазақстан Республикасы Президентінің жанындағы білім беру ұйымдарында оқуды аяқтаған адамдарға конкурс өткізілместен «Б» корпусының мемлекеттік әкімшілік лауазымдарына орналасу мүмкіндігін беретін оқу нәтижелерінің мәндерін белгілеу туралы
