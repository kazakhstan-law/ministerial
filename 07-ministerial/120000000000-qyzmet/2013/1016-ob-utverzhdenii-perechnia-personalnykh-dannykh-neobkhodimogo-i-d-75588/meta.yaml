requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы от 16 октября 2013 года № 06-7/144. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 ноября 2013 года № 8922. Утратил силу приказом Министра по делам государственной службы Республики Казахстан от 11 февраля 2016 года № 30
title:
  rus: Об утверждении перечня персональных данных, необходимого и достаточного для выполнения осуществляемых Агентством Республики Казахстан по делам государственной службы и его территориальными подразделениями задач
  kaz: Қазақстан Республикасы Мемлекеттік қызмет істері агенттігі мен оның аумақтық бөлiмшелерi жүзеге асыратын міндеттерді орындау үшін қажетті және жеткілікті дербес деректердің тізбесін бекіту туралы
