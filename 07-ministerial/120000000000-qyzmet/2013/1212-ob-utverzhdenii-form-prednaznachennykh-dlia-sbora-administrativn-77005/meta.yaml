requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы от 12 декабря 2013 года № 06-7/181. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 января 2014 года № 9065. Утратил силу приказом Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 12 декабря 2018 года № 276 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
