act_code: '70939'
requisite: Приказ Председателя Агентства Республики Казахстан по делам государственной службы от 27 декабря 2012 года № 02-01-02/183. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 декабря 2012 года № 8248. Утратил силу приказом Председателя Агентства Республики Казахстан по делам государственной службы от 29 марта 2014 года № 04-2-4/56 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги "Обучение по программам переподготовки и повышения квалификации в Академии государственного управления при Президенте Республики Казахстан"
  kaz: '"Қазақстан Республикасы Президентінің жанындағы Мемлекеттік басқару академиясында қайта даярлау және біліктілікті арттыру бағдарламалары бойынша оқыту" мемлекеттік қызмет регламентін бекіту туралы'
