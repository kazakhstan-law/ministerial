act_code: '69756'
requisite: Приказ и.о Председателя Агентства Республики Казахстан по делам государственной службы от 4 декабря 2012 года № 02-01-02/167. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 декабря 2012 года № 8187. Утратил силу приказом Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 31 декабря 2014 года № 88
title:
  rus: Об утверждении формы проверочного листа и критериев оценки степени рисков деятельности государственных органов по соблюдению законодательства о государственной службе и антикоррупционного законодательства
  kaz: Мемлекеттік қызмет және сыбайлас жемқорлыққа қарсы күрес заңнамаларының сақталуы бойынша мемлекеттік органдар қызметінің тәуекел дәрежесін бағалау критерийлерін және тексеру парағының нысанын бекіту туралы
