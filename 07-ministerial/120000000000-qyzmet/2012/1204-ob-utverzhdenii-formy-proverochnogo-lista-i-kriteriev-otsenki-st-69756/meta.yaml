  requisite: Приказ и.о. Председателя Агентства Республики Казахстан по делам государственной службы от 18 ноября 2013 года № 06-7/165. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 декабря 2013 года № 9010. Утратил силу приказом Председателя Агентства Республики Казахстан по делам государственной службы и противодействию коррупции от 31 декабря 2014 года № 88
  title:
    rus: О внесении изменений в приказ и.о. Председателя Агентства Республики Казахстан по делам государственной службы от 4 декабря 2012 года № 02-01-02/167 "Об утверждении формы проверочного листа и критериев оценки степени рисков деятельности государственных органов по соблюдению законодательства о государственной службе и антикоррупционного законодательства"
    kaz: '"Мемлекеттік қызмет және сыбайлас жемқорлыққа қарсы күрес заңнамаларының сақталуы бойынша мемлекеттік органдар қызметінің тәуекел дәрежесін бағалау критерийлерін және тексеру парағының нысанын бекіту туралы" Қазақстан Республикасы Мемлекеттік қызмет істері агенттігі төрағасының м.а. 2012 жылғы 04 желтоқсандағы № 02-01-02/167 бұйрығына өзгерістер енгізу туралы'
