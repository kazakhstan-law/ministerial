  title:
    rus: О внесении изменения и дополнения в приказ Председателя Агентства Республики Казахстан по делам государственной службы от 24 марта 2006 года № 02-01-02/48 "О некоторых мерах по реализации Указа Президента Республики Казахстан от 4 декабря 2003 года № 1243 "О кадровом резерве государственной службы"
    kaz: '"Мемлекеттік қызметтің кадр резерві туралы" Қазақстан Республикасы Президентінің 2003 жылғы 4 желтоқсандағы № 1243 Жарлығын іске асырудың кейбір іс-шаралары туралы" Қазақстан Республикасы Мемлекеттік қызмет істері агенттігі Төрағасының 2006 жылғы 24 наурыздағы № 02-01-02/48 бұйрығына өзгерту мен толықтыруды енгізу туралы'
