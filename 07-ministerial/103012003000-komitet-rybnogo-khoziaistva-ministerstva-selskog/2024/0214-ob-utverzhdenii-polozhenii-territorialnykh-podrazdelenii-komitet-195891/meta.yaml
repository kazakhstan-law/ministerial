  title:
    rus: О внесении изменений в приказ исполняющего обязанности Председателя Комитета рыбного хозяйства Министерства сельского хозяйства Республики Казахстан от 14 февраля 2024 года № 30-9/27 «Об утверждении положений территориальных подразделений Комитета рыбного хозяйства Министерства сельского хозяйства Республики Казахстан»
    kaz: «Қазақстан Республикасы Ауыл шаруашылығы министрлігі Балық шаруашылығы комитетінің аумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрлігі Балық шаруашылығы комитеті төрағасының міндетін атқарушының 2024 жылғы 14 ақпандағы № 30-9/27 бұйрығына өзгерістер енгізу туралы
