act_code: '101174'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 113. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 марта 2016 года № 13484. Утратил силу приказом Министра цифрового развития, оборонной и аэрокосмической промышленности Республики Казахстан от 24 апреля 2019 года № 53/НҚ (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении квалификационных требований для осуществления деятельности по разработке, производству, ремонту, приобретению и реализации боеприпасов, вооружения и военной техники, запасных частей, комплектующих изделий и приборов к ним, а также специальных материалов и оборудования для их производства, включая монтаж, наладку, модернизацию, установку, использование, хранение, ремонт и сервисное обслуживание и перечня документов, подтверждающих соответствие им
  kaz: Монтаждауды, реттеудi, жаңғыртуды, орнатуды, пайдалануды, сақтауды, жөндеудi және сервистiк қызмет көрсетудi қоса алғанда, оқ-дәрiлердi, қару-жарақ пен әскери техниканы, олардың қосалқы бөлшектерiн, жиынтықтаушы бұйымдары мен аспаптарын, сондай-ақ арнайы материалдарды және оларды өндiруге арналған жабдықтарды әзiрлеу, өндiру, жөндеу, сатып алу және өткiзу жөнiндегi қызметтi жүзеге асыру үшін қойылатын біліктілік талаптарын және оларға сәйкестiкті растайтын құжаттар тiзбесін бекіту туралы
