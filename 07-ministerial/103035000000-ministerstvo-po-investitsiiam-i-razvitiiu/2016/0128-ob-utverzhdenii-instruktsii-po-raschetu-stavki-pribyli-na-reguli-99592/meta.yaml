  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 105 «Об утверждении Инструкции по расчету ставки прибыли на регулируемую базу задействованных активов субъектов естественных монополий в области телекоммуникаций и универсальных услуг почтовой связи»
    kaz: «Телекоммуникациялар мен пошта байланысының әмбебап көрсетілетін қызметтері саласындағы табиғи монополиялар субъектілерінің қолданысқа енгізілген активтердің реттелетiн базасына келетін пайда мөлшерлемесін есептеу жөнiндегi нұсқаулықты бекiту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2016 жылғы 28 қаңтардағы № 105 бұйрығына өзгерістер енгізу туралы
