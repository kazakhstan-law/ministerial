  kaz: Телекоммуникациялар мен пошта байланысының әмбебап көрсетілетін қызметтері саласындағы табиғи монополиялар субъектілерінің қолданысқа енгізілген активтердің реттелетiн базасына келетін пайда мөлшерлемесін есептеу жөнiндегі нұсқаулықты бекiту туралы
