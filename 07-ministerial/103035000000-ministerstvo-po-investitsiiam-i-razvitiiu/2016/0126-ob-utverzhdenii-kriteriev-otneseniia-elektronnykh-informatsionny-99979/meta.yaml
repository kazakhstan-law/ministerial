  title:
    rus: О внесении изменений и дополнения в приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 26 января 2016 года № 86 «Об утверждении Критериев отнесения электронных информационных ресурсов к открытым данным, размещаемым государственными органами на интернет-портале открытых данных, а также Правил и формат их представления»
    kaz: «Мемлекеттік органдар ашық деректердің интернет-порталына орналастыратын электрондық ақпараттық ресурстарды ашық деректерге жатқызу өлшемшарттарын, сондай-ақ оларды беру қағидалары мен форматын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрі м.а. 2016 жылғы 26 қаңтардағы № 86 бұйрығына өзгерістер мен толықтыру енгізу туралы
