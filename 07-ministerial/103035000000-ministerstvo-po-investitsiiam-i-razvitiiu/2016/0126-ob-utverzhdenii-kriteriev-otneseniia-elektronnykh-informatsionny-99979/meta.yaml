act_code: '99979'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 26 января 2016 года № 86. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 февраля 2016 года № 13231. Утратил силу приказом Министра информации и общественного развития Республики Казахстан от 28 апреля 2021 года № 144 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Критериев отнесения электронных информационных ресурсов к открытым данным, размещаемым государственными органами на интернет-портале открытых данных, а также Правил и формат их представления
  kaz: Мемлекеттік органдар ашық деректердің интернет-порталына орналастыратын электрондық ақпараттық ресурстарды ашық деректерге жатқызу өлшемшарттарын, сондай-ақ оларды беру қағидалары мен форматын бекіту туралы
