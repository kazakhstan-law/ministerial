act_code: '100052'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 26 января 2016 года № 81. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 февраля 2016 года № 13339. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 4 октября 2022 года № 368/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил взаимодействия Единого контакт-центра с центральными государственными органами, местными исполнительными органами областей, городов республиканского значения, столицы, районов, городов областного значения, акимами районов в городе, городов районного значения, поселков, сел, сельских округов, а также услугодателями
  kaz: Бірыңғай байланыс-орталығының орталық мемлекеттік органдармен, облыстардың, республикалық маңызы бар қалалардың, астананың, аудандардың, облыстық маңызы бар қалалардың жергілікті атқарушы органдарымен, қаладағы аудандардың, аудандық маңызы бар қалалардың, кенттердің, ауылдардың, ауылдық округтердің әкімдерімен, сондай-ақ көрсетілетін қызметті берушілермен өзара іс-қимыл қағидаларын бекіту туралы
