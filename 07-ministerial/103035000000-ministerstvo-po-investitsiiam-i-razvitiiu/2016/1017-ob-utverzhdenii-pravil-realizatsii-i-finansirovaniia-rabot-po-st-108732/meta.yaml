  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 17 октября 2016 года № 725 «Об утверждении Правил реализации и финансирования работ по строительству, реконструкции, ремонту, содержанию, диагностике, паспортизации и инструментальному обследованию автомобильных дорог общего пользования международного и республиканского значения»
    kaz: «Халықаралық және республикалық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарын салу, реконструкциялау, жөндеу, күтіп-ұстау, диагностикалау, паспорттау және аспаптық зерттеп-қарау жөніндегі жұмыстарды іске асыру мен қаржыландыру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2016 жылғы 17 қазандағы № 725 бұйрығына өзгерістер енгізу туралы
