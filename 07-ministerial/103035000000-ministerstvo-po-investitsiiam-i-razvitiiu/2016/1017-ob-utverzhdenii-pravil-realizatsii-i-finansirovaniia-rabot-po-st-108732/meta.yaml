title:
  rus: Об утверждении Правил реализации и финансирования работ по строительству, реконструкции, ремонту, содержанию, диагностике, паспортизации и инструментальному обследованию автомобильных дорог общего пользования международного и республиканского значения
  kaz: Халықаралық және республикалық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарын салу, реконструкциялау, жөндеу, күтіп-ұстау, диагностикалау, паспорттау және аспаптық зерттеп-қарау жөніндегі жұмыстарды іске асыру мен қыржыландыру қағидаларын бекіту туралы
