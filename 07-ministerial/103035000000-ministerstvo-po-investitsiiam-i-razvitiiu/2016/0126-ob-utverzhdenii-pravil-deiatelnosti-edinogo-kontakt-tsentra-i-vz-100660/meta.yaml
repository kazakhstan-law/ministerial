    kaz: «Бірыңғай байланыс-орталығы қызметінің қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2016 жылғы 26 қаңтардағы № 83 бұйрығына өзгерістер енгізу туралы
