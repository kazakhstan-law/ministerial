title:
  rus: Об утверждении Правил деятельности Единого контакт-центра и взаимодействия Единого контакт-центра с центральными государственными органами, местными исполнительными органами областей, городов республиканского значения, столицы, а также услугодателями
  kaz: Бірыңғай байланыс орталығы қызметінің және Бірыңғай байланыс орталығының орталық мемлекеттік органдармен, облыстардың, республикалық маңызы бар қалалардың, астананың жергілікті атқарушы органдарымен, сондай-ақ көрсетілетін қызметті берушілермен өзара іс-қимыл қағидаларын бекіту туралы
