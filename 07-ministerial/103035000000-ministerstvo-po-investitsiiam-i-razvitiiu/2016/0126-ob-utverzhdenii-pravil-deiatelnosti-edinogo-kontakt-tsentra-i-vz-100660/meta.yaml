  title:
    rus: О внесении изменений в приказы исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 января 2016 года № 83 «Об утверждении Правил деятельности Единого контакт-центра и взаимодействия Единого контакт-центра с центральными государственными органами, местными исполнительными органами областей, городов республиканского значения, столицы, а также услугодателями» и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 14 апреля 2020 года № 140/НҚ «Об утверждении Правил оказания государственной услуги «Выдача лицензии на осуществление деятельности в сфере использования космического пространства»
    kaz: «Бірыңғай байланыс-орталығы қызметінің және Бірыңғай байланыс-орталығының орталық мемлекеттік органдармен, облыстардың, республикалық маңызы бар қалалардың, астананың жергілікті атқарушы органдарымен, сондай-ақ көрсетілетін қызметті берушілермен өзара іс-қимыл қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2016 жылғы 26 қаңтардағы № 83 және «Ғарыш кеңістігін пайдалану саласындағы қызметті жүзеге асыруға лицензия беру» мемлекеттік көрсетілетін қызмет қағидаларын бекіту туралы» Қазақстан Республикасының Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің 2020 жылғы 14 сәуірдегі № 140/НҚ бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/184488/rus
