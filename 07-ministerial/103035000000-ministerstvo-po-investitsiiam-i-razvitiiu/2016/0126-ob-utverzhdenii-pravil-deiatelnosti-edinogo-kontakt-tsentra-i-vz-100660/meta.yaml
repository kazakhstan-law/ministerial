  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 января 2016 года № 83 «Об утверждении Правил деятельности Единого контакт-центра и взаимодействия Единого контакт-центра с центральными государственными органами, местными исполнительными органами областей, городов республиканского значения, столицы, а также услугодателями»
    kaz: «Бірыңғай байланыс орталығы қызметінің және Бірыңғай байланыс орталығының орталық мемлекеттік органдармен, облыстардың, республикалық маңызы бар қалалардың, астананың жергілікті атқарушы органдарымен, сондай-ақ көрсетілетін қызметті берушілермен өзара іс-қимыл қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрі міндетін атқарушының 2016 жылғы 26 қаңтардағы № 83 бұйрығына өзгерістер енгізу туралы
