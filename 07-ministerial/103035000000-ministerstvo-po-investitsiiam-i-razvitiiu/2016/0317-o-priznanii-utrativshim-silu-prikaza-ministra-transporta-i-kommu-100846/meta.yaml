act_code: '100846'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 17 марта 2016 года № 278
title:
  rus: О признании утратившим силу приказа Министра транспорта и коммуникаций Республики Казахстан от 31 мая 2013 года № 414 "Об утверждении Критериев оценки степени рисков и формы проверочного листа по государственному надзору за субъектами, осуществляющими деятельность в области торгового мореплавания и внутреннего водного транспорта"
  kaz: '"Сауда мақсатында теңізде жүзу және ішкі су көлігі саласында қызметті жүзеге асыратын субъектілерді мемлекеттік қадағалау бойынша тәуекел дәрежесін бағалау өлшемдерін және тексеру парақтарының нысанын бекіту туралы" Қазақстан Республикасы Көлік және коммуникация министрінің 2013 жылғы 31 мамырдағы № 414 бұйрығының күшін жою туралы'
