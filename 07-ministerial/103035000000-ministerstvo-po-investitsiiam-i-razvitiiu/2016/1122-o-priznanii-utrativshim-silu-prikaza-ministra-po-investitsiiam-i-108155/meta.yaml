act_code: '108155'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 22 ноября 2016 года № 807. Зарегистрирован Министерством юстиции Республики Казахстан 12 декабря 2016 года № 14504
title:
  rus: О признании утратившим силу приказа Министра по инвестициям и развитию Республики Казахстан от 27 февраля 2015 года № 212 «Об утверждении Правил предоставления инновационных грантов на повышение квалификации инженерно-технического персонала за рубежом, привлечение высококвалифицированных иностранных специалистов, привлечение консалтинговых, проектных и инжиниринговых организаций, на внедрение управленческих и производственных технологий»
  kaz: '"Шет елде инженерлік-техникалық персоналдың біліктілігін арттыруға, жоғары білікті шетелдік мамандардв тартуға, консалтингтік, жобалық және инжинирингтік ұйымдарды тартуға, басқарушылық және өндірістік технологияларды енгізуге инновациялық гранттар беру қағидаларын бекіту туралы" Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 27 ақпандағы № 212 бұйрығының күшін жою туралы'
