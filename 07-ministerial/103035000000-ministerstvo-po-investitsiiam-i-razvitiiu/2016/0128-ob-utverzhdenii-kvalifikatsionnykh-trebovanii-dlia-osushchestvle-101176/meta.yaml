act_code: '101176'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 112. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 марта 2016 года № 13457. Утратил силу приказом Министра цифрового развития, оборонной и аэрокосмической промышленности Республики Казахстан от 24 апреля 2019 года № 55/НҚ (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении квалификационных требований для осуществления деятельности по разработке, производству, ремонту, торговле, приобретению боевого ручного стрелкового оружия и патронов к нему и перечня документов, подтверждающих соответствие им
  kaz: Жауынгерлік қол атыс қаруы мен оның патрондарын әзірлеу, жасау, жөндеу, сату, сатып алу жөніндегі қызметті жүзеге асыру үшін қойылатын біліктілік талаптарын және оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы
