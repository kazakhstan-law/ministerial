requisite: Приказ Министра информации и коммуникаций Республики Казахстан от 28 июля 2016 года № 61. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 августа 2016 года № 14164. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 28 мая 2025 года 264/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
