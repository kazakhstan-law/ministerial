act_code: '100625'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 23 февраля 2016 года № 211. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 марта 2016 года № 13547
title:
  rus: Об определении сроков выполнения функций управляющей компании специальной экономической зоны "Бурабай" Республиканским государственным учреждением "Территориальный департамент Комитета по инвестициям Министерства по инвестициям и развитию Республики Казахстан - администрация специальной экономической зоны "Бурабай"
  kaz: '"Қазақстан Республикасы Инвестициялар және даму министрлігі Инвестиция комитетінің аумақтық департаменті – "Бурабай" арнайы экономикалық аймағы әкімшілігі" республикалық мемлекеттік мекемесі "Бурабай" арнайы экономикалық аймағы басқарушы компаниясы функцияларын атқару мерзімін айқындау туралы'
