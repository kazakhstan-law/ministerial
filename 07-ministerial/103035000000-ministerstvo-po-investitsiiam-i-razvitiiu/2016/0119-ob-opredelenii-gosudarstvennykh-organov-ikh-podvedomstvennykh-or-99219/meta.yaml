  requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 15 марта 2022 года № 85/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 марта 2022 года № 27160
  title:
    rus: О внесении изменения в приказ Министра по инвестициям и развитию Республики Казахстан от 19 января 2016 года № 15 «Об определении государственных органов, их подведомственных организаций и органов местного самоуправления, а также иных субъектов информатизации, использующих единую транспортную среду государственных органов для взаимодействия локальных (за исключением локальных сетей, имеющих доступ к Интернету), ведомственных и корпоративных сетей»
    kaz: «Мемлекеттік органдардың бірыңғай көліктік ортасын жергілікті (Интернетке қолжетімділігі бар жергілікті желілерді қоспағанда), ведомстволық және корпоративтік желілердің өзара іс-қимыл жасауы үшін пайдаланатын мемлекеттік органдарды, олардың ведомстволық бағынысты ұйымдарын және жергiлiктi өзiн-өзi басқару органдарын, сондай-ақ өзге де ақпараттандыру субъектілерін айқындау туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2016 жылғы 19 қаңтардағы № 15 бұйрығына өзгеріс енгізу туралы
