act_code: '99219'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 19 января 2016 года № 15. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 февраля 2016 года № 13102
title:
  rus: Об определении государственных органов, их подведомственных организаций и органов местного самоуправления, а также иных субъектов информатизации, использующих единую транспортную среду государственных органов для взаимодействия локальных (за исключением локальных сетей, имеющих доступ к Интернету), ведомственных и корпоративных сетей
  kaz: Мемлекеттік органдардың бірыңғай көліктік ортасын жергілікті (Интернетке қолжетімділігі бар жергілікті желілерді қоспағанда), ведомстволық және корпоративтік желілердің өзара іс-қимыл жасауы үшін пайдаланатын мемлекеттік органдарды, олардың ведомстволық бағынысты ұйымдарын және жергiлiктi өзiн-өзi басқару органдарын, сондай-ақ өзге де ақпараттандыру субъектілерін айқындау туралы
