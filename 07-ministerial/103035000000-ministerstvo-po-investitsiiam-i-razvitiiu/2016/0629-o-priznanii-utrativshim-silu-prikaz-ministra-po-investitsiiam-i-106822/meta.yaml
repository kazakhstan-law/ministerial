act_code: '106822'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 29 июня 2016 года № 526
title:
  rus: О признании утратившим силу приказ Министра по инвестициям и развитию Республики Казахстан от 28 апреля 2015 года № 496 "Об утверждении Правил организации и предоставления спутниковых навигационных услуг национальным оператором системы высокоточной спутниковой навигации"
  kaz: '"Дәлдігі жоғары спутниктік навигация жүйесі ұлттық операторының спутниктік навигациялық қызметтерді ұйымдастыру және ұсыну қағидаларын бекіту туралы" Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 28 сәуірдегі № 496 бұйрығының күшін жою туралы'
