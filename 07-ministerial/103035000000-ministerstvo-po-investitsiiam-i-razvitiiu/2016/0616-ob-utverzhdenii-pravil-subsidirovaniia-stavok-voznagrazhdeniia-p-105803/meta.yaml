  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 16 июня 2016 года № 497 «Об утверждении Правил субсидирования ставок вознаграждения при кредитовании и финансовом лизинге на приобретение вагонов перевозчиками пассажиров по социально значимым сообщениям и операторами вагонов (контейнеров)»
    kaz: «Әлеуметтік маңызы бар қатынастар бойынша жолаушыларды тасымалдаушылар мен операторлардың вагондарды (контейнерлерді) сатып алуын кредиттеуге және олардың қаржыландыру лизингіне сыйақының мөлшерлемесін субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2016 жылғы 16 маусымдағы № 497 бұйрығына өзгерістер енгізу туралы
