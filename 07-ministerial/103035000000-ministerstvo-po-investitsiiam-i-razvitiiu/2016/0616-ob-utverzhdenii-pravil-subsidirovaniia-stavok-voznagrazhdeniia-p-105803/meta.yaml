title:
  rus: Об утверждении Правил субсидирования ставок вознаграждения при кредитовании и финансовом лизинге на приобретение вагонов и локомотивов
  kaz: Вагондар мен локомотивтерді сатып алуға кредит беру және қаржы лизингі кезінде сыйақы мөлшерлемелерін субсидиялау қағидаларын бекіту туралы
