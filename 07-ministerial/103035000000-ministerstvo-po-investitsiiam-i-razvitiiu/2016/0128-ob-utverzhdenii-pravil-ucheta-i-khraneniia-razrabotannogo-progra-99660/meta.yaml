requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 131. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 февраля 2016 года № 13319. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 29 июня 2019 года № 146/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил учета и хранения разработанного программного обеспечения, исходных программных кодов (при наличии) и комплекса настроек лицензионного  программного обеспечения информационных систем  государственных органов
  kaz: Мемлекеттік органдардың ақпараттық жүйелерінің әзірленген бағдарламалық қамтылымын, бастапқы  бағдарламалық кодтарын (болған кезде) және лицензиялық  бағдарламалық қамтылымының баптау кешенін есепке алу және сақтау қағидаларын бекіту туралы
