  title:
    rus: О внесении изменения в приказ Министра по инвестициям и развитию Республики Казахстан от 9 декабря 2016 года № 843 «Об утверждении квалификационных требований для осуществления деятельности по разработке, производству, приобретению, реализации, хранению взрывчатых и пиротехнических (за исключением гражданских) веществ и изделий с их применением и перечня документов, подтверждающих соответствие им»
    kaz: «Жарылғыш және пиротехникалық (азаматтық қоспағанда) заттар мен олар қолданылып жасалған бұйымдарды әзірлеу, өндіру, сатып алу, өткізу, сақтау жөніндегі қызметті жүзеге асыру үшін қойылатын біліктілік талаптары мен оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2016 жылғы 9 желтоқсандағы № 843 бұйрығына өзгеріс енгізу туралы
