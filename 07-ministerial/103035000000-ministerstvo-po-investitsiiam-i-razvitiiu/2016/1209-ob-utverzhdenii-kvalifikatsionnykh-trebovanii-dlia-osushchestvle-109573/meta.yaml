title:
  rus: Об утверждении квалификационных требований для осуществления деятельности по разработке, производству, приобретению, реализации, хранению взрывчатых и пиротехнических (за исключением гражданских) веществ и изделий с их применением и перечня документов, подтверждающих соответствие им
  kaz: Жарылғыш және пиротехникалық (азаматтық қоспағанда) заттар мен олар өолданылып жасалған бұйымдарды әзірлеу, өндіру, сатып алу, өткізу, сақтау жөніндегі қызметті жүзеге асыру үшін қойылатын біліктілік талаптары мен оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы
