requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 15 июня 2016 года № 489. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 июля 2016 года № 13946. Утратил силу приказом Министра иностранных дел Республики Казахстан от 3 июня 2020 года № 11-1-4/184 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Регламента государственной услуги «Выдача ходатайства на получение инвесторской визы для лиц, являющихся нерезидентами Республики Казахстан и осуществляющих инвестиционную деятельность на территории Республики Казахстан»
  kaz: «Қазақстан Республикасының бейрезиденті болып табылатын және Қазақстан Республикасының аумағында инвестициялық қызметті жүзеге асыратын тұлғалар үшін инвесторлық визаны алуға өтінішхат беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
