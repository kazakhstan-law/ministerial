    kaz: «Қазақстан Республикасы теңізшісінің жеке куәлігін беру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2016 жылғы 25 ақпандағы № 223 бұйрығына өзгерістер енгізу туралы
