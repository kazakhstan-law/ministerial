act_code: '99637'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 19 января 2016 года № 9. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 февраля 2016 года № 13184. Утратил силу приказом Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 1 июля 2026 года № 370/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении обязательных реквизитов результатов оказания государственных и иных услуг в электронной форме, полученных посредством абонентского устройства сотовой связи, а также Правил проверки их достоверности
  kaz: Ұялы байланыстың абоненттік құрылғысы арқылы алынған, электрондық нысандағы мемлекеттік және өзге де қызметтер көрсету нәтижелерінің міндетті деректемелерін, сондай-ақ олардың анықтығын тексеру қағидаларын бекіту туралы
