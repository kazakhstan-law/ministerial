act_code: '99712'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 128. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 февраля 2016 года № 13320. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 25 июля 2019 года № 174/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил регистрации информационных систем государственных органов, учета сведений об объектах информатизации "электронного правительства" и размещения электронных копий технической документации объектов информатизации "электронного правительства"
  kaz: Мемлекеттік органдардың ақпараттық жүйелерін тіркеу, «электрондық үкіметтің» ақпараттандыру объектілері туралы мәліметтерді есепке алу және «электрондық үкіметтің» ақпараттандыру объектілерінің техникалық құжаттамасының электрондық көшірмелерін орналастыру қағидаларын бекіту туралы
