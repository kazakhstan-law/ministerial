title:
  rus: Об утверждении Правил получения отказа от субъектов производства драгоценных металлов или подтверждения уполномоченного органа о наличии такого отказа, а также условий для субъектов производства драгоценных металлов
  kaz: Бағалы металдарды өндіру субъектілерінен бас тартуды немесе осындай бас тартудың бар екені туралы уәкілетті органның растамасын алу қағидаларын, сондай-ақ бағалы металдарды өндіру субъектілері үшін шарттарды бекіту туралы
