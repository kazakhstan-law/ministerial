  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 января 2016 года № 74 «Об утверждении требований к содержанию, ведению и информационному наполнению электронными информационными ресурсами веб-портала «электронного правительства»
    kaz: «Электрондық үкіметтің веб-порталын күтіп-ұстауға, жүргізуге және электрондық ақпараттық ресурстармен ақпараттық толықтыруға қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушы 2016 жылғы 26 қаңтардағы № 74 бұйрығына өзгерістер мен толықтыру енгізу туралы
