title:
  rus: Об утверждении правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественных монополий в области телекоммуникаций и универсальных услуг почтовой связи
  kaz: Телекоммуникациялар мен пошта байланысының қызметтері саласындағы табиғи монополиялар субъектілерінің кірістерді, шығындарды және қолданысқа енгізілген активтерді бөлек есепке алуды жүргізу қағидаларын бекіту туралы
