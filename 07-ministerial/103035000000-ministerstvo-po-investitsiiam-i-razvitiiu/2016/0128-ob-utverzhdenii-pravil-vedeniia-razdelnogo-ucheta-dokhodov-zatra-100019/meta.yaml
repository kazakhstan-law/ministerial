  requisite: Приказ Министра информации и коммуникаций Республики Казахстан от 26 декабря 2018 года № 545. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 января 2019 года № 18167. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О приостановлении действия приказа исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 121 «Об утверждении правил ведения раздельного учета доходов, затрат и задействованных активов субъектами естественных монополий в области телекоммуникаций и универсальных услуг почтовой связи»
    kaz: «Телекоммуникациялар мен пошта байланысының қызметтері саласындағы табиғи монополиялар субъектілерінің кірістерді, шығындарды және қолданысқа енгізілген активтерді бөлек есепке алуды жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2016 жылғы 28 қаңтардағы № 121 бұйрығының қолданысын тоқтата тұру туралы
