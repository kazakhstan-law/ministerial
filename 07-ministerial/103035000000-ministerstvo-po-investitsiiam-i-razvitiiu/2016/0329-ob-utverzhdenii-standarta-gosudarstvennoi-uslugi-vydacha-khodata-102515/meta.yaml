act_code: '102515'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 29 марта 2016 года № 301. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 мая 2016 года № 13685. Утратил силу приказом Министра иностранных дел Республики Казахстан от 3 июня 2020 года № 11-1-4/184 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги "Выдача ходатайства на получение инвесторской визы для лиц, являющихся нерезидентами Республики Казахстан и осуществляющих инвестиционную деятельность на территории Республики Казахстан"
  kaz: '"Қазақстан Республикасының бейрезиденті болып табылатын және Қазақстан Республикасының аумағында инвестициялық қызметті жүзеге асыратын тұлғалар үшін инвесторлық визаны алуға өтінішхат беру" мемлекеттік көрсетілетін қызмет стандартын бекіту туралы'
