title:
  rus: Об утверждении цен на товары (работы, услуги), производимые и (или) реализуемые Государственной корпорацией «Правительство для граждан»
  kaz: «Азаматтарға арналған  үкімет» мемлекеттік корпорациясы өндіретін және (немесе) өткізетін тауарлардың (жұмыстардың, көрсетілетін қызметтердің) бағаларды бекіту туралы
