act_code: '104380'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 20 июня 2016 года № 509
title:
  rus: О приостановлении действий некоторых норм приказа исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 23 января 2015 года № 47 "Об утверждении квалификационных требований, предъявляемых к деятельности по перевозке грузов железнодорожным транспортом, и перечня документов, подтверждающих соответствие им"
  kaz: '"Теміржол көлігімен жүктерді тасымалдау қызметіне қойылатын біліктілік талаптары мен оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы" Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2016 жылғы 23 қаңтардағы № 47 бұйрығының кейбір нормаларының қолданысын тоқтату туралы'
