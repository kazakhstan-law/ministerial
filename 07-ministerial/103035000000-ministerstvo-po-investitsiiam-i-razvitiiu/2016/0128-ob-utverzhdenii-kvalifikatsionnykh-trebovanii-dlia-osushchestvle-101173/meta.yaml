requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 114. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 марта 2016 года № 13454. Утратил силу приказом Министра цифрового развития, оборонной и аэрокосмической промышленности Республики Казахстан от 24 апреля 2019 года № 54/НҚ (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении квалификационных требований для осуществления деятельности по ликвидации (уничтожению, утилизации, захоронению) и переработке высвобождаемых боеприпасов, вооружений, военной техники, специальных средств и перечня документов, подтверждающих соответствие им
  kaz: Босатылатын оқ-дәрiлердi, қару-жарақтарды, әскери техниканы, арнайы құралдарды жою (құрту, кәдеге жарату, көму) және өңдеу жөнiндегi қызметтi жүзеге асыру үшін қойылатын біліктілік талаптарын және оларға сәйкестiкті растайтын құжаттар тiзбесін бекіту туралы
