act_code: '99431'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 25 января 2016 года № 58. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 февраля 2016 года № 13195
title:
  rus: Об утверждении Правил регистрации и подключения абонентского номера абонента, предоставленного оператором сотовой связи, к учетной записи веб-портала «электронного правительства» для получения государственных и иных услуг в электронной форме посредством абонентского устройства сотовой связи
  kaz: Ұялы байланыстың абоненттік құрылғысы арқылы электрондық нысанда мемлекеттік және өзге де көрсетілетін қызметтерді алу үшін, ұялы байланыс операторы беретін абоненттің абоненттік нөмірін тіркеу және оны «электрондық үкіметтің» веб-порталының есептік жазбасына қосу қағидаларын бекіту туралы
