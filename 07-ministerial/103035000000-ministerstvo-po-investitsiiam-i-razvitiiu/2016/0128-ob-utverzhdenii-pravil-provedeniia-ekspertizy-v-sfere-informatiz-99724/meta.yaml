requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 122. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 февраля 2016 года № 13322. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 29 июня 2019 года № 144/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения экспертизы в сфере информатизации инвестиционных предложений, технико-экономических обоснований и финансово-экономических обоснований бюджетных инвестиций
  kaz: Инвестициялық ұсыныстарға, бюджеттік инвестициялардың техникалық-экономикалық негіздемелеріне және қаржылық-экономикалық негіздемелеріне ақпараттандыру саласындағы сараптаманы жүргізу қағидаларын бекіту туралы
