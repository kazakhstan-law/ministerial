requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 26 января 2016 года № 84. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 февраля 2016 года № 13247. Утратил силу приказом Министра информации и коммуникаций Республики Казахстан от 29 января 2018 года № 29 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил формирования перечня интернет-ресурсов государственных органов и объектов информационно-коммуникационной инфраструктуры "электронного правительства", закрепляемых за оператором информационно-коммуникационной инфраструктуры "электронного правительства"
  kaz: '"Электрондық үкiметтiң" ақпараттық-коммуникациялық инфрақұрылымының операторына бекітіп берілетін мемлекеттік органдардың интернет-ресурстарының және "электрондық үкiметтiң" ақпараттық-коммуникациялық инфрақұрылымы объектілерінің тізбесін қалыптастыру қағидаларын бекіту туралы'
