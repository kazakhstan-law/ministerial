  code: '120385'
  requisite: Приказ Министра информации и коммуникаций Республики Казахстан от 2 марта 2018 года № 66. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 марта 2018 года № 16624. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 29 июня 2019 года № 145/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 125 «Об утверждении перечня информационных систем (или их частей), подлежащих многократному использованию в качестве стандартных решений при создании или развитии информационных систем государственных органов»
    kaz: «Мемлекеттік органдардың ақпараттық жүйелерін құру және дамыту кезінде стандартты шешімдер ретінде көп рет пайдалануға жататын ақпараттық жүйелердің (немесе олардың бөліктерің) тізбесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2016 жылғы 28 қаңтардағы № 125 бұйрығына өзгерістер енгізу туралы
