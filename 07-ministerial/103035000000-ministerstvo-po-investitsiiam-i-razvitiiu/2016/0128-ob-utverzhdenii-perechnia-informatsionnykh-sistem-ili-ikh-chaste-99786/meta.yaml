act_code: '99786'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 125. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 февраля 2016 года № 13325. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 29 июня 2019 года № 145/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня информационных систем (или их частей), подлежащих многократному использованию в качестве стандартных решений при создании или развитии информационных систем государственных органов, и сервисных программных продуктов
  kaz: Мемлекеттік органдардың ақпараттық жүйелерін және сервистік бағдарламалық өнімдерді құру немесе дамыту кезінде стандартты шешімдер ретінде көп рет пайдалануға жататын ақпараттық жүйелердің (немесе олардың бөліктерінің) тізбесін бекіту туралы
