act_code: '105748'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 29 июня 2016 года № 525
title:
  rus: О признании утратившим силу приказа исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 29 апреля 2015 года № 526 "Об утверждении Правил планирования космических съемок, получения, обработки и распространения данных дистанционного зондирования Земли национальным оператором космической системы дистанционного зондирования Земли"
  kaz: '"Жерді қашықтықтан зондтау ғарыш жүйесі ұлттық операторының ғарыш түсірілімдерін жоспарлау, Жерді қашықтықтан зондтау деректерін алу, өңдеу және тарату қағидаларын бекіту туралы" Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 29 сәуірдегі № 526 бұйрығының күшін жою туралы'
