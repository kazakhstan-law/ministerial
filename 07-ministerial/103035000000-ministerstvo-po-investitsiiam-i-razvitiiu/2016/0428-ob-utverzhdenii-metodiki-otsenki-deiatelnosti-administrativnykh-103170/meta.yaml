act_code: '103170'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 28 апреля 2016 года № 404. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 июня 2016 года № 13774. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 14 апреля 2017 года № 199 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса "Б" Министерства по инвестициям и развитию Республики Казахстан, его ведомств и их территориальных органов
  kaz: Қазақстан Республикасы Инвестициялар және даму министрлігінің, оның ведомстволары мен олардың аумақтық органдарының «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы
