requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 106. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 февраля 2016 года № 13354. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 23 сентября 2022 года № 341/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
