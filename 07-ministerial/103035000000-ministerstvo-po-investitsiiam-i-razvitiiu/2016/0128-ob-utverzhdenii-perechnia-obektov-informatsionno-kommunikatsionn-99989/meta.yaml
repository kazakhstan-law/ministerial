requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 107. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 февраля 2016 года № 13263. Утратил силу приказом Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 17 марта 2026 года № 149/НҚ (вводится в действие с 12 июля 2026 года и подлежит официальному опубликованию)
title:
  rus: Об утверждении Перечня объектов информационно-коммуникационной инфраструктуры «электронного правительства», а также программных продуктов информационно-коммуникационной платформы «электронного правительства», закрепляемых за оператором информационно-коммуникационной инфраструктуры «электронного правительства»
  kaz: «Электрондық үкіметтің» ақпараттық-коммуникациялық инфрақұрылымының операторына бекітіліп берілетін «электрондық үкіметтің» ақпараттық-коммуникациялық инфрақұрылымы объектілерінің, сондай-ақ «электрондық үкіметтің» ақпараттық-коммуникациялық платформасының бағдарламалық өнімінің тізбесін бекіту туралы
