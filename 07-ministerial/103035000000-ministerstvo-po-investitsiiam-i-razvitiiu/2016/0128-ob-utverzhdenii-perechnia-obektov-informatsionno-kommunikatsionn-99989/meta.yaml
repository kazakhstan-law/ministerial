  title:
    rus: О внесении дополнения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 107 «Об утверждении Перечня объектов информационно-коммуникационной инфраструктуры «электронного правительства», закрепляемых за оператором информационно-коммуникационной инфраструктуры «электронного правительства»
    kaz: «Электрондық үкіметтің» ақпараттық-коммуникациялық инфрақұрылымының операторына бекітіп берілетін мемлекеттік органдардың интернет-ресурстарының және «электрондық үкіметтің» ақпараттық-коммуникациялық инфрақұрылымы объектілерінің тізбесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2016 жылғы 28 қаңтардағы № 107 бұйрығына толықтыру енгізу туралы
