  code: '157692'
  requisite: Приказ и.о. Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 4 августа 2021 года № 275/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 августа 2021 года № 23896
  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 107 «Об утверждении перечня объектов информационно-коммуникационной инфраструктуры «электронного правительства», закрепляемых за оператором информационно-коммуникационной инфраструктуры «электронного правительства»
    kaz: «Электрондық үкіметтің» ақпараттық-коммуникациялық инфрақұрылымының операторына бекітіліп берілетін «электрондық үкіметтің» ақпараттық-коммуникациялық инфрақұрылымы объектілерінің тізбесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2016 жылғы 28 қаңтардағы № 107 бұйрығына өзгеріс енгізу туралы
