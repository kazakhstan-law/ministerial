  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 107 «Об утверждении Перечня интернет-ресурсов государственных органов и объектов информационно-коммуникационной инфраструктуры «электронного правительства», закрепляемых за оператором информационно-коммуникационной инфраструктуры «электронного правительства»
    kaz: «Электрондық үкiметтiң» ақпараттық-коммуникациялық инфрақұрылымының операторына бекітіп берілетін мемлекеттік органдардың интернет-ресурстарының және «электрондық үкiметтiң» ақпараттық-коммуникациялық инфрақұрылымы объектілерінің тізбесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің  міндетін атқарушысының 2016 жылғы 28 қаңтардағы № 107 бұйрығына өзгеріс енгізу туралы
