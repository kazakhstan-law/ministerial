  requisite: Приказ Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 21 октября 2020 года № 396/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 октября 2020 года № 21505
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 107 «Об утверждении Перечня интернет-ресурсов государственных органов и объектов информационно-коммуникационной инфраструктуры «электронного правительства», закрепляемых за оператором информационно-коммуникационной инфраструктуры «электронного правительства»
    kaz: «Электрондық үкiметтiң» ақпараттық-коммуникациялық инфрақұрылымының операторына бекітіп берілетін мемлекеттік органдардың интернет-ресурстарының және «электрондық үкiметтiң» ақпараттық-коммуникациялық инфрақұрылымы объектілерінің тізбесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2016 жылғы 28 қаңтардағы № 107 бұйрығына өзгерістер енгізу туралы
