  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 28 января 2016 года № 107 «Об утверждении Перечня объектов информационно-коммуникационной инфраструктуры «электронного правительства», а также программных продуктов информационно-коммуникационной платформы «электронного правительства», закрепляемых за оператором информационно-коммуникационной инфраструктуры «электронного правительства»
    kaz: «Электрондық үкіметтің» ақпараттық-коммуникациялық инфрақұрылымының операторына бекітіліп берілетін «электрондық үкіметтің» ақпараттық-коммуникациялық инфрақұрылымы объектілерінің, сондай-ақ «электрондық үкіметтің» ақпараттық-коммуникациялық платформасының бағдарламалық өнімінің тізбесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушысының 2016 жылғы 28 қаңтардағы № 107 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/215233/rus
