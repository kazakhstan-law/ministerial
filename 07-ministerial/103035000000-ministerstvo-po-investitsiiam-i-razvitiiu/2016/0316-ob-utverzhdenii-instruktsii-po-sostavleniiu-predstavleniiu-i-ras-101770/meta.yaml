  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 16 марта 2016 года № 274 «Об утверждении Инструкции по составлению, представлению и рассмотрению расчета расходов на государственные закупки товаров, работ, услуг в сфере информатизации»
    kaz: «Ақпараттандыру саласындағы тауарларды, жұмыстар мен көрсетілетін қызметтерді мемлекеттік сатып алуға арналған шығыстардың есебін жасау, ұсыну және қарау жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2016 жылғы 16 наурыздағы № 274 бұйрығына өзгерістер енгізу туралы
