  kaz: Ақпараттандыру саласындағы тауарларды, жұмыстар мен көрсетілетін қызметтерді мемлекеттік сатып алуға арналған шығыстардың есеп-қисабын жасау, ұсыну және қарау жөніндегі нұсқаулықты бекіту туралы
