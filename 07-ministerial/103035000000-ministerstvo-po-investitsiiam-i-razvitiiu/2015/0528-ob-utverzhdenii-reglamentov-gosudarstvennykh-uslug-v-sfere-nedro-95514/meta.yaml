title:
  rus: Об утверждении регламентов государственных услуг в сфере недропользования, за исключением углеводородного сырья и урана
  kaz: Көмірсутек шикізаты мен уранды қоспағанда, жер қойнауын пайдалану саласындағы мемлекеттік көрсетілетін қызмет регламенттерін бекіту туралы
