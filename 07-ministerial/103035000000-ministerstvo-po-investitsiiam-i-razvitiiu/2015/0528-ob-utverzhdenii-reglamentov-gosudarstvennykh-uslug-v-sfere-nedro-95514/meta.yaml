  title:
    rus: «О внесении изменений и дополнений в приказ Министра по инвестициям и развитию Республики Казахстан от 28 мая 2015 года № 620 «Об утверждении регламентов государственных услуг в сфере недропользования, за исключением углеводородного сырья, а также угля и урана»
    kaz: «Көмірсутек шикізатын, сондай-ақ көмір және уранды қоспағанда, жер қойнауын пайдалану саласындағы мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 28 мамырдағы № 620 бұйрығына өзгерістер мен толықтырулар енгізу туралы»
