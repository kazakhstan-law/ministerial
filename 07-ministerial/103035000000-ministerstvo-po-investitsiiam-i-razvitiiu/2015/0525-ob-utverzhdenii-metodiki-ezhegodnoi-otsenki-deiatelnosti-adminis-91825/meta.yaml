    kaz: «Қазақстан Республикасы Инвестициялар және даму министрлігінің  «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалаудың әдістемесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму Министрінің 2015 жылғы 25 мамырдағы № 595 бұйрығына өзгерістер енгізу туралы
