requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 9 декабря 2015 года № 1194. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2015 года № 12640. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 1 июня 2022 года № 308 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил предоставления государственной поддержки субъектам индустриально-инновационной деятельности, направленной на повышение производительности труда и развитие территориальных кластеров
  kaz: Еңбек өнімділігін арттыруға және аумақтық кластерлерді дамытуға бағытталған индустриялық-инновациялық қызмет субъектілеріне мемлекеттік қолдау шараларын ұсыну қағидаларын бекіту туралы
