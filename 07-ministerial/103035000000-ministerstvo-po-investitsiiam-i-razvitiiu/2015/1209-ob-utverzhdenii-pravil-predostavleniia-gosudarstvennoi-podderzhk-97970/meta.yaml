  title:
    rus: О внесении изменения в приказ Министра по инвестициям и развитию Республики Казахстан от 9 декабря 2015 года № 1194 «Об утверждении Правил предоставления государственной поддержки субъектам индустриально-инновационной деятельности, направленной на повышение производительности труда и развитие территориальных кластеров»
    kaz: «Еңбек өнімділігін арттыруға және аумақтық кластерлерді дамытуға бағытталған индустриялық-инновациялық қызмет субъектілеріне мемлекеттік қолдау шараларын ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 9 желтоқсандағы № 1194 бұйрығына өзгеріс енгізу туралы
