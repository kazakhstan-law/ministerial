  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 10 ноября 2015 года № 1061 «Об утверждении Правил сертификации и выдачи сертификата эксплуатанта гражданских воздушных судов» и признании утратившими силу некоторых приказов Министерства по инвестициям и развитию Республики Казахстан и Министерства индустрии и инфраструктурного развития Республики Казахстан
    kaz: «Азаматтық әуе кемелерін пайдаланушыны сертификаттау және оған сертификат беру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 10 қарашадағы № 1061 бұйрығына өзгерістер мен толықтыру енгізу туралы және Қазақстан Республикасы Инвестициялар және даму министрлігінің және Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің кейбір бұйрықтарының күші жойылды деп тану туралы
