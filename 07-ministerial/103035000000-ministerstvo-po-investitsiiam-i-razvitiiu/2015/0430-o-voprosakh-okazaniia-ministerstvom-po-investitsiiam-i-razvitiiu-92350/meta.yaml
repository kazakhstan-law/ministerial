act_code: '92350'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 30 апреля 2015 года № 561. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 июля 2015 года № 11742. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 23 апреля 2020 года № 220 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: О вопросах оказания Министерством по инвестициям и развитию Республики Казахстан государственных услуг в сфере летной эксплуатации
  kaz: Қазақстан Республикасы Инвестициялар және даму министрлігінің ұшуға пайдалану саласында мемлекеттік қызметтер көрсетуі мәселелері туралы
