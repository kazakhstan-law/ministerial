title:
  rus: Об утверждении Правил учета геологической, гидрогеологической, инженерно-геологической, геофизической, эколого-геологической и геохимической изученности территории Республики Казахстан
  kaz: Қазақстан Республикасы аумағының геологиялық, гидрогеологиялық, инженерлік-геологиялық, геофизикалық, экологиялық-геологиялық және геохимиялық тұрғыдан зерттелуін есепке алу қағидаларын бекіту туралы
