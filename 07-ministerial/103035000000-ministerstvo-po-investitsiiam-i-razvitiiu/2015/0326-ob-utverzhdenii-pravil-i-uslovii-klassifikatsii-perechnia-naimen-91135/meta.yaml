title:
  rus: Об утверждении Правил и условий классификации, перечня, наименования и индексов автомобильных дорог общего пользования международного и республиканского значения, в том числе перечня автомобильных дорог оборонного пользования
  kaz: Халықаралық және республикалық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарын сыныптау қағидалары мен шарттарын, тізбесін, олардың атаулары мен индекстерін, оның ішінде қорғаныстық мақсатта пайдаланылатын автомобиль жолдарының тізбесін бекіту туралы
