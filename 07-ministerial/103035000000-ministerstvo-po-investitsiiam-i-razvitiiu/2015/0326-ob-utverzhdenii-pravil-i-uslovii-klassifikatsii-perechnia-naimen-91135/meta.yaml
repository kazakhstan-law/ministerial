  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 марта 2015 года № 315 «Об утверждении Правил и условий классификации, перечня, наименования и индексов автомобильных дорог общего пользования международного и республиканского значения, в том числе перечня автомобильных дорог оборонного пользования»
    kaz: Халықаралық және республикалық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарын сыныптау қағидалары мен шарттарын, тізбесін, олардың атаулары мен индекстерін, оның ішінде қорғаныстық мақсатта пайдаланылатын автомобиль жолдарының тізбесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 26 наурыздағы № 315 бұйрығына өзгерістер енгізу туралы
