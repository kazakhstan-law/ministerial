  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 17 апреля 2015 года № 460 «Об утверждении Правил перевозки опасных грузов автомобильным транспортом и перечня опасных грузов, допускаемых к перевозке автотранспортными средствами на территории Республики Казахстан»
    kaz: «Автомобиль көлігімен қауіпті жүктерді тасымалдау қағидаларын және Қазақстан Республикасының аумағында автокөлік құралдарымен тасымалдауға жол берілетін қауіпті жүктердің тізбесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 17 сәуірдегі № 460 бұйрығына өзгерістер мен толықтырулар енгізу туралы
