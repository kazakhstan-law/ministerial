  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 28 мая 2015 года № 655 "Об утверждении регламентов государственных услуг в области информации, оказываемых Министерством по инвестициям и развитию Республики Казахстан"
    kaz: '"Қазақстан Республикасы Инвестициялар және даму министрлігімен ақпарат саласындағы мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы" Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 28 мамырдағы № 655 бұйрығына өзгерістер енгізу туралы'
