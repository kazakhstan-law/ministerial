    kaz: '"Тасымалдаушының әлеуметтік маңызы бар қатынастар бойынша жолаушылар тасымалын жүзеге асыруына байланысты шығындарын субсидиялау қағидаларын бекіту туралы" Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 24 ақпандағы № 166 бұйрығына өзгерістер енгізу туралы'
