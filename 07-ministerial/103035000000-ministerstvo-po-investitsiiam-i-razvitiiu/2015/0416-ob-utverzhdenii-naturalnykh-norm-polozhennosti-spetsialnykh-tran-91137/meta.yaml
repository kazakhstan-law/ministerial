  title:
    rus: О внесении изменения в приказ Министра по инвестициям и развитию Республики Казахстан от 16 апреля 2015 года № 451 «Об утверждении натуральных норм положенности специальных транспортных средств Министерства индустрии и инфраструктурного развития Республики Казахстан»
    kaz: «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің арнайы көлік құралдарының тиесілік заттай нормаларын бекіту туралы» Қазақстан Республикасы инвестициялар және даму министрінің 2015 жылғы 16 сәуірдегі № 451 бұйрығына өзгеріс енгізу туралы
