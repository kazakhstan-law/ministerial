  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 16 апреля 2015 года № 451 «Об утверждении натуральных норм положенности специальных транспортных средств Министерства по инвестициям и развитию Республики Казахстан»
    kaz: «Қазақстан Республикасы Инвестициялар және даму министрлігінің арнайы көлік құралдарының тиесілік заттай нормаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 16 сәуірдегі № 451 бұйрығына өзгерістер енгізу туралы
