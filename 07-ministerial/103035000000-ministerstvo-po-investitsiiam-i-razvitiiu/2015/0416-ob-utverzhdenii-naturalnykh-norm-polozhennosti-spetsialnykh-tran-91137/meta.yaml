act_code: '91137'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 16 апреля 2015 года № 451. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 июня 2015 года № 11414. Утратил силу приказом Министра транспорта Республики Казахстан от 16 февраля 2024 года № 72 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм положенности специальных транспортных средств Министерства индустрии и инфраструктурного развития Республики Казахстан
  kaz: Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің арнайы көлік құралдарының тиесілік заттай нормаларын бекіту туралы
