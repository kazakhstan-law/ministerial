    kaz: «Қазақстан Республикасы Инвестициялар және даму министрлігінің арнайы көлік құралдарының тиесілік заттай нормаларын бекіту туралы» Қазақстан Республикасының Инвестициялар және даму министрінің 2015 жылғы 16 сәуірдегі № 451 бұйрығына өзгерістер енгізу туралы
