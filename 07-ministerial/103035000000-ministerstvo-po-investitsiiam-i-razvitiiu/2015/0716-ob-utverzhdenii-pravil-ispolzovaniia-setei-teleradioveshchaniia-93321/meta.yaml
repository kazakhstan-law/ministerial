act_code: '93321'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 16 июля 2015 года № 763. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 августа 2015 года № 11982. Утратил силу приказом Министра по чрезвычайным ситуациям Республики Казахстан от 18 сентября 2024 года № 358 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил использования сетей телерадиовещания для оповещения населения об угрозе жизни, здоровью людей и порядке действий в сложившейся обстановке при чрезвычайных ситуациях природного и техногенного характера, а также в интересах обороны, национальной безопасности и охраны правопорядка
  kaz: Табиғи және техногендiк сипаттағы төтенше жағдайлар кезiнде адамдардың өмiрiне, денсаулығына төнген қатер және қалыптасқан жағдайдағы iс-қимылдар тәртiбi туралы халықты хабардар ету, сондай-ақ қорғаныс, ұлттық қауiпсiздiк және құқықтық тәртiптi қорғау мүдделерiнде телерадио хабарларын тарату желiлерiн пайдалану қағидаларын бекiту туралы
