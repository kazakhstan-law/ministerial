act_code: '94574'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 27 февраля 2015 года № 211. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 сентября 2015 года № 12078. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 23 декабря 2015 года № 1225
title:
  rus: Об утверждении Правил предоставления инновационных грантов на приобретение технологий, проведение промышленных исследований, поддержку деятельности по производству высокотехнологичной продукции на начальном этапе развития, патентование в зарубежных странах и (или) региональных патентных организациях
  kaz: Технологияларды сатып алуға, өнеркәсіптік зерттеулер жүргізуге, бастапқы даму кезеңінде жоғары технологиялық өнім өндіру жөніндегі қызметті қолдауға, шет елдерде және (немесе) өңірлік патенттік ұйымдарда патенттеуге инновациялық гранттар беру қағидаларын бекіту туралы
