  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 6 февраля 2015 года № 115 «Об утверждении Правил сертификации и выдачи сертификата авиационного учебного центра гражданской авиации» и в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 24 февраля 2015 года № 158 «Об утверждении сертификационных требовании к авиационным учебным центрам»
    kaz: «Азаматтық авиацияның авиациялық оқу орталығын сертификаттау және сертификат беру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 6 ақпандағы № 115 бұйрығына және «Авиациялық оқу орталықтарына қойылатын сертификаттық талаптарды бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 24 ақпандағы № 158 бұйрығына өзгерістер енгізу туралы
