  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 31 марта 2015 года № 406 «Об установлении требований по энергоэффективности зданий, строений, сооружений и их элементов, являющихся частью ограждающих конструкций» и в приказ Министра промышленности и строительства Республики Казахстан от 4 декабря 2024 года № 411 «Об утверждении Порядка и требований по энергосбережению и повышению энергоэффективности в жилых и нежилых помещениях»
    kaz: «Үйлердің, құрылыстардың, ғимараттардың және олардың қоршау конструкцияларының бірі бөлігі болып табылатын элементтерінің энергия тиімділігі жөніндегі талаптарды белгілеу туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 31 наурыздағы №406 және «Тұрғын және тұрғын емес үй-жайларда энергия үнемдеу және энергия тиімділігін арттыру жөніндегі тәртіп пен талаптарды бекіту туралы» Қазақстан Республикасы Өнеркәсіп және құрылыс министрінің 2024 жылғы 4 желтоқсандағы №411 бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/215176/rus
