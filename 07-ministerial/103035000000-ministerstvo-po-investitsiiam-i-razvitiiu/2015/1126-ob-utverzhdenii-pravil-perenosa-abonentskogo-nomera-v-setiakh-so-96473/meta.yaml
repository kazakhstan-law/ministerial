  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 ноября 2015 года № 1105 «Об утверждении Правил переноса абонентского номера в сетях сотовой связи и даты введения услуги переноса абонентского номера в сетях сотовой связи»
