requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 27 февраля 2015 года № 214. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 апреля 2015 года № 10701. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 19 июля 2019 года № 522 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении типового договора временного возмездного вторичного пользования (субаренды) земельными участками, находящимися в частной собственности, на которых создается специальная экономическая зона
  kaz: Арнайы экономикалық аймақ құрылатын жеке меншіктегі жер учаскелерін уақытша өтеулі қайталап пайдаланудың (қосалқы жалға алудың) үлгілік шартын бекіту туралы
