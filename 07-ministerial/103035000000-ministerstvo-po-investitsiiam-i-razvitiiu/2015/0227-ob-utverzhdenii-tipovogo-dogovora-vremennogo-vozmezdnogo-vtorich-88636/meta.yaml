  title:
    rus: О внесении изменений и дополнений в приказ Министра по инвестициям и развитию Республики Казахстан от 27 февраля 2015 года № 214 «Об утверждении типового договора временного возмездного вторичного пользования (субаренды) земельными участками, находящимися в частной собственности, на которых создается специальная экономическая зона»
    kaz: «Арнайы экономикалық аймақ құрылатын жеке меншіктегі жер учаскелерін уақытша өтеулі қайталап пайдаланудың (қосалқы жалға алудың) үлгілік шартын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму Министрінің 2015 жылғы 27 ақпандағы № 214 бұйрығына өзгерістер мен толықтырулар енгізу туралы
