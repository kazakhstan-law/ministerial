  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 24 февраля 2015 года № 160 «Об утверждении Правил сертификации и выдачи сертификата по организации досмотра службой авиационной безопасности аэропорта» и в приказ Министра по инвестициям и развитию Республики Казахстан от 22 июня 2017 года № 378 «Об утверждении Правил выдачи удостоверения члена экипажа лицам летного состава, кабинного экипажа, инженерно-техническому составу, обеспечивающему техническое сопровождение полетов, и персоналу, обеспечивающему безопасность воздушного судна в полете»
    kaz: «Әуежайдың авиациялық қауіпсіздік қызметінің жете тексеруді ұйымдастыруын сертификаттау және сертификат беру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 24 ақпандағы № 160 бұйрығына және «Ұшу құрамының, кабина экипажының адамдарына, ұшуға техникалық қолдау көрсетуді қамтамасыз ететін инженерлік техникалық құрамға және ұшу кезінде әуе кемесінің қауіпсіздігін қамтамасыз ететін персоналға экипаж мүшесінің куәлігін беру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 22 маусымдағы № 378 бұйрығына өзгерістер мен толықтырулар енгізу туралы
