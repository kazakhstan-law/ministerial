title:
  rus: Об утверждении Правил сертификации и выдачи сертификата службы авиационной безопасности аэропорта (аэродрома), а также сертификационных требований к службе авиационной безопасности аэропорта (аэродрома)
  kaz: Әуежайдың (әуеайлақтың) авиациялық қауіпсіздік қызметін сертификаттау және сертификат беру қағидаларын, сондай-ақ әуежайдың (әуеайлақтың) авиациялық қауіпсіздік қызметіне қойылатын сертификаттау талаптарын бекіту туралы
