title:
  rus: Об утверждении Правил исчисления минимального местного содержания в работах (услугах) при проведении операций по недропользованию, включаемого в условия конкурса на предоставление права недропользования
  kaz: Жер қойнауын пайдалану құқығын беруге арналған конкурс шарттарына енгiзiлетiн жер қойнауын пайдалану жөнiндегi операцияларды жүргiзу кезiнде жұмыстардағы (көрсетiлетiн қызметтердегi) ең аз жергілікті қамтымды есептеу қағидаларын бекiту туралы
