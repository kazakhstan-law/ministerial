act_code: '97826'
requisite: Совместный приказ Министра по инвестициям и развитию Республики Казахстан от 15 декабря 2015 года № 1206 и Министра национальной экономики Республики Казахстан от 28 декабря 2015 года № 814. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2015 года № 12687. Утратил силу совместным приказом Министра по чрезвычайным ситуациям Республики Казахстан от 17 сентября 2025 года № 405 и Заместителя Премьер-Министра – Министр национальной экономики Республики Казахстан от 24 сентября 2025 года № 91 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов в области промышленной безопасности
