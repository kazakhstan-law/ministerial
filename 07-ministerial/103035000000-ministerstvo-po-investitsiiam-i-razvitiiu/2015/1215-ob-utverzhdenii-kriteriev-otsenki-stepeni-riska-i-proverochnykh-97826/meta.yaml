caused_by:
  code: '179365'
  requisite: Совместный приказ и.о. Министра по чрезвычайным ситуациям Республики Казахстан от 29 марта 2023 года № 166 и и.о. Министра национальной экономики Республики Казахстан от 29 марта 2023 года № 38. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 марта 2023 года № 32188.  Утратил силу совместным приказом Министра по чрезвычайным ситуациям Республики Казахстан от 17 сентября 2025 года № 405 и Заместителя Премьер-Министра – Министр национальной экономики Республики Казахстан от 24 сентября 2025 года № 91 (вводится в действие с 1 января 2026 года)
  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра по инвестициям и развитию Республики Казахстан от 15 декабря 2015 года № 1206 и Министра национальной экономики Республики Казахстан от 28 декабря 2015 года № 814 «Об утверждении критериев оценки степени риска и проверочных листов, применяемых для проведения профилактического контроля с посещением субъекта (объекта) контроля и надзора в области промышленной безопасности и проверок на соответствие разрешительным требованиям по выданным разрешениям»
    kaz: «Өнеркәсiптiк қауiпсiздiк саласындағы бақылау және қадағалау субъектісіне (объектісіне) бару арқылы профилактикалық бақылау және берілген рұқсаттар бойынша рұқсат беру талаптарына сәйкестігіне тексерулер жүргізу үшін қолданылатын тәуекел дәрежесін бағалау өлшемшарттары мен тексеру парақтарын бекiту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 15 желтоқсандағы № 1206 және Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 28 желтоқсандағы № 814 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/179365/rus
