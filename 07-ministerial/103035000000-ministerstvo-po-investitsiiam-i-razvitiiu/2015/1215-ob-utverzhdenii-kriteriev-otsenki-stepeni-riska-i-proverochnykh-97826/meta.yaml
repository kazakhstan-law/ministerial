  title:
    rus: О внесении изменений в совместный приказ Министра по инвестициям и развитию Республики Казахстан от 15 декабря 2015 года № 1206 и Министра национальной экономики Республики Казахстан от 28 декабря 2015 года № 814 «Об утверждении критериев оценки степени риска и проверочных листов в области промышленной безопасности»
    kaz: «Өнеркәсiптiк қауiпсiздiк саласындағы тәуекел дәрежесiн бағалау өлшемшарттары мен тексеру парақтарын бекiту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 15 желтоқсандағы № 1206 және Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 28 желтоқсандағы № 814 бірлескен бұйрығына өзгерістер енгізу туралы
