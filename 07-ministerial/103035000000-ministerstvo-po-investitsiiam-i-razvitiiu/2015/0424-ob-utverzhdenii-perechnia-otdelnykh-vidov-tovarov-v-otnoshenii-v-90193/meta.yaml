requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 24 апреля 2015 года № 481. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 мая 2015 года № 11164. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 23 декабря 2015 года № 1220
title:
  rus: Об утверждении перечня отдельных видов товаров, в отношении ввоза которых с территории стран Евразийского экономического союза предоставляется исключительное право, за исключением транспортных средств, ввозимых физическими лицами не в целях предпринимательской деятельности
  kaz: Жеке тұлғалар кәсіпкерлік қызмет мақсатынсыз әкелетін көлік құралдарын қоспағанда, Еуразиялық экономикалық одақ елдерінің аумағынан әкелуге қатысты ерекше құқық берілетін тауарлардың жекелеген түрлерінің тізбесін бекіту туралы
