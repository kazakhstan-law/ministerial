title:
  rus: Об утверждении Правил хранения, подготовки к выдаче на заправку и проведения контроля качества авиационных горюче-смазочных материалов и специальных жидкостей в организациях гражданской авиации Республики Казахстан
  kaz: Қазақстан Республикасының азаматтық авиация ұйымдарында авиациялық жанар-жағармай материалдары мен арнаулы сұйықтықтарды сақтау, құюға беруге дайындау және олардың сапасына бақылау жүргізу қағидаларын бекіту туралы
