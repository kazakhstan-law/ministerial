  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 24 февраля 2015 года № 191 «Об утверждении Правил хранения, подготовки к выдаче на заправку и проведения контроля качества авиационных горюче-смазочных материалов и специальных жидкостей в организациях гражданской авиации Республики Казахстан»
    kaz: «Қазақстан Республикасының азаматтық авиация ұйымдарында авиациялық жанар-жағармай материалдары мен арнаулы сұйықтықтарды сақтау, құюға беруге дайындау және олардың сапасына бақылау жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 24 ақпандағы № 191 бұйрығына өзгерістер енгізу туралы
