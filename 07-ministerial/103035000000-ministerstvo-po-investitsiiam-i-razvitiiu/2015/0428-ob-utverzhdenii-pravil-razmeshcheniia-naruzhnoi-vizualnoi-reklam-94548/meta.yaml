  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 28 апреля 2015 года № 515 «Об утверждении Правил размещения наружной (визуальной) рекламы в полосе отвода автомобильных дорог общего пользования
    kaz: «Жалпыға ортақ пайдаланылатын автомобиль жолдарының жолға бөлiнген белдеуінде сыртқы (көрнекі) жарнаманы орналастыру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 28 сәуірдегі № 515 бұйрығына өзгерістер енгізу туралы
