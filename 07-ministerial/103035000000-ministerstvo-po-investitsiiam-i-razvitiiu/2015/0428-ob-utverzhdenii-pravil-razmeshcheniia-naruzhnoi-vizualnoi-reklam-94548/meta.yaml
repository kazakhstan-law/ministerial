title:
  rus: Об утверждении Правил размещения наружной (визуальной) рекламы в полосе отвода автомобильных дорог общего пользования международного и республиканского значения
  kaz: Халықаралық және республикалық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарының жолға бөлінген белдеуінде сыртқы (көрнекі) жарнаманы орналастыру қағидаларын бекіту туралы
