  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 29 января 2015 года № 67 «Об утверждении Правил распределения ресурса нумерации и выделения номеров, а также их изъятия» и признании утратившими силу структурных элементов некоторых приказов Министра по инвестициям и развитию Республики Казахстан и Министра информации и коммуникаций Республики Казахстан
    kaz: «Нөмірлеу ресурсын бөлу және нөмірлерді беру, сондай-ақ оларды алып қою қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 29 қаңтардағы № 67 бұйрығына өзгерістер енгізу және Қазақстан Республикасы Инвестициялар және даму министрінің және Қазақстан Республикасы Ақпарат және коммуникациялар министрінің кейбір бұйрықтарының құрылымдық элементтерінің күші жойылды деп тану туралы
