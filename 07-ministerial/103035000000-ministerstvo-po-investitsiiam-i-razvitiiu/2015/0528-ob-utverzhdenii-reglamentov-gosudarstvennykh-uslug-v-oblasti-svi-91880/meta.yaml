  title:
    rus: Об утверждении Правил оказания государственной услуги «Выдача лицензии на предоставление услуг в области связи» и признании утратившими силу структурных элементов некоторых приказов Министерства по инвестициям и развитию Республики Казахстан и Министерства информации и коммуникаций Республики Казахстан
    kaz: «Байланыс саласындағы қызметтерді көрсетуге лицензия беру» мемлекеттік көрсетілетін қызметінің қағидаларын бекіту туралы және Қазақстан Республикасы Инвестициялар және даму министрі және Қазақстан Республикасы Ақпарат және коммуникациялар министрінің кейбір күші жойылған бұйрықтарының құрылымдық элементтерінің күші жойылды деп тану туралы
