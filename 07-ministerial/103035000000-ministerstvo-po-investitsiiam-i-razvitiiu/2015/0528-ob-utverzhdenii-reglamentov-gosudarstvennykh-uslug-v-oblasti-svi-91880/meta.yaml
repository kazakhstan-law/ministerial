requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 28 мая 2015 года № 644. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 июля 2015 года № 11590. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 20 ноября 2023 года № 558/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
