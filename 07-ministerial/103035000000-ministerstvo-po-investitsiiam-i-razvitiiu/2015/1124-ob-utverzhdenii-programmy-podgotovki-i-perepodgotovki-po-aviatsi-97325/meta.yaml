  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 24 ноября 2015 года № 1083 «Об утверждении Программы подготовки и переподготовки специалистов служб авиационной безопасности, должностных лиц уполномоченного органа в сфере гражданской авиации по вопросам авиационной безопасности и безопасности полетов»
    kaz: «Авиациялық қауіпсіздік қызметі мамандарын, азаматтық авиация саласындағы уәкілетті органның авиациялық қауіпсіздік және ұшу қауіпсіздігі мәселелері жөніндегі лауазымды адамдарын даярлау және қайта даярлау бағдарламасын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 24 қарашадағы № 1083 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/114244/rus
