act_code: '98081'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 29.12.2015 № 1263. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12749. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 5 мая 2026 года № 226 (вводится в действие по истечении десяти календарных дней после дня его официального опубликования)
title:
  rus: Об утверждении Правил и условий проведения аттестации гражданских служащих Министерства по инвестициям и развитию Республики Казахстан, его ведомств и их территориальных органов, подведомственных Министерству по инвестициям и развитию Республики Казахстан государственных учреждений, казенных предприятий
  kaz: Қазақстан Республикасы Инвестициялар және даму министрлігінің, оның ведомстволарының және олардың аумақтық органдарының, Қазақстан Республикасы Инвестициялар және даму Министрлігінің қарамағындағы мемлекеттік мекемелрінің, қазыналық кәсіпорындарының азаматтық қызметшілерін аттестаттаудан өткізу қағидалары мен шарттарын бекіту туралы
