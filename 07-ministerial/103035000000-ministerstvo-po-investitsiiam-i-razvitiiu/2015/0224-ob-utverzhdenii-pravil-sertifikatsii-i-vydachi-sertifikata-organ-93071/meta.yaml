  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 24 февраля 2015 года № 197 «Об утверждении Правил сертификации и выдачи сертификата организации по техническому обслуживанию и ремонту авиационной техники гражданской авиации»
    kaz: «Азаматтық авиацияның авиациялық техникасына техникалық қызмет көрсету және оны жөндеу жөніндегі ұйымды сертификаттау және оған сертификат беру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 24 ақпандағы № 197 бұйрығына өзгерістер мен толықтырулар енгізу туралы»
