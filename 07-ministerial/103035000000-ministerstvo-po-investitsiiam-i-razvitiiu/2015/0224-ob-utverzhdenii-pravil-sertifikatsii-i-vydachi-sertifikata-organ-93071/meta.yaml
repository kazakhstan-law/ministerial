  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 24 февраля 2015 года № 197 «Об утверждении Правил сертификации и выдачи сертификата организации по техническому обслуживанию и ремонту авиационной техники гражданской авиации»
