  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 27 февраля 2015 года № 249 «Об утверждении форм сведений для приложения к уведомлению о начале турагентской деятельности, деятельности гида, экскурсовода и инструктора туризма, осуществляющих деятельность в Республике Казахстан в качестве индивидуальных предпринимателей»
    kaz: «Турагенттік қызметтің, Қазақстан Республикасында дара кәсіпкерлер ретінде қызметін жүзеге асыратын гид, экскурсовод және туризм нұсқаушысы қызметінің басталғаны туралы хабарламаға қоса беру үшін мәліметтердің нысандарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 27 ақпандағы № 249 бұйрығына өзгерістер енгізу туралы
