  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 27 апреля 2015 года № 249 «Об утверждении форм сведений для приложения к уведомлению о начале деятельности турагента, гида (гида-переводчика), экскурсовода и инструктора туризма»
    kaz: «Турагент, гид (гид-аудармашы), экскурсовод және туризм нұсқаушысы қызметінің басталғаны туралы хабарламаға қосымшаға мәліметтер нысандарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 27 ақпандағы № 249 бұйрығына өзгерістер енгізу туралы
