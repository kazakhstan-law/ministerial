title:
  rus: Об утверждении форм сведений для приложения к уведомлению о начале турагентской деятельности, деятельности гида, экскурсовода и инструктора туризма, осуществляющих деятельность в Республике Казахстан в качестве индивидуальных предпринимателей
  kaz: Турагенттік қызметтің, Қазақстан Республикасында дара кәсіпкерлер ретінде қызметін жүзеге асыратын гид, экскурсовод және туризм нұсқаушысы қызметінің басталғаны туралы хабарламаға қоса беру үшін мәліметтердің нысандарын бекіту туралы
