    kaz: «Қазақстан Республикасының сауда мақсатында теңізде жүзу саласындағы халықаралық шарттарының талаптарына сәйкес теңіз көлігі мамандарын даярлау куәліктерінің тізбесі мен нысандарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 27 наурыздағы № 362 бұйрығына өзгерістер енгізу туралы
