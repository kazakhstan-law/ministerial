  title:
    rus: О внесении изменений в приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 21 января 2015 года № 34 «Об утверждении Правил присвоения полос частот, радиочастот (радиочастотных каналов), эксплуатации радиоэлектронных средств и высокочастотных устройств, а также проведения расчета электромагнитной совместимости радиоэлектронных средств гражданского назначения»
    kaz: «Жиіліктер белдеулерін, радиожиіліктерді (радиожиілік арналарын) иелікке беру, радиоэлектрондық құралдар мен жоғары жиіліктi құрылғыларды пайдалану, сондай-ақ азаматтық мақсаттағы радиоэлектрондық құралдардың электромагниттік үйлесімділігін есептеуді жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің м.а. 2015 жылғы 21 қаңтардағы № 34 бұйрығына өзгерістер енгізу туралы
