  title:
    rus: О внесении изменений в приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 21 января 2015 года № 34 «Об утверждении Правил присвоения полос частот, радиочастот (радиочастотных каналов), эксплуатации радиоэлектронных средств и высокочастотных устройств, а также проведения расчета электромагнитной совместимости радиоэлектронных средств гражданского назначения» и признании утратившими силу структурных элементов некоторых приказов Министерства по инвестициям и развитию Республики Казахстан и Министерства информации и коммуникаций Республики Казахстан
    kaz: «Жиіліктер белдеулерін, радиожиіліктерді (радиожиілік арналарын) иелікке беру, радиоэлектрондық құралдар мен жоғары жиіліктi құрылғыларды пайдалану, сондай-ақ азаматтық мақсаттағы радиоэлектрондық құралдардың электромагниттік үйлесімділігін есептеуді жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің м.а. 2015 жылғы 21 қаңтардағы № 34 бұйрығына өзгерістер енгізу туралы және Қазақстан Республикасы Инвестициялар және даму министрлігінің және Қазақстан Республикасы Ақпарат және коммуникациялар министрлігінің кейбір бұйрықтарының құрылымдық элементтерінің күшін жою туралы
  link: https://zan.gov.kz/client/#!/doc/143160/rus
