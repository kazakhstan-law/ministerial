title:
  rus: Об утверждении Правил присвоения полос частот, радиочастот (радиочастотных каналов), эксплуатации радиоэлектронных средств и высокочастотных устройств, а также проведения расчета электромагнитной совместимости радиоэлектронных средств гражданского назначения
  kaz: Жиіліктер белдеулерін, радиожиіліктерді (радиожиілік арналарын) иелікке беру, радиоэлектрондық құралдар мен жоғары жиіліктi құрылғыларды пайдалану, сондай-ақ азаматтық мақсаттағы радиоэлектрондық құралдардың электромагниттік үйлесімділігін есептеуді жүргізу қағидаларын бекіту туралы
