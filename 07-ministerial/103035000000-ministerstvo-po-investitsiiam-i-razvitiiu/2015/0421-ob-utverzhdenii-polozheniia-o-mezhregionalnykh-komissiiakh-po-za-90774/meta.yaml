  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 21 апреля 2015 года № 472 «Об утверждении положений о Государственной комиссии по запасам полезных ископаемых Республики Казахстан и межрегиональных комиссиях по запасам полезных ископаемых»
    kaz: «Қазақстан Республикасының пайдалы қазбалар қорлары жөніндегі мемлекеттік комиссия және пайдалы қазбалар қорлары жөніндегі өңіраралық комиссиялар туралы ережелерді бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 21 сәуірдегі № 472 бұйрығына өзгерістер енгізу туралы
