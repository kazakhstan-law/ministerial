act_code: '99840'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 23 декабря 2015 года № 1231. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 февраля 2016 года № 13341
title:
  rus: Об утверждении Правил выдачи, хранения, отзыва регистрационных свидетельств и подтверждения принадлежности и действительности открытого ключа электронной цифровой подписи удостоверяющим центром, за исключением корневого удостоверяющего центра Республики Казахстан, удостоверяющего центра государственных органов,  национального удостоверяющего центра Республики Казахстан и доверенной третьей стороны Республики Казахстан
  kaz: Қазақстан Республикасының негізгі куәландырушы орталығын, мемлекеттік органдардың куәландырушы орталығын, Қазақстан Республикасының ұлттық куәландырушы орталығын және Қазақстан Республикасының сенім білдірілген үшінші тарапын қоспағанда, куәландырушы орталықтың тіркеу куәліктерін беру, сақтау, кері қайтарып алу және электрондық цифрлық қолтаңбаның ашық кілтінің тиесілілігі мен жарамдылығын растау қағидаларын бекіту туралы
