  title:
    rus: Об утверждении стандарта государственной услуги «Государственная регистрация ипотеки судна, маломерного судна, строящегося судна» и внесении изменений в некоторые приказы Министерства по инвестициям и развитию Республики Казахстан
    kaz: «Кеменiң, шағын көлемді кеменің, жасалып жатқан кеменің ипотекасын мемлекеттік тіркеу» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы және Қазақстан Республикасы Инвестициялар және даму министрлігінің кейбір бұйрықтарына өзгерістер енгізу туралы
