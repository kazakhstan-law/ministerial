requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 31 марта 2015 года № 422. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 июня 2015 года № 11331. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 11 мая 2018 года № 325 (вводится в действие с 29 июня 2018 года)
title:
  rus: Об утверждении Правил формирования и ведения реестра товаров, работ и услуг, используемых при проведении операций по недропользованию, и их производителей, включая критерии их оценки для внесения в данный реестр
  kaz: Осы тізілімге енгізу үшін оларды бағалау критерийлерін қоса алғанда, жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде пайдаланылатын тауарлардың, жұмыстар мен көрсетілетін қызметтердің және оларды өндірушілердің тізілімін қалыптастыру мен жүргізу қағидаларын бекіту туралы
