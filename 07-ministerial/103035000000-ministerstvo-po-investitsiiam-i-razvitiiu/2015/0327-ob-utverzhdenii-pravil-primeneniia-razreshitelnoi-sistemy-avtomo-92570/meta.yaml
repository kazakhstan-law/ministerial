  title:
    rus: О внесении изменения в приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 27 марта 2015 года № 353 «Об утверждении Правил применения разрешительной системы автомобильных перевозок в Республике Казахстан в международном сообщении»
    kaz: «Қазақстан Республикасының халықаралық қатынастағы автомобильмен тасымалдауларында рұқсат беру жүйесін қолдану қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің м.а. 2015 жылғы 27 наурыздағы № 353 бұйрығына өзгеріс енгізу туралы
