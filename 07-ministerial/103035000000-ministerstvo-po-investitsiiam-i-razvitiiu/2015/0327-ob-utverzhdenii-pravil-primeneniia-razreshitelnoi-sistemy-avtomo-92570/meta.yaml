title:
  rus: Об утверждении Правил применения разрешительной системы автомобильных перевозок в Республике Казахстан в международном сообщении
  kaz: Қазақстан Республикасының халықаралық қатынастағы автомобильмен тасымалдауларында рұқсат беру жүйесін қолдану қағидаларын бекіту туралы
