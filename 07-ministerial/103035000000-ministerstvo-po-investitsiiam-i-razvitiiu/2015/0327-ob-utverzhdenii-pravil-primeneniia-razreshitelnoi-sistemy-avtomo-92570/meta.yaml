  title:
    rus: О внесении дополнения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 27 марта 2015 года № 353 «Об утверждении Правил применения разрешительной системы автомобильных перевозок в Республике Казахстан в международном сообщении» и приостановлении его структурного элемента
    kaz: «Қазақстан Республикасының халықаралық қатынастағы автомобильмен тасымалдауларында рұқсат беру жүйесін қолдану қағидаларын бекіту туралы» Қазақстан Республикасының Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 27 наурыздағы № 353 бұйрығына толықтыру енгізу және оның құрылымдық элементін тоқтата тұру туралы
