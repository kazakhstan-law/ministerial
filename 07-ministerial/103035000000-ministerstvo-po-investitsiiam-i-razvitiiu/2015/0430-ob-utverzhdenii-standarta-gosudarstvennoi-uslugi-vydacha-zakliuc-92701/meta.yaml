act_code: '92701'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 30 апреля 2015 года № 568. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июня 2015 года № 11474. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 15 мая 2019 года № 299 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги "Выдача заключения о подтверждении отнесения импортируемых на территорию Республики Казахстан с территории государств-членов Таможенного союза товаров к товарам, предназначенным для промышленной переработки в легкой, горно-металлургической, химической, фармацевтической, деревообрабатывающей отраслях промышленности, а также машиностроении и стройиндустрии"
  kaz: '"Кеден одағына мүше мемлекеттердің аумағынан Қазақстан Республикасының аумағына импорттауға жатқызылатын тауарларды жеңіл, тау-кен металлургия, химия, фармацевтика, ағаш өңдеу өнеркәсібі салаларындағы өнеркәсіптік өңдеуге арналған, сондай-ақ машина жасау және құрылыс индустриясы тауарларын растау туралы қорытынды беру" мемлекеттік көрсетілетін қызмет стандартын бекіту туралы'
