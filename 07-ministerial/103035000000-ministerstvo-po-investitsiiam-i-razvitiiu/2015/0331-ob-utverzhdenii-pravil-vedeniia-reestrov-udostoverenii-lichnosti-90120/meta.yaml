  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 31 марта 2015 года № 417 «Об утверждении Правил ведения реестров удостоверений личности моряка Республики Казахстан, профессиональных дипломов, подтверждений профессиональных дипломов, льготных разрешений, мореходных книжек»
    kaz: «Қазақстан Республикасы теңізшісінің жеке куәліктерінің, кәсіби дипломдардың, кәсіби дипломдар растамаларының, жеңілдік рұқсаттарының, теңізде жүзу кітапшаларының тізілімдерін жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 31 наурыздағы № 417 бұйрығына өзгерістер енгізу туралы
