title:
  rus: Об утверждении Правил ведения реестров удостоверений личности моряка Республики Казахстан, профессиональных дипломов, подтверждений профессиональных дипломов, льготных разрешений, мореходных книжек
  kaz: Қазақстан Республикасы теңізшісінің жеке куәліктерінің, кәсіби дипломдардың, кәсіби дипломдар растамаларының, жеңілдік рұқсаттарының, теңізде жүзу кітапшаларының тізілімдерін жүргізу қағидаларын бекіту туралы
