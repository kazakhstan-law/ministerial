  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 марта 2015 года № 321 «Об утверждении Типового положения о службе авиационной безопасности» и в приказ исполняющего обязанности Министра транспорта и коммуникаций Республики Казахстан от 15 октября 2010 года № 457 «Об утверждении видов и форм пропусков на право прохода, проезда в контролируемую зону аэропорта»
    kaz: «Авиациялық қауіпсіздік қызметі туралы үлгілік ережені бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 26 наурыздағы № 321 бұйрығына және «Әуежайдың бақыланатын аймағына өту, көлікпен өту құқығына арналған рұқсатнамалардың түрлері мен нысандарын бекіту туралы» Қазақстан Республикасы Көлік және коммуникация министрінің міндетін атқарушының 2010 жылғы 15 қазандағы № 457 бұйрығына өзгерістер енгізу туралы
