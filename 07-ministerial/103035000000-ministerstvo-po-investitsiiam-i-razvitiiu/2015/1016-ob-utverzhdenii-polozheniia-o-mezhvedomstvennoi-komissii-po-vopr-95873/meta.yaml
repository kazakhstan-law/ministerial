act_code: '95873'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 16 октября 2015 года № 992. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 ноября 2015 года № 12298. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 11 мая 2018 года № 325 (вводится в действие с 29 июня 2018 года)
title:
  rus: Об утверждении положения о Межведомственной комиссии по вопросам осуществления приоритетного права государства в отношении подземных вод, лечебных грязей и твердых полезных ископаемых, имеющих стратегическое значение, за исключением урана и угля
  kaz: Уранды және көмірді қоспағанда, стратегиялық маңызы бар жерасты суларына, емдік балшыққа және қатты пайдалы қазбаларға қатысты мемлекеттің басым құқығын жүзеге асыру мәселелері жөніндегі ведомствоаралық комиссия туралы ережені бекіту туралы
