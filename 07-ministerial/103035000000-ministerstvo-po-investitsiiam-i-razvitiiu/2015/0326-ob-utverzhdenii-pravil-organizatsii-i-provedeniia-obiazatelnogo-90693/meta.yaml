  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 марта 2015 года № 329 «Об утверждении Правил организации и проведения обязательного технического осмотра механических транспортных средств и прицепов к ним, периодичности прохождения обязательного технического осмотра механических транспортных средств и прицепов к ним»
    kaz: «Механикалық көлік құралдары мен олардың тіркемелерін міндетті техникалық қарап-тексеруді ұйымдастыру және жүргізу қағидаларын, механикалық көлік құралдары мен олардың тіркемелерін міндетті техникалық қарап-тексеруден өткізу кезеңділігін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 26 наурыздағы № 329 бұйрығына өзгерістер мен толықтырулар енгізу туралы
