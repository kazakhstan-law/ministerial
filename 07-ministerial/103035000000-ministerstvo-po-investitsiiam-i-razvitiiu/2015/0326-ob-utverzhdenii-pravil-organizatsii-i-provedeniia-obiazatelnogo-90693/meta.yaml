  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 марта 2015 года № 329 «Об утверждении Правил организации и проведения обязательного технического осмотра механических транспортных средств и прицепов к ним, периодичности прохождения обязательного технического осмотра механических транспортных средств и прицепов к ним»
    kaz: «Механикалық көлiк құралдарын және олардың тiркемелерiн мiндеттi техникалық қарап-тексеруді ұйымдастыру және жүргiзу қағидаларын, механикалық көлiк құралдарын және олардың тiркемелерiн мiндеттi техникалық қарап-тексеруден өткiзудің кезеңдiлiгiн бекiту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 26 наурыздағы № 329 бұйрығына өзгерістер мен толықтыру енгізу туралы
