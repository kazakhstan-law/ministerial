title:
  rus: Об утверждении Правил организации и проведения обязательного технического осмотра механических транспортных средств и прицепов к ним, периодичность прохождения обязательного технического осмотра механических транспортных средств и прицепов к ним, за исключением механических транспортных средств и прицепов к ним Вооруженных Сил, других войск и воинских формирований
  kaz: Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың механикалық көлік құралдары мен олардың тіркемелерін қоспағанда, механикалық көлік құралдары мен олардың тіркемелерін міндетті техникалық қарап-тексеруді ұйымдастыру және жүргізу қағидаларын, механикалық көлік құралдары мен олардың тіркемелерін міндетті техникалық қарап-тексеруден өткізу кезеңділігін бекіту туралы
