  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 марта 2015 года № 329 «Об утверждении Правил организации и проведения обязательного технического осмотра механических транспортных средств и прицепов к ним, периодичность прохождения обязательного технического осмотра механических транспортных средств и прицепов к ним, за исключением механических транспортных средств и прицепов к ним Вооруженных Сил, других войск и воинских формирований»
    kaz: «Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың механикалық көлік құралдары мен олардың тіркемелерін қоспағанда, механикалық көлік құралдары мен олардың тіркемелерін міндетті техникалық қарап-тексеруді ұйымдастыру және жүргізу қағидаларын, механикалық көлік құралдары мен олардың тіркемелерін міндетті техникалық қарап-тексеруден өткізу кезеңділігін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 26 наурыздағы № 329 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/175624/rus
