act_code: '91358'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 20 мая 2015 года № 585. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 июня 2015 года № 11457. Утратил силу приказом Министра иностранных дел Республики Казахстан от 1 июня 2020 года № 11-1-4/179 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Регламента государственной услуги "Заключение инвестиционного контракта на реализацию инвестиционного проекта, предусматривающего осуществление инвестиций и предоставление инвестиционных преференций"
  kaz: '"Инвестицияларды жүзеге асыруды және инвестициялық преференциялар беруді көздейтiн инвестициялық жобаны іске асыруға инвестициялық келісімшарт жасасу" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'
