  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 20 мая 2015 года № 585 «Об утверждении Регламента государственной услуги «Заключение инвестиционного контракта на реализацию инвестиционного проекта, предусматривающего осуществление инвестиций и предоставление инвестиционных преференций»
    kaz: «Инвестицияларды жүзеге асыруды және инвестициялық преференциялар беруді көздейтiн инвестициялық жобаны іске асыруға инвестициялық келісімшарт жасасу» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 20 мамырдағы № 585 бұйрығына өзгерістер енгізу туралы»
