  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 27 марта 2015 года № 355 «Об утверждении Положения о квалификационных комиссиях, Правил дипломирования и аттестации лиц командного состава судов, подлежащих государственной регистрации в Государственном судовом реестре Республики Казахстан»
    kaz: «Біліктілік комиссиялары туралы ережені, Қазақстан Республикасының Мемлекеттік кеме тізілімінде мемлекеттік тіркеуге жататын кемелердің командалық құрамының адамдарына диплом беру және оларды аттестаттау қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 27 наурыздағы № 355 бұйрығына өзгерістер енгізу туралы
