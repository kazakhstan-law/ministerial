title:
  rus: Об утверждении Правил дипломирования и аттестации лиц командного состава судов, подлежащих государственной регистрации в Государственном судовом реестре Республики Казахстан
  kaz: Қазақстан Республикасының Мемлекеттік кеме тізілімінде мемлекеттік тіркеуге жататын кемелердің командалық құрамының адамдарына диплом беру және оларды аттестаттау қағидаларын бекіту туралы
