  kaz: Өнеркәсіптік қауіпсіздікті декларациялайтын заңды тұлғалар басшыларымен, сондай-ақ аталған заңды тұлғалардың тұрақты жұмыс істейтін емтихан комиссиялары мүшелерімен емтихан тапсыру қағидаларын бекіту туралы
