  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 25 ноября 2015 года № 1100 «Об утверждении Правил сдачи экзаменов руководителями юридических лиц, декларирующих промышленную безопасность, а также членами постоянно действующих экзаменационных комиссий указанных юридических лиц»
    kaz: Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 25 қарашадағы № 1100 «Өнеркәсіптік қауіпсіздікті декларациялайтын заңды тұлғалар басшыларымен, сондай-ақ аталған заңды тұлғалардың тұрақты жұмыс істейтін емтихан комиссиялары мүшелерімен емтихан тапсыру қағидаларын бекіту туралы» бұйрығына өзгерістер енгізу туралы
