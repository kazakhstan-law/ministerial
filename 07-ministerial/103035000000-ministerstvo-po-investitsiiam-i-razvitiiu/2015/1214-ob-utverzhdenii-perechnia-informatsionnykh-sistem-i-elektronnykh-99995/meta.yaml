  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 14 декабря 2015 года № 1201 «Об утверждении перечня информационных систем и электронных информационных ресурсов, осуществляющих межгосударственное информационное взаимодействие через национальный шлюз Республики Казахстан»
    kaz: «Қазақстан Республикасының ұлттық шлюзі арқылы мемлекетаралық ақпараттық өзара іс-қимылды жүзеге асыратын ақпараттық жүйелер мен электрондық ақпараттық ресурстардың тізбесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің м.а. 2015 жылғы 14 желтоқсандағы № 1201 бұйрығына өзгеріс енгізу туралы
