title:
  rus: Об утверждении перечня информационных систем и электронных информационных ресурсов, осуществляющих межгосударственное информационное взаимодействие через национальный шлюз Республики Казахстан
  kaz: Қазақстан Республикасының ұлттық шлюзі арқылы мемлекетаралық ақпараттық өзара іс-қимылды жүзеге асыратын ақпараттық жүйелер мен электрондық ақпараттық ресурстардың тізбесін бекіту туралы
