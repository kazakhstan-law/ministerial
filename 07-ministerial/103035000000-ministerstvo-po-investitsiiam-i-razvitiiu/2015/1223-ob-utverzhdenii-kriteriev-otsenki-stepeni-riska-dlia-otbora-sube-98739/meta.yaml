requisite: Совместный приказ Министра по инвестициям и развитию Республики Казахстан от 23 декабря 2015 года № 1230 и Министра национальной экономики Республики Казахстан от 30 декабря 2015 года № 837. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12793
title:
  rus: Об утверждении критериев оценки степени риска для отбора субъектов (объектов) контроля, проверочных листов в области энергосбережения и повышения энергоэффективности
  kaz: Энергия үнемдеу және энергия тиімділігін арттыру саласындағы бақылау субъектілерін (объектілерін) іріктеу үшін тәуекел дәрежесін бағалау өлшемшарттарын, тексеру парақтарын бекіту туралы
