title:
  rus: Об утверждении Правил устройства временных приспособлений и наплавных сооружений для причаливания, швартовки и стоянки судов, плотов и иных плавучих объектов, посадки на суда и высадки с судов пассажиров, погрузки, выгрузки и хранения грузов
  kaz: Кемелердi, салдарды және өзге де жүзу объектiлерiн айлаққа қою, тоқтату және олардың тұрақта тұруы үшін уақытша құрылғылар мен жүзу құрылыстарын орнату, жолаушыларды кемеге отырғызу және кемеден түсiру, жүктердi тиеу, түсiру және сақтау қағидаларын бекiту туралы
