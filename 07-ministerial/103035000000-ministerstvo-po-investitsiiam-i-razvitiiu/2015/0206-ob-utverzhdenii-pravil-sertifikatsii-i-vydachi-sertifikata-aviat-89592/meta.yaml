  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 6 февраля 2015 года № 115 «Об утверждении Правил сертификации и выдачи сертификата авиационного учебного центра гражданской авиации» и в приказ Министра транспорта и коммуникаций Республики Казахстан от 26 сентября 2013 года № 750 «Об утверждении Правил выдачи и продления срока действия свидетельств авиационного персонала»
    kaz: «Азаматтық авиацияның авиациялық оқу орталығын сертификаттау және сертификат беру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 6 ақпандағы № 115 бұйрығына және «Авиация персоналы куәлiктерiн беру және олардың қолданылу мерзімін ұзарту қағидаларын бекіту туралы» Қазақстан Республикасы Көлік және коммуникация министрінің 2013 жылғы 26 қыркүйектегі № 750 бұйрығына өзгерістер мен толықтырулар енгізу туралы
