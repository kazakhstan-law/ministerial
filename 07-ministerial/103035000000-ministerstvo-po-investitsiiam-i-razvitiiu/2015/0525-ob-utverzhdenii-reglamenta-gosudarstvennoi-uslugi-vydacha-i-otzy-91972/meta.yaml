requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 25 мая 2015 года № 601. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 июля 2015 года № 11552. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 13 октября 2020 года № 383/НҚ (вводится в действие по истечении десяти календарного дня после дня его первого официального опубликования)
title:
