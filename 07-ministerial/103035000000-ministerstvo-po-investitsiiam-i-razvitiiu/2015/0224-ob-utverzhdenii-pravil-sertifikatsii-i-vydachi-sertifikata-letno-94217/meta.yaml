  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 24 февраля 2015 года № 198 «Об утверждении Правил сертификации и выдачи сертификата летной годности гражданского воздушного судна Республики Казахстан», а также о признании утратившим силу приказа исполняющего обязанности Министра транспорта и коммуникаций Республики Казахстан от 3 марта 2011 года № 112 «Об утверждении Правил признания сертификатов летной годности гражданских воздушных судов, выданных иностранным государством»
    kaz: «Қазақстан Республикасының азаматтық әуе кемесін сертификаттау және ұшуға жарамдылық сертификатын беру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 24 ақпандағы № 198 бұйрығына өзгеріс енгізу туралы, сондай-ақ «Азаматтық әуе кемесінің шет мемлекет берген ұшуға жарамдылығы сертификаттарын тану қағидасын бекіту туралы» Қазақстан Республикасы Көлік және коммуникация министрінің міндетін атқарушының 2011 жылғы 3 наурыздағы № 112 бұйрығының күшi жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/116984/rus
