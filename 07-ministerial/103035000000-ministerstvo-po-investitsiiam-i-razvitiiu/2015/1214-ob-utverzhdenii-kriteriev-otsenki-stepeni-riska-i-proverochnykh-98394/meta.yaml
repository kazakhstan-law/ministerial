  title:
    rus: О внесении изменений в совместный приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 14 декабря 2015 года № 1205 и Министра национальной экономики Республики Казахстан от 29 декабря 2015 года № 823 "Об утверждении критериев оценки степени риска и проверочных листов в области автомобильного, железнодорожного, внутреннего водного транспорта и торгового мореплавания"
    kaz: '"Автомобиль, теміржол, ішкі су көлігі және сауда мақсатында теңізде жүзу саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы" Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 14 желтоқсандағы № 1205 және Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 29 желтоқсандағы № 823 бірлескен бұйрығына өзгерістер енгізу туралы'
