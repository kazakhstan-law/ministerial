  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 24 февраля 2015 года № 160 «Об утверждении Правил сертификации и выдачи сертификата по организации досмотра службой авиационной безопасности аэропорта» и признании утратившим силу приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 марта 2015 года № 332 «Об утверждении сертификационных требований по организации досмотра службой авиационной безопасности аэропорта»
    kaz: «Әуежайдың авиациялық қауіпсіздік қызметінің жете тексеруді ұйымдастыруын сертификаттау және сертификат беру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 24 ақпандағы № 160 бұйрығына өзгерістер мен толықтыру енгізу және «Әуежайдың авиациялық қауіпсіздік қызметінің жете тексеруді ұйымдастыруы бойынша сертификаттық талаптарды бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 26 наурыздағы № 332 бұйрығының күші жойылды деп тану туралы
