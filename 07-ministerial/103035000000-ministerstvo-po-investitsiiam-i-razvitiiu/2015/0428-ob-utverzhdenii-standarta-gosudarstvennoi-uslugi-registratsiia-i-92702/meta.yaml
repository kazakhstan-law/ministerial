  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 16 июня 2015 года № 694 «Об утверждении Правил регистрации и учета химической продукции» и признании утратившими силу некоторых приказов Министра по инвестициям и развитию Республики Казахстан и Министра индустрии и инфраструктурного развития Республики Казахстан
    kaz: «Химиялық өнімді тіркеу және есепке алу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрі міндетін атқарушының 2015 жылғы 16 маусымдағы № 694 бұйрығына өзгерістер енгізу және Қазақстан Республикасы Инвестициялар және даму министрінің және Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің кейбір бұйрықтарының күші жойылды деп тану туралы
