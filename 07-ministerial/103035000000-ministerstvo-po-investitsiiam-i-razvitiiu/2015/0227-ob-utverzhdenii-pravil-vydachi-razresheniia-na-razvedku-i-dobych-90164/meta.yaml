act_code: '90164'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 27 февраля 2015 года № 235. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 мая 2015 года № 11034. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 11 мая 2018 года № 325 (вводится в действие с 29 июня 2018 года)
title:
  rus: Об утверждении Правил выдачи разрешения на разведку и добычу производственно-технических подземных вод в объемах две тысячи и более кубических метров в сутки для их закачки в пласт в соответствии с технологической схемой добычи полезного ископаемого либо на добычу подземных вод для целей водопонижения при эксплуатации горных выработок
  kaz: Тәулігіне екі мың текше метр және одан да көп көлемдегі өндірістік-техникалық жерасты суларын пайдалы қазбаны өндірудің технологиялық схемасына сәйкес қаттарға айдау үшін оларды барлау мен өндіруге не тау-кен қазбаларын пайдалану кезінде су деңгейін төмендету мақсатында жерасты суларын өндіруге арналған рұқсат беру қағидаларын бекіту туралы
