  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 марта 2015 года № 342 «Об утверждении допустимых параметров автотранспортных средств, предназначенных для передвижения по автомобильным дорогам Республики Казахстан»
    kaz: '"Қазақстан Республикасының автомобиль жолдарымен жүруге арналған автокөлік құралдарының жол берілетін параметрлерін бекіту туралы" Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 26 наурыздағы № 342 бұйрығына өзгерістер енгізу туралы'
