  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан № 342 от 26 марта 2015 года «Об утверждении допустимых параметров автотранспортных средств, предназначенных для передвижения по автомобильным дорогам Республики Казахстан»
    kaz: «Қазақстан Республикасының автомобиль жолдарымен жүруге арналған автокөлік құралдарының жол берілетін параметрлерін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 26 наурыздағы № 342 бұйрығына өзгеріс енгізу туралы
