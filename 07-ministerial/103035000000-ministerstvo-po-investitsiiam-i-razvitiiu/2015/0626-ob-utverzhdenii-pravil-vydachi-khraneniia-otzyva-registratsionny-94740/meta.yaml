act_code: '94740'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 26 июня 2015 года № 727. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 октября 2015 года № 12181
title:
  rus: Об утверждении Правил выдачи, хранения, отзыва регистрационных свидетельств и подтверждения принадлежности и действительности открытого ключа электронной цифровой подписи корневым удостоверяющим центром Республики Казахстан, удостоверяющим центром государственных органов и национальным удостоверяющим центром Республики Казахстан
  kaz: Қазақстан Республикасының негізгі куәландырушы орталығының, мемлекеттік органдардың куәландырушы орталығының және Қазақстан Республикасының ұлттық куәландырушы орталығының тіркеу куәліктерін беру, сақтау, кері қайтарып алу және электрондық цифрлық қолтаңбаның ашық кілтінің тиесілілігі мен жарамдылығын растау қағидаларын бекіту туралы (Бұйрықтың тақырыбы жаңа редакцияда - ҚР Инвестициялар және даму министрінің 09.12.2015 № 1183 (алғашқы ресми жарияланған күнінен бастап күнтізбелік он күн өткен соң қолданысқа енгізіледі) бұйрығымен)
