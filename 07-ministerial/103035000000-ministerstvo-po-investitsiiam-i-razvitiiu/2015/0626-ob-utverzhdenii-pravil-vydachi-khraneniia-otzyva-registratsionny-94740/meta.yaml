  title:
    rus: О внесении изменений в некоторые приказы исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан и Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан
    kaz: Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының және Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің кейбір бұйрықтарына өзгерістер енгізу туралы
