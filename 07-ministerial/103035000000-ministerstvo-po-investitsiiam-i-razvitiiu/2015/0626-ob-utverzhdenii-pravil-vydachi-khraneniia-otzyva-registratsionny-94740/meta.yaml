  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 июня 2015 года № 727 «Об утверждении Правил выдачи, хранения, отзыва регистрационных свидетельств и подтверждения принадлежности и действительности открытого ключа электронной цифровой подписи корневым удостоверяющим центром Республики Казахстан, удостоверяющим центром государственных органов и национальным удостоверяющим центром Республики Казахстан» и признании утратившими силу некоторых приказов Министерства по инвестициям и развитию Республики Казахстан
    kaz: «Қазақстан Республикасының негізгі куәландырушы орталығының, мемлекеттік органдардың куәландырушы орталығының және Қазақстан Республикасының ұлттық куәландырушы орталығының тіркеу куәліктерін беру, сақтау, кері қайтарып алу және электрондық цифрлық қолтаңбаның ашық кілтінің тиесілілігі мен жарамдылығын растау қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің м.а. 2015 жылғы 26 маусымдағы № 727 бұйрығына өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Инвестициялар және даму министрлігінің кейбір бұйрықтарының күші жойылды деп тану туралы
