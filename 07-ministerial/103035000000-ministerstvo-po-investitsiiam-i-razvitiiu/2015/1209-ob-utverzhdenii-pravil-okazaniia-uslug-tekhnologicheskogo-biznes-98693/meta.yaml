  code: '145590'
  requisite: Приказ и.о. Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 14 августа 2020 года № 296/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 августа 2020 года № 21111. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 15 ноября 2022 года № 437/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 9 декабря 2015 года № 1178 «Об утверждении Правил оказания услуг технологического бизнес-инкубирования, а также определения стоимости таких услуг, за исключением услуг, оказываемых международным технологическим парком «Астана Хаб»
    kaz: «Технологиялық бизнес-инкубациялау қызметтерін көрсету, сондай-ақ «Астана Хаб» халықаралық технологиялық паркі көрсететін қызметтерді қоспағанда, осындай қызметтер құнын айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 9 желтоқсандағы № 1178 бұйрығына өзгерістер енгізу туралы
