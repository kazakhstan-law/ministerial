act_code: '98693'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 9 декабря 2015 года № 1178. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 февраля 2016 года № 12959. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 15 ноября 2022 года № 437/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания услуг технологического бизнес-инкубирования, а также определения стоимости таких услуг, за исключением услуг, оказываемых международным технологическим парком «Астана Хаб»
  kaz: Технологиялық бизнес-инкубациялау қызметтерін көрсету, сондай-ақ «Астана Хаб» халықаралық технологиялық паркі көрсететін қызметтерді қоспағанда, осындай қызметтер құнын айқындау қағидаларын бекіту туралы
