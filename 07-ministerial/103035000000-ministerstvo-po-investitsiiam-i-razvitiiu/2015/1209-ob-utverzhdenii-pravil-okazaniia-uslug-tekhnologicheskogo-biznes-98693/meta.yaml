  requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 10 апреля 2019 года № 203. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 апреля 2019 года № 18503. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 15 ноября 2022 года № 437/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 9 декабря 2015 года № 1178 «Об утверждении Правил оказания услуг технологического бизнес-инкубирования, а также определения стоимости таких услуг»
    kaz: «Технологиялық бизнес-инкубациялау қызметтерін көрсету, сондай-ақ мұндай көрсетілетін қызметтер құнын айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 9 желтоқсандағы № 1178 бұйрығына өзгерістер енгізу туралы
