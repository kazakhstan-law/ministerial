requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 28 декабря 2015 года № 1261. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 февраля 2016 года № 13098. Утратил силу приказом Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 7 августа 2026 года № 464/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил регистрации и прекращения взаимодействия удостоверяющих центров, доверенных третьих сторон иностранных государств с доверенной третьей стороной Республики Казахстан
  kaz: Шет мемлекеттердің куәландырушы орталықтарының, сенім білдірілген үшінші тараптарының Қазақстан Республикасының сенім білдірілген үшінші тарапымен өзара іс-қимылын тіркеу және тоқтату қағидаларынбекіту туралы
