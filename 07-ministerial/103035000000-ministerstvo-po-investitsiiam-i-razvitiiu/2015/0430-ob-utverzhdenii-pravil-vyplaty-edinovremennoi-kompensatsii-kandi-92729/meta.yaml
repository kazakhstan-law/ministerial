act_code: '92729'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 30 апреля 2015 года № 552. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 июля 2015 года № 11805
title:
  rus: Об утверждении Правил выплаты единовременной компенсации кандидату в космонавты, космонавту при установлении инвалидности, наступившей в результате травмы, увечья, заболевания, полученных при исполнении служебных обязанностей, а также в случае его гибели (смерти) в связи с исполнением служебных обязанностей
  kaz: Ғарышкерлікке кандидатқа, ғарышкерге қызметтiк мiндеттерiн атқару кезінде алған жарақатының, мертігуінің, ауруының салдарынан мүгедектік белгіленген кезде, сондай-ақ ол қызметтік міндеттерін атқаруға байланысты қаза тапқан (қайтыс болған) жағдайда бiржолғы өтемақы төлеу қағидаларын бекіту туралы
