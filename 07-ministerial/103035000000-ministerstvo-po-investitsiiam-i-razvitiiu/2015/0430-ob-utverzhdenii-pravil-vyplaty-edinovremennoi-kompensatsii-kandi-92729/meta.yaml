  title:
    rus: О внесении изменения в приказ Министра по инвестициям и развитию Республики Казахстан от 30 апреля 2015 года № 552 «Об утверждении Правил выплаты единовременной компенсации кандидату в космонавты, космонавту при установлении инвалидности, наступившей в результате травмы, увечья, заболевания, полученных при исполнении служебных обязанностей, а также в случае его гибели (смерти) в связи с исполнением служебных обязанностей»
    kaz: «Ғарышкерлікке кандидатқа, ғарышкерге қызметтiк мiндеттерiн атқару кезінде алған жарақатының, мертігуінің, ауруының салдарынан мүгедектік белгіленген кезде, сондай-ақ ол қызметтік міндеттерін атқаруға байланысты қаза тапқан (қайтыс болған) жағдайда бiржолғы өтемақы төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 30 сәуірдегі № 552 бұйрығына өзгеріс енгізу туралы
