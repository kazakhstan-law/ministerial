  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 24 февраля 2015 года № 156 «Об утверждении образца мореходной книжки, Правил ее оформления и выдачи» и признании утратившими силу структурных элементов некоторых приказов Министерства по инвестициям и развитию Республики Казахстан и Министерства индустрии и инфраструктурного развития Республики Казахстан
    kaz: «Теңiзде жүзу кiтапшасының үлгiсiн, оны ресiмдеу және беру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 24 ақпандағы № 156 бұйрығына өзгерістер енгізу және Қазақстан Республикасы Инвестициялар және даму министрлігі мен Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің кейбір бұйрықтарының құрылымдық элементтерінің күші жойылды деп тану туралы
