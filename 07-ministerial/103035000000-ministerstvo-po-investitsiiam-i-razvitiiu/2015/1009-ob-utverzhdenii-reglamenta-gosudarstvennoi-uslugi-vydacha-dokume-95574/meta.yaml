act_code: '95574'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 9 октября 2015 года № 982. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 ноября 2015 года № 12302. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 22 апреля 2020 года № 219 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача документа об условиях переработки товаров на/вне таможенной территории и переработки для внутреннего потребления в легкой, горно-металлургической, химической, фармацевтической, деревообрабатывающей отраслях промышленности, а также машиностроении и стройиндустрии»
  kaz: «Жеңіл, тау-кен металлургия, химия, фармацевтика, ағаш өңдеу өнеркәсібі салаларында, сондай-ақ машина жасау және құрылыс индустриясында тауарларды Кеден аумағында/аумағынан тыс өңдеу және ішкі тұтыну үшін өңдеу шарттары туралы құжат беру» мемлекеттік көрсетілетін қызмет  регламентін бекіту туралы
