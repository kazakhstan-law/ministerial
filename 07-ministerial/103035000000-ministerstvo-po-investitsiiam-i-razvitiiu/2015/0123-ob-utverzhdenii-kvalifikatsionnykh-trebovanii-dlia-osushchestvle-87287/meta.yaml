  title:
    rus: О внесении изменений в приказы Министра торговли и интеграции Республики Казахстан от 31 мая 2021 года № 377-НҚ «Об утверждении требований к учебным центрам, правил их включения в реестр данных государственной системы технического регулирования» и исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 23 января 2015 года № 50 «Об утверждении квалификационных требований для осуществления деятельности по изготовлению Государственного Флага Республики Казахстан и Государственного Герба Республики Казахстан, и перечня документов, подтверждающих соответствие им», а также признании утратившим силу некоторых приказов
    kaz: «Оқу орталықтарына қойылатын талаптарды, оларды мемлекеттік техникалық реттеу жүйесі деректерінің тізіліміне енгізу қағидаларын бекіту туралы» Қазақстан Республикасы Сауда және интеграция министрінің 2021 жылғы 31 мамырдағы № 377-НҚ және «Қазақстан Республикасының Мемлекеттік Туы мен Қазақстан Республикасының Мемлекеттік Елтаңбасын дайындау жөніндегі қызметті жүзеге асыру үшін қойылатын біліктілік талаптары мен олардың сәйкестігін растайтын құжаттар тізбесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндеттерін атқарушысының 2015 жылғы 23 қаңтардағы № 50 бұйрықтарына өзгерістер енгізу, сондай-ақ кейбір бұйрықтардың күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/212529/rus
