  title:
    rus: «О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 23 января 2015 года № 50 «Об утверждении квалификационных требований для осуществления деятельности по изготовлению Государственного Флага Республики Казахстан и Государственного Герба Республики Казахстан, и перечня документов, подтверждающих соответствие им»
    kaz: «Қазақстан Республикасының Мемлекеттік Туы мен Қазақстан Республикасының Мемлекеттік Елтаңбасын жасау жөніндегі қызметті жүзеге асыру үшін қойылатын біліктілік талаптары мен олардың сәйкестігін растайтын құжаттар тізбесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 23 қаңтардағы № 50 бұйрығына өзгерістер енгізу туралы
