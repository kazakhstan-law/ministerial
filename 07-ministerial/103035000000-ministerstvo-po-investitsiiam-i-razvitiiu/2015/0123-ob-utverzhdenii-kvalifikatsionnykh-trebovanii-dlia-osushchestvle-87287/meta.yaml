title:
  rus: Об утверждении  квалификационных требований для осуществления деятельности по изготовлению Государственного                       Флага Республики Казахстан и Государственного Герба Республики Казахстан, и перечня документов, подтверждающих  соответствие им
  kaz: Қазақстан Республикасының Мемлекеттік Туын және Қазақстан Республикасының Мемлекеттік Елтаңбасын дайындау жөніндегі қызметті жүзеге асыру үшін қойылатын біліктілік талаптары және оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы
