  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 марта 2015 года № 318 «Об утверждении Правил взимания платы за проезд по платной автомобильной дороге общего пользования республиканского значения (участку)»
    kaz: «Жалпыға ортақ пайдаланылатын республикалық маңызы бар (жол учаске) ақылы автомобиль жолымен жүріп өту үшін ақы алу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 26 наурыздағы № 318 бұйрығына өзгерістер енгізу туралы
