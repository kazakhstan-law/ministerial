  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 марта 2015 года № 318 "Об утверждении Правил взимания платы за проезд по платной автомобильной дороге (участку)"
    kaz: '"Ақылы автомобиль жолымен (жол учаскесімен) жүріп өту үшін ақы алу қағидаларын бекіту туралы" Қазақстан Республикасы Инвестициялар және даму министрі атқарушының 2015 жылғы 26 наурыздағы № 318 бұйрығына өзгерістер енгізу туралы'
