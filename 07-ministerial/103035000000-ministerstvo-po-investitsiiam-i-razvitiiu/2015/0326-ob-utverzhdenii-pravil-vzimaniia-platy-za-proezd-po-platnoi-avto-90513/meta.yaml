title:
  rus: Об утверждении Правил взимания платы за проезд по платной автомобильной дороге общего пользования республиканского значения (участку)
  kaz: Жалпыға ортақ пайдаланылатын республикалық маңызы бар (жол учаске) ақылы автомобиль жолыменімен жүріп өту үшін ақы алу қағидаларын бекіту туралы
