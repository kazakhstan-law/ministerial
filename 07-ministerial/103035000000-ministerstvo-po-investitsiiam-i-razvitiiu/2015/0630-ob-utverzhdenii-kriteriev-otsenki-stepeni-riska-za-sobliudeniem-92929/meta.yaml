requisite: Совместный приказ Министра по инвестициям и развитию Республики Казахстан от 30 июня 2015 года № 743 и и.о. Министра национальной экономики Республики Казахстан от 31 июля 2015 года № 588. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 августа 2015 года № 11866. Утратил силу совместным приказом Министра по инвестициям и развитию РК от 29.12.2015 № 1264 и и.о. Министра национальной экономики РК от 31.12.2015 № 842 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
