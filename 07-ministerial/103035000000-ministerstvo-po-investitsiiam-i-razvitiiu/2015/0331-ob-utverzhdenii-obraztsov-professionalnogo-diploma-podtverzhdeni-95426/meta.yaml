act_code: '95426'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 31 марта 2015 года № 421. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 ноября 2015 года № 12283. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 26 июля 2017 года № 504 (приказ вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении образцов профессионального диплома, подтверждения профессионального диплома, Правил выдачи, приостановления срока действия, изъятия профессионального диплома, подтверждения профессионального диплома, льготного разрешения, а также квалификационных требований, предъявляемых к членам экипажа судна
  kaz: Кәсіби дипломның, кәсіби диплом растамасының үлгілерін, кәсіби дипломды, кәсіби диплом растамасын, жеңілдік рұқсатын беру, олардың қолданылу мерзімін тоқтата тұру, оларды алып қою ағидаларын, сондай-ақ кеме экипажы мүшелеріне қойылатын біліктілік талаптарын бекiту туралы
