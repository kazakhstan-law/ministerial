caused_by:
  code: '129899'
  requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 18 марта 2019 года № 15/қе. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 марта 2019 года № 18424
  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 23 октября 2018 года № 86/қе «Об утверждении цен на услуги, реализуемые субъектом государственной монополии в сферах информатизации, обеспечения информационной безопасности» и признании утратившими силу некоторых приказов и их структурных элементов Министра по инвестициям и развитию Республики Казахстан, Министра информации и коммуникаций Республики Казахстан и Председателя Комитета национальной безопасности Республики Казахстан
    kaz: «Ақпараттандыру, ақпараттық қауіпсіздікті қамтамасыз ету салаларындағы мемлекеттік монополия субъектісі іске асыратын қызметтердің бағаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2018 жылғы 23 қазандағы № 86/қе бұйрығына өзгерістер енгізу және Қазақстан Республикасының Инвестициялар және даму министрінің, Қазақстан Республикасының ақпарат және коммуникациялар министрінің және Қазақстан Республикасының Ұлттық қауіпсіздік комитеті Төрағасының кейбір бұйрықтарының және олардың құрылымдық элементтерінің күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/129899/rus
