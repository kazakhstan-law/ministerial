  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 30 января 2015 года № 88 "Об утверждении цен на услуги, реализуемые субъектом государственной монополии в сферах электронного документа и электронной цифровой подписи, информатизации и в области связи"
    kaz: '"Электрондық құжат және электрондық цифрлық қолтаңба, ақпараттандыру және байланыс салаларындағы мемлекеттік монополия субъектісі жүзеге асыратын қызметтердің бағаларын бекіту туралы" Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 30 қаңтардағы № 88 бұйрығына өзгерістер енгізу туралы'
