act_code: '87848'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 30 января 2015 года № 88. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 марта 2015 года № 10493. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 20 ноября 2019 года № 314/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении цен на услуги, реализуемые субъектом государственной монополии в сферах электронного документа и электронной цифровой подписи, информатизации, в области связи и телерадиовещания
  kaz: Электрондық құжат және электрондық цифрлық қолтаңба, ақпараттандыру салаларындағы және байланыс, телерадио хабарларын тарату салаларындағы мемлекеттік монополия субъектісі жүзеге асыратын қызметтердің бағаларын бекіту туралы
