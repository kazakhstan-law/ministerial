  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 24 февраля 2015 года № 189 «Об утверждении Правил организации обслуживания пассажиров в аэропортах Республики Казахстан» и в приказ Министра по инвестициям и развитию Республики Казахстан от 12 июня 2017 года № 339 «Об утверждении нормативных правовых актов в области безопасности и охраны труда в гражданской авиации»
    kaz: «Қазақстан Республикасының әуежайларында жолаушыларға қызмет көрсетуді ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 24 ақпандағы № 189 бұйрығына және «Азаматтық авиациядағы еңбек қауіпсіздігі және еңбекті қорғау саласындағы нормативтік құқықтық актілерді бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 12 маусымдағы № 339 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/172115/rus
