  requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 28 марта 2017 года № 167. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 июня 2017 года № 15264. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 21 мая 2018 года № 355 (вводится в действие с 29 июня 2018 года)
  title:
    rus: О внесении изменений и дополнений в приказ Министра по инвестициям и развитию Республики Казахстан от 30 января 2015 года № 96 «Об утверждении Правил приобретения товаров, работ и услуг при проведении операций по недропользованию посредством государственной информационной системы «Реестр товаров, работ и услуг, используемых при проведении операций по недропользованию, и их производителей»
    kaz: «Жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде пайдаланылатын тауарлардың, жұмыстар мен көрсетілетін қызметтердің және оларды өндірушілердің тізілімі» мемлекеттік ақпараттық жүйесі арқылы жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде тауарларды, жұмыстар мен көрсетілетін қызметтерді сатып алу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 30 қаңтардағы № 96 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/113675/rus
