  title:
    rus: О внесении изменений и дополнения в приказы Министра по инвестициям и развитию Республики Казахстан от 26 июня 2017 года № 382 «Об утверждении Правил аккредитации иностранных воздушных перевозчиков в Республике Казахстан» и Министра по инвестициям и развитию Республики Казахстан от 30 апреля 2015 года № 530 «Об утверждении стандартов государственных услуг в сферах деятельности иностранных перевозчиков и использования воздушного пространства»
    kaz: «Қазақстан Республикасында шетелдік әуемен тасымалдаушыларды аккредиттеу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 26 маусымдағы № 382 және «Шетел тасымалдаушыларының және әуе кеңістігін пайдалану қызметтері саласында мемлекеттік көрсетілген қызметтер стандарттарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 30 сәуірдегі № 530 бұйрықтарға өзгерістер мен толықтыру енгізу туралы
