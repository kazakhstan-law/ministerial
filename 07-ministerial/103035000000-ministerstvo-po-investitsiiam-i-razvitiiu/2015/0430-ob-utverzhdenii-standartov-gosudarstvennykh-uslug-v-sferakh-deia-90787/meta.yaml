requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 30 апреля 2015 года № 530. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 июня 2015 года № 11305. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 13 октября 2020 года № 527 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандартов государственных услуг в сферах деятельности иностранных перевозчиков и использования воздушного пространства
  kaz: Шетел тасымалдаушыларының және әуе кеңістігін пайдалану қызметтері саласында мемлекеттік көрсетілген қызметтер стандарттарын бекіту туралы
