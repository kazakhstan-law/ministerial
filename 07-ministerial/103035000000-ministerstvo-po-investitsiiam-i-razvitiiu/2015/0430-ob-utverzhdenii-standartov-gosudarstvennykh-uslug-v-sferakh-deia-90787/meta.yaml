  title:
    rus: О внесении изменения и дополнения в приказ исполняющего обязанности Министра транспорта и коммуникаций Республики Казахстан от 13 августа 2010 года № 359 «Об утверждении Правил выдачи и оснований для отказа в выдаче разрешений на выполнение международных нерегулярных полетов» и в приказ Министра по инвестициям и развитию Республики Казахстан от 30 апреля 2015 года № 530 «Об утверждении стандартов государственных услуг в сферах деятельности иностранных перевозчиков и использования воздушного пространства»
    kaz: «Халықаралық тұрақты емес ұшуды орындауға рұқсаттар беру және оны беруден бас тарту негіздерінің қағидаларын бекіту туралы» Қазақстан Республикасы Көлік және коммуникация министрінің міндетін атқарушының 2010 жылғы 13 тамыздағы № 359 бұйрығына және «Шетел тасымалдаушыларының және әуе кеңістігін пайдалану қызметтері саласында мемлекеттік көрсетілген қызметтер стандарттарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 30 сәуірдегі № 530 бұйрығына өзгеріс пен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/125380/rus
