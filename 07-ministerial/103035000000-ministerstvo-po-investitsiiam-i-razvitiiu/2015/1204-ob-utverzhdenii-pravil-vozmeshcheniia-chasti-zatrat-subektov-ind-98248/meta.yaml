  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 4 декабря 2015 года № 1164 «Об утверждении Правил возмещения части затрат субъектов индустриально-инновационной деятельности по продвижению отечественных обработанных товаров, работ, услуг на внутреннем рынке»
    kaz: «Индустриялық-инновациялық қызмет субъектілерінің отандық өңделген тауарларды, жұмыстарды, көрсетілетін қызметтерді ішкі нарықта ілгерілету бойынша шығындарының бір бөлігін өтеу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 4 желтоқсандағы № 1164 бұйрығына өзгеріс енгізу туралы
