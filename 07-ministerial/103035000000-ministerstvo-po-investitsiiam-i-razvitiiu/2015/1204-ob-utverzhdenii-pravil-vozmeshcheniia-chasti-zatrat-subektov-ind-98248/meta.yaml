requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 4 декабря 2015 года № 1164. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2015 года № 12652. Утратил силу приказом и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 15 июня 2022 года № 342 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил возмещения части затрат субъектов индустриально-инновационной деятельности по продвижению отечественных обработанных товаров, работ, услуг на внутреннем рынке
  kaz: Индустриялық-инновациялық қызмет субъектілерінің отандық өңделген тауарларды, жұмыстарды, көрсетілетін қызметтерді ішкі нарықта ілгерілету бойынша шығындарының бір бөлігін өтеу қағидаларын бекіту туралы
