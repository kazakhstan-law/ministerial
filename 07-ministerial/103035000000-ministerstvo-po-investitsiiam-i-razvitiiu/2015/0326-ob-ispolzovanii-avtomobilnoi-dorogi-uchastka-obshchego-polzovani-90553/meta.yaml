  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 марта 2015 года № 317 «Об использовании автомобильной дороги (участка) общего пользования республиканского значения на платной основе»
    kaz: «Республикалық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолын (жол учаскесін) ақылы негізде пайдалану туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 26 наурыздағы № 317 бұйрығына өзгерістер енгізу туралы»
