title:
  rus: Об использовании автомобильной дороги (участка) общего пользования республиканского значения на платной основе
  kaz: Республикалық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолын (жол учаскесін) ақылы негізде пайдалану туралы
