act_code: '97475'
requisite: Совместный приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 4 декабря 2015 года № 1160 и Министра национальной экономики Республики Казахстан от 25 декабря 2015 года № 790. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2015 года № 12662. Утратил силу совместным приказом и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 7 апреля 2023 года № 230 и и.о. Министра национальной экономики Республики Казахстан от 12 апреля 2023 года № 47 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов в области оборота ядов, взрывчатых и пиротехнических (за исключением гражданских) веществ и изделий с их применением
  kaz: Улардың, жарылғыш және пиротехникалық заттар мен олар қолданылып жасалған бұйымдардың (азаматтықты қоспағанда) айналымы саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы
