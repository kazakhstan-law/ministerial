caused_by:
  code: '126253'
  requisite: Совместный приказ Министра по инвестициям и развитию Республики Казахстан от 16 ноября 2018 года № 800 и Министра национальной экономики Республики Казахстан от 19 ноября 2018 года № 73. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 ноября 2018 года № 17772. Утратил силу совместным приказом и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 7 апреля 2023 года № 230 и и.о. Министра национальной экономики Республики Казахстан от 12 апреля 2023 года № 47 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в совместный приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 4 декабря 2015 года № 1160 и Министра национальной экономики Республики Казахстан от 25 декабря 2015 года № 790 «Об утверждении критериев оценки степени риска и проверочного листа в области оборота ядов, вооружения, военной техники и отдельных видов оружия, взрывчатых и пиротехнических веществ и изделий с их применением»
    kaz: «Улардың, қару-жарақтың, әскери техниканың және жекелеген қару түрлерінің, жарылғыш және пиротехникалық заттар мен олар қолданыла отырып жасалған бұйымдардың айналымы саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 4 желтоқсандағы № 1160 және Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 25 желтоқсандағы № 790 бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
