  title:
    rus: О внесении изменений и дополнения в некоторые приказы Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан и исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан
    kaz: Қазақстан Республикасы цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрінің және Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының кейбір бұйрықтарына өзгерістер енгізу туралы
