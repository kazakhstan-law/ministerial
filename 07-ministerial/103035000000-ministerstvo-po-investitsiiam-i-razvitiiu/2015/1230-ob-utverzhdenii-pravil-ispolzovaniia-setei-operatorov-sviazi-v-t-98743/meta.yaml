act_code: '98743'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 30 декабря 2015 года № 1274. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12802
title:
  rus: Об утверждении Правил использования сетей операторов связи в целях предоставления единой дежурно-диспетчерской службе "112" услуги по определению местоположения звонящего абонента и рассылке коротких текстовых сообщений на телефоны сотовой связи населения при угрозе или возникновении и снятии угрозы чрезвычайных ситуаций социального, природного и техногенного характера, введения чрезвычайного положения, в интересах обороны, безопасности и правопорядка
  kaz: Бірыңғай кезекшілік-диспетчерлік "112" қызметіне қоңырау шалушы абоненттің орналасқан жерін анықтау және әлеуметтік, табиғи және техногендік сипаттағы төтенше жағдайлар қатері төнген немесе қатер туындаған және жойылған, төтенше жағдай енгізілген кезде, қорғаныс, қауіпсіздік және құқық тәртібі мүддесінде халықтың ұялы байланыс телефондарына қысқа мәтіндік хабарлар жіберу жөнінде қызметтер көрсету мақсатында байланыс операторларының желілерін пайдалану қағидаларын бекіту туралы
