  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 20 марта 2015 года № 305 «Об утверждении Правил организации производства экспертизы качества работ и материалов при строительстве, реконструкции, ремонте и содержании автомобильных дорог юридическими лицами по производству экспертизы качества»
    kaz: «Сапаға сараптама жүргізу жөніндегі заңды тұлғалардың автомобиль жолдарын салу, реконструкциялау, жөндеу және күтіп-ұстау кезінде жұмыстар мен материалдардың сапасына сараптама жүргізуін ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 20 наурыздағы № 305 бұйрығына өзгерістер енгізу туралы
