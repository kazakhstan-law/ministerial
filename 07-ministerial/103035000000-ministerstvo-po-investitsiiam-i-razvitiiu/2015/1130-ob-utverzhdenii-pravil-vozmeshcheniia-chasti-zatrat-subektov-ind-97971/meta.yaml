  title:
    rus: О внесении изменения в приказ Министра по инвестициям и развитию Республики Казахстан от 30 ноября 2015 года № 1128 «Об утверждении Правил возмещения части затрат субъектов индустриально-инновационной деятельности по продвижению отечественных обработанных товаров, перечня отечественных обработанных товаров, по которым частично возмещаются затраты по их продвижению»
    kaz: «Отандық өңделген тауарларды ілгерілету бойынша индустриялық-инновациялық қызмет субъектілері шығындарының бір бөлігін өтеу қағидаларын, оларды ілгерілету бойынша шығындары ішінара өтелетін отандық өңделген тауарлардың тізбесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 30 қарашадағы № 1128 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/130057/rus
