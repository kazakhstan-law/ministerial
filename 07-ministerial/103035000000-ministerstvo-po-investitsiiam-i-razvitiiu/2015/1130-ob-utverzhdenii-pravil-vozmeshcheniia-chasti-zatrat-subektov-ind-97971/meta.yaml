act_code: '97971'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 30 ноября 2015 года № 1128. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12730. Утратил силу приказом и.о. Министра торговли и интеграции Республики Казахстан от 1 августа 2022 года № 314-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил возмещения части затрат субъектов индустриально-инновационной деятельности по продвижению отечественных обработанных товаров, а также информационно-коммуникационных услуг, перечня отечественных обработанных товаров, а также  информационно-коммуникационных услуг, по которым частично возмещаются затраты по их продвижению
  kaz: Индустриялық-инновациялық қызмет субъектілерінің отандық өңделген тауарларды, сондай-ақ ақпараттық-коммуникациялық көрсетілетін қызметтерді ілгерілету бойынша шығындарының бір бөлігін өтеу қағидаларын, отандық өңделген тауарлардың, сондай-ақ оларды ілгерілету бойынша шығындары ішінара өтелетін ақпараттық-коммуникациялық көрсетілетін қызметтердің тізбесін бекіту туралы
