act_code: '87897'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 6 февраля 2015 года № 117. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 марта 2015 года № 10452. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 26 июня 2017 года № 384 (вводится в действие по истечении двадцати одного календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил сертификации и выдачи сертификата органа обслуживания воздушного движения и (или) службы эксплуатации радиотехнического оборудования и связи аэронавигационной организации, а также Сертификационных требований, предъявляемых к органам обслуживания воздушного движения и (или) службам эксплуатации радиотехнического оборудования и связи аэронавигационной организации
  kaz: Аэронавигациялық ұйымның әуе қозғалысына қызмет көрсету органын және (немесе) радиотехникалық жабдықты пайдалану және байланыс қызметін сертификаттау және оған сертификат беру қағидаларын, сондай-ақ Аэронавигациялық ұйымның әуе қозғалысына қызмет көрсету органдарына және (немесе) радиотехникалық жабдықты пайдалану және байланыс қызметтеріне қойылатын сертификаттық талаптарды бекіту туралы
