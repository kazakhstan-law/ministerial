  title:
    rus: Об утверждении стандарта государственной услуги «Аттестация информационной системы, информационно-коммуникационной платформы «электронного правительства» и интернет-ресурса государственного органа на соответствие требованиям информационной безопасности»
    kaz: «Ақпараттық жүйені, «электрондық үкіметтің» ақпараттық-коммуникациялық платформасын және мемлекеттік органның интернет-ресурсын ақпараттық қауіпсіздік талаптарына сәйкестікке аттестаттау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
