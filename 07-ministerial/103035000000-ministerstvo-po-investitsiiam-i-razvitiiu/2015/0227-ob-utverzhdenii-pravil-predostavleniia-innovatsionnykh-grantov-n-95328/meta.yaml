act_code: '95328'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 27 февраля 2015 года № 212. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 сентября 2015 года № 12076. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 22 ноября 2016 года № 807
title:
  rus: Об утверждении Правил предоставления инновационных грантов на повышение квалификации инженерно-технического персонала за рубежом, привлечение высококвалифицированных иностранных специалистов, привлечение консалтинговых, проектных и инжиниринговых организаций, на внедрение управленческих и производственных технологий
  kaz: Шет елде инженерлiк-техникалық персоналдың біліктілігін арттыруға, жоғары білікті шетелдік мамандарды тартуға, консалтингтік, жобалық және инжинирингтік ұйымдарды тартуға, басқарушылық және өндiрiстiк технологияларды енгiзуге инновациялық гранттар беру қағидаларын бекіту туралы
