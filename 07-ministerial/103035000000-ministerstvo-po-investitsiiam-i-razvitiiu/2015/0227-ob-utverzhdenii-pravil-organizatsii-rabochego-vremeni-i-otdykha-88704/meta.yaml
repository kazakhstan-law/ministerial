    kaz: «Қазақстан Республикасының азаматтық және эксперименттік авиациясы әуе кемелерінің экипаж мүшелерінің жұмыс уақыты мен демалысын ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 27 ақпандағы № 250 бұйрығына өзгерістер енгізу туралы
