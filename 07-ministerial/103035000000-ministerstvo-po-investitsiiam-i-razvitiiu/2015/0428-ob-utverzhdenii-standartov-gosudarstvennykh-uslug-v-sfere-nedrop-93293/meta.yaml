  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 28 апреля 2015 года № 521 «Об утверждении стандартов государственных услуг в сфере недропользования, за исключением углеводородного сырья и урана»
    kaz: «Көмірсутекті шикізат пен уранды қоспағанда, жер қойнауын пайдалану саласындағы мемлекеттік көрсетілетін қызмет стандарттарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 28 сәуірдегі № 521 бұйрығына өзгерістер енгізу туралы
