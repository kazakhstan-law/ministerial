requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 9 декабря 2015 года № 1191. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 февраля 2016 года № 12989. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 1 октября 2020 года № 366/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
