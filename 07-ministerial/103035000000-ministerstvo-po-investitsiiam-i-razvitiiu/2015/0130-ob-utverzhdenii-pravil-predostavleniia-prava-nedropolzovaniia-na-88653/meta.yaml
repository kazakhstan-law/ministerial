act_code: '88653'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 30 января 2015 года № 94. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 апреля 2015 года № 10614. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 11 мая 2018 года № 325 (вводится в действие с 29 июня 2018 года)
title:
  rus: Об утверждении Правил предоставления права недропользования на строительство и (или) эксплуатацию подземных сооружений, не связанных с разведкой или добычей, а также особенностей осуществления строительства и (или) эксплуатации подземных сооружений, не связанных с разведкой или добычей
  kaz: Барлаумен немесе өндірумен байланысты емес жерасты құрылыстарын салуға және (немесе) пайдалануға жер қойнауын пайдалану құқығын беру қағидаларын, сондай-ақ барлаумен немесе өндірумен байланысты емес жерасты құрылыстарын салуды және (немесе) пайдалануды жүзеге асыру ерекшеліктерін бекіту туралы
