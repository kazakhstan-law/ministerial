requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 24 апреля 2015 года № 491. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июня 2015 года № 11280. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 13 октября 2020 года № 383/НҚ (вводится в действие по истечении десяти календарного дня после дня его первого официального опубликования)
