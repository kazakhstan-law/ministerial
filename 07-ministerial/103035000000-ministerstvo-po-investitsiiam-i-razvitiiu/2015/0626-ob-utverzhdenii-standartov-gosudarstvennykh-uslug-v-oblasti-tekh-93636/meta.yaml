  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 июня 2015 года № 730 «Об утверждении стандартов государственных услуг в области технического регулирования и метрологии»
    kaz: «Техникалық реттеу және метрология саласындағы мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 26 маусымдағы № 730 бұйрығына өзгерістер мен толықтырулар енгізу туралы
