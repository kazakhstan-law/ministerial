    kaz: Қазақстан Республикасы Индустрия және жаңа технологиялар министрлігінің және Қазақстан Республикасы Инвестициялар және даму министрлігінің кейбір бұйрықтарына мемлекеттік қызметтерді көрсету мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
