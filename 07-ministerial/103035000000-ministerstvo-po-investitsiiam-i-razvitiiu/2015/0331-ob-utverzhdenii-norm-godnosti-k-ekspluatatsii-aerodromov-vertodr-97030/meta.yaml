  title:
    rus: О внесении изменений в приказы Министра по инвестициям и развитию Республики Казахстан от 31 марта 2015 года № 381 «Об утверждении норм годности к эксплуатации аэродромов (вертодромов) гражданской авиации» и от 31 марта 2015 года № 376 «Об утверждении методики оценки соответствия нормам годности аэродромов (вертодромов) к эксплуатации гражданских воздушных судов»
    kaz: Қазақстан Республикасы Инвестициялар және даму министрінің «Азаматтық авиация әуеайлақтарының (тікұшақ айлақтарының) пайдалануға жарамдылығы нормаларын бекіту туралы» 2015 жылғы 31 наурыздағы № 381 және «Әуеайлақтардың (тікұшақ айлақтарының) азаматтық әуе кемелерін пайдалануға жарамдылығы нормаларына сәйкестігін бағалау әдістемесін бекіту туралы» 2015 жылғы 31 наурыздағы № 376 бұйрықтарына өзгерістер енгізу туралы
