title:
  rus: Об утверждении Таблицы распределения полос частот между радиослужбами Республики Казахстан в диапазоне частот от 3 кГц до 400 ГГц для радиоэлектронных средств всех назначений
  kaz: Қазақстан Республикасы радио қызметтері арасында барлық мақсаттағы радиоэлектрондық құралдарға арналған 3 кГц-тен 400 ГГц-ке дейінгі жиіліктер ауқымында жиіліктер белдеуін бөлу кестесін бекіту туралы
