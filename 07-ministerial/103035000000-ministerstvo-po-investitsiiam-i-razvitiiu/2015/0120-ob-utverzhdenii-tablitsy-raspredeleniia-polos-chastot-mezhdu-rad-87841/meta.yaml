  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 20 января 2015 года № 22 «Об утверждении Таблицы распределения полос частот между радиослужбами Республики Казахстан в диапазоне частот от 3 кГц до 400 ГГц для радиоэлектронных средств всех назначений»
    kaz: Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 20 қаңтардағы бұйрығына өзгеріс енгізу туралы 2015 жылғы № 22 «Қазақстан Республикасы радио қызметтері арасында барлық мақсаттағы радиоэлектрондық құралдарға арналған 3 кГц-тен 400 ГГц-ке дейінгі жиіліктер ауқымында жиіліктер белдеуін бөлу кестесін бекіту туралы»
