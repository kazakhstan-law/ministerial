  title:
    rus: О внесении изменений в некоторые приказы исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан, исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан и Министра индустрии и инфраструктурного развития Республики Казахстан
    kaz: Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының, Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының және Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің кейбір бұйрықтарына өзгерістер енгізу туралы
