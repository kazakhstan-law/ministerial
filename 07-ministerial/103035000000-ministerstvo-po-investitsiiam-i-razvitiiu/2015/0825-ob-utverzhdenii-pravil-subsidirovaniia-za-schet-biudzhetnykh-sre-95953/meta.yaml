  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 25 августа 2015 года № 883 «Об утверждении Правил субсидирования за счет бюджетных средств убытков перевозчиков, связанных с осуществлением социально значимых перевозок пассажиров»
    kaz: «Әлеуметтік маңызы бар жолаушылар тасымалдарын жүзеге асырумен байланысты тасымалдаушылардың шығындарын бюджет қаражаты есебінен субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 25 тамыздағы № 883 бұйрығына өзгеріс енгізу туралы
