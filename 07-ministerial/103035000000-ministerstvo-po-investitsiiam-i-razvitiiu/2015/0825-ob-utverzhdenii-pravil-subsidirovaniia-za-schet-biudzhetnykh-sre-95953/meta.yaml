  title:
    rus: О внесении изменений и дополнения в некоторые приказы исполняющего обязанности Министра транспорта и коммуникаций Республики Казахстан, Министра по инвестициям и развитию Республики Казахстан и исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан
    kaz: Қазақстан Республикасы Көлік және коммуникация министрінің міндетін атқарушының, Қазақстан Республикасы Инвестициялар және даму министрінің және Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының кейбір бұйрықтарына өзгерістер мен толықтыру енгізу туралы
