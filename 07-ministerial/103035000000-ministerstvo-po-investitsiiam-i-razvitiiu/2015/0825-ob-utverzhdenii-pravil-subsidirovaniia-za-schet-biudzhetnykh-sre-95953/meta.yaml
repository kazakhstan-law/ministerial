title:
  rus: Об утверждении Правил субсидирования за счет бюджетных средств убытков перевозчиков, связанных с осуществлением социально значимых перевозок пассажиров, за исключением городов республиканского значения, столицы и их агломераций
  kaz: Республикалық маңызы бар қалаларды, астананы және олардың агломерацияларын қоспағанда, әлеуметтік маңызы бар жолаушылар тасымалдарын жүзеге асырумен байланысты тасымалдаушылардың шығындарын бюджет қаражаты есебінен субсидиялау қағидаларын бекіту туралы
