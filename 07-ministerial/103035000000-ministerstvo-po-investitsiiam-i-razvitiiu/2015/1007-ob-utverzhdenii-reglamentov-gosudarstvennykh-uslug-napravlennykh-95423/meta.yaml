act_code: '95423'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 7 октября 2015 года № 981. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 ноября 2015 года № 12269. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 15 июня 2018 года № 451 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов государственных услуг, направленных на развитие и продвижение экспорта отечественных обработанных товаров, услуг и поддержку повышения производительности труда
  kaz: Отандық өңделген тауарлардың, көрсетілетін қызметтердің экспортын дамыту мен жылжытуға және еңбек өнімділігін арттыруды қолдауға бағытталған мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы
