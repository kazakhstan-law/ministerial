  title:
    rus: О внесении изменений в приказ исполняющего обязанности министра по инвестициям и развитию Республики Казахстан от 7 октября 2015 года № 981 "Об утверждении регламентов государственных услуг, оказываемых в рамках программ "Экспортер 2020" и "Производительность 2020"
    kaz: '"Экспорттаушы 2020" және "Өнімділік 2020" бағдарламалары шеңберінде көрсетілетін мемлекеттік қызметтер регламенттерін бекіту туралы" Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 7 қазандағы № 981 бұйрығына өзгерістер енгізу туралы'
