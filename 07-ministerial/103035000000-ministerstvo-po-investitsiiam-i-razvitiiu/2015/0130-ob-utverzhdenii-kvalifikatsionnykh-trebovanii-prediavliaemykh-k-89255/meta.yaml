act_code: '89255'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 30 января 2015 года № 72. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 апреля 2015 года № 10800
title:
  rus: Об утверждении квалификационных требований, предъявляемых к деятельности по нерегулярной перевозке пассажиров автобусами, микроавтобусами в междугородном межобластном, межрайонном (междугородном внутриобластном) и международном сообщениях, а также регулярной перевозке пассажиров автобусами, микроавтобусами в международном сообщении и перечня документов, подтверждающих соответствие им
  kaz: Жолаушыларды облысаралық қалааралық, ауданаралық (облысішілік қалааралық) және халықаралық қатынастарда автобустармен, шағын автобустармен тұрақты емес тасымалдау, сондай-ақ жолаушыларды халықаралық қатынаста автобустармен, шағын автобустармен тұрақты тасымалдау жөніндегі қызметті жүзеге асыру үшін қойылатын біліктілік талаптары мен олардың сәйкестігін растайтын құжаттар тізбесін бекіту туралы
