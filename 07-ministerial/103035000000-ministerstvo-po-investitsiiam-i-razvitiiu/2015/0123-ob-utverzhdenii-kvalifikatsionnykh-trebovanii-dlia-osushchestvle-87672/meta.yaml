requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 23 января 2015 года № 44. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 марта 2015 года № 10424. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 9 декабря 2016 года № 843
title:
  rus: Об утверждении квалификационных требований для осуществления деятельности по разработке, производству, приобретению и реализации взрывчатых и пиротехнических веществ и изделий с их применением и перечня документов, подтверждающих соответствие им
  kaz: Жарылғыш және пиротехникалық заттар мен олар қолданылып жасалған бұйымдарды әзiрлеу, өндiру, сатып алу және өткiзу жөнiндегi қызметтi жүзеге асыру үшін қойылатын біліктілік талаптарын және оларға сәйкестiкті растайтын құжаттар тiзбесін бекіту туралы
