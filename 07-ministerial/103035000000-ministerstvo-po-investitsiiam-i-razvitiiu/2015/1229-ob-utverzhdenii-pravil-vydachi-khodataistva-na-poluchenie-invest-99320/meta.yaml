  kaz: Қазақстан Республикасының бейрезиденті болып табылатын және Қазақстан Республикасының аумағында инвестициялық қызметті жүзеге асыратын тұлғалар үшін инвесторлық виза алуға өтінішхатты беру қағидаларын бекіту туралы
