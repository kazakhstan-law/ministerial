    kaz: «Қазақстан Республикасының бейрезиденті болып табылатын және Қазақстан Республикасының аумағында инвестициялық қызметті жүзеге асыратын тұлғалар үшін инвесторлық виза алуға өтінішхатты беру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 29 желтоқсандағы № 1265 бұйрығына өзгерістер енгізу туралы
