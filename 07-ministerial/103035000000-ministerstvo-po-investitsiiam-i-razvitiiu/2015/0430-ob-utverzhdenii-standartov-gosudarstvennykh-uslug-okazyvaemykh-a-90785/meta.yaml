act_code: '90785'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 30 апреля 2015 года № 534. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 июня 2015 года № 11320. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 14 апреля 2020 года № 140/НҚ (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении стандартов государственных услуг, оказываемых Аэрокосмическим комитетом Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан
  kaz: Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлігінің Аэроғарыш комитеті көрсететін мемлекеттік көрсетілетін қызмет стандарттарын бекіту туралы
