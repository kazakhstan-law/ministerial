  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 30 апреля 2015 года № 534 «Об утверждении стандартов государственных услуг, оказываемых Аэрокосмическим комитетом Министерства по инвестициям и развитию Республики Казахстан»
    kaz: «Қазақстан Республикасы Инвестициялар және даму министрлігінің Аэроғарыш комитеті көрсететін мемлекеттік көрсетілетін қызмет стандарттарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 30 сәуірдегі № 534 бұйрығына өзгерістер енгізу туралы
