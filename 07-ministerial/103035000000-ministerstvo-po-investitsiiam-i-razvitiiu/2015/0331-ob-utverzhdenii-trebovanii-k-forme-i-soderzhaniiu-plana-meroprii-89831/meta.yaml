  title:
    rus: О внесении изменений и дополнения в приказ Министра по инвестициям и развитию Республики Казахстан от 31 марта 2015 года № 391 «Об утверждении требований к форме и содержанию плана мероприятий по энергосбережению и повышению энергоэффективности, разрабатываемого субъектом Государственного энергетического реестра по итогам энергоаудита»
    kaz: «Энергия аудитінің қорытындысы бойынша Мемлекеттік энергетикалық тізілім субъектісі әзірлейтін, энергия үнемдеу және энергия тиімділігін арттыру жөніндегі іс-шаралар жоспарының нысаны мен мазмұнына қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Инвестициялар және даму Министрінің 2015 жылғы 31 наурыздағы № 391 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/96984/rus
