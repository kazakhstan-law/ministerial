  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 23 февраля 2015 года № 149 «Об утверждении Правил подтверждения подлинности иностранной электронной цифровой подписи доверенной третьей стороной Республики Казахстан»
    kaz: «Қазақстан Республикасының сенім білдірілген үшінші тарапының шетелдік электрондық цифрлық қолтаңбасының түпнұсқалылығын растау қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрі міндетін атқарушының  2015 жылғы 23 ақпандағы  № 149 бұйрығына өзгерістер енгізу туралы
