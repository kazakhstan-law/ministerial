title:
  rus: Об утверждении Правил по утверждению и регистрации одобрений типа транспортного средства, одобрений типа шасси и Правил по проверке правильности и обоснованности оформления одобрений типа транспортного средства, одобрений типа шасси
  kaz: Көлік құралының типін мақұлдауларды, шасси типін мақұлдауларды бекіту және тіркеу жөніндегі қағидаларды және Көлік құралының типін мақұлдауларды, шасси типін мақұлдауларды ресімдеудің дұрыстығын және негізділігін тексеру жөніндегі қағидаларды бекіту туралы
