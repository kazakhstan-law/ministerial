requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 28 апреля 2015 года № 509. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 июля 2015 года № 11579. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 21 декабря 2018 года № 900 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги "Выдача сертификата органа обслуживания воздушного движения аэронавигационной организации"
  kaz: '"Аэронавигациялық ұйымның әуе қозғалысына қызмет көрсету органының сертификатын беру" мемлекеттік көрсетілетін қызмет стандартын бекіту туралы'
