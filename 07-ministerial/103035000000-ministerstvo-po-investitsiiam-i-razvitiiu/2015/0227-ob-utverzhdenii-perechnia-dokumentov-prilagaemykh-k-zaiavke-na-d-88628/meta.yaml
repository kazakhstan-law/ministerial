requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 27 февраля 2015 года № 221. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 апреля 2015 года № 10675. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 2 июля 2019 года № 471 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня документов, прилагаемых к заявке на допуск в качестве лица, осуществляющего вспомогательный вид деятельности на территории специальной экономической зоны
  kaz: Арнайы экономикалық аймақ аумағында қызметтің қосалқы түрін жүзеге асыратын тұлға ретінде рұқсат алу үшін өтінімге қоса берілетін құжаттар тізбесін бекіту туралы
