  title:
    rus: О внесении изменения в приказ Министра по инвестициям и развитию Республики Казахстан от 27 февраля 2015 года № 221 "Об утверждении перечня документов, прилагаемых к заявке на допуск в качестве лица, осуществляющего вспомогательный вид деятельности на территории специальной экономической зоны"
    kaz: '"Арнайы экономикалық аймақ аумағында қызметтің қосалқы түрін жүзеге асыратын тұлға ретінде рұқсат алу үшін өтінімге қоса берілетін құжаттар тізбесін бекіту туралы" Қазақстан Республикасы Инвестициялар және даму Министрінің 2015 жылғы 27 ақпандағы № 221 бұйрығына өзгеріс енгізу туралы'
