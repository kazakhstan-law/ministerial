act_code: '94840'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 10 сентября 2015 года № 906. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 октября № 12195. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 22 апреля 2020 года № 219 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Выдача документа об условиях переработки товаров на/вне таможенной территории Евразийского экономического союза и переработки товаров для внутреннего потребления в легкой, горно-металлургической, химической, фармацевтической, деревообрабатывающей отраслях промышленности, а также машиностроении и стройиндустрии»
  kaz: «Жеңіл, тау-кен металлургия, химия, фармацевтика, ағаш өңдеу өнеркәсібі салаларында, сондай-ақ машина жасау және құрылыс индустриясында тауарларды Еуразиялық экономикалық одақтың кедендік аумағында/аумағынан тыс қайта өңдеудің және ішкі тұтыну үшін қайта өңдеудің шарттары туралы құжатты беру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
