  requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 24 сентября 2018 года № 671. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 ноября 2018 года № 17759. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 22 апреля 2020 года № 219 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 10 сентября 2015 года № 906 «Об утверждении стандарта государственной услуги «Выдача документа об условиях переработки товаров на/вне таможенной территории и переработки для внутреннего потребления в легкой, горно-металлургической, химической, фармацевтической, деревообрабатывающей отраслях промышленности, а также машиностроении и стройиндустрии»
    kaz: «Жеңіл, тау-кен металлургия, химия, фармацевтика, ағаш өңдеу өнеркәсібі салаларында, сондай-ақ машина жасау және құрылыс индустриясында тауарларды Кеден аумағында/ аумағынан тыс өңдеу және ішкі тұтыну үшін өңдеу шарттары туралы құжат беру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 10 қыркүйектегі № 906 бұйрығына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/126022/rus
