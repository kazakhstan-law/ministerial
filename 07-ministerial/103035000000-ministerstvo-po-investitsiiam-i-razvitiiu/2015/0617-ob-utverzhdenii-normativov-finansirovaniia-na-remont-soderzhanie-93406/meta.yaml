title:
  rus: Об утверждении нормативов финансирования на ремонт, содержание автомобильных дорог общего пользования международного и республиканского значения и управление дорожной деятельностью
  kaz: Халықаралық және республикалық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарын жөндеуді, күтіп-ұстауды және жол қызметін басқаруды қаржыландыру нормативтерін бекіту туралы
