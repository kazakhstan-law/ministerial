  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 17 июня 2015 года № 705 «Об утверждении нормативов финансирования на ремонт и содержание автомобильных дорог общего пользования международного и республиканского значения»
    kaz: «Халықаралық және республикалық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдарын жөндеу мен күтіп-ұстауды қаржыландыру нормативтерін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 17 маусымдағы № 705 бұйрығына өзгерістер енгізу туралы
