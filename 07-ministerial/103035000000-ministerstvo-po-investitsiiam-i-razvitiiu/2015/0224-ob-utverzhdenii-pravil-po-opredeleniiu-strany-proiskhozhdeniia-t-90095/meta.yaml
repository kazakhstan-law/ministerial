requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 24 февраля 2015 года № 155. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 мая 2015 года № 10947. Утратил силу приказом Министра торговли и интеграции Республики Казахстан от 13 июля 2021 года № 454-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил по определению страны происхождения товара, выдаче сертификата о происхождении товара и отмене его действия
  kaz: Тауардың шығарылған елін айқындау, тауардың шығарылуы туралы сертификат беру және оның күшін жою жөніндегі қағидаларды бекіту туралы
