  requisite: Приказ Министра торговли и интеграции Республики Казахстан от 4 ноября 2020 года № 247-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 ноября 2020 года № 21604. Действовал до 10 июля 2021 года в соответствии с пунктом 4 настоящего приказа. Утратил силу приказом Министра торговли и интеграции Республики Казахстан от 13 июля 2021 года № 454-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в приказ Заместителя Премьер-Министра Республики Казахстан – Министра индустрии и новых технологий Республики Казахстан от 8 июля 2014 года № 257 «Об утверждении перечня документов, подтверждающих происхождение товара» и в приказ исполняющего обязанности Министра по инвестициями развитию Республики Казахстан от 24 февраля 2015 года № 155 «Об утверждении Правил по определению страны происхождения товара, выдаче сертификата о происхождении товара и отмене его действия»
    kaz: «Тауардың шығу тегін растайтын құжаттардың тізбесін бекіту туралы» Қазақстан Республикасы Премьер-Министрінің Орынбасары - Қазақстан Республикасының Индустрия және жаңа технологиялар министрінің 2014 жылғы 8 шілдедегі № 257 бұйрығына және «Тауардың шығарылған елін айқындау, тауардың шығарылуы туралы сертификат беру және оның күшін жою жөніндегі қағидаларды бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің м.а. 2015 жылғы 24 ақпандағы № 155 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/148275/rus
