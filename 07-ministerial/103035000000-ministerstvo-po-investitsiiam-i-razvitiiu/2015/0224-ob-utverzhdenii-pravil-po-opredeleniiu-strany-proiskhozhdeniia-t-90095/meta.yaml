  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 24 февраля 2015 года № 155 «Об утверждении Правил по определению страны происхождения товара, выдаче сертификата о происхождении товара и отмене его действия»
    kaz: «Тауардың шығарылған елін айқындау, тауардың шығарылуы туралы сертификат беру және оның күшін жою жөніндегі қағидаларды бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 24 ақпандағы № 155 бұйрығына өзгерістер мен толықтырулар енгізу туралы
