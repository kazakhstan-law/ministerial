    kaz: «Авиациялық қауіпсіздік саласында мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 28 мамырдағы № 621 бұйрығына өзгерістер енгізу туралы
