title:
  rus: Об утверждении Правил передачи сведений об оформленных и (или) забронированных билетах в уполномоченный государственный орган и (или) правоохранительные и специальные государственные органы
  kaz: Уәкілетті мемлекеттік органға және (немесе) құқық қорғау органдары мен арнаулы мемлекеттік органдарға ресімделген және (немесе) броньға қойылған билеттер туралы мәліметтерді беру қағидаларын бекіту туралы
