  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 29 апреля 2015 года № 527 «Об утверждении Правил передачи сведений об оформленных и (или) забронированных билетах в уполномоченный государственный орган и (или) правоохранительные и специальные государственные органы»
    kaz: «Уәкілетті мемлекеттік органға және (немесе) құқық қорғау органдары мен арнаулы мемлекеттік органдарға ресімделген және (немесе) броньға қойылған билеттер туралы мәліметтерді беру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 29 сәуірдегі № 527 бұйрығына өзгеріс енгізу туралы
