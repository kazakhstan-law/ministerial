  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 марта 2015 года № 322 «Об утверждении Перечня должностей руководителей и специалистов служб авиационной безопасности организаций гражданской авиации Республики Казахстан, а также квалификационных требований к таким должностям»
    kaz: «Қазақстан Республикасының азаматтық авиациясы ұйымдарының авиациялық қауіпсіздік қызметтерінің басшылары мен мамандары лауазымдарының тізбесін, сондай-ақ осындай лауазымдарға қойылатын біліктілік талаптарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 26 наурыздағы № 322 бұйрығына өзгерістер мен толықтыру енгізу туралы
