title:
  rus: Об утверждении Перечня должностей руководителей и специалистов служб авиационной безопасности организаций гражданской авиации Республики Казахстан, а также квалификационных требований к таким должностям
  kaz: Қазақстан Республикасының азаматтық авиациясы ұйымдарының авиациялық қауіпсіздік қызметтерінің басшылары мен мамандары лауазымдарының тізбесін, сондай-ақ осындай лауазымдарға қойылатын біліктілік талаптарын бекіту туралы
