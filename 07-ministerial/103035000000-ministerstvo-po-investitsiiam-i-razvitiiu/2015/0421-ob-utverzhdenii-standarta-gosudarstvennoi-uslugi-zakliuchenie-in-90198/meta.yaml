  title:
    rus: О внесении изменения в приказ Министра по инвестициям и развитию Республики Казахстан от 21 апреля 2015 года № 478 «Об утверждении стандарта государственной услуги «Заключение инвестиционного контракта на реализацию инвестиционного проекта, предусматривающего осуществление инвестиций и предоставление инвестиционных преференций»
    kaz: «Инвестицияларды жүзеге асыруды және инвестициялық преференциялар беруді көздейтін инвестициялық жобаны іске асыруға инвестициялық келісімшарт жасасу» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 21 сәуірдегі № 478 бұйрығына өзгеріс енгізу туралы»
