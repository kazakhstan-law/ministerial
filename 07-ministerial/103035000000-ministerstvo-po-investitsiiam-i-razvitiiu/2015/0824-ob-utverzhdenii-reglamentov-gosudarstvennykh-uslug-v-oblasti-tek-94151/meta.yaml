  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра по инвестициям и разитию Республики Казахстан от 24 августа 2015 года № 880 "Об утверждении регламентов государственных услуг в области технического регулирования и метрологии"
    kaz: '"Техникалық реттеу және метрология саласындағы мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы" Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 24 тамыздағы № 880 бұйрығына өзгерістер мен толықтыру енгізу туралы'
