  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 24 августа 2015 года № 880 «Об утверждении регламентов государственных услуг в области технического регулирования и метрологии»
    kaz: «Техникалық реттеу және метрология саласындағы мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 24 тамыздағы № 880 бұйрығына өзгерістер мен толықтырулар енгізу туралы
