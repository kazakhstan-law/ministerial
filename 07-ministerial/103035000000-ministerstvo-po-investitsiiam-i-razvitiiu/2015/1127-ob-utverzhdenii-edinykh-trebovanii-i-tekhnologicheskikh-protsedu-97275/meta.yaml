  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 27 ноября 2015 года № 1117 «Об утверждении единых требований и технологических процедур в международных аэропортах Республики Казахстан по перевозке и обработке багажа, почты и грузов воздушным транспортом»
    kaz: «Қазақстан Республикасының халықаралық әуежайларында әуе көлігімен багажды, поштаны және жүктерді тасымалдау мен өңдеу жөніндегі бірыңғай талаптар мен технологиялық рәсімдерді бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 27 қарашадағы № 1117 бұйрығына өзгерістер енгізу туралы
