title:
  rus: Об утверждении единых требований и технологических процедур в международных аэропортах Республики Казахстан по перевозке и обработке багажа, почтовых отправлений и грузов воздушным транспортом
  kaz: Қазақстан Республикасының халықаралық әуежайларында багажды, пошта жөнелтілімдерін және жүктерді әуе көлігімен тасымалдау және өңдеу жөніндегі бірыңғай талаптар мен технологиялық рәсімдерді бекіту туралы
