act_code: '88038'
requisite: Приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 18 февраля 2015 года № 130. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 марта 2015 года № 10504. Утратил силу приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 26 января 2016 года № 81
title:
  rus: Приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан "Об утверждении Правил взаимодействия Единого контакт-центра по вопросам оказания государственных услуг с центральными государственными органами, местными исполнительными органами областей, городов республиканского значения, столицы, районов, городов областного значения, акимами районов в городе, городов районного значения, поселков, сел, сельских округов, а также услугодателями"
  kaz: '"Мемлекеттік қызметтер көрсету мәселелері жөніндегі бірыңғай байланыс орталығының орталық мемлекеттік органдармен, облыстардың, республикалық маңызы бар қалалардың, астананың, аудандардың, облыстық маңызы бар қалалардың жергілікті атқарушы органдарымен, қаладағы аудандардың, аудандық маңызы бар қалалардың, кенттердің, ауылдардың, ауылдық округтердің әкімдерімен, сондай-ақ көрсетілетін қызметті берушілермен өзара іс-қимыл қағидаларын бекіту туралы" Қазақстан Республикасы Инвестициялар және даму министрінің м.а. бұйрығы'
