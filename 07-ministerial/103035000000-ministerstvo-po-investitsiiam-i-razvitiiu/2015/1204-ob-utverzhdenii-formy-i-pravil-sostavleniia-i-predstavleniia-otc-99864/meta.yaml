act_code: '99864'
requisite: Совместный приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 4 декабря 2015 года № 1154 и Министра энергетики Республики Казахстан от 14 декабря 2015 года № 714. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 февраля 2016 года № 13242. Утратил силу совместным приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 12 апреля 2019 года № 214 и Министра энергетики Республики Казахстан от 16 апреля 2019 года № 119 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении формы и Правил составления и представления отчетов недропользователей по исполнению обязательств по размеру расходов, направляемых на обучение, повышение квалификации и переподготовку работников, являющихся гражданами Республики Казахстан, задействованных при исполнении контракта, и (или) обучение граждан Республики Казахстан по перечню специальностей, согласованному с компетентным органом
  kaz: Қазақстан Республикасының азаматтары болып табылатын, келісімшартты орындау кезінде тартылған қызметкерлерді оқытуға, олардың біліктілігін арттыруға және оларды қайта даярлауға және (немесе) құзыретті органмен келісілген мамандықтар тізбесі бойынша Қазақстан Республикасының азаматтарын оқытуға бағытталатын шығыстар мөлшері жөніндегі міндеттемелерді орындау бойынша жер қойнауын пайдаланушылардың есебін жасаудың және ұсынудың нысаны мен қағидаларын бекіту туралы
