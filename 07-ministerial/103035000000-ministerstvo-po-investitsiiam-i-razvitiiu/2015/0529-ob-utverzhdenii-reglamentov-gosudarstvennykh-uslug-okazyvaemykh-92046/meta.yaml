    kaz: '"Қазақстан Республикасы Инвестициялар және даму министрлігінің Аэроғарыш комитеті көрсететін мемлекеттік көрсетілетін қызмет регламенттерін бекіту туралы" Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 29 мамырдағы № 668 бұйрығына өзгерістер енгізу туралы'
