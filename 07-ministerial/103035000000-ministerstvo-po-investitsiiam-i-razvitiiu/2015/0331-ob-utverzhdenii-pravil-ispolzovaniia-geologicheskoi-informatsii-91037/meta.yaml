  title:
    rus: О внесении изменения в приказ Министра по инвестициям и развитию Республики Казахстан от 31 марта 2015 года № 385 «Об утверждении Правил использования геологической информации, находящейся в государственной собственности, в учебных, научных, коммерческих целях и вывоза геологической информации за пределы территории Республики Казахстан»
    kaz: «Мемлекет меншігіндегі геологиялық ақпаратты оқу, ғылыми, коммерциялық мақсаттарда пайдалану және Қазақстан Республикасы аумағының шегінен тыс жерге геологиялық ақпаратты әкету қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 31 наурыздағы № 385 бұйрығына өзгеріс енгізу туралы
