requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 29 сентября 2015 года № 949. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 марта 2016 года № 13512. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 9 июня 2023 года № 425 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Квалификационных требований, предъявляемых к деятельности по лицензированию экспорта и импорта продукции и перечень документов, подтверждающих соответствие им
