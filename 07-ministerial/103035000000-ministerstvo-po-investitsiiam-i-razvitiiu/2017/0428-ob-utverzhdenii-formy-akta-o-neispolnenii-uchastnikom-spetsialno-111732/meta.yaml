requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 28 апреля 2017 года № 248. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 июня 2017 года № 15188. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 19 июля 2019 года № 522 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
