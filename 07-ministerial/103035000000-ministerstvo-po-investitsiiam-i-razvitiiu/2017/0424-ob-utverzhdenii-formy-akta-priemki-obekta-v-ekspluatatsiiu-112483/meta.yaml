  title:
    rus: О внесении изменений в приказы Министра по инвестициям и развитию Республики Казахстан от 24 апреля 2017 года № 234 «Об утверждении формы акта приемки объекта в эксплуатацию» и от 24 апреля 2017 года № 235 «Об утверждении форм заключений о качестве строительно-монтажных работ и соответствии выполненных работ проекту, декларации о соответствии»
    kaz: «Объектіні пайдалануға қабылдау актісінің нысанын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 24 сәуірдегі № 234 және «Құрылыс-монтаждау жұмыстарының сапасы және орындалған жұмыстардың жобаға сәйкестігі туралы қорытындылардың, сәйкестік туралы декларацияның нысандарын бекіту туралы» 2017 жылғы 24 сәуірдегі № 235 бұйрықтарына өзгерiстер енгізу туралы
