act_code: '114061'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 26 июня 2017 года № 394. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 августа 2017 года № 15449. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 8 сентября 2020 года № 457 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Проверка знаний руководителей юридических лиц, декларирующих промышленную безопасность, а также членов постоянно  действующих экзаменационных комиссий указанных юридических лиц»
  kaz: «Өнеркәсіптік қауіпсіздікті декларациялайтын заңды тұлғалардың басшылары, сондай-ақ аталған заңды тұлғалардың тұрақты жұмыс істейтін емтихан комиссиялары мүшелерінің білімін тексеру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
