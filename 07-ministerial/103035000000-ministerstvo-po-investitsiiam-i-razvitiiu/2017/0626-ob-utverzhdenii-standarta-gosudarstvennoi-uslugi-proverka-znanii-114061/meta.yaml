  requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 31 июля 2019 года № 588. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 июля 2019 года № 19145. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 8 сентября 2020 года № 457 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 26 июня 2017 года № 394 «Об утверждении стандарта государственной услуги «Проверка знаний руководителей юридических лиц, декларирующих промышленную безопасность, а также членов постоянно действующих экзаменационных комиссий указанных юридических лиц»
    kaz: «Өнеркәсіптік қауіпсіздікті декларациялайтын заңды тұлғалардың басшылары, сондай-ақ аталған заңды тұлғалардың тұрақты жұмыс істейтін емтихан комиссиялары мүшелерінің білімін тексеру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 26 маусымдағы № 394 бұйрығына өзгерістер енгізу туралы
