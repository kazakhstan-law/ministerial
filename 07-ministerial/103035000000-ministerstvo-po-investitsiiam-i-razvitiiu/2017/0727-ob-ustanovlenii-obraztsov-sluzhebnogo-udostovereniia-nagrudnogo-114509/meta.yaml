  title:
    rus: О внесении изменения в приказ Министра по инвестициям и развитию Республики Казахстан от 27 июля 2017 года № 506 «Об установлении образцов служебного удостоверения, нагрудного знака, номерного штампа и пломбира государственного инспектора по государственному надзору в области промышленной безопасности»
    kaz: «Өнеркәсіптік қауіпсіздік саласындағы мемлекеттік қадағалау жөніндегі мемлекеттік инспектордың қызметтік куәлігінің, омырауға тағатын белгісінің, нөмірлік мөртабаны мен пломбирінің үлгілерін белгілеу туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 27 шілдедегі № 506 бұйрығына өзгеріс енгізу туралы
