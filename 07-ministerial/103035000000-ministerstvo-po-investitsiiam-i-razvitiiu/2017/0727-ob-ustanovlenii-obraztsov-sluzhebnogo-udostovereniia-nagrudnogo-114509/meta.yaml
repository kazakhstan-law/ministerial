act_code: '114509'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 27 июля 2017 года № 506. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 августа 2017 года № 15596
title:
  rus: Об установлении образцов служебного удостоверения, нагрудного знака, номерного штампа и пломбира государственного инспектора по государственному контролю и надзору в области промышленной безопасности
  kaz: Өнеркәсіптік қауіпсіздік саласындағы мемлекеттік бақылау және қадағалау жөніндегі мемлекеттік инспектордың қызметтік куәлігінің, омырауға тағатын белгісінің, нөмірлік мөртабаны мен пломбирінің үлгілерін белгілеу туралы
