  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 27 июля 2017 года № 506 «Об установлении образцов служебного удостоверения, нагрудного знака, номерного штампа и пломбира государственного инспектора по государственному надзору в области промышленной безопасности»
    kaz: Қазақстан Республикасы Инвестициялар және даму министрінің «Өнеркәсіптік қауіпсіздік саласындағы мемлекеттік қадағалау жөніндегі мемлекеттік инспектордың қызметтік куәлігінің, омырауға тағатын белгісінің, нөмірлік мөртабаны мен пломбирінің үлгілерін белгілеу туралы» 2017 жылғы 27 шілдедегі № 506 бұйрығына өзгерістер енгізу туралы
