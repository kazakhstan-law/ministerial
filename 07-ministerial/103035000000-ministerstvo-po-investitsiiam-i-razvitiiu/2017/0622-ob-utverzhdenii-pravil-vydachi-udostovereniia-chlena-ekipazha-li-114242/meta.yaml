title:
  rus: Об утверждении Правил выдачи удостоверения члена экипажа лицам летного состава, кабинного экипажа, инженерно-техническому составу, обеспечивающему техническое сопровождение полетов, и персоналу, обеспечивающему безопасность воздушного судна в полете
  kaz: Ұшу құрамының, кабина экипажының адамдарына, ұшуға техникалық қолдау көрсетуді қамтамасыз ететін инженерлік-техникалық құрамға және ұшу кезінде әуе кемесінің қауіпсіздігін қамтамасыз ететін персоналға экипаж мүшесінің куәлігін беру қағидаларын бекіту туралы
