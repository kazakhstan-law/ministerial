  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 22 июня 2017 года № 378 «Об утверждении Правил выдачи удостоверения члена экипажа лицам летного состава, кабинного экипажа, инженерно-техническому составу, обеспечивающему техническое сопровождение полетов, и персоналу, обеспечивающему безопасность воздушного судна в полете»
    kaz: «Ұшу құрамының, кабина экипажының адамдарына, ұшуға техникалық қолдау көрсетуді қамтамасыз ететін инженерлік-техникалық құрамға және ұшу кезінде әуе кемесінің қауіпсіздігін қамтамасыз ететін персоналға экипаж мүшесінің куәлігін беру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 22 маусымдағы № 378 бұйрығына өзгерістер енгізу туралы
