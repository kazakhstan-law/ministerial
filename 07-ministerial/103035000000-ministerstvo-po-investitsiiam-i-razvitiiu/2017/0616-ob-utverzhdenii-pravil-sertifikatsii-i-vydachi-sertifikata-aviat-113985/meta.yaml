  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 13 июня 2017 года № 344 «Об утверждении Правил назначения авиационных медицинских экспертов» и в приказ Министра по инвестициям и развитию Республики Казахстан от 16 июня 2017 года № 358 «Об утверждении Правил сертификации и выдачи сертификата авиационного медицинского центра, а также сертификационных требований, предъявляемых к авиационным медицинским центрам»
    kaz: «Авиациялық медициналық сарапшыларды тағайындау қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 13 маусымдағы № 344 бұйрығына және «Авиациялық медициналық орталықты сертификаттау және оған сертификат беру қағидаларын, сондай-ақ авиациялық медициналық орталықтарға қойылатын сертификаттау талаптарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 16 маусымдағы № 358 бұйрығына өзгерістер енгізу туралы
