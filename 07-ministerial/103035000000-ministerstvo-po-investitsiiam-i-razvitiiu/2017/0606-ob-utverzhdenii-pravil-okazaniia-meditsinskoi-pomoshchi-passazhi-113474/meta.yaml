  title:
    rus: О внесении изменений и дополнений в приказ Министра по инвестициям и развитию Республики Казахстан от 5 июня 2017 года № 324 «Об утверждении Правил медицинского освидетельствования и осмотра в гражданской авиации Республики Казахстан» и приказ Министра по инвестициям и развитию Республики Казахстан от 6 июня 2017 года № 329 «Об утверждении Правил оказания медицинской помощи пассажирам в гражданской авиации»
    kaz: «Қазақстан Республикасының азаматтық авиациясында медициналық куәландыру және қарап-тексеру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 5 маусымдағы № 324 бұйрығына және «Азаматтық авиацияда жолаушыларға медициналық көмек көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 6 маусымдағы № 329 бұйрығына өзгерістер мен толықтырулар енгізу туралы
