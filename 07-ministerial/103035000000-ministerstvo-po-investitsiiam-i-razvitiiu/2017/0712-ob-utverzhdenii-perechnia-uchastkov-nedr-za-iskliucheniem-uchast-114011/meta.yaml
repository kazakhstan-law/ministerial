requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 12 июля 2017 года № 456. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 августа 2017 года № 15475. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 2 марта 2018 года № 160 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
