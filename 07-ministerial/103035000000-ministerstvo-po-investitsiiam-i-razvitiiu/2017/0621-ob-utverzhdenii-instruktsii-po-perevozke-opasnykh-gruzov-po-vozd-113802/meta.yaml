  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 21 июня 2017 года № 371 «Об утверждении Правил перевозки опасных грузов по воздуху на гражданских воздушных судах» и признании утратившим силу приказа Министра транспорта и коммуникаций Республики Казахстан от 18 февраля 2011 года № 79 «Об утверждении Перечня опасных грузов, предназначенных для перевозки гражданскими воздушными судами»
    kaz: «Азаматтық әуе кемелерінде қауіпті жүктерді әуеде тасымалдау қағидаларын бекіту туралы» Қазақстан Республикасы Ивестициялар және даму министрінің 2017 жылғы 21 маусымдағы № 371 бұйрығына өзгерістер енгізу және «Азаматтық әуе кемелерімен тасымалдауға арналған қауіпті жүктердің тізбесін бекіту туралы» Қазақстан Республикасы Көлік және коммуникация министрінің 2011 жылғы 18 ақпандағы № 79 бұйрығының күші жойылды деп тану туралы
