  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра транспорта и коммуникаций Республики Казахстан от 16 мая 2011 года № 279 «Об утверждении Инструкции по организации и обслуживанию воздушного движения» и в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 28 июля 2017 года № 509 «Об утверждении Правил производства полетов в гражданской авиации Республики Казахстан»
    kaz: «Әуе қозғалысын ұйымдастыру және қызмет көрсету жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Көлік және коммуникация министрінің міндетін атқарушының 2011 жылғы 16 мамырдағы № 279 бұйрығына және «Қазақстан Республикасының азаматтық авиациясында ұшуды жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2017 жылғы 28 шілдедегі № 509 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/152648/rus
