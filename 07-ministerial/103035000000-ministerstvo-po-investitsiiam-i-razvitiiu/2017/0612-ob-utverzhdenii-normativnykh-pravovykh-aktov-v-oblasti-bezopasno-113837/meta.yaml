  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 12 июня 2017 года № 339 «Об утверждении нормативных правовых актов в области безопасности и охраны труда в гражданской авиации» и в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 22 июля 2019 года № 525 «Об утверждении Правил профессиональной подготовки и поддержания квалификации авиационных инспекторов»
    kaz: «Азаматтық авиациядағы еңбек қауіпсіздігі және еңбекті қорғау саласындағы нормативтік құқықтық актілерді бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 12 маусымдағы № 339 бұйрығына және «Авиация инспекторларын кәсіптік даярлау және олардың біліктілігін ұстап тұру қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 22 шілдедегі № 525 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/178886/rus
