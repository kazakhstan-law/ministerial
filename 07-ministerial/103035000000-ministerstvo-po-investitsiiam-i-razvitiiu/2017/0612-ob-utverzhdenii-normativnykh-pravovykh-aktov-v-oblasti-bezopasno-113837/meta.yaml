requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 12 июня 2017 года № 339. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 июля 2017 года № 15363. Утратил силу приказом и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 26 июля 2023 года № 545 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении нормативных правовых актов в области безопасности и охраны труда в гражданской авиации
  kaz: Азаматтық авиациядағы еңбек қауіпсіздігі және еңбекті қорғау саласындағы нормативтік құқықтық актілерді бекіту туралы
