title:
  rus: Об утверждении Правил применения поощрения государственных служащих Министерства индустрии и инфраструктурного развития Республики Казахстан
  kaz: Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің мемлекеттік қызметшілерін көтермелеуді қолдану қағидаларын бекіту туралы
