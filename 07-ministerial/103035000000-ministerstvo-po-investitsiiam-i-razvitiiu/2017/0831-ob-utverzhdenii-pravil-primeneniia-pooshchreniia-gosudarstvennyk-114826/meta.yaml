  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 31 августа 2017 года № 597 «Об утверждении Правил применения поощрения государственных служащих Министерства по инвестициям и развитию Республики Казахстан»
    kaz: «Қазақстан Республикасы Инвестициялар және даму министрлігінің мемлекеттік қызметшілерін көтермелеуді қолдану қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 31 тамыздағы № 597 бұйрығына өзгерістер енгізу туралы
