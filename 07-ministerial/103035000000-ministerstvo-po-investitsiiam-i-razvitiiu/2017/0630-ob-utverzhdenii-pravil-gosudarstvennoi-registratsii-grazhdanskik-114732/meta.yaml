  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 30 июня 2017 года № 409 «Об утверждении Правил государственной регистрации гражданских воздушных судов Республики Казахстан, прав на них, а также форм документов, удостоверяющих права на них»
    kaz: «Қазақстан Республикасының азаматтық әуе кемелерін, оларға құқықтарды, сондай-ақ оларға құқықтарды куәландыратын құжаттардың нысандарын мемлекеттік тіркеу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 30 маусымдағы № 409 бұйрығына өзгерістер енгізу туралы
