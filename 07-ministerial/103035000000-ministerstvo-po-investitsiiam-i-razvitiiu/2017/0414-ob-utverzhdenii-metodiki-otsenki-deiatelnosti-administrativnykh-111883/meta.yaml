act_code: '111883'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 14 апреля 2017 года № 199. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 апреля 2017 года № 15072. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 18 мая 2018 года № 343 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства по инвестициям и развитию Республики Казахстан, его ведомств и их территориальных подразделений
  kaz: Қазақстан Республикасы Инвестициялар және даму министрлігінің, оның ведомстволары мен олардың аумақтық бөлімшелерінің «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы
