title:
  rus: Об утверждении положений Республиканского государственного учреждения «Комитет технического регулирования и метрологии Министерства по инвестициям и развитию Республики Казахстан» и его территориальных подразделений
  kaz: «Қазақстан Республикасы Инвестициялар және даму министрлігі Техникалық peттеу және метрология комитеті» республикалық мемлекеттік мекемесінің және оның aумақтық бөлімшелерінің ережелерін бекіту туралы
