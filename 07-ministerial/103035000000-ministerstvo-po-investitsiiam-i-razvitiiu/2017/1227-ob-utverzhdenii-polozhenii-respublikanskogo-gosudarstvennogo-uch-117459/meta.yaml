  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 27 декабря 2017 года № 900 «Об утверждении положений Республиканского государственного учреждения «Комитет технического регулирования и метрологии Министерства по инвестициям и развитию Республики Казахстан» и его территориальных подразделениях»
    kaz: «Қазақстан Республикасы Инвестициялар және даму министрлігінің Техникалық peттеу және метрология комитеті» республикалық мемлекеттік мекемесінің және оның aумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2017 жылғы 27 желтоқсандағы № 900 бұйрығына өзгерістер мен толықтырулар енгізу туралы
