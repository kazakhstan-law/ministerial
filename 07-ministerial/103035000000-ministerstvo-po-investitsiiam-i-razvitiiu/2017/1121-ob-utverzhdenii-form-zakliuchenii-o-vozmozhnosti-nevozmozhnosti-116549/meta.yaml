act_code: '116549'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 21 ноября 2017 года № 797. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 декабря 2017 года № 16063. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 25 декабря 2024 года № 437 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении форм заключений о возможности (невозможности) и экономической целесообразности (нецелесообразности) промышленного извлечения драгоценных металлов из сырьевых товаров в Республике Казахстан и об экономической нецелесообразности или невозможности переработки сырьевых товаров, содержащих драгоценные металлы, на территории Республики Казахстан
  kaz: Қазақстан Республикасында шикізат тауарларынан бағалы металдарды өнеркәсіптік алудың мүмкіндігі (мүмкін еместігі) және экономикалық тұрғыдан орындылығы (орынсыздығы) туралы және Қазақстан Республикасының аумағында құрамында бағалы металдар бар шикізат тауарларын қайта өңдеудің экономикалық тұрғыдан орынсыздығы немесе мүмкін еместігі туралы қорытындылардың нысандарын бекіту туралы
