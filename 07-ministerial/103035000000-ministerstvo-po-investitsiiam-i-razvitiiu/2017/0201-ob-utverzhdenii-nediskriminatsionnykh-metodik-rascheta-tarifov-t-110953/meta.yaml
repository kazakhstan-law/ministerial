act_code: '110953'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 1 февраля 2017 года № 62. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 марта 2017 года № 14932. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 13 февраля 2020 года № 65 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении недискриминационных методик расчета тарифов (цен, ставок сборов) на услуги аэронавигации и аэропортов, отнесенные к сфере естественных монополий
  kaz: Табиғи монополиялар саласына жатқызылған аэронавигация мен әуежайлардың көрсететін қызметтеріне тарифтерді (бағалар, алымдар мөршерлемелерін) есептеудің кемсітпейтін әдістемелерін бекіту туралы
