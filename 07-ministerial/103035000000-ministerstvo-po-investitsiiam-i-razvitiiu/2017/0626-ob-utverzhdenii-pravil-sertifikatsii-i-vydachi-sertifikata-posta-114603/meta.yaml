  code: '127631'
  requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 21 декабря 2018 года № 900. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 декабря 2018 года № 18019
  title:
    rus: Об утверждении стандарта государственной услуги «Выдача сертификата поставщика аэронавигационного обслуживания» и о внесении изменений и дополнения в приказ Министра по инвестициям и развитию Республики Казахстан от 26 июня 2017 года № 384 «Об утверждении Правил сертификации и выдачи сертификата поставщика аэронавигационного обслуживания, а также сертификационных требований, предъявляемых к поставщикам аэронавигационного обслуживания» и о признании утратившими силу некоторых приказов Министра по инвестициям и развитию Республики Казахстан
    kaz: «Аэронавигациялық қызмет көрсетуді берушінің сертификатын беру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы және «Аэронавигациялық қызмет көрсетуді берушіні сертификаттау және оған сертификат беру қағидаларын, сондай-ақ аэронавигациялық қызмет көрсетуді берушілерге қойылатын сертификаттау талаптарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 26 маусымдағы № 384 бұйрығына өзгерістер мен толықтыру енгізу туралы және Қазақстан Республикасы Инвестициялар және даму министрінің кейбір бұйрықтарының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/127631/rus
