title:
  rus: Об утверждении Правил сертификации и выдачи сертификата поставщика аэронавигационного обслуживания, а также сертификационных требований, предъявляемых к поставщикам аэронавигационного обслуживания
  kaz: Аэронавигациялық қызмет көрсетуді берушіні сертификаттау және оған сертификат беру қағидаларын, сондай-ақ аэронавигациялық қызмет көрсетуді берушілерге қойылатын сертификаттау талаптарын бекіту туралы
