  title:
    rus: О внесении изменений и дополнений в приказ Министра по инвестициям и развитию Республики Казахстан от 26 июня 2017 года № 384 «Об утверждении Правил сертификации и выдачи сертификата поставщика аэронавигационного обслуживания, а также сертификационных требований, предъявляемых к поставщикам аэронавигационного обслуживания»
    kaz: «Аэронавигациялық қызмет көрсетуді берушіні сертификаттау және оған сертификат беру қағидаларын, сондай-ақ аэронавигациялық қызмет көрсетуді берушілерге қойылатын сертификаттау талаптарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 26 маусымдағы № 384 бұйрығына өзгерістер мен толықтырулар енгізу туралы
