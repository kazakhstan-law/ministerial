  title:
    rus: О внесении изменения в приказ Министра по инвестициям и развитию Республики Казахстан от 12 декабря 2017 года № 859 «Об утверждении стандарта государственной услуги «Субсидирование ставок вознаграждения по выдаваемым кредитам банками второго уровня субъектам частного предпринимательства для целей жилищного строительства»
    kaz: «Тұрғын үй құрылысы мақсаттары үшін жеке кәсіпкерлік субъектілеріне екінші деңгейдегі банктер беретін кредиттер бойынша сыйақы мөлшерлемелерін субсидиялау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 12 желтоқсандағы № 859 бұйрығына өзгеріс енгізу туралы
