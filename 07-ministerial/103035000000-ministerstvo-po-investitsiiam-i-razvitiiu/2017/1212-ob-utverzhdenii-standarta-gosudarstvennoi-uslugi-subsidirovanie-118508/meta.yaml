act_code: '118508'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 12 декабря 2017 года № 859. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 января 2018 года № 16265. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 29 апреля 2020 года № 244 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Субсидирование ставок вознаграждения по выдаваемым кредитам банками второго уровня субъектам частного предпринимательства для целей жилищного строительства»
  kaz: «Тұрғын үй құрылысы мақсаттары үшін жеке кәсіпкерлік субъектілеріне екінші деңгейдегі банктер беретін кредиттер бойынша сыйақы мөлшерлемелерін субсидиялау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
