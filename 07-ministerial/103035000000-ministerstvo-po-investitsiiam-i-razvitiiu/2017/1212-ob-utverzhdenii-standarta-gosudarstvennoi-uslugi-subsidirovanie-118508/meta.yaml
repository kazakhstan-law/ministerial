  title:
    rus: О внесении изменений и дополнений в приказ Министра национальной экономики Республики Казахстан от 31 января 2017 года № 35 «Об утверждении Правил субсидирования ставки вознаграждения по выдаваемым кредитам банками второго уровня субъектам частного предпринимательства для целей жилищного строительства» и признании утратившими силу некоторых приказов
    kaz: «Тұрғын үй құрылысы мақсаттары үшін жеке кәсіпкерлік субъектілеріне екінші деңгейдегі банктер беретін кредиттер бойынша сыйақы мөлшерлемерін субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2017 жылғы 31 қаңтардағы № 35 бұйрығына өзгерістер мен толықтырулар енгізу және кейбір бұйрықтардың күші жойылды деп тану туралы
