title:
  rus: Об утверждении Правил аккредитации иностранных воздушных перевозчиков в Республике Казахстан
  kaz: Қазақстан Республикасында шетелдік әуемен тасымалдаушыларды аккредиттеу қағидаларын бекіту туралы
