  title:
    rus: О внесении изменений в приказы Министра по инвестициям и развитию Республики Казахстан от 6 февраля 2017 года № 74 «Об утверждении формы заявки на предоставление инвестиционных преференций в рамках реализации специального инвестиционного проекта и правил ее приема и регистрации» и от 7 февраля 2017 года № 75 «Об утверждении типового специального инвестиционного контракта»
    kaz: «Арнайы инвестициялық жобаны іске асыру шеңберінде инвестициялық преференциялар беруге арналған өтінім нысанын және оны қабылдау мен тіркеу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 6 ақпандағы № 74 және «Үлгілік арнайы инвестициялық келісімшартты бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 7 ақпандағы № 75 бұйрықтарына өзгерістер енгізу туралы
