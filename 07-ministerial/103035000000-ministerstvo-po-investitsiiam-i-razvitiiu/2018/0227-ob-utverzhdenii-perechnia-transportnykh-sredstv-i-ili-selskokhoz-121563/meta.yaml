  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 27 февраля 2018 года № 138 «Об утверждении перечня транспортных средств и сельскохозяйственной техники, реализация которых освобождается от налога на добавленную стоимость»
    kaz: «Өткізілуі қосылған құн салығынан босатылатын көлік құралдары мен ауыл шаруашылығы техникасының тізбесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 27 ақпандағы № 138 бұйрығына өзгерістер енгізу туралы
