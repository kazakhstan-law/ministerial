  title:
    rus: О внесении изменений и дополнений в приказ Министра по инвестициям и развитию Республики Казахстан от 11 мая 2018 года № 315 «Об утверждении Правил проведения аукциона по участкам недр для проведения операций по разведке или добыче твердых полезных ископаемых»
    kaz: «Пайдалы қатты қазбаларды барлау немесе өндіру жөніндегі операциялар жүргізу үшін жер қойнауы учаскелері бойынша аукцион жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 11 мамырдағы № 315 бұйрығына өзгерістер мен толықтырулар енгізу туралы
