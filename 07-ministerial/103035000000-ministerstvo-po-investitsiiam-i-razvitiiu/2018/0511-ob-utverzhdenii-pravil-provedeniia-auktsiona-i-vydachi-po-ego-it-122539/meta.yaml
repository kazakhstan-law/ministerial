title:
  rus: Об утверждении Правил проведения аукциона и выдачи по его итогам лицензии на разведку или добычу твердых полезных ископаемых
  kaz: Пайдалы қатты қазбаларды барлауға немесе өндіруге аукцион өткізу және оның қорытындылары бойынша лицензия беру қағидаларын бекіту туралы
