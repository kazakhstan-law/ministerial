act_code: '124018'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 3 июля 2018 года № 493. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 июля 2018 года № 17256. Утратил силу приказом Министра национальной экономики Республики Казахстан от 22 мая 2020 года № 42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики расчета уровня временного понижающего коэффициента к тарифам (ценам, ставкам сборов) на регулируемые услуги (товары, работы) субъектов естественных монополий в области услуг аэропортов и аэронавигации
  kaz: Әуежайлар мен аэронавигация көрсететін қызметтер саласындағы табиғи монополия субъектісінің реттеліп көрсетілетін қызметтеріне арналған (тауарларына, жұмыстарына) тарифтерге (бағаларға, алымдар мөлшерлемелеріне) уақытша төмендету коэффициентінің деңгейін есептеу әдістемесін бекіту туралы
