  title:
    rus: О внесении изменений и дополнений в приказ Министра по инвестициям и развитию Республики Казахстан от 22 мая 2018 года № 359 «Об утверждении Правил синхронизации работы систем электронного закупа в отношении твердых полезных ископаемых с работой реестра товаров, работ и услуг, используемых при проведении операций по недропользованию, и их производителей»
    kaz: «Пайдалы қатты қазбаларға қатысты электрондық сатып алу жүйесінің жұмысын жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде пайдаланылатын тауарлар, жұмыстар мен көрсетілетін қызметтер және оларды өндірушілер тізілімінің жұмысымен үйлестіру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 22 мамырдағы № 359 бұйрығына өзгерістер мен толықтырулар енгізу туралы
