title:
  rus: Об утверждении Правил синхронизации работы систем электронного закупа в отношении твердых полезных ископаемых с работой реестра товаров, работ и услуг, используемых при проведении операций по недропользованию, и их производителей
  kaz: Пайдалы қатты қазбаларға қатысты электрондық сатып алу жүйесінің жұмысын жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде пайдаланылатын тауарлар, жұмыстар мен көрсетілетін қызметтер және оларды өндірушілер тізілімінің жұмысымен үйлестіру қағидаларын бекіту туралы
