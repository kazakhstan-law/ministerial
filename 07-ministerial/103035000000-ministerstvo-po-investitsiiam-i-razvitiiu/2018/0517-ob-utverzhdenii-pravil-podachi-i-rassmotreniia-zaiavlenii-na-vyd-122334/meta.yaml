  title:
    rus: Об утверждении Правил оказания государственных услуг в сфере недропользования, за исключением углеводородного сырья и урана и о внесении изменений и дополнения в приказ Министра по инвестициям и развитию Республики Казахстан от 17 мая 2018 года № 339 «Об утверждении Правил подачи и рассмотрения заявлений на выдачу лицензий на старательство»
    kaz: Көмірсутек шикізаты мен уранды қоспағанда, жер қойнауын пайдалану саласындағы мемлекеттік қызметтер көрсету қағидаларын бекіту туралы және «Кен іздеушілікке арналған лицензияларды беруге өтініштерді беру және қарау қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 17 мамырдағы № 339 бұйрығына өзгерістер мен толықтыру енгізу туралы
