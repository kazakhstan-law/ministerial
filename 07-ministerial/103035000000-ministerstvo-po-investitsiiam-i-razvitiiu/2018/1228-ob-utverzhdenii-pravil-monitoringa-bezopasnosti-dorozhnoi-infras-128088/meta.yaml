  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 28 декабря 2018 года № 947 «Об утверждении Правил мониторинга безопасности дорожной инфраструктуры автомобильных дорог общего пользования международного и республиканского значения»
    kaz: «Халықаралық және республикалық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолдары жол инфрақұрылымы қауіпсіздігінің мониторингі қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 28 желтоқсандағы № 947 бұйрығына өзгерістер енгізу туралы
