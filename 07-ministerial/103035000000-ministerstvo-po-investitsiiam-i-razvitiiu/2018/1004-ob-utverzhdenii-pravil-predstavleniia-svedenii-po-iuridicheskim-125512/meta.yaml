act_code: '125512'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 4 октября 2018 года № 691. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 октября 2018 года № 17605. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 20 февраля 2026 года № 66 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования.)
title:
  rus: Об утверждении Правил представления сведений по юридическим лицам, осуществляющим сбор лома и отходов цветных и черных металлов, и физическим лицам, осуществляющим реализацию такого лома и отходов и их формы
  kaz: Түсті және қара металдардың сынықтары мен қалдықтарын жинауды жүзеге асыратын заңды тұлғалар және осындай сынықтар мен қалдықтарды өткізуді жүзеге асыратын жеке тұлғалар бойынша мәліметтерді ұсыну қағидаларын және оның нысанын бекіту туралы
