title:
  rus: Об утверждении Правил ведения портала и информационных систем для организации проведения комплексной вневедомственной экспертизы проектов строительства и комплексной градостроительной экспертизы градостроительных проектов по принципу «одного окна»
  kaz: «Бір терезе» қағидаты бойынша құрылыс жобаларына ведомстводан тыс кешенді сараптама және қала құрылысы жобаларына кешенді қала құрылысы сараптамасын жүргізуді ұйымдастыру үшін портал мен ақпараттық жүйелерді жүргізу қағидаларын бекіту туралы
