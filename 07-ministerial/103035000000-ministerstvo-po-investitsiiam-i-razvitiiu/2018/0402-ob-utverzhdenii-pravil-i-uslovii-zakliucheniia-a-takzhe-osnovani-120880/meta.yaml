title:
  rus: Об утверждении Правил и условий заключения, а также оснований для изменения и расторжения соглашения о промышленной сборке сельскохозяйственной техники с юридическими лицами Республики Казахстан
  kaz: Қазақстан Республикасының заңды тұлғаларымен ауыл шаруашылығы техникасын өнеркәсіптік құрастыру туралы келісім жасасу қағидалары мен шарттарын, сондай-ақ оны өзгерту және бұзу үшін негіздемелерді және оның үлгілік нысанын бекіту туралы
