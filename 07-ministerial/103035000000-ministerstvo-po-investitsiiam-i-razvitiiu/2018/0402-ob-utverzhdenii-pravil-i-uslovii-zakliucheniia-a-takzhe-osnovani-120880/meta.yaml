  title:
    rus: О внесении изменений и дополнения в приказ Министра по инвестициям и развитию Республики Казахстан от 2 апреля 2018 года № 213 «Об утверждении Правил заключения и расторжения соглашения о промышленной сборке сельскохозяйственной техники»
    kaz: «Ауыл шаруашылығы техникасын өнеркәсіптік құрастыру туралы келісімді жасасу және бұзу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 2 сәуірдегі № 213 бұйрығына өзгерістер мен толықтыру енгізу туралы
