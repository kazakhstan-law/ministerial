  title:
    rus: О внесении изменений и дополнений в приказ Министра по инвестициям и развитию Республики Казахстан от 2 апреля 2018 года № 213 «Об утверждении Правил и условий заключения, а также оснований для изменения и расторжения соглашения о промышленной сборке сельскохозяйственной техники с юридическими лицами Республики Казахстан»
    kaz: «Қазақстан Республикасының заңды тұлғаларымен ауыл шаруашылығы техникасын өнеркәсіптік құрастыру туралы келісім жасасу қағидалары мен шарттарын, сондай-ақ оны өзгерту және бұзу үшін негіздемелерді және оның үлгілік нысанын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 2 сәуірдегі № 213 бұйрығына өзгерістер мен толықтырулар енгізу туралы
