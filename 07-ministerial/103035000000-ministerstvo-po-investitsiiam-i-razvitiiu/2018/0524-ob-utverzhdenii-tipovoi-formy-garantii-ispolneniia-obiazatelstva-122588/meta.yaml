  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 24 мая 2018 года № 387 «Об утверждении типовой формы гарантии за исполнение обязательства недропользователя по ликвидации последствий недропользования»
    kaz: «Жер қойнауын пайдаланушының жер қойнауын пайдалану салдарларын жою жөніндегі міндеттемесін орындауы үшін кепілдіктің үлгілік нысанын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 24 мамырдағы № 387 бұйрығына өзгерістер енгізу туралы
