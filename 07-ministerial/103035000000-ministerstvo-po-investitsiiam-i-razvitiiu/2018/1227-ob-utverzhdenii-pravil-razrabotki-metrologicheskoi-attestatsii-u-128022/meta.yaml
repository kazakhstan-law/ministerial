act_code: '128022'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 27 декабря 2018 года № 932. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 декабря 2018 года № 18108
title:
  rus: Об утверждении Правил разработки, метрологической аттестации, утверждения и регистрации методик выполнения измерений и референтных методик выполнения измерений в реестре государственной системы обеспечения единства измерений и оказания государственной услуги «Регистрация в реестре Государственной системы измерений Республики Казахстан методики выполнения измерений, разработанной и аттестованной в странах Содружества Независимых Государств»
  kaz: Өлшемдерді орындау әдістемелерін және өлшемдерді орындаудың референттік әдістемелерін әзірлеу, метрологиялық аттестаттау, бекіту және өлшем бірлігін қамтамасыз ету мемлекеттік жүйесінің тізілімінде тіркеу және «Қазақстан Республикасының Мемлекеттік өлшемдер жүйесі тізілімінде Тәуелсіз Мемлекеттер Достастығының елдерінде әзірленген және аттестатталған өлшемдерді орындау әдістемесін тіркеу» мемлекеттік қызметін көрсету қағидаларын бекіту туралы
