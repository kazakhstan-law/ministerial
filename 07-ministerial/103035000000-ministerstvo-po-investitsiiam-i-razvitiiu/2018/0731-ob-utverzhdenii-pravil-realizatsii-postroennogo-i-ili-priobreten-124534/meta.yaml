requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 31 июля 2018 года № 540. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 сентября 2018 года № 17373. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 4 февраля 2021 года № 44 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил реализации построенного и (или) приобретенного у частных застройщиков жилья в рамках Государственной программы жилищного строительства «Нұрлы жер»
  kaz: «Нұрлы жер» мемлекеттік тұрғын үй құрылысы бағдарламасы шеңберінде жеке құрылыс салушылар салған және (немесе) олардан сатып алынған тұрғын үйлерді өткізу қағидаларын бекіту туралы
