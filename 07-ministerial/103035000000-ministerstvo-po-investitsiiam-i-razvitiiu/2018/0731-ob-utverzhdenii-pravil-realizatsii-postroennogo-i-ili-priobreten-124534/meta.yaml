  title:
    rus: О внесении изменения в приказ Министра по инвестициям и развитию Республики Казахстан от 31 июля 2018 года № 540 «Об утверждении Правил реализации построенного и (или) приобретенного у частных застройщиков жилья в рамках Государственной программы жилищного строительства «Нұрлы жер»
    kaz: «Нұрлы жер» мемлекеттік тұрғын үй құрылысы бағдарламасы шеңберінде жеке құрылыс салушылар салған және (немесе) олардан сатып алынған тұрғын үйлерді өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2018 жылғы 31 шілдедегі № 540 бұйрығына өзгеріс енгізу туралы
