requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 5 апреля 2018 года № 217. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 апреля 2018 года № 16778
title:
  rus: Об утверждении перечня категорий товаров, не подлежащих помещению под таможенную процедуру свободной таможенной зоны в специальных экономических зонах или в отдельных специальных экономических зонах, созданных (создаваемых) на территории Республики Казахстан
  kaz: Қазақстан Республикасының аумағында құрылған (құрылатын) арнайы экономикалық аймақтарда немесе жекелеген арнайы экономикалық аймақтарда еркін кеден аймағы кедендік рәсімімен орналастыруға жатпайтын тауарлар санаттарының тізбесін бекіту туралы
