title:
  rus: Об утверждении правил утверждения типа и регистрации в реестре государственной системы обеспечения единства измерений стандартного образца и оказания государственных услуг «Допуск к применению стандартного образца зарубежного выпуска», «Утверждение государственного стандартного образца»
  kaz: Стандартты үлгінің типін бекіту және өлшем бірлігін қамтамасыз ету мемлекеттік жүйесінің тізілімінде тіркеу және «Шетелде шығарылған стандарттық үлгіні қолдануға рұқсат ету» және «Мемлекеттік стандарттық үлгіні бекіту» мемлекеттік қызметті көрсету қағидаларын бекіту туралы
