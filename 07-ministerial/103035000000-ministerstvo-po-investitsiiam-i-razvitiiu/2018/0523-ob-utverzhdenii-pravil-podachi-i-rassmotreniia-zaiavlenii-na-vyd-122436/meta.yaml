  title:
    rus: О внесении изменений в приказы Министра по инвестициям и развитию Республики Казахстан от 23 мая 2018 года № 365 «Об утверждении Правил подачи и рассмотрения заявлений на выдачу лицензий на разведку твердых полезных ископаемых» и Министра по инвестициям и развитию Республики Казахстан от 23 мая 2018 года № 366 «Об утверждении Правил подачи и рассмотрения заявлений на выдачу лицензий на добычу твердых полезных ископаемых»
    kaz: «Пайдалы қатты қазбаларды барлауға арналған лицензияларды беруге өтініштерді беру және оларды қарау қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 23 мамырдағы № 365 және «Пайдалы қатты қазбаларды өндіруге арналған лицензия беру үшін өтініш беру және оны қарау қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 23 мамырдағы № 366 бұйрықтарына өзгерістер енгізу туралы
