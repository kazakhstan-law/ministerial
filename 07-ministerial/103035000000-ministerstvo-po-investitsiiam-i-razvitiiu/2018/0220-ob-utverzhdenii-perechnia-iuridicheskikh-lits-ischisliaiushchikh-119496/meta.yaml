act_code: '119496'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 20 февраля 2018 года № 122. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 марта 2018 года № 16572. Утратил силу приказом и.о. Министра промышленности и строительства Республики Казахстан от 15 января 2026 года № 13 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня юридических лиц, исчисляющих налог по ставкам физических лиц, по объектам налогообложения, предоставленным в рамках реализации государственных и (или) правительственных программ жилищного строительства по договорам долгосрочной аренды жилища физическому лицу, являющемуся участником такой программы
  kaz: Салықты мемлекеттік және (немесе) үкіметтік тұрғын үй құрылысы бағдарламаларын іске асыру шеңберінде осы бағдарламаға қатысушы болып табылатын жеке тұлғаға тұрғынжайды ұзақ мерзімді жалдау шарттары бойынша берілген салық салу объектілері бойынша жеке тұлғалардың мөлшерлемелері бойынша есептейтін заңды тұлғалардың тізбесін бекіту туралы
