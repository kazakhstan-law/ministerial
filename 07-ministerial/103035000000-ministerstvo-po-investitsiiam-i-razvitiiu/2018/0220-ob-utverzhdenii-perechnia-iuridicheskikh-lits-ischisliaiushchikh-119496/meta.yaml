  title:
    rus: О внесении изменения в приказ Министра по инвестициям и развитию Республики Казахстан от 20 февраля 2018 года № 122 «Об утверждении перечня юридических лиц, исчисляющих налог по ставкам физических лиц, по объектам налогообложения, предоставленным в рамках реализации государственных и (или) правительственных программ жилищного строительства по договорам долгосрочной аренды жилища физическому лицу, являющемуся участником такой программы»
    kaz: «Салықты мемлекеттік және (немесе) үкіметтік тұрғын үй құрылысы бағдарламаларын іске асыру шеңберінде осы бағдарламаға қатысушы болып табылатын жеке тұлғаға тұрғынжайды ұзақ мерзімді жалдау шарттары бойынша берілген салық салу объектілері бойынша жеке тұлғалардың мөлшерлемелері бойынша есептейтін заңды тұлғалардың тізбесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 20 ақпандағы № 122 бұйрығына өзгеріс енгізу туралы
