act_code: '125304'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 28 сентября 2018 года № 682. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 октября 2018 года № 17575. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 15 апреля 2022 года № 124/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня субъектов индустриально-инновационной системы, участвующих в государственной поддержке индустриально-инновационной деятельности и осуществляющих софинансирование венчурных фондов
  kaz: Индустриялық-инновациялық қызметті мемлекеттік қолдауға қатысатын және венчурлік қорларды ортақ қаржыландыруды жүзеге асыратын индустриялық-инновациялық жүйе субъектілерінің тізбесін бекіту туралы
