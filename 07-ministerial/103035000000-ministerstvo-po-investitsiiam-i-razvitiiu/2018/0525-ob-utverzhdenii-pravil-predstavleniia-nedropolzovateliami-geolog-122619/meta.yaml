  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 25 мая 2018 года № 392 «Об утверждении Правил предоставления недропользователями геологических отчетов и отчетов о добытых твердых полезных ископаемых, общераспространенных полезных ископаемых, а также отчета о добытых драгоценных металлах и драгоценных камнях»
    kaz: «Жер қойнауын пайдаланушылардың геологиялық есептерді және өндірілген пайдалы қатты қазбалар, кең таралған пайдалы қазбалар туралы есептерді, сондай-ақ өндірілген бағалы металдар мен асыл тастар туралы есепті ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2018 жылғы 25 мамырдағы № 392 бұйрығына өзгерістер енгізу туралы
