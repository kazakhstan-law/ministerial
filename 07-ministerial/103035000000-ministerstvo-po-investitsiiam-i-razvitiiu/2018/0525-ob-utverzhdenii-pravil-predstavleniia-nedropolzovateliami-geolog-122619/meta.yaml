title:
  rus: Об утверждении Правил представления недропользователями геологических отчетов и отчетов о добытых твердых полезных ископаемых, общераспространенных полезных ископаемых, а также отчета о добытых драгоценных металлах и драгоценных камнях
  kaz: Жер қойнауын пайдаланушылардың геологиялық есептерді және өндірілген пайдалы қатты қазбалар, кең таралған пайдалы қазбалар туралы есептерді, сондай-ақ өндірілген бағалы металдар мен асыл тастар туралы есепті ұсыну қағидаларын бекіту туралы
