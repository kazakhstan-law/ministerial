  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 27 апреля 2018 года № 283 «Об утверждении Правил представления уполномоченному органу в области твердых полезных ископаемых годовых (на один финансовый год) и среднесрочных (на пять финансовых лет) программ закупа товаров, работ и услуг, а также информации о планируемом закупе возмездных услуг оператора»
    kaz: «Пайдалы қатты қазбалар саласындағы уәкілетті органға тауарларды, жұмыстарды және көрсетілетін қызметтерді сатып алудың жылдық (бір қаржы жылына арналған) және орта мерзімді (бес қаржы жылына арналған) бағдарламаларын, сондай-ақ оператордың өтеулі көрсетілетін қызметтерін жоспарланған сатып алу туралы ақпаратын ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 27 сәуірдегі № 283 бұйрығына өзгерістер енгізу туралы
