title:
  rus: Об утверждении Правил применения технического средства системы спутниковой навигации или устройства вызова экстренных оперативных служб с функцией непрерывной передачи данных на территории Республики Казахстан и подтверждения его наличия
  kaz: Деректерді үздіксіз беру функциясы бар спутниктік навигация жүйесінің техникалық құралын немесе шұғыл қимылдайтын жедел қызметтерді шақыру құрылғысын Қазақстан Республикасының аумағында қолдану және оның бар екенін растау қағидаларын бекіту туралы
