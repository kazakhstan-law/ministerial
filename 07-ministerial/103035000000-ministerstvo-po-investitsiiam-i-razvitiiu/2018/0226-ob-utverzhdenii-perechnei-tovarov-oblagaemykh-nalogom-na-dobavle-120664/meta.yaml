  code: '172437'
  requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 26 сентября 2022 года № 531. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 октября 2022 года № 29971. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 4 марта 2026 года № 84 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в приказ Министра по инвестициям и развитию Республики Казахстан от 26 февраля 2018 года № 131 «Об утверждении перечней товаров, облагаемых налогом на добавленную стоимость по нулевой ставке, реализуемых на территорию специальной экономической зоны, полностью потребляемых при осуществлении деятельности, отвечающей целям создания специальных экономических зон»
    kaz: «Арнайы экономикалық аймақтарды құру мақсатына сай келетiн қызметті жүзеге асыру кезiнде толығымен тұтынылатын, арнайы экономикалық аймақтың аумағына өткiзілетін, нөлдiк мөлшерлеме бойынша қосылған құн салығы салынатын тауарлардың тiзбелерін бекiту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 26 ақпандағы № 131 бұйрығына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/172437/rus
