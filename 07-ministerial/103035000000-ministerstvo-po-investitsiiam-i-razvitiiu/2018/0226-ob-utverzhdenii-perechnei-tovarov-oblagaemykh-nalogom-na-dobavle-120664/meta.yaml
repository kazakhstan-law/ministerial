act_code: '120664'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 26 февраля 2018 года № 131. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 марта 2018 года № 16577. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 4 марта 2026 года № 84 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечней товаров, облагаемых налогом на добавленную стоимость по нулевой ставке, реализуемых на территорию специальной экономической зоны, полностью потребляемых при осуществлении деятельности, отвечающей целям создания специальных экономических зон
  kaz: Арнайы экономикалық аймақтарды құру мақсатына сай келетiн қызметті жүзеге асыру кезiнде толығымен тұтынылатын, арнайы экономикалық аймақтың аумағына өткiзілетін, нөлдiк мөлшерлеме бойынша қосылған құн салығы салынатын тауарлардың тiзбелерін бекiту туралы
