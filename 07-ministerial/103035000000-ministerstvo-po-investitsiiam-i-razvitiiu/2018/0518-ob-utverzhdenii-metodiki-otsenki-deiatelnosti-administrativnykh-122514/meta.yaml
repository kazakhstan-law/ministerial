  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 18 мая 2018 года № 343 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства по инвестициям и развитию Республики Казахстан, его ведомств и их территориальных подразделений»
    kaz: «Қазақстан Республикасы Инвестициялар және даму министрлігінің, оның ведомстволары мен олардың аумақтық бөлімшелерінің «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 18 мамырдағы № 343 бұйрығына өзгерістер енгізу туралы
