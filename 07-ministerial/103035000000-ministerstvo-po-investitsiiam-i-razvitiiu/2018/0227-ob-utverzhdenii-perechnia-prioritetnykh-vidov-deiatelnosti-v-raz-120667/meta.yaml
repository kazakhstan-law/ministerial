act_code: '120667'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 27 февраля 2018 года № 142. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 марта 2018 года № 16588. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 22 февраля 2024 года № 72 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня приоритетных видов деятельности в разрезе специальных экономических зон, соответствующих целям создания специальной экономической зоны, а также Правил включения приоритетных видов деятельности в перечень приоритетных видов деятельности в разрезе специальных экономических зон, соответствующих целям создания специальной экономической зоны
  kaz: Арнайы экономикалық аймақ құру мақсаттарына сәйкес келетін, арнайы экономикалық аймақ бөлінісінде қызметтің басым түрлерінің тізбесін, сондай-ақ арнайы экономикалық аймақ құру мақсаттарына сәйкес келетін, арнайы экономикалық аймақ бөлінісінде қызметтің басым түрлерінің тізбесіне қызметтің басым түрлерін енгізу қағидаларын бекіту туралы
