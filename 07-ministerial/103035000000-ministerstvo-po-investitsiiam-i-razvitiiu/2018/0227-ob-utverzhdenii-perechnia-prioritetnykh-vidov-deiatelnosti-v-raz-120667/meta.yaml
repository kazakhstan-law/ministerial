  title:
    rus: О внесении дополнения в приказ Министра по инвестициям и развитию Республики Казахстан от 27 февраля 2018 года № 142 «Об утверждении перечня приоритетных видов деятельности в разрезе специальных экономических зон, соответствующих целям создания специальной экономической зоны, а также Правил включения приоритетных видов деятельности в перечень приоритетных видов деятельности в разрезе специальных экономических зон, соответствующих целям создания специальной экономической зоны»
    kaz: «Арнайы экономикалық аймақ құру мақсаттарына сәйкес келетін арнайы экономикалық аймақ бөлінісінде қызметтің басым түрлерінің тізбесін, сондай-ақ арнайы экономикалық аймақ құру мақсаттарына сәйкес келетін, арнайы экономикалық аймақ бөлінісінде қызметтің басым түрлерінің тізбесіне қызметтің басым түрлерін енгізу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 27 ақпандағы № 142 бұйрығына толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/147013/rus
