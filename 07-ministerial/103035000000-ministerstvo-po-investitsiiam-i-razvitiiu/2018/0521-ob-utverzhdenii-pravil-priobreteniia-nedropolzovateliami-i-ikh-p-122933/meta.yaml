  title:
    rus: О внесении дополнения в приказ Министра по инвестициям и развитию Республики Казахстан от 21 мая 2018 года № 355 «Об утверждении Правил приобретения недропользователями и их подрядчиками товаров, работ и услуг, используемых при проведении операций по добыче твердых полезных ископаемых»
    kaz: «Жер қойнауын пайдаланушылар мен олардың мердігерлерінің пайдалы қатты қазбаларды өндіру жөнінде операциялар жүргізу кезінде пайдаланатын тауарларды, жұмыстар мен көрсетілетін қызметтерді сатып алу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 21 мамырдағы № 355 бұйрығына толықтыру енгізу туралы
