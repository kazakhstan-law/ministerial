  title:
    rus: О внесении изменений и дополнений в приказ Министра по инвестициям и развитию Республики Казахстан от 21 мая 2018 года №355 «Об утверждении Правил приобретения недропользователями и их подрядчиками товаров, работ и услуг, используемых при проведении операций по добыче твердых полезных ископаемых»
