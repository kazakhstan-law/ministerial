act_code: '119036'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 26 января 2018 года № 54. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 февраля 2018 года № 16370. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 21 апреля 2020 года № 215 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Свидетельство, выданное в соответствии с Соглашением о международных перевозках скоропортящихся пищевых продуктов и о специальных транспортных средствах, предназначенных для этих перевозок»
  kaz: «Тез бұзылатын тамақ өнімдерін халықаралық тасымалдау және осы тасымалдарға арналған арнайы көлік құралдары туралы келісімге сәйкес берілген куәлік» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
