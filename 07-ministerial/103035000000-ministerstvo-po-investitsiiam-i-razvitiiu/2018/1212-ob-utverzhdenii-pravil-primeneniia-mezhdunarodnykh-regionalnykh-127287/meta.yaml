  requisite: Приказ Министра торговли и интеграции Республики Казахстан от 15 июня 2021 года № 411-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 июня 2021 года № 23063
  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 12 декабря 2018 года № 870 «Об утверждении Правил применения международных, региональных стандартов и стандартов иностранных государств, классификаторов технико-экономической информации международных организаций по стандартизации, классификаторов технико-экономической информации, правил и рекомендаций по стандартизации региональных организаций по стандартизации, классификаторов технико-экономической информации, правил, норм и рекомендаций по стандартизации иностранных государств»
    kaz: «Халықаралық, өңірлік стандарттарды және шет мемлекеттердің стандарттарын, стандарттау жөніндегі халықаралық ұйымдардың техникалық-экономикалық ақпарат сыныптауыштарын, стандарттау жөніндегі өңірлік ұйымдардың техникалық-экономикалық ақпарат сыныптауыштарын, стандарттау жөніндегі қағидалары мен ұсынымдарын, шет мемлекеттердің техникалық-экономикалық ақпарат сыныптауыштарын, стандарттау жөніндегі қағидаларын, нормалары мен ұсынымдарын қолдану қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 12 желтоқсандағы № 870 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/156464/rus
