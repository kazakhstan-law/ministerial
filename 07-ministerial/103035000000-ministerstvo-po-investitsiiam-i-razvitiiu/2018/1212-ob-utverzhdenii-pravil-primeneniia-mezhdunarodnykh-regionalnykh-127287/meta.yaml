act_code: '127287'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 12 декабря 2018 года № 870. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 декабря 2018 года № 17989
title:
  rus: Об утверждении Правил применения международных, региональных стандартов (в том числе согласования, введения в действие и отмены на территории Республики Казахстан межгосударственных стандартов) и стандартов иностранных государств, классификаторов технико-экономической информации международных организаций по стандартизации, классификаторов технико-экономической информации, правил и рекомендаций по стандартизации региональных организаций по стандартизации, классификаторов технико-экономической информации, правил, норм и рекомендаций по стандартизации иностранных государств
  kaz: Халықаралық, өңірлік стандарттарды (оның ішінде Қазақстан Республикасының аумағында мемлекетаралық стандарттарды келісу, қолданысқа енгізу және күшін жою) және шет мемлекеттердің стандарттарын, стандарттау жөніндегі халықаралық ұйымдардың техникалық-экономикалық ақпарат сыныптауыштарын, стандарттау жөніндегі өңірлік ұйымдардың техникалық-экономикалық ақпарат сыныптауыштарын, стандарттау жөніндегі қағидалары мен ұсынымдарын, шет мемлекеттердің техникалық-экономикалық ақпарат сыныптауыштарын, стандарттау жөніндегі қағидаларын, нормалары мен ұсынымдарын қолдану қағидаларын бекіту туралы
