act_code: '123042'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 4 июня 2018 года № 427. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 июня 2018 года № 17103. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 8 сентября 2020 года № 457 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Проверка знаний руководителей юридических лиц, декларирующих промышленную безопасность, а также членов постоянно действующих экзаменационных комиссий указанных юридических лиц»
  kaz: «Өнеркәсіптік қауіпсіздікті декларациялайтын заңды тұлғалардың басшылары, сондай-ақ аталған заңды тұлғалардың тұрақты жұмыс істейтін емтихан комиссиялары мүшелерінің білімін тексеру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
