act_code: '128021'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 27 декабря 2018 года № 931. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 декабря 2018 года № 18110
title:
  rus: Об утверждении Правил утверждения типа, испытаний для целей утверждения типа, метрологической аттестации средств измерений и оказания государственных услуг «Выдача сертификата об утверждении типа средств измерений» и «Выдача сертификата о метрологической аттестации средств измерений», формы сертификата об утверждении типа средств измерений и установления формы знака утверждения типа
  kaz: Өлшем құралдарының типін бекіту, оларға типін бекіту мақсаттарына арналған сынақтар, метрологиялық аттестаттау және «Өлшем құралдарының типін бекіту туралы сертификат беру» және «Өлшем құралдарын метрологиялық аттестаттау туралы сертификат беру» мемлекеттік қызметтер көрсету, өлшем құралдарының типін бекіту туралы сертификат нысанын және типті бекіту белгісінің нысанын белгілеу қағидаларын бекіту туралы
