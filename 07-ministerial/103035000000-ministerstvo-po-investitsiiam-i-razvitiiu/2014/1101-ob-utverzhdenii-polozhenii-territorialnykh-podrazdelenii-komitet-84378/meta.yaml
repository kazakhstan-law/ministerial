  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 1 ноября 2014 года № 118 «Об утверждении положений территориальных подразделений Комитета индустриального развития и промышленной безопасности Министерства по инвестициям и развитию Республики Казахстан»
    kaz: «Қазақстан Республикасы Инвестициялар және даму министрлігі Индустриялық даму және өнеркәсіптік қауіпсіздік комитетінің аумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2014 жылғы 1 қарашадағы № 118 бұйрығына өзгерістер енгізу туралы
