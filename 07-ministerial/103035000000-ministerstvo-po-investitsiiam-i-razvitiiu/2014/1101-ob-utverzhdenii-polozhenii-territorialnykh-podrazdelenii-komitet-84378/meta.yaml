act_code: '84378'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 1 ноября 2014 года № 118. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 ноября 2014 года № 9862. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 17 мая 2019 года № 311 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении положений территориальных подразделений Комитета индустриального развития и промышленной безопасности Министерства по инвестициям и развитию Республики Казахстан
  kaz: Қазақстан Республикасы Инвестициялар және даму министрлігі Индустриялық даму және өнеркәсіптік қауіпсіздік комитетінің аумақтық бөлімшелерінің ережелерін бекіту туралы
