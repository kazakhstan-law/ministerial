act_code: '84979'
requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 7 ноября 2014 года № 137. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 ноября 2014 года № 9873. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 3 октября 2018 года № 688 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Положения о государственном учреждении "Межрегиональная инспекция по безопасности полетов по Алматинской, Жамбылской, Кызылординской, Южно-Казахстанской областям и городу Алматы Комитета гражданской авиации Министерства по инвестициям и развитию Республики Казахстан"
  kaz: '"Қазақстан Республикасы Инвестициялар және даму министрлігі Азаматтық авиация комитетінің Алматы, Жамбыл, Қызылорда, Оңтүстік Қазақстан облыстары және Алматы қаласы бойынша Өңіраралық ұшу қауіпсіздігі инспекциясы" мемлекеттік мекемесі туралы ережені бекіту туралы'
