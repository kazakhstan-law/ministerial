  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 17 октября 2014 года № 91 «Об утверждении положений государственного учреждения «Комитет технического регулирования и метрологии Министерства по инвестициям и развитию Республики Казахстан» и его территориальных подразделениях»
    kaz: «Қазақстан Республикасы Инвестициялар және даму министрлігінің Техникалық peттеу және метрология комитеті» мемлекеттік мекемесінің және оның aумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2014 жылғы 17 қазандағы № 91 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/115862/rus
