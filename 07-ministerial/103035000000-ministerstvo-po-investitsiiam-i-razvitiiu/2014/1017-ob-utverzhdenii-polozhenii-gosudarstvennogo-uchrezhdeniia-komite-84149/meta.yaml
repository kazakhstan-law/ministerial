act_code: '84149'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 17 октября 2014 года № 91. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 октября 2014 года № 9822. Утратил силу приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 28 декабря 2017 года № 912 ( вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении положений государственного учреждения "Комитет технического регулирования и метрологии Министерства по инвестициям и развитию Республики Казахстан" и его территориальных подразделениях
  kaz: '"Қазақстан Республикасы Инвестициялар және даму министрлігінің Техникалық peттеу және метрология комитеті" мемлекеттік мекемесінің және оның aумақтық бөлімшелерінің ережелерін бекіту туралы'
