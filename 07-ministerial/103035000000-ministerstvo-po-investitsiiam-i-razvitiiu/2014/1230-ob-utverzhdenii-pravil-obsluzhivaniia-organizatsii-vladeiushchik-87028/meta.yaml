    kaz: «Кәсіби авариялық-құтқару қызметтері мен құрылымдарының қауіпті өндірістік объектілерді иеленетін және (немесе) пайдаланатын ұйымдарға қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2014 жылғы 30 желтоқсандағы № 347 бұйрығына өзгерістер енгізу туралы
