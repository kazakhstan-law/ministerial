  title:
    rus: Об утверждении Правил оказания государственных услуг в сфере взрывчатых и пиротехнических (за исключением гражданских) веществ и изделий с их применением и о внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 30 декабря 2014 года № 350 «Об утверждении Правил выдачи разрешения на производство взрывных работ»
    kaz: Жарылғыш және пиротехникалық (азаматтықты қоспағанда) заттар мен оларды қолданылып жасалған бұйымдар саласындағы мемлекеттік қызметтерді көрсету қағидаларын бекіту туралы және «Жарылыс жұмыстарын жүргізуге рұқсат беру қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2014 жылғы 30 желтоқсандағы № 350 бұйрығына өзгерістер енгізу туралы
