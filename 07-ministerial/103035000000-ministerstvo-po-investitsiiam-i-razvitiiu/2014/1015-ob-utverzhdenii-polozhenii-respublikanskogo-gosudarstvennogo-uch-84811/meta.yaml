requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 15 октября 2014 года № 67. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 октября 2014 года № 9806. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 5 июня 2019 года № 370 (вводится в действие по истечении десяти календарных после дня его первого официального опубликования)
title:
  rus: Об утверждении положений Республиканского государственного учреждения "Комитет геологии и недропользования Министерства по инвестициям и развитию Республики Казахстан" и его территориальных подразделений
  kaz: '"Қазақстан Республикасы Инвестициялар және даму министрлігінің Геология және жер қойнауын пайдалану комитеті" мемлекеттік мекемесінің және оның аумақтық бөлімшелерінің ережелерін бекіту туралы'
