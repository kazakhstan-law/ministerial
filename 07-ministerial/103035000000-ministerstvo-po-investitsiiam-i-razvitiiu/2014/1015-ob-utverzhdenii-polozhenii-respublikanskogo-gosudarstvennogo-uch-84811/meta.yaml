  requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 17 сентября 2015 года № 929. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 октября 2015 года № 12222. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 5 июня 2019 года № 370 (вводится в действие по истечении десяти календарных после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 15 октября 2014 года № 67 «Об утверждении положение государственного учреждения «Комитет геологии и недропользования Министерства по инвестициям и развитию Республики Казахстан» и его территориальных подразделениях»
    kaz: «Қазақстан Республикасы Инвестициялар және даму министрлігінің Геология және жер қойнауын пайдалану комитеті» мемлекеттік мекемесінің және оның аумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму Министрінің міндетін атқарушының 2014 жылы 15 қазандағы № 67 бұйрығына өзгерістер мен толықтырулар енгізу туралы
