  code: '124157'
  requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 10 августа 2018 года № 565. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 6 мая 2019 года № 286
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 15 октября 2014 года № 67 «Об утверждении положений Республиканского государственного учреждения «Комитет геологии и недропользования Министерства по инвестициям и развитию Республики Казахстан» и его территориальных подразделений»
    kaz: «Қазақстан Республикасы Инвестициялар және даму министрлігінің Геология және жер қойнауын пайдалану комитеті» мемлекеттік мекемесінің және оның аумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2014 жылғы 15 қазандағы № 67 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/124157/rus
