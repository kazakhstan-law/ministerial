  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 декабря 2014 года № 299 «Об утверждении требований, предъявляемых к юридическим лицам, аттестуемым на проведение работ в области промышленной безопасности» и приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 6 апреля 2020 года № 186 «Об утверждении Правил аттестации юридических лиц на право проведения работ в области промышленной безопасности»
    kaz: Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2014 жылғы 26 желтоқсандағы «Өнеркәсіптік қауіпсіздік саласындағы жұмыстарды жүргізуге аттестатталатын заңды тұлғаларға қойылатын талаптарды бекіту туралы» № 299 бұйрығына және Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2020 жылғы 6 сәуірдегі «Заңды тұлғаларды өнеркәсіптік қауіпсіздік саласындағы жұмыстарды жүргізу құқығына аттестаттау қағидаларын бекіту туралы» № 186 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/198436/rus
