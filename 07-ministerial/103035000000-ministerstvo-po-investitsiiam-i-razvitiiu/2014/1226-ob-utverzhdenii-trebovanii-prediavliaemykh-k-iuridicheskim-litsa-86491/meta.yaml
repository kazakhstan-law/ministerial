  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 декабря 2014 года № 299 «Об утверждении требований, предъявляемых к юридическим лицам, аттестуемым на проведение работ в области промышленной безопасности» и приказ Министра внутренних дел Республики Казахстан от 9 октября 2017 года № 673 «Об утверждении Требований по безопасности объектов систем газоснабжения»
    kaz: «Өнеркәсіптік қауіпсіздік саласындағы жұмыстарды жүргізуге аттестатталатын заңды тұлғаларға қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушы 2014 жылғы 26 желтоқсандағы № 299 бұйрығына және «Газбен жабдықтау жүйелері объектілерінің қауіпсіздігі жөніндегі талаптарды бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2017 жылғы 9 қазандағы № 673 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/214691/rus
