title:
  rus: Об утверждении Правил проведения конкурса на основе открытого тендера по определению перевозчиков, осуществляющих перевозки пассажиров по социально значимым сообщениям, расходы которых подлежат долгосрочному субсидированию за счет бюджетных средств
  kaz: Шығыстары бюджет қаражаты есебінен ұзақ мерзімді субсидиялануға жататын әлеуметтік маңызы бар қатынастар бойынша жолаушылар тасымалын жүзеге асыратын тасымалдаушыларды айқындау бойынша ашық тендер негізінде конкурс өткізу қағидаларын бекіту туралы
