  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 30 октября 2014 года № 113 «Об утверждении Правил проведения конкурса на основе открытого тендера по определению перевозчиков, осуществляющих железнодорожные пассажирские перевозки по социально значимым межобластным сообщениям, убытки которых подлежат субсидированию за счет бюджетных средств»
    kaz: «Шығындары бюджет қаражаты есебінен субсидиялануға жататын әлеуметтік маңызы бар облысаралық қатынастар бойынша теміржол жолаушылар тасымалын жүзеге асыратын тасымалдаушыларды айқындау бойынша ашық тендер негізінде конкурс өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2014 жылғы 30 қазандағы № 113 бұйрығына өзгерістер енгізу туралы
