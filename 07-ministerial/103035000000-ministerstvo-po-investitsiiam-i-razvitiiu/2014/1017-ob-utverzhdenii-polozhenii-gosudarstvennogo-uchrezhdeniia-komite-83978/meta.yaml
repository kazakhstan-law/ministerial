  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 17 октября 2014 года № 92 «Об утверждении положений государственного учреждения «Комитет транспорта Министерства по инвестициям и развитию Республики Казахстан» и его территориальных органов»
    kaz: «Қазақстан Республикасы Инвестициялар және даму министрлігінің Көлік комитеті» мемлекеттік мекемесі және оның аумақтық органдарының ережелерін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушысының 2014 жылғы 17 қазандағы № 92 бұйрығына өзгерістер мен толықтырулар енгізу туралы»
