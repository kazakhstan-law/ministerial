  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 12 декабря 2014 года № 264 «Об утверждении механизма оценки деятельности местных исполнительных органов по вопросам энергосбережения и повышения энергоэффективности» и в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 5 декабря 2022 года № 684 «Об утверждении Правил мониторинга энергопотребления государственных учреждений»
    kaz: «Энергия үнемдеу және энергия тиімділігін арттыру мәселелері бойынша жергілікті атқарушы органдар қызметін бағалау тетігін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2014 жылғы 12 желтоқсандағы № 264 бұйрығына және «Мемлекеттік мекемелердің энергия тұтыну мониторингінің қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2022 жылғы 5 желтоқсандағы № 684 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/200575/rus
