requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 17 ноября 2014 года № 157. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 ноября 2014 года № 9879. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 23 февраля 2016 года № 211
title:
  rus: Об определении сроков выполнения функций управляющей компании специальной экономической зоны "Бурабай" Республиканским государственным учреждением "Территориальный департамент Комитета по инвестициям Министерства по инвестициям и развитию Республики Казахстан - администрация специальной экономической зоны "Бурабай"
  kaz: '"Қазақстан Республикасы Инвестициялар және даму министрлігі Инвестиция комитетінің аумақтық департаменті – "Бурабай" арнайы экономикалық аймағы әкімшілігі" республикалық мемлекеттік мекемесі "Бурабай" арнайы экономикалық аймағы басқарушы компаниясы қызметін атқару мерзімін айқындау туралы'
