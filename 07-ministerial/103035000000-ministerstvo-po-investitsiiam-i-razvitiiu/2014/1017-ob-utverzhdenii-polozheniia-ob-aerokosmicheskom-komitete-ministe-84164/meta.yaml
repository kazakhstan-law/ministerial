    kaz: «Қазақстан Республикасы Инвестициялар және даму министрлігінің Аэроғарыш комитеті туралы ережені бекіту туралы» Қазақстан Республикасы Инвестициялар және даму Министрінің міндетін атқарушының 2014 жылғы 17 қазандағы № 77 бұйрығына өзгерістер мен толықтырулар енгізу туралы
