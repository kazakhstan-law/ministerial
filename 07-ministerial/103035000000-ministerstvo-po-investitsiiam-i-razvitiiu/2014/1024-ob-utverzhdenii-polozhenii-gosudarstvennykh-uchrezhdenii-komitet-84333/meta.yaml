act_code: '84333'
requisite: Приказ и.о. Министра по инвестициям и развитию Республики Казахстан от 24 октября 2014 года № 100. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 октября 2014 года № 9841. Утратил силу приказом Министра иностранных дел Республики Казахстан от 30 января 2019 года № 11-1-4/33 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении положений государственных учреждений "Комитет по инвестициям Министерства по инвестициям и развитию Республики Казахстан" и "Территориальный департамент Комитета по инвестициям Министерства по инвестициям и развитию Республики Казахстан - администрация специальной экономической зоны "Бурабай"
  kaz: '"Қазақстан Республикасы Инвестициялар және даму министрлігінің Инвестиция комитеті" және "Қазақстан Республикасы Инвестициялар және даму министрлігі Инвестиция комитетінің аумақтық департаменті - "Бурабай" арнайы экономикалық аймағының әкімшілігі" мемлекеттік мекемелердің ережелерін бекіту туралы'
