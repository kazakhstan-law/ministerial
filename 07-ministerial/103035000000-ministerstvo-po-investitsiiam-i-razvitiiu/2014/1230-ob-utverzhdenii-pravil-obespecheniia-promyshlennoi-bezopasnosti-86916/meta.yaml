  title:
    rus: О внесении изменений в приказ Министра по инвестициям и развитию Республики Казахстан от 30 декабря 2014 года № 344 «Об утверждении Правил обеспечения промышленной безопасности для опасных производственных объектов по хранению и переработке растительного сырья» и приказ Министра по чрезвычайным ситуациям Республики Казахстан от 24 июня 2021 года № 315 «Об утверждении Инструкции по организации и осуществлению производственного контроля на опасном производственном объекте»
    kaz: «Өсімдік шикізатын сақтау және қайта өңдеу бойынша қауіпті өндірістік объектілер үшін өнеркәсіптік қауіпсіздікті қамтамасыз ету қағидаларын бекіту туралы» Қазақстан Республикасының Инвестициялар және даму министрінің 2014 жылғы 30 желтоқсандағы № 344 бұйрығына және «Қауіпті өндірістік объектіде өндірістік бақылауды ұйымдастыру және жүзеге асыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2021 жылғы 24 маусымдағы № 315 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/176479/rus
