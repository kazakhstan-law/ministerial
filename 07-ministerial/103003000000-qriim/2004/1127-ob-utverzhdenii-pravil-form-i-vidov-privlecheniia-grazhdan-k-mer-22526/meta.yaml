title:
  rus: Об утверждении правил, форм и видов привлечения граждан к мероприятиям по обеспечению общественного порядка, не связанным с контрольными и надзорными функциями
  kaz: Бақылау және қадағалау функцияларына байланысты емес, қоғамдық тәртiптi қамтамасыз ету жөнiндегi iс-шараларға азаматтарды тартудың қағидалары, нысандары мен түрлерiн бекіту туралы
