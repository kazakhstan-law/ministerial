  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 27 ноября 2004 года № 641 «Об утверждении Правил привлечения граждан к мероприятиям по обеспечению общественного порядка их форм и видов, не связанным с контрольными и надзорными функциями»
    kaz: «Бақылау және қадағалау функцияларына байланысты емес, қоғамдық тәртiптi қамтамасыз ету жөнiндегi iс-шараларға азаматтарды тарту ережесін, олардың нысандары мен түрлерiн бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2004 жылғы 27 қарашадағы № 641 бұйрығына өзгерістер енгізу туралы
