act_code: '22526'
requisite: Приказ Министра внутренних дел Республики Казахстан от 27 ноября 2004 года № 641. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 января 2005 года № 3326. Утратил силу приказом Министра внутренних дел Республики Казахстан от 27 февраля 2026 года № 144 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил, форм и видов привлечения граждан к мероприятиям по обеспечению общественного порядка, не связанным с контрольными и надзорными функциями
  kaz: Бақылау және қадағалау функцияларына байланысты емес, қоғамдық тәртiптi қамтамасыз ету жөнiндегi iс-шараларға азаматтарды тартудың қағидалары, нысандары мен түрлерiн бекіту туралы
