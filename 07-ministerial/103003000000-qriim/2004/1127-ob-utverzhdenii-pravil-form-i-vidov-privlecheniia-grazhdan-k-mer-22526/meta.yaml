  title:
    rus: О внесении изменения в приказ Министра внутренних дел Республики Казахстан от 27 ноября 2004 года № 641 "Об утверждении Правил о порядке, формах и видах привлечения граждан к мероприятиям по обеспечению общественного порядка"
    kaz: '"Қоғамдық тәртіпті қамтамасыз ету жөніндегі іс-шараларға азаматтарды тартудың тәртібі, нысандары және түрлері туралы ережені бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2004 жылғы 27 қарашадағы № 641 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
