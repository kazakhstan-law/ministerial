  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 13 апреля 2004 года № 221 "Об утверждении Правил отбора и приема в магистратуру высших учебных заведений Министерства внутренних дел Республики Казахстан"
    kaz: '"Қазақстан Республикасы Ішкі істер министрлігінің жоғары оқу орындарының магистратурасына іріктеу және қабылдау ережелерін бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2004 жылғы 13 сәуірдегі N 221 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
