act_code: '19526'
requisite: Приказ Министра внутренних дел Республики Казахстан от 25 марта 2004 года N 187. Зарегистрирован Министерством юстиции Республики Казахстан от 27 апреля 2004 года N 2826. Утратил силу приказом Министра внутренних дел Республики Казахстан от 9 апреля 2011 года № 156
title:
  rus: Об утверждении "Инструкции о работе органов внутренних дел по лицензированию юридических и физических лиц, претендующих на осуществление охранной деятельности, монтажа, наладки, технического обслуживания средств охранной сигнализации и проведению проверок их деятельности" и "Правил по проведению проверок охранников и работников охранных подразделений"
  kaz: Күзет қызметiн, күзет сигнализация құралдарын монтаждауды, жөндеудi, техникалық қызмет көрсетудi жүзеге асыруға үмiттенетiн заңды және жеке тұлғаларды лицензиялау жөнiндегi iшкi iстер органдарының жұмысы және олардың қызметін тексеру жүргiзу туралы нұсқаулықты" және "Күзетшiлер мен күзет бөлiмшелерiнiң жұмыскерлерiн тексеру жүргiзу жөнiндегi ереженi" бекiту туралы
