  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 21 августа 2001 года N 626 "Об утверждении Инструкции о порядке рассмотрения и разрешения обращений и организации приема граждан в органах, организациях Министерства внутренних дел Республики Казахстан", зарегистрированный в Министерстве юстиции Республики Казахстан за N 1672
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1672 болып тіркелген "Қазақстан Республикасы Ішкіісминінің органдарында, ұйымдарында азаматтардың өтініштерін қарау және оларды қабылдауды ұйымдастыру тәртібі туралы нұсқаулықты бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2001 жылғы 21 тамыздағы N 626 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/20956/rus
