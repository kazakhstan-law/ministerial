requisite: Приказ Министра внутренних дел Республики Казахстан от 21 августа 2001 года N 626. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 ноября 2001 года N 1672. Утратил силу приказом Министра внутренних дел Республики Казахстан от 30 августа 2007 года N 353
title:
  rus: Об утверждении Инструкции о порядке рассмотрения и разрешения обращений и организации приема граждан в органах, организациях Министерства внутренних дел Республики Казахстан
