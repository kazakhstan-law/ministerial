  title:
    rus: О внесении изменений и дополнений в Приказ Министра внутренних дел Республики Казахстан от 20 июня 2001 года № 486 "Об утверждении Инструкции по применению Кодекса Республики Казахстан об административных правонарушениях в деятельности органов внутренних дел"
    kaz: '"Қазақстан Республикасының Әкімшілік құқық бұзушылықтар туралы кодексін ішкі істер органдарының қызметінде қолдану жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2001 жылғы 20 маусымдағы № 486 бұйрығына өзгерістер мен толықтырулар енгізу туралы"'
