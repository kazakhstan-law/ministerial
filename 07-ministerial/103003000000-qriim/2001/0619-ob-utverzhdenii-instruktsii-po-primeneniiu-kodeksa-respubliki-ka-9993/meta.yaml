    kaz: '"Қазақстан Республикасының Әкiмшiлiк құқық бұзушылық туралы кодексiн iшкi iстер органдарының қызметiнде қолдану жөнiндегi Нұсқаулықты бекiту туралы" Қазақстан Республикасы Iшкi iстер министрiнің 2001 жылғы 20 маусымдағы № 486 бұйрығына өзгерiстер енгiзу туралы'
