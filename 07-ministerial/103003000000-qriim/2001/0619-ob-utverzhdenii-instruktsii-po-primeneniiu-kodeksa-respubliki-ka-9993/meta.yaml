    kaz: '"Қазақстан Республикасының әкімшілік құқық бұзушылық туралы кодексін ішкі істер органдарының қызметінде қолдану жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2001 жылғы 20 маусымдағы N 486 бұйрығына (N 1639 болып тіркелген) толықтырулар енгізу туралы'
