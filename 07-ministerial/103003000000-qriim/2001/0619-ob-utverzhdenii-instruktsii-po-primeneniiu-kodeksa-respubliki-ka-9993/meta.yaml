  title:
    rus: О внесении изменения и дополнений в приказ Министра внутренних дел Республики Казахстан от 20 июня 2001 года N 486 "Об утверждении Инструкции по применению Кодекса Республики Казахстан об административных правонарушениях в деятельности органов внутренних дел"
    kaz: '"Қазақстан Республикасының Әкiмшiлiк құқық бұзушылықтар туралы кодексiн iшкi iстер органдарының қызметiнде қолдану жөнiндегi нұсқаулықты бекiту туралы" Қазақстан Республикасы Iшкi iстер министрiнiң 2001 жылғы 20 маусымдағы N 486 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы'
