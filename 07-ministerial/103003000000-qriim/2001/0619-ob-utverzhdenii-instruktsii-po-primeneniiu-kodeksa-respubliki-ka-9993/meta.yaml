    kaz: '"Қазақстан Республикасының Әкімшілік құқық бұзушылық туралы кодексін ішкі істер органдарының қызметінде қолдану жөніндегі Нұсқаулықты бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2001 жылғы 20 маусымдағы N 486 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
