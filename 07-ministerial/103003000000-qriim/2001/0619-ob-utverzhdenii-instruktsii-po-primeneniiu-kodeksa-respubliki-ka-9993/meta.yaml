act_code: '9993'
requisite: Приказ Министра внутренних дел Республики Казахстан от 20 июня 2001 года N 486. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 сентября 2001 года N 1639. Утратил силу приказом Министра внутренних дел Республики Казахстан от 13 декабря 2007 года N 485
title:
  rus: Об утверждении Инструкции по применению Кодекса Республики Казахстан об административных правонарушениях в деятельности органов внутренних дел
  kaz: '"Қазақстан Республикасының Әкімшілік құқық бұзушылық туралы кодексін ішкі істер органдарының қызметінде қолдану жөніндегі Нұсқаулықты бекіту туралы"'
