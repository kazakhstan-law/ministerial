  requisite: Приказ Министра внутренних дел Республики Казахстан от 29 сентября 2003 года N 536. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 октября 2003 года N 2536. Утратил силу приказом Министра внутренних дел Республики Казахстан от 12 января 2016 года № 16
  title:
    rus: О внесении изменений и дополнений в Приказ Министра внутренних дел Республики Казахстан от 20 июня 2001 года N 486 "Об утверждении Инструкции по применению Кодекса Республики Казахстан об административных правонарушениях в деятельности органов внутренних дел", зарегистрированный за N 1639
    kaz: N 1639 болып тіркелген "Қазақстан Республикасының Әкімшілік құқық бұзушылықтар туралы кодексін ішкі істер органдарының қызметінде қолдану жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2001 жылғы 20 маусымдағы N 486 бұйрығына өзгерістер мен толықтырулар енгізу туралы"
