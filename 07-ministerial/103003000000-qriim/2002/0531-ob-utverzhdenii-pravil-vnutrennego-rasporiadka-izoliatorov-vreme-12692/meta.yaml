act_code: '12692'
requisite: Приказ Министра внутренних дел Республики Казахстан от 1 июня 2002 года N 385. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 июня 2002 года N 1883. Утратил силу приказом Министра внутренних дел Республики Казахстан от 5 февраля 2018 года № 95 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
