  requisite: Совместный приказ Министра юстиции Республики Казахстан от 6 мая 2010 года № 157, Министра здравоохранения Республики Казахстан от 18 мая 2010 года № 350 и Министра внутренних дел Республики Казахстан от 14 июня 2010 года № 272. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 октября 2010 года № 6571. Утратил силу совместным приказом Министра здравоохранения Республики Казахстан от 12 октября 2012 года № 713 и Министра внутренних дел Республики Казахстан от 22 октября 2012 года № 566
  title:
    rus: Об утверждении Правил оказания медицинской помощи гражданам, свобода которых ограничена, а также отбывающим наказание по приговору суда в местах лишения свободы, помещенным в специальные учреждения
    kaz: Бас бостандығы шектеулі, сондай-ақ сот үкімі бойынша жазасын бас бостандығынан айыру орындарында өтеп жүрген, арнайы мекемелерге орналастырылған азаматтарға медициналық көмек көрсету ережесін бекіту туралы
