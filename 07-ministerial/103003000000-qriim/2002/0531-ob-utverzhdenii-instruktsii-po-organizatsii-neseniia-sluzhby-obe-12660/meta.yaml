  title:
    rus: О внесении дополнений в приказ Министра внутренних дел Республики Казахстан от 1 июня 2002 года N 386 "Об утверждении Инструкции по организации несения службы, обеспечению охраны подозреваемых и обвиняемых, содержащихся в изоляторах временного содержания", зарегистрированный за N 1878
    kaz: '"Қызмет атқаруды ұйымдастыру, уақытша ұстау изоляторында ұсталатын сезіктілер мен айыпталушыларды күзетуді қамтамасыз ету жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2002 жылғы 1 маусымдағы N 386 бұйрығына (тіркеу нөмірі 1878) толықтырулар енгізу туралы'
