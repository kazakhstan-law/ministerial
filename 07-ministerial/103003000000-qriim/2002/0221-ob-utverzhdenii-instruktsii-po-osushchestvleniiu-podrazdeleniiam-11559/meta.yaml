act_code: '11559'
requisite: Приказ Министра внутренних дел Республики Казахстан от 21 февраля 2002 года N 103. Зарегистрирован в Министерстве юстиции Республики Казахстан от 15 марта 2002 года N 1797. Утратил силу приказом Министра внутренних дел Республики Казахстан от 15 октября 2015 года № 842
title:
  rus: Об утверждении Инструкции по осуществлению подразделениями дорожной полиции государственного надзора и контроля за соблюдением правил, нормативов и стандартов в сфере дорожной деятельности и совершенствованию организации дорожного движения
  kaz: '"Жол полициясы бөлімшелерінің жол қызметі саласындағы ережелердің, нормативтердің және стандарттардың сақталуын мемлекеттік қадағалау мен бақылауды жүзеге асыруды және жол қозғалысын ұйымдастыруды жетілдіруі жөніндегі" нұсқаулықты бекіту туралы'
