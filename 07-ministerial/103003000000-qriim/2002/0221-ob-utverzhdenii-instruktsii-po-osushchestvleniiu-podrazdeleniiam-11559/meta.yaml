  title:
    rus: О внесении изменений и дополнений в некоторые приказы Министра внутренних дел Республики Казахстан по совершенствованию деятельности дорожной полиции
    kaz: Жол полициясының қызметін жетілдіру жөніндегі Қазақстан Республикасы Ішкі істер министрінің кейбір бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
