  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 21 февраля 2002 года № 103 "Об утверждении Инструкции по осуществлению подразделениями дорожной полиции государственного надзора и контроля за соблюдением правил, нормативов и стандартов в сфере дорожной деятельности и совершенствованию организации дорожного движения"
    kaz: '"Жол полициясы бөлімшелерінің жол қызметі саласындағы ережелердің, нормативтердің және стандарттардың сақталуын мемлекеттік қадағалау мен бақылауды жүзеге асыруды және жол қозғалысын ұйымдастыруды жетілдіруі жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2002 жылғы 21 ақпандағы № 103 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
