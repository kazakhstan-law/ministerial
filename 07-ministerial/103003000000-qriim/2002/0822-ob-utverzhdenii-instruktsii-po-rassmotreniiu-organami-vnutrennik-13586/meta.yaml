  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 23 августа 2002 года № 556 "Об утверждении Инструкции по рассмотрению органами внутренних дел Республики Казахстан вопросов, связанных с гражданством Республики Казахстан"
    kaz: '"Қазақстан Республикасы ішкі істер органдарының Қазақстан Республикасының азаматтығына байланысты мәселелерді қарау туралы Нұсқаулықты бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2002 жылғы 23 тамыздағы N 556 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
