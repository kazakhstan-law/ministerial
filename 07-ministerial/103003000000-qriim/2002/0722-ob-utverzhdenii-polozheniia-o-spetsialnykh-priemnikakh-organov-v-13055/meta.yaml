requisite: Приказ Министра внутренних дел Республики Казахстан от 23 июля 2002 года № 499. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 августа 2002 года № 1963. Утратил силу приказом Министра внутренних дел Республики Казахстан от 23 мая 2011 года № 232
