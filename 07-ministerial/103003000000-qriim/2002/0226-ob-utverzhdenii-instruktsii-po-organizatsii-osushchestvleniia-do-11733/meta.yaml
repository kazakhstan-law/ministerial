act_code: '11733'
requisite: Приказ Министра внутренних дел Республики Казахстан от 26 февраля 2002 года N 130. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 апреля 2002 года N 1811. Утратил силу приказом Министра внутренних дел Республики Казахстан от 15 мая 2006 года N 223
title:
  rus: Об утверждении Инструкции по организации осуществления дорожной полицией проверок выполнения юридическими лицами требований законодательства Республики Казахстан в сфере обеспечения безопасности дорожного движения
  kaz: Жол полициясының жол қозғалысы қауiпсiздiгiн қамтамасыз ету саласында заңды тұлғалардың Қазақстан Республикасы заңнамасының талаптарын орындауын тексерудi жүзеге асыруын ұйымдастыруы жөнiндегi нұсқаулықты бекiту туралы
