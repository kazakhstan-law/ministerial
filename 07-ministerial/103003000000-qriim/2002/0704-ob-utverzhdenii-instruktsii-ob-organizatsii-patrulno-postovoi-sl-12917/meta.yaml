    kaz: N 1938 болып тіркелген "Қазақстан Республикасы ішкі істер органдарының патрульді-бекеттік қызметінің қоғамдық тәртіп пен қауіпсіздікті қамтамасыз ету жөніндегі Тәртіпті бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2002 жылғы 5 шілдедегі N 475 бұйрығына өзгерістер мен толықтырулар енгізу туралы
