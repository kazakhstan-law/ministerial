  requisite: Приказ Министра внутренних дел Республики Казахстан от 23 августа 2006 года № 419. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 сентября 2006 года № 4395. Утратил силу приказом Министра внутренних дел Республики Казахстан от 28 октября 2013 года № 53 ДСП
  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан "Об утверждении Инструкции об организации патрульно-постовой службы органов внутренних дел Республики Казахстан по обеспечению охраны общественного порядка и безопасности" от 5 июля 2002 года № 475
    kaz: '"Қоғамдық тәртiптi сақтау және қауiпсiздiктi қамтамасыз ету бойынша Қазақстан Республикасы iшкi iстер органдарының патрульдi-бекеттiк қызметiн ұйымдастыру жөнiндегi Нұсқаулықты бекiту туралы" Қазақстан Республикасы Iшкi iстер министрiнiң 2002 жылғы 5 шiлдедегi № 475 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы'
