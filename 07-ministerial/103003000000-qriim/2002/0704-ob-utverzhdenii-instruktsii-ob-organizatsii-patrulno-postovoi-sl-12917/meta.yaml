title:
  rus: Об утверждении Инструкции об организации патрульно-постовой службы органов внутренних дел Республики Казахстан по обеспечению охраны общественного порядка и безопасности
  kaz: Қазақстан Республикасы iшкi iстер органдары патрульді-бекеттiк қызметiнiң қоғамдық тәртiпті сақтау және қауiпсiздiктi қамтамасыз ету жөнiндегi нұсқаулығын жариялау туралы
