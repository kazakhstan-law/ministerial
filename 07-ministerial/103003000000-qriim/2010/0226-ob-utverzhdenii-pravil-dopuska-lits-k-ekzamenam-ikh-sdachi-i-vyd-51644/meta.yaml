  title:
    rus: О внесении изменения в приказ Министра внутренних дел Республики Казахстан от 26 февраля 2010 года № 90 "Об утверждении Правил государственной регистрации и учета отдельных видов транспортных средств и Правил приема экзаменов и выдачи удостоверений на право управления отдельными видами транспортных средств"
    kaz: '"Көлік құралдарының жекелеген түрлерін мемлекеттік тіркеу және есепке алу ережесін және Көлік құралдарының жекелеген түрлерін басқару құқығына емтихандар қабылдау және куәліктер беру ережесін бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2010 жылғы 26 ақпандағы № 90 бұйрығына өзгеріс енгізу туралы'
