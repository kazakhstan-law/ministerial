act_code: '56161'
requisite: Приказ Министра внутренних дел Республики Казахстан от 29 ноября 2010 года № 496. Зарегистрирован в Министерстве юстиции Республики Казахстан от 15 декабря 2010 года № 6681. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 7 апреля 2022 года № 118 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил регистрации и рассмотрения ходатайства о присвоении статуса беженца
  kaz: Босқын мәртебесiн беру туралы өтiнiшхатты тiркеу мен қараудың қағидаларын бекіту туралы
