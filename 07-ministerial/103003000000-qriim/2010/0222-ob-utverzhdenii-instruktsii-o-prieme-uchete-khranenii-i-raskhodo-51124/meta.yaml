act_code: '51124'
requisite: Приказ Министра внутренних дел Республики Казахстан от 22 февраля 2010 года № 78. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 марта 2010 года № 6096. Утратил силу приказом Министра внутренних дел Республики Казахстан от 23 апреля 2015 года № 386
title:
  rus: Об утверждении Инструкции о приеме, учете, хранении и расходовании государственных регистрационных номерных знаков, водительских удостоверений и свидетельств о регистрации транспортных средств в подразделениях дорожной и специальной полиции органов внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы Ішкі істер органдарының жол және арнайы полиция бөліністерінде мемлекеттік тіркеу нөмірлік белгілерін, жүргізуші куәліктерін, көлік құралдарын тіркеу туралы куәліктерді қабылдау, есепке алу, сақтау және жұмсау туралы нұсқаулықты бекіту туралы
