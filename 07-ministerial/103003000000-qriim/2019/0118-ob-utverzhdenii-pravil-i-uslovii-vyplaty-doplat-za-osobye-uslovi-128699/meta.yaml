  title:
    rus: О внесении изменений и дополнения в приказ Министра внутренних дел Республики Казахстан от 18 января 2019 года № 36 «Об утверждении Правил и условий выплаты доплат за особые условия и надбавок за нахождение в режиме ожидания и постоянной готовности к выезду на аварийно-спасательные и неотложные работы»
    kaz: «Ерекше еңбек жағдайлары үшін қосымша ақы мен күту және авариялық-құтқару жұмыстары мен кезек күттірмейтін жұмыстарға аттануға ұдайы әзірлік режимiнде болғаны үшін үстемеақы төлеу қағидалары мен шарттары» Қазақстан Республикасы ішкі істер министрінің 2019 жылғы 18 қаңтардағы № 36 бұйрығына өзгерістер мен толықтырулар енгізу туралы
