title:
  rus: Об утверждении Правил и условий выплаты доплат за особые условия и за работу, связанную с рисками угрозы причинения вреда здоровью и жизни, а также надбавок за нахождение в режиме ожидания и постоянной готовности к выезду на аварийно-спасательные и неотложные работы
  kaz: Ерекше жағдайлар үшін және денсаулыққа және өмірге зиян келтіру қаупімен байланысты жұмыс үшін қосымша ақы төлеу қағидалары мен шарттарын, сондай-ақ күту режимінде болғаны және авариялық-құтқару және шұғыл жұмыстарға шығуға тұрақты дайындығы үшін үстемеақылар төлеу қағидалары мен шарттарын бекіту туралы
