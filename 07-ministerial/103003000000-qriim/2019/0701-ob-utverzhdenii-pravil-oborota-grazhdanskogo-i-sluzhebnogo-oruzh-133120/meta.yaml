  title:
    rus: О внесении изменений и дополнений в некоторые приказы Министра внутренних дел Республики Казахстан от 20 июня 2019 года № 562 «Об утверждении Правил безопасного обращения с гражданским и служебным оружием» и от 1 июля 2019 года № 602 «Об утверждении Правил оборота гражданского и служебного оружия и патронов к нему»
    kaz: Қазақстан Республикасы Ішкі істер министірінің «Азаматтық және қызметтік қаруды қауіпсіз ұстау қағидаларын бекіту туралы» 2019 жылғы 20 маусымдағы № 562 және «Азаматтық және қызметтік қару мен оның патрондарының айналымы қағидаларын бекіту туралы» 2019 жылғы 1 шілдедегі № 602 кейбір бұйрықтарына өзгерістер мен толықтырулар енгізу туралы»
