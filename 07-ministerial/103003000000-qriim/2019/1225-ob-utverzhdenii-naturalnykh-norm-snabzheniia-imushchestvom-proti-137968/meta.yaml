requisite: Приказ Министра внутренних дел Республики Казахстан от 25 декабря 2019 года № 1097. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 января 2020 года № 19841. Утратил силу приказом Министра внутренних дел Республики Казахстан от 7 октября 2025 года № 752 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм снабжения имуществом противопожарной защиты, оборудованием и инвентарным имуществом воинских частей и Военного института Национальной гвардии Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық ұланының әскери бөлімдерін және Әскери институтын өртке қарсы қорғау мүлкімен, жабдықпен және мүкәммалдық мүлікпен жабдықтаудың заттай нормаларын бекіту туралы
