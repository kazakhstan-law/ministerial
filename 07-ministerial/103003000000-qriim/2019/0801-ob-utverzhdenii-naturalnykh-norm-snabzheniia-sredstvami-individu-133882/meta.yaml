act_code: '133882'
requisite: Приказ Министра внутренних дел Республики Казахстан от 1 августа 2019 года № 669. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 августа 2019 года № 19211. Утратил силу приказом Министра внутренних дел Республики Казахстан от 7 октября 2025 года № 752 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм снабжения средствами индивидуальной бронезащиты, активной обороны, обеспечения специальных операций, инженерного вооружения, техническими средствами охраны, взрывчатыми веществами и средствами взрывания воинских частей и военных учебных заведений Национальной гвардии Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық ұланының әскери бөлімдері мен әскери оқу орындарын жеке броньды қорғау, белсенді қорғаныс, арнайы операцияларды қамтамасыз ету, инженерлік қару-жарақ құралдарымен, күзеттің техникалық құралдарымен, жарылғыш заттармен және жару құралдарымен жабдықтаудың заттай нормаларын бекіту туралы
