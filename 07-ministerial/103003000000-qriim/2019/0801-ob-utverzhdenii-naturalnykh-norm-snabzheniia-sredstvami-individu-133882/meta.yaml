  title:
    rus: О внесении изменения в приказ Министра внутренних дел Республики Казахстан от 1 августа 2019 года № 669 «Об утверждении натуральных норм снабжения средствами индивидуальной бронезащиты, активной обороны, обеспечения специальных операций, инженерного вооружения, техническими средствами охраны, взрывчатыми веществами и средствами взрывания воинских частей и военных учебных заведений Национальной гвардии Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық ұланының әскери бөлімдері мен әскери оқу орындарын жеке броньды қорғау, белсенді қорғаныс, арнайы операцияларды қамтамасыз ету, инженерлік қару-жарақ құралдарымен, күзеттің техникалық құралдарымен, жарылғыш заттармен және жару құралдарымен жабдықтаудың заттай нормаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2019 жылғы 1 тамыздағы № 669 бұйрығына өзгеріс енгізу туралы
