  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 28 октября 2019 года № 931 «Об утверждении Правил оказания платных видов деятельности по реализации услуг государственными учреждениями органов внутренних дел Республики Казахстан по оказанию медицинской помощи в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования и расходования ими денег от реализации услуг»
    kaz: «Қазақстан Республикасы ішкі істер органдары мемлекеттік мекемелерінің тегін медициналық көмектiң кепiлдiк берілген көлемi шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмек көрсету бойынша ақылы қызмет түрлерiн көрсетуі және олардың көрсетiлетiн қызметтердi өткiзуден түскен ақшаны жұмсауы қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2019 жылғы 28 қазандағы № 931 бұйрығына өзгерістер енгізу туралы
