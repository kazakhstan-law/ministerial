act_code: '135587'
requisite: Приказ Министра внутренних дел Республики Казахстан от 28 октября 2019 года № 931. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 октября 2019 года № 19519. Утратил силу приказом Министра внутренних дел Республики Казахстан от 29 мая 2025 года № 393 (водится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации услуг государственными учреждениями органов внутренних дел Республики Казахстан по оказанию медицинской помощи в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования и расходования ими денег от реализации услуг
  kaz: Қазақстан Республикасы ішкі істер органдары мемлекеттік мекемелерінің тегін медициналық көмектiң кепiлдiк берілген көлемi шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмек көрсету бойынша ақылы қызмет түрлерiн көрсетуі және олардың көрсетiлетiн қызметтердi өткiзуден түскен ақшаны жұмсауы қағидаларын бекіту туралы
