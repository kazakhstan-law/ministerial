  title:
    rus: О внесении изменений и дополнений в приказы Министра внутренних дел Республики Казахстан от 22 ноября 1999 года № 587 "Об утверждении Правил проведения государственного технического осмотра автомототранспортных средств и прицепов к ним" и от 12 октября 1998 года № 343 "Об утверждении Правил государственной регистрации транспортных средств и прицепов к ним в Республике Казахстан"
    kaz: '"Қазақстан Республикасы Ішкі істер министрінің "Қазақстан Республикасында автомотокөлік құралдары мен оларға тіркемелерді мемлекеттік техникалық байқауды жүргізудің тәртібін бекіту туралы" 1999 жылғы 22 қарашадағы № 587 және "Қазақстан Республикасында көлік құралдары мен олардың тіркемелерін мемлекеттік тіркеуден өткізу ережелерін бекіту туралы" 1998 жылғы 12 қазандағы № 343 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/26748/rus
