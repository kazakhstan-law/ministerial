    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде 1999 жылғы 3 желтоқсанда N 990 болып тiркелген "Автомотокөлiк құралдары мен оларға тiркемелерді мемлекеттiк техникалық байқауды жүргiзудiң тәртiбiн бекiту туралы" Қазақстан Республикасы Iшкi iстер министрiнiң 1999 жылғы 22 қарашадағы N 587 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы
