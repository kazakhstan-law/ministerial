act_code: '4731'
requisite: Приказ Министра внутренних дел Республики Казахстан от 22 ноября 1999 года N 587. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 декабря 1999 года N 990. Утратил силу приказом Министра внутренних дел Республики Казахстан от 8 июня 2006 года N 263
title:
  rus: Об утверждении Правил проведения государственного технического осмотра автомототранспортных средств и прицепов к ним
