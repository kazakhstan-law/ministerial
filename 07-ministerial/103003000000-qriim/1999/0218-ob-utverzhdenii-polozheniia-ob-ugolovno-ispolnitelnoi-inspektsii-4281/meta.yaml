act_code: '4281'
requisite: Приказ Министра внутренних дел Республики Казахстан от 18 февраля 1999 года № 89. Зарегистрирован в Министерстве юстиции Республики Казахстан 4.08.99г. за N 863. Утратил силу приказом Министра внутренних дел Республики Казахстан от 15 июля 2004 года № 417
title:
  rus: Об утверждении "Положения об уголовно-исполнительной инспекции органов внутренних дел Республики Казахстан" и "Инструкции о порядке исполнения наказаний в виде исправительных работ, лишения права занимать определенную должность или заниматься определенной деятельностью, а также осуществлении контроля за поведением условно осужденных, осужденных с отсрочкой отбывания наказания беременных женщин и женщин, имеющих малолетних детей"
  kaz: '"Қазақстан Республикасы ішкі істер органдарының қылмыстық-атқару инспекциясы туралы ережені" және "Түзеу жұмыстары, белгілі бір қызметті атқаруы немесе белгілі бір іс-әрекетпен шұғылдану құқығынан айыру түріндегі жазаларды атқару, сондай-ақ шартты сотталғандардың, жазасын өтеуі мерзімі кейінге қалдырылып сотталған жүкті әйелдер мен жас балалары бар әйелдердің мінез-құлқын бақылауды жүзеге асыру тәртібі туралы нұсқаулықты" бекіту туралы'
