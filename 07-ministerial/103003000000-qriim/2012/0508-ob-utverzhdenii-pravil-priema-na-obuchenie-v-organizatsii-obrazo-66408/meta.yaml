    kaz: '"Жоғары оқу орнынан кейінгі білім берудің кәсіптік оқу бағдарламаларын іске асыратын Қазақстан Республикасы Ішкі істер министрлігінің білім беру ұйымдарына оқуға қабылдау қағидаларын бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2012 жылғы 8 мамырдағы № 279 бұйрығына өзгерістер енгізу туралы'
