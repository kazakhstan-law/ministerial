act_code: '65410'
requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 29 февраля 2012 года № 117 и Министра здравоохранения Республики Казахстан от 27 февраля 2012 года № 115. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 мая 2012 года № 7616. Утратил силу приказом Министра внутренних дел Республики Казахстан от 19 августа 2014 года № 530
title:
  rus: Об утверждении Правил организации противотуберкулезной помощи лицам, содержащимся в учреждениях уголовно-исполнительной системы Министерства внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы Ішкі істер министрлігі қылмыстық-атқару жүйесі мекемелерінде ұсталатын адамдарға туберкулезге қарсы көмекті ұйымдастыру қағидасын бекіту туралы
