title:
  rus: Об утверждении натуральных норм снабжения вещевым имуществом военнослужащих Национальной гвардии Республики Казахстан, военно-следственных органов Министерства внутренних дел Республики Казахстан в мирное время
  kaz: Қазақстан Республикасы Ұлттық ұланының, Қазақстан Республикасы Ішкі істер министрлігі әскери-тергеу органдарының әскери қызметшілерін бейбіт уақытқа арналған заттай мүлікпен жабдықтаудың нормаларын бекіту туралы
