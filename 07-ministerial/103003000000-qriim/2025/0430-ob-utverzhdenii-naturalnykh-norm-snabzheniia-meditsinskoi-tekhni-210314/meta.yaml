act_code: '210314'
requisite: Приказ Министра внутренних дел Республики Казахстан от 30 апреля 2025 года № 344
title:
  rus: Об утверждении натуральных норм снабжения медицинской техникой, медикаментами, изделиями медицинского и ветеринарного назначения медицинских, военно-медицинских организаций, учреждений органов внутренних дел и организаций образования Министерства внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы ішкі істер органдарының медициналық, әскери-медициналық ұйымдарын, мекемелерін және Ішкі істер министрлігінің білім беру ұйымдарын медициналық техникамен, дәрі-дәрмектермен, медициналық және ветеринарлық мақсаттағы бұйымдармен жабдықтаудың заттай нормаларын бекіту туралы
