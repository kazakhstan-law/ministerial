act_code: '209540'
requisite: Приказ и.о. Министра внутренних дел Республики Казахстан от 15 апреля 2025 года № 294
title:
  rus: Об утверждении натуральных норм снабжения средствами индивидуальной бронезащиты, активной обороны, обеспечения специальных операций, инженерного вооружения, техническими средствами охраны, взрывчатыми веществами и средствами взрывания воинских частей и военных учебных заведений Национальной гвардии Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық ұланының әскери бөлімдері мен әскери оқу орындарын жеке броньды қорғау, белсенді қорғаныс, арнайы операцияларды қамтамасыз ету, инженерлік қару-жарақ құралдары-мен, техникалық күзет құралдарымен, жарылғыш заттармен және жару құралдарымен қамтамасыз етудің заттай нормаларын бекіту туралы
