  code: '217787'
  requisite: Приказ Министра внутренних дел Республики Казахстан от 20 ноября 2025 года № 934
  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра внутренних дел Республики Казахстан от 15 апреля 2025 года № 294 «Об утверждении натуральных норм снабжения средствами индивидуальной бронезащиты, активной обороны, обеспечения специальных операций, инженерного вооружения, техническими средствами охраны, взрывчатыми веществами и средствами взрывания воинских частей и военных учебных заведений Национальной гвардии Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық ұланының әскери бөлімдері мен әскери оқу орындарын жеке броньды қорғау, белсенді қорғаныс, арнайы операцияларды, инженерлік қару-жарақ құралдарымен қамтамасыз ету, күзеттің техникалық құралдарымен, жарылғыш заттармен және жару құралдарымен жабдықтаудың заттай нормаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің міндетін атқарушының 2025 жылғы 15 сәуірдегі № 294 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/217787/rus
