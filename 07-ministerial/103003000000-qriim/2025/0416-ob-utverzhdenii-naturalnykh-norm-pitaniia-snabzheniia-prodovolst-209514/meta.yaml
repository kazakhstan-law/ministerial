title:
  rus: Об утверждении натуральных норм питания, снабжения продовольствием, кормами, оборудованием, столово-кухонной посудой и техникой продовольственной службы Национальной гвардии Республики Казахстан на мирное время
  kaz: Қазақстан Республикасының Ұлттық ұланын тамақтандырудың, азық түлікпен, азықпен, жабдықпен, асханалық – ас үйлік ыдыспен және азық-түлік қызметінің техникасымен жабдықтаудың бейбіт уақытқа арналған заттай нормаларын бекіту туралы
