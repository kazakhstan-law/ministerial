act_code: '210885'
requisite: Приказ Министра внутренних дел Республики Казахстан от 29 мая 2025 года № 393. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 мая 2025 года № 36174
title:
  rus: Об утверждении Правил осуществления платных видов деятельности по реализации услуг государственными учреждениями органов внутренних дел Республики Казахстан по оказанию медицинской помощи в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования, деньги от реализации которых остаются в их распоряжении, использования денег от реализации услуг, остающихся в их распоряжении
  kaz: Өткізуден түскен ақша өз иелігінде қалатын Қазақстан Республикасы ішкі істер органдары мемлекеттік мекемелерінің тегін медициналық көмектiң кепiлдiк берілген көлемi шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмек көрсету бойынша қызметтерді өткізуі бойынша ақылы қызмет түрлерiн жүзеге асыру, өткізуінен түскен, өз иелігінде қалатын ақшаны пайдалану қағидаларын бекіту туралы
