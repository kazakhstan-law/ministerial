requisite: Приказ Министра внутренних дел Республики Казахстан от 4 июля 2025 года № 493. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 июля 2025 года № 36418
title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача санитарно-эпидемиологического заключения о соответствии объекта высокой эпидемической значимости нормативным правовым актам в сфере санитарно-эпидемиологического благополучия населения на объектах органов внутренних дел Республики Казахстан»
  kaz: «Қазақстан Республикасы ішкі істер органдарының объектілерінде халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы нормативтік-құқықтық актілерге жоғары эпидемиялық маңызы бар объектінің сәйкестігі туралы санитариялық-эпидемиологиялық қорытынды беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы
