title:
  rus: Об утверждении натуральных норм снабжения средствами связи, организационной техникой, программным обеспечением, аппаратными и программными средствами защиты информации подразделений органов внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы ішкі істер органдарының бөліністерін байланыс құралдарымен, ұйымдық техникамен, бағдарламалық қамтылыммен, ақпаратты қорғаудың аппараттық және бағдарламалық құралдарымен жабдықтаудың заттай нормаларын бекіту туралы
