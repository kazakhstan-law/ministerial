  title:
    rus: О внесении изменения в приказ Министра внутренних дел Республики Казахстан от 20 мая 2025 года № 378 «Об утверждении натуральных норм снабжения средствами связи, организационной техникой, программным обеспечением, аппаратными и программными средствами защиты информации подразделений органов внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасы ішкі істер органдарының бөлімшелерін байланыс құралдарымен, ұйымдастыру техникасымен, бағдарламалық қамтамасыз етумен, ақпаратты қорғаудың аппараттық және бағдарламалық құралдарымен жабдықтаудың заттай нормаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2025 жылғы 20 мамырдағы № 378 бұйрығына өзгерістер енгізу туралы
