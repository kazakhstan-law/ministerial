  title:
    rus: О внесении изменения в приказ Министра внутренних дел Республики Казахстан от 22 апреля 2025 года № 321 «Об утверждении натуральных норм индивидуального рациона питания сотрудников подразделений специального назначения, продовольствия, оборудования, столово-кухонного инвентаря организаций образования и лечебных учреждений, служебных животных Министерства внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасы Ішкі істер министрлігінің арнайы мақсаттағы бөліністері қызметкерлерін тамақтандырудың жеке рационының, білім беру ұйымдары мен емдеу мекемелерінің, қызметтік жануарларының азық-түлігінің, жабдығының, асханалық-ас үй мүкәммалының заттай нормаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2025 жылғы 22 сәуірдегі № 321 бұйрығына өзгерістер енгізу туралы
