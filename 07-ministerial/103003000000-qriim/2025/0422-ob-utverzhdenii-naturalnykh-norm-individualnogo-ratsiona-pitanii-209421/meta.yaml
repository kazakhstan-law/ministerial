act_code: '209421'
requisite: Приказ Министра внутренних дел Республики Казахстан от 22 апреля 2025 года № 321
title:
  rus: Об утверждении натуральных норм индивидуального рациона питания сотрудников подразделений специального назначения, продовольствия, оборудования, столово-кухонного инвентаря организаций образования и лечебных учреждений, служебных животных Министерства внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы Ішкі істер министрлігінің арнайы мақсаттағы бөліністері қызметкерлерін тамақтандырудың жеке рационының, білім беру ұйымдары мен емдеу мекемелерінің, қызметтік жануарларының азық-түлігінің, жабдығының, асханалық-ас үй мүкәммалының заттай нормаларын бекіту туралы
