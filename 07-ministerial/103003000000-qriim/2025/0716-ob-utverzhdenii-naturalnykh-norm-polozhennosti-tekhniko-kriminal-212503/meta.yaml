requisite: Приказ и.о. Министра внутренних дел Республики Казахстан от 16 июля 2025 года № 528
title:
  rus: Об утверждении натуральных норм положенности технико-криминалистическими средствами, оборудованием, реактивами и расходными материалами оперативно-криминалистических подразделений и организаций образования Министерства внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы Ішкі істер министрлігінің жедел-криминалистикалық бөліністері мен білім беру ұйымдарына техникалық-криминалистикалық құралдардың, құрал-жабдықтардың, реактивтердің және шығыс материалдарының тиесілік заттай нормаларын бекіту туралы
