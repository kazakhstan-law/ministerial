title:
  rus: Об утверждении Правил обеспечения бесплатным проездом, а также продуктами питания или деньгами на путь следования лиц, освобождаемых от отбывания наказания в виде ареста или лишения свободы, к избранному ими месту жительства или работы
  kaz: Қамаққа алу немесе бас бостандығынан айыру түріндегі жазаны өтеуден босатылатын адамдарды өздері таңдаған тұрғылықты жеріне немесе жұмыс орнына бару жолында тегін жол жүрумен, сондай-ақ тамақ өнімдерімен немесе ақшамен қамтамасыз ету қағидаларын бекіту туралы
