act_code: '170149'
requisite: Приказ и.о. Министра внутренних дел Республики Казахстан от 26 июля 2022 года № 88 дсп
title:
  rus: Об утверждении Правил установления надбавок к должностным окладам сотрудников административной полиции органов внутренних дел, содержащейся за счет областных бюджетов и бюджетов городов республиканского значения, столицы Республики Казахстан
  kaz: Қазақстан Республикасы облыстық бюджеттерінің және республикалық маңызы бар қалаларының, астананың бюджеттерінің есебінен ұсталатын ішкі істер органдарының әкімшілік полициясы қызметкерлерінің лауазымдық жалақыларына үстемеақылар белгілеу қағидаларын бекіту туралы
