  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра внутренних дел Республики Казахстан от 27 июня 2017 года № 452 «Об утверждении регламента государственной услуги «Прием и согласование приглашений принимающих лиц по выдаче виз Республики Казахстан»
    kaz: «Қазақстан Республикасының визаларын беру бойынша қабылдаушы тұлғалардың шақыруларын қабылдау және келісу» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің міндетін атқарушының 2017 жылғы 27 маусымдағы № 452 бұйрығына өзгерістер енгізу туралы
