  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 20 октября 2017 года № 147 дсп «Об утверждении Правил и условий прохождения компьютерного тестирования сотрудника, подлежащего аттестации, на знание законодательства Республики Казахстан и логическое мышление, нормативы по определению профессиональной пригодности, а также пороговые значения для категорий должностей»
    kaz: «Аттестаттауға жататын қызметкердің Қазақстан Республикасының заңнамасын білуін және логикалық ойлау қабілетін компьютерлік тестілеуден өткізу қағидалары мен шарттарын, кәсіби жарамдылығын айқындау жөніндегі нормативтерді, сондай-ақ лауазымдар санаттары үшін шекті мәндерді бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2017 жылғы 20 қазандағы № 147 қбпү бұйрығына өзгерістер енгізу туралы
