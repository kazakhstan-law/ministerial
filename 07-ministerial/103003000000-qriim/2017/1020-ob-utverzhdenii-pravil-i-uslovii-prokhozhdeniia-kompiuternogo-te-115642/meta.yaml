title:
  rus: Об утверждении Правил и условий прохождения компьютерного тестирования сотрудника, подлежащего аттестации, на знание законодательства Республики Казахстан и логическое мышление, нормативы по определению профессиональной пригодности, а также пороговые значения для категорий должностей
  kaz: Аттестаттауға жатқызылған қызметкердің Қазақстан Республикасы заңнамасын білуін және логикалық ойлау қабілетін компьютерлік тестілеуден өткізудің қағидалары мен шарттары, кәсіби жарамдылығын айқындау жөніндегі нормативтер, сондай-ақ лауазымдардың санаттары үшін шекті мәндерді бекіту туралы
