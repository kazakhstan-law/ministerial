  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 20 октября 2017 года № 147 дсп «Об утверждении Правил и условий прохождения компьютерного тестирования сотрудника, подлежащего аттестации, на знание законодательства Республики Казахстан и логическое мышление, нормативы по определению профессиональной пригодности, а также пороговые значения для категорий должностей»
    kaz: «Аттестаттауға жататын ішкі істер органдары қызметкерлерінің Қазақстан Республикасының заңнамасын білуін және логикалық ойлау қабілетіне компьютерлік тестілеуден өткізу қағидалары мен шарттары, кәсіби жарамдылығын айқындау жөніндегі нормативтер, сондай-ақ лауазымдар санаттары үшін шекті мәндерді бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2017 жылғы 20 қазандағы № 147 қбпү бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/194829/rus
