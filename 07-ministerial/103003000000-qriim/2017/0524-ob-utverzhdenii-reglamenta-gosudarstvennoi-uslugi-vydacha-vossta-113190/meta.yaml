act_code: '113190'
requisite: Приказ и.о. Министра внутренних дел Республики Казахстан от 24 мая 2017 года № 356. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 июня 2017 года № 15268. Утратил силу приказом Министра внутренних дел Республики Казахстан от 14 июля 2020 года № 514 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача, восстановление или продление на территории Республики Казахстан иностранцам и лицам без гражданства виз на право выезда из Республики Казахстан и въезда в Республику Казахстан»
  kaz: «Шетелдіктер мен азаматтығы жоқ адамдардың Қазақстан Республикасына келу және Қазақстан Республикасынан кету құқығына Қазақстан Республикасының аумағында визаны беру, қалпына келтіру және ұзарту» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
