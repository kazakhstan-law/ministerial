  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра внутренних дел Республики Казахстан от 24 мая 2017 года № 356 «Об утверждении регламента государственной услуги «Продление и выдача выездных виз»
    kaz: «Шығу визаларын ұзарту және беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің міндетін атқарушының 2017 жылғы 24 мамырдағы № 356 бұйрығына өзгерістер мен толықтыру енгізу туралы
