act_code: '111901'
requisite: Приказ Министра внутренних дел Республики Казахстан от 13 марта 2017 года № 180. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 апреля 2017 года № 15042. Утратил силу приказом Министра внутренних дел Республики Казахстан от 14 июля 2020 года № 514 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Выдача, восстановление или продление на территории Республики Казахстан иностранцам и лицам без гражданства виз на право выезда из Республики Казахстан и въезда в Республику Казахстан»
  kaz: «Шетелдіктер мен азаматтығы жоқ адамдардың Қазақстан Республикасына келу және Қазақстан Республикасынан кету құқығына Қазақстан Республикасының аумағында визаны беру, қалпына келтіру және ұзарту» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
