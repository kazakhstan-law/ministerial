  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 13 марта 2017 года № 180 «Об утверждении стандарта государственной услуги «Продление и выдача выездных виз»
    kaz: «Шығу визаларын ұзарту және беру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2017 жылғы 13 наурыздағы № 180 бұйрығына өзгерістер енгізу туралы
