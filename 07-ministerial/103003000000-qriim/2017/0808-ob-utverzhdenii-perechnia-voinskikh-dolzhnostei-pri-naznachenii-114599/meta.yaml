title:
  rus: Об утверждении перечня воинских должностей, при назначении на которые в отношении военнослужащих и лиц гражданского персонала проводится проверка с применением психофизиологического и полиграфологического исследований
  kaz: Тағайындау кезінде әскери қызметшілер мен азаматтық персонал адамдарына қатысты психологиялық-физиологиялық және полиграфологиялық зерттеулер қолданыла отырып, тексеру жүргізілетін әскери лауазымдар тізбесін бекіту туралы
