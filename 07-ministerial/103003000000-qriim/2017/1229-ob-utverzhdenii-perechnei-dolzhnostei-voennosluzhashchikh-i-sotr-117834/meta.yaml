act_code: '117834'
requisite: Приказ Министра внутренних дел Республики Казахстан от 29 декабря 2017 года № 179 дсп. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 января 2018 года № 16236
title:
  rus: Об утверждении Перечней должностей военнослужащих и сотрудников подразделений специального назначения Национальной гвардии и органов внутренних дел Республики Казахстан, функции которых связаны с непосредственным участием в пресечении и локализации актов экстремизма и терроризма, массовых беспорядков и других особо опасных преступлений, а также должностей сотрудников и военнослужащих органов внутренних дел Республики Казахстан, которым устанавливаются надбавки за особые условия прохождения службы
  kaz: Қазақстан Республикасы Ұлттық ұланының және ішкі істер органдарының арнайы мақсаттағы бөлімшелерінің әскери қызметшілерінің және қызметкерлерінің функциялары экстремизм мен терроризм актілерін, жаппай тәртіпсіздіктер және басқа да аса қауіпті қылмыстардың жолын кесуге және оқшаулауға тікелей қатысуымен байланысты лауазымдар, сондай-ақ Қазақстан Республикасы ішкі істер органдарының қызмет өткерудің ерекше жағдайлары үшін үстемеақылар белгіленетін қызметкерлері мен әскери қызметшілерінің лауазымдар тізбелерін бекіту туралы
