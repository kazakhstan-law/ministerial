    kaz: «Әскери қызметшілерге өз мүлкін Қазақстан Республикасының шегінде тасымалдағаны үшін ақша төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2017 жылғы 17 тамыздағы № 563 бұйрығына өзгерістер енгізу туралы
