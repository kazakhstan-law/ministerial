title:
  rus: Об утверждении Правил выплаты военнослужащим органов внутренних дел денег за счет государства за перевозку собственного имущества в пределах Республики Казахстан
  kaz: Ішкі істер органдарының әскери қызметшілеріне өз мүлкін Қазақстан Республикасының шегінде тасымалдағаны үшін мемлекет есебінен ақша төлеу қағидаларын бекіту туралы
