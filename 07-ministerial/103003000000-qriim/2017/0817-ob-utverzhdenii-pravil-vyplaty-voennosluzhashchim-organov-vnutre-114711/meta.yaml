  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 17 августа 2017 года № 563 «Об утверждении Правил возмещения военнослужащим расходов на внутриреспубликанские перевозки собственного имущества на железнодорожном, автомобильном и внутреннем водном транспорте»
    kaz: «Әскери қызметшілерге өз мүлкін теміржол, автомобиль және ішкі су көлігімен республикашілік тасымалдауға шығыстарды өтеу қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2017 жылғы 17 тамыздағы № 563 бұйрығына өзгерістер енгізу туралы
