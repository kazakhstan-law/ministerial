title:
  rus: О признании утратившим силу приказа Министра внутренних дел Республики Казахстан от 6 ноября 2003 года № 619 «Об утверждении Инструкции по обеспечению общественного порядка и пожарной безопасности при проведении спортивных, культурных и иных массовых мероприятий»
  kaz: «Спорттық, мәдени және өзге де бұқаралық іс-шаралар өткізу кезінде қоғамдық тәртіп пен өрт қауіпсіздігін қамтамасыз ету жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2003 жылғы № 619 бұйрығының күші жойылсын
