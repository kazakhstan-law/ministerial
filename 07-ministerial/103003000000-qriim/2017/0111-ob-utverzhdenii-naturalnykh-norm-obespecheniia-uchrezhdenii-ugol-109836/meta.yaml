  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 11 января 2017 года № 12 дсп «Об утверждении Натуральных норм обеспечения учреждений уголовно-исполнительной системы и баз военного и специального снабжения Министерства внутренних дел Республики Казахстан инженерно-техническими средствами надзора, контроля и охраны»
    kaz: «Қазақстан Республикасы Ішкі істер министрлігінің қылмыстық-атқару жүйесінің мекемелерін және әскери мен арнайы жабдықтау базаларын инженерлік-техникалық қадағалау, бақылау және күзет құралдарымен қамтамасыз ету заттай нормаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2017 жылғы 11 қаңтардағы № 12 қбпү бұйрығына өзгерістер мен толықтырулар енгізу туралы
