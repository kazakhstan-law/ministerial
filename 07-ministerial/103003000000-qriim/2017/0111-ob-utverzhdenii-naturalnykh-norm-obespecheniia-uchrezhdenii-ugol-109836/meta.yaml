title:
  rus: Об утверждении Натуральных норм обеспечения учреждений уголовно-исполнительной системы и баз военного и специального снабжения Министерства внутренних дел Республики Казахстан инженерно-техническими средствами надзора, контроля и охраны
  kaz: Қазақстан Республикасы Ішкі істер министрлігінің қылмыстық-атқару жүйесінің мекемелерін және әскери мен арнайы жабдықтау базаларын инженерлік-техникалық қадағалау, бақылау және күзет құралдарымен қамтамасыз ету заттай нормаларын бекіту туралы
