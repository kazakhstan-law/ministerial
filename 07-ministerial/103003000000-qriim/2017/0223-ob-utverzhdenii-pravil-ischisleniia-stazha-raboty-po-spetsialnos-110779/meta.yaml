title:
  rus: Об утверждении Правил исчисления стажа работы по специальности для гражданских служащих, работников государственных учреждений органов внутренних дел Республики Казахстан и условий установления рабочим надбавки за выслугу лет
  kaz: Қазақстан Республикасы ішкі істер органдары мемлекеттік мекемелерінің азаматтық қызметшілері, қызметкерлері үшін мамандығы бойынша жұмыс өтілін есептеу қағидаларын және жұмысшыларға еңбек сіңірген жылдары үшін үстемеақы белгілеу шарттарын бекіту туралы
