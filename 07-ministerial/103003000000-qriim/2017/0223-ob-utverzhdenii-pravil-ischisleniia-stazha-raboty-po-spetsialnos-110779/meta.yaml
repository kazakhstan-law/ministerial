  title:
    rus: О внесении изменения в приказ Министра внутренних дел Республики Казахстан от 23 февраля 2017 года № 135 «Об утверждении Правил исчисления стажа работы по специальности для гражданских служащих, работников государственных учреждений органов внутренних дел Республики Казахстан и условий установления рабочим надбавки за выслугу лет»
    kaz: «Қазақстан Республикасы ішкі істер органдары мемлекеттік мекемелерінің азаматтық қызметшілері, қызметкерлері үшін мамандығы бойынша жұмыс өтілін есептеу қағидаларын және жұмысшыларға еңбек сіңірген жылдары үшін үстемеақы белгілеу шарттарын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2017 жылғы 23 ақпандағы № 135 бұйрығына өзгеріс енгізу туралы
