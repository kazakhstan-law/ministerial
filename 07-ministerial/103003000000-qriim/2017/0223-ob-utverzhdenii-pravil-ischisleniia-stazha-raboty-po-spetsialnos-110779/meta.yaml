  title:
    rus: О внесении изменений в приказы Министра внутренних дел Республики Казахстан от 23 февраля 2017 года № 135 «Об утверждении Правил исчисления стажа работы по специальности для гражданских служащих, работников государственных учреждений органов внутренних дел Республики Казахстан и условий установления рабочим надбавки за выслугу лет» и от 1 апреля 2021 года № 190 «Об утверждении Инструкции о приеме на службу в органы внутренних дел, назначении на должность, перемещении, выдвижении по службе, предоставлении отпусков, присвоении специальных званий, увольнении и откомандировании»
    kaz: Қазақстан Республикасы Ішкі істер министрінің «Қазақстан Республикасы ішкі істер органдары мемлекеттік мекемелерінің азаматтық қызметшілері, қызметкерлері үшін мамандығы бойынша жұмыс өтілін есептеу қағидаларын және жұмысшыларға еңбек сіңірген жылдары үшін үстемеақы белгілеу шарттарын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2017 жылғы 23 ақпандағы № 135 бұйрығына және «Ішкі істер органдарына қызметке қабылдау, лауазымға тағайындау, қызмет бабында ауыстыру және жоғарылату, демалыстар беру, арнаулы атақтарды беру, жұмыстан шығару және іссапарға жіберу жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2021 жылғы 1 сәуірдегі № 190 бұйрығына өзгерістер енгізу туралы
