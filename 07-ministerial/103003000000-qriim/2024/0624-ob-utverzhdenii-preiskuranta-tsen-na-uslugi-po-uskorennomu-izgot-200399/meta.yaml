act_code: '200399'
requisite: Приказ Министра внутренних дел Республики Казахстан от 24 июня 2024 года № 516
title:
  rus: Об утверждении прейскуранта цен на услуги по ускоренному изготовлению и выдаче дубликатов государственных регистрационных номерных знаков и государственных регистрационных номерных знаков повышенного спроса, оказываемые республиканским государственным предприятием на праве хозяйственного ведения «Информационно-производственный центр» Министерства внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы Ішкі істер министрлігінің «Ақпараттық-өндірістік орталығы» шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорын көрсететін мемлекеттік тіркеу нөмірлік белгілерінің телнұсқасын және жоғары сұранысқа ие мемлекеттік тіркеу нөмірлік белгілерін жеделдетіп дайындау және беру жөніндегі қызметтерге бағалар прейскурантын бекіту туралы
