act_code: '204491'
requisite: Приказ Министра внутренних дел Республики Казахстан от 11 декабря 2024 года № 280дсп
title:
  rus: Об утверждении Правил установления надбавок к должностным окладам сотрудников административной полиции органов внутренних дел, содержащихся за счет областных бюджетов и бюджетов городов республиканского значения, столицы
  kaz: Облыстық бюджеттерінің және республикалық маңызы бар қалаларының, астананың бюджеттерінің есебінен ұсталатын ішкі істер органдарының әкімшілік полициясы қызметкерлерінің лауазымдық жалақыларына үстемеақылар белгілеу қағидаларын бекіту туралы
