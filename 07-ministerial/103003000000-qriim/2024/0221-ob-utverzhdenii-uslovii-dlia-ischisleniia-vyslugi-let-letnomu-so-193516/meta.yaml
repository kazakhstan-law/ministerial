act_code: '193516'
requisite: Приказ Министра внутренних дел Республики Казахстан от 21 февраля 2024 года № 151. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 февраля 2024 года № 34025
title:
  rus: Об утверждении условий для исчисления выслуги лет летному составу внутренних войск, Национальной гвардии Республики Казахстан и органов внутренних дел Республики Казахстан на льготных условиях при назначении пенсионных выплат и перечня подразделений и должностей военнослужащих внутренних войск, Национальной гвардии Республики Казахстан и сотрудников органов внутренних дел Республики Казахстан, служба в которых подлежит зачету в выслугу лет для назначения пенсионных выплат за выслугу лет на льготных условиях один месяц службы за полтора месяца
  kaz: Ішкі әскерлер, Қазақстан Республикасы Ұлттық ұланының және Қазақстан Республикасы ішкі істер органдарының ұшқыштар құрамына зейнетақы төлемдерін тағайындау кезінде жеңілдік жағдайларында еңбек сіңірген жылдарын есептеу шарттарын және Ішкі әскерлер, Қазақстан Республикасының Ұлттық ұланы әскери қызметшілерінің және Қазақстан Республикасының ішкі істер органдары қызметкерлерінің олардағы бір ай қызметі бір жарым ай жеңілдік жағдайларында еңбек сіңірген жылдары үшін зейнетақы төлемдерін тағайындау үшін еңбек сіңірген жылдарына есептелуге жататын бөліністер мен лауазымдар тізбесін бекіту туралы
