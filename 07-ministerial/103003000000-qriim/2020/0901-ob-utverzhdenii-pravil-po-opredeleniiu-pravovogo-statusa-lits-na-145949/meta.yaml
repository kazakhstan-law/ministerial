  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 1 сентября 2020 года № 607 «Об утверждении Правил по определению правового статуса лиц, находящихся на территории Республики Казахстан, не являющихся гражданами Республики Казахстан и не имеющих доказательства своей принадлежности к гражданству иного государства»
    kaz: «Қазақстан Республикасының аумағында жүрген, Қазақстан Республикасының азаматтары болып табылмайтын және өзінің өзге мемлекеттің азаматтығына жататындығына дәлелдемелері жоқ адамдардың құқықтық мәртебесін анықтау жөніндегі қағидаларды бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2020 жылғы 1 қыркүйектегі № 607 бұйрығына өзгерістер енгізу туралы
