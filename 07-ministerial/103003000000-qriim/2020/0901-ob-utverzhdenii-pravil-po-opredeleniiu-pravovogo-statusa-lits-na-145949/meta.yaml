  kaz: Қазақстан Республикасының аумағында жүрген, Қазақстан Республикасының азаматтары болып табылмайтын және өзінің өзге мемлекеттің азаматтығына жататындығына дәлелдемелері жоқ адамдардың құқықтық мәртебесін анықтау жөніндегі қағидаларды бекіту туралы
