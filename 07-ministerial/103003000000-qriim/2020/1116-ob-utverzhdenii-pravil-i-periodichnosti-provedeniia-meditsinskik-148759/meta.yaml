title:
  rus: Об утверждении Правил и периодичности проведения медицинских осмотров сотрудников правоохранительных органов и военнослужащих органов внутренних дел в военно-медицинских (медицинских) подразделениях (организациях) органов внутренних дел Республики Казахстан
  kaz: Құқық қорғау органдарының қызметкерлерін және ішкі істер органдарының әскери қызметшілерін Қазақстан Республикасы ішкі істер органдарының әскери-медициналық (медициналық) бөліністерінде (ұйымдарында) медициналық қарап-тексеру жүргізу қағидалары мен мерзімділігін бекіту туралы
