title:
  rus: Об утверждении Инструкции по организации учета и списания военного имущества Национальной гвардии Республики Казахстан, военно-следственных органов Министерства внутренних дел Республики Казахстан, в оперативном управлении которых находится военное имущество
  kaz: Қазақстан Республикасы Ұлттық ұланының және Қазақстан Республикасы Ішкі істер министрлігі әскери-тергеу органдарының жедел басқаруында тұрған әскери мүлікті есепке алуды және есептен шығаруды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
