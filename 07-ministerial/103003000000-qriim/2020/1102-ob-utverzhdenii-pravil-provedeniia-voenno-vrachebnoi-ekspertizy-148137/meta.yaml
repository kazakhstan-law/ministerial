title:
  rus: Об утверждении Правил проведения военно-врачебной экспертизы в правоохранительных органах, органах гражданской защиты и Государственной фельдъегерской службе Республики Казахстан и Положения о комиссиях военно-врачебной экспертизы в органах внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасының құқық қорғау органдарында, азаматтық қорғау органдары мен Мемлекеттік фельдъегерлік қызметінде әскери-дәрігерлік сараптама жүргізу қағидаларын және Қазақстан Республикасының ішкі істер органдарындағы әскери-дәрігерлік сараптама комиссиялары туралы ережені бекіту туралы
