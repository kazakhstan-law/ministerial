  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 2 ноября 2020 года № 758 «Об утверждении Правил проведения военно-врачебной экспертизы в правоохранительных органах и Государственной фельдъегерской службе Республики Казахстан и Положения о комиссиях военно-врачебной экспертизы в органах внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасының құқық қорғау органдары мен Мемлекеттік фельдъегерлік қызметінде әскери-дәрігерлік сараптама жүргізу қағидаларын және Қазақстан Республикасының ішкі істер органдарындағы әскери-дәрігерлік сараптама комиссиялары туралы ережені бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2020 жылғы 2 қарашадағы № 758 бұйрығына өзгерістер мен толықтырулар енгізу туралы
