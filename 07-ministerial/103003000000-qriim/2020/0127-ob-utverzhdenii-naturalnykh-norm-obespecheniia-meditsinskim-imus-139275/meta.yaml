requisite: Приказ Министра внутренних дел Республики Казахстан от 27 января 2020 года № 54. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 января 2020 года № 19964. Утратил силу приказом Министра внутренних дел Республики Казахстан от 7 октября 2025 года № 752 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм обеспечения медицинским имуществом воинских частей и Академии Национальной гвардии Республики Казахстан на мирное время
