  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 27 января 2020 года № 54 «Об утверждении натуральных норм обеспечения медицинским имуществом воинских частей и Военного института Национальной гвардии Республики Казахстан на мирное время»
    kaz: «Қазақстан Республикасы Ұлттық ұланының әскери бөлімдерін және Әскери институтын медициналық мүлікпен қамтамасыз етудің бейбіт уақытқа арналған заттай нормаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2020 жылғы 27 қаңтардағы № 54 бұйрығына өзгерістер мен толықтырулар енгізу туралы
