    kaz: «Ішкі істер органдарына кіретін адамдар үшін алғашқы кәсіптік даярлыққа іріктеу қағидаларын және одан өту шарттарын, сондай-ақ оларды алғашқы кәсіптік даярлықтан шығару негіздерін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2020 жылғы 13 наурыздағы № 211 бұйрығына өзгеріс енгізу туралы
