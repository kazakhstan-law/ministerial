title:
  rus: Об утверждении Правил отбора на первоначальную профессиональную подготовку и условий ее прохождения для лиц, поступающих в органы внутренних дел, а также оснований их отчисления от первоначальной профессиональной подготовки
  kaz: Ішкі істер органдарына кіретін адамдар үшін алғашқы кәсіптік даярлыққа іріктеу қағидаларын және одан өту шарттарын, сондай-ақ оларды алғашқы кәсіптік даярлықтан шығару негіздерін бекіту туралы
