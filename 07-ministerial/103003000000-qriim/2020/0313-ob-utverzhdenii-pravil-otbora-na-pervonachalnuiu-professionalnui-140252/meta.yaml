  title:
    rus: О внесении изменений и дополнения в приказ Министра внутренних дел Республики Казахстан от 13 марта 2020 года № 211 «Об утверждении Правил отбора на первоначальную профессиональную подготовку и условия ее прохождения для лиц, поступающих в органы внутренних дел, а также основания их отчисления от первоначальной профессиональной подготовки»
    kaz: «Ішкі істер органдарына қабылданатын адамдар үшін алғашқы кәсіптік даярлыққа іріктеу қағидаларын және одан өту шарттарын, сондай-ақ оларды алғашқы кәсіптік даярлықтан шығару негіздерін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2020 жылғы 13 наурыздағы № 211 бұйрығына өзгерістер мен толықтыру енгізу туралы
