act_code: '139456'
requisite: Приказ Министра внутренних дел Республики Казахстан от 6 февраля 2020 года № 94. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 февраля 2020 года № 20016. Утратил силу приказом Министра внутренних дел Республики Казахстан от 27 мая 2024 года № 434 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по назначению и осуществлению пенсионных выплат за выслугу лет военнослужащим и сотрудникам, проходившим службу в органах внутренних дел, гражданской защиты, государственной фельдъегерской службе, а также лицам, права которых иметь специальные звания, классные чины и носить форменную одежду упразднены с 1 января 2012 года и лицам, медицинские должности которых сокращены в органах внутренних дел Республики Казахстан с 1 июля 2022 года и 1 января 2023 года, имевшим на момент сокращения должности выслугу лет не менее двенадцати лет и шести месяцев непрерывной воинской службы, службы в специальных государственных и правоохранительных органах, государственной фельдъегерской службе, при условии продолжения ими работы в медицинских организациях, расположенных в следственных изоляторах и учреждениях уголовно-исполнительной (пенитенциарной) системы
  kaz: Әскери қызметшiлерге және ішкі істер органдарында, азаматтық қорғау, мемлекеттік фельдъегерлік қызметте қызмет өткерген қызметкерлерге, сондай-ақ арнаулы атақтар, сыныптық шендер алу және нысанды киiм киiп жүру құқықтары 2012 жылғы 1 қаңтардан бастап жойылған адамдарға және Қазақстан Республикасының ішкі істер органдарындағы медициналық лауазымдары 2022 жылғы 1 шілдеден және 2023 жылғы 1 қаңтардан бастап қысқартылған, лауазымы қысқартылған кезде еңбек сіңірген жылдары үзіліссіз әскери қызметте, арнаулы мемлекеттік және құқық қорғау органдарындағы қызметте, мемлекеттік фельдъегерлік қызметте кемінде он екі жыл және алты ай болған адамдар қылмыстық-атқару (пенитенциарлық) жүйесінің тергеу изоляторлары мен мекемелерінде орналасқан медициналық ұйымдарда жұмысын жалғастырған жағдайда, осындай адамдарға еңбек сіңірген жылдары үшін зейнетақы төлемдерiн тағайындау және жүзеге асыру жөніндегі нұсқаулықты бекіту туралы
