requisite: Приказ Министра внутренних дел Республики Казахстан от 15 января 2020 года № 20. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 января 2020 года № 19903. Утратил силу приказом Министра внутренних дел Республики Казахстан от 28 мая 2025 года № 392 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм оснащения органов внутренних дел Республики Казахстан техническими средствами нейтрализации беспилотных летательных аппаратов
  kaz: Қазақстан Республикасы ішкі істер органдарын пилотсыз ұшу аппараттарын жоюдың техникалық құралдарымен қамтамасыз ету заттай нормаларын бекіту туралы
