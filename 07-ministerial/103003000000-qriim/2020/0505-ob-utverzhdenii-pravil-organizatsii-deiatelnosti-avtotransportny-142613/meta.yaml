title:
  rus: Об утверждении Правил организации деятельности автотранспортных подразделений органов внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы ішкі істер органдарының автокөлік бөліністерінің қызметін ұйымдастыру қағидаларын бекіту туралы
