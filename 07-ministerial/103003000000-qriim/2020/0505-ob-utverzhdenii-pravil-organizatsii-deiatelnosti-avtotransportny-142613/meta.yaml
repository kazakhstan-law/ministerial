  title:
    rus: О внесении изменений в приказы Министра внутренних дел Республики Казахстан от 21 мая 2019 года № 455 «Об утверждении Правил обеспечения, хранения, учета и списания форменной одежды в органах внутренних дел» и от 5 мая 2020 года № 375 «Об утверждении Правил организации деятельности автотранспортных подразделений органов внутренних дел Республики Казахстан»
    kaz: Қазақстан Республикасы Ішкі істер министрлігінің «Ішкі істер органдарында нысанды киіммен қамтамасыз ету, сақтау, есепке алу және есептен шығару қағидаларын бекіту туралы» 2019 жылғы 21 мамырдағы № 455 және «Қазақстан Республикасы ішкі істер органдарының автокөлік бөліністерінің қызметін ұйымдастыру қағидаларын бекіту туралы» 2020 жылғы 5 мамырдағы № 375 бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/185079/rus
