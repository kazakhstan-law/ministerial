  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 27 марта 2020 года № 254 «Об утверждении Правил оказания государственных услуг в сферах оборота гражданского и служебного оружия и патронов к нему, гражданских пиротехнических веществ и изделий с их применением»
    kaz: «Азаматтық және қызметтік қару мен оның патрондарының, азаматтық пиротехникалық заттар мен олар қолданылып жасалған бұйымдардың айналымы саласындағы мемлекеттiк қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2020 жылғы 27 наурыздағы № 254 бұйрығына өзгерістер енгізу туралы
