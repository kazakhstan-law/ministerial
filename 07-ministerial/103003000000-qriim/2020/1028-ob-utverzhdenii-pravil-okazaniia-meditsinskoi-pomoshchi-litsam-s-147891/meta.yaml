title:
  rus: Об утверждении Правил оказания медицинской помощи лицам, свобода которых ограничена, а также лицам, отбывающим наказание по приговору суда в местах лишения свободы, задержанным, заключенным под стражу и помещенным в специальные учреждения
  kaz: Сот үкімі бойынша бас бостандығынан айыру орындарында жазасын өтеп жатқан бас бостандығы шектелген адамдарға, сондай-ақ ұсталған, қамауға алынған және арнайы мекемелерге орналастырылған адамдарға медициналық көмек көрсету қағидаларын бекіту туралы
