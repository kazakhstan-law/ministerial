title:
  rus: Об утверждении Требований, предъявляемых к состоянию здоровья лиц для прохождения службы в правоохранительных органах, органах гражданской защиты и Государственной фельдъегерской службе Республики Казахстан
  kaz: Қазақстан Республикасының құқық қорғау органдарында, азаматтық қорғау органдарында және Мемлекеттік фельдъегерлік қызметінде қызмет өткеру үшін адамдардың денсаулық жағдайына қойылатын талаптарды бекіту туралы
