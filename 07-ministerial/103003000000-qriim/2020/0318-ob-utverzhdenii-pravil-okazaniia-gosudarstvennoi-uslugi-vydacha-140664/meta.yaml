title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача заключения на соответствие криминалистическим требованиям гражданского и служебного оружия и патронов к нему, а также конструктивно сходных с оружием изделий
  kaz: «Азаматтық және қызметтік қарудың және оған патрондардың, сондай-ақ конструкциясы жағынан қаруға ұқсас бұйымдардың криминалистикалық талаптарға сәйкестігіне қорытынды беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы
