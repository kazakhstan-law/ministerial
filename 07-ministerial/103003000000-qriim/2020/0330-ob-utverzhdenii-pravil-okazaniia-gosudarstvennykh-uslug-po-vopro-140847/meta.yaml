  title:
    rus: О внесении изменения в приказ Министра внутренних дел Республики Казахстан от 30 марта 2020 года № 266 «Об утверждении Правил оказания государственной услуги «Выдача удостоверений лицам без гражданства и видов на жительство иностранцам, постоянно проживающим в Республике Казахстан» и внесения изменений в некоторые приказы Министра внутренних дел Республики Казахстан»
    kaz: «Азаматтығы жоқ адамдарға куәліктер және Қазақстан Республикасында тұрақты тұратын шетелдіктердің тұруына ықтиярхат беру» мемлекеттік қызмет көрсету қағидаларын бекіту және Қазақстан Республикасы Ішкі істер министрінің кейбір бұйрықтарына өзгерістер енгізу туралы» Қазақстан Республикасы Ішкі істер министрінің 2020 жылғы 30 наурыздағы № 266 бұйрығына өзгерістер енгізу туралы
