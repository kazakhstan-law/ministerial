  title:
    rus: О внесении изменений и дополнения в приказ Министра внутренних дел Республики Казахстан от 30 марта 2020 года № 266 «Об утверждении Правил оказания государственной услуги «Выдача удостоверений лицам без гражданства и видов на жительство иностранцам, постоянно проживающим в Республике Казахстан» и внесения изменений в некоторые приказы Министра внутренних дел Республики Казахстан»
    kaz: «Азаматтығы жоқ адамдарға куәліктер және Қазақстан Республикасында тұрақты тұратын шетелдіктердің тұруына ықтиярхат беру» мемлекеттік қызметті көрсету тәртібін айқындайтын Ережелер бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің  2020 жылғы 30 наурыздағы № 266 бұйрығына өзгерістер мен толықтырулар енгізу туралы
