title:
  rus: Об утверждении Правил оказания государственных услуг по вопросам документирования лиц без гражданства и иностранцев, постоянно проживающих в Республике Казахстан
  kaz: Қазақстан Республикасында тұрақты тұратын азаматтығы жоқ адамдар мен шетелдіктерді құжаттандыру мәселелері бойынша мемлекеттік қызметтер көрсету қағидаларын бекіту туралы
