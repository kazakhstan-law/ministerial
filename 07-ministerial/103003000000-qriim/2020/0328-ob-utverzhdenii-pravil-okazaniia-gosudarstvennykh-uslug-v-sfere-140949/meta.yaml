  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 28 марта 2020 года № 261 «Об утверждении Правил оказания государственных услуг в сфере охранной деятельности» и в приказ исполняющего обязанности Министра внутренних дел Республики Казахстан от 29 октября 2024 года № 863 «Об утверждении Правил предоставления национальным компаниям права на учреждение охранных организаций»
    kaz: «Күзет қызметі саласындағы мемлекеттік қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2020 жылғы 28 наурыздағы № 261 бұйрығына және «Ұлттық компанияларға жеке күзет ұйымдарын құруға құқық беру қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің міндетін атқарушының 2024 жылғы 29 қазандағы № 863 бұйрығына өзгерістер енгізу туралы
