act_code: '83454'
requisite: Приказ Министра внутренних дел Республики Казахстан от 19 августа 2014 года № 530. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 сентября 2014 года № 9762. Утратил силу приказом Министра внутренних дел Республики Казахстан от 5 июля 2022 года № 562
title:
  rus: Об утверждении Правил организации противотуберкулезной помощи в учреждениях уголовно - исполнительной системы, Перечня заболеваний, являющихся основанием освобождения от отбывания наказания, Правил медицинского освидетельствования осужденных, представляемых к освобождению от отбывания наказания в связи с болезнью
  kaz: Қылмыстық-атқару жүйесінің мекемелерінде туберкулезге қарсы көмекті ұйымдастыру қағидаларын, жазаны өтеуден босатуға негіз болып табылатын аурулар тізбесін, ауруына байланысты жазасын өтеуден босатуға ұсынылатын сотталғандарды медициналық куәландыру қағидасын бекіту туралы
