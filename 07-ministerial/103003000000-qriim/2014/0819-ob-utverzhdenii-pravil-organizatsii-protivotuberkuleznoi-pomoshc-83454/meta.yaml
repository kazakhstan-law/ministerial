  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 19 августа 2014 года № 530 «Об утверждении Правил организации противотуберкулезной помощи в учреждениях уголовно-исполнительной системы, Перечня заболеваний, являющихся основанием освобождения от отбывания наказания, Правил медицинского освидетельствования осужденных, представляемых к освобождению от отбывания наказания в связи с болезнью»
    kaz: «Қылмыстық-атқару жүйесінің мекемелерінде туберкулезге қарсы көмекті ұйымдастыру қағидаларын, жазаны өтеуден босатуға негіз болып табылатын аурулар тізбесін, ауруына байланысты жазасын өтеуден босатуға ұсынылатын сотталғандарды медициналық куәландыру қағидасын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2014 жылғы 19 тамыздағы № 530 бұйрығына өзгерістер енгізу туралы
