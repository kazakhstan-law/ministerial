act_code: '81827'
requisite: Приказ Министра внутренних дел Республики Казахстан от 23 июня 2014 года № 367. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 июля 2014 года № 9609.
title:
  rus: Об утверждении Правил формирования и осуществления деятельности квалификационной комиссии, Правил проведения аттестации кандидатов в преподаватели, мастера производственного обучения и мастера обучения вождению во время образовательного процесса по подготовке водителей транспортных средств, а также форму и периодичность представления отчетности о своей деятельности профессиональными объединениями
  kaz: Біліктілік комиссиясын қалыптастыру және оның қызметін жүзеге асыру қағидаларын, Көлік құралдары жүргізушілерін даярлау бойынша оқытушы, өндірістік оқыту шебері және білім беру процесі кезінде жүргізуге оқыту шебері болуға кандидаттарды аттестаттаудан өткізу қағидаларын, сондай-ақ кәсіби бірлестіктермен өзінің іс-қимылы туралы есепті ұсыну үлгісін және мерзімділігін бекіту туралы
