  title:
    rus: О внесении изменения и дополнений в приказ Министра внутренних дел Республики Казахстан от 23 июня 2014 года № 367 «Об утверждении Правил аккредитации профессиональных объединений по подготовке водителей транспортных средств, Правил формирования и осуществления деятельности квалификационной комиссии, Правил проведения аттестации кандидатов в преподаватели, мастера производственного обучения и мастера обучения вождению во время образовательного процесса по подготовке водителей транспортных средств»
    kaz: «Көлік құралдары жүргізушілерін даярлау жөніндегі кәсіптік бірлестіктерді аккредиттеу қағидаларын, Біліктілік комиссиясын қалыптастыру және оның қызметін жүзеге асыру қағидаларын, Көлік құралдары жүргізушілерін даярлау бойынша оқытушы, өндірістік оқыту шебері және білім беру процесі кезінде жүргізуге оқыту шебері болуға кандидаттарды аттестаттаудан өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2014 жылғы 23 маусымдағы № 367 бұйрығына өзгеріс пен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/194165/rus
