  title:
    rus: О внесении изменений в приказ и.о. Министра внутренних дел Республики Казахстан от 19 сентября 2014 года № 622 «Об утверждении Правил осуществления контроля за поведением лиц, освобожденных условно-досрочно от отбывания наказания» и в приказ Министра внутренних дел Республики Казахстан от 29 декабря 2015 года № 1095 «Об утверждении Правил организации деятельности участковых инспекторов полиции, ответственных за организацию работы участкового пункта полиции, участковых инспекторов полиции и их помощников»
    kaz: «Жазасын өтеуден шартты түрде мерзімінен бұрын босатылған адамдардың мінез-құлқын бақылауды жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің м.а. 2014 жылғы 19 қыркүйектегі № 622 бұйрығына және «Учаскелік полиция пунктінің жұмысын ұйымдастыруға жауапты учаскелік полиция инспекторларының, учаскелік полиция инспекторлары мен олардың көмекшілерінің қызметін ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 29 желтоқсандағы № 1095 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/227524/rus
