act_code: '85864'
requisite: Приказ Министра внутренних дел Республики Казахстан от 28 ноября 2014 года № 853. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2014 года № 10050
title:
  rus: Об утверждении Типового положения о консультативно-совещательном органе при местных исполнительных органах по содействию деятельности учреждений и органов, исполняющих уголовные наказания и иные меры уголовно-правового воздействия, а также организации социальной и иной помощи лицам, отбывшим уголовные наказания
  kaz: Қылмыстық жазаларды және өзге де қылмыстық-құқықтық ықпал ету шараларын орындайтын мекемелер мен органдардың қызметіне жәрдемдесу, сондай-ақ қылмыстық жазаларын өтеген адамдарға әлеуметтік және өзге де көмекті ұйымдастыру бойынша жергілікті атқарушы органдардың жанындағы консультациялық-кеңесші орган туралы үлгі ережені бекіту туралы
