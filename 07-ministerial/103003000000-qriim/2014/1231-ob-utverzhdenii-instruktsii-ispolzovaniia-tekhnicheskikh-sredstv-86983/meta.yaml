title:
  rus: Об утверждении Инструкции использования технических средств для фиксации фактов совершения уголовных и административных правонарушений и действий сотрудников органов внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы ішкі істер органдары қызметкерлерінің әрекеттерін және қылмыстық немесе әкімшілік құқық бұзушылықтардың жасалу фактілерін тіркеу үшін техникалық құралдарды пайдалану нұсқаулығын бекіту туралы
