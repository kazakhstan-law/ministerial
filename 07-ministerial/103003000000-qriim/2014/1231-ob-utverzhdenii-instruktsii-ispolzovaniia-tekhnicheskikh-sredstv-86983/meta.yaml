    kaz: «Қазақстан Республикасы ішкі істер органдары қызметкерлерінің әрекеттерін және қылмыстық немесе әкімшілік құқық бұзушылықтардың жасалу фактілерін тіркеу үшін техникалық құралдарды пайдалану нұсқаулығын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2014 жылғы 31 желтоқсандағы № 971 бұйрығына өзгерістер енгізу туралы
