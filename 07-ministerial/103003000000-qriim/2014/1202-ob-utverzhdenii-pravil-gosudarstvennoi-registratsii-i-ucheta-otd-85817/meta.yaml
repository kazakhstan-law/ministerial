title:
  rus: Об утверждении Правил государственной регистрации и учета отдельных видов транспортных средств по идентификационному номеру транспортного средства, подготовки водителей механических транспортных средств, приема экзаменов и выдачи водительских удостоверений
  kaz: Көлiк құралының сәйкестендіру нөмірі бойынша көлік құралдарының жекелеген түрлерiн мемлекеттiк тiркеу және есепке алу, Механикалық көлік құралдарын жүргізушілерді даярлау, Емтихандар қабылдау және жүргізуші куәліктерін беру қағидаларын бекіту туралы
