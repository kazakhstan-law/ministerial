  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 2 декабря 2014 года № 862 «Об утверждении Правил государственной регистрации и учета отдельных видов транспортных средств по идентификационному номеру транспортного средства, подготовки водителей механических транспортных средств, приема экзаменов и выдачи водительских удостоверений»
    kaz: «Көлiк құралының сәйкестендіру нөмірі бойынша көлік құралдарының жекелеген түрлерiн мемлекеттiк тiркеу және есепке алу, Механикалық көлік құралдарын жүргізушілерді даярлау, Емтихандар қабылдау және жүргізуші куәліктерін беру қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер Министрінің 2014 жылғы 2 желтоқсандағы № 862 бұйрығына өзгерістер енгізу туралы
