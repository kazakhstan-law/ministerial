act_code: '79414'
requisite: Приказ Министра внутренних дел Республики Казахстан от 21 февраля 2014 года № 103. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 марта 2014 года № 9275. Утратил силу приказом Министра внутренних дел Республики Казахстан от 30 мая 2015 года № 500 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов государственных услуг "Выдача пропуска на въезд в пограничную зону иностранцам и лицам без гражданства", "Оформление приглашений на въезд в Республику Казахстан по частным делам и с целью воссоединения семьи" и "Регистрация иностранцев и лиц без гражданства, временно пребывающих в Республике Казахстан"
  kaz: '"Шетелдіктердің және азаматтығы жоқ адамдардың шекаралық аймаққа кіруіне рұқсаттама беру", "Қазақстан Республикасына жеке істері бойынша және отбасын біріктіру мақсатында келуге шақыруларды ресімдеу" және "Қазақстан Республикасында уақытша болатын шетелдіктер мен азаматтығы жоқ адамдарды тіркеу" мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы'
