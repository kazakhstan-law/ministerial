title:
  rus: Об утверждении Инструкции по охране тюрем и исправительных учреждений уголовно-исполнительной системы Министерства внутренних дел Республики Казахстан, предназначенных для отбывания наказания осужденных женщин и несовершеннолетних
  kaz: Қылмыстық Республикасы Ішкі істер министрлігі қылмыстық-атқару жүйесі түрмелерін және сотталған әйелдер мен кәмлетке толмағандардың жазасын өтеуіне арналған түзету мекемелерін күзету жөніндегі нұсқаулықты бекіту туралы
