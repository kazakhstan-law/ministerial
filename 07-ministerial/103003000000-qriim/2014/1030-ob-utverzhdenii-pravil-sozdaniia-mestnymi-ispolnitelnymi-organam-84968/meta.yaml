title:
  rus: Об утверждении Правил создания местными исполнительными органами пунктов пожаротушения, их материально-технического оснащения в населенных пунктах, в которых отсутствуют подразделения государственной противопожарной службы
  kaz: Жергілікті атқарушы органдардың мемлекеттік өртке қарсы қызмет бөлімшелері жоқ елді мекендерде өрт сөндіру пункттерін құру, оларды материалдық-техникалық жарақтандыру қағидаларын бекіту туралы
