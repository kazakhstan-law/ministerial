  title:
    rus: О внесении изменений и дополнения в приказ Министра внутренних дел Республики Казахстан от 1 октября 2014 года № 662 «Об утверждении положений о ведомствах и территориальных органах Министерства внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасы Ішкі істер министрлігінің ведомстволары мен аумақтық органдары туралы ережелерді бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2014 жылғы 1 қазандағы № 662 бұйрығына өзгерістер мен толықтыру енгізу туралы
