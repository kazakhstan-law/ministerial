title:
  rus: Об утверждении положений о ведомствах, территориальных органах и уставов учебных заведений Министерства внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы Ішкі істер министрлігінің ведомстволары, аумақтық органдары туралы ережелерді және оқу орындарының жарлықтарын бекіту туралы
