  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 1 октября 2014 года № 662 «Об утверждении положений о ведомствах и территориальных органах Министерства внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасы Ішкі істер министрлігінің ведомстволары мен  аумақтық органдары туралы ережелерді бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2014 жылєы 1 қазандағы № 662 бұйрығына өзгерістер мен толықтырулар енгізу туралы
