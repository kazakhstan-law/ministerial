act_code: '79477'
requisite: Приказ Министра внутренних дел Республики Казахстан от 11 марта 2014 года № 152. Зарегистрирован в Министерстве юстиции Республики Казахстан от 12 апреля 2014 года № 9320. Утратил силу приказом Министра внутренних дел Республики Казахстан от 30 мая 2015 года № 495
title:
  rus: Об утверждении регламентов государственных услуг "Выдача удостоверений лицам без гражданства и видов на жительство иностранцам, постоянно проживающим в Республике Казахстан", "Регистрация и выдача разрешений иностранцам и лицам без гражданства на постоянное жительство в Республике Казахстан", "Регистрация приема и выхода из гражданства Республики Казахстан", "Присвоение и продление статуса беженца в Республике Казахстан"
  kaz: '"Қазақстан Республикасында тұрақты тұратын азаматтығы жоқ адамдарға куәлiктер мен шетелдiктерге тұруға ықтиярхаттар беру", "Шетелдiктер мен азаматтығы жоқ адамдарды тiркеу және оларға Қазақстан Республикасында тұрақты тұруға рұқсат беру", "Қазақстан Республикасының азаматтығына Қабылдауды және одан шығуды тiркеу", "Қазақстан Республикасында босқын мәртебесін беру және ұзарту" мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы'
