    kaz: '"Қазақстан Республикасында тұрақты тұратын азаматтығы жоқ адамдарға куәлiктер мен шетелдiктерге тұруға ықтиярхаттар беру", "Шетелдiктер мен азаматтығы жоқ адамдарды тiркеу және оларға Қазақстан Республикасында тұрақты тұруға рұқсат беру", "Қазақстан Республикасының азаматтығына қабылдауды және одан шығуды тiркеу", "Қазақстан Республикасында босқын мәртебесін беру және ұзарту" мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2014 жылғы 11 наурыздағы № 152 бұйрығына толықтырулар енгізу туралы'
