requisite: Приказ Министра внутренних дел Республики Казахстан от 28 апреля 2007 года № 180. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 мая 2007 года № 4673. Утратил силу приказом Министра внутренних дел Республики Казахстан от 26 апреля 2011 года № 187
title:
  rus: Об утверждении Правил прохождения специального первоначального обучения кандидатов, впервые поступающих в органы внутренних дел Республики Казахстан на должности рядового, младшего и среднего начальствующего состава
  kaz: Қазақстан Республикасы ішкі істер органдарының қатардағы, кіші және орта басшы құрамдағы лауазымдарына бірінші рет қабылданатын үміткерлердің алғашқы арнайы оқудан өту ережесін бекіту туралы
