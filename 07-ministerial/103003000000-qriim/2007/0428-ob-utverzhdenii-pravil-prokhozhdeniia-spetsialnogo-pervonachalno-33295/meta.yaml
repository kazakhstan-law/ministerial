  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 28 апреля 2007 года N 180 "Об утверждении Правил прохождения специального первоначального обучения кандидатов, впервые поступающих в органы внутренних дел Республики Казахстан на должности рядового, младшего и среднего начальствующего состава"
    kaz: '"Қазақстан Республикасы ішкі істер органдарының қатардағы, кіші және орта басшы құрамдағы лауазымдарына бірінші рет қабылданатын үміткерлердің алғашқы арнайы оқудан өту ережесін бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2007 жылғы 28 сәуірдегі N 180 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
