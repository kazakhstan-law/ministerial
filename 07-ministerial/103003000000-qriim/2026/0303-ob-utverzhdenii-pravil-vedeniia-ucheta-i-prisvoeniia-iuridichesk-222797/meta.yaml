title:
  rus: Об утверждении Правил ведения учета и присвоения юридическими лицами и индивидуальными предпринимателями, осуществляющими деятельность по сдаче в аренду электрических самокатов, регистрационного номера на электрический самокат, а также его форму и образец
  kaz: Электр самокаттарды жалға беру жөніндегі қызметті жүзеге асыратын заңды тұлғалар мен дара кәсіпкерлердің электр самокатты есепке алуды жүргізу және оған тіркеу нөмірін беру қағидалары, сондай-ақ оның нысаны мен үлгісін бекіту туралы
