  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 20 февраля 2026 года № 120 «Об утверждении Инструкции по работе с обращениями (сообщениями) в системе «Омниканальность процесса приема сообщений граждан», поступающих посредством мобильного приложения «102», сервисе «Закон и Порядок» и системе «Тревожная кнопка SОS» в органах внутренних дел Республики Казахстан
    kaz: «Қазақстан Республикасының ішкі істер органдарында «102» мобильді қосымшасы, «Заң мен тәртіп» сервисі және «SOS дабыл батырмасы» жүйесі арқылы келіп түсетін «Азаматтардың хабарламаларын қабылдау процесінің көп арналығы» жүйесіне түсетін өтініштермен (хабарламалармен) жұмыс істеу жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2026 жылғы 20 ақпандағы №120 бұйрығына өзгерістер енгізу туралы
