act_code: '225000'
requisite: Приказ Министра внутренних дел Республики Казахстан от 28 апреля 2026 года № 312
title:
  rus: Об утверждении Перечня закрытых и обособленных военных городков, иных закрытых объектов, содержание служебных жилищ и централизованное отопление в которых обеспечиваются за счет бюджетных средств, а также в которых служебное жилище не подлежит приватизации
  kaz: Қызметтік тұрғынжайларды ұстау және орталықтандырылған жылыту бюджет қаражаты есебінен қамтамасыз етілетін, сондай-ақ қызметтік тұрғынжайы жекешелендіруге жатпайтын жабық және оқшауланған әскери қалашықтардың, өзге де жабық объектілердің тізбесін бекіту туралы
