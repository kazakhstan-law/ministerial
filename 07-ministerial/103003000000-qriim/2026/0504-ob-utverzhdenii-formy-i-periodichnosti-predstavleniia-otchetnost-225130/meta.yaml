act_code: '225130'
requisite: Приказ Министра внутренних дел Республики Казахстан от 4 мая 2026 года № 329. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 мая 2026 года № 38699
title:
  rus: Об утверждении формы и периодичности представления отчетности субъектами, занимающимися охранной деятельностью, деятельностью по монтажу, наладке и техническому обслуживанию средств охранной сигнализации, а также специализированными учебными центрами по подготовке и повышению квалификации работников, занимающих должности руководителя и охранника в частной охранной организации
  kaz: Күзет қызметімен, күзет дабылы құралдарын монтаждау, баптау және оларға техникалық қызмет көрсету жөніндегі қызметпен айналысатын субъектілердің, сондай-ақ жеке күзет ұйымында басшы және күзетші лауазымдарын атқаратын жұмыскерлерді даярлау және олардың біліктілігін арттыру жөніндегі мамандандырылған оқу орталықтарының есептілігі нысанын және оны ұсыну кезеңділігін бекіту туралы
