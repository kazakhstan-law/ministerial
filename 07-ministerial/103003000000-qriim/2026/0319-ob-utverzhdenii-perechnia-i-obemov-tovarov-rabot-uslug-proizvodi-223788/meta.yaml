title:
  rus: Об утверждении перечня и объемов товаров, работ, услуг, производимых, выполняемых, оказываемых государственным предприятием учреждений уголовно-исполнительной (пенитенциарной) системы, которые приобретаются способом из одного источника путем прямого заключения договора о государственных закупках
  kaz: Мемлекеттік сатып алу туралы шартты тікелей жасасу арқылы бір көзден алу тәсілімен сатып алынатын қылмыстық-атқару (пенитенциарлық) жүйесі мекемелерінің мемлекеттік кәсіпорны өндіретін, орындайтын, көрсететін тауарларының, жұмыстарының, көрсетілетін қызметтерінің тізбесі мен көлемдерін бекіту туралы
