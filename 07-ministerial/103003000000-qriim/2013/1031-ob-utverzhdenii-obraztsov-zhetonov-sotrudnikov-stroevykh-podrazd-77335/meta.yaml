  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 31 октября 2013 года № 630 «Об утверждении образцов жетонов сотрудников строевых подразделений дорожно-патрульной, патрульной полиции и специализированной службы охраны органов внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасы ішкі істер органдары жол-патрульдік, патрульдік полициясы және мамандандырылған күзет қызметі саптық бөліністері қызметкерлерінің жетондарының үлгілерін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2013 жылғы 31 қазандағы № 630 бұйрығына өзгерiстер енгiзу туралы
