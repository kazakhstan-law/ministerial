  title:
    rus: О внесении изменений и дополнения в приказ Министра внутренних дел Республики Казахстан от 31 октября 2013 года № 630 «Об утверждении образцов жетонов сотрудников строевых подразделений дорожно-патрульной и патрульной полиции органов внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасы ішкі істер органдары жол-патрульдік және патрульдік полициясының саптық бөліністері қызметкерлерінің жетондарының үлгілерін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2013 жылғы 31 қазандағы № 630 бұйрығына өзгерістер және толықтыру енгізу туралы
