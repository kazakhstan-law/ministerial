act_code: '77335'
requisite: Приказ Министра внутренних дел Республики Казахстан от 31 октября 2013 года № 630. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 декабря 2013 года № 8933
title:
  rus: Об утверждении образцов жетонов сотрудников строевых подразделений патрульной полиции Департаментов полиции областей, городов республиканского значения, столицы, на транспорте и Управления полиции на метрополитене, а также специализированной службы охраны органов внутренних дел Республики Казахстан, а также Правила их выдачи
  kaz: Қазақстан Республикасы ішкі істер органдарының облыстардың, республикалық маңызы бар қалалардың, астананың, Көліктегі полиция департаменттерінің, Метрополитендегі полиция басқармасының патрульдік полиция және мамандандырылған күзет қызметі саптық бөліністері қызметкерлерінің кеуде жетондарының үлгілерін, сондай-ақ оларды беру қағидаларын бекіту туралы
