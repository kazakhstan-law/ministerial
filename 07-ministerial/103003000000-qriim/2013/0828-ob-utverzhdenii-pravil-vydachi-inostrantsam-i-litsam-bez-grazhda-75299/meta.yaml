act_code: '75299'
requisite: Приказ Министра внутренних дел Республики Казахстан от 28 августа 2013 года № 523. Зарегистрирован в Министерстве юстиции Республики Казахстан от 9 октября 2013 года № 8789. Утратил силу приказом Министра внутренних дел Республики Казахстан от 4 декабря 2015 года № 991
title:
  rus: Об утверждении Правил выдачи иностранцам и лицам без гражданства разрешения на постоянное проживание в Республике Казахстан и Инструкции по оформлению, выдаче, замене, изъятию и уничтожению видов на жительство иностранца и удостоверений лица без гражданства
  kaz: Шетелдіктер мен азаматтығы жоқ адамдарға Қазақстан Республикасында тұрақты тұруға рұқсат беру қағидасын және Шетелдіктің тұруға ықтиярхатын және азаматтығы жоқ адамның куәлігін ресімдеу, беру, ауыстыру, алып қою және жою жөніндегі нұсқаулықты бекіту туралы
