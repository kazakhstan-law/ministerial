requisite: Приказ Министра внутренних дел Республики Казахстан от 20 мая 2013 года № 339. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 мая 2013 года № 8483. Утратил силу приказом Министра внутренних дел Республики Казахстан от 10 марта 2015 года № 200
title:
