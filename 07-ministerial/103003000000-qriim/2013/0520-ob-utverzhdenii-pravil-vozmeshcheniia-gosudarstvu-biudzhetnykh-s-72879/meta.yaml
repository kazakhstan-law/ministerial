  kaz: Қазақстан Республикасы Ішкі істер министрлігі Ішкі әскерлерінің әскери қызметшілерін әскери оқу орындарында оқытуға жұмсалған бюджет қаражатын мемлекетке қайтару қағидасын бекіту туралы
