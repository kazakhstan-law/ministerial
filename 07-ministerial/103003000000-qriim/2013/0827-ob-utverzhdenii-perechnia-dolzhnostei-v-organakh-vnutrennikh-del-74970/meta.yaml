act_code: '74970'
requisite: Приказ Министра внутренних дел Республики Казахстан от 27 августа 2013 года № 522. Зарегистрирован в Министерстве юстиции Республики Казахстан от 4 октября 2013 года № 8778. Утратил силу приказом Министра внутренних дел Республики Казахстан от 31 августа 2016 года № 870
title:
  rus: Об утверждении Перечня должностей в органах внутренних дел Республики Казахстан, замещаемых на конкурсной основе, Правил проведения конкурса и стажировки при поступлении на службу в органы внутренних дел Республики Казахстан
  kaz: Конкурстық негізде орналастырылатын Қазақстан Республикасы ішкі істер органдарының лауазымдар тізбесін және Қазақстан Республикасы ішкі істер органдарына қызметке орналасу кезінде конкурс және тағылымдама өткізу қағидасын бекіту туралы
