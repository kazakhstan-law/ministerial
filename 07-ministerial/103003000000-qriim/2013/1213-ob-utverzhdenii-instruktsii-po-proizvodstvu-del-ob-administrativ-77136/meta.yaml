  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 13 декабря 2013 года № 713 «Об утверждении Инструкции по производству дел об административных правонарушениях в органах внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасы ішкі істер органдарында әкімшілік құқық бұзушылық туралы істер өндірісі жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2013 жылғы 13 желтоқсандағы № 713 бұйрығына өзгерістер мен толықтырулар енгізу туралы
