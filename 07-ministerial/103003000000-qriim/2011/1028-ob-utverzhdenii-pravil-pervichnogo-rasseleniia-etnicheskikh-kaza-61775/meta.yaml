act_code: '61775'
requisite: Приказ Министра внутренних дел Республики Казахстан от 28 октября 2011 года № 570. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 ноября 2011 года № 7310. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 22 июля 2013 года № 328-Ө-М
title:
  rus: Об утверждении Правил первичного расселения этнических казахов и членов их семей, по их желанию, до присвоения статуса оралмана в центрах временного размещения и сроков их пребывания в центрах временного размещения
  kaz: Этникалық қазақтар мен олардың отбасы мүшелерін оралман мәртебесін алғанға дейін олардың қалауы бойынша уақытша орналастыру орталықтарында алғашқы қоныстандыру қағидаларын және олардың уақытша орналастыру орталықтарында болу мерзімдерін бекіту туралы
