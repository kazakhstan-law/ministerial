requisite: Приказ Министра внутренних дел Республики Казахстан от 26 сентября 2011 года № 502. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 октября 2011 года № 7280. Утратил силу приказом Министра внутренних дел Республики Казахстан от 4 апреля 2014 года № 192
title:
  rus: Об утверждении регламента государственной услуги "Регистрация, перерегистрация автотранспортных средств и выдача регистрационных номерных знаков, за исключением транспортных средств, регистрируемых Министерством сельского хозяйства"
  kaz: '"Ауыл шаруашылығы министрлігі тіркейтін көлік құралдарын қоспағанда, көлік құралдарын тіркеу, қайта тіркеу және нөмірлік тіркеу белгілерін беру" мемлекеттік қызмет регламентін бекіту туралы'
