    kaz: '"Қазақстан Республикасы ішкі істер органдарының жол қозғалысы қауіпсіздігін қамтамасыз ету жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2011 жылғы 1 қыркүйектегі № 455 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
