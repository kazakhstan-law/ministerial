act_code: '59156'
requisite: Приказ Министра внутренних дел Республики Казахстан от 26 апреля 2011 года № 187. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 мая 2011 года № 6978. Утратил силу приказом Министра внутренних дел Республики Казахстан от 13 марта 2020 года № 211 (вводится в действие с 1 января 2021 года)
title:
  rus: Об утверждении Правил прохождения специального первоначального обучения для лиц, впервые поступающих в органы внутренних дел Республики Казахстан на должности рядового, младшего и среднего начальствующего состава
  kaz: Қазақстан Республикасы ішкі істер органдарының қатардағы, кіші және орта басшы құрамдағы лауазымдарына бірінші рет қабылданатын адамдардың арнайы бастапқы оқудан өту ережесін бекіту туралы
