act_code: '64718'
requisite: Приказ Министра внутренних дел Республики Казахстан от 29 декабря 2011 года № 690. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 апреля 2012 года № 7558. Утратил силу приказом Министра внутренних дел Республики Казахстан от 8 декабря 2017 года № 823 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по организации органами внутренних дел Республики Казахстан борьбы с незаконным оборотом наркотических средств, психотропных веществ и прекурсоров
  kaz: Есірткі құралдарының, психотроптық заттардың және прекурсорлардың заңсыз айналымына қарсы күресте Қазақстан Республикасы ішкі істер органдарын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
