act_code: '158981'
requisite: Приказ Министра внутренних дел Республики Казахстан от 24 сентября 2021 года № 576. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 сентября 2021 года № 24514
title:
  rus: О приостановлении действии некоторых структурных элементов приказов Министра внутренних дел Республики Казахстан от 29 ноября 2010 года № 496 «Об утверждении Правил регистрации и рассмотрения ходатайства о присвоении статуса беженца» и от 8 февраля 2014 года № 76 «Об утверждении Правил выдачи, продления и отзыва разрешений трудовым иммигрантам, а также формирования и ведения дакто-, фотоучетов трудовых иммигрантов»
  kaz: Қазақстан Республикасы Ішкі істер министрінің «Босқын мәртебесiн беру туралы өтiнiшхатты тiркеу мен қараудың қағидаларын бекіту туралы» 2010 жылғы 29 қарашадағы № 496 және «Еңбекші көшіп келушіге рұқсатты беру, ұзарту және кері қайтарып алу, сондай-ақ еңбекші көшіп келушілерді дакто-, фото есепке алуды қалыптастыру және жүргізу қағидаларын бекіту туралы» 2014 жылғы 8 ақпандағы № 76 бұйрықтарының кейбір құрылымдық элементтерінің қолданысын тоқтата тұру туралы
