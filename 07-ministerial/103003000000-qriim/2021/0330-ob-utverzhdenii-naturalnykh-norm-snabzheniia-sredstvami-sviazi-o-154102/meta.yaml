  title:
    rus: «О внесении изменения в приказ Министра внутренних дел Республики Казахстан от 30 марта 2021 года № 175 «Об утверждении натуральных норм снабжения средствами связи, организационной техникой, программным обеспечением, аппаратными и программными средствами защиты информации подразделений органов внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасы ішкі істер органдарының бөлімшелерін байланыс құралдарымен, ұйымдастыру техникасымен, бағдарламалық қамтамасыз етумен, ақпаратты қорғаудың аппараттық және бағдарламалық құралдарымен жабдықтаудың заттай нормаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2021 жылғы 30 наурыздағы № 175 бұйрығына өзгеріс енгізу туралы
