act_code: '154102'
requisite: Приказ Министра внутренних дел Республики Казахстан от 30 марта 2021 года № 175. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 апреля 2021 года № 22467. Утратил силу приказом Министра внутренних дел Республики Казахстан от 28 мая 2025 года № 392 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм снабжения средствами связи, организационной техникой, программным обеспечением, аппаратными и программными средствами защиты информации подразделений органов внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы ішкі істер органдарының бөлімшелерін байланыс құралдарымен, ұйымдастыру техникасымен, бағдарламалық қамтамасыз етумен, ақпаратты қорғаудың аппараттық және бағдарламалық құралдарымен жабдықтаудың заттай нормаларын бекіту туралы
