  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 1 апреля 2021 года № 190 «Об утверждении Инструкции о приеме на службу в органы внутренних дел, назначении на должность, перемещении, выдвижении по службе, предоставлении отпусков, присвоении специальных званий, увольнении и откомандировании»
    kaz: «Ішкі істер органдарына қызметке қабылдау, лауазымға тағайындау, қызмет бабында ауыстыру және жоғарылату, демалыстар беру арнаулы атақтарды беру, жұмыстан шығару және іссапарға жіберу жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2021 жылғы 1 сәуірдегі № 190 бұйрығына өзгерістер мен толықтырулар енгізу туралы
