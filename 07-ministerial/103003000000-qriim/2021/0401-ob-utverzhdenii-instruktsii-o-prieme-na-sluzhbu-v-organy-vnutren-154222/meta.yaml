  kaz: Ішкі істер органдарына қызметке қабылдау, лауазымға тағайындау, қызмет бабында орын ауыстыру, жоғарылату, демалыстар беру, арнаулы атақтар беру, жұмыстан шығару және іссапарға жіберу туралы нұсқаулықты бекіту туралы
