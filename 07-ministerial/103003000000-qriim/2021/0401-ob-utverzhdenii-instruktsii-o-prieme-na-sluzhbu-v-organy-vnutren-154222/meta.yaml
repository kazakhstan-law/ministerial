    kaz: «Ішкі істер органдарына қызметке қабылдау, лауазымға тағайындау, қызмет бабында ауыстыру және жоғарылату, демалыстар беру арнаулы атақтарды беру, жұмыстан шығару және іссапарға жіберу жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2021 жылғы 1 сәуірдегі № 190 бұйрығына өзгерістер енгізу туралы
