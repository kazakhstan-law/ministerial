title:
  rus: Об утверждении Инструкции о приеме на службу в органы внутренних дел, назначении на должность, перемещении, выдвижении по службе, предоставлении отпусков, присвоении специальных званий, увольнении и откомандировании
  kaz: Ішкі істер органдарына қызметке қабылдау, лауазымға тағайындау, қызмет бабында орын ауыстыру, жоғарылату, демалыстар беру, арнаулы атақтар беру, жұмыстан шығару және іссапарға жіберу туралы нұсқаулықты бекіту туралы
