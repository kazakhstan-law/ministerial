act_code: '91937'
requisite: Приказ Министра внутренних дел Республики Казахстан от 30 мая 2015 года № 495. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 июня 2015 года № 11632.  Утратил силу приказом Министра внутренних дел Республики Казахстан от 30 марта 2020 года № 265 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов государственных услуг «Выдача разрешения иностранцам и лицам без гражданства на постоянное жительство в Республике Казахстан», «Выдача удостоверений лицам без гражданства и видов на жительство иностранцам, постоянно проживающим в Республике Казахстан», «Регистрация приема, восстановления и выхода из гражданства Республики Казахстан», «Присвоение и продление статуса беженца в Республике Казахстан»
  kaz: «Шетелдiктер мен азаматтығы жоқ адамдарға Қазақстан Республикасында тұрақты тұруға рұқсат беру», «Азаматтығы жоқ адамдарға куәлiктер және Қазақстан Республикасында тұрақты тұратын шетелдiктердің тұруына ықтиярхат беру», «Қазақстан Республикасының азаматтығын алуды, қалпына келтіруді және одан шығуды тiркеу» және «Қазақстан Республикасында босқын мәртебесін беру және ұзарту» мемлекеттiк көрсетілетін қызмет регламенттерін бекіту туралы
