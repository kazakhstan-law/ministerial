  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 30 мая 2015 года № 495 «Об утверждении регламентов государственных услуг «Регистрация и выдача разрешения иностранцам и лицам без гражданства на постоянное жительство в Республике Казахстан», «Выдача удостоверений лицам без гражданства и видов на жительство иностранцам, постоянно проживающим в Республике Казахстан», «Регистрация приема и выхода из гражданства Республики Казахстан», «Присвоение и продление статуса беженца в Республике Казахстан»
    kaz: «Шетелдiктер мен азаматтығы жоқ адамдарды тiркеу және оларға Қазақстан Республикасында тұрақты тұруға рұқсат беру», «Азаматтығы жоқ адамдарға куәлiктер және Қазақстан Республикасында тұрақты тұратын шетелдiктердің тұруына ықтиярхат беру», «Қазақстан Республикасының азаматтығын алуды және одан шығуды тiркеу» және «Қазақстан Республикасында босқын мәртебесін беру және ұзарту» мемлекеттік көрсетілетін қызмет регламенттерін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 30 мамырдағы № 495 бұйрығына өзгерістер енгізу туралы
