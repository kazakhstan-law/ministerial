  requisite: Приказ и.о. Министра внутренних дел Республики Казахстан от 26 февраля 2016 года № 182. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 апреля 2016 года № 13578. Утратил силу приказом Министра внутренних дел Республики Казахстан от 30 марта 2020 года № 265 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра внутренних дел от 30 мая 2015 года № 495 «Об утверждении регламентов государственных услуг «Регистрация и выдача разрешения иностранцам и лицам без гражданства на постоянное жительство в Республике Казахстан», «Выдача удостоверений лицам без гражданства и видов на жительство иностранцам, постоянно проживающим в Республике Казахстан», «Регистрация приема и выхода из гражданства Республики Казахстан», «Присвоение и продление статуса беженца в Республике Казахстан»
    kaz: «Шетелдіктер мен азаматтығы жоқ адамдарды тіркеу және оларға Қазақстан Республикасында тұрақты тұруға рұқсат беру», «Азаматтығы жоқ адамдарға куәліктер және Қазақстан Республикасында тұрақты тұратын шетелдіктердің тұруына ықтиярхат беру», «Қазақстан Республикасының азаматтығын алуды және одан шығуды тіркеу» және «Қазақстан Республикасында босқын мәртебесін беру және ұзарту» мемлекеттік көрсетілетін қызмет регламенттерін бекіту туралы» Ішкі істер министрінің 2015 жылғы 30 мамырдағы № 495 бұйрығына өзгерістер енгізу туралы
