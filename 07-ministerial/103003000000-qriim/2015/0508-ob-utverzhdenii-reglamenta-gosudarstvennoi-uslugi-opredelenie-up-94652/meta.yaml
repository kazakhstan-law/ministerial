act_code: '94652'
requisite: Приказ Министра внутренних дел Республики Казахстан от 8 мая 2015 года № 442. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 июня 2015 года № 11352. Утратил силу приказом Министра внутренних дел Республики Казахстан от 28 марта 2020 года № 261 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Определение уполномоченным органом специализированного учебного центра по подготовке и повышению квалификации работников, занимающих должности руководителя и охранника в частной охранной организации»
  kaz: «Уәкілетті органның жеке күзет ұйымында басшы және күзетші лауазымдарын атқаратын жұмыскерлерді даярлау және олардың біліктілігін арттыру жөніндегі арнайы оқу орталығын айқындауы» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
