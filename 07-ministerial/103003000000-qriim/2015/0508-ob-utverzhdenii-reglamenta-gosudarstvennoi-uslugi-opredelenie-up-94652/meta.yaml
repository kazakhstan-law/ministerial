    kaz: «Уәкілетті органның жеке күзет ұйымында басшы және күзетші лауазымдарын атқаратын жұмыскерлерді даярлау және біліктілігін арттыру жөніндегі арнайы оқу орталығын айқындауы» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 8 мамырдағы № 442 бұйрығына өзгеріс енгізу туралы
