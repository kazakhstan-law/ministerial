title:
  rus: Об утверждении Правил приобретения, хранения, учета, использования, перевозки, уничтожения, ввоза, вывоза гражданских пиротехнических веществ и изделий с их применением
  kaz: Азаматтық пиротехникалық заттар мен олар қолданылып жасалған бұйымдарды сатып алу, сақтау, есепке алу, пайдалану, тасымалдау, жою, әкелу, әкету қағидаларын бекіту туралы
