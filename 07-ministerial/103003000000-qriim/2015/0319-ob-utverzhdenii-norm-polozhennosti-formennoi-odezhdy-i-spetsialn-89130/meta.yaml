  title:
    rus: О внесении изменения в приказ Министра внутренних дел Республики Казахстан от 19 марта 2015 года № 256 «Об утверждении норм положенности форменной одежды и специального обмундирования сотрудников, осуществляющих функции по предупреждению и ликвидации чрезвычайных ситуаций природного и техногенного характера, оказанию экстренной медицинской и психологической помощи населению, сотрудников органов государственной противопожарной службы»
    kaz: «Табиғи және техногендік сипаттағы төтенше жағдайлардың алдын алу және жою, халыққа шұғыл медициналық және психологиялық көмек көрсету жөніндегі функцияларды жүзеге асыратын қызметкерлердің, мемлекеттік өртке қарсы қызмет органдары қызметкерлерінің нысанды киімі мен арнайы киiм-кешегінің тиесiлiлігі нормаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 19 наурыздағы № 256 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/161620/rus
