act_code: '89130'
requisite: Приказ Министра внутренних дел Республики Казахстан от 19 марта 2015 года № 256. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 апреля 2015 года № 10802. Утратил силу приказом  Министра по чрезвычайным ситуациям Республики Казахстан от 1 августа 2022 года № 6-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм положенности форменной одежды и специального обмундирования сотрудников, осуществляющих функции по предупреждению и ликвидации чрезвычайных ситуаций природного и техногенного характера, оказанию экстренной медицинской и психологической помощи населению, сотрудников органов государственной противопожарной службы
  kaz: Табиғи және техногендік сипаттағы төтенше жағдайлардың алдын алу және жою, халыққа шұғыл медициналық және психологиялық көмек көрсету жөніндегі функцияларды жүзеге асыратын қызметкерлердің, мемлекеттік өртке қарсы қызмет органдары қызметкерлерінің нысанды киімі мен арнайы киiм-кешегінің тиесiлiлігі нормаларын бекіту туралы
