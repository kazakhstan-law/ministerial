  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 9 апреля 2015 года № 328 «Об утверждении стандарта государственной услуги по выдаче заключения на соответствие криминалистическим требованиям гражданского и служебного оружия и патронов к нему»
    kaz: «Азаматтық және қызметтiк қару мен оның патрондарының криминалистік талаптарға сәйкестігіне қорытынды беру бойынша мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 9 сәуірдегі № 328 бұйрығына өзгерістер енгізу туралы
