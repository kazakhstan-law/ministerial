title:
  rus: Об утверждении стандартов государственных услуг в сферах оборота гражданского и служебного оружия и патронов к нему, гражданских пиротехнических веществ и изделий с их применением
  kaz: Азаматтық және қызметтік қару мен оның патрондарының, азаматтық пиротехникалық заттар мен олар қолданылып жасалған бұйымдардың айналымы саласындағы мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы
