  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 24 апреля 2015 года № 395 «Об утверждении стандартов государственных услуг в сферах оборота гражданского и служебного оружия и патронов к нему, гражданских пиротехнических веществ и изделий с их применением»
    kaz: «Азаматтық және қызметтік қару мен оның патрондарының, азаматтық пиротехникалық заттар мен олар қолданылып жасалған бұйымдардың айналымы саласындағы мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 24 сәуірдегі № 395 бұйрығына өзгерістер мен толықтырулар енгізу туралы
