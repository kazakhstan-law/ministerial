act_code: '91641'
requisite: Приказ Министра внутренних дел Республики Казахстан от 30 мая 2015 года № 500. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 июля 2015 года № 11537. Утратил силу приказом Министра внутренних дел Республики Казахстан от 25 августа 2020 года № 597 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов государственных услуг "Выдача пропуска на въезд в пограничную зону иностранцам и лицам без гражданства" и "Регистрация иностранцев и лиц без гражданства, временно пребывающих в Республике Казахстан"
  kaz: '"Шетел азаматтарына және азаматтығы жоқ адамдарға шекаралық аймаққа келуге рұқсаттаманы беру" және "Қазақстан Республикасына уақытша болатын шетелдіктер мен азаматтығы жоқ адамдарды тіркеу" мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы'
