  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 4 декабря 2015 года № 992 «Об утверждении Правил выдачи иностранцам и лицам без гражданства разрешения на временное и постоянное проживание в Республике Казахстан» и внесении изменений в некоторые приказы Министра внутренних дел Республики Казахстан
    kaz: «Шетелдіктерге және азаматтығы жоқ адамдарға Қазақстан Республикасында уақытша және тұрақты тұруға рұқсаттар беру қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 4 желтоқсандағы № 992 бұйрығына өзгерістер енгізу және Қазақстан Республикасы Ішкі істер министрінің кейбір бұйрықтарына өзгерістер енгізу туралы
