    kaz: «Қазақстан Республикасы Ішкі істер министрлігінің Төтенше жағдайлар комитеті білім беру ұйымдарының курсанттарын тамақпен қамтамасыз ету жөніндегі нормаларды бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 19 наурыздағы № 255 бұйрығына өзгерістер енгізу туралы
