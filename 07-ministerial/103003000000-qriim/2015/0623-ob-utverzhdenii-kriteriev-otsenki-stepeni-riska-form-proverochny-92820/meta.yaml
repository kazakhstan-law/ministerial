act_code: '92820'
requisite: Совместный приказ Министерства внутренних дел Республики Казахстанот от 23.06.2015  № 556 и Министерства национальной экономики Республики Казахстан от 29 июня 2015 года № 465. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 июля 2015 года № 11784. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 11 декабря 2015 года № 1018 и и.о. Министра национальной экономики Республики Казахстан от 6 января 2016 года № 1
title:
  rus: Об утверждении критериев оценки степени риска, форм проверочных листов по государственному контролю за охранной деятельностью, за деятельностью специализированных учебных центров по подготовке и повышению квалификации  работников, занимающих должности руководителя и охранника в частной охранной организации, и за деятельностью по монтажу, наладке и техническому обслуживанию средств охранной сигнализации
  kaz: Күзет қызметін, жеке күзет ұйымында басшы және күзетші лауазымдарын атқаратын жұмыскерлерді даярлау және біліктілігін арттыру жөніндегі мамандандырылған оқу орталықтарының қызметін және күзет сигнализациясы құралдарын монтаждау, ретке келтіру және техникалық қызмет көрсету жөніндегі қызметті мемлекеттік бақылау бойынша тәуекел дәрежесін бағалау өлшемшарттарын, тексеру парақтарының нысандарын бекіту туралы
