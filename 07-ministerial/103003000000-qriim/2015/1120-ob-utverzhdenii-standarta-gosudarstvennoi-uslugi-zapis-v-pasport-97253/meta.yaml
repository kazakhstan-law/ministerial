  title:
    rus: О внесении изменения в приказ Министра внутренних дел Республики Казахстан от 20 ноября 2015 года № 945 «Об утверждении стандартов государственной услуги «Запись в паспорт гражданина Республики Казахстан о детях в возрасте до шестнадцати лет в случаях выезда совместно с родителями за границу с вклеиванием их фотографий»
    kaz: «Қазақстан Республикасы азаматының паспортына ата-аналарымен бірге шетелге шыққан жағдайларда он алты жасқа дейінгі балалар туралы фотосуреттері жапсырылған жазба» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 20 қарашадағы № 945 бұйрығына өзгеріс енгізу туралы
