  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра внутренних дел Республики Казахстан от 19 мая 2015 года № 462 «Об утверждении регламентов государственных услуг в сфере оборота наркотических средств, психотропных веществ и их прекурсоров»
    kaz: «Есірткі құралдарының, психотроптық заттар мен олардың прекурсорларының айналымы саласындағы мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы» Қазақстан Республикасының Ішкі істер министрі міндетін атқарушының 2015 жылғы 19 мамырдағы № 462 бұйрығына өзгерістер енгізу туралы
