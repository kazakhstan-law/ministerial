title:
  rus: Об утверждении квалификационных требований к специализированным учебным центрам в области пожарной безопасности по подготовке, переподготовке и повышению квалификации специалистов профессиональных противопожарных служб
  kaz: Кәсіби өртке қарсы қызметтердің мамандарын даярлау, қайта даярлау және олардың біліктілігін арттыру жөніндегі өрт қауіпсіздігі саласындағы мамандандырылған оқу орталықтарына қойылатын біліктілік талаптарын бекіту туралы
