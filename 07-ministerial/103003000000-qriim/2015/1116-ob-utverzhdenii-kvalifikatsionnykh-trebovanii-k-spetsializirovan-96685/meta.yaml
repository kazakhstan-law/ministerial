  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 16 ноября 2015 года № 926 «Об утверждении квалификационных требований к специализированным учебным центрам в области пожарной безопасности по подготовке, переподготовке и повышению квалификации специалистов негосударственных противопожарных служб»
    kaz: «Мемлекеттік емес өртке қарсы қызметтердің мамандарын даярлау, қайта даярлау және олардың біліктілігін арттыру жөніндегі өрт қауіпсіздігі саласындағы мамандандырылған оқу орталықтарына қойылатын біліктілік талаптарын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 16 қарашадағы № 926 бұйрығына өзгерістер енгізу туралы
