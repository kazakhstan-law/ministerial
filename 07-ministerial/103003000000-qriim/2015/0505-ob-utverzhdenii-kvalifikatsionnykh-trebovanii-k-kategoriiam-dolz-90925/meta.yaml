    kaz: «Қазақстан Республикасы ішкі істер органдарының лауазымдары санаттарына қойылатын біліктілік талаптарын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 5 мамырдағы № 432 бұйрығына өзгерістер енгізу туралы
