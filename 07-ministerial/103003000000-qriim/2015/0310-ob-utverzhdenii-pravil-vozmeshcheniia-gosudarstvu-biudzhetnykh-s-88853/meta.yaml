  title:
    rus: О внесении изменений в приказы Министра внутренних дел Республики Казахстан от 10 марта 2015 года № 200 «Об утверждении Правил возмещения государству бюджетных средств, затраченных на обучение военнослужащих Национальной гвардии Республики Казахстан» и от 26 января 2016 года № 77 «Об утверждении Правил приема на обучение в военные, специальные учебные заведения Министерства внутренних дел Республики Казахстан, реализующие образовательные программы высшего образования»
    kaz: Қазақстан Республикасы Ішкі істер министрінің «Қазақстан Республикасы Ұлттық ұланының әскери қызметшілерін оқытуға жұмсалған бюджет қаражатын мемлекетке өтеу қағидаларын бекіту туралы» 2015 жылғы 10 наурыздағы № 200 және «Жоғары білімнің білім беру бағдарламаларын іске асырып жатқан Қазақстан Республикасы Ішкі істер министрлігінің әскери, арнаулы оқу орындарына оқуға қабылдау қағидаларын бекіту туралы» 2016 жылғы 26 қаңтардағы № 77 бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/215585/rus
