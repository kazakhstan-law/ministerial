requisite: Приказ Министра внутренних дел Республики Казахстан от 7 сентября 2015 года № 748. Зарегистрирован в Министерстве юстиции Республики Казахстан от 14 октября 2015 года № 12171. Утратил силу приказом Министра внутренних дел Республики Казахстан от 5 марта 2018 года № 171 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм технических средств фиксации фактов совершения уголовных и административных правонарушений и действий сотрудников подразделений дорожно-патрульной полиции органов внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы ішкі істер органдары жол-патрульдік полициясы бөліністері қызметкерлерінің қылмыстық және әкімшілік құқық бұзушылықтарды жасау фактілерін және іс-әрекетін тіркеудің техникалық құралдарының заттай нормаларын бекіту туралы
