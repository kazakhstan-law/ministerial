    kaz: «Ішкі істер органдарының кадр резервін қалыптастыру, кадр резервіне қойылатын қызметкерлердің біліктілігіне қойылатын талаптарды және кадр резервіне қойылған қызметкерлердің ведомстволық деректер банкімен жұмыс істеу қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 2 желтоқсандағы № 977 бұйрығына өзгерістер енгізу туралы
