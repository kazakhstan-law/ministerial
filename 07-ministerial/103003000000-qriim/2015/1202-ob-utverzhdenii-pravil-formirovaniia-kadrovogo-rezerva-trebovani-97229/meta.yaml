requisite: Приказ Министра внутренних дел Республики Казахстан от 2 декабря 2015 года № 977. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 декабря 2015 года № 12598. Утратил силу приказом Министра внутренних дел Республики Казахстан от 18 марта 2025 года № 200 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил формирования кадрового резерва, требований к квалификации сотрудников, зачисляемых в кадровый резерв, и работы с ведомственным банком данных сотрудников, зачисленных в кадровый резерв органов внутренних дел
  kaz: Ішкі істер органдарының кадр резервін қалыптастыру, кадр резервіне қойылатын қызметкерлердің біліктілігіне қойылатын талаптарды және кадр резервіне қойылған қызметкерлердің ведомстволық деректер банкімен жұмыс істеу қағидаларын бекіту туралы
