title:
  rus: Об утверждении Правил организации деятельности участковых инспекторов полиции, ответственных за организацию работы участкового пункта полиции, участковых инспекторов полиции и их помощников
  kaz: Учаскелік полиция пунктінің жұмысын ұйымдастыруға жауапты учаскелік полиция инспекторларының, учаскелік полиция инспекторлары мен олардың көмекшілерінің қызметін ұйымдастыру қағидаларын бекіту туралы
