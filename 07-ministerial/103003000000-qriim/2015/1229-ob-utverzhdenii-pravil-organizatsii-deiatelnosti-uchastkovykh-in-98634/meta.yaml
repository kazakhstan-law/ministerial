  title:
    rus: О внесении изменений в некоторые приказы Министра внутренних дел Республики Казахстан и признании утратившим силу приказа Министра внутренних дел Республики Казахстан от 17 июля 2014 года № 438 «Об утверждении Правил назначения участковых инспекторов полиции» и пункта 5 Перечня некоторых приказов Министра внутренних дел Республики Казахстан, в которые вносятся изменения и дополнения, утвержденного приказом Министра внутренних дел Республики Казахстан от 6 февраля 2020 года № 91 «О внесении изменений и дополнений в некоторые приказы Министра внутренних дел Республики Казахстан»
    kaz: Қазақстан Республикасы Ішкі істер министрінің кейбір бұйрықтарына өзгерістер енгізу және «Учаскелік полиция инспекторларын тағайындау қағидасын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2014 жылғы 17 шілдедегі № 438 бұйрығының және «Қазақстан Республикасы Ішкі істер министрінің кейбір бұйрықтарына өзгерістер мен толықтырулар енгізу туралы» Қазақстан Республикасы Ішкі істер министрінің 2020 жылғы 6 ақпандағы № 91 бұйрығымен бекітілген Қазақстан Республикасы Ішкі істер министрінің кейбір бұйрықтарына енгізілетін өзгерістер мен толықтырулар тізбесінің 5-тармағының күші жойылды деп тану туралы
