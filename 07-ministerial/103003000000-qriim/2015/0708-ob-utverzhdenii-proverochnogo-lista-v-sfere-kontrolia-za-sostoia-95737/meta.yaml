act_code: '95737'
requisite: Приказ Министра внутренних дел Республики Казахстан от 8 июля 2015 года № 582. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 ноября 2015 года № 12317. Утратил силу приказом Министра внутренних дел Республики Казахстан от 29 июля 2020 года № 540 (вводится в действие с 14 ноября 2020 года)
title:
  rus: Об утверждении проверочного листа в сфере контроля за состоянием антитеррористической защиты объектов, уязвимых в террористическом отношении, за исключением объектов Республики Казахстан, охраняемых Вооруженными Силами, другими войсками и воинскими формированиями Республики Казахстан, а также специальными государственными органами, и соблюдением их руководителями требований, предусмотренных законодательством Республики Казахстан о противодействии терроризму
  kaz: Қазақстан Республикасының Қарулы Күштері, басқа да әскерлері мен әскери құралымдары, сондай-ақ арнаулы мемлекеттік органдар күзететін Қазақстан Республикасының объектілерін қоспағанда, террористік тұрғыдан осал объектілердің терроризмге қарсы қорғалу жағдайына  және олардың басшыларының Қазақстан Республикасының терроризмге қарсы іс-қимыл туралы  заңнамасында көзделген талаптарды сақтауына бақылау саласындағы тексеру парағын бекіту туралы
