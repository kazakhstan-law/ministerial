  title:
    rus: О признании утратившим силу Приказа Министра внутренних дел Республики Казахстан от 8 июля 2015 года № 582 «Об утверждении проверочного листа в сфере контроля за состоянием антитеррористической защиты объектов, уязвимых в террористическом отношении, за исключением объектов Республики Казахстан, охраняемых Вооруженными Силами, другими войсками и воинскими формированиями Республики Казахстан, а также специальными государственными органами, и соблюдением их руководителями требований, предусмотренных законодательством Республики Казахстан о противодействии терроризму»
    kaz: «Қазақстан Республикасының Қарулы Күштері, басқа да әскерлері мен әскери құралымдары, сондай-ақ арнаулы мемлекеттік органдар күзететін Қазақстан Республикасының объектілерін қоспағанда, террористік тұрғыдан осал объектілердің терроризмге қарсы қорғалу жағдайына және олардың басшыларының Қазақстан Республикасының терроризмге қарсы іс-қимыл туралы заңнамасында көзделген талаптарды сақтауына бақылау саласындағы тексеру парағын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 8 шілдедегі № 582 бұйрығының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/145205/rus
