  title:
    rus: О внесении изменений в приказы Министра внутренних дел Республики Казахстан от 24 января 2015 года № 48 «Об утверждении Программы курсов обучения по специальной подготовке специалистов негосударственных противопожарных служб, а также образца свидетельства об их окончании» и от 13 июля 2018 года № 514 «Об утверждении Правил аттестации негосударственных противопожарных служб»
    kaz: «Мемлекеттік емес өртке қарсы қызметтердің мамандарын арнайы даярлау бойынша оқыту курстарының бағдарламасын, сондай-ақ оларды бітіргені туралы куәліктің үлгісін бекіту туралы» 2015 жылғы 24 қаңтардағы № 48 және «Мемлекеттік емес өртке қарсы қызметтерді аттестаттау қағидаларын бекіту туралы» 2018 жылғы 13 шілдедегі № 514 Қазақстан Республикасы Ішкі істер министрінің бұйрықтарына өзгерістер енгізу туралы
