act_code: '98059'
requisite: Приказ Министра внутренних дел Республики Казахстан от 10 декабря 2015 года № 1015 ДСП. Зарегистрирован в Министерстве юстиции Республики Казахстан от 22 января 2016 года № 12915. Утратил силу приказом Министра внутренних дел Республики Казахстан от 1 августа 2019 года № 669 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм снабжения средствами индивидуальной бронезащиты, активной обороны, обеспечения специальных операции инженерного вооружения, техническими средствами охраны, взрывчатыми веществами и средствами взрывания воинских частей и военных учебных заведений Национальной гвардии Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық ұланының әскери бөлімдері мен әскери оқу орындарын жеке броньды қорғау, белсенді қорғаныс, арнайы операцияларды қамтамасыз ету, инженерлік қару-жарақ құралдарымен, күзеттің техникалық құралдарымен, жарылғыш заттармен және жару құралдарымен жабдықтаудың заттай нормаларын бекіту туралы
