  title:
    rus: О внесении изменений и дополнений в приказы Министра внутренних дел Республики Казахстан от 29 декабря 2015 года № 1098 «Об утверждении Правил организации деятельности участковых инспекторов полиции по делам несовершеннолетних органов внутренних дел» и от 30 января 2016 года № 89 «Об утверждении Правил взаимодействия подразделений органов внутренних дел Республики Казахстан по осуществлению учета лиц, освобожденных из мест лишения свободы»
    kaz: Қазақстан Республикасы Ішкі істер министрінің «Ішкі істер органдарының кәмелетке толмағандардың істері жөніндегі учаскелік полиция инспекторларының қызметін ұйымдастыру қағидаларын бекіту туралы» 2015 жылғы 29 желтоқсандағы № 1098 және «Бас бостандығынан айыру орындарынан босатылған адамдарды есепке алуды жүзеге асыру бойынша Қазақстан Республикасы ішкі істер органдары бөлімшелерінің өзара іс-қимыл жасау қағидаларын бекіту туралы» 2016 жылғы 30 қаңтардағы № 89 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/222735/rus
