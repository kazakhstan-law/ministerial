title:
  rus: Об утверждении Правил организации деятельности участковых инспекторов полиции по делам несовершеннолетних органов внутренних дел
  kaz: Ішкі істер органдарының кәмелетке толмағандардың істері жөніндегі учаскелік полиция инспекторларының қызметін ұйымдастыру қағидаларын бекіту туралы
