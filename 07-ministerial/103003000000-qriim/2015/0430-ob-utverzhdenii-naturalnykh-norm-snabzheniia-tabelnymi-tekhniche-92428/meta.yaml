title:
  rus: Об утверждении натуральных норм снабжения табельными техническими средствами и имуществом службы горючего и смазочных материалов в Национальной гвардии Республики Казахстан
  kaz: Қазақстан Республикасының Ұлттық ұланында жанар және жағармай материалдары қызметінің табельдік техникалық құралдарымен және мүлкімен жабдықтаудың заттай нормаларын бекіту туралы
