  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 30 апреля 2015 года № 421 «Об утверждении норм снабжения техническими средствами Национальной гвардии Республики Казахстан и подразделений Министерства внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасының Ұлттық ұланын және Қазақстан Республикасы Ішкі істер министрлігі бөліністерін техникалық құралдармен жабдықтау нормаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 30 сәуірдегі № 421 бұйрығына өзгерістер енгізу туралы
