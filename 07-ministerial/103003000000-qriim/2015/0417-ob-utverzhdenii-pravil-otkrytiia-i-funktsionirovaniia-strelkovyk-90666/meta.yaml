title:
  rus: Об утверждении Правил открытия и функционирования стрелковых тиров (стрельбищ) и стендов
  kaz: Атыс тирлері (атыс орындары) мен стендтерін ашу және олардың жұмыс істеу қағидаларын бекіту туралы
