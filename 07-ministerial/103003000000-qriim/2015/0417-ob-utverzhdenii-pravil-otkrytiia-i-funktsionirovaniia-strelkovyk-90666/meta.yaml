  title:
    rus: Об утверждении форм разрешений и (или) приложений к ним, в сферах оборота гражданского и служебного оружия и патронов к нему, гражданских пиротехнических веществ и изделий с их применением, на открытие и функционирование стрелковых тиров (стрельбищ) и стендов, а также о внесении изменений в некоторые приказы Министра внутренних дел Республики Казахстан
    kaz: Азаматтық және қызметтік қару мен оның патрондарының, азаматтық пиротехникалық заттар мен олар қолданылып жасалған бұйымдардың айналымы саласындағы, атыс тирлерін (атыс алаңдары) және стенділерді ашуға және олардың жұмыс істеуіне рұқсаттардың және (немесе) оларға қосымшалардың нысандарын бекіту және Қазақстан Республикасы Ішкі істер министрінің кейбір бұйрықтарына өзгерістер енгізу туралы
