requisite: Приказ Министра внутренних дел Республики Казахстан от 7 апреля 2015 года № 25/ДСП. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 сентября 2015 года № 12085. Утратил силу приказом Министра внутренних дел Республики Казахстан от 9 января 2024 года № 9 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Норм снабжения артиллерийским вооружением и боевыми комплектами боеприпасов, бронетанковым вооружением и техникой, автомобильной техникой, имуществом и оборудованием Национальной гвардии Республики Казахстан
  kaz: Қазақстан Республикасының Ұлттық ұланын артиллериялық қару-жарақпен және жауынгерлік оқ-дәрілер жинағымен, броньдытанк қару-жарақпен және жауынгерлік оқ-дәрілер жинағымен, броньдытанк қару-жарағымен және техникасымен, автомобиль техникасымен, мүлікпен және құрал-жабдықтармен жабдықтау нормаларын бекіту туралы
