    kaz: «Қазақстан Республикасы ішкі істер органдарының бөліністеріндегі моральдық-психологиялық ахуалдың жай-күйіне жыл сайынғы социологиялық мониторинг жүргізудің қағидалары мен әдістемесін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 31 желтоқсандағы № 1094 бұйрығына өзгеріс енгізу туралы
