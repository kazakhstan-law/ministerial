act_code: '97457'
requisite: Приказ Министра внутренних дел Республики Казахстан от 2 декабря 2015 года № 980. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 января 2016 года № 12808
title:
  rus: Об утверждении Инструкции о возмещении затрат военнослужащим Национальной гвардии Республики Казахстан и военно-следственных органов Министерства внутренних дел Республики Казахстан, проходящим воинскую службу по контракту на должностях солдат, сержантов (старшин), прослужившим не менее восьми лет в календарном исчислении, на обучение в организациях высшего и (или) послевузовского образования (далее – ОВПО) Республики Казахстан на платной основе в размере пятидесяти процентов от стоимости обучения за счет бюджетных средств
  kaz: Қазақстан Республикасы Ұлттық ұланының және Қазақстан Республикасы Ішкі істер министрлігі әскери-тергеу органдарының сарбаздар, сержанттар (старшиналар) лауазымдарында күнтізбелік есептеуде кемінде сегіз жыл қызмет өткерген келісімшарт бойынша әскери қызмет өткеретін әскери қызметшілердің Қазақстан Республикасының жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарында (бұдан әрі – ЖЖОКБҰ) ақылы негізде оқуға жұмсалатын шығындарын бюджет қаражаты есебінен оқыту құнының елу пайызы мөлшерінде өтеуі туралы нұсқаулықты бекіту туралы
