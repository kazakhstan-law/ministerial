title:
  rus: Об утверждении Правил предоставления технических вспомогательных (компенсаторных) средств и специальных средств передвижения осужденным  с инвалидностью, отбывающим наказание в учреждениях и находящимся под стражей
  kaz: Мүгедектігі бар, мекемелерде жазасын өтеп жүрген және күзетпен қамауда отырған сотталғандарға техникалық көмекші (компенсаторлық) құралдар мен арнайы жүріп-тұру құралдарын ұсыну қағидаларын бекіту туралы
