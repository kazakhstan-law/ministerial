  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 28 декабря 2015 года № 1088 «Об утверждении Правил предоставления технических вспомогательных (компенсаторных) средств и специальных средств передвижения осужденным с инвалидностью, отбывающим наказание в учреждениях и находящимся под стражей»
    kaz: «Мүгедектігі бар, мекемелерде жазасын өтеп жүрген және күзетпен қамауда отырған сотталғандарға техникалық көмекші (компенсаторлық) құралдар мен арнайы жүріп-тұру құралдарын ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 28 желтоқсандағы № 1088 бұйрығына өзгерістер мен толықтырулар енгізу туралы
