  requisite: Приказ Министра внутренних дел Республики Казахстан от 3 апреля 2017 года № 238. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 мая 2017 года № 15122.  Утратил силу приказом Министра внутренних дел Республики Казахстан от 20 апреля 2026 года № 290 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 30 апреля 2015 года № 416 «Об утверждении норм снабжения вещевым имуществом военнослужащих Национальной гвардии Республики Казахстан в мирное время»
    kaz: «Қазақстан Республикасы Ұлттық ұланының әскери қызметшілерін бейбіт уақытқа арналған заттай мүлікпен жабдықтаудың нормаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 30 сәуірдегі № 416 бұйрығына өзгерістер енгізу туралы
