  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 30 апреля 2015 года № 416 «Об утверждении норм снабжения вещевым имуществом военнослужащих Национальной гвардии, военно-следственных органов Министерства внутренних дел Республики Казахстан в мирное время»
    kaz: «Қазақстан Республикасы Ұлттық ұланының, Қазақстан Республикасы Ішкі істер министрлігі әскери-тергеу органдарының әскери қызметшілерін бейбіт уақытқа арналған заттай мүлікпен жабдықтаудың нормаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 30 сәуірдегі № 416 бұйрығына өзгерістер енгізу туралы
