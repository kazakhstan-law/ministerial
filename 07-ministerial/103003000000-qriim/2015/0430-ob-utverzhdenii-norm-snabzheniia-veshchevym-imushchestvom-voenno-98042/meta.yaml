act_code: '98042'
requisite: Приказ Министра внутренних дел Республики Казахстан от 30 апреля 2015 года № 416. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 января 2016 года № 12913. Утратил силу приказом Министра внутренних дел Республики Казахстан от 20 апреля 2026 года № 290 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм снабжения вещевым имуществом военнослужащих Национальной гвардии Республики Казахстан, военно-следственных органов Министерства внутренних дел Республики Казахстан в мирное время
  kaz: Қазақстан Республикасы Ұлттық ұланының, Қазақстан Республикасы Ішкі істер министрлігі әскери-тергеу органдарының  әскери қызметшілерін бейбіт уақытқа арналған заттай мүлікпен жабдықтаудың нормаларын бекіту туралы
