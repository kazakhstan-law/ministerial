act_code: '96334'
requisite: Приказ Министра внутренних дел Республики Казахстан от 20 апреля 2015 года № 375. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 декабря 2015 года № 12411. Утратил силу приказом Министра внутренних дел Республики Казахстан от 7 октября 2025 года № 752 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм снабжения техническими средствами воспитания и другим культурно-просветительным имуществом, комплектами полиграфического оборудования типографий войсковых газет и журналов Национальной гвардии Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық ұланының техникалық тәрбие құралдарының және басқа да мәдени-ағарту мүлкінің, әскери газеттер мен журналдар баспаханаларының полиграфиялық жабдық жиынтықтарының заттай нормаларын бекіту туралы
