  kaz: Алып қойылған, ерiктi түрде тапсырылған, тауып алынған қаруды, оқ-дәрiлердi, жарылғыш материалдарды ішкi iстер органдарында қабылдау, есепке алу, сақтау және олардың сақталуын қамтамасыз ету қағидаларын бекiту туралы
