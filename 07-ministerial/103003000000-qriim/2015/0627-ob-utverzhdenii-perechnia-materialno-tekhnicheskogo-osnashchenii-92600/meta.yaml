  title:
    rus: О внесении дополнения в приказ Министра внутренних дел Республики Казахстан от 27 июня 2015 года № 567 «Об утверждении Перечня материально-технического оснащения, строительства, реконструкции и ремонта зданий и сооружений для оказания содействия местными исполнительными органами территориальным подразделениям и подведомственным государственным учреждениям Министерства по чрезвычайным ситуациям Республики Казахстан»
    kaz: «Жергілікті атқарушы органдардың Қазақстан Республикасы Төтенше жағдайлар министрлігінің аумақтық бөлімшелеріне және ведомстволық бағынысты мемлекеттік мекемелеріне жәрдем көрсетуі үшін материалдық-техникалық жарақтандыру, ғимараттар мен құрылыстарды салу, реконструкциялау және жөндеу тізбесін бекiту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 27 маусымдағы № 567 бұйрығына толықтыру енгізу туралы
