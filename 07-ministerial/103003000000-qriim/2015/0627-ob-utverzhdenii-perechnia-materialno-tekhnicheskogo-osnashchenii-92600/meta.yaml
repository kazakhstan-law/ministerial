requisite: Приказ Министра внутренних дел Республики Казахстан от 27 июня 2015 года № 567. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 июля 2015 года № 11808. Утратил силу приказом Министра по чрезвычайным ситуациям Республики Казахстан от 12 сентября 2025 года № 394 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Перечня материально-технического оснащения, строительства, реконструкции и ремонта зданий и сооружений для оказания содействия местными исполнительными органами территориальным подразделениям и подведомственным государственным учреждениям Министерства по чрезвычайным ситуациям Республики Казахстан
  kaz: Жергілікті атқарушы органдардың Қазақстан Республикасы Төтенше жағдайлар министрлігінің аумақтық бөлімшелеріне және ведомстволық бағынысты мемлекеттік мекемелеріне жәрдем көрсетуі үшін материалдық-техникалық жарақтандыру, ғимараттар мен құрылыстарды салу, реконструкциялау және жөндеу тізбесін бекiту туралы
