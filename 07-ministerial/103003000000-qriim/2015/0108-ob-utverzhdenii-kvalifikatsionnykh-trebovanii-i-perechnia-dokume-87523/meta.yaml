  title:
    rus: О внесении дополнений в приказ Министра внутренних дел Республики Казахстан от 8 января 2015 года № 5 «Об утверждении квалификационных требований и перечня документов, подтверждающих соответствие им, для деятельности по разработке, производству, ремонту, торговле, коллекционированию, экспонированию гражданского и служебного оружия и патронов к нему»
    kaz: «Азаматтық және қызметтік қару мен оның патрондарын әзірлеу, өндіру, жөндеу, сату, коллекцияға жинау, экспонаттау жөніндегі қызметке қойылатын біліктілік талаптары мен оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 8 қаңтардағы № 5 бұйрығына толықтырулар енгізу туралы
