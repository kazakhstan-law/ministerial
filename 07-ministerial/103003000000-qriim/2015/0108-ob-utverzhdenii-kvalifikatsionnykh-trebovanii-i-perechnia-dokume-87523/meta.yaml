  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 8 января 2015 года № 5 "Об утверждении квалификационных требований и перечня документов, подтверждающих соответствие им, для деятельности по разработке, производству, ремонту, торговле, коллекционированию, экспонированию и приобретению гражданского и служебного оружия и патронов к нему"
    kaz: '"Азаматтық және қызметтік қару мен оның патрондарын әзірлеу, өндіру, жөндеу, сату, коллекцияға жинау, экспонаттау және сатып алу жөніндегі қызметке қойылатын біліктілік талаптары мен оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 8 қаңардағы № 5 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/104276/rus
