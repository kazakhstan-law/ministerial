  kaz: Қазақстан Республикасы ішкі істер органдарының тергеу және анықтау бөліністері қызметкерлерінің қызметін ұйымдастыру және олардың жұмысына процестік бақылауды жүзеге асыру жөніндегі нұсқаулықты бекіту туралы
