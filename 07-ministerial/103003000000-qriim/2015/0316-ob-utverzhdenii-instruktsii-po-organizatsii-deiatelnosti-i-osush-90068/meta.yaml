  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 16 марта 2015 года № 220 «О мерах по совершенствованию деятельности подразделений следствия, дознания и военно-следственных подразделений органов внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасы ішкі істер органдарының тергеу, анықтау бөліністерінің және әскери-тергеу бөліністерінің қызметін жетілдіру бойынша шаралар туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 16 наурыздағы № 220 бұйрығына өзгерістер енгізу туралы
