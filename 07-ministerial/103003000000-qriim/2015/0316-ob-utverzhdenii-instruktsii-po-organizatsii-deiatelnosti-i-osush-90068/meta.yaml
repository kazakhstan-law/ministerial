  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 16 марта 2015 года № 220 «Об утверждении Инструкции по организации деятельности подразделений следствия, дознания и военно-следственных органов органов внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасы ішкі істер органдарының тергеу, анықтау бөліністері және әскери-тергеу органдарының қызметін ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 16 наурыздағы № 220 бұйрығына өзгерістер енгізу туралы
