    kaz: «Қазақстан Республикасынан тыс жерлерге тұрақты тұру үшін шығуға арналған құжаттарды ресімдеу» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 30 мамырдағы № 498 бұйрығына өзгеріс енгізу туралы
