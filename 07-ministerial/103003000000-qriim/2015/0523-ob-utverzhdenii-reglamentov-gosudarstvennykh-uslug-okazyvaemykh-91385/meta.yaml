  title:
    rus: О внесении изменения и дополнения в приказ исполняющего обязанности Министра внутренних дел Республики Казахстан от 23 мая 2015 года № 475 «Об утверждении регламентов государственных услуг, оказываемых Комитетом по чрезвычайным ситуациям Министерства внутренних дел Республики Казахстан».
    kaz: «Қазақстан Республикасы Ішкі істер министрлігінің Төтенше жағдайлар комитеті көрсететін мемлекеттік қызметтер регламенттерін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің міндетін атқарушының 2015 жылғы 23 мамырдағы № 475 бұйрығына өзгеріс пен толықтыру енгізу туралы.
