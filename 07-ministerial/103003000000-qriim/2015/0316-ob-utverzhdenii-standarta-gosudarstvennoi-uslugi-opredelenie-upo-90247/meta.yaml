act_code: '90247'
requisite: Приказ Министра внутренних дел Республики Казахстан от 16 марта 2015 года № 237. Зарегистрирован в Министерстве юстиции Республики Казахстан от 22 мая 2015 года № 11132. Утратил силу приказом Министра внутренних дел Республики Казахстан от 28 марта 2020 года № 261 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги "Определение уполномоченным органом специализированного учебного центра по подготовке и повышению квалификации работников, занимающих должности руководителя и охранника в частной охранной организации"
  kaz: '"Уәкілетті органның жеке күзет ұйымында басшы және күзетші лауазымдарын атқаратын жұмыскерлерді даярлау және біліктілігін арттыру жөніндегі мамандандырылған оқу орталығын белгілеу" мемлекеттік қызмет стандартын бекіту туралы'
