  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 16 марта 2015 года № 237 «Об утверждении стандарта государственной услуги «Определение уполномоченным органом специализированного учебного центра по подготовке и повышению квалификации работников, занимающих должности руководителя и охранника в частной охранной организации»
    kaz: «Уәкілетті органның жеке күзет ұйымында басшы және күзетші лауазымдарын атқаратын жұмыскерлерді даярлау және біліктілігін арттыру жөніндегі мамандандырылған оқу орталығын белгілеу» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 16 наурыздағы № 237 бұйрығына өзгерістер енгізу туралы
