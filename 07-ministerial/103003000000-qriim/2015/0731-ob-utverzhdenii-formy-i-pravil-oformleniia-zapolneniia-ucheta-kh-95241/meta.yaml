requisite: Приказ от 31.07.2015 № 649, Министерство внутренних дел Республики Казахстан. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 сентября 2015 года № 12054. Утратил силу приказом Министра внутренних дел Республики Казахстан от 31 мая 2016 года № 583
title:
  rus: Об утверждении формы и Правил оформления, заполнения, учета, хранения, передачи, расходования, уничтожения формуляра для изготовления документов, удостоверяющих личность гражданина Республики Казахстан
  kaz: Қазақстан Республикасы азаматының жеке басын куәландыратын құжаттарын дайындау үшін формулярдың нысанын және оны ресімдеу, толтыру, есепке алу, сақтау, тапсыру, жұмсау, жою қағидаларын бекіту туралы
