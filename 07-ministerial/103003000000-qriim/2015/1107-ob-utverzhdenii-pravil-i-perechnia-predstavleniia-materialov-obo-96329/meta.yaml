  title:
    rus: О внесении дополнений в приказ Министра внутренних дел Республики Казахстан от 7 ноября 2015 года № 890 «Об утверждении Правил и перечня представления материалов, обосновывающих наличие чрезвычайной ситуации социального, природного и техногенного характера, мероприятий по ее локализации и ликвидации, необходимость проведения мероприятий по обеспечению правового режима чрезвычайного положения, соответствующих обоснований и расчетов материально-технических, финансовых и людских ресурсов»
    kaz: «Әлеуметтік, табиғи және техногендік сипаттағы төтенше жағдайлардың, оларды оқшаулау және жою жөніндегі іс-шаралардың орын алғанын, төтенше жағдайдың құқықтық режимін қамтамасыз ету жөніндегі іс-шараларды өткізу қажеттілігін негіздейтін материалдарды, материалдық-техникалық, қаржылық және адами ресурстардың тиісті негіздемелерін ұсыну қағидаларын және тізбесін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 7 қарашадағы № 890 бұйрығына толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/134655/rus
