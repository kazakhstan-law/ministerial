act_code: '96329'
requisite: Приказ Министра внутренних дел Республики Казахстан от 7 ноября 2015 года № 890. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 декабря 2015 года № 12396
title:
  rus: Об утверждении Правил и перечня представления материалов, обосновывающих наличие чрезвычайной ситуации социального, природного и техногенного характера, мероприятий по ее локализации и ликвидации, необходимость проведения мероприятий по обеспечению правового режима чрезвычайного положения, соответствующих обоснований и расчетов материально-технических, финансовых и людских ресурсов
  kaz: Әлеуметтік, табиғи және техногендік сипаттағы төтенше жағдайлардың, оларды оқшаулау және жою жөніндегі іс-шаралардың орын алғанын, төтенше жағдайдың құқықтық режимін қамтамасыз ету жөніндегі іс-шараларды өткізу қажеттілігін негіздейтін материалдарды, материалдық-техникалық, қаржылық және адами ресурстардың тиісті негіздемелері мен есептеулерін ұсыну қағидалары мен тізбесін бекіту туралы
