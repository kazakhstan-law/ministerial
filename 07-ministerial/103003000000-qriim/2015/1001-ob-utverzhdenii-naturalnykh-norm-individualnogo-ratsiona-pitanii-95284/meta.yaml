  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 1 октября 2015 года № 800 «Об утверждении натуральных норм индивидуального рациона питания сотрудников подразделений специального назначения, продовольствия, оборудования, столово-кухонного инвентаря организаций образования и лечебных учреждений, служебных животных Министерства внутренних дел Республики Казахстан
    kaz: «Қазақстан Республикасы Ішкі істер министрлігінің арнайы мақсаттағы бөліністері қызметкерлерін тамақтандырудың жеке рационының, білім беру ұйымдары мен емдеу мекемелерінің, қызметтік жануарларының азық-түлiгінің, жабдығының, асханалық-ас үй мүкәммалының заттай нормаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 1 қазандағы № 800 бұйрығына өзгерістер енгізу туралы
