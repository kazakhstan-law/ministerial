act_code: '95284'
requisite: Приказ Министра внутренних дел Республики Казахстан от 1 октября 2015 года № 800. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 ноября 2015 года № 12260. Утратил силу приказом Министра внутренних дел Республики Казахстан от 31 июля 2025 года № 572 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм индивидуального рациона питания сотрудников подразделений специального назначения, продовольствия, оборудования, столово-кухонного инвентаря организаций образования и лечебных учреждений, служебных животных Министерства внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы Ішкі істер министрлігінің арнайы мақсаттағы бөліністері қызметкерлерін тамақтандырудың  жеке рационының, білім беру ұйымдары мен емдеу мекемелерінің, қызметтік жануарларының азық-түлiгінің, жабдығының, асханалық-ас үй мүкәммалының заттай нормаларын бекіту туралы
