  code: '111256'
  requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 14 февраля 2017 года № 112 и Министра национальной экономики Республики Казахстан от 3 марта 2017 года № 106. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 апреля 2017 года № 15000. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 30 октября 2018 года № 757 и Министра национальной экономики Республики Казахстан от 30 октября 2018 года № 32 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в совместный приказ Министра внутренних дел Республики Казахстан от 11 декабря 2015 года № 1018 и исполняющего обязанности Министра национальной экономики Республики Казахстан от 6 января 2016 года № 1 «Об утверждении критериев оценки степени риска, проверочных листов по государственному контролю за охранной деятельностью, за деятельностью специализированных учебных центров по подготовке и повышению квалификации работников, занимающих должности руководителя и охранника в частной охранной организации, и за деятельностью по монтажу, наладке и техническому обслуживанию средств охранной сигнализации»
    kaz: «Күзет қызметін, жеке күзет ұйымында басшы және күзетші лауазымдарын атқаратын жұмыскерлерді даярлау және біліктілігін арттыру жөніндегі мамандандырылған оқу орталықтарының қызметін және күзет сигнализациясы құралдарын монтаждау, ретке келтіру және техникалық қызмет көрсету жөніндегі қызметті мемлекеттік бақылау бойынша тәуекел дәрежесін бағалау өлшемшарттарын, тексеру парақтарын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 11 желтоқсандағы № 1018 және Қазақстан Республикасы Ұлттық экономика министрінің міндетін атқарушының 2016 жылғы 6 қаңтардағы № 1 бірлескен бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/111256/rus
