act_code: '99412'
requisite: Совместный приказ Министра внутренних дел Республики Казахстан от 11 декабря 2015 года № 1018 и и.о. Министра национальной экономики Республики Казахстан от 6 января 2016 года № 1. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 февраля 2016 года № 13162. Утратил силу совместным приказом Министра внутренних дел Республики Казахстан от 30 октября 2018 года № 757 и Министра национальной экономики Республики Казахстан от 30 октября 2018 года № 32 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении критериев оценки степени риска, проверочных листов по государственному контролю за охранной деятельностью, за деятельностью специализированных учебных центров по подготовке и повышению квалификации работников, занимающих должности руководителя и охранника в частной охранной организации, и за деятельностью по монтажу, наладке и техническому обслуживанию средств охранной сигнализации
  kaz: Күзет қызметін, жеке күзет ұйымында басшы және күзетші лауазымдарын атқаратын жұмыскерлерді даярлау және біліктілігін арттыру жөніндегі мамандандырылған оқу орталықтарының қызметін және күзет сигнализациясы құралдарын монтаждау, ретке келтіру және техникалық қызмет көрсету жөніндегі қызметті мемлекеттік бақылау бойынша тәуекел дәрежесін бағалау өлшемшарттарын, тексеру парақтарын бекіту туралы
