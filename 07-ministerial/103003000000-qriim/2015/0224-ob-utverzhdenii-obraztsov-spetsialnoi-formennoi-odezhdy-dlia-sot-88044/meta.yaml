requisite: Приказ Министра внутренних дел Республики Казахстан от 24 февраля 2015 года № 146. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 марта 2015 года № 10542. Утратил силу приказом Министра по чрезвычайным ситуациям Республики Казахстан от 15 сентября 2025 года № 400 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении образцов специальной форменной одежды для сотрудников и иных работников органов гражданской защиты и подведомственных ведомству уполномоченного органа государственных предприятий
  kaz: Азаматтық қорғау органдарының және уәкілетті органның ведомствосына ведомстволық бағынысты мемлекеттік кәсіпорындардың қызметкерлері мен өзге де жұмыскерлері үшін арнайы нысанды киім үлгілерін бекіту туралы
