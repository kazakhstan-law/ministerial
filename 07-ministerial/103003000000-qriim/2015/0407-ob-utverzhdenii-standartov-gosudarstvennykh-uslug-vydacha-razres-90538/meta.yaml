  title:
    rus: О внесении изменения в приказ Министра внутренних дел Республики Казахстан от 29 ноября 2010 года № 496 «Об утверждении Правил регистрации и рассмотрения ходатайства о присвоении статуса беженца»
    kaz: «Босқын мәртебесiн беру туралы өтiнiшхатты тiркеу мен қараудың қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2010 жылғы 29 қарашадағы № 496 бұйрығына өзгеріс енгізу туралы
