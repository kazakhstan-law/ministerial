  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 19 марта 2015 года № 254 «Об утверждении стандарта государственной услуги «Оформление документов на выезд за пределы Республики Казахстан на постоянное место жительства»
    kaz: «Қазақстан Республикасының шегінен тыс тұрақты тұрғылықты жерге кетуге арналған құжаттарды ресімдеу» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 19 наурыздағы № 254 бұйрығына өзгерістер енгізу туралы
