requisite: Приказ Министра внутренних дел Республики Казахстан от 19 марта 2015 года № 254. Зарегистрирован в Министерстве юстиции Республики Казахстан от 12 мая 2015 года № 11030. Утратил силу приказом Министра внутренних дел Республики Казахстан от 27 марта 2020 года № 259 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Оформление документов на выезд за пределы Республики Казахстан на постоянное место жительства»
  kaz: «Қазақстан Республикасынан тыс жерлерге тұрақты тұру үшін шығуға арналған құжаттарды ресімдеу» мемлекеттік көрсетілетін қызмет  стандартын  бекіту  туралы (Тақырыбы жаңа редакцияда – Қазақстан Республикасы Ішкі істер министрінің 2017 жылғы 4 желтоқсандағы № 789 (алғаш ресми жарияланған күнінен кейін күнтізбелік  он күн өткен соң қолданысқа енгізіледі) бұйрығымен)
