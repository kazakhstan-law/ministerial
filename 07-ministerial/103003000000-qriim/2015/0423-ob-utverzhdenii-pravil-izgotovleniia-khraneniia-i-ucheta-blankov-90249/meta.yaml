  title:
    rus: О внесении изменения в приказ Министра внутренних дел Республики Казахстан от 23 апреля 2015 года № 386 "Об утверждении Правил изготовления, хранения и учета бланков свидетельств о регистрации транспортных средств, присвоения и изготовления государственных регистрационных номерных знаков транспортных средств в подразделениях органов внутренних дел Республики Казахстан"
    kaz: '"Қазақстан Республикасы ішкі істер органдарының бөліністерінде көлік құралдарын тіркеу туралы куәліктердің бланкілерін дайындау, сақтау және есепке алу, көлік құралдарының мемлекеттік тіркеу нөмірі белгілерін беру және дайындау қағидаларын бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 23 сәуірдегі № 386 бұйрығына өзгеріс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/100214/rus
