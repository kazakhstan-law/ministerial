title:
  rus: Об утверждении Правил изготовления, хранения и учета бланков свидетельств о регистрации транспортных средств, присвоения и изготовления государственных регистрационных номерных знаков транспортных средств
  kaz: Көлік құралдарын тіркеу туралы куәліктердің бланкілерін дайындау, сақтау және есепке алу, көлік құралдарының мемлекеттік тіркеу нөмірі белгілерін беру және дайындау қағидаларын бекіту туралы
