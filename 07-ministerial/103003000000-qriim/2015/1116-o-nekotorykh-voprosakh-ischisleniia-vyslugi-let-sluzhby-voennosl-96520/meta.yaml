requisite: Приказ Министра внутренних дел Республики Казахстан от 16 ноября 2015 года № 925. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 декабря 2015 года № 12432. Утратил силу приказом Министра внутренних дел Республики Казахстан от 21 февраля 2024 года № 151 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О некоторых вопросах исчисления выслуги лет службы военнослужащих внутренних войск, Национальной гвардии Республики Казахстан и сотрудников органов внутренних дел Республики Казахстан на льготных условиях для назначения пенсионных выплат за выслугу лет
  kaz: Еңбек сіңірген жылдары үшін зейнетақы төлемдерін тағайындау үшін Ішкі әскерлер, Қазақстан Республикасының Ұлттық ұланы әскери қызметшілерінің және Қазақстан Республикасының ішкі істер органдары қызметкерлерінің еңбек сіңірген жылдарын жеңілдік жағдайларында есептеудің кейбір мәселелері туралы
