  code: '132515'
  requisite: Приказ Министра внутренних дел Республики Казахстан от 17 июня 2019 года № 546. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 июня 2019 года № 18852. Утратил силу приказом Министра внутренних дел Республики Казахстан от 21 февраля 2024 года № 151 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 16 ноября 2015 года № 925 «О некоторых вопросах исчисления выслуги лет службы военнослужащих внутренних войск, Национальной гвардии Республики Казахстан и сотрудников органов внутренних дел Республики Казахстан на льготных условиях для назначения пенсионных выплат за выслугу лет»
    kaz: «Еңбек сіңірген жылдары үшін зейнетақы төлемдерін тағайындау үшін Ішкі әскерлер, Қазақстан Республикасының Ұлттық ұланы әскери қызметшілерінің және Қазақстан Республикасының ішкі істер органдары қызметкерлерінің еңбек сіңірген жылдарын жеңілдік жағдайларында есептеудің кейбір мәселелері туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 16 қарашадағы № 925 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/132515/rus
