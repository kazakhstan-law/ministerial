  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 21 января 2015 года № 40 «Об утверждении Правил присвоения, повышения, подтверждения, снижения и снятия классной квалификации сотрудникам и военнослужащим органов внутренних дел»
    kaz: «Ішкі істер органдарының қызметкерлері мен әскери қызметшілеріне сыныптық біліктілігін беру, жоғарылату, растау, төмендету және алып тастау қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 21 қаңтардағы № 40 бұйрығына өзгерістер мен толықтырулар енгізу туралы
