  title:
    rus: О внесении изменений и дополнений в приказ и.о. Министра внутренних дел Республики Казахстан от 23 мая 2015 года № 474 «Об утверждении регламентов государственных услуг в сфере оборота гражданского и служебного оружия и патронов к нему, гражданских пиротехнических веществ и изделий с их применением»
    kaz: «Азаматтық және қызметтік қару мен оның патрондарының, азаматтық пиротехникалық заттар мен олар қолданылып жасалған бұйымдардың айналымы саласындағы мемлекеттік көрсетілетін қызметтер көрсету регламентін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің міндетін атқарушының 2015 жылғы 23 мамырдағы № 474 бұйрығына өзгерістер мен толықтырулар енгізу туралы
