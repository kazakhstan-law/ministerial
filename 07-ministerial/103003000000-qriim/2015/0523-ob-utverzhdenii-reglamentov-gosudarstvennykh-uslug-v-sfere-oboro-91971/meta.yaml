  requisite: Приказ Министра внутренних дел Республики Казахстан от 15 июля 2017 года № 488. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 августа 2017 года № 15518. Утратил силу приказом Министра внутренних дел Республики Казахстан от 27 марта 2020 года № 254 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
  title:
    rus: «О внесении изменений и дополнений в приказ исполняющего обязанности Министра внутренних дел Республики Казахстан от 23 мая 2015 года № 474 «Об утверждении регламентов электронных государственных услуг в сферах оборота гражданского и служебного оружия и патронов к нему, гражданских пиротехнических веществ и изделий с их применением, взрывчатых материалов»
    kaz: «Азаматтық және қызметтік қару мен оның патрондарының, азаматтық пиротехникалық заттар мен олар қолданылып жасалған бұйымдардың, жарылғыш материалдардың айналымы саласындағы мемлекеттік көрсетілетін қызметтер көрсету регламентін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің міндетін атқарушының 2015 жылғы 23 мамырдағы № 474 бұйрығына өзгерістер мен толықтырулар енгізу туралы»
  link: https://zan.gov.kz/client/#!/doc/114217/rus
