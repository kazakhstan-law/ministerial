act_code: '91971'
requisite: Приказ и.о. Министра внутренних дел Республики Казахстан от 23 мая 2015 года № 474. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 июля 2015 года № 11514. Утратил силу приказом Министра внутренних дел Республики Казахстан от 27 марта 2020 года № 254 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов государственных услуг в сфере оборота гражданского и служебного оружия и патронов к нему, гражданских пиротехнических веществ и изделий с их применением
  kaz: Азаматтық және қызметтік қару мен оның патрондарының, азаматтық пиротехникалық заттар мен олар қолданылып жасалған бұйымдардың айналымы саласындағы мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы
