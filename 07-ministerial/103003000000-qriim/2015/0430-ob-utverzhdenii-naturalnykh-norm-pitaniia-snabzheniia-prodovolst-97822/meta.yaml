requisite: Приказ Министра внутренних дел Республики Казахстан от 30 апреля 2015 года № 420. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 декабря 2015 года № 12632. Утратил силу приказом Министра внутренних дел Республики Казахстан от 7 октября 2025 года № 752 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм питания, снабжения продовольствием, кормами, оборудованием, столово-кухонной посудой и техникой продовольственной службы Национальной гвардии Республики Казахстан на мирное время
  kaz: Қазақстан Республикасының Ұлттық ұланын бейбіт уақытқа тамақтандырудың, азық-түлікпен, азықпен, жабдықпен, асханалық-ас үйлік ыдыспен және азық-түлік қызметінің техникасымен жабдықтаудың арналған заттай нормаларын бекіту туралы
