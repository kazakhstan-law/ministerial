  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 30 апреля 2015 года № 420 «Об утверждении натуральных норм питания, снабжения продовольствием, кормами, оборудованием, столово-кухонной посудой и техникой продовольственной службы Национальной гвардии Республики Казахстан на мирное время»
    kaz: «Қазақстан Республикасының Ұлттық ұланында тамақтандырудың, азық-түлiкпен, азықпен, жабдықпен, асханалық-ас үйлік ыдыспен және азық-түлiк қызметінің техникасымен жабдықтаудың бейбiт уақытқа арналған заттай нормаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 30 сәуірдегі № 420 бұйрығына өзгерістер енгізу туралы
