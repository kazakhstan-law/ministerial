  title:
    rus: О внесении изменения в приказ Министра внутренних дел Республики Казахстан от 7 апреля 2015 года № 314 «Об утверждении Правил оказания медицинской помощи гражданам, свобода которых ограничена, а также лицам, отбывающим наказание по приговору суда в местах лишения свободы, помещенным в специальные учреждения»
    kaz: «Бас бостандығы шектеулі азаматтарға, сондай-ақ сот үкімі бойынша жазасын бас бостандығынан айыру орындарында өтеп жүрген, арнайы мекемелерге орналастырылған адамдарға медициналық көмек көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 7 сәуірдегі № 314 бұйрығына өзгеріс енгізу туралы
