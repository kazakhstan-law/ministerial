act_code: '90456'
requisite: Приказ Министра внутренних дел Республики Казахстан от 7 апреля 2015 года № 314. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 мая 2015 года № 11206. Утратил силу приказом Министра внутренних дел Республики Казахстан от 28 октября 2020 года № 745 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания медицинской помощи гражданам, свобода которых ограничена, а также лицам, отбывающим наказание по приговору суда в местах лишения свободы, помещенным в специальные учреждения
  kaz: Бас бостандығы шектеулі азаматтарға, сондай-ақ сот үкімі бойынша жазасын бас бостандығынан айыру орындарында өтеп жүрген, арнайы мекемелерге орналастырылған адамдарға медициналық көмек көрсету қағидаларын бекіту туралы
