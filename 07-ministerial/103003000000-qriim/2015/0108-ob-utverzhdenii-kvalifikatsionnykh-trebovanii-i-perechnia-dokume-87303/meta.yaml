  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 8 января 2015 года № 6 "Об утверждении квалификационных требований и перечня документов, подтверждающих соответствие им, для деятельности по разработке, производству, торговле, использованию и приобретению гражданских пиротехнических веществ и изделий с их применением"
    kaz: '"Азаматтық пиротехникалық заттар мен олар қолданылып жасалған бұйымдарды әзірлеу, өндіру, сату, пайдалану және сатып алу жөніндегі қызметке қойылатын біліктілік талаптары мен оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 2015 жылғы 8 қаңтардағы № 6 бұйрығына өзгерістер енгізу туралы'
