title:
  rus: Об утверждении квалификационных требований и перечня документов, подтверждающих соответствие им, для деятельности по разработке, производству, торговле, использованию гражданских пиротехнических веществ и изделий с их применением
  kaz: Азаматтық пиротехникалық заттар мен олар қолданылып жасалған бұйымдарды әзірлеу, өндіру, сату, пайдалану жөніндегі қызметке қойылатын біліктілік талаптары мен оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы
