  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 24 декабря 1998 года № 470 "Об утверждении Положения о военно-врачебной экспертизе и Правил медицинского освидетельствования в органах внутренних дел и внутренних войсках Министерства внутренних дел Республики Казахстан"
    kaz: '"Қазақстан Республикасының iшкi iстер органдары мен iшкi әскерлерiнде әскери-дәрiгерлiк сараптамалау туралы ережелер мен Дәрiгерлiк куәландыру ережелерiн бекiту туралы" Қазақстан Республикасы Iшкi iстер министрiнiң 1998 жылғы 24 желтоқсандағы N 470 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы'
