  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 24 декабря 1998 года № 470 "Об утверждении Положения о военно-врачебной экспертизе и Правил медицинского освидетельствования в органах внутренних дел и внутренних войсках Министерства внутренних дел Республики Казахстан", зарегистрированный в Министерстве юстиции Республики Казахстан 26 марта 1999 года № 716
    kaz: Қазақстан Республикасының Әділет министрлігінде 1999 жылғы 26 наурызда N 716 тіркелген "Қазақстан Республикасының ішкі істер органдары мен ішкі әскерлерінде әскери-дәрігерлік сараптамалау туралы ережелер мен Дәрігерлік куәландыру ережелерін бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 1998 жылғы 24 желтоқсандағы N 470 бұйрығына өзгерістер мен толықтырулар енгізу туралы
