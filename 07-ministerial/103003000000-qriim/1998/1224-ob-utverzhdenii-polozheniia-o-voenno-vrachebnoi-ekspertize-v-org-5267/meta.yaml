title:
  rus: Об утверждении Положения о военно-врачебной экспертизе в органах внутренних дел Республики Казахстан и Правил медицинского освидетельствования в органах внутренних дел Республики Казахстан на мирное и военное время
  kaz: Қазақстан Республикасының ішкі істер органдары әскери-дәрігерлік сараптама туралы ережені және Бейбіт және соғыс уақытында Қазақстан Республикасының ішкі істер органдары дәрігерлік куәландыру ережесін бекіту туралы
