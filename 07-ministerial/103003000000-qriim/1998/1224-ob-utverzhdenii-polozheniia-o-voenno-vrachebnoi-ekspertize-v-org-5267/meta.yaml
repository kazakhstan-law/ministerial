  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 24 декабря 1998 года № 470 "Об утверждении Положения о военно-врачебной экспертизе и Правил медицинского освидетельствования в органах внутренних дел и внутренних войсках МВД Республики Казахстан"
    kaz: '"Қазақстан Республикасының ішкі істер органдары мен ішкі әскерлерінде әскери-дәрігерлік сараптамалау туралы ережелер мен Дәрігерлік куәландыру ережелерін бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 1998 жылғы 24 желтоқсандағы N 470 бұйрығына өзгерістер енгізу туралы'
