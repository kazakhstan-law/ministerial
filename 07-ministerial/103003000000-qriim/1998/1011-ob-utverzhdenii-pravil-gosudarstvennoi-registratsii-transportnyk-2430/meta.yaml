  title:
    rus: О внесении дополнений в Приказ Министерства внутренних дел Республики Казахстан от 12 октября 1998 года № 343 "Об утверждении Правил государственной регистрации транспортных средств и прицепов к ним в Республике Казахстан", зарегистрированном в Министерстве юстиции Республики Казахстан 23 февраля 1999 года № 690
    kaz: Қазақстан Республикасы Әдiлет министрлiгiнде 1999 жылғы 23 ақпандағы N 690 тiркелген, "Қазақстан Республикасындағы көлiк құралдарын және олардың тiркемелерiн тiркеу ережесiн бекiту туралы" Қазақстан Республикасы Iшкi iстер министрлiгiнiң 1998 жылғы 12 қазандағы N 343 бұйрығына толықтырулар енгiзу туралы
