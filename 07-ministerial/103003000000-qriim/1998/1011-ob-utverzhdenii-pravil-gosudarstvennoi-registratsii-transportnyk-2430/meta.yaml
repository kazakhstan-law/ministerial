  title:
    rus: О внесении изменений и дополнений в Приказ Министра внутренних дел Республики Казахстан от 12.10.98 г. № 343 об утверждении "Правил государственной регистрации транспортных средств и прицепов к ним в Республике Казахстан", "Правил о порядке получения права на управление транспортными средствами, приема экзаменов, выдачи гражданам водительских удостоверений"
    kaz: '"Қазақстан Республикасында көлік құралдарын және олардың тіркемелерін мемлекеттік тіркеудің ережелерін", "Көлік құралдарын басқару құқығын алу, емтихан қабылдау, азаматтарға жүргізуші куәлігін беру тәртібі туралы ережелерін" бекіту туралы Қазақстан Республикасы Ішкі істер министрінің 1998 жылғы 12 қазандағы N 343 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/10417/rus
