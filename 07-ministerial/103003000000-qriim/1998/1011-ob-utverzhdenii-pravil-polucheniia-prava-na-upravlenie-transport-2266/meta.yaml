  requisite: Приказ И.о. Министра внутренних дел Республики Казахстан от 24 марта 2004 года № 184. Зарегистрирован Министерством юстиции Республики Казахстан 26 мая 2004 года № 2873. Утратил силу приказом Министра внутренних дел Республики Казахстан от 26 февраля 2010 года № 90
  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 12 октября 1998 года № 343 "Об утверждении "Правил государственной регистрации транспортных средств и прицепов к ним в Республике Казахстан", "Правил о порядке приобретения, приема, учета, хранения и расходования бланков справок-счетов на приобретение транспортных средств, узлов и агрегатов к ним", "Правил о порядке получения права на управление транспортными средствами, приема экзаменов, выдачи гражданам водительских удостоверений", "Правил о порядке приема, учета, хранения, расходования бланков регистрационных документов, водительских удостоверений, номерных знаков транспортных средств и проведения проверок в регистрационно-экзаменационных подразделениях дорожной полиции МВД Республики Казахстан", (зарегистрированные в Министерстве юстиции Республики Казахстан за №№ 679, 690)
    kaz: '"Қазақстан Республикасында көлік құралдары мен тіркемелерді мемлекеттік тіркеуден өткізу Ережелерін", "Көлік құралдарын, олардың тораптары мен агрегаттарын сатып алуға берілетін анықтама-есепшоттың бланкілерін қабылдап алу, есепке алу, сақтау және жұмсау тәртібі туралы Ережелерді", "Көлік құралдарын басқару құқығын алу, емтихан қабылдау, азаматтарға жүргізуші куәлігін беру тәртібі туралы Ережелерді", "Тіркеу құжаттары мен жүргізуші көліктерінің бланкілерін, көлік құралдарының нөмірлік белгілерін қабылдап алу, есепке алу, сақтау, жұмсау және ҚР ІІМ Жол полициясының тіркеу-емтихан бөлімшелерінде тексеріс өткізу тәртібі туралы Ережелерді" бекіту туралы" (Қазақстан Республикасының Әділет министрлігінде №№ 679, 690 болып тіркелген), Қазақстан Республикасы Ішкі істер министрінің 1998 жылғы 12 қазандағы № 343 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
