  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 12 октября 1998 года № 343 "Об утверждении Правил государственной регистрации транспортных средств и прицепов к ним в Республике Казахстан, Правил о порядке получения права на управление транспортными средствами, приема экзаменов, выдачи гражданам водительских удостоверений"
    kaz: '"Қазақстан Республикасында көлік құралдарын және олардың тіркемелерін мемлекеттік тіркеудің Ережелерін", "Көлік құралдарын басқару құқығын алу, емтихан қабылдау, азаматтарға жүргізуші куәлігін беру тәртібі туралы ережелерді бекіту туралы" Қазақстан Республикасы Ішкі істер министрінің 1998 жылғы 12 қазандағы N 343 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
