title:
  rus: Об утверждении Правил получения права на управление транспортными средствами, приема экзаменов, выдачи гражданам водительских удостоверений
  kaz: '"Көлік құралдарын басқару құқығын алу, емтихан қабылдау, азаматтарға жүргізуші куәлігін беру ережесін" бекіту туралы'
