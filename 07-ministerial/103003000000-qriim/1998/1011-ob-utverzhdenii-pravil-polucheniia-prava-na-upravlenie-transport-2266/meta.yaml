  title:
    rus: О внесении изменений и дополнений в Приказ МВД Республики Казахстан от 12.10.98 г. № 343, а также в утвержденные им "Правила государственной регистрации транспортных средств и прицепов к ним в Республике Казахстан, Правила о порядке получения права на управление транспортными средствами, приема экзаменов, выдачи гражданам водительских удостоверений"
    kaz: Қазақстан Республикасы Ішкіісминінің 1998 жылғы 12 қарашадағы N 343 бұйрығына, сондай-ақ сонымен бекітілген "Қазақстан Республикасындағы көлік құралдары мен олардың тіркемелерін мемлекеттік тіркеудің тәртібіне", "Көлік құралдарын басқару құқығын алудың, емтихандар қабылдаудың, азаматтарға жүргізуші куәліктерін берудің тәртібі туралы тәртіпке өзгерістер мен толықтырулар енгізу туралы"
  link: https://zan.gov.kz/client/#!/doc/8551/rus
