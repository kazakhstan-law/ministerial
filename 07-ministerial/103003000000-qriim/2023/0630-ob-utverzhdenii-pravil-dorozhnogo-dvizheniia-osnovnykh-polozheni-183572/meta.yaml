  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 30 июня 2023 года № 534 «Об утверждении Правил дорожного движения, Основных положений по допуску транспортных средств к эксплуатации, перечня оперативных и специальных служб, транспорт которых подлежит оборудованию специальными световыми и звуковыми сигналами и окраске по специальным цветографическим схемам»
    kaz: «Жол жүрісі қағидаларын, Көлік құралдарын пайдалануға рұқсат беру жөніндегі негізгі ережелерді, көлігі арнайы жарық және дыбыс сигналдарымен жабдықталуға және арнайы түсті-графикалық схемалар бойынша боялуға тиіс жедел және арнайы қызметтер тізбесін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2023 жылғы 30 маусымдағы № 534 бұйрығына өзгерістер мен толықтырулар енгізу туралы
