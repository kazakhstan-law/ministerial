  title:
    rus: О внесении изменений в приказы Министра внутренних дел Республики Казахстан от 2 февраля 2023 года № 115 «Об утверждении Инструкции по несению патрульно-постовой службы сотрудниками полиции Республики Казахстан по обеспечению охраны общественного порядка на объектах транспорта и метрополитена» и от 15 февраля 2023 года № 164 «Об утверждении Инструкции по несению патрульно-постовой службы сотрудниками полиции Республики Казахстан по обеспечению охраны общественного порядка и дорожной безопасности в населенных пунктах и на загородных автомобильных дорогах»
    kaz: «Көлік және метрополитен нысандарында қоғамдық тәртіпті сақтауды қамтамасыз ету бойынша Қазақстан Республикасы полиция қызметкерлерінің патрульдік-бекеттік қызметті атқаруы жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2023 жылғы 2 ақпандағы № 115 және «Елді мекендерде және қала сыртындағы автомобиль жолдарында қоғамдық тәртіпті сақтау және жол қауіпсіздігін қамтамасыз ету бойынша Қазақстан Республикасы полиция қызметкерлерінің патрульдік-бекеттік қызметті атқаруы жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2023 жылғы 15 ақпандағы № 164 бұйрықтарына өзгерістер енгізу туралы
