requisite: Приказ Министра внутренних дел Республики Казахстан от 15 февраля 2023 года № 164. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 февраля 2023 года № 31917
title:
  rus: Об утверждении Инструкции по несению патрульно-постовой службы сотрудниками полиции Республики Казахстан по обеспечению охраны общественного порядка и дорожной безопасности в населенных пунктах и на загородных автомобильных дорогах
  kaz: Елді мекендерде және қала сыртындағы автомобиль жолдарында қоғамдық тәртіпті сақтау және жол қауіпсіздігін қамтамасыз ету бойынша Қазақстан Республикасы полиция қызметкерлерінің патрульдік-бекеттік қызметті атқаруы жөніндегі нұсқаулықты бекіту туралы
