  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 30 июня 2023 года № 533 «Об утверждении образцов паспорта гражданина Республики Казахстан, удостоверения личности гражданина Республики Казахстан, вида на жительство иностранца в Республике Казахстан, удостоверения лица без гражданства, проездного документа»
    kaz: «Қазақстан Республикасының азаматы паспортының, Қазақстан Республикасының азаматы жеке куәлігінің, шетелдіктің Қазақстан Республикасында тұруына ықтиярхаттың, азаматтығы жоқ адам куәлігінің, жол жүру құжатының үлгілерін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2023 жылғы 30 маусымдағы № 533 бұйрығына өзгерістер енгізу туралы
