title:
  rus: Об утверждении образцов паспорта гражданина Республики Казахстан, удостоверения личности гражданина Республики Казахстан, вида на жительство иностранца в Республике Казахстан, удостоверения лица без гражданства, проездного документа и требований к их защите
  kaz: Қазақстан Республикасының азаматы паспортының, Қазақстан Республикасының азаматы жеке куәлігінің, шетелдіктің Қазақстан Республикасында тұруына ықтиярхаттың, азаматтығы жоқ адам куәлігінің, жол жүру құжатының үлгілерін және оларды қорғауға қойылатын талаптарды бекіту туралы
