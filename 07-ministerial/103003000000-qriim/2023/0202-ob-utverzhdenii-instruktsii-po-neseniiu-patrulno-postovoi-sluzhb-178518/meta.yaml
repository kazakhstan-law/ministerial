title:
  rus: Об утверждении Инструкции по несению патрульно-постовой службы сотрудниками полиции Республики Казахстан по обеспечению охраны общественного порядка на объектах транспорта и метрополитена
  kaz: Көлік және метрополитен нысандарында қоғамдық тәртіпті сақтауды қамтамасыз ету бойынша Қазақстан Республикасы полиция қызметкерлерінің патрульдік-бекеттік қызметті атқаруы жөніндегі нұсқаулықты бекіту туралы
