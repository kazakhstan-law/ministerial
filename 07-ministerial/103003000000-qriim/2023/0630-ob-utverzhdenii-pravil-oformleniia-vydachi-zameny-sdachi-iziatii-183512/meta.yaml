act_code: '183512'
requisite: Приказ Министра внутренних дел Республики Казахстан от 30 июня 2023 года № 532. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июня 2023 года № 32971
title:
  rus: Об утверждении Правил оформления, выдачи, замены, сдачи, изъятия и уничтожения паспорта гражданина Республики Казахстан, удостоверения личности гражданина Республики Казахстан, вида на жительство иностранца в Республике Казахстан, удостоверения лица без гражданства и проездного документа
  kaz: Қазақстан Республикасы азаматының паспортын, Қазақстан Республикасы азаматының жеке куәлігін, шетелдіктің Қазақстан Республикасында тұруына ықтиярхатты, азаматтығы жоқ адамның куәлігін және жол жүру құжатын ресімдеу, беру, ауыстыру, тапсыру, алып қою және жою қағидаларын бекіту туралы
