  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 30 июня 2023 года № 532 «Об утверждении Правил оформления, выдачи, замены, сдачи, изъятия и уничтожения паспорта гражданина Республики Казахстан, удостоверения личности гражданина Республики Казахстан, вида на жительство иностранца в Республике Казахстан, удостоверения лица без гражданства и проездного документа» и признании утратившими силу некоторые приказы Министра внутренних дел Республики Казахстан
    kaz: «Қазақстан Республикасы азаматының паспортын, Қазақстан Республикасы азаматының жеке куәлігін, шетелдіктің Қазақстан Республикасында тұруына ықтиярхатты, азаматтығы жоқ адамның куәлігін және жол жүру құжатын ресімдеу, беру, ауыстыру, тапсыру, алып қою және жою қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2023 жылғы 30 маусымдағы № 532 бұйрығына өзгерістер мен толықтырулар енгізу туралы
