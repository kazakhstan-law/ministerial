  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 16 марта 2018 года № 208 «Об утверждении Правил присвоения, повышения, подтверждения, сохранения, снижения и снятия классной квалификации сотрудников и военнослужащих органов внутренних дел»
    kaz: «Ішкі істер органдарының қызметкерлері мен әскери қызметшілерінің сыныптық біліктілігін беру, жоғарылату, растау, сақтау, төмендету және алып тастау қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2018 жылғы 16 наурыздағы № 208 бұйрығына өзгерістер мен толықтырулар енгізу туралы
