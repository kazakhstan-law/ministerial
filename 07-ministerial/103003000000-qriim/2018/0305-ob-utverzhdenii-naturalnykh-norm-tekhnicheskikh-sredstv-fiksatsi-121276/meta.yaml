act_code: '121276'
requisite: Приказ Министра внутренних дел Республики Казахстан от 5 марта 2018 года № 171. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 апреля 2018 года № 16811. Утратил силу приказом Министра внутренних дел Республики Казахстан от 28 мая 2025 года № 392 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм технических средств фиксации фактов совершения уголовных, административных правонарушений и действий сотрудников органов внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы ішкі істер органдары қызметкерлерінің іс-әрекеттерін қылмыстық, әкімшілік құқық бұзушылықтарды жасау фактілерін және тіркеудің техникалық құралдарының заттай нормаларын бекіту туралы
