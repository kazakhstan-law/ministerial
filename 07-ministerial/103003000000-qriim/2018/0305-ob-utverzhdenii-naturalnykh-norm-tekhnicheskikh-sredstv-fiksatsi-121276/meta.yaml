  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 5 марта 2018 года № 171 «Об утверждении натуральных норм технических средств фиксации фактов совершения уголовных, административных правонарушений и действий сотрудников органов внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасы ішкі істер органдары қызметкерлерінің іс-әрекеттерін қылмыстық, әкімшілік құқық бұзушылықтарды жасау фактілерін және тіркеудің техникалық құралдарының заттай нормаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2018 жылғы 5 наурыздағы № 171 бұйрығына өзгерістер енгізу туралы
