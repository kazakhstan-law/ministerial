title:
  rus: Об утверждении Перечня руководящих должностей в органах внутренних дел Республики Казахстан, замещаемых на конкурсной основе, Условия и Правила проведения конкурса на вышестоящие руководящие должности в органах внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасының ішкі істер органдарында конкурстық негізде орналасатын басшы лауазымдар тізбесін және Қазақстан Республикасының ішкі істер органдарында жоғары тұрған басшы лауазымдарға конкурс өткізу шарттары мен қағидаларын бекіту туралы
