title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) военным и специальными учебными заведениями Министерства внутренних дел Республики Казахстан и расходования ими денег от реализации товаров (работ, услуг)
  kaz: Қазақстан Республикасы Ішкі істер министрлігінің әскери және арнаулы оқу орындарының тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізу жөніндегі ақылы қызмет түрлерін көрсету және олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсау қағидаларын бекіту туралы
