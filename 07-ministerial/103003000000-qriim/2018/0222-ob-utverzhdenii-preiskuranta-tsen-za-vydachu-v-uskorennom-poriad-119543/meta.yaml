  title:
    rus: О внесении изменений и дополнения в приказ Министра внутренних дел Республики Казахстан от 22 февраля 2018 года № 143 «Об утверждении прейскуранта цен на услугу по выдаче в ускоренном порядке документов, удостоверяющих личность, оказываемую республиканским государственным предприятием на праве хозяйственного ведения»
    kaz: «Шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорын көрсететін жеке басты куәландыратын құжаттарды жеделдетілген тәртіппен беру бойынша көрсетілетін қызмет бағаларының прейскурантын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2018 жылғы 22 ақпандағы № 143 бұйрығына өзгерістер мен толықтыру енгізу туралы
