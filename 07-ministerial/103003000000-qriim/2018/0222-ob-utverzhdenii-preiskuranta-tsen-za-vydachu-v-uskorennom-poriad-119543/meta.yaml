title:
  rus: Об утверждении прейскуранта цен за выдачу в ускоренном порядке паспорта гражданина Республики Казахстан, удостоверения личности гражданина Республики Казахстан, вида на жительство иностранца в Республике Казахстан и удостоверения лица без гражданства
  kaz: Қазақстан Республикасы азаматының паспортын, Қазақстан Республикасы азаматының жеке куәлігін, шетелдіктің Қазақстан Республикасында тұруына ықтиярхатын және азаматтығы жоқ адамның куәлігін жеделдетілген тәртіппен беру үшін бағалар прейскурантын бекіту туралы
