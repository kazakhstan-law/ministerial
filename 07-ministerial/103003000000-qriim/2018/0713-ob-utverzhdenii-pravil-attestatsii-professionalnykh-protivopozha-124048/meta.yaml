title:
  rus: Об утверждении Правил аттестации профессиональных противопожарных служб на право проведения работ по предупреждению и тушению пожаров, обеспечению пожарной безопасности и проведению аварийно-спасательных работ, связанных с тушением пожаров, в организациях, населенных пунктах и на объектах
  kaz: Ұйымдарда, елді мекендерде және объектілерде өрттердің алдын алу және сөндіру, өрт қауіпсіздігін қамтамасыз ету және өрттерді сөндіруге байланысты авариялық-құтқару жұмыстарын жүргізу жөніндегі жұмыстарды жүргізу құқығына кәсіби өртке қарсы қызметтерді аттестаттау қағидаларын бекіту туралы
