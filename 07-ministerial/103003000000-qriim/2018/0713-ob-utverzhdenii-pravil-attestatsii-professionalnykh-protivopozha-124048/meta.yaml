  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 13 июля 2018 года № 514 «Об утверждении Правил аттестации негосударственных противопожарных служб»
    kaz: «Мемлекеттік емес өртке қарсы қызметтерді аттестаттау қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2018 жылғы 13 шілдедегі № 514 бұйрығына өзгерістер енгізу туралы
