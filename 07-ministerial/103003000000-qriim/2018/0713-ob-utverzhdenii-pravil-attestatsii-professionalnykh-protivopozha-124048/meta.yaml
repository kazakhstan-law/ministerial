  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 13 июля 2018 года № 514 «Об утверждении Правил аттестации негосударственных противопожарных служб» и признании утратившими силу некоторых приказов Министра внутренних дел Республики Казахстан
    kaz: «Мемлекеттік емес өртке қарсы қызметтерді аттестаттау қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2018 жылғы 13 шілдедегі № 514 бұйрығына өзгерістер мен толықтырулар енгізу және Қазақстан Республикасы Ішкі істер министрінің кейбір бұйрықтарының күші жойылды деп тану туралы
