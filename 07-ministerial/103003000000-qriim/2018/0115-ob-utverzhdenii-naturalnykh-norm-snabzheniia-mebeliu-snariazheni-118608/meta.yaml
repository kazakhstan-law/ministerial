act_code: '118608'
requisite: Приказ Министра внутренних дел Республики Казахстан от 15 января 2018 года № 25. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 февраля 2018 года № 16306. Утратил силу приказом Министра внутренних дел Республики Казахстан от 31 июля 2025 года № 572 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм снабжения мебелью, снаряжением, бумагой, инвентарем, оборудованием, спортивным и хозяйственным имуществом подразделений органов внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы ішкі істер органдарының бөліністерін жиһазбен, керек-жарақпен, қағазбен, мүкәммалмен, жабдықпен, спорттық және шаруашылық мүлікпен жабықтаудың заттай нормаларын бекіту туралы
