    kaz: «Қазақстан Республикасы ішкі істер органдарының бөліністерін жиһазбен, керек-жарақпен, қағазбен, мүкәммалмен, жабдықпен, спорттық және шаруашылық мүлікпен жабықтаудың заттай нормаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2018 жылғы 15 қаңтардағы № 25 бұйрығына өзгеріс енгізу туралы
