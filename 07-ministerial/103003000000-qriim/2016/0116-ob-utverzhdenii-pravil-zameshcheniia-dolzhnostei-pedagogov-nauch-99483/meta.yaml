  title:
    rus: О внесении изменения в приказ Министра внутренних дел Республики Казахстан от 16 января 2016 года № 33 «Об утверждении Правил замещения должностей педагогов, научных работников военных, специальных учебных заведений Министерства внутренних дел Республики Казахстан, за исключением должностей гражданских служащих»
    kaz: «Қазақстан Республикасы Ішкі істер министрлігінің әскери, арнайы оқу орындарының, азаматтық қызметшілер лауазымдарын қоспағанда, педагогтар, ғылыми қызметкерлердің лауазымдарына орналасу қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2016 жылғы 16 қаңтардағы № 33 бұйрығына өзгеріс енгізу туралы
