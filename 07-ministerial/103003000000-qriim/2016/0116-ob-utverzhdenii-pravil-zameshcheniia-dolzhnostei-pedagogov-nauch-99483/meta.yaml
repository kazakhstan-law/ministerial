title:
  rus: Об утверждении Правил замещения должностей педагогов, научных работников военных, специальных учебных заведений Министерства внутренних дел Республики Казахстан, за исключением должностей гражданских служащих
  kaz: Қазақстан Республикасы Ішкі істер министрлігінің әскери, арнайы оқу орындарының, азаматтық қызметшілер лауазымдарын қоспағанда, педагогтар, ғылыми қызметкерлердің лауазымдарына орналасу қағидаларын бекіту туралы
