    kaz: «Қазақстан Республикасының ішкі істер органдары қызметкерлерін кәсіби даярлау, қайта даярлау және олардың біліктілігін арттырудың мазмұны мен жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2016 жылғы 20 сәуірдегі № 422 бұйрығына өзгерістер енгізу туралы
