act_code: '101579'
requisite: Приказ Министра внутренних дел Республики Казахстан от 18 марта 2016 года № 281. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 апреля 2016 года № 13624
title:
  rus: Об утверждении Правил направления сотрудников правоохранительных органов и государственной фельдъегерской службы, членов их семей, проживающих совместно с ними, пенсионеров и детей сотрудников указанных органов, погибших при исполнении служебных обязанностей, до достижения ими совершеннолетия, в медицинские организации органов внутренних дел, дислоцированные в городах Астана и Алматы
  kaz: Құқық қорғау органдарының және мемлекеттік фельдъегерлік қызмет қызметкерлерін, олармен бірге тұратын отбасы мүшелерін, зейнеткерлерін және көрсетілген органдардың қызметтік міндеттерін атқару кезінде қаза тапқан қызметкерлерінің балаларын олар кәмелеттік жасқа толғанға дейін Астана және Алматы қалаларында орналасқан ішкі істер органдарының медициналық ұйымдарына жіберу қағидаларын бекіту туралы
