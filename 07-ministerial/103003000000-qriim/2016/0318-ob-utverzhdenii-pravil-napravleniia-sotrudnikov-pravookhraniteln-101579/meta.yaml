  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 18 марта 2016 года № 281 «Об утверждении Правил направления сотрудников правоохранительных органов и государственной фельдъегерской службы, членов их семей, проживающих совместно с ними, пенсионеров и детей сотрудников указанных органов, погибших при исполнении служебных обязанностей, до достижения ими совершеннолетия, в республиканские ведомственные медицинские организации, дислоцированные в городах Астана и Алматы»
    kaz: «Құқық қорғау органдарының және мемлекеттік фельдъегерлік қызмет қызметкерлерін, олармен бірге тұратын отбасы мүшелерін, зейнеткерлерін және көрсетілген органдардың қызметтiк мiндеттерiн атқару кезiнде қаза тапқан қызметкерлерінің балаларын олар кәмелеттік жасқа толғанға дейін Астана және Алматы қалаларында орналасқан республикалық ведомстволық медициналық ұйымдарға жіберу қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2016 жылғы 18 наурыздағы № 281 бұйрығына өзгерістер енгізу туралы
