act_code: '110393'
requisite: Приказ Министра внутренних дел Республики Казахстан от 29 ноября 2016 года № 1111. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 марта 2017 года № 14858. Утратил силу приказом Министра внутренних дел Республики Казахстан от 15 июня 2020 года № 470 (вводится в действие с 1 июля 2021 года)
title:
  rus: Об утверждении Технического регламента «Требования по оборудованию зданий, помещений и сооружений системами автоматического пожаротушения и автоматической пожарной сигнализации, оповещения и управления эвакуацией людей при пожаре»
  kaz: «Ғимараттарды, үй-жайлар мен құрылыстарды автоматты өрт сөндіру және автоматты өрт сигнализациясы, өрт кезінде адамдарды құлақтандыру және оларды эвакуациялауды басқару жүйелерімен жабдықтау жөніндегі талаптар» техникалық регламентін бекіту туралы
