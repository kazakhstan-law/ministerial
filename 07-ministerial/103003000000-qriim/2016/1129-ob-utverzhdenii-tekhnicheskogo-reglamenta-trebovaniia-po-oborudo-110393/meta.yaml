  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 23 июня 2017 года № 439 «Об утверждении технического регламента «Общие требования к пожарной безопасности» и признании утратившими силу некоторых приказов и структурных элементов приказа Министра внутренних дел Республики Казахстан
    kaz: «Өрт қауіпсіздігіне қойылатын жалпы талаптар» техникалық регламентін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2017 жылғы 23 маусымдағы № 439 бұйрығына өзгерістер енгізу және Қазақстан Республикасы Ішкі істер министрінің кейбір бұйрықтарының және бұйрығының құрылымдық элементтерінің күші жойылды деп тану туралы
