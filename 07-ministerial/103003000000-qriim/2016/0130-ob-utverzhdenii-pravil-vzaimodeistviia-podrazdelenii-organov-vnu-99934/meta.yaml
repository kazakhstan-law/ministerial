title:
  rus: Об утверждении Правил взаимодействия подразделений органов внутренних дел Республики Казахстан по осуществлению учета лиц, освобожденных из мест лишения свободы
  kaz: Бас бостандығынан айыру орындарынан босатылған адамдарды есепке алуды жүзеге асыру бойынша Қазақстан Республикасы ішкі істер органдары бөлімшелерінің өзара іс-қимыл жасау қағидаларын бекіту туралы
