  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 2 сентября 2016 года № 876 «Об утверждении фасона и расцветки полевой формы одежды и специальной одежды военнослужащих Национальной гвардии Республики Казахстан ивоенно-следственных органов  Министерства внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасының Ұлттық ұланы және Қазақстан Республикасы Ішкі істер министрлігінің әскери-тергеу органдары әскери қызметшілерінің далалық киім нысанының және арнайы киімінің үлгісін және түсін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2016 жылғы 2 қыркүйектегі № 876 бұйрығына өзгерістер енгізу туралы
