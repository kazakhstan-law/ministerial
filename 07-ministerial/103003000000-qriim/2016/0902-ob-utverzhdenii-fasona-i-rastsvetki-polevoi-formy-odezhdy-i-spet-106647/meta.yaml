title:
  rus: Об утверждении фасона и расцветки полевой формы одежды и специальной одежды, знаков различия военнослужащих Национальной гвардии Республики Казахстан и военно-следственных органов Министерства внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасының Ұлттық ұланы және Қазақстан Республикасы Ішкі істер министрлігінің әскери-тергеу органдары әскери қызметшілерінің далалық киім нысанының және арнайы киімінің үлгісін және түсін, айырым белгілерін бекіту туралы
