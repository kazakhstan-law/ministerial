act_code: '102478'
requisite: Приказ Министра внутренних дел Республики Казахстан от 29 марта 2016 года № 313. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 мая 2016 года № 13694
title:
  rus: Об утверждении Инструкции по организации деятельности подразделений органов внутренних дел по контролю в сфере оборота гражданского и служебного оружия
  kaz: Ішкі істер органдарының азаматтық және қызметтік қару айналымы саласындағы бақылау жөніндегі бөлімшелерінің қызметін ұйымдастыру туралы нұсқаулықты бекіту туралы
