  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 8 января 2016 года № 1 дсп «Об утверждении Правил по обеспечению пропускного и внутриобъектового режимов на территории и в административные здания центрального аппарата Министерства внутренних дел Республики Казахстан и территориальных органов внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасы Ішкі істер министрлігі орталық аппаратының және Қазақстан Республикасы аумақтық ішкі істер органдарының аумағы мен әкімшілік ғимараттарына өткізу және объектішілік режимді қамтамасыз ету жөніндегі қағидаларды бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2016 жылғы 8 қаңтардағы № 1 қбпү бұйрығына өзгерістер мен толықтырулар енгізу туралы
