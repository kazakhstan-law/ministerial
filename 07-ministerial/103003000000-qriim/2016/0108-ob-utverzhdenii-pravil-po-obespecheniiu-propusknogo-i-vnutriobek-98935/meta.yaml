title:
  rus: Об утверждении Правил по обеспечению пропускного и внутриобъектового режимов на территории и в административные здания центрального аппарата Министерства внутренних дел Республики Казахстан и территориальных органов внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы Ішкі істер министрлігі орталық аппаратының және Қазақстан Республикасы аумақтық ішкі істер органдарының аумағы мен әкімшілік ғимараттарына өткізу және объектіішілік режимді қамтамасыз ету жөніндегі қағидаларды бекіту туралы
