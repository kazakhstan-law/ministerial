title:
  rus: Об утверждении Квалификационных характеристик должностей педагогов в военных, специальных учебных заведениях Министерства внутренних дел Республики Казахстан, за исключением должностей гражданских служащих
  kaz: Қазақстан Республикасы Ішкі істер министрлігінің әскери, арнайы оқу орындарында, азаматтық қызметшілердің лауазымдарын қоспағанда, педагогтар лауазымдарының біліктілік сипаттамаларын бекіту туралы
