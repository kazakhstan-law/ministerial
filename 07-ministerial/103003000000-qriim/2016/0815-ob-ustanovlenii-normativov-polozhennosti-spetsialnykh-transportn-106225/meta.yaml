title:
  rus: Об установлении нормативов положенности специальных транспортных средств республиканских государственных предприятий на праве хозяйственного ведения учреждений Комитета уголовно-исполнительной системы Министерства внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы Ішкі істер министрлігі Қылмыстық-атқару жүйесі комитеті мекемелерінің шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорындарының арнайы көлік құралдарының тиесілік нормативтерін белгілеу туралы
