  title:
    rus: О внесении изменения в приказ Министра внутренних дел Республики Казахстан от 20 января 2016 года № 48 «Об утверждении регламента государственной услуги «Запись в паспорт гражданина Республики Казахстан о детях в возрасте до шестнадцати лет в случаях выезда совместно с родителями за границу с вклеиванием их фотографий»
    kaz: «Қазақстан Республикасы азаматының паспортына ата-аналарымен бірге шетелге шыққан жағдайларда он алты жасқа дейінгі балалар туралы фотосуреттері жапсырылған жазба» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2016 жылғы 20 қаңтардағы № 48 бұйрығына өзгеріс енгізу туралы
