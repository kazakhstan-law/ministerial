act_code: '99411'
requisite: Приказ Министра внутренних дел Республики Казахстан от 20 января 2016 года № 48. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2016 года № 13145. Утратил силу приказом Министра внутренних дел Республики Казахстан от 30 марта 2020 года № 267 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Запись в паспорт гражданина Республики Казахстан о детях в возрасте до шестнадцати лет  в случаях выезда совместно с родителями за границу с вклеиванием их фотографий»
  kaz: «Қазақстан Республикасы азаматының паспортына ата-аналарымен бірге шетелге шыққан жағдайларда он алты жасқа дейінгі балалар туралы фотосуреттері жапсырылған жазба» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
