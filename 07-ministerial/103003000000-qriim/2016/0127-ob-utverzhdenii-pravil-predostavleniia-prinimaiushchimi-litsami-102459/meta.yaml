    kaz: «Қабылдаушы тұлғалардың өздеріне келетін көшіп келушілер, сондай-ақ шетелдіктер мен азаматтығы жоқ адамдардың Қазақстан Республикасының аумағы бойынша транзиттік жүріп-тұруы туралы ақпаратты ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2016 жылғы 27 қаңтардағы № 83 бұйрығына өзгеріс енгізу туралы
