title:
  rus: Об утверждении Правил предоставления принимающими лицами информации о пребывающих у них иммигрантах, а также транзитного проезда иностранцев и лиц без гражданства по территории Республики Казахстан
  kaz: Қабылдаушы тұлғалардың өздеріне келетін көшіп келушілер, сондай-ақ шетелдіктер мен азаматтығы жоқ адамдардың Қазақстан Республикасының аумағы бойынша транзиттік жүріп-тұруы туралы ақпаратты ұсыну қағидаларын бекіту туралы
