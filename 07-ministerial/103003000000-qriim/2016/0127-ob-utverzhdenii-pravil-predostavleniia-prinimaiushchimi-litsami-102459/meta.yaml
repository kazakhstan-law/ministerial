  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 27 января 2016 года № 83 «Об утверждении Правил регистрации паспортов иммигрантов, предоставления принимающими лицами информации о пребывающих у них иммигрантах, изготовления и выдачи миграционных карточек, передвижения иммигрантов, въезда иммигрантов в отдельные местности (территории), закрытые для посещения иностранцами, а также транзитного проезда иностранцев и лиц без гражданства по территории Республики Казахстан»
    kaz: «Көшіп келушілердің паспорттарын тіркеу, қабылдаушы тұлғалардың өздеріне келген көшіп келушілер туралы ақпаратты беру, көші-қон карточкаларын жасау және беру, көшіп келушілердің орын ауыстыру, шетелдіктердің болуы үшін жабық жекелеген жерлерге (аумақтарға) көшіп келушілердің келу, сондай-ақ Қазақстан Республикасының аумағы арқылы шетелдіктер мен азаматтығы жоқ адамдардың транзиттік жол жүру қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2016 жылғы 27 қаңтардағы № 83 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/140998/rus
