  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 31 августа 2016 года № 870 «Об утверждении Перечня должностей в органах внутренних дел Республики Казахстан, замещаемых на конкурсной основе, Правил проведения конкурса и стажировки при поступлении на службу в органы внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасы ішкі істер органдарының конкурстық негізде орналасатын лауазымдар тізбесін, Қазақстан Республикасы ішкі істер органдарына қызметке орналасу кезінде конкурс пен тағылымдама өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2016 жылғы 31 тамыздағы № 870 бұйрығына өзгерістер мен толықтырулар енгізу туралы
