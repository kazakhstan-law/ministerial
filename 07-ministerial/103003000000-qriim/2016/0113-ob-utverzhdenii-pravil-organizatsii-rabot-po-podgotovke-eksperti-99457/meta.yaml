  title:
    rus: О внесении изменения и дополнений в приказ Министра внутренних дел Республики Казахстан от 13 января 2016 года № 22 «Об утверждении Правил организации работ по подготовке, экспертизе,  апробации, изданию и проведению мониторинга учебных изданий и учебно-методических комплексов в военных, специальных учебных заведениях Министерства внутренних дел Республики Казахстан»
    kaz: «Қазақстан Республикасы Ішкі істер министрлігінің әскери, арнаулы оқу орындарында оқу басылымдары мен оқу-әдістемелік кешендерді дайындау, сараптау, сынақтан өткізу, басып шығару және оларға мониторинг жүргізу жөніндегі жұмыстарды ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2016 жылғы 13 қаңтардағы № 22 бұйрығына өзгеріс пен толықтырулар енгізу туралы
