title:
  rus: Об утверждении Правил организации работ по подготовке, экспертизе, апробации, изданию и проведению мониторинга учебных изданий и учебно-методических комплексов в военных, специальных учебных заведениях Министерства внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы Ішкі істер министрлігінің әскери, арнаулы оқу орындарында оқулық басылымдары мен оқу-әдiстемелiк кешендерді дайындау, сараптау, сынамақтан өткізу, басып шығару және оларға мониторинг жүргізу жөнiндегi жұмыстарды ұйымдастыру қағидаларын бекіту туралы
