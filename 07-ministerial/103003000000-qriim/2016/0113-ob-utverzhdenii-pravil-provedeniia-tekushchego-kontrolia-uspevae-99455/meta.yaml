title:
  rus: Об утверждении Правил проведения текущего контроля успеваемости, промежуточной и итоговой аттестации обучающихся военных, специальных учебных заведений Министерства внутренних дел Республики Казахстан
  kaz: Қазақстан Республикасы Ішкі істер министрлігінің әскери, арнаулы оқу орындарында білім алушылардың үлгеріміне ағымдағы бақылау, оларға аралық және қорытынды аттестаттау жүргізу қағидаларын бекіту туралы
