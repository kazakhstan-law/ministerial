    kaz: «Қазақстан Республикасы ішкі істер органдарының ерекше үй-жайлары үшін алаңдардың заттай нормаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2016 жылғы 27 ақпандағы № 188 бұйрығына өзгерістер мен толықтырулар енгізу туралы»
