  title:
    rus: О внесении изменения в приказ Министра внутренних дел Республики Казахстан от 28 января 2016 года № 85 «Об утверждении Правил приема, оформления и рассмотрения органами внутренних дел ходатайств (заявлений) по вопросам приема в гражданство Республики Казахстан и восстановления в гражданстве Республики Казахстан, в том числе в упрощенном (регистрационном) порядке, выхода из гражданства, утраты гражданства и определения принадлежности к гражданству Республики Казахстан»
    kaz: «Ішкі істер органдарының Қазақстан Республикасының азаматтығына қабылдау және Қазақстан Республикасының азаматтығын қалпына келтіру, оның ішінде жеңілдетілген тәртіппен (тіркеу тәртібімен), азаматтықтан шығу, азаматтықтан айырылу және Қазақстан Республикасының азаматтығына жататындығын айқындау мәселелері жөніндегі өтінішхаттарды (өтініштерді) қабылдау, ресімдеу және қарау қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2016 жылғы 28 қаңтардағы № 85 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/109200/rus
