act_code: '99974'
requisite: Приказ Министра внутренних дел Республики Казахстан от 28 января 2016 года № 85. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 марта 2016 года № 13391
title:
  rus: Об утверждении Правил приема, оформления и рассмотрения органами внутренних дел ходатайств (заявлений) по вопросам приема в гражданство Республики Казахстан и восстановления в гражданстве Республики Казахстан, в том числе в упрощенном (регистрационном) порядке, выхода из гражданства, утраты, лишения гражданства и определения принадлежности к гражданству Республики Казахстан
  kaz: Қазақстан Республикасының азаматтығына қабылдау және Қазақстан Республикасының азаматтығын қалпына келтіру, оның ішінде жеңілдетілген тәртіппен (тіркеу тәртібімен), азаматтықтан шығу, азаматтықты жоғалту мен одан айыру және Қазақстан Республикасының азаматтығына жататындығын айқындау мәселелері бойынша өтінішхаттарды (өтініштерді) ішкі істер органдарының қабылдау, ресімдеу және қарау қағидаларын бекіту туралы
