    kaz: «Қазақстан Республикасы Ішкі істер министрлігінің әскери, арнаулы оқу орындарында білім беру технологияларын қолдана отырып оқу процесін ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2016 жылғы 16 қаңтардағы № 32 бұйрығына өзгеріс енгізу туралы
