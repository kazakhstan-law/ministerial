act_code: '103532'
requisite: Приказ Министра внутренних дел Республики Казахстан от 13 мая 2016 года № 500. Зарегистрирован в Министерстве юстиции Республики Казахстан от 17 июня 2016 года № 13796
title:
  rus: Об утверждении Правил заключения, продления, изменения, расторжения и прекращения контракта с лицами, поступающими в организации образования Министерства внутренних дел Республики Казахстан, в организации образования, реализующие профессиональные учебные программы высшего и послевузовского образования правоохранительных органов иностранных государств по направлению Министерства внутренних дел Республики Казахстан с оплатой обучения за счет бюджетных средств
  kaz: Қазақстан Республикасы Ішкі істер министрлігінің білім беру ұйымдарына, бюджет қаражаты есебiнен оқу ақысын төлей отырып, Қазақстан Республикасы Ішкі істер министрлігінің жолдамасы бойынша шет мемлекеттердiң құқық қорғау органдарының жоғары және жоғары оқу орнынан кейінгі білім беретін кәсіптік оқу бағдарламаларын іске асыратын білім беру ұйымдарына түсетiн адамдармен келiсiмшарт жасасу, ұзарту, өзгерту, бұзу және тоқтату қағидаларын бекіту туралы
