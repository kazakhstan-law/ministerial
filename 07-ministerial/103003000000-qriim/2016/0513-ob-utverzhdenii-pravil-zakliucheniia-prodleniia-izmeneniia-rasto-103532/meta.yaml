  title:
    rus: О внесении изменений и дополнения в приказ Министра внутренних дел Республики Казахстан от 13 мая 2016 года № 500 «Об утверждении Правил заключения, продления, изменения, расторжения и прекращения контракта с лицами, поступающими в организации образования Министерства внутренних дел Республики Казахстан, в организации образования, реализующие профессиональные учебные программы высшего образования правоохранительных органов иностранных государств по направлению Министерства внутренних дел Республики Казахстан с оплатой обучения за счет бюджетных средств»
    kaz: «Қазақстан Республикасы Ішкі істер министрлігінің білім беру ұйымдарына, бюджет қаражаты есебінен оқу ақысын төлей отырып, Қазақстан Республикасы Ішкі істер министрлігінің жолдамасы бойынша шет мемлекеттердің құқық қорғау органдарының жоғары білім беретін кәсіптік оқу бағдарламаларын іске асыратын білім беру ұйымдарына түсетін адамдармен келісімшарт жасасу, ұзарту, өзгерту, бұзу және тоқтату қағидаларын бекіту туралы» 2016 жылғы 13 мамырдағы Қазақстан Республикасы Ішкі істер министрінің № 500 бұйрығына өзгерістер және толықтырулар енгізу туралы
