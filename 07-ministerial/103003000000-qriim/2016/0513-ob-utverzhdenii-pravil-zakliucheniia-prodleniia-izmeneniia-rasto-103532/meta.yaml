  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 13 мая 2016 года № 500 «Об утверждении Правил заключения, продления, изменения, расторжения и прекращения контракта с лицами, поступающими в организации образования Министерства внутренних дел Республики Казахстан, в организации образования, реализующие профессиональные учебные программы высшего образования правоохранительных органов иностранных государств по направлению Министерства внутренних дел Республики Казахстан с оплатой обучения за счет бюджетных средств»
    kaz: «Қазақстан Республикасы Ішкі істер министрлігінің білім беру ұйымдарына, бюджет қаражаты есебiнен оқу ақысын төлей отырып, Қазақстан Республикасы Ішкі істер министрлігінің жолдамасы бойынша шет мемлекеттердiң құқық қорғау органдарының жоғары білім беретін кәсіптік оқу бағдарламаларын іске асыратын білім беру ұйымдарына түсетiн адамдармен келiсiмшарт жасасу, ұзарту, өзгерту, бұзу және тоқтату қағидаларын бекіту туралы» Қазақстан Республикасы Ішкі істер министрінің 2016 жылғы 13 мамырдағы № 500 бұйрығына өзгерістер енгізу туралы
