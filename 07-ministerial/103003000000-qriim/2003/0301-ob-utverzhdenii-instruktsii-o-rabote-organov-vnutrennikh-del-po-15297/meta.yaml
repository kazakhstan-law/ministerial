  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 1 марта 2003 года № 111 "Об утверждении Инструкции "О работе органов внутренних дел по осуществлению лицензионно-разрешительной системы" и Правил "О порядке работы по приему, учету, хранению и обеспечению сохранности в органах внутренних дел изъятого, добровольно сданного, найденного оружия и боеприпасов, взрывчатых веществ и материалов, пороха, холодного оружия"
    kaz: '"Iшкi iстер органдарының лицензиялау-рұқсат беру жүйесін жүзеге асыру жөнiндегi жұмысы туралы" нұсқаулықты және "Iшкi iстер органдарында алынған, ерiктi түрде тапсырылған, тауып алынған қарулар мен оқ-дәрiлердi, жарылғыш заттар мен материалдарды, оқ-дәрiнi, суық қаруды қабылдап алу, есепке алу, сақтау және сақталуын қамтамасыз ету жөнiндегi жұмыстың тәртiбi туралы ереженi бекiту туралы" Қазақстан Республикасының Iшкi iстер министрлiгiнiң 2003 жылғы 1 наурыздағы № 111 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
