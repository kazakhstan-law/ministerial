  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 1 марта 2003 года N 111 "Об утверждении Инструкции "О работе органов внутренних дел по осуществлению лицензионно-разрешительной системы" и Правил "О порядке работы по приему, учету, хранению и обеспечению сохранности в органах внутренних дел изъятого, добровольно сданного, найденного оружия и боеприпасов, взрывчатых веществ и материалов, пороха, холодного оружия"
    kaz: '"Ішкі істер органдарының лицензиялау-рұқсат ету жұмысын жүзеге асыру жөніндегі жұмысы туралы" нұсқаулықты және "Ішкі істер органдарында алынып қойылған, ерікті түрде тапсырылған, тауып алынған қарулар мен оқ-дәрілерді, жарылғыш заттар мен материалдарды, оқ-дәріні, суық қаруды қабылдап алу, есепке алу, сақтау және сақталуын қамтамасыз ету жөніндегі жұмыстың тәртібі туралы" ережені бекіту туралы Қазақстан Республикасы Ішкі істер министрінің 2003 жылғы 1 наурыздағы N 111 бұйрығына өзгерістер енгізу туралы'
