act_code: '15297'
requisite: Приказ Министра внутренних дел Республики Казахстан от 1 марта 2003 года № 111. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 апреля 2003 года № 2257. Утратил силу приказом Министра внутренних дел Республики Казахстан от 29 марта 2016 года № 313
title:
  rus: Об утверждении Инструкции "О работе органов внутренних дел по осуществлению лицензионно-разрешительной системы" и Правил "О порядке работы по приему, учету, хранению и обеспечению сохранности в органах внутренних дел изъятого, добровольно сданного, найденного оружия и боеприпасов, взрывчатых веществ и материалов, пороха, холодного оружия"
  kaz: '"Iшкi iстер органдарының лицензиялау-рұқсат ету жұмысын жүзеге асыру жөнiндегi жұмысы туралы" нұсқаулықты және "Iшкi iстер органдарында алынып қойылған, ерiктi түрде тапсырылған, тауып алынған қарулар мен оқ-дәрiлердi, жарылғыш заттар мен материалдарды, оқ-дәрiнi, суық қаруды қабылдап алу, есепке алу, сақтау және сақталуын қамтамасыз ету жөнiндегi жұмыстың тәртiбi туралы" ереженi бекiту туралы'
