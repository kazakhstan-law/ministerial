title:
  rus: Об утверждении Инструкции по организации подразделениями дорожной полиции органов внутренних дел контроля за конструкцией и техническим состоянием транспортных средств
  kaz: Ішкі істер органдары жол полициясы бөлімшелерінің көлік құралдарының конструкциясы мен техникалық жағдайын бақылауды ұйымдастыруы жөніндегі нұсқаулықты бекіту туралы
