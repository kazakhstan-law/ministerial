act_code: '15474'
requisite: Приказ Министра внутренних дел Республики Казахстан от 17 мая 2003 года № 280. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 мая 2003 года № 2288. Утратил силу приказом Министра внутренних дел Республики Казахстан от 16 мая 2016 года № 507
title:
  rus: Об утверждении Инструкции по организации реагирования комплексных сил полиции, задействованных в охране общественного порядка, на сигналы тревоги, поступающие в Центры оперативного управления, дежурные части Департаментов внутренних дел городов Астаны, Алматы и областей с охраняемых объектов, из квартир граждан и иных объектов всех форм собственности
  kaz: Күзетiлетiн объектiлерден, азаматтардың пәтерлерiнен және меншiктiң барлық нысандарындағы өзге де объектiлерден Жедел басқару орталықтарына, Астана, Алматы қалаларының және облыстар iшкi iстер департаменттерiнiң кезекшi бөлiмдерiне келiп түсетiн дабыл белгiлерiне қоғамдық тәртiптi сақтауға жұмылдырылған полиция кешендi күштерiнiң ден қоюын ұйымдастыру жөнiндегi нұсқаулықты бекiту туралы
