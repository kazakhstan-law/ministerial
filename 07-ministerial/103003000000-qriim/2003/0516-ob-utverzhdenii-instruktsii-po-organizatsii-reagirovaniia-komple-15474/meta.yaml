  code: '25441'
  requisite: Приказ Министра внутренних дел Республики Казахстан от 13 сентября 2005 года № 541. Зарегистрирован в Министерстве юстиции Республики Казахстан от 4 октября 2005 года № 3871. Утратил силу приказом Министра внутренних дел Республики Казахстан от 16 мая 2016 года № 507
  title:
    rus: О внесении изменений и дополнений в приказ Министра внутренних дел Республики Казахстан от 17 мая 2003 года № 280 "Об утверждении Инструкции по организации реагирования комплексных сил полиции, задействованных в охране общественного порядка, на сигналы тревоги, поступающие в Центр оперативного управления, дежурные части Главного управления внутренних дел и Управления внутренних дел г.г. Астаны, Алматы и областей с охраняемых объектов и из квартир граждан, в том числе охраняемых негосударственными субъектами охранной деятельности"
    kaz: '"Күзетiлетiн объектiлерден және азаматтардың пәтерлерiнен, оның iшiнде күзет қызметiнiң мемлекеттiк емес күзет субъектiлерi күзететiн объектiлерден Жедел басқару орталығына, Астана, Алматы қалаларының және облыстардағы iшкi iстер бас басқармаларымен Iшкi iстер басқармаларының кезекшi бөлiмдерiне келiп түсетiн дабыл белгiлерiне қоғамдық тәртiптi сақтауға жұмылдырылған полиция кешендi күштерiнiң ден қоюын ұйымдастыру жөнiндегi нұсқаулықты бекiту туралы" Қазақстан Республикасы Iшкi iстер министрiнiң 2003 жылғы 17 мамырдағы № 280 бұйрығына толықтырулар мен өзгерiстер енгiзу туралы'
  link: https://zan.gov.kz/client/#!/doc/25441/rus
