  title:
    rus: О внесении изменений в приказ МВД Республики Казахстан от 14 марта 2000 года № 140 "Об утверждении Инструкции по перерасчету размера пенсионных выплат за выслугу лет сотрудникам органов внутренних дел, военнослужащим внутренних войск, вышедшим на пенсию (в т.ч. зарегистрировавшим свое право на пенсию за выслугу лет) в период с 1 апреля 1997 года по 1 января 2000 года" (зарегистрированный в Министерстве юстиции 14 июля 2000 года за № 1196)
    kaz: '"1997 жылғы сәуірден бастап 2000 жылғы 1 қаңтарға дейінгі кезеңде зейнеткерлікке шыққан (оның ішінде өзінің еңбек сіңірген жылдары үшін зейнеткерлікке шығу құқығын тіркеген) ішкі істер органдарының қызметкерлеріне, ішкі әскерлердің әскери қызметшілеріне еңбек сіңірген жылдары үшін зейнеткерлік төлемдер көлемін қайта есептеу жөніндегі нұсқаулықты бекіту туралы" (Әділет министрлігінде 2000 жылдың 14 шілдесінде 1196 нөмірімен тіркелген) 2000 жыл 14 наурыздағы Ішкі істер министрлігінің N 140 бұйрығына өзгерістер енгізу туралы'
