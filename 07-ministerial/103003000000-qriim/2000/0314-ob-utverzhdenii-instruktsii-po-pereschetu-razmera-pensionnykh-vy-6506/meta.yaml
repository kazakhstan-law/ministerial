requisite: Приказ Министра внутренних дел Республики Казахстан от 14 марта 2000 года № 140. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 июля 2000 года № 1196. Утратил силу приказом и.о. Министра внутренних дел Республики Казахстан от 30 декабря 2006 года № 606
title:
  rus: Об утверждении Инструкции по пересчету размера пенсионных выплат за выслугу лет сотрудникам органов внутренних дел, военнослужащим внутренних войск, вышедшим на пенсию (в т.ч. зарегистрировавших свое право на пенсию за выслугу лет) в период с 1 апреля 1997 года по 1 января 2000 года
  kaz: 1997 жылғы 1 сәуірден бастап 2000 жылғы қаңтарға дейінгі кезеңде зейнеткерлікке шыққан (оның ішінде өзінің еңбек сіңірген жылдары үшін зейнеткерлікке шығу құқығын тіркеген) ішкі істер органдарының қызметкерлеріне, ішкі әскерлердің әскери қызметшілеріне еңбек сіңірген жылдары үшін зейнеткерлік төлемдер көлемін қайта есептеу жөніндегі нұсқаулықты бекіту туралы
