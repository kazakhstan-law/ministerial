act_code: '7169'
requisite: Приказ Министра внутренних дел Республики Казахстан от 27 сентября 2000 года N 519. Зарегистрирован в Министерстве юстиции Республики Казахстан 23.10.2000 г. за N 1269. Утратил силу за иключением пункта 6 - приказом Министра внутренних дел Республики Казахстан от 24 ноября 2005 года N 652 (V053990). Утратил силу приказом Министра внутренних дел Республики Казахстан от 1 февраля 2007 года N 35
title:
  rus: О мерах по совершенствованию контроля за автоперевозками и искоренению фактов поборов и вымогательства на автомобильных дорогах Республики Казахстан
  kaz: '"Қазақстан Республикасының автомобиль жолдарындағы автотасымалдауларға бақылау жасауды жетілдіру және алымдар мен бопсалау фактілерін жою шаралары туралы"'
