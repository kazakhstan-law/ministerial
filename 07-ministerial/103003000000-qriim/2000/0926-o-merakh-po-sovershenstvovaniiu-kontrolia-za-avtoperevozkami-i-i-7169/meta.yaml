  title:
    rus: О внесении изменений в приказ Министра внутренних дел Республики Казахстан от 10 ноября 1999 года N 568 "О совершенствовании деятельности дорожной полиции в обеспечении общественной безопасности, пресечении и раскрытии преступлений, а также активизации розыскной деятельности"
    kaz: '"Қоғам қауіпсіздігін қамтамасыз етудегі, қылмыстың жолын кесу мен оны ашудағы, сонымен қатар іздестіру жұмыстарының белсенділігін арттырудағы жол полициясының іс-әрекетін жетілдіру туралы" Қазақстан Республикасы Ішкі істер министрінің 1999 жылғы 10 қарашадағы N 568 бұйрығына өзгерістер енгізу туралы'
