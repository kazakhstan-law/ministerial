title:
  rus: Об утверждении Инструкция о порядке изменения записи о национальности в паспортах граждан Республики Казахстан, насильственно переселенных в период репрессий на территорию Республики Казахстан
  kaz: Қуғын-сүргiн кезеңiнде Қазақстан Республикасы аумағына күштеп көшiрiлген Қазақстан Республикасы азаматтарының паспорттарындағы ұлты туралы жазбаны өзгерту тәртiбi туралы
