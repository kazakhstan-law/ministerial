  title:
    rus: О внесении изменения в приказ Председателя Комитета контроля качества и безопасности товаров и услуг Министерства здравоохранения Республики Казахстан от 3 июня 2019 года № 101-НҚ «Об утверждении положений территориальных подразделений (районных и городов районного значения) республиканского государственного учреждения «Комитет контроля качества и безопасности товаров и услуг Министерства здравоохранения Республики Казахстан»
    kaz: «Қазақстан Республикасы Денсаулық сақтау министрлігінің Тауарлар мен көрсетілетін қызметтердің сапасы мен қауіпсіздігін бақылау комитеті» республикалық мемлекеттік мекемесі аумақтық бөлімшелерінің (аудандар мен аудандық маңызы бар қалалар) ережелерін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрлігінің Тауарлар мен көрсетілетін қызметтердің сапасы мен қауіпсіздігін бақылау комитеті төрағасының 2019 жылғы 3 маусымдағы № 101-НҚ бұйрығына өзгеріс енгізу туралы
