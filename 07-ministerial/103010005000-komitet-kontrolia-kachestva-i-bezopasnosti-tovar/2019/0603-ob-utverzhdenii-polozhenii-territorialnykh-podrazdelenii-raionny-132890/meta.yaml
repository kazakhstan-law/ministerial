act_code: '132890'
requisite: Приказ Председателя Комитета контроля качества и безопасности товаров и услуг Министерства здравоохранения Республики Казахстан от 3 июня 2019 года № 101-НҚ. Утратил силу приказом Председателя Комитета контроля качества и безопасности товаров и услуг Министерства здравоохранения Республики Казахстан от 20 октября 2020 года № 322-НҚ (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении положений территориальных подразделений (районных и городов районного значения) республиканского государственного учреждения «Комитет контроля качества и безопасности товаров и услуг Министерства здравоохранения Республики Казахстан»
  kaz: «Қазақстан Республикасы Денсаулық сақтау министрлігінің Тауарлар мен көрсетілетін қызметтердің сапасы мен қауіпсіздігін бақылау комитеті» республикалық мемлекеттік мекемесі аумақтық бөлімшелерінің (аудандар мен аудандық маңызы бар қалалар) ережелерін ережесін бекіту туралы
