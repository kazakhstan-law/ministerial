title:
  rus: Об утверждении критериев отнесения цифрового актива к необеспеченному цифровому активу с фиксированной стоимостью и перечня необеспеченных цифровых активов с фиксированной стоимостью
  kaz: Цифрлық активті тіркеп-белгіленген құны бар қамтамасыз етілмеген цифрлық активке жатқызу өлшемшарттарын және тіркеп-белгіленген құны бар қамтамасыз етілмеген цифрлық активтердің тізбесін бекіту туралы
