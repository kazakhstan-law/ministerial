act_code: '217071'
requisite: Приказ и.о. Министра искусственного интеллекта и цифрового развития Республики Казахстан от 4 ноября 2025 года № 555/НҚ. Утратил силу приказом Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 13 января 2026 года № 13/НҚ (вводится в действие со дня его подписания)
title:
  rus: Об утверждении Положения о республиканском государственном учреждении «Комитет искусственного интеллекта и управления данными Министерства искусственного интеллекта и цифрового развития Республики Казахстан»
  kaz: «Қазақстан Республикасының Жасанды интеллект және цифрлық даму министрлiгiнiң Жасанды интеллект және деректерді басқару комитеті» республикалық мемлекеттік мекемесі туралы ережені бекіту туралы»
