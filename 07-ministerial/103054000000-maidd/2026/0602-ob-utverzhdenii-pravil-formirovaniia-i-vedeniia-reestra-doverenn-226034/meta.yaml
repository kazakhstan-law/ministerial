    kaz: «Сенім білдірілген цифрлық объектілердің тізілімін қалыптастыру және жүргізу, сондай-ақ тізілімге енгізілетін цифрлық объектілердің түрлерін айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Жасанды интеллект және цифрлық даму министрінің 2026 жылғы 2 маусымдағы № 279/НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы
