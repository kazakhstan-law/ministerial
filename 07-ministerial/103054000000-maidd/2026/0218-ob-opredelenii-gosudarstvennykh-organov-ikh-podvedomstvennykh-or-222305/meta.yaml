requisite: Приказ Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 18 февраля 2026 года № 82/НҚ
title:
  rus: Об определении государственных органов, их подведомственных организаций и органов местного самоуправления, а также иных субъектов цифровой среды, использующих единую транспортную среду государственных органов для взаимодействия локальных (за исключением локальных сетей, имеющих доступ к Интернету), ведомственных и корпоративных сетей
  kaz: Жергілікті (Интернетке қолжетімділігі бар жергілікті желілерді қоспағанда), ведомстволық және корпоративтік желілердің өзара іс-қимылы үшін мемлекеттік органдардың бірыңғай көліктік ортасын пайдаланатын мемлекеттік органдарды, олардың ведомстволық бағынысты ұйымдары мен жергілікті өзін-өзі басқару органдарын, сондай-ақ цифрлық ортаның өзге де субъектілерін айқындау туралы
