title:
  rus: Об утверждении Положения о республиканском государственном учреждении «Комитет цифровых активов и прорывных технологий Министерства искусственного интеллекта и цифрового развития Республики Казахстан»
  kaz: «Қазақстан Республикасының Жасанды интеллект және цифрлық даму министрлiгiнiң Цифрлық активтер және серпінді технологиялар комитеті» республикалық мемлекеттік мекемесі туралы ережені бекіту туралы»
