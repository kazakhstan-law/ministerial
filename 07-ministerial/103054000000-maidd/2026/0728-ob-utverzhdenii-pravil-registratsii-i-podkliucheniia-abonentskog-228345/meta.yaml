act_code: '228345'
requisite: Приказ Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 28 июля 2026 года № 438/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июля 2026 года № 39448
title:
  rus: Об утверждении Правил регистрации и подключения абонентского номера сети сотовой связи, предоставленного оператором сотовой связи, к учетной записи, веб-портала «цифрового правительства» для получения государственных и иных услуг в электронной форме посредством абонентского устройства сотовой связи
  kaz: Ұялы байланыс операторы ұсынған ұялы байланыс желісінің абоненттік нөмірін ұялы байланыстың абоненттік құрылғысы арқылы мемлекеттік және өзге де көрсетілетін қызметтерді электрондық нысанда алу үшін «цифрлық үкіметтің» есептік жазбасына, веб-порталына тіркеу және қосу қағидаларын бекіту туралы
