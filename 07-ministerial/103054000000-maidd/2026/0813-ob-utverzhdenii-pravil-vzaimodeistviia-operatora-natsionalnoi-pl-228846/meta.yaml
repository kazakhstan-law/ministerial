act_code: '228846'
requisite: Приказ Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 13 августа 2026 года № 482/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 августа 2026 года № 39591
title:
  rus: Об утверждении правил взаимодействия оператора национальной платформы искусственного интеллекта с физическими и юридическими лицами в рамках оказания услуг на национальной платформе искусственного интеллекта для разработки, размещения платформенных программных продуктов, моделей искусственного интеллекта на национальной платформе искусственного интеллекта
  kaz: Жасанды интеллектінің платформалық бағдарламалық өнімдерін, модельдерін әзірлеу, жасанды интеллектінің ұлттық платформасында орналастыру үшін жасанды интеллектінің ұлттық платформасында қызметтер көрсету шеңберінде жасанды интеллектінің ұлттық платформасы операторының жеке және заңды тұлғалармен өзара іс-қимыл жасау қағидаларын бекіту туралы
