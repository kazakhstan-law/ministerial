act_code: '227819'
requisite: Приказ и.о. Министра искусственного интеллекта и цифрового развития Республики Казахстан от 14 июля 2026 года № 410/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 июля 2026 года № 39320
title:
  rus: Об утверждении правил установления критериев соответствия иных услуг, оказываемых в электронной форме, для обеспечения обязательного доступа к ним посредством веб-портала «цифрового правительства» и (или) мобильного приложения «цифрового правительства» и критериев соответствия иных услуг, оказываемых в электронной форме, для обеспечения обязательного доступа к ним посредством веб-портала «цифрового правительства» и (или) мобильного приложения «цифрового правительства»
  kaz: Электрондық нысанда көрсетілетін өзге де қызметтердің «цифрлық үкіметтің» веб-порталы және (немесе) «цифрлық үкіметтің» мобильдік қосымшасы арқылы оларға міндетті түрде қол жеткізуді қамтамасыз ету үшін сәйкестік өлшемшарттарын белгілеу қағидаларын және электрондық нысанда көрсетілетін өзге де қызметтердің «цифрлық үкіметтің» веб-порталы және (немесе) «цифрлық үкіметтің» мобильдік қосымшасы арқылы оларға міндетті түрде қол жеткізуді қамтамасыз ету үшін сәйкестік өлшемшарттарын бекіту туралы
