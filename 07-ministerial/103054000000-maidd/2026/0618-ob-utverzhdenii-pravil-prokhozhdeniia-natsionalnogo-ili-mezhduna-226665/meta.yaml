requisite: Приказ Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 18 июня 2026 года № 327/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 июня 2026 года № 38997
title:
  rus: Об утверждении Правил прохождения национального или международного технического аудита центрами обработки данных и требований к центрам обработки данных, используемых для размещения цифровых объектов, содержащих государственные цифровые данные, данные ограниченного доступа или критически важных цифровых объектов
  kaz: Деректерді өңдеу орталықтарының ұлттық немесе халықаралық техникалық аудиттен өту қағидаларын және мемлекеттік цифрлық деректерді, қолжетімділігі шектеулі деректерді немесе аса маңызды цифрлық объектілерді қамтитын цифрлық объектілерді орналастыру үшін пайдаланылатын деректерді өңдеу орталықтарына талаптарды бекіту туралы
