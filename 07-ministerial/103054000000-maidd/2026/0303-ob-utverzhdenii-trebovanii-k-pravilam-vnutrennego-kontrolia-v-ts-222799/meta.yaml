act_code: '222799'
requisite: Приказ Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 3 марта 2026 года № 112/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 марта 2026 года № 38096. Утратил силу приказом Заместителя Премьер-Министра – Министра искусственного интеллекта и цифрового развития Республики Казахстан от 22 апреля 2026 года № 212/НҚ (вводится в действие с 1 мая 2026 года)
title:
  rus: Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для лиц, осуществляющих выпуск и обращение обеспеченных цифровых активов
  kaz: Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл жасау мақсатында қамтамасыз етілген цифрлық активтерді шығаруды және олардың айналысын жүзеге асыратын тұлғалар үшін ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы
