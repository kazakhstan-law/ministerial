act_code: '223676'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и развитию финансового рынка от 20 марта 2026 года № 15
title:
  rus: Об установлении Перечня офшорных зон для целей банковской и страховой деятельности, деятельности профессиональных участников рынка ценных бумаг и иных лицензируемых видов деятельности на рынке ценных бумаг, деятельности акционерных инвестиционных фондов и деятельности организаций, осуществляющих микрофинансовую деятельность
  kaz: Банктік және сақтандыру қызметі, бағалы қағаздар нарығына кәсіби қатысушылардың қызметі және бағалы қағаздар нарығындағы өзге де лицензияланатын қызмет түрлері, акционерлік инвестициялық қорлардың қызметі және микроқаржылық қызметті жүзеге асыратын ұйымдардың қызметі мақсаттары үшін офшорлық аймақтардың тізбесін белгілеу туралы
