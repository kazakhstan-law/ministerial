title:
  rus: Об утверждении Инструкции о порядке рассмотрения обращений и организации приема граждан в органах, учебных заведениях, учреждениях, организациях и на предприятиях ГСК Республики Казахстан
  kaz: '"Қазақстан Республикасы Мемлекеттiк тергеу комитетiнiң органдарында, оқу орындарында, мекемелерiнде, ұйымдарында және кәсiпорындарында өтiнiштердi қарау және азаматтарды қабылдауды ұйымдастыру тәртiбi туралы Нұсқаулықты бекiту туралы"'
