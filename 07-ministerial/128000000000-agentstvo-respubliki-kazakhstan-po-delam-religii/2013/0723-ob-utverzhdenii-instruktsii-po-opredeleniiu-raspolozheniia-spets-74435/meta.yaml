act_code: '74435'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по делам религий от 23 июля 2013 года № 34. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 августа 2013 года № 8634. Утратил силу приказом Министра по делам религий и гражданского общества Республики Казахстан от 9 июня 2017 года № 89 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по определению расположения специальных стационарных помещений для распространения религиозной литературы и иных информационных материалов религиозного содержания, предметов религиозного назначения, а также помещений для проведения религиозных мероприятий за пределами культовых зданий (сооружений)
  kaz: Діни әдебиетті және діни мазмұндағы өзге де ақпараттық материалдарды, діни мақсаттағы заттарды тарату үшін арнайы тұрақты үй-жайлардың, сондай-ақ ғибадат үйлерінен (ғимараттарынан) тыс жерлерде діни іс-шаралар өткізуге арналған үй-жайлардың орналастырылуын айқындау жөніндегі нұсқаулықты бекіту туралы
