  title:
    rus: О внесении изменения в приказ исполняющего обязанности Председателя Агентства Республики Казахстан по делам религий от 23 июля 2013 года № 34 "Об утверждении Инструкции по определению расположения специальных стационарных помещений для распространения религиозной литературы и иных информационных материалов религиозного содержания, предметов религиозного назначения, а также помещений для проведения религиозных мероприятий за пределами культовых зданий (сооружений)"
    kaz: '"Діни әдебиетті және діни мазмұндағы өзге де ақпараттық материалдарды, діни мақсаттағы заттарды тарату үшін арнайы тұрақты үй-жайлардың, сондай-ақ ғибадат үйлерінен (ғимараттарынан) тыс жерлерде діни іс-шаралар өткізуге арналған үй-жайлардың орналастырылуын айқындау жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Дін істері агенттігі Төрағасының міндетін атқарушының 2013 жылғы 23 шілдедегі № 34 бұйрығына өзгерiс енгiзу туралы'
