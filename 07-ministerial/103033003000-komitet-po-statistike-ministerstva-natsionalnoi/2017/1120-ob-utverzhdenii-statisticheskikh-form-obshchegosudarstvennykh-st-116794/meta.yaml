requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 20 ноября 2017 года № 180. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 декабря 2017 года № 16070. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 10 февраля 2020 года № 21 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении статистических форм общегосударственных статистических наблюдений по статистике сельского, лесного, охотничьего и рыбного хозяйства и инструкций по их заполнению
