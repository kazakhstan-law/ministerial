  title:
    rus: О внесении изменений в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 20 ноября 2017 года № 180 «Об утверждении статистических форм общегосударственных статистических наблюдений по статистике сельского, лесного, охотничьего и рыбного хозяйства и инструкций по их заполнению»
    kaz: «Ауыл, орман, аңшылық және балық шаруашылығы статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігінің Статистика комитеті төрағасының 2017 жылғы 20 қарашадағы № 180 бұйрығына өзгерістер енгізу туралы
