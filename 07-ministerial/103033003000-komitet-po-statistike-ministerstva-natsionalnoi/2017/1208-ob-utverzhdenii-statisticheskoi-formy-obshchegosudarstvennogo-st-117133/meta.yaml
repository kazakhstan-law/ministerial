requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 8 декабря 2017 года № 196. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 декабря 2017 года № 16123. Утратило силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 15 мая 2024 года № 4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
