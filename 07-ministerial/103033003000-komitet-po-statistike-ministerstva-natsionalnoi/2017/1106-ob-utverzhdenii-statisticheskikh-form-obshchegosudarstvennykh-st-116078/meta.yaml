requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 6 ноября 2017 года № 157. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 ноября 2017 года № 16000. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 23 января 2020 года № 8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении статистических форм общегосударственных статистических наблюдений по статистике предприятий и конъюнктурных обследований и инструкций по их заполнению
  kaz: Кәсіпорындар статистикасы мен конъюнктуралық зерттеулер бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы
