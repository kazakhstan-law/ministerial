act_code: '110406'
requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 3 февраля 2017 года № 26. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 марта 2017 года № 14897. Утратил силу приказом и.о. Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 14 августа 2026 года № 21 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении статистической формы ведомственного статистического наблюдения и инструкции по ее заполнению, разработанных Министерством финансов Республики Казахстан
  kaz: Қазақстан Республикасы Қаржы министрлігі әзірлеген ведомстволық статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы
