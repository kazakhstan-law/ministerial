requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 6 ноября 2017 года № 156. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 ноября 2017 года № 16029. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 5 февраля 2020 года № 19 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении статистических форм общегосударственных статистических наблюдений по статистике информационно-коммуникационных технологий и связи и инструкций по их заполнению
