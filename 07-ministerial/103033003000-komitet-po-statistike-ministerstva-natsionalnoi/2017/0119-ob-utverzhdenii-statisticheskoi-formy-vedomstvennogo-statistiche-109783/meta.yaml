requisite: Приказ и.о. Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 19 января 2017 года № 9. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 февраля 2017 года № 14798. Утратил силу приказом и.о. Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 19 декабря 2018 года № 8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении статистической формы ведомственного статистического наблюдения «Отчет об отпускных ценах на строительные материалы, изделия, конструкции и инженерное оборудование» (код 0001202, индекс 1-СМИО, периодичность месячная) и инструкции по ее заполнению»
  kaz: «Құрылыс материалдардың, бұйымдардың, конструкциялардың және инженерлiк жабдықтардың босатылым бағасы туралы есеп» (коды 0001202, индексі 1-СМИО, кезеңділігі айлық) ведомстволық статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы
