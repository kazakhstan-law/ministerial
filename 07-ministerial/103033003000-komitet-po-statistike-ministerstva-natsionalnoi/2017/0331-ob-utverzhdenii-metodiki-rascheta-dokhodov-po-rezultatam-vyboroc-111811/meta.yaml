requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 31 марта 2017 года № 55. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 апреля 2017 года № 15064. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 5 января 2026 года № 2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
