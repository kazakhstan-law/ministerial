requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 13 декабря 2017 года № 198. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 декабря 2017 года № 16150. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 30 декабря 2025 года № 33 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
