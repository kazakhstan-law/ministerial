  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 21 января 2020 года № 5 «Об утверждении статистических форм общегосударственных статистических наблюдений по статистике инновации и услуг и инструкций по их заполнению»
    kaz: «Инновация және қызмет көрсету статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2020 жылғы 21 қаңтардағы № 5 бұйрығына өзгерістер мен толықтырулар енгізу туралы
