title:
  rus: Об утверждении статистических форм ведомственных статистических наблюдений и инструкций по их заполнению, разработанных Комитетом лесного хозяйства и животного мира Министерства экологии, геологии и природных ресурсов Республики Казахстан
  kaz: Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің Орман шаруашылығы және жануарлар дүниесі комитеті әзірлеген ведомстволық статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы
