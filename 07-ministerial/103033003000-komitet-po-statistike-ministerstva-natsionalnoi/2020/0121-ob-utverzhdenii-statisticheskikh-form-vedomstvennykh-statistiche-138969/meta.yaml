  title:
    rus: О внесении изменения в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 21 января 2020 года № 2 «Об утверждении статистических форм ведомственных статистических наблюдений и инструкций по их заполнению, разработанных Комитетом лесного хозяйства и животного мира Министерства экологии, геологии и природных ресурсов Республики Казахстан»
    kaz: «Қазақстан Республикасы Экология, геология және табиғи ресурстар министрлігінің Орман шаруашылығы және жануарлар дүниесі комитеті әзірлеген ведомстволық статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2020 жылғы 21 қаңтардағы № 2 бұйрығына өзгеріс енгізу туралы
