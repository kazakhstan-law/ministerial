    kaz: «Туризм статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2020 жылғы 10 ақпандағы № 20 бұйрығына өзгерістер енгізу туралы
