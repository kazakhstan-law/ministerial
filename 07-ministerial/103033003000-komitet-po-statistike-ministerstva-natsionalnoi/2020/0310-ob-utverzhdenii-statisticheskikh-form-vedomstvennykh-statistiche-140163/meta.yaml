title:
  rus: Об утверждении статистических форм ведомственных статистических наблюдений и инструкций по их заполнению по балансу земель, разработанных Комитетом по управлению земельными ресурсами Министерства сельского хозяйства Республики Казахстан
  kaz: Қазақстан Республикасы Ауыл шаруашылығы министрлігінің Жер ресурстарын басқару комитеті әзірлеген жер балансы бойынша ведомстволық статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы
