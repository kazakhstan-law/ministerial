  title:
    rus: О внесении изменения в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 10 марта 2020 года № 25 «Об утверждении статистических форм ведомственных статистических наблюдений и инструкций по их заполнению по балансу земель, разработанных Комитетом по управлению земельными ресурсами Министерства сельского хозяйства Республики Казахстан»
    kaz: «Қазақстан Республикасы Ауыл шаруашылығы министрлігінің Жер ресурстарын басқару комитеті әзірлеген жер балансы бойынша ведомстволық статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2020 жылғы 10 наурыздағы № 25 бұйрығына өзгеріс енгізу туралы
