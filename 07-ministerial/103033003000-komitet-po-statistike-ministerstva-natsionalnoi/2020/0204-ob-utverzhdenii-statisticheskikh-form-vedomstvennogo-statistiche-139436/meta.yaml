  title:
    rus: О внесении изменений в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 4 февраля 2020 года № 15 «Об утверждении статистических форм ведомственного статистического наблюдения и инструкций по их заполнению, разработанных Комитетом по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и инфраструктурного развития Республики Казахстан»
    kaz: «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігі Құрылыс және тұрғын үй-коммуналдық шаруашылық істері комитеті әзірлеген ведомстволық статистикалық байқаудың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2020 жылғы 4 ақпандағы № 15 бұйрығына өзгерістер енгізу туралы
