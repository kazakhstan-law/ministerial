title:
  rus: Об утверждении статистических форм ведомственного статистического наблюдения и инструкций по их заполнению, разработанных Комитетом по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и инфраструктурного развития Республики Казахстан
  kaz: Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігі Құрылыс және тұрғын үй-коммуналдық шаруашылық істері комитеті әзірлеген ведомстволық статистикалық байқаудың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы
