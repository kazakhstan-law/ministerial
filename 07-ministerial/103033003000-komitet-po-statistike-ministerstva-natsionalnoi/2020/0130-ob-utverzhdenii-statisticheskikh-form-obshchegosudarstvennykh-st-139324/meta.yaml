  title:
    rus: О внесении изменения в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 30 января 2020 года № 12 «Об утверждении статистических форм общегосударственных статистических наблюдений по статистике здравоохранения и социального обеспечения и инструкций по их заполнению»
    kaz: «Денсаулық сақтау және әлеуметтік қамсыздандыру статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2020 жылғы 30 қаңтардағы № 12 бұйрығына өзгеріс енгізу туралы
