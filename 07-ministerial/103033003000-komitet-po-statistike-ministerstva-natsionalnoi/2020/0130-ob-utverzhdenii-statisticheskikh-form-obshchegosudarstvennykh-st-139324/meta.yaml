caused_by:
  code: '158212'
  requisite: Приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 26 августа 2021 года № 15. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 августа 2021 года № 24144. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 7 февраля 2024 года № 1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 30 января 2020 года № 12 «Об утверждении статистических форм общегосударственных статистических наблюдений по статистике здравоохранения и социального обеспечения и инструкций по их заполнению»
    kaz: «Денсаулық сақтау және әлеуметтік қамсыздандыру статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2020 жылғы 30 қаңтардағы № 12 бұйрығына өзгерістер енгізу туралы
