act_code: '139324'
requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 30 января 2020 года № 12. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 февраля 2020 года № 19980. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 18 октября 2022 года № 34 (вводится в действие с 1 ноября 2022 года)
title:
  rus: Об утверждении статистических форм общегосударственных статистических наблюдений по статистике здравоохранения и социального обеспечения и инструкций по их заполнению
  kaz: Денсаулық сақтау және әлеуметтік қамсыздандыру статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы
