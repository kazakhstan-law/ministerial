    kaz: «Көлік статистикасы бойынша жалпымемлекеттік статистикалық байқаудың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2020 жылғы 29 қаңтардағы № 11 бұйрығына өзгерістер енгізу туралы
