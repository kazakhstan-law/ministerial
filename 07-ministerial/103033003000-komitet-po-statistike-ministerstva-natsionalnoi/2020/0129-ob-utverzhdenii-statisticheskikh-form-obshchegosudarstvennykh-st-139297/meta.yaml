  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 29 января 2020 года № 11 «Об утверждении статистических форм общегосударственных статистических наблюдений по статистике транспорта и инструкций по их заполнению»
    kaz: «Көлік статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2020 жылғы 29 қаңтардағы № 11 бұйрығына өзгерістер және толықтырулар енгізу туралы
