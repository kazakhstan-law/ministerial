    kaz: «Ақпараттық-коммуникациялық технологиялар және байланыс статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2020 жылғы 5 ақпандағы № 19 бұйрығына өзгерістер енгізу туралы
