title:
  rus: Об утверждении статистических форм общегосударственных статистических наблюдений по статистике информационно-коммуникационных технологий и связи и инструкций по их заполнению
  kaz: Ақпараттық-коммуникациялық технологиялар және байланыс статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы
