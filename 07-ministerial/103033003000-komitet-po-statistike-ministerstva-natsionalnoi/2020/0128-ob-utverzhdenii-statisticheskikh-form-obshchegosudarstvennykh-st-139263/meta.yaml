  title:
    rus: О внесении изменений в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 28 января 2020 года № 10 «Об утверждении статистических форм общегосударственных статистических наблюдений по статистике цен и инструкций по их заполнению»
    kaz: «Баға статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігінің Статистика комитеті төрағасының 2020 жылғы 28 қаңтардағы № 10 бұйрығына өзгерістер енгізу туралы
