    kaz: «Баға статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігінің Статистика комитеті төрағасының 2020 жылғы 28 қаңтардағы № 10 бұйрығына өзгерістер мен толықтырулар енгізу туралы
