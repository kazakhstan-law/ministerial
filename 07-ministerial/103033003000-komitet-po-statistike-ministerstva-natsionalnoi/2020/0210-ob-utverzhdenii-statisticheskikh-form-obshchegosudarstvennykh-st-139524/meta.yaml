    kaz: «Ауыл, орман, аңшылық және балық шаруашылығы статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2020 жылғы 10 ақпандағы № 21 бұйрығына өзгерістер мен толықтырулар енгізу туралы
