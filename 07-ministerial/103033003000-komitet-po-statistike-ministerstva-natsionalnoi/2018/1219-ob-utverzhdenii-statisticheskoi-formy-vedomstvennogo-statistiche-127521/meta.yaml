act_code: '127521'
requisite: Приказ и.о. Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 19 декабря 2018 года № 8. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 декабря 2018 года № 18030. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 4 февраля 2020 года № 15 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении статистической формы ведомственного статистического наблюдения «Отчет об отпускных ценах на строительные материалы, изделия, конструкции и инженерное оборудование» (код 261203237, индекс 1-СМИО, периодичность квартальная) и инструкции по ее заполнению»
  kaz: «Құрылыс материалдары, бұйымдары, конструкциялар мен инженерлік жабдықтарына босатылым бағалары туралы есеп» (коды 261203237, индексі 1-СМИО, кезеңділігі тоқсандық) ведомстволық статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы
