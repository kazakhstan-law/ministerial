title:
  rus: Об утверждении Правил пересмотра опубликованной официальной статистической информации для статистических целей в случае изменения статистической методологии и на основании обновленной, подтвержденной документально информации
  kaz: Статистикалық әдіснама өзгерген жағдайда статистикалық мақсаттар үшін және жаңартылған, құжатпен расталған ақпарат негізінде жарияланған ресми статистикалық ақпаратты қайта қарау қағидаларын бекіту туралы
