    kaz: «Статистикалық әдіснама өзгерген жағдайда статистикалық мақсаттар үшін және жаңартылған, құжатпен расталған ақпарат негізінде жарияланған ресми статистикалық ақпаратты қайта қарау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті Төрағасының 2018 жылғы 28 желтоқсандағы № 20 бұйрығына өзгерістер енгізу туралы
