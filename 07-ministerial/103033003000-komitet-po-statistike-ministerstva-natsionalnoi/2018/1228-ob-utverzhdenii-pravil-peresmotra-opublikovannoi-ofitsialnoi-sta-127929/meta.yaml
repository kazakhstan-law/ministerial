  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 28 декабря 2018 года № 20 «Об утверждении Правил пересмотра опубликованной официальной статистической информации для статистических целей в случае изменения статистической методологии и на основании обновленной, подтвержденной документально информации»
    kaz: «Статистикалық әдіснама өзгерген жағдайда статистикалық мақсаттар үшін және жаңартылған, құжатпен расталған ақпарат негізінде жарияланған ресми статистикалық ақпаратты қайта қарау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2018 жылғы 28 желтоқсандағы № 20 бұйрығына өзгерістер мен толықтырулар енгізу туралы
