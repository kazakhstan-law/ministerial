requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 26 декабря 2018 года № 15. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 декабря 2018 года № 18046. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 13 июля 2023 года № 5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения опроса респондентов и пользователей с целью мониторинга уровня удовлетворенности деятельностью уполномоченного органа
  kaz: Уәкілетті органның қызметіне қанағаттанушылық деңгейін мониторингілеу мақсатында респонденттер мен пайдаланушыларға сауал салуды жүргізу қағидаларын бекіту туралы
