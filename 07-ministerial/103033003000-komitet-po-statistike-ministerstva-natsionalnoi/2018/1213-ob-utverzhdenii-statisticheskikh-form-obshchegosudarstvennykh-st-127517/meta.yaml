requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 13 декабря 2018 года № 5. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 декабря 2018 года № 17979. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 21 февраля 2020 года № 24 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении статистических форм общегосударственных статистических наблюдений по статистике промышленности и окружающей среды и инструкций по их заполнению
  kaz: Өнеркәсіп және қоршаған орта статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы
