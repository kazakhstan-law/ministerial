requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 26 декабря 2018 года № 13. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 декабря 2018 года № 18068. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 13 июля 2023 года № 5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения с участием респондентов на добровольной основе тестирования и обсуждения проектов статистических форм по общегосударственным и (или) ведомственным статистическим наблюдениям и инструкций по их заполнению
  kaz: Жалпымемлекеттік және (немесе) ведомстволық статистикалық байқаулар бойынша статистикалық нысандардың және оларды толтыру жөніндегі нұсқаулықтардың жобаларын тестілеуді және талқылауды респонденттердің ерікті негізде қатысуымен жүргізу қағидаларын бекіту туралы
