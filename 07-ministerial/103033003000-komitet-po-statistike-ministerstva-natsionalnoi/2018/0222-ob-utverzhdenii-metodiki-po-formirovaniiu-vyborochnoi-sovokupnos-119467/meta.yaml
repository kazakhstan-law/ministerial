  title:
    rus: О внесении изменений в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 22 февраля 2018 года № 36 «Об утверждении Методики по формированию выборочной совокупности для проведения выборочного обследования в сельском хозяйстве»
    kaz: «Ауыл шаруашылығында іріктемелі зерттеу жүргізу үшін іріктемелі жиынтықты қалыптастыру бойынша әдістемені бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2018 жылғы 22 ақпандағы № 36 бұйрығына өзгерістер енгізу туралы
