title:
  rus: Об утверждении расчета численности интервьюеров и стоимости их услуг при проведении общегосударственных статистических наблюн дений и национальных переписей по договору возмездного оказания услуг в соответствии с бюджетным законодательством Республики Казахстан
  kaz: Жалпымемлекеттік статистикалық байқауларды және ұлттық санақтарды жүргізу кезінде Қазақстан Республикасының бюджет заңнамасына сәйкес өтеулі қызметтер көрсету шарты бойынша интервьюерлер санын және олар көрсететін қызметтердің құнын есептеуді бекіту туралы
