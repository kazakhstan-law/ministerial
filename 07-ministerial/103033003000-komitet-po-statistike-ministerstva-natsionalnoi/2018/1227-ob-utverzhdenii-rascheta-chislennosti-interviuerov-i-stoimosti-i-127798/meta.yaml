  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 27 декабря 2018 года № 18 «Об утверждении расчета численности интервьюеров и стоимости их услуг при проведении общегосударственных статистических наблюдений и национальных переписей по договору возмездного оказания услуг в соответствии с бюджетным законодательством Республики Казахстан»
    kaz: «Жалпымемлекеттік статистикалық байқауларды және ұлттық санақтарды жүргізу кезінде Қазақстан Республикасының бюджет заңнамасына сәйкес өтеулі қызметтер көрсету шарты бойынша интервьюерлер санын және олар көрсететін қызметтердің құнын есептеуді бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігінің Статистика комитеті төрағасының 2018 жылғы 27 желтоқсандағы № 18 бұйрығына өзгерістер мен толықтырулар енгізу туралы
