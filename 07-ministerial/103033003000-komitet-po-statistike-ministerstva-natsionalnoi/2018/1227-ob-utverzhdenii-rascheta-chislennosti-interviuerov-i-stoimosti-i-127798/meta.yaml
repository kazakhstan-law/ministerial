  kaz: Жалпымемлекеттік статистикалық байқауларды және ұлттық санақтарды жүргізу кезінде Қазақстан Республикасының бюджет заңнамасына сәйкес өтеулі қызметтер көрсету шарты бойынша интервьюерлер санын және олар көрсететін қызметтердің құнын есептеуді бекіту туралы
