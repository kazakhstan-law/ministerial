requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 26 декабря 2018 года № 17. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 декабря 2018 года № 18049. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 16 сентября 2024 года № 27 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
