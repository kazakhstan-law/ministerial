act_code: '123096'
requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 7 июня 2018 года № 70. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 июня 2018 года № 17135. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 1 сентября 2021 года № 17 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении статистической формы ведомственного статистического наблюдения и инструкции по ее заполнению, разработанных Министерством культуры и спорта Республики Казахстан
  kaz: Қазақстан Республикасы Мәдениет және спорт министрлігі әзірлеген ведомстволық статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы
