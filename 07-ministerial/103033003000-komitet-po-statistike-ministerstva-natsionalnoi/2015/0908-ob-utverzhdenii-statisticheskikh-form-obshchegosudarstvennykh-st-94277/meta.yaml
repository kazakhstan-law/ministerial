    kaz: «Баға статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігінің Статистика комитеті төрағасының 2015 жылғы 8 қыркүйектегі № 137 бұйрығына өзгерістер мен толықтырулар енгізу туралы
