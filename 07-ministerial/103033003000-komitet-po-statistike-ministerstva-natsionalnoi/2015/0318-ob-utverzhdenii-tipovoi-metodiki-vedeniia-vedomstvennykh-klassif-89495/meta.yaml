requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 18 марта 2015 года № 50. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 апреля 2015 года № 10779. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 3 декабря 2024 года № 3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
