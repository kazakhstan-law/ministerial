requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 17 июня 2015 года № 93. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 августа 2015 года № 11842. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 22 сентября 2016 года № 216
title:
  rus: Об утверждении статистических форм общегосударственного статистического наблюдения по статистике кластерного обследования по некоторым показателям в Республике Казахстан и инструкцию по их заполнению
  kaz: Қазақстан Республикасындағы кейбір көрсеткіштер бойынша кластерлік зерттеу статистикасы бойынша жалпымемлекеттік статистикалық байқаудың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықты бекіту туралы
