act_code: '94136'
requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 26 августа 2015 года № 130. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 сентября 2015 года № 12116. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 29 ноября 2016 года № 278
title:
  rus: Об утверждении статистической формы общегосударственного статистического наблюдения «Отчет о взаимной торговле товарами с государствами-членами Евразийского экономического союза» (код 1801101, индекс 1-ТС, периодичность месячная) и инструкции по её заполнению
  kaz: Еуразиялық экономикалық одаққа мүше мемлекеттермен тауарлардың өзара саудасы туралы есеп» (коды 1801101, индексі 1-ТС, кезеңділігі айлық) жалпымемлекеттік статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы
