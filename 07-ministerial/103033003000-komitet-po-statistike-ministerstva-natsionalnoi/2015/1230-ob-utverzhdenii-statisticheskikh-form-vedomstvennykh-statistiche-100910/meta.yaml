caused_by:
  code: '119042'
  requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 2 февраля 2018 года № 24. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 февраля 2018 года № 16418. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 21 января 2020 года № 2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 30 декабря 2015 года № 231 «Об утверждении статистических форм ведомственных статистических наблюдений и инструкций по их заполнению, разработанных Комитетом лесного хозяйства и животного мира Министерства сельского хозяйства Республики Казахстан»
    kaz: «Қазақстан Республикасы Ауыл шаруашылығы министрлігінің Орман шаруашылығы және жануарлар дүниесі комитеті әзірлеген ведомстволық статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының міндетін атқарушының 2015 жылғы 30 желтоқсандағы № 231 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/119042/rus
