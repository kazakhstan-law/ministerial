requisite: Приказ и.о. Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 30 декабря 2015 года № 231. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 апреля 2016 года № 13573. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 21 января 2020 года № 2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении статистических форм ведомственных статистических наблюдений и инструкций по их заполнению, разработанных Комитетом лесного хозяйства и животного мира Министерства сельского хозяйства Республики Казахстан
  kaz: Қазақстан Республикасы Ауыл шаруашылығы министрлігінің Орман шаруашылығы және жануарлар дүниесі комитеті әзірлеген ведомстволық статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы
