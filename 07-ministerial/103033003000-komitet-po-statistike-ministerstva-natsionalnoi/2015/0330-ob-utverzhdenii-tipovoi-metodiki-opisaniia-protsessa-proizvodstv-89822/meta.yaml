  title:
    rus: О внесении изменений в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 30 марта 2015 года № 53 «Об утверждении Типовой методики описания процесса производства статистической информации государственными органами»
    kaz: «Мемлекеттік органдардың статистикалық ақпаратты түзу процесін сипаттаудың үлгілік әдістемесін бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2015 жылғы 30 наурыздағы № 53 бұйрығына өзгерістер енгізу туралы
