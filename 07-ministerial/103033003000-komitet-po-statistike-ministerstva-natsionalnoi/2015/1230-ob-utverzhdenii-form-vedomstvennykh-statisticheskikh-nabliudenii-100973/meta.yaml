caused_by:
  code: '113084'
  requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 10 мая 2017 года № 68. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 июня 2017 года № 15256. Утратил силу приказом и.о. Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 19 октября 2023 года № 19 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 30 декабря 2015 года № 227 «Об утверждении статистических форм ведомственных статистических наблюдений и инструкций по их заполнению, разработанных Министерством здравоохранения и социального развития Республики Казахстан»
    kaz: «Қазақстан Республикасының Денсаулық сақтау және әлеуметтік даму министрлігі әзірлеген ведомстволық статистикалық байқаулардың нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігінің Статистика комитеті төрағасының міндетін атқарушының 2015 жылғы 30 желтоқсандағы № 227 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/113084/rus
