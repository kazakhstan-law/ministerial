caused_by:
  code: '172017'
  requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 22 сентября 2022 года № 380. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 сентября 2022 года № 29770. Утратил силу приказом и.о. Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 19 октября 2023 года № 19 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 30 декабря 2015 года № 227 «Об утверждении статистических форм ведомственных статистических наблюдений и инструкций по их заполнению, разработанных Министерством здравоохранения и социального развития Республики Казахстан»
    kaz: «Қазақстан Республикасының Денсаулық сақтау және әлеуметтік даму министрлігі әзірлеген ведомстволық статистикалық байқаулардың нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасының Ұлттық экономика министрлігі Статистика комитеті төрағасы міндетін атқарушының 2015 жылғы 30 желтоқсандағы № 227 бұйрығына өзгерістер енгізу туралы
