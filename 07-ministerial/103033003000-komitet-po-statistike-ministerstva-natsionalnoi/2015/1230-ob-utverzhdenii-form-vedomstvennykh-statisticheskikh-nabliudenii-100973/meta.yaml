act_code: '100973'
requisite: Приказ и.о. Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 30 декабря 2015 года № 227. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 марта 2016 года № 13485. Утратил силу приказом и.о. Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 19 октября 2023 года № 19 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении форм ведомственных статистических наблюдений Министерства труда и социальной защиты населения Республики Казахстан
  kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрлігінің ведомстволық статистикалық байқауларының нысандарын бекіту туралы
