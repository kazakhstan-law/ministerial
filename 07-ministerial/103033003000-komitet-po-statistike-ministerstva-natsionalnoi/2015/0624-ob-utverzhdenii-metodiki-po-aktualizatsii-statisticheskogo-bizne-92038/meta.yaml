requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 24 июня 2015 года № 96. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 июля 2015 года № 11718. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 5 апреля 2022 года № 7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
