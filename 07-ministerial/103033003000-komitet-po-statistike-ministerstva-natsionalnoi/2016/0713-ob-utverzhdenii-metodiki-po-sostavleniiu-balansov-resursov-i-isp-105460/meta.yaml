  title:
    rus: О внесении изменений в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 13 июля 2016 года № 143 «Об утверждении Методики по составлению балансов ресурсов и использования отдельных видов продукции (товаров) и сырья на республиканском и областном уровне»
    kaz: «Республикалық және облыстық деңгейде өнімнің (тауарлардың) және шикізаттың жекелеген түрлерінің ресурстары мен пайдалану теңгерімдерін құру бойынша әдістемені бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2016 жылғы 13 шілдедегі № 143 бұйрығына өзгерістер енгізу туралы
