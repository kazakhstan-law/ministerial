title:
  rus: Об утверждении Методики по составлению балансов ресурсов и использования отдельных видов продукции (товаров) и сырья
  kaz: Өнімдер (тауарлар) мен шикізаттың жекелеген түрлерінің ресурстары мен пайдалану теңгерімдерін құру жөніндегі әдістемені бекіту туралы
