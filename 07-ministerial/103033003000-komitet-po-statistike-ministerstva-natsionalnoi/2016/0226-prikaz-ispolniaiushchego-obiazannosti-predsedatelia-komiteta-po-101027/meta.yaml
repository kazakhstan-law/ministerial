title:
  rus: Приказ исполняющего обязанности Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан "Об утверждении Методики построения индекса цен на рынке жилья" от 26 февраля 2016 года № 41
  kaz: '"Тұрғын үй нарығындағы бағалар индексін құру әдістемесін бекіту туралы" Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының міндетін атқарушының 2016 жылғы 26 ақпандағы № 41 бұйрығы'
