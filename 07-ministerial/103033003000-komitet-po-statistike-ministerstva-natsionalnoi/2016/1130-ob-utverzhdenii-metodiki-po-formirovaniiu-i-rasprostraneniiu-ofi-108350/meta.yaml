  code: '138990'
  requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 21 января 2020 года № 4. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 января 2020 года № 19917. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 12 августа 2024 года № 23 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Председателя Комитета по статистике Министерства национальной экономики от 30 ноября 2016 года № 292 «Об утверждении Методики по формированию и распространению официальной статистической информации в электронном виде»
    kaz: «Ресми статистикалық ақпаратты электронды түрде қалыптастыру және тарату бойынша әдістемені бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2016 жылғы 30 қарашадағы № 292 бұйрығына өзгерістер енгізу туралы
