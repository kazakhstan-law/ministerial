act_code: '108350'
requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 30 ноября 2016 года № 292. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 декабря 2016 года № 14568. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 12 августа 2024 года № 23 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики по формированию и распространению официальной статистической информации в электронном виде
  kaz: Ресми статистикалық ақпаратты электронды түрде қалыптастыру және тарату бойынша әдістемені бекіту туралы
