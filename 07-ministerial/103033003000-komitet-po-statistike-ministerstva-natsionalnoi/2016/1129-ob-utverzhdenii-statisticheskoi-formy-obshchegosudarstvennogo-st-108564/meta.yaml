requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 29 ноября 2016 года № 278. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 декабря 2016 года № 14602. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 10 ноября 2017 года № 166 (вводится в действие с 1 января 2018 года)
title:
  rus: Об утверждении статистической формы общегосударственного статистического наблюдения «Отчет о взаимной торговле товарами c государствами-членами Евразийского экономического союза» (код 1801101, индекс 1-ТС, периодичность месячная) и инструкции по её заполнению
  kaz: «Еуразиялық экономикалық одаққа мүше мемлекеттермен тауарлардың өзара саудасы туралы есеп» (коды 1801101, индексі 1-ТС, кезеңділігі айлық) жалпымемлекеттік статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы
