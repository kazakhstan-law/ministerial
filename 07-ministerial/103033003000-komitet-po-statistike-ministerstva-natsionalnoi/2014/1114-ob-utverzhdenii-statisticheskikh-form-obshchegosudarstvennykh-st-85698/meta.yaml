  title:
    rus: О внесении изменений в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от  14 ноября 2014 года № 48 «Об утверждении статистических форм общегосударственных статистических наблюдений по статистике образования и инструкций по их заполнению»
    kaz: «Білім беру статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігінің Статистика комитеті төрағасының  2014 жылғы 14 қарашадағы № 48 бұйрығына өзгерістер енгізу туралы
