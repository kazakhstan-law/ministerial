    kaz: «Көлік статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі  нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігінің Статистика комитеті Төрағасының 2014 жылғы 4 желтоқсандағы № 66 бұйрығына өзгерістер енгізу туралы
