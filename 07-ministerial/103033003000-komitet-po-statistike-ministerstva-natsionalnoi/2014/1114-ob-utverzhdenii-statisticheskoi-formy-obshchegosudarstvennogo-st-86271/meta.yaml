title:
  rus: Об утверждении статистической формы общегосударственного статистического наблюдения "Отчет организации по предоставлению специальных социальных услуг" (код 1401104, индекс 3-социальное обеспечение, периодичность годовая) и инструкции по ее заполнению
  kaz: '"Арнаулы әлеуметтік қызметтерді ұсыну жөніндегі ұйымның есебі" (коды 1401104, индексі 3-әлеуметтік қамсыздандыру, кезеңділігі жылдық) жалпымемлекеттік статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы'
