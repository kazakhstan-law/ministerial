requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 25 декабря 2014 года № 94. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 февраля 2015 года № 10271. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 15 мая 2020 года № 27 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении статистической формы ведомственного статистического наблюдения "Отчет о заборе, использовании и водоотведении вод" (код 7791204, индекс 2-ТП (водхоз), периодичность годовая)" и инструкции по ее заполнению
  kaz: '"Су алу, падалану және суды бұру туралы есеп" ведомстволық статистикалық байқаудың статистикалық нысаны (коды 7791204, индексі 2-ТП (сушар), кезеңділігі жылдық) мен оны толтыру жөніндегі нұсқаулықты бекіту туралы'
