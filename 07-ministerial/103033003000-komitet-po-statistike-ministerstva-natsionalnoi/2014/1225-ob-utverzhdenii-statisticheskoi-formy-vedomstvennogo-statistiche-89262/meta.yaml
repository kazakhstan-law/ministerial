  title:
    rus: О внесении изменений в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 25 декабря 2014 года № 94 «Об утверждении статистической формы ведомственного статистического наблюдения «Отчет о заборе, использовании и водоотведении вод» (код 7791204, индекс 2-ТП (водхоз), периодичность годовая)» и инструкции по ее заполнению»
    kaz: «Су алу, пайдалану және суды бұру туралы есеп» ведомстволық статистикалық байқаудың статистикалық нысаны (коды 7791204, индексі 2-ТП (сушар), кезеңділігі жылдық) мен оны толтыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2014 жылғы 25 желтоқсандағы № 94 бұйрығына өзгерістер енгізу туралы
