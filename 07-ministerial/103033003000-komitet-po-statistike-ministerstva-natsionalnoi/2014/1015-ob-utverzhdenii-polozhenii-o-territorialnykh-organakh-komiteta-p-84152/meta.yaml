  title:
    rus: О внесении изменений в приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 15 октября 2014 года № 13 «Об утверждении положений о территориальных органах Комитета по статистике Министерства национальной экономики Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитетінің аумақтық органдары туралы ережелерді бекіту жөнінде» Қазақстан Республикасы Ұлттық экономика министрлігінің Статистика комитеті төрағасының 2014 жылғы 15 қазандағы № 13 бұйрығына өзгерістер енгізу туралы
