act_code: '84152'
requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 15 октября 2014 года № 13. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 октября 2014 года № 9834. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 29 июня 2020 года № 30 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении положений о территориальных органах Комитета по статистике Министерства национальной экономики Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитетінің аумақтық органдары туралы ережелерді бекіту жөнінде
