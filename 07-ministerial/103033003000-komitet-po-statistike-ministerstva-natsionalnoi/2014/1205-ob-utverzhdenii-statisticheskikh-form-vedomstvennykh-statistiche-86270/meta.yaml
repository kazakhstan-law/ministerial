act_code: '86270'
requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 5 декабря 2014 года № 68. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 января 2015 года № 10143. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 24 ноября 2021 года № 36 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении статистических форм ведомственных статистических наблюдений и инструкций по их заполнению, разработанных Национальным Банком Республики Казахстан
  kaz: Қазақстан Республикасының Ұлттық Банкі әзірлеген ведомстволық статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы
