    kaz: «Денсаулық сақтау статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігінің Статистика комитеті төрағасының 2014 жылғы 14 қарашадағы № 51 бұйрығына өзгерістер енгізу туралы
