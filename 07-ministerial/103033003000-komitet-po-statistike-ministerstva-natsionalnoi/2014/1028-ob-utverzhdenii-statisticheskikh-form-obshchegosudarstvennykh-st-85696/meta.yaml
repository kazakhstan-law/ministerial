    kaz: '"Байланыс статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы" Қазақстан Республикасы Ұлттық экономика министрлігінің Статистика комитеті Төрағасының 2014 жылғы 4 қарашадағы № 39 бұйрығына өзгерістер енгізу туралы'
