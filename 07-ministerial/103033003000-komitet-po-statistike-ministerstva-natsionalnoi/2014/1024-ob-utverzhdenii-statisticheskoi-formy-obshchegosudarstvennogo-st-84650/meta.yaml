title:
  rus: Об утверждении статистической формы общегосударственного статистического наблюдения "Отчет о взаимной торговле товарами с государствами-членами Таможенного союза" (код 1801101, индекс 1-ТС, периодичность месячная) и инструкции по ее заполнению
  kaz: '"Кеден одағына мүше-мемлекеттермен тауарлардың өзара саудасы туралы есеп" (коды 1801101, индексі 1-ТС, кезеңділігі айлық) жалпымемлекеттік статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы'
