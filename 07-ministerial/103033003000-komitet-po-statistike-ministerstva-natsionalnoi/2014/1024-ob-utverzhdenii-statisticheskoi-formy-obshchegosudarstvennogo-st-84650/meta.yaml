requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 24 октября 2014 года № 20. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 ноября 2014 года № 9903. Утратил силу приказом Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 26 августа 2015 года № 130
