title:
  rus: Об утверждении статистической формы общегосударственного статистического наблюдения "Электронная форма ввода данных для регистрации цен на потребительские товары и услуги" (код 7823108, индекс Ц-101э, периодичность ежедневная) и инструкции по ее заполнению
  kaz: '"Тұтыну тауарлары мен қызметтерінің бағаларын тіркеуге арналған деректерді енгізудің электрондық нысаны" (коды 7823108, индексі Ц-101э, кезеңділігі күн сайынғы) жалпымемлекеттік статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы'
