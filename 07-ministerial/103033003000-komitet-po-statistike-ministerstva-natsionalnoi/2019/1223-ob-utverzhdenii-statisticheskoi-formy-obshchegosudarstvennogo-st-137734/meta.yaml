act_code: '137734'
requisite: Приказ Председателя Комитета по статистике Министерства национальной экономики Республики Казахстан от 23 декабря 2019 года № 15. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2019 года № 19791. Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 15 февраля 2021 года № 6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении статистической формы общегосударственного статистического наблюдения «Уровень доверия населения к правоохранительным органам» (индекс УДН, периодичность один раз в год) и инструкции по ее заполнению
  kaz: Халықтың құқық қорғау органдарына деген сенімділік деңгейі» (индексі УДН, кезеңділігі жылына бір рет) жалпымемлекеттік статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы
