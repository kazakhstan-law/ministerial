    kaz: «Тұрмыс деңгейі статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрлігі Статистика комитеті төрағасының 2019 жылғы 19 желтоқсандағы № 14 бұйрығына өзгерістер енгізу туралы
