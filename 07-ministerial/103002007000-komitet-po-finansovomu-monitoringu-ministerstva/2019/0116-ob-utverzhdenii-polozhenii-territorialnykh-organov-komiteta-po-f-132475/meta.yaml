  title:
    rus: О внесении изменений в приказ председателя Комитета по финансовому мониторингу Министерства финансов Республики Казахстан от 16 января 2019 года № П-3 «Об утверждении положений территориальных органов Комитета по финансовому мониторингу Министерства финансов»
    kaz: «Қазақстан Республикасы Қаржы министрлігі Қаржы мониторингі комитетінің аумақтық органдарының ережелерін бекіту туралы» Қазақстан Республикасы Қаржы министрлігінің Қаржы мониторингі комитеті төрағасының 2019 жылғы 16 қаңтардағы № П-3 бұйрығына өзгерістер енгізу туралы
