act_code: '221632'
requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 27 января 2026 года № 35. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 января 2026 года № 37901
title:
  rus: Об утверждении образцов аншлагов границ рыбохозяйственных водоемов и (или) участков, а также запретных для рыболовства сроков и мест, форму журнала учета лова рыбных ресурсов и других водных животных (промысловый журнал)
  kaz: Балық шаруашылығы су айдындарының және (немесе) учаскелерінің шекаралары аншлагтарының үлгілерін, сондай-ақ балық аулау үшін тыйым салынған мерзімдер мен орындарды, балық ресурстарын және басқа да су жануарларын аулауды есепке алу журналының (кәсіпшілік журналдың) нысанын бекіту туралы
