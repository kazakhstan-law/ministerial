title:
  rus: Об утверждении перечня видов деятельности, технологически связанных с производством товаров, работ, услуг субъекта государственной монополии в области охраны, воспроизводства и использования животного мира
  kaz: Жануарлар дүниесін қорғау, өсімін молайту және пайдалану саласындағы мемлекеттік монополия субъектісінің тауарларды, жұмыстарды, көрсетілетін қызметтерді өндірумен технологиялық тұрғыдан байланысты қызмет түрлерінің тізбесін бекіту туралы
