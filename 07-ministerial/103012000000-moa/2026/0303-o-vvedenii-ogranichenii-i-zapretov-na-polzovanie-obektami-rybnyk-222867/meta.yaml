  kaz: Балық ресурстары мен басқа да су жануарлары объектілерін, олардың бөліктері мен дериваттарын пайдалануға шектеулер мен тыйым салуларды енгізу, сондай-ақ оларды пайдалану орындары мен мерзімдерін белгілеу туралы
