title:
  rus: Об утверждении Правил постановки на специальный учет и предоставления равнозначного места в очереди на бесплатное получение в собственность земельного участка для индивидуального жилищного строительства гражданам Республики Казахстан, состоявшим в очереди в населенных пунктах, в пределах города Алатау
