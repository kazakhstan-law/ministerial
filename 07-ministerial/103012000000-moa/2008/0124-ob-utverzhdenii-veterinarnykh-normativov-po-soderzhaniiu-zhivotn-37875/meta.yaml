  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 24 января 2008 года № 28 "Об утверждении ветеринарных нормативов по содержанию животных в личных подсобных хозяйствах в пределах границ населенных пунктов и нагрузки выпаса животных на землях сельскохозяйственного назначения, отведенных для населенных пунктов"
    kaz: '"Жеке қосалқы шаруашылықтарда елді мекендердің шекаралары шегінде мал ұстау және ауыл шаруашылығы пайдаланымындағы елді мекенді жерлерде малдарды бағу жүктемесінің ветеринарлық нормативін бекіту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің 2008 жылғы 24 қаңтардағы № 28 бұйрығына өзгерістер енгізу туралы'
