act_code: '37875'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 24 января 2008 года N 28. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 февраля 2008 года N 5145. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 16 мая 2022 года № 154 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении ветеринарных нормативов по содержанию животных в личных подсобных хозяйствах в пределах границ населенных пунктов и нагрузки выпаса животных на землях сельскохозяйственного назначения, отведенных для населенных пунктов
  kaz: Жеке қосалқы шаруашылықтарда елді мекендердің шекаралары шегінде мал ұстау және ауыл шаруашылығы пайдаланымындағы елді мекенді жерлерде малдарды бағу жүктемесінің ветеринарлық нормативтерін бекіту
