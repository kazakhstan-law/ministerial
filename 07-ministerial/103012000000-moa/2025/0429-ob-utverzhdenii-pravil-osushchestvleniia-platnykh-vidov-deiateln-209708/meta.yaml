  kaz: Сұрыптық сынау саласындағы мемлекеттік мекеменің тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуі бойынша ақылы қызмет түрлерін жүзеге асыру, оның тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуінен түсетін, өз иелігінде қалатын ақшаны пайдалану қағидаларын бекіту туралы
