requisite: Приказ Министра сельского хозяйства Республики Казахстан от 22 сентября 2025 года № 315. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 сентября 2025 года № 36915
title:
  rus: Об утверждении Правил содержания, разведения в неволе и полувольных условиях редких и находящихся под угрозой исчезновения видов рыб и других водных животных, в том числе подпадающих под действие Конвенции о международной торговле видами дикой фауны и флоры, находящимися под угрозой исчезновения
  kaz: Балықтардың және басқа да су жануарларының сирек кездесетін және жойылып кету қаупі төнген түрлерін, оның ішінде Құрып кету қаупі төнген жабайы фауна мен флора түрлерімен халықаралық сауда туралы конвенцияның қолданылу аясына кіретін түрлерін еріксіз және жартылай ерікті жағдайларда ұстау, көбейту қағидаларын бекіту туралы
