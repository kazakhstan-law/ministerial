act_code: '214463'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 18 сентября 2025 года № 304
title:
  rus: Об утверждении перечня специализированной сельскохозяйственной техники, по которым юридические лица – производители сельскохозяйственной продукции, продукции аквакультуры (рыбоводства), а также глава и (или) члены крестьянского или фермерского хозяйства по используемой в процессе собственного производства сельскохозяйственной продукции не являются плательщиками налога на транспортные средства
  kaz: Ауыл шаруашылығы өнімін, аквашаруашылық (балық өсіру шаруашылығы) өнімін өндіруші заңды тұлғалар, сондай-ақ шаруа немесе фермер қожалығының басшысы және (немесе) мүшелері ауыл шаруашылығы өнімін өзі өндіру процесінде пайдаланылатын көлік құралдарына салық төлеуші болып табылмайтын мамандандырылған ауыл шаруашылығы техникасының тізбесін бекіту туралы
