requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 30 апреля 2025 года № 136. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 апреля 2025 года № 36061. Действовал до 1 июля 2025 года в соответствии с пунктом 5 настоящего приказа
title:
  rus: Об утверждении Правил осуществления платных видов деятельности по реализации услуг государственным учреждением в сфере агрохимического обслуживания сельскохозяйственного производства, использования им денег от реализации услуг, остающихся в его распоряжении
  kaz: Ауыл шаруашылығы өндірісіне агрохимиялық қызмет көрсету саласындағы мемлекеттiк мекеменiң көрсетiлетін қызметтердi өткiзуі бойынша ақылы қызмет түрлерiн жүзеге асыру, оның көрсетiлетiн қызметтердi өткiзуінен түскен, өз иелігінде қалатын ақшаны пайдалану қағидаларын бекiту туралы
