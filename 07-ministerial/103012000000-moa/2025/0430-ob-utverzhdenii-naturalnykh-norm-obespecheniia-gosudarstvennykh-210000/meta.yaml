title:
  rus: Об утверждении натуральных норм обеспечения государственных организаций, осуществляющих определение видового состава карантинных объектов и чужеродных видов в образцах и выявление скрытой зараженности карантинными объектами и чужеродными видами в импортном посевном и посадочном материалах
  kaz: Үлгілердегі карантиндік объектілер мен бөтен текті түрлердің түрлік құрамын айқындауды және импорттық себу мен отырғызылатын материалдардағы карантиндік объектілермен және бөтен текті түрлермен жасырын залалдануды анықтауды жүзеге асыратын мемлекеттік ұйымдарды қамтамасыз етудің заттай нормаларын бекіту туралы
