act_code: '213233'
requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 11 августа 2025 года № 240
title:
  rus: Об утверждении Перечня должностных лиц ведомства уполномоченного органа и его территориальных подразделений, осуществляющих государственный контроль и надзор в области охраны, воспроизводства и использования рыбных ресурсов и других водных животных, а также работников государственных учреждений и организаций, осуществляющих непосредственную охрану рыбных ресурсов и других водных животных, имеющих право на ношение форменной одежды со знаками различия (без погон)
  kaz: Балық ресурстарын және басқа да су жануарларын қорғау, өсімін молайту және пайдалану саласындағы мемлекеттік бақылауды және қадағалауды жүзеге асыратын уәкілетті орган ведомствосының және оның аумақтық бөлімшелерінің лауазымды адамдарының, сондай-ақ балық ресурстарын және басқа да су жануарларын қорғауды тікелей жүзеге асыратын, айырым белгілері бар нысанды киім (погонсыз) киіп жүруге құқығы бар мемлекеттік мекемелер мен ұйымдар жұмыскерлерінің тізбесін бекіту туралы
