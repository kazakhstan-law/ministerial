act_code: '214350'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 17 сентября 2025 года № 301
title:
  rus: Об утверждении перечня выполняемых работ и (или) оказываемых услуг сельскохозяйственными кооперативами своим членам в целях производства и переработки сельскохозяйственной продукции собственного производства, включая вспомогательные работы и услуги, а также перечня товаров, реализуемых сельскохозяйственными кооперативами своим членам, в целях производства и переработки сельскохозяйственной продукции собственного производства
  kaz: Қосалқы жұмыстар мен көрсетілетін қызметтерді қоса алғанда, өз өндірісінің ауыл шаруашылығы өнімін өндіру және қайта өңдеу мақсатында ауыл шаруашылығы кооперативтері өз мүшелеріне орындайтын жұмыстардың және (немесе) көрсетілетін қызметтердің тізбесін, сондай-ақ ауыл шаруашылығы кооперативтері өз мүшелеріне өз өндірісінің ауыл шаруашылығы өнімін өндіру және қайта өңдеу мақсатында өткізетін тауарлардың тізбесін бекіту туралы
