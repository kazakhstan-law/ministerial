  kaz: Ветеринария саласындағы мемлекеттік мекемелердің тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуі бойынша ақылы қызмет түрлерін жүзеге асыру, олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуінен түсетін, өз иелігінде қалатын ақшаны пайдалану қағидаларын бекіту туралы
