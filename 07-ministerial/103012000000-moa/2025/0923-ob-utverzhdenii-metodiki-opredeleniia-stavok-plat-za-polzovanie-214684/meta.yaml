act_code: '214684'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 23 сентября 2025 года № 320. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 сентября 2025 года № 36928
title:
  rus: Об утверждении Методики определения ставок плат за пользование рыбными ресурсами и другими водными животными и размеров возмещения вреда, причиненного нарушением законодательства Республики Казахстан в области охраны, воспроизводства и использования животного мира, а также исчисления размера компенсации вреда, наносимого и нанесенного рыбным ресурсам и другим водным животным, в том числе и неизбежного, в результате хозяйственной деятельности
  kaz: Балық ресурстары мен басқа да су жануарларын пайдаланғаны үшін төлемақы мөлшерлемелерін және Қазақстан Республикасының жануарлар дүниесін қорғау, өсімін молайту және пайдалану саласындағы заңнамасын бұзудан келтірілген зиянды өтеу мөлшерін айқындау, сондай-ақ шаруашылық қызмет салдарынан балық ресурстары мен басқа да су жануарларына келтірілетін және келтірілген, оның ішінде болмай қоймайтын зиянның орнын толтыру мөлшерін есептеу әдістемесін бекіту туралы
