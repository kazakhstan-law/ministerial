title:
  rus: Об утверждении натуральных норм специальных транспортных средств государственных учреждений, находящихся в ведении Комитета государственной инспекции в агропромышленном комплексе и Комитета ветеринарного контроля и надзора Министерства сельского хозяйства Республики Казахстан
  kaz: Қазақстан Республикасы Ауыл шаруашылығы министрлігі Агроөнеркәсіптік кешендегі мемлекеттік инспекция комитетінің және Ветеринариялық бақылау және қадағалау комитетінің қарамағындағы мемлекеттік мекемелердің арнайы көлік құралдарының заттай нормаларын бекіту туралы
