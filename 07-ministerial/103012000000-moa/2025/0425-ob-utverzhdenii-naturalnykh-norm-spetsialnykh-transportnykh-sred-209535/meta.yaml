  requisite: Приказ Министра сельского хозяйства Республики Казахстан от 17 октября 2025 года № 376
  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра сельского хозяйства Республики Казахстан от 25 апреля 2025 года № 123 «Об утверждении натуральных норм специальных транспортных средств государственных учреждений, находящихся в ведении Комитета государственной инспекции в агропромышленном комплексе и Комитета ветеринарного контроля и надзора Министерства сельского хозяйства Республики Казахстан»
    kaz: «Қазақстан Республикасы Ауыл шаруашылығы министрлігі Агроөнеркәсіптік кешендегі мемлекеттік инспекция комитетінің және Ветеринариялық бақылау және қадағалау комитетінің қарамағындағы мемлекеттік мекемелердің арнайы көлік құралдарының заттай нормаларын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің міндетін атқарушының 2025 жылғы 25 сәуірдегі № 123 бұйрығына өзгеріс енгізу туралы
