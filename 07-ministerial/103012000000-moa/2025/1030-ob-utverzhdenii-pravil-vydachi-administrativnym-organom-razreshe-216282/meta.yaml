act_code: '216282'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 30 октября 2025 года № 405. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 октября 2025 года № 37295
title:
  rus: Об утверждении Правил выдачи административным органом разрешений на импорт на территорию Республики Казахстан, экспорт и (или) реэкспорт с территории Республики Казахстан видов рыб и других водных животных, подпадающих под действие Конвенции о международной торговле видами дикой фауны и флоры, находящимися под угрозой исчезновения
  kaz: Құрып кету қаупі төнген жабайы фауна мен флора түрлерімен халықаралық сауда туралы конвенцияның қолданылу аясына кіретін балықтар мен басқа да су жануарларының түрлерін Қазақстан Республикасының аумағына импорттауға, Қазақстан Республикасының аумағынан экспорттауға және (немесе) кері экспорттауға әкімшілік органның рұқсаттар беру қағидаларын бекіту туралы
