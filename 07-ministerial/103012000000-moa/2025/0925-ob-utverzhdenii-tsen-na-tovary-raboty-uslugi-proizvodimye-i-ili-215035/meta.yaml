title:
  rus: Об утверждении цен на товары (работы, услуги) производимые и (или) реализуемые республиканским государственным предприятием на праве хозяйственного ведения «Государственный институт проведения работ по обследованию земель» Комитета по управлению земельными ресурсами Министерства сельского хозяйства Республики Казахстан
  kaz: Қазақстан Республикасы Ауыл шаруашылығы министрлігі Жер ресурстарын басқару комитетінің «Жерлерге зерттеп-қарау жұмыстарын жүргізу мемлекеттік институты» шаруашылық жүргізу құқығындағы республикалық мемлекеттік кәсіпорны өндіретін және (немесе) өткізетін тауарлардың (жұмыстардың, көрсетілетін қызметтердің) бағаларын бекіту туралы
