    rus: О внесении изменений и дополнений в приказ и.о. Министра сельского хозяйства Республики Казахстан от 3 марта 2001 года N 47 "Об утверждении Правил выплаты средств на 2001 год по программе 38 - "Сохранение и развитие элитного семеноводства и племенного дела"
    kaz: Қазақстан Республикасы Ауыл шаруашылығы министрiнiң қызыметiн атқарушының "Элиталық тұқым шаруашылығы және мал тұқымын асылдандыру iсiн сақтау және дамыту" 38 бағдарламасы бойынша "2001 жылға қаражат төлеудiң ережелерiн бекiту туралы" 2001 жылғы 3 наурыздағы N 47 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы
