title:
  rus: Об утверждении Правил и условий выплаты надбавок за особые условия труда гражданским служащим, работникам организаций, содержащихся за счет средств государственного бюджета, работникам казенных предприятий в сфере сельского хозяйства
  kaz: Ауыл шаруашылығы саласындағы азаматтық қызметшілерге, мемлекеттік бюджет қаражаты есебінен ұсталатын ұйымдар жұмыскерлеріне, қазыналық кәсіпорындар жұмыскерлеріне ерекше еңбек жағдайлары үшін үстемақылар төлеу қағидалары мен шарттарын бекіту туралы
