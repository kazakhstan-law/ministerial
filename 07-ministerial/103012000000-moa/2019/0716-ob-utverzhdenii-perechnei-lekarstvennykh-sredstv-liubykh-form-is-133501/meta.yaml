act_code: '133501'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 16 июля 2019 года № 261. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 июля 2019 года № 19065. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 19 сентября 2025 года № 309 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Перечней лекарственных средств любых форм, используемых (применяемых) в области ветеринарии, в том числе фармацевтических субстанций (активных фармацевтических субстанций); изделий ветеринарного назначения, включая протезно-ортопедические изделия, и ветеринарной техники; материалов и комплектующих для производства лекарственных средств любых форм, используемых (применяемых) в области ветеринарии, в том числе фармацевтических субстанций (активных фармацевтических субстанций) и изделий ветеринарного назначения, включая протезно-ортопедические изделия, и ветеринарной техники, обороты по реализации которых и импорт освобождаются от налога на добавленную стоимость
  kaz: Оларды өткізу бойынша айналымдары және импорты қосылған құн салығынан босатылатын ветеринария, оның ішінде фармацевтикалық субстанциялар (активті фармацевтикалық субстанциялар) саласында пайдаланылатын (қолданылатын) кез келген нысандағы дәрілік заттардың; протездiк-ортопедиялық бұйымдар мен ветеринариялық техниканы қоса алғанда, ветеринариялық мақсаттағы бұйымдардың; ветеринария, оның ішінде фармацевтикалық субстанциялар (активті фармацевтикалық субстанциялар) саласында пайдаланылатын (қолданылатын) кез келген нысандағы дәрілік заттарды және протездiк-ортопедиялық бұйымдар мен ветеринариялық техниканы қоса алғанда, ветеринариялық мақсаттағы бұйымдарды өндіруге арналған материалдар мен жиынтықтаушылар тізбелерін бекіту туралы
