  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 16 июля 2019 года № 261 «Об утверждении Перечней лекарственных средств любых форм, используемых (применяемых) в области ветеринарии, в том числе фармацевтических субстанций (активных фармацевтических субстанций); изделий ветеринарного назначения, включая протезно-ортопедические изделия, и ветеринарной техники; материалов и комплектующих для производства лекарственных средств любых форм, используемых (применяемых) в области ветеринарии, в том числе фармацевтических субстанций (активных фармацевтических субстанций) и изделий ветеринарного назначения, включая протезно-ортопедические изделия, и ветеринарной техники, обороты по реализации которых и импорт освобождаются от налога на добавленную стоимость»
    kaz: «Оларды өткізу бойынша айналымдары және импорты қосылған құн салығынан босатылатын ветеринария, оның ішінде фармацевтикалық субстанциялар (активті фармацевтикалық субстанциялар) саласында пайдаланылатын (қолданылатын) кез келген нысандағы дәрілік заттардың; протездiк-ортопедиялық бұйымдар мен ветеринариялық техниканы қоса алғанда, ветеринариялық мақсаттағы бұйымдардың; ветеринария, оның ішінде фармацевтикалық субстанциялар (активті фармацевтикалық субстанциялар) саласында пайдаланылатын (қолданылатын) кез келген нысандағы дәрілік заттарды және протездiк-ортопедиялық бұйымдар мен ветеринариялық техниканы қоса алғанда, ветеринариялық мақсаттағы бұйымдарды өндіруге арналған материалдар мен жиынтықтаушылар тізбелерін бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2019 жылғы 16 шілдедегі № 261 бұйрығына өзгерістер енгізу туралы
