    kaz: «Ветеринария саласындағы қызметті жүзеге асыратын жергілікті атқарушы органдар қызметінің тиімділігін бағалауға арналған ветеринария саласындағы нысаналы индикаторларды есептеу әдістемесін бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2020 жылғы 11 ақпандағы № 49 бұйрығына өзгерістер енгізу туралы
