title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача лицензии на осуществление деятельности на производство (формуляции) пестицидов, реализацию пестицидов, применение пестицидов аэрозольным и фумигационным способами»
  kaz: «Пестицидтердi өндiру (формуляциялау), пестицидтердi өткiзу, пестицидтердi аэрозольдiк және фумигациялық тәсiлдермен қолдануға байланысты қызметті жүзеге асыруға лицензия беру» мемлекеттік қызметін көрсету қағидаларын бекіту туралы
