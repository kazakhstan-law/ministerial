act_code: '147299'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 8 октября 2020 года № 309. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 октября 2020 года № 21404
title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача заключения (разрешительного документа) на ввоз образцов незарегистрированных средств защиты растений (пестицидов) для проведения регистрационных (мелкоделяночных и производственных) испытаний и (или) научных исследований в соответствии с решениями Коллегии Евразийской экономической комиссии»
  kaz: «Еуразиялық экономикалық комиссия алқасының шешіміне сәйкес тіркеу (ұсақмөлдекті және өндірістік) сынақтарын және (немесе) ғылыми-зерттеулер жүргізу үшін өсімдіктерді қорғаудың тіркелмеген құралдарының (пестицидтердің) үлгілерін әкелуге арналған қорытынды (рұқсат құжаты) беру» мемлекеттік қызметін көрсету қағидаларын бекіту туралы
