  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 8 октября 2020 года № 309 «Об утверждении Правил оказания государственной услуги «Выдача заключения (разрешительного документа) на ввоз образцов незарегистрированных средств защиты растений (пестицидов) для проведения регистрационных (мелкоделяночных и производственных) испытаний и (или) научных исследований в соответствии с решениями Коллегии Евразийской экономической комиссии»
    kaz: «Еуразиялық экономикалық комиссия алқасының шешіміне сәйкес тіркеу (ұсақмөлдекті және өндірістік) сынақтарын және (немесе) ғылыми-зерттеулер жүргізу үшін өсімдіктерді қорғаудың тіркелмеген құралдарының (пестицидтердің) үлгілерін әкелуге арналған қорытынды (рұқсат құжаты) беру» мемлекеттік қызметін көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2020 жылғы 8 қазандағы № 309 бұйрығына өзгерістер енгізу туралы
