requisite: Приказ Министра сельского хозяйства Республики Казахстан от 5 февраля 2020 года № 39. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 февраля 2020 года № 19997. Утратил силу приказом и.о. Министра водных ресурсов и ирригации Республики Казахстан от 31 июля 2025 года № 190-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении тарифов на оказываемые платные виды услуг республиканским государственным учреждением при проведении мониторинга и оценки мелиоративного состояния орошаемых земель
  kaz: Суармалы жерлердің мелиорациялық жай-күйіне мониторинг және бағалау жүргізу кезінде республикалық мемлекеттік мекеме көрсететін ақылы қызмет түрлеріне арналған тарифтерді бекіту туралы
