title:
  rus: Об утверждении Правил организации и проведения торгов (аукционов) по продаже земельных участков или права аренды земельных участков в электронном виде на веб-портале реестра государственного имущества
  kaz: Жер учаскелерін немесе жер учаскелерін жалдау құқығын сату жөніндегі сауда-саттықты (аукциондарды) мемлекеттік мүлік тізілімінің веб-порталында электрондық түрде ұйымдастыру мен өткізу қағидаларын бекіту туралы
