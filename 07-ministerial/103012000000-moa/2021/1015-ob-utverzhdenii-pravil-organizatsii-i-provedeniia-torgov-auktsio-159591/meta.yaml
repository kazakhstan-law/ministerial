  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 15 октября 2021 года № 297 «Об утверждении Правил организации и проведения торгов (конкурсов, аукционов) по продаже земельных участков или права аренды земельных участков в электронном виде на веб-портале реестра государственного имущества»
    kaz: «Жер учаскелерін немесе жер учаскелерін жалға алу құқығын сату жөніндегі сауда-саттықты (конкурстарды, аукциондарды) мемлекеттік мүлік тізілімінің веб-порталында электрондық түрде ұйымдастыру мен өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2021 жылғы 15 қазандағы № 297 бұйрығына өзгерістер енгізу туралы
