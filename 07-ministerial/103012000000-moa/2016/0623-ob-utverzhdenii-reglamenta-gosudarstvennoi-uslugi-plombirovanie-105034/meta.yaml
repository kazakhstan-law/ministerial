act_code: '105034'
requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 23 июня 2016 года № 272. Зарегистрирован Министерством юстиции Республики Казахстан 26 июля 2016 года № 13993. Утратил силу приказом Министра экологии, геологии и природных ресурсов Республики Казахстан от 16 ноября 2020 года № 286 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Пломбирование приборов учета вод, устанавливаемых на сооружениях или устройствах по забору или сбросу вод физическими и юридическими лицами, осуществляющими право специального водопользования»
  kaz: «Арнайы су пайдалану құқығын жүзеге асыратын жеке және заңды тұлғалардың суды алу немесе ағызу құрылыстарында немесе құрылғыларында орнатылатын суды есепке алу аспаптарын пломбалау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
