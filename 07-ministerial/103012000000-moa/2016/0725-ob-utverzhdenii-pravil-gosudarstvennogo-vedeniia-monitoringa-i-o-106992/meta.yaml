act_code: '106992'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 25 июля 2016 года № 330. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 сентября 2016 года № 14227. Утратил силу приказом и.о. Министра водных ресурсов и ирригации Республики Казахстан от 31 июля 2025 года № 190-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил государственного ведения мониторинга и оценки мелиоративного состояния орошаемых земель в Республике Казахстан и информационного банка данных о мелиоративном состоянии земель сельскохозяйственного назначения
  kaz: Қазақстан Республикасында суармалы жерлердің мелиорациялық жай-күйінің мониторингін және оны бағалауды және ауыл шаруашылығы мақсатындағы жерлердің мелиорациялық жай-күйі туралы ақпараттық деректер банкін мемлекеттік жүргізу қағидаларын бекіту туралы
