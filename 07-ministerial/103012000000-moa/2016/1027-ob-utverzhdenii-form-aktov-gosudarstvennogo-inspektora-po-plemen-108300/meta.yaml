  kaz: Асыл тұқымды мал шаруашылығы жөніндегі мемлекеттік инспектор актілерінің нысандарын, оның ішінде әкімшілік құқық бұзушылық туралы хаттама нысанын, оларды жасау және беру қағидаларын бекіту туралы
