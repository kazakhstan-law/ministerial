    kaz: «Асыл тұқымды мал шаруашылығы жөніндегі мемлекеттік инспектор актілерінің нысандарын, оларды жасау және беру қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің 2016 жылғы 27 қазандағы № 453 бұйрығына өзгерістер мен толықтыру енгізу туралы
