  title:
    rus: О внесении изменения в приказ Министра сельского хозяйства Республики Казахстан от 26 января 2016 года № 22 «Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) государственными учреждениями в сферах лесного хозяйства, особо охраняемых природных территорий и расходования ими денег от реализации товаров (работ, услуг)»
    kaz: «Орман шаруашылығы, ерекше қорғалатын табиғи аумақтар салаларындағы мемлекеттік мекемелердің тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізу бойынша ақылы қызмет түрлерін көрсету және олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсау қағидаларын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2016 жылғы 26 қаңтардағы № 22 бұйрығына өзгеріс енгізу туралы
