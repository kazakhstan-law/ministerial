act_code: '100345'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 26 января 2016 года № 22. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 марта 2016 года № 13378. Утратил силу приказом Министра экологии и природных ресурсов Республики Казахстан от 27 июня 2025 года № 175 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) государственными учреждениями в сферах лесного хозяйства, особо охраняемых природных территорий и расходования ими денег от реализации товаров (работ, услуг)
  kaz: Орман шаруашылығы, ерекше қорғалатын табиғи аумақтар салаларындағы мемлекеттік мекемелердің тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізу бойынша ақылы қызмет түрлерін көрсету және олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсау қағидаларын бекіту туралы
