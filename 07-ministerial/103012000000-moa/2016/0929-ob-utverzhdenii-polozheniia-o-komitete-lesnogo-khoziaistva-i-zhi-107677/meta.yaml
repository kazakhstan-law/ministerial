  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра Республики Казахстан – Министра сельского хозяйства Республики Казахстан от 29 сентября 2016 года № 408 «Об утверждении Положения о Комитете лесного хозяйства и животного мира Министерства сельского хозяйства Республики Казахстан»
    kaz: «Қазақстан Республикасы Ауыл шаруашылығы министрлігінің Орман шаруашылығы және жануарлар дүниесі комитеті туралы ережені бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің 2016 жылғы 29 қыркүйектегі № 408 бұйрығына өзгерістер енгізу туралы
