  title:
    rus: О внесении изменения в приказ Заместителя Премьер-Министра Республики Казахстан – Министра сельского хозяйства Республики Казахстан от 1 сентября 2016 года № 380 «Об утверждении Правил согласования размещения предприятий и других сооружений, а также условий производства строительных и других работ на водных объектах, водоохранных зонах и полосах»
    kaz: «Су объектiлерiнде, су қорғау аймақтары мен белдеулерiнде кәсiпорындар мен басқа да құрылысжайларды орналастыруды, сондай-ақ құрылыс және басқа да жұмыстар жүргiзу шарттарын келісу қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасының Ауыл шаруашылығы министрінің 2016 жылғы 1 қыркүйектегі № 380 бұйрығына өзгерістер енгізу туралы
