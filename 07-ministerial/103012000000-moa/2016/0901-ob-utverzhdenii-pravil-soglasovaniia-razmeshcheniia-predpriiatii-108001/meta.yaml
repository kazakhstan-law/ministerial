act_code: '108001'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 1 сентября 2016 года № 380. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 ноября 2016 года № 14445. Утратил силу приказом и.о. Министра водных ресурсов и ирригации Республики Казахстан от 20 июня 2025 года № 142-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил согласования размещения предприятий и других сооружений, а также условий производства строительных и других работ на водных объектах, водоохранных зонах и полосах
  kaz: Су объектiлерiнде, су қорғау аймақтары мен белдеулерiнде кәсiпорындар мен басқа да құрылыстарды орналастыруды, сондай-ақ құрылыс және басқа да жұмыстар жүргiзу шарттарын келісу қағидаларын бекіту туралы
