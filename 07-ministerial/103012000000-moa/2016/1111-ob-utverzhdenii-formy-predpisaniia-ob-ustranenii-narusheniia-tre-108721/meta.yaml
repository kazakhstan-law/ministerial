  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра Республики Казахстан – Министра сельского хозяйства Республики Казахстан от 11 ноября 2016 года № 471 «Об утверждении формы предписания об устранении нарушения требований законодательства Республики Казахстан о зерне, протокола об административном правонарушении, постановления по делу об административном правонарушении»
    kaz: «Қазақстан Республикасы астық туралы заңнамасы талаптарының бұзылуын жою туралы нұсқаманың, әкімшілік құқық бұзушылық туралы хаттаманың, әкімшілік құқық бұзушылық туралы іс жөніндегі қаулының нысандарын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің 2016 жылғы 11 қарашадағы № 471 бұйрығына өзгерістер енгізу туралы
