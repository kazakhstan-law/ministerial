title:
  rus: Об утверждении формы предписания об устранении нарушения требований законодательства Республики Казахстан о зерне, протокола об административном правонарушении, постановления по делу об административном правонарушении
  kaz: Қазақстан Республикасы астық туралы заңнамасы талаптарының бұзылуын жою туралы нұсқаманың, әкімшілік құқық бұзушылық туралы хаттаманың, әкімшілік құқық бұзушылық туралы іс жөніндегі қаулының нысандарын бекіту туралы
