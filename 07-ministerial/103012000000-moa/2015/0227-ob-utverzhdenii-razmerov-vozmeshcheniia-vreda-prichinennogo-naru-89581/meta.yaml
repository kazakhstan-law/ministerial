    kaz: «Қазақстан Республикасының жануарлар дүниесін қорғау, өсімін молайту және пайдалану саласындағы заңнамасын бұзумен келтірілген зиянның орнын толтыру мөлшерін бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің міндетін атқарушы 2015 жылғы 27 ақпандағы № 18-03/158 бұйрығына өзгеріс енгізу туралы
