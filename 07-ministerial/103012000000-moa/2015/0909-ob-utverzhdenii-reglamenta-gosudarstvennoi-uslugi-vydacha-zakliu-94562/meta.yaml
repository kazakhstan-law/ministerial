act_code: '94562'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 9 сентября 2015 года № 15-02/810. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 октября 2015 года № 12176. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 18 ноября 2020 года № 349 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача заключения (разрешительного документа) на ввоз образцов незарегистрированных средств защиты растений (пестицидов) для проведения регистрационных (мелкоделяночных и производственных) испытаний и (или) научных исследований в соответствии с решениями Коллегии Евразийской экономической комиссии»
  kaz: «Еуразиялық экономикалық комиссия алқасының шешіміне сәйкес тіркеу (ұсақмөлдекті және өндірістік) сынақтарын және (немесе) ғылыми зерттеулер жүргізу үшін өсімдіктерді қорғаудың тіркелмеген құралдарының (пестицидтердің) үлгілерін әкелуге арналған қорытынды (рұқсат құжаты) беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
