  title:
    rus: О внесении изменения в приказ Министра сельского хозяйства Республики Казахстан от 9 сентября 2015 года № 15-02/810 «Об утверждении регламента государственной услуги «Выдача заключения (разрешительного документа) на ввоз образцов незарегистрированных средств защиты растений (пестицидов) для проведения регистрационных (мелкоделяночных и производственных) испытаний и (или) научных исследований в соответствии с решениями Коллегии Евразийской экономической комиссии»
    kaz: «Еуразиялық экономикалық комиссия алқасының шешіміне сәйкес тіркеу (ұсақмөлдекті және өндірістік) сынақтарын және (немесе) ғылыми зерттеулер жүргізу үшін өсімдіктерді қорғаудың тіркелмеген құралдарының (пестицидтердің) үлгілерін әкелуге арналған қорытынды (рұқсат құжаты) беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 9 қыркүйектегі № 15-02/810 бұйрығына өзгеріс енгізу туралы
