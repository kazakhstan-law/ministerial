requisite: Приказ Министра сельского хозяйства Республики Казахстан от 25 сентября 2015 года № 15-05/858. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 октября 2015 года № 12210. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 4 ноября 2020 года № 337 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача экспортеру зерна подтверждения о соблюдении экспортером зерна обязательств по поставке зерна в государственные ресурсы зерна»
  kaz: «Астықты экспорттаушыға мемлекеттік астық ресурстарына астық жеткізу жөніндегі міндеттемелерді астық экспорттаушының сақтағаны туралы растама беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
