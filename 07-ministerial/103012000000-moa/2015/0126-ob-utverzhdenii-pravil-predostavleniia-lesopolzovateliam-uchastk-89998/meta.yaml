act_code: '89998'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 26 января 2015 года № 18-02/39. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 апреля 2015 года № 10751
title:
  rus: Об утверждении Правил предоставления лесопользователям участков под объекты строительства на землях государственного лесного фонда, где лесные ресурсы предоставлены в долгосрочное лесопользование для оздоровительных, рекреационных, историко-культурных, туристских и спортивных целей, нужд охотничьего хозяйства, побочного лесного пользования
  kaz: Орман ресурстары сауықтыру, рекреациялық, тарихи-мәдени, туристік және спорттық мақсаттар, аңшылық шаруашылығының мұқтаждықтары, жанама орман пайдалану үшін ұзақ мерзімді орман пайдалануға берілген мемлекеттік орман қоры жерлерінде орман пайдаланушыларға құрылыс объектілерін салуға учаскелер беру қағидаларын бекіту туралы
