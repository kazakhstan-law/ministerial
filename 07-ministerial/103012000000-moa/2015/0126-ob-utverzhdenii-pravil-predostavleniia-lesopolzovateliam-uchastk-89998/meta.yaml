  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 26 января 2015 года № 18-02/39 "Об утверждении Правил предоставления лесопользователям участков под объекты строительства на землях государственного лесного фонда, где лесные ресурсы предоставлены в долгосрочное лесопользование для оздоровительных, рекреационных, историко-культурных, туристских и спортивных целей; нужд охотничьего хозяйства; побочного лесного пользования и выдачи разрешения на использование этих участков под строительство таких объектов"
    kaz: '"Орман ресурстары сауықтыру, рекреациялық, тарихи-мәдени, туристік және спорттық мақсаттар; аңшылық шаруашылығының мұқтаждықтары; жанама орман пайдалану үшін ұзақ мерзімді орман пайдалануға берілген мемлекеттік орман қоры жерлерінде орман пайдаланушыларға құрылыс объектілерін салуға учаскелер беру және осы учаскелерді осындай объектілер салу үшін пайдалануға рұқсат беру қағидаларын бекіту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 26 қаңтардағы № 18-02/39 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/105967/rus
