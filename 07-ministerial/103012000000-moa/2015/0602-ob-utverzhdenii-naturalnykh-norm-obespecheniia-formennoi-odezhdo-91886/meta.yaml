  title:
    rus: О внесении изменений и дополнения в приказ Министра сельского хозяйства Республики Казахстан от 2 июня 2015 года № 15-2/509 «Об утверждении натуральных норм обеспечения форменной одеждой (без погон) должностных лиц, непосредственно осуществляющих государственный контроль и надзор в области карантина растений»
    kaz: «Өсімдіктер карантині саласында мемлекеттік бақылауды және қадағалауды тікелей жүзеге асыратын лауазымды адамдарды нысанды киіммен (погонсыз) қамтамасыз етудің заттай нормаларын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 2 маусымдағы № 15-2/509 бұйрығына өзгерістер мен толықтыру енгізу туралы
