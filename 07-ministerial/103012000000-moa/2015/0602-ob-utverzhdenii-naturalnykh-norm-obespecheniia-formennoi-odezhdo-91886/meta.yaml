requisite: Приказ Министра сельского хозяйства Республики Казахстан от 2 июня 2015 года № 15-2/509. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 июля 2015 года № 11638. Утратил силу приказом и.о. Министра сельского хозяйства Республики Казахстан от 11 апреля 2025 года № 107 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм обеспечения форменной одеждой (без погон), а также материальными средствами, техническими средствами для фото- и видеофиксации должностных лиц, осуществляющих государственный карантинный фитосанитарный контроль и надзор
  kaz: Мемлекеттік карантиндік фитосанитариялық бақылауды және қадағалауды жүзеге асыратын лауазымды адамдарды нысанды киіммен (погонсыз), сондай-ақ материалдық құралдармен, фото- және бейнетіркеуге арналған техникалық құралдармен қамтамасыз етудің заттай нормаларын бекіту туралы
