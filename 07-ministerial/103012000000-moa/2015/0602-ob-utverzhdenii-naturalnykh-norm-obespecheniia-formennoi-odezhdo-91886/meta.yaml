  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 2 июня 2015 года № 15-2/509 «Об утверждении натуральных норм обеспечения форменной одеждой (без погон), а также материальными средствами, техническими средствами для фото- и видеофиксации должностных лиц, осуществляющих государственный карантинный фитосанитарный контроль и надзор»
    kaz: «Мемлекеттік карантиндік фитосанитариялық бақылауды және қадағалауды жүзеге асыратын лауазымды адамдарды нысанды киіммен (погонсыз), сондай-ақ материалдық құралдармен, фото- және бейнетіркеуге арналған техникалық құралдармен қамтамасыз етудің заттай нормаларын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 2 маусымдағы № 15-2/509 бұйрығына өзгерістер енгізу туралы
