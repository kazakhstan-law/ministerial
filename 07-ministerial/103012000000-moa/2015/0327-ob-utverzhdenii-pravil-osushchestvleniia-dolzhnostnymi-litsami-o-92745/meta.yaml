act_code: '92745'
requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 27 марта 2015 года № 4-4/263. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 июля 2015 года № 11746. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 19 ноября 2020 года № 351 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил осуществления должностными лицами органов государственных доходов государственного карантинного фитосанитарного контроля в автомобильных пунктах пропуска через таможенную границу Таможенного союза, за исключением лабораторной экспертизы, а также взаимодействия уполномоченного органа по карантину растений и органов государственных доходов
  kaz: Зертханалық сараптаманы қоспағанда, мемлекеттік кірістер органдары лауазымды адамдарының Кеден одағының кедендік шекарасы арқылы автомобиль өткізу пункттерінде мемлекеттік карантиндік фитосанитариялық бақылауды жүзеге асыру, сондай-ақ өсімдіктер карантині жөніндегі уәкілетті орган мен мемлекеттік кірістер органдарының өзара іс-қимыл жасау қағидаларын бекіту туралы
