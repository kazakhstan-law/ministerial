  kaz: Биоотын өндірушілердің биоотын өндірісінің мониторингін жүзеге асыру үшін қажетті есептер ұсыну нысандары мен оларды облыстың, республикалық маңызы бар қаланың және астананың жергілікті атқарушы органына ұсыну қағидаларын бекіту туралы
