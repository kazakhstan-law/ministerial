  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 9 июля 2015 года № 4-4/631 «Об утверждении форм и Правил представления производителями биотоплива отчетов в уполномоченный орган в области производства биотоплива, необходимых для осуществления мониторинга производства биотоплива»
    kaz: «Биоотын өндірушілердің биоотын өндірісінің мониторингін жүзеге асыру үшін қажетті есептер ұсыну нысандары мен оларды биоотын өндірісі саласындағы уәкілетті органға ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 9 шілдедегі № 4-4/631 бұйрығына өзгерістер енгізу туралы
