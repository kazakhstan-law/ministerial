title:
  rus: Об утверждении перечня карантинных объектов и чужеродных видов, по отношению к которым устанавливаются и осуществляются мероприятия по карантину растений, и перечня особо опасных вредных организмов
  kaz: Өздеріне қатысты өсімдіктер карантині жөніндегі іс-шаралар белгіленетін және жүзеге асырылатын карантинді объектілер мен бөтен текті түрлердің тізбесін және аса қауiптi зиянды организмдер тiзбесiн бекiту туралы
