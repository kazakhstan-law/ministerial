  title:
    rus: О внесении изменения в приказ Министра сельского хозяйства Республики Казахстан от 8 декабря 2015 года № 11-3/1070 «Об утверждении натуральных норм специальных транспортных средств Министерства сельского хозяйства Республики Казахстан»
    kaz: «Қазақстан Республикасы Ауыл шаруашылығы министрлігінің арнайы көлік құралдарының заттай нормаларын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 8 желтоқсандағы № 11-3/1070 бұйрығына өзгеріс енгізу туралы
