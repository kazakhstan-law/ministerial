    kaz: «Қазақстан Республикасы Ауыл шаруашылығы министрлігінің арнайы көлік құралдарының заттай нормаларын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 8 желтоқсандағы № 11-3/1070 бұйрығына өзгерістер енгізу туралы
