requisite: Приказ Министра сельского хозяйства Республики Казахстан от 28 октября 2015 года № 4-2/956. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 ноября 2015 года № 12331. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 29 апреля 2025 года № 135 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: '"Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) государственным учреждением в сфере сортоиспытания и расходования им денег от реализации товаров (работ, услуг)"'
  kaz: '"Сұрыптық сынау саласындағы мемлекеттік мекеменің тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізу бойынша ақылы қызмет түрлерін көрсетуі және оның тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсауы қағидаларын бекіту туралы"'
