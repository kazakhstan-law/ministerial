  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 28 октября 2015 года № 4-2/956 «Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) государственными учреждениями в сфере сортоиспытания и расходования ими денег от реализации товаров (работ, услуг)»
    kaz: «Сұрыптарды сынақтан өткізу саласындағы мемлекеттік мекемелердің тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізу бойынша ақылы қызмет түрлерін көрсету және олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсау қағидаларын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 28 қазандағы № 4-2/956 бұйрығына өзгерістер енгізу туралы
