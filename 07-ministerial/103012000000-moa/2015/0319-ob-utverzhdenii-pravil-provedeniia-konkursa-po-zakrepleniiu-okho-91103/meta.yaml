  title:
    rus: О внесении изменений и дополнения в приказ Министра сельского хозяйства Республики Казахстан от 19 марта 2015 года № 18-04/245 «Об утверждении Правил проведения конкурса по закреплению охотничьих угодий и рыбохозяйственных водоемов и (или) участков и квалификационных требований, предъявляемых к участникам конкурса»
    kaz: «Аңшылық алқаптар мен балық шаруашылығы су айдындарын және (немесе) учаскелерін бекітіп беру жөнінде конкурс өткізу қағидаларын және конкурсқа қатысушыларға қойылатын біліктілік талаптарын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 19 наурыздағы № 18-04/245 бұйрығына өзгерістер және толықтыру енгізу туралы
