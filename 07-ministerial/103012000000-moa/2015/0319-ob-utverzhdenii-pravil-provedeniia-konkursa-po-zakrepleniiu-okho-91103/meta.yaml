  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 19 марта 2015 года № 18-04/245 «Об утверждении Правил проведения конкурса по закреплению охотничьих угодий и рыбохозяйственных водоемов и (или) участков и квалификационных требований, предъявляемых к участникам конкурса»
    kaz: «Аңшылық алқаптар мен балық шаруашылығы су айдындарын және (немесе) учаскелерiн бекiтiп беру жөнiнде конкурс өткiзу қағидаларын және конкурсқа қатысушыларға қойылатын бiлiктiлiк талаптарын бекiту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2019 жылғы 19 наурыздағы № 18-04/245 бұйрығына өзгерістер енгізу туралы
