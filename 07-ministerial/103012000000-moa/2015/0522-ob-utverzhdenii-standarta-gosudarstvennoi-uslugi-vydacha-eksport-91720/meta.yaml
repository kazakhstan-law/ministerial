title:
  rus: Об утверждении стандарта государственной услуги "Выдача экспортеру зерна подтверждения о соблюдении экспортером зерна обязательств по поставке зерна в государственные ресурсы зерна"
  kaz: '"Астықты экспорттаушыға мемлекеттік астық ресурстарына астық жеткізу жөніндегі міндеттемелерді астық экспорттаушының сақтағаны туралы растама беру" мемлекеттік көрсетілетін қызмет стандартын бекіту туралы'
