requisite: Приказ Министра сельского хозяйства Республики Казахстан от 31 марта 2015 года № 18-03/288. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 июля 2015 года № 11631. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 12 мая 2016 года № 215
title:
  rus: Об утверждении Правил регистрации в административном органе физических и юридических лиц, осуществляющих искусственное разведение животных, виды которых включены в приложения I и II Конвенции о международной торговле видами дикой фауны и флоры, находящимися под угрозой исчезновения
  kaz: Құрып кету қаупі төнген жабайы фауна мен флора түрлерімен халықаралық сауда туралы конвенцияның І және ІІ қосымшаларына түрлері енгізілген жануарларды қолдан өсіруді жүзеге асыратын жеке және заңды тұлғаларды әкімшілік органда тіркеу қағидаларын бекіту туралы
