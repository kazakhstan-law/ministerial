act_code: '98338'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 25 декабря 2015 года № 1-1/1133. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12792. Утратил силу приказом Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 27 февраля 2018 года № 92 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня видов деятельности сельскохозяйственных кооперативов по выполнению (оказанию) работ (услуг) для своих членов, а также перечня товаров, которые сельскохозяйственный кооператив реализует своим членам
  kaz: Өз мүшелері үшін жұмыстарды (қызметтерді) орындау (көрсету) бойынша ауыл шаруашылығы кооперативтерінің қызметі түрлерінің тізбесін, сондай-ақ ауыл шаруашылығы кооперативі өз мүшелеріне өткізетін тауарлардың тізбесін бекіту туралы
