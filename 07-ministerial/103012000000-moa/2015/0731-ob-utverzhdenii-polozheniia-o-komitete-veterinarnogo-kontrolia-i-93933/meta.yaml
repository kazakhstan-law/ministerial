  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра сельского хозяйства Республики Казахстан от 31 июля 2015 года № 16-05/715 «Об утверждении Положения о Комитете ветеринарного контроля и надзора Министерства сельского хозяйства Республики Казахстан»
    kaz: «Қазақстан Республикасы Ауыл шаруашылығы министрлігінің Ветеринариялық бақылау және қадағалау комитеті туралы ережені бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің міндетін атқарушының 2015 жылғы 31 шілдедегі № 16-05/715 бұйрығына өзгерістер мен толықтырулар енгізу туралы
