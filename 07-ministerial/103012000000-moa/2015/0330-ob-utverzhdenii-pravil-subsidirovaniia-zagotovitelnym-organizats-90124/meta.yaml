  title:
    rus: О внесении изменений и дополнений в приказ Министра сельского хозяйства Республики Казахстан от 30 марта 2015 года № 9-3/271 "Об утверждении Правил субсидирования заготовительным организациям в сфере агропромышленного комплекса суммы налога на добавленную стоимость, уплаченного в бюджет, в пределах исчисленного налога на добавленную стоимость"
    kaz: '"Агроөнеркәсіптік кешен саласындағы дайындаушы ұйымдарға есептелген қосылған құн салығы шегінде бюджетке төленген қосылған құн салығы сомасын субсидиялау қағидаларын бекіту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 30 наурыздағы № 9-3/271 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
