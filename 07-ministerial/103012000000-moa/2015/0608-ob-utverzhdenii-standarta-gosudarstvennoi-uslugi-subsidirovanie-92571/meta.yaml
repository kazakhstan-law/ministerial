title:
  rus: Об утверждении стандарта государственной услуги «Субсидирование стоимости гербицидов, биоагентов (энтомофагов) и биопрепаратов, предназначенных для обработки сельскохозяйственных культур в целях защиты растений»
  kaz: «Өсiмдiктердi қорғау мақсатында ауыл шаруашылығы дақылдарын өңдеуге арналған гербицидтердiң, биоагенттердiң (энтомофагтардың) және биопрепараттардың құнын субсидиялау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
