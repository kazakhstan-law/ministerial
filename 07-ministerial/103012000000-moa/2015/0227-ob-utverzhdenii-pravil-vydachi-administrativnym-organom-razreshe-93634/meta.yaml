act_code: '93634'
requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 27 февраля 2015 года № 18-03/143. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 августа 2015 года № 11935
title:
  rus: Об утверждении Правил выдачи административным органом разрешений на ввоз на территорию Республики Казахстан и вывоз с территории Республики Казахстан видов животных, подпадающих под действие Конвенции о международной торговле видами дикой фауны и флоры, находящимися под угрозой исчезновения
  kaz: Құрып кету қаупi төнген жабайы фауна мен флора түрлерімен халықаралық сауда туралы конвенцияның күші қолданылатын жануарлар түрлерiн Қазақстан Республикасының аумағына импорттауға, Қазақстан Республикасының аумағынан экспорттауға және (немесе) кері экспорттауға әкiмшiлiк органның рұқсаттар беру қағидаларын бекiту туралы
