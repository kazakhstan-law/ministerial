  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра сельского хозяйства Республики Казахстан от 27 февраля 2015 года № 18-03/143 «Об утверждении Правил выдачи административным органом разрешений на ввоз на территорию Республики Казахстан и вывоз с территории Республики Казахстан видов животных, подпадающих под действие Конвенции о международной торговле видами дикой фауны и флоры, находящимися под угрозой исчезновения»
    kaz: «Құрып кету қаупі төнген жабайы фауна мен флора түрлерімен халықаралық сауда туралы конвенцияның күші қолданылатын жануарлар түрлерін Қазақстан Республикасының аумағына әкелуге және Қазақстан Республикасының аумағынан әкетуге әкімшілік органның рұқсаттар беру қағидаларын бекіту туралы» 2015 жылғы 27 ақпандағы Қазақстан Республикасы Ауыл шаруашылығы министрінің міндетін атқарушысының № 18-03/143 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/142929/rus
