caused_by:
  code: '114480'
  requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 9 июня 2017 года № 236. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 августа 2017 года № 15552. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 18 ноября 2020 года № 349 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 15 июля 2015 года № 15-02/654 «Об утверждении стандарта государственной услуги «Выдача заключения уполномоченного органа государств-членов Таможенного союза о целесообразности ввоза незарегистрированных средств защиты растений для проведения регистрационных и производственных испытаний, а также ограниченного количества незарегистрированных средств защиты растений для ликвидации очагов вновь выявленного карантинного вредного организма без лицензирования»
    kaz: «Тіркеу және өндірістік сынақтар өткізуге арналған өсімдіктерді қорғаудың тіркелмеген құралдарын, сондай-ақ лицензиялаусыз қайта анықталған карантиндік зиянды ағзаның ошақтарын жоюға арналған өсімдіктерді қорғаудың тіркелмеген құралдарының шектелген санын әкелудің орындылығы туралы Кеден одағына мүше мемлекеттердің уәкілетті органының қорытындысын беру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 15 шілдедегі № 15-02/654 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/114480/rus
