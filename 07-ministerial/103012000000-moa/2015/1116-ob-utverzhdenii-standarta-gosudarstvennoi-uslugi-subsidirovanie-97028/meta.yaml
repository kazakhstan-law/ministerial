act_code: '97028'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 16 ноября 2015 года № 9-3/1000. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 декабря 2015 года № 12437. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 5 ноября 2020 года № 340 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги "Субсидирование заготовительным организациям в сфере агропромышленного комплекса суммы налога на добавленную стоимость, уплаченного в бюджет, в пределах исчисленного налога на добавленную стоимость"
  kaz: '"Агроөнеркәсіптік кешен саласындағы дайындаушы ұйымдарға есептелген қосылған құн салығы шегінде бюджетке төленген қосылған құн салығы сомасын субсидиялау" мемлекеттік көрсетілетін қызмет стандартын бекіту туралы'
