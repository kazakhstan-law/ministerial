  title:
    rus: О внесении изменения в приказ Министра сельского хозяйства Республики Казахстан от 16 ноября 2015 года № 9-3/1000 «Об утверждении стандарта государственной услуги «Субсидирование заготовительным организациям в сфере агропромышленного комплекса суммы налога на добавленную стоимость, уплаченного в бюджет, в пределах исчисленного налога на добавленную стоимость»
    kaz: «Агроөнеркәсіптік кешен саласындағы дайындаушы ұйымдарға есептелген қосылған құн салығы шегінде бюджетке төленген қосылған құн салығы сомасын субсидиялау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 16 қарашадағы № 9-3/1000 бұйрығына өзгеріс енгізу туралы
