    kaz: Қазақстан Республикасының ауыл шаруашылық Министрінің «Агроөнеркәсіптік кешен субъектілерінің қарыздарын кепілдендіру мен сақтандыру шеңберінде субсидиялау қағидаларын бекіту туралы» 2015 жылдың 30 қаңтарындағы № 9-1/71 бұйрығына өзгерістер енгізу туралы
