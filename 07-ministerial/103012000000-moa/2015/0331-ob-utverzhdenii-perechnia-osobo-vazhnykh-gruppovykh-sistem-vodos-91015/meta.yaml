    rus: О внесении изменения и дополнений в приказ Министра сельского хозяйства Республики Казахстан от 31 марта 2015 года № 19-3/297 «Об утверждении Перечня особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками водоснабжения»
    kaz: «Сумен жабдықтаудың баламасыз көздері болып табылатын ерекше маңызды топтық және оқшау сумен жабдықтау жүйелерінің тізбесін бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 31 наурыздағы № 19-3/297 бұйрығына өзгеріс пен толықтырулар енгізу туралы
