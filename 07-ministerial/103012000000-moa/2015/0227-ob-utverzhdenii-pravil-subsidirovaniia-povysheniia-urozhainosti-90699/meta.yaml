  code: '94054'
  requisite: Приказ Министра сельского хозяйства Республики Казахстан от 22 июня 2015 года № 4-3/553. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 сентября 2015 года № 12031. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 25 мая 2020 года № 181 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра сельского хозяйства Республики Казахстан от 27 февраля 2015 года № 4-3/177 «Об утверждении Правил субсидирования повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур и стоимости затрат на возделывание сельскохозяйственных культур в защищенном грунте»
    kaz: «Басым дақылдар өндiрудi субсидиялау арқылы өсiмдiк шаруашылығының шығымдылығын және өнім сапасын арттыруды, жанар-жағармай материалдарының және көктемгi егіс пен егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнын және ауыл шаруашылығы дақылдарын қорғалған топырақта өңдеп өсіру шығындарының құнын субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің міндетін атқарушының 2015 жылғы 27 ақпандағы № 4-3/177 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/94054/rus
