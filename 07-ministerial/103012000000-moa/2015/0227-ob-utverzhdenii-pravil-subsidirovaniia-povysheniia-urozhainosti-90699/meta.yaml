  requisite: Приказ Министра сельского хозяйства Республики Казахстан от 15 ноября 2019 года № 395. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 ноября 2019 года № 19606. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 25 мая 2020 года № 181 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра сельского хозяйства Республики Казахстан от 27 февраля 2015 года № 4-3/177 «Об утверждении Правил субсидирования повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур»
    kaz: «Басым дақылдар өндiрудi субсидиялау арқылы өсiмдiк шаруашылығының шығымдылығын және өнім сапасын арттыруды, жанар-жағармай материалдарының және көктемгi егіс пен егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнын субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің міндетін атқарушының 2015 жылғы 27 ақпандағы № 4-3/177 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/136060/rus
