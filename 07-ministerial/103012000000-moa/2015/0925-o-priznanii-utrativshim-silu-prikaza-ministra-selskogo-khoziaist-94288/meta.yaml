act_code: '94288'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 25 сентября 2015 года № 18-3/852
title:
  rus: О признании утратившим силу приказа Министра сельского хозяйства Республики Казахстан от 8 апреля 2015 года № 18-04/323 "О введении ограничении и запретов на пользование объектами животного мира, их частей и дериватов, установлении мест и сроков их пользования"
  kaz: '"Жануарлар дүниесі oбъeктілерін, олардың бөліктері мен дериваттарын пайдалануға шектеу мен тыйым салуды енгізу, оларды пайдалану орындары мен мерзімдерін белгілеу туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 8 сәуірдегі № 18-04/323 бұйрығының күшін жою туралы'
