act_code: '91113'
requisite: Приказ от 27.03.2015 № 5-3/261, Министерство сельского хозяйства Республики Казахстан. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 июня 2015 года № 11329. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 31 марта 2016 года № 146
title:
  rus: Об утверждении предельного размера цены (стоимости) при закупе заготовительной организацией сельскохозяйственной продукции от личного подсобного хозяйства, крестьянского или фермерского хозяйства, юридического лица, осуществляющего производство сельскохозяйственной продукции и ее реализацию
  kaz: Дайындаушы ұйым жеке қосалқы шаруашылықтан, шаруа немесе фермер қожалығынан, ауыл шаруашылығы өнімін өндіруді және өткізуді жүзеге асыратын заңды тұлғадан ауыл шаруашылығы өнімін сатып алған кезде бағаның (құнның) шекті мөлшерін бекіту туралы
