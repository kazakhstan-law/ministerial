requisite: Приказ Министра сельского хозяйства Республики Казахстан от 16 ноября 2015 года № 9-3/999. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 декабря 2015 года № 12520. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 9 октября 2020 года № 311 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги "Субсидирование по возмещению части расходов, понесенных субъектом агропромышленного комплекса при инвестиционных вложениях"
  kaz: '"Агроөнеркәсіптік кешен субъектісі инвестициялық салынымдар кезінде жұмсаған шығыстардың бір бөлігінің орнын толтыру бойынша субсидиялау" мемлекеттік көрсетілетін қызмет стандартын бекіту туралы'
