  title:
    rus: О внесении изменения в приказ Министра сельского хозяйства Республики Казахстан от 16 ноября 2015 года № 9-3/999 «Об утверждении стандарта государственной услуги «Субсидирование по возмещению части расходов, понесенных субъектом агропромышленного комплекса при инвестиционных вложениях»
    kaz: «Агроөнеркәсіптік кешен субъектісі инвестициялық салынымдар кезінде жұмсаған шығыстардың бір бөлігінің орнын толтыру бойынша субсидиялау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 16 қарашадағы № 9-3/999 бұйрығына өзгеріс енгізу туралы
