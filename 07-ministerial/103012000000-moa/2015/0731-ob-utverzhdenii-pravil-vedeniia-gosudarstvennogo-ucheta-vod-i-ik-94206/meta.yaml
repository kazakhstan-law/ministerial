requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 31 июля 2015 года № 19-1/718. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 сентября 2015 года № 12109. Утратил силу приказом Министра водных ресурсов и ирригации РК от 09.06.2025 № 115-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).
title:
