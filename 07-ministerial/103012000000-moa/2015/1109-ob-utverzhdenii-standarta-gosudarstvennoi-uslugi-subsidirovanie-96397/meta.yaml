requisite: Приказ Министра сельского хозяйства Республики Казахстан от 9 ноября 2015 года № 9-1/986. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 декабря 2015 года № 12431. Утратил силу приказом Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 1 июля 2017 года № 279 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги "Субсидирование процентной ставки по кредитным и лизинговым обязательствам в рамках направления по финансовому оздоровлению субъектов агропромышленного комплекса"
  kaz: '"Агроөнеркәсіптік кешен субъектілерін қаржылық сауықтыру жөніндегі бағыт шеңберінде кредиттік және лизингтік міндеттемелер бойынша пайыздық мөлшерлемені субсидиялау" мемлекеттік көрсетілетін қызмет стандартын бекіту туралы'
