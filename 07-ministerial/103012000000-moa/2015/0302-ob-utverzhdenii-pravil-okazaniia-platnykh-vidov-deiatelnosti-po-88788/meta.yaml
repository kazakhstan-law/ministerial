title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации услуг государственным учреждением в сфере агрохимического обслуживания сельскохозяйственного производства и расходования им денег от реализации услуг
  kaz: Ауыл шаруашылығы өндірісіне агрохимиялық қызмет көрсету саласындағы мемлекеттік мекеменiң көрсетiлетін қызметтердi өткiзу бойынша ақылы қызмет түрлерiн көрсету және оның көрсетiлетiн қызметтердi өткiзуден түскен ақшаны жұмсау  қағидаларын бекiту туралы
