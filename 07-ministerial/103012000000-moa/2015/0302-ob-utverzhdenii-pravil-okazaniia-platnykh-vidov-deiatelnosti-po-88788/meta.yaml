  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 2 марта 2015 года № 4-6/181 «Об утверждении Правил оказания платных видов деятельности по реализации услуг государственным учреждением в сфере агрохимического обслуживания сельскохозяйственного производства и расходования им денег от реализации услуг»
    kaz: «Ауыл шаруашылығы өндірісіне агрохимиялық қызмет көрсету саласындағы мемлекеттiк мекеменiң көрсетiлетін қызметтердi өткiзу бойынша ақылы қызмет түрлерiн көрсету және оның көрсетiлетiн қызметтердi өткiзуден түскен ақшаны жұмсау қағидаларын бекiту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 2 наурыздағы № 4-6/181 бұйрығына өзгерістер енгізу туралы
