act_code: '87950'
requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 25 февраля 2015 года № 18-04/128. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 марта 2015 года № 10546
title:
  rus: Об утверждении Перечня должностных лиц ведомства уполномоченного органа и его территориальных подразделений, осуществляющих государственный контроль и надзор в области охраны, воспроизводства и использования животного мира, а также работников государственных учреждений и организаций, осуществляющих непосредственную охрану животного мира, имеющих право на ношение форменной одежды со знаками различия (без погон)
  kaz: Жануарлар дүниесін қорғау, өсімін молайту және пайдалану саласындағы мемлекеттік бақылау мен қадағалауды жүзеге асыратын уәкілетті органның ведомствосы мен оның аумақтық бөлімшелерінің лауазымды адамдарының, сондай-ақ мемлекеттік мекемелер мен ұйымдардың жануарлар дүниесін тікелей қорғауды жүзеге асыратын айырым белгілері бар (погондарсыз) нысанды киім киіп жүруге құқығы бар, жұмыскерлерінің тізбесін бекіту туралы
