act_code: '92591'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 30 марта 2015 года № 4-3/267. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 июля 2015 года № 11702
title:
  rus: Об утверждении Правил государственной регистрации тракторов и  изготовленных на их базе самоходных шасси и механизмов, прицепов к ним, включая прицепы со смонтированным специальным оборудованием, самоходных сельскохозяйственных, мелиоративных и дорожно-строительных машин и механизмов, специальных машин повышенной проходимости
  kaz: Тракторларды және олардың базасында жасалған өздiгiнен жүретiн шассилер мен механизмдердi, монтаждалған арнаулы жабдығы бар тіркемелердi қоса алғанда, олардың тiркемелерiн, өздiгiнен жүретiн ауылшаруашылық, мелиорациялық және жол-құрылыс машиналары мен механизмдерiн, жүріп өту мүмкіндігі жоғары арнайы машиналарды мемлекеттiк тiркеу қағидаларын бекіту туралы
