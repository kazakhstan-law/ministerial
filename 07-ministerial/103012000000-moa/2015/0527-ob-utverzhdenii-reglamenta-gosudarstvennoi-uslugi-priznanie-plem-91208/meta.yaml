act_code: '91208'
requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 27 мая 2015 года № 3-2/482. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 июня 2015 года № 11469. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 13 мая 2021 года № 159 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Регламента государственной услуги «Признание племенного свидетельства или эквивалентного ему документа, выданного на импортированную племенную продукцию (материал), компетентными органами стран-экспортеров, за исключением племенного свидетельства или эквивалентного ему документа, выданного компетентными органами стран-экспортеров на импортированную племенную продукцию (материал) крупного рогатого скота»
  kaz: «Экспорттаушы елдердің құзыретті органдары ірі қара малдың импортталған асыл тұқымдық өніміне (материалына) берген асыл тұқымдық куәлікті немесе оған балама құжатты қоспағанда, экспорттаушы елдердің құзыретті органдары импортталған асыл тұқымдық өнімге (материалға) берген асыл тұқымдық куәлікті немесе оған балама құжатты тану» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
