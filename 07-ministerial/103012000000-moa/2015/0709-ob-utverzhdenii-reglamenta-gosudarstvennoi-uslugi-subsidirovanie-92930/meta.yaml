act_code: '92930'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 9 июля 2015 года № 9-1/633. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 августа 2015 года № 11876. Утратил силу приказом Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 28 декабря 2017 года № 521 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Субсидирование ставок вознаграждения по кредитам, а также лизингу технологического оборудования и сельскохозяйственной техники»
  kaz: «Кредиттер бойынша, сондай-ақ технологиялық жабдық және ауыл шаруашылығы техникасының лизингі бойынша сыйақы мөлшерлемелерін субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
