act_code: '92724'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 30 марта 2015 года № 4-3/268. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 июля 2015 года № 11708
title:
  rus: Об утверждении Правил государственной регистрации залога тракторов и изготовленных на их базе самоходных шасси и механизмов, прицепов к ним, включая прицепы со смонтированным специальным оборудованием, самоходных сельскохозяйственных, мелиоративных и дорожно-строительных машин и механизмов, с специальных машин повышенной проходимости
  kaz: Тракторларды және олардың базасында жасалған өздiгiнен жүретiн шассилер мен механизмдердi, монтаждалған арнаулы жабдығы бар тiркемелердi қоса алғанда, олардың тiркемелерiн, өздiгiнен жүретiн ауылшаруашылық, мелиорациялық және жол-құрылысы машиналары мен механизмдерiн, жүрiп өту мүмкiндiгi жоғары арнайы машиналардың кепiлге қоюды мемлекеттiк тiркеу қағидаларын бекіту туралы
