  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 30 марта 2015 года № 4-3/268 «Об утверждении Правил государственной регистрации залога тракторов и изготовленных на их базе самоходных шасси и механизмов, прицепов к ним, включая прицепы со смонтированным специальным оборудованием, самоходных сельскохозяйственных, мелиоративных и дорожно-строительных машин и механизмов, специальных машин повышенной проходимости»
    kaz: «Тракторларды және олардың базасында жасалған өздiгiнен жүретін шассилер мен механизмдерді, монтаждалған арнаулы жабдығы бар тiркемелердi қоса алғанда, олардың тiркемелерiн, өздiгiнен жүретін ауылшаруашылық, мелиорациялық және жол-құрылыс машиналары мен механизмдерін, жүріп өту мүмкiндiгi жоғары арнайы машиналарды кепілге қоюды мемлекеттік тіркеу қағидаларын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 30 наурыздағы № 4-3/268 бұйрығына өзгерістер енгізу туралы
