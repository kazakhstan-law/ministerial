  title:
    rus: О внесении изменений и дополнений в приказ Министра сельского хозяйства Республики Казахстан от 30 марта 2015 года № 4-3/270 «Об утверждении Правил приема экзаменов и выдачи удостоверений на право управления тракторами и изготовленными на их базе самоходными шасси и механизмами, самоходными сельскохозяйственными, мелиоративными и дорожно-строительными машинами, а также специальными машинами повышенной проходимости»
    kaz: «Тракторларды және олардың базасында жасалған өздiгiнен жүретiн шассилер мен механизмдердi, өздiгiнен жүретiн ауылшаруашылық,  мелиорациялық және жол-құрылыс машиналарын, сондай-ақ жүрiп өту мүмкiндiгi жоғары арнайы машиналарды басқару құқығына емтихандар қабылдау және куәлiктер беру қағидаларын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 30 наурыздағы № 4-3/270 бұйрығына өзгерістер мен толықтырулар енгізу туралы
