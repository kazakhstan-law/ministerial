requisite: Приказ Министра сельского хозяйства Республики Казахстан от 7 июля 2015 года № 4-5/613. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 сентября 2015 года № 12044. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 16 февраля 2021 года № 44 (вводится в действие с 1 января 2022 года)
title:
  rus: Об утверждении перечня и форм документов учета, сроков представления отчетности по вопросам соблюдения требований, предъявляемых к деятельности по оказанию услуг по складской деятельности с выдачей хлопковых расписок, ведению мониторинга хлопкового рынка
  kaz: Есепке алу құжаттарының тізбесі мен  нысандарын, мақта қолхаттарын беру арқылы қойма қызметі бойынша қызметтер көрсету, мақта нарығының мониторингін жүргізу жөніндегі қызметке қойылатын талаптарды сақтау мәселелері бойынша есептілікті ұсыну мерзімдерін бекiту туралы
