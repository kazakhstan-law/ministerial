  kaz: Астық қолхаттарын беру, олардың айналымы және өтелуі қағидаларын, астық қолхаттарының үлгілеріне және астық қолхаты жазылатын бланкілерге қойылатын талаптарды, Астық қолхаттары бланкілерін шығару, сатып алу, сақтау және жою қағидаларын бекіту туралы
