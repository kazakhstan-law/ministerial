requisite: Приказ Министра сельского хозяйства Республики Казахстан от 9 июля 2015 года № 4-1/620. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 сентября 2015 года № 12092. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 8 июня 2016 года № 253 (вступает в силу с 1 января 2020 года)
