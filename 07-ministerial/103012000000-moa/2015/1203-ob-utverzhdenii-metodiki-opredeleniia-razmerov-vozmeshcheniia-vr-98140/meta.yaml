    kaz: «Қазақстан Республикасының жануарлар дүниесін қорғау, өсімін молайту және пайдалану саласындағы заңнамасын бұзудан келтірілген зиянның орнын толтыру мөлшерін айқындау әдістемесін бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2015 жылғы 3 желтоқсандағы № 18-03/1058 бұйрығына өзгерістер енгізу туралы
