title:
  rus: Об утверждении Методики определения размеров возмещения вреда, причиненного нарушением законодательства Республики Казахстан в области охраны, воспроизводства и использования животного мира
  kaz: Қазақстан Республикасының жануарлар дүниесін қорғау, өсімін молайту және пайдалану саласындағы заңнамасын бұзудан келтірілген зиянның орнын толтыру мөлшерін айқындау әдістемесін бекіту туралы
