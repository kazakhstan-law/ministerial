act_code: '88006'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 23 января 2015 года № 7-1/37. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 марта 2015 года № 10466
title:
  rus: Об утверждении Правил присвоения учетных номеров объектам производства, осуществляющим выращивание животных, заготовку (убой), хранение, переработку и реализацию животных, продукции и сырья животного происхождения, а также организациям по производству, хранению и реализации ветеринарных препаратов, кормов и кормовых добавок
  kaz: Жануарлар өсіруді, жануарларды, жануарлардан алынатын өнім мен шикізатты дайындауды (союды), сақтауды, қайта өңдеуді және өткізуді жүзеге асыратын өндіріс объектілеріне, сондай-ақ ветеринариялық препараттарды, жемшөп пен жемшөп қоспаларын өндіру, сақтау және өткізу жөніндегі ұйымдарға есептік нөмірлер беру қағидаларын бекіту туралы
