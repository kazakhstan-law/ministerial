requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 27 февраля 2015 года № 9-2/175. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 апреля 2015 года № 10683. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 20 октября 2020 года № 321 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил создания местным исполнительным органом района (города областного значения) и организации работы комиссии для определения размера площадей посевов, подвергшихся воздействию неблагоприятного природного явления, и формы акта обследования по факту неблагоприятного природного явления
  kaz: Ауданның (облыстық маңызы  бар қаланың) жергілікті атқарушы органның қолайсыз табиғат құбылысының әсеріне ұшыраған егістік алқаптарының көлемін айқындау үшін комиссия құру және оның жұмысын ұйымдастыру қағидаларын және қолайсыз табиғат құбылысы фактісі бойынша зерттеп-қарау актісінің нысанын бекіту туралы
