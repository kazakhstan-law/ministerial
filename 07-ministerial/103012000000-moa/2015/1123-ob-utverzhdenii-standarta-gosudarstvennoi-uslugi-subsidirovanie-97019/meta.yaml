    kaz: «Агроөнеркәсіптік кешен субъектілерінің қарыздарын кепілдендіру мен сақтандыру шеңберінде субсидиялау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің міндетін атқарушының 2015 жылғы 23 қарашадағы № 9-1/1018 бұйрығына өзгеріс енгізу туралы
