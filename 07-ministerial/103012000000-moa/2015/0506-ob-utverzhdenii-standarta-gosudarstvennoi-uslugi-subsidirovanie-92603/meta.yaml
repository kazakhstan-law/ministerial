act_code: '92603'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 6 мая 2015 года № 4-3/423. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 июля 2015 года № 11705. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 25 мая 2020 года № 181 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Субсидирование повышения урожайности и качества продукции растениеводства, стоимости горюче-смазочных материалов и других товарно-материальных ценностей, необходимых для проведения весенне-полевых и уборочных работ, путем субсидирования производства приоритетных культур»
  kaz: «Басым дақылдар өндiрудi субсидиялау арқылы өсiмдiк шаруашылығы өнiмiнiң шығымдылығы мен сапасын арттыруды, жанар-жағармай материалдарының және көктемгi егiс пен егiн жинау жұмыстарын жүргiзу үшін қажеттi басқа да тауарлық-материалдық құндылықтардың құнын субсидиялау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
