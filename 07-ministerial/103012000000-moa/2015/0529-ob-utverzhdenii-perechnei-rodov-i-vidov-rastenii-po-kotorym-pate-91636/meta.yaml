  title:
    rus: О внесении дополнений в приказ исполняющего обязанности Министра сельского хозяйства Республики Казахстан от 29 мая 2015 года № 4-2/490 «Об утверждении перечней родов и видов растений, по которым патентоспособность и хозяйственная полезность оцениваются по данным государственного испытания или заявителя»
