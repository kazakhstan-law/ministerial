  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра сельского хозяйства Республики Казахстан от 29 мая 2015 года № 4-2/490 «Об утверждении перечней родов и видов растений, по которым патентоспособность и хозяйственная полезность оцениваются по данным государственного испытания или заявителя»
    kaz: «Патент қабілеттілігі мен шаруашылықта пайдалылығы мемлекеттік сынақтың немесе өтініш берушінің деректері бойынша бағаланатын өсімдіктердің тектері мен түрлерінің тізбелерін бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің міндетін атқарушының 2015 жылғы 29 мамырдағы № 4-2/490 бұйрығына өзгерістер енгізу туралы
