title:
  rus: Об утверждении стандарта государственной услуги "Субсидирование стоимости затрат на закладку и выращивание (в том числе восстановление) многолетних насаждений плодово-ягодных культур и винограда"
  kaz: '"Жеміс-жидек дақылдарының және жүзімнің көпжылдық көшеттерін отырғызу және өсіру (оның ішінде қалпына келтіру) шығындарының құнын субсидиялау" мемлекеттік көрсетілетін қызмет стандартын бекіту туралы'
