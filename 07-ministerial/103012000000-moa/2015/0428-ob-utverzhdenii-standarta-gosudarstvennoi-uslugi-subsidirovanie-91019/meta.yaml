act_code: '91019'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 28 апреля 2015 года № 4-1/379. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июня 2015 года № 11278. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 25 мая 2020 года № 181 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги "Субсидирование стоимости затрат на закладку и выращивание (в том числе восстановление) многолетних насаждений плодово-ягодных культур и винограда"
  kaz: '"Жеміс-жидек дақылдарының және жүзімнің көпжылдық көшеттерін отырғызу және өсіру (оның ішінде қалпына келтіру) шығындарының құнын субсидиялау" мемлекеттік көрсетілетін қызмет стандартын бекіту туралы'
