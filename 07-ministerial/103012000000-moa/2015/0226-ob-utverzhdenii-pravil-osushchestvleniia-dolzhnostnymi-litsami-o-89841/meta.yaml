act_code: '89841'
requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 26 февраля 2015 года № 7-1/142. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 апреля 2015 года № 10897. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 26 декабря 2019 года № 464 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил осуществления должностными лицами органов государственных доходов государственного ветеринарно-санитарного контроля в автомобильных пунктах пропуска через таможенную границу Таможенного союза, за исключением лабораторного контроля, а также взаимодействия уполномоченного органа в области ветеринарии и органов государственных доходов
  kaz: Зертханалық бақылауды қоспағанда, мемлекеттік кірістер органдары лауазымды адамдарының Кеден одағының кедендік шекарасы арқылы автомобиль өткізу пункттерінде мемлекеттік ветеринариялық-санитариялық бақылауды жүзеге асыру, сондай - ақ ветеринария саласындағы уәкілетті орган мен мемлекеттік кірістер органдарының өзара іс-қимыл жасау қағидаларын бекіту туралы
