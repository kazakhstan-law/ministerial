act_code: '173801'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 9 ноября 2022 года № 370. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 ноября 2022 года № 30565
title:
  rus: Об утверждении Типовой системы оплаты труда специалистов и вспомогательного персонала государственных предприятий на праве хозяйственного ведения, осуществляющих обращение (выполняющих вспомогательную функцию при осуществлении обращения) с патогенными биологическими агентами I и II групп патогенности
  kaz: Шаруашылық жүргізу құқығындағы мемлекеттік кәсіпорындардың патогендігі I және II топтардағы патогенді биологиялық агенттермен жұмыс істеуді жүзеге асыратын (жұмыс істеуді жүзеге асыру кезінде қосалқы функцияны орындайтын) мамандары мен көмекші персоналының еңбегіне ақы төлеудің үлгілік жүйесін бекіту туралы
