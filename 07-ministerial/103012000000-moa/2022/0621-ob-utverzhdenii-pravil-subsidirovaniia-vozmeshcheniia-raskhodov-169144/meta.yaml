  kaz: Ішкі нарыққа реттеушілік әсер ету үшін азық-түлік астығын өткізу кезінде агроөнеркәсіптік кешен саласындағы ұлттық компанияның шеккен шығыстарын өтеуді субсидиялау қағидаларын бекіту туралы
