  kaz: «Қазақстан Республикасының аумағынан жекелеген тауарларды әкетудің кейбір мәселелері туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің міндетін атқарушының 2022 жылғы 5 шілдедегі № 215 бұйрығының қолданылуын тоқтата тұру туралы
