requisite: Приказ Министра сельского хозяйства Республики Казахстан от 31 октября 2022 года № 351. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 ноября 2022 года № 30424
title:
  rus: Об утверждении Методики и условных знаков по дешифрированию аэрофотоснимков для составления цифровых сельскохозяйственных карт в масштабах 1:10 000, 1:25 000 и 1:50 000 для целей землеустройства, государственного учета земель и земельного кадастра
  kaz: Жерге орналастыру, жерді мемлекеттік есепке алу және жер кадастры мақсаттары үшін масштабтары 1:10 000, 1:25 000 және 1:50 000 цифрлық ауыл шаруашылығы карталарын жасауға арналған аэрофотосуреттердің шифрларын ашу жөніндегі әдістеме және шартты белгілерді бекіту туралы
