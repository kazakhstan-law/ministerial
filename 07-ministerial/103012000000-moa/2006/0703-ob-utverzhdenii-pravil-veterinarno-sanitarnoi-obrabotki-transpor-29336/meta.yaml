requisite: Приказ Министра сельского хозяйства Республики Казахстан от 3 июля 2006 года № 432. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 августа 2006 года № 4339. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 13 февраля 2012 года № 10-1/52
title:
  rus: Об утверждении правил ветеринарно-санитарной обработки транспортных средств (автомобильный, железнодорожный, воздушный, водный) до и после перевозки в них животных и других подконтрольных государственному ветеринарному контролю грузов
  kaz: Жануарларды және басқа да мемлекеттік ветеринариялық бақылауға жататын жүктерді тасымалдағанға дейін және одан кейін көлік құралдарын (автомобиль, теміржол, әуе, су) ветеринариялық домдау туралы ережесін бекіту туралы
