  title:
    rus: О внесении дополнений и изменений в Приказ и.о. Министра Республики Казахстан от 10 ноября 2006 года № 680 "Об утверждении формы и сроков представления страхователем, страховщиком и агентом информации и документа, необходимых для осуществления уполномоченным органом в области растениеводства своих контрольных функций"
    kaz: '"Өсімдік шаруашылығы саласындағы уәкілетті органның өзінің бақылау функцияларын жүзеге асыруы үшін қажетті сақтанушы, сақтандырушы және агенттің беретін ақпараты мен құжатының нысандары және мерзімдерін бекіту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрі м.а. 2006 жылғы 10 қарашадағы № 680 бұйрығына толықтырулар мен өзгерістер енгізу туралы'
