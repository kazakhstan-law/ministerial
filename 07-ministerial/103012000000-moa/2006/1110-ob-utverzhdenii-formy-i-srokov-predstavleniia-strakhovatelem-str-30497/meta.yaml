  title:
    rus: О внесении изменений и дополнений в приказ и.о. Министра сельского хозяйства Республики Казахстан от 10 ноября 2006 года N 680 "Об утверждении формы и сроков представления страхователем, страховщиком и агентом информации и документа, необходимых для осуществления уполномоченным органом в области растениеводства своих контрольных функций"
    kaz: Қазақстан Республикасы Ауыл шаруашылығы Министрі міндетін атқарушының 2006 жылғы 10 қарашадағы N 680 бұйрығына өзгерістер мен толықтырулар енгізу туралы "Уәкілетті органмен өзінің өсімдік шаруашылығы саласындағы бақылау функцияларын жүзеге асыруға қажетті сақтанушы, сақтандырушы және агентпен берілетін ақпараттар және құжаттың нысаны мен мерзімін бекіту туралы"
