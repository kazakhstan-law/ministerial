  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 26 марта 2009 года № 168 "Об утверждении форм описания сорта с заключением на выдачу патента, заключения о выдаче патента на селекционное достижение в растениеводстве, заключения об отказе в выдаче патента на селекционное достижение в растениеводстве и заключения по результатам проверки наименования селекционного достижения"
    kaz: '"Патент беруге қорытынды жасаумен сортты сипаттаудың, өсімдік шаруашылығындағы селекциялық жетістікке патент беру туралы қорытынды, өсімдік шаруашылығындағы селекциялық жетістікке патент беруден бас тарту туралы қорытынды және селекциялық жетістіктің атауын тексеру нәтижесі бойынша қорытынды туралы қорытындының нысандарын бекіту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің 2009 жылғы 26 наурыздағы № 168 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/51645/rus
