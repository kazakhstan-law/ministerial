act_code: '45581'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 26 марта 2009 года № 168. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 апреля 2009 года № 5646. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 22 января 2016 года № 19
title:
  rus: Об утверждении форм описания сорта с заключением на выдачу патента, заключения о патентоспособности сорта (о выдаче патента на селекционное достижение в растениеводстве), заключения об отказе в выдаче патента на селекционное достижение в растениеводстве и заключения по результатам проверки наименования селекционного достижения
  kaz: Патент беруге қорытынды жасаумен сортты сипаттаудың, сорттың патент қабілеттілігі туралы қорытынды (өсiмдiк шаруашылығындағы селекциялық жетiстiкке патент беру туралы), өсімдік шаруашылығындағы селекциялық жетістікке патент беруден бас тарту туралы қорытынды және селекциялық жетістіктің атауын тексеру нәтижесі бойынша қорытынды туралы қорытындының нысандарын бекіту туралы
