    kaz: '"Патент беруге қорытынды жасаумен сортты сипаттаудың және сорттың патент қабілеттілігі туралы қорытындының нысандарын бекіту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің 2009 жылғы 26 наурыздағы № 168 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
