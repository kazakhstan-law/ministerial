act_code: '47599'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 30 июля 2009 года № 435. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 августа 2009 года № 5768. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 17 января 2012 года № 10-1/18
title:
  rus: Об утверждении Правил выдачи разрешений на ввоз в Республику Казахстан и вывоз за ее пределы объектов животного мира, их частей и производных, в том числе видов животных, отнесенных к категории редких и находящихся под угрозой исчезновения
  kaz: Жануарлар дүниесі объектілерін, олардың бөліктері мен олардан жасалған өнімдерді, оның ішінде жануарлардың сирек кездесетін және құрып кету қаупі төнген санаттарына жатқызылған түрлерін Қазақстан Республикасына әкелуге және одан тысқары жерлерге әкетуге рұқсаттар беру ережесін бекіту туралы
