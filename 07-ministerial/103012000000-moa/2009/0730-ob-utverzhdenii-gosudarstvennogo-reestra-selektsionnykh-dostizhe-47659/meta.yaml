act_code: '47659'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 30 июля 2009 года № 434. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 августа 2009 года № 5759. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 13 июля 2026 года № 275 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Государственного реестра селекционных достижений, рекомендуемых к использованию в Республике Казахстан, и Перечня перспективных сортов сельскохозяйственных растений
  kaz: Қазақстан Республикасында пайдалануға ұсынылатын Селекциялық жетістіктердің мемлекеттік тізілімін және ауыл шаруашылығы өсімдіктерінің перспективалы сорттарының тізбесін бекіту туралы
