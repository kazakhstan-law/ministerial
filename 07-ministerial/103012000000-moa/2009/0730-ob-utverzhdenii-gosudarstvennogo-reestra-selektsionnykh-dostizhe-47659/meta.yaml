  title:
    rus: О внесении изменения в приказ Министра сельского хозяйства Республики Казахстан от 30 июля 2009 года № 434 "Об утверждении Государственного реестра селекционных достижений, допущенных к использованию в Республике Казахстан, и Перечня перспективных сортов сельскохозяйственных растений"
    kaz: '"Қазақстан Республикасында пайдалануға рұқсат етілген Селекциялық жетістіктердің мемлекеттік тізілімін және ауыл шаруашылық өсімдіктерінің перспективалы сорттарының тізбесін бекіту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің 2009 жылғы 30 шілдедегі № 434 бұйрығына өзгерістер енгізу туралы'
