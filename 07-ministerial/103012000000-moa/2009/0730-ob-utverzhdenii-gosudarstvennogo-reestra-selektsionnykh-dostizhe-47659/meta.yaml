    kaz: «Қазақстан Республикасында пайдалануға ұсынылатын Селекциялық жетістіктердің мемлекеттік тізілімін және ауыл шаруашылығы өсімдіктерінің перспективалы сұрыптарының тізбесін бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2009 жылғы 30 шілдедегі № 434 бұйрығына өзгерістер енгізу туралы
