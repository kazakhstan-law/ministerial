title:
  rus: Об утверждении Государственного реестра селекционных достижений, рекомендуемых к использованию в Республике Казахстан, и Перечня перспективных сортов сельскохозяйственных растений
  kaz: Қазақстан Республикасында пайдалануға ұсынылатын Селекциялық жетістіктердің мемлекеттік тізілімін және ауыл шаруашылығы өсімдіктерінің перспективалы сорттарының тізбесін бекіту туралы
