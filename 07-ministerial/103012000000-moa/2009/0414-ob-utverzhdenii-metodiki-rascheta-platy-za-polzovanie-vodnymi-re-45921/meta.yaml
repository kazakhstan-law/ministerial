act_code: '45921'
requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 14 апреля 2009 года № 223. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 мая 2009 года № 5675. Утратил силу приказом Министра водных ресурсов и ирригации Республики Казахстан от 22 июля 2025 года № 177-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
