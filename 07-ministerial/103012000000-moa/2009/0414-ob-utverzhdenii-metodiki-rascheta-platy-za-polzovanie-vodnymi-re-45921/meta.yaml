  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра сельского хозяйства Республики Казахстан от 14 апреля 2009 года № 223 «Об утверждении методики расчета платы за пользование водными ресурсами поверхностных источников»
    kaz: «Жер үсті көздерінің су ресурстарын пайдаланғаны үшін төлемақыны  есептеу әдістемесін бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің міндетін атқарушының 2009 жылғы 14 сәуірдегі № 223 бұйрығына өзгеріс енгізу туралы
