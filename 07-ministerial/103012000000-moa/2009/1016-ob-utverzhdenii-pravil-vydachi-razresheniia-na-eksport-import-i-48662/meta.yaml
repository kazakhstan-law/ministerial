title:
  rus: Об утверждении Правил выдачи разрешения на экспорт, импорт и транзит перемещаемых (перевозимых) объектов с учетом оценки эпизоотической ситуации на соответствующей территории
  kaz: Тиісті аумақтағы эпизоотиялық жағдайды бағалауды есепке ала отырып, орны ауыстырылатын (тасымалданатын) объектілердің экспортына, импортына және транзитіне рұқсат беру Ережесін бекіту туралы
