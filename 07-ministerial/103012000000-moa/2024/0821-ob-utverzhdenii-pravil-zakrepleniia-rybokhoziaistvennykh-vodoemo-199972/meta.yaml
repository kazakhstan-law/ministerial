requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 21 августа 2024 года № 283. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 августа 2024 года № 34968. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 28 августа 2025 года № 266 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил закрепления рыбохозяйственных водоемов и (или) участков в целях реализации инвестиционных проектов в сфере рыбного хозяйства и квалификационных требований к инвестору
  kaz: Балық шаруашылығы саласындағы инвестициялық жобаларды іске асыру мақсатында балық шаруашылығы су айдындарын және (немесе) учаскелерін бекітіп беру қағидаларын және инвесторға қойылатын біліктілік талаптарын бекіту туралы
