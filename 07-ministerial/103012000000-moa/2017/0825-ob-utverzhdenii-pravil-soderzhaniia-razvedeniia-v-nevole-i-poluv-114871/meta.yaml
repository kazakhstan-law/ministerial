act_code: '114871'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 25 августа 2017 года № 354. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 сентября 2017 года № 15772
title:
  rus: Об утверждении Правил содержания, разведения в неволе и полувольных условиях редких и находящихся под угрозой исчезновения видов животных и видов животных, подпадающих под действие Конвенции о международной торговле видами дикой фауны и флоры, находящимися под угрозой исчезновения
  kaz: Жануарлардың сирек кездесетін және құрып кету қаупі төнген түрлерін және құрып кету қаупі төнген жабайы фауна мен флора түрлерімен халықаралық сауда туралы конвенцияның қолданылу аясына кіретін жануарлардың түрлерін еріксіз және жартылай ерікті жағдайларда ұстау, өсіру қағидаларын бекіту туралы
