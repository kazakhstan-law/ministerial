  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 25 августа 2017 года № 354 «Об утверждении Правил содержания и разведения животных в неволе и (или) полувольных условиях»
    kaz: «Жануарларды еріксіз және (немесе) жартылай ерікті жағдайларда ұстау және өсіру қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Қазақстан Республикасы Ауыл шаруашылығы министрінің 2017 жылғы 25 тамыздағы № 354 бұйрығына өзгерістер енгізу туралы
