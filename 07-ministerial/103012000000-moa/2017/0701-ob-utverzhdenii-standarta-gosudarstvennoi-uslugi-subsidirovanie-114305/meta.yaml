act_code: '114305'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 1 июля 2017 года № 279. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 августа 2017 года № 15537. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 9 октября 2020 года № 311 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Субсидирование процентной ставки по кредитным и лизинговым обязательствам в рамках направления по финансовому оздоровлению субъектов агропромышленного комплекса»
  kaz: «Агроөнеркәсіптік кешен субъектілерін қаржылық сауықтыру жөніндегі бағыт шеңберінде кредиттік және лизингтік міндеттемелер бойынша пайыздық мөлшерлемені субсидиялау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
