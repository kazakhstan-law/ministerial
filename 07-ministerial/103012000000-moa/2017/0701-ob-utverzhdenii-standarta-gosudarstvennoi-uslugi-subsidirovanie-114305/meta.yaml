  code: '127752'
  requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 28 декабря 2018 года № 547. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 декабря 2018 года № 18098. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 9 октября 2020 года № 311 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в приказ Заместителя Премьер-Министра Республики Казахстан – Министра сельского хозяйства Республики Казахстан от 1 июля 2017 года № 279 «Об утверждении стандарта государственной услуги «Субсидирование процентной ставки по кредитным и лизинговым обязательствам в рамках направления по финансовому оздоровлению субъектов агропромышленного комплекса»
    kaz: «Агроөнеркәсіптік кешен субъектілерін қаржылық сауықтыру жөніндегі бағыт шеңберінде кредиттік және лизингтік міндеттемелер бойынша пайыздық мөлшерлемені субсидиялау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары –  Қазақстан Республикасы Ауыл шаруашылығы министрінің 2017 жылғы 1 шілдедегі № 279 бұйрығына өзгеріс енгізу туралы
