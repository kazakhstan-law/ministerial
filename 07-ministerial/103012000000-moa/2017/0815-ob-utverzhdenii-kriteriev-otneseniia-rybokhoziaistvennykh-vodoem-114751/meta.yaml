requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 15 августа 2017 года № 336. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 сентября 2017 года № 15697. Утратил силу приказом и.о. Министра сельского хозяйства Республики Казахстан от 7 июня 2024 года № 193 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении критериев отнесения рыбохозяйственных водоемов и (или) их участков к водоемам и (или) участкам для ведения промыслового рыболовства, любительского (спортивного) рыболовства, озерно-товарного рыбоводного хозяйства, садкового рыбоводного хозяйства и Методики их определения
  kaz: Балық шаруашылығы су айдындарын және (немесе) олардың учаскелерін кәсіпшілік балық аулауды, әуесқойлық (спорттық) балық аулауды, көлде тауарлы балық өсіру шаруашылығын, тор қоршамада балық өсіру шаруашылығын жүргізуге арналған су айдындарына және (немесе) учаскелерге жатқызудың өлшемшарттарын және оларды айқындау әдістемесін бекіту туралы
