  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра сельского хозяйства Республики Казахстан от 15 августа 2017 года № 336 «Об утверждении критериев отнесения рыбохозяйственных водоемов и (или) их участков к водоемам и (или) участкам для ведения промыслового рыболовства, любительского (спортивного) рыболовства, озерно-товарного рыбоводного хозяйства, садкового рыбоводного хозяйства и Методики их определения»
    kaz: «Балық шаруашылығы су айдындарын және (немесе) олардың учаскелерін кәсіпшілік балық аулауды, әуесқойлық (спорттық) балық аулауды, көлде тауарлы балық өсіру шаруашылығын, тор қоршамада балық өсіру шаруашылығын жүргізуге арналған су айдындарына және (немесе) учаскелерге жатқызудың өлшемшарттарын және оларды айқындау әдістемесін бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің міндетін атқарушының 2017 жылғы 15 тамыздағы № 336 бұйрығына өзгерістер енгізу туралы
