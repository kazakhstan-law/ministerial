act_code: '118168'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 25 декабря 2017 года № 513. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 января 2018 года № 16243. Утратил силу приказом и.о. Министра водных ресурсов и ирригации Республики Казахстан от 31 июля 2025 года № 190-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм положенности химических реактивов, лабораторной посуды и полевого снаряжения при проведении мониторинга и оценки мелиоративного состояния орошаемых земель
  kaz: Суармалы жерлердің мониторингі мен мелиоративтік жай-күйіне бағалауды жүргізу барысындағы химиялық реактивтер, зертханалық ыдыс және далалық жабдық тиістілігінің заттай нормаларын бекіту туралы
