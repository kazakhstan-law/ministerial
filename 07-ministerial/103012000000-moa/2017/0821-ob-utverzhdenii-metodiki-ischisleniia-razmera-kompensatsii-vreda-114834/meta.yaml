act_code: '114834'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 21 августа 2017 года № 341. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 сентября 2017 года № 15739. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 23 сентября 2025 года № 320 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики исчисления размера компенсации вреда, наносимого и нанесенного рыбным ресурсам и другим водным животным, в том числе и неизбежного, в результате хозяйственной деятельности
  kaz: Шаруашылық қызметі нәтижесінде балық ресурстары мен басқа да су жануарларына келтірілетін және келтірілген зиянды, оның ішінде болмай қоймайтын зиянды өтеу мөлшерін есептеу әдістемесін бекіту туралы
