act_code: '112647'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 10 марта 2017 года № 115. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 мая 2017 года № 15136. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 28 декабря 2020 года № 408 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Субсидирование затрат ревизионных союзов сельскохозяйственных кооперативов на проведение внутреннего аудита сельскохозяйственных кооперативов»
  kaz: «Ауыл шаруашылығы кооперативтерінің тексеру одақтарының ауыл шаруашылығы кооперативтерінің ішкі аудитін жүргізуге арналған шығындарын субсидиялау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
