act_code: '114157'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 8 июня 2017 года № 229. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 июля 2017 года № 15374. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 9 октября 2020 года № 311 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Субсидирование ставок вознаграждения при кредитовании, а также лизинге на приобретение сельскохозяйственных животных, техники и технологического оборудования»
  kaz: «Ауыл шаруашылығы малын, техниканы және технологиялық жабдықты сатып алуға кредит беру, сондай-ақ лизинг кезінде сыйақы мөлшерлемелерін субсидиялау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
