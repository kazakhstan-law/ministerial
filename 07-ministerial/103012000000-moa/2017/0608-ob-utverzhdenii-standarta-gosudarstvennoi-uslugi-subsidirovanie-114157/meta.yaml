  title:
    rus: О внесении изменения в приказ Заместителя Премьер-Министра Республики Казахстан – Министра сельского хозяйства Республики Казахстан от 8 июня 2017 года № 229 «Об утверждении стандарта государственной услуги «Субсидирование ставок вознаграждения при кредитовании, а также лизинге на приобретение сельскохозяйственных животных, техники и технологического оборудования»
    kaz: «Ауыл шаруашылығы малын, техниканы және технологиялық жабдықты сатып алуға кредит беру, сондай-ақ лизинг кезінде сыйақы мөлшерлемелерін субсидиялау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің 2017 жылғы 8 маусымдағы № 229 бұйрығына өзгеріс енгізу туралы
