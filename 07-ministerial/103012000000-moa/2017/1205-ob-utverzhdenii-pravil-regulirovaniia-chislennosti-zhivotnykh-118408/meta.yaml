  title:
    rus: О внесении изменений в приказы исполняющего обязанности Министра сельского хозяйства Республики Казахстан от 27 февраля 2015 года № 18-03/143 «Об утверждении Правил выдачи административным органом разрешений на импорт на территорию Республики Казахстан, экспорт и (или) реэкспорт с территории Республики Казахстан видов животных, подпадающих под действие Конвенции о международной торговле видами дикой фауны и флоры, находящимися под угрозой исчезновения» и Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 5 декабря 2017 года № 480 «Об утверждении Правил регулирования численности животных»
    kaz: Қазақстан Республикасы Ауыл шаруашылығы министрінің міндетін атқарушысының «Құрып кету қаупі төнген жабайы фауна мен флора түрлерімен халықаралық сауда туралы конвенцияның күші қолданылатын жануарлар түрлерін Қазақстан Республикасының аумағына импорттауға, Қазақстан Республикасының аумағынан экспорттауға және (немесе) кері экспорттауға әкімшілік органның рұқсаттар беру қағидаларын бекіту туралы» 2015 жылғы 27 ақпандағы № 18-03/143 бұйрығына және Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің «Жануарлардың санын реттеу қағидаларын бекіту туралы» 2017 жылғы 5 желтоқсандағы № 480 бұйрығына өзгерістер енгізу туралы
