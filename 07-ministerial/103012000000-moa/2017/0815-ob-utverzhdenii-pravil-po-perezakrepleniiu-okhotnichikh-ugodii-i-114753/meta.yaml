  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра сельского хозяйства Республики Казахстан от 15 августа 2017 года № 337 «Об утверждении Правил по перезакреплению охотничьих угодий и рыбохозяйственных водоемов и (или) участков и квалификационных требований, предъявляемых к лицам, за которыми они ранее были закреплены»
    kaz: «Аңшылық алқаптар мен балық шаруашылығы су айдындарын және (немесе) учаскелерін қайта бекітіп беру жөніндегі қағидаларды және олар бұдан бұрын бекітіп берілген тұлғаларға қойылатын біліктілік талаптарын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің міндетін атқарушының 2017 жылғы 15 тамыздағы № 337 бұйрығына өзгерістер енгізу туралы
