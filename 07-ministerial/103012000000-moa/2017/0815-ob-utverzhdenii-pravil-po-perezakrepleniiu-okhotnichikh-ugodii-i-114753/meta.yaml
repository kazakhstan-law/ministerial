act_code: '114753'
requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 15 августа 2017 года № 337. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 сентября 2017 года № 15722. Утратил силу приказом Министра экологии и природных ресурсов Республики Казахстан от 21 мая 2024 года № 107 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил по перезакреплению охотничьих угодий и рыбохозяйственных водоемов и (или) участков и квалификационных требований, предъявляемых к лицам, за которыми они ранее были закреплены
  kaz: Аңшылық алқаптар мен балық шаруашылығы су айдындарын және (немесе) учаскелерiн қайта бекітіп беру жөніндегі қағидаларды және олар бұдан бұрын бекітіп берілген тұлғаларға қойылатын бiлiктiлiк талаптарын бекiту туралы
