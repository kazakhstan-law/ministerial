requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 18 мая 2017 года № 204. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 июня 2017 года № 15248. Утратил силу приказом Министра экологии и природных ресурсов Республики Казахстан от 29 октября 2025 года № 290 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм потребности для специализированной организации в авиационной технике, специальном транспорте, оборудовании средств связи, навигационном оборудовании и специальных средствах для проведения работ по охране животного мира и особо охраняемых природных территорий
  kaz: Мамандандырылған ұйым үшін жануарлар дүниесі мен ерекше қорғалатын табиғи аумақтарды қорғау жөніндегі жұмыстарды жүргізуге арналған авиациялық техникаға, арнайы көлікке, байланыс құралдары жабдығына, навигациялық жабдықтар мен арнайы құралдарға қажеттіліктің заттай нормаларын бекіту туралы
