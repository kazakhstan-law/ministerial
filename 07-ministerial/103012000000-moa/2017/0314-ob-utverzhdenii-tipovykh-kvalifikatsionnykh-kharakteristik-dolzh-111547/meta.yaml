act_code: '111547'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 14 марта 2017 года № 120. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 апреля 2017 года № 15021
title:
  rus: Об утверждении Типовых квалификационных характеристик должностей руководителей и специалистов природоохранных организаций, организаций лесного хозяйства и специализированных организаций Комитета лесного хозяйства и животного мира Министерства экологии и природных ресурсов Республики Казахстан
  kaz: Қазақстан Республикасы Экология және табиғи ресурстар министрлігі Орман шаруашылығы және жануарлар дүниесі комитетінің табиғат қорғау ұйымдарының, орман шаруашылығы ұйымдарының және мамандандырылған ұйымдарының басшылары мен мамандары лауазымдарының үлгілік біліктілік сипаттамаларын бекіту туралы
