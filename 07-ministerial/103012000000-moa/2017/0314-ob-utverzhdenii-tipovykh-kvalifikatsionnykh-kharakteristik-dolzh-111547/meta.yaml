  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 14 марта 2017 года № 120 «Об утверждении Типовых квалификационных характеристик должностей руководителей и специалистов природоохранных организаций, организаций лесного хозяйства и специализированных организаций Комитета лесного хозяйства и животного мира Министерства сельского хозяйства Республики Казахстан»
    kaz: «Қазақстан Республикасы Ауыл шаруашылығы министрлігі Орман шаруашылығы және жануарлар дүниесі комитетінің табиғат қорғау ұйымдарының, орман шаруашылығы ұйымдарының және мамандандырылған ұйымдарының басшылары мен мамандары лауазымдарының үлгілік біліктілік сипаттамаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Қазақстан Республикасы Ауыл шаруашылығы министрінің 2017 жылғы 14 наурыздағы № 120 бұйрығына өзгерістер енгізу туралы
