  code: '123772'
  requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 1 июня 2018 года № 233. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 июля 2018 года № 17205. Утратил силу приказом Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 26 октября 2018 года № 436 (вводится в действие с 1 января 2019 года)
  title:
    rus: О внесении изменения в приказ Заместителя Премьер-Министра Республики Казахстан – Министра сельского хозяйства Республики Казахстан от 1 февраля 2017 года № 50 «Об утверждении Правил субсидирования ставок вознаграждения по кредитам и лизингу технологического оборудования, на приобретение сельскохозяйственных животных, а также лизингу сельскохозяйственной техники»
    kaz: «Кредиттер және технологиялық жабдықтың, ауыл шаруашылығы малын сатып алудың лизингі, сондай-ақ ауыл шаруашылығы техникасының лизингі бойынша сыйақы мөлшерлемелерін субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің 2017 жылғы 1 ақпандағы № 50 бұйрығына өзгеріс енгізу туралы
