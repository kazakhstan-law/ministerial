title:
  rus: Об утверждении Правил субсидирования ставок вознаграждения по кредитам и лизингу технологического оборудования, на приобретение сельскохозяйственных животных, а также лизингу сельскохозяйственной техники
  kaz: Кредиттер және технологиялық жабдықтың, ауыл шаруашылығы малын сатып алудың лизингі, сондай-ақ ауыл шаруашылығы техникасының лизингі бойынша сыйақы мөлшерлемелерін субсидиялау қағидаларын бекіту туралы
