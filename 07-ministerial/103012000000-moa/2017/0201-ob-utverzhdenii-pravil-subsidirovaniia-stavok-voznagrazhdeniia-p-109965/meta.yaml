act_code: '109965'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 1 февраля 2017 года № 50. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 февраля 2017 года № 14815. Утратил силу приказом Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 26 октября 2018 года № 436 (вводится в действие с 1 января 2019 года)
title:
  rus: Об утверждении Правил субсидирования ставок вознаграждения по кредитам и лизингу технологического оборудования, на приобретение сельскохозяйственных животных, а также лизингу сельскохозяйственной техники
  kaz: Кредиттер және технологиялық жабдықтың, ауыл шаруашылығы малын сатып алудың лизингі, сондай-ақ ауыл шаруашылығы техникасының лизингі бойынша сыйақы мөлшерлемелерін субсидиялау қағидаларын бекіту туралы
