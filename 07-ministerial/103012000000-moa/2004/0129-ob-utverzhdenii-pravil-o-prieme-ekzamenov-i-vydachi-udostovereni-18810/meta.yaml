act_code: '18810'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 29 января 2004 года № 33. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 марта 2004 года № 2725. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 25 января 2013 года № 15-07/32
title:
  rus: Об утверждении Правил о приеме экзаменов и выдачи удостоверений на право управления тракторами и изготовленными на их базе самоходными шасси и механизмами, самоходными сельскохозяйственными, мелиоративными и дорожно-строительными машинами и механизмами, а также специальных машин повышенной проходимости
  kaz: Тракторларды және олардың базасында жасалған өздігінен жүретін шассилер мен механизмдерді, өздігінен жүретін ауыл шаруашылығы, мелиоративтік және жол-құрылыс машиналары мен механизмдерін, сондай-ақ жоғары өтімді арнайы машиналарды жүргізу құқығына емтихандар қабылдау және куәліктер беру жөніндегі ережелерді бекіту туралы
