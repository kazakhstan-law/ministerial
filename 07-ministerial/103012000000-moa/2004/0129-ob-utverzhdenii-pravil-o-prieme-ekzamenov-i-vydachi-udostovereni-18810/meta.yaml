  title:
    rus: О внесении изменений и дополнений в приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 29 января 2004 года № 33 "Об утверждении Правил о приеме экзаменов и выдачи удостоверений на право управления тракторами и изготовленными на их базе самоходными шасси и механизмами, самоходными сельскохозяйственными, мелиоративными и дорожно-строительными машинами и механизмами"
    kaz: '"Тракторларды және олардың базасында жасалған іздігінен жүретін шассилер мен механизмдерді, өздігінен жүретін ауыл шаруашылығы, мелиоративтік және жол-құрылысы машиналары мен механизмдерін жүргізу құқығына емтихандар қабылдау және куәліктер беру жөніндегі" ережелерді бекіту туралы Қазақстан Республикасы Премьер-Министрінің орынбасары - Қазақстан Республикасы Ауыл шарушылығы министрінің 2004 жылғы 29 қаңтардағы № 33 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/42732/rus
