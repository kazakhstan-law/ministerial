act_code: '18768'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 27 января 2004 года № 31. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 февраля 2004 года № 2717. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 11 октября 2012 года № 17-03/513
title:
  rus: Об утверждении Правил о порядке выдачи Административным органом разрешений на ввоз в Республику Казахстан и вывоз за ее пределы видов животных и растений, их частей или дериватов, находящихся под угрозой исчезновения
  kaz: Әкімшілік органның құрып кету қауіпі төнген жануарлар мен өсімдіктер түрлерін, олардың бөліктерін немесе туындыларын Қазақстан Республикасына әкелуге және одан тысқары жерлерге әкетуге рұқсат беру тәртібі туралы ережені бекіту туралы
