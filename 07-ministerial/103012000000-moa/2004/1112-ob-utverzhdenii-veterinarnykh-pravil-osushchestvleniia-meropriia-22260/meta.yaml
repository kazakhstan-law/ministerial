  title:
    rus: Об утверждении Санитарно-эпидемиологических и ветеринарно-санитарных правил и норм "Организация эпидемиолого-эпизоотологического надзора и проведение санитарно-противоэпидемических (профилактических) и ветеринарно-профилактических (противоэпизоотических) мероприятий по листериозу в Республике Казахстан"
    kaz: '"Қазақстан Республикасында листериоз бойынша эпидемиологиялық-эпизоотиялық қадағалауды ұйымдастыру және санитарлық-індетке қарсы (алдын-алу) және ветеринарлық алдын-алу іс-шараларын жүргізу (індетке қарсы)" санитарлық-эпидемиологиялық және ветеринарлық-санитарлық ережесі мен нормаларын бекіту туралы'
