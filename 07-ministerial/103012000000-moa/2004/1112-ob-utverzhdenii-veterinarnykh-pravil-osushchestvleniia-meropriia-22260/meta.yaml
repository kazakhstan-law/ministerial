requisite: Приказ Министра сельского хозяйства Республики Казахстан от 12 ноября 2004 года № 658. Зарегистрирован Министерством юстиции Республики Казахстан 6 декабря 2004 года № 3248. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 17 января 2012 года № 10-1/18
title:
