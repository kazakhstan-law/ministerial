title:
  rus: Об утверждении Правил аттестации (переаттестации) производителей семян первой, второй и третьей репродукций и формы бланка свидетельства производителя семян первой, второй и третьей репродукций
  kaz: Бірінші, екінші және үшінші көбейтілген тұқым өндірушілерді аттестаттау (қайта аттестаттау) ережесін және бірінші, екінші және үшінші көбейтілген тұқым өндірушінің куәлігі бланкының нысанын бекіту туралы
