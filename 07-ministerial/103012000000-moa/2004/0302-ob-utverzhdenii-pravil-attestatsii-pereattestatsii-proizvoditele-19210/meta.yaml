    kaz: Бірегей, элиталық тұқым, бірінші, екінші және үшінші көбейтілген тұқым өндірушілерді және тұқым өткізушілерді аттестаттау ережесін бекіту және Қазақстан Республикасы Ауыл шаруашылығы министрінің кейбір бұйрықтарының күші жойылды деп тану туралы
