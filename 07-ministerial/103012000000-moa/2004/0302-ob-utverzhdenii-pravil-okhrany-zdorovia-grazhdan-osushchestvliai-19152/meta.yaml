  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра Республики Казахстан – Министра сельского хозяйства Республики Казахстан от 2 марта 2004 года № 104 «Об утверждении Правил охраны здоровья граждан, осуществляющих содержание, разведение, использование, производство, заготовку (убой), хранение, переработку, транспортировку (перемещение) и реализацию перемещаемых (перевозимых) объектов, от болезней, общих для животных и человека»
    kaz: «Орны ауыстырылатын (тасымалданатын) объектілерді ұстауды, өсiрудi, пайдалануды, өндiрудi, дайындауды (союды), сақтауды, өңдеудi, тасымалдау (орнын ауыстыру) мен өткiзудi жүзеге асыратын азаматтардың денсаулығын жануарлар мен адамға ортақ аурулардан қорғау қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің 2004 жылғы 2 наурыздағы № 104 бұйрығына өзгерістер енгізу туралы
