  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства от 2 марта 2004 года № 104 «Об утверждении Правил охраны здоровья граждан, осуществляющих содержание, разведение, использование, производство, заготовку (убой), хранение, переработку, транспортировку и реализацию подконтрольных государственному ветеринарному надзору грузов, от болезней, общих для животных и человека»
    kaz: «Мемлекеттік ветеринарлық қадағалаудың бақылауындағы жүктерді ұстаумен, өсірумен, пайдаланумен, өндірумен, дайындаумен (союмен), сақтаумен, қайта өңдеумен, тасымалдаумен және өткізумен айналысатын азаматтардың денсаулығын адам мен жануарларға ортақ аурулардан сақтау туралы Ережесін бекіту туралы» Қазақстан Республикасы Премьер-Министрінің Орынбасары - Ауыл шаруашылығы Министрінің 2004 жылғы 2 наурыздағы № 104 бұйрығына өзгерістер енгізу туралы
