act_code: '19152'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 2 марта 2004 года N 104. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 марта 2004 года N 2768
title:
  rus: Об утверждении Правил охраны здоровья граждан, осуществляющих содержание, разведение, использование, производство, заготовку (убой), хранение, переработку, транспортировку (перемещение) и реализацию перемещаемых (перевозимых) объектов, от болезней, общих для животных и человека
  kaz: Орны ауыстырылатын (тасымалданатын) объектілерді ұстауды, өсiрудi, пайдалануды, өндiрудi, дайындауды (союды), сақтауды, өңдеудi, тасымалдау (орнын ауыстыру) мен өткiзудi жүзеге асыратын азаматтардың денсаулығын жануарлар мен адамға ортақ аурулардан қорғау қағидаларын бекіту туралы
