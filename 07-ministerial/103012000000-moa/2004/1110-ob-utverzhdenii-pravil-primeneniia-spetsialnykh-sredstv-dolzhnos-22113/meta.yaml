act_code: '22113'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 10 ноября 2004 года № 639. Зарегистрирован Министерством юстиции Республики Казахстан 23 ноября 2004 года № 3222. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 13 сентября 2012 года № 25-03-01/455
title:
  rus: Об утверждении Правил применения специальных средств должностными лицами уполномоченного органа и его территориальных подразделений, государственных учреждений по охране животного мира, специализированных организаций в области охраны, воспроизводства и использования животного мира и особо охраняемых природных территорий
  kaz: Жануарлар дүниесін қорғау жөніндегі уәкілетті және аумақтық органдардың, мемлекеттік мекемелердің, жануарлар дүниесін қорғау, өсімін молайту және пайдалану мен ерекше қорғалатын табиғи аумақтар саласындағы мамандандырылған ұйымдардың лауазымды тұлғаларының арнайы құралдарды қолдану ережесін бекіту туралы
