  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 23 августа 2004 года № 453 "Об утверждении форм бланков аттестата на семена сельскохозяйственных растений, аттестата на оригинальные, суперэлитные, элитные семена картофеля, свидетельства на семена сельскохозяйственных растений и свидетельства на репродукционные семена картофеля"
    kaz: '"Ауыл шаруашылығы өсімдігі тұқымының аттестаты, оригиналды, суперэлиталық, элиталық картоп тұқымына аттестаты, ауыл шаруашылығы өсімдігі тұқымының куәлігі және репродукциялық картоп тұқымына куәлігі бланктерінің нысандарын бекіту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің 2004 жылғы 23 тамыздағы № 453 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/73469/rus
