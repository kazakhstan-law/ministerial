title:
  rus: Об утверждении Правил использования животных, кроме редких и находящихся под угрозой исчезновения, в научных, культурно-просветительских, воспитательных и эстетических целях, в том числе для создания зоологических коллекций
  kaz: Сирек кездесетiн және құрып кету қатерi төнген жануарлардан басқа жануарларды ғылыми, мәдени-ағартушылық, тәрбиелiк және эстетикалық мақсаттарға, оның iшiнде зоологиялық коллекциялар жасау үшiн пайдалану ережесiн бекiту туралы
