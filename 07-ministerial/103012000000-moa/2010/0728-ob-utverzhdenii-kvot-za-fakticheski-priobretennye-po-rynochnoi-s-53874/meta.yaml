  title:
    rus: О внесении изменений и дополнений в приказ Министра сельского хозяйства Республики Казахстан от 28 июля 2010 года № 467 "Об утверждении квот за фактически приобретенные по рыночной стоимости объемы суперэлитных семян по каждому виду семян на 2010 год, квот за фактически приобретенные по рыночной стоимости объемы элитных семян по каждому виду семян на 2010 год, квот за фактически реализованные отечественным сельскохозяйственным товаропроизводителям по удешевленной стоимости объемы элитных саженцев по каждому виду саженцев для каждой области на 2010 год"
    kaz: '"2010 жылға арналған тұқымның әр түрі бойынша суперэлиталық тұқымның нарық бағасы бойынша нақты сатып алынған көлемі үшін квоталар, 2010 жылға арналған тұқымның әр түрі бойынша элиталық тұқымның нарық бағасы бойынша нақты сатып алынған көлемі үшін квоталар, 2010 жылға әр облысқа әрбір көшеттің түрі бойынша элиталық көшеттерін арзандатылған бағамен отандық тауар өндірушілерге нақты сатылған көлемі үшін квоталар бекіту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің 2010 жылғы 28 шілдедегі № 467 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
