  title:
    rus: О внесении изменений в приказы Министра сельского хозяйства Республики Казахстан от 12 апреля 2010 года № 250 «Об утверждении Правил регистрации в уполномоченном органе заключенных пользователем животного мира договоров с физическими и юридическими лицами на пользование животным миром и предоставлении информации об их расторжении» и исполняющего обязанности Министра сельского хозяйства Республики Казахстан от 25 февраля 2015 года № 18-04/128 «Об утверждении Перечня должностных лиц ведомства уполномоченного органа и его территориальных подразделений, осуществляющих государственный контроль и надзор в области охраны, воспроизводства и использования животного мира, а также работников государственных учреждений и организаций, осуществляющих непосредственную охрану животного мира, имеющих право на ношение форменной одежды со знаками различия (без погон)»
    kaz: Қазақстан Республикасы Ауыл шаруашылығы министрінің «Жануарлар дүниесін пайдаланушы жеке және заңды тұлғалармен жануарлар дүниесін пайдалануға жасасқан шарттарын уәкілетті органда тіркеу және оларды бұзу туралы ақпарат беру Ережесін бекіту туралы» 2010 жылғы 12 сәуірдегі № 250 бұйрығына және Қазақстан Республикасы Ауыл шаруашылығы министрінің міндетін атқарушының «Жануарлар дүниесін қорғау, өсімін молайту және пайдалану саласындағы мемлекеттік бақылау мен қадағалауды жүзеге асыратын уәкілетті органның ведомствосы мен оның аумақтық бөлімшелерінің лауазымды адамдарының, сондай-ақ мемлекеттік мекемелер мен ұйымдардың жануарлар дүниесін тікелей қорғауды жүзеге асыратын айырым белгілері бар (погондарсыз) нысанды киім киіп жүруге құқығы бар, жұмыскерлерінің тізбесін бекіту туралы» 2015 жылғы 25 ақпандағы № 18-04/128 бұйрығына өзгерістер енгізу туралы
