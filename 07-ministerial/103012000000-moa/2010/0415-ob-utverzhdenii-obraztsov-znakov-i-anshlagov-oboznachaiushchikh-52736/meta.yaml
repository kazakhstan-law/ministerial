requisite: Приказ Министра сельского хозяйства Республики Казахстан от 15 апреля 2010 года № 267. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 мая 2010 года № 6238. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 13 марта 2012 года № 25-03-02/96
title:
  rus: Об утверждении образцов знаков и аншлагов, обозначающих береговые границы рыбохозяйственных водоемов и (или) участков, а также форму журнала учета лова рыбных ресурсов и других водных животных (промысловый журнал)
  kaz: Балық шаруашылығы су айдындарының және (немесе) учаскелерінің жағалаулық шекараларын білдіретін белгілер мен аншлагтардың үлгілерін, сондай-ақ Балық ресурстарын және басқа да су жануарларын аулауды есепке алу журналының (кәсіпшілік журналдың) нысанын бекіту туралы
