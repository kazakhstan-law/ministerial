act_code: '52447'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 14 апреля 2010 года № 258. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 мая 2010 года № 6223
title:
  rus: Об утверждении Перечней видов животных, используемых в иных хозяйственных целях (кроме охоты и рыболовства), видов животных, не используемых в хозяйственных целях, но имеющих экологическую, культурную и иную ценность, видов животных, численность которых подлежит регулированию в целях охраны здоровья населения, предохранения от заболеваний сельскохозяйственных и других домашних животных, предотвращения ущерба окружающей среде, предупреждения опасности нанесения существенного ущерба сельскохозяйственной деятельности
  kaz: Жануарлардың өзге де шаруашылық мақсаттарда (аң аулау мен балық аулаудан басқа) пайдаланылатын түрлерiнің, жануарлардың шаруашылық мақсаттарда пайдаланылмайтын, бiрақ экологиялық, мәдени және өзге де құндылығы бар түрлерiнің, жануарлардың халықтың денсаулығын сақтау, ауыл шаруашылығы және басқа да үй жануарларын аурудан алдын ала қорғау, қоршаған ортаға зиян келтiрудi болдырмау, ауыл шаруашылығы қызметiне айтарлықтай зиян келтiру қаупiнiң алдын алу мақсатында саны реттелуге тиiс түрлерiнің тізбелерін бекіту туралы
