act_code: '54816'
requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 6 сентября 2010 года № 574. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 сентября 2010 года № 6471. Утратил силу приказом и.о Министра охраны окружающей среды Республики Казахстан от 20 августа 2013 года № 250-Ө
title:
  rus: Об утверждении форм справки о наличии основных средств, технологического оборудования и других материально-технических средств по добыче и переработке рыбных ресурсов и других водных животных, а также технических средств для проведения текущей мелиорации и спасения молоди, справки о наличии основных средств для проведения рыбохозяйственных мелиоративных работ
  kaz: Негізгі құралдардың, балық ресурстарын және басқа да су жануарларын аулау мен өңдеу бойынша технологиялық жабдықтардың және өзге де материалдық-техникалық құралдардың, сондай-ақ ағымды мелиорацияны жүргізу және жас шабақтарды құтқару үшін техникалық құралдардың болуы туралы анықтаманың, балық шаруашылығы мелиорациялық жұмыстарын жүргізу үшін негізгі құралдардың болуы туралы анықтаманың нысандарын бекіту туралы
