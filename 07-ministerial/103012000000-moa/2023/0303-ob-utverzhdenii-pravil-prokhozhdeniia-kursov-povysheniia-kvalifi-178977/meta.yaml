title:
  rus: Об утверждении Правил прохождения курсов повышения квалификации и получения сертификата о прохождении курсов повышения квалификации бонитером (классификатором), техником-осеменатором и специалистом по трансплантации (пересадке) эмбрионов
  kaz: Бонитердің (сыныптаушының), техник-ұрықтандырушының және эмбриондарды транспланттау (ауыстырып салу) жөніндегі маманның біліктілікті арттыру курстарынан өту және біліктілікті арттыру курстарынан өткені туралы сертификатты алу қағидаларын бекіту туралы
