title:
  rus: Об утверждении Правил определения региональных операторов распределения нефтепродуктов на сельскохозяйственные работы, а также Правил формирования и распределения объемов нефтепродуктов для производителей сельскохозяйственной продукции в периоды весенне-полевых и уборочных работ
  kaz: Ауыл шаруашылығы жұмыстарына мұнай өнімдерін бөлудің өңірлік операторларын айқындау қағидаларын, сондай-ақ Көктемгі егіс және егін жинау жұмыстары кезеңінде ауыл шаруашылығы өнімдерін өндірушілер үшін мұнай өнімдерінің көлемдерін қалыптастыру және бөлу қағидаларын бекіту туралы
