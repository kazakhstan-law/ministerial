    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 29 июля 2014 года № 4/388 "Об утверждении площадей закладки маточников многолетних насаждений плодово-ягодных культур и винограда и обслуживания незавершенного производства заложенных маточников многолетних насаждений плодово-ягодных культур и винограда для каждого оригинатора на 2014 год, квот за приобретенные по рыночной стоимости объемы элитных семян сортов, допущенных к использованию в Республике Казахстан по каждому виду семян на 2014 год, квот за реализованные отечественным сельскохозяйственным товаропроизводителям по удешевленной стоимости объемы элитных семян кукурузы, подсолнечника, риса, сахарной свеклы, хлопчатника и саженцев сортов, допущенных к использованию в Республике Казахстан для каждой области на 2014 год"
