act_code: '83122'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 29 июля 2014 года № 4/388. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 августа 2014 года № 9704
title:
  rus: Об утверждении площадей закладки маточников многолетних насаждений плодово-ягодных культур и винограда и обслуживания незавершенного производства заложенных маточников многолетних насаждений плодово-ягодных культур и винограда для каждого оригинатора на 2014 год, квот за приобретенные по рыночной стоимости объемы элитных семян сортов, допущенных к использованию в Республике Казахстан по каждому виду семян для каждой области на 2014 год, квот за реализованные отечественным сельскохозяйственным товаропроизводителям по удешевленной стоимости объемы элитных семян кукурузы, подсолнечника, риса, сахарной свеклы, хлопчатника и саженцев сортов, допущенных к использованию в Республике Казахстан для каждой области на 2014 год
  kaz: 2014 жылға арналған әрбір бірегей тұқым өндіруші үшін жеміс-жидек дақылдары мен жүзімнің көпжылдық екпелерінің аналықтарын отырғызу және отырғызылған жеміс-жидек дақылдары мен жүзімнің көп жылдық екпелері аналықтарының аяқталмаған өндірісіне қызмет көрсету алқабы, 2014 жылға арналған әрбір облыс үшін тұқымның әрбір түрі бойынша Қазақстан Республикасында пайдалануға рұқсат берілген сорттардың элиталық тұқымның нарықтық құны бойынша сатып алынған көлемі үшін квоталар, 2014 жылға арналған әрбір облыс үшін Қазақстан Республикасында пайдалануға рұқсат берілген жүгерінің, күнбағыстың, күріштің, қант қызылшасының, мақтаның элиталық тұқымдарының және көшеттер сорттарының арзандатылған құны бойынша отандық ауыл шаруашылығы тауарын өндірушілерге сатылған көлемі үшін квоталар бекіту туралы
