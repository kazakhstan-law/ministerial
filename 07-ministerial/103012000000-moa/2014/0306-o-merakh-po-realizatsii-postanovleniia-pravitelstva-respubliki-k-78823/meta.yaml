requisite: Приказ Министра сельского хозяйства Республики Казахстан от 6 марта 2014 года № 3-1/133. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 апреля 2014 года № 9299. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 5 декабря 2014 года № 3-1/639
title:
  rus: О мерах по реализации постановления Правительства Республики Казахстан от 18 февраля 2014 года № 103 "Об утверждении Правил субсидирования из местных бюджетов на развитие племенного животноводства, повышение продуктивности и качества продукции животноводства"
  kaz: '"Асыл тұқымды мал шаруашылығын дамытуды, мал шаруашылығы өнімінің өнімділігі мен сапасын арттыруды жергілікті бюджеттерден субсидиялау қағидаларын бекіту туралы" Қазақстан Республикасы Үкіметінің 2014 жылғы 18 ақпандағы № 103 қаулысын іске асыру жөніндегі іс-шаралар туралы'
