title:
  rus: Об утверждении квалификационных требований и перечня документов, подтверждающих соответствие им, предъявляемых к деятельности по производству (формуляции) пестицидов, реализации пестицидов, применению пестицидов аэрозольным и фумигационным способами
  kaz: Пестицидтердi өндiру (формуляциялау), пестицидтердi өткiзу, пестицидтердi аэрозольдік және фумигациялық тәсiлдермен қолдану жөнiндегi қызметке қойылатын бiлiктiлiк талаптары мен оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы
