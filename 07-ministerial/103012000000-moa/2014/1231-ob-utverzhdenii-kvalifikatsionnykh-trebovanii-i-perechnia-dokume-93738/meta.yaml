  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 31 декабря 2014 года № 4-4/704 «Об утверждении квалификационных требований и перечня документов, подтверждающих соответствие им, предъявляемых к деятельности по производству (формуляции) пестицидов (ядохимикатов), реализации пестицидов (ядохимикатов), применению пестицидов (ядохимикатов) аэрозольным и фумигационным способами»
    kaz: «Пестицидтердi (улы химикаттарды) өндiру (формуляциялау), пестицидтердi (улы химикаттарды) өткiзу, пестицидтердi (улы химикаттарды) аэрозольдік және фумигациялық тәсiлдермен қолдану жөнiндегi қызметтерге қойылатын бiлiктiлiк талаптары мен оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2014 жылғы 31 желтоқсандағы № 4-4/704 бұйрығына өзгерістер енгізу туралы
