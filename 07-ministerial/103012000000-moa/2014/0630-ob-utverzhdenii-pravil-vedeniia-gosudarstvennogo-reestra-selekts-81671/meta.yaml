  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 30 июня 2014 года № 3-3/331 "Об утверждении Правил ведения Государственного реестра селекционных достижений в области животноводства, допущенных к использованию в Республике Казахстан"
    kaz: '"Қазақстан Республикасында пайдалануға рұқсат етілген мал шаруашылығы саласындағы селекциялық жетістіктердің мемлекеттік тізілімін жүргізу қағидаларын бекіту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің 2014 жылғы 30 маусымдағы № 3-3/331 бұйрығына өзгерістер енгізу туралы'
