title:
  rus: Об утверждении Правил ведения Государственного реестра селекционных достижений в области животноводства, рекомендуемых к использованию в Республике Казахстан
  kaz: Қазақстан Республикасында пайдалануға ұсынылатын, мал шаруашылығы саласындағы селекциялық жетістіктердің мемлекеттік тізілімін жүргізу қағидаларын бекіту туралы
