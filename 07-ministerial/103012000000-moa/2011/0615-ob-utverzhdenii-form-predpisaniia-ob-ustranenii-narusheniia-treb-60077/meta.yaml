requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 15 июня 2011 года № 06-2/331. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 июля 2011 года № 7061. Утратил силу приказом Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 23 февраля 2017 года № 83 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении форм предписания об устранении нарушения требований законодательства Республики Казахстан о семеноводстве, протокола об административном правонарушении, постановления по делу об административном правонарушении
  kaz: Тұқым шаруашылығы туралы Қазақстан Республикасы заңнамасының талаптарын бұзуды жою туралы нұсқаманың, әкімшілік құқық бұзушылық туралы хаттаманың, әкімшілік құқық бұзушылық туралы іс бойынша қаулының нысандарын бекіту туралы
