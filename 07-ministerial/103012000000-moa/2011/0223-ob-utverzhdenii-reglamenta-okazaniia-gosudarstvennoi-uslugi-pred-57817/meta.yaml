act_code: '57817'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 23 февраля 2011 года № 28-3/83. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 марта 2011 года № 6820. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 31 мая 2012 года № 11-3/288
title:
  rus: Об утверждении регламента оказания государственной услуги "Предоставление мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты"
  kaz: '"Ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау шараларын ұсыну" мемлекеттік қызмет көрсету регламентін бекіту туралы'
