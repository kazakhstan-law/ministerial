act_code: '58985'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 13 апреля 2011 года № 06-2/190. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 апреля 2011 года № 6918
title:
  rus: Об утверждении квот за фактически приобретенные по рыночной стоимости объемы элитных семян по каждому виду семян на 2011 год, квот за фактически реализованные отечественным сельскохозяйственным товаропроизводителям по удешевленной стоимости объемы элитных семян хлопчатника, кукурузы, подсолнечника и саженцев по каждому виду саженцев для каждой области на 2011 год
  kaz: 2011 жылға арналған тұқымның әрбір түрі бойынша нарықтық бағамен нақты сатып алынған элиталық тұқымның көлемі үшін квоталарды, 2011 жылға арналған әр облысқа отандық ауыл шаруашылығы тауар өндірушілері арзандатылған бағамен мақтаның, жүгерінің, күнбағыстың элиталық тұқымдары мен көшеттердің нақты сатқан көлемі үшін квоталарды бекіту туралы
