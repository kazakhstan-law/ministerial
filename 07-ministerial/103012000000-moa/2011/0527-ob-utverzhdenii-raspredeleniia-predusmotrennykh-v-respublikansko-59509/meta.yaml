title:
  rus: Об утверждении распределения предусмотренных в республиканском бюджете средств на субсидирование повышения продуктивности и качества продукции животноводства по областям и направлениям субсидирования
  kaz: Облыстар және субсидиялау бағыттары бойынша мал шаруашылығы өнімдерінің өнімділігін және сапасын арттыруды субсидиялауға республикалық бюджетте көзделген қаражатты бөлуін бекіту туралы
