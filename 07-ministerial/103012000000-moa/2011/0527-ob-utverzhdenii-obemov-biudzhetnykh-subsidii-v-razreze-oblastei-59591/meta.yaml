  title:
    rus: О внесении изменения в приказ Министра сельского хозяйства Республики Казахстан от 27 мая 2011 года № 08-2/292 "Об утверждении объемов бюджетных субсидий в разрезе областей по видам племенной продукции (материала), а также годовой сметы распределения средств республиканскому племенному центру, племенному хозяйству по мясному птицеводству, племенному заводу по костанайской породе лошадей"
    kaz: '"Асыл тұқымды өнім (материал) түрлері бойынша облыстар бөлінісіндегі бюджеттік субсидиялардың көлемі, сондай-ақ республикалық малды асылдандырушы орталыққа, етті бағыттағы құс шаруашылығының асыл тұқымды шаруашылығы бойынша, қостанай жылқы тұқымы бойынша асыл тұқымды зауытына қаражат бөлудің жылдық сметасын бекіту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің 2011 жылғы 27 мамырдағы № 08-2/292 бұйрығына өзгеріс енгізу туралы'
