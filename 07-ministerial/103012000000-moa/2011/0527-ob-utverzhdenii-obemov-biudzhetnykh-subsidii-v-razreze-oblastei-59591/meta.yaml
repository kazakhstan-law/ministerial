act_code: '59591'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 27 мая 2011 года № 08-2/292. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 июня 2011 года № 7040.
title:
  rus: Об утверждении объемов бюджетных субсидий в разрезе областей по видам племенной продукции (материала), а также годовой сметы распределения средств республиканскому племенному центру, племенному хозяйству по мясному птицеводству, племенному заводу по костанайской породе лошадей
  kaz: Асыл тұқымды өнім (материал) түрлері бойынша облыстар бөлінісіндегі бюджеттік субсидиялардың көлемі, сондай-ақ Республикалық малды асылдандырушы орталыққа, етті бағыттағы құс шаруашылығының асыл тұқымды шаруашылығы бойынша, қостанай жылқы тұқымы бойынша асыл тұқымды зауытына қаражат бөлудің жылдық сметасын бекіту туралы
