title:
  rus: Об утверждении правил и норматива списания ветеринарных препаратов, кормов и кормовых добавок при их использовании, а также уничтожения по истечении сроков их хранения или признания непригодными для использования по назначению по результатам лабораторных исследований
  kaz: Ветеринариялық препараттарды, жемшөп және жемшөп қоспаларын қолдану кезінде оларды есептен шығару, сондай-ақ оларды сақтау мерзімдері өткеннен кейін жою немесе зертханалық зерттеу нәтижелері бойынша мақсатына қарай қолдануға жарамсыз деп тану нормативін және қағидасын бекіту туралы
