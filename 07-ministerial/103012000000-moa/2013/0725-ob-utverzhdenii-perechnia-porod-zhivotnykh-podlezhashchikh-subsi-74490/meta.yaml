act_code: '74490'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 25 июля 2013 года № 3-2/340. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 августа 2013 года № 8637. Утратил силу приказом и.о. Министра сельского хозяйства Республики Казахстан от 29 ноября 2022 года № 394 (вводится в действие с 11 декабря 2022 года)
title:
  rus: Об утверждении Перечня пород животных, подлежащих субсидированию в приоритетном порядке, в целях обеспечения доступности племенной продукции (материала) для отечественных сельскохозяйственных товаропроизводителей
  kaz: Отандық ауыл шаруашылығы тауарын өндірушілер үшін асыл тұқымдық өнімге (материалға) қол жетімділікті қамтамасыз ету мақсатында басым тәртіппен субсидиялауға жататын мал тұқымдарының тізбесін бекіту туралы
