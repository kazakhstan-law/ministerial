    kaz: «Отандық ауыл шаруашылығы тауарын өндірушілер үшін асыл тұқымдық өнімге (материалға) қол жетімділікті қамтамасыз ету мақсатында басым тәртіппен субсидиялауға жататын мал тұқымдарының тізбесін бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2013 жылғы 25 шілдедегі № 3-2/340 бұйрығының күші жойылды деп тану туралы
