act_code: '72960'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 13 мая 2013 года № 4-1/219. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 мая 2013 года № 8487
title:
  rus: Об утверждении квот за фактически приобретенные по рыночной стоимости объемы элитных семян по каждому виду семян на 2013 год, квот за фактически реализованные отечественным сельскохозяйственным товаропроизводителям по удешевленной стоимости объемы элитных семян кукурузы, подсолнечника, риса, сахарной свеклы, хлопчатника и саженцев по каждому виду саженцев для каждой области на 2013 год
  kaz: 2013 жылға арналған тұқымның әрбір түрі бойынша нарықтық бағамен нақты сатып алынған элиталық тұқымның көлемі үшін квоталарды, 2013 жылға арналған әр облысқа отандық ауыл шаруашылығы тауар өндірушілері арзандатылған бағамен жүгерінің, күнбағыстың, күріштің, қант қызылшасының, мақтаның элиталық тұқымдары мен көшеттердің нақты сатқан көлемі үшін квоталарды бекіту туралы
