requisite: Приказ Министра сельского хозяйства Республики Казахстан от 3 октября 2013 года № 4-3/468. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 октября 2013 года № 8868. Утратил силу приказом и.о. Министра сельского хозяйства Республики Казахстан от 18 марта 2016 года № 120
title:
  rus: Об утверждении вопросов для включения в экзаменационный материал для приема экзаменов и выдачи удостоверений на право управления тракторами и изготовленными на их базе самоходными шасси и механизмами, самоходными сельскохозяйственными, мелиоративными и дорожно-строительными машинами и механизмами, а также специальными машинами повышенной проходимости
  kaz: Тракторларды және олардың базасында жасалған өздігінен жүретін шассилер мен механизмдерді, өздігінен жүретін ауыл шаруашылығы, мелиорациялық және жол құрылысы машиналарын, сондай-ақ жүріп өту мүмкіндігі жоғары арнайы машиналарды жүргізу құқығына емтихандар қабылдау мен куәліктер беру үшін емтихан материалдарына қосуға арналған сұрақтарды бекіту туралы
