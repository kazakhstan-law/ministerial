  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра Республики Казахстан – Министра сельского хозяйства Республики Казахстан от 5 июня 2018 года № 240 «Об утверждении натуральных норм обеспечения ветеринарного контрольного поста, фитосанитарного контрольного поста, а также государственного инспектора по карантину растений, государственного ветеринарно-санитарного инспектора»
    kaz: «Ветеринариялық бақылау бекетін, фитосанитариялық бақылау бекетін, сондай-ақ өсiмдiктер карантинi жөнiндегi мемлекеттік инспекторды, мемлекеттік ветеринариялық-санитариялық инспекторды қамтамасыз етудің заттай нормаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің 2018 жылғы 5 маусымдағы № 240 бұйрығына өзгерістер енгізу туралы
