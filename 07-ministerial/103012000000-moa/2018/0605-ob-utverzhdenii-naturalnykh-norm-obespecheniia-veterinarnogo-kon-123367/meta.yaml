act_code: '123367'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 5 июня 2018 года № 240. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 июля 2018 года № 17153. Утратил силу приказом и.о. Министра сельского хозяйства Республики Казахстан от 22 апреля 2025 года № 119 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм обеспечения ветеринарного контрольного поста, фитосанитарного контрольного поста, а также государственного инспектора по карантину растений, государственного ветеринарно-санитарного инспектора
  kaz: Ветеринариялық бақылау бекетін, фитосанитариялық бақылау бекетін, сондай-ақ өсiмдiктер карантинi жөнiндегi мемлекеттік инспекторды, мемлекеттік ветеринариялық-санитариялық инспекторды қамтамасыз етудің заттай нормаларын бекіту туралы
