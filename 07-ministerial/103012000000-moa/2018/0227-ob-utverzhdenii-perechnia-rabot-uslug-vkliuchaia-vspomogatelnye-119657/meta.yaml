act_code: '119657'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 27 февраля 2018 года № 92. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 марта 2018 года № 16606. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 22 октября 2025 года № 391 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении перечня работ (услуг), включая вспомогательные, выполняемые (оказываемые) сельскохозяйственными кооперативами для своих членов, а также перечня товаров, реализуемых сельскохозяйственными кооперативами своим членам
  kaz: Қосалқыларды қоса алғанда, ауыл шаруашылығы кооперативтері өз мүшелері үшін орындайтын (көрсететін) жұмыстардың (қызметтердің) тізбесін, сондай-ақ ауыл шаруашылығы кооперативтері өз мүшелеріне өткізетін тауарлардың тізбесін бекіту туралы
