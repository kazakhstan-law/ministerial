act_code: '119711'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 23 февраля 2018 года № 86. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 марта 2018 года № 16607. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 30 сентября 2025 года № 337 (вводятся в действие с 1 января 2026 года)
title:
  rus: Об утверждении перечня специализированной сельскохозяйственной техники, по которым юридические лица – производители сельскохозяйственной продукции, продукции аквакультуры (рыбоводства), а также глава и (или) члены крестьянского или фермерского хозяйства по используемой в процессе собственного производства сельскохозяйственной продукции не являются плательщиками налога на транспортные средства
  kaz: Ауыл шаруашылығы өнімін, акваөсіру (балық өсіру шаруашылығы) өнімін өндіруші заңды тұлғалар, сондай-ақ шаруа немесе фермер қожалығының басшысы және (немесе) мүшелері өз өндірісі процесінде пайдаланылатын ауыл шаруашылығы өнімі бойынша көлік құралдарына салық төлеуші болып табылмайтын мамандандырылған ауыл шаруашылығы техникалары тізбесін бекіту туралы
