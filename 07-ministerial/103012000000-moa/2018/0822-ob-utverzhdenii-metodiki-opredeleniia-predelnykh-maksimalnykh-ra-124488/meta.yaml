act_code: '124488'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 22 августа 2018 года № 353. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 сентября 2018 года № 17365
title:
  rus: Об утверждении Методики определения предельных (максимальных) размеров земельных участков сельскохозяйственного назначения, которые могут находиться у гражданина Республики Казахстан для ведения крестьянского или фермерского хозяйства, негосударственного юридического лица Республики Казахстан и его аффилированных лиц для ведения сельскохозяйственного производства
  kaz: Шаруа немесе фермер қожалығын жүргізу үшін – Қазақстан Республикасының азаматында, ауыл шаруашылығы өндірісін жүргізу үшін Қазақстан Республикасының мемлекеттік емес заңды тұлғасы мен оның үлестес тұлғаларында болуы мүмкін ауыл шаруашылығы мақсатындағы жер учаскелерінің шекті (ең жоғары) мөлшерлерін айқындау әдістемесін бекіту туралы
