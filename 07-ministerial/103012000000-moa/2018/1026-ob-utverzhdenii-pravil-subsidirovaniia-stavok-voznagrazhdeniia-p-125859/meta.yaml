  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра Республики Казахстан – Министра сельского хозяйства Республики Казахстан от 26 октября 2018 года № 436 «Об утверждении Правил субсидирования ставок вознаграждения по кредитам и лизингу технологического оборудования, на приобретение сельскохозяйственных животных, а также лизингу сельскохозяйственной техники»
    kaz: «Кредиттер және технологиялық жабдықтың, ауыл шаруашылығы малын сатып алудың лизингі, сондай-ақ ауыл шаруашылығы техникасының лизингі бойынша сыйақы мөлшерлемелерін субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің 2018 жылғы 26 қазандағы № 436 бұйрығына өзгерістер енгізу туралы
