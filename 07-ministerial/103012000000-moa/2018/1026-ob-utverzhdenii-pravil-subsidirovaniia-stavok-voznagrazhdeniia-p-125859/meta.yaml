act_code: '125859'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 26 октября 2018 года № 436. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 ноября 2018 года № 17741
title:
  rus: Об утверждении Правил субсидирования ставок вознаграждения при кредитовании субъектов агропромышленного комплекса, а также лизинге на приобретение сельскохозяйственных животных, техники и технологического оборудования
  kaz: Агроөнеркәсіптік кешен субъектілеріне кредит беру, сондай-ақ ауыл шаруашылығы жануарларын, техникасы мен технологиялық жабдығын сатып алуға лизинг кезінде сыйақы мөлшерлемелерін субсидиялау қағидаларын бекіту туралы
