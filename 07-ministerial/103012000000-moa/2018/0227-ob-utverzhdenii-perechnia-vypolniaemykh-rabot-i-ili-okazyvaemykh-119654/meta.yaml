requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 27 февраля 2018 года № 90. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 марта 2018 года № 16610. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 22 октября 2025 года № 391 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении перечня выполняемых работ и (или) оказываемых услуг сельскохозяйственными кооперативами своим членам в целях осуществления ими оборотов
  kaz: Ауыл шаруашылығы кооперативтері өз мүшелеріне олардың айналымдарды жүзеге асыруы мақсатында орындайтын жұмыстардың және (немесе) көрсететін қызметтердің тізбесін бекіту туралы
