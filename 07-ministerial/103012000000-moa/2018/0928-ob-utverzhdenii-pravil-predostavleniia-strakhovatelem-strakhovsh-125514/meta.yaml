act_code: '125514'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 28 сентября 2018 года № 401. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 октября 2018 года № 17627. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 20 октября 2020 года № 321 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил предоставления страхователем, страховщиком, агентом и обществом информации и документов, необходимых для осуществления местным исполнительным органом области, города республиканского значения и столицы контрольных функций
  kaz: Облыстың, республикалық маңызы бар қаланың және астананың жергілікті атқарушы органы бақылау функцияларын жүзеге асыруы үшін қажетті ақпарат пен құжаттарды сақтанушының, сақтандырушының, агенттің және қоғамның беру қағидаларын бекіту туралы
