act_code: '122151'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 5 мая 2018 года № 194. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 мая 2018 года № 16949. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 29 октября 2025 года № 397 (вводится в действие с 1 января 2026 года)
