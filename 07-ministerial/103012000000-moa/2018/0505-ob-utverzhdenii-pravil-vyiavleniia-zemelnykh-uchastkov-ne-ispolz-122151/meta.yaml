  title:
    rus: О внесении изменений и дополнений в приказ Заместителя Премьер-Министра Республики Казахстан – Министра сельского хозяйства Республики Казахстан от 5 мая 2018 года № 194 «Об утверждении Правил выявления земельных участков, не используемых в соответствующих целях или используемых с нарушением законодательства Республики Казахстан»
    kaz: «Тиісті мақсаттарда пайдаланылмайтын немесе Қазақстан Республикасының заңнамасы бұзыла отырып пайдаланылатын жер учаскелерін анықтау қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің 2018 жылғы 5 мамырдағы № 194 бұйрығына өзгерістер мен толықтырулар енгізу туралы
