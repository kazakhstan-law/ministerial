title:
  rus: Об утверждении Положения о порядке признания племенного свидетельства или эквивалентного ему документа, выданного на импортированную племенную продукцию (материал) компетентными органами стран-экспортеров
  kaz: Экспорттаушы елдердің құзыретті органдары импортталған асыл тұқымды өнімге (материалға) берген асыл тұқымдық куәлікті немесе оған балама құжатты тану тәртібі туралы ережені бекіту туралы
