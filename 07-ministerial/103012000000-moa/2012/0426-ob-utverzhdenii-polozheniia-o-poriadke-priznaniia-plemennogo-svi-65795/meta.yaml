  title:
    rus: Об утверждении Регламента государственной услуги "Признание племенного свидетельства или эквивалентного ему документа, выданного на импортированную племенную продукцию (материал) компетентными органами стран-экспортеров, за исключением племенного свидетельства или эквивалентного ему документа, выданного компетентными органами стран экспортеров на импортированную племенную продукцию (материал) крупного рогатого скота" и внесения изменения в приказ и.о. Министра сельского хозяйства Республики Казахстан от 26 апреля 2012 года № 18-02/212 "Об утверждении Положения о порядке признания племенного свидетельства или эквивалентного ему документа, выданного на импортированную племенную продукцию (материал) компетентными органами стран-экспортеров"
    kaz: '"Экспорттаушы елдердің құзыретті органдары ірі қара малдың импортталған асыл тұқымдық өніміне (материалына) берген асыл тұқымдық куәлікті немесе оған балама құжатты қоспағанда, экспорттаушы елдердің құзыретті органдары импортталған асыл тұқымдық өнімге (материалға) берген асыл тұқымдық куәлікті немесе оған балама құжатты тану" мемлекеттік көрсетілетін қызметтің регламентін бекіту және "Экспорттаушы елдердің құзыретті органдары импортталған асыл тұқымды өнімге (материалға) берген асыл тұқымдық куәлікті немесе оған балама құжатты тану тәртібі туралы қағиданы бекіту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің м.а. 2012 жылғы 26 сәуірдегі № 18-02/212 бұйрығына өзгеріс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/81577/rus
