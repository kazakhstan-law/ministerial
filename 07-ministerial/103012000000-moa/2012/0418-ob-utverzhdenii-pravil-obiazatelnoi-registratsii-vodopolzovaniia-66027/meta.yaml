  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 18 апреля 2012 года № 19-02/183 «Об утверждении Правил регистрации заключения уполномоченного органа в области санитарно-эпидемиологического благополучия населения, выдаваемого физическим и юридическим лицам на поверхностные и подземные водные объекты, использующиеся для нецентрализованного питьевого и хозяйственно-бытового водоснабжения населения»
    kaz: «Жеке және заңды тұлғаларға халықты орталықтандырылмаған ауыз сумен және шаруашылық-тұрмыстық сумен жабдықтау үшін пайдаланылатын жерүсті және жерасты су объектілеріне халықтың санитариялық-эпидемиологиялық салауаттылығы саласындағы уәкілетті орган беретін қорытындыны тіркеу қағидасын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2012 жылғы 18 сәуірдегі № 19-02/183 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/98036/rus
