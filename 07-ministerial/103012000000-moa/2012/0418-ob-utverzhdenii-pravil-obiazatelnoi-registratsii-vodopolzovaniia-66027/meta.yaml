requisite: Приказ Министра сельского хозяйства Республики Казахстан от 18 апреля 2012 года № 19-02/183. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 мая 2012 года № 7678. Утратил силу приказом Министра водных ресурсов и ирригации Республики Казахстан от 10 июня 2025 года № 125-НҚ (вводится в действие с 10 июня 2025 года)
title:
  rus: Об утверждении Правил обязательной регистрации водопользования местными исполнительными органами областей, городов республиканского значения, столицы
  kaz: Облыстардың, республикалық маңызы бар қалалардың, астананың жергілікті атқарушы органдарының су пайдалануды міндетті тіркеу қағидаларын бекіту туралы
