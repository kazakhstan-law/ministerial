act_code: '65823'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 22 мая 2012 года № 3-2/262. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 мая 2012 года № 7683
title:
  rus: Об утверждении объемов бюджетных субсидий выделенных по регионам по направлениям государственной поддержки по видам племенной продукции (материала), а также годовой сметы распределения средств республиканскому племенному центру, племенному хозяйству по мясному птицеводству, племенному заводу по костанайской породе лошадей
  kaz: Асыл тұқымды өнiм (материал) түрлерiн мемлекеттік қолдау бағыттары бойынша өңірлерге бөлінген бюджеттiк субсидиялардың көлемiн, сондай-ақ республикалық малды асылдандыру орталығына, еттi құс шаруашылығы бойынша асылдандыру шаруашылығына, қостанай жылқы тұқымы бойынша асыл тұқымды жылқы зауытына қаражат бөлудiң жылдық сметасын бекiту туралы
