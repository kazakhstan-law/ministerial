  title:
    rus: О внесении изменения в приказ Министра сельского хозяйства Республики Казахстан от 22 мая 2012 года № 3-2/262 "Об утверждении объемов бюджетных субсидий выделенных по регионам по направлениям государственной поддержки по видам племенной продукции (материала), а также годовой сметы распределения средств республиканскому племенному центру, племенному хозяйству по мясному птицеводству, племенному заводу по костанайской породе лошадей"
    kaz: '"Асыл тұқымды өнiм (материал) түрлерiн мемлекеттік қолдау бағыттары бойынша өңірлерге бөлінген бюджеттiк субсидиялардың көлемiн, сондай-ақ республикалық малды асылдандыру орталығына, еттi құс шаруашылығы бойынша асылдандыру шаруашылығына, қостанай жылқы тұқымы бойынша асыл тұқымды жылқы зауытына қаражат бөлудiң жылдық сметасын бекiту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің 2012 жылғы 22 мамырдағы № 3-2/262 бұйрығына өзгеріс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/69451/rus
