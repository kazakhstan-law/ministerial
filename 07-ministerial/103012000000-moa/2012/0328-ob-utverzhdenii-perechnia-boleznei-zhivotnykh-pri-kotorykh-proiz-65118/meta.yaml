title:
  rus: Об утверждении перечня болезней животных, при которых производятся обязательное обезвреживание (обеззараживание) и переработка без изъятия животных, продукции и сырья животного происхождения, ветеринарных препаратов, кормов и кормовых добавок, представляющих опасность для здоровья животных и человека
  kaz: Жануарлардың және адамның денсаулығына қауiп төндiретiн жануарларды, жануарлардан алынатын өнiмдер мен шикiзатты, ветеринариялық препараттарды, жемшөп пен жемшөптiк қоспаларды алып қоймай-ақ, мiндеттi түрде залалсыздандыру (зарарсыздандыру) және өңдеу жүргiзiлетiн жануарлар ауруларының тiзбесiн бекіту туралы
