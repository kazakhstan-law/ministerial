title:
  rus: Об утверждении Правил проведения инвентаризации лесных культур, питомников, площадей с проведенными мерами содействия естественному возобновлению леса и оставленных под естественное заращивание в государственном лесном фонде
  kaz: Орман ағаштарын, питомниктерді, табиғи түрде қайта түлеуге ықпал ету шаралары жүргiзілген және мемлекеттік орман қорында табиғи өсірілуге қалдырылған алқаптарды түгендеуді жүргізу қағидасын бекіту туралы
