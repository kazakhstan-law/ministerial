  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра сельского хозяйства Республики Казахстан от 19 октября 2012 года № 17-02/532 «Об утверждении Правил проведения инвентаризации лесных культур, питомников, площадей с проведенными мерами содействия естественному возобновлению леса и оставленных под естественное заращивание в государственном лесном фонде»
