  kaz: Орман ағаштарын, питомниктерді, табиғи түрде қайта түлеуге ықпал ету шаралары жүргiзілген және мемлекеттік орман қорында табиғи өсірілуге қалдырылған алқаптарды түгендеуді жүргізу қағидасын бекіту туралы
