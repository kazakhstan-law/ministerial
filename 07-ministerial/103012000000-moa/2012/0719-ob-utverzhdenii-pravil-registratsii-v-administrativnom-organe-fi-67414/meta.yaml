requisite: Приказ Министра сельского хозяйства Республики Казахстан от 19 июля 2012 года № 17-03/369. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 августа 2012 года № 7847. Утратил силу приказом Министра охраны окружающей среды Республики Казахстан от 5 сентября 2013 года № 270-Ө
title:
  rus: Об утверждении Правил регистрации в административном органе физических и юридических лиц, осуществляющих искусственное разведение животных, виды которых включены в приложения I и II Конвенции о международной торговле видами дикой фауны и флоры, находящихся под угрозой исчезновения
  kaz: Жабайы фауна мен флораның құрып кету қаупі төнген түрлерінің халықаралық саудасы туралы конвенцияның І және ІІ – қосымшаларына түрлері енгізілген жануарларды жасанды өсіруді жүзеге асыратын жеке және заңды тұлғаларды әкімшілік органда тіркеу қағидасын бекіту туралы
