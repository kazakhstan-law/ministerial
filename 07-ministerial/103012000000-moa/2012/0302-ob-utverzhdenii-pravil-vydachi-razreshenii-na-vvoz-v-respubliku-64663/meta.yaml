requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 2 марта 2012 года № 25-02/86. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 апреля 2012 года № 7562. Утратил силу приказом Министра окружающей среды и водных ресурсов Республики Казахстан от 15 июля 2014 года № 268-Ө
title:
  rus: Об утверждении Правил выдачи разрешений на ввоз в Республику Казахстан и вывоз за ее пределы объектов растительного мира, их частей и дериватов, в том числе видов растений, отнесенных к категории редких и находящихся под угрозой исчезновения
  kaz: Өсімдіктер дүниесінің объектілерін, олардың бөліктері мен дериваттарын, оның ішінде сирек кездесетін және құрып кету қаупі төнген санатқа жатқызылған өсімдіктер түрлерін Қазақстан Республикасына әкелуге және одан тысқары жерлерге әкетуге рұқсаттар беру қағидасын бекіту туралы
