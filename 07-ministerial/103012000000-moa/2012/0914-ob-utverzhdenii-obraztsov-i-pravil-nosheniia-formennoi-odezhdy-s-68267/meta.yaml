  kaz: Қазақстан Республикасының мемлекеттік орман инспекциясы мен Қазақстан Республикасы мемлекеттік орман күзетінің лауазымды адамдарының айырым белгілері бар нысанды киім (погонсыз) үлгілерін және оны киіп жүру қағидаларын бекіту туралы
