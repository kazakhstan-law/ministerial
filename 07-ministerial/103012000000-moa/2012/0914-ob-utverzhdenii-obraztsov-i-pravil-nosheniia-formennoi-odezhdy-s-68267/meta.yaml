  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 14 сентября 2012 года № 25-02/457 «Об утверждении образцов и Правил ношения форменной одежды со знаками различия (без погон) должностных лиц государственной лесной инспекции и государственной лесной охраны Республики Казахстан»
    kaz: «Қазақстан Республикасының мемлекеттік орман инспекциясы мен мемлекеттік орман күзетінің лауазымды адамдарының айырым белгілері бар нысанды киім (погонсыз) үлгілерін және оны киіп жүру қағидасын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2012 жылғы 14 қыркүйектегі № 25-02/457 бұйрығына өзгерістер енгізу туралы
