title:
  rus: Об утверждении Правил определения соответствия серий (партий) ветеринарных препаратов, кормов и кормовых добавок и (или) ветеринарных препаратов, кормов и кормовых добавок, содержащих антибиотики, гормоны и биологические стимуляторы, требованиям ветеринарных нормативов
  kaz: Ветеринариялық препараттардың, жемшөп пен жемшөп қоспаларының және (немесе) антибиотиктерi, гормондары және биологиялық стимуляторлары бар ветеринариялық препараттардың, жемшөп пен жемшөп қоспаларының серияларының (топтарының) ветеринариялық нормативтердің талаптарына сәйкестігін айқындау қағидаларын бекіту туралы
