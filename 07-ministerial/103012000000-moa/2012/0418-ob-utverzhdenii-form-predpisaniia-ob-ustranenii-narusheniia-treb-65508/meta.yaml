act_code: '65508'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 18 апреля 2012 года № 18-03/179. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 мая 2012 года № 7634. Утратил силу приказом Заместителя Премьер - Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 11 ноября 2016 года № 471.
title:
  rus: Об утверждении форм предписания об устранении нарушения требований законодательства Республики Казахстан о зерне, протокола об административном правонарушении, постановления по делу об административном правонарушении
  kaz: Қазақстан Республикасы астық туралы заңнамасы талаптарының бұзылуын жою туралы нұсқаманың, әкімшілік құқық бұзушылық туралы хаттаманың, әкімшілік құқық бұзушылық туралы іс жөніндегі қаулының нысандарын бекіту туралы
