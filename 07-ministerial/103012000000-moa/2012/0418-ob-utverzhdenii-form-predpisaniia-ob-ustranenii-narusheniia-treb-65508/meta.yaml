  requisite: Приказ Министра сельского хозяйства Республики Казахстан от 2 сентября 2015 года № 4-6/794. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 октября 2015 года № 12203. Утратил силу приказом Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 11 ноября 2016 года № 471
  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 18 апреля 2012 года № 18-03/179 "Об утверждении форм предписания об устранении нарушения требований законодательства Республики Казахстан о зерне, протокола об административном правонарушении, постановления по делу об административном правонарушении"
    kaz: «Қазақстан Республикасының астық туралы заңнамасының талаптарын бұзушылықтарды жою туралы нұсқаманың, әкімшілік құқық бұзушылық туралы хаттаманың, әкімшілік құқық бұзушылық туралы іс бойынша қаулының нысандарын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы Министрінің 2012 жылғы 18 сәуірдегі № 18-03/179 бұйрығына өзгерістер енгізу туралы
