title:
  rus: Об утверждении образцов аншлагов границ охотничьих хозяйств, воспроизводственных участков и зон покоя, а также запретные для охоты сроки и места
  kaz: Аңшылық шаруашылықтар, өсімін молайту учаскелері мен тыныштық аймақтары, балық шаруашылығы су айдындарының және (немесе) учаскелерінің шекаралары аншлагтарының үлгілерін, сондай-ақ аң аулау мен балық аулау үшін тыйым салынған мерзімдер мен орындарды, балық ресурстарын және басқа да су жануарларын аулауды есепке алу журналының (кәсіпшілік журналдың) нысанын бекіту туралы
