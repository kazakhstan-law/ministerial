  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 13 марта 2012 года № 25-03-02/96 «Об утверждении образцов аншлагов границ охотничьих хозяйств, воспроизводственных участков и зон покоя, рыбохозяйственных водоемов и (или) участков, а также запретные для охоты и рыболовства сроки и места, форму журнала учета лова рыбных ресурсов и других водных животных (промысловый журнал)»
    kaz: '«Аншлагтарының үлгілерін және аңшылық шаруашылықтар, өсімін молайту учаскелері мен тыныштық аймақтары, балық шаруашылығы су айдындарының және (немесе) учаскелерінің шекараларын, сондай-ақ аң аулау мен балық аулау үшін тыйым салынған мерзімдер мен орындарды, балық ресурстарын және басқа да су жануарларын аулауды есепке алу журналының (кәсіпшілік журналдың) нысанын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2012 жылғы 13 наурыздағы № 25-03-02/96 бұйрығына өзгерістер енгізу туралы '
