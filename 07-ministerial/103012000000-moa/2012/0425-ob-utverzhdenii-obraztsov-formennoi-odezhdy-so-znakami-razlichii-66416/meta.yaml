act_code: '66416'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 25 апреля 2012 года № 25-03/206. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 мая 2012 года № 7685
title:
  rus: Об утверждении образцов форменной одежды со знаками различия (без погон), правил ношения и нормы обеспечения ею должностных лиц ведомства уполномоченного органа и его территориальных подразделений, осуществляющих государственный контроль и надзор в области охраны, воспроизводства и использования животного мира, а также работников государственных учреждений и организаций, осуществляющих непосредственную охрану животного мира
  kaz: Жануарлар дүниесін қорғау, өсімін молайту және пайдалану саласындағы мемлекеттік бақылауды және қадағалауды жүзеге асыратын уәкілетті орган ведомствосының және оның аумақтық бөлімшелерінің лауазымды адамдарының, сондай-ақ жануарлар дүниесін қорғауды тікелей жүзеге асыратын мемлекеттік мекемелер мен ұйымдар жұмыскерлерінің айырым белгілері бар нысанды киім (погонсыз) үлгілерін, оны киіп жүру қағидаларын және онымен қамтамасыз ету нормаларын бекіту туралы
