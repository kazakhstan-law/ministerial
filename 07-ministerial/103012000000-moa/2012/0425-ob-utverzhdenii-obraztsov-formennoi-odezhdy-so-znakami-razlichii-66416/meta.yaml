  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 25 апреля 2012 года № 25-03/206 «Об утверждении образцов форменной одежды со знаками различия (без погон), правил ношения и нормы обеспечения ею должностных лиц уполномоченного органа и территориальных подразделений, осуществляющих государственный контроль и надзор в области охраны, воспроизводства и использования животного мира, а также работников государственных учреждений и организаций, осуществляющих непосредственную охрану животного мира»
    kaz: «Жануарлар дүниесiн қорғау, өсiмiн молайту және пайдалану саласындағы мемлекеттiк бақылауды және қадағалауды жүзеге асыратын уәкiлеттi органның және оның аумақтық бөлімшелерінің лауазымды адамдарының, сондай-ақ жануарлар дүниесiн қорғауды тiкелей жүзеге асыратын мемлекеттiк мекемелер мен ұйымдар қызметкерлерiнiң айырым белгілері бар нысанды киiм (погонсыз) үлгiлерiн, киіп жүру қағидасын және онымен қамтамасыз ету нормаларын бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2012 жылғы 25 сәуірдегі № 25-03/206 бұйрығына өзгерістер енгізу туралы
