  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 18 апреля 2012 года № 4-2/180 "Об утверждении квот за фактически приобретенные по рыночной стоимости объемы элитных семян по каждому виду семян на 2012 год, квот за фактически реализованные отечественным сельскохозяйственным товаропроизводителям по удешевленной стоимости объемы элитных семян кукурузы, подсолнечника, риса, сахарной свеклы, хлопчатника и саженцев по каждому виду саженцев для каждой области на 2012 год"
    kaz: '"2012 жылға арналған тұқымның әрбір түрі бойынша нарықтық бағамен нақты сатып алынған элиталық тұқымның көлемі үшін квоталарды, 2012 жылға арналған әр облысқа отандық ауыл шаруашылығы тауар өндірушілері арзандатылған бағамен жүгерінің, күнбағыстың, күріштің, қант қызылшасының, мақтаның элиталық тұқымдары мен көшеттердің нақты сатқан көлемі үшін квоталарды бекіту туралы" Қазақстан Республикасы Ауыл шаруашылығы министрінің 2012 жылғы 18 сәуірдегі № 4-2/180 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/69071/rus
