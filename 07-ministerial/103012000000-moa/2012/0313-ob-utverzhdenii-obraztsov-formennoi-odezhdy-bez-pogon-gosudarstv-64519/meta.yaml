title:
  rus: Об утверждении образцов форменной одежды (без погон) государственных ветеринарно-санитарных инспекторов на ветеринарных контрольных постах и Правил ношения форменной одежды (без погон) государственных ветеринарно-санитарных инспекторов на ветеринарных контрольных постах
  kaz: Ветеринариялық бақылау бекеттеріндегі мемлекеттік ветеринариялық-санитариялық инспекторлардың нысанды киімнің (погонсыз) үлгілерін және Ветеринариялық бақылау бекеттеріндегі мемлекеттік ветеринариялық-санитариялық инспекторлардың нысанды киімнің (погонсыз) киіп жүру ережесін бекіту туралы
