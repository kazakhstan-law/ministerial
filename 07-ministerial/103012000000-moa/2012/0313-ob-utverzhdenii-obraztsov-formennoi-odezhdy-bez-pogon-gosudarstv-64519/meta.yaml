  title:
    rus: О внесении изменений в приказ Министра сельского хозяйства Республики Казахстан от 13 марта 2012 года № 30/98 «Об утверждении образцов форменной одежды (без погон) государственных ветеринарно-санитарных инспекторов на ветеринарных контрольных постах и Правил ношения форменной одежды (без погон) государственных ветеринарно-санитарных инспекторов на ветеринарных контрольных постах»
    kaz: «Ветеринариялық бақылау бекеттеріндегі мемлекеттік ветеринариялық-санитариялық инспекторлардың нысанды киімнің (погонсыз) үлгілерін және Ветеринариялық бақылау бекеттеріндегі мемлекеттік ветеринариялық-санитариялық инспекторлардың нысанды киімнің (погонсыз) киіп жүру ережесін бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрінің 2012 жылғы 13 наурыздағы № 30/98 бұйрығына өзгерістер енгізу туралы
