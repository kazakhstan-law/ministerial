  requisite: Приказ Министра сельского хозяйства Республики Казахстан от 13 октября 2010 года № 652. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 ноября 2010 года № 6623. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 17 января 2012 года № 10-1/18
  title:
    rus: О внесении изменений и дополнений в приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 8 сентября 2003 года № 467 "Об утверждении Правил государственной регистрации тракторов и изготовленных на их базе самоходных шасси и механизмов, прицепов к ним, включая прицепы со смонтированным специальным оборудованием, самоходных сельскохозяйственных, мелиоративных и дорожно-строительных машин и механизмов, а также специальных машин повышенной проходимости"
    kaz: '"Тракторларды және олардың базасында жасалған өзi жүретiн шассилер мен механизмдердi, олардың тiркемелерiн, соған қоса арнайы жабдық орнатылған тiркемелердi, өзi жүретiн ауыл шаруашылығы, мелиоративтiк және жол-құрылысы машиналары мен механизмдерiн, сондай-ақ жоғары өтімді арнайы машиналарды мемлекеттiк тiркеу ережелерiн бекiту туралы" Қазақстан Республикасы Премьер-Министрінің орынбасары - Қазақстан Республикасы Ауыл шаруашылығы министрінің 2003 жылғы 8 қыркүйектегі N 467 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/55958/rus
