act_code: '17527'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 8 сентября 2003 года № 467. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 ноября 2003 года № 2564. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 17 января 2012 года № 10-1/18
title:
  rus: Об утверждении Правил государственной регистрации тракторов и изготовленных на их базе самоходных шасси и механизмов, прицепов к ним, включая прицепы со смонтированным специальным оборудованием, самоходных сельскохозяйственных, мелиоративных и дорожно-строительных машин и механизмов, а также специальных машин повышенной проходимости
  kaz: Тракторларды және олардың базасында жасалған өзi жүретiн шассилер мен механизмдердi, олардың тiркемелерiн, соған қоса арнайы жабдық орнатылған тiркемелердi, өзi жүретiн ауыл шаруашылығы, мелиоративтiк және жол-құрылысы машиналары мен механизмдерiн, сондай-ақ жоғары өтімді арнайы машиналарды мемлекеттiк тiркеу ережелерiн бекiту туралы
