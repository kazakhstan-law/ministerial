  requisite: Приказ и.о. Министра сельского хозяйства Республики Казахстан от 21 мая 2010 года № 342. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 мая 2010 года № 6256. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 17 января 2012 года № 10-1/18
  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра Республики Казахстан – Министра сельского хозяйства Республики Казахстан от 8 сентября 2003 года № 467 "Об утверждении Правил государственной регистрации тракторов и изготовленных на их базе самоходных шасси и механизмов, прицепов к ним, включая прицепы со смонтированным специальным оборудованием, самоходных сельскохозяйственных, мелиоративных и дорожно-строительных машин и механизмов, а также специальных машин повышенной проходимости"
    kaz: '"Тракторларды және олардың базасында жасалған өзі жүретін шассилер мен механизмдерді, олардың тіркемелерін, соған қоса арнайы жабдық орнатылған тіркемелерді, өзі жүретін ауыл шаруашылығы, мелиоративтік және жол-құрылысы машиналары мен механизмдерін, сондай-ақ жоғары өтімді арнайы машиналарды мемлекеттік тіркеу ережелерді бекіту туралы" Қазақстан Республикасы Премьер-Министрінің орынбасары – Қазақстан Республикасы Ауыл шаруашылығы министрінің 2003 жылғы 8 қыркүйектегі № 467 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/52879/rus
