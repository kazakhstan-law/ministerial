title:
  rus: Об утверждении Инструкции по осуществлению государственного контроля должностными лицами уполномоченных органов и их территориальных органов в области лесного, рыбного и охотничьего хозяйства и особо охраняемых природных территорий
  kaz: Орман, балық және аңшылық шаруашылығы мен ерекше қорғалатын табиғи аумақтар саласындағы уәкілетті органдардың және олардың аумақтық органдарының лауазымды тұлғалары өсімдік және жануарлар дүниесін қорғауға мемлекеттік бақылауды жүзеге асыру бойынша Нұсқауды бекіту туралы
