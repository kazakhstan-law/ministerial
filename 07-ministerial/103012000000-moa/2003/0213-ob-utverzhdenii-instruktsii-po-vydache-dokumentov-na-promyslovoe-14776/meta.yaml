  kaz: Қазақстан Республикасы су айдындарындағы балық ресурстарын және басқа да су жануарларын кәсіптік пайдалануға рұқсат құжаттарын беру, тоқтату және олардың іс-әрекетін қайта жаңарту туралы Нұсқаулықты бекіту туралы
