act_code: '17526'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра сельского хозяйства Республики Казахстан от 8 сентября 2003 года № 468. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 ноября 2003 года № 2563. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 17 января 2012 года № 10-1/18
title:
  rus: Об утверждении Правил проведения ежегодного государственного технического осмотра тракторов и изготовленных на их базе самоходных шасси и механизмов, прицепов к ним, включая прицепы со смонтированным специальным оборудованием, самоходных сельскохозяйственных, мелиоративных и дорожно-строительных машин и механизмов, а также специальных машин повышенной проходимости
  kaz: Тракторларға және олардың базасында жасалған өзi жүретiн шассилер мен механизмдерге, олардың тiркемелерiне, соған қоса арнайы жабдық орнатылған тiркемелерге, өзi жүретiн ауыл шаруашылығы, мелоративтiк және жол-құрылысы машиналары мен механизмдерiне, сондай-ақ жоғары өтімді арнайы машиналарға жыл сайынғы мемлекеттiк байқау өткiзу ережелерiн бекiту туралы
