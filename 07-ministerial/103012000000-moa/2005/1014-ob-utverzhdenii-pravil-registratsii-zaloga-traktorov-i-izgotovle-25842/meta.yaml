act_code: '25842'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 14 октября 2005 года № 597. Зарегистрирован в Министерстве юстиции Республики Казахстан от 10 ноября 2005 года № 3928. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 17 января 2012 года № 10-1/18
title:
  rus: Об утверждении Правил регистрации залога тракторов и изготовленных на их базе самоходных шасси и механизмов, прицепов к ним, включая прицепы со смонтированным специальным оборудованием, самоходных сельскохозяйственных, мелиоративных и дорожно-строительных машин и механизмов, а также специальных машин повышенной проходимости
  kaz: Тракторлардың және олардың базасында жасалған өздігінен жүретін шассилер мен механизмдердің, монтаждалған арнайы жабдығы бар механизмдерді қоса алғанда, олардың тіркемелерінің, өздігінен жүретін ауыл шаруашылығы, мелиоративтік және жол-құрылыс машиналары мен механизмдердің, сондай-ақ жоғары өтімді арнайы машиналардың кепілін тіркеу ережесін бекіту туралы
