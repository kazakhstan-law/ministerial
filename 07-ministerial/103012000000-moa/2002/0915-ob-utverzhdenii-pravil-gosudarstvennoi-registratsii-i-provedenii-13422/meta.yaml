act_code: '13422'
requisite: Приказ Министра сельского хозяйства Республики Казахстан от 16 сентября 2002 года N 282. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 октября 2002 года N 2015/1. Утратил силу - приказом Министра сельского хозяйства Республики Казахстан от 8 сентября 2003 года N 467 (V032564)
title:
  rus: Об утверждении Правил государственной регистрации и проведения осмотра технического состояния колесных тракторов, включая изготовленных на их базе самоходных шасси и механизмов, а также прицепов, предназначенных для движения в составе с колесными тракторами
  kaz: Қазақстан Республикасында доңғалақты тракторларды, соған қоса олардың базасында жасалған өзі жүретін шассилер мен механизмдерді, сондай-ақ доңғалақты тракторлар құрамында жүруге арналған тіркемелерді мемлекеттік тіркеу және олардың техникалық жай-күйіне тексеру жүргізу ережесін бекіту туралы
