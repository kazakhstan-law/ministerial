  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства по стратегическому планированию и реформам Республики Казахстан от 23 октября 2020 года № 9-нқ «Об утверждении Положения о Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан»
    kaz: «Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің Ұлттық статистика бюросы туралы ережені бекіту туралы» Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі төрағасының 2020 жылғы 23 қазандағы № 9-нқ бұйрығына өзгерістер мен толықтырулар енгізу туралы
