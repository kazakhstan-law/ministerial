title:
  rus: Об утверждении Перечня видов деятельности, технологически связанных с производством товаров, работ, услуг субъекта государственной монополии в области государственной статистики
  kaz: Мемлекеттік статистика саласындағы мемлекеттік монополия субъектісінің тауарларды, жұмыстарды, көрсетілетін қызметтерді өндірумен технологиялық байланысты қызмет түрлерінің тізбесін бекіту туралы
