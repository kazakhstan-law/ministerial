  title:
    rus: О внесении дополнения в приказ Председателя Агентства по стратегическому планированию и реформам Республики Казахстан от 11 февраля 2022 года № 2 «Об утверждении Перечня видов деятельности, технологически связанных с производством товаров, работ, услуг субъекта государственной монополии в области государственной статистики»
    kaz: «Мемлекеттік статистика саласындағы мемлекеттік монополия субъектісінің тауарларды, жұмыстарды, көрсетілетін қызметтерді өндірумен технологиялық байланысты қызмет түрлерінің тізбесін бекіту туралы» Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі төрағасының 2022 жылғы 11 ақпандағы № 2 бұйрығына толықтыру енгізу туралы
