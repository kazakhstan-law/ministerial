act_code: '169303'
requisite: Приказ Председателя Агентства по стратегическому планированию и реформам Республики Казахстан от 24 июня 2022 года № 3. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 июня 2022 года № 28625
title:
  rus: Об утверждении перечня персональных данных, необходимого и достаточного для выполнения осуществляемых задач Агентством по стратегическому планированию и реформам Республики Казахстан, Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан и его территориальными подразделениями
  kaz: Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі, Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің Ұлттық статистика бюросы мен оның аумақтық бөлімшелері жүзеге асыратын міндеттерді орындау үшін қажетті және жеткілікті дербес деректердің тізбесін бекіту туралы
