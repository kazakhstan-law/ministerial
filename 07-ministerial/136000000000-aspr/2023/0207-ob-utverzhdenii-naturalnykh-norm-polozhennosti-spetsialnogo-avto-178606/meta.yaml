act_code: '178606'
requisite: Приказ Председателя Агентства по стратегическому планированию и реформам Республики Казахстан от 7 февраля 2023 года № 11. Утратил силу приказом Председателя Агентства по стратегическому планированию и реформам Республики Казахстан от 28 апреля 2025 года № 3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм положенности специального автотранспорта и натуральных норм площадей для специфических помещений Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан и его территориальных подразделений
  kaz: Қазақстан Республикасының Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының және оның аумақтық бөлімшелерінің арнайы автокөлігінің тиесілік заттай нормаларын және ерекше үй-жайлары үшін алаңдарының заттай нормаларын бекіту туралы
