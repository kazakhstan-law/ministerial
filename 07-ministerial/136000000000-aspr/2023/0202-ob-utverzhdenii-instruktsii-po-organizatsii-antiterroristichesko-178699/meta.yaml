act_code: '178699'
requisite: Приказ Председателя Агентства по стратегическому планированию и реформам Республики Казахстан от 2 февраля 2023 года № 9-ҚБПҮ. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 февраля 2023 года № 31862
title:
  rus: Об утверждении Инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, Агентства по стратегическому планированию и реформам Республики Казахстан, ведомства и его территориальных подразделений
  kaz: Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің, ведомствосының және оның аумақтық бөлімшелерінің террористік тұрғыдан осал объектілерінің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
