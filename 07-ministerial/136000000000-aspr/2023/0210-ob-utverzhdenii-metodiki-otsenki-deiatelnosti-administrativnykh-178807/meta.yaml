  title:
    rus: О внесении изменения в приказ Председателя Агентства по стратегическому планированию и реформам Республики Казахстан от 10 февраля 2023 года № 13 «Об утверждении Методики оценки деятельности Административных государственных служащих корпуса «Б» Агентства по стратегическому планированию и реформам Республики Казахстан»
    kaz: «Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі төрағасының 2023 жылғы 10 ақпандағы № 13 бұйрығына өзгеріс енгізу туралы
