    rus: О внесении изменений в приказ начальника Канцелярии Президента Республики Казахстан от 7 октября 2019 года № 19-42-3.3.17 «Об утверждении Реестра должностей гражданских служащих подведомственных государственных учреждений Администрации Президента Республики Казахстан»
    kaz: «Қазақстан Республикасы Президенті Әкімшілігінің ведомстволық бағынысты мемлекеттік мекемелерінің азаматтық қызметшілері лауазымдарының тізілімін бекіту туралы» Қазақстан Республикасы Президенті Кеңсесі бастығының 2019 жылғы 7 қазандағы № 19-42-3.3.17 бұйрығына өзгерістер енгізу туралы
