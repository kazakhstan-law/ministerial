requisite: Приказ Руководителя Администрации Президента Республики Казахстан от 15 мая 2017 года № 17-01-38.27. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 июня 2017 года № 15234
title:
  rus: Об утверждении Правил и условий исчисления стажа работы по специальности для гражданских служащих, работников организаций, содержащихся за счет средств государственного бюджета, работников казенных предприятий Администрации Президента Республики Казахстан
  kaz: Қазақстан Республикасы Президенті Әкімшілігінің азаматтық қызметшілері, мемлекеттік бюджет қаражаты есебінен ұсталатын ұйымдарының қызметкерлері, қазыналық кәсіпорындарының қызметкерлері үшін мамандығы бойынша жұмыс өтілін есептеу қағидалары мен шарттарын бекіту туралы
