act_code: '159965'
requisite: Приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 29 октября 2021 года № 317-НҚ. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 2 апреля 2024 года № 93-НҚ (вводится в действие со дня его подписания)
title:
  rus: Об утверждении натуральных норм специальных транспортных средств для транспортного обслуживания Агентства Республики Казахстан по финансовому мониторингу, его территориальных органов и специализированного государственного учреждения
  kaz: Қазақстан Республикасының Қаржылық мониторинг агенттігіне, оның аумақтық органдары мен мамандандырылған мемлекеттік мекемесіне көлік қызметін көрсетуге арналған арнайы көлік құралдарының заттай нормаларын бекіту туралы
