requisite: Приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 13 сентября 2021 года № 8. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 сентября 2021 года № 24368. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 31 октября 2022 года № 37 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и условий привлечения к дисциплинарной ответственности сотрудников органов по финансовому мониторингу (служба экономических расследований)
  kaz: Қаржылық мониторинг органдарының қызметкерлерін тәртіптік жауапкершілікке тарту қағидалары мен шарттарын бекіту туралы (экономикалық тергеп-тексеру қызметі)
