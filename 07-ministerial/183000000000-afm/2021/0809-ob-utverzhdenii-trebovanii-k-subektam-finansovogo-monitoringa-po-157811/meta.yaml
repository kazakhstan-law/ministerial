  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 9 августа 2021 года № 6 «Об утверждении Требований к субъектам финансового мониторинга по подготовке и обучению в сфере противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма»
    kaz: «Қаржы мониторингі субъктілеріне қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл саласындағы даярлау және оқыту бойынша қойылатын талаптарды бекіту туралы» Қазақстан Республикасының Қаржылық мониторинг агенттігі төрағасының 2021 жылғы 9 тамыздағы № 6 бұйрығына өзгерістер енгізу туралы
