title:
  rus: Об утверждении Требований к субъектам финансового мониторинга по подготовке и обучению в сфере противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения
  kaz: Қаржы мониторингі субъектілеріне қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл саласында даярлау және оқыту бойынша қойылатын талаптарды бекіту туралы
