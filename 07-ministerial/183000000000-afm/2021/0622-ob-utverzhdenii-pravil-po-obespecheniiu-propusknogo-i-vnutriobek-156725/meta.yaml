title:
  rus: Об утверждении Правил по обеспечению пропускного и внутриобъектового режимов административных зданиях службы экономических расследований органов по финансовому мониторингу
  kaz: Қаржылық мониторинг органдарының экономикалық тергеп-тексеру қызметінің әкімшілік ғимараттарында өткізу және объектішілік режимдерді қамтамасыз ету жөніндегі қағидаларды бекіту туралы
