  requisite: Приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 27 апреля 2023 года № 118-НҚ-ҚПБҮ. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 мая 2023 года № 32487
  title:
    rus: О внесении изменений и дополнения в приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 22 июня 2021 года № 144-НҚ-ҚБПҮ «Об утверждении Правил по обеспечению пропускного и внутриобъектового режимов в административных зданиях службы экономических расследований органов финансового мониторинга»
    kaz: «Қаржылық мониторинг органдары экономикалық тергеп-тексеру қызметінің әкімшілік ғимараттарында өткізу және объектішілік режимдерді қамтамасыз ету жөніндегі қағидаларды бекіту туралы» Қазақстан Республикасы  Қаржылық мониторинг агенттігі Төрағасының 2021 жылғы 22 маусымдағы № 144-НҚ-ҚПБҮ бұйрығына өзгерістер мен толықтырулар енгізу туралы
