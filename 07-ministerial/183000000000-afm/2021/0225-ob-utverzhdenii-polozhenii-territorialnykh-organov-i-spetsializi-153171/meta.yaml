  title:
    rus: О внесении дополнений и изменений в приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 25 февраля 2021 года № 2 «Об утверждении положений территориальных органов и специализированного государственного учреждения Агентства Республики Казахстан по финансовому мониторингу»
    kaz: «Қазақстан Республикасының Қаржылық мониторинг агенттігінің аумақтық органдары мен мамандандырылған мемлекеттік мекемесінің ережелерін бекіту туралы» Қазақстан Республикасының Қаржылық мониторинг агенттігі Төрағасының 2021 жылғы 25 ақпандағы № 2 бұйрығына толықтырулар мен өзгерістер енгізу туралы
