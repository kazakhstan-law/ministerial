title:
  rus: Об утверждении квалификационных требований к категориям должностей службы экономических расследований Агентства Республики Казахстан по финансовому мониторингу
  kaz: Қазақстан Республикасының Қаржылық мониторингі агенттігінің экономикалық тергеу қызметі қызметкерлерінің экономикалық тергеп-тексеру қызметі лауазымдарының санаттарына қойылатын біліктілік талаптарын бекіту туралы
