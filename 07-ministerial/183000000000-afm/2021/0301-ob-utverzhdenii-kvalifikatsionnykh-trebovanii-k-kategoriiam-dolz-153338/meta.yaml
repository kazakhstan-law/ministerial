  title:
    rus: О внесении изменения в приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 1 марта 2021 года № 5-ж/қ «Об утверждении квалификационных требований к категориям должностей службы экономических расследований Агентства Республики Казахстан по финансовому мониторингу»
    kaz: «Қазақстан Республикасы Қаржылық мониторинг агенттігінің экономикалық тергеп-тексеру қызметі лауазымдарының санаттарына қойылатын біліктілік талаптарын бекіту туралы» Қазақстан Республикасының Қаржылық мониторинг агенттігі Төрағасының 2021 жылғы 1 наурыздағы № 5-ж/қ бұйрығына өзгеріс енгізу туралы
