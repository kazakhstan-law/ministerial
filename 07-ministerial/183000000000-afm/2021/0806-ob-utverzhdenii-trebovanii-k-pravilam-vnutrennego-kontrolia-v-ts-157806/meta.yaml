  title:
    rus: О внесении изменения в приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 августа 2021 года № 4 «Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для не финансового сектора»
    kaz: «Қаржылық емес сектор үшін қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Қаржылық мониторинг агенттігі Төрағасының 2021 жылғы 6 тамыздағы № 4 бұйрығына өзгеріс енгізу туралы
