act_code: '171689'
requisite: Приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 16 сентября 2022 года № 33. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 сентября 2022 года № 29649
title:
  rus: Об утверждении Правил и сроков представления сведений и документов о бенефициарных собственниках юридическим лицом и иностранной структурой без образования юридического лица по запросу уполномоченного органа по финансовому мониторингу и формы фиксирования сведений, необходимых для идентификации бенефициарных собственников юридическим лицом и иностранной структурой без образования юридического лица
  kaz: Қаржы мониторингі жөніндегі уәкілетті органның сұрау салуы бойынша заңды тұлға және заңды тұлғаны құрмайтын шетелдік құрылымның бенефициарлық меншік иелері туралы мәліметтер мен құжаттарды ұсыну қағидалары мен мерзімдерін және заңды тұлға және заңды тұлғаны құрмайтын шетелдік құрылымның бенефициарлық меншік иелерін сәйкестендіру үшін қажетті мәліметтерді тіркеу нысанын бекіту туралы
