  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 16 сентября 2022 года № 33 «Об утверждении Правил и сроков представления сведений и документов о бенефициарных собственниках юридическим лицом и иностранной структурой без образования юридического лица по запросу уполномоченного органа по финансовому мониторингу и формы фиксирования сведений, необходимых для идентификации бенефициарных собственников юридическим лицом и иностранной структурой без образования юридического лица»
    kaz: «Қаржы мониторингі жөніндегі уәкілетті органның сұрау салуы бойынша заңды тұлғаның және заңды тұлға құрмай шетелдік құрылымның бенефициарлық меншік иелері туралы мәліметтер мен құжаттарды ұсыну қағидалары мен мерзімдерін және заңды тұлға құрмай шетелдік құрылымның бенефициарлық меншік иелерін сәйкестендіру үшін қажетті мәліметтерді тіркеу нысанын бекіту туралы» Қазақстан Республикасының Қаржылық мониторинг агенттігі төрағасының 2022 жылғы 16 қыркүйектегі № 33 бұйрығына өзгерістер енгізу туралы
