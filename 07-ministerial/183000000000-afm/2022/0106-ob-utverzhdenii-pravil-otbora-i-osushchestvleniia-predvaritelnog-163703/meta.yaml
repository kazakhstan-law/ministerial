act_code: '163703'
requisite: Приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 января 2022 года № 10. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 января 2022 года № 26504. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 31 октября 2022 года № 37 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил отбора и осуществления предварительного изучения кандидатов, принимаемых на службу (учебу) в оперативно-следственные подразделения органов по финансовому мониторингу (служба экономических расследований)
  kaz: Қаржылық мониторинг органдарының жедел-тергеу бөлімшелеріне (экономикалық тергеу қызметі) қызметке (оқуға) қабылданатын кандидаттарды іріктеу және алдын ала зерделеуді жүзеге асыру қағидаларын бекіту туралы
