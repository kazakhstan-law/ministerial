title:
  rus: Об утверждении Правил предоставления субъектами финансового мониторинга сведений и информации об операциях, о подозрительной деятельности клиента, подлежащих финансовому мониторингу, и признаков определения подозрительной операции, деятельности клиента
  kaz: Қаржы мониторингі субъектілерінің қаржы мониторингіне жататын операциялар, клиенттің күдікті қызметті туралы мәліметтер мен ақпаратты беру қағидаларын және күдікті операцияны, клиенттің күдікті қызметін айқындау белгілерін бекіту туралы
