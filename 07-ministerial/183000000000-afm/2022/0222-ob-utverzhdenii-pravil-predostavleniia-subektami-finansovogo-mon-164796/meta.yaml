  title:
    rus: О внесении изменения и дополнений в приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 22 февраля 2022 года № 13 «Об утверждении Правил представления субъектами финансового мониторинга сведений и информации об операциях, подлежащих финансовому мониторингу, и признаков определения подозрительной операции»
    kaz: «Қаржы мониторингі субъектілерінің қаржы мониторингіне жататын операциялар туралы мәліметтер мен ақпаратты беру қағидаларын және күдікті операцияны айқындау белгілерін бекіту туралы» Қазақстан Республикасының Қаржылық мониторинг агенттігі төрағасының 2022 жылғы 22 ақпандағы № 13 бұйрығына өзгеріс пен толықтырулар енгізу туралы
