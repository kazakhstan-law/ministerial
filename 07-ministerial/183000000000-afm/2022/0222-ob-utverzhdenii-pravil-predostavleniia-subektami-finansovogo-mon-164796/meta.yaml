  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 22 февраля 2022 года № 13 «Об утверждении Правил предоставления субъектами финансового мониторинга сведений и информации об операциях, о подозрительной деятельности клиента, подлежащих финансовому мониторингу, и признаков определения подозрительной операции, деятельности клиента»
    kaz: «Қаржы мониторингі субъектілерінің қаржы мониторингіне жататын операциялар, клиенттің күдікті қызметі туралы мәліметтер мен ақпаратты беру қағидаларын және күдікті операцияны, клиенттің күдікті қызметін айқындау белгілерін бекіту туралы» Қазақстан Республикасының Қаржылық мониторинг агенттігі төрағасының 2022 жылғы 22 ақпандағы № 13 бұйрығына өзгерістер енгізу туралы
