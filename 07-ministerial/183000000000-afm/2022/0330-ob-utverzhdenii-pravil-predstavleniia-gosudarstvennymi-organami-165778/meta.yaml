title:
  rus: Об утверждении Правил представления государственными органами Республики Казахстан сведений из собственных информационных систем и ресурсов по запросу уполномоченного органа по финансовому мониторингу
  kaz: Қаржы мониторингі жөніндегі уәкілетті органның сұратуы бойынша Қазақстан Республикасы мемлекеттік органдарының өздерінің ақпараттық жүйелерінен және ресурстарынан мәліметтер беру қағидаларын бекіту туралы
