  title:
    rus: О внесении дополнения в приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 30 марта 2022 года № 114-НҚ «Об утверждении Правил представления государственными органами Республики Казахстан сведений из собственных информационных систем и ресурсов по запросу уполномоченного органа по финансовому мониторингу»
    kaz: «Қаржы мониторингі жөніндегі уәкілетті органның сұратуы бойынша Қазақстан Республикасы мемлекеттік органдарының өздерінің ақпараттық жүйелерінен және ресурстарынан мәліметтер беру қағидаларын бекіту туралы» Қазақстан Республикасы Қаржылық мониторинг агенттігі Төрағасының 2022 жылғы 30 наурыздағы № 114-НҚ бұйрығына толықтыру енгізу туралы
