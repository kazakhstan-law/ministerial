act_code: '163502'
requisite: Приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 января 2022 года № 6. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 января 2022 года № 26497. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 21 февраля 2025 года № 1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил формирования кадрового резерва, требований к квалификации сотрудников, зачисляемых в кадровый резерв, и работы с ведомственным банком данных сотрудников, зачисленных в кадровый резерв оперативно-следственных подразделений органов по финансовому мониторингу (служба экономических расследований)
  kaz: Кадр резервін қалыптастыру, кадр резервіне алынатын қызметкерлердің біліктілігіне қойылатын талаптарды және қаржылық мониторинг органдарының жедел-тергеу бөлімшелерінің (экономикалық тергеу қызметі) кадр резервіне алынған қызметкерлердің ведомстволық деректер банкімен жұмыс істеу қағидаларын бекіту туралы
