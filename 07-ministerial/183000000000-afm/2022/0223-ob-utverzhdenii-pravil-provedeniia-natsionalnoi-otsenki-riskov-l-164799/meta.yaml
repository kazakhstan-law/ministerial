    kaz: «Кірістерді заңдастыру (жылыстату) және терроризмді қаржыландыру тәуекелдеріне бағалау жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Қаржылық мониторинг агенттігі Төрағасының 2022 жылғы 23 ақпандағы № 14 бұйрығына өзгертулер мен толықтырулар енгізу туралы
