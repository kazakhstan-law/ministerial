title:
  rus: Об утверждении Правил представления сведений о бенефициарных собственниках клиентами (их представителями) по запросу субъекта финансового мониторинга
  kaz: Қаржы мониторингі субъектісінің сұрау салуы бойынша клиенттердің (олардың өкілдерінің) бенефициарлық меншік иелері туралы мәліметтерді ұсыну қағидаларын бекіту туралы
