requisite: Приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 января 2022 года № 7. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 января 2022 года № 26496. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 2 апреля 2025 года № 7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О некоторых вопросах, связанных с поступлением на службу и замещением вакантных должностей в оперативно-следственных подразделениях органов по финансовому мониторингу (служба экономических расследований)
  kaz: Қаржылық мониторинг органдарының жедел-тергеу бөлімшелеріне (экономикалық тергеу қызметі) қызметке қабылданумен және бос лауазымдарға орналасумен байланысты кейбір мәселелер туралы
