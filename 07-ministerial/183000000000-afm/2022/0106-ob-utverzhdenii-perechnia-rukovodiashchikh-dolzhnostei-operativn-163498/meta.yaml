act_code: '163498'
requisite: Приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 января 2022 года № 5. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 января 2022 года № 26495. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 5 марта 2025 года № 2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Перечня руководящих должностей оперативно-следственных подразделений органов по финансовому мониторингу (служба экономических расследований), подлежащих ротации, и Правил их перемещения
  kaz: Ротацияға жататын қаржылық мониторинг органдарының жедел-тергеу бөлімшелерінің (экономикалық тергеу қызметі) басшылық лауазымдарының тізбесін және оларды ауыстыру қағидаларын бекіту туралы
