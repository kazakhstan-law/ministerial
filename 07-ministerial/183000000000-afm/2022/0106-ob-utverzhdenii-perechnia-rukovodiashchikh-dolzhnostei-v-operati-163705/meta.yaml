  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 января 2022 года № 9 «Об утверждении Перечня руководящих должностей в оперативно-следственных подразделениях органов по финансовому мониторингу (служба экономических расследований), замещаемых на конкурсной основе, Правил и условий проведения конкурса на вышестоящие руководящие должности в оперативно-следственных подразделениях органов по финансовому мониторингу (служба экономических расследований)»
    kaz: «Қаржылық мониторинг органдарының жедел-тергеу бөлімшелеріне (экономикалық тергеп-тексеру қызметі) байқаулық негізде орналасатын басшы лауазымдарының тізбесін және қаржылық мониторинг органдарының жедел-тергеу бөлімшелерінде (экономикалық тергеп-тексеру қызметі) жоғары тұрған басшы лауазымдарына байқау өткізу қағидалары мен шарттарын бекіту туралы» Қазақстан Республикасының Қаржылық мониторинг агенттігі Төрағасының 2022 жылғы 6 қаңтардағы № 9 бұйрығына өзгерістер енгізу туралы
