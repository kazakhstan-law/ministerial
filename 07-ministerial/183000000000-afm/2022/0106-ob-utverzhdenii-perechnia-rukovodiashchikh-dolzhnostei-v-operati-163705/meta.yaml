act_code: '163705'
requisite: Приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 января 2022 года № 9. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 января 2022 года № 26506
title:
  rus: Об утверждении Перечня руководящих должностей в оперативно-следственных подразделениях органов по финансовому мониторингу (служба экономических расследований), замещаемых на конкурсной основе, Правил и условий проведения конкурса на вышестоящие руководящие должности в оперативно-следственных подразделениях органов по финансовому мониторингу (служба экономических расследований)
  kaz: Қаржылық мониторинг органдарының жедел-тергеу бөлімшелеріне (экономикалық тергеу қызметі) конкурстық негізде орналасатын басшы лауазымдарының тізбесін және қаржылық мониторинг органдарының жедел-тергеу бөлімшелерінің (экономикалық тергеу қызметі) жоғары тұрған басшы лауазымдарына конкурс өткізу қағидалары мен шарттарын бекіту туралы
