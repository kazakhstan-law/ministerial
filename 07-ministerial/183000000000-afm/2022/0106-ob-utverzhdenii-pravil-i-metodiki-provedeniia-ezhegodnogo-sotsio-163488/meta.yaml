act_code: '163488'
requisite: Приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 января 2022 года № 1. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 января 2022 года № 26490
title:
  rus: Об утверждении Правил и методики проведения ежегодного социологического мониторинга состояния морально-психологического климата в оперативно-следственных подразделениях органов по финансовому мониторингу (служба экономических расследований)
  kaz: Қаржылық мониторинг органдарының жедел-тергеу бөлімшелерінде (экономикалық тергеу қызметі) моральдық-психологиялық ахуалдың жай-күйіне жыл сайынғы социологиялық мониторинг жүргізудің қағидалары мен әдістемесін бекіту туралы
