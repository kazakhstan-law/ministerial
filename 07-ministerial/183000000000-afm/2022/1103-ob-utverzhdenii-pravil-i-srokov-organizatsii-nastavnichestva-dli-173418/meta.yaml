act_code: '173418'
requisite: Приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 3 ноября 2022 года № 38. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 ноября 2022 года № 30402. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 12 марта 2025 года № 3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и сроков организации наставничества для лиц, впервые поступающих на правоохранительную службу в органы по финансовому мониторингу (службу экономических расследований)
  kaz: Қаржылық мониторинг органдарында (Экономикалық тергеу қызметі) құқық қорғау қызметіне алғаш рет қабылданатын тұлғалар үшін тәлімгерлікті ұйымдастыру қағидалары мен мерзімдерін бекіту туралы
