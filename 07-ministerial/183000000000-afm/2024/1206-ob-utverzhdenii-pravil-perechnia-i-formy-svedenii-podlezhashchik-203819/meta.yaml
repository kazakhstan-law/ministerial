  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 декабря 2024 года № 9 «Об утверждении Правил, перечня и формы сведений, подлежащих передаче посредством интеграции аппаратно-программных комплексов организаторов игорного бизнеса, осуществляющих деятельность букмекерской конторы и (или) тотализатора, с информационными системами уполномоченного органа по финансовому мониторингу»
    kaz: «Букмекерлік кеңсенің және (немесе) тотализатордың қызметін жүзеге асыратын ойын бизнесін ұйымдастырушылардың аппараттық-бағдарламалық кешендерін мемлекеттік кірістер органдарының ақпараттық жүйелерімен интеграциялау арқылы беруге жататын мәліметтердің қағидалары мен тізбесін және нысанын бекіту туралы» Қазақстан Республикасы Қаржылық мониторинг агенттігі Төрағасының 2024 жылғы 6 желтоқсандағы № 9 бұйрығына өзгерістер енгізу туралы
