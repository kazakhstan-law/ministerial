act_code: '203819'
requisite: Приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 декабря 2024 года № 9. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 декабря 2024 года № 35455
title:
  rus: Об утверждении Правил, перечня и формы сведений, подлежащих передаче посредством интеграции аппаратно-программных комплексов организаторов игорного бизнеса, осуществляющих деятельность букмекерской конторы и (или) тотализатора, с информационными системами уполномоченного органа по финансовому мониторингу
  kaz: Букмекерлік кеңсенің және (немесе) тотализатордың қызметін жүзеге асыратын ойын бизнесін ұйымдастырушылардың аппараттық-бағдарламалық кешендерін қаржылық мониторинг жөніндегі уәкілетті органның ақпараттық жүйелерімен интеграциялау арқылы беруге жататын мәліметтерді беру қағидаларын, олардың тізбесі мен нысанын бекіту туралы
