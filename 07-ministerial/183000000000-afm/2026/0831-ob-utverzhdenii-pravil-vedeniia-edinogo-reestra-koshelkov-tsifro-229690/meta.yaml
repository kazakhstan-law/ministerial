act_code: '229690'
requisite: Приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 31 августа 2026 года № 237-НҚ
title:
  rus: Об утверждении Правил ведения единого реестра кошельков цифровых активов, использованных в целях легализации (отмывания) доходов, полученных преступным путем, финансирования терроризма и финансирования распространения оружия массового уничтожения и (или) иных преступных целях, включающий состав, сроки и форму предоставления информации
  kaz: Ақпарат ұсыну құрамын, мерзімдері мен нысанын қамтитын, қылмыстық жолмен алынған кірістерді заңдастыру (жылыстату), терроризмді қаржыландыру және жаппай қырып-жою қаруын таратуды қаржыландыру мақсатында және (немесе) өзге де қылмыстық мақсаттарда пайдаланылған цифрлық активтер әмияндарының бірыңғай тізілімін жүргізу қағидаларын бекіту туралы
