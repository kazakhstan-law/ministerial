requisite: Приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 29 августа 2025 года № 283-НҚ
title:
  rus: Об утверждении перечня должностей сотрудников органов по финансовому мониторингу, имеющих право при перемещении и выдвижениях по службе на подъемное пособие, возмещение затрат за проезд на транспорте и за перевозку собственного имущества
  kaz: Қызмет бабында ауысу және ұсыну кезінде көтерме жәрдемақыға, көлікте жол жүру және өз мүлкін тасымалдау шығындарының өтелуіне құқығы қаржылық мониторинг органдары қызметкерлері лауазымдарының тізбесін бекіту туралы
