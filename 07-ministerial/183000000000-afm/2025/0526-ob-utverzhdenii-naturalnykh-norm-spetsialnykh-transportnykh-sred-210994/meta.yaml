requisite: Приказ Председателя Агентства Республики Казахстан по финансовому мониторингу от 26 мая 2025 года № 176-НҚ
title:
  rus: Об утверждении натуральных норм специальных транспортных средств для транспортного обслуживания Агентства Республики Казахстан по финансовому мониторингу, его территориальных органов и специализированного государственного учреждения
  kaz: Қазақстан Республикасының Қаржылық мониторинг агенттігі, оның аумақтық органдары және мамандандырылған мемлекеттік мекемелеріне көлік қызметін көрсету үшін арнайы көлік құралдарының заттай нормаларын бекіту туралы
