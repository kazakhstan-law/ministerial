act_code: '123160'
requisite: Приказ Председателя Комитета охраны общественного здоровья Министерства здравоохранения Республики Казахстан от 25 июня 2018 года № 136-ОД. Утратил силу приказом Председателя Комитета контроля качества и безопасности товаров и услуг Министерства здравоохранения Республики Казахстан от 20 октября 2020 года № 322-НҚ (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении положений территориальных подразделений Комитета охраны общественного здоровья Министерства здравоохранения Республики Казахстан
  kaz: Қазақстан Республикасы Денсаулық сақтау министрлігі Қоғамдық денсаулық сақтау комитетінің аумақтық бөлімшелерінің ережелерін бекіту туралы
