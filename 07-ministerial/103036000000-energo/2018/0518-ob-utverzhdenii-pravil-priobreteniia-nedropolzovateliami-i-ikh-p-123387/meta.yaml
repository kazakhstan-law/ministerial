  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 18 мая 2018 года № 196 «Об утверждении Правил приобретения недропользователями и их подрядчиками товаров, работ и услуг, используемых при проведении операций по разведке или добыче углеводородов и добыче урана»
    kaz: «Жер қойнауын пайдаланушылардың және олардың мердігерлерінің көмірсутектерді барлау немесе өндіру және уран өндіру жөніндегі операцияларды жүргізу кезінде пайдаланылатын тауарларды, жұмыстарды және көрсетілетін қызметтерді сатып алу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2018 жылғы 18 мамырдағы № 196 бұйрығына өзгерістер енгізу туралы
