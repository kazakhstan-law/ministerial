requisite: Приказ Министра энергетики Республики Казахстан от 7 сентября 2018 года № 356. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 октября 2018 года № 17543. Утратил силу приказом Министра экологии, геологии и природных ресурсов Республики Казахстан от 22 июня 2021 года № 208 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Правил ведения автоматизированного мониторинга эмиссий в окружающую среду при проведении производственного экологического контроля и требований к отчетности по результатам производственного экологического контроля
  kaz: Өндірістік экологиялық бақылау жүргізу кезінде қоршаған ортаға эмиссиялардың автоматтандырылған мониторингін жүргізу қағидаларын және өндірістік экологиялық бақылау нәтижелері бойынша есептілікке қойылатын талаптарды бекіту туралы
