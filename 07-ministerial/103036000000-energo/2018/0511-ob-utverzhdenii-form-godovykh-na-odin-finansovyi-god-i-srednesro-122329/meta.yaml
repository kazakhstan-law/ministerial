title:
  rus: Об утверждении форм годовых (на один финансовый год) и среднесрочных (на пять финансовых лет) программ закупа товаров, работ и услуг и правил их представления
  kaz: Тауарларды, жұмыстарды және көрсетілетін қызметтерді сатып алудың жылдық (бір қаржы жылына арналған) және орта мерзімді (бес қаржы жылына арналған) бағдарламаларының нысандарын және оларды ұсыну қағидаларын бекіту туралы
