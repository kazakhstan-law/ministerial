requisite: Приказ Министра энергетики Республики Казахстан от 9 апреля 2018 года № 116. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 апреля 2018 года № 16837. Утратил силу приказом и.о. Министра экологии, геологии и природных ресурсов Республики Казахстан от 15 июня 2020 года № 145 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Заключение уполномоченного органа государств - членов Евразийского экономического союза на транзит опасных отходов через таможенную территорию Евразийского экономического союза»
  kaz: «Еуразиялық экономикалық одақтың кедендік аумағы арқылы қауіпті қалдықтардың транзитіне Еуразиялық экономикалық одаққа мүше мемлекеттердің уәкілетті органының қорытындысы» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
