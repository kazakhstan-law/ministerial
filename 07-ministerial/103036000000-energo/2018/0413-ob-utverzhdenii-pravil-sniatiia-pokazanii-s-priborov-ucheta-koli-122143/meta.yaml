  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра энергетики Республики Казахстан от 13 апреля 2018 года № 127 «Об утверждении Правил снятия показаний с приборов учета количества реализованного нестабильного конденсата по системе трубопроводов»
    kaz: «Құбыржолдар жүйесі арқылы өткізілген тұрақсыз конденсаттың мөлшерін есепке алу аспаптарының көрсетілімдерін алу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2018 жылғы 13 сәуірдегі № 127 бұйрығына өзгерістер енгізу туралы
