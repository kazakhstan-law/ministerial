  title:
    rus: О признании утратившим силу приказа исполняющего обязанности Министра энергетики Республики Казахстан от 28 февраля 2018 года № 72 «Об утверждении перечня налогоплательщиков, осуществляющих деятельность в рамках межправительственного соглашения о сотрудничестве в газовой отрасли, обороты которых по реализации на территории другого государства-члена Евразийского экономического союза продуктов переработки из давальческого сырья, ранее вывезенного этими налогоплательщиками с территории Республики Казахстан и переработанного на территории такого другого государства-члена Евразийского экономического союза, облагаются налогом на добавленную стоимость по нулевой ставке»
    kaz: «Салық төлеушілердің Қазақстан Республикасының аумағынан бұрын әкеткен және Еуразиялық экономикалық одаққа мүше осындай басқа мемлекеттің аумағында өңделген алыс-беріс шикізатынан алынған қайта өңдеу өнімдерін Еуразиялық экономикалық одаққа мүше басқа мемлекеттің аумағында өткізуі бойынша айналымдарына нөлдік мөлшерлеме бойынша қосылған құн салығы салынатын газ саласындағы ынтымақтастық туралы үкіметаралық келісім шеңберінде қызметін жүзеге асыратын салық төлеушілердің тізбесін бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2018 жылғы 28 ақпандағы № 72 бұйрығының күші жойылды деп тану туралы
