title:
  rus: Об утверждении Правил синхронизации работы систем электронного закупа в отношении углеводородов и добычи урана с работой реестра товаров, работ и услуг, используемых при проведении операций по недропользованию, и их производителей
  kaz: Көмірсутектерге және уран өндіруге қатысты электрондық сатып алу жүйелерінің жұмысын жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде пайдаланылатын тауарлардың, жұмыстар мен қызметтердің және оларды өндірушілердің тізілімінің жұмысымен үйлестіру қағидаларын бекіту туралы
