title:
  rus: Об утверждении Правил формирования и ведения реестра товаров, работ и услуг, используемых при проведении операций по недропользованию по углеводородам и добыче урана, и их производителей, включая критерии их оценки для внесения в данный реестр
  kaz: Көмірсутектер және уран өндіру бойынша жер қойнауын пайдалану жөніндегі операцияларды жүргізу кезінде пайдаланылатын тауарлардың, жұмыстардың және көрсетілетін қызметтердің және оларды өндірушілердің тізілімін, осы тізілімге енгізу үшін оларды бағалау өлшемшарттарын қоса алғанда, қалыптастыру және жүргізу қағидаларын бекіту туралы
