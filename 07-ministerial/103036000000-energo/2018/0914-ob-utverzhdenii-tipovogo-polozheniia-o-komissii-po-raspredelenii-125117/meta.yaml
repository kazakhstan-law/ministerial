  title:
    rus: О внесении изменения и дополнений в приказ Министра энергетики Республики Казахстан от 14 сентября 2018 года № 372 «Об утверждении Типового положения о комиссии по формированию сводных заявок на поставку сжиженного нефтяного газа»
    kaz: «Сұйытылған мұнай газын беруге жиынтық өтінімдерді қалыптастыру жөніндегі комиссия туралы үлгілік ережені бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2018 жылғы 14 қыркүйектегі № 372 бұйрығына өзгеріс пен толықтырулар енгізу туралы
