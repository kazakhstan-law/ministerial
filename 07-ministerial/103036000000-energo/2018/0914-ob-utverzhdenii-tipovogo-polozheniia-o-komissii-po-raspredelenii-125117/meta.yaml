title:
  rus: Об утверждении Типового положения о комиссии по распределению сжиженного нефтяного газа, выделенного в рамках плана поставки вне товарных бирж
  kaz: Өнім беру жоспары шеңберінде тауар биржаларынан тыс бөлінген сұйытылған мұнай газын бөлу жөніндегі комиссия туралы үлгілік ережені бекіту туралы
