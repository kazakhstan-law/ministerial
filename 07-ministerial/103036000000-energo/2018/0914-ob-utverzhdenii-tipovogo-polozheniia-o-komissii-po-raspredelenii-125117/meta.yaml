  title:
    rus: О внесении изменений в приказы Министра энергетики Республики Казахстан от 22 октября 2014 года № 68 «Об утверждении Правил формирования плана поставки сжиженного нефтяного газа на внутренний рынок Республики Казахстан» и от 14 сентября 2018 года № 372 «Об утверждении Типового положения о комиссии по формированию сводных заявок на поставку сжиженного нефтяного газа»
    kaz: «Қазақстан Республикасының ішкі нарығына сұйытылған мұнай газын беру жоспарын қалыптастыру қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2014 жылғы 22 қазандағы № 68 және «Сұйытылған мұнай газын беруге жиынтық өтінімдерді қалыптастыру жөніндегі комиссия туралы үлгілік ережені бекіту туралы» 2018 жылғы 14 қыркүйектегі № 372 бұйрықтарына өзгерістер енгізу туралы
