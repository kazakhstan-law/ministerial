  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 23 мая 2018 года № 203 «Об утверждении форм отчетов при проведении разведки и добычи углеводородов, осуществлении операций в сфере добычи и оборота нефти и (или) сырого газа, урана, проведении опытно-промышленной добычи и добычи урана и Правил их представления»
    kaz: «Көмірсутектерді барлауды және өндіруді жүргізу, мұнай және (немесе) шикі газ, уран өндіру және олардың айналымы саласындағы операцияларды жүзеге асыру, тәжірибелік-өнеркәсіптік өндіруді және уран өндіруді жүргізу кезінде есептердің нысандарын және оларды ұсыну Қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2018 жылғы 23 мамырдағы № 203 бұйрығына өзгерістер енгізу туралы
