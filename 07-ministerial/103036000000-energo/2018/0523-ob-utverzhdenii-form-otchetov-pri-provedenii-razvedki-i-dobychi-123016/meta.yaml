title:
  rus: Об утверждении форм отчетов при проведении разведки и добычи углеводородов, осуществлении операций в сфере добычи и оборота нефти и (или) сырого газа и Правил их представления
  kaz: Көмірсутектерді барлауды және өндіруді жүргізу, мұнай және (немесе) шикі газ өндіру және олардың айналымы саласындағы операцияларды жүзеге асыруды жүргізу кезінде есептердің нысандарын және оларды ұсыну қағидаларын бекіту туралы
