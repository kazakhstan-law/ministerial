  code: '216243'
  requisite: Приказ Министра энергетики Республики Казахстан от 29 октября 2025 года № 415-н/қ. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 октября 2025 года № 37268
  title:
    rus: О признании утратившим силу приказа исполняющего обязанности Министра энергетики Республики Казахстан от 13 апреля 2018 года № 126 «Об утверждении перечня налогоплательщиков, осуществляющих деятельность в рамках контракта на недропользование, обороты по реализации нестабильного конденсата которых с территории Республики Казахстан на территорию других государств – членов Евразийского экономического союза облагаются налогом на добавленную стоимость по нулевой ставке»
    kaz: «Жер қойнауын пайдалануға арналған келісімшарт шеңберінде қызметін жүзеге асыратын, тұрақсыз конденсатты Қазақстан Республикасының аумағынан Еуразиялық экономикалық одаққа мүше басқа мемлекеттердің аумағына өткізу бойынша айналымдарына нөлдік мөлшерлеме бойынша қосылған құн салығы салынатын салық төлеушілердің тізбесін бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2018 жылғы 13 сәуірдегі № 126 бұйрығының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/216243/rus
