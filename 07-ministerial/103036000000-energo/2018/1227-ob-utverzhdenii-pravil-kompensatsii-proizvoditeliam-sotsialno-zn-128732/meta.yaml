act_code: '128732'
requisite: Приказ Министра энергетики Республики Казахстан от 27 декабря 2018 года № 539. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 декабря 2018 года № 18121. Утратил силу приказом Министра экологии, геологии и природных ресурсов Республики Казахстан от 16 ноября 2021 года № 470 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил компенсации производителям социально значимых продовольственных товаров расходов, связанных с внесением платы за организацию сбора, транспортировки, переработки, обезвреживания, использования и (или) утилизации отходов производителями (импортерами) полимерной, стеклянной, бумажной, картонной и (или) металлической упаковок, упаковки из комбинированных материалов, применяемых для упаковывания социально значимых продовольственных товаров
  kaz: Әлеуметтік маңызы бар азық-түлік тауарларын өндірушілерге әлеуметтік маңызы бар азық-түлік тауарларын орау үшін қолданылатын полимер, шыны, қағаз, картон және (немесе) металл орамаларды, аралас материалдардан ораманы өндірушілердің (импорттаушылардың) қалдықтарды жинауды, тасымалдауды, қайта өңдеуді, залалсыздандыруды, пайдалануды және (немесе) кәдеге жаратуды ұйымдастырғаны үшін төлемақы енгізуіне байланысты шығыстарды өтеу қағидаларын бекіту туралы
