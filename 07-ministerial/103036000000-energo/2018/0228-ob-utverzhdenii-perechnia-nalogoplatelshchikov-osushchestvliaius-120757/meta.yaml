  title:
    rus: О признании утратившим силу приказа исполняющего обязанности Министра энергетики Республики Казахстан от 28 февраля 2018 года № 71 «Об утверждении перечня налогоплательщиков, осуществляющих на территории Республики Казахстан деятельность в рамках контракта на недропользование, соглашения (контракта) о разделе продукции, в соответствии с условиями которого освобождаются от налога на добавленную стоимость импортируемые товары»
    kaz: «Талаптарына сәйкес импортталатын тауарлар қосылған құн салығынан босатылатын, жер қойнауын пайдалануға арналған келісімшарт, өнімді бөлу туралы келісім (келісімшарт) шеңберінде Қазақстан Республикасының аумағында қызметін жүзеге асыратын салық төлеушілердің тізбесін бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2018 жылғы 28 ақпандағы № 71 бұйрығының күші жойылды деп тану туралы
