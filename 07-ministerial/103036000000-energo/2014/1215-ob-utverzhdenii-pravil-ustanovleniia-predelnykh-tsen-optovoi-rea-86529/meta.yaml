  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 15 декабря 2014 года № 209 "Об утверждении Правил определения предельных цен оптовой реализации товарного и сжиженного нефтяного газа на внутреннем рынке"
    kaz: '"Тауарлық және сұйытылған мұнай газын ішкі нарықта көтерме саудада өткізудің шекті бағаларын айқындау қағидаларын бекіту туралы" Қазақстан Республикасы Энергетика министрінің 2014 жылғы 15 желтоқсандағы № 209 бұйрығына өзгерістер енгізу туралы'
