  title:
    rus: О внесении изменений и дополнения в приказ Министра энергетики Республики Казахстан от 15 декабря 2014 года № 209 "Об утверждении Правил определения предельных цен оптовой реализации товарного и сжиженного нефтяного газа на внутреннем рынке"
    kaz: '"Ішкі нарықта тауарлық және сұйытылған мұнай газын көтерме саудада өткізудің шекті бағаларын айқындау қағидаларын бекіту туралы" Қазақстан Республикасының Энергетика Министрінің 2014 жылғы 15 желтоқсандағы № 209 бұйрығына өзгерістер мен толықтыру енгізу туралы'
