  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 15 декабря 2014 года № 209 «Об утверждении правил определения предельных цен оптовой реализации товарного газа на внутреннем рынке Республики Казахстан и предельных цен сжиженного нефтяного газа, реализуемого в рамках плана поставки сжиженного нефтяного газа на внутренний рынок Республики Казахстан вне товарных бирж»
    kaz: «Қазақстан Республикасының ішкі нарығында тауарлық газды көтерме саудада өткізудің шекті бағаларын және Қазақстан Республикасының ішкі нарығына сұйытылған мұнай газын беру жоспары шеңберінде тауар биржаларынан тыс өткізілетін сұйытылған мұнай газының шекті бағаларын айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2014 жылғы 15 желтоқсандағы № 209 бұйрығына өзгерістер енгізу туралы
