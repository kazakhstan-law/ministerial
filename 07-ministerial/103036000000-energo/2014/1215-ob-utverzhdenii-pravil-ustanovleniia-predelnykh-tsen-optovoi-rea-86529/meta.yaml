  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 15 декабря 2014 года № 209 «Об утверждении Правил установления предельных цен оптовой реализации товарного газа на внутреннем рынке, оптовой и розничной реализации сжиженного нефтяного газа в рамках плана поставки сжиженного нефтяного газа на внутренний рынок Республики Казахстан вне товарных бирж»
    kaz: «Тауарлық газды ішкі нарықта көтерме саудада өткізудің, сұйытылған мұнай газын Қазақстан Республикасының ішкі нарығына сұйытылған мұнай газын беру жоспары шеңберінде тауар биржаларынан тыс көтерме және бөлшек саудада өткізудің шекті бағаларын белгілеу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2014 жылғы 15 желтоқсандағы № 209 бұйрығына өзгерістер енгізу туралы
