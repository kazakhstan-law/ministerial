  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 14 ноября 2014 года № 126 «Об утверждении Правил выдачи разрешений на сжигание в факелах попутного и (или) природного газа при испытании объектов скважин, пробной эксплуатации месторождения, технологически неизбежном сжигании газа при пусконаладке, эксплуатации, техническом обслуживании и ремонтных работах технологического оборудования»
    kaz: «Ұңғымалар объектілерін сынау, кен орнын сынамалы пайдалану, технологиялық жабдықты іске қосу-баптау, пайдалану, оған техникалық қызмет көрсету және жөндеу жұмыстары кезінде газды технологиялық еріксіз жағу кезінде ілеспе және (немесе) табиғи газды алау етіп жағуға рұқсаттар беру қағидасын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2014 жылғы 14 қарашадағы № 126 бұйрығына өзгерістер енгізу туралы
