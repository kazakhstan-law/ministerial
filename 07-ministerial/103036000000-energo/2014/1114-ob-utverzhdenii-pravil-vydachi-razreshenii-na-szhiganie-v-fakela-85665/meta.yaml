act_code: '85665'
requisite: Приказ Министра энергетики Республики Казахстан от 14 ноября 2014 года № 126. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 декабря 2014 года № 10023. Утратил силу приказом Министра энергетики Республики Казахстан от 25 апреля 2018 года № 140 (вводится в действие с 29 июня 2018 года)
title:
  rus: Об утверждении Правил выдачи разрешений на сжигание в факелах попутного и (или) природного газа при испытании объектов скважин, пробной эксплуатации месторождения, технологически неизбежном сжигании газа при пусконаладке, эксплуатации, техническом обслуживании и ремонтных работах технологического оборудования
  kaz: Ұңғымалар объектілерін сынау, кен орнын сынамалы пайдалану, технологиялық жабдықты іске қосу-баптау, пайдалану, оған техникалық қызмет көрсету және жөндеу жұмыстары кезінде газды технологиялық еріксіз жағу кезінде ілеспе және (немесе) табиғи газды алау етіп жағуға рұқсаттар беру қағидаларын бекіту туралы
