  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 28 ноября 2014 года № 158 «Об утверждении перечня нефтепродуктов, доставляемых единым оператором по поставке нефтепродуктов Вооруженным Силам Республики Казахстан, Пограничной службе Комитета национальной безопасности Республики Казахстан, Национальной гвардии Республики Казахстан, уполномоченному органу в сфере гражданской защиты, уполномоченному органу в области государственного материального резерва»
    kaz: «Мұнай өнімдерін беру жөніндегі бірыңғай оператор Қазақстан Республикасының Қарулы Күштеріне, Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Шекара қызметіне, Қазақстан Республикасының Ұлттық ұланына, азаматтық қорғау саласындағы уәкілетті органға, мемлекеттік материалдық резерв саласындағы уәкілетті органға жеткізетін мұнай өнімдерінің тізбесін бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2014 жылғы 28 қарашадағы № 158 бұйрығына өзгерістер енгізу туралы
