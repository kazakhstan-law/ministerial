title:
  rus: Об утверждении Правил формирования плана поставки сжиженного нефтяного газа на внутренний рынок Республики Казахстан
  kaz: Қазақстан Республикасының ішкі нарығына сұйытылған мұнай газын беру жоспарын қалыптастыру қағидаларын бекіту туралы
