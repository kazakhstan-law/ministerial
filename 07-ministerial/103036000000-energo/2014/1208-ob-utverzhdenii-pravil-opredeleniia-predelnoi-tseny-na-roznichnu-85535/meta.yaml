  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 8 декабря 2014 года № 184 «Об утверждении Правил определения предельной цены на розничную реализацию нефтепродуктов, на которые установлено государственное регулирование цен»
    kaz: «Бағаларына мемлекеттік реттеу белгіленген мұнай өнімдерін бөлшек сауда арқылы өткізудің шекті бағаларын айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2014 жылғы 8 желтоқсандағы № 184 бұйрығына өзгерістер енгізу туралы
