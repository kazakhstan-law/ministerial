  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 25 ноября 2014 года № 143 «Об утверждении цен на работы, услуги, производимые и (или) реализуемые субъектом государственной монополии в области ведения метеорологического и гидрологического мониторингов и мониторинга состояния окружающей среды»
    kaz: «Метеорологиялық және гидрологиялық мониторингтерін және қоршаған орта жай-күйі мониторингін жүргізу саласында мемлекеттік монополия субьектісі өндіретін және (немесе) іске асыратын жұмыстардың, көрсетілетін қызметтердің бағаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2014 жылғы 25 қарашадағы № 143 бұйрығына өзгерістер енгізу туралы
