requisite: Приказ Министра энергетики Республики Казахстан от 25 ноября 2014 года № 143. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 декабря 2014 года № 9985. Утратил силу приказом и.о. Министра экологии и природных ресурсов Республики Казахстан от 5 января 2025 года № 1 (вводится в действие с 1 января 2025 года)
title:
  rus: Об утверждении цен на работы, услуги, производимые и (или) реализуемые субъектом государственной монополии в области ведения метеорологического и гидрологического мониторингов и мониторинга состояния окружающей среды
  kaz: Метеорологиялық және гидрологиялық мониторингтерін және қоршаған орта жай-күйі мониторингін жүргізу саласында мемлекеттік монополия субьектісі өндіретін және (немесе) іске асыратын жұмыстардың, көрсетілетін қызметтердің бағаларын бекіту туралы
