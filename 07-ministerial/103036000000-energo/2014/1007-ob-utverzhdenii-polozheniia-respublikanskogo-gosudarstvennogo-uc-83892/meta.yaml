title:
  rus: Об утверждении Положения республиканского государственного учреждения «Комитет государственного энергетического надзора и контроля Министерства энергетики Республики Казахстан» и его территориальных органов
  kaz: Қазақстан Республикасы Энергетика министрлігінің Мемлекеттік энергетикалық қадағалау және бақылау комитеті» республикалық мемлекеттік мекемесінің және оның аумақтық органдарының ережесін бекіту туралы
