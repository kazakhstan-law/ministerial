    kaz: «Қазақстан Республикасы Энергетика министрлігінің Атомдық және энергетикалық қадағалау мен бақылау комитеті» мемлекеттік мекемесінің және оның аумақтық органдарының ережесін бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2014 жылғы 7 қазандағы № 42 бұйрығына өзгерістер енгізу туралы
