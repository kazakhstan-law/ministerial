  title:
    rus: О внесении изменения и дополнения в приказ Министра энергетики Республики Казахстан от 7 октября 2014 года № 42 «Об утверждении Положения государственного учреждения «Комитет атомного и энергетического надзора и контроля Министерства энергетики Республики Казахстан» и его территориальных органов»
    kaz: «Қазақстан Республикасы Энергетика министрлігінің Атомдық және энергетикалық қадағалау мен бақылау комитеті» мемлекеттік мекемесінің және оның аумақтық органдарының ережесін бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2014 жылғы 7 қазандағы № 42 бұйрығына өзгеріс пен толықтыру енгізу туралы
