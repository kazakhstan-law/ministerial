  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 28 ноября 2014 года № 159 "Об утверждении Правил поставки нефтепродуктов единым оператором по поставке нефтепродуктов Вооруженным Силам Республики Казахстан, Пограничной службе Комитета национальной безопасности Республики Казахстан, Национальной гвардии Республики Казахстан, уполномоченному органу в сфере гражданской защиты, уполномоченному органу в области государственного материального резерва"
    kaz: '"Мұнай өнімдерін беру жөніндегі бірыңғай оператордың Қазақстан Республикасының Қарулы Күштеріне, Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Шекара қызметіне, Қазақстан Республикасының Ұлттық ұланына, азаматтық қорғау саласындағы уәкілетті органға, мемлекеттік материалдық резерв саласындағы уәкілетті органға мұнай өнімдерін беру қағидасын бекіту туралы" Қазақстан Республикасы Энергетика Министрінің 2014 жылғы 28 қарашадағы № 159 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/98487/rus
