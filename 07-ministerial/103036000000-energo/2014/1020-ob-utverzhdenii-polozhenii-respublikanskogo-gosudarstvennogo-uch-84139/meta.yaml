act_code: '84139'
requisite: Приказ Министра энергетики Республики Казахстан от 20 октября 2014 года № 62. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 октября 2014 года № 9824. Отменен приказом Ответственного секретаря Министерства экологии, геологии и природных ресурсов Республики Казахстан от 1 августа 2019 года № 9-П
title:
  rus: Об утверждении положений республиканского государственного учреждения «Комитет экологического регулирования и контроля Министерства энергетики Республики Казахстан» и его территориальных органов
  kaz: «Қазақстан Республикасы Энергетика министрлігінің Экологиялық реттеу және бақылау комитеті» республикалық мемлекеттік мекемесінің және оның аумақтық органдарының ережелерін бекіту туралы
