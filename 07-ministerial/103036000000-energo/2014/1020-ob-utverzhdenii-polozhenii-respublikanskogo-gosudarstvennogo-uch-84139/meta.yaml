  code: '97847'
  requisite: Приказ Министра энергетики Республики Казахстан от 3 декабря 2015 года № 690. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 декабря 2015 года № 12473. Утратил силу приказом и.о. Министра экологии и природных ресурсов Республики Казахстан от 22 сентября 2023 года № 267-п
  title:
    rus: О внесении изменений и дополнения в приказ Министра энергетики Республики Казахстан от 20 октября 2014 года № 62 «Об утверждении положений государственного учреждения «Комитет экологического регулирования, контроля и государственной инспекции в нефтегазовом комплексе Министерства энергетики Республики Казахстан» и его территориальных органов»
    kaz: «Қазақстан Республикасының Энергетика министрлігінің Мұнай-газ кешеніндегі экологиялық реттеу, бақылау және мемлекеттік инспекция комитеті» мемлекеттік мекемесінің және оның аумақтық органдарының ережелерін бекіту туралы» Қазақстан Республикасының Энергетика Министрінің 2014 жылғы 20 қазандағы № 62 бұйрығына өзгерістер мен толықтыру енгізу туралы
