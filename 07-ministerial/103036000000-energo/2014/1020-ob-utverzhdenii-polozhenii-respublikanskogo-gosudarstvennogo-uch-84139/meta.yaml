  requisite: Приказ и.о. Министра энергетики Республики Казахстан от 25 июля 2016 года № 341
  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 20 октября 2014 года № 62 "Об утверждении положений государственного учреждения «Комитет экологического регулирования, контроля и государственной инспекции в нефтегазовом комплексе Министерства энергетики Республики Казахстан" и его территориальных органов"
    kaz: '"Қазақстан Республикасы Энергетика министрлігінің Мұнай-газ кешеніндегі экологиялық реттеу, бақылау және мемлекеттік инспекция комитеті" мемлекеттік мекемесінің және оның аумақтық органдарының ережелерін бекіту туралы Қазақстан Республикасы Энергетика министрінің 2014 жылғы 20 қазандағы № 62 бұйрығына өзгерістер енгізу туралы'
