act_code: '183460'
requisite: Приказ Министра энергетики Республики Казахстан от 30 июня 2023 года № 246. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июня 2023 года № 32970
title:
  rus: Об утверждении предельных цен оптовой реализации товарного газа на внутреннем рынке Республики Казахстан, предназначенного для последующей реализации крупным коммерческим потребителям, лицам, осуществляющим цифровой майнинг, или лицам по производству электрической энергии для осуществления цифрового майнинга
  kaz: Ірі коммерциялық тұтынушыларға, цифрлық майнингті жүзеге асыратын тұлғаларға немесе цифрлық майнингті жүзеге асыру үшін электр энергиясын өндіру жөніндегі тұлғаларға кейіннен өткізуге арналған Қазақстан Республикасының ішкі нарығында тауарлық газды көтерме саудада өткізудің 2023 жылғы 1 шілдеден 2024 жылғы 30 маусымды қоса алған кезеңге арналған шекті бағаларын бекіту туралы
