title:
  rus: Об утверждении Методики расчета региональных коэффициентов перевода объемных показателей приборов учета сжиженного нефтяного газа в массовые показатели и расчета потерь при эксплуатации объектов систем снабжения сжиженным нефтяным газом
  kaz: Сұйытылған мұнай газын есепке алу аспаптарының көлемдік көрсеткіштерін массалық көрсеткіштерге ауыстырудың өңірлік коэффициенттерін есептеу және сұйытылған мұнай газымен жабдықтау жүйелерінің объектілерін пайдалану кезіндегі ысырапты есептеу әдістемесін бекіту туралы
