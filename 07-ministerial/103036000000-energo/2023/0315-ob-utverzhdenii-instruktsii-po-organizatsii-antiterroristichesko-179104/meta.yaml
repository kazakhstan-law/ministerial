    kaz: «Қазақстан Республикасы Энергетика министрлігінің қарамағындағы террористік тұрғыдан осал мұнай-газ саласы объектілерінің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2023 жылғы 15 наурыздағы № 106 бұйрығына толықтырулар енгізу туралы
