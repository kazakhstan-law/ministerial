title:
  rus: Об утверждении инструкции по организации антитеррористической защиты объектов нефтегазовой отрасли, уязвимых в террористическом отношении, находящихся в ведении Министерства энергетики Республики Казахстан
  kaz: Қазақстан Республикасы Энергетика министрлігінің қарамағындағы террористік тұрғыдан осал мұнай-газ саласы объектілерінің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
