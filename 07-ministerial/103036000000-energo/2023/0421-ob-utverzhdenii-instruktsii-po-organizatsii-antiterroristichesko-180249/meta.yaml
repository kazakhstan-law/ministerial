title:
  rus: Об утверждении инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, осуществляющих деятельность в области использования атомной энергии Республики Казахстан
  kaz: Қазақстан Республикасының атом энергиясын пайдалану саласындағы қызметті жүзеге асыратын террористік тұрғыдан осал объектілерінің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
