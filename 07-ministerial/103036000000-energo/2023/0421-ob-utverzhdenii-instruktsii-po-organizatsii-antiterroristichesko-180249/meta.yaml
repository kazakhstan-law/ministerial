  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 21 апреля 2023 года № 153 «Об утверждении инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, осуществляющих деятельность в области использования атомной энергии Республики Казахстан»
    kaz: «Қазақстан Республикасының атом энергиясын пайдалану саласындағы қызметті жүзеге асыратын террористік тұрғыдан осал объектілерінің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2023 жылғы 21 сәуірдегі № 153 бұйрығына өзгерістер енгізу туралы
