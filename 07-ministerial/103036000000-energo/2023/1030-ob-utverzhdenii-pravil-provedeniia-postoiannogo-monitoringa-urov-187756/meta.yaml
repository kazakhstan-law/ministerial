title:
  rus: Об утверждении Правил проведения постоянного мониторинга уровня радиоактивного загрязнения атмосферного воздуха, подземных и поверхностных вод, почвы и растений, а также определения параметров миграции радионуклидов в Семипалатинской зоне ядерной безопасности
  kaz: Семей ядролық қауіпсіздік аймағында атмосфералық ауаның, жерасты және жерүсті суларының, топырақ пен өсімдіктердің радиоактивті ластану деңгейіне тұрақты мониторинг жүргізу, сондай-ақ радионуклидтердің таралу параметрлерін айқындау қағидаларын бекіту туралы
