title:
  rus: Об утверждении предельных цен розничной реализации сжиженного нефтяного газа в рамках плана поставки сжиженного нефтяного газа на внутренний рынок Республики Казахстан вне товарных бирж для автогазозаправочных станций на территории Республики Казахстан
  kaz: Қазақстан Республикасының аумағындағы автогаз құю станциялары үшін Қазақстан Республикасының ішкі нарығына сұйытылған мұнай газын беру жоспары шеңберінде тауар биржаларынан тыс сұйытылған мұнай газын бөлшек саудада өткізудің шекті бағаларын бекіту туралы
