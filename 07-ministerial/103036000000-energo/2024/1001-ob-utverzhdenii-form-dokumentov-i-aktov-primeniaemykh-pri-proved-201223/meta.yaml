act_code: '201223'
requisite: Приказ Министра энергетики Республики Казахстан от 1 октября 2024 года № 352. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 октября 2024 года № 35185
title:
  rus: Об утверждении форм документов и актов, применяемых при проведении государственного контроля в области теплоэнергетики в части эксплуатации и технического состояния объектов теплоэнергетики, теплопроизводящих и теплотранспортирующих субъектов и в области электроэнергетики в части эксплуатации и технического состояния энергетического оборудования, энергопроизводящих организаций (за исключением возобновляемых источников энергии), энергопередающих организаций и системного оператора
  kaz: Жылу энергетикасы объектілерін пайдалану және олардың техникалық жай-күйі, жылу өндіруші және жылу тасымалдаушы субъектілер бөлігінде жылу энергетикасы саласында және энергетикалық жабдықты пайдалану және олардың техникалық жай-күйі, энергия өндіруші ұйымдар (жаңартылатын энергия көздерін қоспағанда), энергия беруші ұйымдар және жүйелік оператор бөлігінде электр энергетикасы саласында мемлекеттік бақылау жүргізу кезінде қолданылатын құжаттар мен актілердің нысандарын бекіту туралы
