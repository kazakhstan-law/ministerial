title:
  rus: Об утверждении Правил оказания государственной услуги «Включение в перечень промышленных потребителей, использующих сжиженный нефтяной газ в качестве сырья для производства нефтегазохимической продукции»
  kaz: «Сұйытылған мұнай газын мұнай-газ-химия өнімдерін өндіру үшін шикізат ретінде пайдаланатын өнеркәсіптік тұтынушылардың тізбесіне енгізу» мемлекеттік қызмет көрсету қағидаларын бекіту туралы
