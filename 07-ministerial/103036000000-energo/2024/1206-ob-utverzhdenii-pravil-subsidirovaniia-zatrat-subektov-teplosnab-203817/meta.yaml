title:
  rus: Об утверждении Правил субсидирования затрат субъектов теплоснабжения на погашение и обслуживание займов международных финансовых организаций, привлеченных для реализации проектов по расширению, модернизации, реконструкции, обновлению, поддержанию существующих активов и созданию новых активов
  kaz: Жылумен жабдықтау субьектілерінің қолда бар активтерді кеңейту, жаңғырту, реконструкциялау, жаңарту, ұстап тұру және жаңа активтерді құру жөніндегі жобаларды іске асыру үшін тартылған халықаралық қаржы ұйымдарының қарыздарын өтеуге және оларға қызмет көрсетуге арналған шығындарын субсидиялау қағидаларын бекіту туралы
