  title:
    rus: О внесении изменений в приказы Министра энергетики Республики Казахстан от 28 октября 2014 года № 77 «Об утверждении квалификационных требований и перечня документов, подтверждающих соответствие им, для осуществления деятельности в сфере углеводородов» и от 10 апреля 2020 года № 139 «Об утверждении Правил оказания государственной услуги «Лицензия на проектирование (технологическое) и (или) эксплуатацию горных производств (углеводороды), нефтехимических производств, эксплуатацию магистральных газопроводов, нефтепроводов, нефтепродуктопроводов в сфере углеводородов»
    kaz: Қазақстан Республикасы Энергетика министрінің «Көмірсутектер саласындағы қызметтi жүзеге асыру үшін қойылатын біліктілік талаптары мен оларға сәйкестiкті растайтын құжаттар тiзбесін бекіту туралы» 2014 жылғы 28 қазандағы № 77 және «Көмірсутектер саласындағы тау-кен өндірістерін (көмірсутектер), мұнай-химия өндірістерін жобалауға (технологиялық) және (немесе) пайдалануға, магистральдық газ құбырларын, мұнай құбырларын, мұнай өнімдері құбырларын пайдалануға арналған лицензия» мемлекеттік қызмет көрсету қағидаларын бекіту туралы» 2020 жылғы 10 сәуірдегі № 139 бұйрықтарына өзгерістер енгізу туралы
