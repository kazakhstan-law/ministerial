  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 10 апреля 2020 года № 139 «Об утверждении Правил оказания государственной услуги «Лицензия на проектирование (технологическое) и (или) эксплуатацию горных производств (углеводороды), нефтехимических производств, эксплуатацию магистральных газопроводов, нефтепроводов, нефтепродуктопроводов в сфере углеводородов»
    kaz: «Көмірсутектер саласындағы тау-кен өндірістерін (көмірсутектер), мұнай-химия өндірістерін жобалауға (технологиялық) және (немесе) пайдалануға, магистральдық газ құбырларын, мұнай құбырларын, мұнай өнімдері құбырларын пайдалануға арналған лицензия» мемлекеттік қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2020 жылғы 10 сәуірдегі № 139 бұйрығына өзгерістер енгізу туралы
