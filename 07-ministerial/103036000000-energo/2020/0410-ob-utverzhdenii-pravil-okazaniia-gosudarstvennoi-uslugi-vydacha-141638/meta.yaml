title:
  rus: Об утверждении Правил оказания государственной услуги "Выдача лицензии на работы и услуги в сфере углеводородов"
  kaz: «Көмірсутектер саласындағы жұмыстарға және көрсетілетін қызметтерге лицензия беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы
