title:
  rus: Об утверждении Правил проведения аукциона с использованием объекта информатизации оператора электронных аукционов на предоставление права недропользования по углеводородам в электронной форме
  kaz: Көмірсутектер бойынша жер қойнауын пайдалану құқығын беруге арналған электрондық аукциондар операторының ақпараттандыру обьектісін пайдалана отырып, электрондық нысанда аукцион өткізу қағидаларын бекіту туралы
