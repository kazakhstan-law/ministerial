  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра энергетики Республики Казахстан от 30 июля 2020 года № 269 «Об утверждении Правил проведения аукциона с использованием объекта информатизации оператора электронных аукционов на предоставление права недропользования по углеводородам в электронной форме»
    kaz: «Көмірсутектер бойынша жер қойнауын пайдалану құқығын беруге арналған электрондық аукциондар операторының ақпараттандыру объектін пайдалана отырып, электрондық нысанда аукцион өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2020 жылғы 30 шілдедегі № 269 бұйрығына өзгерістер мен толықтырулар енгізу туралы
