caused_by:
  code: '215323'
  requisite: Приказ Министра энергетики Республики Казахстан от 6 октября 2025 года № 374-н/қ. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 октября 2025 года № 37080
  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 11 июня 2018 года № 233 «Об утверждении типовых контрактов на недропользование» и приказ исполняющего обязанности Министра энергетики Республики Казахстан от 30 июля 2020 года № 269 «Об утверждении Правил проведения аукциона с использованием объекта информатизации оператора электронных аукционов на предоставление права недропользования по углеводородам в электронной форме»
    kaz: «Жер қойнауын пайдалануға арналған үлгілік келісімшарттарды бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2018 жылғы 11 маусымдағы № 233 бұйрығына және «Көмірсутектер бойынша жер қойнауын пайдалану құқығын беруге арналған электрондық аукциондар операторының ақпараттандыру обьектісін пайдалана отырып, электрондық нысанда аукцион өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2020 жылғы 30 шілдедегі № 269 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/215323/rus
