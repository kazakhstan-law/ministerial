requisite: Приказ Министра энергетики Республики Казахстан от 27 декабря 2017 года № 478. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 февраля 2018 года № 16301. Утратил силу приказом и.о. Министра экологии, геологии и природных ресурсов Республики Казахстан от 15 июня 2020 года № 145 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Заключение уполномоченного органа государств - членов Евразийского экономического союза на транзит опасных отходов через таможенную территорию Евразийского экономического союза»
  kaz: «Еуразиялық экономикалық одақтың кедендік аумағы арқылы қауіпті қалдықтардың транзитіне Еуразиялық экономикалық одаққа мүше мемлекеттердің уәкілетті органының қорытындысы» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
