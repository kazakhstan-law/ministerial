act_code: '118060'
requisite: Приказ Министра энергетики Республики Казахстан от 21 декабря 2017 года № 466. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 января 2018 года № 16240
title:
  rus: Об утверждении Правил организации и проведения аукционных торгов, включающие квалификационные требования, предъявляемые к участникам аукциона, содержание и порядок подачи заявки, виды финансового обеспечения заявки на участие в аукционе и условия их внесения и возврата, порядок подведения итогов и определения победителей
  kaz: «Аукционға қатысушыларға қойылатын біліктілік талаптарын, өтінімнің мазмұнын және оны беру тәртібін, аукционға қатысуға арналған өтінімді қаржылық қамтамасыз ету түрлерін және оларды енгізу мен қайтару шарттарын, қорытынды шығару және жеңімпаздарды анықтау тәртібін қамтитын аукциондық сауда-саттықты ұйымдастыру мен өткізу қағидаларын бекіту туралы»
