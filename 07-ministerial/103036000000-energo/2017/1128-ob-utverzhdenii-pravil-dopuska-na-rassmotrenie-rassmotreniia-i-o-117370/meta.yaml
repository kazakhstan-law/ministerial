  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 28 ноября 2017 года № 416 «Об утверждении Правил допуска на рассмотрение, рассмотрения и отбора инвестиционных программ модернизации, расширения, реконструкции и (или) обновления, заключения инвестиционных соглашений на модернизацию, расширение, реконструкцию и (или) обновление, соответствующего заключения договоров о покупке услуги по поддержанию готовности электрической мощности и установления для данных договоров индивидуальных тарифов на услугу по поддержанию готовности электрической мощности, объемов и сроков покупки услуги по поддержанию готовности электрической мощности»
    kaz: «Жаңғыртудың, кеңейтудің, реконструкциялаудың және (немесе) жаңартудың инвестициялық бағдарламаларын қарауға жіберу, оларды қарау және іріктеу, жаңғыртуға, кеңейтуге, реконструкциялауға және (немесе) жаңартуға арналған инвестициялық келісімдерді жасасу, электр қуатының әзірлігін ұстап тұру бойынша көрсетілетін қызметті сатып алу туралы шарттарды тиісінше жасасуды және осы шарттар үшін электр қуатының әзірлігін ұстап тұру бойынша көрсетілетін қызметке жеке тарифтерді, электр қуатының әзірлігін ұстап тұру бойынша көрсетілетін қызметті сатып алу көлемдері мен мерзімдерін белгілеу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2017 жылғы 28 қарашадағы № 416 бұйрығына өзгерістер енгізу туралы
