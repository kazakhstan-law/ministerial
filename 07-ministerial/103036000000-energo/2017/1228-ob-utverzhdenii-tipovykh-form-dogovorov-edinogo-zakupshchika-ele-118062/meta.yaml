  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 28 декабря 2017 года № 480 «Об утверждении типовых форм договоров расчетно-финансового центра с энергопроизводящими организациями, использующими возобновляемые источники энергии, энергетическую утилизацию отходов, энергопроизводящими организациями, осуществляющими производство и отпуск в сеть паводковой электрической энергии, условными потребителями и квалифицированными условными потребителями»
    kaz: «Қаржы-есеп айырысу орталығының жаңартылатын энергия көздерін, қалдықтарды энергетикалық кәдеге жаратуды пайдаланатын энергия өндіруші ұйымдармен, тасқындық электр энергиясын өндіруді және желіге жіберуді жүзеге асыратын энергия өндіруші ұйымдармен, шартты тұтынушылармен және басым шартты тұтынушылармен жасалатын шарттарының үлгілік нысандарын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2017 жылғы 28 желтоқсандағы № 480 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/186564/rus
