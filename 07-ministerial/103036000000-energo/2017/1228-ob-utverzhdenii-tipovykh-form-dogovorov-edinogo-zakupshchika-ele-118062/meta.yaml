title:
  rus: Об утверждении типовых форм договоров единого закупщика электрической энергии с энергопроизводящими организациями, использующими возобновляемые источники энергии, энергетическую утилизацию отходов, промышленными комплексами, прямыми потребителями, и квалифицированными потребителями
  kaz: Электр энергиясын бірыңғай сатып алушының жаңартылатын энергия көздерін, қалдықтарды энергетикалық кәдеге жаратуды пайдаланатын энергия өндіруші ұйымдармен, өнеркәсіптік кешендермен, тікелей тұтынушылармен және басым тұтынушылармен жасалатын шарттарының үлгілік нысандарын бекіту туралы
