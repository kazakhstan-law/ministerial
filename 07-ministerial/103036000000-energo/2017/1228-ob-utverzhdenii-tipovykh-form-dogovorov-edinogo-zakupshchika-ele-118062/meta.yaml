  title:
    rus: О внесении изменений и дополнений в приказ Министра энергетики Республики Казахстан от 28 декабря 2017 года № 480 «Об утверждении типовых форм договоров расчетно-финансового центра с энергопроизводящими организациями, использующими возобновляемые источники энергии, условными потребителями и квалифицированными условными потребителями»
    kaz: «Қаржы-есеп айырысу орталығының жаңартылатын энергия көздерін пайдаланатын энергия өндіруші ұйымдармен, шартты тұтынушылармен және басым шартты тұтынушылармен жасалатын шарттарының үлгілік нысандарын бекiту туралы» Қазақстан Республикасы Энергетика министрінің 2017 жылғы 28 желтоқсандағы № 480 бұйрығына өзгерістер мен толықтырулар енгізу туралы
