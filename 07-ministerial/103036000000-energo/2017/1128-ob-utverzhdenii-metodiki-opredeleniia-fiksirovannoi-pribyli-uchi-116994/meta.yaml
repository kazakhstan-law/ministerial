requisite: Приказ Министра энергетики Республики Казахстан от 28 ноября 2017 года № 413. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 декабря 2017 года № 16096. Утратил силу приказом Министра энергетики Республики Казахстан от 22 мая 2020 года № 205 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики определения фиксированной прибыли, учитываемой при утверждении предельных тарифов на электрическую энергию, а также фиксированной прибыли за балансирование, учитываемой при утверждении предельных тарифов на балансирующую электроэнергию
  kaz: Электр энергиясына шекті тарифтерді бекіту кезінде ескерілетін тіркелген пайданы, сондай-ақ теңгерімдеуші электр энергиясына шекті тарифтерді бекіту кезінде ескерілетін теңгерімдеуге тіркелген пайданы айқындау әдістемесін бекіту туралы
