  title:
    rus: О внесении изменений и дополнений в приказ и.о. Министра энергетики Республики Казахстан от 30 апреля 2021 года № 161 «Об утверждении Правил организации и проведения аукционных торгов на строительство вновь вводимых в эксплуатацию генерирующих установок с маневренным режимом генерации»
    kaz: «Генерацияның маневрлік режимі бар жаңадан пайдалануға берілетін генерациялайтын қондырғыларды салуға аукциондық сауда-саттықты ұйымдастыру және өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2021 жылғы 30 сәуірдегі № 161 бұйрығына өзгерістер мен толықтырулар енгізу туралы
