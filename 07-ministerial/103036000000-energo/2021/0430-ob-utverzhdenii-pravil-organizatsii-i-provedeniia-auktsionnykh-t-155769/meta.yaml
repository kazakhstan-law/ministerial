  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра энергетики Республики Казахстан от 30 апреля 2021 года № 161 «Об утверждении Правил организации и проведения аукционных торгов на строительство вновь вводимых в эксплуатацию генерирующих установок с маневренным режимом генерации»
    kaz: «Генерацияның маневрлік режимі бар жаңадан пайдалануға берілетін генерациялайтын қондырғыларды салуға арналған аукциондық сауда-саттықты ұйымдастыру мен өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2021 жылғы 30 сәуірдегі № 161 бұйрығына өзгерістер мен толықтыру енгізу туралы
