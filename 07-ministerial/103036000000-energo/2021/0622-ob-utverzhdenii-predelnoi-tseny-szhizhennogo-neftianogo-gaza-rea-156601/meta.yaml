title:
  rus: Об утверждении предельной цены сжиженного нефтяного газа, реализуемого в рамках плана поставки сжиженного нефтяного газа на внутренний рынок Республики Казахстан вне электронных торговых площадок
  kaz: Қазақстан Республикасының ішкі нарығына сұйытылған мұнай газын беру жоспары шеңберінде электрондық сауда алаңдарынан тыс өткізілетін сұйытылған мұнай газының шекті бағасын бекіту туралы
