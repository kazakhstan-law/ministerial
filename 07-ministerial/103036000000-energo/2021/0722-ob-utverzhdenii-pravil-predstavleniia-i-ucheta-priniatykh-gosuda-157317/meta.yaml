title:
  rus: Об утверждении Правил представления и учета принятых государственным органом обеспечений исполнения обязательств по ликвидации последствий операций в области углеводородов и (или) добычи урана
  kaz: Мемлекеттік орган қабылдаған көмірсутектер және (немесе) уран өндіру саласындағы операциялардың салдарын жою бойынша міндеттемелерді орындауды қамтамасыз етулерді ұсыну және есепке алу қағидаларын бекіту туралы
