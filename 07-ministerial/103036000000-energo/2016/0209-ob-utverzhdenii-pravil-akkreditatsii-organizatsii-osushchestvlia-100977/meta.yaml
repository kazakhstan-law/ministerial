title:
  rus: Об утверждении Правил аккредитации организаций, осуществляющих экспертизу ядерной безопасности и (или) радиационной безопасности, и (или) ядерной физической безопасности
  kaz: Ядролық және (немесе) радиациялық қауіпсіздік, және (немесе) ядролық физикалық қауіпсіздік сараптамасын жүзеге асыратын ұйымдарды аккредиттеу қағидаларын бекіту туралы
