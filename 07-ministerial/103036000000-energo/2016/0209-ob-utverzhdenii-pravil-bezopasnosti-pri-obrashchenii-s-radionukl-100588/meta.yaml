  title:
    rus: О внесении изменений и дополнений в приказы Министра энергетики Республики Казахстан от 8 февраля 2016 года № 39 «Об утверждении Правил организации сбора, хранения и захоронения радиоактивных отходов и отработавшего ядерного топлива» и от 9 февраля 2016 года № 49 «Об утверждении Правил безопасности при обращении с радионуклидными источниками»
    kaz: Қазақстан Республикасы Энергетика министрінің «Радиоактивтi қалдықтарды және пайдаланылып болған ядролық отынды жинауды, сақтауды және көмудi ұйымдастыру қағидаларын бекіту туралы» 2016 жылғы 8 ақпандағы № 39 және «Радионуклидті көздермен жұмыс істеу кезіндегі қауіпсіздік қағидаларын бекіту туралы» 2016 жылғы 9 ақпандағы № 49 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
