  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра энергетики Республики Казахстан от 27 июля 2016 года № 343 «Об утверждении типового договора о подключении объектов по использованию возобновляемых источников энергии, а также правил его заключения»
    kaz: «Жаңартылатын энергия көздерін пайдалану объектілерін қосу туралы үлгілік шартты, сондай-ақ оны жасасу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2016 жылғы 27 шілдедегі № 343 бұйрығына өзгерістер енгізу туралы
