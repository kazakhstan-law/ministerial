title:
  rus: Об утверждении типового договора о подключении объектов по использованию возобновляемых источников энергии, объектов по энергетической утилизации отходов, а также правил и сроков его заключения
  kaz: Жаңартылатын энергия көздерін пайдалану объектілерін, қалдықтарды энергетикалық кәдеге жарату объектілерін қосу туралы үлгілік шартты, сондай-ақ оны жасасу қағидалары мен мерзімдерін бекіту туралы
