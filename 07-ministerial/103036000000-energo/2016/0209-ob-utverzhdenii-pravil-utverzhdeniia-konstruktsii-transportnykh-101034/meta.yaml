  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 9 февраля 2016 года № 45 «Об утверждении Правил аккредитации организаций, осуществляющих экспертизу ядерной, радиационной и ядерной физической безопасности» и приказ Министра энергетики Республики Казахстан от 9 февраля 2016 года № 51 «Об утверждении Правил конструкций транспортных упаковочных комплектов»
    kaz: «Ядролық, радиациялық және ядролық физикалық қауіпсіздік сараптамасын жүзеге асыратын ұйымдарды аккредиттеу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2016 жылғы 9 ақпандағы № 45 бұйрығына және «Көліктік қаптама комплектілерінің конструкцияларын бекіту қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2016 жылғы 9 ақпандағы № 51 бұйрығына өзгерістер енгізу туралы
