title:
  rus: Об утверждении Правил определения объема услуги по поддержанию готовности электрической мощности для договоров о покупке услуги по поддержанию готовности электрической мощности, заключаемых единым закупщиком с действующими энергопроизводящими организациями, в состав которых входят теплоэлектроцентрали
  kaz: Бірыңғай сатып алушы құрамына жылу электр орталықтары кіретін жұмыс істеп тұрған энергия өндіруші ұйымдармен жасасатын электр қуатының әзірлігін ұстап тұру бойынша көрсетілетін қызметті сатып алу туралы шарттар үшін электр қуатының әзірлігін ұстап тұру бойынша көрсетілетін қызметтің көлемін айқындау қағидаларын бекіту туралы
