title:
  rus: Об утверждении критериев оценки степени риска и проверочных листов в сфере контроля за производством отдельных видов нефтепродуктов
  kaz: Мұнай өнімдерінің жекелеген түрлерін өндіруді бақылау саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
