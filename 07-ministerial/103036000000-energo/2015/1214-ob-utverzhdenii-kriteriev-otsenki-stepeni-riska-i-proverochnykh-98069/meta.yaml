  title:
    rus: О внесении изменения в совместный приказ Министра национальной экономики Республики Казахстан от 28 декабря 2015 года № 799 и и.о. Министра энергетики Республики Казахстан от 14 декабря 2015 года № 719 "Об утверждении критериев оценки степени риска и проверочного листа в сфере производства отдельных видов нефтепродуктов"
    kaz: '"Мұнай өнімдерінің жекелеген түрлерін өндіру саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы" Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 28 желтоқсандағы № 799 және Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2015 жылғы 14 желтоқсандағы № 719 бірлескен бұйрығына өзгеріс енгізу туралы'
