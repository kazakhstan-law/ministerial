  title:
    rus: О внесении изменений и дополнения в совместный приказ исполняющего обязанности Министра энергетики Республики Казахстан от 14 декабря 2015 года № 719 и Министра национальной экономики Республики Казахстан от 28 декабря 2015 года № 799 «Об утверждении критериев оценки степени риска и проверочного листа в сфере производства отдельных видов нефтепродуктов»
    kaz: «Мұнай өнімдерінің жекелеген түрлерін өндіру саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2015 жылғы 14 желтоқсандағы № 719 және Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 28 желтоқсандағы № 799 бірлескен бұйрығына өзгерістер мен толықтыру енгізу туралы
