act_code: '97375'
requisite: Совместный приказ Министра энергетики Республики Казахстан от 14 декабря 2015 года № 716 и Министра национальной экономики Республики Казахстан от 29 декабря 2015 года № 816
title:
  rus: О признании утратившим силу совместного приказа Министра экономики и бюджетного планирования Республики Казахстан от 18 февраля 2010 года № 75 и исполняющего обязанности Министра энергетики и минеральных ресурсов Республики Казахстан от 15 февраля  2010 года № 36 «Об утверждении критериев оценки степени риска в области электроэнергетики для объектов, осуществляющих эксплуатацию энергетического оборудования электрических станций, электрических и тепловых сетей, а также электрических и теплоиспользующих установок потребителей»
  kaz: «Электр станцияларының, электр және жылу желілерінің энергетикалық жабдықтарын, сондай-ақ тұтынушылардың электр және жылу пайдаланатын қондырғыларын пайдалануды жүзеге асыратын объектілерге арналған электр энергетикасы саласындағы тәуекелдер дәрежесін бағалау критерийлерін бекіту туралы» Қазақстан Республикасы Экономика және бюджеттік жоспарлау министрінің 2010 жылғы 18 ақпандағы № 75 және Қазақстан Республикасы Энергетика және минералдық ресурстар министрінің міндетін атқарушының 2010 жылғы 15 ақпандағы № 36 бірлескен бұйрығының күшін жою туралы
