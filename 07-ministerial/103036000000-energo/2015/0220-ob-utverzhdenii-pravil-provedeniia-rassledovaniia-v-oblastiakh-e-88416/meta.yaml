  title:
    rus: О внесении изменения в приказ Министра энергетики Республики Казахстан от 20 февраля 2015 года № 121 «Об утверждении Правил проведения расследования и учета технологических нарушений в работе единой электроэнергетической системы, электростанций, районных котельных, электрических и тепловых сетей»
    kaz: «Бірыңғай электр энергетикасы жүйесінің, электр станцияларының, аудандық қазандықтардың, электр және жылу желілерінің жұмысындағы технологиялық бұзушылықтарға тергеп-тексеру жүргізу және оларды есепке алу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 20 ақпандағы № 121 бұйрығына өзгеріс енгізу туралы
