title:
  rus: Об утверждении Правил проведения расследования в областях электроэнергетики и теплоэнергетики, учета технологических нарушений в области электроэнергетики, в централизованных и местных системах теплоснабжения
  kaz: Электр энергетикасы және жылу энергетикасы салаларындағы тергеп-тексеру жүргізу, электр энергетикасы саласындағы, орталықтандырылған және жергілікті жылумен жабдықтау жүйелеріндегі технологиялық бұзушылықтарды есепке алу қағидаларын бекіту туралы
