  title:
    rus: О внесении изменений и дополнения в приказ Министра энергетики Республики Казахстан от 20 февраля 2015 года № 121 «Об утверждении Правил проведения расследования в областях электроэнергетики и теплоэнергетики, учета технологических нарушений в области электроэнергетики, в централизованных и местных системах теплоснабжения»
    kaz: «Электр энергетикасы және жылу энергетикасы салаларындағы тергеп-тексеру жүргізу, электр энергетикасы саласындағы, орталықтандырылған және жергілікті жылумен жабдықтау жүйелеріндегі технологиялық бұзушылықтарды есепке алу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 20 ақпандағы № 121 бұйрығына өзгерістер мен толықтыру енгізу туралы
