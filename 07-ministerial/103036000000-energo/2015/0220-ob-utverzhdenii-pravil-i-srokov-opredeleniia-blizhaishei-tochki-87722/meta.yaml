  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 20 февраля 2015 года № 117 «Об утверждении Правил определения ближайшей точки подключения к электрическим или тепловым сетям и подключения объектов по использованию возобновляемых источников энергии»
    kaz: «Электр немесе жылу желілеріне қосылатын ең жақын нүктені айқындау және жаңартылатын энергия көздерін пайдалану объектілерін қосу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 20 ақпандағы № 117 бұйрығына өзгерістер енгізу туралы
