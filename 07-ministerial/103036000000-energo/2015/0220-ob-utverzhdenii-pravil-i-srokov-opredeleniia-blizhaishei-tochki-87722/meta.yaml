title:
  rus: Об утверждении Правил и сроков определения ближайшей точки подключения к электрическим или тепловым сетям и подключения объектов по использованию возобновляемых источников энергии, объектов по энергетической утилизации отходов
  kaz: Электр немесе жылу желілеріне ең жақын қосу нүктесін айқындау және жаңартылатын энергия көздерін пайдалану объектілерін, қалдықтарды энергетикалық кәдеге жарату объектілерін қосу қағидалары мен мерзімдерін бекіту туралы
