act_code: '91710'
requisite: Приказ Министра энергетики Республики Казахстан от 23 февраля 2015 года № 132. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июня 2015 года № 11279. Утратил силу приказом Министра энергетики Республики Казахстан от 10 апреля 2020 года № 139 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении стандартов государственных услуг Министерства энергетики Республики Казахстан в сферах углеводородов и газа и газоснабжения
  kaz: Қазақстан Республикасы Энергетика министрлігінің көмірсутектер мен газ және газбен жабдықтау салаларындағы мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы
