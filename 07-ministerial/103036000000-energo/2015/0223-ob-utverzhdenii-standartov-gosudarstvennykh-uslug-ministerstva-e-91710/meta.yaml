  title:
    rus: О внесении изменения в приказ Министра энергетики Республики Казахстан от 23 февраля 2015 года № 132 «Об утверждении стандартов государственных услуг Министерства энергетики Республики Казахстан в сфере нефти и газа»
    kaz: «Қазақстан Республикасы Энергетика министрлігінің мұнай және газ саласындағы мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 23 ақпандағы № 132 бұйрығына өзгеріс енгізу туралы
