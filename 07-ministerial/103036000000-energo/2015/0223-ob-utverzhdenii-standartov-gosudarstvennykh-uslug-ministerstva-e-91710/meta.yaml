  title:
    rus: О внесении изменений и дополнений в приказ Министра энергетики Республики от 23 февраля 2015 года № 132 «Об утверждении стандартов государственных услуг Министерства энергетики Республики Казахстан в сферах углеводородов и газа и газоснабжения»
    kaz: «Қазақстан Республикасы Энергетика министрлігінің көмірсутектер мен газ және газбен жабдықтау салаларындағы мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 23 ақпандағы № 132 бұйрығына өзгерістер мен толықтырулар енгізу туралы
