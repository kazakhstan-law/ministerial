  requisite: Приказ и.о. Министра энергетики Республики Казахстан от 13 апреля 2018 года № 125. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 мая 2018 года № 16855. Утратил силу приказом Министра энергетики Республики Казахстан от 10 апреля 2020 года № 139 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра энергетики Республики Казахстан от 29 мая 2015 года № 380 «Об утверждении регламентов государственных услуг Министерства энергетики Республики Казахстан в сфере нефти и газа»
    kaz: «Қазақстан Республикасының Энергетика министрлігінің мұнай және газ саласындағы мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2015 жылғы 29 мамырдағы № 380 бұйрығына өзгерістер енгізу туралы
