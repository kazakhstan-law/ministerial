act_code: '92382'
requisite: Приказ и.о. Министра энергетики Республики Казахстан от 29 мая 2015 года № 380. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 июля 2015 года № 11604. Утратил силу приказом Министра энергетики Республики Казахстан от 10 апреля 2020 года № 139 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов государственных услуг Министерства энергетики Республики Казахстан в сферах углеводородов и газа и газоснабжения
  kaz: Қазақстан Республикасы Энергетика министрлігінің көмірсутектер мен газ және газбен жабдықтау салаларындағы мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы
