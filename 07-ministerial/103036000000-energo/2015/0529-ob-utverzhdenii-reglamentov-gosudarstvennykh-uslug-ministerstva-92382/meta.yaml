  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра энергетики Республики Казахстан от 29 мая 2015 года № 380 «Об утверждении регламентов государственных услуг Министерства энергетики Республики Казахстан в сфере нефти и газа»
    kaz: «Қазақстан Республикасы Энергетика министрлігінің мұнай және газ саласындағы мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы» Қазақстан Республикасы Энергетика Министрінің міндетін атқарушының 2015 жылғы 29 мамырдағы № 380 бұйрығына өзгерістер енгізу туралы
