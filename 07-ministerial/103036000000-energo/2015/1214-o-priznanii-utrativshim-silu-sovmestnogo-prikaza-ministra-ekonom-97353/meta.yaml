act_code: '97353'
requisite: Совместный приказ Министра энергетики Республики Казахстан от 14 декабря 2015 года № 717 и Министра национальной экономики Республики Казахстан от 29 декабря 2015 года № 828
title:
  rus: О признании утратившим силу совместного приказа Министра экономики и бюджетного планирования Республики Казахстан от 18 февраля 2010 года № 76 и исполняющего обязанности Министра энергетики и минеральных ресурсов Республики Казахстан от 15 февраля  2010 года № 37 «Об утверждении формы проверочного листа для объектов, осуществляющих эксплуатацию энергетического оборудования электрических станций, электрических и тепловых сетей, а также электрических и теплоиспользующих установок потребителей»
  kaz: «Электр станцияларының, электр және жылу желілерінің энергетикалық жабдықтарын,  сондай-ақ тұтынушылардың  электр және жылу пайдаланушы қондырғыларын пайдалануды жүзеге асыратын объектілерге арналған тексеру парақтарының нысандарын бекіту туралы» Қазақстан Республикасы Экономика  және бюджеттік жоспарлау министрінің  2010 жылғы 18 ақпандағы № 76 және Қазақстан Республикасы Энергетика және минералдық ресурстар министрінің міндетін атқарушының 2010 жылғы 15 ақпандағы № 37 бірлескен бұйрығының күшін жою туралы
