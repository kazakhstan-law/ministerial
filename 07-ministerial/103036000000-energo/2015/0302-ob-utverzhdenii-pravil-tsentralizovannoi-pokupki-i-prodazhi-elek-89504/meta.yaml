  title:
    rus: О внесении изменений и дополнений в приказ Министра энергетики Республики Казахстан от 2 марта 2015 года № 164 «Об утверждении Правил централизованной покупки и продажи расчетно-финансовым центром электрической энергии, произведенной объектами по использованию возобновляемых источников энергии»
    kaz: «Жаңартылатын энергия көздерін пайдалану объектілері өндірген электр энергиясын қаржы-есеп айырысу орталығының орталықтандырылған сатып алу және сату қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 2 наурыздағы № 164 бұйрығына өзгерістер мен толықтырулар енгізу туралы
