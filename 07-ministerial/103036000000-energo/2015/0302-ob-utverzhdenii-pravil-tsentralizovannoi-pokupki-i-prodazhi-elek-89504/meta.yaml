  title:
    rus: О внесении изменений и дополнений в приказ Министра энергетики Республики Казахстан от 2 марта 2015 года № 164 «Об утверждении Правил централизованной покупки и продажи расчетно-финансовым центром электрической энергии, произведенной объектами по использованию возобновляемых источников энергии, перерасчета и перераспределения расчетно-финансовым центром соответствующей доли электрической энергии на квалифицированного условного потребителя по итогам календарного года»
    kaz: «Қаржы-есеп айырысу орталығының жаңартылатын энергия көздерін пайдалану объектілері өндірген электр энергиясын орталықтандырылған сатып алуы және сатуы, қаржы-есеп айырысу орталығының басым шартты тұтынушыға күнтізбелік жылдың қорытындысы бойынша электр энергиясының тиісті үлесін қайта есептеу және қайта бөлу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 2 наурыздағы № 164 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/154397/rus
