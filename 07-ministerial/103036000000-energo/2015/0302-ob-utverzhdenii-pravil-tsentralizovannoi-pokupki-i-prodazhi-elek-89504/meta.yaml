title:
  rus: Об утверждении правил централизованной покупки и продажи электрической энергии единым закупщиком электрической энергии, произведенной объектами по использованию возобновляемых источников энергии, объектами по энергетической утилизации отходов
  kaz: Электр энергиясын бірыңғай сатып алушының жаңартылатын энергия көздерін пайдалану объектілері, қалдықтарды энергетикалық кәдеге жарату объектілері өндірген электр энергиясын орталықтандырылған сатып алу және сату қағидаларын бекіту туралы
