    rus: О внесении изменений и дополнений в некоторые приказы Министра энергетики Республики Казахстан по вопросам возобновляемых источников энергии
    kaz: Қазақстан Республикасы Энергетика министрлігінің кейбір бұйрықтарына жаңартылатын энергия көздері мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
