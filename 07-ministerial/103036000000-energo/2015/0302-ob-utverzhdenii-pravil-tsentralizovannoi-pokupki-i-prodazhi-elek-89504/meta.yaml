  title:
    rus: О внесении изменений в приказы Министра энергетики Республики Казахстан от 2 марта 2015 года № 164 «Об утверждении правил централизованной покупки и продажи электрической энергии единым закупщиком электрической энергии, произведенной объектами по использованию возобновляемых источников энергии, объектами по энергетической утилизации отходов» и от 28 декабря 2017 года № 480 «Об утверждении типовых форм договоров единого закупщика электрической энергии с энергопроизводящими организациями, использующими возобновляемые источники энергии, энергетическую утилизацию отходов, промышленными комплексами, прямыми потребителями, и квалифицированными потребителями»
    kaz: «Электр энергиясын бірыңғай сатып алушының жаңартылатын энергия көздерін пайдалану объектілері, қалдықтарды энергетикалық кәдеге жарату объектілері өндірген электр энергиясын орталықтандырылған сатып алу және сату қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 2 наурыздағы № 164 және «Электр энергиясын бірыңғай сатып алушының жаңартылатын энергия көздерін, қалдықтарды энергетикалық кәдеге жаратуды пайдаланатын энергия өндіруші ұйымдармен, өнеркәсіптік кешендермен, тікелей тұтынушылармен және басым тұтынушылармен жасалатын шарттарының үлгілік нысандарын бекіту туралы» 2017 жылғы 28 желтоқсандағы № 480 бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/214946/rus
