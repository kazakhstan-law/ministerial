title:
  rus: Об утверждении Правил проведения периодического обследования технического состояния энергетического оборудования, зданий и сооружений электрических станций, электрических и тепловых сетей, а также энергетического оборудования потребителей с привлечением экспертных организаций и заводов-изготовителей
  kaz: Сарапшы ұйымдарды және дайындаушы зауыттарды тарта отырып, электр станцияларының, электр және жылу желілерінің энергетикалық жабдықтарының, ғимараттары мен құрылыстарының, сондай-ақ тұтынушылардың энергетикалық жабдықтарының техникалық жай-күйіне мерзімді зерттеп-қарау жүргізу қағидаларын бекіту туралы
