  title:
    rus: О внесении изменения в приказ Министра энергетики Республики Казахстан от 31 марта 2015 года № 255 «Об утверждении Правил проведения периодического обследования технического состояния энергетического оборудования, зданий и сооружений электрических станций, электрических и тепловых сетей, а также энергетического оборудования потребителей с привлечением экспертных организаций и заводов-изготовителей»
    kaz: «Сарапшы ұйымдарды және дайындаушы зауыттарды тарта отырып, электр станцияларының, электр және жылу желілерінің энергетикалық жабдықтарының, ғимараттары мен құрылыстарының, сондай-ақ тұтынушылардың энергетикалық жабдықтарының техникалық жай-күйіне мерзімді зерттеп-қарау жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 31 наурыздағы № 255 бұйрығына өзгеріс енгізу туралы
