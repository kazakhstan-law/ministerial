title:
  rus: Об утверждении Правил получения энергопроизводящими, энергопередающими организациями и теплопроизводящими, теплотранспортирующими субъектами паспорта готовности к работе в осенне-зимний период
  kaz: Энергия өндіруші, энергия беруші ұйымдар мен жылу өндіруші, жылу тасымалдаушы субъектілердің күзгі-қысқы кезеңдегі жұмысқа әзірлік паспортын алу қағидаларын бекіту туралы
