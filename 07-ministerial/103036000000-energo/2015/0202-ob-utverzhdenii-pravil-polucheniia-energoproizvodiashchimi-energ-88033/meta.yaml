    kaz: '"Энергия өндіруші, энергия беруші ұйымдардың күзгі-қысқы жағдайларда жұмысқа әзірлігі паспортының нысанын және алу қағидаларын бекіту туралы" Қазақстан Республикасы Энергетика министрінің 2015 жылғы 2 ақпандағы № 55 бұйрығына өзгерістер мен толықтыру енгізу туралы'
