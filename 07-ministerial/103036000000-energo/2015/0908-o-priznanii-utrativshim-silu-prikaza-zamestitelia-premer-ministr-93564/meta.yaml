act_code: '93564'
requisite: Приказ Министра энергетики Республики Казахстан от 8 сентября 2015 года № 562
title:
  rus: О признании утратившим силу приказа Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 6 мая 2014 года № 157 "Об утверждении Регламента государственной услуги "Согласование купли-продажи, передачи в аренду или доверительное управление объектов электроэнергетики и (или) его отдельных частей независимо от форм собственности"
  kaz: '"Электр энергетикасы объектілерін және (немесе) оның жекелеген бөліктерін меншік нысанына қарамастан сатып алу-сату, жалға немесе сенімді басқаруға беруге келісу» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы" Қазақстан Республикасы Премьер-Министрінің орынбасары - Қазақстан Республикасы Индустрия және жаңа технологиялар министрінің 2014 жылғы 6 мамырдағы № 157 бұйрығының күшін жою туралы'
