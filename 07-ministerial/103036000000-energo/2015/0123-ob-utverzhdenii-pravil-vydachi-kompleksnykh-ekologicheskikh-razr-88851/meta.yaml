  title:
    rus: Об утверждении Правил выдачи экологических разрешений, представления декларации о воздействии на окружающую среду, а также форм бланков экологического разрешения на воздействие и порядка их заполнения
    kaz: Экологиялық рұқсаттар беру, қоршаған ортаға әсер ету туралы декларацияны ұсыну қағидаларын, әсер етуге экологиялық рұқсат бланкілерінің нысанын және оларды толтыру тәртібін бекіту туралы
