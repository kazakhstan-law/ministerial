act_code: '88851'
requisite: Приказ Министра энергетики Республики Казахстан от 23 января 2015 года № 37. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 апреля 2015 года № 10737. Утратил силу приказом и.о. Министра экологии, геологии и природных ресурсов Республики Казахстан от 9 августа 2021 года № 319 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи комплексных экологических разрешений и перечня типов промышленных объектов, для которых возможно получение комплексных экологических разрешений вместо разрешений на эмиссии в окружающую среду
  kaz: Кешенді экологиялық рұқсаттар беру қағидаларын және қоршаған ортаға эмиссияларға рұқсаттардың орнына кешенді экологиялық рұқсаттар алу мүмкін болатын өнеркәсіп объектілері үлгілерінің тізбесін бекіту туралы
