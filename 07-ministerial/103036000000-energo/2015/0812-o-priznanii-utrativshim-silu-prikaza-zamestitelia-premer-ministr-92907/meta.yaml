act_code: '92907'
requisite: Приказ от 12.08.2015 № 475-ж, Министерство энергетики Республики Казахстан
title:
  rus: О признании утратившим силу приказа Заместителя Премьер-Министра  Республики Казахстан - Министра индустрии и новых технологий  Республики Казахстан от 18 февраля 2014 года № 41 «Об утверждении  квалификационных требований к категориям административных государственных должностей корпуса «Б» Комитета государственного энергетического надзора и контроля Министерства индустрии и новых технологий Республики Казахстан и его территориальных органов»
  kaz: «Қазақстан Республикасы Индустрия және жаңа технологиялар министрлігі Мемлекеттік энергетикалық қадағалау және бақылау комитеті "Б" корпусының және оның аумақтық органдарының мемлекеттік әкімшілік лауазымдар санаттарына қойылатын біліктілік талаптарды бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Қазақстан Республикасы Индустрия және жаңа технологиялар министрінің 2014 жылғы 18 ақпандағы № 41 бұйрығының күші жою туралы
