  title:
    rus: О внесении изменений в некоторые приказы Министра энергетики Республики Казахстан и признании утратившими силу некоторых приказов Министерства энергетики Республики Казахстан
    kaz: Қазақстан Республикасы Энергетика министрінің кейбір бұйрықтарына өзгерістер енгізу және Қазақстан Республикасы Энергетика министрлігінің кейбір бұйрықтарының күші жойылды деп тану туралы
