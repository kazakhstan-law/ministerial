  title:
    rus: О внесении изменений и дополнений в приказ Министра энергетики Республики Казахстан от 18 марта 2015 года № 210 «Об утверждении Правил проведения квалификационных проверок знаний правил технической эксплуатации и правил техники безопасности у руководителей, специалистов организаций, осуществляющих производство, передачу электрической и тепловой энергии, для контроля технического состояния и безопасности эксплуатации электроустановок»
    kaz: «Электр қондырғыларының техникалық жай-күйін және оларды пайдалану қауіпсіздігін бақылау үшін электр және жылу энергиясын өндіруді, беруді жүзеге асыратын ұйымдар басшыларының, мамандарының техникалық пайдалану қағидалары мен қауіпсіздік техникасы қағидаларын білуіне біліктілік тексерулер жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 18 наурыздағы № 210 бұйрығына өзгерістер мен толықтырулар енгізу туралы
