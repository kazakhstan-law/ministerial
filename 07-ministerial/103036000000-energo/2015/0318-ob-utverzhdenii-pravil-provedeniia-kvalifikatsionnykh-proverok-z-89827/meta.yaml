  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 18 марта 2015 года № 210 «Об утверждении Правил проведения квалификационных проверок знаний правил технической эксплуатации и правил безопасности у руководителей, специалистов организаций, осуществляющих производство, передачу и распределение электрической и тепловой энергии, для контроля технического состояния и безопасности эксплуатации электро- и энергоустановок»
    kaz: «Электр және энергия қондырғыларының техникалық жай-күйі мен оларды пайдалану қауіпсіздігін бақылау үшін электр және жылу энергиясын өндіруді, беруді және бөлуді жүзеге асыратын ұйымдар басшыларының, мамандарының техникалық пайдалану қағидаларын және қауіпсіздік қағидаларын білуіне біліктілік тексерулер жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 18 наурыздағы № 210 бұйрығына өзгерістер енгізу туралы
