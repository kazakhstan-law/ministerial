title:
  rus: Об утверждении Правил проведения квалификационных проверок знаний правил технической эксплуатации и правил техники безопасности у руководителей, специалистов организаций, осуществляющих производство, передачу электрической и тепловой энергии, для контроля технического состояния и безопасности эксплуатации электроустановок
  kaz: Электр қондырғыларының техникалық жай-күйін және оларды пайдалану қауіпсіздігін бақылау үшін электр және жылу энергиясын өндіруді, беруді жүзеге асыратын ұйымдар басшыларының, мамандарының техникалық пайдалану қағидалары мен қауіпсіздік техникасы қағидаларын білуіне біліктілік тексерулер жүргізу қағидаларын бекіту туралы
