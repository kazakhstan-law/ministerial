  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 18 марта 2015 года № 210 "Об утверждении Правил проведения квалификационных проверок знаний правил технической эксплуатации и правил безопасности руководителей, специалистов организаций, осуществляющих производство, передачу и распределение электрической и тепловой энергии и их покупку в целях энергоснабжения, для осуществления контроля технического состояния и безопасности эксплуатации электро- и энергоустановок"
    kaz: '"Электр және энергия қондырғыларының техникалық жай-күйі мен оларды пайдалану қауіпсіздігін бақылауды жүзеге асыру үшін электр және жылу энергиясын өндіруді, беру мен бөлуді және энергиямен жабдықтау мақсатында оларды сатып алуды жүзеге асыратын ұйымдар басшыларының, мамандарының техникалық пайдалану қағидаларын және қауіпсіздік қағидаларын білуіне біліктілік тексеру жүргізу қағидаларын бекіту туралы" Қазақстан Республикасы Энергетика министрінің 2015 жылғы 18 наурыздағы № 210 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/105794/rus
