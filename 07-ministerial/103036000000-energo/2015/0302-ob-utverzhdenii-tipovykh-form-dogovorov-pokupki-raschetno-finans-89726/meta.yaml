act_code: '89726'
requisite: Приказ Министра энергетики Республики Казахстан от 2 марта 2015 года № 163. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 апреля 2015 года № 10780. Утратил силу приказом Министра энергетики Республики Казахстан от 28 декабря 2017 года № 480 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении типовых форм договоров покупки расчетно-финансовым центром электрической энергии у энергопроизводящей организации, использующей возобновляемые источники энергии, по фиксированным тарифам и тарифам, не превышающим уровня отпускной цены, установленного в утвержденном и согласованном с уполномоченным или местным исполнительным органом технико-экономическом обосновании проекта строительства объекта по использованию возобновляемых источников энергии, продажи расчетно-финансовым центром условным потребителям электрической энергии, произведенной объектами по использованию возобновляемых источников энергии
  kaz: Қаржы-есеп айырысу орталығының жаңартылатын энергия көздерін пайдаланатын энергия өндіруші ұйымнан электр энергиясын тіркелген тарифтер және жаңартылатын энергия көздерін пайдалану объектісін салу жобасының уәкілетті немесе жергілікті атқарушы орган бекіткен және олармен келісілген техникалық-экономикалық негіздемесінде белгіленген босату бағасының деңгейінен аспайтын тарифтер бойынша сатып алуы, қаржы-есеп айырысу орталығының жаңартылатын энергия көздерін пайдалану объектілері өндірген электр энергиясын шартты тұтынушыларға сатуы шарттарының үлгі нысандарын бекiту туралы
