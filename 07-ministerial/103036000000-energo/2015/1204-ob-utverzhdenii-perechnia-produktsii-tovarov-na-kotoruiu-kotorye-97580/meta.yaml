title:
  rus: Об утверждении перечня продукции (товаров), на которую (которые) распространяются расширенные обязательства производителей (импортеров)
  kaz: Өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелері қолданылатын өнімнің (тауарлардың) тізбесін бекіту туралы
