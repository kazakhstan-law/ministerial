  title:
    rus: О внесении изменений и дополнений в приказ Министра энергетики Республики Казахстан от 30 марта 2015 года № 248 «Об утверждении Правил функционирования автоматизированной системы коммерческого учета электрической энергии для субъектов оптового рынка электрической энергии»
    kaz: «Электр энергиясының көтерме сауда нарығының субъектілері үшін электр энергиясын коммерциялық есепке алудың автоматтандырылған жүйесінің жұмыс істеу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 30 наурыздағы № 248 бұйрығына өзгерістер мен толықтырулар енгізу туралы.
