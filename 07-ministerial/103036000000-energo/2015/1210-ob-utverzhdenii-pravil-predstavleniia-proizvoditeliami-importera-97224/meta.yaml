  title:
    rus: Об утверждении Правил представления производителями (импортерами), имеющие собственную систему сбора, транспортировки, подготовки к повторному использованию, сортировки, обработки, переработки, обезвреживания и (или) утилизации отходов, в качестве подтверждения исполнения обязательств по расширенным обязательствам производителей (импортеров) в уполномоченный орган в области охраны окружающей среды документов, подтверждающих сбор, транспортировку, подготовку к повторному использованию, сортировку, обработку, переработку, обезвреживание и (или) утилизацию отходов, образовавшихся после утраты потребительских свойств продукции (товаров), на которую (которые) распространяются расширенные обязательства производителей (импортеров)
    kaz: Қалдықтарды жинаудың, тасымалдаудың, қайта пайдалануға дайындаудың, сұрыптаудың, өңдеудің, қайта өңдеудің, залалсыздандырудың және (немесе) кәдеге жаратудың меншікті жүйесі бар өндірушілер (импорттаушылар) қоршаған ортаны қорғау саласындағы уәкілетті орган айқындаған тәртіпке сәйкес өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелері жөніндегі міндеттемелердің орындалғанын растау ретінде қоршаған ортаны қорғау саласындағы уәкілетті органға өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелері қолданылатын өнімнің (тауарлардың) тұтынушылық қасиеттері жоғалғаннан кейін түзілген қалдықтардың жиналғанын, тасымалданғанын, қайта пайдалануға дайындалғанын, сұрыпталғанын, өңделгенін, қайта өңделгенін, залалсыздандырылғанын және (немесе) кәдеге жаратылғанын растайтын құжаттарын ұсыну қағидаларын бекіту туралы
