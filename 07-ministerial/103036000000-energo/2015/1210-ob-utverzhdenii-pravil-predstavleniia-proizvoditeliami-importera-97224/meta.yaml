act_code: '97224'
requisite: Приказ Министра энергетики Республики Казахстан от 10 декабря 2015 года № 708. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 декабря 2015 года № 12580. Утратил силу приказом Министра экологии, геологии и природных ресурсов Республики Казахстан от 9 ноября 2022 года № 690 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил представления производителями (импортерами), имеющими собственную систему сбора, переработки и утилизации отходов, оператору расширенных обязательств производителей (импортеров) документов, подтверждающих сбор, переработку и (или) утилизацию отходов, образовавшихся после утраты потребительских свойств продукции (товаров), на которую (которые) распространяются расширенные обязательства производителей (импортеров), и ее (их) упаковки
  kaz: Қалдықтарды жинаудың, қайта өңдеудің және кәдеге жаратудың меншікті жүйесі бар өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелерінің операторына өндірушілердің (импорттаушылардың) кеңейтілген міндеттемелері қолданылатын өнімнің (тауарлардың) тұтынушылық қасиеттері жоғалғаннан кейін пайда болған қалдықтарды және оның (олардың) орамасын жинауды, қайта өңдеуді және кәдеге жаратуды растайтын құжаттарды ұсыну қағидаларын бекіту туралы
