  title:
    rus: О внесении изменений и дополнения в приказ Министра энергетики Республики Казахстан от 18 марта 2015 года № 216 «Об утверждении Правил выдачи квот на выбросы парниковых газов» и в приказ Министра энергетики Республики Казахстан от 18 марта 2015 года № 217 «Об утверждении Правил изменения квот на выбросы парниковых газов и переоформления сертификата на выбросы парниковых газов»
    kaz: «Парниктік газдар шығарындыларына квоталар беру қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 18 наурыздағы № 216 бұйрығына және «Парниктік газдар шығарындыларына квоталарды өзгерту және парниктік газдар шығарындыларына сертификатты қайта ресімдеу қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 18 наурыздағы № 217 бұйрығына өзгерістер мен толықтыру енгізу туралы
