  title:
    rus: О внесении изменений и дополнения в приказ Министра энергетики Республики Казахстан от 27 февраля 2015 года № 147 «Об утверждении Правил утверждения предельного тарифа на электрическую энергию, предельного тарифа на балансирующую электроэнергию и предельного тарифа на услугу по поддержанию готовности электрической мощности»
    kaz: «Электр энергиясына шекті тарифті, теңгерімдеуші электр энергиясына шекті тарифті және электр қуатының әзірлігін ұстап тұру бойынша көрсетілетін қызметке шекті тарифті бекіту қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 27 ақпандағы № 147 бұйрығына өзгерістер мен толықтыру енгізу туралы
