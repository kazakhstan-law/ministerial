  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 27 апреля 2015 года № 317 «Об утверждении натуральных норм обеспечения территориальных органов, находящихся в ведении Комитета экологического регулирования, контроля и государственной инспекции в нефтегазовом комплексе Министерства энергетики Республики Казахстан, специальными транспортными средствами»
    kaz: «Қазақстан Республикасы Энергетика министрлігі Мұнай-газ кешеніндегі экологиялық реттеу, бақылау және мемлекеттік инспекция комитетінің қарамағындағы аумақтық органдарды арнайы көлік құралдарымен қамтамасыз етудің заттай нормаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2015 жылғы 27 сәуірдегі № 317 бұйрығына өзгерістер енгізу туралы
