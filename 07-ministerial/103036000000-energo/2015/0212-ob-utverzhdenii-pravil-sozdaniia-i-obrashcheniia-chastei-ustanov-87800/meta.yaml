title:
  rus: Об утверждении Правил создания и обращения частей установленного количества, единиц сокращения выбросов, единиц сертифицированного сокращения выбросов, единиц поглощения парниковых газов и других производных, предусмотренных международными договорами Республики Казахстан
  kaz: Шығарындылардың белгіленген мөлшері бөліктерін, азайту бірліктерін, шығарындылардың сертификатталған азайту бірліктерін, парниктік газдарды сіңіру бірліктерін және Қазақстан Республикасының халықаралық шарттарында көзделген басқа да туынды бірліктерді құру және айналымы қағидалары
