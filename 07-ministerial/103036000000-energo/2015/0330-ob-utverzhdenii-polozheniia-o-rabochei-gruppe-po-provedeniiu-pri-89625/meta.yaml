requisite: Приказ Министра энергетики Республики Казахстан от 30 марта 2015 года № 243. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 апреля 2015 года № 10904. Утратил силу приказом Министра энергетики Республики Казахстан от 28 апреля 2018 года № 152 (вводится в действие с 29.06.2018)
title:
  rus: Об утверждении Положения о рабочей группе по проведению прямых переговоров по предоставлению права недропользования на разведку, добычу и совмещенную разведку и добычу углеводородного сырья, урана и угля
  kaz: Көмірсутек шикізатын, уранды және көмірді барлауға, өндіруге және бірлескен барлау мен өндіруге арналған жер қойнауын пайдалану құқығын беру бойынша тікелей келіссөздер жүргізу жөніндегі жұмыс тобы туралы ережені бекіту туралы
