  title:
    rus: О внесении изменений в приказ Министра энергетики Республики Казахстан от 3 июля 2015 года № 465 «Об утверждении предельных тарифов на электрическую энергию и предельных тарифов на услугу по поддержанию готовности электрической мощности»
