act_code: '174533'
requisite: Приказ и.о. Министра энергетики Республики Казахстан от 30 ноября 2022 года № 389. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 ноября 2022 года № 30836
title:
  rus: Об утверждении Правил рассмотрения инвестиционных программ по модернизации, реконструкции и (или) расширению со строительством генерирующих установок с использованием газа в качестве альтернативного типа топлива, заключения инвестиционных соглашений на модернизацию, реконструкцию и (или) расширение со строительством генерирующих установок с использованием газа в качестве альтернативного типа топлива, соответствующего заключения договоров о покупке услуги по поддержанию готовности электрической мощности и установления для данных договоров индивидуальных тарифов на услугу по поддержанию готовности электрической мощности, объемов и сроков покупки услуги по поддержанию готовности электрической мощности
  kaz: Отынның баламалы түрі ретінде газ пайдаланылатын генерациялайтын қондырғыларды салу арқылы жаңғырту, реконструкциялау және (немесе) кеңейту жөніндегі инвестициялық бағдарламаларды қарау, отынның баламалы түрі ретінде газ пайдаланылатын генерациялайтын қондырғыларды салу арқылы жаңғыртуға, реконструкциялауға және (немесе) кеңейтуге инвестициялық келісімдер жасасу, электр қуатының әзірлігін ұстап тұру бойынша көрсетілетін қызметті сатып алу туралы шарттарды тиісінше жасасу және осы шарттар үшін электр қуатының әзірлігін ұстап тұру бойынша көрсетілетін қызметке жеке тарифтерді, электр қуатының әзірлігін ұстап тұру бойынша көрсетілетін қызметті сатып алудың көлемдері мен мерзімдерін белгілеу қағидаларын бекіту туралы
