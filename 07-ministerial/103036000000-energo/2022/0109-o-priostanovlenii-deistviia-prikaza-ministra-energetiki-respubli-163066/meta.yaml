act_code: '163066'
requisite: Приказ и.о. Министра энергетики Республики Казахстан от 9 января 2022 года № 5. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 января 2022 года № 26409. Утратил силу приказом Министра энергетики Республики Казахстан от 7 июня 2022 года № 202 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О приостановлении действия приказа Министра энергетики Республики Казахстан от 6 декабря 2018 года № 481 «Об утверждении Правил организации и проведения торгов сжиженным нефтяным газом через электронные торговые площадки»
  kaz: «Электрондық сауда алаңдары арқылы сұйытылған мұнай газы сауда-саттығын ұйымдастыру мен жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы энергетика министрінің 2018 жылғы 6 желтоқсандағы бұйрығының қолданысын тоқтата тұру туралы
