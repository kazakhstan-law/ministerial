act_code: '216441'
requisite: Приказ Министра энергетики Республики Казахстан от 29 октября 2025 года № 414-н/қ
title:
  rus: Об утверждении перечня налогоплательщиков, осуществляющих на территории Республики Казахстан деятельность в рамках контракта на недропользование, соглашения (контракта) о разделе продукции, в соответствии с условиями которого освобождаются от налога на добавленную стоимость импортируемые товары
  kaz: Талаптарына сәйкес импортталатын тауарлар қосылған құн салығынан босатылатын, жер қойнауын пайдалануға арналған келісімшарт, өнімді бөлу туралы келісім (келісімшарт) шеңберінде Қазақстан Республикасының аумағында қызметін жүзеге асыратын салық төлеушілердің тізбесін бекіту туралы
