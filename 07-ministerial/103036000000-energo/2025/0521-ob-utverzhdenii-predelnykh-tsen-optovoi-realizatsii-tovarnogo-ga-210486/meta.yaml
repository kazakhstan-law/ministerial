act_code: '210486'
requisite: Приказ Министра энергетики Республики Казахстан от 21 мая 2025 года № 217-н/қ
title:
  rus: Об утверждении предельных цен оптовой реализации товарного газа на внутреннем рынке Республики Казахстан, предназначенного для последующей реализации крупным коммерческим потребителям, лицам, осуществляющим цифровой майнинг, или лицам по производству электрической энергии для осуществления цифрового майнинга
  kaz: Ірі коммерциялық тұтынушыларға, цифрлық майнингті жүзеге асыратын тұлғаларға немесе цифрлық майнингті жүзеге асыру үшін электр энергиясын өндіру жөніндегі тұлғаларға кейіннен өткізуге арналған Қазақстан Республикасының ішкі нарығында тауарлық газды көтерме саудада өткізуді қоса алған кезеңге арналған шекті бағалары
