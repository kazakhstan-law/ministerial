act_code: '215645'
requisite: Приказ Министра энергетики Республики Казахстан от 14 октября 2025 года № 382-н/қ
title:
  rus: Об утверждении перечня налогоплательщиков, осуществляющих деятельность в рамках контракта на недропользование, обороты по реализации нестабильного конденсата которых с территории Республики Казахстан на территорию других государств – членов Евразийского экономического союза облагаются налогом на добавленную стоимость по нулевой ставке
  kaz: Жер қойнауын пайдалануға арналған келісімшарт шеңберінде қызметін жүзеге асыратын, тұрақсыз конденсатты Қазақстан Республикасының аумағынан Еуразиялық экономикалық одаққа мүше басқа мемлекеттердің аумағына өткізу бойынша айналымдарына нөлдік мөлшерлеме бойынша қосылған құн салығы салынатын салық төлеушілердің тізбесін бекіту туралы
