title:
  rus: Об утверждении Перечня и сроков оснащения производственных объектов, подлежащих оснащению приборами учета сырой нефти, газового конденсата, сырого газа и продуктов его переработки (товарного газа)
  kaz: Шикі мұнайды, газ конденсатын, шикі газды және оны қайта өңдеу өнімдерін (тауарлық газды) есепке алу аспаптарымен жарақтандыруға жататын өндірістік объектілердің тізбесін және оларды жарақтандыру мерзімдерін бекіту туралы
