  title:
    rus: О внесении изменений и дополнений в приказ Министра энергетики Республики Казахстан от 4 ноября 2019 года № 357 «Об утверждении Перечня и сроков оснащения производственных объектов, подлежащих оснащению приборами учета сырой нефти и газового конденсата»
    kaz: «Шикі мұнайды және газ конденсатын есепке алу құралдарымен жарақтандырылуға жататын өндірістік объектілердің тізбесі мен оларды жарақтандыру мерзімдерін бекіту туралы» Қазақстан Республикасы Энергетика министрінің 2019 жылғы 4 қарашадағы № 357 бұйрығына өзгерістер мен толықтырулар енгізу туралы
