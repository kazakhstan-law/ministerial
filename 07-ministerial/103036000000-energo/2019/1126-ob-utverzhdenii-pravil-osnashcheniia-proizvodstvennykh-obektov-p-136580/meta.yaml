  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра энергетики Республики Казахстан от 26 ноября 2019 года № 385 «Об утверждении Правил оснащения производственных объектов приборами учета сырой нефти и газового конденсата и обеспечения функционирования приборов учета сырой нефти и газового конденсата»
    kaz: «Өндірістік объектілерді шикі мұнай және газ конденсатын есепке алу құралдарымен жарақтандыру және шикі мұнай және газ конденсатын есепке алу құралдарының жұмыс істеуін қамтамасыз ету қағидаларын бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2019 жылғы 26 қарашадағы № 385 бұйрығына өзгерістер енгізу туралы
