title:
  rus: Об утверждении Правил оснащения производственных объектов приборами учета сырой нефти, газового конденсата, сырого газа и продуктов его переработки (товарного газа) и обеспечения функционирования приборов учета сырой нефти, газового конденсата, сырого газа и продуктов его переработки (товарного газа)
  kaz: Өндірістік объектілерді шикі мұнайды, газ конденсатын, шикі газды және оны қайта өңдеу өнімдерін (тауарлық газды) есепке алу аспаптарымен жарақтандыру және шикі мұнайды, газ конденсатын, шикі газды және оны қайта өңдеу өнімдерін (тауарлық газды) есепке алу аспаптарының жұмыс істеуін қамтамасыз ету қағидаларын бекіту туралы
