  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра энергетики Республики Казахстан от 8 августа 2019 года № 275 «Об утверждении Положения о центральной комиссии по разработке месторождений по добыче урана Республики Казахстан»
    kaz: «Қазақстан Республикасының уран өндіру кен орындарын игеру жөніндегі орталық комиссия туралы ережені бекіту туралы» Қазақстан Республикасы Энергетика министрінің міндетін атқарушының 2019 жылғы 8 тамыздағы № 275 бұйрығына өзгеріс енгізу туралы
