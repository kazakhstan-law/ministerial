requisite: Приказ Министра энергетики Республики Казахстан от 2 сентября 2019 года № 296. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 сентября 2019 года № 19333. Утратил силу приказом и.о. Министра энергетики Республики Казахстан от 6 декабря 2024 года № 442 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил субсидирования затрат организаций в сфере производства тепловой энергии на погашение и обслуживание займов международных финансовых организаций, привлеченных для реализации проектов по модернизации систем энергоснабжения
  kaz: Жылу энергиясын өндіру саласындағы ұйымдардың энергиямен жабдықтау жүйелерін жаңғырту жөніндегі жобаларды іске асыру үшін тартылған халықаралық қаржы ұйымдарының қарыздарын өтеуге және оларға қызмет көрсетуге арналған шығындарын субсидиялау қағидаларын бекіту туралы
