act_code: '227055'
requisite: Приказ Министра энергетики Республики Казахстан от 30 июня 2026 года № 249-н/қ
title:
  rus: Об утверждении предельных цен оптовой реализации товарного газа на внутреннем рынке Республики Казахстан, предназначенного для последующей реализации крупным коммерческим потребителям, лицам, осуществляющим цифровой майнинг, или лицам по производству электрической энергии для осуществления цифрового майнинга
  kaz: Ірі коммерциялық тұтынушыларға, цифрлық майнингті жүзеге асыратын тұлғаларға немесе цифрлық майнингті жүзеге асыру үшін электр энергиясын өндіру жөніндегі тұлғаларға кейіннен өткізуге арналған Қазақстан Республикасының ішкі нарығында тауарлық газды көтерме саудада өткізудің шекті бағаларын бекіту туралы
