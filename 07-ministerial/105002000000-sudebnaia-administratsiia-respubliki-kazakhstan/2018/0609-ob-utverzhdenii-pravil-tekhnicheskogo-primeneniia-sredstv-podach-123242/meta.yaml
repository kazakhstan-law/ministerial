  title:
    rus: О внесении изменения в приказ Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарата Верховного Суда Республики Казахстан) от 9 июня 2018 года № 6001-18-7-6/188 «Об утверждении Правил технического применения средств подачи документов в суды в форме электронного документа, их регистрации, обработки, ознакомления с ними»
    kaz: «Соттарға құжаттарды электрондық құжат нысанында беру құралдарын техникалық қолдану, оларды тіркеу, өңдеу, олармен танысу қағидаларын бекіту туралы» Қазақстан Республикасы Жоғарғы Сотының жанындағы Соттардың қызметін қамтамасыз ету департаменті (Қазақстан Республикасы Жоғарғы Соты аппараты) басшысының 2018 жылғы 9 маусымдағы № 6001-18-7-6/188 бұйрығына өзгеріс енгізу туралы
