    kaz: Қазақстан Республикасы Жоғарғы Соты жанындағы Соттардың қызметін қамтамасыз ету департаменті (Қазақстан Республикасы Жоғарғы Соты аппараты) басшысының кейбір бұйрықтарына өзгерістер мен толықтыру енгізу туралы
