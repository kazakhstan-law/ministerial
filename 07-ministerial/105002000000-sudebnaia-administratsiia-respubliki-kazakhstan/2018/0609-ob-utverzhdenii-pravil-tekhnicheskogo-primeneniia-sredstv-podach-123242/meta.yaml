title:
  rus: Об утверждении Правил технического применения средств подачи документов в суды в форме электронного документа, их регистрации, обработки, ознакомления с ними
  kaz: Соттарға құжаттарды электрондық құжат нысанында беру құралдарын техникалық қолдану, оларды тіркеу, өңдеу, олармен танысу қағидаларын бекіту туралы
