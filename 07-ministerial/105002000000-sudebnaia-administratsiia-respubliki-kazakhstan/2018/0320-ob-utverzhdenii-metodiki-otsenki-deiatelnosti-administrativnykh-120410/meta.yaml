requisite: Приказ Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарат Верховного Суда Республики Казахстан) от 20 марта 2018 года № 6001-18-7-6/104. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 марта 2018 года № 16698. Утратил силу приказом Руководителя Судебной администрации Республики Казахстан от 25 июля 2023 года № 21 (вводится в действие по истечении десяти календарных дней после дня его официального опубликования)
title:
