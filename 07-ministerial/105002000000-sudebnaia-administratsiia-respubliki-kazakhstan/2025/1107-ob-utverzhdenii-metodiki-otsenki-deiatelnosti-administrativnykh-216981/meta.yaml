title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Судебной администрации Республики Казахстан и ее территориальных подразделений в областях, столице и городах республиканского значения
  kaz: Қазақстан Республикасы Сот әкімшілігінің және оның облыстардағы, астанадағы және республикалық маңызы бар қалалардағы аумақтық бөлімшелерінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы
