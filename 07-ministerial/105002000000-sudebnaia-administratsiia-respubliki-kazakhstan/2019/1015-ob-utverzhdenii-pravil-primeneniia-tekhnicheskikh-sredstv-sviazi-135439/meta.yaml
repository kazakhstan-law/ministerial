    kaz: Қазақстан Республикасы Жоғарғы Соты жанындағы Соттардың қызметін қамтамасыз ету департаменті (Қазақстан Республикасы Жоғарғы Сотының аппараты) Басшысының «Сот отырысына қатысуды қамтамасыз ететін техникалық байланыс құралдарын қолдану қағидаларын және оларға қойылатын талаптарды бекіту туралы» 2019 жылғы 15 қазандағы № 7 бұйрығына толықтыру енгізу туралы
