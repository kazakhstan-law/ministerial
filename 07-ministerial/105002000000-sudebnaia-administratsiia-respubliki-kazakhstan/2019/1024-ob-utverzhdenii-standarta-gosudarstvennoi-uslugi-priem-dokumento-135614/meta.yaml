requisite: Приказ Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарат Верховного Суда Республики Казахстан) от 24 октября 2019 года № 9. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 октября 2019 года № 19526. Утратил силу приказом Председателя Верховного Суда Республики Казахстан от 26 марта 2020 года № 12 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
