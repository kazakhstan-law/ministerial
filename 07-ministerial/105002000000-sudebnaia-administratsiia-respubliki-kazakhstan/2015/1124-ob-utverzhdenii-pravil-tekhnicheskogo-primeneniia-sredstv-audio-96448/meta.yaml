  title:
    rus: О внесении изменений и дополнения в приказ Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарата Верховного Суда Республики Казахстан) от 24 ноября 2015 года № 6001-15-7-6/486 «Об утверждении Правил технического применения средств аудио-, видеозаписи, обеспечивающих фиксирование хода судебного заседания, хранения и уничтожения аудио-, видеозаписи, доступа к аудио-, видеозаписи»
    kaz: «Сот отырысының барысын түсіріп алуды қамтамасыз ететін аудио-, бейнежазба құралдарын техникалық қолдану, аудио-, бейнежазбаны сақтау және жою, аудио-, бейнежазбаға қол жеткізу қағидаларын бекіту туралы» Қазақстан Республикасы Жоғарғы Сотының жанындағы Соттардың қызметін қамтамасыз ету департаменті (Қазақстан Республикасы Жоғарғы Сотының аппаратының) басшысының 2015 жылғы 24 қарашадағы № 6001-15-7-6/486 бұйрығына өзгерістер мен толықтыру енгізу туралы
