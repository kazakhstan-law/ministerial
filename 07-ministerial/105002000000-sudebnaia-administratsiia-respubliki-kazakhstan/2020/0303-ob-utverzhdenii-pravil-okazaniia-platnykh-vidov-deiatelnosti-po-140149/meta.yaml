  title:
    rus: О внесении изменения в приказ Руководителя Департамента по обеспечению деятельности при Верховном Суде Республики Казахстан (аппарата Верховного Суда Республики Казахстан) от 3 марта 2020 года № 11 «Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) Академией правосудия при Верховном Суде Республики Казахстан и расходования ею денег от реализации товаров (работ, услуг)»
    kaz: «Қазақстан Республикасы Жоғарғы Сотының жанындағы Сот төрелігі академиясының тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізу жөніндегі ақылы қызмет түрлерін көрсету және тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсау қағидаларын бекіту туралы» Қазақстан Республикасы Жоғарғы Сотының жанындағы Соттардың қызметін қамтамасыз ету департаменті (Қазақстан Республикасы Жоғарғы Соты аппараты) басшысының 2020 жылғы 3 наурыздағы № 11 бұйрығына өзгеріс енгізу туралы
