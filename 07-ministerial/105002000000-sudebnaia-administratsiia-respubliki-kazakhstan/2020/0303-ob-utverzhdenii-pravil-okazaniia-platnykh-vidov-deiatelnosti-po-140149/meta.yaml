requisite: Приказ Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарата Верховного Суда Республики Казахстан) от 3 марта 2020 года № 11. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 марта 2020 года № 20107.  Утратил силу приказом Руководителя Судебной администрации Республики Казахстан от 10 июля 2025 года № 4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) Академией правосудия при Верховном Суде Республики Казахстан и расходования ею денег от реализации товаров (работ, услуг)
  kaz: Қазақстан Республикасы Жоғарғы Сотының жанындағы Сот төрелігі академиясының тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізу жөніндегі ақылы қызмет түрлерін көрсету және тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсау қағидаларын бекіту туралы
