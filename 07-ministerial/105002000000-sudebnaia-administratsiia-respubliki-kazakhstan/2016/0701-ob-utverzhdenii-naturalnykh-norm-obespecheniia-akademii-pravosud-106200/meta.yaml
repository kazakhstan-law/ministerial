requisite: Приказ Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарат Верховного Суда Республики Казахстан) от 1 июля 2016 года № 6001-16-7-6/263. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 сентября 2016 года № 14219. Утратил силу приказом Руководителя Судебной администрации Республики Казахстан от 10 июля 2025 года № 4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм обеспечения Академии правосудия при Верховном Суде Республики Казахстан служебными автомобилями, телефонной связью, офисной мебелью и площадями для размещения аппарата государственного учреждения
  kaz: Қазақстан Республикасы Жоғарғы Сотының жанындағы Сот төрелігі академиясын қызметтік автомобильдермен, телефон байланысымен, кеңсе жиһазымен және мемлекеттік мекеменің аппаратын орналастыруға арналған алаңдармен қамтамасыз етудің заттай нормаларын бекіту туралы
