requisite: Приказ Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарат Верховного Суда Республики Казахстан) от 22 августа 2016 года № 6001-16-7-9/549. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 сентября 2016 года № 14255. Утратил силу приказом Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарата Верховного Суда Республики Казахстан) от 28 октября 2020 года № 23 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
