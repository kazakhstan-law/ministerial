act_code: '100565'
requisite: Приказ Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарата Верховного Суда Республики Казахстан) от 23 февраля 2016 года № 6001-16-7-6/74. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 марта 2016 года № 13493. Утратил силу приказом Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарата Верховного Суда Республики Казахстан) от 14 апреля 2017 года № 6001-17-7-6/145 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса "Б" Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарата Верховного Суда Республики Казахстан) и администраторов областных и приравненных к ним судов
  kaz: Қазақстан Республикасы Жоғарғы Сотының жанындағы Соттардың қызметін қамтамасыз ету департаментінің (Қазақстан Республикасы Жоғарғы Сотының аппаратының) және облыстық және оған теңестірілген соттар әкімшілерінің «Б» корпусының мемлекеттік әкімшілік қызметшілерінің жұмысын бағалау әдістемесін бекіту туралы
