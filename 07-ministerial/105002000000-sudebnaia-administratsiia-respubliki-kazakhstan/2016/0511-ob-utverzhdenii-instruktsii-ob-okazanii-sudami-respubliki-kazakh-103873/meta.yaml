  title:
    rus: О внесении изменений в приказ Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарата Верховного Суда Республики Казахстан) от 11 мая 2016 года № 6001-16-7-6/196 «Об утверждении Инструкции об оказании судами Республики Казахстан правовой помощи и обращении за правовой помощью к судам иностранных государств»
    kaz: «Қазақстан Республикасы соттарының құқықтық көмек көрсетуі және шет мемлекеттердің соттарына құқықтық көмекпен жүгінуі туралы нұсқаулықты бекіту туралы» Қазақстан Республикасы Жоғарғы Сотының жанындағы Соттардың қызметін қамтамасыз ету департаменті (Қазақстан Республикасы Жоғарғы Сотының аппараты) басшысының 2016 жылғы 11 мамырдағы № 6001-16-7-6/196 санды бұйрығына өзгерістер енгізу туралы
