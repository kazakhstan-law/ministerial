requisite: Приказ Руководителя Департамента по обеспечению деятельности судов при Верховном Суде Республики Казахстан (аппарата Верховного Суда Республики Казахстан) от 11 мая 2016 года № 6001-16-7-6/196. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 июня 2016 года № 13794
title:
  rus: Об утверждении Инструкции об оказании судами Республики Казахстан правовой помощи и обращении за правовой помощью к судам иностранных государств
  kaz: Қазақстан Республикасы соттарының құқықтық көмек көрсетуі және шет мемлекеттердің соттарына құқықтық көмекпен жүгінуі туралы нұсқаулықты бекіту туралы
