act_code: '323'
requisite: Постановление Национальной комиссии Республики Казахстан по ценным бумагам от 8 октября 1997 года № 162. Зарегистрировано в Министерстве юстиции Республики Казахстан 11 февраля 1998 года за № 459. Утратило силу постановлением Правления Национального Банка Республики Казахстан от 27 октября 2003 года № 382
title:
  rus: Об утверждении Положения "О порядке регистрации в Государственном реестре ценных бумаг облигаций хозяйствующих субъектов в Республике Казахстан и присвоения им национальных идентификационных номеров"
  kaz: Қазақстан Республикасындағы шаруашылық жүргiзушi субъектiлердiң облигацияларын Бағалы қағаздардың мемлекеттiк тiзiлiмiне тiркеудiң және оларға ұлттық бiрдейлендiру нөмiрлерiн берудiң тәртiбi туралы ереженi бекiту туралы
