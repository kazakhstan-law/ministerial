requisite: Приказ Министра индустрии и торговли Республики Казахстан от 29 октября 2008 года № 428. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 ноября 2008 года № 5358. Утратил силу приказом Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 19 июля 2010 года № 169
title:
  rus: Об утверждении Правил ведения электронного учета данных о зарегистрированных декларациях о соответствии, заявлениях-декларациях, выданных сертификатах соответствия, об уклонении заявителей, зарегистрировавших заявления-декларации, от проведения работ по подтверждению соответствия, и об отказах в сертификации
  kaz: Тіркелген сәйкестік туралы декларациялар, өтініш-декларациялар, берілген сәйкестік сертификаттары туралы, өтініш-декларацияларды тіркеген өтініш берушілердің сәйкестікті растау жұмыстарын жүргізуден жалтаруы туралы және сертификаттаудан бас тарту туралы деректердің электрондық есебін жүргізу ережесін бекіту туралы
