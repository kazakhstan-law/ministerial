  title:
    rus: О внесении изменения в приказ Министра индустрии и торговли Республики Казахстан от 19 декабря 2008 года № 480 «Об утверждении Правил маркировки игрушек, изображения знака соответствия и технические требования к нему» и признании утратившим силу приказа Министра по инвестициям и развитию Республики Казахстан от 29 марта 2016 года № 299 «Об утверждении Правил обязательной регистрации в уполномоченной организации именника и представления сведений о зарегистрированных именниках в уполномоченный орган»
    kaz: «Ойыншықтарды таңбалау, сәйкестік белгісінің кескінін және оған қойылатын талаптар ережесін бекіту туралы» Қазақстан Республикасы Индустрия және сауда министрінің 2008 жылғы 19 желтоқсандағы № 480 бұйрығына өзгеріс енгізу туралы және «Атаулы таңбаны уәкілетті ұйымда міндетті тіркеу және уәкілетті органға тіркелген атаулы таңбалар туралы мәліметтерді ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2016 жылғы 29 наурыздағы № 299 бұйрығының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/136143/rus
