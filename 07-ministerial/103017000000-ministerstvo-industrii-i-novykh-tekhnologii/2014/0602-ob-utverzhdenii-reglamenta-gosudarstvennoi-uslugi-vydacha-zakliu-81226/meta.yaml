act_code: '81226'
requisite: Приказ исполняющего обязанности Министра индустрии и новых технологий Республики Казахстан от 2 июня 2014 года № 196. Зарегистрирован Министерстве юстиции Республики Казахстан 4 июля 2014 года № 9569
title:
  rus: Об утверждении Регламента государственной услуги "Выдача заключения о подтверждении отнесения импортируемых на территорию Республики Казахстан с территории государств-членов Таможенного союза товаров к товарам, предназначенным для промышленной переработки в легкой, горно-металлургической, химической, фармацевтической, деревообрабатывающей отраслях промышленности, а также в машиностроении и стройиндустрии"
  kaz: '"Кеден одағына мүше мемлекеттердің аумағынан Қазақстан Республикасының аумағына импортталатын тауарларды жеңіл, тау-кен металлургиялық, химиялық, фармацевтикалық, ағаш өндейтін өнеркәсіп саласында, сонымен қатар машина жасау және құрылыс индустриясы саласында өнеркәсіптік қайта өңдеуге арналған тауарларға жатқызуды растайтын қорытындыны беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'
