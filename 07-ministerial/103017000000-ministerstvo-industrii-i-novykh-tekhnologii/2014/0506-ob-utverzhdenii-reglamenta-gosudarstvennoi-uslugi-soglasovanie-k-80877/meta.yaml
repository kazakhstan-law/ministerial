act_code: '80877'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 6 мая 2014 года № 157. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 июня 2014 года № 9512. Утратил силу приказом Министра энергетики Республики Казахстан от 8 сентября 2015 года № 562
title:
  rus: Об утверждении Регламента государственной услуги "Согласование купли-продажи, передачи в аренду или доверительное управление объектов электроэнергетики и (или) его отдельных частей независимо от форм собственности"
  kaz: '"Электр энергетикасы объектілерін және (немесе) оның жекелеген бөліктерін меншік нысанына қарамастан сатып алу-сату, жалға немесе сенімді басқаруға беруге келісу" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'
