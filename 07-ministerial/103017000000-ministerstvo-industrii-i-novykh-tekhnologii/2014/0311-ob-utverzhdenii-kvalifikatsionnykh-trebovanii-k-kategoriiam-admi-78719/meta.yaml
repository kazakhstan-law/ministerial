requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 11 марта 2014 года № 71. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 апреля 2014 года № 9288. Утратил силу приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 1 сентября 2015 года № 895
title:
  rus: Об утверждении квалификационных требований к категориям административных государственных должностей корпуса "Б" Комитета геологии и недропользования Министерства индустрии и новых технологий Республики Казахстан и его территориальных органов
  kaz: Қазақстан Республикасы Индустрия және жаңа технологиялар министрлігі Геология және жер қойнауын пайдалану комитетінің және оның аумақтық органдарының "Б" корпусының мемлекеттік әкімшілік қызметшілерінің лауазымдарының санаттарына біліктілік талаптарын бекіту туралы
