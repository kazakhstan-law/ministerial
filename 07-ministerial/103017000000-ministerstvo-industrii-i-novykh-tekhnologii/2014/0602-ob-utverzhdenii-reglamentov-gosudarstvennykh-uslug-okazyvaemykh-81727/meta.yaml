act_code: '81727'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 2 июня 2014 года № 192. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 июля 2014 года № 9556. Утратил силу приказом Министра энергетики Республики Казахстан от 28 мая 2015 года № 376
title:
  rus: Об утверждении регламентов государственных услуг, оказываемых Министерством индустрии и новых технологий Республики Казахстан, в области электроэнергетики, энергосбережения и повышения энергоэффективности
  kaz: Электр энергетикасы, энергия үнемдеу және энергия тиімділігін арттыру саласында Қазақстан Республикасының Индустрия және жаңа технологиялар министрлігі көрсететін мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы
