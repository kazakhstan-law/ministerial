  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра индустрии и новых технологий Республики Казахстан от 25 февраля 2014 года № 51 "Об утверждении Регламента государственной услуги "Заключение инвестиционного контракта на осуществление инвестиций, предусматривающего инвестиционные преференции"
    kaz: '"Инвестициялық преференцияларды көздейтін инвестицияларды жүзеге асыруға инвестициялық келісімшарт жасау" мемлекеттік қызмет регламентін бекіту туралы" Қазақстан Республикасы Индустрия және жаңа технологиялар министрі міндетін атқарушының 2014 жылғы 25 ақпандағы № 51 бұйрығына өзгерістер мен толықтыру енгізу туралы'
