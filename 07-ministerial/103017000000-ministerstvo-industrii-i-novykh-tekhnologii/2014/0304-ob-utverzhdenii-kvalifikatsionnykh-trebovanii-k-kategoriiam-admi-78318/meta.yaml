requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 4 марта 2014 года № 57. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 марта 2014 года № 9245. Утратил силу приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 1 сентября 2015 года № 895
title:
  rus: Об утверждении квалификационных требований к категориям административных государственных должностей корпуса "Б" Комитета технического регулирования и метрологии Министерства индустрии и новых технологий Республики Казахстан и их территориальных органов
  kaz: Қазақстан Республикасы Индустрия және жаңа технологиялар министрлігі Техникалық реттеу және метрология комитетінің және оның аумақтық органдарының "Б" корпусының әкімшілік мемлекеттік лауазымдарының санаттарына қойылатын біліктілік талаптарын бекіту туралы
