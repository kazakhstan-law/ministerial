requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 18 февраля 2014 года № 41. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 марта 2014 года № 9220. Утратил силу приказом Министра энергетики Республики Казахстан от 12 августа 2015 года № 475-Ж
title:
  rus: Об утверждении квалификационных требований к категориям административных государственных должностей корпуса "Б" Комитета государственного энергетического надзора и контроля Министерства индустрии и новых технологий Республики Казахстан и его территориальных органов
  kaz: Қазақстан Республикасы Индустрия және жаңа технологиялар министрлігі Мемлекеттік энергетикалық қадағалау және бақылау комитеті "Б" корпусының және оның аумақтық органдарының мемлекеттік әкімшілік лауазымдар санаттарына қойылатын біліктілік талаптарды бекіту туралы
