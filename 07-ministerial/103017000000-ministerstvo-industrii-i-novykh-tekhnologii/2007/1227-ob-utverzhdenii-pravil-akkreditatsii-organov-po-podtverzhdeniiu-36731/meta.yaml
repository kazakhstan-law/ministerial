act_code: '36731'
requisite: Приказ Министра индустрии и торговли Республики Казахстан от 27 декабря 2007 года N 376. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 января 2008 года N 5091. Утратил силу приказом Министра индустрии и торговли Республики Казахстан от 29 октября 2008 года N 427
title:
  rus: Об утверждении правил аккредитации органов по подтверждению соответствия, испытательных лабораторий (центров), юридических лиц, осуществляющих поверку, калибровку средств измерений и метрологическую аттестацию методик выполнения измерений
  kaz: Сәйкестікті растау жөніндегі органдарды, сынақ зертханаларын (орталықтарын), өлшем құралдарына салыстырып тексеру, калибрлеу және өлшемдерді орындау әдістемелерін метрологиялық аттестаттауды жүзеге асыратын заңды тұлғаларды аккредиттеу ережесін бекіту туралы
