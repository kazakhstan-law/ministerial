title:
  rus: О некоторых вопросах заключения, условиях и типовой форме Соглашения о промышленной сборке моторных транспортных средств с юридическими лицами - резидентами Республики Казахстан
  kaz: Қазақстан Республикасының заңды тұлғалары – резиденттерімен моторлы көлік құралдарын өнеркәсіптік құрастыру туралы келісімді жасасудың, оның талаптары мен үлгі нысанының кейбір мәселелері туралы
