  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра - Министра индустрии и новых технологий Республики Казахстан от 11 июня 2010 года № 113 «О некоторых вопросах заключения, условиях и типовой форме Соглашения о промышленной сборке моторных транспортных средств с юридическими лицами - резидентами Республики Казахстан»
    kaz: «Қазақстан Республикасының заңды тұлғалары - резиденттерімен моторлы көлік құралдарын өнеркәсіптік құрастыру туралы келісімді жасасудың, оның талаптары мен үлгі нысанының кейбір мәселелері туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Қазақстан Республикасы Индустрия және жаңа технологиялар министрінің 2010 жылғы 11 маусымдағы № 113 бұйрығына өзгерістер енгізу туралы
