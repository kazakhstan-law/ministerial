  title:
    rus: О внесении изменений в приказ и.о. Министра индустрии и новых технологий Республики Казахстан от 23 апреля 2010 года № 41 "Об утверждении Правил разработки и утверждения планов и программ работ по государственной стандартизации"
    kaz: '"Мемлекеттік стандарттау жөніндегі жұмыс жоспарлары мен бағдарламаларын әзірлеу және бекіту ережесін бекіту туралы" Қазақстан Республикасы Индустрия және жаңа технологиялар министрiнiң міндетін атқарушының 2010 жылғы 23 сәуiрдегi № 41 бұйрығына өзгерістер енгізу туралы'
