  title:
    rus: О внесении изменений и дополнений в приказ и.о. Министра индустрии и новых технологий Республики Казахстан от 23 апреля 2010 года № 42 "Об утверждении Правил создания, работы и ликвидации технических комитетов по стандартизации"
    kaz: '"Стандарттау жөніндегі техникалық комитеттердің құрылу, жұмыс істеу және таратылу ережесін бекiту туралы" Қазақстан Республикасы Индустрия және жаңа технологиялар министрінің міндетін атқарушының 2010 жылғы 23 сәуірдегі № 42 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
