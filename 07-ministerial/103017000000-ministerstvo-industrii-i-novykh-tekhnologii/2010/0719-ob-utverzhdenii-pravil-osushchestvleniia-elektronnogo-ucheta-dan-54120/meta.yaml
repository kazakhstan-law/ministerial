  code: '106844'
  requisite: Приказ Министра по инвестициям и развитию Республики Казахстан от 29 августа 2016 года № 633. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 октября 2016 года № 14302. Утратил силу приказом Министра торговли и интеграции Республики Казахстан от 22 декабря 2021 года № 640-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 19 июля 2010 года № 169 «Об утверждении Правил ведения электронного учета данных о зарегистрированных декларациях о соответствии, заявлениях-декларациях, выданных сертификатах соответствия, об уклонении заявителей, зарегистрировавших заявления-декларации, от проведения работ по подтверждению соответствия, и об отказах в сертификации»
    kaz: «Тіркелген сәйкестік туралы декларациялар, өтініш-декларациялар, берілген сәйкестік сертификаттары туралы, өтініш-декларацияларды тіркеген өтініш берушілердің сәйкестікті растау жұмыстарын жүргізуден жалтаруы туралы және сертификаттаудан бас тарту туралы деректердің электрондық есебін жүргізу ережесін бекіту туралы» Қазақстан Республикасының Премьер-Министрінің орынбасары - Индустрия және жаңа технологиялар министрінің 2010 жылғы 19 шілдедегі № 169 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/106844/rus
