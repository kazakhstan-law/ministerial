act_code: '54120'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 19 июля 2010 года № 169. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 августа 2010 года № 6396. Утратил силу приказом Министра торговли и интеграции Республики Казахстан от 22 декабря 2021 года № 640-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил осуществления электронного учета данных о зарегистрированных декларациях о соответствии, выданных сертификатах соответствия, об отказах в сертификации и их передачи
  kaz: Сәйкестік туралы тіркелген декларациялар, берілген сәйкестік сертификаттары туралы, сертификаттаудан бас тарту туралы деректердің электрондық есебін және оларды беруді жүзеге асыру қағидаларын бекіту туралы
