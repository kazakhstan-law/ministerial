requisite: Приказ и.о. Министра индустрии и новых технологий Республики Казахстан от 23 апреля 2010 года № 39. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 июня 2010 года № 6278. Утратил силу приказом и.о. Министра индустрии и новых технологий Республики Казахстан от 27 декабря 2012 года № 491
title:
  rus: Об утверждении Правил учета и применения международных, региональных, национальных стандартов, классификаторов технико-экономической информации, правил и рекомендаций иностранных государств по стандартизации, подтверждению соответствия и аккредитации на территории Республики Казахстан
  kaz: Қазақстан Республикасы аумағында стандарттау, сәйкестікті растау және аккредиттеу жөніндегі халықаралық, өңірлік, ұлттық стандарттарды, техникалық-экономикалық ақпарат жіктеуіштерін, шетел мемлекеттерінің ережелері мен ұсынымдарын есепке алу және қолдану ережесін бекіту туралы
