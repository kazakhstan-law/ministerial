  title:
    rus: О внесении изменений и дополнения в приказ и.о. Министра индустрии и новых технологий Республики Казахстан от 23 апреля 2010 года № 39 "Об утверждении Правил учета и применения международных, региональных, национальных стандартов, классификаторов технико-экономической информации, правил и рекомендаций иностранных государств по стандартизации, подтверждению соответствия и аккредитации на территории Республики Казахстан
    kaz: '"Қазақстан Республикасы аумағында стандарттау, сәйкестiктi растау және аккредиттеу жөнiндегi халықаралық, өңiрлiк, ұлттық стандарттарды, техникалық-экономикалық ақпарат жiктеуiштерiн, шетел мемлекеттерiнiң ережелерi мен ұсынымдарын есепке алу және қолдану ережесiн бекiту туралы" Қазақстан Республикасы Индустрия және жаңа технологиялар министрiнiң міндетін атқарушының 2010 жылғы 23 сәуiрдегi № 39 бұйрығына өзгерiстер мен толықтыру енгiзу туралы'
  link: https://zan.gov.kz/client/#!/doc/65580/rus
