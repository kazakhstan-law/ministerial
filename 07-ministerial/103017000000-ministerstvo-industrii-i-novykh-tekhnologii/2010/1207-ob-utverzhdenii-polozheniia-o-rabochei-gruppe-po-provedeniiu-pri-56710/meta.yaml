requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 7 декабря 2010 года № 416. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 января 2011 года № 6723. Утратил силу приказом Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 22 октября 2012 года № 387
title:
  rus: Об утверждении положения о Рабочей группе по проведению прямых переговоров по предоставлению права недропользования на строительство и (или) эксплуатацию подземных сооружений, не связанных с разведкой или добычей
