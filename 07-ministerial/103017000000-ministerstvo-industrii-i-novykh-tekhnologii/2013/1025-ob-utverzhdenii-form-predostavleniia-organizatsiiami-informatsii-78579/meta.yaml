  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 25 октября 2013 года № 331 «Об утверждении форм предоставления организациями информации по внутристрановой ценности в закупках товаров, работ и услуг» и Министра по инвестициям и развитию Республики Казахстан от 20 апреля 2018 года № 260 «Об утверждении Единой методики расчета организациями внутристрановой ценности при закупке товаров, работ и услуг
    kaz: Ұйымдардың тауарларды, жұмыстарды және қызметтерді саттып алудағы жергілікті қамту жөніндегі ақпаратты беру нысандарын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің Орынбасары - Қазақстан Республикасы Индустрия және жаңа технологиялар министрінің 2013 жылғы 25 қазандағы № 331 бұйрығына және «Ұйымдардың тауарларды, жұмыстар мен көрсетілетін қызметтерді сатып алу кезінде елішілік құндылықты есептеуінің бірыңғай әдістемесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 20 сәуірдегі № 260 бұйрығына өзгерістер енгізу туралы
