act_code: '59958'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 14 июня 2011 года № 184. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 июля 2011 года № 7069. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 11 мая 2018 года № 325 (вводится в действие с 29 июня 2018 года)
title:
  rus: Об утверждении Правил проведения экономической экспертизы проектно-сметной документации объектов, связанных с проведением работ по государственному геологическому изучению и мониторингу недр, консервации, ликвидации нефтегазовых и гидрогеологических скважин
  kaz: Жер қойнауын мемлекеттік геологиялық зерттеу және мониторингілеу, мұнай-газ және гидрогеологиялық ұңғымаларды консервациялау, жою бойынша жұмыстарды жүргізумен байланысты объектілердің жобалық-сметалық құжаттамасына экономикалық сараптама жүргізу қағидасын бекіту туралы
