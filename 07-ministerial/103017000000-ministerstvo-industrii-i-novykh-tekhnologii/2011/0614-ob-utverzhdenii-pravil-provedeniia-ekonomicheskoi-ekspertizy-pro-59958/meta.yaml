  title:
    rus: О признании утратившими силу некоторых приказов Министерства индустрии и новых технологий Республики Казахстан и Министерства по инвестициям и развитию Республики Казахстан
    kaz: Қазақстан Республикасы Индустрия және жаңа технологиялар министрлігінің және Қазақстан Республикасы Инвестициялар және даму министрлігінің кейбір бұйрықтарының күші жойылды деп тану туралы
