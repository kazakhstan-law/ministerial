act_code: '62123'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 21 ноября 2011 года № 425. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 декабря 2011 года № 7345. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 11 июля 2019 года № 501 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении требований к технико-экономическому обоснованию проекта, подаваемого заявителем для осуществления деятельности в качестве участника специальной экономической зоны
