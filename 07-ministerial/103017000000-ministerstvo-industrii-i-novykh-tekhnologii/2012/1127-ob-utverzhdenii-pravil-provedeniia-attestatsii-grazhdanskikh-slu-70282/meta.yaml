act_code: '70282'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 27 ноября 2012 года № 424. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 декабря 2012 года № 8243. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 29 декабря 2015 года № 1263
title:
  rus: Об утверждении Правил проведения аттестации гражданских служащих государственного учреждения "Республиканский центр геологической информации "Казгеоинформ" Комитета геологии и недропользования Министерства индустрии и новых технологий Республики Казахстан"
  kaz: '"Қазақстан Республикасы Индустрия және жаңа технологиялар министрлігінің Геология және жер қойнауын пайдалану комитеті "Қазгеоақпарат" Республикалық геологиялық ақпарат орталығы" мемлекеттік мекемесінің азаматтық қызметшілерін аттестаттаудан өткізу қағидаларын бекіту туралы'
