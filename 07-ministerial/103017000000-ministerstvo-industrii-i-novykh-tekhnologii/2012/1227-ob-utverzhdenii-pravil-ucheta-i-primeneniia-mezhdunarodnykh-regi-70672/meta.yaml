act_code: '70672'
requisite: Приказ и.о. Министра индустрии и новых технологий Республики Казахстан от 27 декабря 2012 года № 491. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 января 2013 года № 8302. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 12 декабря 2018 года № 870 (вводится в действие с 11 апреля 2019 года)
title:
  rus: Об утверждении Правил учета и применения международных, региональных стандартов и стандартов иностранных государств, стандартов организаций, классификаторов технико-экономической информации, правил, норм и рекомендаций иностранных государств по стандартизации, подтверждению соответствия и аккредитации на территории Республики Казахстан, за исключением применения их в стандартах организаций
  kaz: Халықаралық, өңiрлiк стандарттарды және шет мемлекеттердiң стандарттарын, шет мемлекеттердің ұйымдарының стандарттарын, техникалық-экономикалық ақпарат жiктеуiштерін, стандарттау, сәйкестiктi растау және аккредиттеу жөніндегі қағидаларын, нормалары мен ұсынымдарын ұйымдардың стандарттарында қолдануды қоспағанда, оларды Қазақстан Республикасының аумағында есепке алу және қолдану қағидаларын бекіту туралы
