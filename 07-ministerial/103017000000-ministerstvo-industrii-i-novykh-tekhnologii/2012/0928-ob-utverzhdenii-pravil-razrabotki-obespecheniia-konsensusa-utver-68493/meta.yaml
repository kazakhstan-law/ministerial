act_code: '68493'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 28 сентября 2012 года № 344. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 ноября 2012 года № 8056. Утратил силу приказом Министра торговли и интеграции Республики Казахстан от 14 октября 2020 года № 223-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил разработки, обеспечения консенсуса, утверждения, учета, регистрации, обозначения, изменения, отмены, актуализации, хранения, издания, распространения, соблюдения авторских прав разработчика и введения в действие неправительственных стандартов
  kaz: Үкіметтік емес стандарттарды әзірлеу, консенсусты қамтамасыз ету, бекіту, есепке алу, тіркеу, белгілеу, өзгерту, жою, өзектендіру, сақтау, басып шығару, тарату, әзірлеушінің авторлық құқығын сақтау және оларды қолданысқа енгізу туралы
