requisite: Приказ и.о Министра индустрии и новых технологий Республики Казахстан от 5 октября 2012 года № 363. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 октября 2012 года № 8045. Утратил силу приказом заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 6 мая 2014 года № 157
title:
  rus: Об утверждении Регламента оказания государственной услуги "Согласование купли-продажи, передачи в аренду или доверительное управление объектов электроэнергетики и (или) его отдельных частей независимо от форм собственности"
  kaz: '"Электр энергетикасы объектілерін және (немесе) оның жекелеген бөліктерін меншік нысанына қарамастан сатып алу-сату, жалға немесе сенімді басқаруға беруге келісу" мемлекеттік қызмет регламентін бекіту туралы'
