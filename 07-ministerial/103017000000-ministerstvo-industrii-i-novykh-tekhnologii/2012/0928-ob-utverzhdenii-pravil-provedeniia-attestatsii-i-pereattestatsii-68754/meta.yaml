requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 28 сентября 2012 года № 348. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 ноября 2012 года № 8063. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 27 декабря 2018 года № 935 (вводится в действие с 11 апреля 2019 года)
title:
  rus: Об утверждении Правил проведения аттестации и переаттестации технических экспертов в области обеспечения единства измерений и поверителей средств измерений, а также квалификационных требований к ним
  kaz: Өлшем бірлігін қамтамасыз ету саласындағы техникалық сарапшыларға және өлшем құралдарын салыстырып тексерушілерге аттестаттау және қайта аттестаттау жүргізу, сондай-ақ оларға қойылатын біліктілік талаптар қағидаларды бекіту туралы
