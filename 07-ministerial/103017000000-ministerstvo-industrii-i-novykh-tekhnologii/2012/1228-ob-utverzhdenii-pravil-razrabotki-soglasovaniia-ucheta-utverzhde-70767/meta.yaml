  title:
    rus: Об утверждении Правил разработки, согласования, экспертизы, утверждения, регистрации, учета, изменения, пересмотра, отмены и введения в действие национальных стандартов (за исключением военных национальных стандартов), национальных классификаторов технико-экономической информации и рекомендаций по стандартизации, а также порядка внесения изменений и дополнений в общий классификатор товаров, работ и услуг
    kaz: Ұлттық стандарттарды (әскери ұлттық стандарттарды қоспағанда), ұлттық техникалық-экономикалық ақпарат сыныптауыштарын және стандарттау жөніндегі ұсынымдарды әзірлеу, келісу, сараптама жасау, бекіту, тіркеу, есепке алу, өзгерту, қайта қарау, күшін жою және қолданысқа енгізу, сондай-ақ тауарлардың, жұмыстар мен көрсетілетін қызметтердің жалпы сыныптауышына өзгерістер мен толықтырулар енгізу тәртібі қағидаларын бекіту туралы
