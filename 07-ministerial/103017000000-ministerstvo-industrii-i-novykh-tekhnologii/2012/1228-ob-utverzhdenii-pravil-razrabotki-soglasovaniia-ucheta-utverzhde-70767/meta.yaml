act_code: '70767'
requisite: Приказ и.о. Министра индустрии и новых технологий Республики Казахстан от 28 декабря 2012 года № 495. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 февраля 2013 года № 8314. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 26 декабря 2018 года № 918 (вводится в действие с 11 апреля 2019 года)
title:
  rus: Об утверждении Правил разработки, согласования, учета, утверждения, экспертизы, изменения, отмены и введения в действие национальных стандартов, предварительных национальных стандартов, классификаторов технико-экономической информации, за исключением военных стандартов на товары (продукцию), работы и услуги военного и двойного назначения
  kaz: Әскери және қосарланған мақсаттағы тауарларға (өнімге), жұмыстар мен көрсетілетін қызметтерге әскери стандарттарды қоспағанда, ұлттық стандарттарды, алдын ала ұлттық стандарттарды және техникалық-экономикалық ақпарат жіктеуіштерін әзірлеу, келісу, есепке алу, бекіту, сараптау, өзгерту, күшін жою және қолданысқа енгізу қағидаларын бекіту туралы
