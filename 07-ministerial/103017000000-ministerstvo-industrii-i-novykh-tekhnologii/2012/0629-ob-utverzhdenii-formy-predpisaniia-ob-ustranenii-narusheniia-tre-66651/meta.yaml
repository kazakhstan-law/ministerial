  title:
    rus: О внесении изменения в приказ Министра индустрии и новых технологий Республики Казахстан от 29 июня 2012 года № 223 "Об утверждении формы предписания об устранении нарушения требований законодательства Республики Казахстан об энергосбережении и повышении энергоэффективности"
    kaz: '"Қазақстан Республикасының энергия үнемдеу және энергия тиімділігін арттыру туралы заңнамасының талаптарын бұзушылықтарды жою туралы нұсқаманың нысанын бекіту туралы" Қазақстан Республикасы Индустрия және жаңа технологиялар министрінің 2012 жылғы 29 маусымдағы № 223 бұйрығына өзгеріс енгізу туралы'
