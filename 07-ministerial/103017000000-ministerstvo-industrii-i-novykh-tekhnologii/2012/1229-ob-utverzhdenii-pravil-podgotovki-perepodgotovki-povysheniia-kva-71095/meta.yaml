title:
  rus: Об утверждении Правил подготовки, переподготовки, повышения квалификации экспертов-аудиторов по подтверждению соответствия, аккредитации, определению страны происхождения товара, статуса товара Таможенного союза или иностранного товара и их аттестации, и квалификационных требований к ним
  kaz: Тауарды шығарған елді, Кеден одағы тауарының немесе шетел тауарының мәртебесін айқындау, сәйкестігін растау, аккредиттеу жөніндегі сарапшы-аудиторларды даярлау, қайта даярлау, біліктілігін арттыру және оларды аттестаттау қағидасын, және оларға қойылатын біліктілік талаптарын бекіту туралы
