  title:
    rus: О внесении дополнения в приказ исполняющего обязанности Министра индустрии и новых технологий Республики Казахстан от 29 декабря 2012 года № 510 "Об утверждении Правил подготовки, переподготовки, повышения квалификации экспертов-аудиторов по подтверждению соответствия, аккредитации, определению страны происхождения товара, статуса товара Таможенного союза или иностранного товара и их аттестации, и квалификационных требований к ним"
    kaz: '"Тауарды шығарған елді, Кеден одағы тауарының немесе шетел тауарының мәртебесін айқындау, сәйкестігін растау, аккредиттеу жөніндегі сарапшы-аудиторларды даярлау, қайта даярлау, біліктілігін арттыру және оларды аттестаттау қағидасын, және оларға қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Индустрия және жаңа технологиялар министрінің міндетін атқарушының 2012 жылғы 29 желтоқсандағы № 510 бұйрығына толықтыру енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/74627/rus
