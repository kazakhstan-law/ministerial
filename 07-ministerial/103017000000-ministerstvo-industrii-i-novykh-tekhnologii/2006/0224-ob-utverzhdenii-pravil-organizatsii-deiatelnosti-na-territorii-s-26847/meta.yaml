title:
  rus: Об утверждении Правил организации деятельности на территории специальной экономической зоны "Парк информационных технологий и Правил регистрации юридических лиц в качестве участников специальной экономической зоны "Парк информационных технологий"
  kaz: '"Ақпараттық технологиялар паркi" арнайы экономикалық аймағының аумағында қызметтi ұйымдастыру ережесiн және "Ақпараттық технологиялар паркi" арнайы экономикалық аймағының қатысушылары ретiнде заңды тұлғаларды тiркеу ережесiн бекiту туралы'
