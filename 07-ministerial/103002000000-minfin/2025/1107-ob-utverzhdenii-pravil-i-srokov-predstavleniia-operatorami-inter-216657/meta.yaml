act_code: '216657'
requisite: Приказ Министра финансов Республики Казахстан от 7 ноября 2025 года № 680. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 ноября 2025 года № 37368
title:
  rus: Об утверждении Правил и сроков представления операторами интернет-платформ, у которых оплата за оказанные услуги, выполненные работы не производится через интернет-платформу, в органы государственных доходов сведений о лицах, зарегистрированных на интернет-платформе, оказывающих заказчикам услуги или выполняющих заказчикам работы с использованием интернет-платформы
  kaz: Көрсетілген қызметтер, орындалған жұмыстар үшін ақы төлеу интернет-платформа арқылы жүргізілмейтін интернет-платформа операторлары мемлекеттік кірістер органдарына интернет-платформада тіркелген, интернет-платформаны пайдалана отырып, тапсырыс берушілерге қызметтер көрсететін немесе тапсырыс берушілерге жұмыстарды орындайтын тұлғалар туралы мәліметтерді ұсыну қағидалары мен мерзімдерін бекіту туралы
