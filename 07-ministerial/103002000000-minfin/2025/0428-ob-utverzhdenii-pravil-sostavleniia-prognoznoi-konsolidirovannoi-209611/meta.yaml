  requisite: Приказ Министра финансов Республики Казахстан от 17 марта 2026 года № 187
  title:
    rus: О внесении изменений в приказы Министра финансов Республики Казахстан от 28 апреля 2025 года № 198 «Об утверждении Правил составления прогнозной консолидированной финансовой отчетности по областному бюджету, бюджету города республиканского значения, столицы» и от 28 апреля 2025 года № 199 «Об утверждении Правил составления прогнозной консолидированной финансовой отчетности по республиканскому бюджету»
    kaz: Қазақстан Республикасы Қаржы министрінің «Облыстық бюджет, республикалық маңызы бар қаланың, астананың бюджеті бойынша болжамды шоғырландырылған қаржылық есептілікті жасау қағидаларын бекіту туралы» 2025 жылғы 28 сәуірдегі № 198 және «Республикалық бюджет бойынша болжамды шоғырландырылған қаржылық есептілікті жасау қағидаларын бекіту туралы» 2025 жылғы 28 сәуірдегі № 199 бұйрықтарына өзгерістер енгізу туралы
