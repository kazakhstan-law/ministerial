act_code: '216197'
requisite: Приказ Министра финансов Республики Казахстан от 24 октября 2025 года № 625
title:
  rus: Об утверждении Правил и формы представления кредитным бюро в орган государственных доходов сведений из кредитного отчета по задолженности физических лиц, у которых возникла обязанность по представлению декларации об активах и обязательствах, о доходах и имуществе, перед коллекторскими и (или) микрофинансовыми организациями
  kaz: Кредиттік бюромен активтер мен міндеттемелер туралы, кірістер мен мүлік туралы декларацияны ұсыну жөніндегі міндеті туындаған жеке тұлғалардың коллекторлық және (немесе) микроқаржы ұйымдарының алдындағы берешегі бойынша кредиттік есептен мәліметтерін мемлекеттік кіріс органдарына ұсыну қағидалары мен нысанын бекіту туралы
