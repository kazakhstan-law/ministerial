act_code: '215114'
requisite: Приказ Министра финансов Республики Казахстан от 30 сентября 2025 года № 554. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 октября 2025 года № 37019
title:
  rus: Об утверждении формы сведений об оказанных услугах третьим лицам, представляемых организациями, оказывающими услуги водоснабжения, водоотведения, канализации, газоснабжения, электроснабжения, теплоснабжения, сбора отходов (мусороудаления), обслуживания лифтов и (или) услуги в сфере перевозок и Правил их представления в орган государственных доходов
  kaz: Сумен жабдықтау, су бұру, кәріз, газбен жабдықтау, электрмен жабдықтау, жылумен жабдықтау, қалдықтарды жинау (қоқыс шығару), лифтілерге қызмет көрсету және (немесе) тасымалдаулар саласындағы қызметтерді көрсететін ұйымдар үшінші тұлғаларға көрсетілген қызметтер туралы мәліметтер нысанын және Мемлекеттік кірістер органына оларды ұсыну қағидаларын бекіту туралы
