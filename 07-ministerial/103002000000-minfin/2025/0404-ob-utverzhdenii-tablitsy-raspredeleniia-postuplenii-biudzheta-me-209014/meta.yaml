caused_by:
  code: '228444'
  requisite: Приказ Министра финансов Республики Казахстан от 3 августа 2026 года № 520
  title:
    rus: О внесении изменений и дополнений в приказы Министра финансов Республики Казахстан от 4 апреля 2025 года № 151 «Некоторые вопросы Единой бюджетной классификации Республики Казахстан» и от 4 апреля 2025 года № 152 «Об утверждении Таблицы распределения поступлений бюджета между уровнями бюджетов, контрольными счетами наличности Национального фонда Республики Казахстан, внебюджетных фондов, формируемых за счет неналоговых платежей, и бюджетами государств – членов Евразийского экономического союза»
    kaz: Қазақстан Республикасы Қаржы министрiнiң «Қазақстан Республикасының Бірыңғай бюджеттік сыныптамасының кейбір мәселелері» 2025 жылғы 4 сәуірдегі № 151 және «Бюджет түсімдерін бюджеттердің деңгейлері, Қазақстан Республикасы Ұлттық қорының, салықтық емес төлемдер есебінен қалыптастырылатын бюджеттен тыс қорлардың қолма-қол ақшаны бақылау шоттары және Еуразиялық экономикалық одаққа мүше мемлекеттердің бюджеттері арасында бөлу кестесі» 2025 жылғы 4 сәуірдегі № 152 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/228444/rus
