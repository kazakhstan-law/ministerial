caused_by:
  code: '226491'
  requisite: Приказ Министра финансов Республики Казахстан от 16 июня 2026 года № 402
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра финансов Республики Казахстан от 15 мая 2025 года № 233 «Об утверждении перечня уполномоченных органов по неналоговым поступлениям в республиканский бюджет, Национальный Фонд Республики Казахстан, Фонд компенсации потерпевшим, Специальный государственный фонд и уполномоченных государственных органов, ответственных за взимание и осуществляющих контроль за поступлениями от продажи основного капитала, трансфертов, сумм погашения бюджетных кредитов, от продажи финансовых активов государства, займов в разрезе неналоговых поступлений»
    kaz: «Республикалық бюджетке, Қазақстан Республикасының Ұлттық қорына, Жәбірленушілерге өтемақы қорына, Арнаулы мемлекеттік қорға салықтық емес түсімдер жөніндегі уәкілетті органдардың және салықтық емес түсімдер бөлінісінде негізгі капиталды сатудан түсетін түсімдерді, трансферттерді, мемлекеттің қаржылық активтерін сатудан түсетін түсімдерді, бюджеттік кредиттерді, қарыздарды өтеу сомаларына жауапты және олардың түсуін бақылауды жүзеге асыратын уәкілетті мемлекеттік органдардың тізбесін бекіту туралы» Қазақстан Республикасы Қаржы министрінің міндетін атқарушының 2025 жылғы 15 мамырдағы № 233 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/226491/rus
