act_code: '210328'
requisite: Приказ и.о. Министра финансов Республики Казахстан от 15 мая 2025 года № 233
title:
  rus: Об утверждении перечня уполномоченных органов по неналоговым поступлениям в республиканский бюджет, Национальный Фонд Республики Казахстан, Фонд компенсации потерпевшим, Специальный государственный фонд и уполномоченных государственных органов, ответственных за взимание и осуществляющих контроль за поступлениями от продажи основного капитала, трансфертов, сумм погашения бюджетных кредитов, от продажи финансовых активов государства, займов в разрезе неналоговых поступлений
  kaz: Республикалық бюджетке, Қазақстан Республикасының Ұлттық қорына, Жәбірленушілерге өтемақы қорына, Арнаулы мемлекеттік қорға салықтық емес түсімдер жөніндегі уәкілетті органдардың және салықтық емес түсімдер бөлінісінде негізгі капиталды сатудан түсетін түсімдерді, трансферттерді, мемлекеттің қаржылық активтерін сатудан түсетін түсімдерді, бюджеттік кредиттерді, қарыздарды өтеу сомаларына жауапты және олардың түсуін бақылауды жүзеге асыратын уәкілетті мемлекеттік органдардың тізбесін бекіту туралы
