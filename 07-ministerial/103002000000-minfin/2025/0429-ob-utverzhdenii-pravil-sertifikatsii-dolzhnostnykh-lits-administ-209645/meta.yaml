  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 29 апреля 2025 года № 210 «Об утверждении Правил сертификации должностных лиц администраторов бюджетных программ и уполномоченных органов по исполнению республиканского бюджета, бюджета области, города республиканского значения, столицы, районного (города областного значения) бюджета, уполномоченных на ведение бухгалтерского учета и составление финансовой отчетности»
    kaz: «Бюджеттік бағдарламалар әкімшілерінің және республикалық бюджетті, облыстың, республикалық маңызы бар қаланың, астананың бюджетін, аудандық (облыстық маңызы бар қаланың) бюджетті атқару жөніндегі уәкілетті органдардың бухгалтерлік есепті жүргізуге және қаржылық есептілікті жасауға уәкілеттік берілген лауазымды адамдарын сертификаттау қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2025 жылғы 29 сәуірдегі № 210 бұйрығына өзгерiстер енгiзу туралы
