act_code: '209645'
requisite: Приказ Министра финансов Республики Казахстан от 29 апреля 2025 года № 210. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 апреля 2025 года № 36037
title:
  rus: Об утверждении Правил сертификации должностных лиц администраторов бюджетных программ и уполномоченных органов по исполнению республиканского бюджета, бюджета столицы, области, города республиканского значения, районного (города областного значения) бюджета, уполномоченных на ведение бухгалтерского учета и составление финансовой отчетности
  kaz: Бюджеттік бағдарламалар әкімшілерінің және республикалық бюджетті, астананың, облыстың, республикалық маңызы бар қаланың бюджетін, аудандық (облыстық маңызы бар қаланың) бюджетті атқару жөніндегі уәкілетті органдардың бухгалтерлік есепті жүргізуге және қаржылық есептілікті жасауға уәкілеттік берілген лауазымды адамдарын сертификаттау қағидаларын бекіту туралы
