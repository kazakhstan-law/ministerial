title:
  rus: Об утверждении натуральных норм обеспечения государственных органов служебными и дежурными автомобилями, телефонной связью, офисной мебелью и техникой, площадями для размещения аппарата государственных органов и канцелярскими принадлежностями
  kaz: Мемлекеттік органдарды қызметтік және кезекші автомобильдермен, телефон байланысымен, кеңсе жиһазымен және техникасымен, мемлекеттік органдардың аппаратын орналастыру үшін алаңдармен және кеңсе керек-жарақтармен қамтамасыз етудің заттай нормаларын бекіту туралы
