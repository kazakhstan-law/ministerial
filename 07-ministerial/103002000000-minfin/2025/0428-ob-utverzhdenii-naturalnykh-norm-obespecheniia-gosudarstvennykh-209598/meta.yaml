  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 28 апреля 2025 года № 201 «Об утверждении натуральных норм обеспечения государственных органов служебными и дежурными автомобилями, телефонной связью, офисной мебелью и техникой, площадями для размещения аппарата государственных органов и канцелярскими принадлежностями»
    kaz: «Мемлекеттік органдарды қызметтік және кезекші автомобильдермен, телефон байланысымен, кеңсе жиһазымен және техникасымен, мемлекеттік органдардың аппаратын орналастыру үшін алаңдармен және кеңсе керек-жарақтармен қамтамасыз етудің заттай нормаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2025 жылғы 28 сәуірдегі № 201 бұйрығына өзгерістер енгізу туралы
