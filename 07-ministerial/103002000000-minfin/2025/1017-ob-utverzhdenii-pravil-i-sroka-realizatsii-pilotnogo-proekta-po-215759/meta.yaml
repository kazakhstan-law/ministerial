title:
  rus: Об утверждении Правил и срока реализации пилотного проекта по применению органами государственных доходов мер по упрощению процедуры, связанной с реализацией имущества, заложенного налогоплательщиком и (или) третьим лицом в счет задолженности по налогам и другим обязательным платежам в бюджет, с использованием мобильного приложения
  kaz: Мемлекеттік кірістер органдарының мобильді қосымшаны пайдалана отырып, салық төлеуші және (немесе) үшінші тұлға салықтар мен бюджетке төленетін басқа да міндетті төлемдер бойынша берешек есебіне кепілге қойған мүлікті өткізуге байланысты рәсімді оңайлату шараларын қолдану жөніндегі пилоттық жобаны іске асыру қағидалары мен мерзімін бекіту туралы
