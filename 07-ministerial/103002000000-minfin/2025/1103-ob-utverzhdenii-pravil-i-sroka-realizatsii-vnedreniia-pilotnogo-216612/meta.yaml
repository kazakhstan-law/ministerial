requisite: Приказ Министра финансов Республики Казахстан от 3 ноября 2025 года № 666. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 ноября 2025 года № 37359
title:
  rus: Об утверждении Правил и срока реализации (внедрения) пилотного проекта по передаче посредством информационной системы «База фискальных данных» сведений о денежных расчетах, осуществляемых при реализации товаров, выполнении работ и оказании услуг в органы государственных доходов с применением электронного каталога товаров
  kaz: Тауарларды өткізу, жұмыстарды орындау және қызметтерді көрсету кезінде жүзеге асырылатын ақшалай есеп айырысулар туралы мәліметтерді «Фискалдық деректер базасы» ақпараттық жүйесі арқылы тауарлардың электрондық каталогын қолдана отырып, мемлекеттік кірістер органдарына беру жөніндегі пилоттық жобаны іске асыру (енгізу) қағидалары мен мерзімін бекіту туралы
