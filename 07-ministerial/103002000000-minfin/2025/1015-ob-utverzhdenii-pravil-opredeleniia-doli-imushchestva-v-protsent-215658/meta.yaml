act_code: '215658'
requisite: Приказ Министра финансов Республики Казахстан от 15 октября 2025 года № 605. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 октября 2025 года № 37138
title:
  rus: Об утверждении Правил определения доли имущества в процентном соотношении к стоимости реализуемых акций или доли участия на день реализации, а также доли имущества лиц (лица), являющихся (являющегося) недропользователями (недропользователем), в стоимости активов юридического лица – резидента, в том числе юридического лица – эмитента, а также Правил и сроков начисления налога с доходов от прироста стоимости при реализации имущества, находящегося в Республике Казахстан
  kaz: Өткізілетін акциялардың құнына немесе өткізу күніндегі қатысу үлесіне пайыздық арақатынастағы мүліктің үлесін, сондай-ақ жер қойнауын пайдаланушы (жер қойнауын пайдаланушылар) болып табылатын тұлғалардың (тұлғаның) резидент-заңды тұлғаның, оның ішінде эмитент заңды тұлғаның активтері құнындағы мүлкінің үлесін анықтау қағидаларын, сондай-ақ  Қазақстан Республикасындағы мүлікті өткізу кезінде құн өсімінен түсетін кірістерден салықты есептеу қағидалары мен мерзімдерін бекіту туралы
