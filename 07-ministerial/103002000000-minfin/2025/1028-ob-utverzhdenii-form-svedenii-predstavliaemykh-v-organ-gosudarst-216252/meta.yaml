  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 28 октября 2025 года № 634 «Об утверждении форм сведений, представляемых в орган государственных доходов, биржами цифровых активов, а также иными участниками Международного финансового центра «Астана» о проведенных резидентами Республики Казахстан и нерезидентами операциях на биржах цифровых активов и выплаченных вознаграждениях резидентам и нерезидентам от осуществления деятельности, связанной с цифровыми активами, а также Правил их представления»
    kaz: «Цифрлық активтер биржалары, сондай-ақ «Астана» халықаралық қаржы орталығының өзге де қатысушыларының мемлекеттік кірістер органына Қазақстан Республикасының резиденттері мен бейрезиденттерінің цифрлық активтер биржаларында жүргізген операциялары және резиденттер мен бейрезиденттерге цифрлық активтерге байланысты қызметті жүзеге асырудан төленген сыйақылар туралы мәліметтерді ұсыну нысаны және оларды ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2025 жылғы 28 қазандағы № 634 бұйрығына өзгерістер енгізу туралы
