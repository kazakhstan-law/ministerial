act_code: '216252'
requisite: Приказ Министра финансов Республики Казахстан от 28 октября 2025 года № 634. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 октября 2025 года № 37274
title:
  rus: Об утверждении форм сведений, представляемых в орган государственных доходов, биржами цифровых активов, а также иными участниками Международного финансового центра «Астана» о проведенных резидентами Республики Казахстан и нерезидентами операциях на биржах цифровых активов и выплаченных вознаграждениях резидентам и нерезидентам от осуществления деятельности, связанной с цифровыми активами, а также Правил их представления
  kaz: Цифрлық активтер биржалары, сондай-ақ «Астана» халықаралық қаржы орталығының өзге де қатысушыларының мемлекеттік кірістер органына Қазақстан Республикасының резиденттері мен бейрезиденттерінің цифрлық активтер биржаларында жүргізген операциялары және резиденттер мен бейрезиденттерге цифрлық активтерге байланысты қызметті жүзеге асырудан төленген сыйақылар туралы мәліметтерді ұсыну нысаны және оларды ұсыну қағидаларын бекіту туралы
