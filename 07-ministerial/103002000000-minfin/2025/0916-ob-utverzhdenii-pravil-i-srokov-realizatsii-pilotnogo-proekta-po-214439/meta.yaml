    kaz: «Жеке тұлғалардың мүлкі мен көлік құралдарына салық жинау бөлігінде салықтық әкімшілендіруді жетілдіру жөніндегі пилоттық жобаны іске асыру қағидалары мен мерзімдерін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2025 жылғы 16 қыркүйектегі № 500 бұйрығына өзгерістер енгізу туралы
