title:
  rus: Об утверждении Правил и сроков реализации пилотного проекта по совершенствованию налогового администрирования в части сбора налогов на имущество и на транспортные средства физических лиц, а также платы за размещение наружной (визуальной) рекламы
  kaz: Жеке тұлғалардың мүлкі мен көлік құралдарына салынатын салықтарды, сондай-ақ сыртқы (көрнекі) жарнаманы орналастырғаны үшін төлемақыны жинау бөлігінде салықтық әкімшілендіруді жетілдіру жөніндегі пилоттық жобаны іске асыру қағидалары мен мерзімдерін бекіту туралы
