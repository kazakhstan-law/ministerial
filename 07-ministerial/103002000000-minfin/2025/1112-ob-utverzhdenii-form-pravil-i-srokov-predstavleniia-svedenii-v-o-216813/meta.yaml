act_code: '216813'
requisite: Приказ Министра финансов Республики Казахстан от 12 ноября 2025 года № 699. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 ноября 2025 года № 37398
title:
  rus: Об утверждении форм, Правил и сроков представления сведений в органы государственных доходов банками второго уровня, филиалами банков-нерезидентов Республики Казахстан и организациями, осуществляющими отдельные виды банковских операций, кастодианами, включая управляющих инвестиционным портфелем, центральным депозитарием, брокерами и (или) дилерами, обладающими правом ведения счетов клиентов в качестве номинальных держателей ценных бумаг, страховыми организациями, осуществляющими деятельность по отрасли «страхование жизни», страховыми (перестраховочными) организациями, филиалами страховых (перестраховочных) организаций-нерезидентов Республики Казахстан, страховыми брокерами, а также коллекторскими агентствами
  kaz: Екінші деңгейдегі банктердің, Қазақстан Республикасының бейрезидент-банктерінің филиалдары мен банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың, бағалы қағаздарды номиналды ұстаушылар ретінде клиенттердің шоттарын жүргізу құқығына ие инвестициялық портфельді басқаратындарды қоса алғанда, кастодиандардың, орталық депозитарийдің, брокерлердің және (немесе) дилерлердің, қызметін «өмірді сақтандыру» саласы бойынша жүзеге асыратын сақтандыру ұйымдарының, сақтандыру (қайта сақтандыру) ұйымдарының, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының, сақтандыру брокерлерінің, сондай-ақ коллекторлық агенттіктердің мемлекеттік кірістер органдарына мәліметтерді ұсыну нысандарын, қағидалары мен мерзімдерін бекіту туралы
