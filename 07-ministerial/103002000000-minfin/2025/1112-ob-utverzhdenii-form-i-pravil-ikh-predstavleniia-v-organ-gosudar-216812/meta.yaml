act_code: '216812'
requisite: Приказ Министра финансов Республики Казахстан от 12 ноября 2025 года № 697. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 ноября 2025 года № 37397
title:
  rus: Об утверждении форм и Правил их представления в орган государственных доходов сведений страховыми (перестраховочными) организациями, страховыми брокерами, брокерами, организациями, осуществляющими деятельность по ведению системы реестров держателей ценных бумаг, профессиональными участниками рынка ценных бумаг, участником Международного финансового центра «Астана», имеющим лицензию на осуществление деятельности по управлению заемной краудфандинговой платформой, кредитными бюро, необходимых для налогового администрирования физических лиц, у которых возникла обязанность по представлению налоговой отчетности об активах и обязательствах, а также и о доходах и имуществе
  kaz: Мемлекеттік кірістер органына сақтандыру (қайта сақтандыру) ұйымдарының, сақтандыру брокерлерінің, брокерлердің, бағалы қағаздарды ұстаушылар тізілімдерінің жүйесін жүргізу жөніндегі қызметті жүзеге асыратын ұйымдардың, бағалы қағаздар нарығының кәсіби қатысушыларының, қарыз краудфандингтік платформаны басқару жөніндегі қызметті жүзеге асыруға лицензиясы бар «Астана» халықаралық қаржы орталығы қатысушыларының, кредиттік бюролардың активтер мен міндеттемелер туралы және кірістер мен мүлік туралы салықтық есептілікті ұсыну міндеттемесі туындаған жеке тұлғаларды салықтық әкімшілендіру үшін қажетті мәліметтерді ұсыну қағидаларын және нысандарын бекіту туралы
