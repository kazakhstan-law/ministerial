  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра финансов Республики Казахстан от 30 октября 2025 года № 647 «Об утверждении Правил использования специального мобильного приложения для целей исполнения налоговых обязательств и обязательств по социальным платежам при применении специального налогового режима, содержания чека специального мобильного приложения»
    kaz: «Арнаулы салық режимін қолдану кезінде салықтық міндеттемелер мен әлеуметтік төлемдер бойынша міндеттемелерді орындау мақсаттары үшін арнаулы мобильді қосымшаны пайдалану қағидаларын және арнаулы мобильді қосымша чегінің мазмұнын бекіту туралы» Қазақстан Республикасы Қаржы министрінің міндетін атқарушының 2025 жылғы 30 қазандағы № 647 бұйрығына өзгерістер енгізу туралы
