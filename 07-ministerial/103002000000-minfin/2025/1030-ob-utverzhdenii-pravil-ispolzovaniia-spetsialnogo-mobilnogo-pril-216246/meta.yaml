title:
  rus: Об утверждении Правил использования специального мобильного приложения для целей исполнения налоговых обязательств и обязательств по социальным платежам при применении специального налогового режима, содержания чека специального мобильного приложения
  kaz: Арнаулы салық режимін қолдану кезінде салықтық міндеттемелер мен әлеуметтік төлемдер бойынша міндеттемелерді орындау мақсаттары үшін арнаулы мобильді қосымшаны пайдалану қағидаларын және арнаулы мобильді қосымша чегінің мазмұнын бекіту туралы
