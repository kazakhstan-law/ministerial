act_code: '216221'
requisite: Приказ и.о. Министра финансов Республики Казахстан от 29 октября 2025 года № 644. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 октября 2025 года № 37262
title:
  rus: Об утверждении формы сведений о физических лицах, предоставляемых в органы государственных доходов лицом, созданным по решению Правительства Республики Казахстан, обеспечивающее в соответствии с законодательством Республики Казахстан учет пенсионных взносов, социальных отчислений и социальных выплат, взносов и отчислений на обязательное социальное медицинское страхование
  kaz: Қазақстан Республикасы Үкіметінің шешімі бойынша құрылған, Қазақстан Республикасының заңнамасына сәйкес зейнетақы жарналарын, әлеуметтік аударымдар мен әлеуметтік төлемдерді, міндетті әлеуметтік медициналық сақтандыруға арналған жарналар мен аударымдарды есепке алуды қамтамасыз ететін тұлғалардың мемлекеттік кірістер органдарына ұсынатын жеке тұлғалар туралы мәліметтер нысанын бекіту туралы
