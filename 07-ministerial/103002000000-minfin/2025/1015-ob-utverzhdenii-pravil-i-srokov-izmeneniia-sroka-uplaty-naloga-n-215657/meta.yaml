title:
  rus: Об утверждении Правил и сроков изменения срока уплаты налога на добавленную стоимость по импортируемым товарам, за исключением товаров, импортируемых с территории государств-членов Евразийского экономического союза
  kaz: Еуразиялық экономикалық одаққа мүше мемлекеттердің аумағынан импортталатын тауарларды қоспағанда, импортталатын тауарлар бойынша қосылған құн салығын төлеу мерзімін өзгерту қағидалары мен мерзімдерін бекіту туралы
