title:
  rus: Об установлении формы сведений, представляемых владельцами интернет-площадок в орган государственных доходов о реализованных товарах, оказанных услугах (работах) и (или) выплатах физическим лицам – резидентам Республики Казахстан и Правила их представления
  kaz: Интернет-алаң иелерінің мемлекеттік кірістер органына Қазақстан Республикасының резидент – жеке тұлғаларына өткізілген тауарлар, көрсетілген қызметтер (жұмыстар) және (немесе) төлемдер туралы ұсынатын мәліметтерінің нысанын және оларды ұсыну қағидаларын бекіту туралы
