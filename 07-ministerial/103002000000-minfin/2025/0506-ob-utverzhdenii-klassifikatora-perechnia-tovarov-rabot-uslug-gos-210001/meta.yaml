    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 6 мая 2025 года № 219 «Об утверждении Классификатора перечня товаров (работ, услуг) государственных учреждений, содержащихся за счет республиканского или местного бюджета, деньги от реализации которых остаются в их распоряжении»
