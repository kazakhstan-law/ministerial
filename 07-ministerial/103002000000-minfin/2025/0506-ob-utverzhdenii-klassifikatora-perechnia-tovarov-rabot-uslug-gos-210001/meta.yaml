  kaz: Республикалық немесе жергілікті бюджет есебінен ұсталатын мемлекеттік мекемелердің оларды өткізуден түскен ақша өз иелігінде қалатын тауарлары (жұмыстары, көрсетілетін қызметтері) тізбесінің сыныптауышын бекіту туралы
