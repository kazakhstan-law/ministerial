  title:
    rus: О внесении изменения и дополнения в приказ Министра финансов Республики Казахстан от 6 мая 2025 года № 219 «Об утверждении Классификатора перечня товаров (работ, услуг) государственных учреждений, содержащихся за счет республиканского или местного бюджета, деньги от реализации которых остаются в их распоряжении»
    kaz: «Республикалық немесе жергілікті бюджет есебінен ұсталатын мемлекеттік мекемелердің оларды өткізуден түскен ақша өз иелігінде қалатын тауарлары (жұмыстары, көрсетілетін қызметтері) тізбесінің сыныптауышын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2025 жылғы 6 мамырдағы № 219 бұйрығына өзгеріс пен толықтыру енгізу туралы
