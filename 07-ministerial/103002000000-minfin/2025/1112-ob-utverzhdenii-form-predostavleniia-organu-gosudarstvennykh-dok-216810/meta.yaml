act_code: '216810'
requisite: Приказ Министра финансов Республики Казахстан от 12 ноября 2025 года № 698. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 ноября 2025 года № 37396
title:
  rus: Об утверждении форм предоставления органу государственных доходов банковскими организациями сведений о наличии и номерах банковских счетов физических и юридических лиц, об остатках и движении денег на таких счетах, предоставленных кредитах физическому лицу, у которого возникла обязанность по представлению деклараций об активах и обязательствах, о доходах и имуществе, Правил и сроков представления сведений по налогоплательщикам, осуществляющим электронную торговлю товарами, а также Перечня и Правил представления сведений по итоговой сумме денег, поступивших на банковский счет физического лица, имеющей признаки получения дохода от осуществления предпринимательской деятельности и критериев отнесения к таким операциям
  kaz: Банк ұйымдарының мемлекеттік кірістер органына жеке және заңды тұлғалардың банктік шоттарының бар-жоғы және олардың нөмірлері туралы, осындай шоттардағы ақша қалдықтары мен қозғалысы, активтер мен міндеттемелер туралы, кірістер мен мүлік туралы декларацияларды ұсыну міндеті туындаған жеке тұлғаға берілген кредиттер туралы мәліметтерді ұсыну нысандарын, сондай-ақ Тауарлардың электрондық саудасын жүзеге асыратын салық төлеушілер бойынша мәліметтерді ұсыну қағидалары мен мерзімдерін, сондай-ақ Кәсіпкерлік қызметті жүзеге асырудан кіріс алу белгілері бар жеке тұлғаның банктік шотына түскен ақшаның жиынтық сомасы бойынша мәліметтерді ұсыну қағидалары мен тізбесін және осындай операцияларға жатқызу өлшемшарттарын бекіту туралы
