act_code: '214456'
requisite: Приказ Министра финансов Республики Казахстан от 10 сентября 2025 года № 489
title:
  rus: Об утверждении решений органов государственных доходов, связанных с контролем за соблюдением порядка учета, хранения, оценки, дальнейшего использования и реализации имущества, обращенного (поступившего) в собственность государства и контролем за деятельностью уполномоченных государственных органов, местных исполнительных органов и Государственной корпорации «Правительство для граждан»
  kaz: Мемлекет меншігіне айналдырылған (түскен) мүлікті есепке алу, сақтау, бағалау, одан әрі пайдалану және өткізу тәртібінің сақталуын бақылауға және уәкілетті мемлекеттік органдардың, жергілікті атқарушы органдардың және «Азаматтарға арналған үкімет» мемлекеттік корпорацияның қызметін бақылауға байланысты мемлекеттік кірістер органының шешімдерін бекіту туралы
