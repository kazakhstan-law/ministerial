  code: '230523'
  requisite: Приказ Министра финансов Республики Казахстан от 29 сентября 2026 года № 652
  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 10 сентября 2025 года № 489 «Об утверждении решений органов государственных доходов, связанных с контролем за соблюдением порядка учета, хранения, оценки, дальнейшего использования и реализации имущества, обращенного (поступившего) в собственность государства и контролем за деятельностью уполномоченных государственных органов, местных исполнительных органов и Государственной корпорации «Правительство для граждан»»
    kaz: «Мемлекет меншігіне айналдырылған (түскен) мүлікті есепке алу, сақтау, бағалау, одан әрі пайдалану және өткізу тәртібінің сақталуын бақылауға және уәкілетті мемлекеттік органдардың, жергілікті атқарушы органдардың және «Азаматтарға арналған үкімет» мемлекеттік корпорациясының қызметін бақылауға байланысты мемлекеттік кіріс органдарының шешімдерін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2025 жылғы 10 қыркүйектегі № 489 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/230523/rus
