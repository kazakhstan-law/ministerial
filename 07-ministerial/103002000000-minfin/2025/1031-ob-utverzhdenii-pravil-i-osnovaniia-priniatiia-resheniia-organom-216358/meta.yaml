title:
  rus: Об утверждении Правил и основания принятия решения органом государственных доходов о проведении налоговой проверки, а также Правил вынесения органом государственных доходов решения о проведении хронометражного обследования по месту нахождения, указанному в регистрационных данных налогоплательщика, и (или) по месту нахождения объекта налогообложения и (или) объекта, связанного с налогообложением
  kaz: Мемлекеттік кірістер органының салықтық тексеру жүргізу туралы шешім қабылдау қағидалары мен негіздерін, сондай-ақ Салық төлеушінің тіркеу деректерінде көрсетілген орналасқан жері бойынша және (немесе) салық салу объектісінің және (немесе) салық салуға байланысты объектінің орналасқан жері бойынша хронометраждық зерттеп-қарау жүргізу туралы мемлекеттік кірістер органының шешім шығару қағидаларын бекіту туралы
