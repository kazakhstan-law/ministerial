title:
  rus: Об утверждении Правил выплаты вознаграждения финансовому управляющему уполномоченным органом, осуществляющим руководство в сфере государственного управления по восстановлению платежеспособности и банкротства граждан Республики Казахстан
  kaz: Қазақстан Республикасы азаматтарының төлем қабілеттілігін қалпына келтіру және банкроттығы жөніндегі мемлекеттік басқару саласындағы басшылықты жүзеге асыратын уәкілетті органның қаржы басқарушысына сыйақы төлеу қағидаларын бекіту туралы
