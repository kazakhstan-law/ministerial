title:
  rus: Об утверждении Правил доставки автомобильного транспортного средства и находящихся в нем товаров в место хранения, осуществляемой лицом, управляющим автомобильным транспортным средством, в сопровождении должностных лиц органов государственных доходов и перевозки (транспортировки) задержанных автомобильных транспортных средств и находящихся в нем товаров в место хранения
  kaz: Мемлекеттік кірістер органы лауазымды адамдарының сүйемелдеуімен автомобиль көлік құралын басқаратын адам жүзеге асыратын автомобиль көлік құралын және ондағы тауарларды сақтау орнына жеткізу және ұсталған автомобиль көлік құралдарын және ондағы тауарларды сақтау орнына тасу (тасымалдау) қағидаларын бекіту туралы
