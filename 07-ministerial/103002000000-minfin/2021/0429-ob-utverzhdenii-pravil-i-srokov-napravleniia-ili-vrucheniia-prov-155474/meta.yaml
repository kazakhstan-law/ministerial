title:
  rus: Об утверждении Правил и сроков направления или вручения проверяемому лицу предварительного акта камеральной таможенной проверки, представления проверяемым лицом письменного возражения к предварительному акту камеральной таможенной проверки, а также рассмотрения такого возражения
  kaz: Тексерілетін тұлғаға камералдық кедендік тексерудің алдын ала актісін жіберу немесе табыс ету, тексерілетін тұлғаның камералдық кедендік тексерудің алдын ала актісіне жазбаша қарсылық ұсыну, сондай-ақ мұндай қарсылықты қарау қағидалары мен мерзімдерін бекіту туралы
