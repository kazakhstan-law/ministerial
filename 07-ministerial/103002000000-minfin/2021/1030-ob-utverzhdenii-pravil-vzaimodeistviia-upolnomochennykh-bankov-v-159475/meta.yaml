act_code: '159475'
requisite: Приказ и.о. Министра финансов Республики Казахстан от 30 октября 2021 года № 1125. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 октября 2021 года № 24975. Утратил силу приказом Министра финансов Республики Казахстан от 12 ноября 2025 года № 696 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил взаимодействия уполномоченных банков второго уровня, организаций, осуществляющих отдельные виды банковских операций, операторов электронных площадок с органами государственных доходов для целей передачи сведений по операциям в специальное мобильное приложение
  kaz: Уәкілеттік берілген екінші деңгейдегі банктердің, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың, электрондық алаң операторларының арнаулы мобильді қосымшаға операциялар бойынша мәліметтерді беру мақсаттары үшін мемлекеттік кірістер органдарымен өзара іс-қимыл жасау қағидаларын бекіту туралы
