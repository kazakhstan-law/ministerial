title:
  rus: Об утверждении Типовых правил проведения внешнего контроля качества аудиторских организаций, в том числе критериев проверок аудиторских и профессиональных организаций
  kaz: Аудиторлық ұйымдардың сапасына сыртқы бақылау жүргізудің үлгілік қағидаларын, оның ішінде аудиторлық және кәсіби ұйымдарды тексеру өлшемшарттарын бекіту туралы
