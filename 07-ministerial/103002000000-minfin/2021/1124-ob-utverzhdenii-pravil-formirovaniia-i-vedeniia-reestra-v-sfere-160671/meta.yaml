  kaz: Ұлттық әл-ауқат қоры мен Ұлттық әл-ауқат қоры ұйымдарын қоспағанда, квазимемлекеттік сектордың жекелеген субъектілерінің сатып алуы саласында тізілімін қалыптастыру және жүргізу қағидаларын бекіту туралы
