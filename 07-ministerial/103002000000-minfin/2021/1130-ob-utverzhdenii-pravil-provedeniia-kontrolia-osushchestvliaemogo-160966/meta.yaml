title:
  rus: Об утверждении Правил проведения контроля, осуществляемого централизованной службой по контролю за закупками, за исключением централизованной службы по контролю за закупками Фонда национального благосостояния
  kaz: Ұлттық әл-ауқат қорының сатып алуын бақылау жөніндегі орталықтандырылған қызметті қоспағанда, сатып алуды бақылау жөніндегі орталықтандырылған қызмет жүзеге асыратын бақылауды жүргізу қағидаларын бекіту туралы
