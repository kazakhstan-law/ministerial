  title:
    rus: О внесении дополнений в приказ Министра финансов Республики Казахстан от 30 ноября 2021 года № 1252 «Об утверждении Правил проведения контроля, осуществляемого централизованной службой по контролю за закупками, за исключением централизованной службы по контролю за закупками Фонда национального благосостояния»
    kaz: «Ұлттық әл-ауқат қорының сатып алуын бақылау жөніндегі орталықтандырылған қызметті қоспағанда, сатып алуды бақылау жөніндегі орталықтандырылған қызмет жүзеге асыратын бақылауды жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2021 жылғы 30 қарашадағы № 1252 бұйрығына толықтырулар енгізу туралы
