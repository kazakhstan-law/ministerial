title:
  rus: Об утверждении Правил и сроков направления или вручения проверяемому лицу предварительного акта  выездной таможенной проверки, представления проверяемым лицом письменного возражения к предварительному акту выездной таможенной проверки и рассмотрения такого возражения
  kaz: Тексерілетін тұлғаға көшпелі кедендік тексерудің алдын ала актісін жіберу немесе табыс ету, тексерілетін тұлғаның көшпелі кедендік тексерудің алдын ала актісіне жазбаша қарсылық ұсыну және мұндай қарсылықты қарау қағидалары мен мерзімдерін бекіту туралы
