act_code: '156401'
requisite: Приказ Министра финансов Республики Казахстан от 31 марта 2021 года № 283
title:
  rus: Об утверждении Правил взаимодействия Министерства финансов Республики Казахстан с уполномоченными государственными органами и Национальной палатой предпринимателей Республики Казахстан в целях ведения информационной системы для самостоятельной проверки налогоплательщиком контрагентов на основе индексов, а также методики расчета индексов для самостоятельной проверки налогоплательщиком контрагентов
  kaz: Қазақстан Республикасы Қаржы министрлігінің уәкілетті мемлекеттік органдармен және Қазақстан Республикасының Ұлттық кәсіпкерлер палатасымен салық төлеушінің контрагенттерді индекстер негізінде дербес тексеруі үшін ақпараттық жүйені жүргізу мақсатында өзара іс-қимыл жасау қағидаларын, сондай-ақ салық төлеушінің контрагенттерді дербес тексеруі үшін индекстерді есептеу әдістемесін бекіту туралы
