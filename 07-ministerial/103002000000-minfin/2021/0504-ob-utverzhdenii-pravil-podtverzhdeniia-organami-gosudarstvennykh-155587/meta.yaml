act_code: '155587'
requisite: Приказ Министра финансов Республики Казахстан от 4 мая 2021 года № 425. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 мая 2021 года № 22690. Утратил силу приказом Министра финансов Республики Казахстан от 28 октября 2025 года № 628 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил подтверждения органами государственных доходов факта уплаты налога на добавленную стоимость по импортированным товарам и акциза по импортированным подакцизным товарам с территории государств-членов Евразийского экономического союза в заявлении о ввозе товаров и уплате косвенных налогов путем проставления соответствующей отметки либо мотивированного отказа в подтверждении, а также случаи подтверждения органами государственных доходов факта уплаты налога на добавленную стоимость по импортированным товарам либо мотивированного отказа в подтверждении
  kaz: Мемлекеттік кірістер органдарының Еуразиялық экономикалық одаққа мүше мемлекеттердің аумағынан тауарларды әкелу және жанама салықтарды төлеу туралы өтініште импортталған акцизделетін тауарлар бойынша акциздің және импортталған тауарлар бойынша қосылған құн салығын төлеу фактісін тиісті белгі қою арқылы растауы не растаудан уәжді бас тартуы қағидаларын, сондай-ақ мемлекеттік кірістер органдарының импортталған тауарлар бойынша қосылған құн салығын төлеу фактісін растауы не растаудан уәжді бас тартуы жағдайларын бекіту туралы
