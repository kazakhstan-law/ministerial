requisite: Приказ Министра финансов Республики Казахстан от 9 апреля 2021 года № 320. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 апреля 2021 года № 22524. Действовал до 31 декабря 2022 года в соответствии с пунктом 3 настоящего приказа
title:
  rus: Об утверждении Правил осуществления государственных закупок при реализации (внедрении) пилотных проектов по строительству объектов в отраслях здравоохранения, образования и жилищного строительства, являющихся технически не сложными, строительство которых предполагается по типовым проектам, типовым проектным решениям и проектам повторного применения
  kaz: Техникалық жағынан күрделі емес болып табылатын, үлгілік жобалар, үлгілік жобалық шешімдер және қайта қолданылатын жобалар бойынша құрылысы болжанатын денсаулық сақтау, білім беру және тұрғын үй құрылысы салаларындағы объектілерді салу жөніндегі пилоттық жобаларды іске асыру (енгізу) кезінде мемлекеттік сатып алуды жүзеге асыру қағидаларын бекіту туралы
