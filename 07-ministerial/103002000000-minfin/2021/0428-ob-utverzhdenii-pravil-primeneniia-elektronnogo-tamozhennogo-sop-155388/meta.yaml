act_code: '155388'
requisite: Приказ Министра финансов Республики Казахстан от 28 апреля 2021 года № 407. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 апреля 2021 года № 22649
title:
  rus: Об утверждении Правил применения электронного таможенного сопровождения транспортных средств, а также взаимодействия органов государственных доходов, декларанта, национального оператора информационной системы отслеживания перевозок и перевозчика при электронном таможенном сопровождении транспортных средств, осуществления взаимодействия (включая информационное) между национальным оператором информационной системы отслеживания перевозок и уполномоченным органом в сфере таможенного дела при отслеживании перевозок с использованием навигационных пломб
  kaz: Көлік құралдарын электрондық кедендік алып жүруді қолдану, сондай-ақ мемлекеттік кірістер органдарының, декларанттың, тасымалдарды қадағалау ақпараттық жүйесінің ұлттық операторының және тасымалдаушының көлік құралдарын электрондық кедендік алып жүру кезінде өзара іс-қимыл жасау, тасымалдарды қадағалаудың ақпараттық жүйесінің ұлттық операторы мен кеден ісі саласындағы уәкілетті орган арасындағы навигациялық пломбаларды пайдаланып тасымалдарды қадағалау кезіндегі өзара іс-қимылды (ақпараттық іс-қимылды қоса алғанда) жүзеге асыру қағидаларын бекіту туралы
