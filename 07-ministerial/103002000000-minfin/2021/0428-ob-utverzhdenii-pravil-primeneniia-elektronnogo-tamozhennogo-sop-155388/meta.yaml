  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 28 апреля 2021 года № 407 «Об утверждении Правил применения электронного таможенного сопровождения транспортных средств, а также взаимодействия органов государственных доходов, декларанта, национального оператора информационной системы отслеживания международных автомобильных перевозок и перевозчика при электронном таможенном сопровождении транспортных средств»
    kaz: «Көлік құралдарын электрондық кедендік алып жүруді қолдану, сондай-ақ мемлекеттік кірістер органдарының, декларанттың, халықаралық автомобиль тасымалдарын қадағалау ақпараттық жүйесінің ұлттық операторының және тасымалдаушының көлік құралдарын электрондық кедендік алып жүру кезінде өзара іс-қимыл жасау қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2021 жылғы 28 сәуірдегі № 407 бұйрығына өзгерістер енгізу туралы
