act_code: '152827'
requisite: Приказ Министра финансов Республики Казахстан от 3 февраля 2021 года № 75. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 февраля 2021 года № 22197. Утратил силу приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил списания суммы недоимки по сбору с аукционов, числящейся в лицевых счетах частных судебных исполнителей по состоянию на 1 января 2021 года, до 1 января 2023 года, а также суммы пени, начисленной на сумму такой недоимки
  kaz: 2021 жылғы 1 қаңтардағы жағдай бойынша, 2023 жылғы 1 қаңтарға дейін жеке сот орындаушыларының дербес шоттарындағы аукциондардан алым бойынша бересі сомасын, сондай-ақ осындай бересі сомасына есептелген өсімпұл сомасын есептен шығару қағидаларын бекіту туралы
