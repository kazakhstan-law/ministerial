act_code: '155801'
requisite: Приказ Министра финансов Республики Казахстан от 11 мая 2021 года № 444. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 мая 2021 года № 22738. Утратил силу приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил, сроков и форм представления уполномоченным государственным органом, уполномоченным Правительством Республики Казахстан на заключение соглашения об инвестициях, сведений о заключенных соглашениях об инвестициях и расторжении таких соглашений, а также иных сведений
  kaz: Қазақстан Республикасының Үкіметі инвестициялар туралы келісім жасасуға уәкілеттік берген уәкілетті мемлекеттік органның инвестициялар туралы жасалған келісімдер және осындай келісімдерді бұзу туралы мәліметтерді, сондай-ақ өзге де мәліметтерді ұсыну қағидаларын, мерзімдері мен нысандарын бекіту туралы
