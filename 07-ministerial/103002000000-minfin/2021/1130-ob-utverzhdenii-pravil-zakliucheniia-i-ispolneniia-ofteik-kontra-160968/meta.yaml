act_code: '160968'
requisite: Приказ Министра финансов Республики Казахстан от 30 ноября 2021 года № 1254. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 декабря 2021 года № 25490. Утратил силу приказом Министра финансов Республики Казахстан от 16 марта 2022 года № 286 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил заключения и исполнения офтейк-контракта для отдельных субъектов квазигосударственного сектора, за исключением Фонда национального благосостояния и организаций Фонда национального благосостояния
  kaz: Ұлттық әл-ауқат қорын және Ұлттық әл-ауқат қорының ұйымдарын қоспағанда, квазимемлекеттік сектордың жекелеген субъектілері үшін офтейк-келісімшартты жасасу және орындау қағидаларын бекіту туралы
