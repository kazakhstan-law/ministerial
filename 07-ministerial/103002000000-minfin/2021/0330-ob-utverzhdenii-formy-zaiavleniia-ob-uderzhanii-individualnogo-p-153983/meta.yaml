requisite: Приказ Министра финансов Республики Казахстан от 30 марта 2021 года № 273. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 марта 2021 года № 22434. Утратил силу приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении формы заявления об удержании индивидуального подоходного налога с единовременной пенсионной выплаты в соответствии с законодательством Республики Казахстан о социальной защите
  kaz: Қазақстан Республикасының әлеуметтік қорғау туралы заңнамасына сәйкес біржолғы зейнетақы төлемінен жеке табыс салығын ұстап қалу туралы өтініштің нысанын бекіту туралы
