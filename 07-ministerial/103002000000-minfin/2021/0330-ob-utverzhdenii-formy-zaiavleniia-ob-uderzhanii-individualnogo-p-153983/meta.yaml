  requisite: Приказ Министра финансов Республики Казахстан от 29 февраля 2024 года № 115. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 марта 2024 года № 34096. Утратил силу приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 30 марта 2021 года № 273 «Об утверждении формы заявления об удержании индивидуального подоходного налога с единовременной пенсионной выплаты в соответствии с законодательством Республики Казахстан о пенсионном обеспечении»
    kaz: «Қазақстан Республикасының зейнетақымен қамсыздандыру туралы заңнамасына сәйкес біржолғы зейнетақы төлемінен жеке табыс салығын ұстап қалу туралы өтініштің нысанын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2021 жылғы 30 наурыздағы № 273 бұйрығына өзгерістер енгізу туралы
