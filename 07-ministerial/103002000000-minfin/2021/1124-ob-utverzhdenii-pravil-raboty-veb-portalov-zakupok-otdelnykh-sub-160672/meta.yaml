title:
  rus: Об утверждении Правил работы веб-порталов закупок отдельных субъектов квазигосударственного сектора, за исключением Фонда национального благосостояния и организаций Фонда национального благосостояния, в том числе в случае возникновения технических сбоев в работе веб-порталов
  kaz: Ұлттық әл-ауқат қорын және Ұлттық әл-ауқат қорының ұйымдарын қоспағанда, квазимемлекеттік сектордың жекелеген субъектілерінің сатып алу веб-порталдарының жұмыс істеу, оның ішінде веб-порталдар жұмысында техникалық іркілістер туындаған жағдайда жұмыс істеу қағидаларын бекіту туралы
