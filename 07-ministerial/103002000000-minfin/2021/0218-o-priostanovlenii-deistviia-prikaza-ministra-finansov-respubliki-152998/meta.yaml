act_code: '152998'
requisite: Приказ Министра финансов Республики Казахстан от 18 февраля 2021 года № 120. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2021 года № 22241. Утратил силу приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: О приостановлении действия приказа Министра финансов Республики Казахстан от 1 февраля 2018 года № 102 «Об утверждении форм заявления физического лица о применении налоговых вычетов и справки о расчетах с физическим лицом»
  kaz: «Жеке тұлғаның салықтық шегерімдерді қолдану туралы өтінішінің және жеке тұлғамен есеп айырысулар туралы анықтаманың нысандарын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 1 ақпандағы № 102 бұйрығының қолданылуын тоқтата тұру туралы
