act_code: '157362'
requisite: Приказ и.о. Министра финансов Республики Казахстан от 27 июля 2021 года № 726. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 июля 2021 года № 23745
title:
  rus: О признании утратившим силу приказа Министра финансов Республики Казахстан от 15 февраля 2018 года № 199 «Об утверждении Правил представления сведений об инвестиционных контрактах, заключенных в соответствии с законодательством Республики Казахстан в сфере предпринимательства и предусматривающих реализацию инвестиционных приоритетных проектов, а также сведений о прекращении действия данных инвестиционных контрактов и иных сведений и их формы»
  kaz: «Қазақстан Республикасының кәсіпкерлік саласындағы заңнамасына сәйкес жасалған және инвестициялық басым жобаларды іске асыруды көздейтін инвестициялық келісімшарттар туралы мәліметтерді, сондай-ақ осы инвестициялық келісімшарттардың қолданысын тоқтату туралы мәліметтерді және өзге де мәліметтерді беру қағидаларын және олардың нысанын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 15 ақпандағы № 199 бұйрығының күшін жою туралы
