title:
  rus: Об утверждении Единой методики ввода данных объектов учета в реестр государственного имущества, а также проведения инвентаризации, паспортизации и переоценки государственного имущества
  kaz: Мемлекеттiк мүлiк тiзiлiмiне есепке алу объектiлерi деректерiн енгiзудің, сондай-ақ мемлекеттiк мүлiкке түгендеу, паспорттау және қайта бағалау жүргiзудің бірыңғай әдістемесін бекіту туралы
