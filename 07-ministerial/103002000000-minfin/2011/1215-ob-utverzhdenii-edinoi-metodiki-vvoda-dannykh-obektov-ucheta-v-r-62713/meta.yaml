  title:
    rus: О внесении изменений в приказы Министра финансов Республики Казахстан от 8 июля 2010 года № 325 "Об утверждении форм и правил составления и представления финансовой отчетности" и от 15 декабря 2011 года № 636 "Об утверждении Единой методики и формата ввода данных объектов учета в реестр государственного имущества, а также проведение инвентаризации, паспортизации и переоценки государственного имущества в единые сроки"
    kaz: Қазақстан Республикасы Қаржы Министрінің "Қаржылық есептілік нысандарын және оларды жасау мен ұсыну қағидаларын бекіту туралы" 2010 жылғы 8 шілдедегі № 325 және "Мемлекеттiк мүлiк тiзiлiмiне есепке алу объектiлерi деректерiн енгiзу пішімін, сондай-ақ бірдей мерзімдерде мемлекеттiк мүлiкке түгендеу, паспорттау және қайта бағалау жүргiзудің бірыңғай әдістемесін бекіту туралы" 2011 жылғы 15 желтоқсандағы № 636 бұйрықтарына өзгерістер енгізу туралы
