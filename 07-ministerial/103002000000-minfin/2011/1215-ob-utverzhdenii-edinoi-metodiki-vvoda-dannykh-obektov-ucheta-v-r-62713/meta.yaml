  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 15 декабря 2011 года № 636 "Об утверждении Единой методики и формата ввода данных объектов учета в реестр государственного имущества, а также проведение инвентаризации, паспортизации и переоценки государственного имущества в единые сроки"
    kaz: '"Мемлекеттік мүлік тізіліміне есепке алу объектілері деректерін енгізу пішімін, сондай-ақ бірдей мерзімдерде мемлекеттік мүлікке түгендеу, паспорттау және қайта бағалау жүргізудің бірыңғай әдістемесін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2011 жылғы 15 желтоқсандағы № 636 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
