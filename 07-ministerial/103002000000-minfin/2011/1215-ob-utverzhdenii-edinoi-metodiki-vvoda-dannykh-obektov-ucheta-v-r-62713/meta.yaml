  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 15 декабря 2011 года № 636 "Об утверждении Единой методики и формата ввода данных объектов учета в реестр государственного имущества, а также проведение инвентаризации, паспортизации и переоценки государственного имущества в единые сроки"
    kaz: '"Мемлекеттiк мүлiк тiзiлiмiне есепке алу объектiлерi деректерiн енгiзу пішімін, сондай-ақ бірдей мерзімдерде мемлекеттiк мүлiкке түгендеу, паспорттау және қайта бағалау жүргiзудің бірыңғай әдістемесін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2011 жылғы 15 желтоқсандағы № 636 бұйрығына өзгерістер енгізу туралы'
