act_code: '62714'
requisite: Приказ Министра финансов Республики Казахстан от 13 декабря 2011 года № 628. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 января 2012 года № 7377. Утратил силу приказом Министра финансов Республики Казахстан от 8 февраля 2013 года № 68
title:
  rus: Об утверждении Регламента государственной услуги "Регистрация лиц, имеющих право осуществлять деятельность реабилитационного и (или) конкурсного управляющих и (или) администратора внешнего наблюдения, и снятие их с регистрации"
  kaz: '"Оңалтушы және (немесе) конкурстық басқарушылардың және (немесе) сыртқы байқау әкімшісінің қызметін жүзеге асыруға құқығы бар тұлғаларды тіркеу және оларды тіркеуден алу" мемлекеттік қызметінің регламентін бекіту туралы'
