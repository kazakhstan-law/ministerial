title:
  rus: ИНСТРУКЦИЯ N 33 "О порядке исчисления и уплаты в бюджет подоходного налога с юридических лиц"
  kaz: Заңды тұлғалардан алынатын табыс салығын есептеу және бюджетке төлеу туралы Нұсқаулық N 33
