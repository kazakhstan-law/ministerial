  requisite: Приказ Министра государственных доходов Республики Казахстан от 26 мая 2001 года N 667. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 июля 2001 года N 1582.       Утратил силу - приказом Министра государственных доходов РК от 9 апреля 2002 года № 416
  title:
    rus: Об утверждении Изменений и дополнений в Инструкцию Главной налоговой инспекции Министерства финансов Республики Казахстан N 33 "О порядке исчисления и уплаты в бюджет подоходного налога с юридических лиц", утвержденную приказом Министра финансов Республики Казахстан от 28 июня 1995 года N 161 и утверждении Инструкции "О порядке исчисления и уплаты в бюджет подоходного налога страховыми (перестраховыми) организациями"
    kaz: Қазақстан Республикасы Қаржы министрінің 1995 жылғы 28 маусымдағы N 161 бұйрығымен бекітілген "Заңды тұлғаларға табыс салығын есептеу мен бюджетке төлеу тәртібі туралы" Қазақстан Республикасы Қаржы министрлігі Бас салық инспекциясының N 33 Нұсқаулығына өзгерістер мен толықтырулар енгізуді және "Сақтандыру (қайта сақтандыру) ұйымдарымен заңды тұлғаларға табыс салығын есептеу мен бюджетке төлеу тәртібі туралы" Нұсқаулықты бекіту туралы
  link: https://zan.gov.kz/client/#!/doc/9602/rus
