  title:
    rus: Об утверждении изменений и дополнений в Инструкцию Главной налоговой инспекции Министерства финансов Республики Казахстан N 33 "О порядке исчисления и уплаты в бюджет подоходного налога с юридических лиц", утвержденную приказом Министра финансов Республики Казахстан от 28 июня 1995 года N 161
    kaz: Қазақстан Республикасы Қаржы министрiнің 1995 жылғы 28 маусымдағы N 161 бұйрығымен бекiтiлген "Заңды тұлғаларға табыс салығын бюджетке төлеу мен есептеу тәртiбi туралы" Қазақстан Республикасы Қаржы министрлiгi Бас салық инспекциясының N 33 Нұсқаулығына өзгерiстер мен толықтырулар енгiзудi бекiту туралы
