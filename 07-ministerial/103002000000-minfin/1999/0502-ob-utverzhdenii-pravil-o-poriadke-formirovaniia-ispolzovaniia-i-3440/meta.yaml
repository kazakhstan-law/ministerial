  title:
    rus: О внесении дополнений в приказ Министра финансов Республики Казахстан от 3 мая 1999 года N 177 "Об утверждении Правил о порядке формирования, использования и учета средств, получаемых от реализации платных услуг, от спонсорской и благотворительной помощи, депозитных сумм и страховых возмещений государственных учреждений"
    kaz: '"Ақылы қызмет көрсетуді іске асырудан, демеушілік және қайырымдылық көмек көрсетуден алынатын қаражаттарды, мемлекеттік мекемелердің депозиттік сомалары мен сақтандыру өтеулерін қалыптастыру, пайдалану және есепке алу тәртібі туралы қағиданы бекіту туралы" Қазақстан Республикасы Қаржы министрінің 1999 жылғы 3 мамырдағы N 177 бұйрығына толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/12801/rus
