  title:
    rus: О внесении дополнения в приказ Министра финансов Республики Казахстан от 3 мая 1999 года N 177 "Об утверждении Правил о порядке формирования, использования и учета средств, получаемых от реализации платных услуг, от спонсорской и благотворительной помощи, депозитных сумм и страховых возмещений государственных учреждений"
    kaz: '"Ақылы қызмет көрсетуді іске асырудан, демеушілік және қайырымдылық көмек көрсетуден алынатын қаражаттарды, мемлекеттiк мекемелердiң депозиттiк сомалары мен сақтандыру өтеулерiн қалыптастыру, пайдалану және есепке алу тәртiбi туралы қағиданы бекiту туралы" Қазақстан Республикасы Қаржы министрлігінің 1999 жылғы 3 мамырдағы N 177 бұйрығына толықтырулар енгiзу туралы'
  link: https://zan.gov.kz/client/#!/doc/10755/rus
