  title:
    rus: О внесении изменения в приказ Министерства финансов Республики Казахстан от 3 мая 1999 года N 177 "Об утверждении Правил о порядке формирования, использования и учета средств, получаемых от реализации платных услуг, от спонсорской и благотворительной помощи, депозитных сумм и страховых выплат государственных учреждений", зарегистрированный за N 771
    kaz: N 771 тіркелген "Ақылы қызмет көрсетуді іске асырудан, демеушілік және қайырымдылық көмек көрсетуден алынатын қаражаттарды, мемлекеттік мекемелердің депозиттік сомалары мен сақтандыру төлемдерін қалыптастыру, пайдалану және есепке алу тәртібі туралы қағиданы бекіту туралы" Қазақстан Республикасы Қаржы министрілігінің 1999 жылғы 3 мамырдағы N 177 бұйрығына өзгеріс енгізу туралы
