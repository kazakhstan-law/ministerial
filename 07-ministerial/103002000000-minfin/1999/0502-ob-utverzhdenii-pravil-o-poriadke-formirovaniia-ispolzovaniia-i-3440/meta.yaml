title:
  rus: Об утверждении Правил о порядке формирования, использования и учета средств, получаемых от реализации платных услуг, от спонсорской и благотворительной помощи, депозитных сумм и страховых выплат государственных учреждений
  kaz: Ақылы қызмет көрсетуді іске асырудан, демеушілік және қайырымдылық көмек көрсетуден алынатын қаражаттарды, мемлекеттік мекемелердің депозиттік сомалары мен сақтандыру төлемдерiн қалыптастыру, пайдалану және есепке алу тәртібі туралы қағиданы бекіту туралы
