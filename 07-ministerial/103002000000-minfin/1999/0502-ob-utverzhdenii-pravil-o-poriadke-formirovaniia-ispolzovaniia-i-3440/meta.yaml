  code: '16396'
  requisite: Приказ Министра финансов Республики Казахстан от 4 июля 2003 года № 254. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 июля 2003 года № 2414. Утратил силу - приказом Министра финансов Республики Казахстан от 12 марта 2005 года № 78
  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 3 мая 1999 года N 177 "Об утверждении Правил о порядке формирования, использования и учета средств, получаемых от реализации платных услуг, от спонсорской и благотворительной помощи, депозитных сумм и страховых выплат государственных учреждений", зарегистрированный в Министерстве юстиции Республики Казахстан за N 771
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде N 771 болып тiркелген "Ақылы қызмет көрсетудi iске асырудан, демеушiлiк және қайырымдылық көмек көрсетуден алынатын қаражаттарды, мемлекеттiк мекемелердiң депозиттiк сомалары мен сақтандыру төлемдерiн қалыптастыру, пайдалану және есепке алу тәртiбi туралы қағиданы бекiту туралы" Қазақстан Республикасы Қаржы министрiнiң 1999 жылғы 3 мамырдағы N 177 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы
  link: https://zan.gov.kz/client/#!/doc/16396/rus
