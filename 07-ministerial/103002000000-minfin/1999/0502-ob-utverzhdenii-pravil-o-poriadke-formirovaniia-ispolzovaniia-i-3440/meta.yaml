  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 3 мая 1999 года N 177 "Об утверждении Правил о порядке формирования, использования и учета средств, получаемых от реализации платных услуг, от спонсорской и благотворительной помощи депозитных сумм и страховых выплат государственных учреждений", зарегистрированного в Министерстве юстиции Республики Казахстан 27 мая 1999 г. N 771
    kaz: Қазақстан Республикасының Әділет Министрлігінде 1999 жылғы 27 маусымда N 771 тіркелген "Ақылы қызмет көрсетуді іске асырудан, демеушілік және қайырымдылық көмек көрсетуден алынатын қаражаттарды, мемлекеттік мекемелердің депозиттік сомалары мен сақтандыру төлемдерін қалыптастыру, пайдалану және есепке алу тәртібі туралы ережені бекіту жөніндегі" Қазақстан Республикасы Қаржы министрінің 1999 жылғы 3 мамырдағы N 177 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/13587/rus
