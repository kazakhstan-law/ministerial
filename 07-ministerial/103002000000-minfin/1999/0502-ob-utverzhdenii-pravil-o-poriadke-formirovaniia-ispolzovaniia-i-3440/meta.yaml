  requisite: Приказ Министра финансов Республики Казахстан от 4 декабря 2003 года N 417. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 декабря 2003 года N 2620. Утратил силу - приказом Министра финансов РК от 12 марта 2005 года N 78 (V053497) (действует до 1 января 2006 года)
  title:
    rus: О внесении изменения и дополнений в приказ Министра финансов Республики Казахстан от 3 мая 1999 года N 177 "Об утверждении Правил о порядке формирования, использования и учета средств, получаемых от реализации платных услуг, от спонсорской и благотворительной помощи, депозитных сумм и страховых выплат государственных учреждений", зарегистрированный в Министерстве юстиции Республики Казахстан за N 771
    kaz: Қазақстан Республикасының Әділет министрлігінде N 771 тіркелген "Ақылы қызмет көрсетуді іске асырудан, демеушілік және қайырымдылық көмек көрсетуден алынатын қаражаттарды, мемлекеттік мекемелердің депозиттік сомалары мен сақтандыру төлемдерiн қалыптастыру, пайдалану және есепке алу тәртібі туралы қағиданы бекіту туралы" Қазақстан Республикасы Қаржы министрлігінің 1999 жылғы 3 мамырдағы N 177 бұйрығына өзгеріс пен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/17808/rus
