  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 12 февраля 2018 года № 168 «Об утверждении образцов форменной одежды, перечня работников органов государственных доходов, имеющих право ношения форменной одежды, натуральных норм обеспечения ею и знаков различия, а также Правил ее ношения»
    kaz: «Нысанды киімнің үлгілерін, нысанды киім киюге құқығы бар мемлекеттік кірістер органдары жұмыскерлерінің тізбесін, онымен қамтамасыз етудің заттай нормаларын және айырым белгілерін, сондай-ақ оны тағып жүру қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 12 ақпандағы № 168 бұйрығына өзгерістер мен толықтырулар енгізу туралы
