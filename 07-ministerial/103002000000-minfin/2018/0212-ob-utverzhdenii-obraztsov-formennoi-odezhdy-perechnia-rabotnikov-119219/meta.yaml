title:
  rus: Об утверждении образцов форменной одежды, перечня работников органов государственных доходов, имеющих право ношения форменной одежды, натуральных норм обеспечения ею и знаков различия, а также Правил ее ношения
  kaz: Нысанды киімнің үлгілерін, нысанды киім киюге құқығы бар мемлекеттік кірістер органдары жұмыскерлерінің тізбесін, онымен қамтамасыз етудің заттай нормаларын және айырым белгілерін, сондай - ақ оны тағып жүру қағидаларын бекіту туралы
