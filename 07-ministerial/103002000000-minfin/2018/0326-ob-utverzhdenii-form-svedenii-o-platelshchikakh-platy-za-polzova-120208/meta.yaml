act_code: '120208'
requisite: Приказ Министра финансов Республики Казахстан от 26 марта 2018 года № 404. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 марта 2018 года № 16707.  Утратил силу приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении форм сведений о плательщиках платы за пользование водными ресурсами поверхностных источников и объектах обложения, их месте нахождения, выданных разрешениях на специальное водопользование, установленных лимитах водопользования, изменениях, внесенных в разрешения и лимиты водопользования, о результатах проверок по соблюдению водного законодательства Республики Казахстан, судебных решениях по обжалованию результатов проверок по соблюдению водного законодательства Республики Казахстан, о плательщиках платы за пользование животным миром и объектах обложения, о плательщиках платы за пользование лесными ресурсами и объектах обложения, о плательщиках платы за пользование растительными и лесными ресурсами при принятии решения об изъятии редких и находящихся под угрозой исчезновения видов растений из природной среды, их частей или дериватов и объектах обложения, о плательщиках платы за пользование растительными ресурсами и объектах обложения
  kaz: Жерүсті көздерінің су ресурстарын пайдаланғаны үшін төлемақы төлеушілер және салық салу объектілері, олардың орналасқан жері, арнайы су пайдалануға берілген рұқсаттар, су пайдаланудың белгіленген лимиттері, су пайдаланудың рұқсаттары мен лимиттеріне енгізілген өзгерістер туралы, Қазақстан Республикасының су заңнамасының сақталуын тексерулер нәтижелері, Қазақстан Республикасының су заңнамасының сақталуын тексерулер нәтижелеріне шағым жасау бойынша сот шешімдері туралы, жануарлар дүниесін пайдаланғаны үшін төлемақы төлеушілер мен салық салу объектілері туралы, орман ресурстарын пайдаланғаны үшін төлемақы төлеушілер мен салық салу объектілері туралы, табиғи ортадан өсімдіктердің сирек кездесетін және жойылып кету қаупi төнген түрлерін, олардың бөліктерін немесе дериваттарын алып қою туралы шешім қабылданған кезде өсімдік және орман ресурстарын пайдаланғаны үшін төлемақы төлеушілер мен салық салу объектілері туралы, өсімдік ресурстарын пайдаланғаны үшін төлемақы төлеушілер мен салық салу объектілері туралы мәліметтер нысандарын бекіту туралы
