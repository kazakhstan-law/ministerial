  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 26 марта 2018 года № 404 «Об утверждении форм сведений о плательщиках платы за пользование водными ресурсами поверхностных источников и объектах обложения, их месте нахождения, выданных разрешениях на специальное водопользование, установленных лимитах водопользования, изменениях, внесенных в разрешения и лимиты водопользования, о результатах проверок по соблюдению водного законодательства Республики Казахстан, судебных решениях по обжалованию результатов проверок по соблюдению водного законодательства Республики Казахстан, о плательщиках платы за пользование животным миром и объектах обложения, о плательщиках платы за лесные пользования и объектах обложения, о плательщиках платы за лесные пользования при принятии решения об изъятии редких и находящихся под угрозой исчезновения видов растений из природной среды, их частей или дериватов и объектах обложения, о плательщиках платы за использование особо охраняемых природных территорий и объектах обложения, о плательщиках платы за пользование растительными ресурсами и объектах обложения»
    kaz: «Жерүсті көздерінің су ресурстарын пайдаланғаны үшін төлемақы төлеушілер және салық салу объектілері, олардың орналасқан жері, арнайы су пайдалануға берілген рұқсаттар, су пайдаланудың белгіленген лимиттері, су пайдаланудың рұқсаттары мен лимиттеріне енгізілген өзгерістер туралы, Қазақстан Республикасының су заңнамасының сақталуын тексерулер нәтижелері, Қазақстан Республикасының су заңнамасының сақталуын тексерулер нәтижелеріне шағым жасау бойынша сот шешімдері туралы, жануарлар дүниесін пайдаланғаны үшін төлемақы төлеушілер мен салық салу объектілері туралы, орманды пайдаланғаны үшін төлемақы төлеушілер мен салық салу объектілері туралы, табиғи ортадан өсімдіктердің сирек кездесетін және жойылып кету қаупi төнген түрлерін, олардың бөліктерін немесе дериваттарын алып қою туралы шешім қабылданған кезде орманды пайдаланғаны үшін төлемақы төлеушілер және салық салу объектілері туралы, ерекше қорғалатын табиғи аумақтарды пайдаланғаны үшін төлемақы төлеушілер және салық салу объектілері туралы, өсімдік ресурстарын пайдаланғаны үшін төлемақы төлеушілер және салық салу объектілері туралы мәліметтер нысандарын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 26 наурыздағы № 404 бұйрығына өзгерістер енгізу туралы
