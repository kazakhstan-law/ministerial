act_code: '119456'
requisite: Приказ Министра финансов Республики Казахстан от 16 февраля 2018 года № 225. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 марта 2018 года № 16560
title:
  rus: Об утверждении Особенностей предъявления условно выпущенных товаров либо подтверждения места их нахождения при проведении таможенного контроля после выпуска товаров для подтверждения соблюдения целей и условий предоставления льгот по уплате ввозных таможенных пошлин, налогов и (или) ограничений по пользованию и (или) распоряжению этими товарами в связи с применением льгот по уплате ввозных таможенных пошлин, налогов, а также периодичности проведения и иных требований к проведению таможенного контроля после выпуска товаров в отношении условно выпущенных товаров
  kaz: Шартты түрде шығарылған тауарларды ұсынудың не кедендік әкелу баждарын, салықтарды төлеу бойынша жеңілдіктер берудің мақсаты мен шарттарын және (немесе) кедендік әкелу баждарын, салықтарды төлеу бойынша жеңілдіктерді қолданумен байланысты осы тауарларды пайдалану және (немесе) билік ету бойынша шектеулерді сақтауды растау үшін тауарлар шығарылғаннан кейін кедендік бақылау жүргізу кезінде олардың тұрған жерін растау ерекшелігін, сондай-ақ тауарлар шығарылғаннан кейін шартты түрде шығарылған тауарларға қатысты кедендік бақылау жүргізу мерзімділігін және жүргізуге қойылатын өзге де талаптарды бекіту туралы
