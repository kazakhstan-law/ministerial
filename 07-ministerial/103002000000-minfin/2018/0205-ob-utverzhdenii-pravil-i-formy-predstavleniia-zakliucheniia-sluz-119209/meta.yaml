  requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 31 октября 2019 года № 1198. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 октября 2019 года № 19539.  Утратил силу приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 5 февраля 2018 года № 122 «Об утверждении Правил и формы представления заключения должностного лица уполномоченного органа в сфере гражданской авиации, участвующего в проведении тематической проверки по подтверждению достоверности сумм налога на добавленную стоимость, предъявленных к возврату, подтверждающего факт осуществления рейса воздушным судном иностранной авиакомпании и количество реализованных горюче-смазочных материалов (в разрезе авиакомпаний)»
    kaz: «Қайтаруға ұсынылған қосылған құн салығы сомаларының анықтығын растау бойынша тақырыптық тексеру жүргiзуге қатысатын азаматтық авиация саласындағы уәкiлеттi органның лауазымды адамының шетелдiк авиакомпания әуе кемесiнiң рейстi жүзеге асыру фактiсiн және өткiзiлген жанар-жағармай материалдарының (авиакомпаниялар бөлінісінде) мөлшерi фактісінің анықтығын растайтын қорытындыны табыс ету қағидалары мен нысанын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 5 ақпандағы № 122 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/135689/rus
