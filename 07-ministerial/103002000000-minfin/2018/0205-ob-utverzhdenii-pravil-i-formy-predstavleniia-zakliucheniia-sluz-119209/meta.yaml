act_code: '119209'
requisite: Приказ Министра финансов Республики Казахстан от 5 февраля 2018 года № 122. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 марта 2018 года № 16461. Утратил силу  приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил и формы представления заключения служащего уполномоченной организации в сфере гражданской авиации, участвующего в проведении тематической проверки по подтверждению достоверности сумм налога на добавленную стоимость, предъявленных к возврату, подтверждающего факт осуществления рейса воздушным судном иностранной авиакомпании и количество реализованных горюче-смазочных материалов (в разрезе авиакомпаний)
  kaz: Қайтаруға ұсынылған қосылған құн салығы сомаларының анықтығын растау бойынша тақырыптық тексеру жүргiзуге қатысатын азаматтық авиация саласындағы уәкiлеттi ұйым қызметшісінің шетелдiк авиакомпания әуе кемесiнiң рейстi жүзеге асыру фактiсiн және өткiзiлген жанар-жағармай материалдарының (авиакомпаниялар бөлінісінде) мөлшерi фактісінің анықтығын растайтын қорытындыны табыс ету қағидалары мен нысанын бекіту туралы
