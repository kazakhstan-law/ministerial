title:
  rus: О признании утратившим силу приказа Министра финансов Республики Казахстан от 20 марта 2015 года № 197 «Об утверждении формы заявления об изменении срока уплаты налога на добавленную стоимость на импортируемые товары»
  kaz: «Импортталатын тауарларға қосылған құн салығын төлеу мерзімін өзгерту туралы өтініштің нысанын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 20 наурыздағы № 197 бұйрығының күшін жою туралы
