act_code: '119494'
requisite: Приказ Министра финансов Республики Казахстан от 20 февраля 2018 года № 248. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 марта 2018 года № 16529
title:
  rus: Об утверждении Правил реализации, использования и уничтожения задержанных товаров, возмещения расходов по их перевозке (транспортировке), перегрузке (погрузке, выгрузке), хранению, иных расходов, связанных с подготовкой к реализации и реализацией задержанных товаров, а также возврата сумм, полученных от их реализации
  kaz: Кідіртілген тауарларды өткізу, пайдалану және жою, оларды тасымалдау (тасу), қайта тиеу (тиеу, түсіру), сақтау бойынша шығыстарды, кідіртілген тауарларды өткізуге дайындалуға және өткізумен байланысты өзге де шығыстарды өтеу, сондай-ақ оларды өткізуден алынған сомаларды қайтару қағидаларын бекіту туралы
