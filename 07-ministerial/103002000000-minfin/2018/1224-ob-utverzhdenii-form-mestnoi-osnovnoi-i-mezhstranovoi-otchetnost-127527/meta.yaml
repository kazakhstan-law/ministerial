  title:
    rus: О внесении изменений в приказы Министра финансов Республики Казахстан от 14 февраля 2018 года № 178 «Об утверждении форм межстрановой отчетности и заявления об участии в международной группе и Правил ее заполнения» и от 24 декабря 2018 года № 1104 «Об утверждении форм местной, основной и межстрановой отчетностей по трансфертному ценообразованию и Правил их заполнения»
    kaz: «Еларалық есептіліктің және халықаралық топқа қатысу туралы өтініштің нысандарын және олардың толтыру қағидаларын бекіту туралы» 2018 жылғы 14 ақпандағы № 178 және «Трансферттік баға белгілеу бойынша жергілікті, негізгі және еларалық есептілік нысандарын және оларды толтыру қағидаларын бекіту туралы» 2018 жылғы 24 желтоқсандағы № 1104 Қазақстан Республикасы Қаржы министрінің бұйрықтарына өзгерістер енгізу туралы
