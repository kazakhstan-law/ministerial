  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 16 февраля 2018 года № 203 «Об определении уполномоченных органов на принятие предварительных решений о классификации товара и о происхождении товара, а также случая принятия территориальным органом государственных доходов решения о классификации товара в несобранном или разобранном виде, в том числе в некомплектном или незавершенном виде, ввоз которого предполагается различными товарными партиями в течение определенного периода времени»
    kaz: «Тауарды сыныптау туралы және тауардың шығарылған жері туралы алдын ала шешімдерді қабылдауға уәкілетті органдарды, сондай-ақ аумақтық мемлекеттік кірістер органдары белгілі бір уақыт кезеңі ішінде әртүрлі тауар партияларымен әкелінуі болжанатын, құрастырылмаған немесе бөлшектелген түрдегі, оның ішінде жасақталмаған немесе жасалып бітпеген түрдегі тауарды сыныптау туралы шешімді қабылдау жағдайын айқындау туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 16 ақпандағы № 203 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/134849/rus
