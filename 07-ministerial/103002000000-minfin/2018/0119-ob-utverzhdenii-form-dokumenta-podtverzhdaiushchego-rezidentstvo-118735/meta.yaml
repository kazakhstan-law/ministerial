title:
  rus: Об утверждении форм документа, подтверждающего резидентство, и справки о суммах полученных доходов из источников в Республике Казахстан и удержанных (уплаченных) налогов
  kaz: Резиденттікті растайтын құжаттың және Қазақстан Республикасындағы көздерден алынған кірістері және ұстап қалған (төленген) салықтардың сомасы туралы анықтаманың нысандарын бекіту туралы
