  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 19 января 2018 года № 38 «Об утверждении форм документа, подтверждающего резидентство, и справки о суммах полученных доходов из источников в Республике Казахстан и удержанных (уплаченных) налогов»
    kaz: «Резиденттікті растайтын құжаттың және Қазақстан Республикасындағы көздерден алынған кірістері және ұстап қалған (төленген) салықтардың сомасы туралы анықтаманың нысандарын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 19 қаңтардағы № 38 бұйрығына өзгеріс енгізу туралы
