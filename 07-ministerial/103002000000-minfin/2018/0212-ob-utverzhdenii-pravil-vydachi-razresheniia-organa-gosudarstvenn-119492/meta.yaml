title:
  rus: Об утверждении Правил выдачи разрешения органа государственных доходов на хранение в местах, не являющихся таможенными складами, товаров, которые из-за своих больших габаритов или особых условий погрузки, разгрузки и (или) хранения не могут быть размещены на таможенном складе
  kaz: Габариттері үлкен болғандықтан немесе тиеудің, түсірудің және (немесе) сақтаудың ерекше жағдайларына байланысты кеден қоймасында орналастыруға болмайтын тауарларды кеден қоймалары болып табылмайтын орындарда сақтауға мемлекеттік кірістер органының рұқсат беру қағидаларын бекіту туралы
