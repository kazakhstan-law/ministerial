title:
  rus: Об утверждении Правил, сроков и формы представления сведений лицами, осуществляющими пересылку, перевозку, доставку товаров при электронной торговле товарами по запросу органов государственных доходов
  kaz: Мемлекеттік кірістер органдарының сұрау салуы бойынша тауарлармен электрондық сауда кезінде тауарларды жөнелтуді, тасымалдауды, жеткізуді жүзеге асыратын тұлғалардың мәліметтерді беру қағидаларын, мерзімдері мен нысанын бекіту туралы
