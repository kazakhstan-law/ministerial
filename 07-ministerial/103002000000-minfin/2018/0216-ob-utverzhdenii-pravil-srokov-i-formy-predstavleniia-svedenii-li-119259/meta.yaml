  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 16 февраля 2018 года № 221 «Об утверждении Правил, сроков и формы представления сведений лицами, осуществляющими пересылку, перевозку, доставку товаров при электронной торговле товарами по запросу органов государственных доходов»
    kaz: «Мемлекеттік кірістер органдарының сұрау салуы бойынша тауарлармен электрондық сауда кезінде тауарларды жөнелтуді, тасымалдауды, жеткізуді жүзеге асыратын тұлғалардың мәліметтерді беру қағидаларын, мерзімдері мен нысанын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 16 ақпандағы № 221 бұйрығына өзгеріс енгізу туралы
