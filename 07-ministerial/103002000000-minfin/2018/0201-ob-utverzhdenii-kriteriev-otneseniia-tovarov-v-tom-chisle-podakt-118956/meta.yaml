requisite: Приказ Министра финансов Республики Казахстан от 1 февраля 2018 года № 104. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 февраля 2018 года № 16375. Утратил силу приказом Министра финансов Республики Казахстан от 11 ноября 2025 года № 690 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении критериев отнесения товаров, в том числе подакцизных, к товарам, импортируемым физическими лицами с территории государств-членов Евразийского экономического союза в целях предпринимательской деятельности
  kaz: Жеке тұлғалар тауарларды, оның ішінде акцизделетін тауарларды кәсіпкерлік қызмет мақсатында Еуразиялық экономикалық одаққа мүше мемлекеттердің аумағынан импорттайтын тауарларға жатқызу өлшемшарттарын бекіту туралы
