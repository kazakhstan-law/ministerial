  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 1 февраля 2018 года № 104 «Об утверждении критерия отнесения товаров, в том числе подакцизных товаров к импортируемым в целях предпринимательской деятельности»
    kaz: «Тауарларды, оның ішінде акцизделетін тауарларды кәсіпкерлік қызмет мақсатында импортталатын тауарларға жатқызу өлшемшартын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 1 ақпандағы № 104 бұйрығына өзгерістер енгізу туралы
