    kaz: «Шектері Еуразиялық экономикалық одақтың кедендік шекарасының учаскелеріне толық немесе ішінара тұспа-тұс келетін арнайы экономикалық аймақтың және еркін кеден аймағы кедендік рәсімінің кейбір мәселелері туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 15 наурыздағы № 360 бұйрығына өзгерістер енгізу туралы
