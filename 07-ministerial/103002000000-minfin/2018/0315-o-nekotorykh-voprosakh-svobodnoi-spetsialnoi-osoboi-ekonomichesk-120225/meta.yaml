title:
  rus: О некоторых вопросах свободной (специальной, особой) экономической зоны, пределы которой полностью или частично совпадают с участками таможенной границы Евразийского экономического союза, и таможенной процедуры свободной таможенной зоны
  kaz: Шектері Еуразиялық экономикалық одақтың кедендік шекарасының учаскелеріне толық немесе ішінара тұспа-тұс келетін еркін (арнайы, ерекше) экономикалық аймақтың және еркін кеден аймағы кедендік рәсімінің кейбір мәселелері туралы
