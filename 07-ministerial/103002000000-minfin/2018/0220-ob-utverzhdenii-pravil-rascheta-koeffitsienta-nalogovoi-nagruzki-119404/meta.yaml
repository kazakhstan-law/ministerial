title:
  rus: Об утверждении Правил расчета коэффициента налоговой нагрузки налогоплательщика (налогового агента), за исключением физических лиц, не зарегистрированных в налоговых органах в качестве индивидуальных предпринимателей и не занимающихся частной практикой
  kaz: Салық органдарында дара кәсіпкерлер ретінде тіркелмеген және жеке практикамен айналыспайтын жеке тұлғаларды қоспағанда, салық төлеушінің (салық агентінің) салықтық жүктемесінің коэффициентін есептеу қағидаларын бекіту туралы
