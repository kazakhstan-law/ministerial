act_code: '119395'
requisite: Приказ Министра финансов Республики Казахстан от 20 февраля 2018 года № 240. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 марта 2018 года № 16507. Утратил силу приказом Министра финансов Республики Казахстан от 10 ноября 2025 года № 685 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил ведения базы данных о лицах, получивших и расходовавших деньги и (или) иное имущество, полученные от иностранных государств, международных и иностранных организаций, иностранцев, лиц без гражданства, а также их включения и исключения из базы данных
  kaz: Шетел мемлекеттерден, халықаралық және шетелдік ұйымдардан, шетелдіктерден, азаматтығы жоқ адамдардан алынған ақшаны және (немесе) өзге де мүлікті алған және жұмсаған тұлғалар туралы деректер базасын жүргізу, сондай-ақ оларды деректер базасына енгізу және шығару қағидаларын бекіту туралы
