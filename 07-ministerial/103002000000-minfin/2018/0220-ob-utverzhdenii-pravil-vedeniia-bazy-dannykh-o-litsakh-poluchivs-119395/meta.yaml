  title:
    rus: О внесении изменений и дополнения в приказ Министерства финансов Республики Казахстан от 20 февраля 2018 года № 240 «Об утверждении Правил ведения базы данных о лицах, получивших и расходовавших деньги и (или) иное имущество, полученные от иностранных государств, международных и иностранных организаций, иностранцев, лиц без гражданства, а также их включения и исключения из базы данных»
    kaz: «Шетел мемлекеттерден, халықаралық және шетелдік ұйымдардан, шетелдіктерден, азаматтығы жоқ адамдардан алынған ақшаны және (немесе) өзге де мүлікті алған және жұмсаған тұлғалар туралы деректер базасын жүргізу, сондай-ақ оларды деректер базасына енгізу және шығару қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрлігінің 2018 жылғы 20 ақпандағы № 240 бұйрығына өзгерістер мен толықтыру енгізу туралы
