  title:
    rus: Об утверждении Критериев отнесения товаров, в том числе подакцизных, к импортируемым физическими лицами в целях предпринимательской деятельности на территорию Республики Казахстан с территории государств-членов Евразийского экономического союза, а также Правил корректировки размера облагаемого импорта товаров на территорию Республики Казахстан с территории государств-членов Евразийского экономического союза
    kaz: Еуразиялық экономикалық одаққа мүше мемлекеттердің аумағынан Қазақстан Республикасының аумағына кәсіпкерлік қызмет мақсатында жеке тұлғалар импорттайтын тауарларды, оның ішінде акцизделетін тауарларды жатқызу өлшемшарттарын, сондай-ақ Еуразиялық экономикалық одаққа мүше мемлекеттердің аумағынан Қазақстан Республикасының аумағына салық салынатын тауарлар импортының мөлшерін түзету қағидаларын бекіту туралы
