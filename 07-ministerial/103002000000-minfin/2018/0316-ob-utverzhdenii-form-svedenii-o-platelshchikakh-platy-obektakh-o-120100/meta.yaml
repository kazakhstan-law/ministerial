act_code: '120100'
requisite: Приказ Министра финансов Республики Казахстан от 16 марта 2018 года № 377. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 марта 2018 года № 16706. Утратил силу приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении форм сведений о плательщиках платы, объектах обложения и периодах, на которые предоставлены земельные участки во временное возмездное землепользование (аренду) и о плательщиках платы, объектах обложения, периоде действия лицензии на разведку или добычу твердых полезных ископаемых, идентифицирующих координатах блоков и их индивидуальных кодах
  kaz: Төлемақы төлеушілер, салық салу объектілері және жер учаскелері уақытша өтеулі жер пайдалануға (жалға) берілген кезеңдер туралы және төлемақы төлеушілер, салық салу объектілері, пайдалы қатты қазбаларды барлауға немесе өндіруге лицензияның қолданылу кезеңі, блоктардың сәйкестендіруші координаталары және олардың дара кодтары туралы мәлiметтер нысандарын бекіту туралы
