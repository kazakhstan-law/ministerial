act_code: '119343'
requisite: Приказ Министра финансов Республики Казахстан от 15 февраля 2018 года № 199. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 марта 2018 года № 16528. Утратил силу приказом и.о. Министра финансов Республики Казахстан от 27 июля 2021 года № 726 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил представления сведений об инвестиционных контрактах, заключенных в соответствии с законодательством Республики Казахстан в сфере предпринимательства и предусматривающих реализацию инвестиционных приоритетных проектов, а также сведений о прекращении действия данных инвестиционных контрактов и иных сведений и их формы
  kaz: Қазақстан Республикасының кәсіпкерлік саласындағы заңнамасына сәйкес жасалған және инвестициялық басым жобаларды іске асыруды көздейтін инвестициялық келісімшарттар туралы мәліметтерді, сондай-ақ осы инвестициялық келісімшарттардың қолданысын тоқтату туралы мәліметтерді және өзге де мәліметтерді беру қағидаларын және олардың нысанын бекіту туралы
