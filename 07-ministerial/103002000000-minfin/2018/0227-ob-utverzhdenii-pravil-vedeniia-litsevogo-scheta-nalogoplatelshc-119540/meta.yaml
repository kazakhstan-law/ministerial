act_code: '119540'
requisite: Приказ Министра финансов Республики Казахстан от 27 февраля 2018 года № 306. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 марта 2018 года № 16601. Утратил силу приказом Министра финансов Республики Казахстан от 28 октября 2025 года № 637 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил ведения лицевого счета налогоплательщика, исчисления сальдо расчетов в лицевом счете налогоплательщика по налогам, платежам в бюджет, социальным платежам, штрафам, пени, формирования сведения об отсутствии (наличии) задолженности, учет по которым ведется в органе государственных доходов, списания превышения налога на добавленную стоимость с лицевых счетов налогоплательщиков, а также оказания государственной услуги «Проведение зачетов и возвратов налогов, платежей в бюджет, пени, штрафов
  kaz: Салық төлеушінің жеке шотын жүргізу, салықтар, бюджетке төленетін төлемдер, әлеуметтік төлемдер, айыппұлдар, өсімпұл бойынша салық төлеушінің жеке шотындағы есеп-қисаптар сальдосын есептеу, есебі мемлекеттік кірістер органында жүргізілетін берешектің жоқ (бар) екендігі туралы мәліметтерді қалыптастыру, салық төлеушілердің жеке шоттарынан қосылған құн салығының асып кетуін есептен шығару, сондай-ақ «Салықтарды, бюджетке төленетін төлемдерді, өсімпұл мен айыппұлдарды есепке жатқызуды және қайтаруды жүргізу» мемлекеттік қызметті көрсету қағидаларын бекіту туралы
