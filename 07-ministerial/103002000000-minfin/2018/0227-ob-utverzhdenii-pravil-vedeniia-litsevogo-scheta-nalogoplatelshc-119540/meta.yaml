  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 27 февраля 2018 года № 306 «Об утверждении Правил ведения лицевого счета налогоплательщика, исчисления сальдо расчетов в лицевом счете налогоплательщика по налогам, платежам в бюджет, социальным платежам, штрафам, пени, формирования сведения об отсутствии (наличии) задолженности, учет по которым ведется в органе государственных доходов, а также оказания государственной услуги «Проведение зачетов и возвратов налогов, платежей в бюджет, пени, штрафов»»
    kaz: «Салық төлеушінің жеке шотын жүргізу, салықтар, бюджетке төленетін төлемдер, әлеуметтік төлемдер, айыппұлдар, өсімпұл бойынша салық төлеушінің жеке шотындағы есеп-қисаптар сальдосын есептеу, есебі мемлекеттік кірістер органында жүргізілетін берешектің жоқ (бар) екендігі туралы мәліметтерді қалыптастыру, сондай-ақ «Салықтарды, бюджетке төленетін төлемдерді, өсімпұл мен айыппұлдарды есепке жатқызуды және қайтаруды жүргізу» мемлекеттік қызметті көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 27 ақпандағы № 306 бұйрығына өзгерістер мен толықтырулар енгізу туралы
