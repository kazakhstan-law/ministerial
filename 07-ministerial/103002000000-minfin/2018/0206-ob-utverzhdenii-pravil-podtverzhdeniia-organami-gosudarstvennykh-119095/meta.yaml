requisite: Приказ Министра финансов Республики Казахстан от 6 февраля 2018 года № 134. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 февраля 2018 года № 16428. Утратил силу приказом Министра финансов Республики Казахстан от 4 мая 2021 года № 425 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил подтверждения органами государственных доходов факта уплаты налога на добавленную стоимость по импортированным товарам и акциза по импортированным подакцизным товарам с территории государств-членов Евразийского экономического союза
  kaz: Мемлекеттік кірістер органдарының Еуразиялық экономикалық одаққа мүше мемлекеттердің аумағынан импортталған акцизделетін тауарлар бойынша акциздің және импортталған тауарлар бойынша қосылған құн салығын төлену фактісін растауы туралы қағидаларын бекіту
