act_code: '119390'
requisite: Приказ Министра финансов Республики Казахстан от 12 февраля 2018 года № 158. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 марта 2018 года № 16505. Утратил силу  приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил, срока и формы представления органами внутренних дел сведений о налогоплательщиках, которым выданы разрешения трудовому иммигранту, а также Правил представления уполномоченным государственным органом сведений о прибывших иностранцах
  kaz: Ішкі істер органдарының еңбекші көшіп келушіге рұқсаттар берілген салық төлеушілер туралы мәлiметтерді ұсынудың қағидаларын, мерзімін және нысандарын, сондай-ақ уәкiлеттi мемлекеттік органның келушi шетелдiктер туралы мәлiметтердi ұсынудың қағидаларын бекіту туралы
