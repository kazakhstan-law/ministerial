  kaz: Еуразиялық экономикалық одақтың кедендік шекарасы арқылы құрастырылмаған немесе бөлшектелген түрде, оның ішінде жасақталмаған немесе жасалып бітпеген түрде өткізілетін тауарларды сыныптаудың кейбір мәселелері туралы
