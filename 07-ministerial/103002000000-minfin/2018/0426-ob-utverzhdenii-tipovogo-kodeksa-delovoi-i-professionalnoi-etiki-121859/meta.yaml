act_code: '121859'
requisite: Приказ Министра финансов Республики Казахстан от 26 апреля 2018 года № 487. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 мая 2018 года № 16897
title:
  rus: Об утверждении типового кодекса деловой и профессиональной этики оценщиков и требований к рассмотрению палатой оценщиков обращений касательно нарушения ее членами требований Закона Республики Казахстан «Об оценочной деятельности в Республике Казахстан», стандартов и правил палаты оценщиков
  kaz: Бағалаушылардың іскерлік және кәсіптік әдебінің үлгілік кодексін және өз мүшелерінің «Қазақстан Республикасындағы бағалау қызметі туралы» Қазақстан Республикасы Заңының, бағалаушылар палатасының стандарттары мен қағидаларының талаптарын бұзуына қатысты жүгінімдерді бағалаушылар палатасының қарауы кезінде қойылатын талаптарды және бағалаушылар палатасының қағидаларын бекіту туралы
