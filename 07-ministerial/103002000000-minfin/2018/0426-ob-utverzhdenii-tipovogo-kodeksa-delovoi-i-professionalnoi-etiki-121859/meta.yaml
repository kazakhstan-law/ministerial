  requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 31 марта 2020 года № 339. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 апреля 2020 года № 20280
  title:
    rus: О внесении изменений и дополнения в приказ Министра финансов Республики Казахстан от 26 апреля 2018 года № 487 «Об утверждении типового кодекса деловой и профессиональной этики оценщиков и требований к рассмотрению палатой оценщиков обращений касательно нарушения ее членами требований Закона Республики Казахстан от 10 января 2018 года «Об оценочной деятельности в Республике Казахстан», стандартов и правил палаты оценщиков»
    kaz: «Бағалаушылардың іскерлік және кәсіптік әдебінің үлгілік кодексін және өз мүшелерінің «Қазақстан Республикасындағы бағалау қызметі туралы» 2018 жылғы 10 қаңтардағы Қазақстан Республикасы Заңының, бағалаушылар палатасының стандарттары мен қағидаларының талаптарын бұзуына қатысты жүгінімдерді бағалаушылар палатасының қарауы кезінде қойылатын талаптарды және бағалаушылар палатасының қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 26 сәуірдегі № 487 бұйрығына өзгерістер және толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/141156/rus
