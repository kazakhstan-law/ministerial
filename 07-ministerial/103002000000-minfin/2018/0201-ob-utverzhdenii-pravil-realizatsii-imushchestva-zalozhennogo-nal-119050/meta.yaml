act_code: '119050'
requisite: Приказ Министра финансов Республики Казахстан от 1 февраля 2018 года № 111. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2018 года № 16387
title:
  rus: Об утверждении Правил реализации имущества, заложенного налогоплательщиком и (или) третьим лицом, а также ограниченного в распоряжении имущества налогоплательщика (налогового агента) в счет налоговой задолженности, плательщика – в счет задолженности по таможенным платежам, налогам, специальным, антидемпинговым, компенсационным пошлинам, пеней, процентов
  kaz: Салық төлеуші және (немесе) үшінші тұлға кепілге қойған мүлікті, сондай-ақ салық төлеушінің (салық агентінің) билік ету шектелген мүлкін - салық берешегі есебіне, төлеушінің - кедендік төлемдер, салықтар, арнайы, демпингке қарсы, өтемақы баждары, өсімпұлдар, пайыздар бойынша берешегі есебіне өткізу қағидаларын бекіту туралы
