  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 1 февраля 2018 года № 111 «Об утверждении Правил реализации имущества, заложенного налогоплательщиком и (или) третьим лицом, а также ограниченного в распоряжении имущества налогоплательщика (налогового агента) в счет налоговой задолженности, плательщика – в счет задолженности по таможенным платежам, налогам, специальным, антидемпинговым, компенсационным пошлинам, пеней, процентов»
    kaz: «Салық төлеуші және (немесе) үшінші тұлға кепілге қойған мүлікті, сондай-ақ салық төлеушінің (салық агентінің) билік ету шектелген мүлкін – салық берешегі есебіне, төлеушінің - кедендік төлемдер, салықтар, арнайы, демпингке қарсы, өтемақы баждары, өсімпұлдар, пайыздар бойынша берешегі есебіне өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 1 ақпандағы № 111 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/139484/rus
