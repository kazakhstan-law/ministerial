act_code: '119360'
requisite: Приказ Министра финансов Республики Казахстан от 15 февраля 2018 года № 193. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 марта 2018 года № 16481
title:
  rus: Об утверждении Правил осуществления задержания (приостановления) наличных денежных средств и (или) денежных инструментов, перемещаемых через таможенную границу Евразийского экономического союза, при получении информации, предоставляемой правоохранительными органами и (или) уполномоченным органом о возможной причастности к отмыванию доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения
  kaz: Құқық қорғау органдары және (немесе) уәкілетті орган ұсынатын, қылмыстық жолмен алынған кірістерді жылыстатуға, терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға ықтимал қатысы болуы туралы ақпарат алған кезде, Еуразиялық экономикалық одақтың кедендік шекарасы арқылы өткізілетін қолма-қол ақша қаражатын және (немесе) ақша құралдарын уәкілетті орган айқындайтын тәртіппен ұстап алуды (тоқтата тұруды) жүзеге асыру қағидаларын бекіту туралы
