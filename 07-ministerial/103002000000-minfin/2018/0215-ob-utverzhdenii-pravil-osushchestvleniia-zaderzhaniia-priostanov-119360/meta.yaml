  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 15 февраля 2018 года № 193 «Об утверждении Правил осуществления задержания (приостановления) наличных денежных средств и (или) денежных инструментов, перемещаемых через таможенную границу Евразийского экономического союза, при получении информации, предоставляемой правоохранительными органами и (или) уполномоченным органом о возможной причастности к отмыванию доходов, полученных преступным путем и финансированию терроризма»
    kaz: «Құқық қорғау органдары және (немесе) уәкілетті орган ұсынатын, қылмыстық жолмен алынған кірістерді жылыстатуға және терроризмді қаржыландыруға ықтимал қатысы болуы туралы ақпарат алған кезде, Еуразиялық экономикалық одақтың кедендік шекарасы арқылы өткізілетін қолма-қол ақша қаражатын және (немесе) ақша құралдарын уәкілетті орган айқындайтын тәртіппен ұстап алуды (тоқтата тұруды) жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 15 ақпандағы № 193 бұйрығына өзгерістер енгізу туралы
