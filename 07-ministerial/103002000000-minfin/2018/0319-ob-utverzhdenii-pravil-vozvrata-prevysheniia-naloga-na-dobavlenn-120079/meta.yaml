act_code: '120079'
requisite: Приказ Министра финансов Республики Казахстан от 19 марта 2018 года № 391. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 марта 2018 года № 16669. Утратил силу приказом и.о. Министра финансов Республики Казахстан от 30 октября 2025 года № 649 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил возврата превышения налога на добавленную стоимость и применения системы управления рисками в целях подтверждения достоверности суммы превышения налога на добавленную стоимость, а также критериев степени риска
  kaz: Қосылған құн салығының асып кетуін қайтару және қосылған құн салығының асып кеткен сомасының анықтығын растау мақсатында тәуекелдерді басқару жүйесін қолдану қағидаларын, сондай-ақ тәуекел дәрежесінің өлшемшарттарын бекіту туралы
