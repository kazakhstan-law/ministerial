  title:
    rus: О внесении изменений и дополнения в приказ Министра финансов Республики Казахстан от 19 марта 2018 года № 391 «Об утверждении Правил возврата превышения налога на добавленную стоимость и применения системы управления рисками в целях подтверждения достоверности суммы превышения налога на добавленную стоимость, а также критериев степени риска»
    kaz: «Қосылған құн салығының асып кетуін қайтару және қосылған құн салығының асып кеткен сомасының анықтығын растау мақсатында тәуекелдерді басқару жүйесін қолдану қағидаларын, сондай-ақ тәуекел дәрежесінің өлшемшарттарын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 19 наурыздағы № 391 бұйрығына өзгерістер мен толықтырулар енгізу туралы
