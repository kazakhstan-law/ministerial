  title:
    rus: О внесении изменений и дополнения в приказ Министра финансов Республики Казахстан от 19 марта 2018 года № 391 «Об утверждении Правил возврата превышения налога на добавленную стоимость» и признании утратившими силу некоторых приказов Министерства финансов Республики Казахстан
    kaz: «Қосылған құн салығының асып кетуін қайтару қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 19 наурыздағы № 391 бұйрығына өзгерістер мен толықтыру енгізу және Қазақстан Республикасы Қаржы министрлігінің кейбір бұйрықтарының күші жойылды деп тану туралы
