title:
  rus: Об утверждении структуры, формата и формы расчета таможенных пошлин, налогов, взимаемых по единым ставкам, либо таможенных пошлин, налогов, взимаемых в виде совокупного таможенного платежа, а также Правил ее заполнения и внесения в нее изменений (дополнений)
  kaz: Бірыңғай мөлшерлемелер бойынша өндіріп алынатын кедендік баждар, салықтар не жиынтық кедендік төлем түрінде өндіріп алынатын кедендік баждардың, салықтардың есеп-қисаптың нысанын, құрылымын және форматын, сондай-ақ оны толтыру мен оған өзгерістер (толықтырулар) енгізу қағидаларын бекіту туралы
