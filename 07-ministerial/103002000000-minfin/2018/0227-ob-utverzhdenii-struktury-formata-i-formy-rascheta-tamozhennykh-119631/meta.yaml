  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 27 февраля 2018 года № 301 «Об утверждении структуры, формата и формы расчета таможенных пошлин, налогов, взимаемых по единым ставкам, либо таможенных пошлин, налогов, взимаемых в виде совокупного таможенного платежа, а также Правил ее заполнения и внесения в нее изменений (дополнений)»
    kaz: «Бірыңғай мөлшерлемелер бойынша өндіріп алынатын кедендік баждар, салықтар не жиынтық кедендік төлем түрінде өндіріп алынатын кедендік баждардың, салықтардың есеп-қисатың нысанын, құрылымын және форматын, сондай-ақ оны толтыру мен оған өзгерістер (толықтырулар) енгізу қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 27 ақпандағы № 301 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/156371/rus
