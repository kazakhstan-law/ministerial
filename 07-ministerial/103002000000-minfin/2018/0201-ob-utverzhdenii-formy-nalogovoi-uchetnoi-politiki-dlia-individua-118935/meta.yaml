caused_by:
  code: '159533'
  requisite: Приказ Министра финансов Республики Казахстан от 8 октября 2021 года № 1040. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 октября 2021 года № 24785. Утратил силу приказом Министра финансов Республики Казахстан от 2 октября 2025 года № 562 (вводится в действие с 1 января 2026 года)
  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 1 февраля 2018 года № 97 «Об утверждении формы налоговой учетной политики для индивидуальных предпринимателей, применяющих специальные налоговые режимы на основе патента или упрощенной декларации»
    kaz: «Патент немесе оңайлатылған декларация негізінде арнаулы салық режимін қолданатын дара кәсіпкерлер үшін салықтық есепке алу саясатының нысанын бекіту туралы» Қазақстан Республикасы Қаржы министрiнiң 2018 жылғы 1 ақпандағы № 97 бұйрығына өзгерістер енгізу туралы
