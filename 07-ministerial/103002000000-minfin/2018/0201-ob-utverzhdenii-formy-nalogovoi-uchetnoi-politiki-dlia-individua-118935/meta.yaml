act_code: '118935'
requisite: Приказ Министра финансов Республики Казахстан от 1 февраля 2018 года № 97. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 февраля 2018 года № 16374. Утратил силу приказом Министра финансов Республики Казахстан от 2 октября 2025 года № 562 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении формы налоговой учетной политики для индивидуальных предпринимателей, применяющих специальные налоговые режимы для субъектов малого бизнеса на основе патента, упрощенной декларации или с использованием специального мобильного приложения
  kaz: Шағын бизнес субъектілері үшін патент, оңайлатылған декларация негізінде немесе арнаулы мобильді қосымша пайдаланылатын арнаулы салық режимін қолданатын дара кәсіпкерлер үшін салықтық есепке алу саясатының нысанын бекіту туралы
