act_code: '119931'
requisite: Приказ Министра финансов Республики Казахстан от 14 февраля 2018 года № 183. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 марта 2018 года № 16514. Утратил силу  приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил предоставления банкам второго уровня и организациям, осуществляющим отдельные виды банковских операций, информации о налогоплательщиках, в том числе физических лицах, состоящих на регистрационном учете в качестве индивидуального предпринимателя или лица, занимающегося частной практикой
  kaz: Салық төлеушілер, оның ішінде дара кәсіпкер немесе жеке практикамен айналысатын адам ретінде тіркеу есебінде тұрған жеке тұлғалар туралы ақпаратты екінші деңгейдегі банктерге және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдарға беру қағидаларын бекіту туралы
