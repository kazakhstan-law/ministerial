  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 14 февраля 2018 года № 183 «Об утверждении Правил предоставления банкам второго уровня и организациям, осуществляющим отдельные виды банковских операций, информации о налогоплательщиках, в том числе физических лицах, состоящих на регистрационном учете в качестве индивидуального предпринимателя или лица, занимающегося частной практикой»
    kaz: «Салық төлеушілер, оның ішінде дара кәсіпкер немесе жеке практикамен айналысатын адам ретінде тіркеу есебінде тұрған жеке тұлғалар туралы ақпаратты екінші деңгейдегі банктерге және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдарға беру қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің жылғы 14 ақпандағы № 183 бұйрығына өзгеріс енгізу туралы
