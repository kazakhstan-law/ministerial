  title:
    rus: О некоторых вопросах, связанных с возвратом налога на добавленную стоимость, уплаченного по товарам, работам, услугам, приобретенным за счет средств гранта, дипломатическому представительству и их персоналу
    kaz: Грант қаражаты есебінен сатып алынған тауарларға, жұмыстарға, көрсетілетін қызметтерге, дипломатиялық өкілдікке және олардың персоналына төленген қосылған құн салығын қайтаруға байланысты кейбір мәселелер туралы
