act_code: '119410'
requisite: Приказ Министра финансов Республики Казахстан от 16 февраля 2018 года № 212. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 марта 2018 года № 16513. Утратил силу приказом Министра финансов Республики Казахстан от 17 октября 2025 года № 914 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении формы сводной ведомости (реестра) по приобретенным товарам, выполненным работам, оказанным услугам дипломатических и приравненных к ним представительств иностранных государств, консульских учреждений иностранного государства, аккредитованных в Республике Казахстан
  kaz: Қазақстан Республикасында аккредиттелген шет мемлекеттердің дипломатиялық және оларға теңестірілген өкілдіктеріне, шет мемлекеттің консулдық мекемелерінің сатып алынған тауарлар, орындалған жұмыстар, көрсетілген қызметтер бойынша жиынтық ведомосының (тізілімінің) нысанын бекіту туралы
