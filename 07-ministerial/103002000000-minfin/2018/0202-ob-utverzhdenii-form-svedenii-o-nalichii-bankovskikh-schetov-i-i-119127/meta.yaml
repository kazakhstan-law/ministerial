caused_by:
  code: '216268'
  requisite: Приказ и.о. Министра финансов Республики Казахстан от 30 октября 2025 года № 648. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 октября 2025 года № 37285. Утратил силу приказом Министра финансов Республики Казахстан от 12 ноября 2025 года № 698 (вводится в действие с 1 января 2026 года)
  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 2 февраля 2018 года № 119 «Об утверждении форм сведений о наличии банковских счетов и их номерах, об остатках и движении денег на этих счетах, а также о предоставленных кредитах физическому лицу, у которого возникла обязанность по представлению декларации об активах и обязательствах, с указанием сумм погашения, включая вознаграждение»
    kaz: Банк шоттарының бар-жоғы және олардың нөмірлері туралы, осы шоттардағы ақшаның қалдығы мен қозғалысы туралы, сондай-ақ сыйақыны қоса алғанда, өтеу сомаларын көрсете отырып, активтер мен міндеттемелер туралы декларацияны ұсыну жөніндегі міндет туындаған, жеке тұлғаға берілген кредиттер туралы мәліметтердің нысандарын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 2 ақпандағы № 119 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/216268/rus
