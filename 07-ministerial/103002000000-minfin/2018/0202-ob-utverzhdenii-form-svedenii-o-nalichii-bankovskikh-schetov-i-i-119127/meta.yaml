  requisite: Приказ Министра финансов Республики Казахстан от 30 апреля 2021 года № 420. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 мая 2021 года № 22687. Утратил силу приказом Министра финансов Республики Казахстан от 12 ноября 2025 года № 698 (вводится в действие с 1 января 2026 года)
  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 2 февраля 2018 года № 119 «Об утверждении формы сведений о наличии банковских счетов и их номерах, об остатках и движении денег на этих счетах, о предоставленных кредитах физическим лицам»
    kaz: «Банк шоттарының бар-жоғы және олардың нөмірлері туралы, осы шоттардағы ақшаның қалдығы мен қозғалысы туралы, жеке тұлғаға берілген кредиттер туралы мәліметтердің нысанын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 2 ақпандағы № 119 бұйрығына өзгерістер енгізу туралы
