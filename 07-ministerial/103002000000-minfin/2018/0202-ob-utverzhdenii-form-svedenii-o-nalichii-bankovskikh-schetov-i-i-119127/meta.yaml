act_code: '119127'
requisite: Приказ Министра финансов Республики Казахстан от 2 февраля 2018 года № 119. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 февраля 2018 года № 16408. Утратил силу приказом Министра финансов Республики Казахстан от 12 ноября 2025 года № 698 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении форм сведений о наличии банковских счетов и их номерах, об остатках и движении денег на этих счетах, а также о предоставленных кредитах физическому лицу, у которого возникла обязанность по представлению декларации об активах и обязательствах, с указанием сумм погашения, включая вознаграждение
  kaz: Банк шоттарының бар-жоғы және олардың нөмірлері туралы, осы шоттардағы ақшаның қалдығы мен қозғалысы туралы, сондай-ақ сыйақыны қоса алғанда, өтеу сомаларын көрсете отырып, активтер мен міндеттемелер туралы декларацияны ұсыну жөніндегі міндет туындаған, жеке тұлғаға берілген кредиттер туралы мәліметтердің нысандарын бекіту туралы
