  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 15 февраля 2018 года № 192 «Об утверждении Перечня мест перемещения товаров через таможенную границу Евразийского экономического союза, в которых применяется система двойного коридора, а также Правил формирования такого перечня»
    kaz: «Қос дәліз жүйесі қолданылатын Еуразиялық экономикалық одақтың кедендік шекарасы арқылы тауарларды өткізу орындарының тізбесін, сондай-ақ осындай тізбені қалыптастыру қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 15 ақпандағы № 192 бұйрығына өзгерістер енгізу туралы
