title:
  rus: Об утверждении Перечня мест перемещения товаров через таможенную границу Евразийского экономического союза, в которых применяется система двойного коридора, а также Правил формирования такого перечня
  kaz: Қос дәліз жүйесі қолданылатын Еуразиялық экономикалық одақтың кедендік шекарасы арқылы тауарларды өткізу орындарының тізбесін, сондай-ақ осындай тізбені қалыптастыру қағидаларын бекіту туралы
