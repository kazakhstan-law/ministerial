  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 20 февраля 2018 года № 250 «Об утверждении Правил создания, категорирования, классификации, а также норм положенности и типовых требований к обустройству и материально-техническому оснащению таможен, таможенных постов и контрольно-пропускных пунктов в части, не урегулированной таможенным законодательством Евразийского экономического союза, а также требований к обустройству и техническому оснащению элементов таможенной инфраструктуры, расположенных в местах размещения органов государственных доходов и специализированных государственных учреждений, входящих в систему органов государственных доходов и в иных местах, на территории которых могут совершаться таможенные операции и может проводиться таможенный контроль»
    kaz: «Еуразиялық экономикалық одақтың кеден заңнамасында реттелмеген бөлігінде кедендерді, кеден бекеттерін және бақылау-өткізу пункттерін құру, санатқа бөлу, сыныптау қағидаларын, сондай-ақ оларды жайластыру мен материалдық-техникалық жарақтандырудың тиесілік нормаларын және оларға қойылатын үлгілік талаптарды, сондай-ақ мемлекеттік кірістер органдары мен мемлекеттік кірістер органдарының жүйесіне кіретін мамандандырылған мемлекеттік мекемелер орналасқан жерлерде және аумағында кедендік операциялар жасалуы және кедендік бақылау жүргізілуі мүмкін өзге жерлерде кедендік инфрақұрылым элементтерін жайластыруға және техникалық жарақтандыруға қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 20 ақпандағы № 250 бұйрығына өзгерістер енгізу туралы
