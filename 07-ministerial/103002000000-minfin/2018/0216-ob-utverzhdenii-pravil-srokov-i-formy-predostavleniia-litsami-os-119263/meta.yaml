act_code: '119263'
requisite: Приказ Министра финансов Республики Казахстан от 16 февраля 2018 года № 222. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 марта 2018 года № 16503
title:
  rus: Об утверждении Правил, сроков и формы предоставления лицами, осуществляющими электронную торговлю товарами и применяющими нормы налогового законодательства Республики Казахстан в части уменьшения исчисленной суммы корпоративного подоходного налога, уменьшения облагаемой суммы дохода индивидуального предпринимателя на облагаемый доход индивидуального предпринимателя, уменьшения облагаемого дохода физического лица на налогооблагаемый доход индивидуального предпринимателя информации по такой деятельности
  kaz: Тауарлармен электрондық сауданы жүзеге асыратын және Қазақстан Республикасы салық заңнамасының корпоративтік табыс салығының есептелген сомасын азайту, дара кәсіпкер кірісінің салық салынатын сомасын дара кәсіпкердің салық салынатын кірісіне азайту, жеке тұлғаның салық салынатын кірісін дара кәсіпкердің салық салынатын кірісіне азайту бөлігіндегі нормаларын қолданатын тұлғалар осындай қызмет жөніндегі ақпаратты беру қағидаларын, мерзімдерін және нысанын бекіту туралы
