requisite: Приказ Министра финансов Республики Казахстан от 20 февраля 2018 года № 249. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 марта 2018 года № 16474
title:
  rus: Об утверждении Правил и сроков представления банками второго уровня и организациями, осуществляющими отдельные виды банковских операций, сведений о наличии банковских счетов и их номерах, об остатках и движении денег на этих счетах по налогоплательщикам, состоящим на регистрационном учете по электронной торговле товарами
  kaz: Екінші деңгейдегі банктердің және банк операцияларының жекелеген түрлерiн жүзеге асыратын ұйымдардың тауарлармен электрондық сауда бойынша тіркеу есебінде тұрған салық төлеушілер бойынша банктік шоттардың бар екені және олардың нөмірлері туралы, осы шоттардағы ақша қалдықтары мен қозғалысы туралы мәліметтерді беру қағидаларын және мерзімдерін бекіту туралы
