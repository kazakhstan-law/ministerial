  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 23 февраля 2018 года № 278 «Об утверждении формы сведений по обменным пунктам уполномоченных организаций, имеющих лицензию на осуществление деятельности по организации обменных операций с наличной иностранной валютой»
    kaz: «Қолма-қол шетелдік валютамен айырбастау операцияларын ұйымдастыру жөніндегі қызметті жүзеге асыруға лицензиясы бар уәкілетті ұйымдардың айырбастау пункттері жөніндегі мәліметтер нысанын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 23 ақпандағы № 278 бұйрығына өзгерістер енгізу туралы
