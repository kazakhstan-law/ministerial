act_code: '119706'
requisite: Приказ Министра финансов Республики Казахстан от 23 февраля 2018 года № 278. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 марта 2018 года № 16570. Утратил силу  приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении формы сведений по обменным пунктам юридических лиц, осуществляющих деятельность исключительно через обменные пункты на основании лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой
  kaz: Қызметін Қазақстан Республикасы Ұлттық Банкінің қолма-қол шетелдік валютасымен айырбастау операцияларына арналған лицензиясы негізінде тек қана айырбастау пункттері арқылы жүзеге асыратын заңды тұлғалардың айырбастау пункттері жөніндегі мәліметтер нысанын бекіту туралы
