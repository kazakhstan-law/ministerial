  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 12 января 2018 года № 23 «Об утверждении положения об Апелляционной комиссии по рассмотрению жалоб на уведомление о результатах проверки и (или) уведомление об устранении нарушений»
    kaz: «Тексеру нәтижелері туралы хабарламаға және (немесе) бұзушылықтарды жою туралы хабарламаға шағымдарды қарау бойынша апелляциялық комиссия туралы ережені бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 12 қаңтардағы № 23 бұйрығына өзгерістер енгізу туралы
