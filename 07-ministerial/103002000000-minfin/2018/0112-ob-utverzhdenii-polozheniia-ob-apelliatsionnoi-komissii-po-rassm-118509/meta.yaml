  requisite: Приказ Министра финансов Республики Казахстан от 4 августа 2020 года № 709. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 августа 2020 года № 21056. Утратил силу приказом Министра финансов Республики Казахстан от 24 сентября 2025 года № 529 (вводится в действие с 1 января 2026 год)
  title:
    rus: О внесении изменений и дополнения в приказ Министра финансов Республики Казахстан от 12 января 2018 года № 23 «Об утверждении положения об Апелляционной комиссии по рассмотрению жалоб на уведомление о результатах проверки и (или) уведомление об устранении нарушений»
    kaz: «Тексеру нәтижелері туралы хабарламаға және (немесе) бұзушылықтарды жою туралы хабарламаға шағымдарды қарау бойынша апелляциялық комиссия туралы ережені бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 12 қаңтардағы № 23 бұйрығына өзгерістер және толықтыру енгізу туралы
