  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 16 февраля 2018 года № 220 «Об утверждении Правил представления органом государственных доходов уполномоченным государственным органам сведений о представленных декларациях о доходах и имуществе, с указанием даты представления и кода органа государственных доходов, лицами, на которых Законом Республики Казахстан от 18 ноября 2015 года «О противодействии коррупции» возложена такая обязанность»
    kaz: «Мемлекеттік кірістер органының «Сыбайлас жемқорлыққа қарсы күрес туралы» 2015 жылғы 18 қарашадағы Қазақстан Республикасының Заңымен осындай міндет жүктелген адамдар тапсыру күні мен мемлекеттік кірістер органының кодын көрсете отырып, тапсырған кірістер мен мүлік туралы декларациялар туралы мәліметтерді уәкілетті мемлекеттік органдарға ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 16 ақпандағы № 220 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/170200/rus
