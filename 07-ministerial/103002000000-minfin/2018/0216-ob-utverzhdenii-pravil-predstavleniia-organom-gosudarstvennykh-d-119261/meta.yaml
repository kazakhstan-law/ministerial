requisite: Приказ Министра финансов Республики Казахстан от 16 февраля 2018 года № 220. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 марта 2018 года № 16495
title:
  rus: Об утверждении Правил представления органом государственных доходов уполномоченным государственным органам сведений о представленных декларациях о доходах и имуществе, с указанием даты представления и кода органа государственных доходов, лицами, на которых Законом Республики Казахстан «О противодействии коррупции» возложена такая обязанность
  kaz: Мемлекеттік кірістер органының «Сыбайлас жемқорлыққа қарсы күрес туралы» Қазақстан Республикасының Заңымен осындай міндет жүктелген адамдар тапсыру күні мен мемлекеттік кірістер органының кодын көрсете отырып, тапсырған кірістер мен мүлік туралы декларациялар туралы мәліметтерді уәкілетті мемлекеттік органдарға ұсыну қағидаларын бекіту туралы
