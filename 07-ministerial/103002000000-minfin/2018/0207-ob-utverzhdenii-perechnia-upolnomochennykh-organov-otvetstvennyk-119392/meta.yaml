  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 7 февраля 2018 года № 136 «Об утверждении перечня уполномоченных органов, ответственных за взимание поступлений в республиканский бюджет, за возврат из бюджета и (или) зачет излишне (ошибочно) уплаченных сумм в бюджет неналоговых поступлений, поступлений от продажи основного капитала, трансфертов, сумм погашения бюджетных кредитов, от продажи финансовых активов государства, займов»
    kaz: «Республикалық бюджетке түсетін түсімдерді алуға, салықтық емес түсімдердің, негізгі капиталды сатудан түсетін түсімдердің, трансферттердің, бюджеттік кредиттерді өтеу сомаларының, мемлекеттің қаржы активтерін сатудан түсетін сомалардың, қарыздардың бюджетке артық (қате) төленген сомаларын бюджеттен қайтаруға және (немесе) есепке жатқызуға жауапты уәкілетті органдардың тізбесін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 7 ақпандағы 136 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/138033/rus
