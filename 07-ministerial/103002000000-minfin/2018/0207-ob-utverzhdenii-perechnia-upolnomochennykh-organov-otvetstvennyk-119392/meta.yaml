act_code: '119392'
requisite: Приказ Министра финансов Республики Казахстан от 7 февраля 2018 года № 136. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 февраля 2018 года № 16423. Утратил силу приказом Министра финансов Республики Казахстан от 24 июня 2025 года № 318 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня уполномоченных органов, ответственных за взимание поступлений в республиканский бюджет, Национальный фонд Республики Казахстан, Фонд компенсации потерпевшим, Фонд поддержки инфраструктуры образования, Специальный государственный фонд, а также за возврат из бюджета, Национального фонда Республики Казахстан, Фонда компенсации потерпевшим, Фонда поддержки инфраструктуры образования, Специального государственного фонда и (или) зачет излишне (ошибочно) уплаченных сумм в бюджет, Национальный фонд Республики Казахстан, Фонд компенсации потерпевшим, Фонд поддержки инфраструктуры образования, Специальный государственный фонд, неналоговых поступлений, поступлений от продажи основного капитала, трансфертов, сумм погашения бюджетных кредитов, от продажи финансовых активов государства, займов
  kaz: Республикалық бюджетке, Қазақстан Республикасының Ұлттық қорына, Жәбірленушілерге өтемақы қорына, Білім беру инфрақұрылымын қолдау қорына, Арнаулы мемлекеттік қорға түсетін түсімдерді алуға, сондай-ақ салықтық емес түсімдердің, негізгі капиталды сатудан түсетін түсімдердің, трансферттердің, бюджеттік кредиттерді өтеу сомаларының, мемлекеттің қаржы активтерін сатудан түсетін түсімдердің, қарыздардың бюджетке, Қазақстан Республикасының Ұлттық қорына, Жәбірленушілерге өтемақы қорына, Білім беру инфрақұрылымын қолдау қорына, Арнаулы мемлекеттік қорға артық (қате) төленген сомаларын бюджеттен, Қазақстан Республикасының Ұлттық қорынан, Жәбірленушілерге өтемақы қорынан, Білім беру инфрақұрылымын қолдау қорынан, Арнаулы мемлекеттік қордан қайтаруға және (немесе) есепке жатқызуға жауапты уәкілетті органдардың тізбесін бекіту туралы
