    kaz: «Мемлекеттік сатып алуды бірыңғай мемлекеттік сатып алуды ұйымдастырушылар жүзеге асыратын тауарлардың, жұмыстардың, көрсетілетін қызметтердің тізбелерін анықтау туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 29 желтоқсандағы № 1127 бұйрығына өзгерістер мен толықтырулар енгізу туралы
