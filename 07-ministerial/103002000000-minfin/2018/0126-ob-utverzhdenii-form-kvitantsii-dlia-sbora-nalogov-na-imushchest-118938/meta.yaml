act_code: '118938'
requisite: Приказ Министра финансов Республики Казахстан от 26 января 2018 года № 71. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2018 года № 16382. Утратил силу приказом Министра финансов Республики Казахстан от 30 сентября 2025 года № 549 (вводится в действие с 1 января 2026 года и подлежит официальному опубликованию)
title:
  rus: Об утверждении форм квитанции для сбора налогов на имущество, транспортные средства и земельного налога, уплачиваемых налогоплательщиком-физическим лицом и бланка строгой отчетности для принятия наличных денег в случаях, предусмотренных налоговым законодательством
  kaz: Салық төлеуші-жеке тұлға төлейтін мүлік, көлік құралдары салықтарын және жер салығын жинауға арналған квитанцияның және салық заңнамасында көзделген жағдайларда қолма-қол ақша қабылдау үшін қатаң есептілік бланкінің нысандарын бекіту туралы
