  title:
    rus: Об утверждении форм бланков строгой отчетности по уплате в бюджет суммы государственной пошлины для принятия наличных денег в случаях, предусмотренных налоговым законодательством и сбора за проезд автотранспортных средств по территории Республики Казахстан
    kaz: Салық заңнамасында көзделген жағдайларда қолма-қол ақшаны қабылдау үшін мемлекеттік баж және автокөлік құралдарының Қазақстан Республикасының аумағымен жүріп өткені үшін алым сомасын бюджетке төлеу жөніндегі қатаң есептілік бланкілерінің нысанын бекіту туралы
