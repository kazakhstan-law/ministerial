  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 16 марта 2018 года № 376 «Об утверждении Правил представления уполномоченным органом по контролю за использованием и охраной земель в органы государственных доходов сведений по земельным участкам, предназначенным для строительства объектов и не используемым в соответствующих целях или используемым с нарушением законодательства Республики Казахстан, а также по земельным участкам сельскохозяйственного назначения, не используемым в соответствии с земельным законодательством Республики Казахстан»
    kaz: «Жерді пайдалану мен қорғауды бақылау жөніндегі уәкілетті органның мемлекеттік кірістер органдарына объектілер салуға арналған және тиісті мақсаттарда пайдаланылмайтын немесе Қазақстан Республикасының заңнамасы бұзыла отырып пайдаланылатын жер учаскелері бойынша сондай-ақ Қазақстан Республикасының жер заңнамасына сәйкес пайдаланылмайтын ауыл шаруашылығы мақсатындағы жер учаскелері бойынша мәліметтерді ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 16 наурыздағы № 376 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/194167/rus
