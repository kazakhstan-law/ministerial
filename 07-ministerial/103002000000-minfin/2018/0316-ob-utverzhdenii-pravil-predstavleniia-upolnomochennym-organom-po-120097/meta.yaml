act_code: '120097'
requisite: Приказ Министра финансов Республики Казахстан от 16 марта 2018 года № 376. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 марта 2018 года № 16662. Утратил силу  приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил представления уполномоченным органом по контролю за использованием и охраной земель в органы государственных доходов сведений по земельным участкам, предназначенным для строительства объектов и не используемым в соответствующих целях или используемым с нарушением законодательства Республики Казахстан, а также по земельным участкам сельскохозяйственного назначения, не используемым по назначению или используемым с нарушением законодательства Республики Казахстан
  kaz: Жерді пайдалану мен қорғауды бақылау жөніндегі уәкілетті органның мемлекеттік кірістер органдарына объектілер салуға арналған және тиісті мақсаттарда пайдаланылмайтын немесе Қазақстан Республикасының заңнамасы бұзыла отырып пайдаланылатын жер учаскелері бойынша, сондай-ақ мақсаты бойынша пайдаланылмайтын немесе Қазақстан Республикасының заңнамасы бұзыла отырып пайдаланылатын ауыл шаруашылығы мақсатындағы жер учаскелері бойынша мәліметтерді ұсыну қағидаларын бекіту туралы
