title:
  rus: Об утверждении Правил, формы и сроков уведомления органов государственных доходов о получении денег и (или) иного имущества от иностранных государств, международных и иностранных организаций, иностранцев, лиц без гражданства
  kaz: Шет мемлекеттерден, халықаралық және шетелдік ұйымдардан, шетелдіктерден, азаматтығы жоқ адамдардан ақша және (немесе) өзге де мүлік алғаны туралы мемлекеттік кірістер органдарына хабарлау қағидаларын, нысанын және мерзімдерін бекіту туралы
