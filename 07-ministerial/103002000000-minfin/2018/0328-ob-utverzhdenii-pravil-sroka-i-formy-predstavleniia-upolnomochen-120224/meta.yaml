  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 28 марта 2018 года № 412 «Об утверждении Правил, сроков и форм представления уполномоченными государственными органами сведений о налогоплательщиках, имеющих объекты налогообложения и (или) объекты, связанные с налогообложением, а также об объектах налогообложения и (или) объектах, связанных с налогообложением»
    kaz: «Салық салу объектiлерiн және (немесе) салық салуға байланысты объектiлердi есепке алуды және (немесе) тiркеудi жүзеге асыратын уәкiлеттi мемлекеттік органдар салық салу объектiлерi және (немесе) салық салуға байланысты объектiлерi бар салық төлеушiлер туралы, сондай-ақ салық салу объектілері және (немесе) салық салуға байланысты объектілер туралы мәліметтерді ұсыну қағидаларын, мерзімдерін және нысандарын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 28 наурыздағы № 412 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/189630/rus
