act_code: '120224'
requisite: Приказ Министра финансов Республики Казахстан от 28 марта 2018 года № 412. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 марта 2018 года № 16690.  Утратил силу приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил, срока и формы представления уполномоченными государственными органами сведений о налогоплательщиках, имеющих объекты налогообложения и (или) объекты, связанные с налогообложением, а также об объектах налогообложения и (или) объектах, связанных с налогообложением
  kaz: Уәкiлеттi мемлекеттік органдардың салық салу объектiлерi және (немесе) салық салуға байланысты объектiлерi бар салық төлеушiлер туралы, сондай-ақ салық салу объектілері және (немесе) салық салуға байланысты объектілер туралы мәліметтерді ұсыну қағидаларын, мерзімін және нысанын бекіту туралы
