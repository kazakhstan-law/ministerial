act_code: '119644'
requisite: Приказ Министра финансов Республики Казахстан от 26 февраля 2018 года № 294. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 марта 2018 года № 16600
title:
  rus: О некоторых вопросах обеспечения исполнения обязанности по уплате таможенных пошлин, налогов, специальных, антидемпинговых, компенсационных пошлин, а также обеспечения исполнения обязанностей юридического лица, осуществляющего деятельность в сфере таможенного дела, и (или) уполномоченного экономического оператора
  kaz: Кедендік баждарды, салықтарды, арнайы, демпингке қарсы, өтем баждарды төлеу жөніндегі міндеттерді орындауды қамтамасыз етудің, сондай-ақ  кеден ісі саласында қызметін жүзеге асыратын заңды тұлғаның және (немесе) уәкілетті экономикалық оператордың міндеттерінің орындалуын қамтамасыз етудің кейбір мәселелері туралы
