  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 26 февраля 2018 года № 294 «О некоторых вопросах обеспечения исполнения обязанности по уплате таможенных пошлин, налогов, специальных, антидемпинговых, компенсационных пошлин, а также обеспечения исполнения обязанностей юридического лица, осуществляющего деятельность в сфере таможенного дела, и (или) уполномоченного экономического оператора»
    kaz: «Кедендік баждарды, салықтарды, арнайы, демпингке қарсы, өтем баждарды төлеу жөніндегі міндеттерді орындауды қамтамасыз етудің, сондай-ақ кеден ісі саласында қызметін жүзеге асыратын заңды тұлғаның және (немесе) уәкілетті экономикалық оператордың міндеттерінің орындалуын қамтамасыз етудің кейбір мәселелері туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 26 ақпандағы № 294 бұйрығына өзгерістер енгізу туралы
