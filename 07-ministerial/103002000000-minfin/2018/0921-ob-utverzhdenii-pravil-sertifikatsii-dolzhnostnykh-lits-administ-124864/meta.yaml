act_code: '124864'
requisite: Приказ Министра финансов Республики Казахстан от 21 сентября 2018 года № 840. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 сентября 2018 года № 17413. Утратил силу приказом Министра финансов Республики Казахстан от 29 апреля 2025 года № 210 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил сертификации должностных лиц администраторов республиканских бюджетных программ и местных уполномоченных органов по исполнению бюджета области, города республиканского значения, столицы, уполномоченных на ведение бухгалтерского учета и составление финансовой отчетности
  kaz: Республикалық бюджеттік бағдарламалар әкімшілерінің және облыстың, республикалық маңызы бар қаланың, астананың бюджетті атқару жөніндегі жергілікті уәкілетті органдарының бухгалтерлік есепті жүргізуге және қаржылық есептілікті жасауға уәкілеттік берілген лауазымды адамдарын сертификаттау қағидаларын бекіту туралы
