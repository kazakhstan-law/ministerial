title:
  rus: Об утверждении Правил, сроков и формы представления в орган государственных доходов сведений о получении и расходовании денег и (или) иного имущества, полученных от иностранных государств, международных и иностранных организаций, иностранцев, лиц без гражданства
  kaz: Шет мемлекеттерден, халықаралық және шетелдік ұйымдардан, шетелдіктерден, азаматтығы жоқ адамдардан алынған ақшаны және (немесе) өзге де мүлікті алғаны және жұмсағаны туралы мәліметтерді мемлекеттік кірістер органдарына ұсыну қағидаларын, мерзімін және нысанын бекіту туралы
