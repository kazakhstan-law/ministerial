  title:
    rus: О некоторых вопросах, связанных с лицом и (или) структурным подразделением юридического лица, получающими и расходующими деньги и (или) иное имущество от иностранных государств, международных и иностранных организаций, иностранцев и лиц без гражданства, а также об установлении Правил формирования базы данных таких лиц
    kaz: Шет мемлекеттерден, халықаралық және шетелдік ұйымдардан, шетелдіктерден, азаматтығы жоқ адамдардан ақшаны және (немесе) өзге де мүлікті алатын және жұмсайтын тұлғаға және (немесе) заңды тұлғаның құрылымдық бөлімшесіне байланысты кейбір мәселелер, сондай-ақ осындай тұлғалардың деректер базасын қалыптастыру қағидаларын белгілеу туралы
