  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 20 февраля 2018 года № 242 «Об утверждении Правил, сроков и формы представления в орган государственных доходов сведений о получении и расходовании денег и (или) иного имущества, полученных от иностранных государств, международных и иностранных организаций, иностранцев, лиц без гражданства»
    kaz: «Шет мемлекеттерден, халықаралық және шетелдік ұйымдардан, шетелдіктерден, азаматтығы жоқ адамдардан алынған ақшаны және (немесе) өзге де мүлікті алғаны және жұмсағаны туралы мәліметтерді мемлекеттік кірістер органдарына ұсыну қағидаларын, мерзімін және нысанын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 20 ақпандағы № 242 бұйрығына өзгерістер енгізу туралы
