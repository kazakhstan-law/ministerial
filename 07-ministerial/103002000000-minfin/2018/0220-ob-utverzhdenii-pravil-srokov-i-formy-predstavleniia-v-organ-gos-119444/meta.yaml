requisite: Приказ Министра финансов Республики Казахстан от 20 февраля 2018 года № 242. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 марта 2018 года № 16492. Утратил силу приказом Министра финансов Республики Казахстан от 10 ноября 2025 года № 685 (вводится в действие с 1 января 2026 года)
title:
