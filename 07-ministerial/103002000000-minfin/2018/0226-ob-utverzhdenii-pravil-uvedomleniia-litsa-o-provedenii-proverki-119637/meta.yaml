  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 26 февраля 2018 года № 292 «Об утверждении Правил уведомления лица о проведении проверки таможенных, иных документов и (или) сведений в отношении таможенной декларации, документов, подтверждающих сведения, заявленные в таможенной декларации, сведений, заявленных в таможенной декларации и (или) содержащихся в представленных органам государственных доходов документах, начатой после выпуска товаров, а также о результатах проведения такой проверки»
    kaz: «Кедендік декларацияға қатысты кедендік, өзге құжаттарды және (немесе) мәліметтерді, кедендік декларацияда мәлімделген мәліметтерді растайтын құжаттарды, кедендік декларацияларда мәлімделген және (немесе) мемлекеттік кірістер органдарына ұсынылған құжаттардағы мәліметтерді тауарлар шығарылғаннан кейін басталған тексеруді жүргізу туралы, сондай-ақ осындай тексеру жүргізудің нәтижелері туралы тұлғаны хабардар ету қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 26 ақпандағы № 292 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/132635/rus
