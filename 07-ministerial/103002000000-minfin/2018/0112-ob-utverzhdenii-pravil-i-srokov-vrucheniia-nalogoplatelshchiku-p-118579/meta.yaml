requisite: Приказ Министра финансов Республики Казахстан от 12 января 2018 года № 20. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 января 2018 года № 16295. Утратил силу приказом Министра финансов Республики Казахстан от 24 октября 2025 года № 627 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил и сроков вручения налогоплательщику предварительного акта налоговой проверки, предоставления письменного возражения к предварительному акту налоговой проверки, рассмотрения такого возражения, а также категории налогоплательщиков, в отношении которых применяются нормы по предварительному акту налоговой проверки
  kaz: Салық төлеушіге салықтық тексерудің алдын ала актісін табыс ету, салықтық тексерудің алдын ала актісіне жазбаша қарсылық беру, осындай қарсылықты қарау қағидалары мен мерзімдерін, сондай-ақ оларға қатысты салықтық тексерудің алдын ала актісі бойынша нормалар қолданылатын салық төлеушiлер санаттарын бекіту туралы
