  requisite: Приказ Министра финансов Республики Казахстан от 11 мая 2021 года № 445. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 мая 2021 года № 22741. Утратил силу приказом Министра финансов Республики Казахстан от 24 октября 2025 года № 627 (вводится в действие с 1 января 2026 года)
  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 12 января 2018 года № 20 «Об утверждении Правил и сроков вручения налогоплательщику предварительного акта налоговой проверки, предоставления письменного возражения к предварительному акту налоговой проверки, рассмотрения такого возражения, а также категории налогоплательщиков, в отношении которых применяются нормы по предварительному акту налоговой проверки»
    kaz: «Салық төлеушіге салықтық тексерудің алдын ала актісін табыс ету, салықтық тексерудің алдын ала актісіне жазбаша қарсылық беру, осындай қарсылықты қарау қағидалары мен мерзімдерін, сондай-ақ оларға қатысты салықтық тексерудің алдын ала актісі бойынша нормалар қолданылатын салық төлеушiлер санаттарын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 12 қаңтардағы № 20 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/155810/rus
