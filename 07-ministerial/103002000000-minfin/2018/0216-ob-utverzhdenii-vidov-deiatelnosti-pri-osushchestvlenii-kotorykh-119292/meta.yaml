act_code: '119292'
requisite: Приказ Министра финансов Республики Казахстан от 16 февраля 2018 года № 206. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 марта 2018 года № 16467. Утратил силу приказом Министра финансов Республики Казахстан от 25 марта 2021 года № 245 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении видов деятельности, при осуществлении которых на территории Республики Казахстан налогоплательщики применяют контрольно-кассовые машины с функцией фиксации и (или) передачи данных при денежных расчетах
  kaz: Салық төлеушілер Қазақстан Республикасының аумағында қызметін жүзеге асырғанда ақшалай есеп айырысулар кезінде деректерді тіркеу және (немесе) беру функциясы бар бақылау-касса машиналарын қолданатын қызмет түрлерін бекіту туралы
