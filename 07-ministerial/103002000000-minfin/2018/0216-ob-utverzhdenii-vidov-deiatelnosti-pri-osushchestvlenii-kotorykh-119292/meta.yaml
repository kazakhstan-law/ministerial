  requisite: Приказ Министра финансов Республики Казахстан от 27 ноября 2018 года № 1029. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 декабря 2018 года № 17887. Утратил силу приказом Министра финансов Республики Казахстан от 25 марта 2021 года № 245 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения и дополнений в приказ Министра финансов Республики Казахстан от 16 февраля 2018 года № 206 «Об утверждении видов деятельности, при осуществлении которых на территории Республики Казахстан налогоплательщики применяют контрольно-кассовые машины с функцией фиксации и (или) передачи данных при денежных расчетах»
    kaz: «Салық төлеушілер Қазақстан Республикасының аумағында қызметін жүзеге асырғанда ақшалай есеп айырысулар кезінде деректерді тіркеу және (немесе) беру функциясы бар бақылау-касса машиналарын қолданатын қызмет түрлерін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 16 ақпандағы № 206 бұйрығына өзгеріс және толықтырулар енгізу туралы
