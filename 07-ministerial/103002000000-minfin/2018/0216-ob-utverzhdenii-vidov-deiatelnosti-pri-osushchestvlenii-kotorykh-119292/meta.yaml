  title:
    rus: О внесении дополнений в приказ Министра финансов Республики Казахстан от 16 февраля 2018 года № 206 «Об утверждении видов деятельности, при осуществлении которых на территории Республики Казахстан налогоплательщики применяют контрольно-кассовые машины с функцией фиксации и (или) передачи данных при денежных расчетах»
    kaz: «Салық төлеушілер Қазақстан Республикасының аумағында қызметін жүзеге асырғанда ақшалай есеп айырысулар кезінде деректерді тіркеу және (немесе) беру функциясы бар бақылау-касса машиналарын қолданатын қызмет түрлерін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 16 ақпандағы № 206 бұйрығына толықтырулар енгізу туралы
