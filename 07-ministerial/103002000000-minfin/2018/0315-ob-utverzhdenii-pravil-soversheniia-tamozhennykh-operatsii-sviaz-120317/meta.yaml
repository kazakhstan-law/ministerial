  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 15 марта 2018 года № 370 «Об утверждении Правил совершения таможенных операций, связанных с установлением и соблюдением маршрута перевозки товаров, находящихся под таможенным контролем и перевозимых по таможенной территории Евразийского экономического союза без помещения под таможенную процедуру таможенного транзита»
    kaz: «Кедендік транзиттің кедендік рәсімімен орналастырылмай Еуразиялық экономикалық одақтың кедендік аумағы арқылы тасымалданатын және кедендік бақылаудағы ътауарларға қатысты тасымалдау маршрутын белгілеуге және сақтауға байланысты кедендік операцияларды жасау қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 15 наурыздағы № 370 бұйрығына өзгеріс енгізу туралы
