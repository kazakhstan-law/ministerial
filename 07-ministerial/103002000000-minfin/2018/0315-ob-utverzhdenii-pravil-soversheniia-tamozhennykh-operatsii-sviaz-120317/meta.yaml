title:
  rus: Об утверждении Правил совершения таможенных операций, связанных с установлением и соблюдением маршрута перевозки товаров, находящихся под таможенным контролем и перевозимых по таможенной территории Евразийского экономического союза без помещения под таможенную процедуру таможенного транзита
  kaz: Кедендік транзиттің кедендік рәсімімен орналастырылмай Еуразиялық экономикалық одақтың кедендік аумағы арқылы тасымалданатын және кедендік бақылаудағы тауарларға қатысты тасымалдау маршрутын белгілеуге және сақтауға байланысты кедендік операцияларды жасау қағидаларын бекіту туралы
