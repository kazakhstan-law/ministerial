act_code: '119275'
requisite: Приказ Министра финансов Республики Казахстан от 15 февраля 2018 года № 198. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 марта 2018 года № 16480. Утратил силу  приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил направления запросов лицам, осуществлявшим операции с налогоплательщиком (налоговым агентом), в отношении которого органом государственных доходов проводится комплексная или тематическая проверка, с целью получения от указанных лиц дополнительной информации о таких операциях, а также предоставления лицами сведений и (или) документов по таким запросам
  kaz: Мемлекеттік кірістер органы кешенді немесе тақырыптық тексеру жүргізіп отырған салық төлеушімен (салық агентімен) операцияларды жүзеге асырған тұлғаларға, көрсетілген тұлғалардан осындай операциялар туралы қосымша ақпарат алу мақсатында сұрау салулар, сондай-ақ осындай сұрау салулар бойынша тұлғалардың мәліметтерді және (немесе) құжаттарды ұсыну қағидаларын бекіту туралы
