act_code: '119047'
requisite: Приказ Министра финансов Республики Казахстан от 6 февраля 2018 года № 129. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 февраля 2018 года № 16407. Утратил силу приказом и.о. Министра финансов Республики Казахстан от 3 апреля 2026 года № 221 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования и распространяется на правоотношения возникшие с 1 января 2026 года)
title:
  rus: Об утверждении перечня услуг по ремонту товара, ввезенного на территорию Республики Казахстан с территории государств-членов Евразийского экономического союза, включая его восстановление, замену составных частей, обороты по реализации которых освобождаются от налога на добавленную стоимость в Евразийском экономическом союзе
  kaz: Еуразиялық экономикалық одақта өткізу жөніндегі айналымдары қосылған құн салығынан босатылатын Қазақстан Республикасының аумағына Еуразиялық экономикалық одаққа мүше мемлекеттердің аумағынан әкелінген тауарды жөндеу бойынша, оны қалпына келтіруді, құрамдас бөліктерін ауыстыруды қоса алғанда, қызметтердің тізбесін бекіту туралы
