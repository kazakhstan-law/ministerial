act_code: '119498'
requisite: Приказ Министра финансов Республики Казахстан от 26 февраля 2018 года № 289. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 марта 2018 года № 16578. Утратил силу  приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении форм сведений о плательщиках платы за эмиссии в окружающую среду и объектах обложения, выданных экологических разрешениях, установленных нормативах эмиссий в окружающую среду, изменениях, внесенных в экологические разрешения и в установленные нормативы эмиссий в окружающую среду, а также по природопользователям, касающиеся временного хранения ими отходов производства и потребления, и о фактических объемах эмиссий в окружающую среду, установленных в ходе осуществления проверок по соблюдению экологического законодательства Республики Казахстан (государственный экологический контроль) с учетом обжалования результатов таких проверок в соответствии с законами Республики Казахстан и правил представления сведений о фактических объемах эмиссий в окружающую среду, установленных в ходе осуществления проверок по соблюдению экологического законодательства Республики Казахстан (государственный экологический контроль) с учетом обжалования результатов таких проверок в соответствии с законами Республики Казахстан
  kaz: Қоршаған ортаға эмиссия үшін төлемақы төлеушілер және салық салу объектілері, берілген экологиялық рұқсаттар, қоршаған ортаға эмиссиялардың белгіленген нормативтері, экологиялық рұқсаттарға және қоршаған ортаға эмиссиялардың белгіленген нормативтеріне енгізілген өзгерістер, сондай-ақ өндіріс және тұтыну қалдықтарын уақытша сақтауға қатысты табиғат пайдаланушылар бойынша, және Қазақстан Республикасының заңдарына сәйкес Қазақстан Республикасының экологиялық заңнамасын (мемлекеттік экологиялық бақылау) сақтау бойынша тексерулердің нәтижелеріне шағымдануды есепке ала отырып осындай тексерулерді жүзеге асыру барысында белгіленген қоршаған ортаға эмиссиялардың нақты көлемдері туралы мәліметтердің нысандарын және Қазақстан Республикасының заңдарына сәйкес Қазақстан Республикасының экологиялық заңнамасын (мемлекеттік экологиялық бақылау) сақтау бойынша тексерулердің нәтижелеріне шағымдануды есепке ала отырып осындай тексерулерді жүзеге асыру барысында белгіленген қоршаған ортаға эмиссиялардың нақты көлемдері туралы мәліметтерді табыс етудің қағидаларын бекіту туралы
