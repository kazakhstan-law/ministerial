title:
  rus: Об утверждении Правил подтверждения наличия оснований для предоставления отсрочки или рассрочки уплаты ввозных таможенных пошлин и форм решений о предоставлении отсрочки или рассрочки уплаты ввозных таможенных пошлин и об отказе в их предоставлении
  kaz: Кедендік әкелу баждарын төлеуді кейінге қалдыруды немесе бөліп төлеуді ұсыну үшін негіздемелердің растау қағидаларын және кедендік әкелу баждарын төлеуді кейінге қалдыруды немесе бөліп төлеуді беру немесе оны беруден бас тарту туралы шешімнің нысандарын бекіту туралы
