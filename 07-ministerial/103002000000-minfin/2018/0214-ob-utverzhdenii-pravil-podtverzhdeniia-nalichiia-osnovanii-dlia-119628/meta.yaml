  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 14 февраля 2018 года № 180 «Об утверждении Правил подтверждения наличия оснований для предоставления отсрочки или рассрочки уплаты ввозных таможенных пошлин и форм решений о предоставлении отсрочки или рассрочки уплаты ввозных таможенных пошлин и об отказе в их предоставлении»
    kaz: «Кедендік әкелу баждарын төлеуді кейінге қалдыруды немесе бөліп төлеуді ұсыну үшін негіздемелердің растау қағидаларын және кедендік әкелу баждарын төлеуді кейінге қалдыруды немесе бөліп төлеуді беру немесе оны беруден бас тарту туралы шешімнің нысандарын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 14 ақпандағы № 180 бұйрығына өзгерістер енгізу туралы
