act_code: '118853'
requisite: Приказ Министра финансов Республики Казахстан от 23 января 2018 года № 45. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 февраля 2018 года № 16362. Утратил силу приказом Министра финансов Республики Казахстан от 21 апреля 2021 года № 376 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и сроков вручения проверяемому лицу предварительного акта выездной таможенной проверки, предоставления письменного возражения к предварительному акту выездной таможенной проверки, рассмотрения органом государственных доходов такого возражения, а также категории проверяемых лиц, в отношении которых применяются нормы по предварительному акту выездной таможенной проверки
  kaz: Көшпелі кедендік тексерудің алдын ала актісін тексерілетін тұлғаға табыс ету, көшпелі кедендік тексерудің алдын ала актісіне жазбаша қарсылықты ұсыну, мемлекеттік кірістер органының мұндай қарсылықты қарау қағидалары мен мерзімдерін, сондай-ақ оларға қатысты көшпелі кедендік тексерудің алдын ала актісі бойынша нормалар қолданылатын тексерілетін тұлғалардың санаттарын бекіту туралы
