  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 23 января 2018 года № 45 «Об утверждении Правил и сроков вручения проверяемому лицу предварительного акта выездной таможенной проверки, предоставления письменного возражения к предварительному акту выездной таможенной проверки, рассмотрения органом государственных доходов такого возражения, а также категорий проверяемых лиц, в отношении которых применяются нормы по предварительному акту выездной таможенной проверки»
    kaz: «Көшпелі кедендік тексерудің алдын ала актісін тексерілетін тұлғаға табыс ету, көшпелі кедендік тексерудің алдын ала актісіне жазбаша қарсылықты ұсыну, мемлекеттік кірістер органының мұндай қарсылықты қарау қағидалары мен мерзімдерін, сондай-ақ оларға қатысты көшпелі кедендік тексерудің алдын ала актісі бойынша нормалар қолданылатын тексерілетін тұлғалардың санаттарын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 23 қаңтардағы № 45 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/146224/rus
