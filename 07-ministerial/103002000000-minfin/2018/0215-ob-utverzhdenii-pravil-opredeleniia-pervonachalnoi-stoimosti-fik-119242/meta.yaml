act_code: '119242'
requisite: Приказ Министра финансов Республики Казахстан от 15 февраля 2018 года № 195. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 марта 2018 года № 16485. Утратил силу  приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил определения первоначальной стоимости фиксированных активов, получаемых концессионером (правопреемником или юридическим лицом, специально созданным исключительно концессионером для реализации договора концессии) по договору концессии, а также стоимости, уменьшающей стоимостные балансы концессионера II, III и IV групп при передаче фиксированных активов концеденту при прекращении договора концессии
  kaz: Концессионер (концессия шартын іске асыру үшін тек қана концессионер арнайы құрған құқықтық мирасқор немесе заңды тұлға) концессия шарты бойынша алатын, тіркелген активтердің бастапқы құнын, сондай-ақ концессия шарты тоқтатылған кезде концессионер тіркелген активтерді концедентке беру кезінде II, III және IV топтар концессионерінің құндық теңгерімін азайтатын құнын айқындау қағидаларын бекіту туралы
