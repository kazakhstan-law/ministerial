requisite: Приказ Министра финансов Республики Казахстан от 23 февраля 2018 года № 282. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 марта 2018 года № 16559
title:
  rus: Об утверждении Правил хранения иных товаров совместно с товарами, находящимися на временном хранении, в сооружениях, помещениях (частях помещений) и (или) на открытых площадках (частях открытых площадок) уполномоченного экономического оператора и принятия им товаров от перевозчика
  kaz: Уәкілетті экономикалық оператордың құрылысжайларында, үй-жайларында (үй-жайларының бөлiктерінде) және (немесе) ашық алаңдарында (ашық алаңдарының бөліктерінде) уақытша сақтаудағы тауарлармен бірге өзге де тауарларды сақтау және оның тауарларды тасымалдаушыдан қабылдау қағидаларын бекіту туралы
