title:
  rus: Об утверждении Правил подтверждения размещения товаров в местах временного хранения, совершения органами государственных доходов таможенных операций, связанных с регистрацией документов, представленных для помещения товаров на временное хранение, и выдачей подтверждения об их регистрации
  kaz: Тауарларды уақытша сақтау орындарына орналастыруды растау, мемлекеттік кірістер органдарының тауарларды уақытша сақтауға орналастыру үшін ұсынылған құжаттарды тіркеуге және олардың тіркелгені туралы растаманы беруге байланысты кедендік операцияларды жасау қағидаларын бекіту туралы
