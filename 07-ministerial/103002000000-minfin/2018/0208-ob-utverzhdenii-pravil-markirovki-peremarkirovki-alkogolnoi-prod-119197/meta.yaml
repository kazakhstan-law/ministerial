  title:
    rus: Об утверждении Правил маркировки (перемаркировки) алкогольной продукции, за исключением вина наливом (виноматериала), пива и пивного напитка, учетно-контрольными марками, а также формы, содержания и элементов защиты учетно-контрольных марок и Правил получения, учета, хранения, выдачи учетно-контрольных марок и представления обязательства, отчета производителя об уплате акциза и (или) импортера о целевом использовании учетно-контрольных марок, а также учета и размера обеспечения такого обязательства
    kaz: Толысылған шарапты (шарап материалын), сыра мен сыра сусынын қоспағанда, алкоголь өнімін есепке алу-бақылау маркаларымен таңбалау (қайта таңбалау) қағидаларын, сондай-ақ есепке алу-бақылау маркаларының нысандарын, мазмұны мен қорғау элементтерін және  Есепке алу-бақылау маркаларын алу, есепке алу, сақтау, беру және өндірушінің акцизді төлеу туралы және (немесе) импорттаушының есепке алу-бақылау маркаларын нысаналы пайдалану туралы міндеттемесін, есебін ұсыну, сондай-ақ осындай міндеттемені есепке алу қағидаларын және қамтамасыз ету мөлшерін бекіту туралы
  link: https://zan.gov.kz/client/#!/doc/216695/rus
