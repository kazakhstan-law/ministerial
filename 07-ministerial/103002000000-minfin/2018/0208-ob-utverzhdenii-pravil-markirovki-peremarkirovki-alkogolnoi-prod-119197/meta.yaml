title:
  rus: Об утверждении Правил маркировки (перемаркировки) алкогольной продукции, за исключением вина наливом и пивоваренной продукции, учетно-контрольными марками, а также формы, содержание и элементы защиты учетно-контрольных марок
  kaz: Толысылған шарап және сыра қайнату өнімдерін қоспағанда, алкоголь өнімін есепке алу-бақылау маркаларымен таңбалау (қайта таңбалау) қағидаларын, сондай-ақ есепке алу-бақылау маркаларының нысанын, мазмұнын және қорғау элементтерін бекіту туралы
