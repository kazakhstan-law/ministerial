  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 8 февраля 2018 года № 143 «Об утверждении Правил маркировки (перемаркировки) алкогольной продукции, за исключением вина наливом (виноматериал) и пивоваренной продукции, учетно-контрольными марками, а также формы, содержание и элементы защиты учетно-контрольных марок»
    kaz: «Толысылған шарап (шарап материалын) және сыра қайнату өнімдерін қоспағанда, алкоголь өнімін есепке алу-бақылау маркаларымен таңбалау (қайта таңбалау) қағидаларын, сондай-ақ есепке алу-бақылау маркаларының нысанын, мазмұнын және қорғау элементтерін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 8 ақпандағы № 143 бұйрығына өзгерістер енгізу туралы
