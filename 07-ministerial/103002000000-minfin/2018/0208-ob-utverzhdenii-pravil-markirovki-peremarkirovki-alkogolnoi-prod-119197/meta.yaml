  code: '149208'
  requisite: Приказ Министра финансов Республики Казахстан от 30 ноября 2020 года № 1154. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 декабря 2020 года № 21701.  Утратил силу приказом Министра финансов Республики Казахстан от 7 ноября 2025 года № 682 (вводится в действие с 1 января 2026 года)
  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 8 февраля 2018 года № 143 «Об утверждении Правил маркировки (перемаркировки) алкогольной продукции, за исключением виноматериала, пива и пивного напитка, учетно-контрольными марками и табачных изделий акцизными марками, а также форм, содержания и элементов защиты акцизных и учетно-контрольных марок»
    kaz: «Шарап материалын, сыраны және сыра сусынын қоспағанда, алкоголь өнімін есепке алу-бақылау маркаларымен және темекі бұйымдарын акциздік маркалармен таңбалау (қайта таңбалау) қағидаларын, сондай-ақ акциздік және есепке алу-бақылау маркаларының нысанын, мазмұнын және қорғау элементтерін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 8 ақпандағы № 143 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/149208/rus
