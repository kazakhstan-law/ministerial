act_code: '118936'
requisite: Приказ Министра финансов Республики Казахстан от 1 февраля 2018 года № 98. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2018 года № 16388. Утратил силу приказом Министра финансов Республики Казахстан от 2 октября 2025 года № 562 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил организации и ведения налогового учета индивидуальными предпринимателями, на которых в соответствии с Законом Республики Казахстан от 28 февраля 2007 года «О бухгалтерском учете и финансовой отчетности» не возложена обязанность по ведению бухгалтерского учета и составлению финансовой отчетности
  kaz: «Бухгалтерлік есеп пен қаржылық есептілік туралы» 2007 жылғы 28 ақпандағы Қазақстан Республикасының Заңына сәйкес бухгалтерлік есепке алуды жүргізу және қаржылық есептілікті жасау жөніндегі міндет жүктелмеген дара кәсіпкерлердің салықтық есепке алуды ұйымдастыру және жүргізу қағидаларын бекіту туралы
