  title:
    rus: О признании утратившим силу приказа Министра финансов Республики Казахстан от 2 февраля 2018 года № 116 «Об утверждении Правил, сроков и формы представления реестра выписанных документов на выпуск структурным подразделением уполномоченного органа в области государственного материального резерва товаров из государственного материального резерва»
    kaz: «Мемлекеттік материалдық резервтен тауарларды мемлекеттік материалдық резерв саласындағы уәкілетті органның құрылымдық бөлімшесі тауарларды шығаруға жазып берілген құжаттар тізілімін ұсыну қағидаларын, мерзімдерін және нысанын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 2 ақпандағы № 116 бұйрығының күші жойылды деп тану туралы
