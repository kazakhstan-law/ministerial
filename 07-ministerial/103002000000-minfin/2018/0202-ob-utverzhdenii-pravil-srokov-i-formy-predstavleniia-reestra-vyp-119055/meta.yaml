act_code: '119055'
requisite: Приказ Министра финансов Республики Казахстан от 2 февраля 2018 года № 116. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 февраля 2018 года № 16398. Утратил силу приказом Министра финансов Республики Казахстан от 30 ноября 2018 года № 1044 (вводится в действие с 1 января 2019 года)
title:
  rus: Об утверждении Правил, сроков и формы представления реестра выписанных документов на выпуск структурным подразделением уполномоченного органа в области государственного материального резерва товаров из государственного материального резерва
  kaz: Мемлекеттік материалдық резервтен тауарларды мемлекеттік материалдық резерв саласындағы уәкілетті органның құрылымдық бөлімшесі тауарларды шығаруға жазып берілген құжаттар тізілімін ұсыну қағидаларын, мерзімдерін және нысанын бекіту туралы
