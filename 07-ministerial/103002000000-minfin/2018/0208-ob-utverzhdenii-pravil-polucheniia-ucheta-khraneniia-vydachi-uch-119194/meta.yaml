act_code: '119194'
requisite: Приказ Министра финансов Республики Казахстан от 8 февраля 2018 года № 144. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 февраля 2018 года № 16437. Утратил силу приказом Министра финансов Республики Казахстан от 7 ноября 2025 года № 682 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил получения, учета, хранения, выдачи учетно-контрольных марок и представления обязательства, отчета производителя и (или) импортера о целевом использовании учетно-контрольных марок при производстве и (или) импорте в Республику Казахстан алкогольной продукции, а также порядок учета и размер обеспечения такого обязательства
  kaz: Есепке алу-бақылау маркаларын алу, есепке алу, сақтау, беру және өндірушінің және (немесе) импорттаушының алкоголь өнiмiн өндіру және (немесе) Қазақстан Республикасына импорттау кезiнде есепке алу-бақылау маркаларын нысаналы пайдалану туралы мiндеттемесiн, есебiн ұсыну қағидаларын, сондай-ақ осындай мiндеттеменi есепке алу тәртiбi мен қамтамасыз ету мөлшерiн бекіту туралы
