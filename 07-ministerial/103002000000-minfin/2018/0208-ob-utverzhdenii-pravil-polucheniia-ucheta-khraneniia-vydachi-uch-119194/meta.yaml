caused_by:
  code: '129805'
  requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 14 марта 2019 года № 236. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 марта 2019 года № 18414.  Утратил силу приказом Министра финансов Республики Казахстан от 7 ноября 2025 года № 682 (вводится в действие с 1 января 2026 года)
  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 8 февраля 2018 года № 144 «Об утверждении Правил получения, учета, хранения, выдачи акцизных и учетно-контрольных марок и представления обязательства, отчета импортеров о целевом использовании учетно-контрольных марок при импорте алкогольной продукции в Республику Казахстан, а также учета и размера обеспечения такого обязательства»
    kaz: «Акциздiк және есепке алу-бақылау маркаларын алу, есепке алу, сақтау, беру және импорттаушылардың Қазақстан Республикасына алкоголь өнiмiн импорттау кезiнде есепке алу-бақылау маркаларын нысаналы пайдалану туралы мiндеттемесiн, есебiн ұсыну, сондай-ақ осындай мiндеттеменi есепке алу қағидаларын және қамтамасыз ету мөлшерiн бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 8 ақпандағы № 144 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/129805/rus
