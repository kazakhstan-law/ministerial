  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 8 февраля 2018 года № 144 «Об утверждении Правил получения, учета, хранения, выдачи учетно-контрольных марок и представления обязательства, отчета производителя и (или) импортера о целевом использовании учетно-контрольных марок при производстве и (или) импорте в Республику Казахстан алкогольной продукции, а также порядок учета и размер обеспечения такого обязательства»
    kaz: «Есепке алу-бақылау маркаларын алу, есепке алу, сақтау, беру және өндірушінің және (немесе) импорттаушының алкоголь өнiмiн өндіру және (немесе) Қазақстан Республикасына импорттау кезiнде есепке алу-бақылау маркаларын нысаналы пайдалану туралы мiндеттемесiн, есебiн ұсыну қағидаларын, сондай-ақ осындай мiндеттеменi есепке алу тәртiбi мен қамтамасыз ету мөлшерiн бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 8 ақпандағы № 144 бұйрығына өзгерістер енгізу туралы
