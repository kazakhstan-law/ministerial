    kaz: «Қазақстан Республикасының Еуразиялық экономикалық одаққа мүше болып табылмайтын мемлекеттермен арадағы тауарлармен сыртқы сауданың кедендік статистикасын жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 14 ақпандағы № 182 бұйрығына өзгерістер енгізу туралы
