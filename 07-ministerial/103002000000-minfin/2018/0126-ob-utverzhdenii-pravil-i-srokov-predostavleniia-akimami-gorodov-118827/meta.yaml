act_code: '118827'
requisite: Приказ Министра финансов Республики Казахстан от 26 января 2018 года № 72. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 февраля 2018 года № 16351. Утратил силу  приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил и сроков предоставления акимами городов районного значения, поселков, сел, сельских округов в налоговый орган отчетов об использовании квитанций по сбору налогов на имущество, транспортные средства и земельного налога, уплачиваемых налогоплательщиком - физическим лицом, а также сдачи сумм налогов в банк второго уровня или организацию, осуществляющую отдельные виды банковских операций
  kaz: Аудандық маңызы бар қалалар, кенттер, ауылдар, ауылдық округтер әкімдерінің салық органына салық төлеуші-жеке тұлға төлейтін мүлік, көлік құралдары салықтары мен жер салығын жинау жөніндегі квитанцияларды пайдалану, сондай-ақ салықтардың сомаларын екінші деңгейдегі банкке немесе банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымға тапсыру туралы есептерді ұсыну қағидаларын және мерзімдерін бекіту туралы
