title:
  rus: Об утверждении Правил регистрации предварительных решений о классификации товара в журнале регистрации предварительных решений о классификации товара, формы журнала регистрации предварительных решений о классификации товара и формы заявления лица о принятии предварительного решения о классификации товара
  kaz: Тауарды сыныптау туралы алдын ала шешімдерді тіркеу журналында тауарды сыныптау туралы алдын ала шешімдерді тіркеу қағидаларын, тауарды сыныптау туралы алдын ала шешімдерді тіркеу журналының нысанын және тұлғаның тауарды сыныптау туралы алдын ала шешімді қабылдау туралы өтінішінің нысанын бекіту туралы
