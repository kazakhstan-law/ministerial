  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 16 февраля 2018 года № 200 «Об утверждении Правил регистрации предварительных решений о классификации товаров в журнале регистрации предварительных решений о классификации товаров, а также формы заявления лица о принятии предварительного решения о классификации товара»
    kaz: «Тауарларды сыныптау туралы алдын ала шешімдерді тіркеу журналында тауарларды сыныптау туралы алдын ала шешімдерді тіркеу қағидаларын, сондай-ақ тұлғаның тауарды сыныптау туралы алдын ала шешімді қабылдау туралы өтінішінің нысанын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 16 ақпандағы № 200 бұйрығына өзгерістер енгізу туралы
