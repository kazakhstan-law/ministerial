act_code: '120223'
requisite: Приказ Министра финансов Республики Казахстан от 26 марта 2018 года № 402. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 марта 2018 года № 16702.  Утратил силу приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил, сроков и форм представления Министерством юстиции Республики Казахстан и его территориальными подразделениями сведений о налогоплательщиках, имеющих объекты налогообложения и (или) объекты, связанные с налогообложением, а также об объектах налогообложения и (или) объектах, связанных с налогообложением
  kaz: Қазақстан Республикасы Әділет министрлігінің және оның аумақтық бөлімшелерінің салық салу объектілері және (немесе) салық салуға байланысты объектілері бар салық төлеушілер туралы, сондай-ақ салық салу объектілері және (немесе) салық салуға байланысты объектілер туралы мәліметтерді ұсыну қағидаларын, мерзімдері мен нысандарын бекіту туралы
