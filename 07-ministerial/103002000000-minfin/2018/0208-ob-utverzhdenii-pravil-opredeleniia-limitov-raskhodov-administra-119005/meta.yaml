    kaz: «Бюджеттік бағдарламалар әкімшілері шығыстарының лимиттерін, жаңа бастамаларға арналған лимиттерді айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 8 ақпандағы № 140 бұйрығына өзгерістер енгізу туралы
