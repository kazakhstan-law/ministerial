title:
  rus: Об утверждении Правил признания факта уничтожения и (или) безвозвратной утраты иностранных товаров вследствие аварии или действия непреодолимой силы либо факта безвозвратной утраты этих товаров в результате естественной убыли при нормальных условиях перевозки (транспортировки) и (или) хранения
  kaz: Шетелдік тауарлардың авария немесе еңсерілмейтін күш әрекетінің салдарынан жойылу және (немесе) қайтарымсыз жоғалу фактісін не осы тауарлардың тасымалдаудың (тасудың) және (немесе) сақтаудың қалыпты жағдайлары кезінде табиғи кему нәтижесінде қайтарымсыз жоғалу фактісін тану қағидаларын бекіту туралы
