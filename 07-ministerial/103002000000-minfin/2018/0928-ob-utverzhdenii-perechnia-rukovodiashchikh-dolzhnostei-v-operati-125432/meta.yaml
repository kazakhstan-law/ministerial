requisite: Приказ Министра финансов Республики Казахстан от 28 сентября 2018 года № 868. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 октября 2018 года № 17586. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 января 2022 года № 9 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Перечня руководящих должностей в оперативно-следственных подразделениях органов государственных доходов (служба экономических расследований), замещаемых на конкурсной основе, Правил и условий проведения конкурса на вышестоящие руководящие должности в оперативно-следственных подразделениях органов государственных доходов (служба экономических расследований)
  kaz: Мемлекеттік кірістер органдарының жедел-тергеу бөлімшелеріне (экономикалық тергеу қызметі) конкурстық негізде орналасатын басшы лауазымдарының тізбесін және Мемлекеттік кірістер органдарының жедел-тергеу бөлімшелерінің (экономикалық тергеу қызметі) жоғары тұрған басшы лауазымдарына конкурс өткізу қағидалары мен шарттарын бекіту туралы
