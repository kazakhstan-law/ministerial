  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 2 февраля 2018 года № 118 «Об утверждении Правил применения системы управления рисками в целях подтверждения достоверности сумм превышения налога на добавленную стоимость и критериев степени риска»
    kaz: «Қосылған құн салығының асып кету сомаларының анықтығын растау мақсатында тәуекелдерді басқару жүйесін қолдану қағидаларын және тәуекел дәрежесінің өлшемшарттарын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2018 жылғы 2 ақпандағы № 118 бұйрығына өзгеріс енгізу туралы
