title:
  rus: Об утверждении Правил применения системы управления рисками в целях подтверждения достоверности сумм превышения налога на добавленную стоимость и критериев степени риска
  kaz: Қосылған құн салығының асып кеткен сомасының анықтығын растау мақсатында тәуекелдерді басқару жүйесін қолдану қағидаларын және тәуекел дәрежесінің өлшемшарттарын бекіту туралы
