act_code: '119421'
requisite: Приказ Министра финансов Республики Казахстан от 12 февраля 2018 года № 157. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 марта 2018 года № 16451. Утратил силу  приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении формы сведений об участниках и параметрах сделки при реализации имущества, находящегося в Республике Казахстан, и акций, долей участия, связанных с недропользованием в Республике Казахстан, включая сведения о нерезиденте, являющимся налоговым агентом
  kaz: Қазақстан Республикасында тұрған мүлікті өткізу кезіндегі мәмілеге қатысушылар және параметрлері және акциялар, салық агенті болып табылатын бейрезидент туралы мәліметті қоса, Қазақстан Республикасында жер қойнауын пайдалануға байланысты қатысу үлесі туралы мәліметтер нысанын бекіту туралы
