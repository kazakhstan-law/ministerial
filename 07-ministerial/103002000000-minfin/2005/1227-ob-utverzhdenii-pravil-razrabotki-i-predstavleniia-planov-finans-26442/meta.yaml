act_code: '26442'
requisite: Приказ Министра финансов Республики Казахстан от 27 декабря 2005 года № 441. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 января 2006 года № 4031. Утратил силу совместным приказом Министра экономического развития и торговли Республики Казахстан от 28 февраля 2012 года № 52 и Министра финансов Республики Казахстан от 7 марта 2012 года № 140
title:
  rus: Об утверждении Правил разработки и представления планов финансово-хозяйственной деятельности государственных предприятий, акционерных обществ (товариществ с ограниченной ответственностью), контрольные пакеты акций (доли участия) которых принадлежат государству, за исключением национальных компаний и организаций, в отношении которых Национальный Банк Республики Казахстан и Управление делами Президента Республики Казахстан осуществляют функции субъекта права республиканской государственной собственности
  kaz: Қазақстан Республикасының Ұлттық Банкі мен Қазақстан Республикасы Президентінің Іс басқармасы республикалық мемлекеттік меншік құқығы субъектісінің функцияларын жүзеге асыратын ұлттық компаниялар мен ұйымдарды қоспағанда, мемлекеттік кәсіпорындардың, акцияларының бақылау пакеттері (қатысу үлестері) мемлекетке тиесілі акционерлік қоғамдардың (жауапкершілігі шектеулі серіктестіктердің) қаржы-шаруашылық қызметтерінің жоспарларын әзірлеу және беру ережесін бекіту туралы
