  requisite: Приказ Министра финансов Республики Казахстан от 31 марта 2008 года № 148. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 апреля 2008 года № 5187. Утратил силу совместным приказом Министра экономического развития и торговли Республики Казахстан от 28 февраля 2012 года № 52 и Министра финансов Республики Казахстан от 7 марта 2012 года № 140
  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 27 декабря 2005 года N 441 "Об утверждении Правил разработки и представления планов финансово-хозяйственной деятельности государственных предприятий, акционерных обществ (товариществ с ограниченной ответственностью), контрольные пакеты акций (доли участия) которых принадлежат государству, за исключением национальных компаний и организаций, в отношении которых Национальный Банк Республики Казахстан и Управление делами Президента Республики Казахстан осуществляют функции субъекта права республиканской государственной собственности"
    kaz: '"Қазақстан Республикасы Ұлттық Банкі және Қазақстан Республикасы Президентінің Іс басқармасы республикалық мемлекеттік меншік құқықтары субъектісінің функцияларын жүзеге асыратын ұлттық компаниялар мен ұйымдарды қоспағанда, акцияларының бақылау пакеті (қатысу үлестері) мемлекетке тиесілі акционерлік қоғамдардың (жауапкершілігі шектеулі серіктестіктердің) қаржы-шаруашылық қызметі жоспарларын әзірлеу және беру ережесін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2005 жылғы 27 желтоқсандағы N 441 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/39308/rus
