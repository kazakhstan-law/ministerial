  title:
    rus: О внесении изменений в приказ Председателя Налогового комитета Министерства финансов Республики Казахстан и в некоторые приказы Министра финансов Республики Казахстан
    kaz: Қазақстан Республикасы Қаржы министрлігі Салық комитеті төрағасының бұйрығына және Қазақстан Республикасы Қаржы министрінің кейбір бұйрықтарына өзгерістер енгізу туралы
