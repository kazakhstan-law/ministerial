    kaz: '"Мемлекеттік бюджет қаражаты есебінен ұсталатын, өткізуден түсетін ақшасы өзінің иелігінде қалатын мемлекеттік мекемелер тауарларының (жұмыстарының, көрсететін қызметтерінің) тізбесі сыныптауышын бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2005 жылғы 12 наурыздағы N 78 бұйрығына өзгерістер енгізу туралы'
