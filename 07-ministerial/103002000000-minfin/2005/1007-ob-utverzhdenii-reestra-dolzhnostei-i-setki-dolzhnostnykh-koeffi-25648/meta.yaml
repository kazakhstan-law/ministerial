requisite: Приказ Министра финансов Республики Казахстан от 7 октября 2005 года № 359. Зарегистрирован в Министерстве юстиции Республики Казахстан от 27 октября 2005 года № 3910. Утратил силу приказом Министра финансов Республики Казахстан от 29 сентября 2009 года № 424
title:
  rus: Об утверждении реестра должностей и сетки должностных коэффициентов местных консультантов по вопросам управления инвестиционными проектами, финансируемыми за счет средств правительственных внешних займов, связанных грантов и средств софинансирования из республиканского бюджета
  kaz: Республикалық бюджеттен бірлесіп қаржыландыру гранттары мен қаражаттарына байланысты үкіметтік сыртқы қарыздар қаражаты есебінен қаржыландырылатын инвестициялық жобаларды басқару мәселелері бойынша жергілікті консультанттардың лауазымдар тізілімін және лауазымдық коэффициенттерінің кестесін бекіту туралы
