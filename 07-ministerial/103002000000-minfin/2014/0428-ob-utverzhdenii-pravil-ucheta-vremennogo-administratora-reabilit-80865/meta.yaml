  title:
    rus: О внесении изменения в приказ Заместителя Премьер-Министра Республики Казахстан - Министра финансов Республики Казахстан от 28 апреля 2014 года № 189 «Об утверждении Правил учета временного администратора, реабилитационного, временного и банкротного управляющих, назначения и отстранения реабилитационного и банкротного управляющих, а также Правил повышения квалификации временного администратора, реабилитационного, временного и банкротного управляющих»
