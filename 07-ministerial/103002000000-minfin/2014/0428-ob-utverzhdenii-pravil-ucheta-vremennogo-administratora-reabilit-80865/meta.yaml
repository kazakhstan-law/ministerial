requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра финансов Республики Казахстан от 28 апреля 2014 года № 189. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 июня 2014 года № 9478. Утратил силу приказом Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 1 апреля 2020 года № 343 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил учета временного администратора, реабилитационного, временного и банкротного управляющих, назначения и отстранения реабилитационного и банкротного управляющих, а также Правил повышения квалификации временного администратора, реабилитационного, временного и банкротного управляющих
  kaz: Уақытша әкімшіні, оңалтуды, уақытша және банкроттықты басқарушыларды есепке алу, оңалтуды және банкроттықты басқарушыларды тағайындау және шеттету қағидаларын, сондай-ақ уақытша әкімшінің, оңалтуды, уақытша және банкроттықты басқарушылардың біліктілігін арттыру қағидаларын бекіту туралы
