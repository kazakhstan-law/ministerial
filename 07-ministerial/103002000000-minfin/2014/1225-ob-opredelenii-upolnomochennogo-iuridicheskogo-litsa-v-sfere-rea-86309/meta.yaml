  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 25 декабря 2014 года № 585 «Об определении уполномоченного юридического лица в сфере реализации ограниченного в распоряжении имущества налогоплательщика (налогового агента), плательщика и (или) товаров, задержанных органами государственных доходов»
    kaz: «Салық төлеушінің (салық агентінің), төлеушінің билік етуі шектелген мүлкін және (немесе) мемлекеттік кірістер органдары ұстаған тауарларды өткізу саласындағы уәкілетті заңды тұлғаны айқындау туралы» Қазақстан Республикасы Қаржы министрінің 2014 жылғы 25 желтоқсандағы № 585 бұйрығына өзгерістер енгізу туралы
