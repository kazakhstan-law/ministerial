act_code: '86155'
requisite: Приказ Министра финансов Республики Казахстан от 29 декабря 2014 года № 591. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 января 2015 года № 10108. Утратил силу приказом Министра финансов Республики Казахстан от 6 февраля 2017 года № 80 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил получения, учета, хранения, выдачи акцизных и учетно-контрольных марок и представления обязательства, отчета импортеров о целевом использовании учетно-контрольных марок при импорте алкогольной продукции в Республику Казахстан из стран Таможенного союза, а также учета и размера обеспечения такого обязательства
  kaz: Акциздік және есепке алу-бақылау таңбаларын алу, есепке алу, сақтау, беру және импорттаушылардың Кеден одағы елдерінен Қазақстан Республикасына алкоголь өнімін импорттау кезінде есепке алу-бақылау таңбаларын нысаналы пайдалану туралы міндеттемені, есепті табыс ету, сондай-ақ осындай міндеттемені есепке алу қағидаларын және қамтамасыз ету мөлшерін бекіту туралы
