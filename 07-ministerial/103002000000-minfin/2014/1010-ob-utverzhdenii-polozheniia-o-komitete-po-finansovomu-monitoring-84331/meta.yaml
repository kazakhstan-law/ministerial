    kaz: «Қазақстан Республикасы Қаржы министрлігінің Қаржы мониторингі комитеті туралы ережені бекіту туралы» Қазақстан Республикасы Каржы министрінің 2014 жылғы 10 қазандағы № 430 бұйрығына өзгерістер мен толықтырулар енгізу туралы
