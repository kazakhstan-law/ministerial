  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 27 ноября 2014 года № 526 "Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для аудиторских организаций"
    kaz: '"Аудиторлық ұйымдарға арналған қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау ережелеріне қойылатын талаптарды бекіту туралы" Қазақстан Республикасы Қаржы Министрінің 2014 жылғы 27 қарашадағы № 526 бұйрығына өзгерістер енгізу туралы'
