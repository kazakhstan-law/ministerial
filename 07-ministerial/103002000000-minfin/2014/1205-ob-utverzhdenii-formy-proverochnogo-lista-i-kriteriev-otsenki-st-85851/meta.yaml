act_code: '85851'
requisite: Приказ Министра финансов Республики Казахстан от 5 декабря 2014 года № 544. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 января 2015 года № 10061. Утратил силу приказом Министра финансов Республики Казахстан от 6 сентября 2017 года № 544 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении формы проверочного листа и критериев оценки степени риска республиканских государственных юридических лиц, их филиалов, представительств, при проведении контроля целевого использования государственного имущества
  kaz: Мемлекеттік мүліктің нысаналы пайдаланылуына бақылау жүргізген кезде республикалық мемлекеттік заңды тұлғалардың, олардың филиалдарының, өкілдіктерінің тексеру парағының нысанын және тәуекел дәрежелерін бағалау өлшемдерін бекіту туралы
