    kaz: «Қазақстан Республикасы Қаржы министрлігі «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін жыл сайынғы бағалау әдістемесін бекіту туралы» Қазақстан Республикасы Қаржы Министрінің 2014 жылғы  24 желтоқсандағы № 581 бұйрығына өзгерістер енгізу туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 12 маусымдағы № 358 бұйрығы
