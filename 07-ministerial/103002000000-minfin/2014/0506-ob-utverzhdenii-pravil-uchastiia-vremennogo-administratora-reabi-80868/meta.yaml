requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра финансов Республики Казахстан от 6 мая 2014 года № 208. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июня 2014 года № 9482. Утратил силу приказом Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 29 апреля 2020 года № 432 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
