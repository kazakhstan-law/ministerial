  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 12 марта 2014 года № 114 «Об утверждении перечня персональных данных работников Министерства финансов Республики Казахстан, необходимого и достаточного для выполнения осуществляемых задач»
    kaz: «Қазақстан Республикасы Қаржы министрлігі қызметкерлерінің жүзеге асырылатын міндеттерді орындауға қажетті және жеткілікті дербес деректерінің тізбесін бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қаржы министрінің 2014 жылғы 12 наурыздағы № 114 бұйрығына өзгерістер енгізу туралы
