act_code: '85705'
requisite: Приказ Министра финансов Республики Казахстан от 5 ноября 2014 года № 477. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 декабря 2014 года № 9920. Утратил силу приказом Министра финансов Республики Казахстан от 24 сентября 2020 года № 915 (вводится в действие с 15 ноября 2020 года)
title:
  rus: Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для бухгалтерских организаций и профессиональных бухгалтеров, осуществляющих предпринимательскую деятельность в сфере бухгалтерского учета
  kaz: Бухгалтерлік есеп саласында кәсіпкерлік қызметті жүзеге асыратын бухгалтерлiк ұйымдар мен кәсiби бухгалтерлерге арналған қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы
