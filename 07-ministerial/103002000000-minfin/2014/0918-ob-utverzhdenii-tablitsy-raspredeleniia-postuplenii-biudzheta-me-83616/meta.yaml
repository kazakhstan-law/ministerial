  title:
    rus: О внесении изменений и дополнений в приказы Министра финансов Республики Казахстан от 18 сентября 2014 года № 403 «Некоторые вопросы Единой бюджетной классификации Республики Казахстан» и от 18 сентября 2014 года № 404 «Об утверждении Таблицы распределения поступлений бюджета между уровнями бюджетов, контрольным счетом наличности Национального фонда Республики Казахстан, Фондом компенсации потерпевшим, Фондом поддержки инфраструктуры образования и бюджетами государств – членов Евразийского экономического союза
    kaz: «Қазақстан Республикасының Бірыңғай бюджеттік сыныптамасының кейбір мәселелері туралы» Қазақстан Республикасы Қаржы министрінің 2014 жылғы 18 қыркүйектегі № 403 бұйрығына және «Бюджет түсімдерін бюджеттердің деңгейлері, Қазақстан Республикасы Ұлттық қорының қолма-қол ақшаны бақылау шоты, Жәбірленушілерге өтемақы қорының, Білім беру инфрақұрылымын қолдау қорының және Еуразиялық экономикалық одаққамүше мемлекеттердің бюджеттері арасында бөлу кестесі» Қазақстан Республикасы Қаржы министрінің 2014 жылғы 18 қыркүйектегі № 404 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/178571/rus
