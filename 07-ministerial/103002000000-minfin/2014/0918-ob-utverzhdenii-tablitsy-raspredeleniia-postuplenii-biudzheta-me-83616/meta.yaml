  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 18 сентября 2014 года № 404 "Об утверждении Таблицы распределения поступлений бюджета между уровнями бюджетов и контрольным счетом наличности Национального фонда Республики Казахстан"
    kaz: '"Бюджет түсімдерін бюджеттер деңгейлері мен Қазақстан Республикасы Ұлттық қорының қолма-қол ақшасының бақылау шоты арасында бөлу кестесін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2014 жылғы 18 қыркүйектегі № 404 бұйрығына өзгеріс енгізу туралы'
