  title:
    rus: О внесении изменений и дополнений в приказы Министра финансов Республики Казахстан от 18 сентября 2014 года № 403 «Некоторые вопросы Единой бюджетной классификации Республики Казахстан» и от 18 сентября 2014 года № 404 «Об утверждении Таблицы распределения поступлений бюджета между уровнями бюджетов, контрольным счетом наличности Национального фонда Республики Казахстан, Фондом компенсации потерпевшим, Фондом поддержки инфраструктуры образования, Специальным государственным фондом и бюджетами государств – членов Евразийского экономического союза»
    kaz: Қазақстан Республикасы Қаржы министрінің «Қазақстан Республикасының Бірыңғай бюджеттік сыныптамасының кейбір мәселелері туралы» 2014 жылғы 18 қыркүйектегі № 403 және «Бюджет түсімдерін бюджеттердің деңгейлері, Қазақстан Республикасы Ұлттық қорының қолма-қол ақшаны бақылау шоты, Жәбірленушілерге өтемақы қоры, Білім беру инфрақұрылымын қолдау қоры, Арнаулы мемлекеттік қор және Еуразиялық экономикалық одаққа мүше мемлекеттердің бюджеттері арасында бөлу кестесі» 2014 жылғы 18 қыркүйектегі № 404 бұйрықтарына өзгертулер және толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/195702/rus
