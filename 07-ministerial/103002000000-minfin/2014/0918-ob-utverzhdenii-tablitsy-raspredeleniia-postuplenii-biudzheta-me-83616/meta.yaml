  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 18 сентября 2014 года № 404 «Об утверждении Таблицы распределения поступлений бюджета между уровнями бюджетов, контрольным счетом наличности Национального фонда Республики Казахстан и контрольным счетом наличности Фонда компенсации потерпевшим»
    kaz: «Бюджет түсімдерін бюджеттердің деңгейлері, Қазақстан Республикасы Ұлттық қорының қолма-қол ақшаны бақылау шоты мен Жәбірленушілерге өтемақы қорының қолма-қол ақшасының бақылау шоты арасында бөлу кестесін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2014 жылғы 18 қыркүйектегі № 404 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/157613/rus
