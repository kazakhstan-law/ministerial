act_code: '83616'
requisite: Приказ Министра финансов Республики Казахстан от 18 сентября 2014 года № 404. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 сентября 2014 года № 9760. Утратил силу приказом Министра финансов Республики Казахстан от 18 апреля 2025 года № 180 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Таблицы распределения поступлений бюджета между уровнями бюджетов, контрольным счетом наличности Национального фонда Республики Казахстан, Фондом компенсации потерпевшим, Фондом поддержки инфраструктуры образования, Специальным государственным фондом и бюджетами государств – членов Евразийского экономического союза
  kaz: Бюджет түсімдерін бюджеттердің деңгейлері, Қазақстан Республикасы Ұлттық қорының қолма-қол ақшаны бақылау шоты, Жәбірленушілерге өтемақы қоры, Білім беру инфрақұрылымын қолдау қоры, Арнаулы мемлекеттік қор және Еуразиялық экономикалық одаққа мүше мемлекеттердің бюджеттері арасында бөлу кестесі
