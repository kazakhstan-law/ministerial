act_code: '79424'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра финансов Республики Казахстан от 2 апреля 2014 года № 155. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 апреля 2014 года № 9336. Утратил силу приказом Министра финансов Республики Казахстан от 5 января 2015 года № 6
title:
  rus: Об утверждении квалификационных требований к административным государственным должностям корпуса "Б" центрального аппарата Министерства финансов Республики Казахстан, заместителей председателей Комитетов и руководителей территориальных органов Комитетов Министерства финансов Республики Казахстан
  kaz: Қазақстан Республикасы Қаржы министрлігі орталық аппаратының, Қазақстан Республикасы Қаржы министрлігі Комитеттері төрағаларының орынбасарлары мен Комитеттердің аумақтық органдарының басшылары "Б" корпусының мемлекеттік әкімшілік лауазымдарына қойылатын біліктілік талаптарын бекіту туралы
