  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 31 декабря 2014 года № 604 «Об утверждении форм налоговых заявлений» и признании утратившим силу приказа Министра финансов Республики Казахстан от 24 декабря 2015 года № 678 «Об утверждении формы свидетельства о государственной регистрации индивидуального предпринимателя (совместного индивидуального предпринимательства) и признании утратившим силу приказа Министра финансов Республики Казахстан от 30 декабря 2014 года № 598 «Об утверждении формы свидетельства о государственной регистрации индивидуального предпринимателя»
    kaz: «Салықтық өтініштердің нысандарын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2014 жылғы 31 желтоқсандағы № 604 бұйрығына өзгерістер енгізу және «Дара кәсіпкерді (бірлескен дара кәсіпкерлікті) мемлекеттік тіркеу туралы куәліктің нысанын бекіту туралы және «Дара кәсіпкерді мемлекеттік тіркеу туралы куәліктің нысанын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2014 жылғы 30 желтоқсандағы № 598 бұйрығының күші жойылды деп тану туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 24 желтоқсандағы № 678 бұйрығының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/108724/rus
