act_code: '78857'
requisite: Приказ Заместителя Премьер-Министра Республики Казахстан - Министра финансов Республики Казахстан от 26 февраля 2014 года № 77. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 марта 2014 года № 9280. Утратил силу приказом Министра Фининсов Республики Казахстан от 28 декабря 2015 года № 693
title:
  rus: Об утверждении Правил сбора, обобщения и анализа отчетности с учетом информации о закупках у отечественных товаропроизводителей, включенных в интегрированную с веб-порталом государственных закупок базу данных товаров, работ, услуг и их поставщиков, предусмотренную законодательством Республики Казахстан о государственной поддержке индустриально-инновационной деятельности
  kaz: Қазақстан Республикасының индустриалдық - инновациялық қызметін мемлекеттік қолдау туралы заңнамасында көзделген, мемлекеттік сатып алу веб-порталымен интеграцияланған тауарлар, жұмыстар, көрсетілетін қызметтер мен оларды жеткізушілердің дерекқорына енгізілген отандық тауар өндірушілерден сатып алу туралы ақпаратты ескере отырып, есептілікті жинау, қорыту және талдау қағидасын бекіту туралы
