  title:
    rus: О внесении изменений и дополнения в приказ Заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 26 февраля 2014 года № 77 «Об утверждении Правил сбора, обобщения и анализа отчетности с учетом информации о закупках у отечественных товаропроизводителей, включенных в интегрированную с веб-порталом государственных закупок базу данных товаров, работ, услуг и их поставщиков, предусмотренную законодательством Республики Казахстан о государственной поддержке индустриально-инновационной деятельности»
    kaz: «Қазақстан Республикасының индустриалдық - инновациялық қызметін мемлекеттік қолдау туралы заңнамасында көзделген, мемлекеттік сатып алу веб-порталымен интеграцияланған тауарлар, жұмыстар, көрсетілетін қызметтер мен оларды жеткізушілердің дерекқорына енгізілген отандық тауар өндірушілерден сатып алу туралы ақпаратты ескере отырып, есептілікті жинау, қорыту және талдау қағидасын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Қазақстан Республикасы Қаржы Министрінің 2014 жылғы 26 ақпандағы № 77 бұйрығына өзгерістер мен толықтыруды енгізу туралы
