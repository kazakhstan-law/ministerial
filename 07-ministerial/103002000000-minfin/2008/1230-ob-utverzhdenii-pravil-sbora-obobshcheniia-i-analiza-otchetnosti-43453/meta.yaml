    kaz: '"Тауарларды, жұмыстарды, көрсетілетін қызметтерді сатып алу кезінде қазақстандық мазмұнның көлемі туралы ақпаратты ескере отырып, есептілікті жинау, қорыту және талдау ережесін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2008 жылғы 30 желтоқсандағы № 647 бұйрығына толықтырулар енгізу туралы'
