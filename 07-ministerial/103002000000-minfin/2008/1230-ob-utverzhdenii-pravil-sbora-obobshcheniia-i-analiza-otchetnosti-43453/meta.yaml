title:
  rus: Об утверждении Правил сбора, обобщения и анализа отчетности с учетом информации об объемах местного содержания при закупках товаров, работ, услуг
  kaz: Тауарларды, жұмыстарды, көрсетілетін қызметтерді сатып алу кезінде жергілікті мазмұнның көлемі туралы ақпаратты ескере отырып, есептілікті жинау, қорыту және талдау қағидасын бекіту туралы
