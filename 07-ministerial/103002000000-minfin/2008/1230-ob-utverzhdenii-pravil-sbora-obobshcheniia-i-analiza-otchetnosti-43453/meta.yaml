  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 30 декабря 2008 года № 647 "Об утверждении Правил сбора, обобщения и анализа отчетности с учетом информации об объемах казахстанского содержания при закупках товаров, работ, услуг"
    kaz: «Тауарларды, жұмыстарды, көрсетілетін қызметтерді сатып алу кезінде қазақстандық мазмұнның көлемі туралы ақпаратты ескере отырып, есептілікті жинау, қорыту және талдау ережесін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2008 жылғы 30 желтоқсандағы № 647 бұйрығына өзгерістер енгізу туралы
