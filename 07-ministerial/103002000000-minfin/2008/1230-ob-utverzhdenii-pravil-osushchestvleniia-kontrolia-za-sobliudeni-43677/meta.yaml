act_code: '43677'
requisite: Приказ Министра финансов Республики Казахстан от 30 декабря 2008 года № 639. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 января 2009 года № 5496. Утратил силу приказом Министра финансов Республики Казахстан от 30 декабря 2011 года № 687
title:
  rus: Об утверждении Правил осуществления контроля за соблюдением порядка учета, хранения, оценки, дальнейшего использования и реализации имущества, обращенного (подлежащего обращению) в собственность государства, за полнотой и своевременностью поступления денег в бюджет в случае его реализации, а также порядка передачи имущества, обращенного (подлежащего обращению) в собственность государства
  kaz: Мемлекет меншігіне айналдырылған (айналдырылуы тиіс) мүлікті есепке алу, сақтау, бағалау, одан әрі пайдалану және өткізу тәртібін сақтауға, ол сатылған жағдайда ақшаның бюджетке толық және уақытылы түсуін бақылауды, сондай-ақ мемлекет меншігіне айналдырылған (айналдырылуы тиіс) мүлікті беру тәртібінің сақталуына бақылауды жүзеге асыру ережесін бекіту туралы
