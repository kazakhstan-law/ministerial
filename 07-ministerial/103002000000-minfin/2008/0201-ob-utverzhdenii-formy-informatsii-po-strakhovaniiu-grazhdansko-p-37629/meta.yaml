  title:
    rus: О внесении изменений и дополнений в приказы Министра финансов Республики Казахстан от 26 июля 2006 года № 275 "Об утверждении перечня, форм и периодичности представления отчетности аккредитованными профессиональными аудиторскими организациями" и от 1 февраля 2008 года № 54 "Об утверждении формы информации по страхованию гражданско-правовой ответственности аудиторской организации"
    kaz: Қазақстан Республикасы Қаржы министрінің "Аккредиттелген кәсіби аудиторлық ұйымдардың есептілікті беру тізбесін, нысандары мен мерзімділігін бекіту туралы" 2006 жылғы 26 шілдедегі N 275 және "Аудиторлық ұйымның азаматтық-құқықтық жауапкершілігін сақтандыру жөніндегі ақпарат нысанын бекіту туралы" 2008 жылғы 1 ақпандағы N 54 бұйрықтарына өзгертулер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/45240/rus
