act_code: '43156'
requisite: Приказ Министра финансов Республики Казахстан от 29 декабря 2008 года № 623. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2008 года № 5458. Утратил силу приказом Министра финансов Республики Казахстан от 25 июля 2013 года № 365
title:
  rus: Об утверждении Правил установления сроков для зачета излишне уплаченной суммы налога и другого обязательного платежа в бюджет, пеней в счет погашения налоговой задолженности бездействующего налогоплательщика, обращения налоговых органов в суд и списания сумм излишне уплаченной суммы налога и другого обязательного платежа в бюджет, пени, превышения суммы налога на добавленную стоимость, относимого в зачет, над суммой начисленного налога
  kaz: Салықтың және бюджетке төленетін басқа да міндетті төлемдердің, әрекетсіз салық төлеушінің салықтық берешегін өтеу есебіне өсімпұлдардың артық төленген сомаларын есепке алудың салық органдарының сотқа жүгінуінің және салық және бюджетке төленетін басқа да міндетті төлемдердің, өсімақының артық төленген салық сомасын, есепке жатқызылған қосылған құн салығының есептелген салық сомасынан асып кетуiн әрекетсіз салық төлеушінің дербес шотынан есептен шығару ережелерін бекіту туралы
