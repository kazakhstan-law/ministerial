  kaz: Міндетті зейнетақы жарналарының есептелген, ұсталған (қоса есептелген) және аударылған сомалары, әлеуметтік аударымдардың есептелген және аударылған сомалары бойынша есепті тапсыру нысаны мен Ережелерін бекіту туралы
