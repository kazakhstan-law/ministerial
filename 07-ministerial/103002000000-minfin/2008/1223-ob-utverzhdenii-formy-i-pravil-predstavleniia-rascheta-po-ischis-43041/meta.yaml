  title:
    rus: О внесении дополнений и изменений в приказ Министра финансов Республики Казахстан от 23 декабря 2008 года № 603 "Об утверждении формы и Правил представления Расчета по исчисленным, удержанным (начисленным) и перечисленным суммам обязательных пенсионных взносов, начисленным и перечисленным суммам социальных отчислений"
    kaz: '"Міндетті зейнетақы жарналарының есептелген, ұсталған (қоса есептелген) және аударылған сомалары, әлеуметтік аударымдардың есептелген және аударылған сомалары бойынша Есепті тапсыру Ережелері және нысанын бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2008 жылғы 23 желтоқсандағы № 603 бұйрығына толықтырулар мен өзгерістер енгізу туралы'
