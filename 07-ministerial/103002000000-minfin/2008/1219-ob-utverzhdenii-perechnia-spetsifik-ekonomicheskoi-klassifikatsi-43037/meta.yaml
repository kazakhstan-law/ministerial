    kaz: '"Шығыстардың, оның ішінде жасасқан азаматтық-құқықтық мәмілелерге қатысты тіркеу міндетті болып табылатын шығыс түрлерінің экономикалық сыныптамасы ерекшеліктерінің тізбесін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2008 жылғы 19 желтоқсандағы № 588 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
