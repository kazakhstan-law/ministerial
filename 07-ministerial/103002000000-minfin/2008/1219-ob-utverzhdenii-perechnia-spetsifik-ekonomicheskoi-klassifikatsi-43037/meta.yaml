    kaz: '"Шығыстардың, оның iшiнде жасасқан азаматтық-құқықтық мәмілелерге қатысты тіркеу мiндеттi болып табылатын шығыс түрлерiнiң экономикалық сыныптамасы ерекшелiктерiнiң тiзбесiн бекіту туралы" Қазақстан Республикасы Қаржы министрiнiң 2008 жылғы 19 желтоқсандағы № 588 бұйрығына өзгеріс енгізу туралы'
