    kaz: '"Шығыстардың, оның iшiнде жасасқан азаматтық-құқықтық мәмiлелерге қатысты тiркеу мiндеттi болып табылатын шығыс түрлерiнiң экономикалық сыныптамасы ерекшелiктерiнiң тiзбесiн бекiту туралы" Қазақстан Республикасы Қаржы министрінің 2008 жылғы 19 желтоқсандағы № 588 бұйрығына өзгеріс енгізу туралы'
