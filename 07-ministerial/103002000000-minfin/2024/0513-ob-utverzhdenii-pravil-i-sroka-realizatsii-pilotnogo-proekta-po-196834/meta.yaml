title:
  rus: Об утверждении Правил и срока реализации пилотного проекта по маркировке и прослеживаемости алкогольной продукции (за исключением вина наливом (виноматериал) и пивоваренной продукции) с использованием информационного сервиса «QazTrack»
  kaz: «Qaztrack» ақпараттық сервисін пайдалана отырып, алкоголь өнімін (құйылған шарапты (шарап материалын) және сыра қайнату өнімін қоспағанда) таңбалау және қадағалау жөніндегі пилоттық жобаны жүзеге асыру қағидалары мен мерзімін бекіту туралы
