  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 20 августа 2024 года № 559 «Об утверждении Перечня товаров, работ, услуг ежедневной и (или) еженедельной потребности на период до подведения итогов государственных закупок способом конкурса, аукциона и вступления в силу договора о государственных закупках»
    kaz: «Конкурс, аукцион тәсілімен мемлекеттік сатып алу қорытындылары шығарылғанға және мемлекеттік сатып алу туралы шарт күшіне енгенге дейінгі кезеңге күн сайынғы және (немесе) апта сайынғы қажеттіліктегі тауарлардың, жұмыстардың, көрсетілетін қызметтердің тізбесін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2024 жылғы 20 тамыздағы № 559 бұйрығына өзгеріс енгізу туралы
