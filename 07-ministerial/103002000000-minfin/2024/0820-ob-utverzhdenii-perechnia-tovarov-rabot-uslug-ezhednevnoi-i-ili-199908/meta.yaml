title:
  rus: Об утверждении Перечня товаров, работ, услуг ежедневной и (или) еженедельной потребности на период до подведения итогов государственных закупок способом конкурса, аукциона и вступления в силу договора о государственных закупках
  kaz: Конкурс, аукцион тәсілімен мемлекеттік сатып алу қорытындылары шығарылғанға және мемлекеттік сатып алу туралы шарт күшіне енгенге дейінгі кезеңге күн сайынғы және (немесе) апта сайынғы қажеттіліктегі тауарлардың, жұмыстардың, көрсетілетін қызметтердің тізбесін бекіту туралы
