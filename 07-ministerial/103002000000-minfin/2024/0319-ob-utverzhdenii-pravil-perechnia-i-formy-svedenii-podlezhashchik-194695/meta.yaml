act_code: '194695'
requisite: Приказ Министра финансов Республики Казахстан от 19 марта 2024 года № 160. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 марта 2024 года № 34167. Утратил силу приказом Министра финансов Республики Казахстан от 12 ноября 2025 года № 696 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил, перечня и формы сведений, подлежащих передаче посредством интеграции аппаратно-программных комплексов организаторов игорного бизнеса, осуществляющих деятельность букмекерской конторы и (или) тотализатора, с информационными системами органов государственных доходов
  kaz: Букмекерлік кеңсенің және (немесе) тотализатордың қызметін жүзеге асыратын ойын бизнесін ұйымдастырушылардың аппараттық-бағдарламалық кешендерін мемлекеттік кірістер органдарының ақпараттық жүйелерімен интеграциялау арқылы беруге жататын мәліметтердің қағидалары мен тізбесін және нысанын бекіту туралы
