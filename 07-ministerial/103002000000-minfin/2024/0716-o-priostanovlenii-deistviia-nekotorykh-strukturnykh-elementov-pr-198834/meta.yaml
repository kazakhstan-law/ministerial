act_code: '198834'
requisite: Приказ Министра финансов Республики Казахстан от 16 июля 2024 года № 452. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 июля 2024 года № 34747
title:
  rus: О приостановлении действия некоторых структурных элементов приказа Министра финансов Республики Казахстан от 13 сентября 2021 года № 927 «Об утверждении формы декларации о доходах и имуществе физического лица и правил ее составления»
  kaz: «Жеке тұлғаның кірістері мен мүлкі туралы декларацияның нысанын және оны жасау қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2021 жылғы 13 қыркүйектегі № 927 бұйрығының кейбір құрылымдық элементтерінің қолданысын тоқтата тұру туралы
