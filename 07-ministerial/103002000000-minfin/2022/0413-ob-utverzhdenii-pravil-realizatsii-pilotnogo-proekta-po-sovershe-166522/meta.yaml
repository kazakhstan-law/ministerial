act_code: '166522'
requisite: Приказ Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 13 апреля 2022 года № 405. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 апреля 2022 года № 27586. Действовал по 31 декабря 2025 года в соответствии пунктом 3 настоящего приказа
title:
  rus: Об утверждении Правил реализации пилотного проекта по совершенствованию администрирования прослеживаемых на территории Республики Казахстан социально значимых продовольственных товаров, каменного угля и зерна на основании информационной системы электронных счетов-фактур
  kaz: Электрондық шот-фактуралардың ақпараттық жүйесі негізінде Қазақстан Республикасының аумағында қадағаланатын әлеуметтік маңызы бар азық-түлік тауарларын, тас көмірді және астықты әкімшілендіруді жетілдіру жөніндегі пилоттық жобаны іске асыру қағидаларын бекіту туралы
