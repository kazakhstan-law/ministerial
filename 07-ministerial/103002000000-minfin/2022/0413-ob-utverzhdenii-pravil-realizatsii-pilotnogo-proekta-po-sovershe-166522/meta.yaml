  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра – Министра финансов Республики Казахстан от 13 апреля 2022 года № 405 «Об утверждении Правил реализации пилотного проекта по совершенствованию администрирования прослеживаемых на территории Республики Казахстан социально значимых продовольственных товаров и (или) каменного угля на основании информационной системы электронных счетов-фактур»
    kaz: «Электрондық шот-фактуралардың ақпараттық жүйесі негізінде Қазақстан Республикасының аумағында қадағаланатын әлеуметтік маңызы бар азық-түлік тауарларын және (немесе) тас көмірді әкімшілендіруді жетілдіру жөніндегі пилоттық жобаны іске асыру қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қаржы министрінің 2022 жылғы 13 сәуірдегі № 405 бұйрығына өзгерістер енгізу туралы
