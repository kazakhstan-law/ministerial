requisite: Приказ Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 13 апреля 2022 года № 402. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 апреля 2022 года № 27557. Утратил силу приказом Министра финансов Республики Казахстан от 2 апреля 2024 года № 174 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
