act_code: '165760'
requisite: Приказ Министра финансов Республики Казахстан от 29 марта 2022 года № 323. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 марта 2022 года № 27305. Утратил силу приказом Министра финансов Республики Казахстан от 12 ноября 2025 года № 698 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении критериев отнесения операций, проводимых на банковских счетах физических лиц, к операциям, имеющим признаки получения дохода от осуществления предпринимательской деятельности, Правил, формы и срока представления банками второго уровня и организациями, осуществляющими отдельные виды банковских операций, сведений по операциям, проводимым на банковских счетах физических лиц, отнесенным к операциям, имеющим признаки получения дохода от осуществления предпринимательской деятельности
  kaz: Жеке тұлғалардың банктік шоттарында жүргізілетін операцияларды кәсіпкерлік қызметті жүзеге асырудан кіріс алу белгілері бар операцияларға жатқызу өлшемшарттарын, Екінші деңгейдегі банктердің және банк операциялардың жекелеген түрлерін жүзеге асыратын ұйымдардың кәсіпкерлік қызметті жүзеге асырудан кіріс алу белгілері бар операцияларға жатқызылған жеке тұлғалардың банктік шоттарында жүргізілетін операциялар бойынша мәліметтерді ұсыну қағидаларын, нысаны мен мерзімін бекіту туралы
