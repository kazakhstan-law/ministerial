act_code: '165376'
requisite: Приказ Министра финансов Республики Казахстан от 15 марта 2022 года № 273. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 марта 2022 года № 27158. Утратил силу приказом Министра финансов Республики Казахстан от 12 ноября 2025 года № 696 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил, формы и сроков представления банками второго уровня и организациями, осуществляющими отдельные виды банковских операций, сведений по налогоплательщикам – физическим лицам, состоящим на регистрационном учете в качестве индивидуальных предпринимателей, применяющих отдельные специальные налоговые режимы и являющихся пользователями специального мобильного приложения, по итоговым суммам платежей, поступивших на счет для осуществления предпринимательской деятельности за календарный месяц
  kaz: Екінші деңгейдегі банктердің және банк операцияларының жекелеген түрлерiн жүзеге асыратын ұйымдардың жекелеген арнаулы салық режимдерін қолданатын және арнаулы мобильдік қосымшаны пайдаланушылар болып табылатын дара кәсіпкерлер ретінде тіркеу есебінде тұрған салық төлеушілер - жеке тұлғалар бойынша күнтізбелік ай үшін кәсіпкерлік қызметті жүзеге асыруға арналған шотқа түскен төлемдердің жиынтық сомалары жөніндегі мәліметтерді беру қағидаларын, нысаны мен мерзімдерін бекіту туралы
