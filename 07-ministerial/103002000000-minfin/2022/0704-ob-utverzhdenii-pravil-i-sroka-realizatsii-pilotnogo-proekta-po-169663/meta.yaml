act_code: '169663'
requisite: Приказ Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 4 июля 2022 года № 657. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 июля 2022 года № 28739. Утратил силу приказом Министра финансов Республики Казахстан от 17 сентября 2024 года № 630 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и срока реализации пилотного проекта по упрощению исполнения налоговых обязательств индивидуальными предпринимателями, применяющими специальные налоговые режимы на основе патента, упрощенной декларации и с использованием специального мобильного приложения
  kaz: Патент, оңайлатылған декларация негізінде және арнаулы мобильді қосымшаны пайдаланылатын арнаулы салық режимдерін қолданатын дара кәсіпкерлердің салықтық міндеттемелерін орынадауын оңайлату жөніндегі пилоттық жобаны іске асыру қағидалары мен мерзімін бекіту туралы
