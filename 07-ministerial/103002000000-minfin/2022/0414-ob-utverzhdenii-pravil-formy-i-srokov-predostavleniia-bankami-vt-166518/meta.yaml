act_code: '166518'
requisite: Приказ Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 14 апреля 2022 года № 408. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 апреля 2022 года № 27585. Утратил силу приказом Министра финансов Республики Казахстан от 3 ноября 2025 года № 664 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил, формы и сроков предоставления банками второго уровня, организациями, осуществляющими отдельные виды банковских операций, и платежными организациями уполномоченному органу информации об итоговых суммах платежей и переводов за календарный год, осуществленных в пользу и в разрезе иностранных компаний, через интернет-площадку которых осуществляется электронная торговля товарами, и (или) оказывающих услуги в электронной форме, а также направления уполномоченным органом в банки второго уровня, организации, осуществляющие отдельные виды банковских операций и платежные организации сведений по перечню реквизитов, в том числе данных мерчент ID, применяемых для приема платежей и (или) переводов денег
  kaz: Екінші деңгейдегі банктердің, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың және төлем ұйымдарының интернет-алаңы арқылы тауарлармен электрондық сауда жүзеге асырылатын және (немесе) электрондық нысанда қызметтер көрсететін шетелдік компаниялардың пайдасына және бөлінісінде жүзеге асырылған, күнтізбелік жыл ішіндегі төлемдері мен аударымдардың жиынтық сомалары туралы ақпаратты уәкілетті органға, сондай-ақ уәкілетті органның екінші деңгейдегі банктерге, банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдарға және төлем ұйымдарының төлемдерді және (немесе) ақша аударымдарын қабылдау үшін қолданылатын деректемелер тізбесі, оның ішінде мерчент ID деректері бойынша мәліметтерді беру қағидаларын, нысанын және мерзімдерін бекіту туралы
