  title:
    rus: Об утверждении формы сведений, предоставляемых органу государственных доходов платежными и банковскими организациями об итоговых суммах платежей и переводов за календарный квартал, осуществленных в пользу и в разрезе иностранных компаний, осуществляющих деятельность посредством интернет-площадки на территории Республики Казахстан, а также Правил и сроков их представления
    kaz: Төлем және банк ұйымдарымен мемлекеттік кірістер органына қызметін Қазақстан Республикасының аумағында интернет-алаң арқылы жүзеге асыратын шетелдік компаниялардың пайдасына және бөлінісінде, күнтізбелік тоқсанда жүзеге асырылған төлемдер мен аударымдардың жиынтық сомалары туралы мәліметтерді ұсыну нысанын және оларды ұсыну Қағидалары мен мерзімдерін бекіту туралы
