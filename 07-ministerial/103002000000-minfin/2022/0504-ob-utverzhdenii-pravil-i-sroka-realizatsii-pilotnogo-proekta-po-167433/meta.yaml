  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра – Министра финансов Республики Казахстан от 4 мая 2022 года № 467 «Об утверждении Правил и срока реализации пилотного проекта по передаче банками второго уровня сведений о денежных расчетах, осуществляемых при реализации товаров, выполнении работ и оказании услуг в органы государственных доходов»
    kaz: «Екінші деңгейдегі банктердің тауарларды өткізу, жұмыстарды орындау және қызметтерді көрсету кезінде жүзеге асырылатын ақшалай есеп айырысулар туралы мәліметтерді мемлекеттік кірістер органдарына беру жөніндегі пилоттық жобаны іске асыру қағидалары мен мерзімін бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қаржы министрінің 2022 жылғы 4 мамырдағы № 467 бұйрығына өзгерістер енгізу туралы
