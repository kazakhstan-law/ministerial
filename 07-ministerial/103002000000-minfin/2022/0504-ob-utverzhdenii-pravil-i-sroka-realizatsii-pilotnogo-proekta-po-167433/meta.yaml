act_code: '167433'
requisite: Приказ Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 4 мая 2022 года № 467. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 мая 2022 года № 27936. Прекратил действие с 31 декабря 2023 года в соответствии с пунктом 3 настоящего приказа
title:
  rus: Об утверждении Правил и срока реализации пилотного проекта по передаче банками второго уровня сведений о денежных расчетах, осуществляемых при реализации товаров, выполнении работ и оказании услуг в органы государственных доходов
  kaz: Екінші деңгейдегі банктердің тауарларды өткізу, жұмыстарды орындау және қызметтерді көрсету кезінде жүзеге асырылатын ақшалай есеп айырысулар туралы мәліметтерді мемлекеттік кірістер органдарына беру жөніндегі пилоттық жобаны іске асыру қағидалары мен мерзімін бекіту туралы
