act_code: '175600'
requisite: Приказ Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 15 декабря 2022 года № 1287. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 декабря 2022 года № 31144. Утратил силу приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил определения дохода от объектов интеллектуальной собственности и оказания услуг в сфере информатизации, к которому применяется уменьшение суммы исчисленного корпоративного подоходного налога на 100 процентов
  kaz: Есептелген корпоративтік табыс салығының сомасын 100 пайызға азайту қолданылатын зияткерлік меншік объектілерінен және ақпараттандыру саласында қызметтер көрсетуден кірісті айқындау қағидаларын бекіту туралы
