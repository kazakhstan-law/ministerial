  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра – Министра финансов Республики Казахстан от 15 декабря 2022 года № 1287 «Об утверждении Правил определения дохода от объектов интеллектуальной собственности и оказания услуг в сфере информатизации, к которому применяется уменьшение суммы исчисленного корпоративного подоходного налога на 100 процентов»
