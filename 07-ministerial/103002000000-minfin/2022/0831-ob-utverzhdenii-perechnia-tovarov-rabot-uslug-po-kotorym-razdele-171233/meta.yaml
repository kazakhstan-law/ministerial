title:
  rus: Об утверждении перечня товаров, работ, услуг, по которым разделение на лоты по их однородным видам и по месту их поставки (выполнения, оказания) не требуется
  kaz: Біртекті түрлері және оларды беру (орындау, көрсету) орны бойынша лоттарға бөлу талап етілмейтін тауарлардың, жұмыстардың, көрсетілетін қызметтердің тізбесін бекіту туралы
