    kaz: «Біртекті түрлері және оларды беру (орындау, көрсету) орны бойынша лоттарға бөлу талап етілмейтін тауарлардың, жұмыстардың, көрсетілетін қызметтердің тізбесін бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қаржы министрінің 2022 жылғы 31 тамыздағы № 903 бұйрығына өзгеріс енгізу туралы
