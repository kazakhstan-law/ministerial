    kaz: '"Мемлекеттік органның бюджет қаражатын басқарудың тиімділігін бағалау әдістемесін және Қазақстан Республикасы Ұлттық Банкі ақша қаражатын басқарудың тиімділігін бағалау әдістемесін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2012 жылғы 10 қаңтардағы № 9 бұйрығына өзгерістер енгізу туралы'
