  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 10 января 2012 года № 9 "Об утверждении Методики оценки эффективности управления бюджетными средствами государственного органа и Методики оценки эффективности управления денежными средствами Национального Банка Республики Казахстан"
    kaz: '"Мемлекеттік органның бюджет қаражатын басқарудың тиімділігін бағалау әдістемесін және Қазақстан Республикасы Ұлттық Банкі ақша қаражатын басқарудың тиімділігін бағалау әдістемесін бекіту туралы" Қазақстан Республикасы Қаржы Министрінің 2012 жылғы 10 қаңтардағы № 9 бұйрығына өзгерістер енгізу туралы'
