  kaz: Мемлекеттік органның бюджет қаражатын басқару тиімділігін бағалау әдістемесін және Қазақстан Республикасы Ұлттық Банкі ақша қаражатын басқару тиімділігін бағалау әдістемесін бекіту туралы
