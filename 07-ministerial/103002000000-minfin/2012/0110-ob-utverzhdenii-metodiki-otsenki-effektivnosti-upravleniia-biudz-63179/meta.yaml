  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 10 января 2012 года № 9 "Об утверждении Методики оценки эффективности управления бюджетными средствами государственного органа и Методики оценки эффективности управления денежными средствами Национального Банка Республики Казахстан"
    kaz: '"Мемлекеттік органның бюджет қаражатын басқарудың тиiмдiлiгiн бағалау әдiстемесiн және Қазақстан Республикасы Ұлттық Банкi ақша қаражатын басқарудың тиiмдiлiгiн бағалау әдiстемесiн бекiту туралы" Қазақстан Республикасы Қаржы министрiнiң 2012 жылғы 10 қаңтардағы № 9 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
