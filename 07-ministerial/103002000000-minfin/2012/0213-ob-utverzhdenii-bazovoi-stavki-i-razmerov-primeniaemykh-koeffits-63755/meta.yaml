act_code: '63755'
requisite: Приказ Министра финансов Республики Казахстан от 13 февраля 2012 года № 96. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 февраля 2012 года № 7437. Утратил силу приказом Заместителя Премьер-Министра Республики Казахстан - Министра финансов Республики Казахстан от 20 мая 2014 года № 236
title:
  rus: Об утверждении базовой ставки и размеров применяемых коэффициентов, учитывающих тип строения, вид нежилого помещения, степень комфортности, территориальное расположение, вид деятельности нанимателя, организационно-правовую форму нанимателя при передаче республиканского имущества в имущественный наем (аренду)
  kaz: Республикалық мүлікті мүліктік жалға (жалға алу) беру кезінде тұрғын емес үй-жайдың салыну үлгісі, түрі, қолайлылық дәрежесі, аумақтық орналасуы, жалдаушының қызмет түрі, жалдаушының ұйымдық-құқықтық нысаны ескерілетін коэффициенттердің қолданылатын базалық ставкасы мен мөлшерлерін бекіту туралы
