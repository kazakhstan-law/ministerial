  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 14 мая 2012 года № 249 "Об утверждении Методики оценки эффективности деятельности исполнительных органов, финансируемых из областного бюджета, бюджетов города республиканского значения, столицы, местных исполнительных органов районов (городов областного значения) по управлению бюджетными средствами"
    kaz: '"Облыстық бюджеттен, республикалық маңызы бар қала, астана бюджеттерінен қаржыландырылатын атқарушы органдардың, аудандардың (облыстық маңызы бар қалалардың) жергілікті атқарушы органдарының бюджет қаражатын басқару жөніндегі қызметінің тиімділігін бағалау әдістемесін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2012 жылғы 14 мамырдағы № 249 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/72251/rus
