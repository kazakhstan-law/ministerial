act_code: '65969'
requisite: Приказ Министра финансов Республики Казахстан от 14 мая 2012 года № 249. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 июня 2012 года № 7718. Утратил силу приказом Заместителя Премьер-Министра Республики Казахстан - Министра финансов Республики Казахстан от 21 мая 2014 года № 240
title:
  rus: Об утверждении Методики оценки эффективности деятельности исполнительных органов, финансируемых из областного бюджета, бюджетов города республиканского значения, столицы, местных исполнительных органов районов (городов областного значения) по управлению бюджетными средствами
  kaz: Облыстық бюджеттен, республикалық маңызы бар қала, астана бюджеттерінен қаржыландырылатын атқарушы органдардың, аудандардың (облыстық маңызы бар қалалардың) жергілікті атқарушы органдарының бюджет қаражатын басқару жөніндегі қызметінің тиімділігін бағалау әдістемесін бекіту туралы
