  code: '211014'
  requisite: Приказ Министра финансов Республики Казахстан от 22 мая 2025 года № 247. Утратил силу приказом Министра финансов Республики Казахстан от 6 октября 2025 года № 579 (вводится в действие с 1 января 2026 года)
  title:
    rus: О внесении изменения в приказ Заместителя Премьер-Министра – Министра финансов Республики Казахстан от 19 июня 2023 года № 680 «Об утверждении списка стран, с которыми вступил в силу международный договор, регулирующий вопросы избежания двойного налогообложения и предотвращения уклонения от уплаты налогов, номинальная ставка налога на прибыль которых составляет более 75 процентов от ставки корпоративного подоходного налога в Республике Казахстан»
    kaz: «Пайда салығының номиналды мөлшерлемесі Қазақстан Республикасындағы корпоративтік табыс салығы мөлшерлемесінің 75 пайызынан астамын құрайтын, өзімен жасалған қосарланған салық салуды болғызбау және салықтарды төлеуден жалтаруға жол бермеу мәселелерін реттейтін халықаралық шарт күшіне енген елдердің тізімін бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қаржы министрінің 2023 жылғы 19 маусымдағы № 680 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/211014/rus
