act_code: '184649'
requisite: Приказ Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 31 июля 2023 года № 817. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 августа 2023 года № 33223. Утратил силу приказом Министра финансов Республики Казахстан от 28 октября 2025 года № 634 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил представления сведений биржами цифровых активов, а также иными участниками Международного финансового центра «Астана» о проведенных резидентами Республики Казахстан операциях на биржах цифровых активов и выплаченных вознаграждениях резидентам и нерезидентам от осуществления деятельности, связанной с цифровыми активами
  kaz: Цифрлық активтер биржалары, сондай-ақ «Астана» халықаралық қаржы орталығының өзге де қатысушылары Қазақстан Республикасының резиденттері цифрлық активтер биржаларында жүргізген операциялар және цифрлық активтерге байланысты қызметті жүзеге асырудан резиденттер мен бейрезиденттерге төленген сыйақылар туралы мәліметтерді ұсыну қағидаларын бекіту туралы
