  title:
    rus: О внесении изменений в приказ исполняющего обязанности Заместителя Премьер-Министра – исполняющего обязанности Министра финансов Республики Казахстан от 27 марта 2023 года № 294 «Об утверждении Правил и срока реализации пилотного проекта по использованию средств биометрической идентификации в информационной системе электронных счетов-фактур»
    kaz: «Электрондық шот-фактуралардың ақпараттық жүйесінде биометриялық сәйкестендіру құралдарын пайдалану жөніндегі пилоттық жобаны іске асыру қағидалары мен мерзімін бекіту туралы» Қазақстан Республикасы Премьер-Министрі орынбасарының міндетін атқарушының – Қаржы министрінің міндетін атқарушының 2023 жылғы 27 наурыздағы № 294 бұйрығына өзгерістер енгізу туралы
