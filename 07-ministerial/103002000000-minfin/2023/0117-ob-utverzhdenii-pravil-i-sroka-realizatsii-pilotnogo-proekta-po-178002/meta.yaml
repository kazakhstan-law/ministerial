title:
  rus: Об утверждении Правил и срока реализации пилотного проекта по применению иного порядка налогового администрирования лиц, оказывающих услуги с использованием интернет-платформ
  kaz: Интернет-платформаларды пайдалана отырып қызмет көрсететін тұлғаларды салықтық әкімшілендірудің өзге тәртібін қолдану жөніндегі пилоттық жобаны іске асыру мерзімі мен қағидаларын бекіту туралы
