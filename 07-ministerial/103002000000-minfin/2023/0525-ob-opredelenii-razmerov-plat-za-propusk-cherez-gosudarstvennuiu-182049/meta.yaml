title:
  rus: Об определении размеров плат за пропуск через Государственную границу Республики Казахстан автомобильных транспортных средств, грузов и товаров, а также их прохождение по электронной очереди
  kaz: Қазақстан Республикасының Мемлекеттік шекарасы арқылы автомобиль көлік құралдарын, жүктер мен тауарларды өткізу, сондай-ақ оларды электрондық кезек бойынша өтуі үшін төлемақы мөлшерлерін айқындау туралы
