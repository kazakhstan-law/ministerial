  title:
    rus: О внесении изменения в приказ Заместителя Премьер-Министра – Министра финансов Республики Казахстан от 25 мая 2023 года № 538 «Об определении размеров плат за пропуск через Государственную границу Республики Казахстан автомобильных транспортных средств, грузов и товаров, а также их прохождение по электронной очереди»
    kaz: «Қазақстан Республикасының Мемлекеттік шекарасы арқылы автомобиль көлік құралдарын, жүктер мен тауарларды өткізу, сондай-ақ оларды электрондық кезек бойынша өтуі үшін төлемақы мөлшерлерін айқындау туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қаржы министрінің 2023 жылғы 25 мамырдағы № 538 бұйрығына өзгерістер енгізу туралы
