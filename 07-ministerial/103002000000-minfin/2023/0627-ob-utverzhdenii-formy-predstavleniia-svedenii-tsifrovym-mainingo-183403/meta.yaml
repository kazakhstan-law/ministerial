requisite: Приказ Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 27 июня 2023 года № 709. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 июня 2023 года № 32926. Утратил силу приказом Министра финансов Республики Казахстан от 20 февраля 2026 года № 119 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении формы представления сведений цифровым майнинговым пулом о распределенных им цифровых активах между лицами, осуществляющими деятельность по цифровому майнингу
  kaz: Цифрлық майнингтік пул цифрлық майнинг жөніндегі қызметті жүзеге асыратын тұлғалар арасында өзі бөлген цифрлық активтер туралы мәліметтерді ұсыну нысанын бекіту туралы
