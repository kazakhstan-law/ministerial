  title:
    rus: О внесении изменений в приказ Заместителя Премьер-Министра – Министра финансов Республики Казахстан от 4 июля 2023 года № 739 «Об определении особенностей таможенного декларирования, категории товаров, региона реализации эксперимента в области внешней электронной торговли, проводимого в Республике Казахстан и применения уведомительного порядка соблюдения технических регламентов в отношении товаров электронной торговли»
    kaz: «Кедендік декларациялаудың, тауарлар санатының, Қазақстан Республикасында жүргізілетін тауарлардың сыртқы электрондық саудасы саласындағы экспериментті іске асырушы өңірдің және электрондық сауда тауарларына қатысты техникалық регламенттерді сақтаудың хабарламалық тәртібін қолдану ерекшеліктерін айқындау туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қаржы министрінің 2023 жылғы 4 шiлдедегi № 739 бұйрығына өзгерістер енгізу туралы
