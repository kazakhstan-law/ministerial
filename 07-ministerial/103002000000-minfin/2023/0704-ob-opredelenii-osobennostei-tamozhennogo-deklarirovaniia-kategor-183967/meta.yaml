act_code: '183967'
requisite: Приказ Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 4 июля 2023 года № 739. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 июля 2023 года № 33082. Действовал до 31 декабря 2024 года включительно в соответствии с пунктом 3 настоящего постановления
title:
  rus: Об определении особенностей таможенного декларирования, категории товаров, региона реализации эксперимента в области внешней электронной торговли, проводимого в Республике Казахстан и применения уведомительного порядка соблюдения технических регламентов в отношении товаров электронной торговли
  kaz: Кедендік декларациялаудың, тауарлар санатының, Қазақстан Республикасында жүргізілетін тауарлардың сыртқы электрондық саудасы саласындағы экспериментті іске асырушы өңірдің және электрондық сауда тауарларына қатысты техникалық регламенттерді сақтаудың хабарламалық тәртібін қолдану ерекшеліктерін айқындау туралы
