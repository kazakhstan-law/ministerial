  rus: Об утверждении Правил вынесения решений об ограничении выписки счетов-фактур в электронной форме в информационной системе электронных счетов-фактур и об отмене такого ограничения, а также форм таких решений
  kaz: Электрондық шот-фактуралардың ақпараттық жүйесінде электронды нысанда шот- фактуралардың жазып берілуін шектеу және мұндай шектеуді жою туралы қағидаларын, сондай-ақ осындай шешімдердің нысандарын бекіту туралы
