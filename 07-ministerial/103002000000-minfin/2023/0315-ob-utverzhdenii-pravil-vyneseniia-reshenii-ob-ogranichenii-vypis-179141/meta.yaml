  title:
    rus: О внесении изменения в приказ Заместителя Премьер-Министра – Министра финансов Республики Казахстан от 15 марта 2023 года № 279 «Об утверждении Правил вынесения решений об ограничении выписки счетов-фактур в электронной форме в информационной системе электронных счетов-фактур и об отмене такого ограничения, а также форм таких решений»
    kaz: «Электрондық шот-фактуралардың ақпараттық жүйесінде электронды нысанда шот - фактуралардың жазып берілуін шектеу және мұндай шектеуді жою туралы қағидаларын, сондай-ақ осындай шешімдердің нысандарын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары – Қаржы министрінің 2023 жылғы 15 наурыздағы № 279 бұйрығына өзгерту енгізу туралы
