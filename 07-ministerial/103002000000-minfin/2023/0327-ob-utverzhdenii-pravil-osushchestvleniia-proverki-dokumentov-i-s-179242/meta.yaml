act_code: '179242'
requisite: Приказ и.о. Заместителя Премьер-Министра - и.о. Министра финансов Республики Казахстан от 27 марта 2023 года № 295. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 марта 2023 года № 32128
title:
  rus: Об утверждении Правил осуществления проверки документов и сведений, осмотра и (или) досмотра перемещаемых через Государственную границу Республики Казахстан с государствами-членами Евразийского экономического союза товаров, а также форм актов осмотра и досмотра
  kaz: Еуразиялық экономикалық одаққа мүше мемлекеттермен Қазақстан Республикасының Мемлекеттік шекарасы арқылы өткізілетін тауарлардың құжаттарын және мәліметтерді тексеруді, қарап-тексеруді және (немесе) жете тексеруді жүзеге асыру қағидаларын, сондай-ақ қарап-тексеру және жете тексеру актілерінің нысандарын бекіту туралы
