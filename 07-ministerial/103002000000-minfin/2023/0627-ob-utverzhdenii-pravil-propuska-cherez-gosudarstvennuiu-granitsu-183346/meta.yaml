  title:
    rus: О внесении изменения в приказ Заместителя Премьер-Министра – Министра финансов Республики Казахстан от 27 июня 2023 года № 707 «Об утверждении Правил пропуска через Государственную границу Республики Казахстан автомобильных транспортных средств, грузов и товаров, в том числе с использованием системы электронной очереди на платной основе»
    kaz: «Автомобиль көлігі құралдарын, жүктер мен тауарларды Қазақстан Республикасының Мемлекеттік шекарасы арқылы, оның ішінде ақылы негізде электрондық кезек жүйесін пайдалана отырып өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің орынбасары - Қаржы министрінің 2023 жылғы 27 маусымдағы № 707 бұйрығына өзгеріс енгізу туралы
