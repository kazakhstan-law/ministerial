title:
  rus: Об утверждении Правил пропуска через Государственную границу Республики Казахстан автомобильных транспортных средств, грузов и товаров, в том числе с использованием системы электронной очереди на платной основе
  kaz: Автомобиль көлігі құралдарын, жүктер мен тауарларды Қазақстан Республикасының Мемлекеттік шекарасы арқылы, оның ішінде ақылы негізде электрондық кезек жүйесін пайдалана отырып өткізу қағидаларын бекіту туралы
