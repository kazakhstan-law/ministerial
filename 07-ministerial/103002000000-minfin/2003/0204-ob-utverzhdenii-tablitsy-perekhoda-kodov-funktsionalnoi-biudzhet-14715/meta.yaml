requisite: Приказ Министра финансов Республики Казахстан от 4 февраля 2003 года N 43. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 февраля 2003 года N 2187. Утратил силу - приказом Министра финансов Республики Казахстан от 16 января 2004 года N 21 (V042683)
title:
  rus: Об утверждении Таблицы перехода кодов Функциональной бюджетной классификации расходов республиканского бюджета в шифры Справочников бюджетной классификации, используемой в программном обеспечении "Автоматизированная система областного управления казначейства" ("Баск-М")
  kaz: Республикалық бюджет шығыстарының функционалдық бюджеттік сыныптамасы кодтарының "Облыстық қазынашылық басқармасының автоматтандырылған жүйесі" ("Баск-М") бағдарламалық қамтамасыз етуінде пайдаланылатын Бюджеттік сыныптама анықтамалықтарының шифрларына көшу кестесін бекіту туралы
