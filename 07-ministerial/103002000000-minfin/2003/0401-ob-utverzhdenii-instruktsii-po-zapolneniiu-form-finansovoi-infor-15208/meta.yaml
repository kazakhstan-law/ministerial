  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 2 апреля 2003 года № 135 "Об утверждении Инструкции по заполнению форм финансовой информации, Правил проведения анализа деятельности государственных предприятий и Правил определения основных показателей эффективности деятельности негосударственных юридических лиц с участием государства в уставном капитале", зарегистрированный за № 2250
    kaz: N 2250 тіркелген "Қаржылық ақпарат нысандарын толтыру жөніндегі Нұсқаулықты, Мемлекеттік кәсіпорындардың қызметіне талдау жүргізу Ережелерін және Жарғылық капиталында мемлекеттің қатысуы бар мемлекеттік емес заңды тұлғалардың қызметтері тиімділігінің негізгі көрсеткіштерін анықтау Ережелерін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2003 жылғы 2 сәуірдегі N 135 бұйрығына өзгерістер енгізу туралы
