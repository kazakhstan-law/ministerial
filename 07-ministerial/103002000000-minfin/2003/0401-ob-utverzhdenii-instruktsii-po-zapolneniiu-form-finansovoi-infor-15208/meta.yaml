act_code: '15208'
requisite: Приказ Министра финансов Республики Казахстан от 2 апреля 2003 года № 135. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 апреля 2003 года № 2250. Утратил силу приказом Министра финансов Республики Казахстан от 29 ноября 2012 года № 523
title:
  rus: Об утверждении Инструкции по заполнению форм финансовой информации, Инструкции по проведению анализа деятельности государственных предприятий и Инструкции по определению основных показателей эффективности деятельности негосударственных юридических лиц с участием государства в уставном капитале
  kaz: Қаржылық ақпарат нысандарын толтыру жөніндегі Нұсқаулықты, Мемлекеттік кәсіпорындардың қызметіне талдау жүргізу жөніндегі нұсқаулықты және Жарғылық капиталында мемлекеттің қатысуы бар мемлекеттік емес заңды тұлғалардың қызметтері тиімділігінің негізгі көрсеткіштерін анықтау жөніндегі нұсқаулықты бекіту туралы
