act_code: '17428'
requisite: Приказ Министра финансов Республики Казахстан от 23 октября 2003 года N 376. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 ноября 2003 года N 2552. Утратил силу - приказом Министра финансов Республики Казахстан от 27 декабря 2005 года N 441 (V054031)
title:
  rus: Об утверждении Правил разработки и представления планов финансово-хозяйственной деятельности акционерных обществ (товариществ с ограниченной ответственностью), контрольные пакеты акций (доли участия) которых принадлежат государству, и планов хозяйственной деятельности государственных предприятий, за исключением национальных компаний и подведомственных Национальному Банку Республики Казахстан
  kaz: Ұлттық компанияларға және Қазақстан Республикасы Ұлттық Банкінің ведомстволық бағыныстыларына жатқызылғандарды қоспағанда, акцияларының бақылау пакеттері (қатысу үлестері) мемлекетке тиесілі акционерлік қоғамдардың (жауапкершілігі шектеулі серіктестіктердің) қаржы-шаруашылық қызметтерінің жоспарларын және мемлекеттік кәсіпорындардың шаруашылық қызметтерінің жоспарларын әзірлеу және беру ережесін бекіту туралы
