requisite: Приказ Министра финансов Республики Казахстан от 30 сентября 2009 года № 426. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 октября 2009 года № 5809
title:
  rus: Об утверждении формы заявления на освобождение стоимости материально-технических средств и услуг, приобретаемых в Республике Казахстан Соединенными Штатами Америки или от их имени, от налогов и других обязательных платежей в бюджет в соответствии с пунктом 1 статьи XII Рамочного соглашения
  kaz: Негіздемелік келісімнің XII бабының 1-тармағына сәйкес Америка Құрама Штаттары немесе олардың атынан басқалардың Қазақстан Республикасында сатып алынатын материалдық-техникалық құралдар мен қызметтерді салық және бюджетке төленетін басқа да міндетті төлемдерден босату өтінішінің нысанын бекіту туралы
