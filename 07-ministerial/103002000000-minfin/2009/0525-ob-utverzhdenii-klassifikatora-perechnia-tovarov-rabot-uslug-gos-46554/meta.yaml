  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 25 мая 2009 года № 215 «Об утверждении Классификатора перечня товаров (работ, услуг) государственных учреждений, содержащихся за счет республиканского или местного бюджета, деньги от реализации, которых остаются в их распоряжении»
    kaz: «Республикалық немесе жергілікті бюджет есебінен ұсталатын мемлекеттік мекемелердің оларды өткізуден түсетін ақшасы өзінің иелігінде қалатын тауарларының (жұмыстарының, көрсетілетін қызметтерінің) тізбесінің сыныптауышын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2009 жылғы 25 мамырдағы № 215 бұйрығына өзгеріс енгізу туралы
