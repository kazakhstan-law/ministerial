act_code: '46554'
requisite: Приказ Министра финансов Республики Казахстан от 25 мая 2009 года № 215. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 июня 2009 года № 5702. Утратил силу приказом Министра финансов Республики Казахстан от 22 мая 2025 года № 245 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Классификатора перечня товаров (работ, услуг) государственных учреждений, содержащихся за счет республиканского или местного бюджета, деньги от реализации которых остаются в их распоряжении
  kaz: Республикалық немесе жергілікті бюджет есебінен ұсталатын мемлекеттік мекемелердің оларды өткізуден түсетін ақшасы өзінің иелігінде қалатын тауарларының (жұмыстарының, көрсетілетін қызметтерінің) тізбесінің сыныптауышын бекіту туралы
