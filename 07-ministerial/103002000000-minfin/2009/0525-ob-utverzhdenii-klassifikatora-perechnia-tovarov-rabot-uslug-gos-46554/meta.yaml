  requisite: Приказ Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 30 сентября 2022 года № 1008. Отменен приказом Министра финансов Республики Казахстан от 6 мая 2025 года № 219 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в приказ Министра финансов Республики Казахстан от 25 мая 2009 года № 215 «Об утверждении Классификатора перечня товаров (работ, услуг) государственных учреждений, содержащихся за счет республиканского или местного бюджета, деньги от реализации которых остаются в их распоряжении»
    kaz: «Республикалық немесе жергілікті бюджет есебінен ұсталатын мемлекеттік мекемелердің оларды өткізуден түсетін ақшасы өзінің иелігінде қалатын тауарларының (жұмыстарының, көрсетілетін қызметтерінің) тізбесінің сыныптауышын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2009 жылғы 25 мамырдағы № 215 бұйрығына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/172416/rus
