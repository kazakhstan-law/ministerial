  code: '131111'
  requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 25 апреля 2019 года № 393. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 апреля 2019 года № 18607. Утратил силу приказом Министра финансов Республики Казахстан от 22 мая 2025 года № 245 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 25 мая 2009 года № 215 «Об утверждении Классификатора перечня товаров (работ, услуг) государственных учреждений, содержащихся за счет республиканского или местного бюджета, деньги от реализации, которых остаются в их распоряжении»
    kaz: «Республикалық немесе жергілікті бюджет есебінен ұсталатын мемлекеттік мекемелердің оларды өткізуден түсетін ақшасы өзінің иелігінде қалатын тауарларының (жұмыстарының, көрсетілетін қызметтерінің) тізбесінің сыныптауышын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2009 жылғы 25 мамырдағы № 215 бұйрығына өзгерістер енгізу туралы
