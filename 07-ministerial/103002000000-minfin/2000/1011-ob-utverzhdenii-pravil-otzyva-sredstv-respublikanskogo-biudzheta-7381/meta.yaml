  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 12 октября 2000 года N 434 "Об утверждении Правил отзыва средств республиканского бюджета, использованных не по целевому назначению, и наложения административных взысканий за несвоевременное зачисление (перечисление) и нецелевое использование средств республиканского бюджета"
    kaz: '"Арнаулы мақсатқа сай пайдаланылмаған республикалық бюджеттiң қаражатын қайтарып алу және республикалық бюджеттiң қаражатын уақтылы есептемегенi (аудармаған) және мақсатсыз пайдаланғаны үшiн әкiмшiлiк жаза қолдану ережесiн бекiту туралы" Қазақстан Республикасы Қаржы министрлiгiнiң 2000 жылғы 12 қазандағы N 434 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы'
  link: https://zan.gov.kz/client/#!/doc/13641/rus
