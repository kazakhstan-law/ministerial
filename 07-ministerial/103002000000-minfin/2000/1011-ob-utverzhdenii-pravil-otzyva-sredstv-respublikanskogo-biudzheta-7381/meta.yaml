  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 12 октября 2000 года N 434 "Об утверждении Правил отзыва средств республиканского бюджета, использованных не по целевому назначению, и наложения административных взысканий за несвоевременное зачисление (перечисление) и нецелевое использование средств республиканского бюджета", зарегистрированного за N 1285
    kaz: '"Мақсатқа сай пайдаланылмаған республикалық бюджеттің қаражатын қайтарып алу және республикалық бюджеттің уақытылы есептелмеуіне (аударылмауына) және мақсатсыз пайдаланылуына әкімшілік жаза қолдану ережесін бекіту туралы" N 1285 тіркелген Қазақстан Республикасы Қаржы министрінің 2000 жылғы 12 қазандағы N 434 бұйрығына өзгеріс пен толықтыру енгізу туралы'
