act_code: '7381'
requisite: Приказ Министра финансов Республики Казахстан от 12 октября 2000 года N 434. Зарегистрировано в Министерстве юстиции Республики Казахстан от 17 ноября 2000 года N 1285. Утратил силу - приказом Министра финансов РК от 03.06.2005г. N 211
title:
  rus: Об утверждении Правил отзыва средств республиканского бюджета, использованных не по целевому назначению, и наложения административных взысканий за несвоевременное зачисление (перечисление) и нецелевое использование средств республиканского бюджета
  kaz: Арнаулы мақсатқа сай пайдаланылмаған республикалық бюджеттің қаражатын қайтарып алу және республикалық бюджеттің қаражатын уақтылы есептемегенi (аудармағаны) және мақсатсыз пайдаланғаны үшiн әкiмшiлiк жаза қолдану ережесiн бекіту туралы
