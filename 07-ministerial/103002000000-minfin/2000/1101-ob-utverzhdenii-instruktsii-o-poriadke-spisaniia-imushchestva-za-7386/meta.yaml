    kaz: '"Республикалық мемлекеттік кәсіпорындар мен республикалық мемлекеттік мекемелерге бекітілген мүлікті есептен шығарудың тәртібі туралы нұсқаулықты бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2000 жылғы 1 қарашадағы № 470 бұйрығына өзгерістер енгізу туралы'
