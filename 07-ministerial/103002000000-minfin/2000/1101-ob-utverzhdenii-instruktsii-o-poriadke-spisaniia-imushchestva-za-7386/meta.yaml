  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 1 ноября 2000 года № 470 "Об утверждении Инструкции о порядке списания имущества, закрепленного за государственными предприятиями и государственными учреждениями"
    kaz: Қазақстан Республикасының Әділет министрлігінде N 1291 тiркелген "Мемлекеттiк кәсiпорындар мен мемлекеттiк мекемелерге бекiтiлген мүлiктi есептен шығарудың тәртiбi туралы нұсқаулықты бекiту туралы" Қазақстан Республикасы Қаржы министрiнiң 2000 жылғы 1 қарашадағы N 470 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы
