  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 1 ноября 2000 года № 470 "Об утверждении Инструкции о порядке списания имущества, закрепленного за республиканскими государственными предприятиями и республиканскими государственными учреждениями", зарегистрированный в Министерстве юстиции Республики Казахстан 17 ноября 2000 года № 1291
    kaz: Қазақстан Республикасының Әділет министрлігінде 2000 жылы 17 қарашада N 1291 тіркелген "Республикалық мемлекеттік кәсіпорындар мен республикалық мемлекеттік мекемелерге бекітілген мүлікті есептен шығарудың тәртібі туралы нұсқаулықты бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2000 жылғы 1 қарашадағы N 470 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/20671/rus
