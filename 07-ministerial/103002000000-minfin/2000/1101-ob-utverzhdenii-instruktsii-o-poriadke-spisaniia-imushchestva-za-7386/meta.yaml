act_code: '7386'
requisite: Приказ Министра финансов Республики Казахстан от 1 ноября 2000 года № 470. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 ноября 2000 года № 1291. Утратил силу Министра финансов Республики Казахстан от 28 июля 2011 года № 382
title:
  rus: Об утверждении Инструкции о порядке списания имущества, закрепленного за республиканскими государственными предприятиями и республиканскими государственными учреждениями
  kaz: Республикалық мемлекеттік кәсiпорындар мен республикалық мемлекеттiк мекемелерге бекiтiлген мүлiктi есептен шығарудың тәртiбi туралы нұсқаулықты бекiту туралы
