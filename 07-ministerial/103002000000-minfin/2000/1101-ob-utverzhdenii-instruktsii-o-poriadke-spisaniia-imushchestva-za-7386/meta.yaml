    kaz: '"Мемлекеттiк кәсiпорындар мен мемлекеттiк мекемелерге бекiтiлген мүлiктi есептен шығарудың тәртiбi туралы нұсқаулықты бекiту туралы" Қазақстан Республикасы Қаржы министрлiгiнiң 2000 жылғы 1 қарашадағы N 470 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы'
