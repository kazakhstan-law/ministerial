  title:
    rus: О внесении изменения и дополнений в приказ Министра финансов Республики Казахстан от 24 мая 2000 года N 248 "Об утверждении Инструкции по составлению сметы расходов государственных казенных предприятий", зарегистрированный в Министерстве юстиции Республики Казахстан за N 1174
    kaz: Қазақстан Республикасы Әділет министрлігінде N 1174 болып тіркелген "Мемлекеттік қазыналық кәсіпорындар шығыстарының сметаларын жасау жөніндегі Нұсқаулықты бекiту туралы" Қазақстан Республикасы Қаржы министрінің 2000 жылғы 24 мамырдағы N 248 бұйрығына өзгерістер мен толықтырулар енгізу туралы
