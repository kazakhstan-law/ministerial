  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 7 июля 2006 года № 240 "Об утверждении Классификатора перечня товаров (работ, услуг) государственных учреждений, содержащихся за счет средств государственного бюджета, деньги от реализации которых остаются в их распоряжении"
    kaz: '"Мемлекеттік бюджет қаражаты есебінен ұсталатын, өткізуден түсетін ақшасы өзінің иелігінде қалатын мемлекеттік мекемелер тауарларының (жұмыстарының, көрсетілетін қызметтерінің) тізбесі сыныптауышын бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2006 жылғы 7 шілдедегі № 240 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
