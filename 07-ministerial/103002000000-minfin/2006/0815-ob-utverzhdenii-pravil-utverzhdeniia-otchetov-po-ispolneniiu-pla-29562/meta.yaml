  requisite: Приказ Министра финансов Республики Казахстан от 19 марта 2008 года № 128. Зарегистрирован в Министерстве юстиции Республики Казахстан 07 апреля 2008 года № 5182. Утратил силу совместным приказом Министра экономического развития и торговли Республики Казахстан от 28 февраля 2012 года № 53 и Министра финансов Республики Казахстан от 7 марта 2012 года № 141
  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 15 августа 2006 года N 302 "Об утверждении Правил утверждения отчетов по исполнению планов финансово-хозяйственной деятельности государственных предприятий, акционерных обществ (товариществ с ограниченной ответственностью), контрольные пакеты акций (доли участия) которых принадлежат государству, за исключением национальных компаний, акционерного общества "Казахстанский холдинг по управлению государственными активами "Самрук", акционерного общества "Фонд устойчивого развития "Қазына" и организаций, в отношении которых Национальный Банк Республики Казахстан и Управление делами Президента Республики Казахстан осуществляют функции субъекта права республиканской государственной собственности"
    kaz: '"Ұлттық компаниялар,"Самұрық" мемлекеттiк активтердi басқару жөнiндегi қазақстандық холдингi" акционерлік қоғамы, "Қазына" орнықты даму қоры" акционерлік қоғамы және оларға қатысты Қазақстан Республикасы Ұлттық Банкі және Қазақстан Республикасы Президентінің Іс басқармасы республикалық мемлекеттік меншік құқықтары субъектісінің функцияларын жүзеге асыратын ұйымдарды қоспағанда, мемлекеттік кәсіпорындардың, акцияларының бақылау пакеті (қатысу үлестері) мемлекетке тиесілі акционерлік қоғамдардың (жауапкершілігі шектеулі серіктестіктердің) қаржы-шаруашылық қызметі жоспарларының орындалуы жөніндегі есептерді бекіту ережесін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2006 жылғы 15 тамыздағы N 302 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/38867/rus
