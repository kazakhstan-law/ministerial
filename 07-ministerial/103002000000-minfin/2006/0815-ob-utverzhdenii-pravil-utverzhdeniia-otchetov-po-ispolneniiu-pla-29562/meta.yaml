  code: '64521'
  requisite: Совместный приказ Министра экономического развития и торговли Республики Казахстан от 28 февраля 2012 года № 53 и Министра финансов Республики Казахстан от 7 марта 2012 года № 141. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 апреля 2012 года № 7530. Утратил силу совместным приказом Министра национальной экономики Республики Казахстан от 2 сентября 2022 года № 62 и Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 2 сентября 2022 года № 917 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: Об утверждении структуры, форм, перечня показателей отчета по исполнению планов развития контролируемых государством акционерных обществ, товариществ с ограниченной ответственностью и государственных предприятий, а также о признании утратившими силу некоторых приказов Министра финансов Республики Казахстан
    kaz: Мемлекет бақылайтын акционерлік қоғамдардың, жауапкершілігі шектеулі серіктестіктердің және мемлекеттік кәсіпорындардың даму жоспарларын іске асыру жөніндегі есептің құрылымын, нысандарын, көрсеткіштер тізілімін бекіту туралы, сондай-ақ Қазақстан Республикасы Қаржы министрiнiң кейбiр бұйрықтарының күшi жойылды деп тану туралы
