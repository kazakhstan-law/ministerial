act_code: '29562'
requisite: Приказ Министра финансов Республики Казахстан от 15 августа 2006 года № 302. Зарегистрировано в Министерстве юстиции Республики Казахстан 5 сентября 2006 года № 4367. Утратил силу совместным приказом Министра экономического развития и торговли Республики Казахстан от 28 февраля 2012 года № 53 и Министра финансов Республики Казахстан от 7 марта 2012 года № 141
title:
  rus: Об утверждении Правил утверждения отчетов по исполнению планов финансово-хозяйственной деятельности государственных предприятий, акционерных обществ (товариществ с ограниченной ответственностью), контрольные пакеты акций (доли участия) которых принадлежат государству, за исключением национальных компаний и организаций, в отношении которых Национальный Банк Республики Казахстан и Управление делами Президента Республики Казахстан осуществляют функции субъекта права республиканской государственной собственности
  kaz: '"Ұлттық компаниялар және оларға қатысты Қазақстан Республикасы Ұлттық Банкі және Қазақстан Республикасы Президентінің Іс басқармасы республикалық мемлекеттік меншік құқықтары субъектісінің функцияларын жүзеге асыратын ұйымдарды қоспағанда, мемлекеттік кәсіпорындардың, акцияларының бақылау пакеті (қатысу үлестері) мемлекетке тиесілі акционерлік қоғамдардың (жауапкершілігі шектеулі серіктестіктердің) қаржы-шаруашылық қызметі жоспарларының орындалуы жөніндегі есептерді бекіту ережесін бекіту туралы'
