act_code: '99503'
requisite: Приказ Министра финансов Республики Казахстан от 29 декабря 2015 года № 725. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12776. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 7 февраля 2023 года № 1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О некоторых вопросах реализации кадровой политики в оперативно-следственных подразделениях органов по финансовому мониторингу (служба экономических расследований)
  kaz: Қаржы мониторингі органдарының жедел-тергеу қызметі бөлімшелерінде (экономикалық тергеу қызметі) кадрлық саясатты іске асырудың кейбір мәселелері туралы
