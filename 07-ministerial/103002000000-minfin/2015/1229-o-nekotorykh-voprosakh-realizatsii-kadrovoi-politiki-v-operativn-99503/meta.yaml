    kaz: Қазақстан Республикасы Қаржылық мониторинг агенттігі төрағасының және Қазақстан Республикасы Қаржы министрінің кейбір бұйрықтарының және олардың құрылымдық элементтерінің күші жойылды деп тану туралы
