requisite: Приказ Министра финансов Республики Казахстан от 27 марта 2015 года № 223. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 мая 2015 года № 11180. Утратил силу приказом Министра финансов Республики Казахстан от 16 марта 2018 года № 376 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил представления сведений по земельным участкам, предназначенным для строительства объектов и не используемым в соответствующих целях или используемым с нарушением законодательства Республики Казахстан, уполномоченным органом, осуществляющим государственный контроль за использованием и охраной земель в органы, государственных доходов
  kaz: Жердiң пайдаланылуы мен қорғалуына мемлекеттiк бақылауды жүзеге асыратын уәкiлеттi органның объектілер құрылысына арналған және тиісті мақсаттарда пайдаланылмайтын немесе Қазақстан Республикасының заңнамасын бұза отырып пайдаланылатын жер учаскелері бойынша мемлекеттік кірістер органдарына мәліметтерді ұсыну қағидаларын бекіту туралы
