  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 27 марта 2015 года № 223 "Об утверждении Правил выявления земельных участков, не используемых в соответствующих целях или используемых с нарушением законодательства Республики Казахстан и представлении сведений по таким земельным участкам уполномоченными государственными органами в органы государственных доходов"
    kaz: '"Уәкілетті мемлекеттік органдардың тиісті мақсаттарда пайдаланылмайтын немесе Қазақстан Республикасының заңнамасын бұза отырып пайдаланылатын жер учаскелерін айқындау және мемлекеттік кірістер органдарына осындай жер учаскелері бойынша мәліметтерді ұсыну қағидаларын бекіту туралы" Қазақстан Республикасы Қаржы Министрінің 2015 жылғы 27 наурыздағы № 223 бұйрығына өзгерістер енгізу туралы'
