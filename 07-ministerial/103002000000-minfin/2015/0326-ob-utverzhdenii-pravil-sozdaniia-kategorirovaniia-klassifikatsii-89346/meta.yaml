act_code: '89346'
requisite: Приказ Министра финансов Республики Казахстан от 26 марта 2015 года № 205. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 апреля 2015 года № 10811. Утратил силу приказом Министра финансов Республики Казахстан от 20 февраля 2018 года № 250 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил создания, категорирования, классификации, а также норм положенностей и типовых требований к обустройству и материально-техническому оснащению таможен, таможенных постов и контрольно-пропускных пунктов Республики Казахстан
  kaz: Қазақстан Республикасының кедендерін, кеден бекеттерін және бақылау-өткізу пункттерін құру, санатқа бөлу, сыныптау қағидаларын,  сондай-ақ оларды жайластыру мен материалдық-техникалық жарақтандырудың тиесілік нормаларын және оларға қойылатын үлгілік талаптарды бекіту туралы
