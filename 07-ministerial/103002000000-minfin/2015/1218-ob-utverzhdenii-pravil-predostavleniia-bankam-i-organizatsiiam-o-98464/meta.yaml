requisite: Приказ Министра финансов Республики Казахстан от 18 декабря 2015 года № 666. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12718. Утратил силу приказом Министра финансов Республики Казахстан от 14 февраля 2018 года № 183 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил предоставления банкам и организациям, осуществляющим отдельные виды банковских операций, информации о налогоплательщиках, в том числе физических лицах, состоящих на регистрационном учете в качестве индивидуального предпринимателя, частного нотариуса, частного судебного исполнителя, адвоката, профессионального медиатора
  kaz: Салық төлеушілер, оның ішінде дара кәсіпкер, жекеше нотариус, жеке сот орындаушысы, адвокат, кәсіби медиатор ретінде тіркеу есебінде тұрған жеке тұлғалар туралы ақпаратты банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдарға беру қағидаларын бекіту туралы
