requisite: Приказ Министра финансов Республики Казахстан от 15 января 2015 года № 27. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 февраля 2015 года № 10311. Утратил силу приказом Министра финансов Республики Казахстан от 6 февраля 2018 года № 134 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил подтверждения органами государственных доходов факта уплаты налога на добавленную стоимость по импортированным товарам и акциза по импортированным подакцизным товарам с территории государств-членов Таможенного союза либо мотивированного отказа в подтверждении
  kaz: Мемлекеттік кірістер органдарының Кеден одағына мүше мемлекеттердің аумағынан импортталған тауарлар бойынша қосылған құн салығын және импортталған акцизделетін тауарлар бойынша акцизді төлеу фактісін растау не растаудан дәлелді бас тарту қағидаларын бекіту туралы
