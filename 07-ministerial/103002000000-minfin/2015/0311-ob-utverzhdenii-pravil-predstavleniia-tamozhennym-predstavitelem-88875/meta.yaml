act_code: '88875'
requisite: Приказ Министра финансов Республики Казахстан от 11 марта 2015 года № 168. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 апреля 2015 года № 10723. Утратил силу приказом Министра финансов Республики Казахстан от 13 февраля 2018 года № 173 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил представления таможенным представителем отчетности, в том числе с использованием информационных технологий в органы государственных доходов, Правил ведения учета поступлений товаров в магазин беспошлинной торговли и их реализации в этом магазине, а также представления в органы государственных доходов отчетности о таких товарах и форм отчетов о применении таможенной процедуры переработки на (вне) таможенной территории и для внутреннего потребления
  kaz: Кеден өкілінің мемлекеттік кірістер органдарына есептілікті, оның ішінде ақпараттық технологияларды пайдалана отырып, ұсыну қағидасын, Бажсыз сауда дүкеніне тауарлар түсуінің және оларды осы дүкенде өткізудің есебін жүргізу, сондай-ақ мемлекеттік кірістер органдарына мұндай тауарлар туралы есептілікті ұсыну қағидасын және кедендік аумақта (аумақтан тыс) және ішкі тұтыну үшін қайта өңдеу кедендік рәсімін қолдану туралы есептердің нысандарын бекіту туралы
