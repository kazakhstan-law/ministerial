title:
  rus: Об утверждении форм уведомления о представлении в орган государственных доходов списков участников системы обязательного социального страхования и распоряжения органа государственных доходов о приостановлении расходных операций по кассе плательщика
  kaz: Міндетті әлеуметтік сақтандыру жүйесіне қатысушылардың тізімдерін мемлекеттік кірістер органына ұсыну туралы хабарламаның және төлеушінің кассасы бойынша шығыс операцияларын тоқтата тұру туралы мемлекеттік кірістер органы өкімінің нысандарын бекіту туралы
