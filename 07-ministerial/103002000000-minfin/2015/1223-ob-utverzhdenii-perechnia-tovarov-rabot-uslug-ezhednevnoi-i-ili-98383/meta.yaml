  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 23 декабря 2015 года № 677 «Об утверждении Перечня товаров, работ, услуг ежедневной и (или) еженедельной потребности на период до подведения итогов государственных закупок способом конкурса либо аукциона и вступления в силу договора о государственных закупках»
    kaz: «Конкурс немесе аукцион тәсілімен мемлекеттік сатып алу қорытындылары шығарылғанға және мемлекеттік сатып алу туралы шарт күшіне енгенге дейінгі кезеңге күн сайынғы және (немесе) апта сайынғы қажеттіліктегі тауарлардың, жұмыстардың, көрсетілетін қызметтердің тізбесін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 23 желтоқсандағы № 677 бұйрығына өзгерістер енгізу туралы
