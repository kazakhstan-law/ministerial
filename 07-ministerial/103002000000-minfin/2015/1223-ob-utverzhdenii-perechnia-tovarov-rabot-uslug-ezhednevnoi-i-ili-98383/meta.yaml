requisite: Приказ Министра финансов Республики Казахстан от 23 декабря 2015 года № 677. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12716. Утратил силу приказом Министра финансов Республики Казахстан от 20 августа 2024 года № 559 (вводится в действие с 1 января 2025 года)
title:
  rus: Об утверждении Перечня товаров, работ, услуг ежедневной и (или) еженедельной потребности на период до подведения итогов государственных закупок способом конкурса либо аукциона и вступления в силу договора о государственных закупках
  kaz: Конкурс не аукцион тәсілімен мемлекеттік сатып алу қорытындылары шығарылғанға және мемлекеттік сатып алу туралы шарт күшіне енгенге дейінгі кезеңге күн сайынғы және (немесе) апта сайынғы қажеттіліктегі тауарлардың, жұмыстардың, көрсетілетін қызметтердің тізбесін бекіту туралы
