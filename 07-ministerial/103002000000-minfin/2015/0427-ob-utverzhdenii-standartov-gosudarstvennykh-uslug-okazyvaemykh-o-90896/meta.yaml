  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 27 апреля 2015 года № 284 «Об утверждении стандартов государственных услуг, оказываемых органами государственных доходов Республики Казахстан»
    kaz: «Қазақстан Республикасының мемлекеттік кірістер органдары көрсететін мемлекеттік қызметтер стандарттарын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 27 сәуірдегі № 284 бұйрығына өзгерістер мен толықтырулар енгізу туралы
