  title:
    rus: О внесении изменения и дополнения в приказ Министра финансов Республики Казахстан от 18 сентября 2015 года № 489 «Об утверждении натуральных норм специального автотранспорта для Комитета казначейства Министерства финансов Республики Казахстан и его территориальных подразделений»
    kaz: «Қазақстан Республикасы Қаржы министрлігі Қазынашылық комитетіне және оның аумақтық бөлімшелеріне арналған арнайы автокөліктің заттай нормаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 18 қыркүйектегі № 489 бұйрығына өзгеріс пен толықтыру енгізу туралы
