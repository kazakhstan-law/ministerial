act_code: '97668'
requisite: Приказ Министра финансов Республики Казахстан от 29 декабря 2015 года № 726. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12762. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 января 2022 года № 1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и методики проведения ежегодного социологического мониторинга состояния морально-психологического климата в оперативно-следственных подразделениях органов по финансовому мониторингу (служба экономических расследований)
  kaz: Қаржы мониторингі органдарының жедел-тергеу бөлімшелерінде (экономикалық тергеу қызметі) моральдық-психологиялық ахуалдың жай-күйіне жыл сайынғы социологиялық мониторинг жүргізудің қағидалары мен әдістемесін бекіту туралы
