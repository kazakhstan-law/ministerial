  title:
    rus: О внесении изменений и дополнения в приказ Министра финансов Республики Казахстан от 26 марта 2015 года № 216 "Об утверждении перечня, форм и периодичности представления отчетности профессиональными и аудиторскими организациями, а также формы информации по страхованию гражданско-правовой ответственности аудиторской организации"
    kaz: '"Кәсіби және аудиторлық ұйымдардың есептілік тізбесін, нысандары мен ұсыну мерзімділігін, сондай-ақ аудиторлық ұйымның азаматтық-құқықтық жауапкершілігін сақтандыру жөніндегі ақпарат нысанын бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2015 жылғы 26 наурыздағы № 216 бұйрығына өзгерістер мен толықтыру енгізу туралы'
