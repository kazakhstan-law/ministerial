act_code: '89706'
requisite: Приказ Министра финансов Республики Казахстан от 26 марта 2015 года № 204. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 апреля 2015 года № 10824
title:
  rus: Об утверждении Правил исполнения судебных актов за счет государственного бюджета по возмещению вреда, причиненного в результате незаконного осуждения, незаконного привлечения к уголовной ответственности, незаконного применения в качестве меры пресечения заключения под стражу, домашнего ареста, подписки о невыезде, незаконного наложения административного взыскания в виде ареста или исправительных работ, незаконного помещения в организацию, оказывающую медицинскую помощь в области психического здоровья, или иную медицинскую организацию, проведения негласных следственных действий, впоследствии признанных незаконными в судебном порядке
  kaz: Заңсыз соттау, қылмыстық жауаптылыққа заңсыз тарту, бұлтартпау шарасы ретінде қамауға, үйқамаққа алуды, ешқайда кетпеу туралы қолхат беруді заңсыз қолдану, қамаққа алу немесе түзеу жұмыстары түрінде әкімшілік жазаны заңсыз қолдану, психикалық денсаулық саласында медициналық көмек көрсететін ұйымға немесе өзге де медициналық ұйымға заңсыз орналастыру, кейіннен сот тәртібімен заңсыз деп танылған жасырын тергеу әрекеттерін жүргізу салдарынан келтірілген зиянды өтеу бойынша сот актілерін мемлекеттік бюджет есебінен орындау қағидаларын бекіту туралы
