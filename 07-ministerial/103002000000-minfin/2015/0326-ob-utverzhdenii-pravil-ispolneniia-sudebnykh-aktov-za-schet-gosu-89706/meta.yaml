  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 26 марта 2015 года № 204 «Об утверждении Правил исполнения судебных актов за счет государственного бюджета по возмещению вреда, причиненного в результате незаконного осуждения, незаконного привлечения к уголовной ответственности, незаконного применения в качестве меры пресечения заключения под стражу, домашнего ареста, подписки о невыезде, незаконного наложения административного взыскания в виде ареста или исправительных работ, незаконного помещения в психиатрическое или другое лечебное учреждение»
    kaz: «Заңсыз соттау, қылмыстық жауаптылыққа заңсыз тарту, бұлтартпау шарасы ретінде қамауға, үйқамаққа алуды, ешқайда кетпеу туралы қолхат беруді заңсыз қолдану, қамаққа алу немесе түзеу жұмыстары түрінде әкімшілік жазаны заңсыз қолдану, психиатриялық немесе басқа да емдеу мекемесіне заңсыз орналастыру салдарынан келтірілген зиянды өтеу бойынша сот актілерін мемлекеттік бюджет есебінен орындау қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 26 наурыздағы № 204 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/117718/rus
