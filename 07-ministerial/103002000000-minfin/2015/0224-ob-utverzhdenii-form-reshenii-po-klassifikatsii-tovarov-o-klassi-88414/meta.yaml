title:
  rus: Об утверждении форм решений по классификации товаров, о классификации товара в несобранном виде и предварительных решений относительно определения страны происхождения товара при применении преференциального и непреференциального режимов
  kaz: Тауарларды сыныптау жөніндегі, тауарды жинақталмаған түрде сыныптау туралы шешімдердің және преференциялдық және преференциялдық емес режимдерді қолдану кезінде тауар шығарылған елді айқындауға қатысты алдын ала шешімдердің нысандарын бекіту туралы
