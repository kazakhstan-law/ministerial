  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 17 марта 2015 года № 179 «Об утверждении натуральных норм обеспечения государственных органов служебными и дежурными автомобилями, телефонной связью, офисной мебелью и площадями для размещения аппарата государственных органов»
    kaz: «Мемлекеттік органдарды қызметтік және кезекші автомобильдермен, телефон байланысымен, кеңсе жиһазымен және мемлекеттік органдардың аппаратын орналастыру үшін алаңдармен қамтамасыз етудің заттай нормаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 17 наурыздағы № 179 бұйрығына өзгеріс енгізу туралы
