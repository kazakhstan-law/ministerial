requisite: Приказ Министра финансов Республики Казахстан от 17 марта 2015 года № 179. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 апреля 2015 года № 10762. Утратил силу приказом Министра финансов Республики Казахстан от 22 мая 2025 года № 246 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм обеспечения государственных органов служебными и дежурными автомобилями, телефонной связью, офисной мебелью и площадями для размещения аппарата государственных органов
  kaz: Мемлекеттік органдарды қызметтік және кезекші автомобильдермен, телефон байланысымен, кеңсе жиһазымен және мемлекеттік органдардың аппаратын орналастыру үшін алаңдармен қамтамасыз етудің заттай нормаларын бекіту туралы
