act_code: '90871'
requisite: Приказ Министра финансов Республики Казахстан от 30 марта 2015 года № 229. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 мая 2015 года № 10931. Утратил силу приказом Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 26 июля 2019 года № 776 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил использовании органами государственных доходов сведений, представляемых банками и организациями, осуществляющими отдельные виды банковских операции, и соответствии с Кодексом Республики Казахстан «О налогах и других обязательных платежах и бюджет» (Налоговый кодекс)
  kaz: '"Салық және бюджетке төленетін басқа да міндетті төлемдер туралы" Қазақстан Республикасының Кодексіне (Салық кодексі) сәйкес банктер және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар табыс ететін мәліметтерді мемлекеттік кірістер органдарының пайдалануы қағидаларын бекіту туралы'
