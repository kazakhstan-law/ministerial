act_code: '86851'
requisite: Приказ Министра финансов Республики Казахстан от 15 января 2015 года № 26. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 февраля 2015 года № 10317. Утратил силу приказом Министра финансов Республики Казахстан от 6 февраля 2018 года № 132 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил применения уплаты налога на добавленную стоимость методом зачета по товарам, импортируемым на территорию Республики Казахстан с территории государств-членов Таможенного союза
  kaz: Қазақстан Республикасының аумағына Кеден одағына мүше мемлекеттердің аумағынан импортталатын тауарлар бойынша есепке жатқызу әдісімен қосылған құн салығын төлеуді қолдану қағидаларын бекіту туралы
