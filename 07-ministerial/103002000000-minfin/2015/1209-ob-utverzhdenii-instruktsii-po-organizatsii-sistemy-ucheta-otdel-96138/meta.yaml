title:
  rus: Об утверждении Инструкции по организации системы учета отдельных товаров при их перемещении в рамках взаимной трансграничной торговли государств-членов Евразийского экономического союза
  kaz: Еуразиялық экономикалық одаққа мүше мемлекеттердің өзара трансшекаралық саудасы шеңберінде жекелеген тауарларды, оларды өткізу кезінде есепке алу жүйесін ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
