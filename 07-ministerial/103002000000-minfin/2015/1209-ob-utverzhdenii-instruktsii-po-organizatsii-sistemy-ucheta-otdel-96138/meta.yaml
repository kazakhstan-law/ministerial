    kaz: «Еуразиялық экономикалық одаққа мүше мемлекеттердің өзара трансшекаралық саудасы шеңберінде жекелеген тауарларды өткізу кезінде оларды есепке алу жүйесін ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 9 желтоқсандағы № 640 бұйрығына өзгерістер енгізу туралы
