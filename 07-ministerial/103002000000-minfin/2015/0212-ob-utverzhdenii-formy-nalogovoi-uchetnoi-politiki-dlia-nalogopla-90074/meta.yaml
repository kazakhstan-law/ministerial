act_code: '90074'
requisite: Приказ Министра финансов Республики Казахстан от 12 февраля 2015 года № 86. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 марта 2015 года № 10458. Утратил силу приказом Министра финансов Республики Казахстан от 1 февраля 2018 года № 97 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении формы налоговой учетной политики для налогоплательщиков, применяющих специальный налоговый режим для субъектов малого бизнеса, специальный налоговый режим для крестьянских или фермерских хозяйств
  kaz: Шағын бизнес субъектілеріне арналған арнаулы салық режимін, шаруа немесе фермер қожалықтарына арналған арнаулы салық режимін қолданатын салық төлеушілер үшін салықтық есепке алу саясатының нысанын бекіту туралы
