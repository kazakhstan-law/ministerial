requisite: Приказ Министра финансов Республики Казахстан от 29 декабря 2015 года № 721. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12770. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 13 января 2022 года № 11 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Перечня специальностей для удовлетворения потребностей в кадрах с учетом кадрового планирования в оперативно-следственных подразделениях органов по финансовому мониторингу (служба экономических расследований)
  kaz: Қаржы мониторингі органдарының жедел-тергеу бөлімшелерінде (экономикалық тергеу қызметі) кадр жоспарлауды ескере отырып, кадрларға деген қажеттіліктерін өтеуге арналған мамандықтар тізбесін бекіту туралы
