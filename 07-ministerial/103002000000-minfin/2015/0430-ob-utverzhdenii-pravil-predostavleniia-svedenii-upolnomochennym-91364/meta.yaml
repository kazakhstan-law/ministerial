title:
  rus: Об утверждении Правил предоставления сведений уполномоченным органом в области развития агропромышленного комплекса по суммам полученных субсидий за счет бюджетных средств суммы налога на добавленную стоимость заготовительной организацией в сфере агропромышленного комплекса
