  requisite: Приказ Министра финансов Республики Казахстан от 29 февраля 2016 года № 91. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 марта 2016 года № 13553. Утратил силу приказом Министра финансов Республики Казахстан от 26 сентября 2024 года № 646 (вводится в действие с 1 января 2025 года)
  title:
    rus: Об утверждении перечня товаров, работ, услуг, по которым государственные закупки осуществляются способом конкурса с предварительным квалификационным отбором и внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 28 декабря 2015 года № 694 "Об утверждении Правил формирования и ведения реестров в сфере государственных закупок"
    kaz: Мемлекеттік сатып алу алдын ала біліктілік іріктеуі арқылы конкурс тәсілімен жүзеге асырылатын тауарлардың, жұмыстардың, көрсетілетін қызметтердің тізбесін бекіту және "Мемлекеттік сатып алу саласында тізілімдерді қалыптастырудың және жүргізудің қағидаларын бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2015 жылғы 28 желтоқсандағы № 694 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/100918/rus
