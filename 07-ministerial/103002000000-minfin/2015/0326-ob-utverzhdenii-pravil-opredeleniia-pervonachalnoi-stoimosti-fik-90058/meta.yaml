act_code: '90058'
requisite: Приказ Министра финансов Республики Казахстан от 26 марта 2015 года № 209. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 мая 2015 года № 10978. Утратил силу приказом Министра финансов Республики Казахстан от 15 февраля 2018 года № 195 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил определения первоначальной стоимости фиксированных активов, получаемых концессионером (правопреемником или юридическим лицом, специально созданным исключительно концессионером для реализации договора концессии) от концедента по договору концессии, а также стоимости, уменьшающей стоимостные балансы групп концессионера при передаче фиксированных активов концессионером концеденту при прекращении договора концессии
  kaz: Концессионер (концессия шартын іске асыру үшін тек қана концессионер арнайы құрған құқықтық мирасқор немесе заңды тұлға) концессия шарты бойынша концеденттен алатын, тіркелген активтердің бастапқы құнын, сондай-ақ концессия шарты тоқтатылған кезде концессионер тіркелген активтерді концедентке беру кезінде концессионер топтарының құндық теңгерімін азайтатын құнын айқындау қағидаларын бекіту туралы
