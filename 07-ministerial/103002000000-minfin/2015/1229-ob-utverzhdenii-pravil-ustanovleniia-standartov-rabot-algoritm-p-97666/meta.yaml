requisite: Приказ Министра финансов Республики Казахстан от 29 декабря 2015 года № 729. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12778. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 января 2022 года № 4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил установления стандартов работ (алгоритм, правила и требования к результатам деятельности сотрудника на конкретном участке работы) в оперативно-следственных подразделениях органов по финансовому мониторингу (служба экономических расследований)
  kaz: Қаржы мониторингі органдарының жедел–тергеу бөлімшелеріндегі (экономикалық тергеу қызметі) жұмыс стандарттарын (қызметкердің нақты жұмыс учаскесіндегі қызмет нәтижелеріне қойылатын алгоритм, қағидалар және талаптар) белгілеу қағидаларын бекіту туралы
