requisite: Приказ Министра финансов Республики Казахстан от 20 апреля 2015 года № 274. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 мая 2015 года № 11172. Утратил силу приказом Министра финансов Республики Казахстан от 26 февраля 2018 года № 294 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил учета в органах государственных доходов обеспечения уплаты таможенных пошлин, налогов, определения суммы обеспечения уплаты таможенных пошлин, налогов, а также применения генерального обеспечения уплаты таможенных пошлин, налогов
  kaz: Мемлекеттік кірістер органдарында кедендік баждардың, салықтардың төленуін қамтамасыз етуді есепке алу, кедендік баждардың, салықтардың төленуін қамтамасыз ету сомасын айқындау және кедендік баждардың, салықтардың төленуін бас қамтамасыз етуді қолдану қағидаларын бекіту туралы
