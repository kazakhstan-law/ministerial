  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 20 апреля 2015 года № 274 «Об утверждении Правил учета в органах государственных доходов обеспечения уплаты таможенных пошлин, налогов, определения суммы обеспечения уплаты таможенных пошлин, налогов, а также применения генерального обеспечения уплаты таможенных пошлин, налогов»
    kaz: «Мемлекеттік кірістер органдарында кедендік баждардың, салықтардың төленуін қамтамасыз етуді есепке алу, кедендік баждардың, салықтардың төленуін қамтамасыз ету сомасын айқындау және кедендік баждардың, салықтардың төленуін бас қамтамасыз етуді қолдану қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 20 сәуірдегі № 274 бұйрығына өзгерістер енгізу туралы
