act_code: '90412'
requisite: Приказ Министра финансов Республики Казахстан от 19 мая 2015 года № 308. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 июня 2015 года № 11242. Утратил силу приказом Министра финансов Республики Казахстан от 12 февраля 2018 года № 168 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня должностных лиц органов государственных доходов, имеющих право ношения форменной одежды (без погон), натуральных норм обеспечения ею, правил ее ношения и знака различия
  kaz: Нысанды киімді (погонсыз) киіп жүруге құқығы бар мемлекеттік кірістер органдарының лауазымды адамдарының, онымен қамтамасыз етудің заттай нормаларының тізбесін, оны киіп жүру қағидаларын және айырым белгісін бекіту туралы
