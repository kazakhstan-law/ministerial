act_code: '87702'
requisite: Приказ Министра финансов Республики Казахстан от 17 февраля 2015 года № 97. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 марта 2015 года № 10448. Утратил силу приказом Министра финансов Республики Казахстан от 1 октября 2020 года № 944 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил списания суммы штрафа, наложенной до 1 января 2014 года и не уплаченной по состоянию на 1 октября 2014 года, за правонарушения в области налогообложения, нарушение законодательства о пенсионном обеспечении и (или) обязательном социальном страховании в соответствии с Кодексом Республики Казахстан об административных правонарушениях
  kaz: Салық салу саласындағы құқық бұзушылықтар, зейнетақымен қамсыздандыру туралы және (немесе) міндетті әлеуметтік сақтандыру туралы заңнаманы бұзушылықтар үшін Қазақстан Республикасының Әкімшілік құқық бұзушылық туралы кодексімен 2014 жылғы 1 қаңтарға дейін салынған 2014 жылғы 1 қазандағы жағдай бойынша төленбеген және айыппұл сомаларын есептен шығару қағидаларын бекіту туралы
