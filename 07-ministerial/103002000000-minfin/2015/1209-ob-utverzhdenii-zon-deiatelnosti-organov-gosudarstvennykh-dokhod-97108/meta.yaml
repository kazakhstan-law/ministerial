requisite: Приказ Министра финансов Республики Казахстан от 9 декабря 2015 года № 638. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12781. Утратил силу приказом Министра финансов Республики Казахстан от 12 февраля 2018 года № 167 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении зон деятельности органов государственных доходов, в пределах которых осуществляется таможенный контроль в отношении товаров и транспортных средств международной перевозки, находящихся под таможенным контролем
  kaz: Кедендік бақылаудағы тауарлар және халықаралық тасымал көлік құралдарына қатысты кедендік бақылауды жүзеге асыратын шегіндегі мемлекеттік кірістер органдарының қызмет ету аймақтарын бекіту туралы
