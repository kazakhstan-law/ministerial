requisite: Приказ Министра финансов Республики Казахстан от 29 декабря 2015 года № 728. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12787. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 января 2022 года № 6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил формирования кадрового резерва, требований к квалификации сотрудников, зачисляемых в кадровый резерв, и работы с ведомственным банком данных сотрудников, зачисленных в кадровый резерв оперативно-следственных подразделений органов по финансовому мониторингу (служба экономических расследований)
  kaz: Қаржы мониторингі органдарының жедел-тергеу бөлімшелерінің (экономикалық тергеу қызметі) кадр резервін, кадр резервіне қойылатын қызметкерлердің біліктілігіне қойылатын талаптарды және кадр резервіне қойылған қызметкерлердің ведомстволық деректер банкімен жұмысты жүргізудің қағидаларын бекіту туралы
