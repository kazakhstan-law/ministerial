requisite: Приказ от 27.02.2015 №144, Министерство финансов Республики Казахстан. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 апреля 2015 года № 10611. Утратил силу приказом Министра финансов Республики Казахстан от 8 февраля 2018 года № 143 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил маркировки (перемаркировки) алкогольной продукции, за исключением виноматериала и пива, учетно-контрольными марками и табачных изделий акцизными марками, а также формы, содержания и элементов защиты акцизных и учетно-контрольных марок
  kaz: Шарап материалы мен сыраны қоспағанда, алкоголь өнімін есепке алу-бақылау таңбаларымен және темекі бұйымдарын акциздік таңбалармен таңбалау (қайта таңбалау) қағидаларын, сондай-ақ акциздік және есепке алу-бақылау таңбаларын нысанын, мазмұнын және қорғау элементтерін бекіту туралы
