  title:
    rus: О внесении изменений и дополнения в приказ Министра финансов Республики Казахстан от 27 февраля 2015 года № 144 "Об утверждении Правил маркировки (перемаркировки) алкогольной продукции, за исключением виноматериала и пива, учетно-контрольными марками и табачных изделий акцизными марками, а также формы, содержания и элементов защиты акцизных и учетно-контрольных марок"
    kaz: '"Шарап материалы мен сыраны қоспағанда, алкоголь өнімін есепке алу-бақылау таңбаларымен және темекі бұйымдарын акциздік таңбалармен таңбалау (қайта таңбалау) қағидаларын, сондай-ақ акциздік және есепке алу-бақылау таңбаларының нысанын, мазмұнын және қорғау элементтерін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2015 жылғы 27 ақпандағы № 144 бұйрығына өзгерістер мен толықтыру енгізу туралы'
