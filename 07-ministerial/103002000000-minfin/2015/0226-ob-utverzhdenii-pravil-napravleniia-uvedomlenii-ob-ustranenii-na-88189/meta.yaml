act_code: '88189'
requisite: Приказ Министра финансов Республики Казахстан от 26 февраля 2015 года № 132. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 апреля 2015 года № 10608. Утратил силу приказом Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 8 апреля 2020 года № 368 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил направления уведомлений об устранении нарушений, выявленных по результатам проверки деятельности предыдущего администратора, отстраненного за эти нарушения, по результатам камерального контроля деятельности администратора, представления отчета об исполнении уведомления об устранении нарушений, выявленных по результатам камерального контроля деятельности администратора, а также форм уведомлений об устранении нарушений, выявленных по результатам проверки деятельности предыдущего администратора, отстраненного за эти нарушения, по результатам камерального контроля деятельности администратора, отчета об исполнении уведомления об устранении нарушений, выявленных по результатам камерального контроля деятельности администратора
  kaz: Қызметін тексеру нәтижелері бойынша анықталған бұзушылықтар үшін шеттетілген алдыңғы әкімшінің осы бұзушылықтарын, әкімшінің қызметін камералдық бақылау нәтижелері бойынша аңықталған бұзушылықтарды жою туралы хабарламаларды жіберу, әкімшінің қызметін камералдық бақылау нәтижелері бойынша анықталған бұзушылықтарды жою туралы хабарламаның орындалуы туралы есепті беру қағидаларын, сондай-ақ қызметін тексеру нәтижелері бойынша анықталған бұзушылықтар үшін шеттетілген алдыңғы әкімшінің осы бұзушылықтарын, әкімшінің қызметін камералдық бақылау нәтижелері бойынша аңықталған бұзушылықтарды жою туралы хабарламалардың, әкімшінің қызметін камералдық бақылау нәтижелері бойынша анықталған бұзушылықтарды жою туралы хабарламаның орындалуы туралы есептің нысандарын бекіту туралы
