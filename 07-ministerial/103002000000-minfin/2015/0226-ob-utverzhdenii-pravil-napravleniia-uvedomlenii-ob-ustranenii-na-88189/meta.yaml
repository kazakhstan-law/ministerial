  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 26 февраля 2015 года № 132 «Об утверждении правил направления уведомлений об устранении нарушений, выявленных по результатам проверки деятельности предыдущего администратора, отстраненного за эти нарушения, по результатам камерального контроля деятельности администратора, представления отчета об исполнении уведомления об устранении нарушений, выявленных по результатам камерального контроля деятельности администратора, а также форм уведомлений об устранении нарушений, выявленных по результатам проверки деятельности предыдущего администратора, отстраненного за эти нарушения, по результатам камерального контроля деятельности администратора, отчета об исполнении уведомления об устранении нарушений, выявленных по результатам камерального контроля деятельности администратора»
    kaz: «Қызметін тексеру нәтижелері бойынша анықталған бұзушылықтар үшін шеттетілген алдыңғы әкімшінің осы бұзушылықтарын, әкімшінің қызметін камералдық бақылау нәтижелері бойынша бұзушылықтарды жою туралы хабарламаларды жіберу, әкімшінің қызметін камералдық бақылау нәтижелері бойынша анықталған бұзушылықтарды жою туралы хабарламаның орындалуы туралы есепті беру қағидаларын, сондай-ақ қызметін тексеру нәтижелері бойынша анықталған бұзушылықтар үшін шеттетілген алдыңғы әкімшінің осы бұзушылықтарын, әкімшінің қызметін камералдық бақылау нәтижелері бойынша бұзушылықтарды жою туралы хабарламалардың, әкімшінің қызметін камералдық бақылау нәтижелері бойынша анықталған бұзушылықтарды жою туралы хабарламаның орындалуы туралы есептің нысандарын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 26 ақпандағы № 132 бұйрығына өзгерістер енгізу туралы
