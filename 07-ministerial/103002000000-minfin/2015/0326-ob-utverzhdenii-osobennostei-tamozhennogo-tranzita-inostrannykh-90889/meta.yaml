  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 26 марта 2015 года № 206 «Об утверждении Особенностей таможенного транзита иностранных товаров, перемещаемых по территории Республики Казахстан»
    kaz: «Қазақстан Республикасының аумағы арқылы өткізілетін шетелдік тауарларды тасымалдау кезінде кедендік транзиттің ерекшеліктерін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 26 наурыздағы № 206 бұйрығына өзгерістер мен толықтырулар енгізу туралы
