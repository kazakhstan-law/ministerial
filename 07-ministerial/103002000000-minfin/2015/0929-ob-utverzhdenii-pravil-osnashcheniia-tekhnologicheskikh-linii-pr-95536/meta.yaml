act_code: '95536'
requisite: Приказ Министра финансов Республики Казахстан от 29 сентября 2015 года № 498. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 октября 2015 года № 12219
title:
  rus: Об утверждении Правил оснащения технологических линий производства этилового спирта и (или) алкогольной продукции контрольными приборами учета, их функционирования и осуществления учета, кроме производства вина наливом (виноматериала), а также пивоваренной продукции, производственные мощности которых ниже четырехсот тысяч декалитров в год
  kaz: Толысылған шарап (шарап материалы), сондай-ақ өндiрiстiк қуаты жылына төрт жүз мың декалитрден төмен сыра қайнату өнімі өндiрiсiнен басқа, этил спиртiн және (немесе) алкоголь өнiмiн өндiрудiң технологиялық желiлерiн есепке алудың бақылау аспаптарымен жарақтандыру, олардың жұмыс iстеу және есепке алынуын жүзеге асыру қағидаларын бекіту туралы
