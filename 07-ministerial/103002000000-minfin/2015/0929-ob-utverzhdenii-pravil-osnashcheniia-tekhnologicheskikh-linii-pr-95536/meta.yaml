  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 29 сентября 2015 года № 498 «Об утверждении Правил оснащения технологических линий производства этилового спирта и (или) алкогольной продукции контрольными приборами учета, их функционирования и осуществления учета, кроме производства виноматериала, а также пива и пивного напитка, производственные мощности которых ниже четырехсот тысяч декалитров в год»
    kaz: «Шарап материалы, сондай-ақ өндiрiстiк қуаты жылына төрт жүз мың декалитрден төмен сыра және сыра сусыны өндiрiсiнен басқа, этил спиртiн және (немесе) алкоголь өнiмiн өндiрудiң технологиялық желiлерiн есепке алудың бақылау аспаптарымен жарақтандыру, олардың жұмыс iстеу және есепке алынуын жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 29 қыркүйектегі № 498 бұйрығына өзгерістер енгізу туралы
