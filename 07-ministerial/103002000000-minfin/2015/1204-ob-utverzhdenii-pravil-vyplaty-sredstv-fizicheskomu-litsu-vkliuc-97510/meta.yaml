  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 4 декабря 2015 года № 613 «Об утверждении Правил выплаты средств физическому лицу, включенному в перечень организаций и лиц, связанных с финансированием терроризма и экстремизма, для обеспечения своей жизнедеятельности»
    kaz: «Терроризмді және экстремизмді қаржыландырумен байланысты ұйымдар мен тұлғалар тізбесіне енгізілген жеке тұлғаның тыныс-тіршілігін қамтамасыз етуі үшін оған қаражат төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 4 желтоқсандағы № 613 бұйрығына өзгерістер енгізу туралы
