requisite: Приказ Министра финансов Республики Казахстан от 4 декабря 2015 года № 613. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 января 2016 года № 12823. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 12 августа 2025 года № 10 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выплаты средств физическому лицу, включенному в перечень организаций и лиц, связанных с финансированием терроризма и экстремизма, для обеспечения своей жизнедеятельности
  kaz: Терроризмді және экстремизмді қаржыландырумен байланысты ұйымдар мен тұлғалар тізбесіне енгізілген жеке тұлғаның тыныс-тіршілігін қамтамасыз етуі үшін оған қаражат төлеу қағидаларын бекіту туралы
