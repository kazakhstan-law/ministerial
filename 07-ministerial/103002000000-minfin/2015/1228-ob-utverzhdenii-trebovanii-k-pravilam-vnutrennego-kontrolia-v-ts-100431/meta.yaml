requisite: Приказ Министра финансов Республики Казахстан от 28 декабря 2015 года № 708. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 марта 2016 года № 13500. Утратил силу приказом Министра финансов Республики Казахстан от 24 сентября 2020 года № 915 (вводится в действие с 15 ноября 2020 года)
title:
  rus: Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для адвокатов и других независимых специалистов по юридическим вопросам
  kaz: Адвокаттарға және заң мәселелері бойынша басқа да тәуелсіз мамандарға арналған қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы
