act_code: '87168'
requisite: Приказ Министра финансов Республики Казахстан от 19 января 2015 года № 36. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 февраля 2015 года № 10315. Утратил силу приказом Министра финансов Республики Казахстан от 29 сентября 2015 года № 498
title:
  rus: Об утверждении требований по оснащению технологических линий производства этилового спирта спиртоизмеряющими аппаратами, производства алкогольной продукции (кроме виноматериала и пива) - контрольными приборами учета, обеспечивающими автоматизированную передачу уполномоченному органу в режиме реального времени данных об объемах выработки, а также порядка по контролю за их функционированием и осуществлением учета этилового спирта и алкогольной продукции
  kaz: Этил спиртін өндірудің технологиялық желілерін спирт өлшейтін аппараттармен, алкоголь өнімін (шарап материалынан және сырадан басқа) өндіруді - уәкілетті органға нақты уақыт режимінде өндіру көлемі туралы деректерді автоматты түрде беруді қамтамасыз ететін есептеуші бақылау аспаптарымен жарақтау жөніндегі талаптарды, сондай-ақ олардың жұмыс істеуін және этил спирті мен алкоголь өнімінің есепке алынуын жүзеге асыруды бақылау тәртібін бекіту туралы
