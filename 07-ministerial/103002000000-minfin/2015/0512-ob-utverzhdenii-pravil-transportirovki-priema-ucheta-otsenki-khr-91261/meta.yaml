  kaz: Мемлекет меншігіне жекелеген негіздер бойынша айналдырылған (түскен) бағалы металдарды, асыл тастарды және олардан жасалған бұйымдарды тасымалдау, қабылдау, есепке алу, бағалау, сақтау және өткізу қағидаларын бекіту туралы
