requisite: Приказ Министра финансов Республики Казахстан от 29 декабря 2015 года № 724. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12761. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 января 2022 года № 5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
