  kaz: Уақытша әкімшінің және оңалтуды басқарушылардың негізгі сыйақысының ең төмен мөлшері, сондай-ақ уақытша және банкроттықты басқарушылардың негізгі сыйақысының мөлшері мен оларды төлеу қағидаларын бекіту туралы
