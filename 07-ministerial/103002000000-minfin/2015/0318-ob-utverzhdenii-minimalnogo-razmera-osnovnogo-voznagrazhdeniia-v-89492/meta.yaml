act_code: '89492'
requisite: Приказ Министра финансов Республики Казахстан от 18 марта 2015 года № 183. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 апреля 2015 года № 10808. Утратил силу приказом Министра финансов Республики Казахстан от 21 апреля 2017 года № 265 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении минимального размера основного вознаграждения временного администратора и реабилитационного управляющих, а также размера основного вознаграждения временного и банкротного управляющих и правил их выплаты
  kaz: Уақытша әкімшінің және оңалтуды басқарушылардың негізгі сыйақысының ең төмен мөлшері, сондай-ақ уақытша және банкроттықты басқарушылардың негізгі сыйақысының мөлшері мен оларды төлеу қағидаларын бекіту туралы
