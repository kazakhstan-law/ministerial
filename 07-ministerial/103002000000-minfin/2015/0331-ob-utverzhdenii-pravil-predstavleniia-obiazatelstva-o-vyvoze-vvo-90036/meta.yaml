title:
  rus: Об утверждении Правил представления обязательства о вывозе (ввозе) продуктов переработки и его исполнения, формы представления обязательства о вывозе (ввозе) продуктов переработки
  kaz: Қайта өңдеу өнімдерін әкету (әкелу) жөнінде міндеттемені табыс ету және оны орындау қағидаларын, қайта өңдеу өнімдерін әкету (әкелу) жөнінде міндеттемені табыс ету нысандарын бекіту туралы
