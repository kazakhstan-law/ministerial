    kaz: '"Қайта өңдеу өнімдерін әкету (әкелу) жөнінде міндеттемені табыс ету және оны орындау қағидаларын, қайта өңдеу өнімдерін әкету (әкелу) жөнінде міндеттемені табыс ету нысандарын бекіту туралы" Қазақстан Республикасы Қаржы Министрінің 2015 жылғы 31 наурыздағы № 240 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
