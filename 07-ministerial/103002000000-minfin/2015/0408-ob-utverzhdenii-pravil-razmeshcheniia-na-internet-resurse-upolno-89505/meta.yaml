requisite: Приказ Министра финансов Республики Казахстан от 8 апреля 2015 года № 264. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 апреля 2015 года № 10923. Утратил силу приказом Министра финансов Республики Казахстан от 13 марта 2017 года № 160 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
