act_code: '97452'
requisite: Приказ Министра финансов Республики Казахстан от 30 ноября 2015 года № 596. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 декабря 2015 года № 12606
title:
  rus: Об утверждении формы Распоряжения уполномоченного органа по внутреннему государственному аудиту о приостановлении расходных операций по кодам и счетам объектов государственного аудита, открытым в центральном уполномоченном органе по исполнению бюджета, а также банковским счетам (за исключением корреспондентских) объекта государственного аудита
  kaz: Ішкі мемлекеттік аудит жөніндегі уәкілетті органның мемлекеттік аудит объектілерінің бюджетті атқару жөніндегі орталық уәкілетті органда ашылған кодтары мен шоттары, сондай-ақ мемлекеттік аудит объектісінің банк шоттары (корреспонденттік шоттарды қоспағанда) бойынша шығыс операцияларын тоқтата тұру туралы өкімінің нысанын бекіту туралы
