act_code: '88045'
requisite: Приказ Министра финансов Республики Казахстан от 18 февраля 2015 года № 103. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 марта 2015 года № 10515. Утратил силу приказом Министра финансов Республики Казахстан от 26 января 2018 года № 72 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил предоставления в орган государственных доходов акимами поселков, сел, сельских округов отчетов об использовании квитанций по сбору налогов на имущество, транспортные средства и земельного налога, уплачиваемых налогоплательщиком – физическим лицом, а также сдачи сумм налогов в банк или организацию, осуществляющую отдельные виды банковских операций
  kaz: Кенттер, ауылдар, ауылдық округтер әкімдерінің мемлекеттік кірістер органына салық төлеуші – жеке тұлға төлейтін мүлік, көлік құралдары салықтары мен жер салығын жинау жөніндегі квитанцияларды пайдалану, сондай-ақ салық сомасын банкке немесе банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымға тапсыру туралы есептер беру қағидаларын бекіту туралы
