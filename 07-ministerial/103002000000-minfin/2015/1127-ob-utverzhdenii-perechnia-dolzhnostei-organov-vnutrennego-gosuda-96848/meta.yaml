  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 27 ноября 2015 года № 591 «Об утверждении перечня должностей органов внутреннего государственного аудита и финансового контроля, для занятия которых необходимо наличие сертификата, удостоверяющего квалификацию государственного аудитора»
    kaz: «Ішкі мемлекеттік аудит және қаржылық бақылау органдарының орналасу үшін мемлекеттік аудитор біліктілігін куәландыратын сертификаттың болуы қажет лауазымдарының тізбесін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 27 қарашадағы № 591 бұйрығына өзгеріс енгізу туралы
