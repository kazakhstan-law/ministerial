title:
  rus: Об утверждении перечня должностей органов внутреннего государственного аудита и финансового контроля, для занятия которых необходимо наличие сертификата, удостоверяющего квалификацию государственного аудитора
  kaz: 'Ішкі мемлекеттік аудит және қаржылық бақылау органдарының орналасу үшін мемлекеттік аудитор біліктілігін куәландыратын сертификаттың болуы қажет лауазымдарының тізбесін бекіту туралы '
