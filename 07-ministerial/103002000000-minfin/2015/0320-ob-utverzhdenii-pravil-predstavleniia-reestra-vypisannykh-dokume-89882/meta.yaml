  kaz: Мемлекеттік материалдық резервтен тауарларды мемлекеттік материалдық резерв саласындағы уәкілетті органның құрылымдық бөлімшесімен шығаруға жазып берген құжаттардың тізілімін беру қағидаларын және оның нысанын бекіту туралы
