  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 30 января 2015 года № 60 «Об утверждении квалификационных требований и перечня документов, подтверждающих соответствие им, для осуществления деятельности в сферах производства этилового спирта, производства алкогольной продукции, хранения и оптовой реализации алкогольной продукции, за исключением деятельности по хранению и оптовой реализации алкогольной продукции на территории ее производства, а также хранения и розничной реализации алкогольной продукции, за исключением деятельности по хранению и розничной реализации алкогольной продукции на территории ее производства»
    kaz: «Этил спиртін өндіру, алкоголь өнімін өндіру, алкоголь өнімдерін өндіру аумағында оны сақтау және көтерме саудада сату жөніндегі қызметті қоспағанда, алкоголь өнімін сақтау және көтерме саудада сату, сондай-ақ алкоголь өнімдерін өндіру аумағында оны сақтау және бөлшек саудада сату жөніндегі қызметті қоспағанда, алкоголь өнімін сақтау және бөлшек саудада сату саласындағы қызметті жүзеге асыруға қойылатын біліктілік талаптары және оларға сәйкестігін растайтын құжаттар тізбесін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 30 қаңтардағы № 60 бұйрығына өзгеріс енгізу туралы
