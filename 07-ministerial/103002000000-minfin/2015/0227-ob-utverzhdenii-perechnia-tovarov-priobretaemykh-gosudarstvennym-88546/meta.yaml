act_code: '88546'
requisite: Приказ от 27.02.2015 № 141, Министерство финансов Республики Казахстан. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 апреля 2015 года № 10645. Утратил силу приказом Министра финансов Республики Казахстан от 28 декабря 2015 года № 691
title:
  rus: Об утверждении Перечня товаров, приобретаемых государственными предприятиями, юридическими лицами, пятьдесят и более процентов голосующих акций (долей участия в уставном капитале) которых принадлежат государству, и аффилиированными с ними юридическими лицами с целью их последующей переработки
  kaz: Мемлекеттік кәсіпорындар, дауыс беретін акцияларының (жарғылық капиталындағы қатысу үлестерінің) елу және одан да көп пайызы мемлекетке тиесілі заңды тұлғалар және олармен үлестес заңды тұлғалар оларды кейіннен қайта өңдеу мақсатында сатып алатын тауарлардың тізбесін бекіту туралы
