  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 27 февраля 2015 года № 135 «Об утверждении Правил приема, хранения сведений с контрольно-кассовых машин с функцией фиксации и (или) передачи данных о денежных расчетах, осуществляемых при реализации товаров, работ, услуг, а также их передачи в органы государственных доходов оператором фискальных данных»
    kaz: «Тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізу кезінде жүзеге асырылатын ақшалай есеп айырысулар туралы деректерді тіркеу және (немесе) беру функциясы бар бақылау-касса машиналарынан мәліметтерді қабылдау, сақтау, сондай-ақ оларды фискалдық деректер операторының мемлекеттік кірістер органдарына беру қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 27 ақпандағы № 135 бұйрығына өзгеріс енгізу туралы
