act_code: '88648'
requisite: Приказ Министра финансов Республики Казахстан от 27 февраля 2015 года № 135. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 апреля 2015 года № 10665. Утратил силу приказом Министра финансов Республики Казахстан от 16 февраля 2018 года № 208 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил приема, хранения сведений с контрольно-кассовых машин с функцией фиксации и (или) передачи данных о денежных расчетах,  осуществляемых при реализации товаров, работ, услуг, а также их передачи в органы государственных доходов оператором фискальных данных
  kaz: Тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізу кезінде жүзеге асырылатын ақшалай есеп айырысулар туралы деректерді тіркеу және (немесе) беру функциясы бар бақылау-касса машиналарынан мәліметтерді қабылдау, сақтау, сондай-ақ оларды фискалдық деректер операторының мемлекеттік кірістер органдарына беру қағидаларын бекіту туралы
