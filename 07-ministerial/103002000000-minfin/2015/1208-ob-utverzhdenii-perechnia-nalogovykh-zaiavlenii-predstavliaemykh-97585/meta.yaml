  title:
    rus: О внесении изменений в совместный приказ Министра по инвестициям и развитию Республики Казахстан от 9 декабря 2015 года № 1189 и Министра финансов Республики Казахстан от 8 декабря 2015 года № 630 «Об утверждении перечня налоговых заявлений, представляемых через Государственную корпорацию «Правительство для граждан»
    kaz: «Азаматтарға арналған үкімет» мемлекеттік корпорациясы арқылы ұсынылатын салықтық өтініштердің тізбесін бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2015 жылғы 9 желтоқсандағы № 1189 және Қазақстан Республикасы Қаржы министрінің 2015 жылғы 8 желтоқсандағы № 630 бірлескен бұйрығына өзгерістер енгізу туралы»
