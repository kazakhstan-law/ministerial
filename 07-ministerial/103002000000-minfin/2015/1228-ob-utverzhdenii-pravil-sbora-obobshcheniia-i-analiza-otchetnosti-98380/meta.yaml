  requisite: Приказ Министра финансов Республики Казахстан от 1 февраля 2022 года № 112. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 февраля 2022 года № 26723. Утратил силу приказом Министра финансов Республики Казахстан от 16 августа 2024 года № 552 (вводится в действие с 1 января 2025 года)
  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 28 декабря 2015 года № 693 «Об утверждении Правил сбора, обобщения и анализа отчетности с учетом информации о закупках у отечественных товаропроизводителей, включенных в интегрированную с веб-порталом государственных закупок базу данных товаров, работ, услуг и их поставщиков, предусмотренную Предпринимательским кодексом Республики Казахстан»
    kaz: «Қазақстан Республикасының Кәсіпкерлік кодексінде көзделген, тауарлардың, жұмыстардың, көрсетілетін қызметтердің және оларды берушілердің мемлекеттік сатып алу веб-порталымен интеграцияланған дерекқорына енгізілген отандық тауар өндірушілерден сатып алу туралы ақпаратты ескере отырып, есептілікті жинау, қорыту және талдау қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 28 желтоқсандағы № 693 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/164257/rus
