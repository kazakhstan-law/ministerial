act_code: '98380'
requisite: Приказ Министра финансов Республики Казахстан от 28 декабря 2015 года № 693. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12734. Утратил силу приказом Министра финансов Республики Казахстан от 16 августа 2024 года № 552 (вводится в действие с 1 января 2025 года)
title:
  rus: Об утверждении Правил сбора, обобщения и анализа отчетности государственных закупок, в том числе порядка формирования отчетности государственных закупок
  kaz: Мемлекеттік сатып алу есептілігін жинау, қорыту және талдау қағидаларын, оның ішінде мемлекеттік сатып алу есептілігін қалыптастыру тәртібін бекіту туралы
