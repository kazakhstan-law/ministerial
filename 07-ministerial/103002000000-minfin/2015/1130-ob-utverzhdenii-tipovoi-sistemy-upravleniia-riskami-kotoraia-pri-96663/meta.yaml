title:
  rus: Об утверждении типовой системы управления рисками, которая применяется при формировании перечня объектов государственного аудита и финансового контроля на соответствующий год и проведении внутреннего государственного аудита
  kaz: Тиісті жылға арналған мемлекеттік аудит және қаржылық бақылау объектілерінің тізбесін қалыптастыру және ішкі мемлекеттік аудит жүргізу кезінде қолданылатын тәуекелдерді басқарудың үлгілік жүйесін бекіту туралы
