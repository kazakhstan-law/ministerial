    kaz: «Тиісті жылға арналған мемлекеттік аудит және қаржылық бақылау объектілерінің тізбесін қалыптастыру және ішкі мемлекеттік аудит жүргізу кезінде қолданылатын тәуекелдерді басқарудың үлгілік жүйесін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2015 жылғы 30 қарашадағы № 597 бұйрығына өзгеріс енгізу туралы
