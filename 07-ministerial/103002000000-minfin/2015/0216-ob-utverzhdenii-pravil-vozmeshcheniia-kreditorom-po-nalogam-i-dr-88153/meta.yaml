act_code: '88153'
requisite: Приказ Министра финансов Республики Казахстан от 16 февраля 2015 года № 92. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 марта 2015 года № 10509. Утратил силу приказом Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 23 апреля 2020 года № 413 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил возмещения кредитором по налогам и другим обязательным платежам в бюджет административных расходов, связанных с возбуждением дела о банкротстве и проведением процедуры банкротства
  kaz: Салықтар және бюджетке төленетін басқа да міндетті төлемдер бойынша кредитордың банкроттық туралы іс қозғауға және банкроттық рәсімін жүргізуге байланысты әкімшілік шығыстарды өтеу қағидаларын бекіту туралы
