requisite: Приказ от 25.02.2015 № 122, Министерство финансов Республики Казахстан. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 марта 2015 года № 10559. Утратил силу приказом Министра финансов Республики Казахстан от 28 декабря 2015 года № 691
title:
  rus: Об утверждении Перечня товаров, являющихся сырьевым ресурсом для стратегически важных производств, не добывающихся на территории Республики Казахстан и приобретаемых за рубежом
  kaz: Стратегиялық маңызы бар өндірістер үшін шикізат ресурсы болып табылатын, Қазақстан Республикасының аумағында өндірілмейтін және шетелден сатып алынатын тауарлардың тізбесін бекіту туралы
