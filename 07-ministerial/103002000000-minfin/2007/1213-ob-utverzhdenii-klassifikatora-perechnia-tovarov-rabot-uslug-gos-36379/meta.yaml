requisite: Приказ Министра финансов Республики Казахстан от 13 декабря 2007 года N 456. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 декабря 2007 года N 5057. Утратил силу приказом Министра финансов Республики Казахстан от 25 мая 2009 года N 215
title:
  rus: Об утверждении Классификатора перечня товаров (работ, услуг) государственных учреждений, содержащихся за счет средств государственного бюджета, деньги от реализации, которых остаются в их распоряжении
  kaz: Мемлекеттік бюджет қаражаты есебінен ұсталатын, өткізуден түсетін ақшасы өзінің иелігінде қалатын мемлекеттік мекемелер тауарларының (жұмыстарының, көрсетілетін қызметтерінің) тізбесі сыныптауышын бекіту туралы
