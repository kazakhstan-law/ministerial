    kaz: '"Мемлекеттік бюджет қаражаты есебінен ұсталатын, өткізуден түсетін ақшасы өзінің иелігінде қалатын мемлекеттік мекемелер тауарларының (жұмыстарының, көрсетілетін қызметтерінің) тізбесі сыныптауышын бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2007 жылғы 13 желтоқсандағы N 456 бұйрығына өзгерістер енгізу туралы'
