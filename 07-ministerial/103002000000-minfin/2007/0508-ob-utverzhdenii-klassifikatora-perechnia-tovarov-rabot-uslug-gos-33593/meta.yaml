requisite: Приказ и.о. Министра финансов Республики Казахстан от 8 мая 2007 года № 163. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июня 2007 года № 4703. Утратил силу приказом Министра финансов Республики Казахстан от 13 декабря 2007 года № 456
title:
  rus: Об утверждении Классификатора перечня товаров (работ, услуг) государственных учреждений, содержащихся за счет государственного бюджета, деньги от реализации, которых остаются в их распоряжении
  kaz: Мемлекеттік бюджет қаражаты есебінен ұсталатын, өткізуден түсетін ақшасы өзінің иелігінде қалатын мемлекеттік мекемелер тауарларының (жұмыстарының, көрсетілетін қызметтерінің) тізбесі сыныптауышын бекіту туралы
