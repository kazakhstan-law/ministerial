    kaz: Қазақстан Республикасы Қаржы министрінің 2007 жылғы 8-ші мамырдағы N 163»"Мемлекеттік бюджет қаражаты есебінен ұсталатын, өткізуден түсетін ақшасы өзінің иелігінде қалатын мемлекеттік мекемелер тауарларының (жұмыстарының, көрсетілетін қызметтерінің) тізбесі сыныптауышын бекіту туралы" бұйрығына өзгерістер мен толықтырулар енгізу туралы
