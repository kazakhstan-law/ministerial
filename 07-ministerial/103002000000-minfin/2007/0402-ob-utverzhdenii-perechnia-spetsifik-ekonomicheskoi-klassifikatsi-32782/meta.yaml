act_code: '32782'
requisite: Приказ Министра финансов Республики Казахстан от 2 апреля 2007 года № 102. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 апреля 2007 года № 4617. Утратил силу - приказом Министра финансов Республики Казахстан от 4 июля 2007 года № 234
title:
  rus: Об утверждении Перечня специфик экономической классификации расходов и размеры, по которым допускается осуществление расчетов за счет бюджетных денег с применением корпоративной платежной карточки, Перечня специфик экономической классификации расходов и объем, по которым допускается получение наличных денег по чекам территориальных подразделений казначейства
  kaz: Шығыстардың экономикалық сыныптамасы ерекшеліктерінің тізбесін және корпоративтік төлем карточкасын қолдана отырып, бюджет ақшасы есебінен есеп айырысуды жүзеге асыруға жол берілетін мөлшерін, Шығыстардың экономикалық сыныптамасы ерекшеліктерінің тізбесін және қазынашылықтың аумақтық бөлімшелерінің чектері бойынша қолма-қол ақшаны алуға жол берілетін көлемін бекіту туралы
