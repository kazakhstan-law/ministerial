act_code: '38225'
requisite: Приказ Министра финансов Республики Казахстан от 19 декабря 2007 года № 468. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 декабря 2007 года № 5068. Утратил силу приказом Министра финансов Республики Казахстан от 25 декабря 2008 года № 611, за исключением Правил составления Расчета отчислений пользователей автомобильных дорог (Форма 641.00) и Правил составления Расчета отчислений в фонды содействия занятости, обязательного медицинского страхования, государственного социального страхования, государственный центр по выплате пенсий (Форма 651.00); Правил составления Расчета отчислений пользователей автомобильных дорог (форма 641.00) и Правил составления Расчета отчислений в фонды содействия занятости, обязательного медицинского страхования, государственного социального страхования, государственный центр по выплате пенсий (форма 651.00) утратили силу приказом Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 5 августа 2019 года № 820 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
