  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 26 мая 2017 года № 340 «Об утверждении Правил отражения поступлений бюджета в годовой консолидированной финансовой отчетности об исполнении республиканского, областного бюджета, бюджетов города республиканского значения, столицы»
    kaz: «Республикалық, облыстық бюджеттің, республикалық маңызы бар қала, астана бюджеттерінің атқарылуы туралы жылдық шоғырландырылған қаржылық есептілікте бюджет түсімдерін көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2017 жылғы 26 мамырдағы № 340 бұйрығына өзгерістер енгізу туралы
