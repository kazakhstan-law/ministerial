act_code: '113087'
requisite: Приказ Министра финансов Республики Казахстан от 26 мая 2017 года № 340. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 июня 2017 года № 15266. Утратил силу приказом Министра финансов Республики Казахстан от 28 мая 2025 года № 261 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил отражения поступлений бюджета в годовой консолидированной финансовой отчетности об исполнении республиканского, областного бюджета, бюджетов города республиканского значения, столицы, бюджета района (города областного значения), районного (города областного значения) бюджета, бюджетов города районного значения, села, поселка, сельского округа
  kaz: Республикалық, облыстық бюджеттің, республикалық маңызы бар қала, астана бюджеттерінің, аудан (облыстық маңызы бар қала) бюджетінің, аудандық (облыстық маңызы бар қала) бюджеттің, аудандық маңызы бар қала, ауыл, кент, ауылдық округ бюджеттерінің атқарылуы туралы жылдық шоғырландырылған қаржылық есептілікте бюджет түсімдерін көрсету қағидаларын бекіту туралы
