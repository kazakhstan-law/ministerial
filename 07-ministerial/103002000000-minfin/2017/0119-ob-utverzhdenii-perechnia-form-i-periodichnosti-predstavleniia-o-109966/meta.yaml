title:
  rus: Об утверждении перечня, форм и периодичности представления отчетности профессиональными и аудиторскими организациями, а также формы информации по страхованию гражданско-правовой ответственности аудиторской организации
  kaz: Кәсіби және аудиторлық ұйымдардың есептілік тізбесін, нысандары мен ұсыну кезеңдiлiгiн, сондай-ақ аудиторлық ұйымның азаматтық-құқықтық жауапкершілігін сақтандыру жөніндегі ақпарат нысанын бекіту туралы
