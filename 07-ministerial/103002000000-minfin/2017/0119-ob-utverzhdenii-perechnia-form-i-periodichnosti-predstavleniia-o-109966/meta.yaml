  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 19 января 2017 года № 34 «Об утверждении перечня, форм и периодичности представления отчетности профессиональными и аудиторскими организациями, а также формы информации по страхованию гражданско-правовой ответственности аудиторской организации»
    kaz: «Кәсіби және аудиторлық ұйымдардың есептілік тізбесін, нысандары мен ұсыну кезеңдiлiгiн, сондай-ақ аудиторлық ұйымның азаматтық-құқықтық жауапкершілігін сақтандыру жөніндегі ақпарат нысанын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2017 жылғы 19 қаңтардағы № 34 бұйрығына өзгерістер енгізу туралы
