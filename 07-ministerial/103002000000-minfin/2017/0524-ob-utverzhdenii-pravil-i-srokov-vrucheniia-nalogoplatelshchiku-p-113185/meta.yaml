act_code: '113185'
requisite: Приказ Министра финансов Республики Казахстан от 24 мая 2017 года № 334. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 июня 2017 года № 15278. Утратил силу приказом Министра финансов Республики Казахстан от 12 января 2018 года № 20 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и сроков вручения налогоплательщику предварительного акта налоговой проверки, предоставления письменного возражения к предварительному акту налоговой проверки, а также рассмотрения такого возражения и категорий налогоплательщиков, в отношении которых применяются нормы по предварительному акту налоговой проверки
  kaz: Салық төлеушіге салықтық тексерудің алдын ала актісін табыс ету, салықтық тексерудің алдын ала актісіне жазбаша қарсылық беру, сондай-ақ осындай қарсылықты қарау қағидалары мен мерзімдерін және оларға қатысты алдын ала салықтық тексерудің актісі бойынша нормалар қолданылатын салық төлеушiлердiң санаттарын бекіту туралы
