act_code: '110149'
requisite: Приказ Министра финансов Республики Казахстан от 6 февраля 2017 года № 80. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 марта 2017 года № 14875. Утратил силу приказом Министра финансов Республики Казахстан от 8 февраля 2018 года № 144 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил получения, учета, хранения, выдачи акцизных и учетно-контрольных марок и представления обязательства, отчета импортеров о целевом использовании учетно-контрольных марок при импорте алкогольной продукции в Республику Казахстан, а также учета и размер обеспечения такого обязательства
  kaz: Акциздiк және есепке алу-бақылау маркаларын алу, есепке алу, сақтау, беру және импорттаушылардың Қазақстан Республикасына алкоголь өнiмдерiн импорттау кезiнде есепке алу-бақылау маркаларын нысаналы пайдалану туралы мiндеттемесiн, есебiн ұсыну қағидаларын, сондай-ақ осындай мiндеттеменi есепке алу және қамтамасыз ету мөлшерiн бекіту туралы
