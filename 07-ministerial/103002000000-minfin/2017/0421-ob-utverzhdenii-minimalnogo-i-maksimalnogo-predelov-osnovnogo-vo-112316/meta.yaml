requisite: Приказ Министра финансов Республики Казахстан от 21 апреля 2017 года № 265. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 мая 2017 года № 15134. Утратил силу приказом Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 1 апреля 2020 года № 344 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении минимального и максимального пределов основного вознаграждения временного администратора, реабилитационного, временного и банкротного управляющих, а также Правил выплаты такого вознаграждения
  kaz: Уақытша әкімшінің, оңалтуды, уақытша және банкроттықты басқарушылардың негізгі сыйақысының ең төмен және ең жоғары шектерін, сондай-ақ осындай сыйақыны төлеу қағидаларын бекіту туралы
