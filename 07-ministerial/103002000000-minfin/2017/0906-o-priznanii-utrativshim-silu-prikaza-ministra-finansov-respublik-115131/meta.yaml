act_code: '115131'
requisite: Приказ Министра финансов Республики Казахстан от 6 сентября 2017 года № 544. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 сентября 2017 года № 15786
title:
  rus: О признании утратившим силу приказа Министра финансов Республики Казахстан от 5 декабря 2014 года № 544 «Об утверждении формы проверочного листа и критериев оценки степени риска республиканских государственных юридических лиц, их филиалов, представительств, при проведении контроля целевого использования государственного имущества»
  kaz: «Мемлекеттік мүліктің нысаналы пайдаланылуына бақылау жүргізген кезде республикалық мемлекеттік заңды тұлғалардың, олардың филиалдарының, өкілдіктерінің тексеру парағының нысанын және тәуекел дәрежелерін бағалау өлшемдерін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2014 жылғы 5 желтоқсандағы № 544 бұйрығының күшін жою туралы
