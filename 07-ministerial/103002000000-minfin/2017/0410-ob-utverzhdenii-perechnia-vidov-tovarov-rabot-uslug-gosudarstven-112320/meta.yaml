    kaz: «Үлгілік конкурстық құжаттамаларға (аукциондық құжаттамаларға) сәйкес мемлекеттік сатып алу жүзеге асырылатын тауарлар, жұмыстар, көрсетілетін қызметтер түрлерінің тізбесін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2017 жылғы 10 сәуірдегі № 231 бұйрығына өзгерістер енгізу туралы
