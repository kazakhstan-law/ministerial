  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 10 апреля 2017 года № 231 «Об утверждении Перечня видов товаров, работ, услуг, государственные закупки которых осуществляются в соответствии с типовыми конкурсными документациями (аукционными документациями)»
    kaz: «Үлгілік конкурстық құжаттамаларға (аукциондық құжаттамаларға) сәйкес мемлекеттік сатып алу жүзеге асырылатын тауарлар, жұмыстар, көрсетілетін қызметтер түрлерінің тізбесін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2017 жылғы 10 сәуірдегі № 231 бұйрығына өзгеріс енгізу туралы
