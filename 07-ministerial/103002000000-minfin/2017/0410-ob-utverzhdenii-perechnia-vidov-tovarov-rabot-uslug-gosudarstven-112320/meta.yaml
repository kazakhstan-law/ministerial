title:
  rus: Об утверждении Перечня видов товаров, работ, услуг, государственные закупки которых осуществляются в соответствии с типовыми конкурсными документациями (аукционными документациями)
  kaz: Үлгілік конкурстық құжаттамаларға (аукциондық құжаттамаларға) сәйкес мемлекеттік сатып алу жүзеге асырылатын тауарлар, жұмыстар, көрсетілетін қызметтер түрлерінің тізбесін бекіту туралы
