requisite: Приказ и.о. Министра финансов Республики Казахстан от 5 января 2017 года № 6. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 января 2017 года № 14705. Утратил силу приказом Министра финансов Республики Казахстан от 24 сентября 2020 года № 915 (вводится в действие с 15 ноября 2020 года)
title:
  rus: Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для индивидуальных предпринимателей и юридических лиц, осуществляющих операции с драгоценными металлами и драгоценными камнями, ювелирными изделиями из них
  kaz: Бағалы металдармен, асыл тастармен және олардан жасалған зергерлік бұйымдармен операцияларды жүзеге асыратын дара кәсіпкерлер және заңды тұлғалар үшін қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы
