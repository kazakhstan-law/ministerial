act_code: '112525'
requisite: Приказ Министра финансов Республики Казахстан от 30 мая 2017 года № 348. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июня 2017 года № 15200. Утратил силу приказом и.о. Министра финансов Республики Казахстан от 6 ноября 2019 года № 1226 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил исполнения налоговых обязательств лицами, имеющими право на льготы и преференции в соответствии с Соглашением между Правительством Республики Казахстан и Международным бюро выставок о льготах и преференциях для официальных участников, связанных с проведением Международной специализированной выставки ЭКСПО-2017 в городе Астане
  kaz: Астана қаласында ЭКСПО-2017 халықаралық мамандандырылған көрмесін өткізуге байланысты ресми қатысушыларға арналған жеңілдіктер мен преференциялар туралы Қазақстан Республикасының Үкіметі мен Халықаралық көрмелер бюросы арасындағы Келісімге сәйкес жеңілдіктер мен преференцияларға құқығы бар тұлғалардың салық міндеттемелерін орындау қағидаларын бекіту туралы
