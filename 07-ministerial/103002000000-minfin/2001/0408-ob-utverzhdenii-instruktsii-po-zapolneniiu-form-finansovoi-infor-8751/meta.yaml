requisite: Приказ Министра финансов Республики Казахстан от 9 апреля 2001 года № 182. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 апреля 2001 года N 1476. Утратил силу приказом Министра финансов Республики Казахстан от 2 апреля 2003 года № 135
title:
  rus: Об утверждении Инструкции по заполнению форм финансовой информации, Правил проведения анализа деятельности государственных предприятий и Правил определения основных показателей, эффективности деятельности негосударственных юридических лиц с участием государства в уставном капитале
  kaz: Қаржылық ақпарат нысандарын толтыру жөніндегі нұсқаулықты, Мемлекеттік кәсіпорындарын қызметіне талдау жүргізу ережелерін және Жарғылық капиталында мемлекеттің қатысуы бар мемлекеттік емес заңды тұлғалардың қызметтері тиімділігінің негізгі көрсеткіштерін анықтау ережелерін бекіту туралы
