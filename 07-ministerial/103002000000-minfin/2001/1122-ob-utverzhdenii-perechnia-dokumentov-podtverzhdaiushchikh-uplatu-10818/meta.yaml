act_code: '10818'
requisite: Приказ Министра государственных доходов Республики Казахстан от 22 ноября 2001 года № 1583. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 декабря 2001 года № 1705. Утратил силу приказом Министра финансов Республики Казахстан от 9 января 2009 года № 5
title:
  rus: Об утверждении Перечня документов, подтверждающих уплату налога на добавленную стоимость поставщикам товаров (работ, услуг) из средств гранта, предоставленных Республике Казахстан по линии государств, правительств государств, международных организаций
  kaz: Мемлекеттер, мемлекеттер үкіметі, халықаралық ұйымдар желілері бойынша Қазақстан Республикасына берілген грант қаражаты есебінен тауарлар (жұмыстар, қызмет көрсетулер) жеткізушілерге қосылған құн салығын төлеуді растайтын құжаттар тізбесін бекіту туралы
