  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 5 апреля 2001 года N 173 "Об утверждении списков аудиторских организаций и кредитных рейтинговых агентств", зарегистрированного в Министерстве юстиции Республики Казахстан 2 мая 2001 года N 1492
    kaz: Қазақстан Республикасы Әділет министрлігінде 2001 жылғы 2 мамырда N 1492 болып тіркелген "Аудиторлық ұйымдардың және несиелік рейтингтік агенттіктердің тізімдерін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2001 жылғы 5 сәуірдегі N 173 бұйрығына өзгерістер енгізу туралы
