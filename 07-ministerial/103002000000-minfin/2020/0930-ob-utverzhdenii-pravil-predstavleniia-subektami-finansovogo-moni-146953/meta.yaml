requisite: Приказ Министра финансов Республики Казахстан от 30 сентября 2020 года № 938. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 сентября 2020 года № 21340. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 22 февраля 2022 года № 13 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил представления субъектами финансового мониторинга сведений и информации об операциях, подлежащих финансовому мониторингу, и признаков определения подозрительной операции
  kaz: Қаржы мониторингі субъектілерінің қаржы мониторингіне жататын операциялар туралы мәліметтер мен ақпаратты беру қағидаларын және күдікті операцияны айқындау белгілерін бекіту туралы
