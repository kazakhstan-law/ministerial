title:
  rus: Об отмене приказа исполняющего обязанности Министра финансов Республики Казахстан от 22 августа 2019 года № 911 «Об утверждении Положения о Комитете казначейства Министерства финансов Республики Казахстан»
  kaz: «Қазақстан Республикасы Қаржы министрлігінің Қазынашылық комитеті туралы ережені бекіту туралы» Қазақстан Республикасы Қаржы министрінің міндетін атқарушының 2019 жылғы 22 тамыздағы № 911 бұйрығының күшiн жою туралы
