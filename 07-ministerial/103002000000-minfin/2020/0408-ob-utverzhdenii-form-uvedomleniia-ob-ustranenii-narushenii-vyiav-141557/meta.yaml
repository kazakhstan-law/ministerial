title:
  rus: Об утверждении форм уведомления об устранении нарушений, выявленных по результатам профилактического контроля без посещения субъекта контроля и извещения о нарушениях, выявленных по результатам профилактического контроля без посещения субъекта контроля, которые невозможно устранить
  kaz: Бақылау субъектісіне бармай профилактикалық бақылау нәтижелері бойынша анықталған бұзушылықтарды жою туралы хабарламаның және бақылау субъектісіне бармай профилактикалық бақылау нәтижелері бойынша анықталған жойылуы мүмкін емес бұзушылықтар туралы хабарламаның нысандарын бекіту туралы
