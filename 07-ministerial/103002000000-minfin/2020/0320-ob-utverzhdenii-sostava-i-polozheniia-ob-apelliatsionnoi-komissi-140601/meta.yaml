  title:
    rus: О внесении изменений в приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 20 марта 2020 года № 302 «Об утверждении состава и Положения об апелляционной комиссии по рассмотрению возражений к аудиторскому отчету или аудиторскому отчету по финансовой отчетности, уведомлению об устранении нарушений, выявленных по результатам камерального контроля уполномоченного органа по внутреннему государственному аудиту»
    kaz: «Ішкі мемлекеттік аудит жөніндегі уәкілетті органның аудиторлық есебіне немесе қаржылық есептілік бойынша аудиторлық есебіне, камералдық бақылау нәтижелері бойынша анықталған бұзушылықтарды жою туралы хабарламасына қарсылықтарды қарау жөніндегі апелляциялық комиссияның құрамы мен ережесін бекіту туралы» Қазақстан Республикасы Премьер-Министрінің Бірінші орынбасары - Қазақстан Республикасы Қаржы министрінің 2020 жылғы 20 наурыздағы № 302 бұйрығына өзгерістер енгізу туралы
