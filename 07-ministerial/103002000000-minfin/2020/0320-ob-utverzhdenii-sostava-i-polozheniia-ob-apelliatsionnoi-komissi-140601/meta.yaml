act_code: '140601'
requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 20 марта 2020 года № 302. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 марта 2020 года № 20171
title:
  rus: Об утверждении состава и Положения об апелляционной комиссии по рассмотрению возражений к аудиторскому отчету или аудиторскому отчету по финансовой отчетности, уведомлению об устранении нарушений, выявленных по результатам камерального контроля уполномоченным органом по внутреннему государственному аудиту, и обжалованию решений, действий (бездействия) уполномоченного органа по внутреннему государственному аудиту и (или) его должностных лиц
  kaz: Аудиторлық есепке немесе қаржылық есептілік жөніндегі аудиторлық есепке, ішкі мемлекеттік аудит жөніндегі уәкілетті органның камералдық бақылау нәтижелері бойынша анықталған бұзушылықтарды жою туралы хабарламаға қарсылықтарды және ішкі мемлекеттік аудит жөніндегі уәкілетті органның және (немесе) оның лауазымды адамдарының шешімдеріне, әрекеттеріне (әрекетсіздігіне) шағымдануды қарау жөніндегі апелляциялық комиссияның құрамын және ол туралы ережені бекіту туралы
