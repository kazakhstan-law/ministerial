act_code: '147375'
requisite: Приказ Министра финансов Республики Казахстан от 13 октября 2020 года № 1000. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 октября 2020 года № 21426. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 9 августа 2021 года № 6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении требований к субъектам финансового мониторинга по подготовке и обучению в сфере противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма
  kaz: Қаржы мониторингі субъектілеріне қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл саласындағы даярлау және оқыту бойынша қойылатын талаптарды бекіту туралы
