act_code: '141153'
requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 1 апреля 2020 года № 343. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 апреля 2020 года № 20278
title:
  rus: Об утверждении Правил размещения на интернет-ресурсе Министерства финансов Республики Казахстан списка лиц, имеющих право осуществлять деятельность администратора, назначения и отстранения реабилитационного и банкротного управляющих
  kaz: Қазақстан Республикасы Қаржы министрлігінің интернет-ресурсында әкімші қызметін жүзеге асыру құқығы бар адамдардың тізімін орналастыру, оңалтуды және банкроттықты басқарушыларды тағайындау мен шеттету қағидаларын бекіту туралы
