title:
  rus: Об утверждении Правил составления и формы документа, подтверждающего невозможность установления места нахождения должника, а также его учредителей (участников) и должностных лиц в течении шести последовательных месяцев
  kaz: Борышкердің, сондай-ақ оның құрылтайшыларының (қатысушыларының) және лауазымды адамдарының орналасқан жерін қатарынан алты ай ішінде белгілеу мүмкін еместігін растайтын құжат нысанын және оны жасау қағидаларын бекіту туралы
