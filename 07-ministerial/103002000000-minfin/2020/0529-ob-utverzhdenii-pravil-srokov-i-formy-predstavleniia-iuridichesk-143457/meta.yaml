  requisite: Приказ Министра финансов Республики Казахстан от 6 апреля 2021 года № 307. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 апреля 2021 года № 22509. Утратил силу приказом и.о. Министра финансов Республики Казахстан от 29 октября 2025 года № 644 (вводится в действие с 1 января 2026 года)
  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 29 мая 2020 года № 539 «Об утверждении формы, сроков и Правил представления имеющихся сведений о физических лицах юридическим лицом, созданным по решению Правительства Республики Казахстан, обеспечивающим в соответствии с законодательством Республики Казахстан о пенсионном обеспечении учет пенсионных взносов, социальных отчислений и социальных выплат»
    kaz: «Қазақстан Республикасы Үкіметінің шешімі бойынша құрылған, Қазақстан Республикасының зейнетақымен қамсыздандыру туралы заңнамасына сәйкес зейнетақы жарналарын, әлеуметтік аударымдарды және әлеуметтік төлемдерді есепке алуды қамтамасыз ететін заңды тұлғаның жеке тұлғалар туралы қолда бар мәліметтерді ұсыну нысанын, мерзімдерін және қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2020 жылғы 29 мамырдағы № 539 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/154381/rus
