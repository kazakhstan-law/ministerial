  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 29 мая 2020 года № 539 «Об утверждении Правил, сроков и формы представления юридическим лицом, созданным по решению Правительства Республики Казахстан, обеспечивающим в соответствии с законодательством Республики Казахстан учет пенсионных взносов, социальных отчислений и социальных выплат, взносов и отчислений на обязательное социальное медицинское страхование, имеющихся сведений о физических лицах»
    kaz: «Қазақстан Республикасы Үкіметінің шешімі бойынша құрылған, Қазақстан Республикасының заңнамасына сәйкес зейнетақы жарналарын, әлеуметтік аударымдар мен әлеуметтік төлемдерді, міндетті әлеуметтік медициналық сақтандыруға жарналар мен аударымдарды есепке алуды қамтамасыз ететін заңды тұлғаның жеке тұлғалар туралы қолда бар мәліметтерді ұсыну қағидаларын, мерзімдерін мен нысанын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2020 жылғы 29 мамырдағы № 539 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/171219/rus
