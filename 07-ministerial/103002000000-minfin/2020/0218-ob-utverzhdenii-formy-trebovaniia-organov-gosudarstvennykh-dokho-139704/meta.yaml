title:
  rus: Об утверждении формы требования органов государственных доходов о подтверждении расходов на погашение вознаграждения по ипотечным жилищным займам, полученным физическим лицом на приобретение жилья в Республике Казахстан, и Правил ее составления
  kaz: Жеке тұлға Қазақстан Республикасында тұрғын үй сатып алу үшін алған ипотекалық тұрғын үй қарыздары бойынша сыйақыны өтеуге жұмсалатын шығыстарды растау туралы мемлекеттік кірістер органдары талабының нысанын және оны жасау қағидаларын бекіту туралы
