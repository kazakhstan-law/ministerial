title:
  rus: Об утверждении формы, Правил и сроков представления нотариусами сведений по сделкам и договорам, а также по выданным свидетельствам о праве на наследство физических лиц
  kaz: Жеке тұлғалардың мәмілелері мен шарттары, сондай-ақ мұраға құқықтылығы туралы берілген куәліктері бойынша мәліметтерді нотариустардың ұсыну нысанын, қағидаларын және мерзімдерін бекіту туралы
