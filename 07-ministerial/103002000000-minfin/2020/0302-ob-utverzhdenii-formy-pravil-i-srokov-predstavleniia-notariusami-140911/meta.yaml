    kaz: «Жеке тұлғалардың мәмілелері мен шарттары бойынша мәліметтерді нотариустардың ұсыну нысанын, қағидаларын және мерзімдерін бекіту туралы» Қазақстан Республикасы Премьер-Министрінің Бірінші орынбасары – Қазақстан Республикасы Қаржы министрінің 2020 жылғы 2 наурыздағы № 212 бұйрығына өзгерістер енгізу туралы
