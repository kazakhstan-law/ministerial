requisite: Приказ Министра финансов Республики Казахстан от 19 октября 2020 года № 1024. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 октября 2020 года № 21477. Утратил силу приказом Министра финансов Республики Казахстан от 16 июля 2025 года № 367 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
