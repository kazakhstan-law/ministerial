act_code: '143610'
requisite: Приказ Министра финансов Республики Казахстан от 4 июня 2020 года № 568. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 июня 2020 года № 20833. Утратил силу приказом Министра финансов Республики Казахстан от 12 ноября 2025 года № 697 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил представления брокерами сведений о сделках физических лиц с ценными бумагами, товарными биржами сведений о сделках физических лиц с биржевыми товарами, реализованными на товарной бирже, и их форм
  kaz: Брокерлердің жеке тұлғалардың бағалы қағаздармен мәмілелері туралы мәліметтерді, тауар биржаларының жеке тұлғалардың тауар биржасында өткізілген биржалық тауарлармен мәмілелері туралы мәліметтерді ұсыну қағидаларын және олардың нысандарын бекіту туралы
