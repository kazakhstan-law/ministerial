requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 12 февраля 2020 года № 138. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 февраля 2020 года № 20033. Утратил силу приказом и.о. Министра финансов Республики Казахстан от 4 июня 2025 года № 283 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения мониторинга гарантированного государством обязательства по поддержке экспорта и финансового состояния Экспортно-кредитного агентства Казахстана, имеющего государственную гарантию по поддержке экспорта
  kaz: Экспортты қолдау бойынша мемлекет кепілдік берген міндеттемеге және экспортты қолдау бойынша мемлекеттік кепілдігі бар Қазақстанның Экспорттық-кредиттік агенттігінің қаржылық жағдайына мониторинг жүргізу қағидаларын бекіту туралы
