  title:
    rus: О внесении изменений в приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 12 февраля 2020 года № 138 «Об утверждении Правил проведения мониторинга гарантированного государством обязательства по поддержке экспорта и финансового состояния национальной компании, осуществляющей функции по поддержке экспорта, имеющей государственную гарантию по поддержке экспорта»
    kaz: «Экспортты қолдау бойынша мемлекеттік кепілдік беру міндеттемеге мониторингті және экспортты қолдау бойынша мемлекеттік кепілдігі бар, экспортты қолдау жөніндегі функцияларды жүзеге асыратын ұлттық компанияның қаржылық жағдайын мониторингтеуді атқару қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің бірінші орынбасары – Қазақстан Республикасы Қаржы министрінің 2020 жылғы 12 ақпандағы № 138 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/195866/rus
