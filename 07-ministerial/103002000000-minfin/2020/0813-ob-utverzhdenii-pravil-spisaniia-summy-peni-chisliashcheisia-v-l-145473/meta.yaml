requisite: Приказ Министра финансов Республики Казахстан от 13 августа 2020 года № 730. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 августа 2020 года № 21085. Утратил силу приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил списания суммы пени, числящейся в лицевом счете налогоплательщика по состоянию на 1 апреля 2020 года, и суммы пени, начисленной на сумму недоимки, образованной по налогу на имущество, земельному налогу и налогу на транспортные средства за налоговые периоды до 1 января 2020 года, за исключением обязательств по уплате налога на имущество и земельного налога за 2019 год, до даты ее уплаты, включая день уплаты
  kaz: 2020 жылғы 1 сәуірдегі жағдай бойынша салық төлеушінің жеке шотында есептелінген өсімпұл сомаларын есептен шығару және 2019 жылғы мүлік салығы мен жер салығын төлеу бойынша міндеттерді қоспағанда, төленген күніне дейінгі, оны төлеу күнін қоса алғанда 2020 жылғы 1 қаңтарға дейінгі салық кезенінде мүлік салығы, жер салығы және көлік құралдары салығы бойынша туындаған бересі сомасына есептелген өсімпұл сомаларын есептен шығару қағидаларын бекіту туралы
