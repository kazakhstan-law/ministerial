requisite: Приказ Министра финансов Республики Казахстан от 28 сентября 2020 года № 926. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 сентября 2020 года № 21300. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 6 августа 2021 года № 4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для не финансового сектора
  kaz: Қаржылық емес сектор үшін қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында Ішкі бақылау қағидаларына қойылатын талаптар бекіту туралы
