act_code: '142048'
requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 21 апреля 2020 года № 404. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 апреля 2020 года № 20454
title:
  rus: Об утверждении типовых форм заключений временного администратора, временного управляющего и реабилитационного управляющего о финансовой устойчивости должника, а также банкротного управляющего о финансовой устойчивости должника с учетом реализации мероприятий, предусмотренных планом реабилитации
  kaz: Уақытша әкімшінің, уақытша басқарушының және оңалтуды басқарушының борышкердің қаржылық тұрақтылығы туралы, сондай-ақ оңалту жоспарында көзделген іс-шараларды іске асыруды ескере отырып, банкроттықты басқарушының борышкердің қаржылық тұрақтылығы туралы қорытындыларының үлгілік нысандарын бекіту туралы
