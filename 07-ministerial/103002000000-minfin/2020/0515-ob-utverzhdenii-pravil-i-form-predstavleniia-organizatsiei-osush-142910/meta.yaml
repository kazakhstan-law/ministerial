  title:
    rus: О внесении изменений и дополнения в приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 15 мая 2020 года № 488 «Об утверждении Правил и форм представления имеющихся сведений о физических лицах-держателях ценных бумаг, а также сведений по заключенным физическими лицами договорам страхования»
    kaz: «Бағалы қағаздарды ұстаушы-жеке тұлғалар туралы қолда бар мәліметтерді, сондай-ақ жеке тұлғалар жасаған сақтандыру шарттары жөніндегі мәліметтерді ұсыну қағидаларын және нысандарын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің Бірінші орынбасары – Қазақстан Республикасы Қаржы министрінің 2020 жылғы 15 мамырдағы № 488 бұйрығына өзгертулер мен толықтыру енгізу туралы
