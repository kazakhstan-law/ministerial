act_code: '142910'
requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 15 мая 2020 года № 488. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 мая 2020 года № 20653. Утратил силу приказом Министра финансов Республики Казахстан от 12 ноября 2025 года № 697 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил и форм представления организацией, осуществляющей деятельность по ведению системы реестров держателей ценных бумаг, имеющихся сведений о физических лицах-держателях ценных бумаг, а также о сделках физических лиц с ценными бумагами, и страховыми (перестраховочными) организациями, страховыми брокерами, филиалами страховых (перестраховочных) организаций-нерезидентов Республики Казахстан, филиалами страховых брокеров-нерезидентов Республики Казахстан сведений по заключенным физическими лицами договорам страхования
  kaz: Бағалы қағаздарды ұстаушылар тізілімдерінің жүйесін жүргізу жөніндегі қызметті жүзеге асыратын ұйым бағалы қағаздарды ұстаушы-жеке тұлғалар, сондай-ақ жеке тұлғалардың бағалы қағаздармен жасаған мәмілелері туралы қолда бар мәліметтерді және сақтандыру (қайта сақтандыру) ұйымдарының, сақтандыру брокерлерінің, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының, Қазақстан Республикасының бейрезидент-сақтандыру брокерлері филиалдарының жеке тұлғалар жасаған сақтандыру шарттары жөніндегі мәліметтерді ұсыну қағидаларын және нысандарын бекіту туралы
