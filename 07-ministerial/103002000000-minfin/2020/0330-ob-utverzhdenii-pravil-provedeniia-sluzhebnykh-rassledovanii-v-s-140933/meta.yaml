act_code: '140933'
requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 30 марта 2020 года № 335. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 марта 2020 года № 20214. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 31 октября 2022 года № 37 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения служебных расследований в службе экономических расследований органов по финансовому мониторингу
  kaz: Қаржылық мониторинг органдарының экономикалық тергеп-тексеру қызметінде қызметтік тексеру жүргізу қағидаларын бекіту туралы
