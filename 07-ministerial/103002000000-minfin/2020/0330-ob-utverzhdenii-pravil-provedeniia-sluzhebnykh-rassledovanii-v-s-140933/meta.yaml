  title:
    rus: О внесении изменений в приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 30 марта 2020 года № 335 «Об утверждении Правил проведения служебных расследований в службе экономических расследований Комитета по финансовому мониторингу Министерства финансов Республики Казахстан»
    kaz: «Қазақстан Республикасы Қаржы министрлігі Қаржы мониторингі комитетінің экономикалық тергеп тексеру қызметінде қызметтік тексеру жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің бірінші орынбасары – Қазақстан Республикасы Қаржы министрінің 2020 жылғы 30 наурыздағы № 335 бұйрығына өзгерістер енгізу туралы
