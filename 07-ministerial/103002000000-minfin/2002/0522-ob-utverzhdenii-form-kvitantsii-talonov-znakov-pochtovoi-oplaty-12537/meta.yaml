act_code: '12537'
requisite: Приказ Министра финансов Республики Казахстан от 23 мая 2002 года N 230. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 июня 2002 года N 1894. Утратил силу - приказом И.о. Министра финансов Республики Казахстан от 17 сентября 2003 г. N 344
title:
  rus: Об утверждении форм квитанций, талонов, знаков почтовой оплаты или других приравненных к чекам документов строгой отчетности, выдаваемых населению при оказании услуг без применения контрольно-кассовых машин с фискальной памятью
  kaz: Түбiртектердiң, талондардың, почта төлемдерi белгiлерiнiң немесе фискалды жады бар бақылау-кассалық машиналарды қолданбай қызмет көрсету кезiнде тұрғындарға берiлетін чектерге теңестiрiлген басқа да қатаң есептiлiк құжаттардың нысандарын бекіту туралы
