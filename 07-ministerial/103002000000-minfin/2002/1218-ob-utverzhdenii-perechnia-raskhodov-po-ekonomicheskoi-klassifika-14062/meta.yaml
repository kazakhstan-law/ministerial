    kaz: Қазақстан Республикасының Әділет министрлігінде N 2113 тіркелген "Шарттар жасасуды талап ететін шығыстардың экономикалық сыныптамасы бойынша шығыстар тізбесін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2002 жылғы 18 желтоқсандағы N 620 бұйрығына толықтыру енгізу туралы
