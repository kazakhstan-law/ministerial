  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 18 декабря 2002 года N 620 "Об утверждении перечня расходов по экономической классификации расходов, требующих заключения договоров", зарегистрированный в Министерстве юстиции Республики Казахстан за N 2113
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде N 2113 тiркелген "Шарттар жасасуды талап ететiн шығыстардың экономикалық сыныптамасы бойынша шығыстар тiзбесiн бекiту туралы" Қазақстан Республикасы Қаржы министрiнiң 2002 жылғы 18 желтоқсандағы N 620 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы
