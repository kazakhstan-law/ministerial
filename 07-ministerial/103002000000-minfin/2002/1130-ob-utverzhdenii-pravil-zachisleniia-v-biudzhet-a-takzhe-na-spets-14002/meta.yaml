act_code: '14002'
requisite: Приказ Министра финансов Республики Казахстан от 30 ноября 2002 года N 594. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 декабря 2002 года N 2104. Утратил силу приказом Министра финансов Республики Казахстан от 9 января 2009 года № 5
title:
  rus: Об утверждении Правил зачисления в бюджет, а также на специальный (транзитный) банковский счет дипломатического представительства или консульского учреждения консульских сборов, уплаченных наличными деньгами за пределами территории Республики Казахстан
  kaz: Қазақстан Республикасының аумағынан тыс жерлерде қолма-қол ақшамен төленген консулдық алымдарды бюджетке, сондай-ақ дипломатиялық өкілдіктің немесе консулдық мекеменің арнайы (транзиттік) банктің шотына есепке алу ережесін бекіту туралы
