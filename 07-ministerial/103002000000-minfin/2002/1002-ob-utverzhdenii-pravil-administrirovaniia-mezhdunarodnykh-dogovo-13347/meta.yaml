  kaz: Қазақстан Республикасы жасасқан табыс пен капиталға (мүлiкке) салық төлеуден жалтарудың алдын алу және қосарланған салық салуды болдырмау жөнiндегi халықаралық шарттарды әкiмшiлiктендiру ережесiн бекiту туралы
