  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 3 октября 2002 года N 469 "Об утверждении Правил администрирования международных договоров об избежании двойного налогообложения и предотвращении уклонения от уплаты налогов на доход и капитал (имущество), заключенных Республикой Казахстан", зарегистрированный за N 2003
    kaz: N 2003 болып тіркелген, "Қазақстан Республикасы жасасқан табыс пен капиталға (мүлікке) салық төлеуден жалтарудың алдын алу және қосарланған салық салуды болдырмау жөніндегі халықаралық шарттарды әкімшіліктендіру ережелерін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2002 жылғы 3 қазандағы N 469 бұйрығына өзгерістер мен толықтырулар енгізу туралы
