title:
  rus: Об утверждении Правил администрирования международных договоров об избежании двойного налогообложения и предотвращении уклонения от уплаты налогов на доход и капитал (имущество), заключенных Республикой Казахстан
  kaz: Қазақстан Республикасы жасасқан табыс пен капиталға (мүлiкке) салық төлеуден жалтарудың алдын алу және қосарланған салық салуды болдырмау жөнiндегi халықаралық шарттарды әкiмшiлiктендiру ережесiн бекiту туралы
