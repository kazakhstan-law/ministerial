requisite: Приказ Министра финансов Республики Казахстан от 27 января 2016 года № 30. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 февраля 2016 года № 13301. Утратил силу приказом Министра финансов Республики Казахстан от 10 июня 2025 года № 293 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня специфик экономической классификации расходов, в том числе видов расходов, по которым регистрация заключенных гражданско-правовых сделок является обязательной
  kaz: Шығыстардың экономикалық сыныптамасы ерекшеліктерінің, оның ішінде жасалған азаматтық-құқықтық мәмілелерді тіркеу міндетті болып табылатын шығыстар түрлерінің тізбесін бекіту туралы
