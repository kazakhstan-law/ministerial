  title:
    rus: «О внесении изменений в приказ Министра финансов Республики Казахстан от 27 января 2016 года № 30 «Об утверждении перечня специфик экономической классификации расходов, в том числе видов расходов, по которым регистрация заключенных гражданско-правовых сделок является обязательной»
    kaz: Шығыстардың экономикалық сыныптамасы ерекшеліктерінің, оның ішінде жасалған азаматтық-құқықтық мәмілелерді тіркеу міндетті болып табылатын шығыстар түрлерінің тізбесін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2016 жылғы 27 қаңтардағы № 30 бұйрығына өзгерістер енгізу туралы»
