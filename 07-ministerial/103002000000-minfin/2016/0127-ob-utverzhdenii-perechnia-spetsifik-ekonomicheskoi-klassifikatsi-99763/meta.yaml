  requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 7 августа 2019 года № 833. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 августа 2019 года № 19224. Утратил силу приказом Министра финансов Республики Казахстан от 10 июня 2025 года № 293 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 27 января 2016 года № 30 «Об утверждении перечня специфик экономической классификации расходов, в том числе видов расходов, по которым регистрация заключенных гражданско-правовых сделок является обязательной»
    kaz: «Шығыстардың экономикалық сыныптамасы ерекшеліктерінің, оның ішінде жасалған азаматтық-құқықтық мәмілелерді тіркеу міндетті болып табылатын шығыстар түрлерінің тізбесін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2016 жылғы 27 қаңтардағы № 30 бұйрығына өзгеріс енгізу туралы
