  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 16 марта 2016 года № 126 «Об утверждении Правил и требований по оснащению резервуаров производственных объектов производителей нефтепродуктов, баз нефтепродуктов и автозаправочных станций (кроме автозаправочных станций передвижного типа) контрольными приборами учета»
    kaz: «Мұнай өнімдерін өндірушілердің өндірістік объектілерінің, мұнай өнімдері базаларының резервуарларын және автожанармай құю станцияларын (жылжымалы үлгідегі автожанармай құю станцияларынан басқа) есепке алатын бақылау аспаптарымен жарақтандыру қағидалары мен талаптарын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2016 жылғы 16 наурыздағы № 126 бұйрығына өзгерістер енгізу туралы
