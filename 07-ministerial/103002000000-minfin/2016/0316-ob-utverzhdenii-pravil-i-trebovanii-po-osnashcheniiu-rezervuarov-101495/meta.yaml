title:
  rus: Об утверждении Правил и требований по оснащению резервуаров производственных объектов производителей нефтепродуктов и автозаправочных станций (кроме автозаправочных станций передвижного типа) контрольными приборами учета
  kaz: Мұнай өнімдерін өндірушілердің өндірістік объектілерінің резервуарларын және автожанармай құю станцияларын (жылжымалы үлгідегі автожанармай құю станцияларынан басқа) есепке алатын бақылау аспаптарымен жарақтандыру қағидалары мен талаптарын бекіту туралы
