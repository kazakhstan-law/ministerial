requisite: Приказ Министра финансов Республики Казахстан от 28 апреля 2016 года № 205. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 июня 2016 года № 13763. Утратил силу приказом Министра финансов Республики Казахстан от 24 сентября 2020 года № 915 (вводится в действие с 15 ноября 2020 года)
title:
  rus: Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для индивидуальных предпринимателей и юридических лиц, оказывающих посреднические услуги при осуществлении сделок купли-продажи недвижимого имущества
  kaz: Жылжымайтын мүлікті сатып алу-сату мәмілелерін жүзеге асыру кезінде делдалдық қызметтер көрсететін дара кәсіпкерлерге және заңды тұлғаларға арналған қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы
