requisite: Приказ Министра финансов Республики Казахстан от 29 июля 2016 года № 416. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 сентября 2016 года № 14209. Утратил силу приказом Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 23 января 2020 года № 56 (вводится в действие с 1 января 2021 года)
title:
  rus: Об утверждении формы требования органов государственных доходов о подтверждении сведений о расходах на медицину, произведенных физическим лицом на территории Республики Казахстан, и Правил ее составления
  kaz: Қазақстан Республикасының аумағында жасалған медицинаға жұмсаған жеке тұлғаның шығыстары туралы мәліметтерді растау туралы мемлекеттік кірістер органдарының талаптарының нысанын және оны толтыру қағидаларын бекіту туралы
