requisite: Приказ Министра финансов Республики Казахстан от 19 октября 2016 года № 556. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 ноября 2016 года № 14429. Утратил силу приказом Министра финансов Республики Казахстан от 20 февраля 2018 года № 240 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил ведения базы данных, сведений о лицах-получателях денег и (или) иного имущества, о лицах их предоставивших, сумме полученных средств и иных сведений, подлежащих к размещению, а также их включения и исключения из базы данных
  kaz: Деректерді, ақшаны және (немесе) өзге де мүлікті алушы тұлғалар туралы, оларды берген тұлғалар, алынған қаражат сомасы туралы мәліметтер және орналастыруға жататын өзге де мәліметтер қорын жүргізу, сондай-ақ оларды деректер қорына енгізу және шығару қағидаларын бекіту туралы
