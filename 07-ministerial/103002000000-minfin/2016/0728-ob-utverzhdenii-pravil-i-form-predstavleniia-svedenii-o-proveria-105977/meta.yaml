act_code: '105977'
requisite: Приказ Министра финансов Республики Казахстан от 28 июля 2016 года № 407. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 августа 2016 года № 14184. Утратил силу приказом Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 15 мая 2020 года № 488 (вводится в действие с 1 января 2021 года)
title:
  rus: Об утверждении Правил и форм представления сведений о проверяемых физических лицах-держателях ценных бумаг, а также сведений по заключенным проверяемыми физическими лицами договорам страхования
  kaz: Бағалы қағаздарды ұстаушы тексерілетін жеке тұлғалар туралы мәліметтерді, сондай-ақ тексерілетін жеке тұлғалар жасасқан сақтандыру шарттары жөніндегі мәліметтерді ұсыну қағидаларын және нысандарын бекіту туралы
