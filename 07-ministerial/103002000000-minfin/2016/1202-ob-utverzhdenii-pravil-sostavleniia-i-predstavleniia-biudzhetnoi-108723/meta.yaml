    kaz: «Мемлекеттiк мекемелердiң, бюджеттiк бағдарламалар әкiмшiлерiнiң және бюджетті атқару жөніндегі уәкілетті органдардың бюджеттiк есептiлiктi жасау және ұсыну қағидаларын бекiту туралы» Қазақстан Республикасы Қаржы министрінің 2016 жылғы 2 желтоқсандағы № 630 бұйрығына өзгерістер мен толықтырулар енгізу туралы
