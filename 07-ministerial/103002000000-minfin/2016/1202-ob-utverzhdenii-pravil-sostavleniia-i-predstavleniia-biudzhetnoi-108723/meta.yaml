  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 2 декабря 2016 года № 630 «Об утверждении Правил составления и представления бюджетной отчетности государственными учреждениями, администраторами бюджетных программ, уполномоченными органами по исполнению бюджета и аппаратами акимов городов районного значения, сел, поселков, сельских округов»
    kaz: «Мемлекеттік мекемелердің, бюджеттік бағдарламалар әкімшілерінің, бюджетті атқару жөніндегі уәкілетті органдардың және аудандық маңызы бар қалалар, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының бюджеттік есептілікті жасау және ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2016 жылғы 2 желтоқсандағы № 630 бұйрығына өзгерістер мен толықтырулар енгізу туралы
