  kaz: Мемлекеттiк мекемелердiң, бюджеттiк бағдарламалар әкiмшiлерiнiң, бюджетті атқару жөніндегі уәкілетті органдардың және аудандық маңызы бар қалалар, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының бюджеттiк есептiлiкті жасау және ұсыну қағидаларын бекiту туралы
