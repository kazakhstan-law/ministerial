requisite: Приказ Министра финансов Республики Казахстан от 2 декабря 2016 года № 630. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 декабря 2016 года № 14613. Утратил силу приказом Министра финансов Республики Казахстан от 9 июня 2025 года № 290 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил составления и представления бюджетной отчетности государственными учреждениями, администраторами бюджетных программ, уполномоченными органами по исполнению бюджета и аппаратами акимов городов районного значения, сел, поселков, сельских округов
