  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 2 декабря 2016 года № 630 «Об утверждении Правил составления и представления бюджетной отчетности государственными учреждениями, администраторами бюджетных программ, уполномоченными органами по исполнению бюджета и аппаратами акимов городов районного значения, сел, поселков, сельских округов»
