title:
  rus: Об утверждении Правил, сроков и формы представления сведений физическими и юридическими лицами и (или) структурными подразделениями юридического лица органам государственных доходов о получении и расходовании денег и (или) иного имущества, полученных от иностранных государств, международных и иностранных организаций, иностранцев, лиц без гражданства
