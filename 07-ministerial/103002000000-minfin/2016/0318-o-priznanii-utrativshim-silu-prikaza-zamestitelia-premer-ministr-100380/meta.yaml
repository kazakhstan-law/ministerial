act_code: '100380'
requisite: Приказ Министра финансов Республики Казахстан от 18 марта 2016 года № 130
title:
  rus: О признании утратившим силу приказа Заместителя Премьер-Министра Республики Казахстан - Министра финансов Республики Казахстан от 26 мая 2014 года № 247 "Об утверждении форм свидетельств об аккредитации профессиональной организации бухгалтеров, организации но профессиональной сертификации бухгалтеров"
  kaz: '"Бухгалтерлердің кәсіби ұйымын, бухгалтерлерді кәсіби сертификаттау бойынша ұйымды акредиттеу туралы куәліктер нысандарын бекіту туралы" Қазақстан Республикасы Премьер-Министрінің орынбасары - Қазақстан Республикасы Қаржы министрінің 2014 жылғы 26 мамырдағы № 247 бұйрығының күшін жоюды тану туралы'
