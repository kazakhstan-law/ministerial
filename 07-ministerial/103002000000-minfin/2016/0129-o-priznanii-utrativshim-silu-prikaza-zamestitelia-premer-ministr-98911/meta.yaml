  kaz: '"Республикалық мүлікті мүліктік жалдауға (жалға алуға) беру кезінде жалдау ақысының мөлшерлемесін есептеу қағидаларын бекіту туралы" Қазақстан Республикасы Премьер-Министрінің орынбасары - Қазақстан Республикасы Қаржы министрінің 2014 жылғы 20 мамырдағы № 236 бұйрығының күшін жою туралы'
