act_code: '105848'
requisite: Приказ Министра финансов Республики Казахстан от 27 июля 2016 года № 405. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 августа 2016 года № 14166. Утратил силу приказом Министра финансов Республики Казахстан от 7 ноября 2018 года № 978 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении форм обязательств об использовании ввозимых автокомпонентов в пределах срока исковой давности исключительно в целях промышленной сборки моторных транспортных средств и об использовании ввозимых сырья и (или) материалов в пределах срока исковой давности исключительно при осуществлении деятельности в рамках инвестиционного контракта
  kaz: Талап қою мерзімінің өтуі шегінде әкелінетін автокомпоненттерді моторлы көлік құралдарын өнеркәсіптік құрастыру мақсатында ғана пайдалану туралы және талап қою мерзімінің өтуі шегінде әкелінетін шикізатты және (немесе) материалдарды инвестициялық келісімшарт шеңберінде қызметті жүзеге асыру кезінде ғана пайдалану туралы міндеттеме нысандарын бекіту туралы
