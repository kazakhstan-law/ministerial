requisite: Приказ Министра финансов Республики Казахстан от 22 июля 2016 года № 389. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 августа 2016 года № 14175. Утратил силу приказом Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 18 февраля 2020 года № 162 (вводится в действие с 1 января 2021 года)
title:
  rus: Об утверждении формы требования органов государственных доходов о подтверждении расходов на погашение вознаграждения по ипотечным жилищным займам, полученным физическим лицом на приобретение жилья в Республике Казахстан, и Правил ее составления
  kaz: Қазақстан Республикасында тұрғын үй сатып алу үшін жеке тұлға алған ипотекалық тұрғын үй қарыздары бойынша сыйақыларды өтеуге жұмсалған шығыстарды растау туралы мемлекеттік кірістер органдары талаптарының нысанын және оны толтыру қағидаларын бекіту туралы
