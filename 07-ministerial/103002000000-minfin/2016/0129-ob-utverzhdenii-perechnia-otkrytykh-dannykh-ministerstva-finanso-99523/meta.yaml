  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 29 января 2016 года № 42 «Об утверждении перечня открытых данных Министерства финансов Республики Казахстан, размещаемых на интернет-портале открытых данных»
    kaz: «Ашық деректердің интернет-порталында орналастырылатын Қазақстан Республикасы Қаржы министрлігінің ашық деректер тізбесін бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2016 жылғы 29 қаңтардағы № 42 бұйрығына өзгеріс енгізу туралы
