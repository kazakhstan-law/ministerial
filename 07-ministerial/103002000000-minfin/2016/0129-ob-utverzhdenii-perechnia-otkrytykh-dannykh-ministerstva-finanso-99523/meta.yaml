act_code: '99523'
requisite: Приказ Министра финансов Республики Казахстан от 29 января 2016 года № 42. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 февраля 2016 года № 13281. Утратил силу приказом Министра финансов Республики Казахстан от 18 января 2022 года № 48 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
