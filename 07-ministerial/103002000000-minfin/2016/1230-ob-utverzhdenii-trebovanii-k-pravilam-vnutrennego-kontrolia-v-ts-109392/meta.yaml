act_code: '109392'
requisite: Приказ и.о. Министра финансов Республики Казахстан от 30 декабря 2016 года № 704. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 января 2017 года № 14708. Утратил силу приказом Министра финансов Республики Казахстан от 24 сентября 2020 года № 915 (вводится в действие с 15 ноября 2020 года)
title:
  rus: Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма для индивидуальных предпринимателей и юридических лиц, осуществляющих лизинговую деятельность в качестве лизингодателя без лицензии
  kaz: Лизинг беруші ретінде лизингтік қызметті лицензиясыз жүзеге асыратын дара кәсіпкерлерге және заңды тұлғалар үшін қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы
