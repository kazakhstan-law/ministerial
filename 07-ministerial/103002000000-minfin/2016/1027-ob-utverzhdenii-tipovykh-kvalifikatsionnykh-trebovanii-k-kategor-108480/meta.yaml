requisite: Приказ Министра финансов Республики Казахстан от 27 октября 2016 года № 573. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 декабря 2016 года № 14573. Утратил силу приказом Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 21 октября 2019 года № 1167 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Типовых квалификационных требований к категориям должностей государственных аудиторов уполномоченных органов внутреннего государственного аудита и финансового контроля, являющихся административными государственными служащими корпуса "Б"
  kaz: '"Б" корпусының мемлекеттік әкімшілік қызметшілері болып табылатын ішкі мемлекеттік аудит және қаржылық бақылау уәкілетті органдарының мемлекеттік аудиторлары лауазымдарының санаттарына қойылатын үлгілік біліктілік талаптарын бекіту туралы'
