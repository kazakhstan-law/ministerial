title:
  rus: Об утверждении формы, сроков и Правил представления сведений о физических лицах юридическим лицом, обеспечивающим в соответствии с законодательством Республики Казахстан о пенсионном обеспечении учет пенсионных взносов, социальных отчислений и социальных выплат
  kaz: Қазақстан Республикасының зейнетақымен қамсыздандыру туралы заңнамасына сәйкес зейнетақы жарналарын, әлеуметтік аударымдарды және әлеуметтік төлемдерді есепке алуды қамтамасыз ететін заңды тұлғаның жеке тұлғалар туралы мәліметтерді ұсыну нысанын, мерзімдерін және қағидаларын бекіту туралы
