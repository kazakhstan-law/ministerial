  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 22 августа 2016 года № 451 «Об утверждении формы, сроков и Правил представления сведений о физических лицах юридическим лицом, обеспечивающим в соответствии с законодательством Республики Казахстан о пенсионном обеспечении учет пенсионных взносов, социальных отчислений и социальных выплат»
    kaz: «Қазақстан Республикасының зейнетақымен қамсыздандыру туралы заңнамасына сәйкес зейнетақы жарналарын, әлеуметтік аударымдарды және әлеуметтік төлемдерді есепке алуды қамтамасыз ететін заңды тұлғаның жеке тұлғалар туралы мәліметтерді ұсыну нысанын, мерзімдерін және қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің 2016 жылғы 22 тамыздағы № 451 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/111405/rus
