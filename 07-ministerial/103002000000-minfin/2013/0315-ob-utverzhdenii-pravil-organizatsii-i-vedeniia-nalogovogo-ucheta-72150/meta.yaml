  requisite: Приказ Министра финансов Республики Казахстан от 2 октября 2015 года № 502. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 ноября 2015 года № 12244. Утратил силу приказом Министра финансов Республики Казахстан от 1 февраля 2018 года № 98 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 15 марта 2013 года № 137 «Об утверждении Правил организации  и ведения налогового учета индивидуальными предпринимателями, которые в соответствии с Законом Республики Казахстан от 28 февраля 2007 года «О бухгалтерском учете и финансовой отчетности» не осуществляют ведение бухгалтерского учета и составление финансовой отчетности»
    kaz: «Бухгалтерлік есеп пен қаржылық есептілік туралы» 2007 жылғы 28 ақпандағы Қазақстан Республикасының Заңына сәйкес бухгалтерлік есеп жүргізуді және қаржылық есептілік жасауды жүзеге асырмайтын дара кәсіпкерлердің салық есебін ұйымдастыру және жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы Министрінің 2013 жылғы 15 наурыздағы № 137 бұйрығына өзгерістер енгізу туралы
