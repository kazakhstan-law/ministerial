act_code: '71543'
requisite: Приказ Министра финансов Республики Казахстан от 8 февраля 2013 года № 68. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 марта 2013 года № 8371. Утратил силу приказом Заместителя Премьер-Министра Республики Казахстан - Министра финансов Республики Казахстан от 2 июля 2014 года № 298
title:
  rus: Об утверждении регламента электронной государственной услуги "Регистрация лиц, имеющих право осуществлять деятельность реабилитационного и (или) конкурсного управляющих и (или) администратора внешнего наблюдения, и снятие их с регистрации"
  kaz: '"Оңалтушы және (немесе) конкурстық басқарушылардың және (немесе) сырттай байқау әкімшісінің қызметін жүзеге асыруға құқығы бар тұлғаларды тіркеу және оларды тіркеуден шығару" электрондық мемлекеттік қызметтің регламентін бекіту туралы'
