title:
  rus: Об утверждении Правил составления консолидированной финансовой отчетности администраторами бюджетных программ и местными уполномоченными органами по исполнению бюджета
  kaz: Бюджеттiк бағдарламалар әкiмшiлерi мен бюджеттi атқару жөнiндегi жергілікті уәкiлеттi органдардың шоғырландырылған қаржылық есептiлiктi жасау қағидаларын бекіту туралы
