  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 30 октября 2013 года № 500 "Об утверждении Правил составления консолидированной финансовой отчетности администраторами бюджетных программ и местными уполномоченными органами по исполнению бюджета"
    kaz: '"Бюджеттік бағдарламалар әкiмшiлерiнің және бюджеттi атқару жөнiндегi жергілікті уәкiлеттi органдардың шоғырландырылған қаржылық есептілікті жасау ережесін бекіту туралы" Қазақстан Республикасы Қаржы Министрінің 2013 жылғы 30 қазандағы № 500 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
