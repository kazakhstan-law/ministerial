    kaz: '"Уақытша әкелінген тауарларды, көлік құралдарын Қазақстан Республикасының аумағынан кейіннен әкету туралы міндеттемені табыс ету және оны орындаудың ережесін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2010 жылғы 16 шілдедегі № 353 бұйрығына өзгерістер мен толықтыру енгізу туралы'
