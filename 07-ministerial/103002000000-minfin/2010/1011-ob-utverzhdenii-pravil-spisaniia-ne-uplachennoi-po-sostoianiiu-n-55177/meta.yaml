act_code: '55177'
requisite: Приказ Министра финансов Республики Казахстан от 11 октября 2010 года № 505. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 октября 2010 года № 6574. Утратил силу приказом Министра финансов Республики Казахстан от 25 июля 2013 года № 365
title:
  rus: Об утверждении Правил списания не уплаченной по состоянию на 1 мая 2010 года суммы штрафа за налоговые правонарушения, правонарушения в области налогообложения, нарушение законодательства Республики Казахстан о пенсионном обеспечении и (или) об обязательном социальном страховании
  kaz: 2010 жылғы 1 мамырдағы жағдай бойынша төленбеген салықтық құқық бұзушылықтар, салық салу саласындағы құқық бұзушылықтар, Қазақстан Республикасының зейнетақымен қамсыздандыру туралы және (немесе) міндетті әлеуметтік сақтандыру туралы заңнамасын бұзушылықтар үшін айыппұл сомаларын есептен шығару ережелерін бекіту туралы
