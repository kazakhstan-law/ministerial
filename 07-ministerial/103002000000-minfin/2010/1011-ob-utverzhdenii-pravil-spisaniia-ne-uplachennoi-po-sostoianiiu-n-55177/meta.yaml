  title:
    rus: О внесении изменения в приказ Министра финансов Республики Казахстан от 11 октября 2010 года № 505 "Об утверждении Правил списания не уплаченной по состоянию на 1 мая 2010 года суммы штрафа за налоговые правонарушения, правонарушения в области налогообложения, нарушение законодательства Республики Казахстан о пенсионном обеспечении и (или) об обязательном социальном страховании"
    kaz: '"2010 жылғы 1 мамырдағы жағдай бойынша төленбеген салықтық құқық бұзушылықтар, салық салу саласындағы құқық бұзушылықтар, Қазақстан Республикасының зейнетақымен қамсыздандыру туралы және (немесе) міндетті әлеуметтік сақтандыру туралы заңнамасын бұзушылықтар үшін айыппұл сомаларын есептен шығару ережелерін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2010 жылғы 11 қазандағы № 505 бұйрығына өзгеріс енгізу туралы'
