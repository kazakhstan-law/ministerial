  code: '89880'
  requisite: Приказ Министра финансов Республики Казахстан от 30 марта 2015 года № 234. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 апреля 2015 года № 10909. Утратил силу приказом Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 17 июля 2019 года № 737 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра финансов Республики Казахстан от 26 июля 2010 года № 372 "Об утверждении формы анкеты, реестра уполномоченных экономических операторов и свидетельства о включении в реестр"
    kaz: '"Уәкілетті экономикалық операторлардың сауалнамасын, тізілімін және тізілімге енгізу туралы куәлігін бекіту туралы" Қазақстан Республикасы Қаржы Министрінің 2010 жылғы 26 шілдедегі № 372 бұйрығына өзгерістер енгізу туралы'
