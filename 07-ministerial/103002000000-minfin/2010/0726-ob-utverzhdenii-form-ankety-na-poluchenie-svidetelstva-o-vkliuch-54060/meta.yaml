requisite: Приказ Министра финансов Республики Казахстан от 26 июля 2010 года № 372. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 августа 2010 года № 6383. Утратил силу приказом Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 17 июля 2019 года № 737 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении форм анкеты на получение свидетельства о включении в реестр уполномоченных экономических операторов, реестра уполномоченных экономических операторов, свидетельства о включении в реестр уполномоченных экономическмх операторов
  kaz: Уәкілетті экономикалық операторлар тізіліміне енгізу туралы куәлікті алуға арналған сауалнама нысандарын, уәкілетті экономикалық операторлар тізілімін, уәкілетті экономикалық операторлар тізіліміне енгізу туралы куәлікті бекіту туралы
