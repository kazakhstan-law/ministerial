requisite: Приказ и.о. Министра финансов Республики Казахстан от 15 ноября 2010 года № 569. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 декабря 2010 года № 6660. Утратил силу приказом Министра финансов Республики Казахстан от 31 марта 2015 года № 238
title:
  rus: Об утверждении Правил разработки программы, проведения квалификационных экзаменов, вопросов для квалификационного экзамена, разработки и утверждения вопросов для квалификационного экзамена, критериев оценки знаний претендента на получение аттестата, а также формы квалификационного аттестата, бейджа, личной номерной печати специалиста по таможенному декларированию
  kaz: Бағдарламаны әзірлеу, біліктілік емтихандарын өткізу тәртібін, біліктілік емтиханы үшін сұрақтар әзірлеуді және оны бекітуді, аттестат алуға үміткердің білімін бағалаудың критерийлерін белгілеудің Ережесін, сондай-ақ, біліктілік аттестатының, бейджінің, кедендік декларациялау жөніндегі маманның жеке нөмірлік мөрінің нысанын бекіту туралы
