  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра финансов Республики Казахстан от 10 февраля 2010 года № 52 "Об утверждении Перечня оффшорных зон для целей Закона Республики Казахстан "О противодействии легализации (отмыванию) доходов, полученных незаконным путем, и финансированию терроризма"
    kaz: '"Заңсыз жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл туралы" Қазақстан Республикасы Заңының мақсаттары үшін оффшорлық аймақтар тізбесін бекіту туралы" Қазақстан Республикасы Қаржы министрінің міндетін атқарушының 2010 жылғы 10 ақпандағы № 52 бұйрығына өзгерістер енгізу туралы'
