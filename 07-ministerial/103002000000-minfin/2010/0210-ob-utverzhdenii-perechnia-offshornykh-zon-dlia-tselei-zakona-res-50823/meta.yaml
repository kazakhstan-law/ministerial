title:
  rus: Об утверждении Перечня оффшорных зон для целей Закона Республики Казахстан "О противодействии легализации (отмыванию) доходов, полученных преступным путем, и финансированию терроризма"
  kaz: '"Қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға) және терроризмді қаржыландыруға қарсы іс-қимыл туралы" Қазақстан Республикасы Заңының мақсаттары үшін Оффшорлық аймақтар тізбесін бекіту туралы'
