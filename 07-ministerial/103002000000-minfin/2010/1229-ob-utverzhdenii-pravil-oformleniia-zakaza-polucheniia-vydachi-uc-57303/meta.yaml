act_code: '57303'
requisite: Приказ Министра финансов Республики Казахстан от 29 декабря 2010 года № 670. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 января 2011 года № 6759. Утратил силу приказом Министра финансов Республики Казахстан от 30 декабря 2011 года № 687
title:
  rus: Об утверждении Правил оформления, заказа, получения, выдачи, учета, хранения и представления сопроводительных накладных на этиловый спирт и алкогольную продукцию при их реализации и транспортировке
  kaz: Этил спирті мен алкоголь өнімін өткізу және тасымалдау кезінде оларға ілеспе жүкқұжаттарын ресімдеу, тапсырыс беру, алу, беру, есепке алу, сақтау және табыс ету тәртібін бекіту туралы
