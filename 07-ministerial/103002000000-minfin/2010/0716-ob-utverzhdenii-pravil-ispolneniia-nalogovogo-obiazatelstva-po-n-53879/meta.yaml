  title:
    rus: О внесении дополнений и изменений в приказ Министра финансов Республики Казахстан от 16 июля 2010 года № 350 "Об утверждении Правил исполнения налогового обязательства по налогу на добавленную стоимость юридическими лицами-нерезидентами, осуществляющими деятельность без образования постоянного учреждения, при временном ввозе на территорию Республики Казахстан товаров, не предусмотренных Перечнем товаров, временный ввоз которых на территорию Республики Казахстан освобождается от уплаты налога на добавленную стоимость"
    kaz: '"Тұрақты мекеме құрмай қызметін жүзеге асыратын резидент емес заңды тұлғаладың Қазақстан Республикасының аумағына уақытша әкелінуі қосылған құн салығын төлеуден босатылатын тауарлар тізбесінде көзделмеген тауарларды Қазақстан Республикасының аумағына уақытша әкелу кезінде қосылған құн салығы бойынша салық міндеттемесін орындау ережесін бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2010 жылғы 16 шілдедегі № 350 бұйрығына толықтырулар мен өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/57815/rus
