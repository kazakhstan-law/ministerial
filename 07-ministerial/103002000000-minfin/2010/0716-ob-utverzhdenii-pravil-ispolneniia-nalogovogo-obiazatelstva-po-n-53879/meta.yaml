act_code: '53879'
requisite: Приказ Министра финансов Республики Казахстан от 16 июля 2010 года № 350. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 августа 2010 года № 6369. Утратил силу приказом и.о. Министра финансов Республики Казахстан от 2 мая 2012 года № 229
title:
  rus: Об утверждении Правил исполнения налогового обязательства по налогу на добавленную стоимость юридическими лицами-нерезидентами, осуществляющими деятельность без образования постоянного учреждения, при временном ввозе на территорию Республики Казахстан товаров, не предусмотренных Перечнем товаров, временный ввоз которых на территорию Республики Казахстан освобождается от уплаты налога на добавленную стоимость
  kaz: Тұрақты мекеме құрмай қызметін жүзеге асыратын резидент емес заңды тұлғалардың Қазақстан Республикасының аумағына уақытша әкелінуі қосылған құн салығын төлеуден босатылатын тауарлар тізбесінде көзделмеген тауарларды Қазақстан Республикасының аумағына уақытша әкелу кезінде қосылған құн салығы бойынша салық міндеттемесін орындау ережесін бекіту туралы
