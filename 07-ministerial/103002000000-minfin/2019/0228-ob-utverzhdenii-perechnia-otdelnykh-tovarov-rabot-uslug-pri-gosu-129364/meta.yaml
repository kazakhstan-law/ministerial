requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 28 февраля 2019 года № 155. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 марта 2019 года № 18359. Утратил силу приказом Министра финансов Республики Казахстан от 10 сентября 2024 года № 613 (вводится в действие с 1 января 2025 года и подлежит официальному опубликованию)
title:
  rus: Об утверждении перечня отдельных товаров, работ, услуг, при государственных закупках которых к потенциальным поставщикам и поставщикам могут быть установлены дополнительные требования
  kaz: Мемлекеттік сатып алынуы кезінде әлеуетті өнім берушілерге және өнім берушілерге қосымша талаптар белгіленуі мүмкін жекелеген тауарлардың, жұмыстардың, көрсетілетін қызметтердің тізбесін бекіту туралы
