  title:
    rus: О внесении изменений в приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 28 февраля 2019 года № 155 «Об утверждении перечня отдельных товаров, работ, услуг, при государственных закупках которых к потенциальным поставщикам и поставщикам могут быть установлены дополнительные требования»
