  title:
    rus: О внесении изменений в приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 30 апреля 2019 года № 411 «Об утверждении формы решения о признании уведомления об устранении нарушений, выявленных органами государственных доходов по результатам камерального контроля, не исполненным, и сроков его вынесения»
    kaz: «Камералдық бақылау нәтижелерi бойынша мемлекеттік кірістер органдары анықтаған бұзушылықтарды жою туралы хабарламаны орындалмаған деп тану туралы шешімнің нысанын және оны шығару мерзімін бекіту туралы» Қазақстан Республикасы Премьер-Министрінің Бірінші орынбасары – Қазақстан Республикасы Қаржы министрінің 2019 жылғы 30 сәуірдегі № 411 бұйрығына өзгерістер енгізу туралы
