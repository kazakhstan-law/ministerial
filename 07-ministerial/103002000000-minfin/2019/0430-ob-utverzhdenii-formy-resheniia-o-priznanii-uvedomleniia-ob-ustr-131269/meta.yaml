title:
  rus: Об утверждении формы решения о признании уведомления об устранении нарушений, выявленных органами государственных доходов по результатам камерального контроля, не исполненным, и сроков его вынесения
  kaz: Камералдық бақылау нәтижелерi бойынша мемлекеттік кірістер органдары анықтаған бұзушылықтарды жою туралы хабарламаны орындалмаған деп тану туралы шешімнің нысанын және оны шығару мерзімін бекіту туралы
