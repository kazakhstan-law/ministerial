  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра финансов Республики Казахстан от 31 декабря 2019 года № 1451 «Об утверждении категорий налогоплательщиков – физических лиц, состоящих на регистрационном учете в качестве индивидуального предпринимателя или лица, занимающегося частной практикой, юридических лиц, Правил и сроков представления банками второго уровня и организациями, осуществляющими отдельные виды банковских операций, сведений по итоговым суммам платежей за календарный год, поступившим на текущий счет посредством применения оборудования (устройства), предназначенного для осуществления платежей с использованием платежных карточек, а также ее формы»
    kaz: «Дара кәсіпкер ретінде тіркеу есебінде тұрған жеке тұлғалар немесе жеке практикамен айналысатын адамдар, заңды тұлғалар - салық төлеушілердің санаттары, төлем карточкаларын пайдаланумен төлемдерді жүзеге асыруға арналған жабдықтарды (құрылғыларды) қолдану арқылы ағымдағы шотқа түскен, күнтізбелік жыл үшін төлемдердің жиынтық сомалары туралы мәліметтерді екінші деңгейдегі банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың ұсыну Қағидалары мен мерзімдерін, сондай-ақ оның нысанын бекіту туралы» Қазақстан Республикасы Қаржы министрінің міндетін атқарушының 2019 жылғы 31 желтоқсандағы № 1451 бұйрығына өзгерістер и толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/165251/rus
