act_code: '137898'
requisite: Приказ и.о. Министра финансов Республики Казахстан от 31 декабря 2019 года № 1451. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2019 года № 19815. Утратил силу приказом Министра финансов Республики Казахстан от 12 ноября 2025 года № 696 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении категорий налогоплательщиков – физических лиц, состоящих на регистрационном учете в качестве индивидуального предпринимателя или лица, занимающегося частной практикой, юридических лиц, Правил и сроков представления банками второго уровня и организациями, осуществляющими отдельные виды банковских операций, сведений по итоговым суммам платежей за календарный год, поступившим на текущий счет посредством применения оборудования (устройства), предназначенного для осуществления платежей с использованием платежных карточек и мобильных платежей, а также ее формы
  kaz: Дара кәсіпкер ретінде тіркеу есебінде тұрған жеке тұлғалар немесе жеке практикамен айналысатын адамдар, заңды тұлғалар - салық төлеушілердің санаттары, төлем карточкаларын мен мобильдік төлемдерді пайдаланумен, төлемдерді жүзеге асыруға арналған жабдықтарды (құрылғыларды) қолдану арқылы ағымдағы шотқа түскен, күнтізбелік жыл үшін төлемдердің жиынтық сомалары туралы мәліметтерді екінші деңгейдегі банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың ұсыну Қағидалары мен мерзімдерін, сондай-ақ оның нысанын бекіту туралы
