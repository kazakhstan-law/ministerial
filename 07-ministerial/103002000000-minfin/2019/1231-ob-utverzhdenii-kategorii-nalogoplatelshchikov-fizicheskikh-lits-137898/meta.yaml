  title:
    rus: О некоторых вопросах представления в орган государственных доходов банками второго уровня и организациями, осуществляющими отдельные виды банковских операций, организаторами игорного бизнеса, осуществляющими деятельность букмекерской конторы и (или) тотализатора, операторами интернет-платформ сведений, а также лицом (арендодателем), представляющим во временное владение и пользование торговые объекты, торговые места в торговых объектах, в том числе на торговых рынках реестра договоров имущественного найма (аренды)
    kaz: Екінші деңгейдегі банктердің және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың, букмекерлік кеңсенің және (немесе) тотализатордың қызметін жүзеге асыратын ойын бизнесін ұйымдастырушылардың, интернет-платформалар операторларының, сондай-ақ сауда объектілерін, сауда объектілеріндегі, оның ішінде мүліктік жалдау (жалдау) шарттары тізілімінің сауда базарларындағы сауда орындарын уақытша иеленуге және пайдалануға ұсынатын тұлға (жалға беруші) мемлекеттік кірістер органына мәліметтерді ұсынуының кейбір мәселелері туралы
  link: https://zan.gov.kz/client/#!/doc/216785/rus
