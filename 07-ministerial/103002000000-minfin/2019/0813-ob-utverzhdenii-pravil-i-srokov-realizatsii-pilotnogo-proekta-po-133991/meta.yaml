  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра финансов Республики Казахстан от 13 августа 2019 года № 871 «Об утверждении Правил и сроков реализации пилотного проекта по компенсации суммы налога на добавленную стоимость физическим лицам, являющимся гражданами иностранных государств, при вывозе товаров за пределы таможенной территории Евразийского экономического союза, за исключением вывоза товаров через территории государств-членов Евразийского экономического союза (пилотный проект «такс фри»)»
    kaz: «Еуразиялық экономикалық одаққа мүше мемлекеттердің аумағы арқылы тауарларды әкетуді қоспағанда, тауарларды Еуразиялық экономикалық одақтың кедендік аумағының шегінен тыс жерге әкету кезінде шет мемлекеттердің азаматтары болып табылатын жеке тұлғаларға қосылған құн салығы сомасының өтемақысы бойынша пилоттық жобаны іске асыру қағидаларын және мерзімдерін бекіту туралы («такс фри» пилоттық жобасы)» Қазақстан Республикасы Қаржы министрінің міндетін атқарушының 2019 жылғы 13 тамыздағы № 871 бұйрығына өзгерістер енгізу туралы
