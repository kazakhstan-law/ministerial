act_code: '132869'
requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 28 июня 2019 года № 655. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 июля 2019 года № 18939
title:
  rus: Об утверждении образцов форменной одежды, натуральных норм обеспечению ею и знаков различия, Правил ее ношения, а также перечня работников органов государственных доходов, имеющих право ношения форменной одежды, осуществляющих контроль на Государственной границе Республики Казахстан, не совпадающей с таможенной границей Евразийского экономического союза
  kaz: Нысанды киім үлгілерін, онымен қамтамасыз етудің заттай нормаларын және айырым белгілерін, оны киіп жүру қағидаларын, сондай-ақ Еуразиялық экономикалық одақтың кедендік шекарасына тұспа-тұс келмейтін Қазақстан Республикасының Мемлекеттік шекарасында бақылауды жүзеге асыратын, нысанды киім киюге құқығы бар мемлекеттік кірістер органдары қызметкерлерінің тізбесін бекіту туралы
