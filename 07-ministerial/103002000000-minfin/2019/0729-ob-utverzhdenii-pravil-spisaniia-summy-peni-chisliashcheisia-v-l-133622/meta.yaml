act_code: '133622'
requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 29 июля 2019 года № 797. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июля 2019 года № 19122.  Утратил силу приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил списания суммы пени, числящейся в лицевом счете налогоплательщика по состоянию на 1 января 2019 года, и суммы пени, начисленной на сумму недоимки, образованной по налоговым обязательствам за налоговые периоды до 1 января 2019 года, за исключением обязательств по уплате налога на имущество и земельного налога за 2018 год, до даты ее уплаты, включая день уплаты, а также списания суммы недоимки, числящейся на лицевом счете по состоянию на 1 января 2019 года более пятнадцати лет, и суммы пени, начисленной на сумму указанной недоимки до даты ее списания
  kaz: 2019 жылғы 1 қаңтардағы жағдай бойынша салық төлеушінің жеке шотында есептелінген өсімпұл сомаларын есептен шығару және 2018 жылғы мүлік салығы мен жер салығын төлеу бойынша міндеттерді қоспағанда, төленген күніне дейінгі, оны төлеу күнін қоса алғанда 2019 жылғы 1 қаңтарға дейінгі салық кезенінде салық міндеттері бойынша туындаған бересі сомасына есептелген өсімпұл сомаларын, сондай-ақ 2019 жылғы 1 қаңтардағы жағдай бойынша он бес жылдан астам дербес шотта есептелінген бересі сомаларын және оны есептен шығару күніне дейінгі, көрсетілген бересі сомасына есептелген өсімпұл сомаларын есептен шығару қағидаларын бекіту туралы
