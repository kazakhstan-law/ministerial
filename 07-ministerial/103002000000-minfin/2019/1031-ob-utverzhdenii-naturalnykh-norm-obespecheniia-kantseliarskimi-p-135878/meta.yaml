requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 31 октября 2019 года № 1199. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 ноября 2019 года № 19561. Утратил силу приказом Министра финансов Республики Казахстан от 15 сентября 2025 года № 497 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм обеспечения канцелярскими принадлежностями и другими расходными материалами работников системы Министерства финансов Республики Казахстан
