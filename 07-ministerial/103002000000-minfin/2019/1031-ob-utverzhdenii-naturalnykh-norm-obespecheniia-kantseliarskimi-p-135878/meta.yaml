    kaz: «Қазақстан Республикасы Қаржы министрлігі жүйесінің қызметкерлерін кеңсе жабдықтарымен және басқа да шығыс материалдарымен қамтамасыз етудің заттай нормаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің бірінші орынбасары – Қазақстан Республикасы Қаржы министрінің 2019 жылғы 31 қазандағы № 1199 бұйрығына өзгеріс енгізу туралы
