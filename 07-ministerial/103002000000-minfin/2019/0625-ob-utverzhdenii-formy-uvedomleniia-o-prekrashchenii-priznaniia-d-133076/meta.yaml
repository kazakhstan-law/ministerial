requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 25 июня 2019 года № 628. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 июня 2019 года № 18907
title:
  rus: Об утверждении формы уведомления о прекращении признания доходов в виде вознаграждения по выданному кредиту (займу) путем приостановления начисления такого вознаграждения физическому лицу, состоящему на регистрационном учете в качестве индивидуального предпринимателя, или юридическому лицу
  kaz: Дара кәсіпкер ретінде тіркеу есебінде тұрған жеке тұлғаға немесе заңды тұлғаға берiлген кредит (қарыз) бойынша сыйақыны есепке жазуды тоқтата тұру арқылы осындай сыйақы түріндегі кiрiстердi тану тоқтатылған кезде хабарлама нысанын бекіту туралы
