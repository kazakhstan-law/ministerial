act_code: '129330'
requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 28 февраля 2019 года № 151. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 марта 2019 года № 18361. Утратил силу приказом Председателя Агентства РК по финансовому мониторингу от 4 декабря 2024 года № 7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении квалификационных требований к категориям должностей службы экономических расследований органов по финансовому мониторингу Министерства финансов Республики Казахстан
  kaz: Қазақстан Республикасының Қаржы министрлігі Қаржы мониторингі органдарының экономикалық тергеп-тексеру қызметі лауазымдары санаттарына қойылатын біліктілік талаптарын бекіту туралы
