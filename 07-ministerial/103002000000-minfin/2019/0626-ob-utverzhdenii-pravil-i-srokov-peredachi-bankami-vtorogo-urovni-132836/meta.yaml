act_code: '132836'
requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 26 июня 2019 года № 634. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 июня 2019 года № 18934. Утратил силу приказом Министра финансов Республики Казахстан от 25 марта 2022 года № 306 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и сроков передачи банками второго уровня и организациями, осуществляющими отдельные виды банковских операций, сведений об открытии и закрытии текущих счетов для учета налога на добавленную стоимость, а также об остатках и движении денег по таким счетам
  kaz: Қосылған құн салығын есепке алу үшін екінші деңгейдегі банктер және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар, ағымдағы шоттардың ашылғаны және жабылғаны туралы, сондай-ақ осындай шоттар бойынша ақшаның қалдықтары мен қозғалысы туралы мәліметтерді беру қағидаларын және мерзімдерін бекіту туралы
