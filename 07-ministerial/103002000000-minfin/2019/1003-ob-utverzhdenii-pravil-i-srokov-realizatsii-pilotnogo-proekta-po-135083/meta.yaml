title:
  rus: Об утверждении Правил и сроков реализации пилотного проекта по совершенствованию администрирования налога на добавленную стоимость на основании информационной системы электронных счетов-фактур с применением системы управления рисками (пилотный проект)
  kaz: Тәуекелдерді басқару жүйесін қолдана отырып, электрондық шот-фактуралар ақпараттық жүйесінің негізінде қосылған құн салығын әкімшілендіруді жетілдіру жөніндегі пилоттық жобаны іске асыру қағидалары мен мерзімдерін бекіту туралы (пилоттық жоба)
