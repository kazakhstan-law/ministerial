  title:
    rus: О внесении изменений и дополнения в приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 3 октября 2019 года № 1084 «Об утверждении Правил и сроков реализации пилотного проекта по совершенствованию администрирования налога на добавленную стоимость на основании информационной системы электронных счетов-фактур с применением системы управления рисками (пилотный проект)»
    kaz: Тәуекелдерді басқару жүйесін қолдана отырып, электрондық шот-фактуралар ақпараттық жүйесінің негізінде қосылған құн салығын әкімшілендіруді жетілдіру жөніндегі пилоттық жобаны іске асыру қағидалары мен мерзімдерін бекіту туралы (пилоттық жоба) Қазақстан Республикасы Премьер-Министрінің Бірінші орынбасары–Қазақстан Республикасы Қаржы министрінің 2019 жылғы 3 қазандағы № 1084 бұйрығына өзгерістер мен толықтыру енгізу туралы
