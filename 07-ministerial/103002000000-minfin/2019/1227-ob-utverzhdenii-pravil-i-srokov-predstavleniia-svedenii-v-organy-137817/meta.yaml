act_code: '137817'
requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 27 декабря 2019 года № 1429. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2019 года № 19803. Утратил силу приказом Министра финансов Республики Казахстан от 12 ноября 2025 года № 699 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил и сроков представления сведений в органы государственных доходов банками второго уровня, филиалами банков-нерезидентов Республики Казахстан и организациями, осуществляющими отдельные виды банковских операций, кастодианами, центральным депозитарием, брокерами и (или) дилерами, обладающими правом ведения счетов клиентов в качестве номинальных держателей ценных бумаг, управляющих инвестиционным портфелем, а также страховыми (перестраховочными) организациями, филиалами страховых (перестраховочными) организаций-нерезидентов Республики Казахстан
  kaz: Екінші деңгейдегі банктердің, Қазақстан Республикасының бейрезидент-банктерінің филиалдары мен банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың, кастодиандардың, орталық депозитарийлердің, бағалы қағаздарды номиналды ұстаушы ретінде клиенттердің шоттарын жүргізу құқығы бар брокерлердің және (немесе) дилерлердің, инвестициялық портфельді басқарушылардың, сондай-ақ сақтандыру (қайта сақтандыру) ұйымдарының, Қазақстан Республикасының бейрезидент-сақтандыру (қайта сақтандыру) ұйымдары филиалдарының мемлекеттік кірістер органдарына мәліметтерді ұсыну қағидалары мен мерзімдерін бекіту туралы
