  title:
    rus: О внесении изменений в приказ Первого заместителя Премьер-Министра Республики Казахстан - Министра финансов Республики Казахстан от 27 декабря 2019 года № 1429 «Об утверждении Правил и сроков представления сведений в органы государственных доходов банками второго уровня и организациями, осуществляющими отдельные виды банковских операций, кастодианами, центральным депозитарием, брокерами и (или) дилерами, обладающими правом ведения счетов клиентов в качестве номинальных держателей ценных бумаг, управляющих инвестиционным портфелем, а также страховыми организациями»
    kaz: «Екінші деңгейдегі банктер мен банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдардың, кастодиандардың, орталық депозитарийлердің, бағалы қағаздарды номиналды ұстаушы ретінде клиенттердің шоттарын жүргізу құқығы бар брокерлердің және (немесе) дилерлердің, инвестициялық портфельді басқарушылардың, сондай-ақ сақтандыру ұйымдарының мемлекеттік кірістер органдарына мәліметтерді ұсыну қағидалары мен мерзімдерін бекіту туралы» Қазақстан Республикасы Премьер-Министрінің Бірінші орынбасары – Қазақстан Республикасы Қаржы министрінің 2019 жылғы 27 желтоқсандағы № 1429 бұйрығына өзгерістер енгізу туралы
