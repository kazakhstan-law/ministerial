title:
  rus: Об утверждении Правил осуществления органами государственных доходов контроля за соблюдением запретов и ограничений в отношении отдельных видов товаров, перемещаемых через Государственную границу Республики Казахстан, не совпадающую с таможенной границей Евразийского экономического союза
  kaz: Еуразиялық экономикалық одақтың кедендік шекарасымен тұспа-тұс келмейтін Қазақстан Республикасының Мемлекеттік шекарасы арқылы өткізілетін жекелеген тауар түрлеріне қатысты тыйымдар мен шектеулердің сақталуын бақылауды мемлекеттік кірістер органдарының жүзеге асыру қағидаларын бекіту туралы
