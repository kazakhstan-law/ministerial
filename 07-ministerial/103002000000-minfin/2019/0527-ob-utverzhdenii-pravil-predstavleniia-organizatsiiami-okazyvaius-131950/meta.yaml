act_code: '131950'
requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 27 мая 2019 года № 493. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 мая 2019 года № 18741. Утратил силу приказом Министра финансов Республики Казахстан от 30 сентября 2025 года № 554 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил представления организациями, оказывающими услуги водоснабжения, водоотведения, канализации, газоснабжения, электроснабжения, теплоснабжения, сбора отходов (мусороудаления), обслуживания лифтов и (или) услуги в сфере перевозок, сведений о предоставленных услугах третьим лицам
  kaz: Сумен жабдықтау, су бұру, кәріз, газбен жабдықтау, электрмен жабдықтау, жылумен жабдықтау, қалдықтарды жинау (қоқысты жою), лифтілерге қызмет ету қызметтерін және (немесе) тасымалдар саласындағы қызметтерді көрсететін ұйымдардың үшінші тұлғаларға көрсетілген қызметтері туралы мәліметтерді ұсыну қағидаларын бекіту туралы
