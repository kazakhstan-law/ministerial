act_code: '130559'
requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 4 апреля 2019 года № 297. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 апреля 2019 года № 18485. Утратил силу приказом Председателя Агентства Республики Казахстан по финансовому мониторингу от 29 апреля 2022 года № 24 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм обеспечения форменной одежды (без погон) сотрудников службы экономических расследований органов по финансовому мониторингу Республики Казахстан
  kaz: Қазақстан Республикасының қаржы мониторингі жөніндегі органдарының экономикалық тергеу қызметі қызметкерлерін нысанды киіммен (погонсыз) қамтамасыз етудің заттай нормаларын бекіту туралы
