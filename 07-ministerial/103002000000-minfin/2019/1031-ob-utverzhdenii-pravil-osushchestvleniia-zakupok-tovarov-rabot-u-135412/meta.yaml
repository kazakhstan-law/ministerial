act_code: '135412'
requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 31 октября 2019 года № 1201. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 октября 2019 года № 19538. Утратил силу приказом Министра финансов Республики Казахстан от 11 ноября 2021 года № 1166 (вводится в действие с 1 января 2022 года)
title:
  rus: Об утверждении Правил осуществления закупок товаров, работ, услуг национальными управляющими холдингами, национальными холдингами, национальными компаниями и организациями, пятьдесят и более процентов голосующих акций (долей участия в уставном капитале) которых прямо или косвенно принадлежат национальному управляющему холдингу, национальному холдингу, национальной компании
  kaz: Ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың және дауыс беретін акцияларының (жарғылық капиталға қатысу үлестерінің) елу және одан да көп пайызы ұлттық басқарушы холдингке, ұлттық холдингке ұлттық компанияға тікелей немесе жанама түрде тиесілі ұйымдардың тауарларды, жұмыстарды, көрсетілетін қызметтерді сатып алуды жүзеге асыру қағидаларын бекіту туралы
