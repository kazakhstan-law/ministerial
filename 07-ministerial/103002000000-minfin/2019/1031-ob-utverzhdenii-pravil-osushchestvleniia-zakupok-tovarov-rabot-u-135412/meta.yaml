  title:
    rus: О внесении изменений и дополнений в приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 31 октября 2019 года № 1201 «Об утверждении Правил осуществления закупок товаров, работ, услуг национальными управляющими холдингами, национальными холдингами, национальными компаниями и организациями, пятьдесят и более процентов голосующих акций (долей участия в уставном капитале) которых прямо или косвенно принадлежат национальному управляющему холдингу, национальному холдингу, национальной компании»
    kaz: «Ұлттық басқарушы холдингтердің, ұлттық холдингтердің, ұлттық компаниялардың және дауыс беретін акцияларының (жарғылық капиталға қатысу үлестерінің) елу және одан да көп пайызы ұлттық басқарушы холдингке, ұлттық холдингке, ұлттық компанияға тікелей немесе жанама түрде тиесілі ұйымдардың тауарларды, жұмыстарды, көрсетілетін қызметтерді сатып алуды жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің Бірінші орынбасары - Қазақстан Республикасы Қаржы министрінің 2019 жылғы 31 қазандағы № 1201 бұйрығына өзгерістер мен толықтырулар енгізу туралы
