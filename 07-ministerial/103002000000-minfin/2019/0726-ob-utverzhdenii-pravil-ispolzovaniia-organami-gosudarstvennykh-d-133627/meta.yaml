  code: '193933'
  requisite: Приказ Министра финансов Республики Казахстан от 1 марта 2024 года № 118. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 марта 2024 года № 34103. Утратил силу приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
  title:
    rus: О внесении изменений в приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 26 июля 2019 года № 776 «Об утверждении Правил использования органами государственных доходов сведений, представляемых банками второго уровня и организациями, осуществляющими отдельные виды банковских операций, в соответствии с Кодексом Республики Казахстан от 25 декабря 2017 года «О налогах и других обязательных платежах и бюджет» (Налоговый кодекс)»
    kaz: «Салық және бюджетке төленетін басқа да міндетті төлемдер туралы» 2017 жылғы 25 желтоқсандағы Қазақстан Республикасының Кодексіне (Салық кодексі) сәйкес екінші деңгейдегі банктер және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар ұсынатын мәліметтерді мемлекеттік кірістер органдарының пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің Бірінші орынбасары – Қазақстан Республикасы Қаржы министрінің 2019 жылғы 26 шілдедегі № 776 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/193933/rus
