act_code: '133627'
requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 26 июля 2019 года № 776. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июля 2019 года № 19125.  Утратил силу приказом Министра финансов Республики Казахстан от 9 октября 2025 года № 586 (вводится в действие с 1 января 2026 года)
title:
  rus: Об утверждении Правил использования органами государственных доходов сведений, представляемых банками второго уровня и организациями, осуществляющими отдельные виды банковских операций, в соответствии с Кодексом Республики Казахстан «О налогах и других обязательных платежах и бюджет (Налоговый кодекс)»
  kaz: «Салық және бюджетке төленетін басқа да міндетті төлемдер туралы» Қазақстан Республикасының Кодексіне (Салық кодексі) сәйкес екінші деңгейдегі банктер және банк операцияларының жекелеген түрлерін жүзеге асыратын ұйымдар ұсынатын мәліметтерді мемлекеттік кірістер органдарының пайдалану қағидаларын бекіту туралы
