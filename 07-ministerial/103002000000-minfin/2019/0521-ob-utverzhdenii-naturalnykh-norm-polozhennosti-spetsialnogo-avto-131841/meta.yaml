requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 21 мая 2019 года № 470. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 мая 2019 года № 18718. Утратил силу приказом Министра финансов Республики Казахстан от 15 сентября 2025 года № 497 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
