    kaz: «Республикалық бюджет бойынша болжамды шоғырландырылған қаржылық есептілікті жасау қағидаларын бекіту туралы» Қазақстан Республикасы Қаржы министрінің міндетін атқарушының 2019 жылғы 5 қарашадағы № 1223 бұйрығына өзгерістер мен толықтырулар енгізу туралы
