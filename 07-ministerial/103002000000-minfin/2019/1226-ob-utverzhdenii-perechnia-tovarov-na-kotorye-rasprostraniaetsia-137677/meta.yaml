title:
  rus: Об утверждении Перечня товаров, на которые распространяется обязанность по оформлению сопроводительных накладных на товары, а также Правил оформления сопроводительных накладных на товары и их документооборот
  kaz: Тауарларға арналған ілеспе жүкқұжаттарды ресімдеу жөніндегі міндет қолданылатын тауарлар тізбесін, сондай-ақ Тауарларға арналған ілеспе жүкқұжаттарды ресімдеу және олардың құжат айналымы қағидаларын бекіту туралы
