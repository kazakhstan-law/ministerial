requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 1 марта 2019 года № 159. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 марта 2019 года № 18362. Утратил силу приказом Заместителя Премьер-Министра - Министра финансов Республики Казахстан от 31 августа 2022 года № 903 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
