  title:
    rus: О внесении изменений в приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 2 июля 2019 года № 674 «Об утверждении Правил предоставления государственной гарантии Республики Казахстан по поддержке экспорта»
    kaz: «Қазақстан Республикасының экспортты қолдау жөніндегі мемлекеттік кепілдігін беру қағидаларын бекіту туралы» Қазақстан Республикасы Премьер-Министрінің Бірінші орынбасары – Қазақстан Республикасы Қаржы министрінің 2019 жылғы 2 шілдедегі № 674 бұйрығына өзгерістер енгізу туралы
