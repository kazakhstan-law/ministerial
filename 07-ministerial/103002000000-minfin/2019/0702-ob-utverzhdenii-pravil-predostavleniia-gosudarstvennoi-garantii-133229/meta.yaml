act_code: '133229'
requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 2 июля 2019 года № 674. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 июля 2019 года № 19026. Утратил силу приказом Министра финансов Республики Казахстан от 24 июня 2025 года № 317 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил предоставления государственной гарантии Республики Казахстан по поддержке экспорта
  kaz: Қазақстан Республикасы экспортты қолдау бойынша мемлекеттік кепілдігін беру қағидаларын бекіту туралы
