requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 31 мая 2019 года № 521. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 мая 2019 года № 18768. Утратил силу приказом Министра финансов Республики Казахстан от 16 августа 2024 года № 552 (вводится в действие с 1 января 2025 года)
title:
  rus: Об утверждении перечня товаров, работ, услуг, по которым государственные закупки осуществляются способом конкурса с предварительным квалификационным отбором
