act_code: '132562'
requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра финансов Республики Казахстан от 18 июня 2019 года № 599. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 июня 2019 года № 18864
title:
  rus: Об утверждении Правил совершения таможенных операций в отношении иностранных товаров, ввозимых с территории сопредельного иностранного государства, связанных с формированием из указанных товаров партий международных почтовых отправлений, оформлением документов, предусмотренных актами Всемирного почтового союза, при вывозе сформированных международных почтовых отправлений с территории свободной (специальной, особой) экономической зоны, пределы которой полностью или частично совпадают с участками таможенной границы Евразийского экономического союза, в соответствии с пунктом 7-1 статьи 291 Кодекса Республики Казахстан от 26 декабря 2017 года «О таможенном регулировании в Республике Казахстан»
  kaz: «Қазақстан Республикасындағы кедендік реттеу туралы» Қазақстан Республикасының 2017 жылғы 26 желтоқсандағы Кодексінің 291-бабының 7-1-тармағына сәйкес еркін (арнайы, ерекше) экономикалық аймақтың аумағынан халықаралық пошталық қалыптастырылған жөнелтімді әкету кезінде, оның шектері Еуразиялық экономикалық одақтың кедендік шекарасының учаскелерімен толық немесе ішінара сәйкес келетін, Дүниежүзілік пошта одағының актілерінде көзделінген құжаттарды рәсімдеу, көрсетілген тауарлар партиясының халықаралық пошталық жөнелтілімін қалыптастырумен байланысты, іргелес жатқан шет мемлекеттің аумағынан әкелінетін шетелдік тауарларға кедендік операцияларды жасау қағидаларын бекіту туралы
