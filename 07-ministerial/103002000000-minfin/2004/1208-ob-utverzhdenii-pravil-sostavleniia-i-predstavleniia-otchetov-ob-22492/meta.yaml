  title:
    rus: О внесении дополнений и изменений в приказ Министра финансов Республики Казахстан от 8 декабря 2004 года № 432 "Об утверждении Правил составления и представления отчетов об исполнении государственного бюджета и бюджета области, республиканского и местных бюджетов"
    kaz: '"Мемлекеттік бюджет пен облыс бюджетінің, республикалық және жергілікті бюджеттердің атқарылуы туралы есептерді жасау мен ұсынудың Ережелері" туралы Қазақстан Республикасы Қаржы министрінің 2004 жылғы 8 желтоқсандағы № 432 бұйрығына толықтырулар мен өзгерістер енгізу туралы'
