act_code: '22492'
requisite: Приказ Министра финансов Республики Казахстан от 8 декабря 2004 года № 432. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 января 2005 глда № 3321. Утратил силу приказом Министра финансов Республики Казахстан от 30 декабря 2008 года № 644 (вводится в действие с 1 января 2009 года)
title:
  rus: Об утверждении Правил составления и представления отчетов об исполнении государственного бюджета и бюджета области, республиканского и местных бюджетов
  kaz: Мемлекеттік, біріктірілген бюджеттердің және облыс бюджетiнiң, атқарылуы туралы есептердi жасау мен ұсынудың тәртiбi туралы ережелер
