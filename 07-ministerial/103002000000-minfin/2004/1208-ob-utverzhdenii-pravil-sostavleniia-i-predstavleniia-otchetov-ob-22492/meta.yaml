  title:
    rus: О внесении изменений и дополнений в приказ Министра финансов Республики Казахстан от 8 декабря 2004 года № 432 "Об утверждении Инструкции о порядке составления и представления отчетов об исполнении государственного бюджета и бюджета области, республиканского и местных бюджетов"
    kaz: '"Мемлекеттік бюджет пен облыс бюджетінің, республикалық және жергілікті бюджеттердің атқарылуы туралы есептерді жасау мен ұсынудың тәртібі туралы нұсқаулықты бекіту туралы" Қазақстан Республикасы Қаржы министрінің 2004 жылғы 8 желтоқсандағы N 432 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
