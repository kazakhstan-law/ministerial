act_code: '221755'
requisite: Приказ Министра финансов Республики Казахстан от 27 января 2026 года № 47
title:
  rus: Об утверждении Перечня услуг по ремонту товара, ввезенного на территорию Республики Казахстан с территории государств – членов Евразийского экономического союза, включая его восстановление, замену составных частей, обороты по реализации которых освобождаются от налога на добавленную стоимость
  kaz: Өткізу бойынша айналымдар қосылған құн салығынан босатылатын, Қазақстан Республикасының аумағына Еуразиялық экономикалық одаққа мүше мемлекеттердің аумағынан әкелінген тауарды жөндеу бойынша, оны қалпына келтіруді, құрамдас бөліктерін ауыстыруды қоса алғанда, көрсетілетін қызметтер тізбесін бекіту туралы
