act_code: '222835'
requisite: Приказ Министра финансов Республики Казахстан от 24 февраля 2026 года № 121
title:
  rus: Об утверждении списка стран, с которыми вступил в силу международный договор, регулирующий вопросы избежания двойного налогообложения и предотвращения уклонения от уплаты налогов, номинальная ставка налога на прибыль которых составляет более 75 процентов от ставки корпоративного подоходного налога в Республике Казахстан
  kaz: Пайда салығының номиналды мөлшерлемесі Қазақстан Республикасындағы корпоративтік табыс салығы мөлшерлемесінің 75 пайызынан астамын құрайтын, өзімен жасалған қосарланған салық салуды болғызбау және салықтарды төлеуден жалтаруға жол бермеу мәселелерін реттейтін халықаралық шарт күшіне енген елдердің тізімін бекіту туралы
