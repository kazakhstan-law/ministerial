requisite: Приказ Министра финансов Республики Казахстан от 4 июня 2026 года № 363. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июня 2026 года № 38905
title:
  rus: Об утверждении Правил и сроков реализации пилотного проекта по компенсации суммы налога на добавленную стоимость физическим лицам, являющимся гражданами иностранных государств, при вывозе товаров за пределы таможенной территории Евразийского экономического союза, за исключением вывоза товаров через территории государств-членов Евразийского экономического союза (пилотный проект «такс фри»)
  kaz: Еуразиялық экономикалық одаққа мүше мемлекеттердің аумағы арқылы тауарларды әкетуді қоспағанда, тауарларды Еуразиялық экономикалық одақтың кедендік аумағының шегінен тыс жерге әкету кезінде шет мемлекеттердің азаматтары болып табылатын жеке тұлғаларға қосылған құн салығы сомасының өтемақысы бойынша пилоттық жобаны іске асыру қағидаларын және мерзімдерін бекіту туралы («такс фри» пилоттық жобасы)
