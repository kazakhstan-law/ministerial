act_code: '226318'
requisite: Приказ Министра финансов Республики Казахстан от 8 июня 2026 года № 375
title:
  rus: Об утверждении Правил реализации пилотного проекта по масштабированию использования «Цифрового тенге» в рамках республиканского и местных бюджетов, а также перечня специфик расходов для применения центральными государственными органами и местными исполнительными органами при исполнении республиканского и местного бюджета
  kaz: Республикалық және жергілікті бюджет шеңберінде «Цифрлық теңгені» пайдалану аясын кеңейту жөніндегі пилоттық жобаны іске асыру қағидаларын, сондай-ақ Орталық мемлекеттік органдар мен жергілікті атқарушы органдардың республикалық және жергілікті бюджетті атқару кезінде қолдануына арналған шығыстар ерекшеліктерінің тізбесін бекіту туралы
