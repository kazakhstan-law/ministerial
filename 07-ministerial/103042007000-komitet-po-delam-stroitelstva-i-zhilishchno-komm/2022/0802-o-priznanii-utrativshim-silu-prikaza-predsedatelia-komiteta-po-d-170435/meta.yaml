act_code: '170435'
requisite: Приказ Председателя Комитета по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и инфраструктурного развития Республики Казахстан от 2 августа 2022 года № 158-нқ. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 августа 2022 года № 29025
title:
  rus: О признании утратившим силу приказа Председателя Комитета по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и инфраструктурного развития Республики Казахстан от 13 марта 2020 года № 54-НҚ «Об утверждении руководящего документа в строительстве Республики Казахстан 8.01-14-2019 «Расчет сметных цен на строительные ресурсы и услуги по перевозке грузов для строительства»»
  kaz: «Құрылыс ресурстарына және құрылыс үшін жүктерді тасымалдау жөніндегі қызметтерге арналған сметалық бағаларды есептеу» Қазақстан Республикасының құрылыстағы басшылық құжатын 8.01-14-2019 бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігі Құрылыс және тұрғын үй-коммуналдық шаруашылық істері комитеті төрағасының 2020 жылғы 13 наурыздағы № 54-НҚ бұйрығының күшін жою туралы
