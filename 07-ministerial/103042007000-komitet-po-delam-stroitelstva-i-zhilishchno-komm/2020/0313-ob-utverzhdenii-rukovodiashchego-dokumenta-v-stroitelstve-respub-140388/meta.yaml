requisite: Приказ Председателя Комитета по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и инфраструктурного развития Республики Казахстан от 13 марта 2020 года № 54-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 марта 2020 года № 20141. Утратил силу приказом Председателя Комитета по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и инфраструктурного развития Республики Казахстан от 2 августа 2022 года № 158-нқ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении руководящего документа в строительстве Республики Казахстан 8.01-14-2019 «Расчет сметных цен на строительные ресурсы и услуги по перевозке грузов для строительства»
