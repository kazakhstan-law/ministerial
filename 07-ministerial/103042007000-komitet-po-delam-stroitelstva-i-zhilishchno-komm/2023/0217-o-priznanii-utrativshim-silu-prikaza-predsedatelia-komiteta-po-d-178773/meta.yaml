act_code: '178773'
requisite: Приказ Председателя Комитета по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и инфраструктурного развития Республики Казахстан от 17 февраля 2023 года № 29-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 февраля 2023 года № 31940
title:
  rus: О признании утратившим силу приказа Председателя Комитета по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и инфраструктурного развития Республики Казахстан от 22 февраля 2019 года № 26-НҚ «Об утверждении нормативного документа по ведению государственного градостроительного кадастра Республики Казахстан»
  kaz: «Қазақстан Республикасының мемлекеттік қала құрылысы кадастрын жүргізу жөніндегі нормативтік құжатты бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігі Құрылыс және тұрғын үй-коммуналдық шаруашылық істері комитеті төрағасының 2019 жылғы 22 ақпандағы № 26-НҚ бұйрығының күшін жою туралы
