title:
  rus: Об утверждении разрешительных требований и перечня документов, подтверждающих соответствие им, форм заявлений для получения разрешения второй категории, форм разрешений второй категории, правил осуществления разрешительных процедур и правил осуществления деятельности операторов технического осмотра
  kaz: Рұқсат беру талаптарын және оларға сәйкестікті растайтын құжаттар тізбесін, екінші санаттағы рұқсат алу үшін өтініш нысандарын, екінші санаттағы рұқсат нысандарын, рұқсат беру рәсімдерін жүзеге асыру қағидаларын және техникалық қарап-тексеру операторларының қызметін жүзеге асыру қағидаларын бекіту туралы
