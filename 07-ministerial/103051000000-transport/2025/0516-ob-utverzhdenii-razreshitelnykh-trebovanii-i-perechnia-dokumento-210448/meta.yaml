  title:
    rus: О приостановлении действий некоторых норм структурных элементов приказа исполняющего обязанности Министра транспорта Республики Казахстан от 16 мая 2025 года № 152 «Об утверждении разрешительных требований и перечня документов, подтверждающих соответствие им, форм заявлений для получения разрешения второй категории, форм разрешений второй категории, правил осуществления разрешительных процедур и правил осуществления деятельности операторов технического осмотра»
    kaz: «Рұқсат беру талаптарын және оларға сәйкестікті растайтын құжаттар тізбесін, екінші санаттағы рұқсат алу үшін өтініш нысандарын, екінші санаттағы рұқсат нысандарын, рұқсат беру рәсімдерін жүзеге асыру қағидаларын және техникалық қарап-тексеру операторларының қызметін жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Көлік министрінің міндетін атқарушының 2025 жылғы 16 мамырдағы № 152 бұйрығының кейбір нормаларының қолданысын тоқтата тұру туралы
