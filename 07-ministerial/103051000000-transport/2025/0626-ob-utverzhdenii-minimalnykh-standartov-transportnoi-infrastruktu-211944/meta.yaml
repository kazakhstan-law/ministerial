act_code: '211944'
requisite: Приказ и.о. Министра транспорта Республики Казахстан от 26 июня 2025 года № 208
title:
  rus: Об утверждении Минимальных стандартов транспортной инфраструктуры Республики Казахстан в области автомобильных дорог для строительства, реконструкции, капитального и среднего ремонта улиц столицы, городов республиканского значения и населенных пунктов
  kaz: Астананың, республикалық маңызы бар қалалардың және елді мекендердің көшелерін салу, реконструкциялау, күрделі және орташа жөндеу үшін автомобиль жолдары саласындағы Қазақстан Республикасының көлік инфрақұрылымының ең төмен стандарттарын бекіту туралы
