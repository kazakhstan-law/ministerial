act_code: '215151'
requisite: Приказ и.о. Министра транспорта Республики Казахстан от 1 октября 2025 года № 318. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 октября 2025 года № 37037
title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача технического условия для проектирования на пересечение автомобильных дорог общего пользования областного и районного значения каналами, линиями связи и электропередачи, нефтепроводами, газопроводами, водопроводами и железными дорогами, другими инженерными сетями, коммуникациями, а также при строительстве подъездных дорог и примыканий к автомобильным дорогам общего пользования областного и районного значения»
  kaz: «Облыстық және аудандық маңызы бар ортақ пайдаланылатын автомобиль жолдарын байланыс және электр беру арналарының, желілерінің, мұнай құбырларының, газ құбырларының, су құбырларының және теміржолдардың, басқа инженерлік желілердің, коммуникациялардың кесіп өтуін жобалау үшін, сондай-ақ кірме жолдарды және облыстық және аудандық маңызы бар ортақ пайдаланылатын автомобиль жолдарына жалғасатын жолдарды салу үшін техникалық шартты беру» мемлекеттік қызмет көрсету қағидалары
