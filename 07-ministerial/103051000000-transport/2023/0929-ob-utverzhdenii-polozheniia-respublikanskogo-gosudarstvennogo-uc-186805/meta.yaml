  title:
    rus: О внесении изменений в приказ Министра транспорта Республики Казахстан от 29 сентября 2023 года № 17 «Об утверждении Положений республиканских государственных учреждений «Комитет гражданской авиации Министерства транспорта Республики Казахстан» и «Межрегиональная инспекция по безопасности полетов» Комитета гражданской авиации Министерства транспорта Республики Казахстан»
    kaz: «Қазақстан Республикасы Көлік министрлігінің Азаматтық авиация комитеті» және «Қазақстан Республикасы Көлік министрлігі Азаматтық авиация комитетінің Өңіраралық ұшу қауіпсіздігі инспекциясы» республикалық мемлекеттік мекемелерінің ережелерін бекіту туралы» Қазақстан Республикасы Көлік министрінің 2023 жылғы 29 қыркүйектегі № 17 бұйрығына өзгерістер енгізу туралы
