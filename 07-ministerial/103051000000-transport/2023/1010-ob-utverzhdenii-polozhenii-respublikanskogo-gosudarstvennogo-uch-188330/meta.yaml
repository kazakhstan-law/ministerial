caused_by:
  code: '215300'
  requisite: Приказ и.о. Министра транспорта Республики Казахстан от 6 октября 2025 года № 326
  title:
    rus: О внесении изменений и дополнения в приказ Министра транспорта Республики Казахстан от 10 октября 2023 года № 19 «Об утверждении положений республиканского государственного учреждения «Комитет железнодорожного и водного транспорта Министерства транспорта Республики Казахстан», республиканского государственного учреждения «Комитет автомобильного транспорта и транспортного контроля Министерства транспорта Республики Казахстан» и его территориальных органов» и признании утратившем силу приказ исполняющего обязанности Министра транспорта Республики Казахстан
    kaz: «Қазақстан Республикасы Көлік министрлігінің Теміржол және су көлігі комитеті» республикалық мемлекеттік мекемесінің, «Қазақстан Республикасы Көлік министрлігінің Автомобиль көлігі және көліктік бақылау комитеті» республикалық мемлекеттік мекемесінің және оның аумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Көлік министрінің 2023 жылғы 10 қазандағы № 19 бұйрығына өзгерістер мен толықтыру енгізу және Қазақстан Республикасы Көлік министрінің міндетін атқарушы бұйрығының күшін жою туралы
  link: https://zan.gov.kz/client/#!/doc/215300/rus
