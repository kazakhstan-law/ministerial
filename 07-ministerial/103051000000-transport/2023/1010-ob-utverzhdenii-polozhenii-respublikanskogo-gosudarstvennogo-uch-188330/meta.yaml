caused_by:
  code: '226055'
  requisite: Приказ Министра транспорта Республики Казахстан от 1 июня 2026 года № 128
  title:
    rus: О внесении изменений и дополнений в приказ Министра транспорта Республики Казахстан от 10 октября 2023 года № 19 «Об утверждении положений республиканского государственного учреждения «Комитет железнодорожного и водного транспорта Министерства транспорта Республики Казахстан», республиканского государственного учреждения «Комитет автомобильного транспорта и транспортного контроля Министерства транспорта Республики Казахстан» и его территориальных органов»
    kaz: «Қазақстан Республикасы Көлік министрлігінің Теміржол және су көлігі комитеті» республикалық мемлекеттік мекемесінің, «Қазақстан Республикасы Көлік министрлігінің Автомобиль көлігі және көліктік бақылау комитеті» республикалық мемлекеттік мекемесінің және оның аумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Көлік министрінің 2023 жылғы 10 қазандағы № 19 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/226055/rus
