caused_by:
  code: '195351'
  requisite: Приказ Министра транспорта Республики Казахстан от 3 апреля 2024 года № 120
  title:
    rus: О внесении изменений и дополнения в приказ Министра транспорта Республики Казахстан от 10 октября 2023 года № 19 «Об утверждении положений республиканского государственного учреждения «Комитет железнодорожного и водного транспорта Министерства транспорта Республики Казахстан», республиканского государственного учреждения «Комитет автомобильного транспорта и транспортного контроля Министерства транспорта Республики Казахстан» и его территориальных органов»
    kaz: «Қазақстан Республикасы Көлік министрлігінің Теміржол және су көлігі комитеті» республикалық мемлекеттік мекемесінің, «Қазақстан Республикасы Көлік министрлігінің Автомобиль көлігі және көліктік бақылау комитеті» республикалық мемлекеттік мекемесінің және оның аумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Көлік министрінің 2023 жылғы 10 қазандағы № 19 бұйрығына өзгерістер мен толықтыру енгізу туралы
