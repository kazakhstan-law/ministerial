act_code: '231480'
requisite: Приказ и.о. Министра транспорта Республики Казахстан от 1 октября 2026 года № 276. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 октября 2026 года № 40092
title:
  rus: Об утверждении Правил организации и финансирования подготовки авиационного персонала, научной и (или) научно-технической деятельности в области использования воздушного пространства Республики Казахстан и деятельности авиации за счет отчислений государственного поставщика аэронавигационного обслуживания на подготовку гражданского авиационного персонала и развитие научной и (или) научно-технической деятельности в области использования воздушного пространства Республики Казахстан и деятельности авиации
  kaz: Аэронавигациялық қызмет көрсетуді мемлекеттік берушінің азаматтық авиация персоналын даярлауға және Қазақстан Республикасының әуе кеңістігін пайдалану және авиация қызметі саласындағы ғылыми және (немесе) ғылыми-техникалық қызметті дамытуға аударымдары есебінен авиация персоналын даярлауды, Қазақстан Республикасының әуе кеңістігін пайдалану және авиация қызметі саласындағы ғылыми және (немесе) ғылыми-техникалық қызметті ұйымдастыру мен қаржыландыру қағидаларын бекіту туралы
