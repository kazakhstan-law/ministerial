title:
  rus: Об утверждении Типовых требований по функционированию, обустройству и техническому оснащению сервисных зон ожидания перед пунктами пропуска через Государственную границу Республики Казахстан
  kaz: Қазақстан Республикасының Мемлекеттік шекарасы арқылы өткізу пункттерінің алдында орналасқан сервистік күту аймақтардың жұмыс істеуіне, жайластыруына және техникалық жарақтандырылуына қойылатын үлгілік талаптарды бекіту туралы
