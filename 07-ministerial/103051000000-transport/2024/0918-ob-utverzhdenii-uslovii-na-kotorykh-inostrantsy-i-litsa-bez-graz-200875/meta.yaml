  title:
    rus: О внесении изменения и дополнения в приказы Министра транспорта и коммуникаций Республики Казахстан от 10 февраля 2004 года № 55-I «Об утверждении Положения о капитане морского порта» и исполняющего обязанности Министра транспорта Республики Казахстан от 18 сентября 2024 года № 305 «Об утверждении условий, на которых иностранцы и лица без гражданства могут входить в состав экипажа судна, плавающего под Государственным флагом Республики Казахстан»
    kaz: «Теңіз портының капитаны туралы ережені бекіту туралы» Қазақстан Республикасы Көлік және коммуникациялар министрінің 2004 жылғы 10 ақпандағы № 55-I және «Қазақстан Республикасының Мемлекеттік туын көтерiп жүзетін кеме экипажының құрамына шетелдiктер мен азаматтығы жоқ адамдардың кiру мүмкiндiгiнің шарттарын бекіту туралы» Қазақстан Республикасы Көлік министрінің міндетін атқарушының 2024 жылғы 18 қыркүйектегі № 305 бұйрықтарына өзгеріс пен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/212771/rus
