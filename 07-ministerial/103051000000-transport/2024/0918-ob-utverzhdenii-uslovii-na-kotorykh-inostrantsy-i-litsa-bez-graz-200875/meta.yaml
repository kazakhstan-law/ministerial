title:
  rus: Об утверждении условий, на которых иностранцы и лица без гражданства могут входить в состав экипажа судна, плавающего под Государственным флагом Республики Казахстан
  kaz: Қазақстан Республикасының Мемлекеттік туын көтерiп жүзетін кеме экипажының құрамына шетелдiктер мен азаматтығы жоқ адамдардың кiру мүмкiндiгiнің шарттарын бекіту туралы
