title:
  rus: Об определении перечня требований, нарушение которых влечет применение мер оперативного реагирования, а также определение в отношении конкретных нарушений требований конкретного вида меры оперативного реагирования с указанием срока действия данной меры (при необходимости)
  kaz: Бұзылуы жедел ден қою шараларын қолдануға алып келетін талаптардың тізбесін айқындау, сондай-ақ талаптарды нақты бұзушылықтарға қатысты осы шараның қолданылу мерзімін (қажет болған кезде) көрсете отырып, жедел ден қою шарасының нақты түрін айқындау туралы
