requisite: Приказ и.о. Министра транспорта Республики Казахстан от 21 июня 2024 года № 213. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 июня 2024 года № 34546
title:
  rus: Об определении перечня требований из числа включенных в проверочный лист, нарушение которых влечет применение мер оперативного реагирования, а также определение в отношении конкретных нарушений конкретного вида меры оперативного реагирования с указанием срока действия данной меры (при необходимости)
  kaz: Тексеру парағына енгізілген талаптар арасынан бұзылуы жедел ден қою шараларын қолдануға алып келетін талаптар тізбесін айқындау, сондай-ақ нақты бұзушылықтарға қатысты осы шараның қолданылу мерзімін көрсете отырып, жедел ден қою шарасының нақты түрін (қажет болған кезде) айқындау туралы
