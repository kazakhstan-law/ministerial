act_code: '201454'
requisite: Приказ Министра транспорта Республики Казахстан от 8 октября 2024 года № 324. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 октября 2024 года № 35227
title:
  rus: О приостановлении действий некоторых структурных элементов приказа исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 27 марта 2015 года № 353 «Об утверждении Правил применения разрешительной системы автомобильных перевозок в Республике Казахстан в международном сообщении»
  kaz: «Қазақстан Республикасының халықаралық қатынастағы автомобильмен тасымалдауларында рұқсат беру жүйесін қолдану қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 27 наурыздағы № 353 бұйрығының кейбір құрылымдық элементтерінің әрекеттерін тоқтата тұру туралы
