requisite: Приказ Министра охраны окружающей среды Республики Казахстан от 25 августа 2011 года № 228-ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 сентября 2011 года № 7202. Утратил силу приказом Министра энергетики Республики Казахстан от 25 декабря 2015 года № 753
title:
  rus: Об утверждении Критериев оценки степени рисков субъектов в области охраны окружающей среды, воспроизводства и использования природных ресурсов (за исключением субъектов частного предпринимательства)
  kaz: Қоршаған ортаны қорғау, табиғи ресурстарды молықтыру және пайдалану саласында субъектілердің (жеке кәсіпкерлік субъектілерінен басқа) тәуекел дәрежесін бағалау өлшемдерін бекіту туралы
