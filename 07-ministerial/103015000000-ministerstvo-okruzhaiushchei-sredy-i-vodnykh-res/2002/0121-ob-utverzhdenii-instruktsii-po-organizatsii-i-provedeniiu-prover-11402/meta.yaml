requisite: Приказ Министра природных ресурсов и охраны окружающей среды Республики Казахстан от 21 января 2002 года N 13-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 февраля 2002 года N 1762. Утратил силу - приказом Министра охраны окружающей среды РК от 14.04.2005г. N 128-п
title:
  rus: Об утверждении Инструкции по организации и проведению проверок оросительно-обводнительных систем органами государственного контроля в системе Министерства природных ресурсов и охраны окружающей среды Республики Казахстан
  kaz: '"Қазақстан Республикасы Табиғи ресурстар және қоршаған ортаны қорғау министрлiгi жүйесiндегi мемлекеттiк бақылау органдарымен суармалы-суландыру жүйелердi тексерудi ұйымдастыру және жүргiзу нұсқауын бекiту туралы'
