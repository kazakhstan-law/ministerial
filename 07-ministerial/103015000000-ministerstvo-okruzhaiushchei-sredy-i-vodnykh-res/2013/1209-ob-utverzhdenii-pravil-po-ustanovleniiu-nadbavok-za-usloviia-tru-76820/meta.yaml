requisite: Приказ и.о. Министра окружающей среды и водных ресурсов Республики Казахстан от 9 декабря 2013 года № 375-Ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 декабря 2013 года № 9028. Утратил силу приказом и.о. Министра экологии, геологии и природных ресурсов Республики Казахстан от 24 февраля 2022 года № 58 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
