act_code: '74115'
requisite: Приказ и.о Министра охраны окружающей среды Республики Казахстан от 20 августа 2013 года № 250-Ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 августа 2013 года № 8640. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 24 ноября 2015 года № 18-04/1030
title:
  rus: Об утверждении форм справки о наличии в собственности участника основных средств, технологического оборудования и других материально-технических средств по добыче и переработке рыбных ресурсов и других водных животных, а также основных средств для проведения рыбохозяйственных мелиоративных работ, справки о наличии основных средств для проведения рыбохозяйственных мелиоративных работ
  kaz: Қатысушының жеке меншігіндегі негізгі құралдардың, балық ресурстарын және басқа да су жануарларын аулау мен өңдеу жөніндегі технологиялық жабдықтар мен өзге де материалдық-техникалық құралдардың, сондай-ақ балық шаруашылығы мелиорациялық жұмыстарын жүргізу үшін негізгі құралдардың болуы туралы анықтаманың, балық шаруашылығы мелиорациялық жұмыстарын жүргізу үшін негізгі құралдардың болуы туралы анықтаманың нысандарын бекіту туралы
