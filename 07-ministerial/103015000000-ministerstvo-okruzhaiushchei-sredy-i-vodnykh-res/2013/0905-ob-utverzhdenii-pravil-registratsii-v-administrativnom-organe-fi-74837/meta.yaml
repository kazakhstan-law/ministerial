requisite: Приказ Министра охраны окружающей среды Республики Казахстан от 5 сентября 2013 года № 270-Ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 октября 2013 года № 8791. Утратил силу приказом Министра окружающей среды и водных ресурсов Республики Казахстан от 31 июля 2014 года № 302-Ө
title:
  rus: Об утверждении Правил регистрации в административном органе физических и юридических лиц, осуществляющих искусственное разведение животных, виды которых включены в приложения I и II Конвенции о международной торговле видами дикой фауны и флоры, находящимися под угрозой исчезновения
  kaz: Жабайы фауна мен флораның құрып кету қаупі төнген түрлерінің халықаралық саудасы туралы конвенцияның І және ІІ - қосымшаларына түрлері енгізілген жануарларды жасанды өсіруді жүзеге асыратын жеке және заңды тұлғаларды әкімшілік органда тіркеу қағидасын бекіту туралы
