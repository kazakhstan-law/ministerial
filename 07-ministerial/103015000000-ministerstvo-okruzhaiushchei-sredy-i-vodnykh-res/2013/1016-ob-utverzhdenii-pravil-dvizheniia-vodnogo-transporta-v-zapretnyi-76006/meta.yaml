act_code: '76006'
requisite: Приказ Министра охраны окружающей среды Республики Казахстан от 16 октября 2013 года № 313-Ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 ноября 2013 года № 8918. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 22 октября 2025 года № 384 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил движения водного транспорта в запретный для рыболовства нерестовый период, а также в запретных для рыболовства водоемах и (или) участках
  kaz: Уылдырық шашу кезеңінде балық аулауға тыйым салынған, сондай-ақ балық аулауға тыйым салынған су айдындарында және (немесе) учаскелерінде су көлігі қозғалысының ережесін бекіту туралы
