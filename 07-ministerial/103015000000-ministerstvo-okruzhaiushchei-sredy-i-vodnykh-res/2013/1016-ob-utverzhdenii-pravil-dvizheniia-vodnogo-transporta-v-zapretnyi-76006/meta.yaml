  title:
    rus: О внесении изменений в приказ Министра охраны окружающей среды Республики Казахстан от 16 октября 2013 года № 313-Ө "Об утверждении Правил движения водного транспорта в запретный для рыболовства нерестовый период, а также в запретных для рыболовства водоемах и (или) участках"
    kaz: '"Уылдырық шашу кезеңінде балық аулауға тыйым салынған, сондай-ақ балық аулауға тыйым салынған су айдындарында және (немесе) учаскелерінде су көлігі қозғалысының ережесін бекіту туралы" Қазақстан Республикасы Қоршаған ортаны қорғау министрінің 2013 жылғы 16 қазандағы № 313-Ө бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/104552/rus
