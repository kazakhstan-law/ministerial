requisite: Приказ Министра окружающей среды и водных ресурсов Республики Казахстан от 1 июля 2014 года № 245-Ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 августа 2014 года № 9655. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 1 октября 2025 года № 347 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
