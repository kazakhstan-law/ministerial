requisite: Приказ Министра окружающей среды и водных ресурсов Республики Казахстан от 16 мая 2014 года № 188-Ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 мая 2014 года № 9471. Утратил силу приказом Министра энергетики Республики Казахстан от 29 ноября 2024 года № 432 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
