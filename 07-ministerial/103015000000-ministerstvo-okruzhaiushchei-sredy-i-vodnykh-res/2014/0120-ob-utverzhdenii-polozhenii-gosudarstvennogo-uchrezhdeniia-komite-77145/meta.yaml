requisite: Приказ Министра окружающей среды и водных ресурсов Республики Казахстан от 20 января 2014 года № 11-Ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 января 2014 года № 9079. Утратил силу приказом Министра энергетики Республики Казахстан от 13 октября 2015 года № 597
title:
  rus: Об утверждении Положений государственного учреждения "Комитет экологического регулирования и контроля Министерства окружающей среды и водных ресурсов Республики Казахстан" и его территориальных органов
  kaz: '"Қазақстан Республикасы Қоршаған орта және су ресурстары министрлігі Экологиялық реттеу және бақылау комитеті" мемлекеттік мекемесінің және оның аумақтық органдарының Ережелерін бекіту туралы'
