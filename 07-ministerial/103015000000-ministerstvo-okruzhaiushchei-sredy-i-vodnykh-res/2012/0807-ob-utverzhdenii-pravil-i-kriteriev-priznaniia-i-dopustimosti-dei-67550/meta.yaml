act_code: '67550'
requisite: Приказ и.о. Министра охраны окружающей среды Республики Казахстан от 7 августа 2012 года № 238-ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 сентября 2012 года № 7905. Утратил силу приказом и.о. Министра экологии, геологии и природных ресурсов Республики Казахстан от 4 августа 2021 года № 289 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и критериев признания и допустимости действия на территории Республики Казахстан международных стандартов и стандартов Республики Казахстан, используемых в реализации проектных механизмов в сфере регулирования выбросов и поглощений парниковых газов, проведении инвентаризации парниковых газов, верификации и валидации
  kaz: Қазақстан Республикасының аумағында халықаралық стандарттарды және парниктік газдар шығарындылары мен сіңірулерін реттеу саласындағы жобалық тетіктерді іске асыруда, парниктік газдарды түгендеу, верификация және валидация жүргізуде пайдаланылатын Қазақстан Республикасы стандарттарын қолдануға рұқсат ету және тану қағидалары мен өлшемдерін бекіту туралы
