  requisite: Приказ Министра энергетики Республики Казахстан от 18 мая 2016 года № 211. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 июня 2016 года № 13827. Утратил силу приказом и.о. Министра экологии, геологии и природных ресурсов Республики Казахстан от 4 августа 2021 года № 289 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра охраны окружающей среды Республики Казахстан от 7 августа 2012 года № 238-ө "Об утверждении Правил и критериев признания и допустимости действия на территории Республики Казахстан международных стандартов и стандартов Республики Казахстан, используемых в реализации проектных механизмов в сфере регулирования выбросов и поглощений парниковых газов, проведении инвентаризации парниковых газов, верификации и валидации (детерминации)"
    kaz: '"Қазақстан Республикасының аумағында халықаралық стандарттарды және парниктік газдар шығарындылары мен сіңірулерін реттеу саласындағы жобалық тетіктерді іске асыруда, парниктік газдарды түгендеу, верификация және валидация (детерминация) жүргізуде пайдаланылатын Қазақстан Республикасы стандарттарын қолдануға рұқсат ету және тану қағидалары мен өлшемдерін бекіту туралы" Қазақстан Республикасы Қоршаған ортаны қорғау министрінің міндетін атқарушының 2012 жылғы 7 тамыздағы № 238-ө бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/103740/rus
