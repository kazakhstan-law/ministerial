act_code: '65061'
requisite: Приказ Министра охраны окружающей среды Республики Казахстан от 27 марта 2012 года № 78-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 апреля 2012 года № 7600. Утратил силу приказом и.о. Министра экологии, геологии и природных ресурсов Республики Казахстан от 3 июня 2022 года № 202 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил согласования планов и программ развития территорий, стратегических планов местных исполнительных органов областей, городов республиканского значения, столицы до их утверждения с уполномоченным органом в области охраны окружающей среды
  kaz: Аумақтарды дамыту жоспарлары мен бағдарламаларын, облыстардың, республикалық маңызы бар қалалардың, астананың жергілікті атқарушы органдарының стратегиялық жоспарларын оларды бекіткенге дейін қоршаған ортаны қорғау саласындағы уәкілетті органмен келісу қағидаларын бекіту туралы
