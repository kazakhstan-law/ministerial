  title:
    rus: О внесении изменений в приказ Министра охраны окружающей среды Республики Казахстан от 27 марта 2012 года № 78-п «Об утверждении Правил согласования планов и программ развития территорий, стратегических планов местных исполнительных органов областей, городов республиканского значения, столицы до их утверждения с уполномоченным органом в области охраны окружающей среды»
    kaz: «Аумақтарды дамыту жоспарлары мен бағдарламаларын, облыстардың, республикалық маңызы бар қалалардың, астананың жергілікті атқарушы органдарының стратегиялық жоспарларын оларды бекіткенге дейін қоршаған ортаны қорғау саласындағы уәкілетті органмен келісу туралы ережесін бекіту туралы» Қазақстан Республикасы Қоршаған ортаны қорғау министрінің 2012 жылғы 27 наурыздағы № 78-ө бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/102716/rus
