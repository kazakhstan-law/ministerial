title:
  rus: Об утверждении Правил разработки внутренних проектов по сокращению выбросов парниковых газов и перечня отраслей и секторов экономики, в которых они могут осуществляться
  kaz: Парниктік газдар шығарындыларын азайту жөніндегі ішкі жобаларды әзірлеу тәртібін және олардың жүзеге асырылуы мүмкін экономика салалары мен секторларының тізбесін бекіту туралы
