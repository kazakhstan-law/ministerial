requisite: Приказ Министра охраны окружающей среды Республики Казахстан от 12 января 2012 года № 6-Ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 февраля 2012 года № 7411. Утратил силу приказом Министра экологии, геологии и природных ресурсов Республики Казахстан от 14 сентября 2021 года № 378 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики по проведению газового мониторинга для каждой секции полигона твердых бытовых отходов
  kaz: Тұрмыстық қатты қалдықтар полигонының әрбір секциясы үшін газ мониторингін жүргізу жөніндегі әдістемені бекіту туралы
