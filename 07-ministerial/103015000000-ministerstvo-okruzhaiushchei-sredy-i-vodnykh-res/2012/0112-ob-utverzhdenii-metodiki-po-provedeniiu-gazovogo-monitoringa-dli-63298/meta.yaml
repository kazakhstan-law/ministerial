  title:
    rus: О внесении изменений в приказ Министра охраны окружающей среды Республики Казахстан от 12 января 2012 года № 6-ө "Об утверждении Методики по проведению газового мониторинга для каждой секции полигона твердых бытовых отходов"
    kaz: '"Қатты тұрмыстық қалдықтар полигонының әрбір секциясына арналған газ мониторингін жүргізу жөніндегі әдістемені бекіту туралы" Қазақстан Республикасы Қоршаған ортаны қорғау министрінің 2012 жылғы 12 қаңтардағы № 6-ө бұйрығына өзгеріс енгізу туралы'
