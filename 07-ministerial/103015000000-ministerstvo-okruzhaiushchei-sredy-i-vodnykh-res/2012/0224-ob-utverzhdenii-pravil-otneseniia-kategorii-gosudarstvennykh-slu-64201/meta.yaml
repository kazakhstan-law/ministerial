  requisite: Приказ Министра охраны окружающей среды Республики Казахстан от 11 октября 2012 года № 304-Ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 ноября 2012 года № 8079. Утратил силу приказом Министра экологии, геологии и природных ресурсов Республики Казахстан от 26 декабря 2022 года № 775 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: Об утверждении Перечня должностей должностных лиц, имеющих право на ношение форменной одежды (без погон), Правил ношения форменной одежды (без погон) должностными лицами, осуществляющими государственный экологический контроль, и Образцов форменной одежды (без погон) и внесении изменений в приказ Министра охраны окружающей среды Республики Казахстан от 24 февраля 2012 года № 41-Ө "Об утверждении Правил отнесения категории государственных служащих подразделений государственного экологического контроля уполномоченного органа в области охраны окружающей среды к должностным лицам, осуществляющий государственный экологический контроль"
    kaz: '"Нысанды киім (погонсыз) киіп жүру құқығы бар лауазымды адамдар лауазымдарының тiзбесiн, мемлекеттік экологиялық бақылауды жүзеге асыратын лауазымды адамдардың нысанды киім (погонсыз) киіп жүру қағидаларын және нысанды киім (погонсыз) үлгілерін бекіту туралы" және "Қоршаған ортаны қорғау саласындағы уәкілетті органның мемлекеттік экологиялық бақылау бөлімшелері мемлекеттік қызметшілерінің санаттарын мемлекеттік экологиялық бақылауды жүзеге асыратын лауазымды адамдарға жатқызу қағидаларын бекіту туралы" Қазақстан Республикасы Қоршаған ортаны қорғау министрінің 2012 жылғы 24 ақпандағы № 41-Ө бұйрығына өзгерістер енгізу туралы"'
  link: https://zan.gov.kz/client/#!/doc/68758/rus
