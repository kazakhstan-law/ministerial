  requisite: Приказ Министра окружающей среды и водных ресурсов Республики Казахстан от 16 января 2014 года № 7-Ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 февраля 2014 года № 9165. Утратил силу приказом Министра экологии, геологии и природных ресурсов Республики Казахстан от 10 марта 2022 года № 74 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в приказ Министра охраны окружающей среды Республики Казахстан от 24 февраля 2012 года № 41-П "Об утверждении Правил отнесения категорий государственных служащих подразделений государственного экологического контроля уполномоченного органа в области охраны окружающей среды к должностным лицам, осуществляющим государственный экологический контроль"
    kaz: '"Қоршаған ортаны қорғау саласындағы уәкілетті органның мемлекеттік экологиялық бақылау бөлімшелері мемлекеттік қызметшілерінің санаттарын мемлекеттік экологиялық бақылауды жүзеге асыратын лауазымды адамдарға жатқызу қағидаларын бекіту туралы" Қазақстан Республикасы Қоршаған ортаны қорғау министрінің 2012 жылғы 24 ақпандағы № 41-Ө бұйрығына өзгеріс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/77957/rus
