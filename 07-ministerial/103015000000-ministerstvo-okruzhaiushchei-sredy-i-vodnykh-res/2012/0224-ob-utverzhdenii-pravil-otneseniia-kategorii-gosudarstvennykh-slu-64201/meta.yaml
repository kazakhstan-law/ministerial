  title:
    rus: О внесении изменений в приказы Министра охраны окружающей среды Республики Казахстан и Министра энергетики Республики Казахстан
    kaz: Қазақстан Республикасы Қоршаған ортаны қорғау министрінің және Қазақстан Республикасы Энергетика министрінің бұйрықтарына өзгерістер енгізу туралы
