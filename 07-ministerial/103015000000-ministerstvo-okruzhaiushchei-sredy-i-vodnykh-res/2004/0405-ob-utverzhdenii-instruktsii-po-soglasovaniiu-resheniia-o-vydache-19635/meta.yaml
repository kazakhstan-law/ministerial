title:
  rus: Об утверждении Инструкции по согласованию решения о выдаче лицензий на отдельные виды лицензируемых работ и услуг, экспорт и импорт товаров (работ, услуг)
  kaz: Лицензияланатын жұмыстар мен қызмет көрсетулердің жекелеген түрлеріне, тауарлардың (жұмыстардың, қызмет көрсетулердің) экспорты және импортына лицензияларды беру туралы шешімді келісу жөніндегі нұсқаулықты бекіту туралы
