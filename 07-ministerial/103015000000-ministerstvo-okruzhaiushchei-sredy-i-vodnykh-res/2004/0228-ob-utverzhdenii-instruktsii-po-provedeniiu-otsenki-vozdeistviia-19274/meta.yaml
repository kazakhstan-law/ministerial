  title:
    rus: О внесении изменений в приказ Министра охраны окружающей среды Республики Казахстан от 28 февраля 2004 года № 68-п "Об утверждении Инструкции по проведению оценки воздействия намечаемой хозяйственной и иной деятельности на окружающую среду при разработке предплановой, предпроектной и проектной документации", зарегистрированный в Министерстве юстиции Республики Казахстан за № 2779
    kaz: Әділет министрлігінде № 2779 тіркелген "Жоспар алды, жоба алды және жобалау құжаттамасын әзірлеу кезінде қоршаған ортаға болжанды шаруашылық және өзге де қызметтің әсеріне бағалау жүргізу жөніндегі Нұсқаулықты бекіту туралы" Қазақстан Республикасы Қоршаған ортаны қорғау министрінің 2004 жылғы 28 ақпанындағы № 68-п бұйрығына өзгерістер енгізу туралы
