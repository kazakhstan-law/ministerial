  title:
    rus: О внесении изменений в приказ Министра охраны окружающей среды Республики Казахстан от 23 июля 2009 года № 143-Ө «О распределении объектов I категории, подлежащих государственной экологической экспертизе, и для выдачи разрешений на эмиссии в окружающую среду между уполномоченным органом в области охраны окружающей среды и его территориальными подразделениями»
    kaz: «Мемлекеттік экологиялық сараптамаға жататын және қоршаған ортаға эмиссияларға рұқсаттар беру үшін І санат объектілерін қоршаған ортаны қорғау саласындағы уәкілетті орган мен оның аумақтық бөлімшелері арасында бөлу туралы» Қазақстан Республикасы Қоршаған ортаны қорғау министрінің 2009 жылғы 23 шілдедегі № 143-Ө бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/130794/rus
