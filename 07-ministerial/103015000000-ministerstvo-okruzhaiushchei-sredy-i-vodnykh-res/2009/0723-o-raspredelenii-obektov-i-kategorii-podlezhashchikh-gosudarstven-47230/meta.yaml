act_code: '47230'
requisite: Приказ Министра охраны окружающей среды Республики Казахстан от 23 июля 2009 года № 143-Ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 августа 2009 года № 5741. Утратил силу приказом Министра экологии, геологии и природных ресурсов Республики Казахстан от 13 сентября 2021 года № 370 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О распределении объектов I категории, подлежащих государственной экологической экспертизе, и для выдачи разрешений на эмиссии в окружающую среду между уполномоченным органом в области охраны окружающей среды и его территориальными подразделениями
  kaz: Мемлекеттік экологиялық сараптамаға жататын және қоршаған ортаға эмиссияларға рұқсатттар беру үшін І санат объектілерін қоршаған ортаны қорғау саласындағы уәкілетті орган мен оның аумақтық бөлімшелері арасында бөлу туралы
