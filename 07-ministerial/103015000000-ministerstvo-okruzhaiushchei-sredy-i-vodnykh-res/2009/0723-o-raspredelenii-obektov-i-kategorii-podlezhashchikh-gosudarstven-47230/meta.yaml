  requisite: Приказ Министра охраны окружающей среды Республики Казахстан от 3 сентября 2013 года № 268-Ө. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 сентября 2013 года № 8729. Утратил силу приказом Министра экологии, геологии и природных ресурсов Республики Казахстан от 13 сентября 2021 года № 370 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказы Министра охраны окружающей среды Республики Казахстан от 28 июня 2007 года № 207-П "Об утверждении Правил проведения государственной экологической экспертизы" и от 23 июля 2009 года № 143-О "О распределении объектов I категории, подлежащих государственной экологической экспертизе, и для выдачи разрешений на эмиссии в окружающую среду между уполномоченным органом в области охраны окружающей среды и его территориальными подразделениями"
    kaz: Қазақстан Республикасы Қоршаған ортаны қорғау министрінің "Мемлекеттік экологиялық сараптамасын жүргізу ережелерін бекіту туралы" 2007 жылғы 28 маусымдағы № 207-Ө және "Мемлекеттік экологиялық сараптамаға жататын және қоршаған ортаға эмиссияға рұқсат беру үшін І санаттағы объектілерді қоршаған ортаны қорғау саласындағы уәкілетті орган мен оның аумақтық бөлімшелері арасында бөлу туралы" 2009 жылғы 23 шілдедегі № 143-Ө бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/74478/rus
