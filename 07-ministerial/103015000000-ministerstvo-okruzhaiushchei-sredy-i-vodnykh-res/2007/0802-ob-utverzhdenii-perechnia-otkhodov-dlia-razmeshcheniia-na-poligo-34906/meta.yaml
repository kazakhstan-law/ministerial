  title:
    rus: О внесении изменения в приказ Министра энергетики Республики Казахстан от 24 августа 2017 года № 296 «О внесении изменений в приказ исполняющего обязанности Министра охраны окружающей среды Республики Казахстан от 2 августа 2007 года № 244-п «Об утверждении перечней отходов для размещения на полигонах различных классов»
    kaz: «Әр түрлі сыныпты полигондарда орналастырылатын қалдықтар тізімдемесін бекіту туралы» Қазақстан Республикасы Қоршаған ортаны қорғау министрінің міндетін атқарушының 2007 жылғы 2 тамыздағы № 244-ө бұйрығына өзгерістер енгізу туралы» Қазақстан Республикасы Энергетика министрінің 2017 жылғы 24 тамыздағы № 296 бұйрығына өзгеріс енгізу туралы
