requisite: Приказ и.о. Министра охраны окружающей среды Республики Казахстан от 2 августа 2007 года N 244-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 августа 2007 года N 4897. Утратил силу приказом Министра экологии, геологии и природных ресурсов Республики Казахстан от 7 сентября 2021 года № 361 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
