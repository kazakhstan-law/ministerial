  title:
    rus: О внесении дополнения в приказ Министра охраны окружающей среды Республики Казахстан от 28 июня 2007 года № 204-п "Об утверждении Инструкции по проведению оценки воздействия намечаемой хозяйственной и иной деятельности на окружающую среду при разработке предплановой, плановой, предпроектной и проектной документации"
    kaz: '"Жоспарлау алдындағы, жоспарлау жобалау алдындағы және жобалау құжаттамасын әзірлеу кезінде көзделіп отырған шаруашылық және өзге де қызметтің қоршаған ортаға әсеріне бағалау жүргізу жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Қоршаған ортаны қорғау министрінің 2007 жылғы 28 маусымдағы N 204-ө бұйрығына толықтыру енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/44646/rus
