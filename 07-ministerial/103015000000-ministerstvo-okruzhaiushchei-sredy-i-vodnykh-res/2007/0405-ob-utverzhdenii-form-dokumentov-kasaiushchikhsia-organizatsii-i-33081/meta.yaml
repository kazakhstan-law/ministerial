  title:
    rus: О внесении изменений и дополнений в приказ Министра охраны окружающей среды Республики Казахстан от 5 апреля 2007 года № 100-п "Об утверждении форм документов, касающихся организации и проведения государственного экологического контроля"
    kaz: «Қоршаған ортаны қорғау саласындағы мемлекеттік бақылауды ұйымдастыруға және жүргізуге қатысты құжаттардың нысандарын бекіту туралы» Қазақстан Республикасы Қоршаған ортаны қорғау министрінің 2007 жылғы 5 сәуірдегі № 100-ө бұйрығына өзгертулер мен толықтырулар енгізу туралы
