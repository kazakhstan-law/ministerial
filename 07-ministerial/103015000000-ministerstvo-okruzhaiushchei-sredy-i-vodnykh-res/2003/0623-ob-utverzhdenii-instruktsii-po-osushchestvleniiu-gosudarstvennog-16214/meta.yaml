act_code: '16214'
requisite: Приказ Министра охраны окружающей среды Республики Казахстан от 24 июня 2003 года № 144-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 июля 2003 года № 2399. Утратил силу приказом Министра охраны окружающей среды Республики Казахстан от 13 октября 2006 года № 306-п
title:
  rus: Об утверждении Инструкции по осуществлению государственного контроля за охраной окружающей среды должностными лицами Центрального исполнительного органа Республики Казахстан в области охраны окружающей среды
  kaz: Қазақстан Республикасының қоршаған ортаны қорғау саласындағы Орталық атқарушы орган лауазымды тұлғаларының қоршаған ортаны қорғауда мемлекеттік бақылауды жүзеге асыруы жөніндегі нұсқаулықты бекіту туралы
