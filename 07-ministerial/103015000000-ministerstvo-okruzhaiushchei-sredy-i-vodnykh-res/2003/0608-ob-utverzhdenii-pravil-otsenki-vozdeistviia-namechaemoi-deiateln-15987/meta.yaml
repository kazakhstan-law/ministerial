requisite: Приказ Министра охраны окружающей среды Республики Казахстан от 9 июня 2003 года N 129-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 июня 2003 года N 2376. Утратил силу приказом Министра охраны окружающей среды Республики Казахстан от 24 января 2011 года № 18-ө
title:
  rus: Об утверждении Правил оценки воздействия намечаемой деятельности на окружающую среду при разработке государственных, отраслевых и региональных программ развития отраслей экономики, схем размещения производительных сил
  kaz: Экономика салаларын дамытудың, өндірістік күштерді орнықтыру сұлбаларының мемлекеттік, салалық және аймақтық бағдарламаларын әзірлеген кезде жосықталған әрекеттердің қоршаған ортаға әсер етуін бағалаудың Ережелерін бекіту жайында
