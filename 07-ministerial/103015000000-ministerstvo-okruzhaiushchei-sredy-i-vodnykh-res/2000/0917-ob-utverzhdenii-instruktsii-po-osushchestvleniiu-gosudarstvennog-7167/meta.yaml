act_code: '7167'
requisite: Приказ Министра природных ресурсов и охраны окружающей среды Республики Казахстан от 18 сентября 2000 года № 371-п. Зарегистрировано в Министерстве юстиции Республики Казахстан 17 октября 2000 года № 1267. Утратил силу приказом Министра охраны окружающей среды Республики Казахстан от 24 июня 2003 года № 144-п
title:
  rus: Об утверждении Инструкции по осуществлению государственного контроля за охраной окружающей среды должностными лицами Центрального исполнительного органа Республики Казахстан в области охраны окружающей среды
  kaz: '"Қазақстан Республикасының қоршаған ортаны қорғау саласындағы Орталық атқарушы органының лауазымды тұлғаларымен қоршаған ортаны қорғау жөніндегі мемлекеттік бақылауды жүзеге асырудың Нұсқауын бекіту туралы"'
