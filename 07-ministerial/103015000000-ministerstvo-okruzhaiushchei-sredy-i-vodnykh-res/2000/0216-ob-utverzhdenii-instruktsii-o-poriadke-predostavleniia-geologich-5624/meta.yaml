requisite: Приказ Министра природных ресурсов и охраны окружающей среды Республики Казахстан от 16 февраля 2000 года N 74-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 марта 2000 года за N 1087. Утратил силу приказом Заместителя Премьер-Министра Республики Казахстан - Министра индустрии и новых технологий Республики Казахстан от 18 апреля 2013 года № 126 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
