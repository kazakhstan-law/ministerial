act_code: '7195'
requisite: Приказ Министра природных ресурсов и охраны окружающей среды Республики Казахстан от 28 сентября 2000 года № 393-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 октября 2000 года № 1272. Утратил силу приказом Министра энергетики и минеральных ресурсов Республики Казахстан от 21 июля 2009 года № 205
title:
  rus: Об утверждении Инструкции по предоставлению недропользователями геологической информации по работам на Контрактных территориях
  kaz: Жер қойнауын пайдаланушылардың Келiсiм-шарттық аумақтардағы жұмыстар бойынша геологиялық ақпаратты беру Нұсқаулығын бекiту туралы
