caused_by:
  code: '25464'
  requisite: Приказ Председателя Комитета геологии и недропользования Министерства энергетики и минеральных ресурсов Республики Казахстан от 9 сентября 2005 года № 90-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 октября 2005 года № 3875. Утратил силу приказом Председателя Комитета геологии и недропользования Министерства энергетики и минеральных ресурсов Республики Казахстан от 1 июля 2009 № 53-п
  title:
    rus: О внесении изменений и дополнения в приказ и.о. Министра природных ресурсов и охраны окружающей среды Республики Казахстан от 28 сентября 2000 года № 393-п "Об утверждении Инструкции о порядке предоставления недропользователями в органы Министерства природных ресурсов и охраны окружающей среды геологической информации по работам на Контрактных территориях"
    kaz: '"Жер қойнауын пайдаланушылардың табиғи ресурстар және қоршаған ортаны қорғау Министрлiгiнiң органдарына Келiсiм-шарттық аумақтардағы жұмыстар бойынша геологиялық ақпарат беру тәртiбi туралы Нұсқаулықты бекiту туралы" Қазақстан Республикасының Табиғи ресурстар және қоршаған ортаны қорғау Министрiнiң мiндетiн орындаушының 2000 жылғы 28 қыркүйектегi № 393-б бұйрығына өзгерiстер мен қосымшалар енгiзу туралы'
  link: https://zan.gov.kz/client/#!/doc/25464/rus
