requisite: Приказ Министра связи и информации Республики Казахстан от 3 сентября 2010 года № 215. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 октября 2010 года № 6520. Утратил силу приказом Министра транспорта и коммуникаций Республики Казахстан от 17 августа 2012 года № 532
title:
  rus: Об утверждении форм ежемесячной информации об объемах производства (реализации), уровне доходности и отпускных ценах производимых (реализуемых) товаров (работ, услуг) субъектов регулируемых рынков в области телекоммуникаций и почтовой связи
  kaz: Телекоммуникация және почта байланысы саласындағы реттелетін нарық субъектілерінің өндіру (өткізу) көлемдері, табыстылық деңгейі және өндірілетін (өткізілетін) тауарлардың (жұмыстардың, көрсетілетін қызметтердің) босату бағалары туралы ай сайынғы ақпаратының нысандарын бекіту туралы
