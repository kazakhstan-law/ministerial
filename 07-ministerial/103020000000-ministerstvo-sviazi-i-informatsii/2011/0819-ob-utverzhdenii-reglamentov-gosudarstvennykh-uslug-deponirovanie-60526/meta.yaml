act_code: '60526'
requisite: Приказ Министра связи и информации Республики Казахстан от 19 августа 2011 года № 252. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 сентября 2011 года № 7187. Утратил силу приказом Министра транспорта и коммуникаций Республики Казахстан от 26 марта 2014 года № 209
title:
  rus: Об утверждении Регламентов государственных услуг "Депонирование информационных систем, программных продуктов, программных кодов и нормативно-технической документации" и "Регистрация электронных информационных ресурсов и информационных систем в государственном регистре электронных информационных ресурсов и информационных систем"
  kaz: '"Ақпараттық жүйелерді, бағдарламалық өнімдерді, бағдарламалық кодтар мен нормативтік-техникалық құжаттаманы депозитке салу" және "Электрондық ақпараттық ресурстар мен ақпараттық жүйелерді электрондық ақпараттық ресурстар мен ақпараттық жүйелердің мемлекеттік тіркелімінде тіркеу" мемлекеттік қызмет регламенттерін бекіту туралы'
