  requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 9 ноября 2012 года № 760. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 декабря 2012 года № 8166. Утратил силу приказом Министра транспорта и коммуникаций Республики Казахстан от 26 марта 2014 года № 209
  title:
    rus: О внесении изменений в приказ Министра связи и информации Республики Казахстан от 19 августа 2011 года № 252 "Об утверждении Регламентов государственных услуг "Депонирование информационных систем, программных продуктов, программных кодов и нормативно-технической документации в депозитарии" и "Регистрация электронных информационных ресурсов и информационных систем в государственном регистре электронных информационных ресурсов и информационных систем"
    kaz: '"Ақпараттық жүйелерді, бағдарламалық өнімдерді, бағдарламалық кодтар мен нормативтік-техникалық құжаттаманы депозитарийге депозитке салу" және "Электрондық ақпараттық ресурстар мен ақпараттық жүйелерді электрондық ақпараттық ресурстар мен ақпараттық жүйелердің мемлекеттік тіркелімінде тіркеу" мемлекеттік қызмет регламенттерін бекіту туралы" Қазақстан Республикасы Байланыс және ақпарат министрінің 2011 жылғы 19 тамыздағы № 252 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/69511/rus
