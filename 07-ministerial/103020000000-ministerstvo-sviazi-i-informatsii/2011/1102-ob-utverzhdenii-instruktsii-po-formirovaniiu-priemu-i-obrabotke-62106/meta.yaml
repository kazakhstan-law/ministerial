requisite: Приказ Министра связи и информации Республики Казахстан от 2 ноября 2011 года № 337. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 декабря 2011 года № 7331. Утратил силу приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 14 апреля 2016 года № 378
title:
  rus: Об утверждении инструкции по формированию, приему и обработке электронных обращений физических и юридических лиц, отправленных с использованием веб-портала "электронного правительства" в единую систему электронного документооборота государственных органов
  kaz: '"Мемлекеттік органдардың электрондық құжат айналымы бірыңғай жүйесіне "электрондық үкімет" веб-порталын пайдаланумен жолданған жеке және заңды тұлғалардың электрондық өтініштерін қалыптастыру, қабылдау және өңдеу" жөніндегі нұсқаулықты бекіту туралы'
