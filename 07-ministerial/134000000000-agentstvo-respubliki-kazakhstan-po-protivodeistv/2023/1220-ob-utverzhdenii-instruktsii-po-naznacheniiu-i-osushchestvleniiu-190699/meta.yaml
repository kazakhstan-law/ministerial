act_code: '190699'
requisite: Приказ Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 20 декабря 2023 года № 416. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 декабря 2023 года № 33800. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 3 августа 2026 года № 77/қе (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по назначению и осуществлению пенсионных выплат за выслугу лет сотрудникам, проходившим службу в антикоррупционной службе
  kaz: Сыбайлас жемқорлыққа қарсы қызметте қызмет өткерген қызметкерлерге еңбек сіңірген жылдары үшін зейнетақы төлемдерін тағайындау және жүзеге асыру жөніндегі нұсқаулықты бекіту туралы
