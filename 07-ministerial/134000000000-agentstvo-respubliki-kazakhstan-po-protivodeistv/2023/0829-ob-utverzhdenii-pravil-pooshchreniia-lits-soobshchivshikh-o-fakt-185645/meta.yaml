  kaz: Сыбайлас жемқорлық құқық бұзушылық фактісі туралы хабарлаған немесе сыбайлас жемқорлыққа қарсы іс-қимылға өзгеше түрде жәрдем көрсететін (көрсеткен) адамдарды көтермелеу қағидаларын бекіту туралы
