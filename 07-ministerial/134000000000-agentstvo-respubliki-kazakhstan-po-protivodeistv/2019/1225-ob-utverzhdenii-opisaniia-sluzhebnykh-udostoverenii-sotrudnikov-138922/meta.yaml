act_code: '138922'
requisite: Приказ и.о. Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 25 декабря 2019 года № 22қбпү. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 января 2020 года № 19842. Утратил силу приказом Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 15 июля 2022 года № 22 қбп
title:
  rus: Об утверждении Описания служебных удостоверений сотрудников и административных государственных служащих Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) и его территориальных органов, а также Правил их выдачи
  kaz: Қазақстан Республикасы Сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінің (Сыбайлас жемқорлыққа қарсы қызмет) және оның аумақтық органдарының қызметкерлері мен мемлекеттік әкімшілік қызметшілерінің қызметтік куәліктерінің сипаттамасын, сондай-ақ Оларды беру қағидаларын бекіту туралы
