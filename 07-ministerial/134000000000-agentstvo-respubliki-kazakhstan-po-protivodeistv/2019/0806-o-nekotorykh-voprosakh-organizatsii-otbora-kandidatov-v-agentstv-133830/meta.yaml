  kaz: Қазақстан Республикасы Сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінің (Сыбайлас жемқорлыққа қарсы қызмет) және оның аумақтық органдарына үміткерлерді іріктеуді ұйымдастырудың кейбір мәселелері туралы
