  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 6 августа 2019 года № 184 «О некоторых вопросах организации отбора кандидатов в Агентство Республики Казахстан по противодействию коррупции (Антикоррупционную службу) и его территориальные органы» и признании утратившими силу его структурных элементов
    kaz: «Қазақстан Республикасы Сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінің (Сыбайлас жемқорлыққа қарсы қызмет) және оның аумақтық органдарына үміткерлерді іріктеуді ұйымдастырудың кейбір мәселелері туралы» Қазақстан Республикасы Сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі (Сыбайлас жемқорлыққа қарсы қызмет) Төрағасының 2019 жылғы 6 тамыздағы № 184 бұйрығына өзгерістер енгізу және оның құрылымдық элементтерінің күші жойылды деп тану туралы
