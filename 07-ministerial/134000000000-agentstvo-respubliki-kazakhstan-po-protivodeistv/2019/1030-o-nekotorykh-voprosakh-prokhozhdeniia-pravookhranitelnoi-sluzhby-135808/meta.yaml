  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 30 октября 2019 года № 272 «О некоторых вопросах прохождения правоохранительной службы в Агентстве Республики Казахстан по противодействию коррупции (Антикоррупционной службе)» и признании утратившими силу его структурных элементов
    kaz: «Қазақстан Республикасының Сыбайлас жемқорлыққа қарсы іс-қимыл агенттігінде (Сыбайлас жемқорлыққа қарсы қызмет) құқық қорғау қызметін өткерудің кейбір мәселелері туралы» Қазақстан Республикасы Сыбайлас жемқорлыққа қарсы іс-қимыл агенттігі (Сыбайлас жемқорлыққа қарсы қызмет) Төрағасының 2019 жылғы 30 қазандағы № 272 бұйрығына өзгерістер мен толықтырулар енгізу және оның құрылымдық элементтерінің күші жойылды деп тану туралы
