act_code: '135808'
requisite: Приказ Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 30 октября 2019 года № 272. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 ноября 2019 года № 19551. Утратил силу приказом Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 27 мая 2025 года № 99 (вводится в действие после дня его первого официального опубликования)
title:
