  title:
    rus: О внесении изменений и дополнения в приказ Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 9 июля 2020 года № 212 «Об утверждении Инструкции по назначению и осуществлению пенсионных выплат за выслугу лет сотрудникам, проходившим службу в антикоррупционной службе»
