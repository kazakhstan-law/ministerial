requisite: Приказ Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 9 июля 2020 года № 212. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 июля 2020 года № 20974. Утратил силу приказом Председателя Агентства Республики Казахстан по противодействию коррупции (Антикоррупционной службы) от 20 декабря 2023 года № 416 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
