  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 27 мая 2022 года № 293 «Об утверждении Правил и условий заключения, а также оснований для изменения и расторжения соглашения о промышленной сборке сельскохозяйственной техники с юридическими лицами Республики Казахстан и его типовой формы» и в приказ исполняющего обязанности Министра промышленности и строительства Республики Казахстан от 16 февраля 2024 года № 62 «Об утверждении Правил формирования перечня приоритетных сельскохозяйственных машин и оборудования»
    kaz: «Қазақстан Республикасының заңды тұлғаларымен ауыл шаруашылығы техникасын өнеркәсіптік құрастыру туралы келісімді жасасу қағидалары мен шарттарын, сондай-ақ оны өзгерту және бұзу үшін негіздер мен оның үлгілік нысанын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2022 жылғы 27 мамырдағы № 293 бұйрығына және «Басымды ауыл шаруашылығы машиналары мен жабдықтарының тізбесін қалыптастыру қағидаларын бекіту туралы» Қазақстан Республикасы Өнеркәсіп және құрылыс министрінің міндетін атқарушының 2024 жылғы 16 ақпандағы № 62 бұйрығына өзгерістер енгізу туралы
