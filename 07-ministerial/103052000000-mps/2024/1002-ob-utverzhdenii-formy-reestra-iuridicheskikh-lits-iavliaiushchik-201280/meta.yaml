requisite: Приказ Министра промышленности и строительства Республики Казахстан от 2 октября 2024 года № 345. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 октября 2024 года № 35203
title:
  rus: Об утверждении формы реестра юридических лиц, являющихся производителями бытовых приборов и (или) приборов бытовой электроники, а также их компонентов, уполномоченными представителями производителя, иными лицами, реализующими бытовые приборы и (или) приборы бытовой электроники, а также их компоненты
  kaz: Тұрмыстық аспаптарды және (немесе) тұрмыстық электроника аспаптарын, сондай-ақ олардың құрамдастарын өндірушілер болып табылатын заңды тұлғалар, өндірушінің уәкілетті өкілдері, тұрмыстық аспаптарды және (немесе) тұрмыстық электроника аспаптарын, сондай-ақ олардың құрамдастарын өткізетін өзге де тұлғалар тізілімінің нысанын бекіту туралы
