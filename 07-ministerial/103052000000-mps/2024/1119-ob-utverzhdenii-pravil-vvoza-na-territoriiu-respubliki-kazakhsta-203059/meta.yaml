act_code: '203059'
requisite: Приказ и.о. Министра промышленности и строительства Республики Казахстан от 19 ноября 2024 года № 401. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 ноября 2024 года № 35394
title:
  rus: Об утверждении правил ввоза на территорию Республики Казахстан из стран, не входящих в Евразийский экономический союз, и вывоза с территории Республики Казахстан в эти страны драгоценных камней, ювелирных и других изделий, ввоза на территорию Республики Казахстан и вывоза с территории Республики Казахстан необработанных природных алмазов с учетом схемы сертификации Кимберлийского процесса
  kaz: Асыл тастарды, зергерлік және басқа да бұйымдарды Еуразиялық экономикалық одаққа кірмейтін елдерден Қазақстан Республикасының аумағына әкелу және Қазақстан Республикасының аумағынан осы елдерге әкету, Кимберлий процесінің сертификаттау схемасын ескере отырып, өңделмеген табиғи алмасты Қазақстан Республикасының аумағына әкелу және Қазақстан Республикасының аумағынан әкету қағидаларын бекіту туралы
