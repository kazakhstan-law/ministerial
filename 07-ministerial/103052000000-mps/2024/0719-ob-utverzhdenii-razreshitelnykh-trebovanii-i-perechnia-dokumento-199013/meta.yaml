title:
  rus: Об утверждении разрешительных требований и перечня документов, подтверждающих соответствие им при выдаче разрешений второй категории для осуществления деятельности по сбору (заготовке), хранению, переработке и реализации лома и отходов цветных и чёрных металлов
  kaz: Түсті және қара металдардың сынықтары мен қалдықтарын жинау (дайындау), сақтау, қайта өңдеу және өткізу жөніндегі қызметті жүзеге асыру үшін екінші санаттағы рұқсаттарды беру кезінде оларға сәйкестікті растайтын рұқсат беру талаптары мен құжаттар тізбесін бекіту туралы
