requisite: Приказ Министра промышленности и строительства Республики Казахстан от 23 апреля 2024 года № 149. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 апреля 2024 года № 34302. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 14 октября 2025 года № 434 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
