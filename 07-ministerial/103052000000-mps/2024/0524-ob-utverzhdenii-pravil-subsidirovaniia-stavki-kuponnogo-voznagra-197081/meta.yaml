title:
  rus: Об утверждении Правил субсидирования ставки купонного вознаграждения по облигациям, выпущенным эмитентом для дальнейшей выдачи ипотечных жилищных займов в целях улучшения жилищных условий в соответствии с законодательством Республики Казахстан
  kaz: «Қазақстан Республикасының заңнамасына сәйкес тұрғын үй жағдайларын жақсарту мақсатында ипотекалық тұрғын үй қарыздарын одан әрі беру үшін эмитент шығарған облигациялар бойынша купондық сыйақы мөлшерлемесін субсидиялау қағидаларын бекіту туралы
