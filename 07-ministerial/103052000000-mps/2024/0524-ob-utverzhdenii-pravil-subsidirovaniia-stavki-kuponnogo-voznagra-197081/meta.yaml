  title:
    rus: О внесении изменений и дополнения в приказ Министра промышленности и строительства Республики Казахстан от 24 мая 2024 года № 190 «Об утверждении Правил субсидирования ставки купонного вознаграждения по облигациям, выпущенным эмитентом для дальнейшей выдачи ипотечных жилищных займов в целях улучшения жилищных условий в соответствии с законодательством Республики Казахстан»
    kaz: «Қазақстан Республикасының заңнамасына сәйкес тұрғын үй жағдайларын жақсарту мақсатында ипотекалық тұрғын үй қарыздарын одан әрі беру үшін эмитент шығарған облигациялар бойынша купондық сыйақы мөлшерлемесін субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Өнеркәсіп және құрылыс министрінің 2024 жылғы 24 мамырдағы № 190 бұйрығына өзгерістер мен толықтыру енгізу туралы
