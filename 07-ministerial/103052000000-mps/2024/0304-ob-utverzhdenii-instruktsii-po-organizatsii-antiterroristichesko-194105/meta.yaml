  title:
    rus: О внесении изменения в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 12 мая 2023 года № 350 «Об утверждении инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, осуществляющих деятельность в сфере металлургической промышленности, относящиеся к системообразующим» и приказ исполняющего обязанности Министра промышленности и строительства Республики Казахстан от 4 марта 2024 года № 88 «Об утверждении Инструкции по организации антитеррористической защиты объектов химической промышленности, уязвимых в террористическом отношении»
    kaz: «Жүйе құраушыларға жататын металлургия өнеркәсібі саласындағы қызметті жүзеге асыратын террористік тұрғыдан осал объектілерді терроризмге қарсы қорғауды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2023 жылғы 12 мамырдағы № 350 бұйрығы және «Террористік тұрғыдан осал химия өнеркәсібі объектілерін терроризмге қарсы қорғауды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Өнеркәсіп және құрылыс министрінің міндетін атқарушының 2024 жылғы 4 наурыздағы № 88 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/200211/rus
