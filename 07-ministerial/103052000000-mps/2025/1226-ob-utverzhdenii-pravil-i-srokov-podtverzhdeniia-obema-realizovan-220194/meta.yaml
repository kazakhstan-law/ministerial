title:
  rus: Об утверждении Правил и сроков подтверждения объема, реализованных минерального сырья и твердого полезного ископаемого, в том числе прошедших переработку, а также содержания твердых полезных ископаемых в реализуемом минеральном сырье
  kaz: Өткізілген минералдық шикізат пен пайдалы қатты қазбаның, оның ішінде қайта өңдеуден өткендердің көлемін, сондай-ақ өткізілетін минералдық шикізаттағы пайдалы қатты қазбалардың құрамын растау қағидалары  мен мерзімдерін бекіту туралы
