title:
  rus: Об утверждении Правил ведения реестра многоквартирных жилых домов по формам управления объектом кондоминиума и субъектам управления объектом кондоминиума и реестра субъектов управления объектом кондоминиума и управляющих многоквартирными жилыми домами
  kaz: Кондоминиум объектісін басқару нысандары мен кондоминиум объектісін басқару субъектілері бойынша көппәтерлі тұрғын үйлер тізілімін және кондоминиум объектісін басқару субъектілері мен көппәтерлі тұрғын үйлерді басқарушылар тізілімін жүргізу қағидаларын бекіту туралы
