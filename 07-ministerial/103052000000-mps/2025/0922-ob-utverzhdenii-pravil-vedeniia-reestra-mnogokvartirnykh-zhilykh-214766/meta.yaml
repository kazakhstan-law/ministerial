  title:
    rus: О внесении изменений в приказ Министра промышленности и строительства Республики Казахстан от 22 сентября 2025 года № 383 «Об утверждении Правил ведения реестра многоквартирных жилых домов по формам управления объектом кондоминиума и субъектам управления объектом кондоминиума и реестра субъектов управления объектом кондоминиума и управляющих многоквартирными жилыми домами»
    kaz: «Кондоминиум объектісін басқару нысандары мен кондоминиум объектісін басқару субъектілері бойынша көппәтерлі тұрғын үйлер тізілімін және кондоминиум объектісін басқару субъектілері мен көппәтерлі тұрғын үйлерді басқарушылар тізілімін жүргізу қағидаларынна бекіту туралы» Қазақстан Республикасы Өнеркәсіп және құрылыс министрінің 2025 жылғы 22 қыркүйектегі № 383 бұйрығына өзгерістер енгізу туралы
