  title:
    rus: О внесении изменений в приказ Министра промышленности и строительства Республики Казахстан от 12 августа 2025 года № 297 «Об утверждении Правил планирования, отбора, согласования проектов, мониторинга процесса проектирования, строительства и (или) эксплуатации в сфере жилищных отношений и жилищно-коммунального хозяйства в рамках национального проекта по модернизации энергетического и коммунального секторов»
    kaz: «Энергетикалық және коммуналдық секторларды жаңғырту жөніндегі ұлттық жоба шеңберінде тұрғын үй қатынастары мен тұрғын үй-коммуналдық шаруашылық саласындағы жобаларды жоспарлау, іріктеу, келісу, жобалау, салу және (немесе) пайдалану процесін мониторингтеу қағидаларын бекіту туралы» Қазақстан Республикасы Өнеркәсіп және құрылыс министрінің 2025 жылғы 12 тамыздағы № 297 бұйрығына өзгерістер енгізу туралы
