act_code: '215613'
requisite: Приказ Министра промышленности и строительства Республики Казахстан от 14 октября 2025 года № 434. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 октября 2025 года № 37131
title:
  rus: Об утверждении Правил и условий выдачи заключения о предоставлении организациям полномочий или об отказе в предоставлении полномочий по оформлению паспортов транспортных средств (паспортов шасси транспортных средств) и паспортов самоходных машин и других видов техники, в том числе оформлению электронных паспортов транспортных средств (паспортов шасси транспортных средств) и электронных паспортов самоходных машин и других видов техники, и Правил ведения электронных паспортов транспортных средств (паспортов шасси транспортных средств) и электронных паспортов самоходных машин и других видов техники
  kaz: Көлік құралдарының паспорттарын (көлік құралдары шассилерінің паспорттарын) және өздігінен жүретін машиналар мен басқа да техника түрлерінің паспорттарын ресімдеу, оның ішінде көлік құралдарының электрондық паспорттарын (көлік құралдары шассилерінің паспорттарын) және өздігінен жүретін машиналар мен басқа да техника түрлерінің электрондық паспорттарын ресімдеу жөніндегі өкілеттіктерді ұйымдарға беру туралы немесе өкілеттіктерді беруден бас тарту туралы қорытынды беру қағидалары мен шарттарын және Көлік құралдарының электрондық паспорттарын (көлік құралдары шассилерінің паспорттарын) және өздігінен жүретін машиналар мен басқа да техника түрлерінің электрондық паспорттарын жүргізу қағидаларын бекіту туралы
