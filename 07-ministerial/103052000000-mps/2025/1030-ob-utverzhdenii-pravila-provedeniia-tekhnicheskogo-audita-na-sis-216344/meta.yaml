  title:
    rus: О внесении изменений и дополнения в приказ Министра промышленности и строительства Республики Казахстан от 30 октября 2025 года № 467 «Об утверждении Правила проведения технического аудита на системах водоснабжения и водоотведения населенных пунктов»
    kaz: Қазақстан Республикасы Өнеркәсіп және құрылыс министрінің «Елді мекендердің сумен жабдықтау және су бұру жүйелерінде техникалық аудит жүргізу қағидаларын бекіту туралы» бұйрығына өзгерістер мен толықтыру енгізу туралы» 2025 жылғы 10 қазандағы № 476 бұйрығына өзгерістер мен толықтыру енгізу туралы
