act_code: '216334'
requisite: Приказ Министра промышленности и строительства Республики Казахстан от 29 октября 2025 года № 459. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 октября 2025 года № 37302
title:
  rus: Об утверждении методики расчета стоимости и объемов предоставляемых услуг по отведению и очистке дождевых, талых, инфильтрационных, поливомоечных, дренажных вод, стекающих с территорий населенных пунктов и промышленных предприятий посредством системы ливневой (дренажной) канализации
  kaz: Елді мекендер мен өнеркәсіптік кәсіпорындардың аумақтарынан ағатын жаңбыр суын, еріген, инфильтрациялық, суару-жуу, дренаждық суларды нөсерлік (дренаждық) кәріз жүйесі арқылы бұру және тазарту бойынша көрсетілетін қызметтердің құны мен көлемін есептеу әдістемесін бекіту туралы
