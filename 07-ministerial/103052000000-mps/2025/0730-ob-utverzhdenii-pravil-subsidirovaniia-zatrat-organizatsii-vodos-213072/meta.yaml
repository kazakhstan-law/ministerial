  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра промышленности и строительства Республики Казахстан от 30 июля 2025 года № 287 «Об утверждении Правил субсидирования затрат организаций водоснабжения и водоотведения на погашение и обслуживание займов международных финансовых организаций, привлеченных для реализации проектов по расширению, модернизации, реконструкции, обновлению, поддержанию существующих активов и созданию новых активов в населенных пунктах»
    kaz: «Сумен жабдықтау және су бұру ұйымдарының елді мекендерде бар активтерді кеңейту, жаңғырту, реконструкциялау, жаңарту, ұстап тұру және жаңа активтер құру жөніндегі жобаларды іске асыру үшін тартылған халықаралық қаржы ұйымдарының қарыздарын өтеуге және оларға қызмет көрсетуге арналған шығындарын субсидиялау Қағидаларын бекіту туралы» Қазақстан Республикасы Өнеркәсіп және құрылыс министрінің міндетін атқарушының 2025 жылғы 30 шілдедегі № 287 бұйрығына өзгерістер енгізу туралы
