    kaz: «Энергетикалық және коммуналдық секторларды жаңғырту жөніндегі ұлттық жобаны іске асыру шеңберінде жұмыстар мен көрсетілетін қызметтерді сатып алуды жүзеге асыру, жобалар мен өнім берушілерді іріктеу, шарттар жасасу қағидаларын бекіту туралы» Қазақстан Республикасы Өнеркәсіп және құрылыс министрінің 2025 жылғы 19 қыркүйектегі №374 бұйрығына өзгерістер енгізу туралы
