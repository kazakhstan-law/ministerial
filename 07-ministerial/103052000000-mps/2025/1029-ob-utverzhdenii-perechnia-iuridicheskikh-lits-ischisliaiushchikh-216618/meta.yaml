requisite: Приказ Министра промышленности и строительства Республики Казахстан от 29 октября 2025 года № 456
title:
  rus: Об утверждении перечня юридических лиц, исчисляющих налог по ставкам физических лиц, по объектам налогообложения, предоставленным в рамках реализации государственных и (или) правительственных программ жилищного строительства по договорам долгосрочной аренды жилища физическому лицу, являющемуся участником такой программы
  kaz: Салықты мемлекеттік және (немесе) үкіметтік тұрғын үй құрылысы бағдарламаларын іске асыру шеңберінде осындай бағдарламаға қатысушы болып табылатын жеке тұлғаға тұрғынжайды ұзақ мерзімді жалдау шарттары бойынша берілген салық салу объектілері бойынша жеке тұлғалардың мөлшерлемелері бойынша есептейтін заңды тұлғалардың тізбесін бекіту туралы
