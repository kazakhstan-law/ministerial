title:
  rus: О признании утратившим силу приказа Министра индустрии и инфраструктурного развития Республики Казахстан от 30 марта 2021 года № 143 «Об установлении цен на товары (работы, услуги), производимые и (или) реализуемые субъектом государственной монополии»
  kaz: «Мемлекеттік монополия субъектісі өндіретін және (немесе) өткізетін тауарларға (жұмыстарға, көрсетілетін қызметтерге) баға белгілеу туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2021 жылғы 30 наурыздағы № 143 бұйрығының күшін жою туралы
