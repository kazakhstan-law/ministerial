act_code: '225348'
requisite: Приказ Министра промышленности и строительства Республики Казахстан от 15 мая 2026 года № 240. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 мая 2026 года № 38739
title:
  rus: Об утверждении Правил проведения комплексной вневедомственной экспертизы проектов строительства, предназначенных для строительства новых, а также изменения (реконструкции, расширения, технического перевооружения, модернизации и капитального ремонта) существующих зданий и сооружений, их комплексов, инженерных и транспортных коммуникаций
  kaz: Жаңа ғимараттар мен құрылысжайларды, олардың кешендерін, инженерлік және көлік коммуникацияларын салуға, сондай-ақ бұрыннан барын өзгертуге (реконструкциялауға, кеңейтуге, техникалық қайта жарақтандыруға, жаңғыртуға және күрделі жөндеуге) арналған жобаларға ведомстводан тыс кешенді сараптама жүргізу қағидаларын бекіту туралы
