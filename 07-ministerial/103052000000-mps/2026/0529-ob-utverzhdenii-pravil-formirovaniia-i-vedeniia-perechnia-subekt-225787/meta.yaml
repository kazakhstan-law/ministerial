title:
  rus: Об утверждении Правил формирования и ведения перечня субъектов предпринимательства, осуществляющих производство (изготовление) и поставку строительных материалов, изделий, конструкций, оборудования для мониторинга цен в строительстве
  kaz: Құрылыстағы баға мониторингі үшін құрылыс материалдарын, бұйымдарын, конструкцияларын, жабдықтарын өндіруді (дайындауды) және жеткізуді жүзеге  асыратын кәсіпкерлік субъектілерінің тізбесін қалыптастыру және жүргізу қағидаларын бекіту туралы
