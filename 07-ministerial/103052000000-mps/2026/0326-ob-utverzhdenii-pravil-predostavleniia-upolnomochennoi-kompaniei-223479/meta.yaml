title:
  rus: Об утверждении Правил предоставления уполномоченной компанией временного жилья и (или) компенсационных выплат собственникам объекта реновации и (или) недвижимого имущества входящего в объект реновации
  kaz: Уәкілетті компанияның реновациялау объектісінің және (немесе) реновациялау объектісіне кіретін жылжымайтын мүліктің меншік иелеріне уақытша тұрғын үй және (немесе) өтемақы төлемдерін беру қағидаларын бекіту туралы
