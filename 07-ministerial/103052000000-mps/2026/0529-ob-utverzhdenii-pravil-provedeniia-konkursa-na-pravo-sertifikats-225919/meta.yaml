title:
  rus: Об утверждении Правил проведения конкурса на право сертификации и типовой формы договора на право сертификации специалистов (экспертов) в сфере архитектурной, градостроительной и строительной деятельности, а также квалификационных требований к участникам конкурса
  kaz: Сертификаттау құқығына конкурс өткізу қағидаларын және сәулет, қала құрылысы және құрылыс қызметі саласындағы мамандарды (сарапшыларды) сертификаттау құқығына арналған шарттың үлгілік нысанын, сондай-ақ  конкурсқа қатысушыларға қойылатын біліктілік талаптарын бекіту туралы
