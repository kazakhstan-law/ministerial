title:
  rus: Об утверждении Правил регистрации в автоматизированной цифровой системе государственного градостроительного кадастра градостроительных проектов, предпроектной и проектно-сметной документации, а также объектов архитектурной, градостроительной и строительной деятельности
  kaz: Мемлекеттік қала құрылысы кадастрының автоматтандырылған цифрлық жүйесінде қала құрылысы жобаларын, жобалау алдындағы және жобалау-сметалық құжаттаманы, сондай-ақ сәулет, қала құрылысы және құрылыс қызметі объектілерін тіркеу қағидаларын бекіту туралы
