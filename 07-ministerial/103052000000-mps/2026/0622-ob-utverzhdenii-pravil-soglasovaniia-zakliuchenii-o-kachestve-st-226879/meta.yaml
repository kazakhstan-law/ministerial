title:
  rus: Об утверждении Правил согласования заключений о качестве строительно-монтажных работ местным исполнительным органом столицы, области, городов республиканского значения осуществляющим государственный архитектурно-строительный контроль и надзор
  kaz: Құрылыс-монтаждау жұмыстарының сапасы туралы қорытындыны мемлекеттік сәулет-құрылыс бақылауы мен қадағалауын жүзеге асыратын астананың, облыстың, республикалық маңызы бар қалалардың жергілікті атқарушы органымен келісу қағидаларын бекіту туралы
