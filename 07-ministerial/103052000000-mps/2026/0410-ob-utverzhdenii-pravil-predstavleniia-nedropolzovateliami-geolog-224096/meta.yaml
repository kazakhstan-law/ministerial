title:
  rus: «Об утверждении Правил представления недропользователями геологического отчета при проведении разведки и добычи углеводородов и (или) отчета о результатах геологоразведочных работ на участке недр, расположенном в пределах малоизученных территорий»
  kaz: «Жер қойнауын пайдаланушылардың көмірсутектерді барлау мен өндіруді жүргізу кезінде геологиялық есепті және (немесе) аз зерттелген аумақтар шегінде орналасқан жер қойнауы учаскесіндегі геологиялық барлау жұмыстарының нәтижелері туралы есепті ұсыну қағидаларын бекіту туралы»
