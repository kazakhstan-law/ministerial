act_code: '225039'
requisite: Приказ Министра промышленности и строительства Республики Казахстан от 5 мая 2026 года № 227. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 мая 2026 года № 38682
title:
  rus: Об утверждении Правил предоставления права недропользования на проведение разведки или добычи общераспространенных полезных ископаемых, используемых для целей строительства (реконструкции) и ремонта автомобильных дорог общего пользования, железных дорог, находящихся в государственной собственности, а также для реконструкции и ремонта гидросооружений и гидротехнических сооружений
  kaz: Мемлекеттік меншіктегі жалпыға ортақ пайдаланылатын автомобиль жолдарын, теміржолдарды салу (реконструкциялау) және жөндеу мақсаттары үшін, сондай-ақ гидроқұрылысжайларды және гидротехникалық құрылысжайларды реконструкциялау және жөндеу үшін пайдаланылатын кең таралған пайдалы қазбаларды барлауды немесе өндіруді жүргізуге жер қойнауын пайдалану құқығын беру қағидаларын бекіту туралы
