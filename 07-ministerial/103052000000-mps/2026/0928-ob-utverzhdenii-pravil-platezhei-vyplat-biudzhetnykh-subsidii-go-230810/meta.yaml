act_code: '230810'
requisite: Приказ и.о. Министра промышленности и строительства Республики Казахстан от 28 сентября 2026 года № 485
title:
  rus: Об утверждении Правил платежей (выплат) бюджетных субсидий государственному предприятию на праве хозяйственного ведения в сфере водоснабжения, осуществляющему организацию строительства и эксплуатацию водохозяйственных сооружений столицы на погашение и обслуживание негосударственного займа, привлеченного под государственную гарантию
  kaz: Мемлекеттік кепілдікпен тартылған мемлекеттік емес қарызды өтеуге және оған қызмет көрсету үшін астананың су шаруашылығы құрылыстарын салу мен пайдалануды ұйымдастыруды жүзеге асыратын шаруашылық жүргізу құқығындағы сумен жабдықтау саласындағы мемлекеттік кәсіпорынға бюджеттік субсидиялардың төлемдері (төлемақылары) қағидаларын бекіту туралы
