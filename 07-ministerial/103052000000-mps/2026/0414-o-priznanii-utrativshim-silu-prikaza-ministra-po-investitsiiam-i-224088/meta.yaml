title:
  rus: О признании утратившим силу приказа Министра по инвестициям и развитию Республики Казахстан от 29 мая 2018 года № 402 «Об утверждении норм времени и расценок на проведение работ по государственному геологическому изучению недр»
  kaz: «Жер қойнауын мемлекеттік геологиялық зерттеу жөніндегі жұмыстарды жүргізуге арналған уақыт және баға нормаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2018 жылғы 29 мамырдағы №402 бұйрығының күшін жою туралы
