  title:
    rus: О внесении изменений и дополнений в приказ Министра промышленности и строительства Республики Казахстан от 3 октября 2023 года № 18 «Об утверждении Положения республиканского государственного учреждения «Комитет геологии Министерства промышленности и строительства Республики Казахстан»
    kaz: «Қазақстан Республикасы Өнеркәсіп және құрылыс министрлігінің Геология комитеті» республикалық мемлекеттік мекемесінің ережесін бекіту туралы» Қазақстан Республикасы Өнеркәсіп және құрылыс министрінің 2023 жылғы 3 қазандағы №18 бұйрығына өзгерістер мен толықтырулар енгізу туралы
