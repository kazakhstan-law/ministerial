  title:
    rus: О внесении изменения и дополнения в приказ министра промышленности и строительства Республики Казахстан от 27 декабря 2023 года № 168 «Об утверждении Правил постановки на учет граждан Республики Казахстан, нуждающихся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде»
    kaz: «Мемлекеттік тұрғын үй қорынан тұрғын үй немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үй беру және пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Өнеркәсіп және құрылыс министрінің 2023 жылғы 27 желтоқсандағы № 168 бұйрығына өзгеріс пен толықтыру енгізу туралы
