requisite: Приказ Министра промышленности и строительства Республики Казахстан от 12 декабря 2023 года № 122. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 27 июля 2026 года № 377 (вводится в действие со дня его подписания)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства промышленности и строительства Республики Казахстан, его ведомств и их территориальных подразделений
  kaz: Қазақстан Республикасы Өнеркәсіп және құрылыс министрлігінің, оның ведомстволары мен олардың аумақтық бөлімшелерінің «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы
