  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности министра промышленности и строительства Республики Казахстан от 5 декабря 2023 года № 106 «Об утверждении Правил предоставления и пользования жилищем из государственного жилищного фонда или жилищем, арендованным местным исполнительным органом в частном жилищном фонде»
    kaz: «Мемлекеттік тұрғын үй қорынан тұрғын үй немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үй беру және пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Өнеркәсіп және құрылыс министрінің міндетін атқарушының 2023 жылғы 5 желтоқсандағы № 106 бұйрығына өзгерістер мен толықтырулар енгізу туралы
