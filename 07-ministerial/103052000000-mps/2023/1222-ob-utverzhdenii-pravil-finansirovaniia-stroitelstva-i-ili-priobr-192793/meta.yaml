title:
  rus: Об утверждении Правил финансирования строительства и (или) приобретения жилья за счет республиканского бюджета и (или) выпуска государственных ценных бумаг, мониторинга и реализации жилья гражданам Республики Казахстан, нуждающихся в жилище
  kaz: Республикалық бюджет есебінен тұрғын үй салуды және (немесе) сатып алуды қаржыландыру және (немесе) мемлекеттік бағалы қағаздар шығару, тұрғын үйге мұқтаж Қазақстан Республикасының азаматтарына тұрғын үйді мониторингілеу және өткізу қағидаларын бекіту туралы
