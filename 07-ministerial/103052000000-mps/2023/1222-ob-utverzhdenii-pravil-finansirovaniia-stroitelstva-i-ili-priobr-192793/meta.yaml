  title:
    rus: О внесении изменений и дополнений в приказ Министра промышленности и строительства Республики Казахстан от 22 декабря 2023 года № 151 «Об утверждении Правил финансирования строительства и (или) приобретения жилья за счет республиканского бюджета и (или) выпуска государственных ценных бумаг, мониторинга и реализации жилья гражданам Республики Казахстан, нуждающихся в жилище»
    kaz: «Республикалық бюджет есебінен тұрғын үй салуды және (немесе) сатып алуды қаржыландыру және (немесе) мемлекеттік бағалы қағаздар шығару, тұрғын үйге мұқтаж Қазақстан Республикасының азаматтарына тұрғын үйді мониторингілеу және өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Өнеркәсіп және құрылыс министрінің 2023 жылғы 22 желтоқсандағы № 151 бұйрығына өзгерістер мен толықтырулар енгізу туралы
