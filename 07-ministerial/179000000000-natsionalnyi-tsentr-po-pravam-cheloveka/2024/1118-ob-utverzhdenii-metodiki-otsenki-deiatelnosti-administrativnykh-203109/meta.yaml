  title:
    rus: О внесении изменения в приказ исполняющего обязанности руководителя Национального центра по правам человека от 18 ноября 2024 года № 144 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Национального центра по правам человека и его представительств»
    kaz: «Адам құқықтары жөніндегі ұлттық орталықтың және оның өкілдіктерінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» Адам құқықтары жөніндегі ұлттық орталық басшысының міндетін атқарушының 2024 жылғы 18 қарашадағы № 144 бұйрығына өзгеріс енгізу
