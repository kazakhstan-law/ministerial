act_code: '4659'
requisite: Приказ Председателя Комитета по государственному контролю над производством и оборотом алкогольной продукции Министерства государственных доходов Республики Казахстан от 9 ноября 1999 года N 257. Зарегистрирован в Министерстве юстиции Республики Казахстан 19.11.99г. N 980. Утратил силу - Приказом Председателя Налогового комитета Министерства Финансов РК от 2 августа 2004 г. N 373
title:
  rus: Об утверждении Правил присвоения персонального идентификационного номера организациям, осуществляющим производство этилового спирта и алкогольной продукции, хранение и реализацию этилового спирта, хранение и оптовую реализацию алкогольной продукции
  kaz: Этил спирті мен алкоголь өнімінің өндірісін, этил спиртін сақтау және сату, сонымен бірге алкоголь өнімін сақтау және көтерме сатуды жүзеге асыратын ұйымдарға дербес сәйкестендірме нөмір тағайындау Тәртібін бекіту туралы
