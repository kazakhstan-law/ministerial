  title:
    rus: О внесении изменений в приказ Председателя Комитета по государственному контролю над производством и оборотом алкогольной продукции Министерства государственных доходов Республики Казахстан от 6 октября 1999 года № 240 "Об утверждении Правил дегустации этилового спирта и алкогольной продукции (кроме пива)"
    kaz: '"Этил спиртi мен алкоголь өнiмiнiң дәмiн айырудың Тәртiбiн бекiту туралы" Қазақстан Республикасы Мемлекеттiк кiрiс министрлiгiнiң Алкоголь өнiмiнiң өндiрiсi мен айналымын мемлекеттiк бақылау жөнiндегі комитетi Төрағасының 1999 жылғы 6 қазандағы N 240 бұйрығына өзгертулер енгiзу туралы'
