    rus: О внесении изменений в приказ исполняющего обязанности Министра культуры и информации Республики Казахстан от 25 мая 2007 года № 153 "Об утверждении Правил доступа к фондам библиотек через заочные или внестационарные формы обслуживания для инвалидов или лиц преклонного возраста"
    kaz: '"Мүгедектерге немесе егде жастағы адамдарға сырттай немесе стационардан тыс қызмет көрсету нысандары арқылы кітапхана қорларына қол жеткізу ережесін бекіту туралы" Қазақстан Республикасы Мәдениет және ақпарат министрінің міндетін атқарушысының 2007 жылғы 25 мамырдағы № 153 бұйрығына өзгерістер енгізу туралы'
