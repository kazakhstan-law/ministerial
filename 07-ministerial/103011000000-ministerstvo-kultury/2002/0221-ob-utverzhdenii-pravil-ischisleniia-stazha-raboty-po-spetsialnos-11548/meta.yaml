    kaz: '"Мәдениет, өнер саласындағы мемлекеттік мекемелердің, мемлекеттік мұрағат мекемелерінің және бұқаралық ақпарат құралдарының мемлекеттік қызметші болып табылмайтын қызметкерлері үшін мамандықтары бойынша жұмыс өтілін есептеу Тәртібін бекіту туралы" Қазақстан Республикасы Мәдениет, ақпарат және қоғамдық келісім министрінің 2002 жылғы 21 ақпандағы N 45 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
