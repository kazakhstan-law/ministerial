title:
  rus: Об утверждении Правил исчисления стажа работы по специальности для работников государственных учреждений сферы культуры, искусства, государственных архивных учреждений и средств массовой информации, не являющихся государственными служащими
  kaz: Мәдениет, өнер саласындағы мемлекеттік мекемелердің, мемлекеттік мұрағат мекемелерінің және бұқаралық ақпарат құралдарының мемлекеттік қызметші болып табылмайтын қызметкерлерi үшiн мамандықтары бойынша жұмыс өтiлiн есептеу Тәртiбiн бекiту туралы
