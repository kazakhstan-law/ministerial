title:
  rus: Об утверждении Правил проведения конкурса на получение права на телевизионное и (или) радиовещание в Республике Казахстан
  kaz: Қазақстан Республикасында телевизиялық және (немесе) радио хабарларын тарату құқығын алуға конкурс өткiзудiң Ережесiн бекiту туралы
