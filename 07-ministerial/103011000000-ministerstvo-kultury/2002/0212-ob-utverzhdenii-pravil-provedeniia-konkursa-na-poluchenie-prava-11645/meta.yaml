  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра культуры, информации и общественного согласия Республики Казахстан от 12 февраля 2002 года N 32 "Об утверждении Правил проведения конкурса на получение права на наземное телерадиовещание в Республике Казахстан"
    kaz: '"Қазақстан Республикасында жерүсті телерадио хабарларын тарату құқығын алуға конкурс өткізудің Ережесін бекіту туралы" Қазақстан Республикасы Мәдениет, ақпарат және қоғамдық келісім министрінің міндетін атқарушының 2002 жылғы 12 ақпандағы N 32 бұйрығына өзгерістер енгізу туралы'
