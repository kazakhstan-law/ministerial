  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра культуры, информации и общественного согласия Республики Казахстан от 12 февраля 2002 года № 32 "Об утверждении Правил проведения конкурса на получение права на наземное телерадиовещание в Республике Казахстан"
    kaz: '"Қазақстан Республикасында жерүсті телерадио хабарларын тарату құқығын алуға конкурс өткізудің Ережесін бекіту туралы" Қазақстан Республикасы Мәдениет, ақпарат және қоғамдық келісім министрі міндетін атқарушының 2002 жылғы 12 ақпандағы № 32 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
