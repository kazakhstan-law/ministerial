  title:
    rus: О внесении изменений и дополнения в приказ и.о. Министра культуры, информации и общественного согласия Республики Казахстан от 5 января 2000 года № 1 "Об утверждении Правил "Об аккредитации журналистов средств массовой информации и информационных агентств при государственных органах или иных организациях", зарегистрированный за № 1037
    kaz: Қазақстан Республикасы Мәдениет, ақпарат және қоғамдық келісім министрі міндетін атқарушысының № 1037 болып тіркелген 2000 жылғы 5 қаңтардағы № 1 "Мемлекеттік органдарының немесе өзге ұйымдарының жанында бұқаралық ақпарат құралдарының және ақпарат агенттіктерінің журналистерін тіркеу туралы" Ережені бекіту туралы" бұйрығына өзгерістер мен толықтыру енгізу туралы
