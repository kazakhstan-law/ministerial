  requisite: Приказ Министра культуры и информации Республики Казахстан от 12 октября 2013 года № 234. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 ноября 2013 года № 8898. Утратил силу совместным приказом Министра культуры и спорта Республики Казахстан от 28 января 2016 года № 20 и Министра национальной экономики Республики Казахстан от 9 февраля 2016 года № 65 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в приказ Министра культуры Республики Казахстан от 28 февраля 2011 года № 37 "Об утверждении формы проверочного листа в области применения законодательства Республики Казахстан о языках"
    kaz: '"Қазақстан Республикасының тіл туралы заңдарын қолдану саласындағы тексеру парағының нысанын бекіту туралы" Қазақстан Республикасы Мәдениет министрінің 2011 жылғы 28 ақпандағы № 37 бұйрығына өзгеріс енгізу туралы'
