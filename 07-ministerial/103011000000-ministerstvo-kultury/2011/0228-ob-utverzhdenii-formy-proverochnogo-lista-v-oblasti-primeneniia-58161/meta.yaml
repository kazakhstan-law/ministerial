act_code: '58161'
requisite: Приказ Министра культуры Республики Казахстан от 28 февраля 2011 года № 37. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 марта 2011 года № 6826. Утратил силу совместным приказом Министра культуры и спорта Республики Казахстан от 28 января 2016 года № 20 и Министра национальной экономики Республики Казахстан от 9 февраля 2016 года № 65
title:
