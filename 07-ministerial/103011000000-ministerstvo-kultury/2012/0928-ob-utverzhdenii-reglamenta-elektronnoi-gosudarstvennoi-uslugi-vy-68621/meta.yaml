  title:
    rus: О внесении изменений в приказ и.о. Министра культуры и информации Республики Казахстан от 28 сентября 2012 года № 159 "Об утверждении регламента электронной государственной услуги "Выдача лицензии, переоформление, выдача дубликатов лицензии на деятельность по осуществлению археологических и (или) научно-реставрационных работ на памятниках истории и культуры"
    kaz: '"Тарих және мәдениет ескерткіштерінде археологиялық және (немесе) ғылыми-реставрациялау жұмыстарын жүзеге асыру жөніндегі қызметке лицензияны беру, қайта ресімдеу, лицензияның түпнұсқасын беру" мемлекеттік қызметінің регламентін бекіту туралы" Қазақстан Республикасы Мәдениет және ақпарат Министрінің м.а. 2012 жылғы 28 қыркүйектегі № 159 бұйрығына өзгерістер енгізу туралы'
