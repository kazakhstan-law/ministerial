requisite: Приказ и.о. Министра культуры и информации Республики Казахстан от 28 сентября 2012 года № 159. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 ноября 2012 года № 8069. Утратил силу приказом Министра культуры и информации Республики Казахстан от 18 марта 2014 года № 1
title:
  rus: Об утверждении регламента электронной государственной услуги "Выдача лицензии, переоформление лицензии на деятельность по осуществлению археологических и (или) научно-реставрационных работ на памятниках истории и культуры"
  kaz: '"Тарих және мәдениет ескерткіштерінде археологиялық және (немесе) ғылыми-реставрациялау жұмыстарын жүзеге асыру жөніндегі қызметке лицензия беру, қайта ресімдеу беру" электрондық мемлекеттік қызмет көрсету регламентін бекіту туралы'
