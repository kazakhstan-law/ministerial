    kaz: «Қазақстан Республикасының Ұлттық мұрағат қоры құжаттарын орталықтандырылған мемлекеттік есепке алу туралы нұсқаулықты бекіту туралы» Қазақстан Республикасы Мәдениет және ақпарат министрінің 2013 жылғы 6 ақпандағы № 27 бұйрығына өзгерістер енгізу туралы
