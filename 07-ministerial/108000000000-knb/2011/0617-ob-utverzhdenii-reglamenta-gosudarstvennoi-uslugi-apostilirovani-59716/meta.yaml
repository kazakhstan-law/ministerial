requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 17 июня 2011 года № 226. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июня 2011 года № 7052. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 31 октября 2015 года № 97
title:
  rus: Об утверждении Регламента государственной услуги "Апостилирование архивных справок и копий архивных документов, исходящих из специального государственного архива Комитета национальной безопасности Республики Казахстан"
  kaz: '"Қазақстан Республикасы Ұлттық қауіпсіздік комитеті арнайы мемлекеттік мұрағатынан шығатын мұрағаттық анықтамаларға және мұрағаттық құжаттардың көшірмелеріне апостиль қою" мемлекеттік қызмет көрсету регламентін бекіту туралы'
