title:
  rus: Об утверждении Правил проведения криминалистических исследований и учета их результатов в органах национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасының ұлттық қауіпсіздік органдарында криминалистік зерттеулер жүргізу және олардың нәтижелерін есепке алу қағидаларын бекіту туралы
