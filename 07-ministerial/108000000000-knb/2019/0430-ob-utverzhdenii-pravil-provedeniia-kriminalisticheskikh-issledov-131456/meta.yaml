    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 30 апреля 2019 года № 26/дсп «Об утверждении Правил проведения криминалистических исследований и учета их результатов в органах национальной безопасности Республики Казахстан»
