  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 22 апреля 2019 года № 24/дсп «Об утверждении Правил формирования и эксплуатации фонда программного обеспечения для персональных электронных вычислительных машин, используемых в органах национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасының ұлттық қауіпсіздік органдарында қолданылатын дербес электрондық есептеуіш машиналарына арналған бағдарламалық қамтамасыз ету қорын қалыптастыру және пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2019 жылғы 22 сәуірдегі № 24/қбп бұйрығына өзгерістер мен толықтырулар енгізу туралы
