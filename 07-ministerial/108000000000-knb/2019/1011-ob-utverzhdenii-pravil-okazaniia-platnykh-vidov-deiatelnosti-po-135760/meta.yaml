act_code: '135760'
requisite: Приказ и.о. Председателя Комитета национальной безопасности Республики Казахстан от 11 октября 2019 года № 83/қбп. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 октября 2019 года № 19530
title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации услуг государственными учреждениями Комитета национальной безопасности Республики Казахстан по оказанию медицинской помощи в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования и расходования ими денег от реализации услуг
  kaz: Қазақстан Республикасының Ұлттық қауіпсіздік комитеті мемлекеттік мекемелерінің тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмек көрсету қызметтерін іске асыру бойынша ақылы қызмет түрлерін көрсету және көрсетілетін қызметтерді іске асырудан түсетін ақшаларды жұмсау қағидаларын бекіту туралы
