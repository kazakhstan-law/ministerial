  title:
    rus: О внесении изменений в приказ временно исполняющего обязанности Председателя Комитета национальной безопасности Республики Казахстан от 11 октября 2019 года № 83/ҚБП «Об утверждении Правил оказания платных видов деятельности по реализации услуг государственными учреждениями Комитета национальной безопасности Республики Казахстан по оказанию медицинской помощи в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования и расходования ими денег от реализации услуг»
    kaz: «Қазақстан Республикасының Ұлттық қауіпсіздік комитеті мемлекеттік мекемелерінің тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмек көрсету қызметтерін іске асыру бойынша ақылы қызмет түрлерін көрсету және көрсетілетін қызметтерді іске асырудан түсетін ақшаларды жұмсау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының лауазымдық міндетін уақытша атқарушының 2019 жылғы 11 қазандағы № 83/ҚБП бұйрығына өзгерістер енгізу туралы
