act_code: '133782'
requisite: Приказ и.о. Председателя Комитета национальной безопасности Республики Казахстан от 31 июля 2019 года № 59/қе. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 августа 2019 года № 19164
title:
  rus: Об утверждении Правил въезда на территорию и выезда с территории специальной экономической зоны, пределы которой полностью или частично совпадают с участками таможенной границы Евразийского экономического союза, должностных лиц государственных органов, работников службы инкассации, осуществляющих деятельность на территории такой специальной экономической зоны, а также лиц, посещающих такую специальную экономическую зону со служебной необходимостью
  kaz: Шектері Еуразиялық экономикалық одақтың кедендік шекарасының учаскелерімен толық немесе ішінара тұспа-тұс келетін арнайы экономикалық аймақтың аумағында қызметін жүзеге асыратын мемлекеттік органдардың лауазымды адамдарының, инкассация қызметі жұмыскерлерінің, сондай-ақ қызметтік қажеттілікке байланысты осындай арнайы экономикалық аймаққа келетін адамдардың осындай экономикалық аймақтың аумағына кіру және аумағынан шығу қағидаларын бекіту туралы
