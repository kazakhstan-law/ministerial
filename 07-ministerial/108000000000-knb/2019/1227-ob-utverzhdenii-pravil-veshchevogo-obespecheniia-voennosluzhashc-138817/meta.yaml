  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 27 декабря 2019 года № 103/ДСП «Об утверждении Правил вещевого обеспечения военнослужащих органов военной контрразведки и военной полиции Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің әскери қарсы барлау және әскери полициясы органдарының әскери қызметшілерін заттай мүлікпен қамтамасыз ету қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2019 жылғы 27 желтоқсандағы № 103/ҚБП бұйрығына өзгерістер енгізу туралы
