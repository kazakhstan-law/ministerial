    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлерін жерлеу кезінде құрмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2019 жылғы 21 қаңтардағы № 6/қе бұйрығына өзгерістер мен толықтыру енгізу туралы
