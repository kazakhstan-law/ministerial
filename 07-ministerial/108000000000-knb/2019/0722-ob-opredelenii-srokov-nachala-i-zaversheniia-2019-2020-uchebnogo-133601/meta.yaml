  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 22 июня 2019 года № 430/қбп-қа «Об определении сроков начала и завершения 2019-2020 учебного года в военных, специальных учебных заведениях органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери, арнаулы оқу орындарында 2019-2020 оқу жылының басталу және аяқталу мерзімдерін анықтау туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2019 жылғы 22 маусымдағы № 430/қбп-қа бұйрығына өзгерістер енгізу туралы
