  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 25 апреля 2019 года № 25/дсп «Об утверждении Правил разработки, ввода в эксплуатацию и снятия с эксплуатации специальных технических средств, необходимых для органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдары үшін қажетті арнайы техникалық құралдарды әзірлеу, қолдануға енгізу және қолданыстан шығару қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2019 жылғы 25 сәуірдегі № 25/қбп бұйрығына өзгерістер мен толықтырулар енгізу туралы
