title:
  rus: Об утверждении Правил внутреннего распорядка содержания подозреваемых, обвиняемых и подсудимых на гауптвахте органов военной полиции Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті әскери полициясы органдарының гауптвахтасында күдіктілерді, айыпталушыларды және сотталушыларды ұстаудың ішкі тәртібінің қағидаларын бекіту туралы
