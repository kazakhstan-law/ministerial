  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 10 июня 2014 года № 182 «Об утверждении Правил внутреннего распорядка содержания подозреваемых и обвиняемых военнослужащих на гауптвахтах органов военной полиции Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті әскери полициясы органдарының гауптвахталарында күдікті және айыпталушы әскери қызметшілерді ұстаудың ішкі тәртібінің қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2014 жылғы 10 маусымдағы № 182 бұйрығына өзгерістер енгізу туралы
