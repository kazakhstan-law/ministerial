    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарында алынбай қалған заттай мүліктердің орнына ақшалай өтемақы төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2014 жылғы 25 қарашадағы № 389/ҚБП бұйрығына өзгерістер енгізу туралы
