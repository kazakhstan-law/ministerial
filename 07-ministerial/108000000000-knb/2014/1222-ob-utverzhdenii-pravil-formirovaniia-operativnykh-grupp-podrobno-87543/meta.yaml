  title:
    rus: О внесении изменений и дополнения в совместный приказ Министра обороны Республики Казахстан от 26 декабря 2014 года № 626дсп, Начальника Службы государственной охраны Республики Казахстан от 27 декабря 2014 года № 163дсп, Председателя Комитета национальной безопасности Республики Казахстан от 22 декабря 2014 года № 422дсп, Министра внутренних дел Республики Казахстан от 23 декабря 2014 года № 124дсп «Об утверждении Правил формирования оперативных групп, подробного перечня их действий в ходе подготовки и проведения антитеррористической операции»
    kaz: «Жедел топтарды құру, терроризмге қарсы операцияны дайындау мен өткізу барысындағы олардың іс-қимылдарының егжей-тегжейлі тізбесінің қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2014 жылғы 26 желтоқсандағы № 626қбп, Қазақстан Республикасы Мемлекеттік күзет қызметі бастығының 2014 жылғы 27 желтоқсандағы № 163қбп, Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2014 жылғы 22 желтоқсандағы № 422қбп, Қазақстан Республикасы Ішкі істер министрінің 2014 жылғы 23 желтоқсандағы № 124қбп бірлескен бұйрығына өзгерістер мен толықтыру енгізу туралы
