title:
  rus: Об утверждении Правил формирования оперативных групп, подробного перечня их действий в ходе подготовки и проведения антитеррористической операции
  kaz: Жедел топтарды құру, терроризмге қарсы операцияны дайындау мен өткізу барысындағы олардың іс-қимылдарының егжей-тегжейлі тізбесінің қағидаларын бекіту туралы
