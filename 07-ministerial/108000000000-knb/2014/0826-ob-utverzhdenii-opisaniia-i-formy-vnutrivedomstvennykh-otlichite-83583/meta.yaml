  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 26 августа 2014 года № 271 «Об утверждении описания и формы внутриведомственных отличительных реквизитов и знаков об окончании Академии Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Академиясын бітіргені туралы белгілерінің және ішкі ведомстволық айырым реквизиттерінің сипаттамалары мен нысандарын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2014 жылғы 26 тамыздағы № 271 бұйрығына өзгерістер енгізу туралы
