act_code: '85708'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 22 апреля 2014 года № 130ДСП. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 мая 2014 года № 9469
title:
  rus: Об утверждении Правил выплаты денежной компенсации военнослужащим органов национальной безопасности Республики Казахстан по контракту для оплаты расходов на коммунальные услуги
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының келісімшарт бойынша әскери қызметшілеріне коммуналдық қызметтерге арналған шығыстарды төлеу үшін ақшалай өтемақы төлеу қағидаларын бекіту туралы
