  title:
    rus: О внесении изменений и дополнений в совместный приказ Министра обороны Республики Казахстан от 25 ноября 2014 года № 550дсп, Начальника Службы государственной охраны Республики Казахстан от 27 ноября 2014 года №147 дсп, Председателя Комитета национальной безопасности Республики Казахстан от 18 ноября 2014 года № 393дсп, Министра внутренних дел Республики Казахстан от 18 ноября 2014 года № 116дсп «Об утверждении Правил организации и осуществления разноуровневых антитеррористических учений, тренировок и экспериментов»
    kaz: «Түрлі деңгейдегі терроризмге қарсы оқу-жаттығулар, жаттықтырулар мен тәжірибелерді ұйымдастыру және жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2014 жылғы 25 қарашадағы №550қбп, Қазақстан Республикасы Мемлекеттік күзет қызметі бастығының 2014 жылғы 27 қарашадағы №147қбп, Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2014 жылғы 18 қарашадағы №393 қбп, Қазақстан Республикасы Ішкі істер министрінің 2014 жылғы 18 қарашадағы №116 қбп бірлескен бұйрығына өзгерістер мен толықтырулар енгізу туралы
