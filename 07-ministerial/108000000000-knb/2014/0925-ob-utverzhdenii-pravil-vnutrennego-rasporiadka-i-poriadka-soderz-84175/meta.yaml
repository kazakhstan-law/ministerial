  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 25 сентября 2014 года № 319 "Об утверждении Правил внутреннего распорядка и порядка содержания осужденных на гауптвахте органов военной полиции Комитета национальной безопасности Республики Казахстан"
    kaz: '"Қазақстан Республикасы Ұлттық қауіпсіздік комитеті әскери полициясы органдарының гауптвахтасында сотталғандарды ұстаудың ішкі тәртіптемесі мен тәртібінің қағидаларын бекіту туралы" Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2014 жылғы 25 қыркүйектегі № 319 бұйрығына өзгерістер енгізу туралы'
