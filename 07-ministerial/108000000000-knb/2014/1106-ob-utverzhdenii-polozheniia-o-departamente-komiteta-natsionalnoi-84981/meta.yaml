    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Алматы облысы бойынша Департаментінің Ережесін бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2014 жылғы 6 қарашадағы № 369 бұйрығына өзгерістер мен толықтыру енгізу туралы
