  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 6 ноября 2014 года № 369 «Об утверждении Положения о Департаменте Комитета национальной безопасности Республики Казахстан по Алматинской области»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Алматы облысы бойынша департаменті туралы ережені бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2014 жылғы 6 қарашадағы № 369 бұйрығына өзгеріс енгізу туралы
