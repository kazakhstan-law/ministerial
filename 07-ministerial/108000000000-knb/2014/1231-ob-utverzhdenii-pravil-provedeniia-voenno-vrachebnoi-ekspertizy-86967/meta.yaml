title:
  rus: Об утверждении Правил проведения военно-врачебной экспертизы в специальных государственных органах Республики Казахстан и Положения об органах военно-врачебной экспертизы органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасының ұлттық қауіпсіздік органдаранда, сыртқы барлау саласындағы уәкілетті органдарында әскери-дәрігерлік сараптаманы жүргізу қағидаларын және Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери-дәрігерлік сараптама органдары туралы ережені бекіту туралы
