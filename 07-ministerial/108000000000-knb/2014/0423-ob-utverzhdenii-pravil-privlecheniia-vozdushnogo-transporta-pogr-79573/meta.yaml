  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 23 апреля 2014 года № 133 дсп «Об утверждении Правил привлечения воздушного транспорта Пограничной службы Комитета национальной безопасности Республики Казахстан для перевозки личного состава, вооружения, боеприпасов и специальной техники Службы «Арыстан» Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті «Арыстан» қызметінің жеке құрамын, қару-жарақ, оқ-дәрілерін және арнайы техникасын тасымалдау үшін Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің әуе көлігін тарту қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2014 жылғы 23 сәуірдегі № 133 қбп бұйрығына өзгерістер енгізу туралы
