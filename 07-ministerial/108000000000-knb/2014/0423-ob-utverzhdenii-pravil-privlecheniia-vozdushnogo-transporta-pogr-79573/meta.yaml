act_code: '79573'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 23 апреля 2014 года № 133ДСП. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 мая 2014 года № 9465
title:
  rus: Об утверждении Правил привлечения воздушного транспорта Пограничной службы Комитета национальной безопасности Республики Казахстан для перевозки личного состава, вооружения, боеприпасов и специальной техники Службы специального назначения "А" Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті "А" арнаулы мақсаттағы қызметінің жеке құрамын, қару-жарақ, оқ-дәрілерін және арнайы техникасын тасымалдау үшін Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің әуе көлігін тарту қағидаларын бекіту туралы
