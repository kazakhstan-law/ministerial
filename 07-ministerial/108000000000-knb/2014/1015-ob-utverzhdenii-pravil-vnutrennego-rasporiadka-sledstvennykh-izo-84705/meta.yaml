  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 15 октября 2014 года № 346 «Об утверждении Правил внутреннего распорядка следственных изоляторов органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдары тергеу изоляторларының ішкі тәртіптеме қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2014 жылғы 15 қазандағы № 346 бұйрығына өзгерістер енгізу туралы
