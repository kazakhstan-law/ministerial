act_code: '209983'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 30 апреля 2025 года № 38/ДСП
title:
  rus: Об утверждении натуральных норм расквартирования подразделений Пограничной, Авиационной служб, Пограничной академии, органов военной полиции, военной контрразведки и обеспечивающих их работу некоторых подразделений Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Шекара, Авиация қызметтерін, Шекара академиясын, әскери полициясы, әскери қарсы барлау органдарын және олардың жұмыстарын қамтамасыз ететін кейбір бөлімшелерін пәтерге орналастырудың заттай нормаларын бекіту туралы
