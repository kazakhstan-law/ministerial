act_code: '210389'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 29 апреля 2025 года № 34/ДСП
title:
  rus: Об утверждении натуральных норм площадей для специфических помещений органов национальной безопасности Республики Казахстан, за исключением Пограничной, Авиационной служб, Академии, Пограничной академии, органов военной полиции и военной контрразведки Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Шекара, Авиация қызметтерін, Академиясын, Шекара академиясын, әскери полициясы және әскери қарсы барлау органдарын қоспағанда, Қазақстан Республикасы ұлттық қауіпсіздік органдарының ерекше үй-жайларына арналған алаңдардың заттай нормаларын бекіту туралы
