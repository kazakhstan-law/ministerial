title:
  rus: Об утверждении натуральных норм снабжения горюче-смазочными материалами и специальными жидкостями кораблей, катеров, вспомогательных и стоечных судов Пограничной службы Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің корабльдерін, катерлерін, көмекші және тұрақты кемелерін жанар-жағармай материалдарымен және арнайы сұйықтықтармен жабдықтаудың заттай нормаларын бекіту туралы
