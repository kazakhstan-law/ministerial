requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 30 декабря 2025 года № 134/дсп
title:
  rus: Об утверждении норм снабжения специальной формой одежды и другим вещевым имуществом сотрудников органов национальной безопасности Республики Казахстан с учетом особенностей прохождения службы на мирное время
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлерін қызметті өткеру ерекшеліктерін ескере отырып, арнаулы киім нысандарымен және басқа да заттай мүлікпен жабдықтаудың бейбiт уақытқа арналған нормаларын бекіту туралы
