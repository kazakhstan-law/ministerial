requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 9 сентября 2025 года № 81нс. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 23 мая 2026 года № 34/қе (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня закрытых и обособленных военных городков, иных закрытых объектов, содержание служебных жилищ и централизованное отопление в которых обеспечиваются за счет бюджетных средств, а также в которых жилище не подлежит приватизации
  kaz: Қызметтік тұрғынжайларды ұстау және орталықтандырылған жылыту бюджет қаражаты есебінен қамтамасыз етілетін, сондай-ақ қызметтік тұрғынжайы жекешелендіруге жатпайтын жабық және оқшауланған әскери қалашықтардың, өзге де жабық объектілердің тізбесін бекіту туралы
