act_code: '214753'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 25 сентября 2025 года № 85/ДСП
title:
  rus: Об утверждении натуральных норм обеспечения продовольственными пайками отдельных категорий сотрудников с учетом особенностей прохождения службы, а также норм снабжения техникой, столово-кухонным оборудованием и посудой органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдары қызметкерлерінің жекелеген санаттарын қызмет өткеру ерекшеліктерін ескере отырып, азық-түлік үлесімен қамтамасыз етудің заттай нормаларын, сондай-ақ техникамен, асханалық-ас үйлік жабдықпен және ыдыспен жабдықтау нормаларын бекіту туралы
