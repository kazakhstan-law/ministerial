title:
  rus: Об утверждении натуральных норм снабжения беспилотными воздушными судами структурных подразделений единой системы Пограничной службы и Пограничной академии Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметі бірыңғай жүйесінің құрылымдық бөлімшелерін және Шекара академиясын пилотсыз әуе кемелерімен жабдықтаудың заттай нормаларын бекіту туралы
