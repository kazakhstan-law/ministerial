requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 30 апреля 2025 года № 41/ДСП
title:
  rus: Об утверждении натуральных норм снабжения техническими средствами охраны границы, средствами инженерного вооружения подразделений Пограничной службы, Службы специального назначения «А», Пограничной академии Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті, Шекара қызметінің, «А» Арнаулы мақсаттағы қызметінің, Шекара академиясының бөлімшелерін шекара күзетінің техникалық құралдарымен, инженерлік қару-жарақ құралдарымен жабдықтаудың заттай нормаларын бекіту туралы
