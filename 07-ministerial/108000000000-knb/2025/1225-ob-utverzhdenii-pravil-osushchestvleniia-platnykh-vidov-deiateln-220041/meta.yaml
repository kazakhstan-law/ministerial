act_code: '220041'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 25 декабря 2025 года № 126/ДСП
title:
  rus: Об утверждении Правил осуществления платных видов деятельности по реализации услуг государственными учреждениями Комитета национальной безопасности Республики Казахстан по оказанию медицинской помощи в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования, использования ими денег от реализации услуг, остающихся в их распоряжении
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті мемлекеттік мекемелерінің тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмек көрсету  қызметтерін іске асыру бойынша ақылы қызмет түрлерін жүзеге асыру, олардың өздерінің иелігінде қалатын қызметтерді іске асырудан түсетін ақшаларды пайдалану қағидаларын бекіту туралы
