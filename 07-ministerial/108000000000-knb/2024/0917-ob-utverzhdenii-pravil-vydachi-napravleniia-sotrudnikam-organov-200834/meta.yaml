act_code: '200834'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 17 сентября 2024 года № 127/ДСП
title:
  rus: Об утверждении Правил выдачи направления сотрудникам органов национальной безопасности Республики Казахстан (кроме курсантов, слушателей), имеющим право на возмещение затрат за проезд на транспорте по территории Республики Казахстан, при следовании на медицинское обследование (освидетельствование) и обратно
  kaz: Медициналық тексеруге (куәландыруға) жол жүру және кері қайту кезінде Қазақстан Республикасы аумағы бойынша көлікте жүргені үшін жолақы шығындарын өтетуге құқығы бар Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлеріне (курсанттардан, тыңдаушылардан басқа) жолдама беру қағидаларын бекіту туралы
