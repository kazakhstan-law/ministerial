title:
  rus: Об утверждении Правил отчисления сотрудников и военнослужащих органов национальной безопасности Республики Казахстан из военных, специальных учебных заведений или организаций образования иностранных государств
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлері мен әскери қызметшілерін әскери, арнаулы оқу орындарынан немесе шет мемлекеттердің білім беру ұйымдарынан шығарып жіберу қағидаларын бекіту туралы
