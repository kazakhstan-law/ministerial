  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 4 июня 2024 года № 75/қе «Об утверждении Правил отчисления сотрудников и военнослужащих органов национальной безопасности Республики Казахстан из военных, специальных учебных заведений или организаций образования иностранных государств»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлері мен әскери қызметшілерін әскери, арнаулы оқу орындарынан немесе шет мемлекеттердің білім беру ұйымдарынан шығарып жіберу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2024 жылғы 4 маусымдағы № 75/қе бұйрығына өзгерістер енгізу туралы
