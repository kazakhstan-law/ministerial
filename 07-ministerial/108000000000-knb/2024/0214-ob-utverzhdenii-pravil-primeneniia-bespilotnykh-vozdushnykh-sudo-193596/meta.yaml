act_code: '193596'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 14 февраля 2024 года № 19/ДСП. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2024 года № 34006
title:
  rus: Об утверждении Правил применения беспилотных воздушных судов Пограничной службы Комитета национальной безопасности Республики Казахстан с учетом требований законодательства Республики Казахстан об использовании воздушного пространства и деятельности авиации
  kaz: Қазақстан Республикасының әуе кеңістігін пайдалану және авиация қызметі туралы заңнамасының талаптарын ескере отырып, Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің пилотсыз әуе кемелерін қолдану қағидаларын бекіту туралы
