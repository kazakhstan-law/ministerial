  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 7 февраля 2024 года № 12/қе «Об утверждении Правил выплаты денежной компенсации при отсутствии возможности обеспечения питанием по установленным нормам продовольственного пайка отдельным категориям сотрудников органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының жекелеген санаттағы қызметкерлеріне азық-түлік үлестерінің белгіленген нормалары бойынша тамақтандыруды қамтамасыз ету мүмкіндігі болмаған кезде ақшалай өтемақы төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2024 жылғы 7 ақпандағы № 12/қе бұйрығына өзгерістер енгізу туралы
