title:
  rus: Об утверждении Правил выплаты денежной компенсации при отсутствии возможности обеспечения питанием по установленным нормам продовольственного пайка отдельным категориям сотрудников органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының жекелеген санаттағы қызметкерлеріне азық-түлік үлестерінің белгіленген нормалары бойынша тамақтандыруды қамтамасыз ету мүмкіндігі болмаған кезде ақшалай өтемақы төлеу қағидаларын бекіту туралы
