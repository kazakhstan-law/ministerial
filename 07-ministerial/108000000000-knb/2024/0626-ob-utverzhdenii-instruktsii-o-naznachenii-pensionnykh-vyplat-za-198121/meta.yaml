  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 26 июня 2024 года № 90/қе «Об утверждении Инструкции о назначении пенсионных выплат за выслугу лет сотрудникам и военнослужащим органов национальной безопасности, единовременных выплат на погребение и пособия семье умершего пенсионера органов национальной безопасности Республики Казахстан, а также описания формы пенсионного удостоверения, подтверждающего статус получателя пенсионных выплат»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлері мен әскери қызметшілеріне еңбек сіңірген жылдары үшін зейнетақы төлемдерін, ұлттық қауіпсіздік органдарының қайтыс болған зейнеткерінің отбасына жерлеуге арналған біржолғы төлемдерді және жәрдемақыларды тағайындау туралы нұсқаулықты, сондай-ақ зейнетақы төлемдерін алушының мәртебесін растайтын зейнеткерлік куәлігі нысанының сипаттамасын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2024 жылғы 26 маусымдағы № 90/қе бұйрығына өзгерістер енгізу туралы
