act_code: '198121'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 26 июня 2024 года № 90/қе. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 июня 2024 года № 34583
title:
  rus: Об утверждении Инструкции о назначении пенсионных выплат за выслугу лет сотрудникам и военнослужащим органов национальной безопасности, единовременных выплат на погребение и пособия семье умершего пенсионера органов национальной безопасности Республики Казахстан, а также описания формы пенсионного удостоверения, подтверждающего статус получателя пенсионных выплат
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлері мен әскери қызметшілеріне еңбек сіңірген жылдары үшін зейнетақы төлемдерін, ұлттық қауіпсіздік органдарының қайтыс болған зейнеткерінің отбасына жерлеуге арналған біржолғы төлемдерді және жәрдемақыларды тағайындау туралы нұсқаулықты, сондай-ақ зейнетақы төлемдерін алушының мәртебесін растайтын зейнеткерлік куәлігі нысанының сипаттамасын бекіту туралы
