act_code: '193290'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 14 февраля 2024 года № 20/қе. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 февраля 2024 года № 33999
title:
  rus: Об утверждении Правил внесения представлений органами национальной безопасности Республики Казахстан об устранении причин и условий, способствующих реализации угроз безопасности Республики Казахстан, совершению уголовных правонарушений, расследование которых отнесено законодательством Республики Казахстан к ведению органов национальной безопасности
  kaz: Ұлттық қауіпсіздік органдарының Қазақстан Республикасының қауіпсіздігіне төнетін қатерлерді іске асыруға, тергеп-тексерілуі Қазақстан Республикасының заңнамасында қарауына жатқызылған қылмыстық құқық бұзушылықтар жасауға ықпал ететін себептер мен жағдайларды жою туралы ұлттық қауіпсіздік органдарының ұсынымдарын енгізу қағидаларын бекіту туралы
