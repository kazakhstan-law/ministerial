act_code: '201012'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 19 сентября 2024 года № 128/қе. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 сентября 2024 года № 35121
title:
  rus: Об утверждении Правил обеспечения операторами связи и (или) владельцами сетей связи, осуществляющими деятельность на территории Республики Казахстан, за счет собственных или привлеченных средств функций своего телекоммуникационного оборудования для технического проведения оперативно-розыскных, контрразведывательных мероприятий и Требований к сетям и средствам связи
  kaz: Қазақстан Республикасының аумағында қызметін жүзеге асыратын байланыс операторларының және (немесе) байланыс желілерін иеленушілердің жедел-іздестіру, қарсы барлау іс-шараларын техникалық тұрғыдан жүргізу үшін өзінің телекоммуникациялық жабдығының функцияларын өз қаражаты немесе тартылған қаражат есебінен қамтамасыз ету қағидаларын және Байланыс желілері мен құралдарына қойылатын талаптарды бекіту туралы
