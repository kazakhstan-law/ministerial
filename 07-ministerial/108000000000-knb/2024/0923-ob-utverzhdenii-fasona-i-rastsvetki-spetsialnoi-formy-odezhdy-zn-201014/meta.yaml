act_code: '201014'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 23 сентября 2024 года № 131/ДСП
title:
  rus: Об утверждении фасона и расцветки специальной формы одежды, знаков различия и нашиваемых знаков отличия к ней, нарукавных знаков различия к парадной, повседневной, полевой и специальной форме одежды, обозначающих принадлежность к органам национальной безопасности Республики Казахстан, военным, специальным учебным заведениям органов национальной безопасности Республики Казахстан, знаков об окончании военного, специального учебного заведения органов национальной безопасности Республики Казахстан, знаков для классных специалистов и внутриведомственных отличительных реквизитов (эмблем) органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының арнайы киім нысанының фасоны мен түсін, салтанатты, күнделікті, далалық және арнайы киім нысанындағы Қазақстан Республикасының ұлттық қауіпсіздік органдарына, Қазақстан Республикасының ұлттық қауіпсіздік органдарының әскери, арнаулы оқу орындарына тиесілігін білдіретін айырым белгісін және оған тігілетін ерекшелік белгісін, жеңдегі айырым белгісін, Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери, арнаулы оқу орнын бітіргені туралы белгіні, сыныпты маман үшін белгіні және ведомствоішілік айырым деректемелерін (эмблемаларын) бекіту туралы
