  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 29 мая 2024 года № 69/қбп «Об утверждении натуральных норм снабжения объектами информатизации, запасными частями и расходными материалами для информационного обеспечения оперативной и служебной деятельности органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының жедел және қызметтік іс-қимылын ақпараттық қамтамасыз ету үшін ақпараттандыру объектілерімен, қосалқы бөлшектермен және шығыс материалдарымен жабдықтаудың заттай нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2024 жылғы 29 мамырдағы № 69/қбп бұйрығына өзгерістер енгізу туралы
