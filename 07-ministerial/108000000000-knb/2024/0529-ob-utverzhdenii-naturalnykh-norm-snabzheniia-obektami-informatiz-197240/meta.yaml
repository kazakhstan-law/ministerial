title:
  rus: Об утверждении натуральных норм снабжения объектами информатизации, запасными частями и расходными материалами для информационного обеспечения оперативной и служебной деятельности органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының жедел және қызметтік іс-қимылын ақпараттық қамтамасыз ету үшін ақпараттандыру объектілерімен, қосалқы бөлшектермен және шығыс материалдарымен жабдықтаудың заттай нормаларын бекіту туралы
