requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 23 февраля 2024 года № 42/қе. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 февраля 2024 года № 34041
title:
  rus: Об утверждении типовых схем организации пропуска через Государственную границу Республики Казахстан лиц, транспортных средств, грузов и товаров в пунктах пропуска и иных местах, где осуществляется пропуск через Государственную границу Республики Казахстан
  kaz: Қазақстан Республикасының Мемлекеттік шекарасы арқылы адамдарды, көлік құралдарын, жүктерді және тауарларды өткізу пункттерінде және Қазақстан Республикасының Мемлекеттік шекарасы арқылы өткізу жүзеге асырылатын өзге де орындарда өткізуді ұйымдастырудың үлгілік схемаларын бекіту туралы
