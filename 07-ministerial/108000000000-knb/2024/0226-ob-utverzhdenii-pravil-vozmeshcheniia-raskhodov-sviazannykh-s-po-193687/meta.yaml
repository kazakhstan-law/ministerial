act_code: '193687'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 26 февраля 2024 года № 47/қе. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 февраля 2024 года № 34054
title:
  rus: Об утверждении Правил возмещения расходов, связанных с подготовкой к перевозке тела, перевозкой тела, погребением сотрудников органов национальной безопасности Республики Казахстан, погибших при прохождении службы или умерших в результате увечья (ранения, травмы, контузии), заболевания, изготовлением и установкой надгробного памятника
  kaz: Қызмет өткеру кезінде қаза тапқан немесе мертігу (жаралану, жарақаттану, контузия алу), ауру салдарынан қайтыс болған Қазақстан Республикасы ұлттық қауіпсіздік органдары қызметкерлерінің мәйітін тасымалдауға дайындауға, мәйітті тасымалдауға, жерлеуге, құлпытас жасау мен орнатуға байланысты шығыстарды өтеу қағидаларын бекіту туралы
