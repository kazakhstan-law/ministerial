  requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 30 июля 2026 года № 71 қе. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 июля 2026 года № 39463
  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 26 февраля 2024 года № 47/қе «Об утверждении Правил возмещения расходов, связанных с подготовкой к перевозке тела, перевозкой тела, погребением сотрудников органов национальной безопасности Республики Казахстан, погибших при прохождении службы или умерших в результате увечья (ранения, травмы, контузии), заболевания, изготовлением и установкой надгробного памятника»
    kaz: «Қызмет өткеру кезінде қаза тапқан немесе мертігу (жаралану, жарақаттану, контузия алу), ауру салдарынан қайтыс болған Қазақстан Республикасы ұлттық қауіпсіздік органдары қызметкерлерінің мәйітін тасымалдауға дайындауға, мәйітті тасымалдауға, жерлеуге, құлпытас жасау мен орнатуға байланысты шығыстарды өтеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2024 жылғы 26 ақпандағы № 47/қе бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/228351/rus
