title:
  rus: Об утверждении норм снабжения вещевым имуществом военнослужащих Пограничной службы, органов военной контрразведки и военной полиции Комитета национальной безопасности Республики Казахстан на мирное время
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің, әскери қарсы барлау және әскери полициясы органдарының әскери қызметшілерін заттай мүлікпен жабдықтаудың бейбіт уақытқа арналған нормаларын бекіту туралы
