  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 22 мая 2015 года № 37/ДСП «Об утверждении норм снабжения вещевым имуществом военнослужащих Пограничной службы, органов военной контрразведки и военной полиции Комитета национальной безопасности Республики Казахстан на мирное время»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің, әскери қарсы барлау және әскери полициясы органдарының әскери қызметшілерін заттай мүлікпен жабдықтаудың бейбiт уақытқа арналған нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 22 мамырдағы № 37/ҚБП бұйрығына өзгерістер енгізу туралы
