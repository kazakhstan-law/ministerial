  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 30 января 2015 года № 4 «Об утверждении квалификационных требований и перечня документов, подтверждающих соответствие им, для осуществления деятельности в сферах обеспечения информационной безопасности и специальных технических средств, предназначенных для проведения оперативно-розыскных мероприятий»
    kaz: Ақпараттық қауіпсіздікті қамтамасыз ету және жедел іздестіру іс-шараларын жүргізуге арналған арнайы техникалық құралдар салаларында қызметті жүзеге асыру үшін бiлiктiлiк талаптарын және оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 30 қаңтардағы № 4 бұйрығына өзгерістер енгізу туралы
