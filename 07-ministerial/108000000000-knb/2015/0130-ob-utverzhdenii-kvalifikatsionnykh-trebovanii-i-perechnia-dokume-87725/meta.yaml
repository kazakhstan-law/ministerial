title:
  rus: Об утверждении квалификационных требований и перечня документов, подтверждающих соответствие им, для осуществления деятельности в сферах обеспечения информационной безопасности и специальных технических средств, предназначенных для проведения оперативно-розыскных мероприятий
  kaz: Ақпараттық қауіпсіздікті қамтамасыз ету және жедел іздестіру іс-шараларын жүргізуге арналған арнайы техникалық құралдар салаларында қызметті жүзеге асыру үшін біліктілік талаптарын және оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы
