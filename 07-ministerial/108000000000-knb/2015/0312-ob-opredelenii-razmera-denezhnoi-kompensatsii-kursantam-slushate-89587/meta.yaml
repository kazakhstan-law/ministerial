  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 12 марта 2015 года № 10 «Об определении размера денежной компенсации курсантам первых и вторых курсов специальных (военных) учебных заведений органов национальной безопасности Республики Казахстан за почтовые отправления»
    kaz: «Қазақстан Республикасының ұлттық қауіпсіздік органдары арнаулы (әскери) оқу орындарының бірінші және екінші курстар курсанттарына пошталық жөнелтілімдері үшін қаржылай өтемақының мөлшерін белгілеу туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 12 наурыздағы № 10 бұйрығына өзгерістер енгізу туралы
