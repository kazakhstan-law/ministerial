title:
  rus: Об определении размера денежной компенсации курсантам, слушателям первых и вторых курсов военных, специальных учебных заведений органов национальной безопасности Республики Казахстан за почтовые отправления
  kaz: Қазақстан Республикасының ұлттық қауіпсіздік органдары әскери, арнаулы оқу орындарының бірінші және екінші курстар курсанттарына, тыңдаушыларына пошталық жөнелтілімдері үшін қаржылай өтемақының мөлшерін белгілеу туралы
