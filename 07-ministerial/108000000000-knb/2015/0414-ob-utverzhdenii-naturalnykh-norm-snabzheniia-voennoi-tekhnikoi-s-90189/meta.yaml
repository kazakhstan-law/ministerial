  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 14 апреля 2015 года № 25 дсп «Об утверждении натуральных норм снабжения военной техникой, снаряжением и оборудованием авиационных частей Пограничной службы Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметі авиациясы әскери техникасының, керек-жарағы мен жабдығының заттай нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 14 сәуірдегі № 25 қбп бұйрығына өзгерістер енгізу туралы
