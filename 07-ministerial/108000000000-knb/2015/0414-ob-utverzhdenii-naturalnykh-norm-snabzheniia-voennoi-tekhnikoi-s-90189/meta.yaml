title:
  rus: Об утверждении натуральных норм снабжения военной техникой, снаряжением и оборудованием авиационных частей Пограничной службы Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметі авиациясы әскери техникасының, керек-жарағы мен жабдығының заттай нормаларын бекіту туралы
