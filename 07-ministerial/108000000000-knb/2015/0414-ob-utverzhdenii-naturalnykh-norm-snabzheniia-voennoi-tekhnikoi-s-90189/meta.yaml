  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 14 апреля 2015 года № 25 дсп «Об утверждении натуральных норм снабжения военной техникой, снаряжением и оборудованием Авиационной службы Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Авиация қызметін әскери техникамен, құрал-сайманмен және жабдықпен жабдықтаудың заттай нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 14 сәуірдегі № 25/ҚБП бұйрығына өзгеріс енгізу туралы
