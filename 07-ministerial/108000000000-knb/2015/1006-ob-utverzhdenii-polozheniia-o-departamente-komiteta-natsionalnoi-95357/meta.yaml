  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 6 октября 2015 года № 80 «Об утверждении Положения о Департаменте Комитета национальной безопасности Республики Казахстан по Павлодарской области»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Павлодар облысы бойынша департаменті туралы ережені бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 6 қазандағы № 80 бұйрығына өзгеріс енгізу туралы
