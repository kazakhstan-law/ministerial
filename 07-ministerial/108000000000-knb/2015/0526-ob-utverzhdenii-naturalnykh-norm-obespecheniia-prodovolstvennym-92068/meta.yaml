  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 26 мая 2015 года № 40 «Об утверждении натуральных норм обеспечения продовольственным пайком отдельных категорий сотрудников органов национальной безопасности Республики Казахстан с учетом особенностей прохождения службы»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының жекелеген санаттағы қызметкерлерін қызметті өткеру ерекшеліктерін ескере отырып, азық-түлік үлесімен қамтамасыз етудің заттай нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 26 мамырдағы № 40 бұйрығына өзгеріс енгізу туралы
