act_code: '92068'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 26 мая 2015 года № 40. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 июня 2015 года № 11442. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 20 февраля 2026 года № 9/қе (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм обеспечения продовольственным пайком отдельных категорий сотрудников органов национальной безопасности Республики Казахстан с учетом особенностей прохождения службы
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының жекелеген санаттағы қызметкерлерін қызметті өткеру ерекшеліктерін ескере отырып, азық-түлік үлесімен қамтамасыз етудің заттай нормаларын бекіту туралы
