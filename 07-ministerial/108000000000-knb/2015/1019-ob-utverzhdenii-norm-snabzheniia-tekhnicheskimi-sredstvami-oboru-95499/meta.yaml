requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 19 октября 2015 года № 87/ДСП. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 ноября 2015 года № 12272. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 27 июня 2017 года № 39/дсп
title:
  rus: Об утверждении норм снабжения техническими средствами, оборудованием и иным имуществом подразделений органов национальной безопасности Республики Казахстан, осуществляющих меры безопасности защищаемых лиц
  kaz: Қорғалатын тұлғалардың қауіпсіздік шараларын асырушы Қазақстан Республикасы ұлттық қауіпсіздік органдарының бөлімшелерін техникалық құралдармен, жабдықпен және өзге де мүлікпен жабдықпен нормаларын бекіту туралы
