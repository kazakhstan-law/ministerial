requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 24 февраля 2015 года № 7 ДСП. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 марта 2015 года № 10556. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 1 августа 2024 года № 109/қбп
title:
  rus: Об утверждении описания и формы пенсионных удостоверений получателей пенсионных выплат из числа сотрудников и военнослужащих органов национальной безопасности Республики Казахстан и Правил их выдачи и использования
  kaz: Қазақстан Республикасының ұлттық қауіпсіздік органдары қызметкерлері мен әскери қызметшілерінің қатарынан зейнетақы төлемдерін алушылардың зейнеткерлік куәліктерінің сипаты мен нысаны және олардың берілуі мен қолданылу қағидаларын бекіту туралы
