requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 26 октября 2015 года № 92 ДСП. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 января 2016 года № 12875. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 29 апреля 2021 года № 45/қбп (вводится в действие со дня государственной регистрации)
title:
  rus: Об утверждении Правил военно-медицинского (медицинского) обеспечения в военно-медицинских (медицинских) подразделениях органов национальной безопасности Республики Казахстан и Правил оказания медицинской помощи в военно-медицинских (медицинских) подразделениях органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскері-медициналық (медициналық) бөлімшелерде әскері-медициналық (медициналық) қамтамасыз ету қағидаларын және Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскері-медициналық (медициналық) бөлімшелерде медициналық көмек көрсету қағидаларын бекіту туралы
