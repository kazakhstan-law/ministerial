  title:
    rus: О внесении изменений и дополнения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 26 октября 2015 года № 92/ҚБП «Об утверждении Правил военно-медицинского (медицинского) обеспечения в военно-медицинских (медицинских) подразделениях органов национальной безопасности Республики Казахстан и Правил оказания медицинской помощи в военно-медицинских (медицинских) подразделениях органов национальной безопасности Республики Казахастан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери-медициналық (медициналық) бөлімшелерінде әскери-медициналық (медициналық) қамтамасыз ету қағидаларын және Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери-медициналық (медициналық) бөлімшелерінде медициналық көмек көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 26 қазандағы № 92/ҚБП бұйрығына өзгерістер мен толықтыру енгізу туралы
