  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 26 мая 2015 года № 41 «Об утверждении норм обеспечения специальной формой одежды и другим вещевым имуществом сотрудников органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлерін арнаулы киім нысандарымен және басқа да заттай мүлікпен қамтамасыз ету нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 26 мамырдағы № 41 бұйрығына өзгерістер енгізу туралы
