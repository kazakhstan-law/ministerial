act_code: '93519'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 26 мая 2015 года № 41. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июНя 2015 года № 11500. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 20 февраля 2026 года № 9/қе (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм обеспечения специальной формой одежды и другим вещевым имуществом сотрудников органов национальной безопасности Республики Казахстан с учетом особенностей прохождения службы
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлерін қызметті өткеру ерекшеліктерін ескере отырып, арнаулы киім нысандарымен және басқа да заттай мүлікпен қамтамасыз ету нормаларын бекіту туралы
