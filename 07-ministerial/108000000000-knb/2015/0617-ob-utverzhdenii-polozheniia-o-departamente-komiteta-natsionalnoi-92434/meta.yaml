  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 17 июня 2015 года № 50 «Об утверждении Положения о Департаменте Комитета национальной безопасности Республики Казахстан по Жамбылской области»
    kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Жамбыл облысы бойынша департаменті туралы ережені бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 17 маусымдағы № 50 бұйрығына өзгерістер енгізу туралы
