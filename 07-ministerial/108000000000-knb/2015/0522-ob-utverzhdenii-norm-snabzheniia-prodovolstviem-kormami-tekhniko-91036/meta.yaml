  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 22 мая 2015 года № 38/ДСП «Об утверждении норм снабжения продовольствием, кормами, техникой, оборудованием и столово-кухонной посудой военнослужащих органов национальной безопасности Республики Казахстан на мирное время»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери қызметшілерін азық-түлікпен, азықпен, техникамен, жабдықпен және асханалық-ас үйлік ыдыспен жабдықтаудың бейбіт уақытқа арналған нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 22 мамырдағы № 38/ҚБП бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/221802/rus
