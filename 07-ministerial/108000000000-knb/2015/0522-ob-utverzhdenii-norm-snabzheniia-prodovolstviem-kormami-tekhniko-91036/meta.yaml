title:
  rus: Об утверждении норм снабжения продовольствием, кормами, техникой, оборудованием и столово-кухонной посудой Пограничной службы, органов военной контрразведки и военной полиции Комитета национальной безопасности Республики Казахстан на мирное время
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Шекара қызметін, әскери қарсы барлау және әскери полициясы органдарын азық-түлікпен, азықпен, техникамен, жабдықпен және асханалық ас-үйлік ыдыспен жабдықтаудың бейбіт уақытқа арналған нормаларын бекіту туралы
