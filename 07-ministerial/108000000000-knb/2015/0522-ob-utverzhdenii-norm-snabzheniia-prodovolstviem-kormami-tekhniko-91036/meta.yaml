  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 22 мая 2015 года № 38/ДСП «Об утверждении норм снабжения продовольствием, кормами, техникой, оборудованием и столово-кухонной посудой Пограничной службы, органов военной контрразведки и военной полиции Комитета национальной безопасности на мирное время»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметін, әскери қарсы барлау және әскери полиция органдарын азық-түлiкпен, азықпен, техникамен, жабдықпен және асханалық-ас үйлік ыдыспен жабдықтаудың бейбiт уақытқа арналған нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 22 мамырдағы № 38/ҚБП бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/152531/rus
