  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 12 июня 2015 года № 47 «Об утверждении натуральных норм снабжения Пограничной службы и Пограничной академии Комитета национальной безопасности Республики Казахстан техническими средствами воспитания и другим культурно-просветительным имуществом, канцелярскими принадлежностями, комплектами полиграфического оборудования»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Шекара қызметін және Шекара академиясын техникалық тәрбие құралдарымен және басқа да мәдени-ағартушылық мүлікпен, кеңсе жабдықтарымен, полиграфиялық жабдық жиынтықтарымен жабдықтаудың заттай нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 12 маусымдағы № 47 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/209525/rus
