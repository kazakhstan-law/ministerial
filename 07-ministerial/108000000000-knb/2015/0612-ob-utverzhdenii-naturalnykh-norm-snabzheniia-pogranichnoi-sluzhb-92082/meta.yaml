  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 12 июня 2015 года № 47 «Об утверждении натуральных норм снабжения техническими средствами воспитания и другим культурно-просветительным имуществом, комплектами полиграфического оборудования типографий Пограничной службы и Пограничной академии Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Шекара қызметін және Шекара академиясын техникалық тәрбие құралдарымен және басқа да мәдени-ағартушылық мүлікпен, баспаханалардың полиграфиялық жабдықтары жиынтықтарымен жабдықтаудың заттай нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 12 маусымдағы № 47 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/175662/rus
