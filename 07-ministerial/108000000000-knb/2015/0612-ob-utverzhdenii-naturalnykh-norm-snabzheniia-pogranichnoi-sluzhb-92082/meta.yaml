title:
  rus: Об утверждении натуральных норм снабжения Пограничной службы и Пограничной академии Комитета национальной безопасности Республики Казахстан техническими средствами воспитания и другим культурно-просветительным имуществом, канцелярскими принадлежностями, комплектами полиграфического оборудования
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Шекара қызметін және Шекара академиясын техникалық тәрбие құралдарымен және басқа да мәдени-ағартушылық мүлікпен, кеңсе жабдықтарымен, полиграфиялық жабдық жиынтықтарымен жабдықтаудың заттай нормаларын бекіту туралы
