requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 16 ноября 2015 года № 99/ҚБПҮ. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 декабря 2015 года № 12400. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 13 мая 2025 года № 49/қе (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении фасона и расцветки полевой формы одежды военнослужащих и расцветки повседневно-полевой формы одежды сотрудников органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдары қызметкерлерінің күнделікті-далалық киім нысандарының түстерін және әскери қызметшілерінің далалық киім нысанының үлгісі мен түстерін бекіту туралы
