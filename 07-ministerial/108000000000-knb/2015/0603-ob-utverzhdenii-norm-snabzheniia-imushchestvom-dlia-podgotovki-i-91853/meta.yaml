  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 3 июня 2015 года № 45 «Об утверждении норм снабжения имуществом для подготовки и содержания служебных животных в Пограничной службе Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Шекара қызметінде қызметтік жануарларды дайындау және күтіп ұстау үшін мүлікпен жабдықтау нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 3 маусымдағы № 45 бұйрығына өзгерістер енгізу туралы
