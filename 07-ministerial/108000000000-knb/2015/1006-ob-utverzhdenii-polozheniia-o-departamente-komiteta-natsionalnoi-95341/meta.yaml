  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 6 октября 2015 года № 78 «Об утверждении Положения о Департаменте Комитета национальной безопасности Республики Казахстан по городу Нур-Султану»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Нұр-Сұлтан қаласы бойынша департаменті туралы ережені бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 6 қазандағы № 78 бұйрығына өзгерістер енгізу туралы
