  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 28 апреля 2015 года № 30 «Об утверждении стандартов государственных услуг, оказываемых Комитетом национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті көрсететін мемлекеттік қызмет стандарттарын бекіту туралы» 2015 жылғы 28 сәуірдегі Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының № 30 бұйрығына өзгерістер мен толықтырулар енгізу туралы
