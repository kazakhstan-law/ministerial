  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 2 июля 2015 года № 57 «Об утверждении норм снабжения ветеринарным имуществом и оборудованием Пограничной службы и Пограничной академии Комитета национальной безопасности Республики Казахстан на мирное время»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Шекара қызметін және Шекара академиясын бейбіт уақытқа арналған ветеринарлық мүлікпен және жабдықпен жабдықтау нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 2 шілдедегі № 57 бұйрыққа өзгерістер енгізу туралы
