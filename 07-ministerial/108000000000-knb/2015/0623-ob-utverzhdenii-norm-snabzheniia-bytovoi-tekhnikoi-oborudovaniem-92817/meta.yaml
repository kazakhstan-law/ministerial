  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 23 июня 2015 года № 52 «Об утверждении норм снабжения бытовой техникой, оборудованием и инвентарным имуществом органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасының ұлттық қауіпсіздік органдарын тұрмыстық техникамен, құрал-жабдықтармен және мүккәммал мүліктермен жабдықтаудың нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 23 маусымдағы № 52 бұйрығына өзгерістер енгізу туралы
