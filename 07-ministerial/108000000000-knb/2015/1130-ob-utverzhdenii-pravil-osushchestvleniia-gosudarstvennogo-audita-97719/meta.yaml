  title:
    rus: О внесении изменений и дополнения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 30 ноября 2015 года № 101/ДСП «Об утверждении Правил осуществления государственного аудита и финансового контроля в органах национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасының ұлттық қауіпсіздік органдарында мемлекеттік аудитті және қаржылық бақылауды жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 30 қарашадағы № 101/ҚБП бұйрығына өзгерістер мен толықтыру енгізу туралы
