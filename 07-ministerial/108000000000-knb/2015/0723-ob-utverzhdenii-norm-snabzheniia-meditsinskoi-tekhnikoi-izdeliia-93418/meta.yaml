  title:
    rus: О внесении дополнения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 23 июля 2015 года № 59/ДСП «Об утверждении норм снабжения медицинской техникой, изделиями медицинского назначения и имуществом органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасының ұлттық қауіпсіздік органдарын медициналық техникалармен, медициналы мақсаттағы бұйымдармен және мүліктермен жабдықтаудың нормаларын бекіту туралы» Қазақстан Республикасының Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 23 шілдедегі № 59/ҚБП бұйрығына толықтыру енгізу туралы
