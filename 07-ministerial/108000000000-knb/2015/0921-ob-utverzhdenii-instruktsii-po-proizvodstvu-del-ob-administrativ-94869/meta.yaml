  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 21 сентября 2015 года № 74/ДСП «Об утверждении Инструкции по производству дел об административных правонарушениях в органах национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарында әкімшілік құқық бұзушылықтар туралы іс жүргізу жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 21 қыркүйектегі № 74/ҚБП бұйрығына өзгерістер мен толықтырулар енгізу туралы
