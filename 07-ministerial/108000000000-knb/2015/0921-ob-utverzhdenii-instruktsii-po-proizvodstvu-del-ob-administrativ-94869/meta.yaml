title:
  rus: 'Об утверждении Инструкции по производству дел об административных правонарушениях в органах национальной безопасности Республики Казахстан '
  kaz: Қазақстан Республикасының ұлттық қауіпсіздік органдарында әкімшілік құқық бұзушылықтар туралы іс жүргізу жөніндегі нұсқаулықты бекіту туралы
