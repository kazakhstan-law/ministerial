title:
  rus: 'Об утверждении норм снабжения медицинской техникой, изделиями медицинского назначения и имуществом лечебных и диагностических помещений военно-медицинских подразделений Пограничной службы Комитета Национальной Безопасности Республики Казахстан '
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметі әскери-медициналық бөлімшелерінің емдеу және диагностикалық орын-жайларын медициналық техникамен, медициналық мақсаттағы бұйымдармен және мүлікпен жабдықтау нормаларын бекіту туралы
