  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 14 октября 2015 года № 86/ДСП «Об утверждении норм снабжения медицинской техникой, изделиями медицинского назначения и имуществом лечебных и диагностических помещений военно-медицинских подразделений Пограничной службы Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің әскери-медициналық бөлімшелерінің емдеу және диагностикалық орын-жайларын медициналық техникамен, медициналық мақсаттағы бұйымдармен және мүлікпен жабдықтау нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 14 қазандағы № 86/ҚБП бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/221759/rus
