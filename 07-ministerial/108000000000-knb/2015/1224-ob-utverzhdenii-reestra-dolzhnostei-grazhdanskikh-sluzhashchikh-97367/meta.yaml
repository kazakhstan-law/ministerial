  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 24 декабря 2015 года № 107 «Об утверждении Реестра должностей гражданских служащих в органах национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының азаматтық қызметшілері лауазымдарының тізілімін бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 24 желтоқсандағы № 107 бұйрығына өзгерістер енгізу туралы
