title:
  rus: Об утверждении норм выплаты денежной компенсации взамен продовольственного пайка курсантам, слушателям военных, специальных учебных заведений органов национальной безопасности Республики Казахстан при убытии в отпуск
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдары әскери, арнаулы оқу орындарының курсанттарына, тыңдаушыларына олар демалысқа кеткенде азық-түлік сыбағасының орнына ақшалай өтемақы төлеу нормаларын бекіту туралы
