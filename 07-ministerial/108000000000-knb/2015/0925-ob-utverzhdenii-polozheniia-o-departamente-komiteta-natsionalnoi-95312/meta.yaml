  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 25 сентября 2015 года № 76 «Об утверждении Положения о Департаменте Комитета национальной безопасности Республики Казахстан по Актюбинской области»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Ақтөбе облысы бойынша департаменті туралы ережені бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 25 қыркүйектегі № 76 бұйрығына өзгерістер енгізу туралы
