title:
  rus: Об утверждении натуральных норм снабжения мебелью и казарменным инвентарем Пограничной службы, Пограничной академии, Авиационной службы, органов военной контрразведки и военной полиции Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Шекара қызметін, Шекара академиясын, Авиация қызметін, әскери қарсы барлау және әскери полиция органдарын жиһазбен және казармалық мүкәммалмен жабдықтаудың заттай нормаларын бекіту туралы
