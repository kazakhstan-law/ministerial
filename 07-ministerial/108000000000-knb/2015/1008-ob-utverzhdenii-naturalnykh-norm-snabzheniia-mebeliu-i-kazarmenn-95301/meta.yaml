  requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 10 февраля 2021 года № 13/қе. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 февраля 2021 года № 22204. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 28 апреля 2025 года № 31/қе (вводится в действие со дня его подписания)
  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 8 октября 2015 года № 83 «Об утверждении натуральных норм снабжения мебелью и казарменным инвентарем соединений, частей, учреждений и военных учебных заведений Пограничной службы, органов военной контрразведки и военной полиции Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің әскери құралымдарын, бөлімдерін, мекемелерін және әскери оқу орындарын, әскери қарсы барлау және әскери полиция органдарын жиһазбен және казармалық мүкәммалмен жабдықтаудың заттай нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 8 қазандағы № 83 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/152839/rus
