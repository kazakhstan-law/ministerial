  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 27 апреля 2015 года № 28 «Об утверждении Положения о Департаменте Комитета национальной безопасности Республики Казахстан по Мангистауской области»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Маңғыстау облысы бойынша департаментінің ережесін бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 27 сәуірдегі № 28 бұйрығына өзгеріс енгізу туралы
