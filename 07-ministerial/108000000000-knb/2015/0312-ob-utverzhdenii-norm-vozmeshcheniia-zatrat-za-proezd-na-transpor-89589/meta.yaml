  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 12 марта 2015 года № 11 «Об утверждении норм возмещения сотрудникам органов национальной безопасности Республики Казахстан и членам их семей затрат за проезд на транспорте по территории Республики Казахстан и перевозку имущества»
    kaz: «Қазақстан Республикасының ұлттық қауіпсіздік органдары қызметкерлері мен олардың отбасы мүшелеріне мүлікті тасымалдау және Қазақстан Республикасының аумағында көлікпен жол жүру шығындарын өтеу нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 12 наурыздағы № 11 бұйрығына өзгерістер енгізу туралы
