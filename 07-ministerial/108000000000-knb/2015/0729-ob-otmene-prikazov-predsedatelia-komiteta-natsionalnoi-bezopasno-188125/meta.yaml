act_code: '188125'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 29 июля 2015 года № 63нс
title:
  rus: Об отмене приказов Председателя Комитета национальной безопасности Республики Казахстан от 26 марта 2008 года № 45 «О гражданских служащих органов национальной безопасности Республики Казахстан» и от 8 апреля 2008 года № 55 «Об утверждении Правил исчисления стажа работы по специальности для работников государственных учреждений системы органов национальной безопасности Республики Казахстан»
  kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының азаматтық қызметшілері туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2008 жылғы 26 наурыздағы № 45 және «Қазақстан Республикасы ұлттық қауіпсіздік органдары жүйесі мемлекеттік мекемелерінің қызметкерлері үшін мамандығы бойынша жұмыс өтілін есептеу Ережелерін бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2008 жылғы 8 сәуірдегі № 55 бұйрықтарының күшін жою туралы
