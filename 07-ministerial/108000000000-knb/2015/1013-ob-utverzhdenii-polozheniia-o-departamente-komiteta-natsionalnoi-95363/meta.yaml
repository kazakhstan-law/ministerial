  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 13 октября 2015 года № 84 «Об утверждении Положения о Департаменте Комитета национальной безопасности Республики Казахстан по Западно-Казахстанской области»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Батыс Қазақстан облысы бойынша департаменті туралы ережені бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2015 жылғы 13 қазандағы № 84 бұйрығына өзгерістер енгізу туралы
