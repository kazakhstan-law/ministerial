title:
  rus: Об утверждении цен на товары (работы, услуги) военных, специальных учебных заведений органов национальной безопасности Республики Казахстан, предоставляемые на платной основе
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдары әскери, арнаулы оқу орындарының ақылы негізде берілетін тауарларына (жұмыстарына, көрсетілетін қызметтеріне) бағаларды бекіту туралы
