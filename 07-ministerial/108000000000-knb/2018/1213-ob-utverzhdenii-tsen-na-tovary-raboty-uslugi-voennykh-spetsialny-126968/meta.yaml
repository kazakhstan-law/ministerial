    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 13 декабря 2018 года № 102/қе «Об утверждении цен на товары (работы, услуги) военных, специальных учебных заведений органов национальной безопасности Республики Казахстан, предоставляемые на платной основе»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдары әскери, арнаулы оқу орындарының ақылы негізде берілетін тауарларына (жұмыстарына, көрсетілетін қызметтеріне) бағаларды бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2018 жылғы 13 желтоқсандағы № 102/қе бұйрығына өзгерістер енгізу туралы
