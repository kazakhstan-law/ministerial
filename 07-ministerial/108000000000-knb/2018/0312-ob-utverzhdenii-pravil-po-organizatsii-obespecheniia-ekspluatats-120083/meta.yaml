act_code: '120083'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 12 марта 2018 года № 11/дсп. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 марта 2018 года № 16659
title:
  rus: Об утверждении Правил по организации обеспечения, эксплуатации и хранения вооружения и средств радиационной, химической и бактериологической защиты в объединениях, соединениях, воинских частях, военно-учебном заведении и структурных подразделениях Пограничной службы Комитета национальной безопаcности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің бірлестіктерінде, құрамаларында, әскери бөлімдерінде, әскери оқу орнында және құрылымдық бөлімшелерінде қарумен және радиациялық, химиялық және бактериялық қорғану құралдарымен қамтамасыз ету, оны пайдалану және сақтау қағидаларын бекіту туралы
