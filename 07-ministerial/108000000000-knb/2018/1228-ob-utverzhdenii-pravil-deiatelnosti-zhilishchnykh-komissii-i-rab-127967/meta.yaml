title:
  rus: Об утверждении Правил деятельности жилищных комиссий и работы информационной системы органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының тұрғын үй комиссиялары қызметінің және ақпараттық жүйесінің жұмыс істеу қағидаларын бекіту туралы
