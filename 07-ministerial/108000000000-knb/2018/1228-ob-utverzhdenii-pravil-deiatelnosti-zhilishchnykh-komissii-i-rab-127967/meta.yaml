  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 7 сентября 2016 года № 62 «О некоторых вопросах труда работников органов национальной безопасности Республики Казахстан» и внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 28 декабря 2018 года № 110/қе «Об утверждении Правил деятельности жилищных комиссий и работы информационной системы органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының жұмыскерлері еңбегінің кейбір мәселелері туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2016 жылғы 7 қыркүйектегі № 62 бұйрығына өзгеріс енгізу және «Қазақстан Республикасы ұлттық қауіпсіздік органдарының тұрғын үй комиссиялары қызметінің және ақпараттық жүйесінің жұмыс істеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2018 жылғы 28 желтоқсандағы № 110/қе бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/226960/rus
