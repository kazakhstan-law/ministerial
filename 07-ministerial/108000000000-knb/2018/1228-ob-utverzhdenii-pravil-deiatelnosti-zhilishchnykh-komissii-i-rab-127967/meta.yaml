    rus: О внесении изменений и дополнений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 28 декабря 2018 года № 110/қе «Об утверждении Правил деятельности жилищных комиссий органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының тұрғын үй комиссиялары қызметінің қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2018 жылғы 28 желтоқсандағы № 110/қе бұйрығына өзгерістер мен толықтырулар енгізу туралы
