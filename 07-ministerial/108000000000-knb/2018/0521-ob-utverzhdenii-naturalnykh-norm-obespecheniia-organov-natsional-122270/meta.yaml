  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 21 мая 2018 года № 37/ҚБП «Об утверждении натуральных норм обеспечения органов национальной безопасности Республики Казахстан несекретной телефонной связью»
    kaz: «Қазақстан Республикасының ұлттық қауіпсіздік органдарын құпия емес телефондық байланыспен қамтамасыз етудің заттай нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2018 жылғы 21 мамырдағы № 37/ҚБП бұйрығына өзгеріс енгізу туралы
