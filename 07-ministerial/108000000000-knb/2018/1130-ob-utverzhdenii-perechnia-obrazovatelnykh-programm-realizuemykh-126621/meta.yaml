  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 30 ноября 2018 года № 96/қбп «Об утверждении Перечня образовательных программ, реализуемых в военных, специальных учебных заведениях органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери, арнаулы оқу орындарында іске асырылатын білім беру бағдарламаларының тізбесін бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2018 жылғы 30 қарашадағы № 96/қбп бұйрығына өзгеріс енгізу туралы
