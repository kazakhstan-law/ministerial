  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 19 апреля 2018 года № 34/дсп «Об утверждении Правил организации технической эксплуатации сетей телекоммуникаций специального назначения в органах национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасының ұлттық қауіпсіздік органдарында арнаулы мақсаттағы телекоммуникация желілерін техникалық пайдалануды ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2018 жылғы 19 сәуірдегі № 34/қбп бұйрығына өзгерістер енгізу туралы»
