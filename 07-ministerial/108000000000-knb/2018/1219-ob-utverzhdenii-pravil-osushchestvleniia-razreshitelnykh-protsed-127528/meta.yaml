  rus: Об утверждении Правил осуществления разрешительных процедур и Разрешительных требований по выдаче разрешения на реализацию (в том числе иную передачу) средств криптографической защиты информации и перечня документов, подтверждающих соответствие им
  kaz: Рұқсат беру рәсімдерін жүзеге асыру қағидаларын және Ақпаратты криптографиялық қорғау құралдарын өткізуге (оның ішінде өзгеше беруге) рұқсатты беру бойынша рұқсат беру талаптарын және оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы
