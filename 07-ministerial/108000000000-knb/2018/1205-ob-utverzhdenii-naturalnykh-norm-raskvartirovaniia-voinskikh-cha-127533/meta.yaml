  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 5 декабря 2018 года № 99/ДСП «Об утверждении натуральных норм расквартирования воинских частей, Академии Пограничной службы Комитета национальной безопасности Республики Казахстан, органов военной полиции и военной контрразведки Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің әскери бөлімдерін, академиясын, Қазақстан Республикасы Ұлттық қауіпсіздік комитеті әскери полициясы және әскери қарсы барлау органдарын пәтерге орналастырудың заттай нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2018 жылғы 5 желтоқсандағы № 99/ҚБП бұйрығына өзгерістер мен толықтырулар енгізу туралы
