title:
  rus: Об утверждении натуральных норм расквартирования воинских частей, академии Пограничной службы Комитета национальной безопасности Республики Казахстан, органов военной полиции и военной контрразведки Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің әскери бөлімдерін, академиясын, Қазақстан Республикасы Ұлттық қауіпсіздік комитеті әскери полициясы және әскери қарсы барлау органдарын пәтерге орналастырудың заттай нормаларын бекіту туралы
