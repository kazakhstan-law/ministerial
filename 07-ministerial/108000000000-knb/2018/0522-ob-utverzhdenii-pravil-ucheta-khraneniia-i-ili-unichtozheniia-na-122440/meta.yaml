title:
  rus: Об утверждении Правил учета, хранения и (или) уничтожения находящихся в ведении органов национальной безопасности Республики Казахстан экземпляров паспортов антитеррористической защищенности объектов, уязвимых в террористическом отношении
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының қарамағындағы террористік тұрғыдан осал объектілердің терроризмнен қорғалу паспорттарының даналарын есепке алу, сақтау және (немесе) жою қағидаларын бекіту туралы
