  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 22 мая 2018 года № 40/ДСП «Об утверждении Правил учета, хранения и (или) уничтожения находящихся в ведении органов национальной безопасности Республики Казахстан экземпляров паспортов антитеррористической защищенности объектов, уязвимых в террористическом отношении»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының қарамағындағы террористік тұрғыдан осал объектілердің терроризмнен қорғалу паспорттарының даналарын есепке алу, сақтау және (немесе) жою қағидаларын бекіту туралы»  Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2018 жылғы 22 мамырдағы № 40/ҚБП бұйрығына өзгерістер енгізу туралы
