  title:
    rus: О внесении изменений и дополнений в приказы Председателя Комитета национальной безопасности Республики Казахстан от 13 декабря 2018 года № 101/қе «Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) военными, специальными учебными заведениями органов национальной безопасности Республики Казахстан и расходования ими денег от реализации товаров (работ, услуг)» и от 13 декабря 2018 года № 102/қе «Об утверждении цен на товары (работы, услуги) военных, специальных учебных заведений органов национальной безопасности Республики Казахстан, предоставляемые на платной основе»
    kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының «Қазақстан Республикасы ұлттық қауіпсіздік органдары әскери, арнаулы оқу орындарының тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізу жөніндегі ақылы қызмет түрлерін көрсету және олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсау қағидаларын бекіту туралы» 2018 жылғы 13 желтоқсандағы № 101/қе және «Қазақстан Республикасы ұлттық қауіпсіздік органдары әскери, арнаулы оқу орындарының ақылы негізде берілетін тауарларына (жұмыстарына, көрсетілетін қызметтеріне) бағаларды бекіту туралы» 2018 жылғы 13 желтоқсандағы № 102/қе бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
