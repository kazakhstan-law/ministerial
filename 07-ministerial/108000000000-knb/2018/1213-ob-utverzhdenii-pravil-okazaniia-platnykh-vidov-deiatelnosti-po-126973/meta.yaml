  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 13 декабря 2018 года № 101/қе «Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) военными, специальными учебными заведениями органов национальной безопасности Республики Казахстан и расходования ими денег от реализации товаров (работ, услуг)»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдары әскери, арнаулы оқу орындарының тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізу жөніндегі ақылы қызмет түрлерін көрсету және олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2018 жылғы 13 желтоқсандағы № 101/қе бұйрығына өзгеріс енгізу туралы
