  title:
    rus: О внесении изменений и дополнения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 7 августа 2018 года № 64 «Об утверждении положений о территориальных органах Комитета национальной безопасности Республики Казахстан»
    kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің аумақтық органдары туралы ережелерді бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2018 жылғы 7 тамыздағы № 64 бұйрығына өзгерістер мен толықтырулар енгізу туралы
