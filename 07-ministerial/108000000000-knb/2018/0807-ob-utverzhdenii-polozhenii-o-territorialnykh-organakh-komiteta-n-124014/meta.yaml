    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің аумақтық органдары туралы ережелерді бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2018 жылғы 7 тамыздағы № 64 бұйрығына өзгеріс енгізу туралы
