act_code: '41501'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 30 июля 2008 года № 107. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 сентября 2008 года № 5302. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 25 августа 2011 года № 332
title:
  rus: Об утверждении Стандарта оказания государственной услуги "Апостилирование архивных справок и копий архивных документов, исходящих из Специального государственного архива Комитета национальной безопасности Республики Казахстан"
  kaz: '"Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Арнайы мемлекеттік мұрағатынан шығатын мұрағаттық анықтамаларға және мұрағаттық құжаттардың көшірмелеріне апостиль қою" бойынша мемлекеттік қызмет көрсету стандартын бекіту туралы'
