requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 15 февраля 2008 года N 28. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 марта 2008 года N 5166. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 7 сентября 2013 года № 430
title:
  rus: Об утверждении Инструкции по организации лицензионной работы органов национальной безопасности Республики Казахстан в сфере специальных технических средств для проведения оперативно-розыскных мероприятий
  kaz: Қазақстан Республикасының ұлттық қауіпсіздік органдарында жедел іздестіру іс-шараларын өткізуге арналған арнайы техникалық құралдар саласындағы лицензиялау жұмысын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
