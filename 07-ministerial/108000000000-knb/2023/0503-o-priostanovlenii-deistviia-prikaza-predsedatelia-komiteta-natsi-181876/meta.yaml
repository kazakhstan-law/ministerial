act_code: '181876'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 3 мая 2023 года № 21/дсп. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 мая 2023 года № 32552
title:
  rus: О приостановлении действия приказа Председателя Комитета национальной безопасности Республики Казахстан от 24 февраля 2020 года № 10қбп «Об утверждении Правил осуществления процедуры подтверждения личности по дактилоскопической информации при пересечении Государственной границы Республики Казахстан и формирования, ведения базы данных дактилоскопической информации этих лиц»
  kaz: «Қазақстан Республикасының Мемлекеттік шекарасын кесіп өту кезінде дактилоскопиялық ақпарат бойынша адамның жеке басын растау рәсімін жүзеге асыру және осы адамдардың дактилоскопиялық ақпарат дерекқорын қалыптастыру, жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2020 жылғы 24 ақпандағы № 10қбп бұйрығының қолданылуын тоқтата тұру туралы
