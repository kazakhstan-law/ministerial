  title:
    rus: О внесении изменений и дополнения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 30 мая 2023 года № 34/ДСП «Об утверждении Правил организации и несения боевой службы в органах национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасының ұлттық қауіпсіздік органдарында жауынгерлік қызметті ұйымдастыру және атқару қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2023 жылғы 30 мамырдағы № 34/ҚБП бұйрығына өзгерістер және толықтыру енгізу туралы
