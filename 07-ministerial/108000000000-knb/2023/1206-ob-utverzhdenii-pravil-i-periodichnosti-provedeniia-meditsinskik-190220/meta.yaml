requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 6 декабря 2023 года № 90/ДСП. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 декабря 2023 года № 33778
title:
  rus: Об утверждении Правил и периодичности проведения медицинских осмотров соответствующего контингента в военно-медицинских (медицинских) подразделениях (организациях) органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери-медициналық (медициналық) бөлімшелерінде (ұйымдарында) тиісті контингентті медициналық қарап-тексеруді жүргізу қағидалары мен кезеңділігін бекіту туралы
