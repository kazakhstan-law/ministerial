title:
  rus: Об утверждении Правил присвоения воинского звания в порядке переаттестации сотрудникам правоохранительных и специальных государственных органов, поступившим на воинскую службу в органы национальной безопасности Республики Казахстан в порядке перевода
  kaz: Қазақстан Республикасының ұлттық қауіпсіздік органдарына ауыстыру тәртібімен әскери қызметке кірген құқық қорғау және арнаулы мемлекеттік органдардың қызметкерлеріне қайта аттестаттау тәртібімен әскери атақ беру қағидаларын бекіту туралы
