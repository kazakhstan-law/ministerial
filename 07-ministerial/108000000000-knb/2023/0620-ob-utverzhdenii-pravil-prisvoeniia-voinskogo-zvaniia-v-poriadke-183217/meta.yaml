  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 20 июня 2023 года № 48/қбп «Об утверждении Правил присвоения воинского звания в порядке переаттестации сотрудникам правоохранительных и специальных государственных органов, поступившим на воинскую службу в органы национальной безопасности Республики Казахстан в порядке перевода»
    kaz: «Қазақстан Республикасының ұлттық қауіпсіздік органдарына ауыстыру тәртібімен әскери қызметке кірген құқық қорғау және арнаулы мемлекеттік органдардың қызметкерлеріне қайта аттестаттау тәртібімен әскери атақ беру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2023 жылғы 20 маусымдағы № 48/қбп бұйрығына өзгеріс енгізу туралы
