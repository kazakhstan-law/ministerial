title:
  rus: Об утверждении Типовой инструкции по эвакуации, обеспечению сохранности и уничтожению секретных документов, дел и изделий государственных органов и организаций Республики Казахстан при возникновении кризисной ситуации
  kaz: Дағдарыстық ахуал туындаған кезде Қазақстан Республикасы мемлекеттік органдарының және ұйымдарының құпия құжаттарын, істерін және бұйымдарын эвакуациялау, сақтауды қамтамасыз ету және жою жөніндегі үлгі нұсқаулықты бекіту туралы
