  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 15 мая 2023 года №24/ДСП «Об утверждении Правил и пределов координации деятельности органов национальной безопасности Республики Казахстан по делам об административных правонарушениях»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының әкімшілік құқық бұзушылық туралы істер жөніндегі қызметін үйлестіру қағидалары мен шектерін бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2023 жылғы 15 мамырдағы №24/ҚБП бұйрығына өзгерістер мен толықтырулар енгізу туралы
