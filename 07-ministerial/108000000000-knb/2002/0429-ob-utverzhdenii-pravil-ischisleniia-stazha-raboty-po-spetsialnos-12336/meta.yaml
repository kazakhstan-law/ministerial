requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 30 апреля 2002 года N 71. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 июня 2002 года N 1871. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 8 апреля 2008 года № 55
title:
  rus: Об утверждении Правил исчисления стажа работы по специальности для работников, не являющихся военнослужащими государственных учреждений системы органов национальной безопасности Республики Казахстан и Правил установления надбавки за выслугу лет рабочим за работу в системе органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдары жүйесінің мемлекеттік мекемелердің әскери қызметшілері емес қызметкерлеріне мамандығы бойынша жұмыс стажын есептеу Ережесін және Қазақстан Респубикасы ұлттық қауіпсіздік органдары жүйесінде қызметкерлердің қызмет атқарған жылдарына үстемеақы белгілеу Ережесін бекіту туралы
