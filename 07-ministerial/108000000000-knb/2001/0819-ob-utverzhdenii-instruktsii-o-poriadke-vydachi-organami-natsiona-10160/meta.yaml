title:
  rus: Об утверждении Инструкции о порядке выдачи органами национальной безопасности Республики Казахстан разрешений на осуществление деятельности, связанной с использованием государственных секретов
  kaz: Қазақстан Республикасының Ұлттық қауіпсіздік органдарына мемлекеттік құпияларын пайдалануға байланысты қызметті жүзеге асыруға рұқсат беру тәртібі жөніндегі нұсқауды бекіту туралы
