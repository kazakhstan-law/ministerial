act_code: '140380'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 24 февраля 2020 года № 10/қбп. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 марта 2020 года № 20115. Действие приказа приостановлено приказом Председателя Комитета национальной безопасности Республики Казахстан от 25 сентября 2021 года № 99/қбп
title:
  rus: Об утверждении Правил осуществления процедуры подтверждения личности по дактилоскопической информации при пересечении Государственной границы Республики Казахстан и формирования, ведения базы данных дактилоскопической информации этих лиц
  kaz: Қазақстан Республикасының Мемлекеттік шекарасын кесіп өту кезінде дактилоскопиялық ақпарат бойынша адамның жеке басын растау рәсімін жүзеге асыру және осы адамдардың дактилоскопиялық ақпарат дерекқорын қалыптастыру, жүргізу қағидаларын бекіту туралы
