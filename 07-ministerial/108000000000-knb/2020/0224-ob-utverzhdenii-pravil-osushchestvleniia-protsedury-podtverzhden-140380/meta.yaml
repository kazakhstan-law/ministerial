  title:
    rus: О внесении изменений в приказы Председателя Комитета национальной безопасности Республики Казахстан от 30 апреля 2019 года № 26/дсп «Об утверждении Правил проведения криминалистических исследований и учета их результатов в органах национальной безопасности Республики Казахстан» и от 24 февраля 2020 года № 10/дсп «Об утверждении Правил осуществления процедуры подтверждения личности по дактилоскопической информации при пересечении Государственной границы Республики Казахстан и формирования, ведения базы данных дактилоскопической информации этих лиц»
    kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының «Қазақстан Республикасының ұлттық қауіпсіздік органдарында криминалистік зерттеулер жүргізу және олардың нәтижелерін есепке алу қағидаларын бекіту туралы» 2019 жылғы 30 сәуірдегі № 26/қбп және «Қазақстан Республикасының Мемлекеттік шекарасын кесіп өту кезінде дактилоскопиялық ақпарат бойынша адамның жеке басын растау рәсімін жүзеге асыру және осы адамдардың дактилоскопиялық ақпарат дерекқорын қалыптастыру, жүргізу қағидаларын бекіту туралы» 2020 жылғы 24 ақпандағы № 10/қбп бұйрықтарына өзгерістер енгізу туралы
