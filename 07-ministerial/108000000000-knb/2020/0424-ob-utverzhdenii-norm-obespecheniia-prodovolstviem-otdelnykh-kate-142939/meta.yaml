  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 24 апреля 2020 года № 30/ДСП «Об утверждении норм обеспечения продовольствием отдельных категорий сотрудников органов национальной безопасности Республики Казахстан с учетом особенностей прохождения службы в военное время»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының жекелеген санаттағы қызметкерлерін қызметті өткеру ерекшеліктерін ескере отырып, азық-түлікпен қамтамасыз етудің соғыс уақытына арналған нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2020 жылғы 24 сәуірдегі № 30/ҚБП бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/209738/rus
