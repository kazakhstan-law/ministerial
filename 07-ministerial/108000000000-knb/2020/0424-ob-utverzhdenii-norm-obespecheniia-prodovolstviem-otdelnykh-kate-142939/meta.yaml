requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 24 апреля 2020 года № 30/дсп. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 мая 2020 года № 20564
title:
  rus: Об утверждении норм обеспечения продовольствием отдельных категорий сотрудников органов национальной безопасности Республики Казахстан с учетом особенностей прохождения службы в военное время
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының жекелеген санаттағы қызметкерлерін қызметті өткеру ерекшеліктерін ескере отырып, азық-түлікпен қамтамасыз етудің соғыс уақытына арналған нормаларын бекіту туралы
