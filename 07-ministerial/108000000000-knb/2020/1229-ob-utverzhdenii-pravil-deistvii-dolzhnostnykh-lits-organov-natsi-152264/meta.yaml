requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 29 декабря 2020 года № 99/қбп. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 января 2021 года № 22074
title:
  rus: Об утверждении Правил действий должностных лиц органов национальной безопасности Республики Казахстан по применению оружия и боевой техники по воздушным судам-нарушителям воздушного пространства Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдары лауазымды адамдарының Қазақстан Республикасының әуе кеңістігін бұзушы әуе кемелеріне қару мен жауынгерлік техниканы қолдану жөніндегі іс-қимылдары қағидаларын бекіту туралы
