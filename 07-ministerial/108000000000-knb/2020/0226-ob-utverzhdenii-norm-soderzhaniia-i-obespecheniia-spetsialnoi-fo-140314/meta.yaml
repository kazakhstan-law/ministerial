title:
  rus: Об утверждении норм содержания и обеспечения специальной формой одежды и другим вещевым имуществом сотрудников органов национальной безопасности Республики Казахстан в военное время
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлерін арнаулы киім нысандарымен және басқа да заттай мүлікпен қамтамасыз етудің және ұстаудың соғыс уақытына арналған нормаларын бекіту туралы
