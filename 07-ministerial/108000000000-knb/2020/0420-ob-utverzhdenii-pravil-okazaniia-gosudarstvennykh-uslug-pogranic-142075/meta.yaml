  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 20 апреля 2020 года № 26/қе «Об утверждении правил оказания государственных услуг Пограничной службой Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің мемлекеттік қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2020 жылғы 20 сәуірдегі № 26/қе бұйрығына өзгерістер мен толықтырулар енгізу туралы
