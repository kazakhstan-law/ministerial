title:
  rus: Об утверждении Правил оказания государственных услуг Комитетом национальной безопасности Республики Казахстан в сферах обеспечения кибербезопасности и специальных технических средств, предназначенных для проведения оперативно-розыскных мероприятий
  kaz: Киберқауіпсіздікті қамтамасыз ету және жедел-іздестіру іс-шараларын жүргізуге арналған арнайы техникалық құралдар саласында Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің мемлекеттік қызметтер көрсету қағидаларын бекіту туралы
