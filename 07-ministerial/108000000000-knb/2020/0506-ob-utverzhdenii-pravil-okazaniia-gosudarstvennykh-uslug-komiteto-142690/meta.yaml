  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 6 мая 2020 года № 34/қе «Об утверждении Правил оказания государственных услуг Комитетом национальной безопасности Республики Казахстан в сферах обеспечения информационной безопасности и специальных технических средств, предназначенных для проведения оперативно-розыскных мероприятий»
    kaz: «Ақпараттық қауіпсіздікті қамтамасыз ету және жедел-іздестіру іс-шараларын жүргізуге арналған арнайы техникалық құралдар саласында Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің мемлекеттік қызметтер көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2020 жылғы 6 мамырдағы № 34/қе бұйрығына өзгерістер енгізу туралы
