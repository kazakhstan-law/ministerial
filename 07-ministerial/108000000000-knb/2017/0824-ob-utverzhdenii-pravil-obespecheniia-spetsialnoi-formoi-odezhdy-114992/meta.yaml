  title:
    rus: О внесении изменений в приказ временно исполняющего обязанности Председателя Комитета национальной безопасности Республики Казахстан от 24 августа 2017 года № 67/ДСП «Об утверждении Правил обеспечения специальной формой одежды и другим вещевым имуществом в органах национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарында арнаулы киім нысанымен және басқа да заттай мүлікпен қамтамасыз ету қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасы міндетін уақытша атқарушының 2017 жылғы 24 тамыздағы № 67/ҚБП бұйрығына өзгерістер енгізу туралы
