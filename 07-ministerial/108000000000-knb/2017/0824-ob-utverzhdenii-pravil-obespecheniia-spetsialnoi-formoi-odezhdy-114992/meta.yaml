  title:
    rus: О внесении изменений в приказ временно исполняющего обязанности Председателя Комитета национальной безопасности Республики Казахстан от 24 августа 2017 года № 67/ДСП «Об утверждении Правил обеспечения специальной формой одежды и другим вещевым имуществом сотрудников органов национальной безопасности Республики Казахстан с учетом особенностей прохождения службы»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлерін қызметті өткеру ерекшеліктерін ескере отырып, арнаулы киім нысанымен және басқа да заттай мүлікпен қамтамасыз ету қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының міндетін уақытша атқарушының 2017 жылғы 24 тамыздағы № 67/ҚБП бұйрығына өзгерістер енгізу туралы
