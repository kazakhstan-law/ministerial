title:
  rus: Об утверждении Правил обеспечения специальной формой одежды и другим вещевым имуществом в органах национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарында арнаулы киімнысанымен және басқа да заттай мүлікпен қаматамасыз ету қағидаларын бекіту туралы
