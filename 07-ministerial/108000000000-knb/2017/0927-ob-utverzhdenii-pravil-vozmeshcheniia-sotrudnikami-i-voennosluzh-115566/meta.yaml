title:
  rus: Об утверждении Правил возмещения сотрудниками и военнослужащими органов национальной безопасности Республики Казахстан государству бюджетных средств, затраченных на обучение в военных, специальных учебных заведениях или организациях образования иностранных государств
  kaz: Қазақстан Республикасының ұлттық қауіпсіздік органдарының қызметкерлері мен әскери қызметшілерінің әскери, арнаулы оқу орындарында немесе шет мемлекеттердің білім беру ұйымдарында оқытуға жұмсалған бюджет қаражатын мемлекетке өтеу қағидаларын бекіту туралы
