  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 27 сентября 2017 года № 85 нс «Об утверждении Правил возмещения государству бюджетных средств, затраченных на обучение военнослужащих Пограничной службы Комитета национальной безопасности Республики Казахстан в военных учебных заведениях»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің әскери қызметшілерін әскери оқу орындарында оқытуға жұмсалған бюджет қаражатын мемлекетке өтеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2017 жылғы 27 қыркүйектегі № 85 қе бұйрығына өзгерістер енгізу» туралы
