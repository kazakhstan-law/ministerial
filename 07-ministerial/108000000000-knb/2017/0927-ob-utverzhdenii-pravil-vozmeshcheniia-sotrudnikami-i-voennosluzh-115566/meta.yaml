  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 27 сентября 2017 года № 85 нс «Об утверждении Правил возмещения государству денег, затраченных на обучение военнослужащих в военных, специальных учебных заведениях органов национальной безопасности Республики Казахстан»
    kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери, арнаулы оқу орындарында әскери қызметшілерді оқытуға жұмсалған ақшаны мемлекетке өтеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2017 жылғы 27 қыркүйектегі № 85 қе бұйрығына өзгерістер енгізу туралы
