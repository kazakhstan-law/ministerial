act_code: '115124'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 26 августа 2017 года № 69 нс. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 сентября 2017 года № 15747
title:
  rus: Об утверждении Правил выплаты за счет государства военнослужащим органов национальной безопасности Республики Казахстан денег за перевозку собственного имущества в пределах Республики Казахстан
  kaz: Қазақстан Республикасының шегінде өз мүлкін тасымалдау үшін мемлекет есебінен Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери қызметшілеріне ақша төлеу қағидаларын бекіту туралы
