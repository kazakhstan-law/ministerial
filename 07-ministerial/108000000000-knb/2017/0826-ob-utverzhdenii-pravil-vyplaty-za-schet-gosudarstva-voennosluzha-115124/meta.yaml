  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 26 августа 2017 года № 69 нс «Об утверждении Правил возмещения военнослужащим органов национальной безопасности расходов за счет государства на внутриреспубликанские перевозки собственного имущества на железнодорожном, автомобильном и внутреннем водном транспорте»
    kaz: «Ұлттық қауіпсіздік органдарының әскери қызметшілеріне өз мүлкін теміржол, автомобиль және ішкі су көлігімен республикаішілік тасымалдауға жұмсалатын шығыстарды мемлекет есебінен өтеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2017 жылғы 26 тамыздағы № 69 қе бұйрығына өзгерістер енгізу туралы
