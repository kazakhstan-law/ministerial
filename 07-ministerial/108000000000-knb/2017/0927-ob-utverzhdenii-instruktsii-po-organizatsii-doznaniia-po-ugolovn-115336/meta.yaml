  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 27 сентября 2017 года № 74 «Об утверждении Инструкции по организации дознания по уголовным правонарушениям, отнесенным законодательством Республики Казахстан к ведению Пограничной службы Комитета национальной безопасности»
    kaz: «Қазақстан Республикасының заңнамасымен Ұлттық қауіпсіздік комитеті Шекара қызметінің қарауына жатқызылған қылмыстық құқық бұзушылықтар бойынша анықтауды ұйымдастыру нұсқаулығын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2017 жылғы 27 қыркүйектегі № 74 бұйрығына өзгерістер енгізу туралы
