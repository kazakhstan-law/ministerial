title:
  rus: Об утверждении Инструкции по организации дознания по уголовным правонарушениям, отнесенным законодательством Республики Казахстан к ведению Пограничной службы Комитета национальной безопасности
  kaz: Қазақстан Республикасының заңнамасымен Ұлттық қауіпсіздік комитеті Шекара қызметінің қарауына жатқызылған қылмыстық құқық бұзушылықтар бойынша анықтауды ұйымдастыру нұсқаулығын бекіту туралы
