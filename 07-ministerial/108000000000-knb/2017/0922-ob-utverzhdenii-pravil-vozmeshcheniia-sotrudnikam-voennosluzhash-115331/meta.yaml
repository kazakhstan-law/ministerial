  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 22 сентября 2017 года № 83дсп «Об утверждении Правил возмещения сотрудникам, военнослужащим и работникам органов национальной безопасности расходов на служебные командировки, в том числе в иностранные государства, а также возмещения им расходов»
    kaz: «Ұлттық қауіпсіздік органдарының қызметкерлерін, әскери қызметшілерін және жұмыскерлерін қызметтік іссапарларға, оның ішінде шет мемлекеттерге жіберу, сондай-ақ олардың шығындарын өтеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2017 жылғы 22 қыркүйектегі № 83қбп бұйрығына өзгерістер енгізу туралы
