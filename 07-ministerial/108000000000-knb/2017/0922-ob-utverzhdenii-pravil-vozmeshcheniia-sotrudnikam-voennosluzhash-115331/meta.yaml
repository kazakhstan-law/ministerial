title:
  rus: Об утверждении Правил возмещения сотрудникам, военнослужащим и работникам органов национальной безопасности расходов на служебные командировки, в том числе в иностранные государства
  kaz: Ұлттық қауіпсіздік органдарының қызметкерлеріне, әскери қызметшілеріне және жұмыскерлеріне қызметтік іссапарларға, оның ішінде шет мемлекеттерге бару шығындарын өтеу қағидаларын бекіту туралы
