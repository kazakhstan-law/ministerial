caused_by:
  code: '141151'
  requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 30 марта 2020 года № 19/қе. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 апреля 2020 года № 20276
  title:
    rus: О внесении изменения в приказ временно исполняющего обязанности Председателя Комитета национальной безопасности Республики Казахстан от 17 августа 2017 года № 64 нс «Об утверждении Правил информирования органов военной полиции Комитета национальной безопасности Республики Казахстан в системе органов национальной безопасности Республики Казахстан по вопросам, относящимся к компетенции органов военной полиции Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті әскери полициясы органдарының құзыретіне жататын мәселелер бойынша Қазақстан Республикасы ұлттық қауіпсіздік органдарының жүйесінде Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің әскери полиция органдарын хабардар ету қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының міндетін уақытша атқарушының 2017 жылғы 17 тамыздағы № 64 қе бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/141151/rus
