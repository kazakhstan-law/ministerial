act_code: '114985'
requisite: Приказ и.о. Председателя Комитета национальной безопасности Республики Казахстан от 17 августа 2017 года № 64 нс. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 сентября 2017 года № 15727
title:
  rus: Об утверждении Правил информирования органов военной полиции Комитета национальной безопасности Республики Казахстан в системе органов национальной безопасности Республики Казахстан по вопросам, относящимся к компетенции органов военной полиции Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті әскери полициясы органдарының құзыретіне жататын мәселелер бойынша Қазақстан Республикасы ұлттық қауіпсіздік органдарының жүйесінде Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің әскери полиция органдарын хабардар ету қағидаларды бекіту туралы
