title:
  rus: Об утверждении Правил организации технического обслуживания и ремонта пограничных кораблей, катеров и иных плавучих средств Пограничной службы Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің шекаралық корабльдерін, катерлерін және өзге жүзу құралдарын техникалық қамтамасыз етуді және жөндеуді ұйымдастыру қағидаларын бекіту туралы
