  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 17 июля 2017 года № 49 нс «Об утверждении Правил выплаты денежной компенсации в размере стоимости общевойскового пайка при отсутствии возможности обеспечения питанием по установленным нормам основных продовольственных пайков военнослужащим по контракту органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік комитеті органдарының келісімшарт бойынша әскери қызметшілерінің негізгі азық-түлік үлестерінің белгіленген нормалары бойынша тамақтандыруды қамтамасыз ету мүмкіндігі болмаған кезде жалпы әскери үлес құны мөлшерінде ақшалай өтемақы төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2017 жылғы 17 шілдедегі № 49 қе бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/227937/rus
