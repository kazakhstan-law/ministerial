act_code: '114215'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 17 июля 2017 года № 49 нс. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 августа 2017 года № 15487
title:
  rus: Об утверждении Правил выплаты денежной компенсации в размере стоимости общевойскового пайка при отсутствии возможности обеспечения питанием по установленным нормам основных продовольственных пайков военнослужащим, проходящим воинскую службу по контракту в органах национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарында келісімшарт бойынша әскери қызмет өткеретін әскери қызметшілерге негізгі азық-түлік үлестерінің белгіленген нормалары бойынша тамақтандырумен қамтамасыз етуге мүмкін болмаған кезде жалпы әскери үлес құны мөлшерінде ақшалай өтемақы төлеу қағидаларын бекіту туралы
