act_code: '109732'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 6 января 2017 года № 1 дсп. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 февраля 2017 года № 14775
title:
  rus: Об утверждении Методики определения размеров ущерба, который нанесен или может быть нанесен национальной безопасности Республики Казахстан или интересам органов национальной безопасности Республики Казахстан вследствие разглашения или утраты сведений, составляющих государственные секреты, а также ущерба, наносимого собственнику носителей сведений в результате их засекречивания
  kaz: Мемлекеттік құпияларды құрайтын мәліметтерді жария ету немесе жоғалту салдарынан Қазақстан Республикасының ұлттық қауіпсіздігіне немесе Қазақстан Республикасы ұлттық қауіпсіздік органдарының мүдделеріне келтірілген немесе келтірілуі мүмкін зиянның, сондай-ақ мәліметтер көздерінің иесіне оларды құпияландыру нәтижесінде келтірілетін зиянның мөлшерін айқындау әдістемесін бекіту туралы
