requisite: Приказ и.о. Председателя Комитета национальной безопасности Республики Казахстан от 24 августа 2017 года № 68 нс. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 сентября 2017 года № 15796. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 24 февраля 2026 года № 10/қе (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
