  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Председателя Комитета национальной безопасности Республики Казахстан от 24 августа 2017 года № 68 нс «Об утверждении Правил организации питания в органах национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасының ұлттық қауіпсіздік органдарында тамақтандыруды ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының міндетін атқарушының 2017 жылғы 24 тамыздағы № 68 қе бұйрығына өзгерістер мен толықтыру енгізу туралы
