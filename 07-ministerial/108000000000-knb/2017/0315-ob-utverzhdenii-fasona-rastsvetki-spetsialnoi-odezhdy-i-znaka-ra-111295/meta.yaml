  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 15 марта 2017 года № 13/ДСП «Об утверждении фасона, расцветки специальной одежды и знака различия военнослужащих органов военной полиции Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің әскери полициясы органдары әскери қызметшілері арнайы киімінің және айырым белгісінің үлгісін, түсін бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2017 жылғы 15 наурыздағы № 13/ҚБП бұйрығына өзгеріс енгізу туралы
