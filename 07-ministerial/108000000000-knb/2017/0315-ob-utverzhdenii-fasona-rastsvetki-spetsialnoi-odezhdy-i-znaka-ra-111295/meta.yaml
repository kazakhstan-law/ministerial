requisite: Приказ и.о. Председателя Комитета национальной безопасности Республики Казахстан от 15 марта 2017 года № 13/қбп. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 апреля 2017 года № 15004. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 13 мая 2025 года № 49/қе (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении фасона, расцветки специальной одежды и знака различия военнослужащих органов военной полиции Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің әскери полициясы органдары әскери қызметшілері арнайы киімінің және айырым белгісінің үлгісін, түсін бекіту туралы
