requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 19 января 2021 года № 5/қбп. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 января 2021 года № 22117
title:
  rus: Об утверждении Правил и пределов координации деятельности органов национальной безопасности Республики Казахстан в сфере производства по делам об административных правонарушениях
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының әкімшілік құқық бұзушылық туралы істер бойынша іс жүргізу саласындағы қызметін үйлестіру қағидалары мен шектерін бекіту туралы
