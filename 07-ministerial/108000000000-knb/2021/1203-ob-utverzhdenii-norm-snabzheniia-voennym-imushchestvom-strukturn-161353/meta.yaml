title:
  rus: Об утверждении норм снабжения военным имуществом структурных подразделений Пограничной службы Комитета национальной безопасности Республики Казахстан, осуществляющих охрану Государственной границы Республики Казахстан на морских и речных участках
  kaz: Теңіз және өзен учаскелерінде Қазақстан Республикасының Мемлекеттік шекарасын күзетуді жүзеге асыратын Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің құрылымдық бөлімшелерін әскери мүлікпен жабдықтау нормаларын бекіту туралы
