  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 22 февраля 2024 года № 38/дсп «Об утверждении Правил о войсковом хозяйстве Пограничной службы Комитета национальной безопасности»
    kaz: «Ұлттық қауіпсіздік комитеті Шекара қызметінің әскери шаруашылығы туралы қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2024 жылғы 22 ақпандағы № 38/қбп бұйрығына өзгерістер енгізу туралы
