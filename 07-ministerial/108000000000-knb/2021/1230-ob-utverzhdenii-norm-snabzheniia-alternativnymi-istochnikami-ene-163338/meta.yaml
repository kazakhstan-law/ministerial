  title:
    rus: О внесении изменений в приказы Председателя Комитета национальной безопасности Республики Казахстан от 5 мая 2015 года № 32 «Об утверждении норм снабжения служебными животными Пограничной службы и Пограничной академии Комитета национальной безопасности Республики Казахстан» и от 30 декабря 2021 года № 904/нс-па «Об утверждении норм снабжения альтернативными источниками энергии зданий и сооружений Пограничной службы Комитета национальной безопасности Республики Казахстан»
    kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының «Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің Шекара қызметін және Шекара академиясын қызметтік жануарлармен жабдықтау нормаларын бекіту туралы» 2015 жылғы 5 мамырдағы № 32 және «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің ғимараттары мен құрылыстарын балама энергия көздерімен жабдықтау нормаларын бекіту туралы» 2021 жылғы 30 желтоқсандағы № 904/қе-қа бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/209895/rus
