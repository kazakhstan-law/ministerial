  requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 6 апреля 2023 года № 15/дсп. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 апреля 2023 года № 32282. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 14 февраля 2024 года № 19/ДСП (вводится в действие со дня государственной регистрации)
  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 25 января 2021 года № 7/ДСП «Об утверждении Правил применения беспилотных летательных аппаратов Пограничной службы Комитета национальной безопасности Республики Казахстан с учетом требований законодательства Республики Казахстан об использовании воздушного пространства и деятельности авиации»
    kaz: «Қазақстан Республикасының әуе кеңістігін пайдалану және авиация қызметі туралы заңнамасының талаптарын ескере отырып, Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің пилотсыз ұшу аппараттарын қолдану қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2021 жылғы 25 қаңтардағы № 7/ҚБП бұйрығына өзгерістер енгізу туралы
