act_code: '152650'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 25 января 2021 года № 7/қбп. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 января 2021 года № 22140. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 14 февраля 2024 года № 19/ДСП (вводится в действие со дня государственной регистрации)
title:
  rus: Об утверждении Правил применения беспилотных летательных аппаратов Пограничной службы Комитета национальной безопасности Республики Казахстан с учетом требований законодательства Республики Казахстан об использовании воздушного пространства и деятельности авиации
  kaz: Қазақстан Республикасының әуе кеңістігін пайдалану және авиация қызметі туралы заңнамасының талаптарын ескере отырып, Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара қызметінің пилотсыз ұшу аппараттарын қолдану қағидаларын бекіту туралы
