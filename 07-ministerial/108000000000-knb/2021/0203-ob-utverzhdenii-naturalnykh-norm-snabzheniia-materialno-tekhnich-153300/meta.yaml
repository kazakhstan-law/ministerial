  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности от 3 февраля 2021 года № 11/ДСП «Об утверждении натуральных норм снабжения материально-техническими средствами Академии Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасының Ұлттық қауіпсіздік комитеті Академиясын материалдық-техникалық құралдармен жабдықтаудың заттай нормаларын бекіту туралы» Қазақстан Республикасының Ұлттық қауіпсіздік комитеті Төрағасының 2021 жылғы 3 ақпандағы № 11/ҚБП бұйрығына өзгеріс енгізу туралы
