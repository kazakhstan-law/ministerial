act_code: '159466'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 25 сентября 2021 года № 99/қбп. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 октября 2021 года № 24628
title:
  rus: О приостановлении действия приказа Председателя Комитета национальной безопасности Республики Казахстан от 24 февраля 2020 года № 10дсп «Об утверждении Правил осуществления процедуры подтверждения личности по дактилоскопической информации при пересечении Государственной границы Республики Казахстан и формирования, ведения базы данных дактилоскопической информации этих лиц»
  kaz: «Қазақстан Республикасының Мемлекеттік шекарасын кесіп өту кезінде дактилоскопиялық ақпарат бойынша адамның жеке басын растау рәсімін жүзеге асыру және осы адамдардың дактилоскопиялық ақпарат дерекқорын қалыптастыру, жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2020 жылғы 24 ақпандағы № 10қбп бұйрығының қолданылуын тоқтата тұру туралы
