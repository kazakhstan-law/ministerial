  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 13 апреля 2021 года № 36/ДСП «Об утверждении Правил организации учебного процесса по дистанционному обучению в военных, специальных учебных заведениях органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери, арнаулы оқу орындарында қашықтықтан оқыту бойынша оқу процесін ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2021 жылғы 13 сәуірдегі № 36/ҚБП бұйрығына өзгерістер енгізу туралы
