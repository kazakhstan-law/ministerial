act_code: '154806'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 29 марта 2021 года № 28/қбп. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 апреля 2021 года № 22510
title:
  rus: Об утверждении норм снабжения техническими средствами охраны границы, средствами инженерного вооружения подразделений Пограничной и Авиационной служб, Службы правительственной связи, Службы специального назначения «А», Пограничной академии Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара және Авиация қызметтерінің, Үкіметтік байланыс қызметінің, «А» Арнаулы мақсаттағы қызметінің, Шекара академиясының бөлімшелерін шекара күзетінің техникалық құралдарымен, инженерлік қару-жарақ құралдарымен жабдықтау нормаларын бекіту туралы
