  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 29 марта 2021 года № 28/ДСП «Об утверждении норм снабжения техническими средствами охраны границы, средствами инженерного вооружения подразделений Пограничной и Авиационной служб, Службы правительственной связи, Службы специального назначения «А», Пограничной Академии Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара және Авиация қызметтерінің, Үкіметтік байланыс қызметінің, «А» Арнаулы мақсаттағы қызметінің, Шекара академиясының бөлімшелерді шекара күзетінің техникалық құралдарымен, инженерлік қару-жарақ құралдарымен жабдықтау нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2021 жылғы  29 наурыздағы № 28/ҚБП бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/177588/rus
