title:
  rus: Об утверждении Правил выдачи, хранения, отзыва сертификатов открытого ключа электронной цифровой подписи и подтверждения принадлежности и действительности открытого ключа электронной цифровой подписи специальным корневым удостоверяющим центром Республики Казахстан
  kaz: Электрондық цифрлық қолтаңба ашық кілтінің сертификаттарын беру, сақтау, кері қайтарып алу және Қазақстан Республикасы арнаулы негізгі куәландырушы орталығының электрондық цифрлық қолтаңбасы ашық кілтінің тиесілілігі мен жарамдылығын растауы қағидаларын бекіту туралы
