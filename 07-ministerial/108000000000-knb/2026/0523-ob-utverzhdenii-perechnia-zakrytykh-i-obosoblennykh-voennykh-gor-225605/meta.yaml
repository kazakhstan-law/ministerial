title:
  rus: Об утверждении перечня закрытых и обособленных военных городков, иных закрытых объектов, содержание служебных жилищ и централизованное отопление в которых обеспечиваются за счет бюджетных средств, а также в которых служебное жилище не подлежит приватизации
  kaz: Қызметтік тұрғынжайларды күтіп-ұстау және орталықтандырылған жылыту бюджет қаражаты есебінен қамтамасыз етілетін, сондай-ақ қызметтік тұрғынжайлары жекешелендіруге жатпайтын жабық және оқшауланған әскери қалашықтардың, өзге де жабық объектілердің тізбесін бекіту туралы
