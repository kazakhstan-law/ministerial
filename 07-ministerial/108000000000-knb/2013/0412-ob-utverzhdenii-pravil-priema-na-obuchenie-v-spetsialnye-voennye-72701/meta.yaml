requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 12 апреля 2013 года № 182. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 мая 2013 года № 8449. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 13 января 2016 года № 2
title:
  rus: Об утверждении Правил приема на обучение в специальные (военные) учебные заведения Комитета национальной безопасности Республики Казахстан, реализующие профессиональные учебные программы высшего образования в сокращенные сроки
  kaz: Жоғары білімнің кәсіби оқу бағдарламаларын қысқартылған мерзімде іске асыратын Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің арнаулы (әскери) оқу орындарына оқуға қабылдау қағидаларын бекіту туралы
