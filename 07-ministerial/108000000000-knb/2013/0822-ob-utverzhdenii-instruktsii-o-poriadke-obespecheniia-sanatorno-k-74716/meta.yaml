title:
  rus: Об утверждении Инструкции о порядке обеспечения санаторно-курортным лечением сотрудников, военнослужащих и пенсионеров органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлерін, әскери қызметшілері мен зейнеткерлерін санаториялық-курорттық емдеумен қамтамасыз ету тәртібі туралы нұсқаулықты бекіту туралы
