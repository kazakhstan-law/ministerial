  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 22 августа 2013 года № 413/ДСП «Об утверждении Инструкции о порядке обеспечения санаторно-курортным лечением сотрудников, военнослужащих и пенсионеров органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлерін, әскери қызметшілері мен зейнеткерлерін санаториялық-курорттық емдеумен қамтамасыз ету тәртібі туралы нұсқаулықты бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2013 жылғы 22 тамыздағы № 413/ҚБП бұйрығына өзгеріс енгізу туралы
