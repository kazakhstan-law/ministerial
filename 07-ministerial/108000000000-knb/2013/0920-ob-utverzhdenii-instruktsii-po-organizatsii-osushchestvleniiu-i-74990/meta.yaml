  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 20 сентября 2013 года № 443/ДСП «Об утверждении Инструкции по организации, осуществлению и учету профилактических мероприятий органов военной полиции Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті әскери полициясы органдарының алдын алу іс-шараларын ұйымдастыру, жүзеге асыру және есепке алу жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2013 жылғы 20 қыркүйектегі № 443/ҚБП бұйрығына өзгерістер енгізу туралы
