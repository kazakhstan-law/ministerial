title:
  rus: Об утверждении Инструкции по организации, осуществлению и учету профилактических мероприятий органов военной полиции Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауіпсіздік комитеті әскери полициясы органдарының алдын алу іс-шараларын ұйымдастыру, жүзеге асыру және есепке алу жөніндегі нұсқаулығын бекіту туралы
