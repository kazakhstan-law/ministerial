  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 30 ноября 2013 года № 504 «Об утверждении типовых схем организации пропуска через Государственную границу Республики Казахстан лиц, транспортных средств, грузов и товаров в пунктах пропуска»
    kaz: «Қазақстан Республикасының Мемлекеттік шекарасы арқылы адамдарды, көлік құралдарын, жүктерді және тауарларды өткізу пункттерінде өткізуді ұйымдастырудың үлгілік схемаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2013 жылғы 30 қарашадағы № 504 бұйрығына өзгерістер енгізу туралы
