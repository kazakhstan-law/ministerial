requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 30 ноября 2013 года № 504. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 января 2014 года № 9070. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 23 февраля 2024 года № 42/қе (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении типовых схем организации пропуска через Государственную границу Республики Казахстан лиц, транспортных средств, грузов и товаров в пунктах пропуска, а также иных местах, где осуществляется пропуск через Государственную границу Республики Казахстан
  kaz: Қазақстан Республикасының Мемлекеттік шекарасы арқылы, сондай-ақ Қазақстан Республикасының Мемлекеттік шекарасы арқылы адамдарды, көлік құралдарын, жүктерді және тауарларды өткізу пункттерінде өткізуді ұйымдастырудың үлгілік схемаларын бекіту туралы
