  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 30 октября 2013 года № 503 «Об утверждении Правил содержания в пунктах пропуска граждан Республики Казахстан, утративших в период пребывания за границей документы на право въезда на территорию Республики Казахстан»
    kaz: «Шетелде болған кезеңде Қазақстан Республикасының аумағына кіруге құқық беретін құжаттарын жоғалтқан Қазақстан Республикасының азаматтарын өткізу пункттерінде ұстау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2013 жылғы 30 қазандағы № 503 бұйрығына өзгерістер енгізу туралы
