title:
  rus: Об утверждении Правил содержания в пунктах пропуска граждан Республики Казахстан, утративших в период пребывания за границей документы на право въезда на территорию Республики Казахстан
  kaz: Шетелде болған кезеңде Қазақстан Республикасының аумағына кіруге құқық беретін құжаттарын жоғалтқан Қазақстан Республикасының азаматтарын өткізу пункттерінде ұстау қағидалары бекіту туралы
