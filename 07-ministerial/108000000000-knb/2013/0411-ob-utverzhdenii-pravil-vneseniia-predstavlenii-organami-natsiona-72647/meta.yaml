  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 11 апреля 2013 года № 175 "Об утверждении Правил внесения представлений органами национальной безопасности Республики Казахстан об устранении причин и условий, способствующих реализации угроз безопасности Республики Казахстан, совершению преступлений, расследование которых отнесено законодательством Республики Казахстан к ведению органов национальной безопасности"
    kaz: '"Қазақстан Республикасының қауіпсіздігіне төнетін қауіп-қатерлерді іске асыруға мүмкіндік туғызатын, тергелуі Қазақстан Республикасының заңнамасымен ұлттық қауіпсіздік органдарының қарауына жатқызылған қылмыстарды жасауға ықпал ететін себептер мен жағдайларды жою туралы Қазақстан Республикасы ұлттық қауіпсіздік органдарының ұсыныстарын енгізу қағидаларын бекіту туралы" Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2013 жылғы 11 сәуірдегі № 175 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/86858/rus
