act_code: '72647'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 11 апреля 2013 года № 175. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 мая 2013 года № 8456. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 14 февраля 2024 года № 20/қе (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил внесения представлений органами национальной безопасности Республики Казахстан об устранении причин и условий, способствующих реализации угроз безопасности Республики Казахстан, совершению уголовных правонарушений, расследование которых отнесено законодательством Республики Казахстан к ведению органов национальной безопасности
  kaz: Қазақстан Республикасының қауіпсіздігіне төнетін қауіп-қатерлерді іске асыруға мүмкіндік туғызатын, тергелуі Қазақстан Республикасының заңнамасымен ұлттық қауіпсіздік органдарының қарауына жатқызылған қылмыстық құқық бұзушылықтарды жасауға ықпап ететін себептер мен жағдайларды жою туралы Қазақстан Республикасы ұлттық қауіпсіздік органдарының ұсыныстарын енгізу қағидаларын бекіту туралы
