  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 12 декабря 2016 года № 86/ДСП «Об утверждении норм снабжения специальным и военным имуществом для профессиональной (боевой) подготовки сотрудников и военнослужащих органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлері мен әскери қызметшілерін кәсіби (жауынгерлік) даярлау үшін арнайы және әскери мүлікпен жабдықтау нормаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2016 жылғы 12 желтоқсандағы № 86/ҚБП бұйрығына өзгерістер мен толықтырулар енгізу туралы
