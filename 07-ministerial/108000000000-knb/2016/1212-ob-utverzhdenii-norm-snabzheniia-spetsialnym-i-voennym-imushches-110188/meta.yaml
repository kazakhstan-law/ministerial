title:
  rus: Об утверждении норм снабжения специальным и военным имуществом для профессиональной (боевой) подготовки сотрудников и военнослужащих органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлері мен әскери қызметшілерін кәсіби (жауынгерлік) даярлау үшін арнайы және әскери мүлікпен жабдықтау нормаларын бекіту туралы
