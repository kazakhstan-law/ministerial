title:
  rus: Об утверждении технического регламента «Общие требования к телекоммуникационному оборудованию по обеспечению проведения оперативно-розыскных мероприятий, сбора и хранения служебной информации об абонентах»
  kaz: «Жедел-іздестіру іс-шараларын өткізуді, абоненттер туралы қызметтік ақпараттарды жинауды және сақтауды қамтамасыз ету бойынша телекоммуникациялық жабдықтарға қойылатын жалпы талаптар» техникалық регламентін бекіту туралы
