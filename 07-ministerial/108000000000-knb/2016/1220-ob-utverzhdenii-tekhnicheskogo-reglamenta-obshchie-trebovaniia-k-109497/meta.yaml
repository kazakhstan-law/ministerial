  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 20 декабря 2016 года № 91 «Об утверждении технического регламента «Общие требования к телекоммуникационному оборудованию по обеспечению проведения оперативно-розыскных мероприятий, сбора и хранения служебной информации об абонентах»
    kaz: «Жедел-іздестіру іс-шараларын өткізуді, абоненттер туралы қызметтік ақпараттарды жинауды және сақтауды қамтамасыз ету бойынша телекоммуникациялық жабдықтарға қойылатын жалпы талаптар» техникалық регламентін бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2016 жылғы 20 желтоқсандағы № 91 бұйрығына өзгерістер енгізу туралы
