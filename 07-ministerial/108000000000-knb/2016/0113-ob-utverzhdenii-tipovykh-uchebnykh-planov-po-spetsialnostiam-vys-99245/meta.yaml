  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 13 января 2016 года № 9/ДСП "Об утверждении Типовых учебных планов по специальностям высшего и послевузовского образования, реализуемых в военных, специальных учебных заведениях органов национальной безопасности Республики Казахстан"
    kaz: '"Қазақстан Республикасы ұлттық қауіпсіздік комитеті органдарының әскери, арнаулы оқу орындарында іске асырылатын жоғары және жоғары оқу орнынан кейінгі білім беру мамандықтары бойынша үлгілік оқу жоспарларын бекіту туралы" Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2016 жылғы 13 қантардағы № 9/ҚБП бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/107579/rus
