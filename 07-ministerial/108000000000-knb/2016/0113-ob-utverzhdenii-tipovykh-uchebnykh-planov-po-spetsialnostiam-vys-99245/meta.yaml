requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 13 января 2016 года № 9 ДСП. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 февраля 2016 года № 13127. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 28 сентября 2024 года № 133/ДСП
title:
  rus: Об утверждении Типовых учебных планов по специальностям высшего и послевузовского образования, реализуемых в военных, специальных учебных заведениях органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери, арнаулы оқу органдарында іске асырылатын жоғары және жоғары оқу орнынан кейінгі білім беру мамандықтары бойынша үлгілік оқу жоспарларын бекіту туралы
