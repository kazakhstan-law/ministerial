  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 13 января 2016 года № 7/ДСП «Об утверждении Квалификационных характеристик должностей педагогов в военных, специальных учебных заведениях органов национальной безопасности Республики Казахстан, за исключением должностей гражданских служащих»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери, арнаулы оқу орындарында азаматтық қызметші лауазымдарын қоспағанда, педагог лауазымдарының біліктілік сипаттамаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2016 жылғы 13 қаңтардағы № 7/ҚБП бұйрығына өзгеріс енгізу туралы
