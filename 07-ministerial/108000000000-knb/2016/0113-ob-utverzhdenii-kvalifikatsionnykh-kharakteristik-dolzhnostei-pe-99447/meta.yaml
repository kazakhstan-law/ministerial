act_code: '99447'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 13 января 2016 года № 7/ДСП. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2016 года № 13146
title:
  rus: Об утверждении Квалификационных характеристик должностей педагогических работников и приравненных к ним лиц в военных, специальных учебных заведениях органов национальной безопасности Республики Казахстан, за исключением должностей гражданских служащих
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери, арнаулы оқу орындарында азаматтық қызметші лауазымдарын қоспағанда, педагог жұмыскерлер мен оларға теңестірілген адамдар лауазымдарының біліктілік сипаттамаларын бекіту туралы
