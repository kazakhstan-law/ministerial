  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 18 мая 2016 года № 48 «Об утверждении перечней должностей гражданских служащих и работников органов национальной безопасности Республики Казахстан, имеющих право на доплату за особые условия труда»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының ерекше еңбек жағдайлары үшін қосымша ақы алуға құқығы бар азаматтық қызметшілері мен қызметкерлері лауазымдарының тізбесін бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2016 жылғы 18 мамырдағы № 48 бұйрығына өзгерістер енгізу туралы
