title:
  rus: Об утверждении перечней должностей гражданских служащих и работников органов национальной безопасности Республики Казахстан, имеющих право на доплату за особые условия труда
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының ерекше еңбек жағдайлары үшін қосымша ақы алуға құқығы бар азаматтық қызметшілері мен қызметкерлері лауазымдарының тізбесін бекіту туралы
