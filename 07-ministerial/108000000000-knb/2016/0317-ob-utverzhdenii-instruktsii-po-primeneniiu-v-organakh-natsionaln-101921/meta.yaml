  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 17 марта 2016 года № 24/ДСП «Об утверждении Инструкции по применению в органах национальной безопасности Республики Казахстан Правил передачи, реализации, утилизации и списания имущества, а также предоставления в имущественный наем (аренду) недвижимого имущества специальных государственных органов Республики Казахстан, утвержденных постановлением Правительства Республики Казахстан от 21 января 2013 года № 16»
    kaz: Қазақстан Республикасы Үкіметінің 2013 жылғы 21 қаңтардағы № 16 қаулысымен бекітілген Қазақстан Республикасы арнаулы мемлекеттік органдарының мүліктерін беру, өткізу, кәдеге жарату және есептен шығару, сондай-ақ жылжымайтын мүлкін мүліктік жалдауға (жалға алуға) беру қағидаларын Қазақстан Республикасы ұлттық қауіпсіздік органдарында қолдану жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2016 жылғы 17 наурыздағы № 24/ҚБП бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/211664/rus
