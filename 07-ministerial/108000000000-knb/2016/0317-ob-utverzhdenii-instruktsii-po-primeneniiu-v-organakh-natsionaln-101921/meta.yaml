act_code: '101921'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 17 марта 2016 года № 24/ДСП. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 апреля 2016 года № 13643
title:
  rus: Об утверждении Инструкции по применению в органах национальной безопасности Республики Казахстан Правил передачи, реализации, утилизации и списания имущества, а также предоставления в имущественный наем (аренду) недвижимого имущества специальных государственных органов Республики Казахстан, утвержденных постановлением Правительства Республики Казахстан от 21 января 2013 года № 16
  kaz: Қазақстан Республикасы Үкіметінің 2013 жылғы 21 қаңтардағы № 16 қаулысымен бекітілген, Қазақстан Республикасы арнаулы мемлекеттік органдарының мүліктерін беру, өткізу, кәдеге жарату және есептен шығару, сондай-ақ жылжымайтын мүлкін жалдауға (жалға алуға) беру қағидаларын Қазақстан Республикасы ұлттық қауіпсіздік органдарында қолдану бойынша Нұсқаулықты бекіту туралы
