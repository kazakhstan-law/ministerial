  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 13 января 2016 года № 12қбп  «Об утверждении Правил назначения на штатные должности профессорско-преподавательского состава и научных работников, в том числе временно, лиц из числа работников при невозможности назначения сотрудников соответствующего состава»
    kaz: «Профессор-оқытушылар құрамының және ғылыми қызметкерлердің штаттық лауазымдарына тиісті құрамның қызметкелерін тағайындау мүмкін болмаған жағдайда оларға жұмыскерлер арасынан адамдарды, оның ішінде уақытша тағайындау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2016 жылғы 13 қаңтардағы № 12қбп бұйрығына өзгерістер енгізу туралы
