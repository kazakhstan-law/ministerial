title:
  rus: Об утверждении Правил назначения на штатные должности профессорско-преподавательского состава и научных работников, в том числе временно, лиц из числа работников при невозможности назначения сотрудников соответствующего состава
  kaz: Профессор-оқытушылар құрамының және ғылыми қызметкерлердің штаттық лауазымдарына тиісті құрамның қызметкерлерін тағайындау мүмкін болмаған жағдайда оларға жұмыскерлер арасынан адамдарды, оның ішінде уақытша тағайындау қағидаларын бекіту туралы
