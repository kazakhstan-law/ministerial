requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 13 января 2016 года № 11 ДСП. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2016 года № 13136
title:
  rus: Об утверждении Правил замещения должностей педагогических работников и приравненных к ним лиц, научных работников военных, специальных учебных заведений органов национальной безопасности Республики Казахстан, за исключением должностей гражданских служащих
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдары әскери, арнаулы оқу орындарында, азаматтық қызметші лауазымдарын қоспағанда, педагог жұмыскерлер мен оларға теңестірілген адамдар, ғылыми қызметкерлер лауазымдарына орналасу қағидаларын бекіту туралы
