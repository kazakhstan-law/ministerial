act_code: '101369'
requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 26 марта 2016 года № 29 дсп. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 апреля 2016 года № 13602. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 29 сентября 2018 года № 78/қбп
title:
  rus: Об утверждении Типовых правил использования технических средств личного и служебного пользования (видео-, кино-, и фотоаппаратуры, средств вычислительной техники, сотовых телефонов, мобильных устройств и иной аппаратуры) в зданиях (сооружениях) и на территории объектов государственных органов и организаций Республики Казахстан
  kaz: Қазақстан Республикасы мемлекеттік органдары мен ұйымдарының ғимараттарында (құрылыстарында) және қызметтік объектілерінің аумақтарында жеке және қызметтік қолданастағы техникалық құралдарды (бейне-,кино-,және фотоаппаратуралар,есептеуіш техника құралдары, ұялы телефондар, мобильдік құрылғылар мен өзге де аппаратуралар) пайдаланудың үлгі қағидаларын бекіту туралы
