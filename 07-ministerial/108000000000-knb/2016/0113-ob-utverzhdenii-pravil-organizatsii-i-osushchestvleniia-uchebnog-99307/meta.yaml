  title:
    rus: О внесении изменений и дополнения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 13 января 2016 года № 14/ҚБП «Об утверждении Правил организации и осуществления учебного процесса, учебно-методической и научно-методической деятельности в военных, специальных учебных заведениях органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери, арнаулы оқу орындарында оқу процесін, оқу-әдістемелік және ғылыми-әдістемелік қызметті ұйымдастыру және жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2016 жылғы 13 қаңтардағы № 14/ҚБП бұйрығына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/138819/rus
