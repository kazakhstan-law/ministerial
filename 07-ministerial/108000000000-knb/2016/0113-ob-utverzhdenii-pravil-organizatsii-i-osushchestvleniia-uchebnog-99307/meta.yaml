title:
  rus: Об утверждении Правил организации и осуществления учебного процесса, учебно-медодической и научно-методической деятельности в военных, специальных учебных заведениях органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери, арнаулы оқу орындарында оқу процесін, оқу- әдістемелік және ғылыми-әдістемелік қызметті ұйымдастыру және жүзеге асыру қағидаларын бекіту туралы
