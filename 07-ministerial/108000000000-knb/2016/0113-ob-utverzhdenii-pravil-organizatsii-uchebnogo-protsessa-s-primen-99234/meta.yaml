  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 13 января 2016 года № 15/ДСП «Об утверждении Правил организации учебного процесса с применением образовательных технологий в военных, специальных учебных заведениях органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери, арнаулы оқу орындарында білім беру технологияларын қолдана отырып оқу процесін ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2016 жылғы 13 қаңтардағы № 15/ҚБП бұйрығына өзгерістер енгізу туралы
