title:
  rus: Об утверждении Правил организации учебного процесса с применением образовательных технологий в военных, специальных учебных заведениях органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдары әскери, арнаулы оқу орындарында білім беру технологияларын қолдана отырып оқу процесін ұйымдастыру қағидаларын бекіту туралы
