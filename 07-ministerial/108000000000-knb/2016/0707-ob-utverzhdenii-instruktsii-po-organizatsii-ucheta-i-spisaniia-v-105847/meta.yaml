  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 7 июля 2016 года № 57/ДСП «Об утверждении инструкции по организации учета и списания военного имущества Пограничной и Авиационной служб, Пограничной академии Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Шекара және Авиация қызметтерінде, Шекара академиясында әскери мүлікті есепке алуды және есептен шығаруды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2016 жылғы 7 шілдедегі № 57/ҚБП бұйрығына өзгеріс енгізу туралы
