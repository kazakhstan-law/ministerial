title:
  rus: Об утверждении Инструкции по организации учета и списания военного имущества Пограничной службы Комитета национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қауәіпсіздік комитетінің Шекара қызметінде әскери мүлікті есепке алуды және есептен шығаруды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
