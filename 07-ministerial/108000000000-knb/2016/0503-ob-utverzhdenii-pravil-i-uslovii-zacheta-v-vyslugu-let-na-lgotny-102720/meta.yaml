  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 3 мая 2016 года № 41/ДСП «Об утверждении Правил и условий зачета в выслугу лет на льготных условиях для назначения пенсий сотрудникам и военнослужащим органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлері мен әскери қызметшілеріне жеңілдік жағдайларында зейнетақы тағайындау үшін еңбек сіңірген жылдарына есептеу қағидалары мен шарттарын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2016 жылғы 3 мамырдағы № 41/ҚБП бұйрығына өзгерістер енгізу туралы
