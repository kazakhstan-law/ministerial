title:
  rus: Об утверждении Правил и условий зачета в выслугу лет на льготных условиях для назначения пенсий сотрудникам и военнослужащим органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлері мен әскері қызметшілеріне жеңілдік жағдайларында зейнетақы тағайындау үшін еңбек сіңірген жылдарына есептеу қағидалары мен шарттарын бекіту туралы
