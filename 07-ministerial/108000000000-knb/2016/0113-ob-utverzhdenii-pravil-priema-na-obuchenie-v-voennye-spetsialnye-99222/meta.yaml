  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 13 января 2016 года № 2 «Об утверждении Правил приема на обучение в военные, специальные учебные заведения органов национальной безопасности Республики Казахстан, реализующие образовательные программы высшего образования»
    kaz: «Жоғары білімнің білім беру бағдарламаларын іске асырып жатқан Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери, арнаулы оқу орындарына оқуға қабылдау қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2016 жылғы 13 қаңтардағы № 2 бұйрығына өзгерістер енгізу туралы
