  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 13 января 2016 года № 8/ҚБП «Об утверждении Правил проведения текущего контроля успеваемости, промежуточной и итоговой аттестации обучающихся военных, специальных учебных заведений органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери, арнаулы оқу орындарында білім алушылардың үлгеріміне ағымдағы бақылау, оларға аралық және қорытынды аттестаттау жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2016 жылғы 13 қаңтардағы № 8/ҚБП бұйрығына өзгерістер енгізу туралы
