title:
  rus: Об утверждении Правил проведения текущего контроля успеваемости, промежуточной и итоговой аттестации обучающихся военных, специальных учебных заведений органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының әскери, арнаулы оқу орындарында білім алушылардың үлгеріміне ағымдағы бақылау, оларға аралық және қорытынды аттестаттау жүргізу қағидаларын бекіту туралы
