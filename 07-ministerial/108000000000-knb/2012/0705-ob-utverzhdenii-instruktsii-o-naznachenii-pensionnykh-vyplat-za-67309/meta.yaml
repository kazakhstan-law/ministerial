requisite: Приказ Председателя Комитета Национальной безопасности Республики Казахстан от 5 июля 2012 года № 321ДСП. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 августа 2012 года № 7832. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 1 августа 2024 года № 109/қбп
title:
  rus: Об утверждении Инструкции о назначении пенсионных выплат за выслугу лет сотрудникам и военнослужащим, единовременных выплат на погребение и пособия семье умершего пенсионера органов национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлері мен әскери қызметшілеріне еңбек сіңірген жылдары бойынша зейнетақы төлемдерін, қайтыс болған зейнеткерді жерлеуге бір жолғы төлем және отбасына жәрдемақы тағайындау туралы нұсқаулықты бекіту туралы
