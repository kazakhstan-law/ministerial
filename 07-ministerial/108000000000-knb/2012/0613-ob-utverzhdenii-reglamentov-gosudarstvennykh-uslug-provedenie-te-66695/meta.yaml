requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 13 июня 2012 года № 186. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 июля 2012 года № 7795. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 15 сентября 2014 года № 305
title:
  rus: Об утверждении регламентов государственных услуг "Проведение технического исследования на предмет отнесения товаров к специальным техническим средствам для проведения оперативно-розыскных мероприятий" и "Проведение технического исследования на предмет отнесения товаров к средствам криптографической защиты информации"
  kaz: '"Жедел іздестіру іс-шараларын жүргізу үшін тауарларды арнайы техникалық құралдарға жатқызу тұрғысынан техникалық зерттеу жүргізу" және "Тауарларды ақпаратты криптографиялық қорғау құралдарына жатқызу тұрғысынан техникалық зерттеу жүргізу" бойынша мемлекеттік қызмет көрсетулер регламенттерін бекіту туралы'
