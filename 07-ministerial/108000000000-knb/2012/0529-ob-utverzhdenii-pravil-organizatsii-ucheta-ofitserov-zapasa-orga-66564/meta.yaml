    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының запастағы офицерлерiн есепке алуды ұйымдастыру және олардың қызметкерлерiнiң запаста болу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2012 жылғы 29 мамырдағы № 237/ҚБП бұйрығына өзгерістер енгізу туралы
