  title:
    rus: О внесении изменения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 29 мая 2012 года № 237дсп «Об утверждении Правил организации учета офицеров запаса органов национальной безопасности Республики Казахстан и пребывания их сотрудников в запасе»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының запастағы офицерлерiн есепке алуды ұйымдастыру және олардың қызметкерлерiнiң запаста болу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2012 жылғы 29 мамырдағы № 237/ҚБП бұйрығына өзгеріс енгізу туралы
