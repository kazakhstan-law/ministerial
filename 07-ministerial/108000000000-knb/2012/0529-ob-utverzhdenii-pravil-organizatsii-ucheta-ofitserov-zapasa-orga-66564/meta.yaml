title:
  rus: Об утверждении Правил организации учета офицеров запаса органов национальной безопасности Республики Казахстан и пребывание их сотрудников в запасе
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының запастағы офицерлерін есепке алуды ұйымдастыру және олардың қызметкерлерінің запаста болу қағидаларын бекіту туралы
