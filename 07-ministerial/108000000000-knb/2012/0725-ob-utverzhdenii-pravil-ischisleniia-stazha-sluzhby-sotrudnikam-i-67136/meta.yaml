title:
  rus: Об утверждении Правил исчисления стажа службы сотрудникам и военнослужащим органов национальной безопасности Республики Казахстан для установления коэффицентов при определении должностных окладов
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлеріне және әскери қызметшілеріне лауазымдық жалақыларын анықтау кезінде коэффициенттер белгілеу үшін қызмет өтілін есептеу қағидаларын бекіту туралы
