  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 25 июля 2012 года № 361/ДСП «Об утверждении Правил исчисления стажа службы сотрудникам и военнослужащим органов национальной безопасности Республики Казахстан для установления коэффициентов при определении должностных окладов»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының қызметкерлеріне және әскери қызметшілеріне лауазымдық жалақыларын айқындау кезінде коэффициенттер белгілеу үшін қызмет өтілін есептеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2012 жылғы 25 шілдедегі № 361/ҚБП бұйрығына өзгерістер енгізу туралы
