  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 22 сентября 2012 года № 444/ҚБП «Об утверждении Правил по заключению, продлению, изменению, расторжению и прекращению контракта о прохождении службы в органах национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарында қызмет өткеру туралы келісімшарт жасасу, ұзарту, өзгерту, бұзу және тоқтату бойынша қағидаларды бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2012 жылғы 22 қыркүйектегі № 444/ҚБП бұйрығына өзгерістер енгізу туралы
