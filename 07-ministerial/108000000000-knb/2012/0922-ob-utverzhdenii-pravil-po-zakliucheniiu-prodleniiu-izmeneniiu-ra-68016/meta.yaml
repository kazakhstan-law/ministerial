title:
  rus: Об утверждении Правил по заключению, продлению, изменению, расторжению и прекращению контракта о прохождении службы в органах национальной безопасности Республики Казахстан
  kaz: Қазақстан Республикасы ұлттық қауіпсіздік органдарында қызмет өткеру туралы келісімшарт жасасу, ұзарту, өзгерту, бұзу және тоқтату бойынша қағидаларды бекіту туралы
