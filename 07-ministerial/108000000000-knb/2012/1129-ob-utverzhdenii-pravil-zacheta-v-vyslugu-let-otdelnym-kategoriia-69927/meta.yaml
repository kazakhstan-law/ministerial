title:
  rus: Об утверждении Правил зачета в выслугу лет отдельным категориям сотрудников и военнослужащих органов национальной безопасности стажа их трудовой деятельности до зачисления на службу в органы национальной безопасности Республики Казахстан
  kaz: Ұлттық қауіпсіздік органдары қызметкерлері мен әскери қызметшілерінің жекелеген санаттарына Қазақстан Республикасының ұлттық қауіпсіздік органдарына қызметке алынғанға дейінгі олардың еңбек қызметінің өтілін еңбек сіңірген жылдарына есептеу қағидаларын бекіту туралы
