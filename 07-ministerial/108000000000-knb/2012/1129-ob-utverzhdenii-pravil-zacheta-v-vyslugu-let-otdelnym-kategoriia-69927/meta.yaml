  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 29 ноября 2012 года № 540/дсп «Об утверждении Правил зачета в выслугу лет отдельным категориям сотрудников и военнослужащих органов национальной безопасности стажа их трудовой деятельности до зачисления на службу в органы национальной безопасности Республики Казахстан»
    kaz: «Ұлттық қауіпсіздік органдары қызметкерлері мен әскери қызметшілері мен әскери қызметшілерінің жекелеген санаттарына Қазақстан Республикасының ұлттық қауіпсіздік органдарына қызметке алынғанға дейінгі олардың еңбек қызметінің өтілін еңбек сіңірген жылдарына есептеу қағидаларын бекіту туралы» Қазақстан Республикасының Ұлттық қауіпсіздік комитеті Төрағасының 2012 жылғы 29 қарашадағы № 540/қбп бұйрығына өзгерістер енгізу туралы
