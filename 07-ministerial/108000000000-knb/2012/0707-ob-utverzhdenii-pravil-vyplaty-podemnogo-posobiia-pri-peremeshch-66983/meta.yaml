  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 7 июля 2012 года № 335/ДСП «Об утверждении Правил выплаты подъемного пособия при перемещении по службе, связанном с переездом из одного населенного пункта в другой, сотрудникам органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдары қызметкерлеріне бір елді мекеннен екіншісіне көшумен байланысты қызметін ауыстырған кезде көтерме жәрдемақы төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2012 жылғы 7 шілдедегі № 335/ҚБП бұйрығына өзгерістер енгізу туралы
