  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 21 июля 2022 года № 594/нс-па «Об утверждении положений о территориальных органах Комитета национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы Ұлттық қауіпсіздік комитетінің аумақтық органдары туралы ережелерді бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2022 жылғы 21 шілдедегі № 594/қе-қа бұйрығына өзгерістер мен толықтырулар енгізу туралы
