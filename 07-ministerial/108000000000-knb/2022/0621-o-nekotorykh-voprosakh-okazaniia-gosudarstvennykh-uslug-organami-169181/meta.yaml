caused_by:
  code: '223390'
  requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 31 марта 2026 года № 14/қе. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 апреля 2026 года № 38287
  title:
    rus: О внесении изменений и дополнения в приказ Председателя Комитета национальной безопасности Республики Казахстан от 21 июня 2022 года   № 29/қе «Об утверждении Правил оказания государственной услуги «Выдача санитарно-эпидемиологического заключения о соответствии объекта высокой эпидемической значимости нормативным правовым актам в сфере санитарно-эпидемиологического благополучия населения на объектах органов национальной безопасности Республики Казахстан»
    kaz: «Қазақстан Республикасы ұлттық қауіпсіздік органдарының объектілеріндегі эпидемиялық мәні жоғары объектінің халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы нормативтік құқықтық актілерге сәйкестігі туралы санитариялық-эпидемиологиялық қорытынды беру» мемлекеттік қызметін көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2022 жылғы 21 маусымдағы № 29/қе бұйрығына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/223390/rus
