requisite: Приказ Председателя Комитета национальной безопасности Республики Казахстан от 21 июня 2022 года № 29/қе. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 июня 2022 года № 28566
title:
  rus: О некоторых вопросах оказания государственных услуг органами национальной безопасности Республики Казахстан в сфере санитарно-эпидемиологического благополучия населения
  kaz: Қазақстан Республикасының ұлттық қауіпсіздік органдарының халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы мемлекеттік қызметтерді көрсетудің кейбір мәселелері туралы
