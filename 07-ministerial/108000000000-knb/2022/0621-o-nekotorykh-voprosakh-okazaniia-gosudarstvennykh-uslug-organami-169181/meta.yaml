  title:
    rus: О внесении изменений в приказ Председателя Комитета национальной безопасности Республики Казахстан от 21 июня 2022 года № 29/қе «О некоторых вопросах оказания государственных услуг органами национальной безопасности Республики Казахстан в сфере санитарно-эпидемиологического благополучия населения»
    kaz: «Қазақстан Республикасының ұлттық қауіпсіздік органдарының халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы мемлекеттік қызметтерді көрсетудің кейбір мәселелері туралы» «Қазақстан Республикасы Ұлттық қауіпсіздік комитеті Төрағасының 2022 жылғы 21 маусымдағы № 29/қе бұйрығына өзгерістер енгізу туралы
