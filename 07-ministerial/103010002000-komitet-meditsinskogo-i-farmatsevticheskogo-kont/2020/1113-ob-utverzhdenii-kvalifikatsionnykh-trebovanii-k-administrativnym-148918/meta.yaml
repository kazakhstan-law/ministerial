act_code: '148918'
requisite: Приказ и.о. Председателя Комитета медицинского и фармацевтического контроля Министерства здравоохранения Республики Казахстан от 13 ноября 2020 года № 4 нқ. Отменен приказом Председателя Комитета медицинского и фармацевтического контроля Министерства здравоохранения Республики Казахстан от 14 марта 2022 года № 103-НҚ (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении квалификационных требований к административным государственным должностям корпуса «Б» Комитета медицинского и фармацевтического контроля Министерства здравоохранения Республики Казахстан
  kaz: Қазақстан Республикасы Денсаулық сақтау министрлігі Медициналық және фармацевтикалық бақылау комитетінің «Б» корпусы мемлекеттік әкімшілік лауазымдарына қойылатын біліктілік талаптарын бекіту туралы
