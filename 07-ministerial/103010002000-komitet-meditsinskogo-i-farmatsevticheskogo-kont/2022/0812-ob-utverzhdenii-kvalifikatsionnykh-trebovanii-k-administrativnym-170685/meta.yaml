act_code: '170685'
requisite: Приказ Председателя Комитета медицинского и фармацевтического контроля Министерства здравоохранения Республики Казахстан от 12 августа 2022 года № 317-НҚ. Утратил силу приказом и.о. Председателя Комитета медицинского и фармацевтического контроля Министерства здравоохранения Республики Казахстан от 4 апреля 2025 года № 194-НҚ (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении квалификационных требований к административным государственным должностям корпуса «Б» Комитета медицинского и фармацевтического контроля Министерства здравоохранения Республики Казахстан
  kaz: Қазақстан Республикасы Денсаулық сақтау министрлігі Медициналық және фармацевтикалық бақылау комитетінің «Б» корпусы мемлекеттік әкімшілік лауазымдарына қойылатын біліктілік талаптарын бекіту туралы
