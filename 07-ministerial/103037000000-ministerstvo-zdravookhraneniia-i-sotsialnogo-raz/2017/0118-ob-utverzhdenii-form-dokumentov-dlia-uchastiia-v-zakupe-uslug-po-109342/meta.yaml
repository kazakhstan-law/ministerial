requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 18 января 2017 года № 21. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 января 2017 года № 14716. Утратил силу приказом Министра здравоохранения Республики Казахстан от 12 ноября 2021 года № ҚР ДСМ -113 (вводится в действие по истечении десяти календарных дней после дня их первого официального опубликования)
title:
  rus: Об утверждении форм документов для участия в закупе услуг по хранению и транспортировке лекарственных средств и изделий медицинского назначения единым дистрибьютором в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования
  kaz: Бірыңғай дистрибьютордың тегін медициналық көмектің кепілдік берілген көлемі және міндетті әлеуметтік медициналық сақтандыру жүйесіндегі медициналық көмек шеңберінде дәрілік заттар мен медициналық мақсаттағы бұйымдарды сақтау және тасымалдау жөніндегі қызметтерді сатып алуға қатысу үшін құжаттар нысандарын бекіту туралы
