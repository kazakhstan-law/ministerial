act_code: '109344'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 18 января 2017 года № 20. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 января 2017 года № 14715. Утратил силу приказом Министра здравоохранения Республики Казахстан от 12 ноября 2021 года № ҚР ДСМ -113 (вводится в действие по истечении десяти календарных дней после дня их первого официального опубликования)
title:
  rus: Об утверждении форм документов для участия в закупе лекарственных средств, профилактических (иммунобиологических, диагностических, дезинфицирующих) препаратов, изделий медицинского назначения и медицинской техники, фармацевтических услуг по оказанию гарантированного объема бесплатной медицинской помощи и медицинской помощи в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемін және міндетті әлеуметтік медициналық сақтандыру жүйесіндегі медициналық көмекті көрсету бойынша дәрілік заттарды, профилактикалық (иммундық-биологиялық, диагностикалық, дезинфекциялық) препараттарды, медициналық мақсаттағы бұйымдар мен медициналық техниканы, фармацевтикалық қызметтер көрсетуді сатып алуға қатысу үшін кұжаттар нысандарын бекіту туралы
