  requisite: Приказ Министра здравоохранения Республики Казахстан от 27 июля 2017 года № 562. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 августа 2017 года № 15572. Утратил силу приказом Министра здравоохранения Республики Казахстан от 9 октября 2020 года № ҚР ДСМ-121/2020 (вводится в действие по истечении десяти календарных дней после его официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 1 апреля 2015 года № 194 «Об утверждении перечня острых заболеваний, представляющих опасность для окружающих, при которых иностранцы и лица без гражданства, находящиеся на территории Республики Казахстан, имеют право на получение гарантированного объема бесплатной медицинской помощи»
    kaz: «Қазақстан Республикасының аумағында жүрген шетелдіктер мен азаматтығы жоқ адамдар тегін медициналық көмектің кепілдік берілген көлемін алуға құқылы болатын айналадағылар үшін қауіп төндіретін қатты аурулардың тізбесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 1 сәуірдегі № 194 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/114454/rus
