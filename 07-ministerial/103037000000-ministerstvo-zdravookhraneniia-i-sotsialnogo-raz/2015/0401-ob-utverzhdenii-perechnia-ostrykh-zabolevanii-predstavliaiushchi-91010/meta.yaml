act_code: '91010'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 1 апреля 2015 года № 194. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 июня 2015 года № 11317. Утратил силу приказом Министра здравоохранения Республики Казахстан от 9 октября 2020 года № ҚР ДСМ-121/2020 (вводится в действие по истечении десяти календарных дней после его официального опубликования)
title:
  rus: Об утверждении перечня острых заболеваний, представляющих опасность для окружающих , при которых оралманы, иностранцы и лица без гражданства, временно пребывающие в Республике Казахстан имеют право на получение гарантированного объема бесплатной медицинской помощи
  kaz: Қазақстан Республикасының аумағына уақытша келген шетелдіктер мен азаматтығы жоқ адамдар, оралмандар тегін медициналық көмектің кепілдік берілген көлемін алуға құқылы болатын айналадағылар үшін қауіп төндіретін қатты аурулардың тізбесін бекіту туралы
