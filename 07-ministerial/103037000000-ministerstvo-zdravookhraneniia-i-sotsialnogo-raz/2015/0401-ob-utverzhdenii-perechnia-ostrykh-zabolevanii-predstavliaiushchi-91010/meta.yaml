  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения и социального развития Республики Казахстан от 1 апреля 2015 года № 194 «Об утверждении перечня острых заболеваний, представляющих опасность для окружающих, при которых оралманы, иностранцы и лица без гражданства, временно пребывающие в Республике Казахстан имеют право на получение гарантированного объема бесплатной медицинской помощи»
    kaz: «Қазақстан Республикасының аумағына уақытша келген шетелдіктер мен азаматтығы жоқ адамдар, оралмандар тегін медициналық көмектің кепілдік берілген көлемін алуға құқылы болатын айналадағылар үшін қауіп төндіретін қатты аурулардың тізбесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 1 сәуірдегі № 194 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/140426/rus
