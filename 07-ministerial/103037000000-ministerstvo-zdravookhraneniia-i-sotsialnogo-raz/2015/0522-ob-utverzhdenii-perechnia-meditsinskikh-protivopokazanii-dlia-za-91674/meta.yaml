  title:
    rus: О внесении изменений  в приказ Министра здравоохранения и социального развития Республики Казахстан от 22 мая 2015 года № 379 «Об утверждении Перечня медицинских противопоказаний для заключения трудовых  договоров в сфере тяжелых работ, работ с вредными (особо вредными) и (или) опасными условиями труда,  на подземных работах, а также для допуска лиц декретированной группы населения к работе»
    kaz: «Ауыр жұмыстар, еңбек жағдайлары зиянды (ерекше зиянды) және (немесе) қауіпті жұмыстар саласында, жерасты жұмыстарына еңбек шарттарын жасасу үшін, сондай-ақ халықтың декреттелген тобындағы адамдарды жұмысқа жіберу үшін медициналық қарсы көрсетілімдер тізбесін бекіту туралы»  Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 22 мамырдағы № 379 бұйрығына өзгерістер енгізу туралы
