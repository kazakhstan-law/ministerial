  title:
    rus: О внесении изменения в приказ Министра труда и социальной защиты населения Республики Казахстан от 25 апреля 2017 года № 93 «О внесении изменения в приказ Министра здравоохранения и социального развития Республики Казахстан от 5 мая 2015 года № 320 «Об утверждении Правил назначения и выплаты государственной адресной социальной помощи»
    kaz: «Мемлекеттiк атаулы әлеуметтiк көмектi тағайындау және төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 5 мамырдағы № 320 бұйрығына өзгеріс енгізу туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2017 жылғы 25 сәуірдегі № 93 бұйрығына өзгеріс енгізу туралы
