requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 29 сентября 2015 года № 762. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 октября 2015 года № 12218. Утратил силу приказом Министра здравоохранения и социального развития Республики Казахстан от 8 декабря 2015 года № 943
title:
  rus: Об утверждении норм выдачи работникам специальной одежды, специальной обуви и других средств индивидуальной защиты, моющих и дезинфицирующих материалов, молока, лечебно-профилактического питания  за счет средств работодателя
  kaz: Жұмыс берушінің қаражаты есебінен қызметкерлерге   арнайы киім, арнайы аяқ киім және басқа да жеке қорғану құралдары, жуу және дезинфекциялау материалдарын, сүт, емдеу-профилактикалық тағамын беру нормаларын бекіту туралы
