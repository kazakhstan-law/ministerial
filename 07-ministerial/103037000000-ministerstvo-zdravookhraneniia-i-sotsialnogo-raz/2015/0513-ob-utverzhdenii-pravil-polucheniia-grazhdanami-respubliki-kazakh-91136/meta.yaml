act_code: '91136'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 13 мая 2015 года № 344. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 июня 2015 года № 11361. Утратил силу приказом и.о. Министра здравоохранения Республики Казахстан от 18 июля 2023 года № 132
title:
  rus: Об утверждении Правил получения гражданами Республики Казахстан, оралманами, а также иностранцами и лицами без гражданства, постоянно проживающими на территории Республики Казахстан, гарантированного объема бесплатной медицинской помощи
  kaz: Қазақстан Республикасы азаматтарының, оралмандардың, сондай-ақ Қазақстан Республикасының аумағында тұрақты тұратын шетелдiктер мен азаматтығы жоқ адамдардың тегін медициналық көмектің кепілдік берілген көлемін алуы қағидаларын бекіту туралы
