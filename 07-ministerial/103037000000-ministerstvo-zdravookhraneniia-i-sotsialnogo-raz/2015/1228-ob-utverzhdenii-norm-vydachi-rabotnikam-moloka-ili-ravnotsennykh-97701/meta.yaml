title:
  rus: Об утверждении норм выдачи работникам молока или равноценных пищевых продуктов, и (или) пищевой продукции диетического лечебного и диетического профилактического питания
  kaz: Жұмыскерлерге сүт немесе оған теңестірілген тамақ өнімдерін және (немесе) диеталық емдік және диеталық профилактикалық тамақтануға арналған тамақ өнімдерін беру нормаларын бекіту туралы
