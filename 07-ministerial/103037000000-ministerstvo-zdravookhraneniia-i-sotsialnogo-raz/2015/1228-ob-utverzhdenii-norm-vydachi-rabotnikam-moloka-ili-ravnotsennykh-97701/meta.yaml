  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 28 декабря 2015 года № 1056 «Об утверждении норм выдачи работникам молока или равноценных пищевых продуктов, и (или) специализированных продуктов для диетического (лечебного и профилактического) питания»
    kaz: «Жұмыскерлерге сүт немесе оған теңестірілген тамақ өнімдерін және (немесе) диеталық (емдік және профилактикалық) тамақтануға арналған арнайы өнімдер беру нормаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 28 желтоқсандағы № 1056 бұйрығына өзгерістер енгізу туралы
