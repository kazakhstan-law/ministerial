    kaz: «Жұмыскерлерге сүт немесе оған теңестірілген тамақ өнімдерін, емдік-профилактикалық тағам беру нормаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 28 желтоқсандағы № 1056 бұйрығына өзгеріс енгізу туралы
