title:
  rus: Об утверждении норм выдачи работникам молока или равноценных пищевых продуктов, и (или) специализированных продуктов для диетического (лечебного и профилактического) питания
  kaz: Жұмыскерлерге сүт немесе оған теңестірілген тамақ өнімдерін және (немесе) диеталық (емдік және профилактикалық) тамақтануға арналған арнайы өнімдер беру нормаларын бекіту туралы
