title:
  rus: Об утверждении Правил проведения фармаконадзора и мониторинга безопасности, качества и эффективности медицинских изделий
  kaz: Фармакологиялық қадағалауды және медициналық бұйымдардың қауіпсіздігіне, сапасы мен тиімділігіне мониторинг жүргізу қағидаларын бекіту туралы
