  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 29 мая 2015 года № 421 «Об утверждении Правил проведения фармаконадзора лекарственных средств и мониторинга побочных действий лекарственных средств, изделий медицинского назначения и медицинской техники»
    kaz: «Дәрілік заттарды фармакологиялық қадағалауды және дәрілік заттардың, медициналық мақсаттағы бұйымдар мен медициналық техниканың жанама әсерлерінің мониторингін жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 29 мамырдағы № 421 бұйрығына өзгерістер енгізу туралы
