act_code: '97677'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 21 декабря 2015 года № 982. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 декабря 2015 года № 12631
title:
  rus: Об утверждении Правил разработки, пересмотра, утверждения и применения Единого тарифно-квалификационного справочника работ и профессий рабочих, тарифно-квалификационных характеристик профессий рабочих, Квалификационного справочника должностей руководителей, специалистов и других служащих, а также типовых квалификационных характеристик должностей руководителей, специалистов и других служащих организаций
  kaz: Жұмыстар мен жұмысшы кәсіптерінің бірыңғай тарифтік-біліктілік анықтамалығын және Басшылар, мамандар және басқа да қызметшілер лауазымдарының, жұмысшы кәсіптерінің тарифтік-біліктілік сипаттамаларының біліктілік анықтамалығын және ұйымдар басшылары, мамандары және басқа да қызметшілері лауазымдарының үлгілік біліктілік сипаттамаларын әзірлеу, қайта қарау, бекіту және қолдану қағидаларын бекіту туралы
