requisite: Приказ и.о. Министра здравоохранения и социального развития Республики Казахстан от 30 июля 2015 года № 639. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 августа 2015 года № 11887. Утратил силу приказом и.о. Министра здравоохранения Республики Казахстан от 19 апреля 2019 года № ҚР ДСМ-42 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Правила формирования предельных цен и наценок на лекарственные средства и изделия медицинского назначения, закупаемых в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде сатып алынатын дәрілік заттар мен медициналық мақсаттағы бұйымдарға шекті бағаларды және үстеме бағаларды қалыптастыру қағидалары
