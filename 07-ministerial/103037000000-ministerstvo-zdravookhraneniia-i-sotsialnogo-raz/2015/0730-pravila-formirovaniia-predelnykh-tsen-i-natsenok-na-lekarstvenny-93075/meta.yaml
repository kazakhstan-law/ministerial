  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра здравоохранения и социального развития Республики Казахстан от 30 июля 2015 года № 639 "Об утверждении Правил формирования цен на лекарственные средства и изделия медицинского назначения в рамках гарантированного объема бесплатной медицинской помощи"
    kaz: '"Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде дәрілік заттар мен медициналық мақсаттағы бұйымдарға бағаларды қалыптастыру қағидаларын бекіту туралы" Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің міндетін атқарушының 2015 жылғы 30 шілдедегі № 639 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
