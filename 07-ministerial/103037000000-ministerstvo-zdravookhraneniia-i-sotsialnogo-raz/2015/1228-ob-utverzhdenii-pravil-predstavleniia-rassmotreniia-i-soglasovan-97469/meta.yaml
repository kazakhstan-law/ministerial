title:
  rus: Об утверждении Правил представления, рассмотрения и согласования норм труда и (или) параметров по системе оплаты труда работников организаций, на услуги (товары, работы) которых вводится государственное регулирование тарифов (цен, ставок сборов)
  kaz: Көрсетілетін қызметтеріне (тауарларына, жұмыстарына) тарифтерді (бағаларды, алым мөлшерлемелерін) мемлекеттік реттеу енгізілетін ұйымдарда еңбек нормаларын, ұйымдар жұмыскерлерінің еңбегіне ақы төлеу жүйесі бойынша өлшемдерді ұсыну, қарау және келісу қағидаларын бекіту туралы
