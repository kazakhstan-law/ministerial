  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 26 июня 2015 года № 525 «Об утверждении Правил закупатоваров и услуг для осуществления экспертизы при государственной регистрации лекарственных средств, изделий медицинского назначения и оценке их безопасности и качества»
    kaz: «Дәрілік заттарды, медициналық мақсаттағы бұйымдарды мемлекеттік тіркеу және олардың қауіпсіздігі мен сапасын бағалау кезінде сараптаманы жүзеге асыру үшін тауарлар мен көрсетілетін қызметтерді сатып алу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 26 маусымдағы № 525 бұйрығына өзгерістер енгізу туралы
