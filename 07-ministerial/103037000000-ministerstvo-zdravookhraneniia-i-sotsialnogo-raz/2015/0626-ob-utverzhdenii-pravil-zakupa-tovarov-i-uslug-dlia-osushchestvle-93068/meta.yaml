title:
  rus: Об утверждении Правил закупа товаров и услуг для осуществления экспертизы при государственной регистрации лекарственных средств, медицинских изделий и оценке их безопасности и качества
  kaz: Дәрілік заттар мен медициналық бұйымдарды мемлекеттік тіркеу және олардың қауіпсіздігі мен сапасын бағалау кезінде сараптаманы жүзеге асыру үшін тауарлар мен көрсетілетін қызметтерді сатып алу қағидаларын бекіту туралы
