  title:
    rus: О внесении изменения в приказ Министра здравоохранения и социального развития Республики Казахстан от 30 июня 2015 года № 544 "Об утверждении Правил направления граждан Республики Казахстан на лечение за рубеж за счет бюджетных средств"
    kaz: '"Қазақстан Республикасының азаматтарын бюджет қаражаты есебінен шетелге емделуге жіберу қағидаларын бекіту туралы" Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 30 маусымдағы № 544 бұйрығына өзгеріс енгізу туралы'
