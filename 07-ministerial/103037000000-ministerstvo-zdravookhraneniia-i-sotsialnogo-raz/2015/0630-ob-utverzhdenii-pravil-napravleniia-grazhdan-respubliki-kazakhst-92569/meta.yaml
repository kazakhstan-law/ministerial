act_code: '92569'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 30 июня 2015 года № 544. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июля 2015 года № 11795. Утратил силу приказом Министра здравоохранения Республики Казахстан от 26 мая 2021 года № ҚР ДСМ -45 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил направления граждан Республики Казахстан на лечение за рубеж за счет бюджетных средств
  kaz: Қазақстан Республикасының азаматтарын бюджет қаражаты есебінен шетелге емделуге жіберу қағидаларын бекіту туралы
