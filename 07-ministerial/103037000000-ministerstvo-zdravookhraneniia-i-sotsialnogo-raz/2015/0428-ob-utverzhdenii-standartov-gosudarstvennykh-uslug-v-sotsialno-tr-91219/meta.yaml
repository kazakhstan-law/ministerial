requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 28 апреля 2015 года № 279. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 июня 2015 года № 11342. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 25 марта 2021 года № 84 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
