  title:
    rus: О внесении изменений и дополнений в некоторые приказы Министра труда и социальной защиты населения Республики Казахстан и в приказ Министра здравоохранения и социального развития Республики Казахстан от 28 апреля 2015 года № 279 «Об утверждении стандартов государственных услуг в социально-трудовой сфере»
    kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің кейбір бұйрықтарына және Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 28 сәуірдегі № 279 «Әлеуметтік-еңбек саласындағы мемлекеттік көрсетілетін қызмет стандарттарын бекіту туралы» бұйрығына өзгерістер мен толықтырулар енгізу туралы
