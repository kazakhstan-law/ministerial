requisite: Совместный приказ Министра здравоохранения и социального развития Республики Казахстан от 29 декабря 2015 года № 1064 и Министра национальной экономики Республики Казахстан от 29 декабря 2015 года № 831. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12763. Утратил силу совместным приказом Министра здравоохранения Республики Казахстан от 15 ноября 2018 года № ҚР ДСМ-32 и Министра национальной экономики Республики Казахстан от 15 ноября 2018 года № 70 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
