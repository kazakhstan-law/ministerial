act_code: '94650'
requisite: Приказ от 04.09.2015 № 705, Министерство здравоохранения и социального развития Республики Казахстан
title:
  rus: Об утверждении Правил вывоза лекарственных средств, изделий медицинского назначения и медицинской техники с территории Республики Казахстан в составе материально-технических средств медицинских и аварийно-спасательных организаций и формирований, выбывающих с территории Республики Казахстан для участия в ликвидации чрезвычайных ситуаций
  kaz: Төтенше  жағдайларды жоюға қатысу үшін Қазақстан Республикасының аумағынан кететін медициналық және авариялық-құтқару ұйымдары мен құралымдарының материалдық-техникалық құралдарының құрамында дәрілік заттарды, медициналық мақсаттағы бұйымдарды және медициналық техниканы Қазақстан Республикасының аумағынан  әкету қағидаларын бекіту туралы
