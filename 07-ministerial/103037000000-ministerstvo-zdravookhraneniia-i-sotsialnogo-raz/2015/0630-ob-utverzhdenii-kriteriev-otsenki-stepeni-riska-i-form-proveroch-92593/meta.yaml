requisite: Совместный приказ Министра здравоохранения и социального развития Республики Казахстан от 30 июня 2015 года № 541 и Министра национальной экономики Республики Казахстан от 2 июля 2015 года № 496. Зарегистрирован в Министерстве юстиции Республики Казахстан от 3 августа 2015 года № 11825. Утратил силу совместным приказом Министра здравоохранения и социального развития Республики Казахстан от 25 декабря 2015 года № 1021 и Министра национальной экономики Республики Казахстан от 28 декабря 2015 года № 807
