  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 25 июня 2015 года № 516 "Об утверждении Перечня товаров, не относящихся к лекарственным средствам, изделиям медицинского назначения и медицинской технике"
    kaz: '"Дәрілік заттарға, медициналық мақсаттағы бұйымдар мен медициналық техникаға жатпайтын тауарлардың тізбесін бекіту туралы" Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 25 маусымдағы № 516 бұйрығына өзгерістер енгізу туралы'
