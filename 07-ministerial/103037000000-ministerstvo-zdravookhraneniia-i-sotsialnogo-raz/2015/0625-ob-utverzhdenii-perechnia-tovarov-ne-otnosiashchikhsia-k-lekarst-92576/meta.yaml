act_code: '92576'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 25 июня 2015 года № 516. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 июля 2015 года № 11806. Утратил силу приказом Министра здравоохранения Республики Казахстан от 25 ноября 2022 года № ҚР ДСМ-141 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Перечня товаров, не относящихся к лекарственным средствам и медицинским изделиям, разрешенных к оптовой и розничной реализации субъектами в сфере обращения лекарственных средств, медицинских изделий
  kaz: Дәрілік заттар мен медициналық бұйымдардың айналысы саласындағы субъектілерге көтерме және бөлшек саудада өткізуге рұқсат етілген дәрілік заттар мен медициналық бұйымдарға жатпайтын тауарлардың тізбесін бекіту туралы
