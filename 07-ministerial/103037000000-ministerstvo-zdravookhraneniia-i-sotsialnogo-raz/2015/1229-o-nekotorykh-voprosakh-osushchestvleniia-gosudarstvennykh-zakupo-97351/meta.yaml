act_code: '97351'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 29 декабря 2015 года № 1065. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12773. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 13 февраля 2019 года № 71 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О некоторых вопросах осуществления государственных закупок у общественных объединений инвалидов Республики Казахстан и организаций, созданных общественными объединениями инвалидов Республики Казахстан
  kaz: Қазақстан Республикасы мүгедектерінің қоғамдық бірлестіктерінен және Қазақстан Республикасы мүгедектерінің қоғамдық бірлестіктері құрған ұйымдардан мемлекеттік сатып алуды жүзеге асырудың кейбір мәселелері туралы
