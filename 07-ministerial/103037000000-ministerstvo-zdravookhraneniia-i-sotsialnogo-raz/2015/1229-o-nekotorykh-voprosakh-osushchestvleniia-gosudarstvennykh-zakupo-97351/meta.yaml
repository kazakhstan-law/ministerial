    kaz: «Қазақстан Республикасы мүгедектерінің қоғамдық бірлестіктерінен және Қазақстан Республикасы мүгедектерінің қоғамдық бірлестіктері құрған ұйымдардан мемлекеттік сатып алуды жүзеге асырудың кейбір мәселелері туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 29 желтоқсандағы № 1065 бұйрығына өзгерістер мен толықтырулар енгізу туралы
