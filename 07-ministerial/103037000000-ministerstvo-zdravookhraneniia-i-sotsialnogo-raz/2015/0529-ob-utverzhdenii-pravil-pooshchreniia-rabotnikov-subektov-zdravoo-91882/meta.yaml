title:
  rus: Об утверждении Правил поощрения работников субъектов здравоохранения, оказывающих медицинские услуги в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық қызметтер көрсететін денсаулық сақтау субъектілерінің жұмыскерлерін көтермелеу қағидаларын бекіту туралы
