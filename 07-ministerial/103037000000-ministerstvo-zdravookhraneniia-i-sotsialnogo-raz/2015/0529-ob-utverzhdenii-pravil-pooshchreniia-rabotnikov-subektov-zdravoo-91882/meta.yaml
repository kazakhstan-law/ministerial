  title:
    rus: О внесении изменений и дополнений в некоторые приказы Министра здравоохранения и Министра здравоохранения и социального развития в области здравоохранения
    kaz: «Денсаулық сақтау министрінің және Денсаулық сақтау және әлеуметтік даму министрінің денсаулық сақтау саласындағы кейбір бұйрықтарына өзгерістер мен толықтырулар енгізу туралы»
