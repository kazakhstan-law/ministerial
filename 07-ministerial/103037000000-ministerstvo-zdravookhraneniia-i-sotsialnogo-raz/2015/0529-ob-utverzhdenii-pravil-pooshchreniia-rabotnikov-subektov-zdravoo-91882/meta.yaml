  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 29 мая 2015 года № 429 «Об утверждении Правил поощрения работников организаций здравоохранения, участвующих в оказании комплекса мероприятий в рамках гарантированного объема бесплатной медицинской помощи»
    kaz: «Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде іс-шаралар кешенін көрсетуге қатысатын денсаулық сақтау ұйымдарының қызметкерлерін көтермелеу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 29 мамырдағы № 429 бұйрығына өзгерістер енгізу туралы
