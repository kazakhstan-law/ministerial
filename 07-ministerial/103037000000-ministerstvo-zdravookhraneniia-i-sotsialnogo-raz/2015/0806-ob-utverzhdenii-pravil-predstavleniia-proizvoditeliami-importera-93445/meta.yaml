requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 6 августа 2015 года № 655. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 сентября 2015 года № 11999. Утратил силу приказом Министра здравоохранения Республики Казахстан от 6 октября 2020 года № ҚР ДСМ-114/2020 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил представления производителями, импортерами табачных изделий отчетов о результатах лабораторных исследований по предельно допустимому содержанию никотина и смолистых веществ во всех марках табака и табачных изделий, ингредиентах табачных изделий
  kaz: Темекі және темекі бұйымдарын өндірушілердің, импорттаушылардың темекінің және темекі бұйымдарының барлық маркаларында никотиннің және шайырлы заттардың рұқсат етілетін шекті құрамы бойынша зертханалық зерттеулердің нәтижелері туралы темекі бұйымдарының ингредиенттері туралы есептерді ұсыну қағидаларын бекіту туралы
