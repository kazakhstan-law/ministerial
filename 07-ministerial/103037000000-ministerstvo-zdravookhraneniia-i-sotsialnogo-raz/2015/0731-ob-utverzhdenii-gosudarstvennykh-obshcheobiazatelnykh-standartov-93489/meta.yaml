    kaz: '"Медициналық және фармацевтикалық мамандықтар бойынша мемлекеттік жалпыға бірдей міндетті стандарттар мен үлгілік кәсіптік оқу бағдарламаларын бекіту туралы" Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің міндетін атқарушының 2015 жылғы 31 шілдедегі № 647 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
