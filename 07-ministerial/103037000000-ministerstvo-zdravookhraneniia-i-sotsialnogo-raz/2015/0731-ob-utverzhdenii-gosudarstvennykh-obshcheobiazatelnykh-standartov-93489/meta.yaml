  requisite: Приказ Министра здравоохранения Республики Казахстан от 11 октября 2018 года № ҚР ДСМ-26. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 ноября 2018 года № 17684. Утратил силу приказом и.о. Министра здравоохранения Республики Казахстан от 16 февраля 2023 года № 24 (вводится в действие после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения Республики Казахстан от 14 апреля 2017 года № 165 «Об утверждении Типовых программ повышения квалификации и переподготовки медицинских и фармацевтических кадров» и в приказ исполняющего обязанности Министра здравоохранения и социального развития Республики Казахстан от 31 июля 2015 года № 647 «Об утверждении государственных общеобязательных стандартов и типовых профессиональных учебных программ по медицинским и фармацевтическим специальностям»
    kaz: «Медициналық және фармацевтік кадрлардың біліктілігін арттыру және оларды қайта даярлаудың үлгілік бағдарламаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау министрінің 2017 жылғы 14 сәуірдегі № 165 және «Медициналық және фармацевтикалық мамандықтар бойынша мемлекеттік жалпыға бірдей міндетті стандарттар мен үлгілік кәсіптік оқу бағдарламаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің міндетін атқарушының 2015 жылғы 31 шілдедегі № 647 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/125743/rus
