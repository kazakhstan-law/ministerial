requisite: Приказ и.о. Министра здравоохранения и социального развития Республики Казахстан от 31 июля 2015 года № 647. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 сентября 2015 года № 12007. Утратил силу приказом Министра здравоохранения Республики Казахстан от 4 июля 2022 года № ҚР ДСМ-63 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении государственных общеобязательных стандартов и типовых профессиональных учебных программ по медицинским и фармацевтическим специальностям
  kaz: Медициналық және фармацевтикалық мамандықтар бойынша мемлекеттік жалпыға бірдей міндетті стандарттар мен үлгілік кәсіптік оқу бағдарламаларын бекіту туралы
