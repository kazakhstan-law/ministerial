  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 22 января 2015 года № 26 «О некоторых вопросах абилитации и реабилитации лиц с инвалидностью» и приказ Министра труда и социальной защиты населения Республики Казахстан от 27 декабря 2021 года № 502 «Об утверждении классификатора технических вспомогательных (компенсаторных) средств, специальных средств передвижения и услуг, предоставляемых инвалидам»
    kaz: «Мүгедектігі бар адамдарды абилитациялаудың және оңалтудың кейбір мәселелері туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 22 қаңтардағы № 26 бұйрығына және «Мүгедектігі бар адамдарға ұсынылатын техникалық көмекші (орнын толтырушы) құралдардың, арнаулы жүріп-тұру құралдарының және көрсетілетін қызметтердің сыныптауышын бекіту туралы» Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің 2021 жылғы 27 желтоқсандағы № 502 бұйрығына өзгерістер енгізу туралы
