requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 28 апреля 2015 года № 297. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 июня 2015 года № 11303. Утратил силу приказом Министра здравоохранения Республики Казахстан от 4 ноября 2020 года № ҚР ДСМ-180/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Выдача документов о прохождении повышения квалификации и переподготовки кадров отрасли здравоохранения»
  kaz: «Денсаулық сақтау саласы кадрларының біліктілігін арттырудан және қайта даярлаудан өткені туралы құжаттарды беру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
