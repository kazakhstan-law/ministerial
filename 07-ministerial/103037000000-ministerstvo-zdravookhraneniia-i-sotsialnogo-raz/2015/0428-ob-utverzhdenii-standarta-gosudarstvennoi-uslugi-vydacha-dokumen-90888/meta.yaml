  title:
    rus: «О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 28 апреля 2015 года № 297 «Об утверждении стандарта государственной услуги «Выдача документов о прохождении подготовки, повышении квалификации и переподготовке кадров отрасли здравоохранения»»
    kaz: «Денсаулық сақтау саласының кадрларын даярлықтан өткізу, олардың біліктілігін арттыру және қайта даярлау туралы құжаттарды беру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» «Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 28 сәуірдегі № 297 бұйрығына өзгерістер енгізу туралы»
