title:
  rus: Об утверждении Правил проведения аккредитации испытательных лабораторий, осуществляющих монопольную деятельность по экспертизе и оценке безопасности и качества лекарственных средств и медицинских изделий
  kaz: Дәрілік заттар мен медициналық бұйымдардың қауіпсіздігі мен сапасын сараптау және бағалау жөніндегі монополиялық қызметті жүзеге асыратын сынақ зертханаларын аккредиттеу қағидаларын бекіту туралы
