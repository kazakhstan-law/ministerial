  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 29 мая 2015 года № 427 «Об утверждении Правил осуществления сервисного обслуживания медицинской техники в Республике Казахстан»
    kaz: «Қазақстан Республикасында медициналық техникаға сервистік қызмет көрсетуді жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 29 мамырдағы № 427 бұйрығына өзгерістер енгізу туралы
