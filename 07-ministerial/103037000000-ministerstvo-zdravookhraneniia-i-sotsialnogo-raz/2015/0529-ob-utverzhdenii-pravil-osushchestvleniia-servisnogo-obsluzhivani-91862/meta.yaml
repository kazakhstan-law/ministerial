requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 29 мая 2015 года № 427. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июня 2015 года № 11481. Утратил силу приказом Министра здравоохранения Республики Казахстан от 15 декабря 2020 года № ҚР ДСМ-273/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил осуществления сервисного обслуживания медицинских изделий в Республике Казахстан
  kaz: Қазақстан Республикасында медициналық бұйымға сервистік қызмет көрсетуді жүзеге асыру қағидаларын бекіту туралы
