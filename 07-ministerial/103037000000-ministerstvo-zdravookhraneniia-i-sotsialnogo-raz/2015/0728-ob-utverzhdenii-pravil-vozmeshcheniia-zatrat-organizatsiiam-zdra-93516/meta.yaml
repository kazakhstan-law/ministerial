  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра здравоохранения и социального развития Республики Казахстан от 28 июля 2015 года № 627 «Об утверждении Правил возмещения затрат организациям здравоохранения за счет бюджетных средств»
    kaz: «Денсаулық сақтау ұйымдарына шығындарды бюджет қаражатының есебінен өтеу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің міндетін атқарушының 2015 жылғы 28 шілдедегі № 627 бұйрығына өзгерістер мен толықтырулар енгізу туралы
