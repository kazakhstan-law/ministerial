  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 8 декабря 2015 года № 944 «Об утверждении списка работ, на которых запрещается применение труда работников, не достигших восемнадцатилетнего возраста, предельных норм переноски и передвижения тяжестей работниками, не достигшими восемнадцатилетнего возраста, и списка работ, на которых ограничивается применение труда женщин, предельных норм подъема и перемещения вручную тяжестей женщинами»
    kaz: «Он сегіз жасқа толмаған жұмыскерлердің еңбегін пайдалануға тыйым салынатын жұмыстардың тізімін, он сегіз жасқа толмаған жұмыскерлердің ауыр заттарды тасуы мен қозғалтуының шекті нормаларын және әйелдердің еңбегін пайдалануға тыйым салынатын жұмыстардың тізімін, әйелдердің ауыр заттарды қолмен көтеруінің және жылжытуының шекті нормаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 8 желтоқсандағы № 944 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/161758/rus
