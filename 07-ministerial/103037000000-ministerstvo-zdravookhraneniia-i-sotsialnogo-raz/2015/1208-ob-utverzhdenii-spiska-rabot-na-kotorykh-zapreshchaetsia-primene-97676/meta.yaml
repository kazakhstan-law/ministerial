title:
  rus: Об утверждении списка работ, на которых запрещается применение труда работников, не достигших восемнадцатилетнего возраста, предельных норм переноски и передвижения тяжестей работниками, не достигшими восемнадцатилетнего возраста, и предельных норм подъема и перемещения вручную тяжестей женщинами
  kaz: Он сегіз жасқа толмаған жұмыскерлердің еңбегін пайдалануға тыйым салынатын жұмыстардың тізімін, он сегіз жасқа толмаған жұмыскерлердің ауыр заттарды тасуы мен қозғалтуының шекті нормаларын және әйелдердің ауыр заттарды қолмен көтеруінің және жылжытуының шекті нормаларын бекіту туралы
