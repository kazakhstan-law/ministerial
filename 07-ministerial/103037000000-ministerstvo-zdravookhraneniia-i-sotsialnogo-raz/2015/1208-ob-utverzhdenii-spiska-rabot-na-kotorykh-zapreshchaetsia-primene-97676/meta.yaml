  kaz: Он сегіз жасқа толмаған жұмыскерлердің еңбегін пайдалануға тыйым салынатын жұмыстардың тізімін, он сегіз жасқа толмаған жұмыскерлердің ауыр заттарды тасуы мен қозғалтуының шекті нормаларын және әйелдердің ауыр заттарды қолмен көтеруінің және жылжытуының шекті нормаларын бекіту туралы
