requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 25 февраля 2015 года № 97. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 марта 2015 года № 10577. Утратил силу приказом Министра здравоохранения Республики Казахстан от 14 декабря 2020 года № ҚР ДСМ-259/2020 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:
  rus: Об утверждении Положения о деятельности организаций и (или) структурных подразделений организаций здравоохранения, осуществляющих патологоанатомическую диагностику, и Правил проведения патологоанатомического вскрытия
  kaz: Патологиялық-анатомиялық диагностиканы жүзеге асыратын денсаулық сақтау ұйымдарының және (немесе) құрылымдық бөлімшелерінің қызметі туралы ережені және Патологиялық-анатомиялық ашып қарауды жүргізу қағидаларын бекіту туралы
