  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения и социального развития Республики Казахстан от 27 ноября 2015 года № 896 «Об утверждении натуральных норм питания для лиц, обслуживающихся в медико-социальных учреждениях, реабилитационных центрах, учебных заведениях для детей-инвалидов, территориальных центрах социального обслуживания, отделениях дневного пребывания, центрах социальной адаптации»
    kaz: «Медициналық-әлеуметтік мекемелерде, оңалту орталықтарында, мүгедек балаларға арналған оқу орындарында, аумақтық әлеуметтік қызмет көрсету орталықтарында, күндіз болу бөлімшелерінде, әлеуметтік бейімдеу орталықтарында қызмет көрсетілетін адамдар үшін заттай тамақтану нормаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрі міндетін атқарушының 2015 жылғы 27 қарашадағы № 896 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/172812/rus
