act_code: '97681'
requisite: Приказ и.о. Министра здравоохранения и социального развития Республики Казахстан от 27 ноября 2015 года № 896. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 января 2016 года № 12828
title:
  rus: Об утверждении натуральных норм питания для лиц, обслуживающихся в медико-социальных учреждениях, реабилитационных центрах, учебных заведениях для детей с инвалидностью, территориальных центрах социального обслуживания, отделениях дневного пребывания, центрах социальной адаптации
  kaz: Медициналық-әлеуметтік мекемелерде, оңалту орталықтарында, мүгедектігі бар балаларға арналған оқу орындарында, аумақтық әлеуметтік қызмет көрсету орталықтарында, күндіз болу бөлімшелерінде, әлеуметтік бейімдеу орталықтарында қызмет көрсетілетін адамдар үшін заттай тамақтану нормаларын бекіту туралы
