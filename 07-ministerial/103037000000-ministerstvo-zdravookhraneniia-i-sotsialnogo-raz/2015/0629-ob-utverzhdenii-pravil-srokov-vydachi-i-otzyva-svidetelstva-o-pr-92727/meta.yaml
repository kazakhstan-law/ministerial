  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 29 июня 2015 года № 531 «Об утверждении Правил выдачи и отзыва свидетельства о присвоении квалификационной категории для специалистов в области здравоохранения, за исключением специалистов в сфере санитарно-эпидемиологического благополучия населения»
    kaz: «Халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы мамандарды қоспағанда, денсаулық сақтау саласындағы мамандар үшін біліктілік санатын беру туралы куәлікті беру және қайтарып алу қағидаларын бекіту туралы» Қазақстан  Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 29 маусымдағы № 531 бұйрығына өзгерістер енгізу туралы
