act_code: '92727'
requisite: Приказ от 29.06.2015 № 531, Министерство здравоохранения и социального развития Республики Казахстан. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 июля 2015 года № 11787. Утратил силу приказом Министра здравоохранения Республики Казахстан от 15 декабря 2020 года № ҚР ДСМ-274/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил, сроков выдачи и отзыва свидетельства о присвоении квалификационной категории для специалистов в области здравоохранения, за исключением специалистов в сфере санитарно-эпидемиологического благополучия населения
  kaz: Халықтың санитариялық-эпидемиологиялық саламаттылығы саласындағы мамандарды қоспағанда, денсаулық сақтау саласындағы мамандар үшін біліктілік санатын беру туралы куәлікті беру және қайтарып алу қағидаларын, мерзімдерін бекіту туралы
