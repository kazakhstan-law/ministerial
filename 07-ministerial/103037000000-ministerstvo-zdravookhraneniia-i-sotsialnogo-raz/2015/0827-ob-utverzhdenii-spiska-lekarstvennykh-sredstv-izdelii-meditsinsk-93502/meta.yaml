  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения и социального развития Республики Казахстан от 27 августа 2015 года № 689 «Об утверждении Списка лекарственных средств, изделий медицинского назначения в рамках гарантированного объема бесплатной медицинской помощи, подлежащих закупу у Единого дистрибьютора на 2016 год»
    kaz: «2016 жылға арналған Бірыңғай дистрибьютордан сатып алуға жататын, тегін медициналық көмектің кепілдік берілген көлемінің шеңберінде дәрілік заттардың, медициналық мақсаттағы бұйымдардың тізімін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму Министрінің 2015 жылғы 27 тамыздағы № 689 бұйрығына өзгерістер мен толықтырулар енгізу туралы
