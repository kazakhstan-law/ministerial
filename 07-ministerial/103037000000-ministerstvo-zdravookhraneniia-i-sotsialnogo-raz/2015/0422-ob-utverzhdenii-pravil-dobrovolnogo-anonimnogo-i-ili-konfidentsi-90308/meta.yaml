act_code: '90308'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 22 апреля 2015 года № 246. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 мая 2015 года № 11145. Утратил силу приказом Министра здравоохранения Республики Казахстан от 25 ноября 2020 года № ҚР ДСМ-204/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил добровольного анонимного и (или) конфиденциального медицинского обследования и консультирования граждан Республики Казахстан, оралманов, иностранцев и лиц без гражданства, постоянно проживающих на территории Республики Казахстан, по вопросам ВИЧ-инфекции на бесплатной основе
  kaz: АИТВ инфекциясы мәселелері бойынша тегін негізде Қазақстан Республикасының азаматтарын, оралмандарды, шетел азаматтары мен Қазақстан Республикасының аумағында тұрақты тұратын азаматтығы жоқ адамдарды ерікті түрде анонимдік және (немесе) құпия медициналық зерттеп-қарау және консультация беру қағидаларын бекіту туралы
