  title:
    rus: О внесении изменений в совместный приказ Министра здравоохранения и социального развития Республики Казахстан от 25 декабря 2015 года № 1021 и Министра национальной экономики Республики Казахстан от 28 декабря 2015 года № 807 «Об утверждении критериев оценки степени риска и проверочных листов в сфере предоставления специальных социальных услуг и в области социальной защиты инвалидов»
    kaz: «Арнаулы әлеуметтік қызмет көрсету саласындағы және мүгедектерді әлеуметтік қорғау аясындағы тәуекел дәрежесін бағалау өлшемшарттары мен тексеру парақтарын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 25 желтоқсандағы № 1021 және Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 28 желтоқсандағы № 807 бірлескен бұйрығына өзгерістер енгізу туралы
