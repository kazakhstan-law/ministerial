act_code: '99099'
requisite: Совместный приказ Министра здравоохранения и социального развития Республики Казахстан от 25 декабря 2015 года № 1021 и Министра национальной экономики Республики Казахстан от 28 декабря 2015 года № 807. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12701
title:
  rus: Об утверждении Критериев оценки степени риска и проверочных листов в сфере предоставления специальных социальных услуг и в области социальной защиты лиц с инвалидностью
  kaz: Арнаулы әлеуметтік қызметтер көрсету саласындағы және мүгедектігі бар адамдарды әлеуметтік қорғау саласындағы тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парақтарын бекіту туралы
