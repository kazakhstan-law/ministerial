requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 31 марта 2015 года № 182. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 мая 2015 года № 10965. Утратил силу приказом Министра здравоохранения Республики Казахстан от 6 октября 2020 года № ҚР ДСМ-115/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил использования денег от физических и юридических лиц, в том числе пенсионных выплат и государственных социальных пособий, зачисляемых на контрольный счет наличности государственного психиатрического учреждения специализированного типа с интенсивным наблюдением, для использования психически больными, находящимися на принудительном лечении в учреждении
  kaz: Мекемеде мәжбүрлеп емдеуде жатқан психикалық науқастың пайдалануы үшін жеке және заңды тұлғалардан түсетін ақшаны, оның ішінде жіті байқау жасалатын мамандандырылған үлгідегі мемлекеттік психиатриялық мекеменің қолма-қол ақшасын бақылау шотына есепке алынатын зейнетақы төлемдері мен мемлекеттік әлеуметтік жәрдемақыларды пайдалану қағидаларын бекіту туралы
