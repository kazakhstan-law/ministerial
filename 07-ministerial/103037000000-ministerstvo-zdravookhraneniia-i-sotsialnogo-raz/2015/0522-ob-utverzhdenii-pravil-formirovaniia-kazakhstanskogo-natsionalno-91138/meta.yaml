act_code: '91138'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 22 мая 2015 года № 369. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 июня 2015 года № 11429. Утратил силу приказом и.о. Министра здравоохранения Республики Казахстан от 24 декабря 2020 года № ҚР ДСМ-326/2020 (вводится в действие после истечения десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил формирования Казахстанского национального лекарственного формуляра, перечня лекарственных средств и медицинских изделий для бесплатного и (или) льготного амбулаторного обеспечения отдельных категорий граждан с определенными заболеваниями (состояниями), а также разработки лекарственных формуляров организаций здравоохранения
  kaz: Қазақстандық ұлттық дәрілік формулярды, белгілі бір аурулары (жай-күйлері) бар азаматтардың жекелеген санаттарын тегін және (немесе) жеңілдікпен амбулаториялық қамтамасыз етуге арналған дәрілік заттар мен медициналық бұйымдардың тізбесін қалыптастыру, сондай-ақ денсаулық сақтау ұйымдарының дәрілік формулярларын әзірлеу қағидаларын бекіту туралы
