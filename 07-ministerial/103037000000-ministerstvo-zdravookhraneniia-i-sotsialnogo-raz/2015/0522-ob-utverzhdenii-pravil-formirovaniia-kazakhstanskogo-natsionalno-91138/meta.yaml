  title:
    rus: «О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 22 мая 2015 года № 369 «Об утверждении Правил формирования Казахстанского национального лекарственного формуляра, перечня лекарственных средств и медицинских изделий для бесплатного и (или) льготного амбулаторного обеспечения отдельных категорий граждан с определенными заболеваниями (состояниями), а также разработки лекарственных формуляров организаций здравоохранения»»
    kaz: «Қазақстандық ұлттық дәрілік формулярды, белгілі бір аурулары (жай-күйлері) бар азаматтардың жекелеген санаттарын тегін және (немесе) жеңілдікпен амбулаториялық қамтамасыз етуге арналған дәрілік заттар мен медициналық бұйымдардың тізбесін қалыптастыру, сондай-ақ денсаулық сақтау ұйымдарының дәрілік формулярларын әзірлеу қағидаларын бекіту туралы Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 22 мамырдағы № 369 бұйрығына өзгерістер енгізу туралы»
