  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 29 мая 2015 года № 428 «Об утверждении Методики осуществления экспертной оценки оптимальных технических характеристик и клинико-технического обоснования медицинской техники»
    kaz: «Медициналық техниканың оңтайлы техникалық сипаттамаларына және клиникалық-техникалық негіздемесіне сарапшылық бағалауды жүзеге асыру әдістемесін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 29 мамырдағы № 428 бұйрығына өзгерістер енгізу туралы
