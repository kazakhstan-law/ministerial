  title:
    rus: О внесении изменений и дополнений в некоторые приказы исполняющего обязанности Министра труда и социальной защиты населения Республики Казахстан, Министра здравоохранения и социального развития Республики Казахстан и исполняющего обязанности Министра здравоохранения и социального развития Республики Казахстан
    kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрі міндетін атқарушының, Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің және Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрі міндетін атқарушының кейбір бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
