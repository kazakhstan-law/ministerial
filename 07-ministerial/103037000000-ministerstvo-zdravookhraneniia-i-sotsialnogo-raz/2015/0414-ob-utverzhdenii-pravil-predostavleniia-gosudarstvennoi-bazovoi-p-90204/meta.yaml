act_code: '90204'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 14 апреля 2015 года № 223. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 мая 2015 года № 11110. Утратил силу приказом Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 27 июня 2023 года № 256 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил предоставления государственной базовой пенсионной выплаты за счет бюджетных средств, а также назначения и осуществления пенсионных выплат по возрасту, государственных социальных пособий по инвалидности, по случаю потери кормильца, государственных специальных пособий
  kaz: Мемлекеттiк базалық зейнетақы төлемiн бюджет қаражаты есебiнен беру, сондай-ақ жасына байланысты зейнетақы төлемдерін, мүгедектігі бойынша, асыраушысынан айрылу жағдайы бойынша берілетін мемлекеттік әлеуметтік жәрдемақыларды, мемлекеттік арнайы жәрдемақыларды тағайындау және жүзеге асыру қағидаларын бекіту туралы
