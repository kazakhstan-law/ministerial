  title:
    rus: О внесении изменений в некоторые приказы Министра труда и социальной защиты населения Республики Казахстан и исполняющего обязанности Министра здравоохранения и социального развития Республики Казахстан
    kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің және Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрі міндетін атқарушының кейбір бұйрықтарына өзгерістер енгізу туралы
