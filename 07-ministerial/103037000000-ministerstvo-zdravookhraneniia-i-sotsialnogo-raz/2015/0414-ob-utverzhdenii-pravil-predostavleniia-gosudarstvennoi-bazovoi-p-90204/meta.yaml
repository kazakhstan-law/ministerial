  code: '142672'
  requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 6 мая 2020 года № 163. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 мая 2020 года № 20605. Утратил силу приказом Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 27 июня 2023 года № 256 (вводится в действие с 1 июля 2023 года)
  title:
    rus: О внесении изменения в приказ Министра здравоохранения и социального развития Республики Казахстан от 14 апреля 2015 года № 223 «Об утверждении Правил предоставления государственной базовой пенсионной выплаты за счет бюджетных средств, а также назначения и осуществления пенсионных выплат по возрасту, государственных социальных пособий по инвалидности, по случаю потери кормильца, государственных специальных пособий»
    kaz: «Мемлекеттiк базалық зейнетақы төлемiн бюджет қаражаты есебiнен беру, сондай-ақ жасына байланысты зейнетақы төлемдерін, мүгедектігі бойынша, асыраушысынан айрылу жағдайы бойынша берілетін мемлекеттік әлеуметтік жәрдемақыларды, мемлекеттік арнайы жәрдемақыларды тағайындау және жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 14 сәуірдегі № 223 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/142672/rus
