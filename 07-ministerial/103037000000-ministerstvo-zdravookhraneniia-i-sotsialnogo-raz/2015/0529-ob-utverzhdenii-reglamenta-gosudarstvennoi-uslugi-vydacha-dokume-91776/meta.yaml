requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 29 мая 2015 года № 426. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 июля 2015 года № 11517. Утратил силу приказом Министра здравоохранения Республики Казахстан от 4 ноября 2020 года № ҚР ДСМ-180/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача документов о прохождении подготовки, повышения квалификации и переподготовки кадров отрасли здравоохранения»
  kaz: «Денсаулық сақтау саласының кадрларын даярлықтан өткізу, олардың біліктілігін арттыру және қайта даярлау туралы құжаттарды беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
