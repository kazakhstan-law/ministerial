title:
  rus: Об утверждении Правил производства и контроля качества, а также проведения испытаний стабильности и установления срока хранения и повторного контроля лекарственных средств и медицинских изделий
  kaz: Дәрілік заттар мен медициналық бұйымдарды өндіру және олардың сапасын бақылау, сондай-ақ тұрақтылығына сынақтар жүргізу және сақталу мерзімі мен қайта бақылау мерзімін белгілеу қағидаларын бекіту туралы
