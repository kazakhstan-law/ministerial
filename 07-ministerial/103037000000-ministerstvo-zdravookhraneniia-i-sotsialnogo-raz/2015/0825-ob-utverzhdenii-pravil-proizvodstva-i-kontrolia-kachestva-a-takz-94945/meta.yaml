requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 25 августа 2015 года № 680. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 октября 2015 года № 12133. Утратил силу приказом Министра здравоохранения Республики Казахстан от 28 октября 2020 года № ҚР ДСМ-165/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил производства и контроля качества, а также проведения испытаний стабильности и установления срока хранения и повторного контроля лекарственных средств и медицинских изделий
  kaz: Дәрілік заттар мен медициналық бұйымдарды өндіру және олардың сапасын бақылау, сондай-ақ тұрақтылығына сынақтар жүргізу және сақталу мерзімі мен қайта бақылау мерзімін белгілеу қағидаларын бекіту туралы
