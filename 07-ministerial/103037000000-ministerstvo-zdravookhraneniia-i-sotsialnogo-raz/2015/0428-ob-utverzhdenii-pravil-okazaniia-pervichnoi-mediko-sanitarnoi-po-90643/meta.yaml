  title:
    rus: О внесении дополнения в приказ Министра здравоохранения и социального развития Республики Казахстан от 28 апреля 2015 года № 281 «Об утверждении Правил оказания первичной медико-санитарной помощи и Правил прикрепления граждан к организациям первичной медико-санитарной помощи»
