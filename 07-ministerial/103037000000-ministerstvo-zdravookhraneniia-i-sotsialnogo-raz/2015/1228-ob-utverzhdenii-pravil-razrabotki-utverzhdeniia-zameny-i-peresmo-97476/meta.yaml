  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 28 декабря 2015 года № 1036 «Об утверждении Правил разработки, утверждения, замены и пересмотра норм труда работодателем, типовых норм и нормативов по труду, единых и (или) межотраслевых типовых норм и нормативов по труду для всех сфер деятельности»
    kaz: «Жұмыс берушінің еңбек нормаларын, еңбек жөніндегі үлгілік нормалар мен нормативтерді, қызметтің барлық салалары үшін еңбек жөніндегі бірыңғай және (немесе) салааралық үлгілік нормалар мен нормативтерді әзірлеу, бекіту, ауыстыру және қайта қарау қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 28 желтоқсандағы № 1036 бұйрығына өзгерістер енгізу туралы
