title:
  rus: Об утверждении Правил разработки, утверждения, замены и пересмотра единых межотраслевых или межотраслевых типовых или типовых норм и нормативов по труду для всех сфер деятельности, или типовых норм и нормативов по труду организаций
  kaz: Қызметтің барлық саласы үшін еңбек жөніндегі бірыңғай салааралық немесе салааралық үлгілік немесе үлгілік еңбек нормалары мен нормативтерді немесе ұйымдардың еңбек жөніндегі үлгілік нормалары мен нормативтерін әзірлеу, бекіту, ауыстыру және қайта қарау қағидаларын бекіту туралы
