act_code: '94323'
requisite: Приказ от 28.08.2015 № 697, Министерство здравоохранения и социального развития Республики Казахстан. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 октября 2015 года № 12130. Утратил силу приказом Министра здравоохранения и социального развития Республики Казахстан от 15 декабря 2015 года № 971
title:
  rus: Об утверждении Правил выдачи работникам молока, лечебно-профилактического питания, специальной одежды, специальной обуви и других средств индивидуальной защиты, обеспечения их средствами коллективной защиты, санитарно-бытовыми помещениями и устройствами за счет средств работодателя
  kaz: Жұмыс берушінің қаражаты есебінен қызметкерлерге сүт, емдік-профилактикалық тағам, арнаулы киім, арнаулы аяқ киім және басқа да жеке қорғану құралдарын беру, оларды ұжымдық қорғану құралдарымен, санитариялық-тұрмыстық үй-жайлармен және құрылғылармен қамтамасыз ету қағидаларын бекіту туралы
