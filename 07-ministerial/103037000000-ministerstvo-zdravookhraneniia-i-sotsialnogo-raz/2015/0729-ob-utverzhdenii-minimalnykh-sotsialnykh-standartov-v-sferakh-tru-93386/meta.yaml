  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения и социального развития Республики Казахстан от 29 июля 2015 года № 631 «Об утверждении минимальных социальных стандартов в сферах труда, социального обеспечения и здравоохранения»
    kaz: «Еңбек, әлеуметтік қамсыздандыру және денсаулық сақтау салаларындағы ең төмен әлеуметтік стандарттарды бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің міндетін атқарушының 2015 жылғы 29 шілдедегі № 631 бұйрығына өзгерістер енгізу туралы
