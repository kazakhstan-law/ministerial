requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 27 мая 2015 года № 390. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 июня 2015 года № 11439. Утратил силу приказом Министра здравоохранения Республики Казахстан от 30 декабря 2020 года № ҚР ДСМ-335/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил применения технических средств контроля, приборов наблюдения и фиксации, фото-, видеоаппаратуры, применяемых в медицинских организациях в целях обеспечения защиты прав пациентов
  kaz: Пациенттер құқықтарының қорғалуын қамтамасыз ету мақсаттарында медициналық  ұйымдарда қолданылатын техникалық бақылау құралдарын, байқау және  тіркеп-белгілеу аспаптарын, фото-, бейнеаппаратураларды қолдану қағидаларын бекіту туралы
