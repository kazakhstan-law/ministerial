  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 28 апреля 2015 года № 280 «Об утверждении Правил создания условий работодателями для прохождения профилактических медицинских осмотров лицам, подлежащим данным осмотрам в рамках гарантированного объема бесплатной медицинской помощи»
    kaz: «Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде профилактикалық медициналық қарап-тексеруге жататын адамдарға осы қарап-тексеруден өтуі үшін жұмыс берушілердің жағдай жасау қағидасын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 28 сәуірдегі № 280 бұйрығына өзгерістер енгізу туралы
