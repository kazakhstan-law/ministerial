act_code: '90516'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 28 апреля 2015 года № 280. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 июня 2015 года № 11267. Утратил силу приказом Министра здравоохранения Республики Казахстан от 9 июня 2023 года № 112 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил создания условий работодателями для прохождения профилактических медицинских осмотров лицам, подлежащим данным осмотрам в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде профилактикалық медициналық қарап тексеруге жататын адамдарға осы қарап-тексеруден өтуі үшін жұмыс берушілердің жағдай жасауы қағидаларын бекіту туралы
