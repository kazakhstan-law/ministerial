  code: '169394'
  requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 28 июня 2022 года № 222. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июня 2022 года № 28653
  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения и социального развития Республики Казахстан от 28 декабря 2015 года № 1053 «Об утверждении Списка производств, цехов, профессий и должностей, перечня тяжелых работ, работ с вредными и (или) опасными условиями труда, работа в которых дает право на сокращенную продолжительность рабочего времени, дополнительный оплачиваемый ежегодный трудовой отпуск и повышенный размер оплаты труда, а также правил их предоставления»
    kaz: «Ауыр жұмыстардың, еңбек жағдайлары зиянды және (немесе) қауіпті жұмыстардың тізбесін, жұмыс істеу жұмыс уақытының қысқартылған ұзақтығына, жыл сайынғы ақы төленетін қосымша еңбек демалысына және еңбекке ақы төлеудің жоғарылатылған мөлшеріне құқық беретін өндірістердің, цехтардың, кәсіптер мен лауазымдардың тізімін, сондай-ақ оларды беру қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 8 желтоқсандағы № 1053 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/169394/rus
