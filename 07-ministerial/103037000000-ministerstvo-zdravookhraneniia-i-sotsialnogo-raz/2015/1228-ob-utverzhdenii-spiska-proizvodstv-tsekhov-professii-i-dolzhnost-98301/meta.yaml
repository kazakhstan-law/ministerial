act_code: '98301'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 28 декабря 2015 года № 1053. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12731
title:
  rus: Об утверждении Списка производств, цехов, профессий и должностей, перечня тяжелых работ, работ с вредными и (или) опасными условиями труда, работа в которых дает право на сокращенную продолжительность рабочего времени, дополнительный оплачиваемый ежегодный трудовой отпуск и повышенный размер оплаты труда, а также правил их предоставления
  kaz: Ауыр жұмыстардың, еңбек жағдайлары зиянды және (немесе) қауіпті жұмыстардың тізбесін, жұмыс істеу жұмыс уақытының қысқартылған ұзақтығына, жыл сайынғы ақы төленетін қосымша еңбек демалысына және еңбекке ақы төлеудің жоғарылатылған мөлшеріне құқық беретін өндірістердің, цехтардың, кәсіптер мен лауазымдардың тізімін, сондай-ақ оларды беру қағидаларын бекіту туралы
