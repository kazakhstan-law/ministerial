  title:
    rus: О внесении изменений в некоторые приказы Министра труда и социальной защиты населения Республики Казахстан, исполняющего обязанности Министра здравоохранения и социального развития Республики Казахстан и Министра здравоохранения и социального развития Республики Казахстан
    kaz: Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің, Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің міндетін атқарушының және Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің кейбір бұйрықтарына өзгерістер енгізу туралы
