title:
  rus: Об утверждении Правил приостановления, запрета или изъятия из обращения либо ограничения применения лекарственных средств и медицинских изделий
  kaz: Дәрілік заттар мен медициналық бұйымдарды қолдануды тоқтата тұру, оған тыйым салу немесе айналыстан алып қою не олардың қолданылуын шектеу қағидаларын бекіту туралы
