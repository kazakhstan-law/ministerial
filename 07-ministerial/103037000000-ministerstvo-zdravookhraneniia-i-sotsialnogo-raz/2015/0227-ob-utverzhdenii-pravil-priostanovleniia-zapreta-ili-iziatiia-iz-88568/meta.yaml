  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 27 февраля 2015 года № 106 «Об утверждении Правил запрета, приостановления или изъятия из обращения лекарственных средств, изделий медицинского назначения и медицинской техники»
    kaz: «Дәрілік заттардың, медициналық мақсаттағы бұйымдар мен медициналық техниканың айналысына тыйым салу, оларды тоқтата тұру немесе айналыстан алып қою қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму Министрінің 2015 жылғы 27 ақпандағы № 106 бұйрығына өзгерістер енгізу туралы
