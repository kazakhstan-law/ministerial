  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 27 февраля 2015 года № 106 «Об утверждении Правил запрета, приостановления, изъятия или ограничения из обращения лекарственных средств, изделий медицинского назначения и медицинской техники»
    kaz: «Дәрілік заттарға, медициналық мақсаттағы бұйымдар мен медициналық техникаға тыйым салу, оларды тоқтата тұру, айналыстан алып қою немесе шектеу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 27 ақпандағы № 106 бұйрығына өзгерістер енгізу туралы
