  title:
    rus: О внесении изменений в совместный приказ Министра здравоохранения и социального развития Республики Казахстан от 25 декабря 2015 года № 1022 и Министра национальной экономики Республики Казахстан от 28 декабря 2015 года № 801 «Об утверждении Критериев оценки степени риска и проверочных листов за соблюдением трудового законодательства Республики Казахстан»
    kaz: «Қазақстан Республикасы еңбек заңнамасы сақталуының тәуекел дәрежесін бағалау өлшемшарттары мен тексеру парақтарын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 25 желтоқсандағы № 1022 және Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 28 желтоқсандағы № 801 бірлескен бұйрығына өзгерістер енгізу туралы
