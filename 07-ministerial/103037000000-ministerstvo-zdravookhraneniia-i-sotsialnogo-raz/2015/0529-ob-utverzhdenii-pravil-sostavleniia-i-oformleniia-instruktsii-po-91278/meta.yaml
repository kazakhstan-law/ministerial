    kaz: «Дәрілік заттарды және медициналық мақсаттағы бұйымдарды медициналық қолдану жөніндегі нұсқаулықты жасау және ресімдеу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 29 мамырдағы № 414 бұйрығына өзгерістер енгізу туралы
