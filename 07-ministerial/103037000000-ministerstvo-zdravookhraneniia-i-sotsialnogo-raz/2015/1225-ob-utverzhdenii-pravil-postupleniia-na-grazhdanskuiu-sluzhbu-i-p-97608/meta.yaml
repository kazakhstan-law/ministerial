  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 25 декабря 2015 года № 1017 «Об утверждении Правил поступления на гражданскую службу и проведения конкурса на занятие вакантной должности гражданского служащего»
    kaz: «Азаматтық қызметке кіру және азаматтық қызметшінің бос лауазымына орналасуға конкурс өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 25 желтоқсандағы № 1017 бұйрығына өзгерістер енгізу туралы
