act_code: '97608'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 25 декабря 2015 года № 1017. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12696
title:
  rus: Об утверждении Правил поступления на гражданскую службу и проведения конкурса на занятие вакантной должности гражданского служащего, за исключением первого руководителя и педагога государственной организации образования, а также первого руководителя государственной физкультурно-спортивной организации
  kaz: Мемлекеттік білім беру ұйымының бірінші басшысы мен педагогін, сондай-ақ мемлекеттік дене шынықтыру-спорт ұйымының бірінші басшысын қоспағанда, азаматтық қызметке кіру және азаматтық қызметшінің бос лауазымына орналасуға конкурс өткізу қағидаларын бекіту туралы
