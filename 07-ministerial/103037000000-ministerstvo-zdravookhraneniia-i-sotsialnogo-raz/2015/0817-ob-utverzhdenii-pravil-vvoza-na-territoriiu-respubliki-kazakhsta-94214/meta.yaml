  title:
    rus: О внесении изменения в приказ Министра здравоохранения и социального развития Республики Казахстан от 17 августа 2015 года № 668 «Об утверждении Правил ввоза на территорию Республики Казахстан лекарственных средств и медицинских изделий и вывоза с территории Республики Казахстан лекарственных средств и медицинских изделий и оказания государственной услуги «Выдача согласования и (или) заключения (разрешительного документа) на ввоз (вывоз) зарегистрированных и не зарегистрированных в Республике Казахстан лекарственных средств и медицинских изделий»
    kaz: «Дәрілік заттар мен медициналық бұйымдарды Қазақстан Республикасының аумағына әкелу және дәрілік заттар мен медициналық бұйымдарды Қазақстан Республикасының аумағынан әкету және «Қазақстан Республикасында тіркелген және тіркелмеген дәрілік заттар мен медициналық бұйымдарды әкелуге (әкетуге) келісім және (немесе) қорытынды (рұқсат беру құжатын) беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасының Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 17 тамыздағы № 668 бұйрығына өзгеріс енгізу туралы
