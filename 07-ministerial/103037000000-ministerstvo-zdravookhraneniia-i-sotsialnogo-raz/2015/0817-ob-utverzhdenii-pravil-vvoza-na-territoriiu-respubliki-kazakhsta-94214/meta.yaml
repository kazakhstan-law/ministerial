act_code: '94214'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 17 августа 2015 года № 668. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 сентября 2015 года № 12096. Утратил силу приказом Министра здравоохранения Республики Казахстан от 8 декабря 2020 года № ҚР ДСМ-237/2020 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении Правил ввоза на территорию Республики Казахстан лекарственных средств и медицинских изделий и вывоза с территории Республики Казахстан лекарственных средств и медицинских изделий и оказания государственной услуги «Выдача согласования и (или) заключения (разрешительного документа) на ввоз (вывоз) зарегистрированных и не зарегистрированных в Республике Казахстан лекарственных средств и медицинских изделий»
  kaz: Дәрілік заттар мен медициналық бұйымдарды Қазақстан Республикасының аумағына әкелу және дәрілік заттар мен медициналық бұйымдарды Қазақстан Республикасының аумағынан әкету және «Қазақстан Республикасында тіркелген және тіркелмеген дәрілік заттар мен медициналық бұйымдарды әкелуге (әкетуге) келісім және (немесе) қорытынды (рұқсат беру құжатын) беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы
