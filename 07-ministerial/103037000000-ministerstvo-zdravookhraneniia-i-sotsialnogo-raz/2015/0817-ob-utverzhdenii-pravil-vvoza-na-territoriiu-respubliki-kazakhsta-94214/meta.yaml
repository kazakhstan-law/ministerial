  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 17 августа 2015 года № 668 «Об утверждении Правил ввоза на территорию Республики Казахстан лекарственных средств, изделий медицинского назначения и медицинской техники и вывоза с территории Республики Казахстан лекарственных средств, изделий медицинского назначения и медицинской техники»
    kaz: «Дәрілік заттарды, медициналық мақсаттағы бұйымдар мен медициналық техниканы Қазақстан Республикасының аумағына әкелу және дәрілік заттарды, медициналық мақсаттағы бұйымдар мен медициналық техниканы Қазақстан Республикасының аумағынан әкету қағидаларын бекіту туралы» Қазақстан Республикасының Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 17 тамыздағы № 668 бұйрығына өзгерістер енгізу туралы
