requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 27 мая 2015 года № 391. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 июня 2015 года № 11470. Утратил силу приказом Министра здравоохранения и социального развития Республики Казахстан от 15 декабря 2015 года № 971
title:
  rus: Об утверждении списка работ, на которых запрещается применение труда работников, не достигших восемнадцатилетнего возраста, предельных норм переноски и передвижения тяжестей работниками, не достигшими восемнадцатилетнего возраста, и списка работ, на которых запрещается применение труда женщин, предельных норм подъема и перемещения вручную тяжестей женщинами
  kaz: Он сегіз жасқа толмаған қызметкерлердің еңбегін пайдалануға тыйым салынатын жұмыстардың тізімін, он сегіз жасқа толмаған қызметкерлердің ауыр заттарды тасуы мен жылжытуының шекті нормаларын және әйелдердің еңбегін пайдалануға тыйым салынатын жұмыстардың тізімін, әйелдердің ауыр заттарды қолмен көтеруінің және жылжытуының шекті нормаларын бекіту туралы
