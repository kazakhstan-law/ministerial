  title:
    rus: О внесении изменения в приказ Министра здравоохранения и социального развития Республики Казахстан от 25 декабря 2015 года № 1019 «Об утверждении Правил и сроков проведения обучения, инструктирования и проверок знаний по вопросам безопасности и охраны труда работников, руководителей и лиц, ответственных за обеспечение безопасности и охраны труда»
    kaz: «Жұмыскерлерді, басшылар мен еңбек қауіпсіздігін және еңбекті қорғауды қамтамасыз етуге жауапты адамдарды еңбек қауіпсіздігі және еңбекті қорғау мәселелері бойынша оқытудан, нұсқау беруден және білімін тексеруден өткізу қағидалары мен мерзімдерін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 25 желтоқсандағы № 1019 бұйрығына өзгеріс енгізу туралы
