title:
  rus: Об утверждении Правил и сроков проведения обучения, инструктирования и проверок знаний по вопросам безопасности и охраны труда работников, руководителей и лиц, ответственных за обеспечение безопасности и охраны труда
  kaz: Жұмыскерлерді, басшылар мен еңбек қауіпсіздігін және еңбекті қорғауды қамтамасыз етуге жауапты адамдарды еңбек қауіпсіздігі және еңбекті қорғау мәселелері бойынша оқытудан, нұсқау беруден және білімін тексеруден өткізу қағидалары мен мерзімдерін бекіту туралы
