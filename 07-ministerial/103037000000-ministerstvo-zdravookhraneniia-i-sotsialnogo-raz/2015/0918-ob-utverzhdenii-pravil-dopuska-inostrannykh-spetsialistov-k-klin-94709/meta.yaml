act_code: '94709'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 18 сентября 2015 года № 733. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 октября 2015 года № 12185. Утратил силу приказом Министра здравоохранения Республики Казахстан от 15 декабря 2020 года № ҚР ДСМ-274/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил допуска иностранных специалистов к клинической практике, за исключением лиц, приглашенных к осуществлению профессиональной медицинской деятельности в Национальном холдинге в области здравоохранения и его дочерних организациях, а также в "Назарбаев Университет" или его медицинских организациях, в медицинских организациях Управления делами Президента Республики Казахстан
  kaz: Денсаулық сақтау саласындағы ұлттық холдингте және оның еншiлес ұйымдарында, сондай-ақ «Назарбаев Университетінде» немесе оның медициналық ұйымдарында, Қазақстан Республикасы Президентінің Іс басқармасының медициналық ұйымдарында кәсіптік медициналық қызметті жүзеге асыруға шақырылған адамдарды қоспағанда, шетелдік мамандарды клиникалық практикаға жіберу қағидаларын бекіту туралы
