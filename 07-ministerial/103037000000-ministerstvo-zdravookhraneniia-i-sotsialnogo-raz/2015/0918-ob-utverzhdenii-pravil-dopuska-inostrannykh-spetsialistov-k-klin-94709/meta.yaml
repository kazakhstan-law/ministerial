  code: '113153'
  requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 26 мая 2017 года № 337. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 июня 2017 года № 15272. Утратил силу приказом Министра здравоохранения Республики Казахстан от 15 декабря 2020 года № ҚР ДСМ-274/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в приказ Министра здравоохранения и социального развития Республики Казахстан от 18 сентября 2015 года № 733 «Об утверждении Правил допуска иностранных специалистов к клинической практике, за исключением лиц, приглашенных к осуществлению профессиональной медицинской деятельности в Национальном холдинге в области здравоохранения и его дочерних организациях, а также в «Назарбаев Университет» или его медицинских организациях, в медицинских организациях Управления делами Президента Республики Казахстан»
    kaz: «Денсаулық сақтау саласындағы ұлттық холдингте және оның еншiлес ұйымдарында, сондай-ақ «Назарбаев Университетінде» немесе оның медициналық ұйымдарында, Қазақстан Республикасы Президентінің Іс басқармасының медициналық ұйымдарында кәсіптік медициналық қызметті жүзеге асыруға шақырылған адамдарды қоспағанда, шетелдік мамандарды клиникалық практикаға жіберу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 18 қыркүйектегі № 733 бұйрығына өзгеріс енгізу туралы
