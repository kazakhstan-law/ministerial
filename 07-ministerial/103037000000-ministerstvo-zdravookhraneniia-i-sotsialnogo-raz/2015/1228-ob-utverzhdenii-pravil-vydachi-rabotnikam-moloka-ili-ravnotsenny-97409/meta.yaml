  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 28 декабря 2015 года № 1054 «Об утверждении Правил выдачи работникам молока или равноценных пищевых продуктов и (или) специализированных продуктов для диетического (лечебного и профилактического) питания, специальной одежды и других средств индивидуальной защиты, обеспечения их средствами коллективной защиты, санитарно-бытовыми помещениями и устройствами за счет средств работодателя»
    kaz: Жұмыс берушінің қаражаты есебінен жұмыскерлерге сүт немесе оған теңестірілген тамақ өнімдері және (немесе) диеталық (емдік және профилактикалық) тамақтануға арналған арнайы өнімдер, арнайы киім және басқа да жеке қорғаныш құралдарын беру, оларды ұжымдық қорғаныш құралдарымен, санитариялық-тұрмыстық үй-жайлармен және құрылғылармен қамтамасыз ету қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2015 жылғы 28 желтоқсандағы № 1054 бұйрығына өзгерістер енгізу туралы
