act_code: '97409'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 28 декабря 2015 года № 1054. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2015 года № 12675
title:
  rus: Об утверждении Правил выдачи работникам молока или равноценных пищевых продуктов и (или) пищевой продукции диетического лечебного и диетического профилактического питания, специальной одежды и других средств индивидуальной защиты, обеспечения их средствами коллективной защиты, санитарно-бытовыми помещениями и устройствами за счет средств работодателя
  kaz: Жұмыс берушінің қаражаты есебінен жұмыскерлерге сүт немесе оған теңестірілген тамақ өнімдері және (немесе) диеталық емдік және диеталық профилактикалық тамақтануға арналған тамақ өнімдер, арнайы киім және басқа да жеке қорғаныш құралдарын беру, оларды ұжымдық қорғаныш құралдарымен, санитариялық-тұрмыстық үй-жайлармен және құрылғылармен қамтамасыз ету қағидаларын бекіту туралы
