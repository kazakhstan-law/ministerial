  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 26 ноября 2014 года № 269 «Об утверждении Правил проведения оценки безопасности и качества лекарственных средств и изделий медицинского назначения, зарегистрированных в Республике Казахстан»
    kaz: «Қазақстан Республикасында тіркелген дәрілік заттар мен медициналық мақсаттағы бұйымдардың қауіпсіздігі мен сапасын бағалауды жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2014 жылғы 26 қарашадағы № 269 бұйрығына өзгерістер енгізу туралы
