    kaz: «Қазақстан Республикасында тіркелген дәрілік заттар мен медициналық бұйымдардың қауіпсіздігі мен сапасын бағалауды жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2014 жылғы 26 қарашадағы № 269 бұйрығына толықтырулар енгізу туралы
