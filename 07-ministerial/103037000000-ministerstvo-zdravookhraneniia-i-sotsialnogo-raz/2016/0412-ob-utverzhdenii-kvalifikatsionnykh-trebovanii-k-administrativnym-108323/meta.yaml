act_code: '108323'
requisite: Приказ Ответственного секретаря министра здравоохранения и социального развития Республики Казахстан от 12 апреля 2016 года № 276
title:
  rus: Об утверждении квалификационных требований к административным государственным должностям корпуса «Б» заместителей председатели, руководителей и заместителей руководителей территориальных департаментов Комитета оплаты медицинских услуг Министерства здравоохранения и социального развития Республики Казахстан
  kaz: Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрлігінің Медициналық қызметке ақы төлеу комитеті төрағасының орынбасарлары және оның аумақтық департаменттерінің басшылары мен басшы орынбасарларының "Б" корпусы мемлекеттік әкімшілік лауазымдарына қойылатын біліктілік талаптарын бекіту туралы
