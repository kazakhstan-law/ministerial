  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра здравоохранения и социального развития Республики Казахстан от 15 января 2016 года № 19 «Об утверждении Правил предоставления статистической и иной отчетной информации Государственной корпорацией «Правительство для граждан» в сфере пенсионного и социального обеспечения»
    kaz: «Азаматтарға арналған үкімет» мемлекеттік корпорациясының зейнетақымен және әлеуметтік қамсыздандыру саласындағы статистикалық және өзге де есептік ақпаратты ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрі міндетін атқарушының 2016 жылғы 15 қаңтардағы №19 бұйрығына өзгерістер мен толықтыру енгізу туралы
