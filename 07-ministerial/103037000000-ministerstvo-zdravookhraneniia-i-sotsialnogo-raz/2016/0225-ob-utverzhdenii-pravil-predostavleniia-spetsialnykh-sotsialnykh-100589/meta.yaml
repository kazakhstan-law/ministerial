  title:
    rus: Предоставление специальных социальных услуг лицу (семье), не относящемуся (не относящейся) к нуждающимся в специальных социальных услугах, а также лицу, совершившему административное, уголовное правонарушение с применением насилия, на период установленных судом особых требований осуществляется за счет средств получателя услуг
    kaz: Арнаулы әлеуметтік көрсетілетін қызметтерге мұқтаждар қатарына жатпайтын адамға (отбасына), сондай-ақ әкімшілік, қылмыстық құқық бұзушылықты күш қолдана отырып жасаған адамға сот ерекше талаптар белгілеген кезеңде арнаулы әлеуметтік көрсетілетін қызметтер ұсыну көрсетілетін қызметтерді алушының қаражаты есебінен арнаулы әлеуметтік қызметтер көрсету қағидаларын бекіту туралы
