act_code: '103372'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 20 апреля 2016 года № 306
title:
  rus: О признании утратившим силу приказа Министра здравоохранения Республики Казахстан от 26 февраля 2014 года № 110 "Об утверждении квалификационных требований к категориям административных государственных должностей корпуса "Б" Комитета контроля медицинской и фармацевтической деятельности Министерства здравоохранения Республики Казахстан"
  kaz: '"Қазақстан Республикасы Денсаулық сақтау министрлігі Медициналық және фармацевтикалық қызметті бақылау комитетінің "Б" корпусы мемлекеттік әкімшілік лауазымдарының санаттарына қойылатын біліктілік талаптарын бекіту туралы" Қазақстан Республикасы Денсаулық сақтау министрінің 2014 жылғы 26 ақпандағы № 110 бұйрығының күшін жою туралы'
