title:
  rus: Об утверждении Правил рассмотрения и заверения приглашений граждан Республики Казахстан для переселения в Республику Казахстан родственников из числа этнических казахов, проживающих за рубежом, в целях воссоединения семьи
  kaz: Қазақстан Республикасы азаматтарының шетелдерде тұратын этникалық қазақтардың арасынан туыстарын Қазақстан Республикасына отбасына біріктіру мақсатында қоныстандыру үшін шақыруларын қарау және куәландыру қағидаларын бекіту туралы
