title:
  rus: Об утверждении Правил и условий исчисления стажа работы по специальности для гражданских служащих, работников организаций, содержащихся за счет средств государственного бюджета, работников казенных предприятий социального обеспечения
  kaz: Азаматтық қызметшілердің, мемлекеттік бюджет қаражаты есебінен ұсталатын ұйымдар қызметкерлерінің, әлеуметтік қамсыздандыру қазыналық кәсіпорындары қызметкерлерінің мамандығы бойынша жұмыс өтілін есептеу қағидалары мен шарттарын бекіту туралы
