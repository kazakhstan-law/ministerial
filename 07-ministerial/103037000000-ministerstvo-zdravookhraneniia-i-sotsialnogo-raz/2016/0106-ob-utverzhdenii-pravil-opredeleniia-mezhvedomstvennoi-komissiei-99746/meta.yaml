act_code: '99746'
requisite: Совместный приказ и.о. Министра здравоохранения и социального развития Республики Казахстан от 6 января 2016 года № 5 и Министра по инвестициям и развитию Республики Казахстан от 22 января 2016 года № 46. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 февраля 2016 года № 13212. Утратил силу совместным приказом Министра труда и социальной защиты населения Республики Казахстан от 22 октября 2019 года № 567 и Министра индустрии и инфраструктурного развития Республики Казахстан от 23 октября 2019 года № 798 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил определения межведомственной комиссией перечня категорий и численности иностранцев и лиц без гражданства, работающих в юридических лицах, являющихся участниками специальных экономических зон, с проектами стоимостью свыше одного миллиона месячных расчетных показателей, а также в организациях, привлекаемых указанными участниками специальных экономических зон (либо их подрядчиками) в качестве генерального подрядчика, подрядчика, субподрядчика или исполнителя услуг, в период выполнения строительно-монтажных работ на территории специальных экономических зон, и до истечения одного года после ввода объекта (объектов) в эксплуатацию
  kaz: Ведомствоаралық комиссияның арнайы экономикалық аймақтардың қатысушылары болып табылатын заңды тұлғаларда құны бір миллион айлық есептік көрсеткіштен жоғары жобалармен, сондай-ақ арнайы экономикалық аймақтардың аумағында құрылыс-монтаж жұмыстарын орындау кезеңінде және объект (объектілер) пайдалануға берілгеннен кейін бір жыл өткенге дейін арнайы экономикалық аймақтардың аталған қатысушылары (не олардың мердігерлері) бас мердігер, мердігер, қосалқы мердігер немесе көрсетілетін қызметтерді орындаушы ретінде тартатын ұйымдарда жұмыс істейтін шетелдіктер мен азаматтығы жоқ адамдар санаттары мен санының тізбесін айқындау қағидаларын бекіту туралы
