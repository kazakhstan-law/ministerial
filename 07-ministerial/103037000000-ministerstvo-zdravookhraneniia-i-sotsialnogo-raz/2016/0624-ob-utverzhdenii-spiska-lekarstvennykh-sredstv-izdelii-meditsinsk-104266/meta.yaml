    kaz: «2017 жылға арналған Бірыңғай дистрибьютордан сатып алынатын тегін медициналық көмектің кепілдік берілген көлемінің шеңберінде дәрілік заттардың, медициналық мақсаттағы бұйымдардың тізімін бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2016 жылғы 24 маусымдағы № 557 бұйрығына өзгерістер енгізу туралы
