requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 31 мая 2016 года № 466. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 июля 2016 года № 13887
title:
  rus: Об утверждении форм, предназначенных для осуществления социальной помощи в виде ежемесячных выплат гражданам Республики Казахстан после завершения периода капитализации платежей по возмещению вреда, причиненного жизни или здоровью работников юридическими лицами, ликвидированными вследствие банкротства
  kaz: Қызметкерлердің өмірі мен денсаулығына келтірілген зиянды өтеу жөніндегі төлемдерді капиталдандыру кезеңі аяқталғаннан кейін банкроттық салдарынан таратылған заңды тұлғалардың Қазақстан Республикасының азаматтарына ай сайынғы төлемдер түріндегі әлеуметтік көмекті жүзеге асыруға арналған нысандарды бекіту туралы
