act_code: '104546'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 26 мая 2016 года № 412. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 июля 2016 года № 13898. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 17 октября 2023 года № 446 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил квотирования рабочих мест для трудоустройства граждан из числа молодежи, потерявших или оставшихся до наступления совершеннолетия без попечения родителей, являющихся выпускниками организаций образования, лиц, освобожденных из мест лишения свободы, лиц, состоящих на учете службы пробации
  kaz: Ата-анасынан кәмелеттік жасқа толғанға дейін айырылған немесе ата-анасының қамқорлығынсыз қалған, білім беру ұйымдарының түлектері болып табылатын жастар қатарындағы азаматтарды, бас бостандығынан айыру орындарынан босатылған адамдарды, пробация қызметінің есебінде тұрған адамдарды жұмысқа орналастыру үшін жұмыс орындарын квоталау қағидаларын бекіту туралы
