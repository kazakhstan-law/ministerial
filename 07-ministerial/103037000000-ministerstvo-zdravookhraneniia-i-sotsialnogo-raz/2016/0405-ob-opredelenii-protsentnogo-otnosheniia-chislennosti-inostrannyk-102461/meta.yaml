requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 5 апреля 2016 года № 259. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 мая 2016 года № 13709. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 25 сентября 2017 года № 314 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
