title:
  rus: Об определении перечня, форм, сроков представления финансовой и иной отчетности Государственным фондом социального страхования и Государственной корпорацией «Правительство для граждан»
  kaz: Қаржылық және өзге де есептіліктің тізбесін, нысандарын, Мемлекеттік әлеуметтік сақтандыру қорының және «Азаматтарға арналған үкімет» мемлекеттік корпорациясының оларды ұсыну мерзімдерін айқындау туралы
