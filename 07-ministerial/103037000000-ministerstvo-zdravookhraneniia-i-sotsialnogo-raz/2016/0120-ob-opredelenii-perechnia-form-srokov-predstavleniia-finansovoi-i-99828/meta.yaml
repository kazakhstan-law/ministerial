  title:
    rus: О внесении изменений и дополнения в приказ Министра здравоохранения и социального развития Республики Казахстан от 20 января 2016 года № 34 «Об определении перечня, форм, сроков представления финансовой и иной отчетности Государственным фондом социального страхования и Государственной корпорацией «Правительство для граждан»
    kaz: «Қаржылық және өзге де есептіліктің тізбесін, нысандарын, Мемлекеттік әлеуметтік сақтандыру қорының және «Азаматтарға арналған үкімет» мемлекеттік корпорациясының оларды ұсыну мерзімдерін айқындау туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2016 жылғы 20 қаңтардағы № 34 бұйрығына өзгерістер мен толықтыру енгізу туралы
