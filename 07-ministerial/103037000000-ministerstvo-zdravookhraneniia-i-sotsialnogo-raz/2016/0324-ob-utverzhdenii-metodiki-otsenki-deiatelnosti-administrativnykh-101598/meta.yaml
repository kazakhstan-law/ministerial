requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 24 марта 2016 года № 215. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 апреля 2016 года № 13612. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 26 марта 2019 года № 142 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
