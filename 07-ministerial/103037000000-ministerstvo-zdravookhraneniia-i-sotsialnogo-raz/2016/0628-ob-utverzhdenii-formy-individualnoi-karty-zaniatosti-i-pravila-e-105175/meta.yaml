  title:
    rus: О внесении изменений и дополнений в приказ Министра здравоохранения и социального развития Респубилки Казахстан от 28 июня 2016 года № 576 «Об утверждении формы индивидуальной карты занятости и правила ее ведения» и приказ Министра труда и социальной защиты населения Республики Казахстан от 19 июня 2018 года № 259 «Об утверждении Правил регистрации лиц, ищущих работу, безработных и осуществления трудового посредничества, оказываемого центрами занятости населения»
    kaz: «Жұмыспен қамтудың жеке картасын және оны толтыру нысанын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2016 жылғы 28 маусымдағы № 576 бұйрығына және Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің «Жұмыс іздеп жүрген адамдарды, жұмыссыздарды тіркеу және халықты жұмыспен қамту орталықтары көрсететін еңбек делдалдығын жүзеге асыру қағидаларын бекіту туралы» 2018 жылғы 19 маусымдағы № 259 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/164512/rus
