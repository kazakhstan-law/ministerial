requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 28 июня 2016 года № 576. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 августа 2016 года № 14056. Утратил силу приказом Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 1 сентября 2023 года № 365 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
