  title:
    rus: О внесении изменений и дополнений в приказы Министра здравоохранения и социального развития Республики Казахстан от 14 июня 2016 года № 515 «Об утверждении Правил добровольного переселения лиц для повышения мобильности рабочей силы» и от 14 июня 2016 года № 516 «О некоторых вопросах содействия занятости населения»
    kaz: «Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің «Жұмыс күшінің ұтқырлығын арттыру үшін адамдардың ерікті түрде қоныс аудару қағидаларын бекіту туралы» 2016 жылғы 14 маусымдағы № 515 және «Халықты жұмыспен қамтуға жәрдемдесудің кейбір мәселелері туралы» 2016 жылғы 14 маусымдағы № 516 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
