  requisite: Приказ Министра труда и социальной защиты населения Республики Казахстан от 26 июня 2018 года № 266. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 июля 2018 года № 17190. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 25 мая 2023 года № 174 (вводится в действие с 1 июля 2023 года)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра здравоохранения и социального развития Республики Казахстан от 24 февраля 2016 года № 139 «Об утверждении Правил использования пенсионных выплат по возрасту, за выслугу лет и государственных социальных пособий по инвалидности, по случаю потери кормильца медико-социальными учреждениями (организациями)»
    kaz: «Медициналық-әлеуметтік мекемелердің (ұйымдардың) жасына байланысты, еңбек сіңірген жылдары үшін зейнетақы төлемдері мен мүгедектiгi бойынша, асыраушысынан айрылу жағдайы бойынша берілетін мемлекеттiк әлеуметтiк жәрдемақыларды пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрі міндетін атқарушының 2016 жылғы 24 ақпандағы № 139 бұйрығына өзгерістер енгізу туралы
