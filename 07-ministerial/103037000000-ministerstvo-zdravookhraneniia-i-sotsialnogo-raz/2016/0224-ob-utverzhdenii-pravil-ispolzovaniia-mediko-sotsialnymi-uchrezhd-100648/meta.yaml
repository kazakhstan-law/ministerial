requisite: Приказ и.о. Министра здравоохранения и социального развития Республики Казахстан от 24 февраля 2016 года № 139. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 марта 2016 года № 13533. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 25 мая 2023 года № 174 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил использования медико-социальными учреждениями (организациями) пенсионных выплат по возрасту, за выслугу лет и государственных социальных пособий по инвалидности и по случаю потери кормильца
  kaz: Медициналық-әлеуметтік мекемелердің (ұйымдардың) жасына байланысты, еңбек сіңірген жылдары үшін зейнетақы төлемдері мен мүгедектiгi бойынша, асыраушысынан айрылу жағдайы бойынша берілетін мемлекеттiк әлеуметтiк жәрдемақыларды пайдалану қағидаларын бекіту туралы
