act_code: '100048'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 8 февраля 2016 года № 95. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 марта 2016 года № 13404. Утратил силу приказом Министра здравоохранения Республики Казахстан от 30 ноября 2020 года № ҚР ДСМ-224/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Стандарта организации оказания медико-социальной помощи в области психического здоровья населению Республики Казахстан
  kaz: Қазақстан Республикасының халқына психикалық денсаулық саласында медициналық-әлеуметтік көмек көрсетуді ұйымдастыру стандартын бекіту туралы
