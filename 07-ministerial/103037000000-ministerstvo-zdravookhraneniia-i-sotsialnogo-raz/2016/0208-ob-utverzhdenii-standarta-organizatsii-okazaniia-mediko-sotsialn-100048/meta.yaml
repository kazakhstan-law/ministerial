  requisite: Приказ Министра здравоохранения Республики Казахстан от 24 сентября 2018 года № ҚР ДСМ-17. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 октября 2018 года № 17632. Утратил силу приказом Министра здравоохранения Республики Казахстан от 30 ноября 2020 года № ҚР ДСМ-224/2020 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра здравоохранения и социального развития Республики Казахстан от 8 февраля 2016 года № 95 «Об утверждении Стандарта оказания психиатрической помощи в Республике Казахстан» и о признании некоторых приказов утратившими силу
    kaz: «Қазақстан Республикасында психиатриялық көмек көрсетуді ұйымдастыру стандартын бекіту туралы» Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің 2016 жылғы 8 ақпандағы № 95 бұйрығына өзгерістер енгізу және кейбір бұйрықтардың күші жойылды деп тану туралы
