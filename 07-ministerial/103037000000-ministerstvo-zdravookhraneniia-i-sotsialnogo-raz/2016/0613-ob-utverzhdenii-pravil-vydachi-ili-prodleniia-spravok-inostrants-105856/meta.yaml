act_code: '105856'
requisite: Приказ Министра здравоохранения и социального развития Республики Казахстан от 13 июня 2016 года № 503. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 августа 2016 года № 14149. Утратил силу приказом Заместителя Премьер-Министра - Министра труда и социальной защиты населения Республики Казахстан от 22 июня 2023 года № 236 (вводится в действие с 1 июля 2023 года)
title:
  rus: Об утверждении Правил выдачи или продления справок иностранцу или лицу без гражданства о соответствии его квалификации для самостоятельного трудоустройства, перечня приоритетных отраслей (видов экономической деятельности) и востребованных в них профессий для самостоятельного трудоустройства иностранцев и лиц без гражданства
  kaz: Өз бетінше жұмысқа орналасуы үшін шетелдікке немесе азаматтығы жоқ адамға біліктілігінің сәйкестігі туралы анықтама беру немесе ұзарту қағидаларын, шетелдіктің немесе азаматтығы жоқ адамның өз бетінше жұмысқа орналасуы үшін басым салалардың (экономикалық қызмет түрлерінің) және олардағы сұранысқа ие кәсіптердің тізбесін бекіту туралы
