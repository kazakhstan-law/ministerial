    kaz: Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрі міндетін атқарушының, Қазақстан Республикасы Денсаулық сақтау және әлеуметтік даму министрінің және Қазақстан Республикасы Еңбек және халықты әлеуметтік қорғау министрінің кейбір бұйрықтарына өзгерістер енгізу туралы
