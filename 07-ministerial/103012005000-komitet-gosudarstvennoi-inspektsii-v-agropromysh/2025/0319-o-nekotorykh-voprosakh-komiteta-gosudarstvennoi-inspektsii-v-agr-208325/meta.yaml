  requisite: Приказ Председателя Комитета государственной инспекции в агропромышленном комплексе Министерства сельского хозяйства Республики Казахстан от 21 октября 2026 года № 113-Н
  title:
    rus: О внесении изменения и дополнений в приказ исполняющего обязанности Председателя Комитета государственной инспекции в агропромышленном комплексе Министерства сельского хозяйства Республики Казахстан от 19 марта 2025 года № 67-Н «О некоторых вопросах Комитета государственной инспекции в агропромышленном комплексе Министерства сельского хозяйства Республики Казахстан»
    kaz: «Қазақстан Республикасы Ауыл шаруашылығы министрлігі Агроөнеркәсіптік кешендегі мемлекеттік инспекция комитетінің кейбір мәселелері туралы» Қазақстан Республикасы Ауыл шаруашылығы министрлігі Агроөнеркәсіптік кешеніндегі мемлекеттік инспекция комитеті төрағасы міндетін атқарушысының 2025 жылғы 19 наурыздағы № 67-Н бұйрығына өзгеріс пен толықтырулар енгізу туралы
