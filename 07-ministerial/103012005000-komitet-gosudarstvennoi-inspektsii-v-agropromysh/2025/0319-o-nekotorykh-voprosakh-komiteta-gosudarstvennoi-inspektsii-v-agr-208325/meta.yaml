title:
  rus: О некоторых вопросах Комитета государственной инспекции в агропромышленном комплексе Министерства сельского хозяйства Республики Казахстан
  kaz: Қазақстан Республикасы Ауыл шаруашылығы министрлігі Агроөнеркәсіптік кешендегі мемлекеттік инспекция комитетінің кейбір мәселелері туралы
