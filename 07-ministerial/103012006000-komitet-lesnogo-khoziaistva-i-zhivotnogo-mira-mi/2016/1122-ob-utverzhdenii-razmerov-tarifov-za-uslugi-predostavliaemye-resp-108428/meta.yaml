requisite: Приказ и.о. Председателя Комитета лесного хозяйства и животного мира Министерства сельского хозяйства Республики Казахстан от 22 ноября 2016 года № 263. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 декабря 2016 года № 14540. Утратил силу приказом и.о. Председателя Комитета лесного хозяйства и животного мира Министерства экологии и природных ресурсов Республики Казахстан от 2 октября 2024 года № 233 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении размеров тарифов за услуги, предоставляемые республиканским государственным учреждением "Баянаульский государственный национальный природный парк" Комитета лесного хозяйства и животного мира Министерства сельского хозяйства Республики Казахстан физическим и юридическим лицам
  kaz: Қазақстан Республикасының Ауыл шаруашылығы министрлігі Орман шаруашылығы және жануарлар дүниесі комитетінің "Баянауыл мемлекеттік ұлттық табиғи паркі" республикалық мемлекеттік мекемесінің жеке және заңды тұлғаларға ұсынылатын қызметтері үшін тарифтер мөлшерлерін бекіту туралы
