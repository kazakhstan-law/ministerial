    kaz: Мемлекеттік орман қоры учаскелеріндегі қылқан жапырақты екпелерде санитариялық мақсатта ағаш кесуді жүргізуге тыйым салу туралы» Қазақстан Республикасы Ауыл шаруашылығы министрлігінің Орман шаруашылығы және жануарлар дүниесі комитеті төрағасының міндетін атқарушының 2016 жылғы 22 желтоқсандағы № 287 бұйрығына өзгерістер енгізу туралы
