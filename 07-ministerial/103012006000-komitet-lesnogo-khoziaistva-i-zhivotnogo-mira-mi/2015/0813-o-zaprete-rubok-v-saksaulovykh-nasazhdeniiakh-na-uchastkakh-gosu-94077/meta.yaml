    kaz: '"Мемлекеттік орман қоры учаскелеріндегі сексеуіл екпелерінде ағаш кесуге тыйым салу туралы" Қазақстан Республикасы Ауыл шаруашылығы министрлігінің Орман шаруашылығы және жануарлар дүниесі комитеті төрағасының 2015 жылғы 13 тамыздағы № 211 бұйрығына өзгеріс пен толықтыру енгізу туралы'
