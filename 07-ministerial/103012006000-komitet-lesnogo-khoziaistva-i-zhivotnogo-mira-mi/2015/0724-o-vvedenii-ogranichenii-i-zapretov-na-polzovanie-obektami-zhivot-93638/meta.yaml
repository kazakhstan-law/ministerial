act_code: '93638'
requisite: Приказ и.о. Председателя Комитета лесного хозяйства и животного мира Министерства сельского хозяйства Республики Казахстан от 24 июля 2015 года № 190. Зарегистрирован в Министерстве юстиции Республики Казахстан от 25 августа 2015 года № 11939. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 3 марта 2026 года № 78 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
