  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Председателя Комитета лесного хозяйства и животного мира Министерства сельского хозяйства Республики Казахстан от 24 июля 2015 года № 190 "О введении ограничений и запретов на пользование объектами животного мира, их частей и дериватов, установлении мест и сроков их пользования"
    kaz: '"Жануарлар дүниесі объектілерін, олардың бөліктері мен дериваттарын пайдалануға шектеулер мен тыйым салуды енгізу, оларды пайдалану орындары мен мерзімдерін белгілеу туралы" Қазақстан Республикасы Ауыл шаруашылығы министрлігі Орман шаруашылығы және жануарлар дүниесі комитетінің Төрағасы міндетін атқарушының 2015 жылғы 24 шілдедегі № 190 бұйрығына өзгерістер мен толықтыру енгізу туралы'
