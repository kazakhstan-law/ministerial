title:
  rus: Об утверждении квалификационных требований для осуществления деятельности по ликвидации (уничтожению, утилизации, захоронению) и переработке высвобождаемых боеприпасов, вооружений, военной техники, специальных средств и перечня документов, подтверждающих соответствие им
  kaz: Босатылатын оқ-дәрiлерді, қару-жарақтарды, әскери техниканы, арнаулы құралдарды жою (жою, тазарту, кәдеге жарату, көму) және қайта өңдеу жөнiндегi қызметтi жүзеге асыру үшін қойылатын біліктілік талаптарын және оларға сәйкестiкті растайтын құжаттар тiзбесін бекіту туралы
