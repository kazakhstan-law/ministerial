  requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 14 июля 2021 года № 369. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 июля 2021 года № 23552
  title:
    rus: О внесении изменений в приказы Министра цифрового развития, оборонной и аэрокосмической промышленности Республики Казахстан от 24 апреля 2019 года № 53/НҚ «Об утверждении квалификационных требований для осуществления деятельности по разработке, производству, ремонту, приобретению и реализации боеприпасов, вооружения и военной техники, запасных частей, комплектующих изделий и приборов к ним, а также специальных материалов и оборудования для их производства, включая монтаж, наладку, модернизацию, установку, использование, хранение, ремонт и сервисное обслуживание и перечня документов, подтверждающих соответствие им» и от 24 апреля 2019 года № 54/НҚ «Об утверждении квалификационных требований для осуществления деятельности по ликвидации (уничтожению, утилизации, захоронению) и переработке высвобождаемых боеприпасов, вооружений, военной техники, специальных средств и перечня документов, подтверждающих соответствие им»
    kaz: Қазақстан Республикасы Цифрлық даму, қорғаныс және аэроғарыш өнеркәсібі министрінің «Оқ-дәрілерді, қару-жарақ пен әскери техниканы, олардың қосалқы бөлшектерін, жинақтаушы бұйымдары мен аспаптарын, сондай-ақ монтаждауды, реттеуді, жаңғыртуды, орнатуды, пайдалануды, сақтауды, жөндеуді және сервистік қызмет көрсетуді қоса алғанда, оларды өндіруге арналған арнайы материалдар мен жабдықтарды әзірлеу, өндіру, жөндеу, сатып алу және сату жөніндегі қызметтi жүзеге асыру үшін қойылатын біліктілік талаптарын және оларға сәйкестiкті растайтын құжаттар тiзбесін бекіту туралы» 2019 жылғы 24 сәуірдегі № 53/НҚ және «Босатылатын оқ-дәрiлерді, қару-жарақтарды, әскери техниканы, арнаулы құралдарды жою (жою, тазарту, кәдеге жарату, көму) және қайта өңдеу жөнiндегi қызметтi жүзеге асыру үшін қойылатын біліктілік талаптарын және оларға сәйкестiкті растайтын құжаттар тiзбесін бекіту туралы» 2019 жылғы 24 сәуірдегі № 54/НҚ бұйрықтарына өзгерістер енгізу туралы
