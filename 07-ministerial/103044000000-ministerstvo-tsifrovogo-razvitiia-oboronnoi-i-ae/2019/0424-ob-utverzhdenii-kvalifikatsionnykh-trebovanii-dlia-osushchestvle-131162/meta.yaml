act_code: '131162'
requisite: Приказ Министра цифрового развития, оборонной и аэрокосмической промышленности Республики Казахстан от 24 апреля 2019 года № 53/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 апреля 2019 года № 18594
title:
  rus: Об утверждении квалификационных требований для осуществления деятельности по разработке, производству, ремонту, приобретению и реализации боеприпасов, вооружения и военной техники, запасных частей, комплектующих изделий и приборов к ним, а также специальных материалов и оборудования для их производства, включая монтаж, наладку, модернизацию, установку, использование, хранение, ремонт и сервисное обслуживание и перечня документов, подтверждающих соответствие им
  kaz: Оқ-дәрілерді, қару-жарақ пен әскери техниканы, олардың қосалқы бөлшектерін, жинақтаушы бұйымдары мен аспаптарын, сондай-ақ монтаждауды, реттеуді, жаңғыртуды, орнатуды, пайдалануды, сақтауды, жөндеуді және сервистік қызмет көрсетуді қоса алғанда, оларды өндіруге арналған арнайы материалдар мен жабдықтарды әзірлеу, өндіру, жөндеу, сатып алу және сату жөніндегі қызметтi жүзеге асыру үшін қойылатын біліктілік талаптарын және оларға сәйкестiкті растайтын құжаттар тiзбесін бекіту туралы
