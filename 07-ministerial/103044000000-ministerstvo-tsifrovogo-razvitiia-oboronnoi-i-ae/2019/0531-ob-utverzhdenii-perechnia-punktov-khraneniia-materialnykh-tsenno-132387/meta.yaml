    kaz: Қазақстан Республикасы Цифрлық даму, қорғаныс және аэроғарыш өнеркәсібі министрінің «Мемлекеттік материалдық резервтің материалдық құндылықтарын сақтау пункттерінің тізбесін бекіту туралы» 2019 жылғы 31 мамырдағы № 106/НҚ бұйрығына толықтырулар енгізу туралы
