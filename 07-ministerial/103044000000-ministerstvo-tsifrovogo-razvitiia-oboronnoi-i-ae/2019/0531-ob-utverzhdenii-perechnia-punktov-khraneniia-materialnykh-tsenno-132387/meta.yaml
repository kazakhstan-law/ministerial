  title:
    rus: О внесении изменения и дополнения в приказ Министра цифрового развития, оборонной и аэрокосмической промышленности Республики Казахстан от 31 мая 2019 года № 106/НҚ «Об утверждении перечня пунктов хранения материальных ценностей государственного материального резерва»
    kaz: Қазақстан Республикасы Цифрлық даму, қорғаныс және аэроғарыш өнеркәсібі министрінің «Мемлекеттік материалдық резервтің материалдық құндылықтарын сақтау пункттерінің тізбесін бекіту туралы» 2019 жылғы 31 мамырдағы № 106/НҚ бұйрығына өзгеріс пен толықтыру енгізу туралы
