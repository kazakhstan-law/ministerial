  title:
    rus: О внесении изменений в приказ Министра цифрового развития, оборонной и аэрокосмической промышленности Республики Казахстан от 11 апреля 2019 года № 37/НҚ «Об утверждении Перечня приоритетных видов деятельности в области информационно-коммуникационных технологий и критериев собственного производства»
    kaz: Ақпараттық-коммуникациялық технологиялар саласындағы қызметтің басым түрлерінің тізбесін және өз өндірісінің өлшемшарттарын бекіту туралы Қазақстан Республикасы Цифрлық даму, қорғаныс және аэроғарыш өнеркәсібі министрінің 2019 жылғы 11 сәуірдегі № 37/НҚ бұйрығына өзгерістер енгізу туралы
