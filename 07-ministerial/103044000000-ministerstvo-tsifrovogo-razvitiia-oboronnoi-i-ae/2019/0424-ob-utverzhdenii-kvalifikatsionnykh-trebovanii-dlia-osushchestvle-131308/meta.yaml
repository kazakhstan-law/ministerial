act_code: '131308'
requisite: Приказ Министра цифрового развития, оборонной и аэрокосмической промышленности Республики Казахстан от 24 апреля 2019 года № 55/НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 мая 2019 года № 18623. Утратил силу приказом и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 18 февраля 2020 года № 77 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении квалификационных требований для осуществления деятельности по разработке, производству, ремонту, торговле, приобретению боевого ручного стрелкового оружия и патронов к нему и перечня документов, подтверждающих соответствие им
  kaz: Жауынгерлік қол атыс қаруы мен оның патрондарын әзірлеу, жасау, жөндеу, сату, сатып алу жөніндегі қызметті жүзеге асыру үшін қойылатын біліктілік талаптарын және оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы
