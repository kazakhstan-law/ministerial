title:
  rus: Об утверждении Правил представления сведений о привлеченных иностранцах и лицах без гражданства международным технологическим парком «Астана Хаб», представляемых уполномоченному органу по вопросам миграции населения и Комитету национальной безопасности Республики Казахстан
  kaz: Халықтың көші-қоны мәселелері жөніндегі уәкілетті органға және Қазақстан Республикасының Ұлттық қауіпсіздік комитетіне ұсынылатын «Астана Хаб» халықаралық технологиялық паркіне тартылған шетелдіктер мен азаматтығы жоқ тұлғалар туралы мәліметтерді ұсыну қағидаларын бекіту туралы
