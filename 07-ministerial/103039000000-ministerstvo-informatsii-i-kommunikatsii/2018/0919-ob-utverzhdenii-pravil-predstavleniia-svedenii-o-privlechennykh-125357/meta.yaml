  title:
    rus: О внесении изменений в приказ Министра информации и коммуникаций Республики Казахстан от 19 сентября 2018 года № 406 «Об утверждении Правил представления сведений о привлеченных иностранцах и лицах без гражданства международным технологическим парком «Астана Хаб» представляемых уполномоченному органу по вопросам миграции населения и Комитету национальной безопасности»
    kaz: «Халықтың көші-қоны мәселелері жөніндегі уәкілетті органға және Ұлттық қауіпсіздік комитетіне ұсынылатын «Астана Хаб» халықаралық технологиялық паркі тартқан шетелдіктер мен азаматтығы жоқ адамдар туралы мәліметтерді ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Ақпарат және коммуникациялар министрінің 2018 жылғы 19 қырқүйектегі № 406 бұйрығына өзгерістер енгізу туралы
