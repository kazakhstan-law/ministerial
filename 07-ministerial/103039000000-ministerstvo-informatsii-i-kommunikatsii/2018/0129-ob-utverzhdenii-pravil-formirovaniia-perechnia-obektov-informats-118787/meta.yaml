  title:
    rus: О внесении изменений в приказ Министра информации и коммуникации Республики Казахстан от 29 января 2018 года № 29 «Об утверждении Правил формирования перечня объектов информационно-коммуникационной инфраструктуры «электронного правительства», закрепляемых за оператором информационно-коммуникационной инфраструктуры «электронного правительства»
    kaz: Қазақстан Республикасы ақпарат және коммуникация Министрінің бұйрығына 2018 жылдан бастап 29 қаңтардағы № 29"электрондық үкіметтің" ақпараттық-коммуникациялық инфрақұрылымы операторына бекітіп берілетін "электрондық үкіметтің" ақпараттық-коммуникациялық инфрақұрылымы объектілерінің тізбесін қалыптастыру ережелерін бекіту" өзгерістер енгізу туралы.
