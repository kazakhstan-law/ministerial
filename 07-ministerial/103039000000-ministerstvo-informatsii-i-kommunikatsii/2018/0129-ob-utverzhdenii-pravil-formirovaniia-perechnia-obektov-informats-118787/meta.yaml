requisite: Приказ Министра информации и коммуникаций Республики Казахстан от 29 января 2018 года № 29. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 февраля 2018 года № 16331
title:
  rus: Об утверждении Правил формирования перечня объектов информационно-коммуникационной инфраструктуры «электронного правительства», а также программных продуктов информационно-коммуникационной платформы «электронного правительства», закрепляемых за оператором информационно-коммуникационной инфраструктуры «электронного правительства
  kaz: «Электрондық үкіметтің» ақпараттық-коммуникациялық инфрақұрылымының операторына бекітіп берілетін «электрондық үкіметтің» ақпараттық-коммуникациялық инфрақұрылымы объектілерінің, сондай-ақ «электрондық үкіметтің» ақпараттық-коммуникациялық платформасының бағдарламалық өнімінің тізбесін қалыптастыру қағидаларын бекіту туралы
