  title:
    rus: О внесении изменений в приказ Министра информации и коммуникаций Республики Казахстан от 29 января 2018 года № 29 «Об утверждении Правил формирования перечня интернет-ресурсов государственных органов и объектов информационно-коммуникационной инфраструктуры «электронного правительства», закрепляемых за оператором информационно-коммуникационной инфраструктуры «электронного правительства»
    kaz: «Электрондық үкіметтің» ақпараттық-коммуникациялық инфрақұрылымының операторына бекітіп берілетін мемлекеттік органдардың интернет-ресурстарының және «электрондық үкiметтiң» ақпараттық-коммуникациялық инфрақұрылымы объектілерінің тізбесін қалыптастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ақпарат және коммуникациялар министрінің 2018 жылғы 29 қаңтардағы № 29 бұйрығына өзгерістер енгізу туралы
