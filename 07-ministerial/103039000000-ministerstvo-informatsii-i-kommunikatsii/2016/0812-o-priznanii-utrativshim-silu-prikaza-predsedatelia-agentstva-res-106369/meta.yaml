title:
  rus: О признании утратившим силу приказа Председателя Агентства Республики Казахстан по информатизации и связи от 4 декабря 2009 года № 491 "Об утверждении Инструкции по осуществлению транзакционных сервисов "электронного правительства" Республики Казахстан"
  kaz: '"Қазақстан Республикасы "электрондық үкімет" транзакциялық сервистерін жүзеге асыру бойынша Нұсқаулықты бекіту туралы" Қазақстан Республикасы Ақпараттандыру және байланыс агенттігі Төрағасының 2009 жылғы 4 желтоқсандағы № 491 бұйрықтың күшін жою туралы'
