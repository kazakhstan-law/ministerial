  title:
    rus: О внесении изменений в приказ Министра информации и коммуникаций Республики Казахстан от 17 октября 2016 года № 207 «Об утверждении требований к сетям и средствам почтовой связи для целей проведения оперативно-розыскных мероприятий, а также Правил взаимодействия при внедрении и эксплуатации аппаратно-программных и технических средств проведения оперативно-розыскных мероприятий на почтовых сетях Республики Казахстан»
    kaz: «Жедел-іздестіру іс-шараларын жүргізу мақсатында пошта байланысы желілері мен құралдарына қойылатын талаптарды, сондай-ақ Қазақстан Республикасының пошта желілерінде жедел-іздестіру іс-шараларын жүргізудің аппараттық-бағдарламалық және техникалық құралдарын енгізу және пайдалану кезіндегі өзара іс-қимыл жасау қағидаларын бекіту туралы» Қазақстан Республикасы Ақпарат және коммуникациялар министрінің 2016 жылғы 17 қазандағы № 207 бұйрығына өзгерістер енгізу туралы
