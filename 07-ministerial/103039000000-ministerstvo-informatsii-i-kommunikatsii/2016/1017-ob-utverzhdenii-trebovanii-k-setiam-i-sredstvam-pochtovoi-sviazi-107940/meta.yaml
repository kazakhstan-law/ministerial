title:
  rus: Об утверждении требований к сетям и средствам почтовой связи для целей проведения оперативно-розыскных, контрразведывательных мероприятий, а также Правил взаимодействия при внедрении и эксплуатации аппаратно-программных и технических средств проведения оперативно-розыскных, контрразведывательных мероприятий на почтовых сетях Республики Казахстан
  kaz: Жедел-іздестіру, қарсы барлау іс-шараларын жүргізу мақсатында пошта байланысы желілері мен құралдарына қойылатын талаптарды, сондай-ақ Қазақстан Республикасының пошта желілерінде жедел-іздестіру, қарсы барлау іс-шараларын жүргізудің аппараттық-бағдарламалық және техникалық құралдарын енгізу және пайдалану кезіндегі өзара іс-қимыл жасау қағидаларын бекіту туралы
