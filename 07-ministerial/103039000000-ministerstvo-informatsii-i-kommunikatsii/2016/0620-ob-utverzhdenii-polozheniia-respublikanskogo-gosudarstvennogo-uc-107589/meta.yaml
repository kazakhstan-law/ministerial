  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра информации и коммуникаций Республики Казахстан от 20 июня 2016 года № 6 "Об утверждении Положения республиканского государственного учреждения "Комитет государственного контроля в области связи, информатизации и средств массовой информации Министерства информации и коммуникаций Республики Казахстан"
    kaz: '"Қазақстан Республикасы Ақпарат және коммуникациялар министрлігінің Байланыс, ақпараттандыру және бұқаралық ақпарат құралдары саласындағы мемлекеттік бақылау комитеті" республикалық мемлекеттік мекемесінің ережесін бекіту туралы" Қазақстан Республикасы Ақпарат және коммуникациялар министрінің міндетін атқарушысының 2016 жылғы 20 маусымдағы № 6 бұйрығына өзгерістер енгізу туралы'
