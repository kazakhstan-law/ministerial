requisite: Приказ и.о. Министра информации и коммуникации Республики Казахстан от 20 июня 2016 года № 6. Утратил силу приказом Министра информации и коммуникаций Республики Казахстан от 15 декабря 2017 года № 445 (вводится в действие со дня введения в действие постановления Правительства Республики Казахстан от 25 ноября 2017 года № 773)
title:
  rus: Об утверждении Положения республиканского государственного учреждения "Комитет государственного контроля в области связи, информатизации и средств массовой информации Министерства информации и коммуникаций Республики Казахстан"
  kaz: '"Қазақстан Республикасы Ақпарат және коммуникациялар министрлігінің Байланыс, ақпараттандыру және бұқаралық ақпарат құралдары саласындағы мемлекеттік бақылау комитеті" республикалық мемлекеттік мекемесінің ережесін бекіту туралы'
