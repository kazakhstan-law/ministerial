requisite: Приказ Министра информации и коммуникаций Республики Казахстан от 30 июня 2016 года № 22. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 июля 2016 года № 13974. Утратил силу приказом и.о. Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 28 июля 2021 года № 270/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил размещения и публичного обсуждения проектов концепций законопроектов и проектов нормативных правовоых актов на интернет-портале открытых нормативных правовых актов
  kaz: Ашық нормативтік құқықтық актілердің интернет-порталына заң жобалары тұжырымдамаларының жобалары мен нормативтік құқықтық актілердің жобаларын орналастыру және оларды көпшілік талқылауы қағидаларын бекіту туралы
