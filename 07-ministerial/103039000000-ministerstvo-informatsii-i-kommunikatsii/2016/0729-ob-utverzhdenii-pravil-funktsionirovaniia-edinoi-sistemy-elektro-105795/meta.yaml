requisite: Приказ Министра информации и коммуникаций Республики Казахстан от 29 июля 2016 года № 71. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 августа 2016 года № 14157. Утратил силу приказом Министра цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 28 мая 2024 года № 305/НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
