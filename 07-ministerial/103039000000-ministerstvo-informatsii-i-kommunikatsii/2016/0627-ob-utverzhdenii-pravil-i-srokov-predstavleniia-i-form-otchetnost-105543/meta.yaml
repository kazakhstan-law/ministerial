title:
  rus: Об утверждении Правил и сроков представления и форм отчетности, а также требований к представляемой информации о ходе и результатах использования связанных грантов на создание или развитие информационных систем
  kaz: Есептілікті ұсыну қағидалары мен мерзімдерін және нысандарын, сондай-ақ ақпараттық жүйелерді құру немесе дамытуға байланысты гранттарды пайдалану барысы мен нәтижелері туралы ұсынылатын ақпаратқа қойылатын талаптарды бекіту туралы
