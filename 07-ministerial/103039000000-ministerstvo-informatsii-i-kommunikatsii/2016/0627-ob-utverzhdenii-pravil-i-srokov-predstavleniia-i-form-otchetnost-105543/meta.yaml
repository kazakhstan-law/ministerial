  title:
    rus: О внесении изменения в приказ Министра информации и коммуникаций Республики Казахстан от 27 июня 2016 года № 14 «Об утверждении Правил и сроков представления и форм отчетности, а также требований к представляемой информации о ходе и результатах использования связанных грантов на создание или развитие информационных систем»
    kaz: «Есептілікті ұсыну қағидалары мен мерзімдерін және нысандарын, сондай-ақ ақпараттық жүйелерді құру немесе дамытуға байланысты гранттарды пайдалану барысы мен нәтижелері туралы ұсынылатын ақпаратқа қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Ақпарат және коммуникациялар министрінің 2016 жылғы 27 маусымдағы № 14 бұйрығына өзгеріс енгізу туралы
