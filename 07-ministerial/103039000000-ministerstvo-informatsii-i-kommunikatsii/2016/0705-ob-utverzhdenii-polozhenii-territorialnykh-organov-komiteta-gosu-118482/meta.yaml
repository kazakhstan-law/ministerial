  title:
    rus: О внесении дополнений в приказ Министра информации и коммуникаций Республики Казахстан от 5 июля 2016 года № 25 «Об утверждении положений территориальных органов Комитета государственного контроля в области связи, информатизации и средств массовой информации Министерства информации и коммуникаций Республики Казахстан»
    kaz: «Қазақстан Республикасы Ақпарат және коммуникациялар министрлігі Байланыс, ақпараттандыру және бұқаралық ақпарат құралдары саласындағы мемлекеттік бақылау комитетінің аумақтық органдары ережелерін бекіту туралы» Қазақстан Республикасы Ақпарат және коммуникациялар министрінің 2016 жылғы 5 шілдедегі № 25 бұйрығына толықтырулар енгізу туралы
