title:
  rus: Об утверждении положений территориальных органов Комитета государственного контроля в области связи, информатизации и средств массовой информации Министерства информации и коммуникаций Республики Казахстан
  kaz: Қазақстан Республикасы Ақпарат және коммуникациялар министрлігі Байланыс, ақпараттандыру және бұқаралық ақпарат құралдары саласындағы мемлекеттік бақылау комитетінің аумақтық органдарының ережелерін бекіту туралы
