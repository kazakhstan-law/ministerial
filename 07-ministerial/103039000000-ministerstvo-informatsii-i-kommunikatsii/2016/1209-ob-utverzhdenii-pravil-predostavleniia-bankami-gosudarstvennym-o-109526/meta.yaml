  title:
    rus: О внесении изменений в приказ Министра информации и коммуникаций Республики Казахстан от 9 декабря 2016 года № 276 «Об утверждении Правил предоставления банками государственным органам, судам через платежный шлюз «электронного правительства» сведений и информации об осуществленных платежах и (или) переводах денег, связанных с уплатой платежей в бюджет, перечислением обязательных пенсионных взносов, обязательных пенсионных взносов работодателя, обязательных профессиональных пенсионных взносов и социальных отчислений, а также оплатой государственных услуг»
    kaz: «Банктердің «электрондық үкіметтің» төлем шлюзі арқылы мемлекеттік органдарға, соттарға бюджетке төлемдер төлеумен, міндетті зейнетақы жарналарын, жұмыс берушінің міндетті зейнетақы жарналарын, міндетті кәсіптік зейнетақы жарналарын және әлеуметтік аударымдарды аударумен, сондай-ақ мемлекеттік көрсетілетін қызметтерге ақы төлеумен байланысты жүзеге асырылған төлемдер және (немесе) ақша аударымдары туралы мәліметтер мен ақпаратты беруі қағидаларын бекіту туралы» Қазақстан Республикасы Ақпарат және коммуникациялар министрінің 2016 жылғы 9 желтоқсандағы № 276 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/228847/rus
