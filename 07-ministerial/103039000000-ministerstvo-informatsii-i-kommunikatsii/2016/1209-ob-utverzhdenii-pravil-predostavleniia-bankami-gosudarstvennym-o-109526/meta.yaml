act_code: '109526'
requisite: Приказ Министра информации и коммуникаций Республики Казахстан от 9 декабря 2016 года № 276. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 января 2017 года № 14713
title:
  rus: Об утверждении Правил предоставления банками государственным органам, судам через платежный шлюз «цифрового правительства» сведений и информации об осуществленных платежах и (или) переводах денег, связанных с уплатой платежей в бюджет, перечислением обязательных пенсионных взносов, обязательных профессиональных пенсионных взносов и социальных отчислений, а также оплатой государственных услуг
  kaz: Банктердің «цифрлық үкіметтің» төлем шлюзі арқылы мемлекеттік органдарға, соттарға бюджетке төлемдер төлеумен, міндетті зейнетақы жарналарын, міндетті кәсіптік зейнетақы жарналарын және әлеуметтік аударымдарды аударумен, сондай-ақ мемлекеттік көрсетілетін қызметтерге ақы төлеумен байланысты жүзеге асырылған төлемдер және (немесе) ақша аударымдары туралы мәліметтер мен ақпаратты беру қағидаларын бекіту туралы
