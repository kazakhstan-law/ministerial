    kaz: «Қазақстан Республикасы Ақпарат және коммуникациялар министрлігі Телекоммуникациялар комитетінің аумақтық органдарының ережелерін бекіту туралы» Қазақстан Республикасы Ақпарат және коммуникациялар министрінің 2017 жылғы 15 желтоқсандағы № 453 бұйрығына өзгерістер енгізу туралы
