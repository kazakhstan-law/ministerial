  title:
    rus: О внесении изменений в приказ Председателя Комитета государственного контроля в области связи, информатизации и средств массовой информации Министерства информации и коммуникаций Республики Казахстан от 22 июня 2017 года № 29 «Об утверждении предельного уровня цен на субсидируемые универсальные услуги связи, оказываемые в сельских населенных пунктах»
    kaz: «Ауылдық елді мекендерде көрсетілетін субсидияланатын байланыстың әмбебап қызметтеріне бағалардың шекті деңгейін бекіту туралы» Қазақстан Республикасы Ақпарат және коммуникациялар министрлігінің Байланыс, ақпараттандыру және бұқаралық ақпарат құралдары саласындағы мемлекеттік бақылау комитеті төрағасының 2017 жылғы 22 маусымдағы № 29 бұйрығына өзгерістер енгізу туралы
