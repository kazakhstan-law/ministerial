requisite: Приказ Министра информации и коммуникаций Республики Казахстан от 24 мая 2017 года № 199. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 мая 2017 года № 15174. Утратил силу приказом Министра информации и общественного развития Республики Казахстан от 29 августа 2019 года № 313 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики определения стоимости услуг средств массовой информации, закупаемых для проведения государственной информационной политики за счет средств республиканского бюджета
  kaz: Республикалық бюджет қаражаты есебінен мемлекет ақпарат саясатын жүргізу үшін сатып алынатын бұқаралық ақпарат құралдары көрсететін қызметтердің құнын айқындау әдістемесін бекіту туралы
