  title:
    rus: О внесении изменения в приказ Министра информации и коммуникаций Республики Казахстан от 28 февраля 2017 года № 75 «Об утверждении Правил размещения государственного заказа по проведению государственной информационной политики на республиканском и региональном уровнях»
    kaz: «Республикалық және өңірлік деңгейлерде мемлекеттік ақпарат саясатын жүргізу жөніндегі мемлекеттік тапсырысты орналастыру қағидаларын бекіту туралы» Қазақстан Республикасы Ақпарат және коммуникациялар министрінің 2017 жылғы 28 ақпандағы № 75 бұйрығына өзгеріс енгізу туралы
