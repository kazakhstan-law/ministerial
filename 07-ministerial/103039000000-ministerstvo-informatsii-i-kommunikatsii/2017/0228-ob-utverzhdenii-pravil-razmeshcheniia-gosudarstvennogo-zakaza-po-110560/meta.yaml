title:
  rus: Об утверждении Правил размещения государственного заказа по проведению государственной информационной политики на республиканском и региональном уровнях
  kaz: Республикалық және өңірлік деңгейлерде мемлекеттік ақпараттық саясатты жүргізу жөніндегі мемлекеттік тапсырысты орналастыру қағидаларын бекіту туралы
