  title:
    rus: О внесении изменений и дополнения в приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 19 августа 2022 года № 102 «Об утверждении положений о территориальных подразделениях Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан»
    kaz: «Қазақстан Республикасының Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының аумақтық бөлімшелері туралы ережелерді бекіту туралы» Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің Ұлттық статистика бюросы басшысының 2022 жылғы 19 тамыздағы № 102 бұйрығына өзгерістер мен толықтыру енгізу туралы
