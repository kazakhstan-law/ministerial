requisite: Приказ и.о. Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 11 января 2022 года № 1. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 января 2022 года № 26520. Утратил силу приказом  Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 31 мая 2024 года № 5 ( вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
