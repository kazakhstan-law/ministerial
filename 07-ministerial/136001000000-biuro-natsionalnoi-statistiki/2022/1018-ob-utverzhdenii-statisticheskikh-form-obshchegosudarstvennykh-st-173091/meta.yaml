  kaz: Білім беру және ғылым, денсаулық сақтау және әлеуметтік қамсыздандыру статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы
