  title:
    rus: О внесении изменений в приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 18 октября 2022 года № 34 «Об утверждении статистических форм общегосударственных статистических наблюдений по статистике образования и науки, здравоохранения, социального обеспечения и инструкций по их заполнению»
    kaz: «Білім беру және ғылым, денсаулық сақтау және әлеуметтік қамсыздандыру статистикасы бойынша жалпымемлекеттік статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасының Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросы Басшысының 2022 жылғы 18 қазандағы № 34 бұйрығына өзгерістер енгізу туралы
