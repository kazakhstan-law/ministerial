act_code: '164951'
requisite: Приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 1 марта 2022 года № 5. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 марта 2022 года № 27013. Утратил силу приказом и.о. Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 19 октября 2023 года № 19 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении статистических форм ведомственных статистических наблюдений и инструкций по их заполнению, разработанных Министерством здравоохранения Республики Казахстан
