  requisite: Приказ и.о. Министра здравоохранения Республики Казахстан от 1 декабря 2022 года № ҚР ДСМ-149. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 декабря 2022 года № 30909. Утратил силу приказом и.о. Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 19 октября 2023 года № 19 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 1 марта 2022 года № 5 «Об утверждении статистических форм ведомственных статистических наблюдений и инструкций по их заполнению, разработанных Министерством здравоохранения Республики Казахстан»
    kaz: «Қазақстан Республикасы Денсаулық сақтау министрлігі әзірлеген ведомстволық статистикалықбайқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасының Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросы басшысының 2022 жылғы 1 наурыздағы № 5 бұйрығына өзгерістер енгізу туралы
