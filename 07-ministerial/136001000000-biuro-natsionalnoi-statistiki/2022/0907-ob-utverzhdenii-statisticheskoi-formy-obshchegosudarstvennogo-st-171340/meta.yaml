requisite: Приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 7 сентября 2022 года № 23. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 сентября 2022 года № 29464.  Утратил силу приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 13 июня 2025 года № 17 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
