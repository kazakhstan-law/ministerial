title:
  rus: Об утверждении статистической формы общегосударственного статистического наблюдения «Уровень доверия населения к правоохранительным органам и судебной системе» (индекс УДН, периодичность два раза в год) и инструкции по ее заполнению
  kaz: «Халықтың құқық қорғау органдарына және сот жүйесіне деген сенімділік деңгейі» (индексі УДН, кезеңділігі жылына екі рет) жалпымемлекеттік статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы
