  title:
    rus: О внесении изменений в приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 15 февраля 2021 года № 6 «Об утверждении статистической формы общегосударственного статистического наблюдения «Уровень доверия населения к правоохранительным органам» (индекс УДН, периодичность два раза в год) и инструкции по ее заполнению»
    kaz: «Халықтың құқық қорғау органдарына деген сенімділік деңгейі» (индексі УДН, кезеңділігі жылына екі рет) жалпымемлекеттік статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросы басшысының 2021 жылғы 15 ақпандағы № 6 бұйрығына өзгерістер енгізу туралы
