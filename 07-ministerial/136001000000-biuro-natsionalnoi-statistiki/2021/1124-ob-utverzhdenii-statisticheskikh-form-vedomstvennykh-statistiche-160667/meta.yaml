requisite: Приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 24 ноября 2021 года № 36. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 ноября 2021 года № 25379. Утратил силу приказом и.о. Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 4 октября 2023 года № 18 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
