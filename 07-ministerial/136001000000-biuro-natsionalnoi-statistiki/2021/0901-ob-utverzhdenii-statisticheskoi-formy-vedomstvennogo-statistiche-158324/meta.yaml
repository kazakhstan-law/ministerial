act_code: '158324'
requisite: Приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 1 сентября 2021 года № 17. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 сентября 2021 года № 24224. Утратил силу приказом Министра культуры и спорта Республики Казахстан от 11 октября 2022 года № 297 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении статистической формы ведомственного статистического наблюдения и инструкции по ее заполнению, разработанных Министерством культуры и спорта Республики Казахстан
  kaz: Қазақстан Республикасы Мәдениет және спорт министрлігі әзірлеген ведомстволық статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы
