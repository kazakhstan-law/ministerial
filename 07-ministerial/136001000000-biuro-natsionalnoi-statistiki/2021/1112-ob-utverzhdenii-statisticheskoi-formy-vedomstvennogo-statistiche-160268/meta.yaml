requisite: Приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 12 ноября 2021 года № 30. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 ноября 2021 года № 25183. Утратил силу приказом и.о. Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 19 октября 2023 года № 19 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении статистической формы ведомственного статистического наблюдения и инструкции по ее заполнению, разработанных Министерством образования и науки Республики Казахстан
  kaz: Қазақстан Республикасы Білім және ғылым министрлігі әзірлеген ведомстволық статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы
