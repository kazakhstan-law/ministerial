act_code: '180539'
requisite: Приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 28 апреля 2023 года № 83. Отменен приказом Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 21 января 2026 года № 11 (вступает в силу со дня его подписания)
title:
  rus: Об утверждении Регламента личного приема физических лиц и представителей юридических лиц должностными лицами Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан
  kaz: Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің Ұлттық статистика бюросы лауазымды адамдарының жеке тұлғаларды және заңды тұлғалардың өкілдерін жеке қабылдауының регламентін бекіту туралы
