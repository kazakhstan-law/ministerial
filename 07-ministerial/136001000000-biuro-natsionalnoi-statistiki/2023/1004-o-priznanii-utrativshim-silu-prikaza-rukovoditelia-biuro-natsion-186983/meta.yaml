act_code: '186983'
requisite: Приказ и.о. Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 4 октября 2023 года № 18. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 октября 2023 года № 33525
title:
  rus: О признании утратившим силу приказа Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 24 ноября 2021 года № 36 «Об утверждении статистических форм ведомственных статистических наблюдений и инструкций по их заполнению, разработанных Национальным Банком Республики Казахстан»
  kaz: «Қазақстан Республикасының Ұлттық Банкі әзірлеген ведомстволық статистикалық байқаулардың статистикалық нысандары мен оларды толтыру жөніндегі нұсқаулықтарды бекіту туралы» Қазақстан Республикасының Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросы басшысының 2021 жылғы 24 қарашадағы № 36 бұйрығының күшін жою туралы
