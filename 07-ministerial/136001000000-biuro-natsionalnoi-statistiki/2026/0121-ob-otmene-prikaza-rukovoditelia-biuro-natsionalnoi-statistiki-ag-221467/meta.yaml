act_code: '221467'
requisite: Приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 21 января 2026 года № 11
title:
  rus: Об отмене приказа руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 28 апреля 2023 года № 83 «Об утверждении Регламента личного приема физических лиц и представителей юридических лиц должностными лицами Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан»
  kaz: «Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің Ұлттық статистика бюросы лауазымды адамдарының жеке тұлғаларды және заңды тұлғалардың өкілдерін жеке қабылдауының регламентін бекіту туралы» Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің Ұлттық статистика бюросы басшысының 2023 жылғы 28 сәуірдегі № 83 бұйрығының күшін жою туралы
