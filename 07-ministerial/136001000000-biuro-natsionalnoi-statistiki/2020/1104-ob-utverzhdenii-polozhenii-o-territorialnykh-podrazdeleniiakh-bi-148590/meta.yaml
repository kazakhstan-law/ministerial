  title:
    rus: О внесении изменения в приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 4 ноября 2020 года № 3 «Об утверждении положений о территориальных подразделениях Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан»
    kaz: «Қазақстан Республикасының Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросының аумақтық бөлімшелері туралы ережелерді бекіту туралы» Қазақстан Республикасының Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросы басшысының 2020 жылғы 4 қарашадағы № 3 бұйрығына өзгеріс енгізу туралы
