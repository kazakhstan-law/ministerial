  title:
    rus: О внесении изменения в приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 12 декабря 2024 года № 209 «Об утверждении Графика представления респондентами первичных статистических данных по общегосударственным и ведомственным статистическим наблюдениям на 2025-2027 годы»
    kaz: «2025-2027 жылдарға арналған респонденттердің жалпымемлекеттік және ведомстволық статистикалық байқаулар бойынша бастапқы статистикалық деректерді ұсыну графигін бекіту туралы» Қазақстан Республикасының Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросы басшысының 2024 жылғы 12 желтоқсандағы № 209 бұйрығына өзгеріс енгізу туралы
