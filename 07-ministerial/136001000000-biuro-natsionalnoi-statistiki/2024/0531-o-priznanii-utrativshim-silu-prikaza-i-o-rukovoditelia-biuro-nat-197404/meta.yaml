act_code: '197404'
requisite: Приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 31 мая 2024 года № 5. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 июня 2024 года № 34459
title:
  rus: О признании утратившим силу приказа И.о. Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 11 января 2022 года № 1 «Об утверждении статистической формы общегосударственного статистического наблюдения «Безопасность и жизненный опыт женщин» (индекс БН, периодичность единовременная) и инструкций по их заполнению»
  kaz: «Әйелдердің қауіпсіздігі және өмірлік тәжірибесі» (индекс БН, кезеңділігі біржолғы) жалпымемлекеттік статистикалық байқаудың статистикалық нысаны мен оны толтыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасының Стратегиялық жоспарлау және реформалар агенттігі Ұлттық статистика бюросы басшысының м.а. 2022 жылғы 11 қаңтардағы № 1 бұйрығының күшін жою туралы
