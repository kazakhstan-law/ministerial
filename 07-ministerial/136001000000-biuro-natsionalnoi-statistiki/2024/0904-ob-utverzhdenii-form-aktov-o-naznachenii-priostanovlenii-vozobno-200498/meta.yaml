act_code: '200498'
requisite: Приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 4 сентября 2024 года № 26. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 сентября 2024 года № 35041
title:
  rus: Об утверждении форм актов о назначении, приостановлении, возобновлении, прекращении и продлении проверки, заключений об устранении нарушений, выявленных по результатам дистанционного контроля, заключения о результатах проверки в сфере проведения государственного контроля в области государственной статистики в отношении административных источников
  kaz: Әкімшілік дереккөздерге қатысты тексеру тағайындау, тоқтата тұру, қайта бастау, тоқтату және мерзімдерін ұзарту актілерінің, қашықтан бақылау нәтижелері бойынша анықталған бұзушылықтарды жою туралы қорытындылардың, мемлекеттік статистика саласында мемлекеттік бақылау жүргізу аясындағы тексерулердің нәтижелері туралы қорытындының нысандарын бекіту туралы
