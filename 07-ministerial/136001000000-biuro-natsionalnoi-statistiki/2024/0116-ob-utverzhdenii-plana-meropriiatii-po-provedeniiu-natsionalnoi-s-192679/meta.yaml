  title:
    rus: О внесении изменений в приказ Руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 16 января 2024 года № 5 «Об утверждении Плана мероприятий по проведению национальной сельскохозяйственной переписи Республики Казахстан в 2025 году»
    kaz: «2025 жылы Қазақстан Республикасы ұлттық ауыл шаруашылығы санағын жүргізу жөніндегі іс-шаралардың жоспарын бекіту туралы» Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің Ұлттық статистика бюросы басшысының 2024 жылғы 16 қаңтардағы № 5 бұйрығына өзгерістер енгізу туралы
