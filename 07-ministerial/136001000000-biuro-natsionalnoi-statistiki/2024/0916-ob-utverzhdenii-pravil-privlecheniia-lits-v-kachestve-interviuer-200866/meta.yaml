  title:
    rus: О внесении изменений в приказ руководителя Бюро национальной статистики Агентства по стратегическому планированию и реформам Республики Казахстан от 16 сентября 2024 года № 27 «Об утверждении Правил привлечения лиц в качестве интервьюеров и организации их работы при проведении общегосударственных статистических наблюдений и национальных переписей»
    kaz: «Жалпымемлекеттік статистикалық байқауларды және ұлттық санақтарды жүргізу кезінде адамдарды интервьюер ретінде тарту және олардың жұмысын ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігінің Ұлттық статистика бюросы басшысының 2024 жылғы 16 қыркүйектегі № 27 бұйрығына өзгерістер енгізу туралы
