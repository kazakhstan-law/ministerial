title:
  rus: Об утверждении Перечня профессий и специальностей, получение которых в заочной, вечерней формах и в форме экстерната не допускается и Правил выдачи разрешения на обучение в форме экстерната в организациях образования, дающих высшее образование
  kaz: Сырттай, кешкі және экстернат нысанында білім алуға жол берілмейтін кәсіптер мен мамандықтардың тізбесін және Жоғары білім беретін білім беру ұйымдарында экстернат нысанында оқуға рұқсат беру ережесін бекіту туралы
