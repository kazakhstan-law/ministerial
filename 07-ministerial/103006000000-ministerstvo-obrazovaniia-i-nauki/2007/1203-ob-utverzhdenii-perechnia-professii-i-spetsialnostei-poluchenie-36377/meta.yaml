  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 3 декабря 2007 года N 602 "Об утверждении Перечня профессий и специальностей, получение которых в заочной, вечерней формах и в форме экстерната не допускается и Правил выдачи разрешения на обучение в форме экстерната в организациях образования, дающих высшее образование"
    kaz: '"Сырттай, кешкі және экстернат нысанында білім алуға жол берілмейтін кәсіптер мен мамандықтардың тізбесін және Жоғары білім беретін білім беру ұйымдарында экстернат нысанында оқытуға рұқсат беру ережесін бекіту жөнінде" Қазақстан Республикасы Білім және ғылым министрінің 2007 жылғы 3 желтоқсандағы N 602 бұйрығына өзгерістер енгізу туралы'
