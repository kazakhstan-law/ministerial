requisite: Приказ Министра образования и науки Республики Казахстан от 2 марта 2007 года № 100. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 марта 2007 года № 4593. Утратил силу приказом Министра образования и науки Республики Казахстан от 19 мая 2011 года № 203
title:
  rus: Об утверждении Правил государственной регистрации научно-исследовательских работ, проводимых за счет бюджетных средств, законченных тем и программ фундаментальных и прикладных исследований, защищенных кандидатских и докторских диссертаций
  kaz: Бюджет қаражаты есебінен жүргізілетін ғылыми-зерттеу жұмыстарын, аяқталған тақырыптар мен іргелі және қолданбалы зерттеулердің бағдарламаларын, қорғалған кандидаттық және докторлық диссертацияларды мемелекеттік тіркеу ережесін бекіту туралы
