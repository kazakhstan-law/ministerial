title:
  rus: Об утверждении формы документов строгой отчетности, используемых организациями высшего и (или) послевузовского образования в образовательной деятельности
  kaz: Жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдары білім беру қызметінде пайдаланатын қатаң есептілік құжаттарының нысанын бекіту туралы
