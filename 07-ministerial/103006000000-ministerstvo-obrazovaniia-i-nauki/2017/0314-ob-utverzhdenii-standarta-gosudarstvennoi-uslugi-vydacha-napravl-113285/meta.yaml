act_code: '113285'
requisite: Приказ Министра образования и науки Республики Казахстан от 14 марта 2017 года № 120. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июля 2017 года № 15317. Утратил силу приказом Министра образования и науки Республики Казахстан от 27 мая 2020 года № 223 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Выдача направления детям с ограниченными возможностями в специальные коррекционные и другие организации для получения медицинских, специальных образовательных и специальных социальных услуг»
  kaz: «Кемтар балаларға арнаулы түзеу ұйымдары мен басқа да ұйымдарға медициналық, арнаулы бiлiм және арнаулы әлеуметтiк қызметтердi алуы үшiн жолдама беру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
