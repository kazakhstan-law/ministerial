requisite: Приказ и.о. Министра образования и науки Республики Казахстан от 19 июля 2017 года № 345. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 августа 2017 года № 15455
title:
  rus: Об утверждении Правил организации работы, связанной с возвратом бюджетных средств, затраченных на обучение победителей конкурса на присуждение международной стипендии «Болашак», отказавшихся от стипендии либо лишенных международной стипендии «Болашак», а также имеющих финансовую задолженность перед администратором международной стипендии «Болашак»
  kaz: «Болашақ» халықаралық стипендиясынан бас тартқан немесе одан айырылған, сондай-ақ «Болашақ» халықаралық стипендиясы әкімшісі алдында қаржылық берешегі бар «Болашақ» халықаралық стипендиясын тағайындау конкурсының жеңімпаздарын оқытуға жұмсалған бюджеттік қаражатты қайтаруға байланысты жұмысты ұйымдастыру қағидаларын бекіту туралы
