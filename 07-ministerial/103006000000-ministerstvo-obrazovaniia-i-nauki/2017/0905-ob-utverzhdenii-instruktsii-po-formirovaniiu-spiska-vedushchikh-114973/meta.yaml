title:
  rus: Об утверждении Инструкции по формированию списка ведущих зарубежных высших учебных заведений, зарубежных организаций, рекомендуемых для обучения, прохождения языковых курсов победителями конкурса на присуждение международной стипендии «Болашак»
  kaz: «Болашақ» халықаралық стипендиясын тағайындау конкурсы жеңімпаздарының оқуы, тілдік курстардан өтуі үшін ұсынылатын шетелдік жетекші жоғары оқу орындары, шетелдік ұйымдар тізімін қалыптастыру жөніндегі нұсқаулықты бекіту туралы
