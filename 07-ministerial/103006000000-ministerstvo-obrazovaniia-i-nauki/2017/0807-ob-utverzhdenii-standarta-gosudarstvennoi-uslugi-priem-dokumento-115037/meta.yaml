act_code: '115037'
requisite: Приказ Министра образования и науки Республики Казахстан от 7 августа 2017 года № 397. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 сентября 2017 года № 15740. Утратил силу приказом Министра образования и науки Республики Казахстан от 9 апреля 2020 года № 136 (вводится в действие по истечении десяти дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Прием документов на конкурс по размещению государственного образовательного заказа на подготовку кадров с техническим, профессиональным и послесредним образованием»
  kaz: «Техникалық, кәсіптік және орта білімнен кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын орналастыру бойынша конкурсқа құжаттарды қабылдау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
