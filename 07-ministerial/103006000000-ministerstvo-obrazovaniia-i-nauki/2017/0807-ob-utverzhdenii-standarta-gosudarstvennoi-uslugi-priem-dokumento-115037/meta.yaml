  title:
    rus: О внесении изменения в приказ Министра образования и науки Республики Казахстан от 7 августа 2017 года № 397 «Об утверждении стандарта государственной услуги «Прием документов на конкурс по размещению государственного образовательного заказа на подготовку кадров с техническим, профессиональным и послесредним образованием»
    kaz: «Техникалық, кәсіптік және орта білімнен кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын орналастыру бойынша конкурсқа құжаттарды қабылдау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасының Білім және ғылым министрінің 2017 жылы 7 тамыздағы № 397 бұйрығына өзгеріс енгізу туралы
