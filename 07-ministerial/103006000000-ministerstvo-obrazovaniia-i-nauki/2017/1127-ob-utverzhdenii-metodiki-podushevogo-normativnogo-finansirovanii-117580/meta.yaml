  title:
    rus: О внесении дополнений в приказ Министра образования и науки Республики Казахстан от 27 ноября 2017 года № 597 «Об утверждении Методики подушевого нормативного финансирования дошкольного воспитания и обучения, среднего образования, а также технического и профессионального, послесреднего, высшего и послевузовского образования с учетом кредитной технологии обучения»
    kaz: «Мектепке дейінгі тәрбие мен оқытудың, орта білім берудің, сондай-ақ кредиттік оқыту технологиясын есепке алғандағы техникалық және кәсіптік, орта білімнен кейінгі, жоғары және жоғары оқу орнынан кейінгі білім берудің жан басына шаққандағы нормативтік қаржыландыру әдістемесін бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2017 жылғы 27 қарашадағы № 597 бұйрығына толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/177521/rus
