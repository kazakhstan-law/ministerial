  title:
    rus: О внесении изменения в приказ Министра образования и науки Республики Казахстан от 27 ноября 2017 года № 597 «Об утверждении Методики подушевого нормативного финансирования дошкольного воспитания и обучения, среднего образования, а также технического и профессионального, послесреднего образования с учетом кредитной технологии обучения»
    kaz: «Мектепке дейінгі тәрбие мен оқытудың, орта білім берудің, сондай-ақ кредиттік оқыту технологиясын ескере отырып, техникалық және кәсіптік, орта білімнен кейінгі білім беруді жан басына шаққандағы нормативтік қаржыландыру әдістемесін бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2017 жылғы 27 қарашадағы № 597 бұйрығына өзгеріс енгізу туралы»
