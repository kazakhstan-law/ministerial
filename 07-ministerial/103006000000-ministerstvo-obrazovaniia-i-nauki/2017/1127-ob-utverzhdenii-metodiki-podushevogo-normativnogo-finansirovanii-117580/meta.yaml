title:
  rus: Об утверждении Методики подушевого нормативного финансирования дошкольного воспитания и обучения, среднего образования, а также технического и профессионального, послесреднего образования с учетом кредитной технологии обучения
  kaz: Мектепке дейінгі тәрбие мен оқытудың, орта білім берудің, сондай-ақ кредиттік оқыту технологиясын ескере отырып, техникалық және кәсіптік, орта білімнен кейінгі білім беруді жан басына шаққандағы нормативтік қаржыландыру әдістемесін бекіту туралы
