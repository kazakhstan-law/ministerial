title:
  rus: Об утверждении списка ведущих зарубежных высших учебных заведений, зарубежных организаций, рекомендуемых для обучения, прохождения языковых курсов победителями конкурса на присуждение международной стипендии «Болашак» на 2017 год
  kaz: 2017 жылы «Болашақ» халықаралық стипендиясын тағайындау конкурсы жеңімпаздарының оқуы, тілдік курстардан өтуі үшін ұсынылатын шетелдік жетекші жоғары оқу орындарының, шетелдік ұйымдардың тізімін бекіту туралы
