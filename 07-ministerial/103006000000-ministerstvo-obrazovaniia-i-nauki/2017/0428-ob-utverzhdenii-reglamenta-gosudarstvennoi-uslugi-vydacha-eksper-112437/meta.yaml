  requisite: Приказ Министра образования и науки Республики Казахстан от 28 апреля 2018 года № 188. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 мая 2018 года № 16927. Утратил силу приказом Министра образования и науки Республики Казахстан от 19 мая 2020 года № 211 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра образования и науки Республики Казахстан от 28 апреля 2017 года № 199 «Об утверждении регламента государственной услуги «Выдача экспертного заключения авторам и авторскому коллективу на учебные издания дошкольного, начального, основного среднего, общего среднего, технического и профессионального, послесреднего, высшего и послевузовского образования»
    kaz: «Мектепке дейінгі, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі, жоғары және жоғары оқу орнынан кейінгі білім берудің оқулық басылымдары бойынша авторларға және авторлар ұжымына сараптамалық қорытынды беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Қазақстан Республикасы Білім және ғылым министрі міндетін атқарушының 2017 жылғы 28 сәуірдегі № 199 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/121974/rus
