act_code: '112437'
requisite: Приказ и.о. Министра образования и науки Республики Казахстан от 28 апреля 2017 года № 199. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 мая 2017 года № 15181. Утратил силу приказом Министра образования и науки Республики Казахстан от 19 мая 2020 года № 211 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:
  rus: «Об утверждении регламента государственной услуги «Выдача экспертного заключения авторам и авторскому коллективу на учебные издания дошкольного, начального, основного среднего, общего среднего, технического и профессионального, послесреднего, высшего и послевузовского образования»
  kaz: «Мектепке дейінгі, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі, жоғары және жоғары оқу орнынан кейінгі білім берудің оқулық басылымдары бойынша авторларға және авторлар ұжымына сараптамалық қорытынды беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
