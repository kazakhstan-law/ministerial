  title:
    rus: О внесении изменения в приказ Министра образования и науки Республики Казахстан от 7 августа 2017 года № 396 «Об утверждении стандарта государственной услуги «Предоставление бесплатного питания отдельным категориям граждан, а также лицам, находящимся под опекой (попечительством) и патронатом, обучающимся и воспитанникам организаций технического и профессионального, послесреднего и высшего образования»
    kaz: «Техникалық және кәсіптік, орта білімнен кейінгі және жоғары білім беру ұйымдарындағы тәрбиеленушілер мен білім алушылардың жекелеген санаттағы азаматтарына, сондай-ақ, қорғаншылық (қамқоршылықтағы) пен патронаттағы тұлғаларына тегін тамақтандыруды ұсыну» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасының Білім және ғылым министрінің 2017 жылғы 7 тамыздағы № 396 бұйрығына өзгеріс енгізу туралы
