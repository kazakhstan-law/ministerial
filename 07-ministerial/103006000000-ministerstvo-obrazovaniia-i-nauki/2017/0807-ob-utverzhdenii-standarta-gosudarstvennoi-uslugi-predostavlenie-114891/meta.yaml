act_code: '114891'
requisite: Приказ Министра образования и науки Республики Казахстан от 7 августа 2017 года № 396. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 сентября 2017 года № 15744. Утратил силу приказом Министра образования и науки Республики Казахстан от 4 мая 2020 года № 180 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Предоставление бесплатного питания отдельным категориям граждан, а также лицам, находящимся под опекой (попечительством) и патронатом, обучающимся и воспитанникам организаций технического и профессионального, послесреднего и высшего образования»
  kaz: «Техникалық және кәсіптік, орта білімнен кейінгі және жоғары білім беру ұйымдарындағы тәрбиеленушілер мен білім алушылардың жекелеген санаттағы азаматтарына, сондай-ақ, қорғаншылық (қамқоршылықтағы) пен патронаттағы тұлғаларына тегін тамақтандыруды ұсыну» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
