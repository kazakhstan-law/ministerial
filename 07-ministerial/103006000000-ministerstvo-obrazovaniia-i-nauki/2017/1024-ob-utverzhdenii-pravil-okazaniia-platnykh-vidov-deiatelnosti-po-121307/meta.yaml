  title:
    rus: О внесении изменения и дополнений в приказ Министра образования и науки Республики Казахстан от 24 октября 2017 года № 541 «Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) государственными учреждениями образования, деньги от реализации которых остаются в их распоряжении и расходования ими денег от реализации товаров (работ, услуг)»
    kaz: «Тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түсетін ақша өз иелігінде қалатын мемлекеттік білім беру мекемелерінің оларды өткізу бойынша ақылы қызмет түрлерін көрсетуі және олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсауы қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2017 жылғы 24 қазандағы № 541 бұйрығына өзгеріс пен толықтырулар енгізу туралы
