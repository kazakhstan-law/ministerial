act_code: '121307'
requisite: Приказ Министра образования и науки Республики Казахстан от 24 октября 2017 года № 541. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 мая 2018 года № 16899. Утратил силу приказом Министра просвещения Республики Казахстан от 16 сентября 2025 года № 216 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) государственными учреждениями образования, деньги от реализации которых остаются в их распоряжении и расходования ими денег от реализации товаров (работ, услуг)
  kaz: Тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түсетін ақша өз иелігінде қалатын мемлекеттік білім беру мекемелерінің оларды өткізу бойынша ақылы қызмет түрлерін көрсетуі және олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсауы қағидаларын бекіту туралы
