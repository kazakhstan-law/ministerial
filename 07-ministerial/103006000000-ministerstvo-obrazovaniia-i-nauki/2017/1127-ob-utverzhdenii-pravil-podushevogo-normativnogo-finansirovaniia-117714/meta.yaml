  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 27 ноября 2017 года № 596 «Об утверждении Правил подушевого нормативного финансирования дошкольного воспитания и обучения, среднего образования, а также технического и профессионального, послесреднего образования с учетом кредитной технологии обучения»
    kaz: «Мектепке дейінгі тәрбие мен оқытуды, орта білім беруді, сондай-ақ кредиттік оқыту технологиясын ескере отырып, техникалық және кәсіптік, орта білімнен кейінгі білім беруді жан басына шаққандағы нормативтік қаржыландыру қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2017 жылғы 27 қарашадағы № 596 бұйрығына өзгерістер енгізу туралы
