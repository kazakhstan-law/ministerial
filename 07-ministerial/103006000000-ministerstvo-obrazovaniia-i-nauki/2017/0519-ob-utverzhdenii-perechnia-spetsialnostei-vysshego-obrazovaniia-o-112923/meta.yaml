act_code: '112923'
requisite: Приказ Министра образования и науки Республики Казахстан от 19 мая 2017 года № 229. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 июня 2017 года № 15235. Утратил силу приказом Министра образования и науки Республики Казахстан от 13 мая 2019 года № 203 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня специальностей высшего образования, определяющих социально-экономическое развитие села, по которым предусматривается квота приема в высшие учебные заведения Республики Казахстан для граждан из числа сельской молодежи
  kaz: Ауыл жастары арасынан шыққан азаматтар үшін Қазақстан Республикасының жоғары оқу орындарына қабылдау квотасы көзделген, ауылдың әлеуметтік-экономикалық дамуын айқындайтын жоғары білім мамандықтарының тізбесін бекіту туралы
