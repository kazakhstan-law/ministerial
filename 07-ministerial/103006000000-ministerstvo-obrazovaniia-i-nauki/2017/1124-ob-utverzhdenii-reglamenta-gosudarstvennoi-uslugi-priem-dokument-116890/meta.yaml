  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра образования и науки Республики Казахстан от 24 ноября 2017 года № 593 «Об утверждении регламента государственной услуги «Прием документов на конкурс по размещению государственного образовательного заказа на подготовку кадров с техническим, профессиональным и послесредним образованием»
    kaz: «Техникалық, кәсіптік және орта білімнен кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын орналастыру бойынша конкурсқа құжаттарды қабылдау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің міндетін атқарушының 2017 жылғы 24 қарашадағы № 593 бұйрығына өзгеріс енгізу туралы
