  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 15 января 2016 года № 27 «Об утверждении регламента государственной услуги «Предоставление дополнительного образования для взрослых по повышению квалификации педагогических кадров (курсы по уровневым программам)»
    kaz: «Ересектерге педагог кадрлардың біліктілігін арттыру бойынша қосымша білім беруді (деңгейлік бағдарлама бойынша курстарды) ұсыну» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2016 жылғы 15 қаңтардағы № 27 бұйрығына өзгерістер енгізу туралы
