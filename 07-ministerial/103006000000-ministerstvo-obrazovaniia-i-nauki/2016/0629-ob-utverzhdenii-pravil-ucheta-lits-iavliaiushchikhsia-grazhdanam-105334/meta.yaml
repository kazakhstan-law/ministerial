  title:
    rus: О внесении изменения в приказ Министра образования и науки Республики Казахстан от 29 июня 2016 года № 407 «Об утверждении Правил учета лиц, являющихся гражданами Республики Казахстан, постоянно проживающих на территории Республики Казахстан, желающих усыновить детей-сирот, детей, оставшихся без попечения родителей»
    kaz: «Қазақстан Республикасының азаматтары болып табылатын, Қазақстан Республикасының аумағында тұрақты тұратын, жетім балаларды, ата-аналарының қамқорлығынсыз қалған балаларды асырап алуға тілек білдірген адамдарды есепке алу қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2016 жылғы 29 маусымдағы № 407 бұйрығына өзгеріс енгізу туралы
