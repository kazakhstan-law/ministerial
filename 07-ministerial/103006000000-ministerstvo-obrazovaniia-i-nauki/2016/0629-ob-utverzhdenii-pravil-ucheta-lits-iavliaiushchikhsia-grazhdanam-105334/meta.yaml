title:
  rus: Об утверждении Правил учёта лиц, являющихся гражданами Республики Казахстан, постоянно проживающих на территории Республики Казахстан, желающих усыновить детей-сирот, детей, оставшихся без попечения родителей
  kaz: Қазақстан Республикасының азаматтары болып табылатын, Қазақстан Республикасының аумағында тұрақты тұратын, жетім балаларды, ата-аналарының қамқорлығынсыз қалған балаларды асырап алуға тілек білдірген адамдарды есепке алу қағидаларын бекіту туралы
