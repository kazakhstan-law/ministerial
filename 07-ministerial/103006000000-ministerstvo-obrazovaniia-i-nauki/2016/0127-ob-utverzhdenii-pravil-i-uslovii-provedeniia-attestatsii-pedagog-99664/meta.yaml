  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 27 января 2016 года № 83 «Об утверждении Правил и условий проведения аттестации педагогических работников и приравненных к ним лиц, занимающих должности в организациях образования, реализующих общеобразовательные учебные программы дошкольного, начального, основного среднего, общего среднего, образовательные программы технического и профессионального, послесреднего образования, и иных гражданских служащих в сфере образования и науки»
    kaz: «Мектепке дейінгі, бастауыш, негізгі орта, жалпы орта білімнің жалпы білім беретін оқу бағдарламаларын, техникалық және кәсіптік, орта білімнен кейінгі білімнің білім беру бағдарламаларын іске асыратын білім беру ұйымдарында жұмыс істейтін педагог қызметкерлер мен оларға теңестірілген тұлғаларды және білім және ғылым саласындағы басқа да азаматтық қызметшілерді аттестаттаудан өткізу қағидалары мен шарттарын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2016 жылғы 27 қаңтардағы № 83 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/121341/rus
