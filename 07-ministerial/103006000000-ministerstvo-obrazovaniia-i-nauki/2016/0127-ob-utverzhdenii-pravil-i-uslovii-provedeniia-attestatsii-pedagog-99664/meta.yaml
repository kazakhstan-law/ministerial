  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 27 января 2016 года № 83 «Об утверждении Правил и условий проведения аттестации педагогических работников и приравненных к ним лиц, занимающих должности в организациях образования, реализующих общеобразовательные учебные программы дошкольного воспитания и обучения, начального, основного среднего и общего среднего образования, образовательные программы технического и профессионального, послесреднего, дополнительного образования и специальные учебные программы, и иных гражданских служащих в области образования и науки»
    kaz: «Мектепке дейінгі тәрбие мен оқытуды, бастауыш, негізгі орта және жалпы орта білімнің жалпы білім беретін оқу бағдарламаларын, техникалық және кәсіптік, орта білімнен кейінгі, қосымша білімнің білім беру бағдарламаларын және арнайы оқу бағдарламаларын іске асыратын білім беру ұйымдарында жұмыс істейтін педагогтерді және білім және ғылым саласындағы басқа да азаматтық қызметшілерді аттестаттаудан өткізу қағидалары мен шарттарын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2016 жылғы 27 қаңтардағы № 83 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/160309/rus
