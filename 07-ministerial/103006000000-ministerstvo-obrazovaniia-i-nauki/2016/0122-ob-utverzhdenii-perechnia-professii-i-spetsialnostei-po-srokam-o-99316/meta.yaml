  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 22 января 2016 года № 65 «Об утверждении перечня профессий и специальностей по срокам обучения и уровням образования для технического и профессионального, послесреднего образования»
    kaz: «Техникалық және кәсіптік, орта білімнен кейінгі білім үшін оқыту мерзімдері және білім беру деңгейлері бойынша кәсіптер мен мамандықтардың тізбесін бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2016 жылғы 22 қаңтардағы № 65 бұйрығына өзгерістер енгізу туралы
