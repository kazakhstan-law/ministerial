title:
  rus: Об утверждении перечня профессий и специальностей по срокам обучения и уровням образования для технического и профессионального, послесреднего образования в соответствии с классификатором
  kaz: Сыныптауышқа сәйкес техникалық және кәсіптік, орта білімнен кейінгі білім үшін оқыту мерзімдері және білім беру деңгейлері бойынша кәсіптер мен мамандықтардың тізбесін бекіту туралы
