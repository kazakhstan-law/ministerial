act_code: '109101'
requisite: Приказ Министра образования и науки Республики Казахстан от 16 ноября 2016 года № 661. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 января 2017 года № 14666
title:
  rus: Об утверждении Правил формирования и использования Республиканского банка данных детей-сирот, детей, оставшихся без попечения родителей, и лиц, желающих принять детей на воспитание в свои семьи
  kaz: Жетім балалардың, ата-аналарының қамқорлығынсыз қалған балалардың және балаларды өз отбасына тәрбиелеуге қабылдауға тілек білдірген адамдардың республикалық деректер банкін қалыптастыру және пайдалану қағидаларын бекіту туралы
