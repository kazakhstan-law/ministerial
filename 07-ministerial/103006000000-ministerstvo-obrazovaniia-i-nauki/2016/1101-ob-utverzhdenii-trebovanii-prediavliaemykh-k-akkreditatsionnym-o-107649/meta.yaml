  title:
    rus: О внесении изменении в приказ Министра образования и науки Республики Казахстан от 1 ноября 2016 года № 629 «Об утверждении Правил признания аккредитационных органов, в том числе зарубежных, и формирования реестров признанных аккредитационных органов, аккредитованных организаций образования и образовательных программ»
    kaz: «Аккредиттеу органдарын, оның ішінде шетелдік аккредиттеу органдарын тану және танылған аккредиттеу органдарының, аккредиттелген білім беру ұйымдарының және білім беру бағдарламаларының тізілімдерін қалыптастыру қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2016 жылғы 1 қарашадағы № 629 бұйрығына өзгерістер енгізу туралы
