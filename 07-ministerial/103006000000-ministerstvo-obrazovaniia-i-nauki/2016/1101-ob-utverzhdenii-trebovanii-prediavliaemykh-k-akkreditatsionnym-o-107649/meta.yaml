title:
  rus: Об утверждении требований, предъявляемых к аккредитационным органам в сфере высшего и послевузовского образования и правил признания аккредитационных органов в сфере высшего и послевузовского образования, в том числе зарубежных
  kaz: Жоғары және жоғары оқу орнынан кейінгі білім беру саласындағы аккредиттеу органдарына қойылатын талаптарды және жоғары және жоғары оқу орнынан кейінгі білім беру саласындағы, оның ішінде шетелдік аккредиттеу органдарын тану қағидаларын бекіту туралы
