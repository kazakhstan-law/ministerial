  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Ответственного секретаря Министерства образования и науки Республики Казахстан от 7 июня 2016 года № 132-к «Об утверждении Положения о Комитете по охране прав детей Министерства образования и науки Республики Казахстан»
    kaz: «Қазақстан Республикасы Білім және ғылым министрлігі Балалардың құқықтарын қорғау комитеті туралы ережені бекіту туралы» Қазақстан Республикасы Білім және ғылым министрлігі жауапты хатшысының міндетін атқарушының 2016 жылғы 7 маусымдағы № 132-к бұйрығына өзгерістер мен толықтырулар енгізу туралы
