title:
  rus: Об утверждении методики прогнозирования потребности организаций образования, реализующих программы дошкольного воспитания и обучения, общеобразовательные учебные программы начального, основного среднего и общего среднего образования, образовательные программы технического и профессионального образования, в учебниках и учебно-методических комплексах
  kaz: Мектепке дейінгі тәрбие мен оқыту бағдарламаларын, бастауыш, негізгі орта және жалпы орта білімнің жалпы білім беретін оқу бағдарламаларын, техникалық және кәсіптік білімнің білім беру бағдарламаларын іске асыратын білім беру ұйымдарының оқулықтар мен оқу-әдістемелік кешендерге қажеттілігін болжау әдістемесін бекіту туралы
