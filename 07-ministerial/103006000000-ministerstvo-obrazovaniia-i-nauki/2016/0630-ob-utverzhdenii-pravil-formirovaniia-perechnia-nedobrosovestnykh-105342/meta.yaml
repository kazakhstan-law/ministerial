act_code: '105342'
requisite: Приказ Министра образования и науки Республики Казахстан от 30 июня 2016 года № 414. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 августа 2016 года № 14079. Утратил силу приказом Министра образования и науки Республики Казахстан от 31 октября 2018 года № 599 (вводится в действие по истечении десяти календарных дней после дня первого официального опубликования)
title:
  rus: Об утверждении Правил формирования перечня недобросовестных поставщиков услуг, товаров по организации питания обучающихся и воспитывающихся в организациях дошкольного, среднего образования, организациях образования для детей-сирот и детей, оставшихся без попечения родителей
  kaz: Мектепке дейінгі, орта білім беру ұйымдарында, жетім балалар мен ата-аналарының қамқорлығынсыз қалған балаларға арналған білім беру ұйымдарында оқитын және тәрбиеленетін балаларды тамақтандыруды ұйымдастыру жөніндегі көрсетілетін қызметтерді, тауарларды жосықсыз берушілердің тізбесін қалыптастыру қағидаларын бекіту туралы
