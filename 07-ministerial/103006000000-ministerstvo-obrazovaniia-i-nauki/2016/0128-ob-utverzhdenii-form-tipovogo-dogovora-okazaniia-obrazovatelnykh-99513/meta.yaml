act_code: '99513'
requisite: Приказ Министра образования и науки Республики Казахстан от 28 января 2016 года № 93. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 февраля 2016 года № 13227
title:
  rus: Об утверждении форм типового договора оказания образовательных услуг для дошкольных организаций, организаций среднего, технического и профессионального, послесреднего образования, типового договора на проведение профессиональной практики и типового договора о дуальном обучении для организаций технического и профессионального, послесреднего образования
  kaz: Мектепке дейінгі ұйымдар, орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдары үшін білім беру қызметтерін көрсетудің үлгілік шартының, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдары үшін кәсіптік практиканы өткізуге арналған үлгілік шарттың және дуальды оқыту туралы үлгілік шарттың нысандарын бекіту туралы
