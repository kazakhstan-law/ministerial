  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 28 января 2016 года № 93 «Об утверждении форм типового договора оказания образовательных услуг для дошкольных организаций, организаций среднего, технического и профессионального, послесреднего образования, типового договора на проведение профессиональной практики и типового договора о дуальном обучении для организаций технического и профессионального, послесреднего образования»
    kaz: «Мектепке дейінгі ұйымдар, орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдары үшін білім беру қызметтерін көрсетудің үлгілік шартының, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдары үшін кәсіптік практиканы өткізуге арналған үлгілік шарттың және дуальды оқыту туралы үлгілік шарттың нысандарын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2016 жылғы 28 қаңтардағы № 93 бұйрығына өзгерістер енгізу туралы
