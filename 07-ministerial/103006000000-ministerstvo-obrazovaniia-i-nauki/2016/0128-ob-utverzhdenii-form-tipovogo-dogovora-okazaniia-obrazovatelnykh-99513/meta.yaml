  title:
    rus: О внесении изменений и дополнений в приказ Министра образования и науки Республики Казахстан от 28 января 2016 года № 93 «Об утверждении форм типового договора оказания образовательных услуг и типового договора на проведение профессиональной практики»
    kaz: «Білім беру қызметтерін көрсетудің үлгілік шартының және кәсіптік практикадан өткізуге арналған үлгілік шарт нысандарын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2016 жылғы 28 қаңтардағы № 93 бұйрығына өзгерістер мен толықтырулар енгізу туралы
