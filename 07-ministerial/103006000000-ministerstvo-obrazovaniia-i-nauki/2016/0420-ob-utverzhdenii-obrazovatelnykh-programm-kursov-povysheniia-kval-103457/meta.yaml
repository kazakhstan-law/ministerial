act_code: '103457'
requisite: Приказ Министра образования и науки Республики Казахстан от 20 апреля 2016 года № 293. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 мая 2016 года № 13735. Утратил силу приказом Министра образования и науки Республики Казахстан от 4 мая 2020 года № 175 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении образовательных программ курсов повышения квалификации педагогических кадров организаций дошкольного, среднего, дополнительного, а также специального образования по программе нравственно-духовного образования "Самопознание"
  kaz: '"Өзін-өзі тану" рухани-адамгершілік білім беру бағдарламасы бойынша мектепке дейінгі, орта, қосымша, сондай-ақ арнайы білім беру ұйымдарының педагогикалық кадрларының біліктілігін арттырудың білім беру бағдарламаларын бекіту туралы'
