  title:
    rus: О внесении изменений в приказы Министра образования и науки Республики Казахстан от 12 января 2016 года № 20 «Об утверждении требований к научным изданиям для включения их в перечень изданий, рекомендуемых для публикации результатов научной деятельности» и от 1 ноября 2016 года № 629 «Об утверждении требований, предъявляемые к аккредитационному органу в сфере высшего и послевузовского образования и правил признания аккредитационных органов в сфере высшего и послевузовского образования, в том числе зарубежных»
    kaz: «Ғылыми қызметтің нәтижелерін жариялау үшін ұсынылатын басылымдар тізбесіне қосу үшін ғылыми басылымдарға қойылатын талаптарды бекіту туралы» 2016 жылғы 12 қаңтардағы № 20 және «Жоғары және жоғары оқу орнынан кейінгі білім беру саласындағы аккредиттеу органдарына қойылатын талаптарды және жоғары және жоғары оқу орнынан кейінгі білім беру саласындағы, оның ішінде шетелдік аккредиттеу органдарын тану қағидаларын бекіту туралы» 2016 жылғы 1 қарашадағы № 629 Қазақстан Республикасы Білім және ғылым министрінің бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/226604/rus
