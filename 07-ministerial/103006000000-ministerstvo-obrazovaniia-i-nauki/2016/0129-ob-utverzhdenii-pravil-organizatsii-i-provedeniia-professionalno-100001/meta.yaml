  kaz: Техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдары үшін кәсіптік практиканы ұйымдастыру мен өткізу қағидаларын және практика базалары ретінде кәсіпорындарды (ұйымдарды) айқындау қағидаларын бекіту туралы
