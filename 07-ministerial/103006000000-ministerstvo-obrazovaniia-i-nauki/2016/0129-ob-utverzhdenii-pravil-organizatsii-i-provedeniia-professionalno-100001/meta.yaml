    kaz: «Техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдары үшін кәсіптік практиканы ұйымдастыру мен өткізу қағидаларын және практика базалары ретінде кәсіпорындарды (ұйымдарды) айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2016 жылғы 29 қаңтардағы № 107 бұйрығына өзгерістер енгізу туралы
