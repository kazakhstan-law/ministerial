title:
  rus: Об утверждении Правил организации и проведения профессиональной практики и правил определения предприятий (организаций) в качестве баз практики для организаций технического и профессионального, послесреднего образования
  kaz: Техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдары үшін кәсіптік практиканы ұйымдастыру мен өткізу қағидаларын және практика базалары ретінде кәсіпорындарды (ұйымдарды) айқындау қағидаларын бекіту туралы
