act_code: '99054'
requisite: Приказ Министра образования и науки Республики Казахстан от 15 января 2016 года № 31. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 февраля 2016 года № 13075. Утратил силу приказом Министра образования и науки Республики Казахстан от 14 мая 2020 года № 202 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Прием документов для прохождения аттестации на  присвоение (подтверждение) квалификационных категорий педагогическим работникам и приравненным к ним лицам республиканских подведомственных организаций образования, реализующих программы дошкольного воспитания и обучения, начального, основного среднего, общего среднего,  технического и профессионального, послесреднего образования»
  kaz: «Мектепке дейінгі тәрбие мен оқыту, бастауыш, негізгі орта, жалпы орта, техникалық  және  кәсіптік, орта білімнен кейінгі білім беру бағдарламаларын іске асыратын республикалық ведомстволық бағынысты білім беру ұйымдарының педагог қызметкерлері мен оларға теңестірілген тұлғаларға біліктілік санаттарын беру (растау) үшін оларды аттестаттаудан өткізуге құжаттарды қабылдау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
