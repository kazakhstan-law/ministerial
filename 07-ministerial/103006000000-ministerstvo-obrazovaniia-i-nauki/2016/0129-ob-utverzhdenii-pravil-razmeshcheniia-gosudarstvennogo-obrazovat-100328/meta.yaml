  title:
    rus: О внесении изменений и дополнения в приказ Министра образования и науки Республики Казахстан от 29 января 2016 года № 122 "Об утверждении Правил размещения государственного образовательного заказа на подготовку специалистов с техническим и профессиональным, послесредним, высшим и послевузовским образованием с учетом потребностей рынка труда, на подготовительные отделения высших учебных заведений, а также на дошкольное воспитание и обучение"
    kaz: '"Еңбек нарығының қажеттіліктерін ескере отырып, техникалық және кәсіптік, орта білімнен кейінгі, жоғары және жоғары оқу орнынан кейінгі білімі бар мамандарды даярлауға, сондай-ақ жоғары оқу орындарының дайындық бөлімдеріне, мектепке дейінгі тәрбиелеу мен оқытуға мемлекеттік білім беру тапсырысын орналастыру қағидаларын бекіту туралы" Қазақстан Республикасы Білім және ғылым министрінің 2016 жылғы 29 қаңтардағы № 122 бұйрығына өзгерістер мен толықтыру енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/103578/rus
