  title:
    rus: Об утверждении Правил размещения государственного образовательного заказа на подготовку кадров с техническим и профессиональным, послесредним образованием с учетом потребностей рынка труда, а также на дошкольное воспитание и обучение, среднее образование и дополнительное образование детей
    kaz: Еңбек нарығының қажеттіліктерін ескере отырып, техникалық және кәсіптік, орта білімнен кейінгі білімі бар кадрларды даярлауға, сондай-ақ мектепке дейінгі тәрбиелеу мен оқытуға, орта білім беруге және балаларға қосымша білім беруге мемлекеттік білім беру тапсырысын орналастыру қағидаларын бекіту туралы
