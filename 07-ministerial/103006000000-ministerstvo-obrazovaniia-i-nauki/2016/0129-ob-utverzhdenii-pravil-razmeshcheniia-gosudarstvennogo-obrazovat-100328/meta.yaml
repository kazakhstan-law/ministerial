  title:
    rus: О внесении изменений и дополнения в приказ Министра образования и науки Республики Казахстан от 29 января 2016 года № 122 «Об утверждении Правил размещения государственного образовательного заказа на подготовку кадров с высшим и послевузовским образованием с учетом потребностей рынка труда, на подготовительные отделения организаций высшего и (или) послевузовского образования»
    kaz: «Еңбек нарығының қажеттіліктерін ескере отырып, жоғары және жоғары оқу орнынан кейінгі білімі бар кадрларды даярлауға жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарының дайындық бөлімшелеріне мемлекеттік білім беру тапсырысын орналастыру қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2016 жылғы 29 қаңтардағы № 122 бұйрығына өзгерістер мен толықтыру енгізу туралы
