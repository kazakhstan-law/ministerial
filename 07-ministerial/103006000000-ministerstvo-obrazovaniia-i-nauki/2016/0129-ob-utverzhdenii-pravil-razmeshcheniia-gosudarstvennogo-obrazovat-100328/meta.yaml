  title:
    rus: О внесении изменений и дополнений в приказ Министра образования и науки Республики Казахстан от 29 января 2016 года № 122 «Об утверждении Правил размещения государственного образовательного заказа на подготовку кадров с техническим и профессиональным, послесредним, высшим и послевузовским образованием с учетом потребностей рынка труда, на подготовительные отделения организаций высшего и (или) послевузовского образования, а также на дошкольное воспитание и обучение, среднее образование и дополнительное образование детей»
    kaz: «Еңбек нарығының қажеттіліктерін ескере отырып, техникалық және кәсiптiк, орта бiлiмнен кейiнгi, жоғары және жоғары оқу орнынан кейiнгi бiлiмi бар кадрларды даярлауға, жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарының дайындық бөлімдеріне, сондай-ақ мектепке дейінгі тәрбиелеу мен оқытуға, орта білім беруге және қосымша білім беруге мемлекеттiк бiлiм беру тапсырысын орналастыру қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2016 жылғы 29 қаңтардағы № 122 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/159273/rus
