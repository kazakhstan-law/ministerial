title:
  rus: Об утверждении Правил размещения государственного образовательного заказа на подготовку кадров с высшим и послевузовским образованием с учетом потребностей рынка труда, на подготовительные отделения организаций высшего и (или) послевузовского образования
  kaz: Еңбек нарығының қажеттіліктерін ескере отырып, жоғары және жоғары оқу орнынан кейінгі білімі бар кадрларды даярлауға жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарының дайындық бөлімшелеріне мемлекеттік білім беру тапсырысын орналастыру қағидаларын бекіту туралы
