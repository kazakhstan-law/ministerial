act_code: '99131'
requisite: Приказ Министра образования и науки Республики Казахстан от 18 января 2016 года № 42. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 февраля 2016 года № 13076.Утратил силу приказом Министра просвещения Республики Казахстан от 2 мая 2025 года № 103 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении правил отмены занятий в организациях среднего образования, а также организациях образования, реализующих образовательные программы технического и профессионального образования, при неблагоприятных погодных метеоусловиях
  kaz: Қолайсыз ауа райы метеожағдайларында орта білім беру ұйымдарында, сондай-ақ техникалық және кәсіптік білімнің білім беру бағдарламаларын іске асыратын білім беру ұйымдарында сабақтарды тоқтату қағидаларын бекіту туралы
