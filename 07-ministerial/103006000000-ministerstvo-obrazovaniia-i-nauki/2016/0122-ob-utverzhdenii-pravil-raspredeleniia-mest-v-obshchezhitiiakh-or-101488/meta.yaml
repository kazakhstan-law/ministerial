  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 4 декабря 2014 года № 506 «Об утверждении Правил предоставления академических отпусков обучающимся в организациях технического и профессионального, послесреднего образования» и о внесении изменений в приказ Министра образования и науки Республики Казахстан от 22 января 2016 года № 66 «Об утверждении Правил распределения мест в общежитиях организаций образования»
    kaz: «Техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарында білім алушыларға академиялық демалыстар беру қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2014 жылғы 4 желтоқсандағы № 506 бұйрығына өзгерістер енгізу туралы және «Білім беру ұйымдарының жатақханаларындағы орындарды бөлу қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2016 жылғы 22 қаңтардағы № 66 бұйрығына өзгерістер енгізу туралы
