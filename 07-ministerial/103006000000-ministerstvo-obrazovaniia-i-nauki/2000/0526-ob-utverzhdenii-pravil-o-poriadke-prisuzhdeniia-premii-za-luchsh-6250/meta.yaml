requisite: Приказ Министра образования и науки Республики Казахстан от 27 мая 2000 года № 500. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 июня 2000 года за № 1168. Утратил силу приказом Министра образования и науки Республики Казахстан от 21 декабря 2011 года № 536 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
