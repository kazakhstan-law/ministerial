  title:
    rus: О внесении изменений и дополнений в приказ Министра образования и науки Республики Казахстан от 27 мая 2000 года № 500 "Об утверждении Правил о порядке присуждения премий за лучшие научные исследования и премий молодым ученым за лучшие научные работы", зарегистрированный в Министерстве юстиции Республики Казахстан за № 1168
    kaz: Қазақстан Республикасы Әділет министрлігінде N 1168 тіркелген Қазақстан Республикасы Білім және ғылым министрінің "Үздік ғылыми зерттеулер үшін сыйлықтар беру және жас ғалымдарға үздік ғылыми жұмыстары үшін сыйлықтар берудің тәртібі жөніндегі ережелерді бекіту туралы" 2000 жылғы 27 мамырдағы N 500 бұйрығына өзгерістер мен толықтырулар енгізу туралы
