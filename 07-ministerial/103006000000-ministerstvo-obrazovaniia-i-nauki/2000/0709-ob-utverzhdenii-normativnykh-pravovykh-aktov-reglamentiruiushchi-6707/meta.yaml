  requisite: Приказ Министра образования и науки Республики Казахстан от 3 октября 2002 года N 713. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 ноября 2002 года за N 2053. Утратил силу приказом Министра образования и науки Республики Казахстан от 17 сентября 2013 года № 375 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в приказ Министра образования и науки Республики Казахстан от 10 июля 2000 года N 708 "Об утверждении нормативных правовых актов, регламентирующих деятельность дошкольных и общеобразовательных организаций образования", зарегистрированный в Министерстве юстиции Республики Казахстан за N 1216
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде N 1216 тiркелген "Жалпы бiлiм беретiн және мектепке дейiнгі бiлiм ұйымдарының қызметiн регламенттейтiн нормативтiк құқықтық актiлердi бекiту туралы" Қазақстан Республикасы Бiлiм және ғылым министрiнiң 2000 жылғы 10 шiлдедегi N 708 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы
