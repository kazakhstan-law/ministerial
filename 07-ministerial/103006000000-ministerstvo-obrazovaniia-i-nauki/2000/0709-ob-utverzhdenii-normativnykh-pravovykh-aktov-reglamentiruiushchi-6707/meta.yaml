  title:
    rus: О внесении дополнений в приказ Министра образования и науки Республики Казахстан от 10 июля 2000 года N 708 "Об утверждении нормативных правовых актов, регламентирующих деятельность дошкольных и общеобразовательных организаций образования", зарегистрированный в Министерстве юстиции Республики Казахстан за N 1216
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде 1216-нөмiрмен тiркелген "Мектепке дейiнгi және жалпы бiлiм беретiн бiлiм беру ұйымдарының қызметiн реттейтiн нормативтiк құқықтық актiлердi бекiту туралы" Қазақстан Республикасы Бiлiм және ғылым министрiнiң 2000 жылғы 10 шiлдедегi N 708 бұйрығына өзгерiстер енгiзу туралы
