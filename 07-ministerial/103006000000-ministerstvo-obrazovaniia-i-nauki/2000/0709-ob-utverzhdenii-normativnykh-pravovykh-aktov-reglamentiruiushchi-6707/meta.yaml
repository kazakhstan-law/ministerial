act_code: '6707'
requisite: Приказ Министра образования и науки Республики Казахстан от 10 июля 2000 года N 708. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 августа 2000 года за N 1216. Утратил силу приказом Министра образования и науки Республики Казахстан от 17 сентября 2013 года № 375
title:
