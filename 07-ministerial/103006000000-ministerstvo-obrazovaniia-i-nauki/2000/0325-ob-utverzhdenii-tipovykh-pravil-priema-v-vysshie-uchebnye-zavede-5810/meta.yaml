  title:
    rus: О внесении изменений и дополнений в приказ Министра образования и науки Республики Казахстан от 25 марта 2000 года N 247 "Об утверждении Типовых правил приема в высшие учебные заведения Республики Казахстан", зарегистрированный в Министерстве юстиции Республики Казахстан за № 1118
    kaz: Қазақстан Республикасының Әдiлет министрлігінде № 1118-бен тiркелген "Қазақстан Республикасының жоғары оқу орындарына қабылдаудың типтiк ережелерiн бекiту туралы" Қазақстан Республикасы Білім және ғылым министрiнің 2000 жылғы 25 наурыздағы бұйрығына өзгерiстер мен толықтырулар енгiзу туралы
