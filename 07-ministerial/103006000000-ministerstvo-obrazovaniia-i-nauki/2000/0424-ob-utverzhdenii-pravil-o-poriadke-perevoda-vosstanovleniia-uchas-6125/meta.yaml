  title:
    rus: О внесении изменений и дополнений в приказ и.о. Министра образования и науки Республики Казахстан от 25 апреля 2000 года № 391 "Об утверждении Правил о порядке перевода, восстановления учащихся начальных и средних профессиональных учебных заведений", зарегистрированный в Министерстве юстиции Республики Казахстан за № 1143
    kaz: Қазақстан Республикасы Әділет министрлігінде № 1143 тіркелген Қазақстан Республикасы Бiлiм және ғылым министрi міндетін атқарушының "Кәсiптiк бастауыш және орта оқу орындары оқушыларының ауысуы, оқуын қалпына келтіру тәртібі жөніндегі ережені бекіту туралы" 2000 жылғы 25 сәуірдегі № 391 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы
