    rus: О внесении дополнений и изменений в приказ Министра образования и науки Республики Казахстан от 12 декабря 2000 года N 1159 "Об утверждении видов поощрения Министерства образования и науки Республики Казахстан", зарегистрированным за N 1361
    kaz: '"Қазақстан Республикасы Білім және ғылым министрлігінің көтермелеу түрлерін бекіту туралы" Қазақстан Республикасы Білім және ғылым министрінің N 1361 тіркелген 2000 жылғы 12 желтоқсандағы N 1159 бұйрығына толықтырулар мен өзгерістер енгізу туралы'
