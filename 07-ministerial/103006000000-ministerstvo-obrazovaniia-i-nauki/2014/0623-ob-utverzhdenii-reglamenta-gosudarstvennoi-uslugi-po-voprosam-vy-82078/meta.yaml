requisite: Приказ Министра образования и науки Республики Казахстан от 23 июня 2014 года № 241. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 июля 2014 года № 9612. Утратил силу приказом Министра образования и науки Республики Казахстан от 9 июня 2015 года № 372
title:
  rus: Об утверждении регламента государственной услуги по вопросам выдачи экспертного заключения авторам и авторскому коллективу на учебные издания дошкольного, начального, основного среднего, общего среднего, технического и профессионального высшего образования
  kaz: Мектепке дейінгі, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік және жоғарғы білім берудің оқулық басылымдары бойынша авторларға және авторлар ұжымына сараптамалық қорытынды беру мәселелері бойынша мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
