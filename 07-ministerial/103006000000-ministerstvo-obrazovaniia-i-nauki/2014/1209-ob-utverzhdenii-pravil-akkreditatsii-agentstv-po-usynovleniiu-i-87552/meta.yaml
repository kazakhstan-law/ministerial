title:
  rus: Об утверждении Правил аккредитации агентств по усыновлению и организаций по оказанию содействия в устройстве детей-сирот, детей, оставшихся без попечения родителей, в семьи граждан Республики Казахстан
  kaz: Бала асырап алу жөніндегі агенттіктерді және жетім балаларды, ата-аналарының қамқорлығынсыз қалған балаларды Қазақстан Республикасы азаматтарының отбасыларына орналастыруға жәрдем көрсету жөніндегі ұйымдарды аккредиттеу қағидаларын бекіту туралы
