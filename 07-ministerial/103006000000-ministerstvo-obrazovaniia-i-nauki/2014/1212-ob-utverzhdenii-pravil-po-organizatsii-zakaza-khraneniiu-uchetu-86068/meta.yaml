  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра образования и науки Республики Казахстан от 12 декабря 2014 года № 519 "Об утверждении Правил по организации заказа, хранению, учету и выдаче бланков документов государственного образца об образовании и (или) квалификации и обеспечение ими организаций образования, реализующих профессиональные учебные программы высшего и послевузовского образования, подведомственных организаций образования"
    kaz: '"Білім және (немесе) біліктілік туралы мемлекеттік үлгідегі құжаттардың бланкілеріне тапсырыс беруді ұйымдастыру, оларды сақтау, есепке алу және беру және олармен жоғары және жоғары оқу орнынан кейінгі білім берудің кәсіптік оқу бағдарламаларын іске асыратын білім беру ұйымдарын, ведомстволық бағыныстағы білім беру ұйымдарын қамтамасыз ету жөніндегі қағидаларды бекіту туралы" Қазақстан Республикасы Білім және ғылым Министрінің міндетін атқарушының 2014 жылғы 12 желтоқсандағы № 519 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/99965/rus
