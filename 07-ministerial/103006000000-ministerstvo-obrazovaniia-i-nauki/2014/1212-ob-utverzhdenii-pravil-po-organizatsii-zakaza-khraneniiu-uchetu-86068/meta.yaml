act_code: '86068'
requisite: Приказ и.о. Министра образования и науки Республики Казахстан от 12 декабря 2014 года № 519. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 января 2015 года № 10079
title:
  rus: Об утверждении Правил по организации заказа, хранению, учету и выдаче бланков документов государственного образца об образовании и обеспечению ими организаций образования, реализующих общеобразовательные учебные программы основного среднего, общего среднего образования и образовательные программы технического и профессионального, послесреднего образования, подведомственных организаций образования
  kaz: Бiлiм туралы мемлекеттiк үлгiдегi құжаттардың бланкiлерiне тапсырыс берудi ұйымдастыру, оларды сақтау, есепке алу мен беру және негізгі орта, жалпы орта білімнің жалпы білім беретін оқу бағдарламаларын және техникалық және кәсіптік, орта бiлiмнен кейінгі білімнің білім беру бағдарламаларын iске асыратын бiлiм беру ұйымдарын, ведомстволық бағынысты бiлiм беру ұйымдарын олармен қамтамасыз ету жөнiндегi қағидаларын бекіту туралы
