  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра образования и науки Республики Казахстан от 12 декабря 2014 года № 519 «Об утверждении Правил по организации заказа, хранению, учету и выдаче бланков документов государственного образца об образовании и обеспечению ими организаций образования, реализующих общеобразовательные учебные программы основного среднего, общего среднего образования и образовательные программы технического и профессионального, послесреднего, высшего и послевузовского образования, подведомственных организаций образования и осуществлении контроля за их использованием»
    kaz: «Бiлiм туралы мемлекеттiк үлгiдегi құжаттардың бланкiлерiне тапсырыс берудi ұйымдастыру, оларды сақтау, есепке алу мен беру және олармен негізгі орта, жалпы орта білімнің жалпы білім беретін оқу бағдарламаларын және техникалық және кәсіптік, орта бiлiмнен кейінгі, жоғары және жоғары оқу орнынан кейiнгi бiлiмнің білім беру бағдарламаларын iске асыратын бiлiм беру ұйымдарын, ведомстволық бағынысты бiлiм беру ұйымдарын қамтамасыз ету, сондай-ақ олардың пайдаланылуын бақылауды жүзеге асыру жөніндегі қағидаларды бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің міндетін атқарушының 2014 жылғы 12 желтоқсандағы № 519 бұйрығына өзгерістер енгізу туралы
