  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра образования и науки Республики Казахстан от 12 декабря 2014 года № 519 «Об утверждении Правил по организации заказа, хранению, учету и выдаче бланков документов государственного образца об образовании и (или) квалификации и обеспечение ими организаций образования, реализующих общеобразовательные учебные программы основного среднего и общего среднего образования, образовательные программы высшего и послевузовского образования, подведомственных организаций образования»
    kaz: «Білім және (немесе) біліктілік туралы мемлекеттік үлгідегі құжаттардың бланкілеріне тапсырыс беруді ұйымдастыру, оларды сақтау, есепке алу және беру және олармен негізгі орта білім және жалпы орта білім жалпы орта білім және жоғары және жоғары оқу орнынан кейінгі білім берудің кәсіптік оқу бағдарламаларын іске асыратын білім беру ұйымдарын, ведомстволық бағыныстағы білім беру ұйымдарын қамтамасыз етуді жүзеге асыру жөніндегі қағидаларды бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің міндетін атқарушының 2014 жылғы 12 желтоқсандағы № 519 бұйрығына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/125160/rus
