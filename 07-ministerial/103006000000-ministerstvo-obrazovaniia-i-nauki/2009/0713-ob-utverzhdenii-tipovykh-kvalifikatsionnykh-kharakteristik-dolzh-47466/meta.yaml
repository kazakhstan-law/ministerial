  title:
    rus: О внесении изменений и дополнения в приказы Министра образования и науки Республики Казахстан от 13 июля 2009 года № 338 «Об утверждении Типовых квалификационных характеристик должностей педагогов», от 21 февраля 2012 года № 57 «Об утверждении правил назначения на должности, освобождения от должностей первых руководителей и педагогов государственных организаций образования»
    kaz: «Педагог лауазымдарының үлгілік біліктілік сипаттамаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2009 жылғы 13 шілдедегі № 338, «Мемлекеттік білім беру ұйымдарының бірінші басшылары мен педагогтерін лауазымға тағайындау, лауазымнан босату қағидаларын бекіту туралы» 2012 жылғы 21 ақпандағы № 57 бұйрықтарына өзгерістер мен толықтыру енгізу туралы»
