requisite: Приказ Министра образования и науки Республики Казахстан от 28 января 2009 года N 27. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 февраля 2009 года N 5550. Утратил силу приказом Министра образования и науки Республики Казахстан от 29 мая 2013 года № 206
title:
  rus: Об утверждении Типовых правил организации деятельности семейных детских садов, комплексов "школа-детский сад", кабинетов коррекции и инклюзивного образования детей дошкольного возраста, консультационных пунктов для родителей
  kaz: Отбасылық балабақшалардың, "мектеп – балабақша" кешендерінің, мектеп жасына дейінгі балалардың түзеу және инклюзивті білім беру кабинеттерінің, ата-аналарға арналған консультациялық пункттерінің қызметін ұйымдастырудың үлгі ережелерін бекіту туралы
