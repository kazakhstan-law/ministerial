    kaz: '"Қазақстан Республикасы Президентінің жанындағы Мемлекеттік қызмет академиясы қызметкерлерінің мамандығы бойынша жұмыс стажын есептеудің ережесін бекіту туралы" Қазақстан Республикасы Білім және ғылым министрінің 2002 жылғы 22 сәуірдегі N 325 бұйрығына өзгерістер енгізу туралы'
