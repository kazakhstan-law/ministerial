requisite: Приказ Министра образования и науки Республики Казахстан от 11 апреля 2005 года N 232. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 мая 2005 года N 3619. Утратил силу приказом Министра образования и науки Республики Казахстан от 26 марта 2008 года N 134.
title:
  rus: Об утверждении Положения о государственной и апелляционной комиссиях по организации и проведению промежуточного государственного контроля в организациях высшего профессионального образования Республики Казахстан
  kaz: Қазақстан Республикасының кәсіптік жоғары білім беру ұйымдарында мемлекеттік аралық бақылауды ұйымдастыру және өткізу жөніндегі мемлекеттік және апелляциялық комиссиялар туралы ережені бекіту туралы
