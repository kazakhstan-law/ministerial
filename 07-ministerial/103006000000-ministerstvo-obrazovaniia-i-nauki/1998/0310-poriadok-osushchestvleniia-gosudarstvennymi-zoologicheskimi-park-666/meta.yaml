requisite: Утвержден приказом Министра образования, культуры и здравоохранения Республики Казахстан от 10 марта 1998 года. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 мая 1998 года за № 511. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 8 октября 2012 года № 17-03/505
title:
