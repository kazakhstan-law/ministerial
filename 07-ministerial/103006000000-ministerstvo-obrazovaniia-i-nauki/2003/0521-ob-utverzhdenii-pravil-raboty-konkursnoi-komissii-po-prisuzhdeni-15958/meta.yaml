  title:
    rus: О внесении изменений в приказ и.о. Министра образования и науки Республики Казахстан от 22 мая 2003 года N 337 "Об утверждении Правил работы Конкурсной комиссии по присуждению государственных образовательных грантов и предоставлению государственных образовательных кредитов"
    kaz: '"Мемлекеттік білім гранттарын тағайындау мен мемлекеттік білім несиелерін беру жөніндегі конкурстық комиссия жұмысының ережелерін бекіту туралы" Қазақстан Республикасы Білім және ғылым министрінің міндетін атқарушының 2003 жылғы 22 мамырдағы N 337 бұйрығына өзгерістер енгізу туралы'
