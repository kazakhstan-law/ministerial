title:
  rus: Об утверждении Перечня типов и видов специальных организаций образования, необходимого количества мест в организациях образования для лиц, нуждающихся в специальном образовании
  kaz: Арнайы бiлiм беру ұйымдарының үлгiлерi мен түрлерiнің тiзбесiн, арнайы бiлiм алуға мұқтаж адамдарға арналған бiлiм беру ұйымдарындағы қажеттi орын санын бекiту туралы
