  title:
    rus: О внесении изменений и дополнений в приказ и.о. Министра образования и науки Республики Казахстан от 29 ноября 2003 года N 787 "Об утверждении Перечня типов и видов специальных организаций образования, необходимого количества мест в организациях образования для лиц, нуждающихся в специальном образовании"
    kaz: '"Арнайы білім беру ұйымдарының үлгілері мен түрлерінің тізбесін, арнайы білім алуға мұқтаж адамдарға арналған білім беру ұйымдарындағы қажетті орын сандарын бекіту туралы" Қазақстан Республикасы Білім және ғылым министрі міндетін атқарушының 2003 жылғы 29 қарашадағы N 787 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
