    kaz: '"Шетелдік білім беру ұйымдары берген білім туралы құжаттарды Қазақстан Республикасында тану және нострификациялау (баламасын белгілеу) тәртібі жөніндегі ережені бекіту туралы" Қазақстан Республикасы Білім және ғылым министрінің 2003 жылғы 8 тамыздағы N 542 бұйрығына өзгеріс енгізу туралы'
