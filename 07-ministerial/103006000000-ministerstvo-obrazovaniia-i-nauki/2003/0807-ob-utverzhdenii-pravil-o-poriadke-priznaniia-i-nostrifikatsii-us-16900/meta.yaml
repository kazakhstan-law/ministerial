act_code: '16900'
requisite: Приказ Министра образования и науки Республики Казахстан от 8 августа 2003 года N 542. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 сентября 2003 года N 2477. Утратил силу приказом Министра образования и науки Республики Казахстан от 10 января 2008 года N 8.
title:
  rus: Об утверждении Правил о порядке признания и нострификации (установления эквивалентности) в Республике Казахстан документов об образовании, выданных зарубежными организациями образования
  kaz: Қазақстан Республикасында шетелдік білім беру ұйымдары берген білім туралы құжаттарды тану және нострификациялау (баламасын белгілеу) тәртібі туралы ережені бекіту туралы
