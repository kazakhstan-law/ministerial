  title:
    rus: О внесении изменений и дополнения в приказ Министра образования и науки Республики Казахстан от 8 августа 2003 года № 542 "Об утверждении Правил о порядке признания и нострификации (установления эквивалентности) в Республике Казахстан документов об образовании, выданных зарубежными организациями образования"
    kaz: '"Қазақстан Республикасында шетелдік білім беру ұйымдары берген білім туралы құжаттарды тану және нострификациялау (баламасын белгілеу) тәртібі жөніндегі ережені бекіту туралы" Қазақстан Республикасы Білім және ғылым министрінің 2003 жылғы 8 тамыздағы № 542 бұйрығына өзгерістер мен толықтыру енгізу туралы'
