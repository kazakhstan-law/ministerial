title:
  rus: Об утверждении перечня учебников и базовых учебников по отдельным предметам для организаций среднего образования, учебно-методических комплексов для дошкольных организаций, организаций среднего образования, в том числе в электронной форме
  kaz: Орта білім беру ұйымдарына арналған жекелеген пәндер бойынша оқулықтар мен базалық оқулықтардың, мектепке дейінгі ұйымдарға, орта білім беру ұйымдарына арналған оқу-әдістемелік кешендердің, оның ішінде электрондық нысандағы тізбесін бекіту туралы
