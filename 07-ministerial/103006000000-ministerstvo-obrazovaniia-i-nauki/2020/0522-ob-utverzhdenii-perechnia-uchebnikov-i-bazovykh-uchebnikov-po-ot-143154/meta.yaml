  title:
    rus: О внесении изменения в приказ Министра образования и науки Республики Казахстан от 22 мая 2020 года № 216 «Об утверждении перечня учебников для организаций среднего образования, учебно-методических комплексов для дошкольных организаций, организаций среднего образования, в том числе в электронной форме»
    kaz: «Орта білім беру ұйымдарына арналған оқулықтардың, мектепке дейінгі ұйымдарға, орта білім беру ұйымдарына арналған оқу-әдістемелік кешендердің, оның ішінде электрондық нысандағы тізбесін бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2020 жылғы 22 мамырдағы № 216 бұйрығына өзгеріс енгізу туралы
