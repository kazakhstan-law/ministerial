  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 22 мая 2020 года № 216 «Об утверждении перечня учебников, учебно-методических комплексов, пособий и другой дополнительной литературы, в том числе на электронных носителях»
    kaz: «Оқулықтардың, оқу-әдiстемелiк кешендерінің, құралдарының және басқа да қосымша әдебиеттердің, оның ішінде электрондық жеткізгіштегілерінің тізбесін бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2020 жылғы 22 мамырдағы № 216 бұйрығына өзгерістер енгізу туралы
