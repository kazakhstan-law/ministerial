  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 27 апреля 2020 года № 164 «Об утверждении Правил оказания государственной услуги «Прием документов для участия в конкурсе по присуждению образовательного гранта Президента Республики Казахстан «Өркен» для оплаты обучения одаренных детей в автономной организации образования «Назарбаев Интеллектуальные школы»
    kaz: «Назарбаев Зияткерлік мектептері» дербес білім беру ұйымында дарынды балалардың оқуына ақы төлеу үшін Қазақстан Республикасы Президентінің «Өркен» білім беру грантын тағайындауға арналған конкурсқа қатысу үшін құжаттар қабылдау» мемлекеттік қызметін көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2020 жылғы 27 сәуірдегі № 164 бұйрығына өзгерістер енгізу туралы
