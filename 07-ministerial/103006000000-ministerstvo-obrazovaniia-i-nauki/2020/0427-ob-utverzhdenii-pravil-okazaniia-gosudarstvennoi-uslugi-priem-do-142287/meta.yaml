  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 27 апреля 2020 года № 164 «Об утверждении Правил оказания государственной услуги «Прием документов для участия в конкурсе и зачисление на обучение в автономную организацию образования «Назарбаев Интеллектуальные школы» в рамках образовательного гранта Президента Республики Казахстан «Өркен»
    kaz: «Қазақстан Республикасы Президентінің «Өркен» білім беру гранты шеңберінде «Назарбаев Зияткерлік мектептері» дербес білім беру ұйымына конкурсқа қатысу үшін құжаттарды қабылдау және оқуға қабылдау» мемлекеттік қызметін көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2020 жылғы 27 сәуірдегі № 164 бұйрығына өзгерістер енгізу туралы
