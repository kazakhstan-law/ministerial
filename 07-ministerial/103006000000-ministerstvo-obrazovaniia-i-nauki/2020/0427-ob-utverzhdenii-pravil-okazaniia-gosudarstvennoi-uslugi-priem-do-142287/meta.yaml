title:
  rus: Об утверждении Правил оказания государственной услуги «Прием документов для участия в конкурсе и зачисление на обучение в автономную организацию образования «Назарбаев Интеллектуальные школы» в рамках образовательного гранта Президента Республики Казахстан «Өркен»
  kaz: Қазақстан Республикасы Президентінің «Өркен» білім беру гранты шеңберінде «Назарбаев Зияткерлік мектептері» дербес білім беру ұйымына конкурсқа қатысу үшін құжаттарды қабылдау және оқуға қабылдау» мемлекеттік қызметін көрсету қағидаларын бекіту туралы
