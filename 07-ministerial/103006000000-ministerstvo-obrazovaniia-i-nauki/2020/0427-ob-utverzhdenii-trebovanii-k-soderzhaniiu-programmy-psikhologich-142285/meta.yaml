act_code: '142285'
requisite: Приказ Министра образования и науки Республики Казахстан от 27 апреля 2020 года № 165. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 апреля 2020 года № 20507
title:
  rus: Об утверждении требований к содержанию программы психологической подготовки, порядка организации деятельности по психологической подготовке граждан Республики Казахстан, постоянно проживающих на территории Республики Казахстан, желающих принять детей-сирот, детей, оставшихся без попечения родителей, на воспитание в свою семью и формы сертификата о прохождении такой подготовки
  kaz: Қазақстан Республикасының аумағында тұрақты тұратын, жетім балаларды, ата-аналарының қамқорлығынсыз қалған балаларды өз отбасына тәрбиелеуге қабылдауға тілек білдірген Қазақстан Республикасының азаматтарын психологиялық даярлау бағдарламасының мазмұнына қойылатын талаптарды, оларды психологиялық даярлау жөніндегі қызметті ұйымдастыру тәртібін және осындай даярлықтан өткені туралы сертификаттың нысанын бекіту туралы
