  title:
    rus: О внесении изменений и дополнений в приказ Министра образования и науки Республики Казахстан от 29 декабря 2020 года № 553 «О распределении функций между органами управления образованием (управления образования областей, городов республиканского значения, столицы, а также подотчетные и подконтрольные им отделы образования, располагаемые в районах, городах или районах в городах областного и республиканского значения, столице), применяемых при формировании схем управления административно-территориальной единицей»
    kaz: «Әкімшілік-аумақтық бірлікті басқару схемаларын қалыптастыру кезінде қолданылатын білім беруді басқару органдары (облыстардың, республикалық маңызы бар қалалардың, астананың білім басқармалары, сондай-ақ оларға есеп беретін және олардың бақылауындағы, аудандарда, қалаларда немесе облыстық және республикалық маңызы бар қалалардағы, астанадағы аудандарда орналасатын білім бөлімдері) арасында функцияларды бөлу туралы» Қазақстан Республикасы Білім және ғылым министрінің 2020 жылғы 29 желтоқсандағы № 553 бұйрығына өзгерістер мен толықтырулар енгізу туралы
