act_code: '159751'
requisite: Приказ Министра образования и науки Республики Казахстан от 29 декабря 2020 года № 553
title:
  rus: О распределении функций между органами управления образованием (управления образования областей, городов республиканского значения, столицы, а также подотчетные и подконтрольные им отделы образования, располагаемые в районах, городах или районах в городах областного и республиканского значения, столице), применяемых при формировании схем управления административно - территориальной единицей
  kaz: Әкімшілік-аумақтық бірлікті басқару схемаларын қалыптастыру кезінде қолданылатын білім беруді басқару органдары (облыстардың, республикалық маңызы бар қалалардың, астананың білім басқармалары, сондай-ақ оларға есеп беретін және олардың бақылауындағы, аудандарда, қалаларда немесе облыстық және республикалық маңызы бар қалалардағы, астанадағы аудандарда орналасатын білім бөлімдері) арасында функцияларды бөлу туралы
