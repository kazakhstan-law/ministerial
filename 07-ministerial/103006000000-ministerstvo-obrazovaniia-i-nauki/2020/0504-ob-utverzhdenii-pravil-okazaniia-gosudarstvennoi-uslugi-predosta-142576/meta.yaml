  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 4 мая 2020 года № 180 «Об утверждении Правил оказания государственной услуги «Предоставление бесплатного питания отдельным категориям граждан, а также лицам, находящимся под опекой (попечительством) и патронатом, обучающимся и воспитанникам организаций технического и профессионального, послесреднего и высшего образования»
    kaz: «Техникалық және кәсіптік, орта білімнен кейінгі және жоғары білім беру ұйымдарында білім алатын және тәрбиеленетін жекелеген санаттағы азаматтарға, сондай-ақ қорғаншылықтағы (қамқоршылықтағы) және патронаттағы адамдарға тегін тамақтандыруды ұсыну» мемлекеттік қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2020 жылғы 4 мамырдағы № 180 бұйрығына өзгерістер енгізу туралы
