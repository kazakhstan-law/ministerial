title:
  rus: Об утверждении Правил оказания государственной услуги «Предоставление бесплатного питания отдельным категориям граждан, а также лицам, находящимся под опекой (попечительством) и патронатом, обучающимся и воспитанникам организаций высшего образования»
  kaz: «Жоғары білім беру ұйымдарында білім алатын және тәрбиеленетін жекелеген санаттағы азаматтарға, сондай-ақ қорғаншылықтағы (қамқоршылықтағы) және патронаттағы адамдарға тегін тамақтандыруды ұсыну» мемлекеттік қызмет көрсету қағидаларын бекіту туралы
