title:
  rus: Об утверждении списка ведущих зарубежных высших учебных заведений, зарубежных организаций, рекомендуемых для обучения, прохождения языковых курсов победителями конкурса на присуждение международной стипендии «Болашак» на 2020 год
  kaz: «Болашақ» халықаралық стипендиясын тағайындау конкурсы жеңімпаздарының оқуы, тілдік курстардан өтуі үшін ұсынылатын шетелдік жетекші жоғары оқу орындарының, шетелдік ұйымдардың тізімін бекіту туралы
