  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 12 мая 2020 года № 196 «Об утверждении Правил оказания государственной услуги «Аккредитация субъектов научной и (или) научно-технической деятельности» и признании утратившими силу приказа Министра науки и высшего образования Республики Казахстан от 25 июля 2023 года № 335 «Об утверждении правил «Аккредитация субъектов научной и (или) научно-технической деятельности»
    kaz: «Ғылыми және (немесе) ғылыми-техникалық қызмет субъектілерін аккредиттеу» мемлекеттік қызметін көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2020 жылғы 12 мамырдағы № 196 бұйрығына өзгерістер енгізу және «Ғылыми және (немесе) ғылыми-техникалық қызмет субъектілерін аккредиттеу қағидаларын бекіту туралы» Қазақстан Республикасы Ғылым және жоғары білім министрінің 2023 жылғы 25 шiлдедегi № 335 бұйрығының күші жойылды деп тану туралы
