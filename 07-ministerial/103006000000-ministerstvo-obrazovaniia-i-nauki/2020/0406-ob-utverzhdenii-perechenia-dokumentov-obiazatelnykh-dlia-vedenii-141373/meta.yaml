  title:
    rus: О внесении изменений и дополнений в приказ Министра образования и науки Республики Казахстан от 6 апреля 2020 года № 130 «Об утверждении Перечня документов, обязательных для ведения педагогами организаций среднего, технического и профессионального, послесреднего образования, и их формы»
    kaz: «Орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарының педагогтері жүргізу үшін міндетті құжаттардың тізбесін және олардың нысандарын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2020 жылғы 6 сәуірдегі № 130 бұйрығына өзгерістер мен толықтырулар енгізу туралы
