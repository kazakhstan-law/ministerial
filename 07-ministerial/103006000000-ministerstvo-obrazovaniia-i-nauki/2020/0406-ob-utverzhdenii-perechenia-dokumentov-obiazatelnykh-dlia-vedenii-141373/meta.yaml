  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 6 апреля 2020 года № 130 «Об утверждении Перечня документов, обязательных для ведения педагогами организаций дошкольного воспитания и обучения, среднего, специального, дополнительного, технического и профессионального, послесреднего образования, и их формы»
    kaz: «Мектепке дейінгі тәрбие және оқыту, орта, арнаулы, қосымша, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарының педагогтері жүргізу үшін міндетті құжаттардың тізбесін және олардың нысандарын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2020 жылғы 6 сәуірдегі № 130 бұйрығына өзгерістер енгізу туралы
