title:
  rus: Об утверждении Правил оказания государственной услуги «Апостилирование официальных документов, исходящих из организаций начального, основного среднего, общего среднего, технического и профессионального, послесреднего образования»
  kaz: «Бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарынан шығатын ресми құжаттарды апостильдеу» мемлекеттік қызмет көрсету қағидаларын бекіту туралы
