act_code: '141373'
requisite: Приказ Министра образования и науки Республики Казахстан от 6 апреля 2020 года № 130. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 апреля 2020 года № 20317
title:
  rus: Об утверждении Перечня документов, обязательных для ведения педагогами дошкольных организаций и предшкольных классов общеобразовательных школ, лицеев и гимназий, организаций среднего, специального, дополнительного, технического и профессионального, послесреднего образования, и их формы
  kaz: Мектепке дейінгі ұйымдардың және жалпы білім беретін мектептердің, лицейлер мен гимназиялардың мектепалды сыныптарының, орта, арнаулы, қосымша, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарының педагогтері жүргізу үшін міндетті құжаттардың тізбесін және олардың нысандарын бекіту туралы
