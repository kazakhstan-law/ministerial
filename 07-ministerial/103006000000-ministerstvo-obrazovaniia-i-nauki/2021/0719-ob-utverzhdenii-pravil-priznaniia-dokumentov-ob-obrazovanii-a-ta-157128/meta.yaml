requisite: Приказ и.о. Министра образования и науки Республики Казахстан от 19 июля 2021 года № 352. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 июля 2021 года № 23626. Утратил силу приказом Министра просвещения Республики Казахстан от 28 июля 2023 года № 230 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил признания документов об образовании, а также перечня зарубежных организаций высшего и (или) послевузовского образования, документы об образовании которых признаются на территории Республики Казахстан
  kaz: Білім туралы құжаттарды тану қағидаларын, сондай-ақ білім туралы құжаттары Қазақстан Республикасының аумағында танылатын шетелдік жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарының тізбесін бекіту туралы
