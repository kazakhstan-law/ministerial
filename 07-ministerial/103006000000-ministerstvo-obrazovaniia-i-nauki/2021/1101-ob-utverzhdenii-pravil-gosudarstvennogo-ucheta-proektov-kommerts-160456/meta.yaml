requisite: Приказ и.о. Министра образования и науки Республики Казахстан от 1 ноября 2021 года № 543. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 ноября 2021 года № 25284. Утратил силу приказом Министра науки и высшего образования Республики Казахстан от 31 декабря 2024 года № 630 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
