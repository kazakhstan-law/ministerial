act_code: '51432'
requisite: Приказ Министра образования и науки Республики Казахстан от 8 февраля 2010 года № 40. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 марта 2010 года № 6111
title:
  rus: Об утверждении перечня специальностей и квалификаций технического и профессионального, послесреднего образования, получение которых допускается в формах заочного, вечернего обучения, онлайн-обучения, а также экстерната по специальностям культуры и искусства, физической культуры и спорта
  kaz: Мәдениет және өнер, дене шынықтыру және спорт мамандықтары бойынша сырттай, кешкі оқу, онлайн-оқу, сондай-ақ экстернат нысандарында білім алуға жол берілетін техникалық және кәсіптік, орта білімнен кейінгі білім берудің мамандықтары мен біліктіліктерінің тізбесін бекіту туралы
