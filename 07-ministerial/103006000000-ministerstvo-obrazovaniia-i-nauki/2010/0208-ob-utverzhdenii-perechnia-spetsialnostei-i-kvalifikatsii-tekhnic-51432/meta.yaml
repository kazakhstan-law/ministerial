  title:
    rus: О внесении изменения в приказ Министра образования и науки Республики Казахстан от 8 февраля 2010 года № 40 "Об утверждении Перечня профессий и специальностей, получение которых в заочной, вечерней формах и в форме экстерната не допускается и Инструкции по выдаче разрешения на обучение в форме экстерната в организациях образования, дающих высшее образование"
    kaz: Қазақстан Республикасы Білім және ғылым министрінің 2010 жылғы 8 ақпандағы № 40 "Сырттай, кешкі және экстернат нысанында білім алуға жол берілмейтін кәсіптер мен мамандықтардың тізбесін және Жоғары білім беретін білім беру ұйымдарында экстернат нысанында оқытуға рұқсат беру нұсқаулығын бекіту туралы" бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/80870/rus
