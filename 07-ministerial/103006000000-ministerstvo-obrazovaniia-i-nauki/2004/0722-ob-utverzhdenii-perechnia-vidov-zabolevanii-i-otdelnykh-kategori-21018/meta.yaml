title:
  rus: Об утверждении Перечня видов заболеваний и отдельных категорий населения, при амбулаторном лечении которых лекарственные средства и специализированные продукты детского и лечебного питания отпускаются бесплатно
  kaz: Амбулаториялық емдеу кезінде дәрілік заттар мен балаларға арналған және шипалы тағамдық арнаулы азық-түлік тегін босатылатын науқастар түрлерінің және тұрғындардың жекелеген санаттарының тізбесін бекіту туралы
