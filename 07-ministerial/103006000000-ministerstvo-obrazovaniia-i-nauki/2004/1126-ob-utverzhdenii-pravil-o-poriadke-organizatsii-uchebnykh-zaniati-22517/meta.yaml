act_code: '22517'
requisite: Приказ Министра образования и науки Республики Казахстан от 26 ноября 2004 года № 974. Зарегистрирован Министерством юстиции Республики Казахстан 23 декабря 2004 года № 3303. Утратил силу приказом Министра образования и науки Республики Казахстан от 4 июля 2013 года № 258 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:
  rus: Об утверждении Правил о порядке организации учебных занятий для детей-инвалидов, проходящих курс лечения в стационарных лечебно-профилактических, реабилитационных и других организациях здравоохранения, оказания помощи родителям в обучении детей-инвалидов на дому учебно-воспитательными организациями
  kaz: Стационарлық емдеу-алдын алу, оңалту және басқа денсаулық сақтау ұйымдарында емдеу курсынан өтіп жатқан мүгедек балалар үшін оқу сабақтарын ұйымдастыру, оқу-тәрбие ұйымдарының мүгедек балаларды үйде оқытуда ата-аналарға көмек көрсету тәртібі туралы ережелерді бекіту туралы
