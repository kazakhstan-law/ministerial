  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 31 января 2019 года № 49 «Об утверждении Общих требований к оформлению работ, выдвигаемых на соискание Государственной премии Республики Казахстан в области науки и техники имени аль-Фараби»
    kaz: «Қазақстан Республикасының әл-Фараби атындағы ғылым мен техника саласындағы мемлекеттік сыйлығын алуға ұсынылатын жұмыстарды ресімдеуге қойылатын жалпы талаптарды бекіту туралы «Қазақстан Республикасы Білім және ғылым министрінің 2019 жылғы 31 қаңтардағы № 49 бұйрығына өзгерістер енгізу туралы»
