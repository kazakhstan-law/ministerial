requisite: Приказ Министра образования и науки Республики Казахстан от 21 августа 2019 года № 373. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 августа 2019 года № 19279. Утратил силу приказом Министра просвещения Республики Казахстан от 31 марта 2025 года № 54 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении инструкции по взаимодействию организаций для детей-сирот и детей, оставшихся без попечения родителей, с негосударственными агентствами по усыновлению в вопросах устройства детей-сирот и детей, оставшихся без попечения родителей, в семьи граждан Республики Казахстан
  kaz: Жетім балалар мен ата-анасының қамқорлығынсыз қалған балаларға арналған ұйымдардың бала асырап алу жөніндегі мемлекеттік емес агенттіктермен Қазақстан Республикасы азаматтарының отбасыларына жетім балалар мен ата-анасының қамқорлығынсыз қалған балаларды орналастыру мәселелерінде өзара іс-қимылы бойынша нұсқаулықты бекіту туралы
