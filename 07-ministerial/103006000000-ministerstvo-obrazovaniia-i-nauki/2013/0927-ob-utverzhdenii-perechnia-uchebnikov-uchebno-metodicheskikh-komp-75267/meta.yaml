  requisite: Приказ Министра образования и науки Республики Казахстан от 28 апреля 2014 года № 127. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 мая 2014 года № 9385. Утратил силу приказом Министра образования и науки Республики Казахстан от 17 мая 2019 года № 217 (вводится в действие после дня его первого официального опубликования)
  title:
    rus: О внесении изменения и дополнений в приказ и.о. Министра образования и науки Республики Казахстан от 27 сентября 2013 года № 400 "Об утверждении перечня учебников, учебно-методических комплексов, пособий и другой дополнительной литературы, в том числе на электронных носителях, разрешенных к использованию в организациях образования"
    kaz: '"Білім беру ұйымдарында пайдалануға рұқсат етілген оқулықтардың, оқу-әдістемелік кешендердің, оқу құралдарының және басқа да қосымша әдебиеттердің, оның ішінде электрондық жеткізгіштердегі тізбесін бекіту туралы" Қазақстан Республикасы Білім және ғылым министрінің міндетін атқарушының 2013 жылғы 27 қыркүйектегі № 400 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/79960/rus
