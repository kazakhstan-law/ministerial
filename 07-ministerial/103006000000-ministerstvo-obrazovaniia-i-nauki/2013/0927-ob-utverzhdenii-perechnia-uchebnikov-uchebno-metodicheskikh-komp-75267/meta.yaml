  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра образования и науки Республики Казахстан от 27 сентября 2013 года № 400 "Об утверждении Перечня учебников, учебно-методических комплексов, пособий и другой дополнительной литературы, в том числе на электронных носителях, разрешенных к использованию в организациях образования"
    kaz: '"Білім беру ұйымдарында пайдалануға рұқсат етілген оқулықтардың, оқу-әдістемелік кешендердің, оқу құралдарының және басқа да қосымша әдебиеттердің, оның ішінде электрондық жеткізгіштердегі тізбесін бекіту туралы" Қазақстан Репсубликасы Білім және ғылым Министрінің міндетін атқарушының 2013 жылғы 27 қыркүйектегі № 400 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/98087/rus
