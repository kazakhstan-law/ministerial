requisite: Приказ и.о. Министра образования и науки Республики Казахстан от 27 сентября 2013 года № 400. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 ноября 2013 года № 8890. Утратил силу приказом Министра образования и науки Республики Казахстан от 17 мая 2019 года № 217 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении перечня учебников, учебно-методических комплексов, пособий и другой дополнительной литературы, в том числе на электронных носителях
  kaz: Оқулықтардың, оқу-әдістемелік кешендерінің, құралдарының және басқа да қосымша әдебиеттердің, оның ішінде электрондық жеткізгіштегілерінің тізбесін бекіту туралы
