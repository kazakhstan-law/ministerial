  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра образования и науки Республики Казахстан от 19 августа 2013 года № 347 «Об утверждении Перечня специальностей, по которым осуществляется подготовка специалистов по профессиональным учебным программам послесреднего образования»
    kaz: «Орта білімнен кейінгі білім берудің кәсіптік оқу бағдарламалары бойынша мамандар даярлау жүзеге асырылатын мамандықтар тізбесін бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің міндетін атқарушының 2013 жылғы 19 тамыздағы № 347 бұйрығына өзгерістер енгізу туралы
