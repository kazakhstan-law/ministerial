    kaz: «Қазақстан Республикасы Білім және ғылым министрлігінің салалық көтермелеу жүйесін бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің міндетін атқарушының 2013 жылғы 08 тамыздағы № 324 бұйрығына өзгеріс енгізу туралы
