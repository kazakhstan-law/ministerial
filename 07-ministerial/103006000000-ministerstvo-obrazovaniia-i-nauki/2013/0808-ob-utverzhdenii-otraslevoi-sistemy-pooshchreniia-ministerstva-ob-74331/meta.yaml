    kaz: «Қазақстан Республикасы Білім және ғылым министрлігінің салалық көтермелеу жүйесін бекіту туралы» Қазақстан Республикасы Білім және ғылым министрі міндетін атқарушының 2013 жылғы 8 тамыздағы № 324 бұйрығына өзгерістер мен толықтырулар енгізу туралы
