  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 4 декабря 2015 года № 677 «Об утверждении правил обеспечения льготного проезда путем выплаты компенсаций для обучающихся на основе государственного образовательного заказа в организациях образования, реализующих образовательные программы технического и профессионального, послесреднего и высшего образования, в период зимних и летних каникул на междугородном железнодорожном и автомобильном транспорте (кроме такси)»
    kaz: «Техникалық және кәсiптiк, орта бiлiмнен кейiнгi және жоғары бiлiмнің білім беру бағдарламаларын іске асыратын ұйымдарда мемлекеттік білім беру тапсырысы негізінде білім алушылар үшін өтемақылар төлеу арқылы қысқы және жазғы каникул кезеңінде қалааралық теміржол және автомобиль (таксиден басқа) көлігінде жеңілдікпен жол жүруді қамтамасыз ету қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2015 жылғы 4 желтоқсандағы № 677 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/164013/rus
