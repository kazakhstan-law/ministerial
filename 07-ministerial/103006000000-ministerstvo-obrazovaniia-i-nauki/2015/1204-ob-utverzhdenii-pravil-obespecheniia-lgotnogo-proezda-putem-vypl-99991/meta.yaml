act_code: '99991'
requisite: Приказ Министра образования и науки Республики Казахстан от 4 декабря 2015 года № 677. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 января 2016 года № 12894
title:
  rus: Об утверждении правил обеспечения льготного проезда путем выплаты компенсаций для обучающихся на основе государственного образовательного заказа в организациях образования, реализующих образовательные программы высшего образования, в период зимних и летних каникул на междугородном железнодорожном и автомобильном транспорте (кроме такси)
  kaz: Жоғары бiлiмнің білім беру бағдарламаларын іске асыратын ұйымдарда мемлекеттік білім беру тапсырысы негізінде білім алушылар үшін өтемақылар төлеу арқылы қысқы және жазғы каникул кезеңінде қалааралық теміржол және автомобиль (таксиден басқа) көлігінде жеңілдікпен жол жүруді қамтамасыз ету қағидаларын бекіту туралы
