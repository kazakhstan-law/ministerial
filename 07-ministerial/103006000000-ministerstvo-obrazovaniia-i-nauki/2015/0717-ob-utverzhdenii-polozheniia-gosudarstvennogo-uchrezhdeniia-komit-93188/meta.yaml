    kaz: '"Қазақстан Республикасы Білім және ғылым министрлігінің Білім және ғылым саласындағы бақылау комитеті" мемлекеттік мекемесінің ережесін бекіту туралы" Қазақстан Республикасы Білім және ғылым Министрінің міндетін атқарушының 2015 жылғы 17 шілдедегі № 463 бұйрығына өзгерістер енгізу туралы'
