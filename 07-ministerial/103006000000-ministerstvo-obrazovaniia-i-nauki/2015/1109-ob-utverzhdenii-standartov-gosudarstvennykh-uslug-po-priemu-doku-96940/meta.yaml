act_code: '96940'
requisite: Приказ Министра образования и науки Республики Казахстан от 9 ноября 2015 года № 632. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 декабря 2015 года № 12449. Утратил силу приказом Министра образования и науки Республики Казахстан от 14 мая 2020 года № 202 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении стандартов государственных услуг по приему документов для прохождения аттестации на присвоение (подтверждение) квалификационных категорий педагогическим работникам и приравненным к ним лицам организаций образования, реализующих программы дошкольного воспитания и обучения, начального, основного среднего, общего среднего, технического и профессионального, послесреднего образования
  kaz: Мектепке дейінгі тәрбие мен оқыту, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру бағдарламаларын іске асыратын білім беру ұйымдарының педагог қызметкерлері мен оларға теңестірілген тұлғаларға біліктілік санаттарын беру (растау) үшін оларды аттестаттаудан өткізуге құжаттарды қабылдау бойынша мемлекеттік көрсетілетін қызмет стандарттарын бекіту туралы
