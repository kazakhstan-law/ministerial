    kaz: «Шетелге, оның ішінде «Болашақ» халықаралық стипендиясы шеңберінде оқуға жіберу мәселелері бойынша мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2015 жылғы 9 сәуірдегі № 187 бұйрығына өзгерістер мен толықтырулар енгізу туралы
