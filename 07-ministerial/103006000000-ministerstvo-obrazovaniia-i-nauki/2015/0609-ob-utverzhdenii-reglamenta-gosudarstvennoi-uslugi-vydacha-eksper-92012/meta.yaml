act_code: '92012'
requisite: Приказ Министра образования и науки Республики Казахстан от 9 июня 2015 года № 372. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 июля 2015 года № 11652. Утратил силу приказом и.о. Министра образования и науки Республики Казахстан от 28 апреля 2017 года № 199 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги "Выдача экспертного заключения авторам и авторскому коллективу на учебные издания дошкольного, начального, основного среднего, общего среднего технического и профессионального и высшего образования"
  kaz: '"Мектепке дейінгі, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік және жоғары білім берудің оқулық басылымдары бойынша авторларға және авторлар ұжымына сараптамалық қорытынды беру" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'
