act_code: '90665'
requisite: Приказ Министра образования и науки Республики Казахстан от 17 апреля 2015 года № 214. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 июня 2015 года № 11252. Утратил силу приказом Министра образования и науки Республики Казахстан от 19 мая 2020 года № 211 (вводится в действие по истечении десяти календарных дней со дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Выдача экспертного заключения авторам и авторскому коллективу на учебные издания дошкольного, начального, основного среднего, общего среднего, технического и профессионального, послесреднего, высшего и послевузовского образования»
  kaz: «Мектепке дейінгі, бастауыш, негізгі орта, жалпы орта, техникалық және кәсiптік, орта білімнен кейінгі, жоғары және жоғары оқу орнынан кейінгі білім берудің оқу басылымдары бойынша авторларға және авторлар ұжымына сараптамалық қорытынды беру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
