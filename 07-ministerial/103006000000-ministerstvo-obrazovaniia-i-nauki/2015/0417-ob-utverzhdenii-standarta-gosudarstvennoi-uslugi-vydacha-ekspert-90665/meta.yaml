  title:
    rus: О внесении изменения в приказ Министра образования и науки Республики Казахстан от 17 апреля 2015 года № 214 «Об утверждении стандарта государственной услуги «Выдача экспертного заключения авторам и авторскому коллективу на учебные издания дошкольного, начального, основного среднего, общего среднего, технического и профессионального, послесреднего, высшего и послевузовского образования»
    kaz: «Мектепке дейінгі, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі, жоғары және жоғары оқу орнынан кейінгі білім берудің оқу басылымдары бойынша авторларға және авторлар ұжымына сараптамалық қорытынды беру мемлекеттік көрсетілетін қызмет стандарты бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2015 жылғы 17 сәуірдегі № 214 бұйрығына өзгеріс енгізу туралы
