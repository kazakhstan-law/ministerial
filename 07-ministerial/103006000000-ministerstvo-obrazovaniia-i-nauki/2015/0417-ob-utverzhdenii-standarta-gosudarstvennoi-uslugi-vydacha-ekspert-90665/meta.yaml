  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 17 апреля 2015 года № 214 «Об утверждении стандарта государственной услуги «Выдача экспертного заключения авторам и авторскому коллективу на учебные издания дошкольного, начального, основного среднего, общего среднего, технического и профессионального и высшего образования»
    kaz: «Мектепке дейінгі, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік және жоғары білім берудің оқулық басылымдары бойынша авторларға және авторлар ұжымына сараптамалық қорытынды беру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2015 жылғы 17 сәуірдегі № 214 бұйрығына өзгерістер енгізу туралы
