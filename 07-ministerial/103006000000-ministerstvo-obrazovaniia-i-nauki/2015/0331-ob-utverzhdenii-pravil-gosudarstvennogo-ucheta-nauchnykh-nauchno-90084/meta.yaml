    kaz: «Мемлекеттік бюджеттен қаржыландырылатын ғылыми, ғылыми-техникалық жобалар мен бағдарламаларды мемлекеттік есепке алу қағидаларын және олардың орындалуы жөніндегі есептерді бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2015 жылғы 31 наурыздағы № 149 бұйрығына өзгеріс енгізу туралы
