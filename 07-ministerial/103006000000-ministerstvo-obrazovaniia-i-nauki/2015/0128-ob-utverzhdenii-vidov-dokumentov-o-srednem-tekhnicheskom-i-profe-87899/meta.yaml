  title:
    rus: О внесении изменений и дополнений в приказ Министра образования и науки Республики Казахстан от 28 января 2015 года № 39 «Об утверждении видов документов о среднем, техническом и профессиональном, послесреднем образовании, формы документов о среднем, техническом и профессиональном, послесреднем образовании государственного образца и правила их учета и выдачи, основные требования к содержанию документов об образовании собственного образца и правила их учета и выдачи, а также форму справки, выдаваемой лицам, не завершившим образование в организациях образования»
    kaz: «Орта, техникалық және кәсіптік, орта білімнен кейінгі білім туралы құжаттардың түрлерін, орта, техникалық және кәсіптік, орта білімнен кейінгі білім туралы мемлекеттік үлгідегі құжаттардың нысандарын және оларды есепке алу мен беру қағидаларын, білім туралы өзіндік үлгідегі құжаттардың мазмұнына қойылатын негізгі талаптарды және оларды есепке алу мен беру қағидаларын, сондай-ақ білім беру ұйымдарында білім алуды аяқтамаған адамдарға берілетін анықтаманың нысанын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2015 жылғы 28 қаңтардағы № 39 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/187442/rus
