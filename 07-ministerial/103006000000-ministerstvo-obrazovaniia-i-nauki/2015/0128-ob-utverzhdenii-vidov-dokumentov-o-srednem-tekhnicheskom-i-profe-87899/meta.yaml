    kaz: «Білім туралы мемлекеттік үлгідегі құжаттардың түрлері мен нысандарын және оларды беру қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2015 жылғы 28 қаңтардағы № 39 бұйрығына өзгерістер енгізу туралы
