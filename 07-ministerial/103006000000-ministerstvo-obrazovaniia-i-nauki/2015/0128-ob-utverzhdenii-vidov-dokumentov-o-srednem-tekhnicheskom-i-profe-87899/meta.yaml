  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 28 января 2015 года № 39 "Об утверждении видов и форм документов об образовании государственного образца и Правил их выдачи"
    kaz: '"Мемлекеттік үлгідегі білім беру туралы құжаттардың түрлері мен нысандарын және оларды беру қағидаларын бекіту туралы" Қазақстан Республикасы Білім және ғылым Министрінің 2015 жылғы 28 қаңтардағы № 39 бұйрығына өзгерістер енгізу туралы'
