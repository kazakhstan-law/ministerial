act_code: '87899'
requisite: Приказ Министра образования и науки Республики Казахстан от 28 января 2015 года № 39. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 февраля 2015 года № 10348
title:
  rus: Об утверждении видов документов о среднем, техническом и профессиональном, послесреднем образовании, формы документов о среднем, техническом и профессиональном, послесреднем образовании государственного образца и правила их учета и выдачи, а также форму справки, выдаваемой лицам, не завершившим образование в организациях образования
  kaz: Орта, техникалық және кәсіптік, орта білімнен кейінгі білім туралы құжаттардың түрлерін, орта, техникалық және кәсіптік, орта білімнен кейінгі білім туралы мемлекеттік үлгідегі құжаттардың нысандарын және оларды есепке алу мен беру қағидаларын, сондай-ақ білім беру ұйымдарында білім алуды аяқтамаған адамдарға берілетін анықтаманың нысанын бекіту туралы
