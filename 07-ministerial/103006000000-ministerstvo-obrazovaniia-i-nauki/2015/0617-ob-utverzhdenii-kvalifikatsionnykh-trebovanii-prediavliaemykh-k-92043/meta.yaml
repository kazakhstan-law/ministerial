  title:
    rus: О внесении изменения в приказ и.о. Министра науки и высшего образования Республики Казахстан от 24 ноября 2022 года № 152 «О внесении изменений в приказ Министра образования и науки Республики Казахстан от 17 июня 2015 года № 391 «Об утверждении квалификационных требований, предъявляемых к образовательной деятельности, и перечня документов, подтверждающих соответствие им»
    kaz: «Білім беру қызметіне қойылатын біліктілік талаптарын және оларға сәйкестікті растайтын құжаттардың тізбесін бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2015 жылғы 17 маусымдағы № 391 бұйрығына өзгерістер енгізу туралы» Қазақстан Республикасы Ғылым және жоғары білім министрінің м.а. 2022 жылғы 24 қарашадағы № 152 бұйрығына өзгеріс енгізу туралы
