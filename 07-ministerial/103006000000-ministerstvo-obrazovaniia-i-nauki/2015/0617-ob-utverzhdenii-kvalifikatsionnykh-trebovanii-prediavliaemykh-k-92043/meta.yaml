  kaz: Жоғары және (немесе) жоғары білімнен кейінгі білім беру білім беру ұйымдарының білім беру қызметіне қойылатын біліктілік талаптарын және оларға сәйкестікті растайтын құжаттардың тізбесін бекіту туралы
