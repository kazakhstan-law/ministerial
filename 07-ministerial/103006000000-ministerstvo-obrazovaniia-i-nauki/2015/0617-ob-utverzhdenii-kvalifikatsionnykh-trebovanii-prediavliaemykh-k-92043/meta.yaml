act_code: '92043'
requisite: Приказ Министра образования и науки Республики Казахстан от 17 июня 2015 года № 391. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 июля 2015 года № 11716. Утратил силу приказом Министра науки и высшего образования Республики Казахстан от 5 января 2024 года № 4 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении квалификационных требований, предъявляемых к образовательной деятельности организаций, предоставляющих высшее и (или) послевузовское образование, и перечня документов, подтверждающих соответствие им
  kaz: Жоғары және (немесе) жоғары білімнен кейінгі білім беру білім беру ұйымдарының білім беру қызметіне қойылатын біліктілік талаптарын және оларға сәйкестікті растайтын құжаттардың тізбесін бекіту туралы
