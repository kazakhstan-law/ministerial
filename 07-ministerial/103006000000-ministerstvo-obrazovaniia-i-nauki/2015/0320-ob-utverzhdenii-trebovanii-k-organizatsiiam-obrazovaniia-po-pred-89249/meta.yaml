    kaz: «Қашықтықтан білім беру технологиялар бойынша оқу процесін ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2015 жылғы 20 наурыздағы № 137 бұйрығына өзгерістер енгізу туралы
