  title:
    rus: О внесении изменения в приказ Министра образования и науки Республики Казахстан от 20 марта 2015 года № 137 «Об утверждении требований к организациям образования по предоставлению дистанционного обучения и правил организации учебного процесса по дистанционному обучению и в форме онлайн-обучения по образовательным программам высшего и (или) послевузовского образования»
