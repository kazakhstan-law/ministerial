title:
  rus: Об утверждении требований к организациям образования по предоставлению дистанционного обучения и правил организации учебного процесса по дистанционному обучению и в форме онлайн-обучения по образовательным программам высшего и (или) послевузовского образования
  kaz: Білім беру ұйымдарына қашықтықтан оқытуды ұсыну жөніндегі талаптарды және қашықтықтан оқыту бойынша және жоғары және (немесе) жоғары оқу орнынан кейінгі білімнің білім беру бағдарламалары бойынша онлайн-оқыту нысанында оқу процесін ұйымдастыру қағидаларын бекіту туралы
