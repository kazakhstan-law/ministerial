  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 16 января  2015 года № 13 «Об утверждении Правил деятельности и состав комиссии, выдающей заключение о  возможности (невозможности) выдачи разрешения о передаче детей, являющихся гражданами  Республики Казахстан на усыновление»
    kaz: «Қазақстан Республикасының азаматтары болып табылатын балаларды асырап алуға беру туралы рұқсат беру мүмкіндігі (мүмкін еместігі) туралы қорытынды беретін комиссия қызметінің қағидаларын және құрамын бекіту туралы» Қазақстан Республикасы Білім және  ғылым министрінің 2015 жылғы 16 қаңтардағы № 13 бұйрығына өзгерістер енгізу туралы
