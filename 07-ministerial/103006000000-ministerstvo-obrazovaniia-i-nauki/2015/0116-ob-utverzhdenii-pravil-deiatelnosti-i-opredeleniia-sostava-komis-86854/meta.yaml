act_code: '86854'
requisite: Приказ от 16.01.2015 № 13, Министерство образования и науки Республики Казахстан. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2015 года № 10288
title:
  rus: Об утверждении Правил деятельности и определения состава комиссии, выдающей заключение о возможности (невозможности) выдачи разрешения о передаче детей, являющихся гражданами Республики Казахстан, на усыновление
  kaz: Қазақстан Республикасының азаматтары болып табылатын балаларды асырап алуға беру туралы рұқсат беру мүмкіндігі (мүмкін еместігі) туралы қорытынды беретін комиссияның қызметі мен құрамын айқындаудың қағидаларын бекіту туралы
