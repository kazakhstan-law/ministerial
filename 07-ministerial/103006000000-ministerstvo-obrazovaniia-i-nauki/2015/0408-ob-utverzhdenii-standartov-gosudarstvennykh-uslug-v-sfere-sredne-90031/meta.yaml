  title:
    rus: О внесении изменений и дополнений в приказ Министра образования и науки Республики Казахстан от 12 октября 2018 года № 564 «Об утверждении Типовых правил приема на обучение в организации образования, реализующие общеобразовательные учебные программы начального, основного среднего, общего среднего образования»
    kaz: «Бастауыш, негізгі орта және жалпы орта білімнің жалпы білім беретін оқу бағдарламаларын іске асыратын білім беру ұйымдарына оқуға қабылдаудың үлгілік қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2018 жылғы 12 қазандағы № 564 бұйрығына өзгерістер мен толықтырулар енгізу туралы
