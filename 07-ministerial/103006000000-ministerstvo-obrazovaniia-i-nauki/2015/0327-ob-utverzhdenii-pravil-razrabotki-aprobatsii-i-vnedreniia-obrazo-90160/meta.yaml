title:
  rus: Об утверждении Правил разработки, апробации и внедрения образовательных программ, реализуемых в режиме эксперимента в организациях дошкольного, среднего, технического и профессионального, послесреднего образования
  kaz: Мектепке дейінгі, орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарында эксперимент режимінде іске асырылатын білім беру бағдарламаларын әзірлеу, сынақтан өткізу және енгізу қағидаларын бекіту туралы
