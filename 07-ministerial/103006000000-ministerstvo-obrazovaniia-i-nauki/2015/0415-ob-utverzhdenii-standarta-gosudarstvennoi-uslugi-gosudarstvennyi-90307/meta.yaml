act_code: '90307'
requisite: Приказ Министра образования и науки Республики Казахстан от 15 апреля 2015 года № 207. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 мая 2015 года № 11105. Утратил силу приказом Министра образования и науки Республики Казахстан от 24 июня 2020 года № 262 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Государственный учет  научных, научно-технических проектов и программ, финансируемых изгосударственного бюджета,и отчетов по их выполнению»
  kaz: «Мемлекеттік бюджеттен қаржыландырылатын ғылыми, ғылыми-техникалық жобалар  мен бағдарламаларды және олардың орындалуы жөніндегі есептерді мемлекеттік есепке алу» мемлекеттік қызмет стандартын бекіту туралы
