  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 15 апреля 2015 года № 207 «Об утверждении стандарта государственной услуги «Государственный учет научных, научно-технических проектов и программ, финансируемых из государственного бюджета, и отчетов по их выполнению»
    kaz: «Мемлекеттік бюджеттен қаржыландырылатын ғылыми, ғылыми-техникалық жобалар мен бағдарламаларды және олардың орындалуы жөніндегі есептерді мемлекеттік есепке алу» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2015 жылғы 15 сәуірдегі № 207 бұйрығына өзгерістер енгізу туралы
