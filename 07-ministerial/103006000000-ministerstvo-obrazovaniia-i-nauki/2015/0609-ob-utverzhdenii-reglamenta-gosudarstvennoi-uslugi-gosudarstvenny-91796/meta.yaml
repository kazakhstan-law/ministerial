act_code: '91796'
requisite: Приказ Министра образования и науки Республики Казахстан от 9 июня 2015 года № 371. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 июля 2015 года № 11628. Утратил силу приказом Министра образования и науки Республики Казахстан от 24 июня 2020 года № 262 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Государственный учет научных, научно-технических проектов и программ, финансируемых из государственного бюджета, и отчетов по их выполнению»
  kaz: «Мемлекеттік бюджеттен қаржыландырылатын ғылыми, ғылыми-техникалық жобалар мен бағдарламаларды және олардың орындалуы жөніндегі есептерді мемлекеттік есепке алу» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
