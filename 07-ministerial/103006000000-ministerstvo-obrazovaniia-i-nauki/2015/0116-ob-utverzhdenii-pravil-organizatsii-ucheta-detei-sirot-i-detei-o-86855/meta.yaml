title:
  rus: Об утверждении Правил организации учета детей-сирот и детей, оставшихся без попечения родителей, и доступа к информации о них
  kaz: Жетім балаларды және ата-аналарының қамқорлығынсыз қалған балаларды есепке алуды ұйымдастыру және олар туралы ақпаратқа қол жеткізу қағидаларын бекіту туралы
