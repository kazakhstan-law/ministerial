  title:
    rus: О внесении изменений и дополнения в приказ Министра образования и науки Республики Казахстан от 16 января 2015 года № 16 "Об утверждении Правил организации учета детей-сирот, детей, оставшихся без попечения родителей и подлежащих усыновлению, и доступа к информации о них"
