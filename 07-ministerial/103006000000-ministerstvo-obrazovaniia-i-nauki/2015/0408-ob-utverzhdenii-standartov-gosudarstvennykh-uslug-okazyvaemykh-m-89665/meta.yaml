act_code: '89665'
requisite: Приказ Министра образования и науки Республики Казахстан от 8 апреля 2015 года № 173. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 мая 2015 года № 11058. Утратил силу приказом Министра образования и науки Республики Казахстан от 21 мая 2020 года № 213 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандартов государственных услуг оказываемых Министерством образования и науки Республики Казахстан, местными исполнительными органами на замещение руководителей государственных учреждений среднего образования
  kaz: Қазақстан Республикасы Білім және ғылым министрлігі, жергілікті атқарушы органдар көрсететін мемлекеттік орта білім беру мекемелерінің басшылары лауазымдарына орналасу конкурстарына қатысу үшін құжаттарды қабылдау бойынша мемлекеттік қызметтер стандарттарын бекіту туралы
