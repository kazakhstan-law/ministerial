act_code: '94063'
requisite: Приказ от 10.09.2015 № 557, Министерство образования и науки Республики Казахстан. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 сентября 2015 года № 12113
title:
  rus: Об утверждении минимального социального стандарта "Обеспечение защиты прав и интересов детей-сирот, детей, оставшихся без попечения родителей, переданных на воспитание в семью (усыновление, опеку или попечительство, патронат)"
  kaz: '"Жетім балалардың, ата-анасының қамқорлығынсыз қалған, отбасына тәрбиелеуге (асырап алуға, қорғаншылыққа немесе қамқоршылыққа, патронатқа) берілген балалардың құқықтары мен мүдделерін қорғауды қамтамасыз ету" ең төмен әлеуметтік стандартын бекіту туралы'
