  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 10 сентября 2015 года № 557 «Об утверждении минимального социального стандарта «Обеспечение защиты прав и интересов детей-сирот, детей, оставшихся без попечения родителей, переданных на воспитание в семью (усыновление, опеку или попечительство, патронат)»
    kaz: «Жетім балалардың, ата-анасының қамқорлығынсыз қалған, отбасына тәрбиелеуге (асырап алуға, қорғаншылыққа немесе қамқоршылыққа, патронатқа) берілген балалардың құқықтары мен мүдделерін қорғауды қамтамасыз ету» ең төмен әлеуметтік стандартын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2015 жылғы 10 қыркүйектегі № 557 бұйрығына өзгерістер енгізу туралы
