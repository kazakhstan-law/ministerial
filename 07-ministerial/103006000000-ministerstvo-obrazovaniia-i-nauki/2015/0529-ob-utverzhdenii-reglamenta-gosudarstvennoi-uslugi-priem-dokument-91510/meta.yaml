requisite: Приказ и.о. Министра образования и науки Республики Казахстан от 29 мая 2015 года № 340. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 июля 2015 года № 11516. Утратил силу приказом Министра образования и науки Республики Казахстан от 21 мая 2020 года № 213 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги "Прием документов для участия в конкурсе на замещение руководителей государственных учреждений среднего образования республиканского значения"
  kaz: '"Республикалық маңызы бар мемлекеттік орта білім беру мекемелерінің басшылары лауазымдарына орналасу конкурсына қатысу үшін құжаттар қабылдау" мемлекеттік көрсетілетін қызмет регламентін бекіту туралы'
