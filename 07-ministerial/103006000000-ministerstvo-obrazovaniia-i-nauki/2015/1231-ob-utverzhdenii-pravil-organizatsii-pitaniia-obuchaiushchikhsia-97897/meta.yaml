  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра образования и науки Республики Казахстан от 31 декабря 2015 года № 717 «Об утверждении Правил организации питания обучающихся в организациях среднего образования и приобретения товаров, связанных с обеспечением питания детей, воспитывающихся и обучающихся в дошкольных организациях образования, организациях образования для детей-сирот и детей, оставшихся без попечения родителей»
    kaz: «Орта білім беру ұйымдарында білім алушыларды тамақтандыруды ұйымдастыру және мектепке дейінгі білім беру ұйымдарында, жетім балалар мен ата-аналарының қамқорлығынсыз қалған балаларға білім беру ұйымдарында тәрбиеленуші және білім алушы балаларды тамақтандыруды қамтамасыз етуге байланысты тауарлар сатып алу қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің міндетін атқарушының 2015 жылғы 31 желтоқсандағы № 717 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/110969/rus
