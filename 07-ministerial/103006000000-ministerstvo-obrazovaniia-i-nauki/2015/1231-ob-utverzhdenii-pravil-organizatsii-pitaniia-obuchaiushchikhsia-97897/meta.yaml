act_code: '97897'
requisite: Приказ и.о. Министра образования и науки Республики Казахстан от 31 декабря 2015 года № 717. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2015 года № 12788. Утратил силу приказом Министра образования и науки Республики Казахстан от 31 октября 2018 года № 598 (вводится в действие по истечении десяти календарных дней после дня первого официального опубликования)
title:
  rus: Об утверждении Правил организации питания обучающихся в организациях среднего образования и приобретения товаров, связанных с обеспечением питания детей, воспитывающихся и обучающихся в дошкольных организациях образования, организациях образования для детей-сирот и детей, оставшихся без попечения родителей
  kaz: Орта білім беру ұйымдарында оқитындарды тамақтандыруды ұйымдастыру және мектепке дейінгі білім беру ұйымдарында, жетім балалар мен ата-аналарының қамқорлығынсыз қалған балаларға арналған білім беру ұйымдарында тәрбие алатын және оқитын балаларды тамақтандыруды қамтамасыз етуге байланысты тауарлар сатып алу қағидаларын бекіту туралытамақтандыруды қамтамасыз етуге байланысты тауарларды сатып алу қағидаларын бекіту туралы
