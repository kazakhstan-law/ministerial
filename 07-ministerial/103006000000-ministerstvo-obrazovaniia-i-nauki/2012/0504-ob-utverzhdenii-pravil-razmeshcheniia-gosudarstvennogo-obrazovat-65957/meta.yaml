title:
  rus: Об утверждении Правил размещения государственного образовательного заказа на дошкольное воспитание и обучение, подготовку специалистов с техническим и профессиональным, послесредним, высшим и послевузовским образованием, а также на подготовительные отделения высших учебных заведений
  kaz: Мектепке дейінгі тәрбие мен оқытуға, техникалық және кәсiптiк, орта бiлiмнен кейiнгi, жоғары және жоғары оқу орнынан кейiнгi бiлiмi бар мамандарды даярлауға, сондай-ақ жоғары оқу орындарының дайындық бөлімдеріне мемлекеттiк бiлiм беру тапсырысын орналастыру қағидаларын бекіту туралы
