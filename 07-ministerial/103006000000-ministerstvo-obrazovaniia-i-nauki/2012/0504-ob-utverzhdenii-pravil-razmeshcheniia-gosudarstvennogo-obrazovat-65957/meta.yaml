  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра образования и науки Республики Казахстан от 4 мая 2012 года № 198 "Об утверждении Правил размещения государственного образовательного заказа на дошкольное воспитание и обучение, подготовку специалистов с техническим и профессиональным, послесредним, высшим и послевузовским образованием, а также на подготовительные отделения высших учебных заведений"
    kaz: '"Мектепке дейінгі тәрбие мен оқытуға, техникалық және кәсiптiк, орта бiлiмнен кейiнгi, жоғары және жоғары оқу орнынан кейiнгi бiлiмi бар мамандарды даярлауға, сондай-ақ жоғары оқу орындарының дайындық бөлімдеріне мемлекеттiк бiлiм беру тапсырысын орналастыру қағидаларын бекіту туралы" Қазақстан Республикасы Білім және ғылым Министрінің міндетін атқарушының 2012 жылғы 4 мамырдағы № 198 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/82979/rus
