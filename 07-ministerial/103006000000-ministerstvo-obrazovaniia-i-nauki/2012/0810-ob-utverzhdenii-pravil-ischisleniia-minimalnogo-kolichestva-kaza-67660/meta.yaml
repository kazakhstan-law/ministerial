title:
  rus: Об утверждении Правил исчисления минимального количества казахстанских кадров, в процентах от общей численности персонала, подлежащих обучению и предоставления компетентному органу для включения в условия конкурса на предоставление права недропользования минимального количества казахстанских кадров
  kaz: Оқытуға жататын персоналдың жалпы санына пайызбен алғандағы қазақстандық кадрлардың ең аз санын есептеу және құзыреттi органға жер қойнауын пайдалану құқығын беруге арналған конкурс талаптарына қосу үшiн қазақстандық кадрлардың ең аз санын табыс ету қағидаларын бекіту туралы
