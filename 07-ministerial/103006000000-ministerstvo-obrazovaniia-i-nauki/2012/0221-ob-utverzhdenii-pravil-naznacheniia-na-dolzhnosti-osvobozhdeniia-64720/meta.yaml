    kaz: «Мемлекеттік орта білім беру мекемелерінің басшыларын конкурстық тағайындау қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2012 жылғы 21 ақпандағы № 57 бұйрығына өзгерістер енгізу туралы»
