caused_by:
  code: '160597'
  requisite: Совместный приказ Министра образования и науки Республики Казахстан от 19 ноября 2021 года № 568 и Министра труда и социальной защиты населения Республики Казахстан от 22 ноября 2021 года № 432. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 ноября 2021 года № 25349. Утратил силу совместным приказом Министра просвещения Республики Казахстан от 31 марта 2025 года № 57 и Министра труда и социальной защиты населения Республики Казахстан от 31 марта 2025 года № 96 (вводится в действие по истечении десяти календарных дней после дня их первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 21 февраля 2012 года № 57 «Об утверждении Правил конкурсного замещения руководителей государственных организаций среднего, технического и профессионального, послесреднего образования и конкурсного назначения на должность руководителей государственных организаций образования, реализующих общеобразовательные учебные программы дошкольного, среднего образования и образовательные программы дополнительного образования»
    kaz: «Мемлекеттік орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарының басшыларын конкурстық орналастыру және мемлекеттік мектепке дейінгі, орта, техникалық және кәсіптік, орта білімнен кейінгі және қосымша білім беру ұйымының басшысы лауазымына конкурстық тағайындау қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2012 жылғы 21 ақпандағы № 57 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/160597/rus
