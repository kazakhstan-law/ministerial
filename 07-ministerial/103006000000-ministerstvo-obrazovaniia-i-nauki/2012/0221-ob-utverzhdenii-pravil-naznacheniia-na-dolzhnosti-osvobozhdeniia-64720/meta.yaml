  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 21 февраля 2012 года № 57 «Об утверждении Правил конкурсного замещения руководителей государственных организаций среднего, технического и профессионального, послесреднего образования и конкурсного назначения на должность руководителей государственных организаций образования, реализующих общеобразовательные учебные программы дошкольного, среднего образования и образовательные программы дополнительного образования»
    kaz: «Мемлекеттік орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарының басшыларын конкурстық орналастыру және мектепке дейінгі, орта білімнің жалпы білім беретін оқу бағдарламаларын және қосымша білімнің білім беру бағдарламаларын іске асыратын мемлекеттік білім беру ұйымының басшысы лауазымына конкурстық тағайындау қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2012 жылғы 21 ақпандағы № 57 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/143060/rus
