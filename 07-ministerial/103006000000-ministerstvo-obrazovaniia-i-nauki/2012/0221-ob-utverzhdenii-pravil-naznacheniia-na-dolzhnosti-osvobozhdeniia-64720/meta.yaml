    kaz: «Мемлекеттік орта білім беру ұйымдарының басшыларын конкурстық тағайындау қағидасын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2012 жылғы 21 ақпандағы № 57 бұйрығына өзгеріс енгізу туралы
