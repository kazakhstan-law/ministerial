act_code: '64720'
requisite: Приказ Министра образования и науки Республики Казахстан от 21 февраля 2012 года № 57. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 марта 2012 года № 7495. Утратил силу совместным приказом Министра просвещения Республики Казахстан от 31 марта 2025 года № 57 и Министра труда и социальной защиты населения Республики Казахстан от 31 марта 2025 года № 96 (вводится в действие по истечении десяти календарных дней после дня их первого официального опубликования)
title:
  rus: Об утверждении правил назначения на должности, освобождения от должностей первых руководителей и педагогов государственных организаций образования
  kaz: Мемлекеттік білім беру ұйымдарының бірінші басшылары мен педагогтерін лауазымға тағайындау, лауазымнан босату қағидаларын бекіту туралы
