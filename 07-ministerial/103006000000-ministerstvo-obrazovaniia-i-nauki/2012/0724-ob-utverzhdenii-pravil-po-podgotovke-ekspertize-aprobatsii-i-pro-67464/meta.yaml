  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 24 июля 2012 года № 344 «Об утверждении Правил организации работы по подготовке, экспертизе, апробации и проведению мониторинга, изданию учебников, учебно-методических комплексов и учебно-методических пособий»
    kaz: «Оқулықтарды, оқу-әдістемелік кешендері мен оқу-әдістемелік құралдарын әзірлеу, оларға сараптама, сынақ өткізу және мониторинг жүргізу, оларды басып шығару жөніндегі жұмысты ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2012 жылғы 24 шілдедегі № 344 бұйрығына өзгерістер енгізу туралы
