title:
  rus: Об утверждении Правил по подготовке, экспертизе, апробации и проведению мониторинга, изданию учебников для организаций среднего образования и учебно-методических комплексов для дошкольных организаций, организаций среднего образования
  kaz: Орта білім беру ұйымдарына арналған оқулықтарды және мектепке дейінгі ұйымдарға, орта білім беру ұйымдарына арналған оқу-әдістемелік кешендерді дайындау, сараптау, сынақтан өткізу және мониторинг жүргізу, басып шығару жөніндегі қағидаларды бекіту туралы
