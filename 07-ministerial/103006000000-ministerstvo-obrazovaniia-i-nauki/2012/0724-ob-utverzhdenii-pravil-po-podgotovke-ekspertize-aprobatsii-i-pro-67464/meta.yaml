  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 24 июля 2012 года № 344 «Об утверждении Правил по подготовке, экспертизе, апробации и проведению мониторинга, изданию учебников для организаций среднего образования и учебно-методических комплексов для дошкольных организаций, организаций среднего образования»
    kaz: «Орта білім беру ұйымдарына арналған оқулықтарды және мектепке дейінгі ұйымдарға, орта білім беру ұйымдарына арналған оқу-әдістемелік кешендерді дайындау, сараптау, сынақтан өткізу және мониторинг жүргізу, басып шығару жөніндегі қағидаларды бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2012 жылғы 24 шілдедегі № 344 бұйрығында өзгерістер енгізу туралы
