  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 7 марта 2012 года № 97 "Об утверждении норм оснащения оборудованием и мебелью организаций дошкольного, начального, основного среднего, общего среднего, технического и профессионального образования"
    kaz: '"Мектепке дейінгі, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік білім беру ұйымдарын жабдықтармен және жиһазбен жарақтандыру нормаларын бекіту туралы" Қазақстан Республикасы Білім және ғылым Министрінің 2012 жылғы 7 наурыздағы № 97 бұйрығына өзгерістер енгізу туралы'
