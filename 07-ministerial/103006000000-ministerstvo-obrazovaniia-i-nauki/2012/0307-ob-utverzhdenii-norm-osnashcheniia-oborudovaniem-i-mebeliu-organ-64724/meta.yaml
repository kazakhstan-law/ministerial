  title:
    rus: О внесении изменения в приказ Министра образования и науки Республики Казахстан от 7 марта 2012 года № 97 «Об утверждении норм оснащения оборудованием и мебелью организаций технического и профессионального образования» и  о внесении изменений в приказ Министра образования и науки Республики Казахстан от 22 января 2016 года № 70 «Об утверждении норм оснащения оборудованием и мебелью организаций дошкольного, среднего образования, а также специальных организаций образования»
    kaz: «Техникалық және кәсіптік білім беру ұйымдарын жабдықтармен және жиһазбен жарақтандыру нормаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2012 жылғы 7 наурыздағы № 97 бұйрығына өзгеріс енгізу туралы және «Мектепке дейінгі, орта білім беру ұйымдарын, сондай-ақ арнайы білім беру ұйымдарын жабдықтармен және жиһазбен жарақтандыру нормаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2016 жылғы  22 қаңтардағы № 70 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/183643/rus
