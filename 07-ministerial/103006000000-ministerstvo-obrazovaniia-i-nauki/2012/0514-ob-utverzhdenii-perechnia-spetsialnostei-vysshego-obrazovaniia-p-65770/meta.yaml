  title:
    rus: О внесении изменений в приказ и.о. Министра образования и науки Республики Казахстан oт 14 мая 2012 года № 211 "Об утверждении перечня специальностей бакалавриата и высшего специального образования, по которым для лиц окончивших сельские организации образования, установлена квота приема в высшие учебные заведения Республики Казахстан, и перечня специальностей с указанием предметов по выбору и профильных предметов единого национального тестирования и комплексного тестирования"
    kaz: '"Ауылдық білім беру ұйымдарын бітірген тұлғалар үшін Қазақстан Республикасы жоғары оқу орындарына қабылдау квотасы белгіленген жоғары арнайы білім беру және бакалавриат мамандықтарының тізбесiн және ұлттық бірыңғай тестілеу және кешенді тестілеу жүргізілетін таңдау пәндері мен бейінді пәндер көрсетілген мамандықтар тізбесін бекіту туралы" Қазақстан Республикасы Білім және ғылым министрiнiң міндетін атқарушының 2012 жылғы 14 мамырдағы № 211 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/72352/rus
