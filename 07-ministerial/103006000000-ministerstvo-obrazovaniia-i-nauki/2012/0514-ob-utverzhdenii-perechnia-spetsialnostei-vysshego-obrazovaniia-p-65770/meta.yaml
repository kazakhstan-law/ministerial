  code: '91144'
  requisite: Приказ от 05.06.2015 № 362, Министерство образования и науки Республики Казахстан. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 июня 2015 года № 11423. Утратил силу приказом Министра образования и науки Республики Казахстан от 13 сентября 2017 года № 460 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в приказы исполняющего обязанности Министра образования и науки Республики Казахстан от 14 мая 2012 года № 211 "Об утверждении перечня специальностей бакалавриата и высшего специального образования, по которым для лиц, окончивших сельские организации образования, установлена квота приема в высшие учебные заведения Республики Казахстан, и перечня специальностей с указанием предметов по выбору и профильных предметов единого национального тестирования и комплексного тестирования» и Министра образования и науки Республики Казахстан от 25 апреля 2013 года № 153 «Об утверждении перечня специальностей, требующих специальной или творческой подготовки, и Правил проведения специальных или творческих экзаменов»
    kaz: '"Ауылдық білім беру ұйымдарын бітірген тұлғалар үшін Қазақстан Республикасы жоғары оқу орындарына қабылдау квотасы белгіленген жоғары арнайы білім беру және бакалавриат мамандықтарының тізбесiн және ұлттық бірыңғай тестілеу және кешенді тестілеу жүргізілетін таңдау пәндері мен бейінді пәндер көрсетілген мамандықтар тізбесін бекіту туралы" Қазақстан Республикасы Білім және ғылым министрінің міндетін атқарушының 2012 жылғы 14 мамырдағы № 211 және "Арнайы немесе шығармашылық даярлауды талап ететін мамандықтардың тізбесін және арнайы немесе шығармашылық емтихандар өткізу қағидаларын бекіту туралы" Қазақстан Республикасы Білім және ғылым министрінің 2013 жылғы 25 сәуірдегі № 153 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/91144/rus
