  title:
    rus: О внесении изменения в приказ Министра образования и науки Республики Казахстан от 13 марта 2012 года № 99 «Об утверждении Правил организации и проведения Президентской олимпиады по предметам естественно-математического цикла, республиканских олимпиад и конкурсов научных проектов по общеобразовательным предметам, республиканских конкурсов исполнителей и конкурсов профессионального мастерства»
    kaz: «Жаратылыстану-математика циклы пәндері бойынша Президенттік олимпиаданы, жалпы білім беретін пәндер бойынша республикалық олимпиадалар мен ғылыми жобалар конкурстарын, орындаушылардың республикалық конкурстары мен кәсіби шеберлік конкурстарын ұйымдастыру және өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2012 жылғы 13 наурыздағы № 99 бұйрығына өзгеріс енгізу туралы
