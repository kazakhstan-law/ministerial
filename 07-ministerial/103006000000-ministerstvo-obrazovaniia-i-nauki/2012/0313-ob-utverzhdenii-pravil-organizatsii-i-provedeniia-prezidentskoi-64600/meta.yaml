title:
  rus: Об утверждении Правил организации и проведения Президентской олимпиады по предметам естественно-математического цикла, республиканских олимпиад и конкурсов научных проектов по общеобразовательным предметам, республиканских конкурсов исполнителей и конкурсов профессионального мастерства
  kaz: Жаратылыстану-математика циклы пәндері бойынша Президенттік олимпиаданы, жалпы білім беретін пәндер бойынша республикалық олимпиадалар мен ғылыми жобалар конкурстарын, орындаушылардың республикалық конкурстары мен кәсіби шеберлік конкурстарын ұйымдастыру және өткізу қағидаларын бекіту туралы
