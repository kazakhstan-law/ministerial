  kaz: Орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдары үшін білім алушылардың үлгеріміне ағымдағы бақылауды, оларды аралық және қорытынды аттестаттауды өткізудің үлгілік қағидаларын бекіту туралы
