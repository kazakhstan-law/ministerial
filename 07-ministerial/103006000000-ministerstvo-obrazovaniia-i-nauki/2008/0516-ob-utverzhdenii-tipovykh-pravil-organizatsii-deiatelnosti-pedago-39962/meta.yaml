  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра образования и науки Республики Казахстан от 16 мая 2008 года № 272 "Об утверждении Типовых правил деятельности педагогического совета и порядок его избрания в организациях дошкольного воспитания и обучения, начального, основного среднего, среднего общего и дополнительного образования"
    kaz: '"Мектепке дейінгі тәрбие мен оқыту, бастауыш, негізгі орта, жалпы орта және қосымша білім беру ұйымдарында педагогикалық кеңес қызметінің және оны сайлау тәртібінің үлгі ережелерін бекіту туралы" Қазақстан Республикасы Білім және ғылым министрінің міндетін атқарушының 2008 жылғы 16 мамырдағы № 272 бұйрығына өзгерістер енгізу туралы'
