  title:
    rus: О внесении изменения и дополнения в приказ исполняющего обязанности Министра образования и науки Республики Казахстан от 14 сентября 2018 года № 465 «Об утверждении Методики определения размера государственного заказа на обеспечение студентов, магистрантов и докторантов местами в общежитиях»
    kaz: «Студенттерді, магистранттарды және докторанттарды жатақханалардағы орындармен қамтамасыз етуге мемлекеттік тапсырыстың мөлшерін анықтау әдістемесін бекіту туралы» Қазақстан Республикасы Білім және ғылым министрі міндетін атқарушының 2018 жылғы 14 қыркүйектегі № 465 бұйрығына өзгеріс пен толықтыру енгізу туралы
