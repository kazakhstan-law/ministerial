  title:
    rus: О внесении дополнения в приказ исполняющего обязанности Министра образования и науки Республики Казахстан от 14 сентября 2018 года № 465 «Об утверждении Методики определения размера государственного заказа на обеспечение студентов, магистрантов и докторантов местами в общежитиях»
    kaz: «Студенттерді, магистранттарды және докторанттарды жатақханалардағы орындармен қамтамасыз етуге мемлекеттік тапсырыстың мөлшерін анықтау әдістемесін бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің м.а. 2018 жылғы 14 қыркүйектегі № 465 бұйрығына толықтыру енгізу туралы
