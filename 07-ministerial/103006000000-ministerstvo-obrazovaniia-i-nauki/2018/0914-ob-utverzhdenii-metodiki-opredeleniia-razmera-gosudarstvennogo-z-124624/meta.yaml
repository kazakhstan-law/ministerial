title:
  rus: Об утверждении Методики определения размера государственного заказа на обеспечение студентов организаций технического и профессионального, послесреднего образования местами в общежитиях
  kaz: Техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарының студенттерін жатақханалардағы орындармен қамтамасыз етуге мемлекеттік тапсырыстың мөлшерін айқындау әдістемесін бекіту туралы
