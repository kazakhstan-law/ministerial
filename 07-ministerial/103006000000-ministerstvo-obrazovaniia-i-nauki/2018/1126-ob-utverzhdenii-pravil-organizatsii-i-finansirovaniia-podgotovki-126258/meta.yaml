  title:
    rus: О внесении изменений и дополнения в приказ Министра образования и науки Республики Казахстан от 26 ноября 2018 года № 646 «Об утверждении Правил организации и финансирования подготовки кадров с техническим и профессиональным образованием, краткосрочного профессионального обучения, по проекту «Мәңгілік ел жастары – индустрияға!» («Серпін»), переподготовки трудовых ресурсов и сокращаемых работников, подготовки квалифицированных кадров по востребованным специальностям на рынке труда в рамках проекта «Жас маман» по принципу «100/200», а также обучения основам предпринимательства в организациях технического и профессионального, послесреднего образования, высшего и (или) послевузовского образования, утверждаемых уполномоченным органом в области образования»
    kaz: «Техникалық және кәсіптік білімі бар кадрларды даярлауды, қысқа мерзімді кәсіптік оқытуды, «Мәңгілік ел жастары – индустрияға!» («Серпін») жобасы бойынша кадрлар даярлауды, еңбек ресурстарын және қысқартылатын жұмыскерлерді қайта даярлауды, «100/200» қағидаты бойынша «Жас маман» жобасы шеңберінде еңбек нарығында сұранысқа ие білікті кадрлар даярлау, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі, жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарында кәсіпкерлік негіздеріне оқытуды ұйымдастыру және қаржыландыру қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2018 жылғы 26 қарашадағы № 646 бұйрығына өзгерістер мен толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/147791/rus
