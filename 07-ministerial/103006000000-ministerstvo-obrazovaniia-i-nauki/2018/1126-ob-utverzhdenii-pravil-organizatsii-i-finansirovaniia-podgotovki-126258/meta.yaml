act_code: '126258'
requisite: Приказ Министра образования и науки Республики Казахстан от 26 ноября 2018 года № 646. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 ноября 2018 года № 17800. Утратил силу приказом Министра просвещения Республики Казахстан от 24 сентября 2025 года № 228 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и финансирования подготовки кадров с техническим и профессиональным образованием, краткосрочного профессионального обучения, по проекту «Мәңгілік ел жастары–индустрияға!» («Серпін»), переподготовки трудовых ресурсов и сокращаемых работников, подготовки квалифицированных кадров по востребованным специальностям на рынке труда в рамках проекта «Жас маман» по принципу «100/200», а также обучения основам предпринимательства в организациях технического и профессионального, послесреднего образования, высшего и (или) послевузовского образования
  kaz: Техникалық және кәсіптік білімі бар кадрларды даярлауды, «Мәңгілік ел жастары – индустрияға!» («Серпін») жобасы бойынша қысқа мерзімді кәсіптік оқытуды, еңбек ресурстарын және қысқартылатын жұмыскерлерді қайта даярлауды, «100/200» қағидаты бойынша «Жас маман» жобасы шеңберінде еңбек нарығында сұранысқа ие білікті кадрлар даярлауды, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі, жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарында кәсіпкерлік негіздеріне оқытуды ұйымдастыру және қаржыландыру қағидаларын бекіту туралы
