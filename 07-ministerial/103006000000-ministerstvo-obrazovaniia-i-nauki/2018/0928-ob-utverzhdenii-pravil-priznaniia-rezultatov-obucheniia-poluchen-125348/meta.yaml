  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 28 сентября 2018 года № 508 «Об утверждении Правил признания результатов обучения, полученных взрослыми через неформальное образование, предоставляемое организациями, внесенными в перечень признанных организаций, предоставляющих неформальное образование»
    kaz: «Формальды емес білім беретін, танылған ұйымдардың тізбесіне енгізілген ұйымдар беретін формальды емес білім арқылы ересектер алған оқу нәтижелерін тану қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2018 жылғы 28 қыркүйектегі № 508 бұйрығына өзгерістер енгізу туралы
