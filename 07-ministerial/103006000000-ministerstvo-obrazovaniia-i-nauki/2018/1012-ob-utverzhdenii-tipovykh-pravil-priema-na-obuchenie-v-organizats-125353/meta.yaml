act_code: '125353'
requisite: Приказ Министра образования и науки Республики Казахстан от 12 октября 2018 года № 564. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 октября 2018 года № 17553
title:
  rus: Об утверждении Типовых правил приема на обучение в организации образования, реализующие общеобразовательные учебные программы начального, основного среднего и общего среднего образования, за исключением республиканских, областных, городов республиканского значения и столицы специализированных школ-интернатов-колледжей олимпийского резерва и областных, городов республиканского значения и столицы школ-интернатов для одаренных в спорте детей
  kaz: Олимпиадалық резервтің республикалық, облыстық, республикалық маңызы бар қалалардың, астананың мамандандырылған мектеп-интернат-колледждерін және спорттағы дарынды балаларға арналған облыстық, республикалық маңызы бар қалалардың, астананың мектеп-интернаттарын қоспағанда, бастауыш, негізгі орта және жалпы орта білімнің жалпы білім беретін оқу бағдарламаларын іске асыратын білім беру ұйымдарына оқуға қабылдаудың үлгілік қағидаларын бекіту туралы
