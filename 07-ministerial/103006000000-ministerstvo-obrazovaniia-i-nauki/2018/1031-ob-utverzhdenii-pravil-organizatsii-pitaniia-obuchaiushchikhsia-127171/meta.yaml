  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 31 октября 2018 года № 598 «Об утверждении Правил организации питания обучающихся в государственных организациях среднего, технического и профессионального, послесреднего образования, внешкольных организациях дополнительного образования, а также приобретения товаров, связанных с обеспечением питания детей, воспитывающихся и обучающихся в государственных дошкольных организациях, организациях образования для детей-сирот и детей, оставшихся без попечения родителей»
    kaz: «Мемлекеттік орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарында, қосымша білім беретін мектептен тыс ұйымдарда білім алушыларды тамақтандыруды ұйымдастыру, сондай-ақ мемлекеттік мектепке дейінгі ұйымдарда, жетім балалар мен ата-анасының қамқорлығынсыз қалған балаларға арналған білім беру ұйымдарында тәрбиеленетін және білім алатын балаларды тамақтандыруды қамтамасыз етуге байланысты тауарларды сатып алу қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2018 жылғы 31 қазандағы № 598 бұйрығына өзгерістер енгізу туралы
