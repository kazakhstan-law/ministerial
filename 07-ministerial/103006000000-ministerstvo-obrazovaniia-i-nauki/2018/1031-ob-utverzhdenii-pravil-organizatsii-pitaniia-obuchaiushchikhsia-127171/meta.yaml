  title:
    rus: О внесении изменения в приказ Министра образования и науки Республики Казахстан от 31 октября 2018 года № 598 «Об утверждении Правил организации питания обучающихся в организациях среднего образования, а также приобретения товаров, связанных с обеспечением питания детей, воспитывающихся и обучающихся в дошкольных организациях, организациях образования для детей-сирот и детей, оставшихся без попечения родителей»
    kaz: «Орта білім беру ұйымдарында білім алушыларды тамақтандыруды ұйымдастыру, сондай-ақ мектепке дейінгі ұйымдарда, жетім балалар мен ата-анасының қамқорлығынсыз қалған балаларға арналған білім беру ұйымдарында тәрбиеленетін және білім алатын балаларды тамақтандыруды қамтамасыз етумен байланысты тауарларды сатып алу қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2018 жылғы 31 қазандағы № 598 бұйрығына өзгеріс енгізу туралы
