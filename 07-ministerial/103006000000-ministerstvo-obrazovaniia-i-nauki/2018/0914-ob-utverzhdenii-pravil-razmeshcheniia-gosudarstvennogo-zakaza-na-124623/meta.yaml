title:
  rus: Об утверждении Правил размещения государственного заказа на обеспечение студентов технического и профессионального, послесреднего образования местами в общежитиях
  kaz: Техникалық және кәсіптік, орта білімнен кейінгі білім беру студенттерін жатақханалардағы орындармен қамтамасыз етуге мемлекеттік тапсырысты орналастыру қағидаларын бекіту туралы
