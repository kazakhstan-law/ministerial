  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 31 октября 2018 года № 606 «Об утверждении среднего соотношения количества обучающихся к преподавателям для расчета общей численности профессорско-преподавательского состава организаций высшего и (или) послевузовского образования, за исключением военных, специальных учебных заведений, организаций образования в области культуры»
    kaz: «Әскери, арнаулы оқу орындарын, мәдениет саласындағы білім беру ұйымдарын қоспағанда, жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдары профессор-оқытушылар құрамының жалпы санын есептеу үшін білім алушылар санының оқытушыларға орташа арақатынасын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2018 жылғы 31 қазандағы № 606 бұйрығына өзгерістер енгізу туралы
