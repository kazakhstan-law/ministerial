requisite: Приказ Министра образования и науки Республики Казахстан от 31 октября 2018 года № 606. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 ноября 2018 года № 17670
title:
  rus: Об утверждении среднего соотношения количества обучающихся к преподавателям для расчета общей численности профессорско-преподавательского состава организаций высшего и (или) послевузовского образования, за исключением Академии правосудия, военных, специальных учебных заведений, организаций образования в области культуры
  kaz: Сот төрелігі академиясын, әскери, арнаулы оқу орындарын, мәдениет саласындағы білім беру ұйымдарын қоспағанда, жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдары профессор-оқытушылар құрамының жалпы санын есептеу үшін білім алушылар санының оқытушыларға орташа арақатынасын бекіту туралы
