act_code: '126132'
requisite: Приказ Министра образования и науки Республики Казахстан от 31 октября 2018 года № 599. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 ноября 2018 года № 17766
title:
  rus: Об утверждении Правил формирования перечня недобросовестных поставщиков (потенциальных поставщиков) услуг и (или) товаров по организации питания обучающихся в государственных организациях среднего, технического и профессионального, послесреднего образования, внешкольных организациях дополнительного образования, а также товаров, связанных с обеспечением питания детей, воспитывающихся и обучающихся в государственных дошкольных организациях, организациях образования для детей-сирот и детей, оставшихся без попечения родителей
  kaz: Мемлекеттік орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарында, қосымша білім беретін мектептен тыс ұйымдарда білім алушыларды тамақтандыруды ұйымдастыру бойынша көрсетілетін қызметтерді және (немесе) тауарларды, сондай-ақ мемлекеттік мектепке дейінгі ұйымдарда, жетім балалар мен ата-анасының қамқорлығынсыз қалған балаларға арналған білім беру ұйымдарында тәрбиеленетін және білім алатын балаларды тамақтандыруды қамтамасыз етуге байланысты тауарларды жосықсыз берушілердің (әлеуетті өнім берушілердің) тізбесін қалыптастыру қағидаларын бекіту туралы
