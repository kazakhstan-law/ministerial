  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 31 октября 2018 года № 599 «Об утверждении Правил формирования перечня недобросовестных поставщиков (потенциальных поставщиков) услуг, товаров по организации питания обучающихся в государственных организациях среднего образования, внешкольных организациях дополнительного образования, а также товаров, связанных с обеспечением питания детей, воспитывающихся и обучающихся в государственных дошкольных организациях, организациях образования для детей-сирот и детей, оставшихся без попечения родителей, организациях технического и профессионального, послесреднего образования»
    kaz: Мемлекеттік орта білім беру ұйымдарында, мектептен тыс қосымша білім беру ұйымдарында білім алушыларды тамақтандыруды ұйымдастыру бойынша көрсетілетін қызметтерді, тауарларды, сондай-ақ мемлекеттік мектепке дейінгі ұйымдарда, жетім балалар мен ата-анасының қамқорлығынсыз қалған балаларға арналған білім беру ұйымдарында, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарында тәрбиеленетін және білім алатын балаларды тамақтандыруды қамтамасыз етуге байланысты тауарларды жосықсыз берушілердің (әлеуетті өнім берушілердің) тізбесін қалыптастыру қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2018 жылғы 31 қазандағы № 599 бұйрығына өзгерістер енгізу туралы
