act_code: '125804'
requisite: Приказ Министра образования и науки Республики Казахстан от 18 октября 2018 года № 578. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 ноября 2018 года № 17705
title:
  rus: Об утверждении Типовых правил приема на обучение в организации образования, реализующие образовательные программы технического и профессионального, послесреднего образования, за исключением республиканских, областных, городов республиканского значения и столицы специализированных школ-интернатов-колледжей олимпийского резерва и областных, городов республиканского значения и столицы школ-интернатов для одаренных в спорте детей
  kaz: Олимпиадалық резервтің республикалық, облыстық, республикалық маңызы бар қалалар мен астананың мамандандырылған мектеп-интернат-колледждері және спорттағы дарынды балаларға арналған облыстық, республикалық маңызы бар қалалар мен астананың мектеп-интернаттарын қоспағанда, техникалық және кәсіптік, орта білімнен кейінгі білімнің білім беру бағдарламаларын іске асыратын білім беру ұйымдарына оқуға қабылдаудың үлгілік қағидаларын бекіту туралы
