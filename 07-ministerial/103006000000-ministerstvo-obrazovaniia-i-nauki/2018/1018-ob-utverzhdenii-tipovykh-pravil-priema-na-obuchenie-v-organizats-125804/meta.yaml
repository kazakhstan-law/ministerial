    rus: О внесении изменений и дополнения в приказ Министра образования и науки Республики Казахстан от 18 октября 2018 года № 578 «Об утверждении Типовых правил приема на обучение в организации образования, реализующие образовательные программы технического и профессионального, послесреднего образования, за исключением республиканских, областных, городов республиканского значения и столицы специализированных школ-интернатов-колледжей олимпийского резерва и областных, городов республиканского значения и столицы школ-интернатов для одаренных в спорте детей»
    kaz: «Техникалық және кәсіптік, орта білімнен кейінгі білімнің білім беру бағдарламаларын іске асыратын білім беру ұйымдарына оқуға қабылдаудың үлгілік қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2018 жылғы 18 қазандағы № 578 бұйрығына өзгерістер мен толықтыру енгізу туралы
