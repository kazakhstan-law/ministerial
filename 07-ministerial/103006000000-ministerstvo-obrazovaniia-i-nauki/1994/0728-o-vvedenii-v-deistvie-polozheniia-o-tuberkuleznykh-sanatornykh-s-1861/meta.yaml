title:
  rus: О введении в действие Положения о туберкулезных санаторных школах-интернатах для детей и подростков с ранними проявлениями туберкулезной инфекции, с малыми и затихающими формами туберкулеза, а также из очагов туберкулезной инфекции
  kaz: Туберкулез ауруының белгiсi ерте бiлiнген, оның шамалы және бәсеңдеген түрi, сондай-ақ жұқпалы ортасы бар балалар мен жасөспiрiмдер үшiн туберкулез ауруын емдейтiн санаторийлық мектеп-интернат туралы Ереженi күшiне енгiзу жөнiнде
