    kaz: «Жалпы білім беретін пәндер бойынша республикалық және халықаралық олимпиадалар мен ғылыми жобалар конкурстарының (ғылыми жарыстардың), орындаушылар конкурстарының, кәсіби шеберлік конкурстарының және спорттық жарыстардың тізбесін бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2011 жылғы 7 желтоқсандағы № 514 бұйрығына өзгертулер мен толықтырулар енгізу туралы
