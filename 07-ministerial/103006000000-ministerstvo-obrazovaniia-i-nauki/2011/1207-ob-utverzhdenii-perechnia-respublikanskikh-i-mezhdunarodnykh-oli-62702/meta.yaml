title:
  rus: Об утверждении Перечня республиканских и международных олимпиад и конкурсов научных проектов (научных соревнований) по общеобразовательным предметам, конкурсов исполнителей, конкурсов профессионального мастерства и спортивных соревнований
  kaz: Жалпы білім беретін пәндер бойынша республикалық және халықаралық олимпиадалар мен ғылыми жобалар конкурстарының (ғылыми жарыстардың), орындаушылар конкурстарының, кәсіби шеберлік конкурстарының және спорттық жарыстардың тізбесін бекіту туралы
