title:
  rus: Об утверждении правил организации и функционирования цифровых объектов в области дошкольного, среднего, технического и профессионального, послесреднего образования, дополнительного образования
  kaz: Мектепке дейінгі, орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру, қосымша білім беру саласындағы цифрлық объектілерін ұйымдастыру және олардың жұмыс істеу қағидаларын бекіту туралы
