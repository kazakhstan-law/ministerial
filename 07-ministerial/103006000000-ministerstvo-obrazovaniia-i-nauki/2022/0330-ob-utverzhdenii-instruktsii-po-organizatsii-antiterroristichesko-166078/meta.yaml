  title:
    rus: О внесении изменений и дополнений в приказ Министра образования и науки Республики Казахстан от 30 марта 2022 года № 117 «Об утверждении инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, осуществляющих деятельность в области образования Республики Казахстан»
    kaz: «Қазақстан Республикасының білім беру саласындағы қызметті жүзеге асыратын террористік тұрғыдан осал объектілерінің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2022 жылғы 30 наурыздағы № 117 бұйрығына өзгерістер мен толықтырулар енгізу туралы
