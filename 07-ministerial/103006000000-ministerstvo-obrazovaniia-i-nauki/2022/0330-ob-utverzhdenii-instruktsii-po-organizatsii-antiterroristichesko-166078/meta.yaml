act_code: '166078'
requisite: Приказ Министра образования и науки Республики Казахстан от 30 марта 2022 года № 117. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 апреля 2022 года № 27414
title:
  rus: Об утверждении инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, осуществляющих деятельность в области образования Республики Казахстан
  kaz: Қазақстан Республикасының білім беру саласындағы қызметті жүзеге асыратын террористік тұрғыдан осал объектілерінің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
