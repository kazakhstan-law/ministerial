  requisite: Приказ Министра просвещения Республики Казахстан от 31 июля 2023 года № 237. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 августа 2023 года № 33232
  title:
    rus: О внесении изменений в приказ Министра образования и науки Республики Казахстан от 30 марта 2022 года № 117 «Об утверждении инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, Министерства образования и науки Республики Казахстан и объектов, уязвимых в террористическом отношении, осуществляющих деятельность в сфере образования и науки»
    kaz: «Қазақстан Республикасы Білім және ғылым министрлігінің террористік тұрғыдан осал объектілері мен білім және ғылым саласындағы қызметті жүзеге асыратын террористік тұрғыдан осал объектілерді терроризмге қарсы қорғауды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2022 жылғы 30 наурыздағы № 117 бұйрығына өзгерістер енгізу туралы
