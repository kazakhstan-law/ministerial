  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам спорта и физической культуры от 25 июля 2014 года № 289 «Об утверждении Правил формирования составов сборных и штатных сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта)»
    kaz: «Спорт түрлері бойынша Қазақстан Республикасының құрама және штаттық құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) құрамын қалыптастыру қағидаларын бекіту туралы» Қазақстан Республикасы Спорт және дене шынықтыру істері агенттігі Төрағасының 2014 жылғы 25 шілдедегі № 289 бұйрығына өзгерістер енгізу туралы
