title:
  rus: Об утверждении Правил формирования составов национальных и штатных национальных команд Республики Казахстан, команд Республики Казахстан и команд областей, городов республиканского значения и столицы по видам спорта
  kaz: Спорт түрлері бойынша Қазақстан Республикасының ұлттық және штаттық ұлттық командаларының, Қазақстан Республикасының командаларының және облыстардың, республикалық маңызы бар қалалардың және астананың командаларының құрамын қалыптастыру қағидаларын бекіту туралы
