act_code: '83074'
requisite: Приказ Председателя Агентства Республики Казахстан по делам спорта и физической культуры от 28 июля 2014 года № 296. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 августа 2014 года № 9677
title:
  rus: Об утверждении критериев и размеров выплат денег по договорам о спортивной деятельности со спортсменами высокого класса, тренерами и специалистами в области физической культуры и спорта, осуществляющими подготовку спортсменов высокого класса
  kaz: Жоғары дәрежелі спортшылармен, жоғары дәрежелі спортшыларды даярлауды жүзеге асыратын жаттықтырушылармен және дене шынықтыру және спорт саласындағы мамандармен спорттық қызмет туралы шарттар бойынша ақша төлемдерінің критерийлері мен мөлшерін бекіту туралы
