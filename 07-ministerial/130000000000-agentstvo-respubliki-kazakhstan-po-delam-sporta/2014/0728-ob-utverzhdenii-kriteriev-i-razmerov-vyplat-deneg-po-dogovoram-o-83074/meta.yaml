  title:
    rus: О внесении изменений и дополнения в приказ Председателя Агентства Республики Казахстан по делам спорта и физической культуры от 28 июля 2014 года № 296 «Об утверждении размеров выплат денег по договорам о спортивной деятельности со спортсменами высокого класса, тренерами и специалистами в области физической культуры и спорта, осуществляющими подготовку спортсменов высокого класса»
    kaz: «Жоғары дәрежелі спортшылармен, жоғары дәрежелі спортшыларды даярлауды жүзеге асыратын жаттықтырушылармен және дене шынықтыру және спорт саласындағы мамандармен спорттық қызмет туралы шарттар бойынша ақша төлемінің мөлшерін бекіту туралы» Қазақстан Республикасы Спорт және дене шынықтыру істері агенттігі төрағасының 2014 жылғы 28 шілдедегі № 296 бұйрығына өзгерістер мен толықтыру енгізу туралы
