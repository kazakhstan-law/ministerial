  title:
    rus: О внесении изменения в приказ Председателя Агентства Республики Казахстан по делам спорта и физической культуры от 28 июля 2014 года № 295 «Об утверждении Правил выдачи и замены свидетельства о регистрации спортсмена, представления сведений спортивным федерациям о регистрации спортсмена»
    kaz: «Спортшыны тіркеу туралы куәлікті беру және ауыстыру, спорт федерацияларының спортшыны тіркеу туралы мәліметтерді ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Спорт және дене шынықтыру істері агенттігі төрағасының 2014 жылғы 28 шілдедегі № 295 бұйрығына өзгеріс енгізу туралы
