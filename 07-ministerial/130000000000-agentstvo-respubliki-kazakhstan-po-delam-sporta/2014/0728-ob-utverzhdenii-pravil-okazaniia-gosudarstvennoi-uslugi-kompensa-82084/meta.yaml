  title:
    rus: О некоторых вопросах осуществления компенсационных выплат членам сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта) при получении ими спортивных травм и увечий на международных спортивных соревнованиях
    kaz: «Спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) мүшелеріне олардың халықаралық спорттық жарыстарда жарақаттар алуы және мертігуі кезінде өтемақы төлемдерін төлеуді қамтамасыз етудің кейбір мәселелері туралы
