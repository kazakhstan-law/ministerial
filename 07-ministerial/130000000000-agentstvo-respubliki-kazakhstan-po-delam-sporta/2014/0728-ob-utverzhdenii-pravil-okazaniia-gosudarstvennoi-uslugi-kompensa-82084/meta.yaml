  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по делам спорта и физической культуры от 28 июля 2014 года № 292 «Об утверждении Правил компенсационных выплат членам сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта) при получении ими спортивных травм и увечий на международных спортивных соревнованиях»
    kaz: «Спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) мүшелеріне олардың халықаралық спорттық жарыстарда жарақаттар алуы және мертігуі кезіндегі өтемақы төлемдерін берудің қағидаларын бекіту туралы» Қазақстан Республикасы Спорт және дене шынықтыру істері агенттігі Төрағасының 2014 жылғы 28 шілдедегі № 292 бұйрығына өзгерістер мен толықтырулар енгізу туралы
