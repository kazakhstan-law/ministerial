title:
  rus: Об утверждении Правил оказания государственной услуги «Компенсационная выплата членам национальных команд Республики Казахстан по видам спорта при получении ими спортивных травм и увечий на международных спортивных соревнованиях
  kaz: Спорт түрлері бойынша Қазақстан Республикасы ұлттық командаларының мүшелеріне олардың халықаралық спорттық жарыстарда жарақаттар алуы және мертігуі кезінде өтемақы төлемдерін төлеу» мемлекеттік қызметін көрсету қағидаларын бекіту туралы
