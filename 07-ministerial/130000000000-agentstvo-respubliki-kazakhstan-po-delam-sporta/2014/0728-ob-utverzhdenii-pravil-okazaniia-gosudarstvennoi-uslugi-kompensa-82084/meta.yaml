  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам спорта и физической культуры от 28 июля 2014 года № 292 «Об утверждении Правил оказания государственной услуги «Компенсационная выплата членам сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта) при получении ими спортивных травм и увечий на международных спортивных соревнованиях»
    kaz: «Спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) мүшелеріне олардың халықаралық спорттық жарыстарда жарақаттар алуы және мертігуі кезінде өтемақы төлемдерін төлеу» мемлекеттік қызметін көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Спорт және дене шынықтыру істері агенттігі Төрағасының 2014 жылғы 28 шілдедегі № 292 бұйрығына өзгерістер енгізу туралы
