title:
  rus: Об утверждении Правил присвоения званий в номинации "Лучший" спортсменам, тренерам, специалистам в области физической культуры и спорта и физкультурно-спортивным организациям
  kaz: Спортшыларға, жаттықтырушыларға, дене шынықтыру және спорт саласындағы мамандарға және дене шынықтыру-спорттық ұйымдарға "Үздік" номинациясындағы атақтарды беру қағидаларын бекіту туралы
