    kaz: «Спортшыларға, жаттықтырушыларға, дене шынықтыру және спорт саласындағы мамандарға және дене шынықтыру-спорттық ұйымдарға «Үздік» номинациясындағы атақтарды беру қағидаларын бекіту туралы» Қазақстан Республикасы Спорт және дене шынықтыру істері агенттігі төрағасының 2014 жылғы 28 маусымдағы № 297 бұйрығына өзгерістер енгізу туралы
