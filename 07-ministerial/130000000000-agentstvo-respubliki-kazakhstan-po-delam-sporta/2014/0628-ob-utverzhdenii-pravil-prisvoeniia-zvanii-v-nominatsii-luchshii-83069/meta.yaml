  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам cпорта и физической культуры от 28 июня 2014 года № 297 «Об утверждении Правил присвоения званий в номинации «Лучший» спортсменам, тренерам, специалистам в области физической культуры и спорта и физкультурно-спортивным организациям»
    kaz: «Спортшыларға, жаттықтырушыларға, дене шынықтыру және спорт саласындағы мамандарға және дене шынықтыру – спорттық ұйымдарға «Үздік» номинациясындағы атақтарды беру қағидасын бекіту туралы» Қазақстан Республикасы Спорт және дене шынықтыру істері агенттігі төрағасының 2014 жылғы 28 маусымдағы № 297 бұйрығына өзгерістер енгізу туралы
