    kaz: '"Дене шынықтыру және спорт азаматтық қызметшілеріне еңбек жағдайлары үшін қосымша ақыларды төлеу қағидаларын бекіту туралы" Қазақстан Республикасы спорт және дене шынықтыру істері агенттігі төрағасының 2012 жылғы 20 желтоқсандағы № 438 бұйрығына өзгеріс енгізу туралы'
