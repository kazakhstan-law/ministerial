    rus: Об утверждении Правил присвоения и лишения спортивных званий, разрядов и квалификационных категорий, выдачи нагрудных знаков, а также их описание
    kaz: Спорттық атақтар, разрядтар және біліктілік санаттарын беру және олардан айыру, омырауға тағатын белгілерді беру қағидаларын, сондай-ақ олардың сипаттамасын бекіту туралы
