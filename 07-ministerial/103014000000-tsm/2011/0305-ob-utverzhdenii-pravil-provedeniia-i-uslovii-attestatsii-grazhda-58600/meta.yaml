requisite: Приказ и.о. Министра туризма и спорта Республики Казахстан от 5 марта 2011 года № 02-02-18/29. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 апреля 2011 года № 6864. Утратил силу приказом Министра культуры и спорта Республики Казахстан от 10 июня 2016 года № 157
title:
  rus: Об утверждении Правил проведения и условий аттестации гражданских служащих в сфере физической культуры и спорта, а также Правил присвоения квалификационных категорий тренерам, методистам, инструкторам
  kaz: Дене шынықтыру және спорт саласында азаматтық қызметшілерді аттестаттаудан өткізу мен шарттарының ережесін, сондай-ақ Жаттықтырушыларға, әдіскерлерге, нұсқаушыларға біліктілік санаттарын беру ережесін бекіту туралы
