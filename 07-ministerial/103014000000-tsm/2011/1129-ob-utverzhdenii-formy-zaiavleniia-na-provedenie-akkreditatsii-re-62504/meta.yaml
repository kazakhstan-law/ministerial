requisite: Приказ и.о. Министра туризма и спорта Республики Казахстан от 29 ноября 2011 года № 02-02-18/222. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 декабря 2011 года № 7349. Утратил силу приказом Министра культуры и спорта Республики Казахстан от 27 ноября 2014 года № 121
title:
  rus: Об утверждении формы заявления на проведение аккредитации республиканского общественного объединения по видам спорта и выдачу свидетельства об аккредитации и формы свидетельства об аккредитации
  kaz: Спорт түрлері бойынша республикалық қоғамдық бiрлестiктердi аккредиттеуді өткізуге және аккредиттeу туралы куәлікті беруге арналған өтiнiштің нысанын және аккредиттeу туралы куәліктің нысанын бекіту туралы
