requisite: Приказ и.о. Председателя Агентства Республики Казахстан по туризму и спорту от 21 июля 2004 года № 06-2-2/229. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 августа 2004 года № 3030. Утратил силу приказом Председателя Агентства Республики Казахстан по делам спорта и физической культуры от 25 декабря 2012 года № 446 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
