requisite: Приказ и.о. Председателя Агентства Республики Казахстан по туризму и спорту от 15 марта 2004 года № 06-2-2/91. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 апреля 2004 года № 2792. Утратил силу приказом Председателя Агентства Республики Казахстан по делам спорта и физической культуры от 25 июля 2014 года № 288 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
