act_code: '19098'
requisite: Приказ И.О. Председателя Агентства Республики Казахстан по туризму и спорту от 12 марта 2004 года N 06-2-2/89. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 марта 2004 года N 2738. Утратил силу приказом и.о. Министра туризма и спорта Республики Казахстан от 23 октября 2008 года № 01-08/181
title:
  rus: Об утверждении Правил повышения квалификации работников туристских организаций, их аттестации и подготовки различных категорий общественных туристских кадров (инструкторов всех видов спортивного туризма, туристских спасателей и других)
  kaz: Туристік ұйымдар қызметкерлерінің біліктілігін арттыру, оларды аттестаттау және қоғамдық туристік кадрлардың әртүрлі санаттарын даярлау (спорттық туризм нұсқаушыларының барлық түрі, туристік құтқарушылар және басқалар) ережесін бекіту туралы
