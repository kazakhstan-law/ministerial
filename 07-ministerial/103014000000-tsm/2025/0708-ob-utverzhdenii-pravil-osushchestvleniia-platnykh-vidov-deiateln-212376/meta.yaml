act_code: '212376'
requisite: Приказ Министра туризма и спорта Республики Казахстан от 8 июля 2025 года № 125. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 июля 2025 года № 36446
title:
  rus: Об утверждении Правил осуществления платных видов деятельности по реализации товаров (работ, услуг) государственными учреждениями в области физической культуры и спорта, деньги от реализации которых остаются в их распоряжении, использования денег от реализации государственными учреждениями в области физической культуры и спорта товаров (работ, услуг), остающихся в их распоряжении
  kaz: Дене шынықтыру және спорт саласындағы мемлекеттік мекемелердің өткізуден түскен ақша өз иелігінде қалатын тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуі бойынша ақылы қызмет түрлерін жүзеге асыру, дене шынықтыру және спорт саласындағы мемлекеттік мекемелердің тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуінен түскен, өз иелігінде қалатын ақшаны пайдалану қағидаларын бекіту туралы
