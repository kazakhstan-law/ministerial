requisite: Приказ и.о. Министра туризма и спорта Республики Казахстан от 16 октября 2025 года № 197
title:
  rus: О размещении и распределении государственного образовательного заказа на подготовку кадров с высшим или послевузовским образованием в организациях образования в области туризма из республиканского бюджета на 2025-2026 учебный год
  kaz: Республикалық бюджеттен қаржыландырылатын туризм саласындағы білім беру ұйымдарында жоғары және жоғары оқу орнынан кейінгі кадрларды даярлауға 2025-2026 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру және бөлу туралы
