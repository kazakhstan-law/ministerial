  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра туризма и спорта Республики Казахстан от 30 сентября 2025 года № 185 «Об определении Перечня видов спорта высших достижений и порядка их финансирования за счет бюджетных средств»
    kaz: «Жоғары жетістіктер спорты түрлерінің тізбесін және оларды бюджет қаражаты есебінен қаржыландыру тәртібін айқындау туралы» Қазақстан Республикасы Туризм және спорт министрінің міндетін атқарушысының 2025 жылғы 30 қыркүйектегі № 185 бұйрығына өзгерістер енгізу туралы
