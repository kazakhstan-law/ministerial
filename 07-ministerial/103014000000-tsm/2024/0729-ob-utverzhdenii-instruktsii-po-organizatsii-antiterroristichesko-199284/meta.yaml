act_code: '199284'
requisite: Приказ и.о. Министра туризма и спорта Республики Казахстан от 29 июля 2024 года № 141. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 июля 2024 года № 34840
title:
  rus: Об утверждении Инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении Министерства туризма и спорта Республики Казахстан и объектов, уязвимых в террористическом отношении, осуществляющих деятельность в сферах физической культуры и спорта, игорного бизнеса, лотереи и лотерейной деятельности, туристской деятельности, туризма и туристкой индустрии
  kaz: Қазақстан Республикасының Туризм және спорт министрлігінің террористік тұрғыдан осал объектілері мен дене шынықтыру және спорт, ойын бизнесі, лотереялар және лотерея қызметі, туристік қызмет, туризм және туристік индустрия салаларындағы қызметтерді жүзеге асыратын террористік тұрғыдан осал объектілерді терроризмге қарсы қорғауды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
