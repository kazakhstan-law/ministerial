act_code: '200189'
requisite: Приказ Министра туризма и спорта Республики Казахстан от 20 августа 2024 года № 149
title:
  rus: О размещении и распределении государственного образовательного заказа на подготовку кадров с высшим и послевузовским образованием в организациях образования в области туризма из республиканского бюджета на 2024-2025 учебный год
  kaz: Республикалық бюджеттен қаржыландырылатын туризм саласындағы білім беру ұйымдарында жоғары және жоғары оқу орнынан кейінгі кадрларды даярлауға 2024-2025 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру және бөлу туралы
