title:
  rus: Об утверждении норматива по определению оптимального соотношения количества спортсменов, участвующих в комплексных спортивных мероприятиях, к количественному составу иных членов спортивной делегации Республики Казахстан
  kaz: Кешенді спорттық іс-шараларға қатысатын спортшылар санының Қазақстан Республикасы спорттық делегациясының өзге де мүшелерінің сандық құрамына оңтайлы арақатынасын айқындау жөніндегі нормативтерді бекіту туралы
