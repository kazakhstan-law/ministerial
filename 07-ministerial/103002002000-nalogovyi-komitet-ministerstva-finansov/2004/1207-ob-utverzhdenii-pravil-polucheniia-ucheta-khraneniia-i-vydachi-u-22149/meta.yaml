requisite: Приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 7 декабря 2004 года N 622. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 декабря 2004 года N 3259. Утратил силу приказом Министра финансов Республики Казахстан от 23 декабря 2008 года N 599
title:
