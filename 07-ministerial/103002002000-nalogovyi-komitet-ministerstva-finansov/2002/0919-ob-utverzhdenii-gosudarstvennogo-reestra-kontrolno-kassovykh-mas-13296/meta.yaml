  requisite: Приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 24 июня 2004 года N 312. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 июля 2004 года N 2945. Утратил силу приказом Министра финансов Республики Казахстан от 30 декабря 2008 года N 635.
  title:
    rus: О внесении дополнений в приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 20 сентября 2002 года N 727 "Об утверждении Государственного реестра контрольно-кассовых машин с фискальной памятью, разрешенных к использованию на территории Республики Казахстан", зарегистрированный за номером 1991
    kaz: N 1991 тiркелген "Қазақстан Республикасының аумағында пайдалануға рұқсат етiлген фискалдық жады бар бақылау-кассалық машиналарының Мемлекеттiк тiзiлiмiн бекiту туралы" Қазақстан Республикасының Қаржы министрлiгі Салық комитетi Төрағасының 2002 жылғы 20 қыркүйектегi N 727 Бұйрығына толықтыру енгiзу туралы
