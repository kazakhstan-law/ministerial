  requisite: Приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 24 декабря 2004 года № 667. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 января 2005 года № 3324. Утратил силу приказом Министра финансов Республики Казахстан от 30 декабря 2008 года № 635
  title:
    rus: О внесении дополнения в приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 20 сентября 2002 года № 727 "Об утверждении Государственного реестра контрольно-кассовых машин с фискальной памятью, разрешенных к использованию на территории Республики Казахстан", зарегистрированный за номером 1991
    kaz: № 1991 тіркелген "Қазақстан Республикасының аумағында пайдалануға рұқсат етілген фискалдық жады бар бақылау-кассалық машиналарының Мемлекеттік тізілімін бекіту туралы" Қазақстан Республикасының Қаржы министрлігі Салық комитеті Төрағасының 2002 жылғы 20 қыркүйектегі № 727 Бұйрығына толықтыру енгізу туралы
