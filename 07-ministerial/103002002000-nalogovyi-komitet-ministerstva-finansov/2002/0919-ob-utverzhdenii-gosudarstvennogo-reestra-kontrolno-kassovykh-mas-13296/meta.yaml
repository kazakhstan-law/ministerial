requisite: Приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 20 сентября 2002 года N 727. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 октября 2002 года N 1991. Утратил силу приказом Министра финансов Республики Казахстан от 30 декабря 2008 года N 635.
title:
  rus: Об утверждении Государственного реестра контрольно-кассовых машин с фискальной памятью, разрешенных к использованию на территории Республики Казахстан
