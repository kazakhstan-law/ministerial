    kaz: '"Қазақстан Республикасының аумағында пайдалануға рұқсат етілген фискалдық жады бар бақылау-кассалық машиналардың Мемлекеттік тізілімін бекіту туралы" Қазақстан Республикасы Қаржы министрлігінің Салық комитеті Төрағасының 2002 жылы 20 қыркүйектегі № 727 бұйрығына толықтыру енгізу туралы'
