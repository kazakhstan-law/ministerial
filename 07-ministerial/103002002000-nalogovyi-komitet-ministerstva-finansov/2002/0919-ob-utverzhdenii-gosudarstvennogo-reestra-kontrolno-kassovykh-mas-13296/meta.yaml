  requisite: Приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 21 октября 2004 года N 532. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 ноября 2004 года N 3199. Утратил силу приказом Министра финансов Республики Казахстан от 30 декабря 2008 года N 635.
  title:
    rus: О внесении дополнения в приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 20 сентября 2002 года N 727 "Об утверждении Государственного реестра контрольно-кассовых машин с фискальной памятью, разрешенных к использованию на территории Республики Казахстан", зарегистрированный за номером 1991
    kaz: N 1991 тіркелген "Қазақстан Республикасының аумағында пайдалануға рұқсат етілген фискалдық жады бар бақылау-кассалық машиналарының Мемлекеттік тізілімін бекіту туралы" Қазақстан Республикасының Қаржы министрлігі Салық комитеті Төрағасының 2002 жылғы 20 қыркүйектегі N 727 Бұйрығына толықтыру енгізу туралы
