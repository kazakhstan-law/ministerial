    kaz: '"Қазақстан Республикасының аумағында пайдалануға рұқсат етілген фискалдық жады бар бақылау-кассалық машиналардың Мемлекеттік тізілімін бекіту туралы" Қазақстан Республикасы Қаржы министрлігінің Салық комитеті Төрағасының 2002 жылғы 20 қыркүйектегі N 727 бұйрығына толықтыру енгізу туралы'
