  requisite: Приказ и.о. Председателя Налогового комитета Министерства финансов Республики Казахстан от 29 июня 2007 года N 437. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 июля 2007 года N 4791. Утратил силу приказом Министра финансов Республики Казахстан от 30 декабря 2008 года N 635.
  title:
    rus: О внесении дополнений в приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 20 сентября 2002 года N 727 "Об утверждении Государственного реестра контрольно-кассовых машин с фискальной памятью, разрешенных к использованию на территории Республики Казахстан"
    kaz: '"Қазақстан Республикасының аумағында пайдалануға рұқсат етілген фискалдық жады бар бақылау-кассалық машиналардың Мемлекеттік тізілімін бекіту туралы" Қазақстан Республикасы Қаржы министрлігінің Салық комитеті Төрағасының 2002 жылғы 20 қыркүйектегі N 727 бұйрығына толықтырулар енгізу туралы'
