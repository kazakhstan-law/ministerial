requisite: Приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 8 августа 2003 года N 322. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 августа 2003 года N 2454. Утратил силу приказом Министра финансов Республики Казахстан от 20 июля 2009 года № 304
title:
  rus: Об утверждении Правил по проведению инвентаризации алкогольной продукции, промаркированной марками акцизного сбора образца 2001 года и табачных изделий и прочих изделий, содержащих табак, промаркированных марками акцизного сбора образца 1997 года
  kaz: 2001 жылғы үлгідегi акциздiк алым таңбаларымен таңбаланған алкоголь өнiмiне және 1997 жылғы үлгідегi акциздiк алым таңбаларымен таңбаланған темекі өнімдеріне және құрамында темекі бар өзге де өнімдерге түгендеудi жүргiзу жөнiндегі Ережесін бекіту туралы
