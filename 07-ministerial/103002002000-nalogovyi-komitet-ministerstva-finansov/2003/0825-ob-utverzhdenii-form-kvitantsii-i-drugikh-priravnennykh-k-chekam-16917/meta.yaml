  requisite: Приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 8 ноября 2004 года N 561. Зарегистрирован Министерством юстиции Республики Казахстан 3 декабря 2004 года N 3242. Утратил силу приказом Министра финансов Республики Казахстан от 9 января 2009 года № 5
  title:
    rus: О внесении дополнения в приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 26 августа 2003 года N 344 "Об утверждении форм квитанций и других приравненных к чекам документов строгой отчетности, выдаваемых населению при оказании услуг без применения контрольно-кассовых машин с фискальной памятью", зарегистрированный за N 2491
    kaz: N 2491 болып тiркелген "Квитанциялардың және фискальдық жады бар бақылау-касса машиналарын қолданбай қызмет көрсету кезiнде тұрғындарға берiлетiн чектерге теңестiрiлген басқа да қатаң есептiлiк құжаттарының нысандарын бекiту туралы" Қазақстан Республикасы Қаржы министрлiгінiң Салық комитетi Төрағасының 2003 жылғы 26 тамыздағы N 344 бұйрығына толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/22121/rus
