requisite: Приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 26 августа 2003 года N 344. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 сентября 2003 года за N 2491. Утратил силу приказом Министра финансов Республики Казахстан от 9 января 2009 года № 5
title:
  rus: Об утверждении форм квитанций и других приравненных к чекам документов строгой отчетности, выдаваемых населению при оказании услуг без применения контрольно-кассовых машин с фискальной памятью
  kaz: Квитанциялардың және фискальдық жады бар бақылау-касса машиналарын қолданбай қызмет көрсету кезінде тұрғындарға берілетін чектерге теңестірілген басқа да қатаң есептілік құжаттарының нысандарын бекіту туралы
