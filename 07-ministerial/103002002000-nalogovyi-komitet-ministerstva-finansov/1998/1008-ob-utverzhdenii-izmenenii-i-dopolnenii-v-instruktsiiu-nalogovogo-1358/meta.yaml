act_code: '1358'
requisite: Приказ Налогового комитета Министерства финансов Республики Казахстан от 9 октября 1998 года N 92. Зарегистрирован Министерством юстиции Республики Казахстан 24.10.1998 г. N 630. Утратил силу - приказом Министра государственных доходов РК от 9.04.2002 № 416 (извлечение из приказа см. ниже).
title:
  rus: Об утверждении изменений и дополнений в Инструкцию Налогового комитета Министерства финансов Республики Казахстан N 43 ~V950080 "Об административных положениях по налогам и другим обязательным платежам в бюджет"
  kaz: Қазақстан Республикасы Қаржы министрлігі Салық комитетінің "Салық және бюджетке төленетін басқа да міндетті төлемдер бойынша әкімшілік ережелер туралы" N 43 нұсқаулығына өзгерістер мен толықтыруларды бекіту туралы
