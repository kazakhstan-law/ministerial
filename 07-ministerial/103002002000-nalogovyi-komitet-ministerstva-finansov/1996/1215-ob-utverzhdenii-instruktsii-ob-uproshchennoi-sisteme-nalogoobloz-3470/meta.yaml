act_code: '3470'
requisite: Приказ Государственного налогового комитета Республики Казахстан от 15 декабря 1996 г. N 40. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 декабря 1996 г. N 237. Утратил силу - приказом Председателя Налогового комитета Министерства финансов Республики Казахстан от 13 декабря 2004г. N 643
title:
  rus: Об утверждении Инструкции "Об упрощенной системе налогообложения и порядке выдачи органами налоговой службы Республики Казахстан патентов крестьянским (фермерским) хозяйствам, имеющим статус физического или юридического лица, для которых земля является основным средством производства"
  kaz: Жер негiзгi өндiрiс құралы болып табылатын, жеке және заңды тұлғаның мәртебесiне ие шаруа (фермер) қожалықтарына жеңiлдетiлген салық салу жүйесiн және Қазақстан Республикасы салық қызметi органдарының патенттер беру тәртiбi туралы НҰСҚАУЛЫҚ
