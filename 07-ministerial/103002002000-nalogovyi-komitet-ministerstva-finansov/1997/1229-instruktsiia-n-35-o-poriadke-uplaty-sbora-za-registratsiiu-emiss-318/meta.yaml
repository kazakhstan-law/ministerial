  kaz: Бағалы қағаздар және мемлекеттiк тіркеуге жатпайтын акциялар эмиссиясының ұлттық ұқсастыру нөмiрiн беру эмиссиясын тiркегенi үшiн алынатын алым төлеу тәртiбi туралы N 35 Нұсқаулық
