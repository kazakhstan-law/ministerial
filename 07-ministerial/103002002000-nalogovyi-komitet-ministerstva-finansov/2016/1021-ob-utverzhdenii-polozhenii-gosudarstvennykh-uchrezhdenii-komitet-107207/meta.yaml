title:
  rus: Об утверждении положений государственных учреждений Комитета государственных доходов Министерства финансов Республики Казахстан
  kaz: Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитетінің мемлекеттік мекемелерінің ережелерін бекіту туралы
