  title:
    rus: О внесении изменений в приказы Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 7 сентября 2016 года № 522 «Об утверждении положений Департаментов государственных доходов Комитета государственных доходов Министерства финансов Республики Казахстан по областям, городам республиканского значения и столицы и их территориальных органов» и исполняющего обязанности Председателя Комитета государственных доходов Министерства финансов Республики Казахстан от 21 октября 2016 года № 595 «Об утверждении положений государственных учреждений Комитета государственных доходов Министерства финансов Республики Казахстан»
    kaz: «Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитетінің облыстар, республикалық маңызы бар қалалар және астана бойынша мемлекеттік кірістер департаменттерінің және олардың аумақтық органдарының ережелерін бекіту туралы» Қазақстан Республикасы Қаржы министрлігінің Мемлекеттік кірістер комитеті Төрағасының 2016 жылғы 7 қыркүйектегі № 522 және «Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитетінің мемлекеттік мекемелерінің ережелерін бекіту туралы» Қазақстан Республикасы Қаржы министрлігі Мемлекеттік кірістер комитеті төрағасының м.а. 2016 жылғы 21 қазандағы № 595 бұйрықтарына  өзгерістер енгізу туралы
