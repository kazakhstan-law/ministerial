act_code: '24849'
requisite: Приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 29 июня 2005 года N 289. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 июля 2005 года N 3738. Утратил силу приказом Министра финансов Республики Казахстан от 30 января 2009 года N 39
title:
  rus: Об утверждении форм уведомления о представлении в налоговый орган списков участников системы обязательного социального страхования и акта об изъятии наличных денег в счет погашения задолженности по социальным отчислениям
  kaz: Міндетті әлеуметтік сақтандыру жүйесіне қатысушылардың тізімдерін салық органына ұсыну туралы хабарлама мен әлеуметтік аударымдар бойынша берешекті өтеу есебіне қолма-қол ақшаны алу туралы акті нысандарын бекіту туралы
