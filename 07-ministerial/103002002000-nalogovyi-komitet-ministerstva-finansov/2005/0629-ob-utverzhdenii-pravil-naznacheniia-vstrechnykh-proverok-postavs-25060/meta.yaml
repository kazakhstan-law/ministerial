title:
  rus: Об утверждении Правил назначения встречных проверок поставщиков плательщика налога на добавленную стоимость для подтверждения достоверности предъявленных к возврату сумм налога на добавленную стоимость
  kaz: Қайтаруға ұсынылған қосылған құн салығы сомаларының дұрыстығын растау үшін қосылған құн салығын төлеушінің жеткізушілеріне қарсы тексерулер тағайындау ережесін бекіту туралы
