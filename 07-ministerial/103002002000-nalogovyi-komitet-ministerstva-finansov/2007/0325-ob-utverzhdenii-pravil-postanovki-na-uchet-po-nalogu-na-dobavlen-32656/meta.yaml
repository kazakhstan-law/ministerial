requisite: Приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 25 марта 2007 года N 157. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 апреля 2007 года N 4605. Утратил силу приказом Министра финансов Республики Казахстан от 30 декабря 2008 года N 634
title:
  rus: Об утверждении Правил постановки на учет по налогу на добавленную стоимость, снятия с учета по налогу на добавленную стоимость, выдачи, замены, аннулирования и приостановления действия свидетельства о постановке на учет по налогу на добавленную стоимость
  kaz: Қосылған құн салығы бойынша есепке қою, қосылған құн салығы бойынша есептен шығару, қосылған құн салығы бойынша есепке қою туралы куәлікті беру, ауыстыру, күшін жою және қолданысын тоқтата тұру ережесін бекіту туралы
