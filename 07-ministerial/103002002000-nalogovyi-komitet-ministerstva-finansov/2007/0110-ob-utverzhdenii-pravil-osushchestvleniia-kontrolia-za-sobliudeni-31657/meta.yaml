act_code: '31657'
requisite: Приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 10 января 2007 года N 17. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 февраля 2007 года N 4539. Утратил силу приказом Министра финансов Республики Казахстан от 30 декабря 2008 года N 639
title:
  rus: Об утверждении Правил осуществления контроля за соблюдением порядка учета, хранения, оценки, дальнейшего использования и реализации имущества, обращенного в собственность государства, и за полнотой и своевременностью поступления денег в бюджет в случае его реализации, а также передачи имущества, обращенного в собственность государства
  kaz: Мемлекет меншігіне айналдырылған мүлікті есепке алу, сақтау, бағалау, одан әрі пайдалану және өткізу тәртібін сақтауға және ол сатылған жағдайда ақшаның бюджетке толық және уақытылы түсуін бақылауды, сондай-ақ мемлекет меншігіне айналдырылған мүлікті беруді жүзеге асыру ережесін бекіту туралы
