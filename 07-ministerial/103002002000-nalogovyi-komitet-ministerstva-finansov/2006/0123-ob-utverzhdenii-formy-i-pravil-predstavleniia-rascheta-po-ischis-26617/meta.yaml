  title:
    rus: О внесении изменений в приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 23 января 2006 года N 25 "Об утверждении формы и правил представления Расчета по исчисленным, удержанным (начисленным) и перечисленным суммам обязательных пенсионных взносов, начисленным и перечисленным суммам социальных отчислений"
    kaz: '"Міндетті зейнетақы жарналарының есептелген, ұсталған (есептелген) және аударылған сомалары, әлеуметтік аударымдардың есептелген және аударылған сомалары бойынша есепті тапсыру нысаны мен ережелерін бекіту туралы" Қазақстан Республикасы Қаржы министрлігінің Салық комитеті Төрағасының 2006 жылғы 23 қаңтардағы N 25 бұйрығына өзгерістер енгізу туралы'
