act_code: '26725'
requisite: Приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 3 февраля 2006 года № 46. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 февраля 2006 года № 4089. Утратил силу приказом Министра финансов Республики Казахстан от 9 января 2009 года № 5
title:
  rus: Об утверждении Правил распределения стоимостных балансов подгрупп по состоянию на 1 января 2006 года, определенных в соответствии с налоговым законодательством Республики Казахстан, действовавшим до 1 января 2006 года, с учетом фиксированных активов, по которым в 2005 году была применена двойная норма амортизации, по группам, определенным пунктом 1 статьи 110 Кодекса Республики Казахстан "О налогах и других обязательных платежах в бюджет" (Налоговый кодекс)
  kaz: 2006 жылғы 1 қаңтарға дейін қолданыста болған, Қазақстан Республикасының салық заңнамасына сәйкес айқындалған, ішкі топтардың 2006 жылғы 1 қаңтардағы жағдай бойынша құн балансы 2005 жылы амортизацияның қосарлы нормасы қолданылған тіркелген активтер ескеріле отырып, Қазақстан Республикасының "Салық және бюджетке төленетін басқа да міндетті төлемдер туралы" Кодексінің (Салық кодексі) 110-бабы 1-тармағында айқындалған топтардың құн баланстарын бөлу Ережелерін бекіту туралы
