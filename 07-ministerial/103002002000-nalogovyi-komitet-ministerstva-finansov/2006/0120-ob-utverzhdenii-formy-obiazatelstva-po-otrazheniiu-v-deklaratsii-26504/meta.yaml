act_code: '26504'
requisite: Приказ Председателя Налогового комитета Министерства финансов Республики Казахстан от 20 января 2006 года № 23. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 января 2006 года № 4051. Утратил силу приказом Министра финансов Республики Казахстан от 29 декабря 2008 года № 627
title:
  rus: Об утверждении формы обязательства по отражению в декларации по налогу на добавленную стоимость суммы налога на добавленную стоимость, подлежащего уплате методом зачета по импорту товаров, ввозимых для собственных производственных нужд, и о целевом использовании товаров, ввозимых для собственных производственных нужд, уплата налога на добавленную стоимость по которым производится методом зачета
  kaz: Өздерiнiң өндiрiстiк мұқтаждары үшiн әкелінген тауарлардың импорты бойынша есепке алу әдісiмен төленуге тиiстi қосылған құн салығының сомасын қосылған құн салығы жөнiндегi декларацияда көрсету бойынша, және өздерiнiң өндiрiстiк мұқтаждары үшiн әкелінген, олар бойынша қосылған құн салығын төлеу есепке алу әдісiмен жүргізілетін тауарларды мақсатты пайдалану туралы мiндеттеменің нысанын бекiту туралы
