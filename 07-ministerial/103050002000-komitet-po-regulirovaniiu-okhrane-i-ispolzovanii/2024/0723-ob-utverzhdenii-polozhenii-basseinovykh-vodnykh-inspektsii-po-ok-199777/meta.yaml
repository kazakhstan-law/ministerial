  title:
    rus: О внесении изменений в приказ исполняющего обязанности председателя Комитета по регулированию, охране и использованию водных ресурсов Министерства водных ресурсов и ирригации Республики Казахстан от 23 июля 2024 года № 1-ОД «Об утверждении положений бассейновых инспекций по регулированию, охране и использованию водных ресурсов Комитета по регулированию, охране и использованию водных ресурсов Министерства водных ресурсов и ирригации Республики Казахстан»
    kaz: «Қазақстан Республикасының Су ресурстары және ирригация министрлігі Су ресурстарын реттеу, қорғау және пайдалану комитетінің Су ресурстарын реттеу, қорғау және пайдалану жөніндегі бассейндік инспекциялардың ережелерін бекіту туралы» Қазақстан Республикасының Су ресурстары және ирригация министрлігі Су ресурстарын реттеу, қорғау және пайдалану комитеті төрағасының міндетін атқарушының 2024 жылғы 23 шiлдедегi № 1-НҚ бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/213511/rus
