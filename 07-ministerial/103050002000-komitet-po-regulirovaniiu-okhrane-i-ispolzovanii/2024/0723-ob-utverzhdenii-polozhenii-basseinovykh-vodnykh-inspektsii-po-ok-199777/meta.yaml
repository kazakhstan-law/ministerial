title:
  rus: Об утверждении положений бассейновых водных инспекций по охране и регулированию использования водных ресурсов Комитета по регулированию, охране и использованию водных ресурсов Министерства водных ресурсов и ирригации Республики Казахстан
  kaz: Қазақстан Республикасы Су ресурстары және ирригация министрлігі Су ресурстарын реттеу, қорғау және пайдалану комитетінің Су ресурстарын қорғау және пайдалануды реттеу жөніндегі бассейндік су инспекциялардың ережелерін бекіту туралы
