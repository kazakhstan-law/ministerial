requisite: Приказ и.о Министра труда и социальной защиты населения Республики Казахстан от 4 августа 2017 года № 237. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 сентября 2017 года № 15610. Утратил силу приказом Министра труда и социальной защиты населения Республики Казахстан от 12 мая 2021 года № 165 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
