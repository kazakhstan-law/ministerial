  title:
    rus: О внесении дополнений в приказ Председателя Агентства Республики Казахстан по управлению земельными ресурсами от 7 сентября 2004 года N 72-П-а "Об утверждении Правил выполнения землеустроительных работ в Республике Казахстан по составлению проектов межхозяйственного землеустройства по образованию и упорядочению существующих землепользований, отвода и установлению границ земельных участков на местности"
    kaz: Қазақстан Республикасының Жер ресурстарын басқару жөніндегі агенттігі төрағасының 2004 жылғы 7 қыркүйектегі N72-Ө-а "Жер пайдалануларды ұйымдастыру және реттеу, алқапта жер учаскесінің шекарасын бөлу және белгілеу бойынша шаруашылық аралық жерге орналастыру жұмыстарын атқару Ережелерін бекіту туралы" бұйрығына толықтырулар енгізу туралы
