  title:
    rus: О внесении изменений в Приказ Председателя Агентства Республики Казахстан по управлению земельными ресурсами от 7 сентября 2004 года № 72-П-а "Об утверждении Правил выполнения землеустроительных работ в Республике Казахстан по составлению проектов межхозяйственного землеустройства по образованию и упорядочению существующих землепользований, отвода и установлению границ земельных участков на местности"
    kaz: Қазақстан Республикасы Жер ресурстарын басқару агенттігі төрағасының "Жер пайдалануларды ұйымдастыру және реттеу, алқапта жер учаскесінің шекарасын бөлу және белгілеу бойынша шаруашылық аралық жерге орналастыру жобасын әзірлеу жөніндегі Қазақстан Республикасындағы жерге орналастыру жұмыстарын атқару Ережелерін бекіту туралы" 2004 жылғы 7 қыркүйектегі N 72-Ө-а бұйрығына өзгерістер енгізу туралы
