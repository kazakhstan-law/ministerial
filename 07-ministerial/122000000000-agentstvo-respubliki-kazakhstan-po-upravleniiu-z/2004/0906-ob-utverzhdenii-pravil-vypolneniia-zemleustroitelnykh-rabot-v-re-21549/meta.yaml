act_code: '21549'
requisite: Приказ Председателя Агентства Республики Казахстан по управлению земельными ресурсами от 7 сентября 2004 года № 72-П-а. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 октября 2004 года № 3148. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 20 апреля 2022 года № 119 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выполнения землеустроительных работ в Республике Казахстан по составлению проектов межхозяйственного землеустройства по образованию и упорядочению существующих землепользований, отвода и установлению границ земельных участков на местности
  kaz: Жер пайдалануларды ұйымдастыру және реттеу, алқапта жер учаскесінің шекарасын бөлу және белгілеу бойынша шаруашылық аралық жерге орналастыру жобасын әзірлеу жөніндегі Қазақстан Республикасындағы жерге орналастыру жұмыстарын атқару қағидаларын бекіту туралы
