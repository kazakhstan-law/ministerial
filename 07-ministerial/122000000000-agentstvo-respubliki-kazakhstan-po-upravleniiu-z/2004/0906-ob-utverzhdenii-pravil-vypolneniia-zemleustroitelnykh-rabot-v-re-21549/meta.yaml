requisite: Приказ Председателя Агентства Республики Казахстан по управлению земельными ресурсами от 7 сентября 2004 года № 72-П-а. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 октября 2004 года № 3148. Утратил силу приказом Министра сельского хозяйства Республики Казахстан от 20 апреля 2022 года № 119 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
