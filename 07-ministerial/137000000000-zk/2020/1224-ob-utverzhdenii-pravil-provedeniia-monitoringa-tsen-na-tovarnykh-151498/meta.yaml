  title:
    rus: О внесении изменений в приказ Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 24 декабря 2020 года № 2 «Об утверждении Правил проведения мониторинга цен на товарных рынках с целью установления признаков нарушения законодательства Республики Казахстан в области защиты конкуренции и принятия мер антимонопольного реагирования»
    kaz: «Қазақстан Республикасының бәсекелестікті қорғау саласындағы заңнамасын бұзушылық белгілерін анықтау және монополияға қарсы ден қою шараларын қабылдау мақсатында тауар нарықтарында бағаларға мониторинг жүргізу қағидаларын бекіту туралы» Қазақстан Республикасының Бәсекелестікті қорғау және дамыту агенттігі төрағасының 2020 жылғы 24 желтоқсандағы № 2 бұйрығына өзгерістер енгізу туралы
