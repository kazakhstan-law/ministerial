title:
  rus: Об утверждении Правил проведения мониторинга цен на товарных рынках с целью установления признаков нарушения законодательства Республики Казахстан в области защиты конкуренции
  kaz: Қазақстан Республикасының бәсекелестікті қорғау саласындағы заңнамасын бұзушылық белгілерін анықтау мақсатында тауар нарықтарында бағаларға мониторинг жүргізу қағидаларын бекіту туралы
