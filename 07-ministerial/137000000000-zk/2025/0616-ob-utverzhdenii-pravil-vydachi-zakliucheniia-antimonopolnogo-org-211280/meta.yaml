requisite: Приказ и.о. Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 16 июня 2025 года № 6. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 июня 2025 года № 36278
title:
  rus: Об утверждении Правил выдачи заключения антимонопольного органа об отсутствии субъектов частного предпринимательства, осуществляющих производство аналогичных товаров, работ, услуг и об отсутствии иной возможности приобретения соответствующих товаров, работ, услуг на конкурентной основе
  kaz: Монополияға қарсы органның ұқсас тауарлар жасауды және қызметтер көрсетуді жүзеге асыратын жеке кәсіпкерлік субъектілерінің жоқ екендігі туралы және тиісті тауарларды, жұмыстарды, көрсетілетін қызметтерді бәсекелестік негізде сатып алудың өзге мүмкіндігінің жоқ екендігі туралы қорытынды беру қағидалары
