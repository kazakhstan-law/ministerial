act_code: '219484'
requisite: Приказ Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 23 декабря 2025 года № 15. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 декабря 2025 года № 37669
title:
  rus: Об утверждении Требований к правилам внутреннего контроля в целях противодействия легализации (отмыванию) доходов, полученных преступным путем, финансированию терроризма и финансированию распространения оружия массового уничтожения для товарных бирж, биржевых брокеров, осуществляющих свою деятельность на товарной бирже и совершающие сделки с биржевыми товарами, а также клиринговых центров товарных бирж
  kaz: Тауар биржалары, өз қызметін тауар биржасында жүзеге асыратын және биржалық тауарлармен мәмілелер жасайтын биржалық брокерлер, сондай-ақ тауар биржаларының клирингтік орталықтары үшін қылмыстық жолмен алынған кірістерді заңдастыруға (жылыстатуға), терроризмді қаржыландыруға және жаппай қырып-жою қаруын таратуды қаржыландыруға қарсы іс-қимыл жасау мақсатында ішкі бақылау қағидаларына қойылатын талаптарды бекіту туралы
