act_code: '213174'
requisite: Приказ и.о. Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 8 августа 2025 года № 187/НҚ
title:
  rus: Об отмене Приказа Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 8 июля 2022 года № 190/НҚ «Об утверждении Правил выдачи заключения антимонопольного органа об отсутствии субъектов частного предпринимательства, осуществляющих производство аналогичных товаров, работ, услуг»
  kaz: «Монополияға қарсы органның ұқсас тауарларды, жұмыстарды, көрсетілетін қызметтерді өндіруді жүзеге асыратын жеке кәсіпкерлік субъектілерінің жоқтығы туралы қорытынды беру қағидаларын бекіту туралы» Қазақстан Республикасының Бәсекелестікті қорғау және дамыту агенттігі төрағасының 2022 жылғы 8 шiлдедегi № 190/НҚ бұйрығының күшін жою туралы
