  title:
    rus: О внесении изменений в приказ Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 5 июля 2022 года № 16 «О введении временного государственного ценового регулирования на розничную реализацию сжиженного нефтяного газа для заправки автотранспорта на автогазозаправочных станциях на территории Республики Казахстан»
    kaz: «Қазақстан Республикасының аумағында автогаз құю станцияларында автокөлікке жанармай құю үшін сұйытылған мұнай газын бөлшек саудада өткізуге уақытша мемлекеттік баға реттеуді енгізу туралы» Қазақстан Республикасы Бәсекелестікті қорғау және дамыту агенттігі Төрағасының 2022 жылғы 5 шілдедегі № 16 бұйрығына өзгерістер енгізу туралы
