  title:
    rus: О внесении изменений и дополнения в приказ Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 28 марта 2022 года № 4 «Об утверждении Правил проведения мониторинга деятельности государственных предприятий, юридических лиц, более пятидесяти процентов акций (долей участия в уставном капитале) которых принадлежат государству, и аффилированных с ними лиц на предмет получения согласия антимонопольного органа при создании, расширении и (или) изменении осуществляемых видов деятельности, а также осуществления исключительно тех видов деятельности, на которые получено согласие антимонопольного органа»
    kaz: «Мемлекеттік кәсіпорындардың, акцияларының (жарғылық капиталға қатысу үлестерiнiң) елу пайыздан астамы мемлекетке тиесілі заңды тұлғалардың және олармен үлестес тұлғалардың қызметіне жүзеге асырылатын қызмет түрлерін құру, кеңейту және (немесе) өзгерту кезінде монополияға қарсы органның келісімін алу, сондай-ақ монополияға қарсы органның келісімі алынған сол қызмет түрлерін ғана жүзеге асыру тұрғысынан мониторинг жүргізу қағидаларын бекіту туралы» Қазақстан Республикасының Бәсекелестікті қорғау және дамыту агенттігі төрағасының 2022 жылғы 28 наурыздағы № 4 бұйрығына өзгерістер мен толықтыру енгізу туралы
