requisite: Приказ Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 20 апреля 2022 года № 9. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 апреля 2022 года № 27771. Утратил силу приказом и.о. Председателя Агентства по защите и развитию конкуренции Республики Казахстан от 23 июля 2025 года № 8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
