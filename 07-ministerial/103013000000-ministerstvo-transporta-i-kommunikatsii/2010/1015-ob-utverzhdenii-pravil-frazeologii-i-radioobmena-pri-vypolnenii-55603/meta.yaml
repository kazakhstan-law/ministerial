title:
  rus: Об утверждении Правил фразеологии и радиообмена при выполнении полетов и обслуживания воздушного движения
  kaz: Ұшуды орындау және әуе қозғалысына қызмет көрсету кезінде фразеология және радиоалмасу қағидаларын бекіту туралы
