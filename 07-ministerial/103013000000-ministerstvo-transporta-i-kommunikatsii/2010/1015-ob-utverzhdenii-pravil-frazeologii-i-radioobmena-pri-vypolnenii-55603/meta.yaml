  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра транспорта и коммуникаций Республики Казахстан от 15 октября 2010 года № 454 «Об утверждении Правил фразеологии радиообмена при выполнении полетов и обслуживании воздушного движения» и в приказ Министра по инвестициям и развитию Республики Казахстан от 26 июня 2017 года № 384 «Об утверждении Правил сертификации и выдачи сертификата поставщика аэронавигационного обслуживания, а также сертификационных требований, предъявляемых к поставщикам аэронавигационного обслуживания»
    kaz: «Ұшуды орындау және әуе қозғалысына қызмет көрсету кезінде радиоалмасу фразеологиясының қағидаларын бекіту туралы» Қазақстан Республикасы Көлік және коммуникация министрінің міндетін атқарушының 2010 жылғы 15 қазандағы № 454 бұйрығына және «Аэронавигациялық қызмет көрсетуді берушіні сертификаттау және оған сертификат беру қағидаларын, сондай-ақ аэронавигациялық қызмет көрсетуді берушілерге қойылатын сертификаттау талаптарын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 26 маусымдағы № 384 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/178888/rus
