title:
  rus: Об утверждении Инструкции по утверждению расписания регулярных рейсов иностранных авиаперевозчиков на международных авиамаршрутах Республики Казахстан
  kaz: Қазақстан Республикасының халықаралық авиамаршруттарында шетелдік авиатасымалдаушылардың тұрақты рейстерінің кестелерін бекіту жөніндегі нұсқаулықты бекіту туралы
