  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра транспорта и коммуникаций Республики Казахстан от 13 августа 2010 года № 363 "Об утверждении Инструкции по утверждению расписания регулярных рейсов на внутренних и международных авиамаршрутах Республики Казахстан"
    kaz: '"Қазақстан Республикасының ішкі және халықаралық авиамаршруттарындағы тұрақты рейстердің кестесін бекіту жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Көлік және коммуникация министрінің міндетін атқарушының 2010 жылғы 13 тамыздағы № 363 бұйрығына өзгерістер енгізу туралы'
