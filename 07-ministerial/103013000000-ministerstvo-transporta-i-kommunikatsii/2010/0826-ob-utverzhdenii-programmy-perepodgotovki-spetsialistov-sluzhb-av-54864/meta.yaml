  title:
    rus: О внесении изменений в приказ Министра транспорта и коммуникаций Республики Казахстан от 26 августа 2010 года № 385 "Об утверждении Программы подготовки и переподготовки специалистов служб авиационной безопасности, должностных лиц уполномоченного органа в сфере гражданской авиации по вопросам авиационной безопасности и безопасности полетов"
