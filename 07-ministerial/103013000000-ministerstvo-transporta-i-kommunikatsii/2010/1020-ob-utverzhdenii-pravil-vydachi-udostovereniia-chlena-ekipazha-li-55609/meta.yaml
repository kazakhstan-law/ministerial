  title:
    rus: О внесении изменений и дополнений в приказ Министра транспорта и коммуникаций Республики Казахстан от 20 октября 2010 года № 465 "Об утверждении Правил выдачи удостоверения члена экипажа лицам летного состава, кабинного экипажа, инженерно-техническому составу, обеспечивающему техническое сопровождение полетов, имеющим действующие свидетельства авиационного персонала, и персоналу, обеспечивающему безопасность воздушного судна в полете"
    kaz: '"Авиация персоналының қолданыстағы куәлігі бар ұшу құрамының, кабина экипажының адамдарына, ұшуды техникалық қамтамасыз ететін инженерлік-техникалық құрамға және ұшу кезінде қауіпсіздігін қамтамасыз ететін персоналға экипаж мүшесінің куәлігін беру қағидаларын бекіту туралы" Қазақстан Республикасы Көлік және коммуникация министрінің 2010 жылғы 20 қазандағы № 465 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
