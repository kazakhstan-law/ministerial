requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 20 октября 2010 года № 465. Зарегистрирован в Министерстве юстиции Республики Казахстан от 17 ноября 2010 года № 6637. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 22 июня 2017 года № 378 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи удостоверения члена экипажа лицам летного состава, кабинного экипажа, инженерно-техническому составу, обеспечивающему техническое сопровождение полетов, имеющим действующие свидетельства авиационного персонала, и персоналу, обеспечивающему безопасность воздушного судна в полете
  kaz: Авиация персоналының қолданыстағы куәлігі бар ұшу құрамының, кабина экипажының адамдарына, ұшуды техникалық қамтамасыз ететін инженерлік-техникалық құрамға және ұшу кезінде қауіпсіздігін қамтамасыз ететін персоналға экипаж мүшесінің куәлігін беру қағидаларын бекіту туралы
