    kaz: «Қазақстан Республикасының аумағындағы көліктік бақылау бекеттерінің жұмысын ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасының Көлік және коммуникация министрінің міндетін атқарушының 2010 жылғы 13 тамыздағы № 362 бұйрығына өзгеріс енгізу туралы
