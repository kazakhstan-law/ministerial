  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра транспорта и коммуникаций Республики Казахстан от 13 августа 2010 года № 359 «Об утверждении Правил выдачи и оснований для отказа в выдаче разрешений на выполнение международных нерегулярных полетов» и в приказ Министра по инвестициям и развитию Республики Казахстан от 26 июня 2017 года № 382 «Об утверждении Правил аккредитации иностранных воздушных перевозчиков в Республике Казахстан»
    kaz: «Халықаралық тұрақты емес ұшуды орындауға рұқсаттар беру және оны беруден бас тарту негіздерінің қағидаларын бекіту туралы» Қазақстан Республикасы Көлік және коммуникация министрінің міндетін атқарушысының 2010 жылғы 13 тамыздағы № 359 және «Қазақстан Республикасында шетелдік әуемен тасымалдаушыларды аккредиттеу қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушысының 2017 жылғы 26 маусымдағы № 382 бұйрықтарына өзгерістер енгізу туралы
