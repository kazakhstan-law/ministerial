  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра транспорта и коммуникаций Республики Казахстан от 13 августа 2010 года № 359 «Об утверждении Правил выдачи и оснований для отказа в выдаче разрешений на выполнение международных нерегулярных полетов»
