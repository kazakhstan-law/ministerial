title:
  rus: Об утверждении Правил выдачи и оснований для отказа в выдаче разрешений на выполнение международных нерегулярных полетов
  kaz: Халықаралық тұрақты емес ұшуды орындауға рұқсаттар беру және оны беруден бас тарту негіздерінің қағидаларын бекіту туралы
