  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра транспорта и коммуникаций Республики Казахстан от 13 августа 2010 года № 359 "Об утверждении Правил выдачи и оснований для отказа в выдаче разрешений на выполнение международных нерегулярных полетов"
    kaz: '"Халықаралық тұрақты емес ұшуларды орындауға арналған рұқсаттарды беру ережесін және беруден бас тарту негіздерін бекіту туралы" Қазақстан Республикасы Көлік және коммуникация министрінің міндетін атқарушының 2010 жылғы 13 тамыздағы № 359 бұйрығына өзгерістер енгізу туралы'
