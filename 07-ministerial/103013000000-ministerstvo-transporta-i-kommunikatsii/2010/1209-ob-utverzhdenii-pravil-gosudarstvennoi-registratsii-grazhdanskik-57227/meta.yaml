requisite: Приказ и.о. Министра транспорта и коммуникаций Республики Казахстан от 9 декабря 2010 года № 559. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 января 2011 года № 6746. Утратил силу приказом Министра транспорта и коммуникаций Республики Казахстан от 18 сентября 2012 года № 613
title:
  rus: Об утверждении Правил государственной регистрации гражданских воздушных судов Республики Казахстан, прав на них и сделок с ними, а также форм документов, удостоверяющих права на них
  kaz: Қазақстан Республикасы азаматтық әуе кемелерін, оларға арналған құқықтарды және олармен жасалатын мәмілелерді, сондай-ақ оларға құқықты куәландыратын құжаттар нысандарын мемлекеттік тіркеу қағидаларын бекіту туралы
