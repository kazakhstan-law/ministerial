  title:
    rus: О внесении изменений в приказ Министра транспорта и коммуникаций Республики Казахстан от 22 октября 2010 года № 470 «Об утверждении Правил уведомления эксплуатантом гражданского воздушного судна Республики Казахстан о выполненном нерегулярном международном полете вне пределов воздушного пространства Республики Казахстан»
    kaz: «Қазақстан Республикасы әуе кеңістігінің шегінен тыс жерде Қазақстан Республикасы азаматтық әуе кемесін пайдаланушының тұрақты емес халықаралық ұшуды орындау жөнінде хабарлау қағидасын бекіту туралы» Қазақстан Республикасы Көлік және коммуникация министрінің 2010 жылғы 22 қазандағы № 470 бұйрығына өзгерістер енгізу туралы
