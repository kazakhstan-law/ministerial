title:
  rus: Об утверждении Правил уведомления эксплуатантом гражданского воздушного судна Республики Казахстан о выполненном нерегулярном международном полете вне пределов воздушного пространства Республики Казахстан
  kaz: Қазақстан Республикасы әуе кеңістігінің шегінен тыс жерде Қазақстан Республикасы азаматтық әуе кемесін пайдаланушының тұрақты емес халықаралық ұшуды орындау жөнінде хабарлау қағидасын бекіту туралы
