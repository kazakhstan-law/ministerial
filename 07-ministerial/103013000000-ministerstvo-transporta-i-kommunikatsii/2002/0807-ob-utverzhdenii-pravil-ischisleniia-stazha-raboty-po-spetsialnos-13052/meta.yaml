requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 8 августа 2002 года № 275-I. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 августа 2002 года № 1959. Утратил силу приказом Министра транспорта и коммуникаций Республики Казахстан от 23 октября 2013 года № 827
title:
  rus: Об утверждении Правил исчисления стажа работы по специальности работников организаций водных путей и государственного учреждения "Регистр судоходства" Комитета транспорта и путей сообщения Министерства транспорта и коммуникаций Республики Казахстан, не являющихся государственными служащими
  kaz: Мемлекеттiк қызметшi емес су жолдары ұйымдарының және Қазақстан Республикасы Көлік және коммуникация министрлігінің Көлік және қатынас жолдары комитеті "Кеме қатынасының тіркелімі" мемлекеттік мекемесінің жұмыскерлерiнiң мамандықтары бойынша жұмыс өтiлiн есептеу ережесiн бекiту туралы
