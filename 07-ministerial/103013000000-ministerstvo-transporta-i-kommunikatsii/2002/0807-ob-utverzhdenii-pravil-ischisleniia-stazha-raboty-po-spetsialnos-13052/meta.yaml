  title:
    rus: О внесении изменений в приказ Министра транспорта и коммуникаций Республики Казахстан от 8 августа 2002 года № 275-І "Об утверждении Правил исчисления стажа работы по специальности работников организаций водных путей и государственного учреждения "Регистр судоходства" Комитета транспорта и путей сообщения Министерства транспорта и коммуникаций Республики Казахстан, не являющихся государственными служащими"
    kaz: '"Мемлекеттiк қызметшi емес су жолдары ұйымдарының және Қазақстан Республикасы Көлік және коммуникация министрлігінің Көлік және қатынас жолдары комитеті "Кеме қатынасының тіркелімі" мемлекеттік мекемесінің жұмыскерлерiнiң мамандықтары бойынша жұмыс өтiлiн есептеу ережесiн бекiту туралы" Қазақстан Республикасы Көлік және коммуникациялар министрінің 2002 жылғы 8 тамыздағы № 275-І бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/55303/rus
