  title:
    rus: О внесении изменений в приказ Министра транспорта и коммуникаций Республики Казахстан от 17 июля 2002 года № 251-I «Об утверждении Правил выдачи Свидетельства о страховании или ином финансовом обеспечении гражданской ответственности за ущерб от загрязнения нефтью» и приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 3 апреля 2020 года № 181 «Об утверждении Правил оказания государственной услуги «Выдача удостоверений личности моряка Республики Казахстан»
    kaz: «Мұнайдан болатын ластанудан залал үшін азаматтық жауапкершілікті сақтандыру немесе өзге де қаржылық қамтамасыз ету туралы куәлік беру қағидаларын бекіту туралы» Қазақстан Республикасы Көлік және коммуникациялар министрінің 2002 жылғы 17 шілдедегі № 251-І бұйрығына және «Қазақстан Республикасы теңізшісінің жеке куәліктерін беру» мемлекеттік қызметті көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2020 жылғы 3 сәуірдегі № 181 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/229413/rus
