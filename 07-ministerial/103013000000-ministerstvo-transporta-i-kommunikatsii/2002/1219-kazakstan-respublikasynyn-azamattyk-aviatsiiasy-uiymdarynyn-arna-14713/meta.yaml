requisite: Көлік және коммуникациялар министрлігі Азаматтық авиация комитеті төрағысының 2002 жылғы 19 желтоқсандағы N 833-ю бұйрығы. Қазақстан Республикасы Әділет министрлігінде 2003 жылғы 20 қаңтарда тіркелді. Тіркеу N 2129. Күші жойылды - Қазақстан Республикасы Көлік және коммуникация министрінің міндетін атқарушысының 2010 жылғы 30 қыркүйектегі № 442 бұйрығымен
