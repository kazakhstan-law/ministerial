  title:
    rus: О внесении изменений и дополнений в приказ Министра транспорта и коммуникаций Республики Казахстан от 11 июля 2002 года N 240-I "Об утверждении Правил регистрации железнодорожного подвижного состава в Республике Казахстан", зарегистрированный в Министерстве юстиции Республики Казахстан за N 1948
    kaz: '"Қазақстан Республикасында жылжымалы темiр жол құрамын тiркеу ережесiн бекiту туралы" Қазақстан Республикасы Көлiк және коммуникациялар министрiнiң Қазақстан Республикасының Әдiлет министрлiгiнде N 1948 болып тiркелген 2002 жылғы 11 шiлдедегi N 240-I бұйрығына өзгерiстер мен толықтырулар енгiзу туралы'
