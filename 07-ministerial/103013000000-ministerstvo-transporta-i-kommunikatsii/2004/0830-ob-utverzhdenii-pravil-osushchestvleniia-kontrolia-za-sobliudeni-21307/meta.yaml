  requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 22 ноября 2005 года № 363-I. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 декабря 2005 года № 3964. Утратил силу приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 5 февраля 2015 года № 110
  title:
    rus: О внесении дополнения и изменения в приказ Министра транспорта и коммуникаций Республики Казахстан от 31 августа 2004 года № 324-I "Об утверждении Правил осуществления контроля за соблюдением перевозчиками Правил перевозок пассажиров, багажа и грузобагажа железнодорожным транспортом Республики Казахстан, утвержденных приказом Министра транспорта и коммуникаций Республики Казахстан от 18 марта 2004 года № 122-I, зарегистрированных за № 2810"»
    kaz: '"Қазақстан Республикасы Көлік және коммуникациялар министрінің 2004 жылғы 18 наурыздағы № 122-І бұйрығымен бекітілген, № 2810 нөмірмен тіркелген Қазақстан Республикасының темір жол көлігімен жолаушыларды, багажды және жүк - багажды тасымалдау ережесін тасымалдаушылардың сақтауын бақылауды жүзеге асыру ережесін бекіту туралы" Қазақстан Республикасы Көлік және коммуникациялар министрінің 2004 жылғы 31 тамыздағы № 324-І бұйрығына толықтыру және өзгеріс енгізу туралы'
