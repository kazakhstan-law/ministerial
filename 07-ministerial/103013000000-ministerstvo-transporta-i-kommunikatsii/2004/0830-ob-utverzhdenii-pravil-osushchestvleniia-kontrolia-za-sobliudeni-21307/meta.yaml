  code: '27036'
  requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 9 марта 2006 года N 70. Зарегистрирован в Министерстве юстиции Республики Казахстан от 3 апреля 2006 года N 4169. Утратил силу приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 5 февраля 2015 года № 110
  title:
    rus: О внесении дополнения и изменения в приказ Министра транспорта и коммуникаций Республики Казахстан от 31 августа 2004 года N 324-I "Об утверждении Правил осуществления контроля за соблюдением перевозчиками Правил перевозок пассажиров, багажа и грузобагажа железнодорожным транспортом Республики Казахстан, утвержденных приказом Министра транспорта и коммуникаций Республики Казахстан от 18 марта 2004 года N 122-I, зарегистрированных за N 2810"
    kaz: '"Қазақстан Республикасы Көлік және коммуникациялар министрінің 2004 жылғы 18 наурыздағы N 122-І бұйрығымен бекітілген, 2810 нөмірмен тіркелген" Қазақстан Республикасында темір жол көлігімен жолаушыларды, багажды және жүк-багажды тасымалдау ережесін тасымалдаушылардың сақтауын бақылауды жүзеге асыру ережесін бекіту туралы" Қазақстан Республикасы Көлік және коммуникациялар министрінің 2004 жылғы 31 тамыздағы N 324-І бұйрығына толықтыру мен өзгеріс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/27036/rus
