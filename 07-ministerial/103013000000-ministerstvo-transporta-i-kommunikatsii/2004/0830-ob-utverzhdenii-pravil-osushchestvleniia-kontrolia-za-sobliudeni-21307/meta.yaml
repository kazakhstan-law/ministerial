  requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 14 декабря 2004 года N 470-I. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 декабря 2004 года N 3286. Утратил силу приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 5 февраля 2015 года № 110
  title:
    rus: О внесении изменений и дополнений в приказ Министра транспорта и коммуникаций Республики Казахстан от 31 августа 2004 года N 324-I "Об утверждении Правил осуществления контроля за соблюдением перевозчиками Правил перевозок пассажиров, багажа и грузобагажа железнодорожным транспортом Республики Казахстан, утвержденных приказом Министра транспорта и коммуникаций Республики Казахстан от 18 марта 2004 года N 122-I, зарегистрированных за N 2810"
    kaz: Қазақстан Республикасы Көлік және коммуникациялар министрінің 2004 жылғы 31 тамыздағы N 324-І бұйрығымен бекітілген, "Қазақстан Республикасында темір жол көлігімен жолаушыларды, багажды және жүк-багажын тасымалдау Ережесін тасымалдаушылардың сақтауын бақылауды жүзеге асыру Ережесін бекіту туралы, Қазақстан Республикасы Көлік және коммуникациялар министрінің 2004 жылғы 18 наурыздағы N 124-І бұйрығымен бекітілген, N 2810 тіркелген", өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/22450/rus
