  requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 7 декабря 2012 года № 856. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 января 2012 года № 8280. Утратил силу приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 5 февраля 2015 года № 110
  title:
    rus: О внесении изменений в приказ Министра транспорта и коммуникаций Республики Казахстан от 31 августа 2004 года № 324-I "Об утверждении Правил осуществления контроля за соблюдением перевозчиками Правил перевозок пассажиров, багажа и грузобагажа железнодорожным транспортом Республики Казахстан, утвержденных приказом Министра транспорта и коммуникаций Республики Казахстан от 18 марта 2004 года № 122-I, зарегистрированных за № 2810"
    kaz: '"Қазақстан Республикасы Көлік және коммуникациялар министрінің 2004 жылғы 18 наурыздағы № 122-І бұйрығымен бекітілген, № 2810 тіркелген "Қазақстан Республикасында темір жол көлігімен жолаушыларды, багажды және жүк-багажын тасымалдау ережесін тасымалдаушылардың сақтауын бақылауды жүзеге асыру ережесін бекіту туралы" Қазақстан Республикасы Көлік және коммуникациялар министрінің 2004 жылғы 31 тамыздағы № 324-І бұйрығына өзгерістер енгізу туралы'
