act_code: '21307'
requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 31 августа 2004 года № 324-I. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 сентября 2004 года № 3069. Утратил силу приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 5 февраля 2015 года № 110
title:
  rus: Об утверждении Правил осуществления контроля за соблюдением перевозчиками Правил перевозок пассажиров, багажа и грузобагажа железнодорожным транспортом Республики Казахстан, утвержденных постановлением Правительства Республики Казахстан от 14 июля 2011 года № 799 "Об утверждении Правил перевозок пассажиров, багажа и грузобагажа железнодорожным транспортом"
  kaz: '"Жолаушыларды, багажды және жүк-багажды темір жол көлігімен тасымалдау қағидасын бекіту туралы" Қазақстан Республикасы Үкіметінің 2011 жылғы 14 шілдедегі № 799 қаулысымен бекітілген Қазақстан Республикасында темір жол көлігімен жолаушыларды, багажды және жүк-багажын тасымалдау қағидаларын тасымалдаушылардың сақтауын бақылауды жүзеге асыру қағидаларын бекіту туралы'
