title:
  rus: Об утверждении Инструкции по проведению конкурса на основе открытого тендера по определению перевозчиков, осуществляющих железнодорожные пассажирские перевозки по социально значимым межобластным сообщениям, убытки которых подлежат субсидированию из республиканского бюджета
  kaz: Шығындары республикалық бюджеттен субсидиялануға жататын әлеуметті маңызды облысаралық қатынастар бойынша темір жолмен жолаушылар тасымалдарын жүзеге асыратын тасымалдаушыларды ашық тендер негізінде анықтау жөніндегі конкурсты өткізу жөніндегі нұсқаулықты бекіту туралы
