  title:
    rus: О внесении изменений и дополнений в приказ Министра транспорта и коммуникаций Республики Казахстан от 23 ноября 2004 года № 429а -I "Об утверждении Правил проведения конкурса на основе открытого тендера по определению перевозчиков, осуществляющих железнодорожные пассажирские перевозки по социально значимым межобластным сообщениям, убытки которых подлежат субсидированию из республиканского бюджета"
    kaz: '"Шығындары республикалық бюджеттен субсидиялануға жататын әлеуметтік маңызды облысаралық қатынастар бойынша темір жолмен жолаушылар тасымалдарын жүзеге асыратын тасымалдаушыларды ашық тендер негізінде анықтау жөніндегі конкурсты өткізу ережесін бекіту туралы" Қазақстан Республикасы Көлік және коммуникация министрінің 2004 жылғы 23 қарашадағы N 429а-І бұйрығына өзгерістер мен толықтырулар енгізу туралы'
