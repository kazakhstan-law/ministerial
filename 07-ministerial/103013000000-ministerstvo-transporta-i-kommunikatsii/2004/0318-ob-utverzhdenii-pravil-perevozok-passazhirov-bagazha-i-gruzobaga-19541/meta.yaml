title:
  rus: Об утверждении Правил перевозок пассажиров, багажа и грузобагажа железнодорожным транспортом Республики Казахстан
  kaz: Қазақстан Республикасының темір жол көлігімен жолаушыларды, багажды және жүк багажды тасымалдау ережесін бекіту туралы
