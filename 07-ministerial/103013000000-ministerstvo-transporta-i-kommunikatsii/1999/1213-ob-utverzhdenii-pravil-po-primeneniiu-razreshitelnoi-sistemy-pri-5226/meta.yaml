    kaz: '"Қазақстан Республикасында халықаралық автомобиль тасымалдарын жүзеге асыру кезінде рұқсат беру жүйесін қолдану жөніндегі ережені бекіту туралы" Қазақстан Республикасы Көлік және коммуникациялар министрінің 1999 жылғы 13 желтоқсандағы N 904-І бұйрығына (1027-нөмірмен тіркелген) өзгеріс енгізу туралы'
