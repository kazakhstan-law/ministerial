title:
  rus: Об утверждении Правил захода судов в порт и выхода их из порта, плавания судов в пределах акватории порта и стоянки в порту, а также пользования перевозчиками технологической связью
  kaz: Кемелердің портқа кіру мен порттан шығу, порт акваториясы шегінде кемелердің жүзу мен портта тұру, сондай-ақ тасымалдаушылардың технологиялық байланысты пайдалану ережесін бекіту туралы
