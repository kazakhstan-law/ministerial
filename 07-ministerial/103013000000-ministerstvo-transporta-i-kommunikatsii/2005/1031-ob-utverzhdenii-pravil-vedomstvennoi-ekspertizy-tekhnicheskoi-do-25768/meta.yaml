  title:
    rus: О внесении изменений в приказ Министра транспорта и коммуникаций Республики Казахстан от 31 октября 2005 года № 337-I "Об утверждении Правил проведения ведомственной экспертизы технической документации для капитального и среднего ремонта автомобильных дорог общего пользования Республики Казахстан"
    kaz: '"Қазақстан Республикасының жалпы пайдаланымдағы автомобиль жолдарын күрделi және орташа жөндеуге арналған техникалық құжаттамаға ведомстволық сараптама жүргiзу ережесiн бекiту туралы" Қазақстан Республикасы Көлік және коммуникация министрінің 2005 жылғы 31 қазандағы № 337-I бұйрығына өзгерістер енгізу туралы'
