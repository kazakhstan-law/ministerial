  title:
    rus: О внесении изменений в приказ Министра транспорта и коммуникаций Республики Казахстан от 31 октября 2005 года № 337-I «Об утверждении Правил ведомственной экспертизы технической документации для среднего ремонта автомобильных дорог общего пользования Республики Казахстан»
    kaz: «Қазақстан Республикасының жалпы пайдаланымдағы автомобиль жолдарын орташа жөндеуге арналған техникалық құжаттамаға ведомстволық сараптаманың ережесін бекіту туралы» Қазақстан Республикасы Көлік және коммуникация министрінің 2005 жылғы 31 қазандағы № 337-I бұйрығына өзгерістер енгізу туралы
