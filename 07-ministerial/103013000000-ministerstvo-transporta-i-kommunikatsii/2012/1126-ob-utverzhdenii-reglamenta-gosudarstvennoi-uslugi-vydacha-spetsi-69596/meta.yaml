act_code: '69596'
requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 26 ноября 2012 года N 819. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 декабря 2012 года N 8144. Утратил силу совместным приказом Министра транспорта и коммуникаций Республики Казахстан от 25 апреля 2014 года № 276 и Заместителя Премьер-Министра Республики Казахстан - Министра финансов Республики Казахстан от 30 апреля 2014 года № 198
title:
  rus: Об утверждении регламента государственной услуги "Выдача специального разрешения на проезд тяжеловесных и крупногабаритных транспортных средств (включая иностранные) по территории Республики Казахстан"
  kaz: '"Қазақстан Республикасының аумағы бойынша ауыр салмақты және ірі көлемді көлік құралдарының (шетелдіктерді қоса алғанда) жүріп өтуіне арнайы рұқсат беру" мемлекеттік қызмет регламентін бекіту туралы'
