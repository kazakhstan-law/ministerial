title:
  rus: Об утверждении регламента государственной услуги "Выдача бланков свидетельств о прохождении обязательного технического осмотра механических транспортных средств и прицепов к ним операторам технического осмотра"
  kaz: '"Механикалық көлік құралдары мен олардың тіркемелерінің міндетті техникалық байқаудан өткені туралы куәліктердің бланкілерін техникалық байқау операторларына беру" мемлекеттік қызмет регламентін бекіту туралы'
