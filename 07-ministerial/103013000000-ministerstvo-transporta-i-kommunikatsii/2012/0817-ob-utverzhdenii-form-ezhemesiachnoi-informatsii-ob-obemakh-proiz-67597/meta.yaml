  code: '77400'
  requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 26 декабря 2013 года № 1043. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 февраля 2014 года № 9119. Утратил силу приказом Министра информации и коммуникаций Республики Казахстан от 5 сентября 2017 года № 335 (вводится в действие после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в приказ Министра транспорта и коммуникаций Республики Казахстан от 17 августа 2012 года № 532 "Об утверждении форм ежемесячной информации об объемах производства (реализации), уровне доходности и отпускных ценах производимых (реализуемых) товаров (работ, услуг) субъектов регулируемых рынков в области телекоммуникаций и почтовой связи"
    kaz: '"Телекоммуникация және пошта байланысы саласындағы реттелетін нарық субъектілерінің өндіру (өткізу) көлемдері, табыстылық деңгейі және өндірілетін (өткізілетін) тауарлардың (жұмыстардың, көрсетілетін қызметтердің) босатылу бағалары туралы ай сайынғы ақпаратының нысандарын бекіту туралы" Қазақстан Республикасы Көлік және коммуникация министрінің 2012 жылғы 17 тамыздағы № 532 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/77400/rus
