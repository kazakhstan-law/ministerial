requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 17 августа 2012 года № 532. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 сентября 2012 года № 7914. Утратил силу приказом Министра информации и коммуникаций Республики Казахстан от 5 сентября 2017 года № 335 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении форм ежемесячной информации об объемах производства (реализации), уровне доходности и отпускных ценах производимых (реализуемых) товаров (работ, услуг) субъектов регулируемых рынков в области телекоммуникаций и почтовой связи
  kaz: Телекоммуникация және пошта байланысы саласындағы реттелетін нарық субъектілерінің өндіру (өткізу) көлемдері, табыстылық деңгейі және өндірілетін (өткізілетін) тауарлардың (жұмыстардың, көрсетілетін қызметтердің) босатылу бағалары туралы ай сайынғы ақпаратының нысандарын бекіту туралы
