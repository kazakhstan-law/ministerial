requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 25 июля 2012 года № 457. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 декабря 2012 года № 8177. Утратил силу приказом Председателя Агентства Республики Казахстан по связи и информации от 6 августа 2014 года № 186
title:
  rus: Об утверждении Методики оценки эффективности деятельности исполнительных органов, финансируемых из областного бюджета, бюджетов города республиканского значения, столицы, местных исполнительных органов районов (городов областного значения) по применению информационных технологий
  kaz: Ақпараттық технологияларды қолдану бойынша облыстық бюджеттен, республикалық маңызы бар қаланың, астананың, аудандардың (облыстық маңызы бар қалалардың) жергiлiктi атқарушы органдарының бюджеттерiнен қаржыландырылатын атқарушы органдар қызметiнiң тиiмдiлiгiн бағалау әдістемесін бекіту туралы
