requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 18 сентября 2012 года № 613. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 октября 2012 года № 8020. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 30 июня 2017 года № 409 (вводится в действие по истечении двадцати одного  календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил государственной регистрации гражданских воздушных судов Республики Казахстан, прав на них и сделок с ними, а также форм документов, удостоверяющих права на них
  kaz: Қазақстан Республикасы азаматтық әуе кемелерiн, оларға арналған құқықтарды және олармен жасалатын мәмiлелердi, сондай-ақ оларға құқықты куәландыратын құжаттар нысандарын мемлекеттiк тiркеу қағидаларын бекіту туралы
