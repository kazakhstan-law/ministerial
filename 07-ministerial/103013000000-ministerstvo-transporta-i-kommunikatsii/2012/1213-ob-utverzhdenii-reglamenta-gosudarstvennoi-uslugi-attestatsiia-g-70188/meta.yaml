requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 13 декабря 2012 года № 880. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 декабря 2012 года № 8240. Утратил силу приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 24 августа 2015 года № 877
title:
  rus: Об утверждении регламента государственной услуги "Аттестация государственных информационных систем и негосударственных информационных систем, интегрируемых с государственными информационными системами, на соответствие их требованиям информационной безопасности и принятым на территории Республики Казахстан стандартам"
  kaz: '"Мемлекеттік ақпараттық жүйелерді және мемлекеттік ақпараттық жүйелермен интеграцияланатын мемлекеттік емес ақпараттық жүйелерді олардың ақпараттық қауіпсіздік талаптарына және Қазақстан Республикасының аумағында қабылданған стандарттарға сәйкестігіне аттестаттау" мемлекеттік қызмет регламентін бекіту туралы'
