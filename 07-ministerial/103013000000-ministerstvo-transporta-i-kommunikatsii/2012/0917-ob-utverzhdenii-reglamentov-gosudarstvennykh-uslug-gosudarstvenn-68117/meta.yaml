requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 17 сентября 2012 года № 603. Зарегистрирован в Министерстве юстиции Республики Казахстан от 15 октября 2012 года № 8004. Утратил силу приказом и.о. Министра транспорта и коммуникаций Республики Казахстан от 3 апреля 2014 года № 221
title:
  rus: Об утверждении регламентов государственных услуг "Государственная регистрация морских судов в бербоут-чартерном реестре", "Государственная регистрация прав собственности на строящееся судно в реестре строящихся судов" и "Выдача разрешения на осуществление каботажа судами, плавающими под флагом иностранного государства"
  kaz: '"Теңіз кемелерін бербоут-чартер тізілімінде мемлекеттік тіркеу", "Салынып жатқан кемеге меншік құқықтарын салынып жатқан кемелер тізілімінде мемлекеттік тіркеу" және "Шет мемлекеттің туын көтерiп жүзетiн кемелердiң каботажды жүзеге асыруына рұқсат беру" мемлекеттік қызметтердің регламенттерін бекіту туралы'
