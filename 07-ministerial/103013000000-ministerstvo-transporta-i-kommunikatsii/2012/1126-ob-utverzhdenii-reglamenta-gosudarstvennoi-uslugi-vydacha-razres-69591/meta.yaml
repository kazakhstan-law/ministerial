requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 26 ноября 2012 года № 817. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 декабря 2012 года № 8138. Утратил силу приказом Министра транспорта и коммуникаций Республики Казахстан от 10 апреля 2014 года № 245
title:
  rus: Об утверждении регламента государственной услуги "Выдача разрешений на проезд по территории иностранного государства перевозчикам Республики Казахстан в соответствии с международными договорами, ратифицированными Республикой Казахстан"
  kaz: '"Қазақстан Республикасы ратификациялаған халықаралық шарттарға сәйкес Қазақстан Республикасының тасымалдаушыларына шетел мемлекеттері аумағы бойынша жүріп өтуіне рұқсаттар беру" мемлекеттік қызмет регламентін бекіту туралы'
