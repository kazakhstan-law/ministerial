act_code: '1088'
requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 20 июля 1995 г. N 146. Зарегистрирован в Министерстве юстиции Республики Казахстан 07.09.95 г. N 89. Действие Инструкции приостановлено приказом Министра транспорта и коммуникаций РК от 24.04.1996 г. N 94 (у.с. - приказом Министра транспорта и коммуникаций РК от 20.05.2005г. N 186-I), в части рассмотрения дел, предусмотренными статьями 169, 169-1 Кодекса КазССР об административных правонарушениях органами Транспортной инспекции. Утратил силу - приказом Министра транспорта и коммуникаций РК от 12 декабря 2000 года N 490-I
title:
  rus: Об утверждении Инструкции по производству дел об административных правонарушениях органами Транспортной инспекции Республики Казахстан Министерства транспорта и коммуникаций Республики Казахстан
  kaz: '"Қазақстан Республикасы Көлiк және коммуникациялар министрлiгi Көлiк инспекциясы органдарының әкiмшiлiк құқық бұзушылық жөнiндегi өндiрiстiк iстерi бойынша Нұсқаулықты бекiту туралы"'
