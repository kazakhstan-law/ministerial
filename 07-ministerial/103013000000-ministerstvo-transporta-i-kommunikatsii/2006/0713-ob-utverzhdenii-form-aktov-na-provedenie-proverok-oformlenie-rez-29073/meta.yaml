title:
  rus: Об утверждении форм актов на проведение проверок, оформление результатов проведенной проверки, необходимых учетных документов по учету случаев нарушений безопасности движения, предписаний на устранение выявленных нарушений
  kaz: Тексеру жүргізуге, жүргізілген тексеру нәтижелерін ресімдеуге арналған актілердің, жүру қауіпсіздігін бұзушылық жағдайларын есепке алу жөніндегі қажетті есеп құжаттарының, анықталған бұзушылықтарды жоюға нұсқамалардың нысандарын бекіту туралы
