requisite: Приказ Председателя Комитета транспортного контроля Министерства транспорта и коммуникаций Республики Казахстан от 15 мая 2001 года № 38-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 июля 2001 года № 1584. Утратил силу - приказом Председателя Комитета транспортного контроля Министерства транспорта и коммуникаций Республики Казахстан от 23 февраля 2004 года N 13-2-П
title:
  rus: Об утверждении Инструкции по производству дел об административных правонарушениях Комитетом транспортного контроля Министерства транспорта и коммуникаций Республики Казахстан и его территориальными органами
  kaz: Қазақстан Республикасы Көлік және коммуникациялар министрлігі Көліктік бақылау комитетінің және оның аумақтық органдарының әкімшілік құқық бұзушылықтары туралы іс жүргізу жөніндегі Нұсқаулығын бекіту туралы
