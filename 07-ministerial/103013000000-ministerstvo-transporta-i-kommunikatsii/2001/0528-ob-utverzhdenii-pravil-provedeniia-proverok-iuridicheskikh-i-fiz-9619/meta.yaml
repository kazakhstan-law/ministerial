  code: '17919'
  requisite: Приказ Председателя Комитета транспортного контроля Министерства транспорта и коммуникаций Республики Казахстан от 2 декабря 2003 года № 101-П.  Зарегистрирован в Министерстве юстиции Республики Казахстан 12 декабря 2003 года № 2611. Утратил силу приказом Председателя Комитета транспортного контроля Министерства транспорта и коммуникаций Республики Казахстан от 19 апреля 2006 года № 28-п
  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета транспортного контроля Министерства транспорта и коммуникаций Республики Казахстан от 29 мая 2001 года N 42-П "Об утверждении Правил проведения проверок юридических и физических лиц, осуществляющих перевозочную и другую деятельность на железнодорожном транспорте", зарегистрированный в Министерстве юстиции Республики Казахстан за N 1587
    kaz: '"Темір жол көлігінде тасымалдаушы және басқа да қызметті жүзеге асыратын заңды және жеке тұлғаларға тексеру жүргізу ережесін бекіту туралы" Қазақстан Республикасының Әділет министрлігінде N 1587 тіркелінген, Қазақстан Республикасының Көлік және коммуникациялар министрлігі Көліктік бақылау комитеті төрағасының 2001 жылғы 29 мамырдағы N 42-П бұйрығына өзгерістер мен толықтырулар енгізу туралы'
