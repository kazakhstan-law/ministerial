title:
  rus: Об утверждении Правил проведения проверок юридических и физических лиц, осуществляющих перевозочную и другую деятельность на железнодорожном транспорте
  kaz: Темiр жол көлiгiнде тасымалдаушылық және басқа да қызметтi жүзеге асыратын заңды және жеке тұлғаларға тексерулер жүргiзу ережесiн бекiту туралы
