  title:
    rus: О внесении изменений и дополнения в приказ Министра транспорта и коммуникаций Республики Казахстан от 24 января 2014 года № 56 "Об утверждении классификации видов работ, выполняемых при содержании, текущем, среднем и капитальном ремонтах автомобильных дорог общего пользования"
    kaz: '"Жалпыға пайдаланымдағы автомобиль жолдарын күтіп ұстау, ағымдағы, орташа және күрделі жөндеулер кезінде орындалатын жұмыстар түрлерін сыныптауды бекіту туралы" Қазақстан Республикасы Көлік және коммуникация министрінің  2014 жылғы 24 қаңтардағы № 56 бұйрығына өзгерістер мен толықтыру енгізу туралы'
