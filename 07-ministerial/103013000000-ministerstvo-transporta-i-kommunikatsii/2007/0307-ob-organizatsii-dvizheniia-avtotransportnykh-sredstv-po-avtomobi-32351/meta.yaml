requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 7 марта 2007 года № 59. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 марта 2007 года № 4568. Утратил силу приказом Министра транспорта и коммуникаций Республики Казахстан от 27 апреля 2012 года № 211
title:
  rus: Об организации движения автотранспортных средств по автомобильным дорогам общего пользования республиканского значения Республики Казахстан в дневное и вечернее время летнего периода
  kaz: Жаз мезгілінің күндізгі және кешкі уақытында Қазақстан Республикасының республикалық маңызы бар жалпы пайдаланымдағы автомобиль жолдары бойынша автокөлік құралдарының қозғалысын ұйымдастыру туралы
