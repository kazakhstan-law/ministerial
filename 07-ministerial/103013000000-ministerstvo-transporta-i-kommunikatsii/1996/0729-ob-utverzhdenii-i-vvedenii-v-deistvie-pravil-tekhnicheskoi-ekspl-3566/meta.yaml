act_code: '3566'
requisite: Приказ Министерства транспорта и коммуникаций Республики Казахстан от 30 июля 1996 года № 173 Зарегистрирован Министерством юстиции Республики Казахстан 10.09.1998 г. N 604. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 4 января 2023 года № 1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении и введении в действие "Правил технической эксплуатации и безопасности обслуживания средств радиосвязи и электронавигации на судах водного транспорта Республики Казахстан"
  kaz: '"Қазақстан Республикасының Су көлігі кемелерінде радиобайланыс және электр навигациясы құралдарын техникалық пайдалану мен қызмет көрсету қауіпсіздігі ережелерін" бекіту және күшіне енгізу туралы'
