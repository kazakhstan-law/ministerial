  title:
    rus: О внесении изменений и дополнения в некоторые приказы Министерства транспорта и коммуникаций Республики Казахстан и о признании утратившим силу приказа Министра транспорта и коммуникаций Республики Казахстан от 30 июля 1996 года № 173 «Об утверждении и введении в действие «Правил технической эксплуатации и безопасности обслуживания средств радиосвязи и электронавигации на судах водного транспорта Республики Казахстан»
    kaz: Қазақстан Республикасы Көлік және коммуникация министрлігінің кейбір бұйрықтарына өзгерістер мен толықтыру енгізу туралы және «Қазақстан Республикасының Су көлігі кемелерінде радиобайланыс және электр навигациясы құралдарын техникалық пайдалану мен қызмет көрсету қауіпсіздігі ережелерін» бекіту және күшіне енгізу туралы» Қазақстан Республикасы Көлік және коммуникация министрінің 1996 жылғы 30 шілдедегі № 173 бұйрығының күші жойылды деп тану туралы
