requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 17 марта 2011 года № 150. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 апреля 2011 года № 6872. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 29 ноября 2016 года № 824
title:
  rus: Об утверждении Программы подготовки и переподготовки авиационного персонала гражданской авиации, а также требований к владению английским языком в определенном объеме, используемом в радиотелефонной связи авиационным персоналом при выполнении международных полетов
  kaz: Азаматтық авиацияның авиация персоналын даярлау және қайта даярлау бағдарламаларын, сондай-ақ халықаралық ұшуларды орындаған кезде авиация персоналының радиотелефон байланысында пайдаланатын белгілі бір көлемдегі ағылшын тілін білуіне қойылатын талаптарды бекіту туралы
