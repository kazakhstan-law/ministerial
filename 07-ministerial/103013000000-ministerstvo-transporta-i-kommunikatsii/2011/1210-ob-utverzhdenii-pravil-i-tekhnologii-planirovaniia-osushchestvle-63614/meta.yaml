act_code: '63614'
requisite: Приказ и.о. Министра транспорта и коммуникаций Республики Казахстан от 10 декабря 2011 года № 726. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 декабря 2011 года № 7364. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 24 апреля 2017 года № 231 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и технологии планирования, осуществления перевозочного процесса, операций, связанных с перевозкой грузов, оформления документов и составления актов, производства специальных исследований и экспертиз
  kaz: Жүк тасымалдаумен байланысты тасымалдау үдерісін, операцияларды жүзеге асыру, құжаттарды ресімдеу және актілерді жасау, арнайы зерттеулер мен сараптамалар жүргізуді жоспарлаудың технологиясы мен қағидаларын бекіту туралы
