    kaz: Қазақстан Республикасы Көлік және коммуникация министрінің міндетін атқарушының, Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының және Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің кейбір бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
