act_code: '59394'
requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 29 апреля 2011 года № 242. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 июня 2011 года № 6989
title:
  rus: Об утверждении перечня должностей (профессий) работников железнодорожного транспорта, имеющих право ношения форменной одежды (без погон), образцов форменной одежды (без погон) и знаков различия, порядка ее ношения и норм обеспечения ею
  kaz: Нысанды киімді (погонсыз) киюге құқығы бар темір жол көлігі қызметкерлері лауазымдарының (кәсіптерінің) тізбесін, нысанды киімінің (погонсыз) үлгілері мен айырым белгілерін, оның кию тәртібін және онымен қамтамасыз ету нормаларын бекіту туралы
