  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра транспорта и коммуникаций Республики Казахстан от 16 мая 2011 года № 279 «Об утверждении Инструкции по организации и обслуживанию воздушного движения» и в приказ Министра по инвестициям и развитию Республики Казахстан от 14 июня 2017 года № 345 «Об утверждении Правил метеорологического обеспечения гражданской авиации»
    kaz: «Әуе қозғалысын ұйымдастыру және оған қызмет көрсету жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Көлік және коммуникация министрінің міндетін атқарушының 2011 жылғы 16 мамырдағы № 279 бұйрығына және «Азаматтық авиацияны метеорологиялық қамтамасыз ету қағидаларын бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрінің 2017 жылғы 14 маусымдағы № 345 бұйрығына өзгерістер мен толықтырулар енгізу туралы
