  title:
    rus: Об утверждении формы проверочного листа по организации и осуществлению деятельности, связанной с обслуживанием воздушного движения и радиотехническим обеспечением полетов в Республике Казахстан и внесении изменений и дополнений в приказ исполняющего обязанности Министра транспорта и коммуникаций Республики Казахстан от 16 мая 2011 года № 279 "Об утверждении Инструкции по организации и обслуживанию воздушного движения"
    kaz: Қазақстан Республикасында әуе қозғалысына қызмет көрсету және ұшуды радиотехникалық қамтамасыз етумен байланысты қызметті ұйымдастыру және жүзеге асыру бойынша тексеру парағының нысанын бекіту және "Әуе қозғалысын ұйымдастыру және оған қызмет көрсету жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Көлік және коммуникация министрінің міндетін атқарушының 2011 жылғы 16 мамырдағы № 279 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/80401/rus
