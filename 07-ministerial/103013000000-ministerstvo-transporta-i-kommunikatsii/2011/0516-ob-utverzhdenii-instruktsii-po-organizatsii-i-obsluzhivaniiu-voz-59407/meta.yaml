  title:
    rus: О внесении изменений и дополнений в приказ Министра транспорта и коммуникаций Республики Казахстан от 28 марта 2011 года № 173 "Об утверждении Типовых инструкций по управлению безопасностью полетов эксплуатантов гражданских воздушных судов, в аэропортах, при обслуживании воздушного движения, при техническом обслуживании воздушных судов" и в приказ исполняющего обязанности Министра транспорта и коммуникаций Республики Казахстан от 16 мая 2011 года № 279 "Об утверждении Инструкции по организации и обслуживанию воздушного движения"
    kaz: '"Әуе қозғалысына қызмет көрсету кезінде, әуе кемелеріне техникалық қызмет көрсету кезінде, әуежайларда азаматтық әуе кемелерін пайдаланушылардың ұшу қауіпсіздігін басқару жөніндегі үлгі нұсқаулықтарды бекіту туралы" Қазақстан Республикасы Көлік және коммуникация Министрінің 2011 жылғы 28 наурыздағы № 173 бұйрығына және "Әуе қозғалысын ұйымдастыру және оған қызмет көрсету жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Көлік және коммуникация Министрінің міндетін атқарушының 2011 жылғы 16 мамырдағы № 279 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/86914/rus
