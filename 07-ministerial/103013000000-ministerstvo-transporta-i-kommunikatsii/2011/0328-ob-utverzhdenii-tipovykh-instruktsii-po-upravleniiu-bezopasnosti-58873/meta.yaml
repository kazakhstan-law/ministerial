  title:
    rus: О внесении изменений и дополнения в приказ Министра транспорта и коммуникаций Республики Казахстан от 28 марта 2011 года № 173 «Об утверждении Типовых инструкций по управлению безопасностью полетов эксплуатантов гражданских воздушных судов, в аэропортах, при обслуживании воздушного движения, при техническом обслуживании воздушных судов»
    kaz: «Әуе қозғалысына қызмет көрсету кезінде, әуе кемелеріне техникалық қызмет көрсету кезінде әуежайларда азаматтық әуе кемелерін пайдаланушылардың ұшу қауіпсіздігін басқару жөніндегі үлгі нұсқаулықтарды бекіту туралы» Қазақстан Республикасы Көлік және коммуникация министрінің 2011 жылғы 28 наурыздағы № 173 бұйрығына өзгерістер мен толықтыру енгізу туралы
