act_code: '58873'
requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 28 марта 2011 года № 173. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 марта 2011 года № 6855
title:
  rus: Об утверждении Типовых инструкций по управлению безопасностью полетов эксплуатантов гражданских воздушных судов, в аэропортах, при обслуживании воздушного движения, при техническом обслуживании воздушных судов, авиационных учебных центров гражданской авиации, деятельность которых связана с выполнением полетов воздушных судов в ходе предоставления услуг
  kaz: Әуе қозғалысына қызмет көрсету кезінде, әуе кемелеріне техникалық қызмет көрсету кезінде, әуежайларда, азаматтық әуе кемелерін пайдаланушылардың, қызметі көрсетілетін қызметтерді ұсыну барысында әуе кемелерінің ұшуын орындаумен байланысты азаматтық авиацияның авиациялық оқу орталықтарының ұшу қауіпсіздігін басқару жөніндегі үлгі нұсқаулықтарды бекіту туралы
