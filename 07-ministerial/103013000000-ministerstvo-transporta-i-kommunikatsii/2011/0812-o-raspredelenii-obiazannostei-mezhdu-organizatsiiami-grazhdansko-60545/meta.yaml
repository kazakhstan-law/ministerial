act_code: '60545'
requisite: Приказ и.о. Министра транспорта и коммуникаций Республики Казахстан от 12 августа 2011 года № 509. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 сентября 2011 года № 7183. Утратил силу приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 28 ноября 2016 года № 818
title:
  rus: О распределении обязанностей между организациями гражданской авиации и структурными подразделениями Министерства транспорта и коммуникаций Республики Казахстан по подготовке исходных данных, которые требуются службе управления аэронавигационной информации для включения в сборник аэронавигационной информации Республики Казахстан
  kaz: Қазақстан Республикасының аэронавигациялық ақпараттар жинағына енгізу үшін аэронавигациялық ақпаратты басқару қызметіне қажет бастапқы деректерді дайындау бойынша міндеттерді азаматтық авиация ұйымдары мен Қазақстан Республикасы Көлік және коммуникация министрлігінің құрылымдық бөлімшелері арасында бөлу туралы
