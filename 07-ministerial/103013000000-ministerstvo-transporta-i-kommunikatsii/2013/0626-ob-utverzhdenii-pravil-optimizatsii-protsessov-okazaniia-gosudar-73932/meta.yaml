requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 26 июня 2013 года № 490. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 июля 2013 года № 8584. Утратил силу приказом и.о. Министра по инвестициям и развитию Республики Казахстан от 18 февраля 2015 года № 133
title:
  rus: Об утверждении Правил оптимизации процессов оказания государственных услуг, осуществляемой центральными государственными органами, местными исполнительными органами областей, городов республиканского значения, столицы, районов, городов областного значения, акимами районов в городе, городов районного значения, поселков, сел, сельских округов на постоянной основе
  kaz: Орталық мемлекеттік органдар, облыстардың, республикалық маңызы бар қалалардың, астананың, аудандардың, облыстық маңызы бар қалалардың жергілікті атқарушы органдары, қаладағы аудандардың, аудандық маңызы бар қалалардың, кенттердің, ауылдардың, ауылдық округтердің әкімдері жүзеге асыратын мемлекеттік көрсетілетін қызметтерді көрсету процестерін оңтайландыру қағидаларын бекіту туралы
