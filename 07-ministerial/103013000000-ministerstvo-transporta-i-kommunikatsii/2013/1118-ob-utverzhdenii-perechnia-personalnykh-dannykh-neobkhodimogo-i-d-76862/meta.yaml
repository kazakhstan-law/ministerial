requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 18 ноября 2013 года № 899. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 декабря 2013 года № 8962. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 22 января 2018 года № 42 (вводится в действие по истечении десяти календарных дней после его первого официального опубликования)
title:
