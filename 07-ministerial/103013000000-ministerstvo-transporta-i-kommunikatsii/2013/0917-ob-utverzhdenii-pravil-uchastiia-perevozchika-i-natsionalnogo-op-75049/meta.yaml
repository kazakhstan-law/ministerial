act_code: '75049'
requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 17 сентября 2013 года № 721. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 октября 2013 г. № 8825. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 28 апреля 2016 года № 409
title:
  rus: Об утверждении Правил участия перевозчика и Национального оператора инфраструктуры при проверке соблюдения требований безопасности движения по подъездным путям, а также осуществлении физическими и юридическими лицами деятельности по погрузке, выгрузке (разгрузке) багажа, грузов и грузобагажа
  kaz: Кірме жолдармен жүру қауiпсiздiгі талаптарының сақталуын тексеру, сондай-ақ жеке және заңды тұлғалардың багажды, жүктер мен жүк-багажды тиеу, түсіру (босату) жөніндегі қызметті жүзеге асыруы кезінде тасымалдаушы мен Ұлттық инфрақұрылым операторының қатысу қағидаларын бекіту туралы
