  title:
    rus: О внесении изменений в приказ Министра транспорта и коммуникаций Республики Казахстан от 22 января 2013 года № 50 «Об утверждении перечня должностей (профессий) работников государственного контроля и надзора и работников в сфере внутреннего водного транспорта, имеющих право ношения форменной одежды (без погон), образцов форменной одежды (без погон) и знаков различия, а также порядка ее ношения»
    kaz: «Нысанды киім (погонсыз) киiп жүруге құқығы бар мемлекеттiк бақылау мен қадағалау жұмыскерлері және ішкі су көлігі саласындағы жұмыскерлер лауазымдарының (кәсіптерінің) тізбесін, нысанды киiмнің (погонсыз) және айырым белгiлерiнің үлгiлерiн, сондай-ақ оны киiп жүру тәртiбiн бекіту» Қазақстан Республикасы Көлік және коммуникация министрінің 2013 жылғы 22 қаңтардағы № 50 бұйрығына өзгерістер енгізу туралы
