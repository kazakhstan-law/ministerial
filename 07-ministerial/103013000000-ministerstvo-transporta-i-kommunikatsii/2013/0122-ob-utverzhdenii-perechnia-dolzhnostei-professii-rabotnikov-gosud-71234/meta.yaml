  title:
    rus: О внесении изменений и дополнений в приказ Министра транспорта и коммуникаций Республики Казахстан от 22 января 2013 года № 50 «Об утверждении образцов форменной одежды (без погон) и знаков различия, порядка ношения и перечня должностей работников органов государственного транспортного контроля, имеющих право ее ношения»
    kaz: «Мемлекеттік көліктік бақылау органдарының оны кию құқығы бар қызметкерлерінің нысанды киімдерінің (погондары жоқ) және айыру белгілерінің үлгерін, кию тәртібін, онымен қамтамасыз ету нормаларын және лауазымдарының тізбесін бекіту туралы» Қазақстан Республикасы Көлік және коммуникация министрінің 2013 жылғы 22 қаңтардағы № 50 бұйрығына өзгерістер мен толықтырулар енгізу туралы
