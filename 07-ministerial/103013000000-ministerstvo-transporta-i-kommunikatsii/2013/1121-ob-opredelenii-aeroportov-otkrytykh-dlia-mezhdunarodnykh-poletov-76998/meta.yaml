title:
  rus: Об определении аэропортов, открытых для международных полетов государственных и экспериментальных воздушных судов иностранных государств, а также международных полетов воздушных судов для перевозки воинских формирований, вооружений и военной техники иностранных государств
  kaz: Шет мемлекеттердің мемлекеттік және эксперименттік әуе кемелерінің халықаралық ұшуларына, сондай-ақ әуе кемелерінің халықаралық ұшулармен шет мемлекеттердің әскери құрылымдарын, қарулары мен әскери техникаларын тасымалдауға ашық әуежайларды анықтау туралы
