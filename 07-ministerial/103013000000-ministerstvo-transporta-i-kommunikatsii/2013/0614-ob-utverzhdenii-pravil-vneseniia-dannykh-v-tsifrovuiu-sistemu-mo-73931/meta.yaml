  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра транспорта и коммуникаций Республики Казахстан от 14 июня 2013 № 452 «Об утверждении Правил внесения данных в информационную систему мониторинга оказания государственных услуг о стадии оказания государственной услуги»
    kaz: «Мемлекеттік көрсетілетін қызметтерді көрсету мониторингінің ақпараттық жүйесіне мемлекеттік көрсетілетін қызметті көрсету сатысы туралы деректер енгізу қағидаларын бекіту туралы» Қазақстан Республикасы Көлік және коммуникация министрінің міндетін атқарушының 2013 жылғы 14 маусымдағы № 452 бұйрығына өзгерістер енгізу туралы
