requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 11 марта 2013 года № 162. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 марта 2013 года № 8395. Утратил силу приказом и.о. Министра транспорта Республики Казахстан от 12 ноября 2024 года № 372 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
