requisite: Приказ Министра транспорта и коммуникаций Республики Казахстан от 23 октября 2013 года № 827. Зарегистрирован в Министерстве юстиции Республики Казахстан от 9 декабря 2013 года № 8938. Утратил силу приказом Министра по инвестициям и развитию Республики Казахстан от 30 июня 2017 года № 407 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил исчисления стажа работы по специальности работников организаций водных путей и Республиканского государственного казенного предприятия "Регистр судоходства Казахстана" Министерства транспорта и коммуникаций Республики Казахстан, не являющихся государственными служащими
  kaz: Мемлекеттік қызметші емес су жолдары ұйымдарының және Қазақстан Республикасы Көлік және коммуникация министрлігінің "Қазақстан кеме қатынасының тіркелімі" республикалық мемлекеттік қазыналық кәсіпорны қызметкерлерінің мамандықтары бойынша жұмыс өтілін есептеу қағидаларын бекіту туралы
