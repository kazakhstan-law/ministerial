title:
  rus: Об утверждении правил осуществления платных видов деятельности по реализации товаров (работ, услуг) государственными учреждениями, деньги от реализации которых остаются в их распоряжении, использования денег от реализации государственными учреждениями товаров (работ, услуг), остающихся в их распоряжении
  kaz: Өткізуден түскен ақша өз иелігінде қалатын мемлекеттік мекемелердің тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуі бойынша ақылы қызмет түрлерін жүзеге асыру, мемлекеттік мекемелердің тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуінен түскен, өз иелігінде қалатын ақшаны пайдалану қағидаларын бекіту туралы
