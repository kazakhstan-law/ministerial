act_code: '228308'
requisite: Приказ Заместителя Премьер-Министра - Министра культуры и информации Республики Казахстан от 29 июля 2026 года № 366-НҚ
title:
  rus: О размещении и распределении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным, послесредним образованием в организациях образования в области культуры финансируемых из республиканского бюджета на 2026 – 2027 учебный год
  kaz: Республикалық бюджеттен қаржыландырылатын мәдениет саласындағы білім беру ұйымдарында жоғары және жоғары оқу орнынан кейінгі білімі бар, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар мамандарды даярлауға 2026 – 2027 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру және бөлу туралы
