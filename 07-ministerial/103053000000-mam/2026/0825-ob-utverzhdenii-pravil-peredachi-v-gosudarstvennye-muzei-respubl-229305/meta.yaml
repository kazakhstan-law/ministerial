act_code: '229305'
requisite: Приказ и.о. Министра культуры и информации Республики Казахстан от 25 августа 2026 года № 409-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 августа 2026 года № 39685
title:
  rus: Об утверждении правил передачи в государственные музеи Республики Казахстан всех индивидуальных археологических находок, полученных физическими и юридическими лицами Республики Казахстан и других государств в результате археологических работ на территории Республики Казахстан и передачи в государственные музеи Республики Казахстан археологических находок, обнаруженных физическими лицами на территории Республики Казахстан вне археологических работ
  kaz: Қазақстан Республикасының аумағындағы археологиялық жұмыстар нәтижесінде Қазақстан Республикасының және басқа мемлекеттердің жеке және заңды тұлғалары тапқан барлық жеке-дара археологиялық олжаларды Қазақстан Республикасының мемлекеттік музейлеріне беру және жеке тұлғалар Қазақстан Республикасының аумағында археологиялық жұмыстардан тыс тапқан археологиялық олжаларды Қазақстан Республикасының мемлекеттік музейлеріне беру қағидаларын бекіту туралы
