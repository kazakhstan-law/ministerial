title:
  rus: Об утверждении Правил учета мнения населения соответствующей территории при наименовании, переименовании административно-территориальных единиц, составных частей населенных пунктов, а также уточнении и изменении транскрипции их наименований
  kaz: Әкімшілік-аумақтық бірліктерге, елді мекендердің құрамдас бөліктеріне атау беру, оларды қайта атау, сондай-ақ олардың атауларының транскрипциясын нақтылау мен өзгерту кезінде тиісті аумақ халқының пікірін ескеру қағидаларын бекіту туралы
