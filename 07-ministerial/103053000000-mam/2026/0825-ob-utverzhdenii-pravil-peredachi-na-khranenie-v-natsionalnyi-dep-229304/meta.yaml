title:
  rus: Об утверждении Правил передачи на хранение в Национальный депозитарий массовых археологических находок и археологических материалов и включения в Государственный фонд массовых археологических находок и археологических материалов всех массовых археологических находок и археологических материалов, полученных физическими или юридическими лицами Республики Казахстан и других государств в результате археологических работ на территории Республики Казахстан
  kaz: Қазақстан Республикасының аумағындағы археологиялық жұмыстар нәтижесінде Қазақстан Республикасының және басқа мемлекеттердің жеке немесе заңды тұлғалары тапқан барлық жалпы археологиялық олжалар мен археологиялық материалдарды  Жалпы археологиялық олжалар мен археологиялық материалдардың ұлттық депозитарийіне сақтауға беру және Жалпы археологиялық олжалар мен археологиялық материалдардың мемлекеттік қорына қосу қағидаларын бекіту туралы
