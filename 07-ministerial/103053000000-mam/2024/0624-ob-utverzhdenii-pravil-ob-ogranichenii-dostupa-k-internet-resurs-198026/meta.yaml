title:
  rus: Об утверждении Правил об ограничении доступа к интернет-ресурсам, иностранным онлайн-платформам и сервисам обмена мгновенными сообщениями по предписанию уполномоченного органа в области средств массовой информации
  kaz: Бұқаралық ақпарат құралдары саласындағы уәкілетті органның нұсқамасы бойынша интернет-ресурстарға, шетелдік онлайн-платформаларға және лездік хабарлар алмасу сервистеріне қолжетімділікті шектеу туралы қағидаларды бекіту туралы
