title:
  rus: Об утверждении Правил предоставления, контроля, мониторинга и оценки эффективности субсидирования части затрат операторов спутникового телерадиовещания, за исключением национального оператора телерадиовещания, на реализацию спутниковых приемных устройств
  kaz: Телерадио хабарларын таратудың ұлттық операторын қоспағанда, спутниктік телерадио хабарларын тарату операторларының спутниктік қабылдау құрылғыларын өткізуге арналған шығындарының бір бөлігін субсидиялауды ұсыну, бақылау, мониторингтеу және оның тиімділігін бағалау қағидаларын бекіту туралы
