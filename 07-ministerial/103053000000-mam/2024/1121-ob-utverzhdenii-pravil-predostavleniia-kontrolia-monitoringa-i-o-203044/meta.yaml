  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра культуры и информации Республики Казахстан от 21 ноября 2024 года № 551-НҚ «Об утверждении Правил предоставления, контроля, мониторинга и оценки эффективности субсидирования части затрат операторов спутникового телерадиовещания, за исключением национального оператора телерадиовещания, на реализацию спутниковых приемных устройств»
    kaz: «Телерадио хабарларын таратудың ұлттық операторын қоспағанда, спутниктік телерадио хабарларын тарату операторларының спутниктік қабылдау құрылғыларын өткізуге арналған шығындарының бір бөлігін субсидиялауды ұсыну, бақылау, мониторингтеу және оның тиімділігін бағалау қағидаларын бекіту туралы» Қазақстан Республикасы Мәдениет және ақпарат министрінің міндетін атқарушының 2024 жылғы 21 қарашадағы № 551-НҚ бұйрығына өзгерістер енгізу туралы
