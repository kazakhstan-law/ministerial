  title:
    rus: О внесении изменений в приказ Министра культуры и информации Республики Казахстан от 31 июля 2024 года № 336-НҚ «О размещении и распределении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным, послесредним образованием в организациях образования в области культуры финансируемых из республиканского бюджета на 2024 – 2025 учебный год»
    kaz: «Республикалық бюджеттен қаржыландырылатын мәдениет саласындағы білім беру ұйымдарында жоғары және жоғары оқу орнынан кейінгі білімі бар, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар мамандарды даярлауға 2024 – 2025 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру және бөлу туралы» Қазақстан Республикасы Мәдениет және ақпарат министрінің 2024 жылғы 31 шілдедегі № 336-НҚ бұйрығына өзгерістер енгізу туралы
