requisite: Приказ и.о. Министра культуры и информации Республики Казахстан от 7 июня 2024 года № 236-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 июня 2024 года № 34483
title:
  rus: Об утверждении формы, предназначенной для сбора административных данных обучающихся основного среднего, технического и профессионального, высшего образования в области культуры и искусства «Сведения о победителях республиканских и международных конкурсов и фестивалей»
  kaz: «Республикалық және халықаралық конкурстар мен фестивальдардың жеңімпаздары туралы мәліметтер» мәдениет және өнер саласындағы негізгі орта, техникалық және кәсіптік, жоғары білім алушылардың әкімшілік деректерін жинауға арналған нысанды бекіту туралы
