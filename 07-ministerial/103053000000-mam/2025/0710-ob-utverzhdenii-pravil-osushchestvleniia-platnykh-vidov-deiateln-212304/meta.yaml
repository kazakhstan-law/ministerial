  title:
    rus: О внесении дополнения в приказ Министра культуры и информации Республики Казахстан от 10 июля 2025 года № 312-НҚ «Об утверждении Правил осуществления платных видов деятельности по реализации товаров (работ, услуг) государственными библиотеками, государственными музеями и музеями-заповедниками, созданными в организационно-правовой форме государственного учреждения, использования ими денег от реализации товаров (работ, услуг), остающихся в их распоряжении»
    kaz: «Мемлекеттік мекеменің ұйымдық-құқықтық нысанында құрылған мемлекеттік кітапханалардың, мемлекеттік музейлер мен музей-қорықтардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуі бойынша ақылы қызмет түрлерін жүзеге асыру, олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуінен түсетін, өз иелігінде қалатын ақшаны пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Мәдениет және ақпарат министрінің 2025 жылғы 10 шiлдедегi № 312-НҚ бұйрығына толықтыру енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/222539/rus
