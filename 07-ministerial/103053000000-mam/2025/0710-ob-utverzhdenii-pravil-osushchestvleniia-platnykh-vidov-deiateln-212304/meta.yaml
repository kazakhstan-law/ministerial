act_code: '212304'
requisite: Приказ Министра культуры и информации Республики Казахстан от 10 июля 2025 года № 312-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 июля 2025 года № 36435
title:
  rus: Об утверждении Правил осуществления платных видов деятельности по реализации товаров (работ, услуг) государственными библиотеками, государственными музеями и музеями-заповедниками, созданными в организационно-правовой форме государственного учреждения, использования ими денег от реализации товаров (работ, услуг), остающихся в их распоряжении
  kaz: Мемлекеттік мекеменің ұйымдық-құқықтық нысанында құрылған мемлекеттік кітапханалардың, мемлекеттік музейлер мен музей-қорықтардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуі бойынша ақылы қызмет түрлерін жүзеге асыру, олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуінен түсетін, өз иелігінде қалатын ақшаны пайдалану қағидаларын бекіту туралы
