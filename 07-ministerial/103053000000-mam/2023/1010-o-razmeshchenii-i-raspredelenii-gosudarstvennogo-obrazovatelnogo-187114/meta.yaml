requisite: Приказ Министра культуры и информации Республики Казахстан от 10 октября 2023 года № 396-НҚ
title:
  rus: О размещении и распределении государственного образовательного заказа на подготовку кадров с высшим и послевузовским образованием, а также с техническим и профессиональным, послесредним образованием в организациях образования в области культуры финансируемых из республиканского бюджета на 2023 – 2024 учебный год
  kaz: Республикалық бюджеттен қаржыландырылатын мәдениет саласындағы білім беру ұйымдарында жоғары және жоғары оқу орнынан кейінгі білімі бар, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар кадрларды даярлауға 2023 – 2024 оқу жылына арналған мемлекеттік білім беру тапсырысын орналастыру және бөлу туралы
