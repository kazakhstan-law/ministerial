    kaz: '"Экономиканың басым секторларында инвестициялық қызметті жүзеге асырушы инвесторлармен келісім-шарт жасау кезінде жеңілдіктер мен преференциялар беру рәсімдерін жетілдіру туралы" Инвестициялар жөнінде Қазақстан Республикасының Агенттік Төрағасының бұйрығына өзгерістер енгізу туралы'
