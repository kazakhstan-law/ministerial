act_code: '5845'
requisite: Приказ Председателя Агентства Республики Казахстан по инвестициям от 14 апреля 2000 года N 01/7. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 апреля 2000 года N 1120. Утратил силу - приказом Председателя Комитета по инвестициям Министерства индустрии и торговли Республики Казахстан от 18 марта 2003 года N 18-п (V032222)
title:
  rus: О совершенствовании процедуры предоставления льгот и преференций при заключении контрактов с инвесторами, осуществляющими инвестиционную деятельность в приоритетных секторах экономики
  kaz: Экономиканың басым секторларында инвестициялық қызметтi жүзеге асырушы инвесторлармен келiсiм-шарт жасау кезiнде жеңiлдiктер мен пұрсаттылық беру рәсiмдерiн жетiлдiру туралы
