  title:
    rus: О внесении дополнения в приказ Председателя Агентства Республики Казахстан по инвестициям от 14 апреля 2000 года N 01/7 "О совершенствовании процедуры предоставления льгот и преференции при заключении контрактов с инвесторами, осуществляющими инвестиционную деятельность в приоритетных секторах экономики"
    kaz: Қазақстан Республикасының Инвестициялар жөнiндегi агенттiгi Төрағасының 2000 жылғы 14 сәуiрдегi N 01/7 "Экономиканың басым секторларында инвестициялық қызмет көрсететiн инвесторлармен келiсiм-шарт жасасқанда берiлетiн жеңiлдiктер мен преференцияларды беру процесiн жетiлдiру туралы" бұйрығына өзгерту енгiзу туралы
