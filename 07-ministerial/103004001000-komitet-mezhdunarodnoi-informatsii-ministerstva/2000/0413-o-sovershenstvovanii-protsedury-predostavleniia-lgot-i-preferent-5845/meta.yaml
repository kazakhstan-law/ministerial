  title:
    rus: О внесении дополнения и изменения в Приказ Агентства Республики Казахстан по инвестициям от 14 апреля 2000 года № 01/7 "О совершенствовании процедуры предоставления льгот и преференций при заключении контрактов с инвесторами, осуществляющими инвестиционную деятельность в приоритетных секторах экономики"
    kaz: Қазақстан Республикасының инвестициялар жөнiндегi агентiгiнiң 2000 жыл сәуiрдiң № 01/7 Бұйрығына енгiзiлген толықтырулар және өзгертулер туралы "Экономиканың басым секторларында инвестициялық қызмет көрсететiн инвесторлармен келiсiм-шарт жасағанда берiлетiн жеңiлдiктер мен преференцияларды беру процесiн жетiлдiру туралы"
