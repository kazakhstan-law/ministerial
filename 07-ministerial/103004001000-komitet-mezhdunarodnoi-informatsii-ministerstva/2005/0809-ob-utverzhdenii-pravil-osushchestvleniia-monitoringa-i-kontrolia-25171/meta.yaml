requisite: Приказ Председателя Комитета по инвестициям Министерства индустрии и торговли Республики Казахстан от 9 августа 2005 года N 59-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 августа 2005 года за N 3818. Утратил силу приказом Председателя Комитета по инвестициям Министерства индустрии и торговли Республики Казахстан от 20 апреля 2006 года N 32-п
title:
  rus: Об утверждении Правил осуществления мониторинга и контроля за соблюдением условий контрактов на осуществление инвестиций, предусматривающих инвестиционные преференции
  kaz: Инвестициялық преференцияларды көздейтін, инвестицияларды жүзеге асыруға арналған келісім-шарттардың шарттарын сақтаудың мониторингі мен бақылауын жүзеге асыру ережесін бекіту туралы
