act_code: '3428'
requisite: Приказ Министра государственных доходов Республики Казахстан от 19 мая 1999 года № 519. Зарегистрирован в Министерстве юстиции Республики Казахстан 26.06.1999г. N 826. Утратил силу - приказом Министра государственных доходов РК от 9.04.2002 № 416 (извлечение из приказа см. ниже).
title:
  rus: О внесениии изменений и дополнений в Инструкцию Главной налоговой инспекции Министерства финансов Республики Казахстан "О порядке исчисления и уплаты налога на добавленную стоимость" от 26.06.95 года № 37 ~V950077
  kaz: '"Ойын бизнесі субъектілерінің оңайлатылған салық салу режимі туралы" Қазақстан Республикасы Мемлекеттік кіріс министрлігінің Нұсқауын, "Қосылған құн салығын есептеу және төлеу тәртібі туралы" Қазақстан Республикасы Қаржы министрлігі Бас салық инспекциясының N 37 Нұсқауына және "Әлеуметтік салықты есептеу және төлеу тәртібі туралы" Қазақстан Республикасы Мемлекеттік кіріс министрлігінің N 46 Нұсқауына өзгерістер мен толықтыруларды" бекіту туралы'
