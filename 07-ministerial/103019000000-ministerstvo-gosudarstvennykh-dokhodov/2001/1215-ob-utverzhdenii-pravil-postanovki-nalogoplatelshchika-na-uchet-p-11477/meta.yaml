act_code: '11477'
requisite: Приказ Министра государственных доходов Республики Казахстан от 15 декабря 2001 года N 1736. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 февраля 2002 года N 1781. Утратило силу - приказом Председателя Налогового комитета Министерства финансов РК от 25 марта 2007 года N 157
title:
  rus: Об утверждении Правил постановки налогоплательщика на учет по налогу на добавленную стоимость, выдачи свидетельства о постановке на учет по налогу на добавленную стоимость и снятия с учета по налогу на добавленную стоимость плательщика налога на добавленную стоимость
  kaz: Салық төлеушіні қосылған құн салығы бойынша есепке қою, қосылған құн салығы бойынша есепке қою туралы куәлікті беру және қосылған құн салығын төлеушіні қосылған құн салығы бойынша есептен шығару ережелерін бекіту туралы
