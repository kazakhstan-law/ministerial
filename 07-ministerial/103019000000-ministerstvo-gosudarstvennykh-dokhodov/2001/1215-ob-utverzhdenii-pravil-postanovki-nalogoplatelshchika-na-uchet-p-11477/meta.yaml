  title:
    rus: О внесении изменений и дополнений в приказ Министра государственных доходов Республики Казахстан от 15 декабря 2001 года N 1736 "Об утверждении Правил постановки налогоплательщиков на учет по налогу на добавленную стоимость и выдачи Свидетельства о постановке на учет по налогу на добавленную стоимость" N 1781
    kaz: '"Қосылған құн салығы бойынша салық төлеушіні есепке қою және қосылған құн салығы бойынша есепке қою туралы куәлікті беру ережелерін бекіту туралы" Қазақстан Республикасы Мемлекеттік кіріс министрінің 2001 жылғы 15 желтоқсандағы N 1736 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
