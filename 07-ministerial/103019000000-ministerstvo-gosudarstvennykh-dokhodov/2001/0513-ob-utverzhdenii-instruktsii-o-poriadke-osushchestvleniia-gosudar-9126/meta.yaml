requisite: Приказ Министра государственных доходов Республики Казахстан от 14 мая 2001 года № 590. Зарегистрирован в Министерстве юстиции Республики Казахстан 04 июня 2001 года за № 1528. Утратил силу - совместным приказом Председателя Налогового комитета Министерства финансов Республики Казахстан от 11 августа 2003 года № 325 и Председателя Агентства таможенного контроля Республики Казахстан от 13 августа 2003 года № 386
title:
