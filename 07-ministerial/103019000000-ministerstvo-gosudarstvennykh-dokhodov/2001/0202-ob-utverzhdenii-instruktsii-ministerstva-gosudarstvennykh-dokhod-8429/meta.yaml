    kaz: Қазақстан Республикасы Мемлекеттік Кіріс министрінің 2001 жылғы 2 ақпандағы N 117 бұйрығымен бекітілген қосылған құн салығын есептеу мен төлеу тәртібі туралы Қазақстан Республикасы Мемлекеттік кіріс министрлігінің Нұсқаулылығына Өзгерістер мен толықтыруларды бекіту туралы
