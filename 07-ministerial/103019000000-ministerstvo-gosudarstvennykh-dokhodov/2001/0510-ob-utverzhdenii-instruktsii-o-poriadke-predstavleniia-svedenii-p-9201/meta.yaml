  title:
    rus: О внесении изменения и дополнений в приказ Министра государственных доходов Республики Казахстан от 11 мая 2001 г. N 562 "Об утверждении Инструкции Министерства государственных доходов Республики Казахстан "О порядке представления сведений по остаткам товарно- материальных ценностей, приобретенных до 1 июля 2001 года, и зачета налога на добавленную стоимость"
    kaz: Қазақстан Республикасы Мемлекеттiк кiрiс министрлiгiнiң 2001 жылғы 11 мамырдағы Қазақстан Республикасы Мемлекеттiк кiрiс министрлігiнiң "2001 жылдың 1 шiлдесiне дейiн сатып алынған тауарлық-материалдық құндылықтардың қалдықтары бойынша мәлiметтер және қосылған құн салығының есебiн беру туралы" Нұсқаулықты бекiту туралы" N 562 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы
