act_code: '9201'
requisite: Приказ Министра государственных доходов Республики Казахстан от 11 мая 2001 года N 562. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 июня 2001 года за N 1545.  Утратил силу - приказом Министра государственных доходов РК от 9.04.2002 № 416 (извлечение из приказа см. ниже).
title:
  rus: Об утверждении Инструкции "О порядке представления сведений по остаткам товарно-материальных ценностей, приобретенных до 1 июля 2001 года, и зачета налога на добавленную стоимость"
  kaz: '"2001 жылдың шiлдесiне дейiн сатып алынған тауарлық-материалдық құндылықтар және қосылған құн салығы бойынша мәлiметтердi беру тәртiбi туралы" Нұсқаулықты бекіту туралы'
