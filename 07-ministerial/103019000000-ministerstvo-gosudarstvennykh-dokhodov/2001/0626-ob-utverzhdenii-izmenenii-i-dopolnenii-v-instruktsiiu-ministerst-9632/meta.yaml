title:
  rus: Об утверждении Изменений и дополнений в Инструкцию Министерства государственных доходов Республики Казахстан о порядке исчисления и уплаты налога на добавленную стоимость, утвержденную приказом Министра государственных доходов Республики Казахстан от 2 февраля 2001 года N 117
