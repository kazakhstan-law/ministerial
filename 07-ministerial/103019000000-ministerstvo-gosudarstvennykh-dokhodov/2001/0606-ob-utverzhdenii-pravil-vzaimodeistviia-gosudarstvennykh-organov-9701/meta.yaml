act_code: '9701'
requisite: Приказ Министра государственных доходов от 7 июня 2001 года № 717. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 июля 2001 года № 1588. Утратил силу совместным приказом Министра финансов Республики Казахстан от 27 марта 2015 года № 220 и и.о. Министра национальной экономики Республики Казахстан от 27 марта 2015 года № 256
title:
  rus: Об утверждении Правил взаимодействия государственных органов при проведении таможенного оформления товаров, ввозимых на таможенную территорию Республики Казахстан по линии государств, правительств, международных организаций, в качестве безвозмездной финансовой и технической помощи
  kaz: Тегін қаржылай және техникалық көмек ретінде мемлекеттер, үкіметтер, халықаралық ұйымдар желісі бойынша Қазақстан Республикасының кеден аумағына әкелінетін тауарларға кедендік ресімдеу жүргізу кезінде мемлекеттік органдардың өзара іс-әрекетінің ережесін бекіту туралы
