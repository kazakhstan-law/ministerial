title:
  rus: Об утверждении Инструкции "Об упрощенном режиме налогообложения для юридических лиц - производителей сельскохозяйственной продукции <*> Сноска. Название с изменениями - приказом Министра государственных доходов РК от 15 августа 2001 года N 1158 ~V011674.
  kaz: '"Ауыл шаруашылығы өнiмдерiн өндiрушi заңды тұлғалар үшiн салық салудың оңайлатылған режимi туралы" Нұсқаулықты бекiту туралы"'
