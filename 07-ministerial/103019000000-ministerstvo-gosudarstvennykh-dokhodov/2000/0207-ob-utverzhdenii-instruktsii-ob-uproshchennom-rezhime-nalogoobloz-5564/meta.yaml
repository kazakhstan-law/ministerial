  code: '10439'
  requisite: Приказ Министра государственных доходов Республики Казахстан от 15 августа 2001 года N 1158. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 ноября 2001 года N 1674. Утратил силу - приказом Министра государственных доходов РК от 9.04.2002 № 416
  title:
    rus: О внесении изменений и дополнений в Приказ Министра государственных доходов Республики Казахстан от 7 февраля 2000 года N 108 "Об утверждении Инструкции "Об упрощенном режиме налогообложения юридических лиц, для которых земля является основным средством производства сельскохозяйственной продукции или деятельность которых связана с использованием земли для производства сельскохозяйственной продукции, а также перерабатывающих сельскохозяйственную продукцию собственного производства"
    kaz: '"Олар үшiн жер ауыл шаруашылығы өнiмiн өндiрудiң негiзгi құралы болып табылатын немесе олардың қызметi ауыл шаруашылығы өнiмiн өндiру үшiн жердi пайдаланумен байланысты, сондай-ақ өз өндiрiсi ауыл шаруашылығы өнiмiн ұқсатушы заңды тұлғаларға оңайлатылған салық салу режимi туралы" Нұсқаулықты бекiту туралы" 2000 жылғы 7 ақпандағы N 108 мемлекеттiк кiрiс министрінiң Бұйрығына өзгерiстер мен толықтырулар енгiзу туралы'
  link: https://zan.gov.kz/client/#!/doc/10439/rus
