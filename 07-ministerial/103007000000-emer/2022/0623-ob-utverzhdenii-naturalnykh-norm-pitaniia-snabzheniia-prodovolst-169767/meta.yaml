requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 23 июня 2022 года № 237. Отменен приказом Министра по чрезвычайным ситуациям Республики Казахстан от 23 апреля 2025 года № 154 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм питания, снабжения продовольствием, кормами, оборудованием, столово-кухонной посудой и техникой продовольственной службы воинских частей гражданской обороны Министерства по чрезвычайным ситуациям Республики Казахстан
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігі азаматтық қорғаныс әскери бөлімдерін бейбіт уақытқа тамақтандырудың, азық-түлікпен, азықпен, жабдықпен, асханалық-ас үйлік ыдыспен және азық-түлік қызметінің техникасымен жабдықтауға арналған заттай нормаларын бекіту туралы
