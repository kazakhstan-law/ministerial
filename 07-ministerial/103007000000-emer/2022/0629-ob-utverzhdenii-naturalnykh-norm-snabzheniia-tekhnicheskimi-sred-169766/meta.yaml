title:
  rus: Об утверждении натуральных норм снабжения техническими средствами воспитания и другим культурно-просветительным имуществом воинских частей гражданской обороны Министерства по чрезвычайным ситуациям Республики Казахстан
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігі азаматтық қорғаныс әскери бөлімдерін техникалық тәрбиелеу құралдарымен және басқа да мәдени-ағарту мүліктерімен жабдықтау заттай нормаларын бекіту туралы
