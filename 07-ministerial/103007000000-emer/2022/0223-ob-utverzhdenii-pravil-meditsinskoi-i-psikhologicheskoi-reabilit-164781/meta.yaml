    kaz: «Медициналық мекемелер мен оңалту орталықтары базасында азаматтық қорғау органдарының қызметкерлерін медициналық және психологиялық оңалту қағидаларын бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің міндетін атқарушының 2022 жылғы 23 ақпандағы № 61 бұйрығына өзгерістер енгізу туралы
