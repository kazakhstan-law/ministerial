requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 16 июня 2022 года № 218. Отменен приказом Министра по чрезвычайным ситуациям Республики Казахстан от 23 апреля 2025 года № 152 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм оснащения аварийно-спасательными инструментами, оборудованием, снаряжением и обмундированием воинских частей гражданской обороны Министерства по чрезвычайным ситуациям Республики Казахстан
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігінің азаматтық қорғаныс әскери бөлімдерін авариялық-құтқару құрал-саймандармен, жабдықтармен, құрал-жабдықпен және киім-кешекпен жабдықтаудың заттай нормаларын бекіту туралы
