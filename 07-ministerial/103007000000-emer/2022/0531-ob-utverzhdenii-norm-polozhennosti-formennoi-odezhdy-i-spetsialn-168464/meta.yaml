  title:
    rus: О внесении изменений и дополнений в приказ Министра по чрезвычайным ситуациям Республики Казахстан от 31 мая 2022 года № 196 «Об утверждении норм положенности форменной одежды и специального обмундирования сотрудников, осуществляющих функции по предупреждению и ликвидации чрезвычайных ситуаций природного и техногенного характера, оказанию экстренной медицинской и психологической помощи населению, сотрудников органов государственной противопожарной службы»
    kaz: «Табиғи және техногендік сипаттағы төтенше жағдайлардың алдын алу және жою, халыққа шұғыл медициналық және психологиялық көмек көрсету жөніндегі функцияларды жүзеге асыратын қызметкерлердің, мемлекеттік өртке қарсы қызмет органдары қызметкерлерінің нысанды киімі мен арнайы киiм-кешегінің тиесiлiлік нормаларын бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2022 жылғы 31 мамырдағы № 196 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/187518/rus
