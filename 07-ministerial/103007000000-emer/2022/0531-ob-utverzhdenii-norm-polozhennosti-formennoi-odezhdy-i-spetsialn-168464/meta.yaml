title:
  rus: Об утверждении норм положенности форменной одежды и специального обмундирования сотрудников органов гражданской защиты
  kaz: Азаматтық қорғау органдары қызметкерлерінің нысанды киімдері мен арнайы киім-кешегінің тиесілілік нормаларын бекіту туралы
