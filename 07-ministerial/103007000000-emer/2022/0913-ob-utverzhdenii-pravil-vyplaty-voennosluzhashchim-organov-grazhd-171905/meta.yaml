title:
  rus: Об утверждении Правил выплаты военнослужащим органов гражданской защиты, за исключением курсантов и военнослужащих срочной службы денег за счет государства за перевозку собственного имущества в пределах Республики Казахстан
  kaz: Мерзімді қызметтің курсанттары мен әскери қызметшілерін қоспағанда, азаматтық қорғау органдарының әскери қызметшілеріне Қазақстан Республикасының шегінде өз мүлкін тасымалдағаны үшін мемлекет есебінен ақша төлеу қағидаларын бекіту туралы
