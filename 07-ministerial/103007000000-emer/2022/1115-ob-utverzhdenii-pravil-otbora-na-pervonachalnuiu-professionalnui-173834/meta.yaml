title:
  rus: Об утверждении Правил отбора на первоначальную профессиональную подготовку и условия ее прохождения для лиц, поступающих в органы государственной противопожарной службы, а также основания их отчисления от первоначальной профессиональной подготовки
  kaz: Мемлекеттік өртке қарсы қызмет органдарына кіретін адамдар үшін алғашқы кәсіптік даярлыққа іріктеу қағидаларын және одан өту шарттарын, сондай-ақ оларды алғашқы кәсіптік даярлықтан шығару негіздерін бекіту туралы
