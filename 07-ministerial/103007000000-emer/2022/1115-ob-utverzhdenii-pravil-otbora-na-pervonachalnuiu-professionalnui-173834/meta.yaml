  title:
    rus: О внесении изменений в приказы Министра по чрезвычайным ситуациям Республики Казахстан от 7 сентября 2021 года № 432 «Об утверждении Правил и Методов определения профессиональных компетенций, ключевых показателей и расчета показателя конкурентоспособности в органах гражданской защиты» и от 15 ноября 2022 года № 207 «Об утверждении Правил отбора на первоначальную профессиональную подготовку и условия ее прохождения для лиц, поступающих в органы государственной противопожарной службы, а также основания их отчисления от первоначальной профессиональной подготовки»
    kaz: Қазақстан Республикасы Төтенше жағдайлар министрінің «Азаматтық қорғау органдарында кәсіби құзыреттерді, негізгі көрсеткіштерді және бәсекеге қабілеттілік көрсеткіш есебін айқындау қағидалары мен әдістерін бекіту туралы» 2021 жылғы 7 қыркүйектегі № 432 және «Мемлекеттік өртке қарсы қызмет органдарына кіретін адамдар үшін алғашқы кәсіптік даярлыққа іріктеу қағидаларын және одан өту шарттарын, сондай-ақ оларды алғашқы кәсіптік даярлықтан шығару негіздерін бекіту туралы» 2022 жылғы 15 қарашадағы № 207 бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/209637/rus
