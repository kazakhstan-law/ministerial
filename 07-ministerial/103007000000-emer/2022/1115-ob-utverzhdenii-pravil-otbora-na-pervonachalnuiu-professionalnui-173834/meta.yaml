  title:
    rus: О внесении изменений и дополнений в приказ Министра по чрезвычайным ситуациям Республики Казахстан от 15 ноября 2022 года № 207 «Об утверждении Правил отбора на первоначальную профессиональную подготовку и условия ее прохождения для лиц, поступающих в органы государственной противопожарной службы, а также основания их отчисления от первоначальной профессиональной подготовки»
    kaz: «Мемлекеттік өртке қарсы қызмет органдарына кіретін адамдар үшін алғашқы кәсіптік даярлыққа іріктеу қағидаларын және одан өту шарттарын, сондай-ақ оларды алғашқы кәсіптік даярлықтан шығару негіздерін бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2022 жылғы 15 қарашадағы № 207 бұйрығына өзгерістер мен толықтырулар енгізу туралы
