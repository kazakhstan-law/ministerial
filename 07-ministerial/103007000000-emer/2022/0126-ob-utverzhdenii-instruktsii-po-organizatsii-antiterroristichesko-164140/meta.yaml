title:
  rus: Об утверждении Инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, осуществляющих деятельность в сфере формирования и хранения государственного материального резерва
  kaz: Мемлекеттік материалдық резервті қалыптастыру және сақтау саласындағы қызметті жүзеге асыратын, террористік тұрғыдан осал объектілердің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
