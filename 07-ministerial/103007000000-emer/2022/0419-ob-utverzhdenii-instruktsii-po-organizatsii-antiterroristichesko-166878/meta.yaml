title:
  rus: Об утверждении Инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, находящихся в ведении Министерства по чрезвычайным ситуациям Республики Казахстан
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігінің қарамағындағы террористік тұрғыдан осал объектілердің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
