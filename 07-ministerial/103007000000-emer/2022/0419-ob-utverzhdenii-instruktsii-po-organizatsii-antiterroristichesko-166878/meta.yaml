  title:
    rus: О внесении изменений в приказ Министра по чрезвычайным ситуациям Республики Казахстан от 19 апреля 2022 года № 115 «Об утверждении Инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, находящихся в ведении Министерства по чрезвычайным ситуациям Республики Казахстан»
    kaz: Қазақстан Республикасы Төтенше жағдайлар министрінің 2024 жылғы 19 сәуірдегі № 115 бұйрығына өзгеріс енгізу туралы «Қазақстан Республикасы Төтенше жағдайлар министрлігінің қарамағындағы террористік тұрғыдан осал объектілердің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы»
