act_code: '168414'
requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 24 мая 2022 года № 169. Утратил силу приказом и.о. Министра по чрезвычайным ситуациям Республики Казахстан от 29 апреля 2025 года № 165 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм снабжения мебелью, снаряжением, бумагой, инвентарем, оборудованием, спортивным и хозяйственным имуществом Министерства по чрезвычайным ситуациям Республики Казахстан и его подведомственных организаций
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігі мен оның ведомстволық бағынысты ұйымдарын жиһазбен, құрал-жабдықпен, қағазбен, мүкәммалмен, жабдықпен, спорттық және шаруашылық мүлікпен жабдықтаудың заттай нормаларын бекіту туралы
