  title:
    rus: Об отмене приказа Министра по чрезвычайным ситуациям Республики Казахстан от 20 сентября 2021 года № 459 «О внесении изменений и дополнений в приказ Министра по чрезвычайным ситуациям Республики Казахстан от 3 ноября 2020 года № 17 «Об утверждении Уставов государственных учреждений Министерства по чрезвычайным ситуациям Республики Казахстан»
    kaz: «Қазақстан Республикасы Төтенше жағдайлар министрінің «Қазақстан Республикасы Төтенше жағдайлар министрлігі мемлекеттік мекемелерінің жарғыларын бекіту туралы» 2020 жылғы 3 қарашадағы № 17 бұйрығына өзгерістер мен толықтырулар енгізу туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2021 жылғы 20 қыркүйектегі № 459 бұйрығының күшін жою туралы
