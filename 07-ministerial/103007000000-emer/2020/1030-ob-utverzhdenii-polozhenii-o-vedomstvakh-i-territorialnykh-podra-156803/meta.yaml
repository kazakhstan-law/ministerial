title:
  rus: Об утверждении положений о ведомствах и территориальных подразделениях Министерства по чрезвычайным ситуациям Республики Казахстан
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігінің ведомстволары мен аумақтық бөлімшелері туралы ережелерді бекіту туралы
