  title:
    rus: О внесении изменений и дополнения в приказы Министра по чрезвычайным ситуациям Республики Казахстан от 30 октября 2020 года № 16 «Об утверждении положений о ведомствах и территориальных подразделениях Министерства по чрезвычайным ситуациям Республики Казахстан» и от 3 ноября 2020 года № 17 «Об утверждении Уставов государственных учреждений Министерства по чрезвычайным ситуациям Республики Казахстан»
    kaz: «Қазақстан Республикасы Төтенше жағдайлар министрлігінің ведомстволары мен аумақтық бөлімшелері туралы ережелерді бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2020 жылғы 30 қазандағы № 16 және «Қазақстан Республикасы Төтенше жағдайлар министрлігінің мемлекеттік мекемелерінің жарғыларын бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2020 жылғы 3 қарашадағы № 17 бұйрықтарына өзгерістер мен толықтыру енгізу туралы
