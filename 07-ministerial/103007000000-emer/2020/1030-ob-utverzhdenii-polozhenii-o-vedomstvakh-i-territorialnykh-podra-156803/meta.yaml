  requisite: Приказ и.о. Министра по чрезвычайным ситуациям Республики Казахстан от 19 апреля 2024 года № 166
  title:
    rus: О внесении изменений и дополнений в приказы Министра по чрезвычайным ситуациям Республики Казахстан от 30 октября 2020 года № 16 «Об утверждении положений о ведомствах и территориальных подразделениях Министерства по чрезвычайным ситуациям Республики Казахстан» и от 3 декабря 2020 года № 60 «Об утверждении положений о городских, районных (районных в городах) управлений, отделов по чрезвычайным ситуациям Министерства по чрезвычайным ситуациям Республики Казахстан»
    kaz: Қазақстан Республикасы Төтенше жағдайлар министрінің «Қазақстан Республикасы Төтенше жағдайлар министрлігінің ведомстволары мен аумақтық бөлімшелері туралы ережелерді бекіту туралы» 2020 жылғы 30 қазандағы № 16 және «Қазақстан Республикасы Төтенше жағдайлар министрлігінің қалалық, аудандық (қалалардағы аудандық) төтенше жағдайлар басқармалары мен бөлімдері туралы ережелерді бекіту туралы» 2020 жылғы 3 желтоқсандағы № 60 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
