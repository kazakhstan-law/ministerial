  title:
    rus: О внесении изменений и дополнений в приказ Министра по чрезвычайным ситуациям Республики Казахстан «Об утверждении положений о ведомствах и территориальных подразделениях Министерства по чрезвычайным ситуациям Республики Казахстан» от 30 октября 2020 года № 16 и «Об утверждении положений о городских, районных (районных в городах) управлений, отделов по чрезвычайным ситуациям Министерства по чрезвычайным ситуациям Республики Казахстан» от 3 декабря 2020 года № 60
    kaz: Қазақстан Республикасы Төтенше жағдайлар министрінің 2020 жылғы 30 қазандағы № 16 «Қазақстан Республикасы Төтенше жағдайлар министрлігінің ведомстволары мен аумақтық бөлімшелері туралы ережелерді бекіту туралы» және 2020 жылғы 3 желтоқсандағы № 60 «Қазақстан Республикасы Төтенше жағдайлар министрлігінің қалалық, аудандық (қалалардағы аудандық) төтенше жағдайлар басқармалары мен бөлімдері туралы ережелерді бекіту туралы» бұйрығына өзгерістер мен толықтырулар енгізу туралы
