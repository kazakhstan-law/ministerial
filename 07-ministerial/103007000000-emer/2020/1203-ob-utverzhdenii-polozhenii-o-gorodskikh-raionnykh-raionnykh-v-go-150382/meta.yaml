title:
  rus: Об утверждении положений о городских, районных (районных в городах) управлений, отделов по чрезвычайным ситуациям Министерства по чрезвычайным ситуациям Республики Казахстан
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігінің қалалық, аудандық (қалалардағы аудандық) төтенше жағдайлар басқармалары мен бөлімдері туралы ережелерді бекіту туралы
