act_code: '201467'
requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 18 сентября 2024 года № 358. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 сентября 2024 года № 35088
title:
  rus: Об утверждении Правил использования сетей телерадиовещания для оповещения населения об угрозе жизни, здоровью людей и порядке действий в сложившейся обстановке при чрезвычайных ситуациях природного и техногенного характера, а также в интересах обороны, национальной безопасности и охраны правопорядка
  kaz: Табиғи және техногендiк сипаттағы төтенше жағдайлар кезiнде адамдардың өмiрiне, денсаулығына төнген қатер және қалыптасқан жағдайдағы iс-қимылдар тәртiбi туралы халықты құлақтандыру үшін, сондай-ақ қорғаныс, ұлттық қауiпсiздiк және құқықтық тәртiптi қорғау мүдделерiнде телерадио хабарларын тарату желiлерiн пайдалану қағидаларын бекiту туралы
