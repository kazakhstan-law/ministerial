  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по чрезвычайным ситуациям Республики Казахстан от 16 июля 2024 года № 270 «Об утверждении Инструкции о приеме на службу в органы гражданской защиты, назначении на должность, перемещении, выдвижении по службе, предоставлении отпусков, присвоении специальных званий, увольнении и откомандировании»
    kaz: «Азаматтық қорғау органдарына қызметке қабылдау, лауазымға тағайындау, орнын ауыстыру, қызметке ұсыну, демалыс беру, арнаулы атақтар беру, жұмыстан шығару және іссапарға жіберу туралы нұсқаулықты бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің міндетін атқарушының 2024 жылғы 16 шілдедегі № 270 бұйрығына өзгерістер енгізу туралы
