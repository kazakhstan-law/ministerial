  kaz: Азаматтық қорғау органдарына қызметке қабылдау, лауазымға тағайындау, орнын ауыстыру, қызметке ұсыну, демалыс беру, арнаулы атақтар беру, жұмыстан шығару және іссапарға жіберу туралы нұсқаулықты бекіту туралы
