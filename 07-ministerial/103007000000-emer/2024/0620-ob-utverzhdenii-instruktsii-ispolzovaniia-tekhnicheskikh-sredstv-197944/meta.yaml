title:
  rus: Об утверждении Инструкции использования технических средств при осуществлении государственного контроля и надзора в области пожарной безопасности для фиксации фактов совершения нарушений и действий сотрудников органов гражданской защиты
  kaz: Өрт қауіпсіздігі саласындағы мемлекеттік бақылау мен қадағалауды жүзеге асыру кезінде азаматтық қорғау органдары қызметкерлерінің бұзушылықтар жасау фактілері мен іс-әрекеттерін белгілеу үшін техникалық құралдарды пайдалану нұсқаулығын бекіту туралы
