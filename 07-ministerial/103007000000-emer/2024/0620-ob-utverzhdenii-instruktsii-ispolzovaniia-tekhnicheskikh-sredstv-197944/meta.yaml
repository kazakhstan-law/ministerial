  title:
    rus: О внесении изменений в приказ Министра по чрезвычайным ситуациям Республики Казахстан от 20 июня 2024 года № 236 «Об утверждении Инструкции использования технических средств при осуществлении государственного контроля и надзора в области пожарной безопасности для фиксации фактов совершения нарушений и действий сотрудников органов гражданской защиты»
    kaz: «Өрт қауіпсіздігі саласындағы мемлекеттік бақылау мен қадағалауды жүзеге асыру кезінде азаматтық қорғау органдары қызметкерлерінің бұзушылықтар жасау фактілері мен іс-әрекеттерін белгілеу үшін техникалық құралдарды пайдалану нұсқаулығын бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2024 жылғы 20 маусымдағы № 236 бұйрығына өзгерістер енгізу туралы
