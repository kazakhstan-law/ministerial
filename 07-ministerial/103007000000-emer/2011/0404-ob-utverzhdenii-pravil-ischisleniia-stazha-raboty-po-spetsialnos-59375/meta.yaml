act_code: '59375'
requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 4 апреля 2011 года № 135. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 июня 2011 года № 7005. Утратил силу приказом Министра внутренних дел Республики Казахстан от 29 сентября 2016 года № 946
title:
  rus: Об утверждении Правил исчисления стажа работы по специальности для гражданских служащих, работников системы органов по чрезвычайным ситуациям, содержащихся за счет средств государственного бюджета, работников казенных предприятий не являющихся государственными служащими
  kaz: Төтенше жағдайлар жөнiндегi органдар жүйесiнің, мемлекеттік бюджет қаражаты есебінен ұсталатын ұйымдар қызметкерлерінің, мемлекеттiк қызметшi емес қызметкерлерi қазыналық кәсіпорындары қызметкерлерінің мамандығы бойынша жұмыс стажын есептеу ережесін бекіту туралы
