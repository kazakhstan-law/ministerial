    kaz: «Ұйымдардың жұмыскерлері мен халықты өрт қауіпсіздігі шараларына оқыту қағидаларын және өрт қауіпсіздігі шараларына оқыту жөніндегі оқу бағдарламаларының мазмұнына қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2014 жылғы 9 маусымдағы № 276 бұйрығына өзгерістер мен толықтырулар енгізу туралы
