title:
  rus: Об утверждении Правил оперирования, перемещения, использования, пополнения материальных ценностей оперативного резерва уполномоченного органа в сфере гражданской защиты
  kaz: Азаматтық қорғау саласындағы уәкілетті орган жедел резервінің материалдық құндылықтарымен операция жүргізу, олардың орнын ауыстыру, пайдалану, толықтыру қағидаларын бекіту туралы
