  title:
    rus: О внесении изменений в приказ Министра по чрезвычайным ситуациям Республики Казахстан от 16 мая 2014 года № 225 «Об утверждении Правил оперирования, перемещения, использования, пополнения материальных ценностей оперативного резерва уполномоченного органа в сфере гражданской защиты»
