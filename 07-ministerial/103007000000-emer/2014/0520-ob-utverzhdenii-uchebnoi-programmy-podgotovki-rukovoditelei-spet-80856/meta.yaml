title:
  rus: Об утверждении учебной программы подготовки руководителей, специалистов органов управления и сил гражданской защиты, обучения населения способам защиты и действиям при возникновении чрезвычайных ситуаций и военных конфликтов или вследствие этих конфликтов
  kaz: Төтенше жағдайлар мен әскери қақтығыстар туындаған кезде немесе осы қақтығыстар салдарынан қорғану тәсілдері мен іс-қимылдарға азаматтық қорғаудың басқару органдары мен күштерінің басшыларын, мамандарын даярлаудың, халықты оқытудың оқу бағдарламасын бекіту туралы
