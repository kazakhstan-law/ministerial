act_code: '179547'
requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 6 апреля 2023 года № 180. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 апреля 2023 года № 32259. Утратил силу приказом Министра по чрезвычайным ситуациям Республики Казахстан от 14 августа 2025 года № 320 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и условий прохождения компьютерного тестирования сотрудника, подлежащего аттестации, на знание законодательства Республики Казахстан и логическое мышление, нормативов по определению профессиональной пригодности, а также пороговых значений для категорий должностей органов гражданской защиты
  kaz: Аттестаттауға жатқызылған қызметкердің Қазақстан Республикасы заңнамасын білуін және логикалық ойлау қабілетін компьютерлік тестілеуден өткізу қағидалары мен шарттарын, кәсіби жарамдылығын айқындау жөніндегі нормативтерді, сондай-ақ азаматтық қорғау органдары лауазымдарының санаттары үшін шекті мәндерді бекіту туралы
