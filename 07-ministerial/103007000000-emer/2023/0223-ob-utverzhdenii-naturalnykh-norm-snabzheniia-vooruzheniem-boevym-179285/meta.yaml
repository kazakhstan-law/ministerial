act_code: '179285'
requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 23 февраля 2023 года № 9 қбпү
title:
  rus: Об утверждении натуральных норм снабжения вооружением, боевыми комплектами боеприпасов, автомобильной техникой, имуществом и оборудованием воинских частей гражданской обороны Министерства по чрезвычайным ситуациям Республики Казахстан
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігі азаматтық қорғаныс әскери бөлімдерін қару-жарақпен, жауынгерлік оқ-дәрілер жинағымен, автомобиль техникасымен, мүлкімен және құрал-жабдықтармен жабдықтау заттай нормаларын бекіту туралы
