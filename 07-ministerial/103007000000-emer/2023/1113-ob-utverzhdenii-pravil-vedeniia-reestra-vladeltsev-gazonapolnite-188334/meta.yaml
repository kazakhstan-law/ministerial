title:
  rus: Об утверждении Правил ведения реестра владельцев газонаполнительных станций, газонаполнительных пунктов, автогазозаправочных станций и промышленных потребителей - владельцев сосудов, работающих под давлением, использующих их для хранения сжиженного нефтяного газа
  kaz: Газ толтыру станциялары, газ толтыру пункттері, автогаз құю станциялары иелерінің және өнеркәсіптік тұтынушылардың – қысыммен жұмыс істейтін түтіктерді сұйытылған мұнай газын сақтау үшін пайдаланатын олардың иелерінің тізілімін жүргізу қағидаларын бекіту туралы
