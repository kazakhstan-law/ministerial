act_code: '189243'
requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 24 ноября 2023 года № 642. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 ноября 2023 года № 33701
title:
  rus: О признании утратившим силу приказа Министра по чрезвычайным ситуациям Республики Казахстан от 19 марта 2021 года № 135 «Об утверждении Правил выдачи служебных удостоверений сотрудникам и военнослужащим органов гражданской защиты Республики Казахстан и его описания»
  kaz: «Қазақстан Республикасы азаматтық қорғау органдарының қызметкерлері мен әскери қызметшілеріне қызметтік куәліктер беру қағидаларын және оның сипаттамасын бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2021 жылғы 19 наурыздағы № 135 бұйрығының күшін жою туралы
