act_code: '189122'
requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 24 ноября 2023 года № 641. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 ноября 2023 года № 33685
title:
  rus: Об утверждении Правил посещения членами семей, являющимися гражданами Республики Казахстан, своих близких родственников из числа курсантов специального учебного заведения Министерства по чрезвычайным ситуациям Республики Казахстан для ознакомления с их жизнью и бытом
  kaz: Қазақстан Республикасының азаматтары болып табылатын отбасы мүшелерінің, Қазақстан Республикасы Төтенше жағдайлар министрлігі арнаулы оқу орнының курсанттары қатарындағы өздерінің жақын туыстарының өмірімен және тұрмысымен танысу үшін бару қағидаларын бекіту туралы
