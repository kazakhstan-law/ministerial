  title:
    rus: О внесении изменения в приказ Министра по чрезвычайным ситуациям Республики Казахстан от 10 апреля 2025 года № 129 «Об утверждении натуральных норм снабжения средствами связи, организационной техникой, программным обеспечением, аппаратными и программными средствами защиты информации подразделений Министерства по чрезвычайным ситуациям Республики Казахстан»
    kaz: «Қазақстан Республикасы Төтенше жағдайлар министрлігінің бөлімшелерін байланыс құралдарымен, ұйымдастыру техникасымен, бағдарламалық қамтамасыз етумен, ақпаратты қорғаудың аппараттық және бағдарламалық құралдарымен жабдықтаудың заттай нормаларын бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2025 жылғы 10 сәуірдегі № 129 бұйрығына өзгеріс енгізу туралы
