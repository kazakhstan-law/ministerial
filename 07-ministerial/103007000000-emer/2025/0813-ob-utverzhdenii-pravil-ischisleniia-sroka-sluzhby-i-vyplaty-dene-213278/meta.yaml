act_code: '213278'
requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 13 августа 2025 года № 317
title:
  rus: Об утверждении Правил исчисления срока службы и выплаты денежного содержания сотрудникам и военнослужащим органов гражданской защиты при выполнении задач по ликвидации чрезвычайных ситуаций или тушению пожаров в период действия военного или чрезвычайного положения или проведения антитеррористической операции, или в условиях вооруженного конфликта либо в местности, где объявлена чрезвычайная ситуация природного и техногенного характера
  kaz: Әскери немесе төтенше жағдайдың қолданылуы немесе терроризмге қарсы операция жүргізу кезеңінде немесе қарулы қақтығыс жағдайларында немесе табиғи және техногендік сипаттағы төтенше жағдай жарияланған жерде төтенше жағдайларды жою немесе өрттерді сөндіру жөніндегі міндеттерді орындау кезінде азаматтық қорғау органдарының қызметкерлері мен әскери қызметшілерінің қызмет мерзімін есептеу және оларға ақшалай қамтылым төлеу қағидаларын бекіту туралы
