requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 23 апреля 2025 года № 151
title:
  rus: Об утверждении натуральных норм снабжения средствами индивидуальной бронезащиты, активной обороны, инженерным имуществом, техническими средствами охраны воинских частей гражданской обороны Министерства по чрезвычайным ситуациям Республики Казахстан
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігінің азаматтық қорғаныс әскери бөлімдерін жеке броньды қорғау құралдарымен, белсенді қорғаныс, инженерлік мүлікпен, күзеттің техникалық құралдарымен жабдықтаудың заттай нормаларын бекіту туралы
