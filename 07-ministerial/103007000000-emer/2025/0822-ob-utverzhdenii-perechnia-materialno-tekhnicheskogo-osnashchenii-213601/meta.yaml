title:
  rus: Об утверждении Перечня материально-технического оснащения, строительства, реконструкции и ремонта зданий и сооружений для оказания содействия местными исполнительными органами территориальным органам и подведомственным государственным учреждениям Министерства по чрезвычайным ситуациям Республики Казахстан
  kaz: Жергілікті атқарушы органдардың Қазақстан Республикасы Төтенше жағдайлар министрлігінің аумақтық бөлімшелеріне және ведомстволық бағынысты мемлекеттік мекемелеріне жәрдем көрсетуі үшін материалдық-техникалық жарақтандыру, ғимараттар мен құрылыстарды салу, реконструкциялау және жөндеу тізбесін бекiту туралы
