  title:
    rus: «О внесении изменении в Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 22 августа 2025 года № 355 «Об утверждении Перечня материально-технического оснащения, строительства, реконструкции и ремонта зданий и сооружений для оказания содействия местными исполнительными органами территориальным органам и подведомственным государственным учреждениям Министерства по чрезвычайным ситуациям Республики Казахстан»
    kaz: «Жергілікті атқарушы органдардың Қазақстан Республикасы Төтенше жағдайлар министрлігінің аумақтық бөлімшелеріне және ведомстволық бағынысты мемлекеттік мекемелеріне жәрдем көрсетуі үшін материалдық-техникалық жарақтандыру, ғимараттар мен құрылыстарды салу, реконструкциялау және жөндеу тізбесін бекiту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2025 жылғы 22 тамыздағы № 355 бұйрығына өзгеріс енгізу туралы
