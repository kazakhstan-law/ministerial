  title:
    rus: О внесении изменения в приказ Министра по чрезвычайным ситуациям Республики Казахстан от 27 августа 2025 года № 363 «Об утверждении перечня труднодоступных местностей, водных, горных и спелеологических объектов, связанных с повышенным риском для жизни, и правил информирования территориальных органов уполномоченного органа в сфере гражданской защиты»
    kaz: «Өмір үшін қауіп-қатері жоғары болуына байланысты жетуі қиын жерлердің, су, таулы және спелеологиялық объектілердің тізбесін және азаматтық қорғау саласындағы уәкілетті органның аумақтық органдарына хабарлау қағидаларын бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2025 жылғы 27 тамыздағы № 363 бұйрығына өзгеріс енгізу туралы
