title:
  rus: Об утверждении натуральных норм снабжения вооружением, боевыми комплектами боеприпасов, автомобильной техникой, имуществом и оборудованием органов управления и воинских частей Министерства  по чрезвычайным ситуациям Республики Казахстан
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігі басқару органдары мен әскери бөлімдерін қару-жарақпен, жауынгерлік оқ-дәрілер жинағымен, автомобиль техникасымен, мүлікпен және жабдықтармен заттай жабдықтау нормаларын бекіту туралы
