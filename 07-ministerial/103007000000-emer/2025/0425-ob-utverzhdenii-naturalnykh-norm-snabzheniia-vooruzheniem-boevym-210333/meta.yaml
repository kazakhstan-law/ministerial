  requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 12 мая 2025 года № 21-қбпү
  title:
    rus: О внесений изменения в приказ исполняющего обязанности Министра по чрезвычайным ситуациям Республики Казахстан от 25 апреля 2025 года №19-қбпү «Об утверждении натуральных норм снабжения вооружением, боевыми комплектами боеприпасов, автомобильной техникой, имуществом и оборудованием органов управления и воинских частей Министерства по чрезвычайным ситуациям Республики Казахстан»
    kaz: «Қазақстан Республикасы Төтенше жағдайлар министрлігі басқару органдары мен әскери бөлімдерін қару-жарақпен, жауынгерлік оқ-дәрілер жинағымен, автомобиль техникасымен, мүлікпен және жабдықтармен заттай жабдықтау нормаларын бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің міндетін атқарушының 2025 жылғы 25 сәуірдегі №19-қбпү бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/210403/rus
