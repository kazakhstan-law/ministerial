title:
  rus: Об утверждении норм обеспечения спасателей продуктами питания при несении дежурства, а также в период проведения аварийно-спасательных и неотложных работ с оплатой расходов за счет средств, выделяемых на содержание профессиональных аварийно-спасательных служб и формирований
  kaz: Кезекшілік атқару кезінде, сондай-ақ авариялық-құтқару және кезек күттірмейтін жұмыстарды жүргізу кезеңінде кәсіби авариялық-құтқару қызметтері мен құралымдарын ұстауға бөлінетін қаражаттар есебінен шығыстардың ақысын төлей отырып, құтқарушыларды тамақ өнімдерімен қамтамасыз ету нормаларын бекіту туралы
