title:
  rus: «Об утверждении образцов специальной форменной одежды для сотрудников и работников органов гражданской защиты и подведомственных Министерству по чрезвычайным ситуациям Республики Казахстан государственных предприятий»
  kaz: «Азаматтық қорғау органдарының және Қазақстан Республикасы Төтенше жағдайлар министрлігінің ведомстволық бағынысты мемлекеттік кәсіпорындардың қызметкерлері мен өзге де жұмыскерлері үшін арнайы нысанды киім үлгілерін бекіту туралы»
