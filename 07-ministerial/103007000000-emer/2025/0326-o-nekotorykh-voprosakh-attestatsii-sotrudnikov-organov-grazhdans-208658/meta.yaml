  title:
    rus: О внесении изменений и дополнений в приказы Министра по чрезвычайным ситуациям Республики Казахстан от 2 февраля 2024 года № 34 «Об утверждении Содержания и Правил организации профессиональной служебной (профессиональной) и физической подготовки сотрудников и военнослужащих органов гражданской защиты» и от 26 марта 2025 года № 104 «О некоторых вопросах аттестации сотрудников органов гражданской защиты»
    kaz: Қазақстан Республикасы Төтенше жағдайлар министрінің «Азаматтық қорғау органдары қызметкерлері мен әскери қызметшілерінің кәсіби қызметтік (кәсіби) және дене шынықтыру дайындығын ұйымдастырудың мазмұны мен қағидаларын бекіту туралы» 2024 жылғы 2 ақпандағы № 34 және «Азаматтық қорғау органдарының қызметкерлерін аттестаттаудың кейбір мәселелері туралы» 2025 жылғы 26 наурыздағы № 104 бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/214877/rus
