title:
  rus: Об утверждении форм актов о назначении, результатах, продлении, приостановлении, возобновлении проверки, о приостановлении либо запрещении деятельности или отдельных видов деятельности в области промышленной безопасности, предписания об устранении выявленных нарушений
  kaz: Тексеруді тағайындау, нәтижелері, ұзарту, тоқтата тұру, қайта бастау, өнеркәсіптік қауіпсіздік саласындағы қызметті немесе жекелеген қызмет түрлерін тоқтата тұру не оған тыйым салу, анықталған бұзушылықтарды жою туралы нұсқама актілердің нысандарын бекіту туралы
