  title:
    rus: О внесении изменения в приказ Министра по чрезвычайным ситуациям Республики Казахстан от 2 октября 2025 года № 436 «Об утверждении форм актов о назначении, результатах, продлении, приостановлении, возобновлении проверки, о приостановлении либо запрещении деятельности или отдельных видов деятельности в области промышленной безопасности, предписания об устранении выявленных нарушений»
    kaz: Қазақстан Республикасы Төтенше жағдайлар министрінің 2025 жылғы 2 қазандағы №436 «Тексеруді тағайындау, нәтижелері, ұзарту, тоқтата тұру, қайта бастау, өнеркәсіптік қауіпсіздік саласындағы қызметті немесе жекелеген қызмет түрлерін тоқтата тұру не оған тыйым салу, анықталған бұзушылықтарды жою туралы нұсқама актілердің нысандарын бекіту туралы» бұйрығына өзгеріс енгізу туралы
