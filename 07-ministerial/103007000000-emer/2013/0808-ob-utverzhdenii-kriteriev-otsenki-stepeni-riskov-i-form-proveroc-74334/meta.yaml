requisite: Приказ и.о. Министра по чрезвычайным ситуациям Республики Казахстан от 8 августа 2013 года № 350. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 сентября 2013 года № 8689. Утратил силу совместным приказом и.о. Министра внутренних дел Республики Казахстан от 30 июля 2015 года № 646 и и.о. Министра по инвестициям и развитию Республики Казахстан от 31 июля 2015 года № 833
title:
