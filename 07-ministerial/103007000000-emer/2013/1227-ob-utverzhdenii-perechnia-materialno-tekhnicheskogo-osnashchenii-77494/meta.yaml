act_code: '77494'
requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 27 декабря 2013 года № 595. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 февраля 2014 года № 9130. Утратил силу приказом Министра по чрезвычайным ситуациям Республики Казахстан от 19 мая 2014 года № 234
title:
  rus: Об утверждении Перечня материально–технического оснащения территориальных органов, подведомственных государственных учреждений Министерства по чрезвычайным ситуациям Республики Казахстан, применяемого для дооснащения за счет средств местного бюджета
  kaz: Жергілікті бюджет қаражаты есебінен қосымша жарақтандырылатын Қазақстан Республикасы Төтенше жағдайлар министрлігінің аумақтық органдарын, ведомстволық бағынысты мемлекеттік мекемелерін материалдық-техникалық жарақтандыру тізбесін бекіту туралы
