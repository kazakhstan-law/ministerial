  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по чрезвычайным ситуациям от 19 июня 2002 года № 468 "Об утверждении Правил исчисления стажа работы по специальности для работников государственных учреждений системы органов по чрезвычайным ситуациям, не являющихся государственными служащими", зарегистрированного в Министерстве юстиции Республики Казахстан № 1912
    kaz: Қазақстан Республикасының Әділет министрлігінде тіркелген № 1912 Қазақстан Республикасы Төтенше жағдайлар жөніндегі агенттігінің 2002 жылғы 19 маусымдағы № 468 "Мемлекеттік қызметшілер болып табылмайтын төтенше жағдайлар жөніндегі органдар жүйесі мемлекеттік мекемелерінің қызметкерлері үшін мамандығы бойынша жұмыс өтілін есептеу Ережесін бекіту туралы" бұйрығына өзгерістер енгізу туралы
