title:
  rus: Об утверждении Правил исчисления стажа работы по специальности для работников государственных учреждений системы органов по чрезвычайным ситуациям, не являющихся государственными служащими
  kaz: Төтенше жағдайлар жөнiндегi органдар жүйесi мемлекеттiк мекемелерiнiң мемлекеттiк қызметшi емес қызметкерлерi үшiн мамандығы бойынша жұмыс стажын есептеу ережесiн бекiту туралы
