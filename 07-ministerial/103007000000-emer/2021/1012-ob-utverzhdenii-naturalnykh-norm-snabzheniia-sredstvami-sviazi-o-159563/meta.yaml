requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 12 октября 2021 года № 506. Отменен приказом Министра по чрезвычайным ситуациям Республики Казахстан от 10 апреля 2025 года № 129 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм снабжения средствами связи, организационной техникой, программным обеспечением, аппаратными и программными средствами защиты информации подразделений Министерства по чрезвычайным ситуациям Республики Казахстан
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігінің бөлімшелерін байланыс құралдарымен, ұйымдастыру техникасымен, бағдарламалық қамтамасыз етумен, ақпаратты қорғаудың аппараттық және бағдарламалық құралдарымен жабдықтаудың заттай нормаларын бекіту туралы
