title:
  rus: Об утверждении Инструкции по проведению технического диагностирования установок для бурения и ремонта нефтяных и газовых скважин с истекшим сроком службы с целью определения возможности их дальнейшей эксплуатации
  kaz: Қызмет ету мерзімі өткен, мұнай және газ ұңғымаларын бұрғылауға және жөндеуге арналған қондырғыларға оларды одан әрі пайдалану мүмкіндігін айқындау мақсатында техникалық диагностикалауды жүргізу жөніндегі нұсқаулықты бекіту туралы
