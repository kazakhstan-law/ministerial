title:
  rus: Об утверждении Типовых квалификационных характеристик должностей руководителей, специалистов и работников государственного учреждения «Центр медицины катастроф» Министерства по чрезвычайным ситуациям Республики Казахстан, его филиалов и трассовых медико-спасательных пунктов
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігінің «Апаттар медицинасы орталығы» мемлекеттік мекемесінің, оның филиалдары мен трассалық медициналық-құтқару пункттерінің басшылары, мамандары мен қызметкерлері лауазымдарының Үлгілік біліктілік сипаттамаларын бекіту туралы
