  title:
    rus: О внесении изменений и дополнений в приказы Министра по чрезвычайным ситуациям Республики Казахстан от 20 августа 2021 года № 411 «Об утверждении перечня образовательных программ, реализуемых в специальном учебном заведении Министерства по чрезвычайным ситуациям Республики Казахстан» и исполняющего обязанности Министра по чрезвычайным ситуациям Республики Казахстан от 17 сентября 2021 года № 456 «Об утверждении правил приема на обучение в специальное учебное заведение Министерства по чрезвычайным ситуациям Республики Казахстан, реализующее образовательные программы послевузовского образования»
    kaz: Қазақстан Республикасы Төтенше жағдайлар министрінің 2021 жылғы 20 тамыздағы № 411 «Қазақстан Республикасы Төтенше жағдайлар министрлігінің арнаулы оқу орнында іске асырылатын білім беру бағдарламаларының тізбесін бекіту туралы» және Қазақстан Республикасы Төтенше жағдайлар министрі міндетін атқарушысының 2021 жылғы 17 қыркүйектегі № 456 «Жоғары оқу орнынан кейінгі білімнің білім беру бағдарламаларын іске асыратын Қазақстан Республикасы Төтенше жағдайлар министрлігінің арнаулы оқу орнына оқуға қабылдау қағидаларын бекіту туралы» бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
