  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра по чрезвычайным ситуациям Республики Казахстан от 16 сентября 2021 года № 454 «Об утверждении правил согласования проектной документации на строительство, расширение, реконструкцию, модернизацию, консервацию и ликвидацию опасного производственного объекта организациями, эксплуатирующими опасный производственный объект» и в приказ Министра по чрезвычайным ситуациям Республики Казахстан от 29 сентября 2021 года № 485 «Об утверждении правил постановки на учет и снятия с учета опасных производственных объектов и опасных технических устройств»
    kaz: «Қауіпті өндірістік объектіні пайдаланатын ұйымдардың қауіпті өндірістік объектіні салуға, кеңейтуге, реконструкциялауға, жаңғыртуға, консервациялауға және жоюға арналған жобалау құжаттамасын келісу қағидаларын бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің міндетін атқарушының 2021 жылғы 16 қыркүйектегі № 454 бұйрығына және «Қауіпті өндірістік объектілер мен қауіпті техникалық құрылғыларды есепке қою және есептен шығару қағидаларын бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2021 жылғы 29 қыркүйектегі № 485 бұйрығына өзгерістер енгізу туралы
