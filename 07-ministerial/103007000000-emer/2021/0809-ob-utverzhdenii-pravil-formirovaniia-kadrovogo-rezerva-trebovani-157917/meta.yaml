requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 9 августа 2021 года № 386. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 августа 2021 года № 23995. Утратил силу приказом Министра по чрезвычайным ситуациям Республики Казахстан от 20 февраля 2025 года № 57 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил формирования кадрового резерва, требований к квалификации сотрудников, зачисляемых в кадровый резерв, и работы с ведомственным банком данных сотрудников, зачисленных в кадровый резерв органов гражданской защиты
  kaz: Азаматтық қорғау органдарының кадр резервін қалыптастыру, кадр резервіне алынатын қызметкерлердің біліктілігіне қойылатын талаптарды және кадр резервіне алынған қызметкерлердің ведомстволық деректер банкімен жұмыс істеу қағидаларын бекіту туралы
