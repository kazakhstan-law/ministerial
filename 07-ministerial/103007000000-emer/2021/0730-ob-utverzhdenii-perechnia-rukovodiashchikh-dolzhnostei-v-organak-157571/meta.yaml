  title:
    rus: О внесении изменений в приказ Министра по чрезвычайным ситуациям Республики Казахстан от 30 июля 2021 года № 367 «Об утверждении Перечня руководящих должностей в органах гражданской защиты, замещаемых на конкурсной основе, Условия и Правила проведения конкурса на вышестоящие руководящие должности в органах гражданской защиты»
