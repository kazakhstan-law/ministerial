title:
  rus: Об утверждении Перечня руководящих должностей в органах гражданской защиты, замещаемых на конкурсной основе, Условия и Правила проведения конкурса на вышестоящие руководящие должности в органах гражданской защиты
  kaz: Азаматтық қорғау органдарында конкурстық негізде орналасатын басшы лауазымдар тізбесін және Азаматтық қорғау органдарында жоғары тұрған басшы лауазымдарға конкурс өткізу шарттары мен қағидаларын бекіту туралы
