title:
  rus: Об утверждении Инструкции об организации и порядке проведения обследования технического состояния грузоподъемных машин, отработавших нормативный срок службы, с целью определения возможности их дальнейшей эксплуатации
  kaz: Нормативтік қызмет ету мерзімі өтелген жүк көтергіш машиналарды одан әрі пайдалану мүмкіндігін айқындау мақсатында олардың техникалық жай-күйіне зерттеп-қарауды ұйымдастыру және жүргізу тәртібі туралы нұсқаулықты бекіту туралы
