  title:
    rus: О внесении изменений в приказ Министра по чрезвычайным ситуациям Республики Казахстан от 24 июня 2021 года № 315 «Об утверждении Инструкции по организации и осуществлению производственного контроля на опасном производственном объекте» и приказ Министра по чрезвычайным ситуациям Республики Казахстан от 20 сентября 2021 года № 463 «Об утверждении Правил аттестации профессиональных аварийно-спасательных служб в области промышленной безопасности»
    kaz: «Қауіпті өндірістік объектіде өндірістік бақылауды ұйымдастыру және жүзеге асыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2021 жылғы 24 маусымдағы № 315 бұйрығына және «Өнеркәсіптік қауіпсіздік саласындағы кәсіби авариялық-құтқару қызметтерін аттестаттау қағидаларын бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2021 жылғы 20 қыркүйектегі № 463 бұйрығына өзгерістер енгізу туралы
