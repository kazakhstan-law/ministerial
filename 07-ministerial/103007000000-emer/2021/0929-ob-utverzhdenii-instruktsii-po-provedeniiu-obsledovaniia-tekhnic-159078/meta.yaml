  title:
    rus: О внесении изменений в приказ Министра по чрезвычайным ситуациям Республики Казахстан от 29 сентября 2021 года № 481 «Об утверждении Инструкции по проведению обследования технического состояния лифтов, а также подъемников для лиц с ограниченными возможностями (инвалидов) с истекшим сроком службы с целью определения возможности их дальнейшей эксплуатации»
    kaz: «Қызмет ету мерзімі өткен лифтілерді, сондай-ақ мүмкіндігі шектеулі адамдарға (мүгедектерге) арналған көтергіштерді одан әрі пайдалану мүмкіндігін айқындау мақсатында олардың техникалық жай-күйіне зерттеп-қарауды жүргізу жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2021 жылғы 29 қыркүйектегі № 481 бұйрығына өзгерістер енгізу туралы
