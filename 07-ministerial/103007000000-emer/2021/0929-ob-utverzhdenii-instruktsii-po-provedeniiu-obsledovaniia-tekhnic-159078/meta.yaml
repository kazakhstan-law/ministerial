title:
  rus: Об утверждении Инструкции по проведению обследования технического состояния лифтов, а также подъемников для лиц с инвалидностью с истекшим сроком службы с целью определения возможности их дальнейшей эксплуатации
  kaz: Қызмет ету мерзімі өткен лифтілерді, сондай-ақ мүгедектігі бар адамдарға арналған көтергіштерді одан әрі пайдалану мүмкіндігін айқындау мақсатында олардың техникалық жай-күйіне зерттеп-қарауды жүргізу жөніндегі нұсқаулықты бекіту туралы
