act_code: '157634'
requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 24 августа 2021 года № 413. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 августа 2021 года № 24173. Утратил силу приказом и.о. Министра по чрезвычайным ситуациям Республики Казахстан от 18 августа 2022 года № 33 (вводится в действие с 11 сентября 2022 года)
title:
  rus: Об утверждении Перечня должностей старшего и высшего начальствующего состава в органах гражданской защиты, замещаемых на конкурсной основе, Правил проведения конкурса и стажировки для лиц, впервые поступающих на службу в органы гражданской защиты
  kaz: Азаматтық қорғау органдарындағы конкурстық негізде орналасатын аға және жоғары басшы құрам лауазымдарының тізбесін, азаматтық қорғау органдарына қызметке алғаш рет кіретін адамдар үшін конкурс пен тағылымдама өткізу қағидаларын бекіту туралы
