  title:
    rus: О внесении изменений в приказ Министра по чрезвычайным ситуациям Республики Казахстан от 15 декабря 2021 года № 591 «Об утверждении Правил временного назначения на вакантные воинские должности военнослужащих нижестоящего состава, военнообязанных соответствующего состава либо граждан»
    kaz: «Төмен тұрған құрамның әскери қызметшілерін, тиісті құрамның әскери міндеттілерін не азаматтарды бос әскери лауазымдарға уақытша тағайындау қағидаларын бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2021 жылғы 15 желтоқсандағы № 591 бұйрығына өзгерістер енгізу туралы
