act_code: '158211'
requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 26 августа 2021 года № 419. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 августа 2021 года № 24141
title:
  rus: Об утверждении Правил организации работ по подготовке, экспертизе, апробации, изданию и проведению мониторинга учебных изданий и учебно-методических комплексов в специальном учебном заведении Министерства по чрезвычайным ситуациям Республики Казахстан
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігінің әскери, арнаулы оқу орындарында оқулық басылымдары мен оқу-әдістемелік кешендерді дайындау, сараптау, сынамақтан өткізу, басып шығару және оларға мониторинг жүргізу жөніндегі жұмыстарды ұйымдастыру қағидаларын бекіту туралы
