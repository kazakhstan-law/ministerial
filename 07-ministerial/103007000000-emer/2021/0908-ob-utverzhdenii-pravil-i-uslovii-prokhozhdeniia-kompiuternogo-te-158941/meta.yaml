act_code: '158941'
requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 8 сентября 2021 года № 18 дсп. Утратил силу приказом Министра по чрезвычайным ситуациям Республики Казахстан от 24 апреля 2023 года № 209 (вводится в действие с 24 апреля 2023 года)
title:
  rus: Об утверждении Правил и условий прохождения компьютерного тестирования сотрудника, подлежащего аттестации, на знание законодательства Республики Казахстан и логическое мышление, нормативы по определению профессиональной пригодности, а также пороговые значения для категорий должностей органов гражданской защиты
  kaz: Аттестаттауға жатқызылған қызметкердің Қазақстан Республикасы заңнамасын білуін және логикалық ойлау қабілетін компьютерлік тестілеуден өткізудің қағидалары мен шарттарын, кәсіби жарамдылығын айқындау жөніндегі нормативтерді, сондай-ақ азаматтық қорғау органдары лауазымдарының санаттары үшін шекті мәндерді бекіту туралы
