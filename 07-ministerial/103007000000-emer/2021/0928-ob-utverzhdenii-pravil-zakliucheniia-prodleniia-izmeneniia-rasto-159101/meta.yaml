act_code: '159101'
requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 28 сентября 2021 года № 473. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 сентября 2021 года № 24588
title:
  rus: Об утверждении Правил заключения, продления, изменения, расторжения и прекращения контракта с лицами, поступающими в организацию образования Министерства по чрезвычайным ситуациям Республики Казахстан, в организации образования, реализующие образовательные программы высшего и послевузовского образования правоохранительных органов иностранных государств по направлению Министерства по чрезвычайным ситуациям Республики Казахстан с оплатой обучения за счет бюджетных средств
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігінің Білім беру ұйымына, шет мемлекеттердің құқық қорғау органдарының жоғары және жоғары оқу орнынан кейінгі білім берудің білім беру бағдарламаларын іске асыратын білім беру ұйымдарына оқуға бюджет қаражаты есебінен ақы төлей отырып, Қазақстан Республикасы Төтенше жағдайлар министрлігінің жолдамасы бойынша түсетін адамдармен келісімшарт жасасу, ұзарту, өзгерту, бұзу және тоқтату қағидаларын бекіту туралы
