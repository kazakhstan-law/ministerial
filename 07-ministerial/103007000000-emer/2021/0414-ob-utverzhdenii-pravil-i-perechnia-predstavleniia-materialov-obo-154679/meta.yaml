act_code: '154679'
requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 14 апреля 2021 года № 170. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 апреля 2021 года № 22543. Утратил силу приказом и.о. Министра по чрезвычайным ситуациям Республики Казахстан от 24 сентября 2025 года № 416 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и перечня представления материалов, обосновывающих наличие чрезвычайной ситуации природного и техногенного характера, мероприятий по ее локализации и ликвидации, соответствующих обоснований и расчетов материально-технических, финансовых и людских ресурсов
  kaz: Табиғи және техногендік сипаттағы төтенше жағдайдың болуын негіздейтін материалдарды, оны оқшаулау және жою жөніндегі іс-шараларды, материалдық-техникалық, қаржылық және адами ресурстардың тиісті негіздемелері мен есептерін ұсыну қағидаларын және тізбесін бекіту туралы
