  title:
    rus: О внесении изменений в приказ Министра по чрезвычайным ситуациям Республики Казахстан от 3 июня 2021 года № 264 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» Министерства по чрезвычайным ситуациям Республики Казахстан, его ведомств и их территориальных подразделений»
    kaz: «Қазақстан Республикасы Төтенше жағдайлар министрлігінің, оның ведомстволары мен олардың аумақтық бөлімшелерінің «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2021 жылғы 3 маусымдағы № 264 бұйрығына өзгерістер енгізу туралы
