title:
  rus: Об утверждении Правил возмещения расходов на служебные командировки в иностранные государства сотрудников, военнослужащих, спасателей и иных работников органов гражданской защиты Республики Казахстан
  kaz: Қазақстан Республикасының азаматтық қорғау органдары қызметкерлерінің, әскери қызметшілерінің, құтқарушыларының және өзге де жұмыскерлерінің шет мемлекеттерге қызметтік іссапарларға арналған шығыстарын өтеу қағидаларын бекіту туралы
