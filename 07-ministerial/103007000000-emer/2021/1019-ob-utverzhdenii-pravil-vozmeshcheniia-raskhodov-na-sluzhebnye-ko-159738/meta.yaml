  title:
    rus: О внесении изменений в приказ Министра по чрезвычайным ситуациям Республики Казахстан от 19 октября 2021 года № 520 «Об утверждении Правил возмещения расходов на служебные командировки в иностранные государства гражданских служащих органов гражданской защиты Республики Казахстан»
    kaz: «Қазақстан Республикасының азаматтық қорғау органдары азаматтық қызметшілерінің шет мемлекеттерге қызметтік іссапарларға арналған шығыстарын өтеу қағидаларын бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2021 жылғы 19 қазандағы № 520 бұйрығына өзгерістер енгізу туралы
