title:
  rus: Об утверждении Правил проведения текущего контроля успеваемости, промежуточной и итоговой аттестации обучающихся специального учебного заведения Министерства по чрезвычайным ситуациям Республики Казахстан
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігінің арнаулы оқу орнында білім алушылардың үлгеріміне ағымдағы бақылау, оларға аралық және қорытынды аттестаттау жүргізу қағидаларын бекіту туралы
