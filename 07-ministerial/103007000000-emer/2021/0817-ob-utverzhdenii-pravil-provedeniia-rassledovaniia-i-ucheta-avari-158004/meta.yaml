title:
  rus: Об утверждении Правил проведения расследования и учета аварий и инцидентов на опасных производственных объектах, технического расследования случаев утрат взрывчатых веществ и изделий на их основе
  kaz: Қауіпті өндірістік объектілердегі авариялар мен оқыс оқиғаларға тергеп-тексеруді және есепке алуды, жарылғыш заттар мен олардың негізінде жасалған бұйымдардың жоғалу жағдайларына техникалық тергеп-тексеруді жүргізу қағидаларын бекіту туралы
