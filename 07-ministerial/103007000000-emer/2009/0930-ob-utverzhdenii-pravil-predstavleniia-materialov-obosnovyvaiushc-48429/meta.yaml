act_code: '48429'
requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 30 сентября 2009 года № 226. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 октября 2009 года № 5833. Утратил силу приказом Министра внутренних дел Республики Казахстан от 7 ноября 2015 года № 890 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил представления материалов, обосновывающих наличие чрезвычайной ситуации природного и техногенного характера, мероприятий по ее локализации и ликвидации, расчетов материально-технических, финансовых и людских ресурсов
  kaz: Табиғи және техногендік сипаттағы төтенше жағдайлардың болуын негіздейтін материалдарды ұсыну, оларды оқшауландыру және жою жөніндегі іс-шаралар, материалдық-техникалық есептеулер, қаржы және адамзат ресурстары ережесін бекіту туралы
