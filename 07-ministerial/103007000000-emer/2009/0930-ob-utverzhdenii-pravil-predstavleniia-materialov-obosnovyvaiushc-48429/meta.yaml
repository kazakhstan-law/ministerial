  title:
    rus: О внесении изменения в приказ Министра по чрезвычайным ситуациям Республики Казахстан от 30 сентября 2009 года № 226 "Об утверждении Правил представления материалов, обосновывающих наличие чрезвычайной ситуации природного и техногенного характера, мероприятий по ее локализации и ликвидации, расчетов материально-технических, финансовых и людских ресурсов"
    kaz: «Табиғи және техногендік сипаттағы төтенше жағдайлардың болуын негіздейтін материалды ұсыну, оларды оқшауландыру және жою жөніндегі іс-шаралар, материалдық-техникалық есептеулер, қаржы және адамзат ресурстары ережесін бекіту туралы» Қазақстан Республикасы Төтенше жағдайлар министрінің 2009 жылғы 30 қыркүйектегі № 226 бұйрығына өзгеріс енгізу туралы
