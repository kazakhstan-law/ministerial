  kaz: Азаматтық қорғау саласындағы уәкілетті органның қарамағындағы мемлекеттік мекемелер мен ұйымдардың азаматтық қызметшілері мен жұмыскерлері үшін, әкімшілік мемлекеттік қызметшілерді қоспағанда, мамандық бойынша жұмыс өтілін есептеу қағидалары мен шарттарын бекіту туралы
