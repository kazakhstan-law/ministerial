act_code: '227156'
requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 24 июня 2026 года № 241. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 июня 2026 года № 39138
title:
  rus: Об утверждении Правил выплаты денежной компенсации в размере стоимости общевойскового пайка при отсутствии возможности обеспечения питанием по установленным нормам основных продовольственных пайков военнослужащим, проходящим воинскую службу по контракту в Министерстве по чрезвычайным ситуациям Республики Казахстан
  kaz: Қазақстан Республикасы Төтенше жағдайлар министрлігінде келісімшарт бойынша әскери қызмет өткеретін әскери қызметшілерге негізгі азық-түлік үлестерінің белгіленген нормалары бойынша тамақтандырумен қамтамасыз етуге мүмкін болмаған кезде жалпы әскери үлес құны мөлшерінде ақшалай өтемақы төлеу қағидаларын бекіту туралы
