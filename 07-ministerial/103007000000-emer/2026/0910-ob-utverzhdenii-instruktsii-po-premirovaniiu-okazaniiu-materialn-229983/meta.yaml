requisite: Приказ Министра по чрезвычайным ситуациям Республики Казахстан от 10 сентября 2026 года № 345
title:
  rus: Об утверждении Инструкции по премированию, оказанию материальной помощи и установлению надбавок к должностным окладам военнослужащим, сотрудникам и государственным служащим органов гражданской защиты, а также выплаты бонусов административным государственным служащим
  kaz: Азаматтық қорғау органдарының әскери қызметшілеріне, қызметкерлері мен мемлекеттік қызметшілеріне сыйлықақы беру, материалдық көмек көрсету және лауазымдық айлықақыларына үстемеақылар белгілеу, сондай-ақ мемлекеттік әкімшілік қызметшілерге бонустар төлеу жөніндегі нұсқаулықты бекіту туралы
