requisite: Приказ Председателя Агентства Республики Казахстан по чрезвычайным ситуациям от 10 ноября 2003 года N 850. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 декабря 2003 года N 2613. Утратил силу приказом Министра по чрезвычайным ситуациям Республики Казахстан от 27 апреля 2006 года N 113
title:
  rus: Об утверждении Инструкции по организации работы Государственной противопожарной службы при осуществлении контрольных и надзорных функций
