  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по чрезвычайным ситуациям от 10 ноября 2003 года N 850 "Об утверждении Инструкции по организации работы государственной противопожарной службы при осуществлении контрольных и надзорных функций", зарегистрирован N 2613
    kaz: '"Бақылау мен қадағалау қызметін жүзеге асыру кезінде мемлекеттік өртке қарсы қызмет жұмысын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Төтенше жағдайлар жөніндегі агенттігінің нормативтік құқықтық актілерді мемлекеттік тіркеу Тізілімінде N 2613 тіркелген 2003 жылғы 10 қарашадағы N 850 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
