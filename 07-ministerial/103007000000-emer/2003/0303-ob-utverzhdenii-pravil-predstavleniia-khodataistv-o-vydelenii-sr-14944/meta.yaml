requisite: Приказ Председателя Агентства Республики Казахстан по чрезвычайным ситуациям от 3 марта 2003 года № 139. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 апреля 2003 года № 2224. Утратил силу приказом Министра по чрезвычайным ситуациям Республики Казахстан от 30 сентября 2009 года № 226
title:
  rus: Об утверждении Правил представления ходатайств о выделении средств из резерва Правительства Республики Казахстан для финансирования мероприятий по ликвидации чрезвычайных ситуаций природного и техногенного характера
  kaz: Табиғи және техногендік сипаттағы төтенше жағдайларды жою жөніндегі іс-шараларды қаржыландыру үшін Қазақстан Республикасы Үкіметінің резервінен қаражат бөлу туралы өтініш беру ережесін бекіту туралы
