  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан от 18 апреля 2019 года № 63 о/д «Об утверждении положений о территориальных органах Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан»
    kaz: Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөніндегі комитеті төрағасының 2019 жылғы 18 сәуірдегі № 63 н/қ «Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөніндегі комитетінің аумақтық органдары туралы ережелерді бекіту туралы» бұйрығына өзгеріс пен толықтырулар енгізу туралы
