title:
  rus: Об утверждении положений о территориальных и приравненных к ним органах Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан»
  kaz: «Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөніндегі комитетінің аумақтық және оларға теңестірілген органдары туралы ережелерді бекіту туралы»
