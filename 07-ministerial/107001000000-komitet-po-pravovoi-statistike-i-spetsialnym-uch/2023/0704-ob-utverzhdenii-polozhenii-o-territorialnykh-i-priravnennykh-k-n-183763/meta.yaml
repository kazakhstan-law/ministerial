  title:
    rus: О внесении изменений в приказ председателя Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан от 4 июля 2023 года № 92 о/д «Об утверждении положений о территориальных и приравненных к ним органах Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан»
    kaz: Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөніндегі комитеті төрағасының «Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөніндегі комитетінің аумақтық және оларға теңестірілген органдары туралы ережелерді бекіту туралы» 2023 жылғы 4 шілдедегі № 92 н/қ бұйрығына өзгерістер енгізу туралы
