  title:
    rus: О внесении изменений в приказ Председателя Комитета транспортного контроля Министерства транспорта и коммуникаций Республики Казахстан от 23 февраля 2004 года № 13-2-П "Об утверждении Инструкции по производству дел об административных правонарушениях Комитетом транспортного контроля Министерства транспорта и коммуникаций Республики Казахстан и его территориальными органами"
    kaz: '"Қазақстан Республикасы Көлiк және коммуникациялар министрлiгiнiң Көлiктiк бақылау комитетi және оның аумақтық органдарының әкiмшiлiк құқық бұзушылықтар туралы iс жүргiзу жөнiндегi нұсқаулығын бекiту туралы" Қазақстан Республикасы Көлiк және коммуникациялар министрлiгi Көлiктiк бақылау комитетi төрағасының 2004 жылғы 23 ақпандағы № 13-2-Ө бұйрығына өзгерістер енгізу туралы'
