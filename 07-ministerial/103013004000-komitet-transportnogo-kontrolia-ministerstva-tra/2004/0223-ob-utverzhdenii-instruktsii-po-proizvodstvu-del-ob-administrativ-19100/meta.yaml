  title:
    rus: О внесении дополнений и изменений в приказ Председателя Комитета транспортного контроля Министерства транспорта и коммуникаций Республики Казахстан от 23 февраля 2004 года № 13-2-П "Об утверждении Инструкции по производству дел об административных правонарушениях Комитетом транспортного контроля Министерства транспорта и коммуникаций Республики Казахстан и его территориальными органами"
    kaz: '"Қазақстан Республикасы Көлік және коммуникациялар министрлігінің Көліктік бақылау комитеті және оның аумақтық органдарының әкімшілік құқық бұзушылықтар туралы іс жүргізу жөніндегі нұсқаулығын бекіту туралы" Қазақстан Республикасы Көлік және коммуникациялар министрлігінің Көліктік бақылау комитеті төрағасының 2004 жылғы 23 ақпандағы № 13-2-Ө бұйрығына толықтырулар мен өзгерістер енгізу туралы'
