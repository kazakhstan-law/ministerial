  title:
    rus: О внесении изменений в приказ председателя Комитета санитарно-эпидемиологического контроля Министерства здравоохранения Республики Казахстан от 9 июня 2023 года № 70-НҚ «Об утверждении квалификационных требований к административным государственным должностям корпуса «Б» Комитета санитарно-эпидемиологического контроля Министерства здравоохранения Республики Казахстан и его территориальных подразделений»
    kaz: «Қазақстан Республикасының Денсаулық сақтау министрлігі Санитариялық-эпидемиологиялық бақылау комитетінің және оның аумақтық бөлімшелерінің «Б» корпусы мемлекеттік әкімшілік лауазымдарына қойылатын біліктілік талаптарын бекіту туралы» Қазақстан Республикасының Денсаулық сақтау министрлігі Санитариялық-эпидемиологиялық бақылау комитеті төрағасының 2023 жылғы 9 маусымдағы № 70-НҚ бұйрығына өзгерістер енгізу туралы
