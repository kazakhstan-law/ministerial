act_code: '182908'
requisite: Приказ Председателя Комитета санитарно-эпидемиологического контроля Министерства здравоохранения Республики Казахстан от 9 июня 2023 года № 70-НҚ. Утратил силу приказом Председателя Комитета санитарно-эпидемиологического контроля Министерства здравоохранения РК от 18 марта 2025 года № 26-НҚ (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении квалификационных требований к административным государственным должностям корпуса «Б» Комитета санитарно-эпидемиологического контроля Министерства здравоохранения Республики Казахстан и его территориальных подразделений
  kaz: Қазақстан Республикасының Денсаулық сақтау министрлігі Санитариялық-эпидемиологиялық бақылау комитетінің және оның аумақтық бөлімшелерінің «Б» корпусы мемлекеттік әкімшілік лауазымдарына қойылатын біліктілік талаптарын бекіту туралы
