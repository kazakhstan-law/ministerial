act_code: '166882'
requisite: Приказ Председателя Комитета санитарно-эпидемиологического контроля Министерства здравоохранения Республики Казахстан от 21 апреля 2022 года № 53-НҚ. Утратил силу приказом Председателя Комитета санитарно-эпидемиологического контроля Министерства здравоохранения Республики Казахстан от 9 июня 2023 года № 70-НҚ (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об утверждении квалификационных требований к административным государственным должностям корпуса «Б» Комитета санитарно-эпидемиологического контроля Министерства здравоохранения Республики Казахстан
  kaz: Қазақстан Республикасының Денсаулық сақтау министрлігі Санитариялық-эпидемиологиялық бақылау комитетінің «Б» корпусы мемлекеттік әкімшілік лауазымдарына қойылатын біліктілік талаптарын бекіту туралы
