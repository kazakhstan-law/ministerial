  title:
    rus: О внесении изменений в приказ Председателя Комитета санитарно-эпидемиологического контроля Министерства здравоохранения Республики Казахстан от 15 октября 2020 года № 1-НҚ «Об утверждении положений территориальных подразделений (районных и городов районного значения) республиканского государственного учреждения «Комитет санитарно-эпидемиологического контроля Министерства здравоохранения Республики Казахстан»
    kaz: «Қазақстан Республикасының Денсаулық сақтау министрлігі Санитариялық-эпидемиологиялық бақылау комитеті» республикалық мемлекеттік мекемесінің (аудандық және аудандық маңызы бар қалаларының) аумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасының Денсаулық сақтау министрлігі Санитариялық-эпидемиологиялық бақылау комитеті төрағасының 2020 жылғы 15 қазандағы № 1-НҚ бұйрығына өзгерістер енгізу туралы
