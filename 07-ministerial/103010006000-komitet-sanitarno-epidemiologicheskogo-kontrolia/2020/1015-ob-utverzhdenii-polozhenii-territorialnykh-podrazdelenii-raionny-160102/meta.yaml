title:
  rus: Об утверждении положений территориальных подразделений (районных и городов районного значения) республиканского государственного учреждения «Комитет санитарно-эпидемиологического контроля Министерства здравоохранения Республики Казахстан»
  kaz: «Қазақстан Республикасының Денсаулық сақтау министрлігі Санитариялық-эпидемиологиялық бақылау комитеті» республикалық мемлекеттік мекемесінің (аудандық және аудандық маңызы бар қалаларының) аумақтық бөлімшелерінің ережелерін бекіту туралы
