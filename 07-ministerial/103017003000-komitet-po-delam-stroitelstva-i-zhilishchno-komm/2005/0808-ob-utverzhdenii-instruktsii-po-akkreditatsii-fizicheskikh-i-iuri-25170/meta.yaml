act_code: '25170'
requisite: Приказ Председателя Комитета по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и торговли Республики Казахстан от 8 августа 2005 года N 243. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 августа 2005 года за N 3816. Утратил силу приказом первого заместителя Премьер-Министра Республики Казахстан - Министра регионального развития Республики Казахстан от 26 июля 2013 года № 163/НҚ
title:
  rus: Об утверждении Инструкции по аккредитации физических и юридических лиц для проведения экспертной оценки на соответствие заявителей (соискателей лицензий) и (или) лицензиатов квалификационным требованиям
  kaz: Өтініш берушілердің (лицензияға талапкерлердің) және (немесе) лицензиаттардың біліктілік талаптарына сай екеніне сараптамалық бағалау жүргізу үшін заңды және жеке тұлғаларды тіркеу жөніндегі нұсқаулықты бекіту туралы
