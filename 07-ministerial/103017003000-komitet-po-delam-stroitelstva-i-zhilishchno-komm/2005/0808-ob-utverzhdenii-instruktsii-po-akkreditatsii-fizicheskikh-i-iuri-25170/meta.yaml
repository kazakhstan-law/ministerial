  code: '27349'
  requisite: Приказ Председателя Комитета по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и торговли Республики Казахстан от 21 апреля 2006 года № 158. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 апреля 2006 года № 4210. Утратил силу приказом первого заместителя Премьер-Министра Республики Казахстан - Министра регионального развития Республики Казахстан от 26 июля 2013 года № 163/НҚ
  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и торговли Республики Казахстан от 8 августа 2005 года N 243 "Об утверждении Инструкции по аккредитации физических и юридических лиц для проведения экспертной оценки на соответствие заявителей (соискателей лицензий) и (или) лицензиатов квалификационным требованиям"
    kaz: '"Өтiнiш берушiлердiң (лицензия алуға талапкерлердiң) және (немесе) лицензиаттардың бiлiктiлiк талаптарына сәйкес келуіне сараптамалық бағалау жүргiзу үшiн жеке және заңды тұлғаларды аккредиттеу жөніндегі нұсқаулықты бекіту туралы" Қазақстан Республикасы Индустрия және сауда министрлігінің Құрылыс және тұрғын үй-коммуналдық шаруашылық істері комитеті төрағасының 2005 жылғы 8 тамыздағы N 243 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/27349/rus
