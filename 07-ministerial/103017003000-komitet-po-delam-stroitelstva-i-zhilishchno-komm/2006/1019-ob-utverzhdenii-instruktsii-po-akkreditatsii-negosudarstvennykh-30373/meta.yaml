requisite: Приказ Председателя Комитета по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и торговли Республики Казахстан от 19 октября 2006 года № 399. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 ноября 2006 года № 4452. Утратил силу приказом первого заместителя Премьер-Министра Республики Казахстан - Министра регионального развития Республики Казахстан от 26 июля 2013 года № 163/НҚ
title:
  rus: Об утверждении Инструкции по аккредитации негосударственных экспертных центров и аттестации экспертов, осуществляющих экспертизу проектов строительства объектов, не относящихся к исключительной компетенции государственной экспертизы
  kaz: Құрылыс объектілерінің жобаларына сараптаманы жүзеге асыратын, мемлекеттік сараптаманың ерекше құзыретіне жатпайтын мемлекеттік емес сараптама орталықтарын аккредиттеу және сарапшыларды аттестаттау жөніндегі нұсқаулықты бекіту туралы
