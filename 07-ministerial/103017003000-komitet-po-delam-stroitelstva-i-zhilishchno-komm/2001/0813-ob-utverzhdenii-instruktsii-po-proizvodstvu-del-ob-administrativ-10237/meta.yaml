requisite: Приказ Председателя Комитета по делам строительства Министерства экономики и торговли Республики Казахстан от 14 августа 2001 г. N 170. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 октября 2001 г. N 1658. Утратил силу приказом Председателя Комитета по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и торговли РК от 2 августа 2006 года N 300
title:
