act_code: '19102'
requisite: Приказ Председателя Комитета по делам строительства Министерства индустрии и торговли Республики Казахстан от 1 марта 2004 года N 81. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 марта 2004 года N 2759. Утратил силу приказом Председателя Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства от 2 февраля 2012 года № 36
title:
  rus: Об учреждении формы поощрения Комитета по делам строительства Министерства индустрии и торговли Республики Казахстан в виде почетных нагрудных знаков "Казакстаннын курметтi саулетшiсi" и "Казакстаннын курметтi курылысшысы"
  kaz: Қазақстан Республикасының Индустрия және сауда министрлігі Құрылыс істері жөніндегі комитетінің "Қазақстанның құрметті сәулетшісі" және "Қазақстанның құрметті құрылысшысы" омырауға тағатын құрмет белгілері түріндегі көтермелеу нысанын тағайындау туралы
