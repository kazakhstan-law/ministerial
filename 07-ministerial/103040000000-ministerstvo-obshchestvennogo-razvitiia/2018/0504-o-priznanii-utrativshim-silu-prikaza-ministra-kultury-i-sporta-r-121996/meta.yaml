title:
  rus: О признании утратившим силу приказа Министра культуры и спорта Республики Казахстан от 22 декабря 2015 года № 404 «Об утверждении Положения о Координационном совете по взаимодействию с неправительственными организациями при уполномоченном органе»
  kaz: «Уәкілетті орган жанындағы үкіметтік емес ұйымдармен өзара іс-қимыл жасау жөніндегі үйлестіру кеңесі туралы ережесін бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2015 жылғы 22 желтоқсандағы № 404 бұйрығының күші жойылсын деп тану туралы
