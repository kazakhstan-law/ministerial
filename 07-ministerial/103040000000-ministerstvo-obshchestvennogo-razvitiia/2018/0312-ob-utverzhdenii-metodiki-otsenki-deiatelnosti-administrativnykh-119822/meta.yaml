requisite: Приказ Министра по делам религий и гражданского общества Республики Казахстан от 12 марта 2018 года № 22. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 марта 2018 года № 16640. Утратил силу приказом Министра информации и общественного развития Республики Казахстан от 26 августа 2019 года № 299 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства общественного развития Республики Казахстан
  kaz: Қазақстан Республикасы Қоғамдық даму министрлігінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы
