  requisite: Приказ Министра общественного развития Республики Казахстан от 29 ноября 2018 года № 01-01/79. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 декабря 2018 года № 17859. Утратил силу приказом Министра информации и общественного развития Республики Казахстан от 12 ноября 2019 года № 433 (вводится в действие со дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказы Министра по делам религий и гражданского общества Республики Казахстан от 23 февраля 2017 года № 18 «Об утверждении Правил выдачи служебного удостоверения Министерства по делам религий и гражданского общества Республики Казахстан и его описания» и от 12 марта 2018 года № 22 «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства по делам религий и гражданского общества Республики Казахстан»
    kaz: Қазақстан Республикасы Дін істері және азаматтық қоғам министрінің «Қазақстан Республикасы Дін істері және азаматтық қоғам министрлігінің қызметтік куәлігін беру қағидаларын және оның сипаттамасын бекіту туралы» 2017 жылғы 23 ақпандағы № 18 және «Қазақстан Республикасы Дін істері және азаматтық қоғам министрлігінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» 2018 жылғы 12 наурыздағы № 22 бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/126516/rus
