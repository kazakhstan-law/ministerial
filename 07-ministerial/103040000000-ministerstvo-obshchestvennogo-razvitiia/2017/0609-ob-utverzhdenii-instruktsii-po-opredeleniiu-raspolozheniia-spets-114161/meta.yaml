  title:
    rus: О внесении изменений в приказ Министра по делам религий и гражданского общества Республики Казахстан от 9 июня 2017 года № 89 «Об утверждении Инструкции по определению расположения специальных стационарных помещений для распространения религиозной литературы и иных информационных материалов религиозного содержания, предметов религиозного назначения, а также помещений для проведения религиозных мероприятий за пределами культовых зданий (сооружений)»
    kaz: «Діни әдебиетті және діни мазмұндағы өзге де ақпараттық материалдарды, діни мақсаттағы заттарды тарату үшін арнайы стационарлық үй-жайлардың, сондай-ақ ғибадат үйлерінен (ғимараттарынан) тыс жерлерде діни іс-шараларды өткізуге арналған үй-жайлардың орналастырылуын айқындау жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Дін істері және азаматтық қоғам министрінің 2017 жылғы 9 маусымдағы № 89 бұйрығына өзгерістер енгізу туралы
