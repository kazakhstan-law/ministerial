act_code: '114161'
requisite: Приказ Министра по делам религий и гражданского общества Республики Казахстан от 9 июня 2017 года № 89. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 августа 2017 года № 15432
title:
  rus: Об утверждении Инструкции по определению расположения специальных стационарных помещений для распространения религиозной литературы и иных информационных материалов религиозного содержания, предметов религиозного назначения, а также помещений для проведения религиозных мероприятий за пределами культовых зданий (сооружений)
  kaz: Діни әдебиетті және діни мазмұндағы өзге де ақпараттық материалдарды, діни мақсаттағы заттарды тарату үшін арнайы стационарлық үй-жайлардың, сондай-ақ ғибадат үйлерінен (ғимараттарынан) тыс жерлерде діни іс-шараларды өткізуге арналған үй-жайлардың орналастырылуын айқындау жөніндегі нұсқаулықты бекіту туралы
