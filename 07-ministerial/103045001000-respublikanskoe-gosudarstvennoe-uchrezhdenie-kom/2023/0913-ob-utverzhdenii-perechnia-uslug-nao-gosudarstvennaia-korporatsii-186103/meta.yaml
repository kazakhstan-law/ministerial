  title:
    rus: «О внесении изменений и дополнений в приказ и.о. Председателя Комитета государственных услуг Министерства цифрового развития, инноваций и аэрокосмической промышленности Республики Казахстан от 13 сентября 2023 года № 400/НҚ «Об утверждении перечня услуг НАО «Государственная корпорация «Правительство для граждан», оказываемых через отделы обслуживания населения, а также через Единый контакт-центр 1414»
    kaz: «Азаматтарға арналған үкімет» мемлекеттік корпорациясы» КЕАҚ Халыққа қызмет көрсету бөлімдері арқылы және 1414 Бірыңғай байланыс орталығы арқылы көрсетілетін қызметтердің тізбесін бекіту туралы» Қазақстан Республикасы Цифрлық даму, инновациялар және аэроғарыш өнеркәсібі министрлiгiнің Мемлекеттік көрсетілетін қызметтер комитеті төрағасының м.а. 2023 жылғы 13 қыркүйектегі № 400/НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы
