act_code: '11287'
requisite: Приказ Председателя Комитета по водным ресурсам Министерства природных ресурсов и охраны окружающей среды Республики Казахстан от 12 декабря 2001 года N 105-П. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 января 2002 года N 1726. Утратил силу - совместным приказом Министра охраны окружающей среды РК от 2 декабря 2004 года N 315-п, и.о. Председателя Комитета по водным ресурсам Министерства сельского хозяйства от 17 ноября 2004 года N 239-п,  Председателя Комитета государственного санитарно-эпидемиологического надзора Министерства здравоохранения РК от 19 ноября 2004 года N 37 (V043262)
title:
  rus: Об утверждении Инструкции по осуществлению государственного контроля за использованием и охраной водных ресурсов должностными лицами государственных уполномоченных органов управления водными ресурсами
  kaz: '"Қазақстан Республикасының су ресурстарын басқару жөніндегі мемлекеттік өкілетті органдарының лауазымды тұлғаларымен су ресурстарын пайдалану мен қорғауға мемлекеттік бақылауды жүзеге асырудың нұсқауын бекіту туралы"'
