  requisite: Приказ Председателя Комитета по водным ресурсам Министерства сельского хозяйства Республики Казахстан от 10 августа 2018 года № 210. Отменен приказом и.о. Председателя Комитета водного хозяйства Министерства водных ресурсов и ирригации Республики Казахстан от 26 октября 2023 года № 1-НҚ (вступает в силу со дня подписания)
  title:
    rus: «О внесении изменения в приказ Председателя Комитета по водным ресурсам Министерства сельского хозяйства Республики Казахстан от 15 декабря 2016 года № 175 «Об утверждении положений бассейновых инспекций по регулированию использования и охране водных ресурсов Комитета по водным ресурсам Министерства сельского хозяйства Республики Казахстан»
    kaz: «Қазақстан Республикасы Ауыл шаруашылығы министрлігі Су ресурстары комитетінің Су ресурстарын пайдалануды реттеу және қорғау жөніндегі Балқаш-Алакөл бассейндік инспекциясы» республикалық мемлекеттік мекемесі туралы Қазақстан Республикасы Ауыл шаруашылығы министрлгі Су ресурстары комитеті төрағасының 2016 жылғы 15 желтоқсандағы № 175 бұйрығына өзгеріс енгізу туралы»
