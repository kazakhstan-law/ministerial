  title:
    rus: О внесении изменения в приказ Председателя Комитета по водным ресурсам Министерства сельского хозяйства Республики Казахстан от 15 декабря 2016 года № 175 «Об утверждении Положений бассейновых инспекций по регулированию использования и охране водных ресурсов Комитета по водным ресурсам Министерства сельского хозяйства Республики Казахстан»
    kaz: «Қазақстан Республикасы Ауыл шаруашылығы министрлігі Су ресурстары комитетінің Су ресурстарын пайдалануды реттеу және қорғау жөніндегі бассейндік инспекцияларының ережелерін бекіту туралы» Қазақстан Республикасы Ауыл шаруашылығы министрлігі Су ресурстары комитеті төрағасының 2016 жылғы 15 желтоқсандағы № 175 бұйрығына өзгеріс енгізу туралы
