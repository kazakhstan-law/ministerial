act_code: '224284'
requisite: Приказ Министра обороны Республики Казахстан от 14 апреля 2026 года № 363
title:
  rus: Об утверждении Перечня закрытых и обособленных военных городков, иных закрытых объектов, содержание служебных жилищ и централизованное отопление в которых обеспечиваются за счет бюджетных средств, а также в которых служебное жилище не подлежит приватизации и об отмене приказа Министра обороны Республики Казахстан от 27 августа 2025 года № 1165 «Об утверждении Перечня закрытых и обособленных военных городков, иных закрытых объектов, содержание служебных жилищ и централизованное отопление  в которых обеспечиваются за счет бюджетных средств, а также в которых служебное жилище не подлежит приватизации»
  kaz: Қызметтік тұрғынжайды ұстау және орталықтандырылған жылыту бюджет қаражаты есебінен қамтамасыз етілетін, сондай-ақ қызметтік тұрғынжайы жекешелендіруге жатпайтын жабық және оқшауланған әскери қалашықтардың, өзге де жабық объектілердің тізбесін бекіту және «Қызметтік тұрғынжайларды ұстау және орталықтандырылған жылыту жүйесі бюджет қаражаты есебінен қамтамасыз етілетін, сондай-ақ қызметтік тұрғынжайы жекешелендіруге жатпайтын жабық және оқшауланған әскери қалашықтардың, өзге де жабық объектілердің тізбесін бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2025 жылғы 27 тамыздағы № 1165 бұйрығының күшін жою туралы
