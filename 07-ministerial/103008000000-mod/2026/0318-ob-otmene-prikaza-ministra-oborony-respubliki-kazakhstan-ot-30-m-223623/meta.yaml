title:
  rus: Об отмене приказа Министра обороны Республики Казахстан от 30 мая 2025 года № 639 «Об утверждении тарифной сметы на оказываемые платные услуги государственными учреждениями Вооруженных Сил Республики Казахстан, в сфере аэропортовской деятельности»
  kaz: «Қазақстан Республикасы Қарулы Күштерінің мемлекеттік мекемелері әуежай қызметі саласында көрсететін ақылы қызметтерге тарифтік сметаны бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2025 жылғы 30 мамырдағы № 639 бұйрығының күшін жою туралы
