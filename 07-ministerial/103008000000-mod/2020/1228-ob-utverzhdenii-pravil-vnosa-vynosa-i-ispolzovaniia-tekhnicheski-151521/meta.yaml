requisite: Приказ Министра обороны Республики Казахстан от 28 декабря 2020 года № 749дсп. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 января 2021 года № 22038. Утратил силу приказом Министра обороны Республики Казахстан от 13 октября 2022 года № 909дсп
title:
  rus: Об утверждении Правил вноса, выноса и использования технических средств служебного пользования (абонентских устройств сотовой связи и мобильных устройств) в Министерстве обороны и Вооруженных Силах Республики Казахстан
  kaz: Қазақстан Республикасының Қорғаныс министрлігінде және Қарулы Күштерінде қызметтік пайдаланудағы техникалық құралдарды (ұялы байланыстың абоненттік құрылғыларын және мобильді құрылғыларды) кіргізу, шығару және пайдалану қағидаларын бекіту туралы
