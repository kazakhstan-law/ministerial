title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача специального разрешения на пролет над территорией запретных зон и зон ограничения полетов после согласования со Службой государственной охраны Республики Казахстан и с органами национальной безопасности»
  kaz: «Тыйым салынған аймақтар мен ұшуға шектеу қойылған аймақтар аумағының үстінен ұшып өтуге Қазақстан Республикасының Мемлекеттік күзет қызметімен және ұлттық қауіпсіздік органдарымен келісілгеннен кейін арнайы рұқсат беру» мемлекеттік қызметін көрсету қағидаларын бекіту туралы
