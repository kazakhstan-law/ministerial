  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 2 июня 2020 года № 250 «Об утверждении Правил оказания государственной услуги «Выдача специального разрешения на пролет над территорией запретных зон и зон ограничения полетов после согласования со Службой государственной охраны Республики Казахстан и с органами национальной безопасности»
    kaz: «Тыйым салынған аймақтар мен ұшуға шектеу қойылған аймақтар аумағының үстінен ұшып өтуге Қазақстан Республикасының Мемлекеттік күзет қызметімен және ұлттық қауіпсіздік органдарымен келісілгеннен кейін арнайы рұқсат беру» мемлекеттік қызметін көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2020 жылғы 2 маусымдағы № 250 бұйрығына өзгерістер енгізу туралы
