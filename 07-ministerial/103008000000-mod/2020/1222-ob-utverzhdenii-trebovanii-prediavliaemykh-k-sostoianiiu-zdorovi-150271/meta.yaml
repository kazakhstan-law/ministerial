    kaz: «Қазақстан Республикасының Қарулы Күштерінде, басқа да әскерлері мен әскери құралымдарында қызмет өткеру үшін адамдар денсаулық жағдайына қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2020 жылғы 22 желтоқсандағы № 722 бұйрығына өзгеріс енгізу туралы
