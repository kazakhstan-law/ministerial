title:
  rus: Об утверждении Правил оказания государственной услуги «Апостилирование архивных справок и копий архивных документов, исходящих из Центрального архива Министерства обороны Республики Казахстан»
  kaz: «Қазақстан Республикасы Қорғаныс министрлігінің Орталық архивінен шығатын архивтік анықтамаларға және архивтік құжаттардың көшірмелеріне апостиль қою» мемлекеттік қызметін көрсету қағидаларын бекіту туралы
