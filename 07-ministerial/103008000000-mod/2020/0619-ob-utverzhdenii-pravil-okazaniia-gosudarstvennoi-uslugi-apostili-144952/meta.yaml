    kaz: «Қазақстан Республикасы Қорғаныс министрлігінің Орталық архивінен шығатын архивтік анықтамаларға және архивтік құжаттардың көшірмелеріне апостиль қою» мемлекеттік қызметін көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2020 жылғы 19 маусымдағы № 281 бұйрығына өзгерістер мен толықтырулар енгізу туралы
