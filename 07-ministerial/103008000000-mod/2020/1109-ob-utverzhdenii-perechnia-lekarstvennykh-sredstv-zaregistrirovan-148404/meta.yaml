title:
  rus: Об утверждении Перечня лекарственных средств, зарегистрированных в Республике Казахстан и не включенных в лекарственный формуляр военно-медицинских учреждений (организаций), используемых в Вооруженных Силах Республики Казахстан при оказании медицинской помощи
  kaz: Медициналық көмек көрсету кезінде Қазақстан Республикасының Қарулы Күштерінде пайдаланылатын Қазақстан Республикасында тіркелген және әскери-медициналық мекемелердің (ұйымдардың) дәрілік формулярына енгізілмеген дәрілік заттар тізбесін бекіту туралы
