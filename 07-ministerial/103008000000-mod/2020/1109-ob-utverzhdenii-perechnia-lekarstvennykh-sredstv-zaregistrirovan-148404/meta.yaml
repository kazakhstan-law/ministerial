  title:
    rus: О внесении изменений и дополнений в приказ Министра обороны Республики Казахстан от 9 ноября 2020 года № 612 «Об утверждении Перечня лекарственных средств, зарегистрированных в Республике Казахстан и не включенных в лекарственный формуляр военно-медицинских учреждений (организаций), используемых в Вооруженных Силах Республики Казахстан при оказании медицинской помощи»
    kaz: «Медициналық көмек көрсету кезінде Қазақстан Республикасының Қарулы Күштерінде пайдаланылатын Қазақстан Республикасында тіркелген және әскери-медициналық мекемелердің (ұйымдардың) дәрілік формулярына енгізілмеген дәрілік заттар тізбесін бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2020 жылғы 9 қарашадағы № 612 бұйрығына өзгерістер мен толықтырулар енгізу туралы
