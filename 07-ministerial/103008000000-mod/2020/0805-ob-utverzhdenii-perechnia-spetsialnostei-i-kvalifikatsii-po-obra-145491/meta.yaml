  title:
    rus: О внесении изменения и дополнений в приказ Министра обороны Республики Казахстан от 5 августа 2020 года № 370 дсп «Об утверждении перечня специальностей и квалификаций, образовательных программ, реализуемых в военных учебных заведениях, подведомственных Министерству обороны Республики Казахстан»
    kaz: «Мамандықтар мен біліктіліктердің, Қазақстан Республикасының Қорғаныс министрлігіне ведомстволық бағынысты әскери оқу орындарында іске асырылатын білім беру бағдарламаларының тізбесін бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2020 жылғы 5 тамыздағы № 370 қбп бұйрығына өзгеріс пен толықтырулар енгізу туралы
