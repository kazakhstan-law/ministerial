requisite: Приказ Министра обороны Республики Казахстан от 23 апреля 2002 года № 178. Зарегистрирован Министерством юстиции Республики Казахстан 26 июня 2002 года № 1893. Утратил силу приказом Министра обороны Республики Казахстан от 19 августа 2009 года № 293
title:
  rus: О введении в действие Правил о порядке исчисления стажа работы по специальности работников воинских частей, учреждений Вооруженных Сил Республики Казахстан, не являющихся государственными служащими
  kaz: Қазақстан Республикасы Қарулы Күштерi Әскери бөлiмдерiнiң, мекемелерiнiң мемлекеттiк қызметшi емес қызметкерлерiнiң мамандықтары бойынша жұмыс стажын есептеудiң тәртiбi туралы ережелердi қолданысқа енгізу туралы
