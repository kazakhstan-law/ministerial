title:
  rus: О введении в действие Правил о порядке установления процентной надбавки за выслугу лет рабочим воинских частей и учреждений Вооруженных Сил Республики Казахстан
  kaz: Қазақстан Республикасы Қарулы Күштерiнiң Әскери бөлiмдерi мен мекемелерiнiң жұмысшыларына еңбек сiңiрген жылдары үшін пайыздық үстемеақы белгiлеудiң тәртiбi туралы ережелердi қолданысқа енгiзу туралы
