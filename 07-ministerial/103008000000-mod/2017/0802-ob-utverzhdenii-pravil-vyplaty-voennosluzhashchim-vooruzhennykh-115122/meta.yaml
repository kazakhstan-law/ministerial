title:
  rus: Об утверждении Правил выплаты военнослужащим Вооруженных Сил Республики Казахстан, за исключением курсантов, кадетов, военнослужащих срочной службы и военнослужащих, проходящих воинскую службу в резерве, денег за счет бюджетных средств за перевозку собственного имущества в пределах Республики Казахстан
  kaz: Курсанттарды, кадеттерді, мерзімді қызметтегі әскери қызметшілерді және резервтегі әскери қызметті өткеріп жүрген әскери қызметшілерді қоспағанда, Қазақстан Республикасы Қарулы Күштерінің әскери қызметшілеріне Қазақстан Республикасы шегінде өз мүлкін жеткізу үшін бюджет қаражаты есебінен ақша төлеу қағидаларын бекіту туралы
