  requisite: Приказ Министра обороны Республики Казахстан от 5 мая 2025 года № 517
  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 2 августа 2017 года № 404 «Об утверждении Правил выплаты военнослужащим Вооруженных Сил Республики Казахстан, за исключением курсантов, кадетов и военнослужащих срочной службы денег за счет государства за перевозку собственного имущества в пределах Республики Казахстан»
    kaz: «Курсанттарды, кадеттерді және мерзімді қызметтегі әскери қызметшілерді қоспағанда, Қазақстан Республикасы Қарулы Күштерінің әскери қызметшілеріне Қазақстан Республикасының шегінде өз мүлкін тасымалдау үшін мемлекет есебінен ақша төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 2 тамыздағы № 404 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/209938/rus
