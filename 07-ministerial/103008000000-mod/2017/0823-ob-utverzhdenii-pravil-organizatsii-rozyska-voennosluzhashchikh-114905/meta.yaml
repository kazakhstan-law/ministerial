act_code: '114905'
requisite: Приказ и.о. Министра обороны Республики Казахстан от 23 августа 2017 года № 473. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 сентября 2017 года № 15767. Утратил силу приказом Министра обороны Республики Казахстан от 23 мая 2023 года № 486 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации розыска военнослужащих, скрывающихся от органов дознания, следствия и суда, а также самовольно оставивших месторасположение воинских частей Вооруженных Сил Республики Казахстан
  kaz: Анықтау, тергеу органдарынан және соттан жасырынып жүрген, сондай-ақ Қазақстан Республикасы Қарулы Күштерінің әскери бөлімдері орналасқан жерді өз бетінше тастап кеткен әскери қызметшілерді іздестіруді ұйымдастыру қағидаларын бекіту туралы
