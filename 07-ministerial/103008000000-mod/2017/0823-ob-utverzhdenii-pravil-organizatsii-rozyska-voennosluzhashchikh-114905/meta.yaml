  title:
    rus: О внесении изменения и дополнения в приказ Министра обороны Республики Казахстан от 23 августа 2017 года № 473 «Об утверждении Правил организации розыска военнослужащих, скрывающихся от органов дознания, следствия и суда, а также самовольно оставивших месторасположение воинских частей Вооруженных Сил Республики Казахстан»
    kaz: «Анықтау, тергеу органдарынан және соттан жасырынып жүрген, сондай-ақ Қазақстан Республикасы Қарулы Күштерінің әскери бөлімдері орналасқан жерді өз бетінше тастап кеткен әскери қызметшілерді іздестіруді ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 23 тамыздағы № 473 бұйрығына өзгеріс пен толықтыру енгізу туралы
