requisite: Приказ Министра обороны Республики Казахстан от 14 марта 2017 года № 113. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 июля 2017 года № 15393. Утратил силу приказом Министра обороны Республики Казахстан от 4 августа 2021 года № 500 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандартов государственных услуг Министерства обороны Республики Казахстан
  kaz: Қазақстан Республикасы Қорғаныс министрлігінің мемлекеттік көрсетілетін қызметтер стандарттарын бекіту туралы
