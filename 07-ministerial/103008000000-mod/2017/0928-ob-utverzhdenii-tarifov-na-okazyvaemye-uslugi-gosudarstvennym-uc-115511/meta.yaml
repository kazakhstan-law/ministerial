act_code: '115511'
requisite: Приказ Министра обороны Республики Казахстан от 28 сентября 2017 года № 552. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 октября 2017 года № 15929. Утратил силу приказом Министра обороны Республики Казахстан от 28 июля 2025 года № 911 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении тарифов на оказываемые услуги государственным учреждением Вооруженных Сил Республики Казахстан, специализирующимся в области культуры, предоставляемые на платной основе
  kaz: Қазақстан Республикасы Қарулы Күштерінің мәдениет саласында маманданатын мемлекеттік мекемесі ақылы негізде көрсететін қызметке тарифті бекіту туралы
