    kaz: «Қазақстан Республикасы Қарулы Күштерінің мәдениет саласында маманданатын мемлекеттік мекемесі ақылы негізде көрсететін қызметтерге тарифтерді бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 28 қыркүйектегі № 552 бұйрығына өзгерістер мен толықтыру енгізу туралы
