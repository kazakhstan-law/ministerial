  title:
    rus: О внесении изменения в приказ Министра обороны Республики Казахстан от 28 сентября 2017 года № 552 «Об утверждении тарифов на оказываемые услуги, предоставляемые на платной основе Национальным военно-патриотическим центром Вооруженных Сил Республики Казахстан»
    kaz: «Қазақстан Республикасы Қарулы Күштерінің Ұлттық әскери-паториоттық орталығымен ақылы негізде көрсетілетін қызметтерге тарифтерді бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 28 қыркүйектегі № 552 бұйрығына өзгеріс енгізу туралы
