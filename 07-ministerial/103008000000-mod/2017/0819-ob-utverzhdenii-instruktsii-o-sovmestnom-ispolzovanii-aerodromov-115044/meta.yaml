  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 19 августа 2017 года № 462 «Об утверждении Инструкции о совместном использовании аэродромов (вертодромов), посадочных площадок средств обеспечения и управления полетами государственной авиации Республики Казахстан»
    kaz: «Қазақстан Республикасы мемлекеттік авиациясының әуеайлақтарын (тікұшақ айлақтарын), қону алаңдарын, ұшуды қамтамасыз ету және басқару құралдарын бірлесіп пайдалану туралы нұсқаулықты бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 19 тамыздағы № 462 бұйрығына өзгерістер енгізу туралы
