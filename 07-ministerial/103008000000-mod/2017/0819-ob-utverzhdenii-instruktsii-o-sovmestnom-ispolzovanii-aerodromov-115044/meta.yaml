title:
  rus: Об утверждении Инструкции о совместном использовании аэродромов (вертодромов), посадочных площадок средств обеспечения и управления полетами государственной авиации Республики Казахстан
  kaz: Қазақстан Республикасы мемлекеттік авиациясының әуеайлақтарын (тікұшақ айлақтарын), қону алаңдарын, ұшуды қамтамасыз ету және басқару құралдарын бірлесіп пайдалану туралы нұсқаулықты бекіту туралы
