title:
  rus: Об утверждении Инструкции по организации движения автотранспорта, средств наземного обеспечения полетов и пешеходов на аэродромах (вертодромах) государственной авиации Республики Казахстан
  kaz: Қазақстан Республикасы мемлекеттік авиациясының әуеайлақтарында (тікұшақ айлақтарында) автокөліктің, ұшуды жерүсті қамтамасыз ету құралдарының және жаяу жүргіншілердің қозғалысын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
