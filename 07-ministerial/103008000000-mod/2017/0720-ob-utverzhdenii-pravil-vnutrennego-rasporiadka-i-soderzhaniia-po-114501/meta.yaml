requisite: Приказ Министра обороны Республики Казахстан от 20 июля 2017 года № 366. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 августа 2017 года № 15526. Утратил силу приказом Министра обороны Республики Казахстан  от 12 апреля 2023 года № 322 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил внутреннего распорядка и содержания подозреваемых и обвиняемых на гауптвахте органов военной полиции Вооруженных Сил Республики Казахстан
  kaz: Қазақстан Республикасы Қарулы Күштерінің әскери полиция органдарының гауптвахтасындағы ішкі тәртіптеме және онда күдіктілер мен айыпталушыларды ұстау тәртібі қағидаларын бекіту туралы
