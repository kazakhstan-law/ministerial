  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 3 августа 2017 года № 412 «Об утверждении тарифов на оказываемые услуги государственным учреждением Вооруженных Сил Республики Казахстан, специализирующимся в области спорта, предоставляемые на платной основе»
    kaz: «Спорт саласында маманданатын Қазақстан Республикасы Қарулы Күштерінің мемлекеттік мекемесі ақылы негізде көрсететін қызметтерге тарифтерді бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 3 тамыздағы № 412 бұйрығына өзгерістер енгізу туралы
