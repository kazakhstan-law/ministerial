act_code: '114633'
requisite: Приказ Министра обороны Республики Казахстан от 3 августа 2017 года № 412. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 сентября 2017 года № 15624. Утратил силу приказом Министра обороны Республики Казахстан от 28 июля 2025 года № 911 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
