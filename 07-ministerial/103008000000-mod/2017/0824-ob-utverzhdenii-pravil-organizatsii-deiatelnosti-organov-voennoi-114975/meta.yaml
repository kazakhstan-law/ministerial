requisite: Приказ Министра обороны Республики Казахстан от 24 августа 2017 года № 477. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 сентября 2017 года № 15764. Утратил силу приказом Министра обороны Республики Казахстан от 20 апреля 2023 года № 355 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации деятельности органов военной полиции Вооруженных Сил Республики Казахстан по обеспечению безопасности дорожного движения транспортных средств Вооруженных Сил Республики Казахстан
  kaz: Қазақстан Республикасы Қарулы Күштерінің әскери полиция органдарының Қазақстан Республикасының Қарулы Күштері көлік құралдарының жол жүрісі қауіпсіздігін қамтамасыз ету жөніндегі қызметін ұйымдастыру қағидаларын бекіту туралы
