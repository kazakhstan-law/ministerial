  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 12 июля 2017 года № 351 «Об утверждении Правил реагирования командования воинских частей и органов военной полиции Вооруженных Сил Республики Казахстан на информацию о хищении, утрате оружия и боеприпасов либо самовольном оставлении военнослужащим месторасположения воинской части с оружием»
    kaz: «Қару мен оқ-дәрінің ұрлануы, жоғалуы не әскери қызметшінің әскери бөлім орналасқан жерді қаруымен өз бетінше тастап кетуі туралы ақпаратқа Қазақстан Республикасы Қарулы Күштері әскери бөлімдері қолбасшылығының және әскери полиция органдарының ден қою қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 12 шілдедегі № 351 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/147261/rus
