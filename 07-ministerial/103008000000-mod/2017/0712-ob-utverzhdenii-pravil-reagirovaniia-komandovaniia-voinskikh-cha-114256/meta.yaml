title:
  rus: Об утверждении Правил реагирования командования воинских частей и органов военной полиции Вооруженных Сил Республики Казахстан на информацию о хищении, утрате оружия и боеприпасов либо самовольном оставлении военнослужащим месторасположения воинской части с оружием
  kaz: Қару мен оқ-дәрінің ұрлануы, жоғалуы не әскери қызметшінің әскери бөлім орналасқан жерді қаруымен өз бетінше тастап кетуі туралы ақпаратқа Қазақстан Республикасы Қарулы Күштері әскери бөлімдері қолбасшылығының және әскери полиция органдарының ден қою қағидаларын бекіту туралы
