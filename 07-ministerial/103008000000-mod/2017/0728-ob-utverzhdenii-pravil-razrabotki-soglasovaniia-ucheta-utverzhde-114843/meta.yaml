requisite: Приказ Министра обороны Республики Казахстан от 28 июля 2017 года № 394. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 сентября 2017 года № 15734. Утратил силу приказом Министра обороны Республики Казахстан от 5 марта 2019 года № 134 (вводится в действие с 10 апреля 2019 года)
title:
  rus: Об утверждении Правил разработки, согласования, учета, утверждения, экспертизы, изменения, отмены и введения в действие военных стандартов на товары (продукцию) военного назначения, товары (продукцию) двойного назначения (применения), работы военного назначения и услуги военного назначения
  kaz: Әскери мақсаттағы тауарларға (өнімге), қосарланған мақсаттағы (қолданыстағы) тауарларға (өнімге), әскери мақсаттағы жұмыстар мен әскери мақсаттағы көрсетілетін қызметтерге арналған әскери стандарттарды әзірлеу, келісу, есепке алу, бекіту, сараптама жасау, өзгерту, күшін жою және қолданысқа енгізу қағидаларын бекіту туралы
