  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 8 августа 2017 года № 431 «Об утверждении Правил выплаты денежной компенсации в размере стоимости общевойскового пайка при отсутствии возможности обеспечения питанием по установленным нормам основных продовольственных пайков военнослужащим по контракту Вооруженных Сил Республики Казахстан»
    kaz: «Қазақстан Республикасы Қарулы Күштерінің келісімшарт бойынша әскери қызметшілерін негізгі азық-түлік үлестерінің белгіленген нормалары бойынша тамақтандыруды қамтамасыз етуге мүмкін болмаған кезде жалпы әскери үлес құны мөлшерінде ақшалай өтемақы төлеу қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 8 тамыздағы № 431 бұйрығына өзгерістер енгізу туралы
