requisite: Приказ Министра обороны Республики Казахстан от 18 июля 2017 года № 363. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 августа 2017 года № 15555. Утратил силу приказом Министра обороны Республики Казахстан от 15 июля 2025 года № 828 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания услуг государственным учреждением Вооруженных Сил Республики Казахстан, специализирующимся в области спорта, и использования денег от реализации таких услуг
  kaz: Спорт саласында маманданатын Қазақстан Республикасы Қарулы Күштері мемлекеттік мекемесінің қызметтерді көрсету және осындай көрсетілетін қызметтерді  өткізуден түсетін ақшаны пайдалану қағидаларын бекіту туралы
