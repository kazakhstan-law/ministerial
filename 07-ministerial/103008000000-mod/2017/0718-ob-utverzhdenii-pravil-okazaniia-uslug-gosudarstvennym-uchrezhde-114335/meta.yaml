  title:
    rus: О внесении изменений и дополнений в приказ Министра обороны Республики Казахстан от 18 июля 2017 года № 363 «Об утверждении Правил оказания услуг государственным учреждением Вооруженных Сил Республики Казахстан, специализирующимся в области спорта, и использования денег от реализации таких услуг»
    kaz: «Спорт саласында маманданатын Қазақстан Республикасы Қарулы Күштері мемлекеттік мекемесінің қызметтерді көрсету және осындай көрсетілетін қызметтерді өткізуден түсетін ақшаны пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 18 шілдедегі № 363 бұйрығына өзгерістер мен толықтырулар енгізу туралы
