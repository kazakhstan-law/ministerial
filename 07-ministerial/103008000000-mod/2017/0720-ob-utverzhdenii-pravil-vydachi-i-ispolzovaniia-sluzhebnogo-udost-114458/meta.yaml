requisite: Приказ Министра обороны Республики Казахстан от 20 июля 2017 года № 370. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 августа 2017 года № 15561. Утратил силу приказом Министра обороны Республики Казахстан от 19 июня 2020 года № 280 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил выдачи и использования служебного удостоверения военнослужащим органа контроля и надзора за деятельностью государственной авиации Республики Казахстан и его описания
  kaz: Қазақстан Республикасы мемлекеттік авиациясы қызметін бақылау және қадағалау органының әскери қызметшілеріне қызметтік куәлігін беру және пайдалану қағидаларын және оның сипаттамасын бекіту туралы
