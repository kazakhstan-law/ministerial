title:
  rus: Об утверждении Правил ношения военной формы одежды и знаков различия Вооруженных Сил, других войск и воинских формирований Республики Казахстан, а также других знаков
  kaz: Қазақстан Республикасы Қарулы Күштерінің, басқа да әскерлері мен әскери құралымдарының әскери киім нысанын киіп жүру және айырым белгілерін, сондай-ақ басқа да белгілерді тағып жүру қағидаларын бекіту туралы
