title:
  rus: Об утверждении описания персонифицированных знаков, нагрудных знаков и иных военно-геральдических знаков, знаков об окончании военных учебных заведений, для классных специалистов, наградных медалей (значков) для призеров военно-прикладных, служебно-прикладных, технических и других спортивных мероприятий, а также порядка их выдачи и ношения военнослужащими Вооруженных Сил Республики Казахстан
  kaz: Дербестендірілген белгілердің, омырауға тағатын белгілердің және өзге де әскери- геральдикалық белгілердің, әскери оқу орындарын бітіргені туралы, сыныпты мамандарға арналған белгілердің, әскери-қолданбалы, қызметтік-қолданбалы, техникалық және басқа да спорттық іс-шаралардың жүлдегерлеріне арналған наградалық медальдардың (белгілердің) сипаттамасын, сондай-ақ оларды беру және Қазақстан Республикасы Қарулы Күштері әскери қызметшілерінің тағып жүру тәртібін бекіту туралы
