  title:
    rus: О внесении изменений и дополнений в приказ Министра обороны Республики Казахстан от 24 июля 2017 года № 380 «Об утверждении Правил организации и обеспечения сопровождения колонн военных транспортных средств и транспортных средств специального назначения, регулирования дорожного движения на автомобильных дорогах и улицах во время прохождения этих колонн»
    kaz: «Әскери көлік құралдарының және арнайы мақсаттағы көлік құралдарының колонналарына ілесіп жүруді ұйымдастыру және қамтамасыз ету, автомобиль жолдары мен көшелерде осы колонналар өтетін уақытта жол жүрісін реттеу қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 24 шілдедегі № 380 бұйрығына өзгерістер мен толықтырулар енгізу туралы
