act_code: '114558'
requisite: Приказ Министра обороны Республики Казахстан от 24 июля 2017 года № 380. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 сентября 2017 года № 15626. Утратил силу приказом Министра обороны Республики Казахстан от 12 апреля 2023 года № 320 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации и обеспечения сопровождения колонн военных транспортных средств и транспортных средств специального назначения, регулирования дорожного движения на автомобильных дорогах и улицах во время прохождения этих колонн
  kaz: Әскери көлік құралдарының және арнайы мақсаттағы көлік құралдарының колонналарына ілесіп жүруді ұйымдастыру және қамтамасыз ету, автомобиль жолдары мен көшелерде осы колонналар өтетін уақытта жол жүрісін реттеу қағидаларын бекіту туралы
