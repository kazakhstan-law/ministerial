  title:
    rus: О внесении изменений в приказы Министра обороны Республики Казахстан от 22 декабря 2017 года № 751 «Об утверждении Правил временного назначения на вакантные воинские должности военнослужащих нижестоящего состава либо граждан» и 22 декабря 2022 года № 1247 «Об утверждении Инструкции по применению Правил прохождения воинской службы в Вооруженных Силах Республики Казахстан и внесении изменений и дополнений в некоторые приказы Министра обороны Республики Казахстан»
    kaz: Қазақстан Республикасы Қорғаныс министрінің «Төмен тұрған құрамның әскери қызметшілерін не азаматтарды бос әскери лауазымға уақытша тағайындау қағидаларын бекіту туралы» 2017 жылғы 22 желтоқсандағы № 751 және «Қазақстан Республикасының Қарулы Күштерінде әскери қызмет өткеру қағидаларын қолдану жөніндегі нұсқаулықты бекіту және Қазақстан Республикасы Қорғаныс министрінің кейбір бұйрықтарына өзгерістер мен толықтырулар енгізу туралы» 2022 жылғы 22 желтоқсандағы № 1247 бұйрықтарына өзгерістер енгізу туралы
