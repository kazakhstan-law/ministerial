    kaz: «Төмен тұрған құрамның әскери қызметшілерін, тиісті құрамның әскери міндеттілерін не азаматтарды бос әскери лауазымдарға уақытша тағайындау қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 22 желтоқсандағы № 751 бұйрығына өзгерістер енгізу туралы
