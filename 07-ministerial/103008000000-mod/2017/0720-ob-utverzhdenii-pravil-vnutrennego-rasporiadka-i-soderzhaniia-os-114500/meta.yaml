  title:
    rus: О внесении изменений в приказы Министра обороны Республики Казахстан от 20 июля 2017 года № 367 «Об утверждении Правил внутреннего распорядка и содержания осужденных на гауптвахте органов военной полиции Вооруженных Сил Республики Казахстан» и от 20 июля 2017 года № 368 «Об утверждении Правил отбывания военнослужащими административного ареста на гауптвахте органов военной полиции Вооруженных Сил Республики Казахстан»
    kaz: «Қазақстан Республикасы Қарулы Күштерінің әскери полиция органдарының гауптвахтасындағы ішкі тәртіптеме және онда сотталғандарды ұстау қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 20 шілдедегі № 367 және «Әскери қызметшiлердiң Қазақстан Республикасы Қарулы Күштері әскери полиция органдарының гауптвахтасында әкiмшiлiк қамауды өтеу қағидаларын бекiту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 20 шілдедегі № 368 бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/124942/rus
