  title:
    rus: О внесении изменения и дополнений в приказ Министра обороны Республики Казахстан от 17 июля 2017 года № 357 «Об утверждении Правил набора призывников, военнообязанных, их направления и обучения на безвозмездной и возмездной основах, организации учебно-воспитательного процесса, а также сроки обучения по военно-техническим и иным специальностям в специализированных организациях Министерства обороны Республики Казахстан»
    kaz: «Қазақстан Республикасы Қорғаныс министрлігінің мамандандырылған ұйымдарында əскери-техникалық жəне өзге де мамандықтар бойынша əскерге шақырылушыларды, əскери міндеттілерді жинау, оларды жіберу жəне өтеусіз жəне өтеулі негіздерде оқыту, оқу-тəрбие процесін ұйымдастыру қағидаларын, сондай-ақ оқу мерзімдерін бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 17 шілдедегі № 357 бұйрығына өзгеріс пен толықтырулар енгізу туралы
