  title:
    rus: О внесении изменений в приказы Министра обороны Республики Казахстан от 12 июля 2017 года № 350 «Об утверждении Правил подготовки по военно-техническим и иным специальностям» и от 17 июля 2017 года № 357 «Об утверждении Правил набора призывников, военнообязанных, их направления и обучения на безвозмездной и возмездной основах, организации учебно-воспитательного процесса, а также сроки обучения по военно-техническим и иным специальностям в специализированных организациях Министерства обороны Республики Казахстан»
    kaz: Қазақстан Республикасы Қорғаныс министрінің «Әскери-техникалық және өзге де мамандықтар бойынша дайындық қағидаларын бекіту туралы» 2017 жылғы 12 шілдедегі № 350 және «Қазақстан Республикасы Қорғаныс министрлігінің мамандандырылған ұйымдарында әскери-техникалық және өзге де мамандықтар бойынша әскерге шақырылушыларды, әскери міндеттілерді жинау, оларды жіберу және өтеусіз және өтеулі негіздерде оқыту, оқу-тәрбие процесін ұйымдастыру қағидаларын, сондай-ақ оқу мерзімдерін бекіту туралы» 2017 жылғы 17 шілдедегі № 357 бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/216317/rus
