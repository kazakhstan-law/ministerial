  title:
    rus: О внесении изменений и дополнений в приказ Министра обороны Республики Казахстан от 17 июля 2017 года № 357 «Об утверждении Правил набора призывников, военнообязанных, их направления и обучения на безвозмездной и возмездной основах, организации учебно-воспитательного процесса, а также сроков обучения по военно-техническим и иным специальностям в специализированных организациях Министерства обороны Республики Казахстан»
    kaz: «Қазақстан Республикасы Қорғаныс министрлігінің мамандандырылған ұйымдарында әскери-техникалық және өзге де мамандықтар бойынша әскерге шақырылушыларды, әскери міндеттілерді жинау, оларды жіберу және өтеусіз және өтеулі негіздерде оқыту, оқу-тәрбие процесін ұйымдастыру қағидаларын, сондай-ақ оқу мерзімдерін бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 17 шілдедегі № 357 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/157774/rus
