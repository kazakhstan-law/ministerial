act_code: '113486'
requisite: Приказ Министра обороны Республики Казахстан от 5 июня 2017 года № 265. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 июля 2017 года № 15314. Утратил силу приказом Министра обороны Республики Казахстан от 15 ноября 2017 года № 662 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил назначения (в том числе временно) на воинские должности военнообязанных соответствующего состава, военнослужащих нижестоящего состава и лиц гражданского персонала при невозможности назначения на них военнослужащих соответствующего состава
  kaz: Тиісті құрамның әскери қызметшілерін әскери лауазымдарға тағайындау мүмкін болмаған кезде оларға тиісті құрамның әскери міндеттілерін, төмен тұрған құрамның әскери қызметшілерін және азаматтық персонал адамдарын тағайындау (оның ішінде уақытша) қағидаларын бекіту туралы
