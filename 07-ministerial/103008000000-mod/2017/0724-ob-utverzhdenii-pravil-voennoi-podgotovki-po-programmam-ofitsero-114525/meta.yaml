  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 24 июля 2017 года № 375 «Об утверждении Правил военной подготовки по программам офицеров запаса и сержантов запаса» и об отмене приказа Министра обороны Республики Казахстан от 31 июля 2025 года № 933 «О внесении изменений и дополнений в приказ Министра обороны Республики Казахстан от 24 июля 2017 года № 375 «Об утверждении Правил военной подготовки по программам офицеров и сержантов запаса»
    kaz: «Запастағы офицерлер мен запастағы сержанттар бағдарламалары бойынша әскери дайындық қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 24 шілдедегі № 375 бұйрығына өзгерістер енгізу туралы және «Запастағы офицерлер мен запастағы сержанттар бағдарламалары бойынша әскери дайындық қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 24 шілдедегі № 375 бұйрығына өзгерістер мен толықтырулар енгізу туралы» Қазақстан Республикасы Қорғаныс министрінің 2025 жылғы 31 шілдедегі № 933 бұйрығының күшін жою туралы
