    kaz: «Әскери қызметшiлердiң Қазақстан Республикасы Қарулы Күштері әскери полиция органдарының гауптвахтасында әкiмшiлiк қамауды өтеу қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2017 жылғы 20 шілдедегі № 368 бұйрығына өзгерістер енгізу туралы
