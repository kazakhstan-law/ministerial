title:
  rus: Об утверждении описания и образца бланка Грамоты Президента Республики Казахстан к Боевому Знамени воинской части и учреждения Вооруженных Сил, других войск и воинских формирований Республики Казахстан
  kaz: Қазақстан Республикасы Қарулы Күштері, басқа да әскерлері мен әскери құралымдары әскери бөлімі мен мекемесінің Жауынгерлік Туына Қазақстан Республикасы Президентінің Грамотасы бланкісінің сипаттамасы мен үлгісін бекіту туралы
