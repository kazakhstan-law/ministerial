act_code: '196100'
requisite: Приказ Министра обороны Республики Казахстан от 24 апреля 2024 года № 414
title:
  rus: Об утверждении фасона и расцветки специальной формы одежды, знаков различия и нашиваемых знаков отличия к ней, нарукавных знаков различия к парадной, повседневной и полевой форме одежды, обозначающих принадлежность к органам военного управления, соединениям, частям, военным учебным заведениям, нашиваемых знаков для классных специалистов Вооруженных Сил Республики Казахстан
  kaz: Қазақстан Республикасы Қарулы Күштері арнайы киім нысанының фасоны мен түсін, әскери басқару органына, құрамасына, бөліміне, әскери оқу орнына тиесілікті білдіретін салтанатты, күнделікті және далалық киім нысанына айырым белгісін және оған тігілетін ерекшелік белгісін, жеңдегі айырым белгісі мен сыныптық мамандары үшін тігілетін белгіні бекіту туралы
