act_code: '198843'
requisite: Приказ Министра обороны Республики Казахстан от 11 июля 2024 года № 718. Отменен приказом Министра обороны Республики Казахстан от 25 апреля 2025 года № 472 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм обеспечения мыломоющими средствами, инструментами и инвентарем для уборки служебных, бытовых, производственных помещений и территорий на объектах Министерства обороны Республики Казахстан
  kaz: Қазақстан Республикасы Қорғаныс министрлігі объектілеріндегі қызметтік, тұрмыстық, өндірістік үй-жайлар мен аумақты жинау үшін сабын-жуғыш заттармен, құрал-сайман мен және құралдармен қамтамасыз етудің заттай нормаларын бекіту туралы»
