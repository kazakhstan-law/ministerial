  title:
    rus: О внесении изменений и дополнений в приказ Министра обороны Республики Казахстан от 30 ноября 1998 года N 210 "Об утверждении Правил о прохождении лицами офицерского состава военной службы и службы в запасе Вооруженных Сил Республики Казахстан", зарегистрирован в Министерстве юстиции Республики Казахстан N 747
    kaz: Қазақстан Республикасының Әділет министрлігінде N 747 болып тіркелген "Офицерлік құрам адамдарының Қазақстан Республикасының Қарулы Күштерінде әскери қызметті және запастағы қызметті өткеруі туралы ережені бекіту туралы" Қазақстан Республикасы Қорғаныс министрінің 1998 жылғы 30 қарашадағы N 210 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/18087/rus
