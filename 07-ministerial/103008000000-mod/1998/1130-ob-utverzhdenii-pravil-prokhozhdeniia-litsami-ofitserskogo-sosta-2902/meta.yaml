title:
  rus: Об утверждении Правил прохождения лицами офицерского состава военной службы и службы в запасе Вооруженных Сил Республики Казахстан
  kaz: Офицерлік құрамдағы адамдардың Қазақстан Республикасының Қарулы Күштерінде әскери қызметті және запастағы қызметті өткеру Ережесін бекіту туралы
