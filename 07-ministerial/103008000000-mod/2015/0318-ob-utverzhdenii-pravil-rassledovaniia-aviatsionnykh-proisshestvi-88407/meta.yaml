  title:
    rus: О внесении изменений и дополнений в приказ Министра обороны Республики Казахстан от 18 марта 2015 года № 145 «Об утверждении Правил расследования авиационных происшествий и инцидентов в государственной авиации Республики Казахстан»
    kaz: «Қазақстан Республикасының мемлекеттік авиациясындағы авиациялық оқиғалар мен инциденттерді тексеру қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2015 жылғы 18 наурыздағы № 145 бұйрығына өзгерістер мен толықтырулар енгізу туралы
