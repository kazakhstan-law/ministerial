title:
  rus: Об утверждении Правил расследования авиационных происшествий и инцидентов в государственной авиации Республики Казахстан
  kaz: Қазақстан Республикасында мемлекеттік авиациядағы авиациялық оқиғалар мен оқыс оқиғаларды тергеп-тексеру қағидаларын бекіту туралы
