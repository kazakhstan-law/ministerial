requisite: Приказ Министра обороны Республики Казахстан от 11 июня 2015 года № 330. Зарегистрирован в Министерстве юстиции Республики Казахстан 9 июля 2015 года № 11614. Утратил силу приказом Министра обороны Республики Казахстан от 22 января 2016 года № 35
title:
  rus: Об утверждении Правил приема в военные учебные заведения Министерства обороны Республики Казахстан, реализующие общеобразовательные учебные программы общего среднего образования с дополнительными программами по военной подготовке
  kaz: Әскери даярлық бойынша қосымша бағдарламалармен жалпы орта білімнің жалпы білім беру оқу бағдарламаларын іске асыратын Қазақстан Республикасы Қорғаныс министрлігінің әскери оқу орындарына қабылдау қағидаларын бекіту туралы
