  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 11 июня 2015 года № 333 «Об утверждении перечня местностей, служба в которых дает военнослужащим право на предоставление ежегодного основного отпуска, независимо от выслуги лет, продолжительностью 40 суток»
    kaz: «Әскери қызметшілерге еңбек сіңірген жылдарына қарамастан, ұзақтығы 40 тәулік жыл сайынғы негізгі демалыс беру құқығын беретін қызмет өткеру жерлерінің тізбесін бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2015 жылғы 11 маусымдағы № 333 бұйрығына өзгерістер енгізу туралы
