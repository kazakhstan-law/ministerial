title:
  rus: Об утверждении перечня местностей, служба в которых дает военнослужащим право на предоставление к ежегодному основному отпуску дополнительно 10 суток отпуска
  kaz: Әскери қызметшілерге ондағы қызметі жыл сайынғы негізгі демалысқа қосымша 10 тәулік демалыс беру құқығын беретін жергілікті жерлердің тізбесін бекіту туралы
