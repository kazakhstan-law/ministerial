  title:
    rus: О внесении изменений и дополнений в приказ Министра обороны Республики Казахстан от 21 января 2015 года № 30 «Об утверждении Правил принятия на вооружение Вооруженных Сил, других войск и воинских формирований Республики Казахстан вооружения и военной техники»
    kaz: «Қазақстан Республикасының Қарулы Күштерін, басқа да әскерлері мен әскери құралымдарын қаруландыруға қару-жарақ пен әскери техниканы қабылдау қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2015 жылғы 21 қаңтардағы № 30 бұйрығына өзгерістер мен толықтырулар енгізу туралы
