act_code: '93567'
requisite: Приказ Министра обороны Республики Казахстан от 31 июля 2015 года № 440ДСП. Зарегистрирован в Министерстве юстиции Республики Казахстан от 02 сентября 2015 года № 11998
title:
  rus: Об утверждении Правил действий дежурных сил, средств и должностных лиц Министерства обороны Республики Казахстан по применению оружия, боевой техники и специальных средств для пресечения актов терроризма в воздушном пространстве, во внутренних водах, в территориальном море, на континентальном шельфе Республики Казахстан, при обеспечении безопасности мореплавания
  kaz: Қазақстан Республикасының әуе кеңістігінде, ішкі суларында, аумақтық теңізінде, континенттік қайраңында терроризм актілерінің жолын кесу үшін, теңізде жүзу қауіпсіздігін қамтамасыз ету кезінде қаруды, жауынгерлік техниканы және арнайы құралдарды қолдану бойынша Қазақстан Республикасы Қорғаныс министрлігі кезекші күштерінің, құралдары мен лауазымды адамдарының іс-қимыл жасау қағидаларын бекіту туралы
