  title:
    rus: О внесении изменений и дополнений в приказ Министра обороны Республики Казахстан от 2 июля 2015 года № 373 «Об утверждении Правил проведения военно-врачебной экспертизы и Положения об органах военно-врачебной экспертизы в Вооруженных Силах Республики Казахстан»
    kaz: «Қазақстан Республикасының Қарулы Күштерінде әскери-дәрігерлік сараптаманы жүргізу қағидасын және әскери-дәрігерлік сараптама органдары туралы ережені бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2015 жылғы 2 шілдедегі № 373 бұйрығына өзгерістер мен толықтырулар енгізу туралы
