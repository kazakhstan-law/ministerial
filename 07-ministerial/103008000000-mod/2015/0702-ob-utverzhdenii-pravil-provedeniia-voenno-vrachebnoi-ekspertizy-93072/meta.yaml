    kaz: «Қазақстан Республикасының Қарулы Күштерінде әскери-дәрігерлік сараптаманы жүргізу қағидаларын және әскери-дәрігерлік сараптама органдары туралы ережені бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2015 жылғы 2 шілдедегі № 373 бұйрығына өзгерістер енгізу туралы
