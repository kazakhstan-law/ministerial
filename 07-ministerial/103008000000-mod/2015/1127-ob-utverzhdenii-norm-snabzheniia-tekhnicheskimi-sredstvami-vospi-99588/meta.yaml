  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 27 ноября 2015 года № 679 «Об утверждении норм снабжения техническими средствами воспитания и другим культурно-просветительным имуществом, комплектами полиграфического оборудования типографий Вооруженных Сил Республики Казахстан»
    kaz: «Қазақстан Республикасының Қарулы Күштерін техникалық тәрбие құралдарымен және басқа да мәдени-ағарту мүлкімен, баспаханаларының полиграфиялық жабдығы жиынтықтарымен жабдықтау нормаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2015 жылғы 27 қарашадағы № 679 бұйрығына өзгерістер енгізу туралы
