act_code: '99588'
requisite: Приказ Министра обороны Республики Казахстан от 27 ноября 2015 года № 679. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 февраля 2016 года № 13315. Утратил силу приказом Министра обороны Республики Казахстан от 28 декабря 2023 года № 1382 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм снабжения техническими средствами воспитания и другим культурно-просветительным имуществом, комплектами полиграфического оборудования типографий Вооруженных Сил Республики Казахстан
  kaz: Қазақстан Республикасының Қарулы Күштерін техникалық тәрбие құралдарымен және басқа да мәдени-ағарту мүлкімен, баспаханаларының полиграфиялық жабдығы жиынтықтарымен жабдықтау нормаларын бекіту туралы
