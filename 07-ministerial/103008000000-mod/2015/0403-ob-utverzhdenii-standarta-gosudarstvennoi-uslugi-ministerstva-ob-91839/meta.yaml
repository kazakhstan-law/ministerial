    kaz: '"Азаматтарды әскери-техникалық және басқа да әскери мамандықтар бойынша даярлау туралы" Қазақстан Республикасы Қорғаныс министрлігінің мемлекеттік көрсетілетін қызмет стандартын бекіту туралы" Қазақстан Республикасы Қорғаныс министрінің 2015 жылғы 3 сәуірдегі 170 бұйрығына өзгеріс енгізу туралы'
