requisite: Приказ Министра обороны Республики Казахстан от 3 апреля 2015 года № 170. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 июля 2015 года № 11536. Утратил силу приказом Министра обороны Республики Казахстан от 14 марта 2017 года № 113 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги Министерства обороны Республики Казахстан «Подготовка граждан по военно-техническим и другим военным специальностям»
