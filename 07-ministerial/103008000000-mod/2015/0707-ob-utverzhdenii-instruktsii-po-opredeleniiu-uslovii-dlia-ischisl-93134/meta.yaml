  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 7 июля 2015 года № 383 «Об утверждении Инструкции по определению условий для исчисления выслуги лет летному составу Вооруженных Сил Республики Казахстан на льготных условиях при назначении пенсии»
    kaz: «Жеңілдік жағдайларында зейнетақы тағайындау кезінде Қазақстан Республикасы Қарулы Күштерінің ұшқыштар құрамына еңбек сіңірген жылдарын есептеу жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2015 жылғы 7 шілдедегі № 383 бұйрығына өзгерістер енгізу туралы
