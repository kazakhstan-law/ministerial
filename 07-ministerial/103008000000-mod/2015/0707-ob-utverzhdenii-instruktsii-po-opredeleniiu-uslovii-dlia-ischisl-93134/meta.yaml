title:
  rus: Об утверждении Инструкции по определению условий для исчисления выслуги лет летному составу Вооруженных Сил Республики Казахстан на льготных условиях при назначении пенсии
  kaz: Жеңілдік жағдайларында зейнетақы тағайындау кезінде Қазақстан Республикасы Қарулы Күштерінің ұшқыштар құрамына еңбек сіңірген жылдарын есептеу үшін шарттарды айқындау жөніндегі нұсқаулықты бекіту туралы
