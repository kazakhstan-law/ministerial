  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 30 октября 2019 года № 871 «Об утверждении Правил оказания платных видов деятельности по реализации услуг государственными учреждениями Вооруженных Сил по оказанию медицинской помощи в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования и расходования ими денег от реализации услуг»
    kaz: «Қарулы Күштер мемлекеттік мекемелерінің тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмек көрсету бойынша көрсетілетін қызметтерді өткізу жөніндегі ақылы қызмет түрлерін көрсету және олардың көрсетілетін қызметтерді өткізуден түсетін ақшаны жұмсау қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2019 жылғы 30 қазандағы № 871 бұйрығына өзгерістер енгізу туралы
