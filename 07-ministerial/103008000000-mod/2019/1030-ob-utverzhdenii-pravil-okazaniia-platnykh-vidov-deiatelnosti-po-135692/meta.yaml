act_code: '135692'
requisite: Приказ Министра обороны Республики Казахстан от 30 октября 2019 года № 871. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 ноября 2019 года № 19541. Утратил силу приказом Министра обороны Республики Казахстан от 15 июля 2025 года № 828 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации услуг государственными учреждениями Вооруженных Сил по оказанию медицинских услуг (помощи) в рамках гарантированного объема бесплатной медицинской помощи и в системе обязательного социального медицинского страхования и расходования ими денег от реализации услуг
  kaz: Қарулы Күштер мемлекеттік мекемелерінің тегін медициналық көмектің кепілдік берілген көлемі шеңберінде және міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық қызмет (көмек) көрсету бойынша көрсетілетін қызметті өткізу жөніндегі ақылы қызмет түрін көрсету және олардың көрсетілетін қызметті өткізуден түсетін ақшаны жұмсау қағидаларын бекіту туралы
