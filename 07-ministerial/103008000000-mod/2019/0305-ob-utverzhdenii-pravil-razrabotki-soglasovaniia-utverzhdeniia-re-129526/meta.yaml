act_code: '129526'
requisite: Приказ Министра обороны Республики Казахстан от 5 марта 2019 года № 134. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 марта 2019 года № 18379. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 27 декабря 2019 года № 945 (вводится в действие с 1 января 2020 года)
title:
  rus: Об утверждении Правил разработки, согласования, утверждения, регистрации, учета, изменения, пересмотра, отмены и введения в действие военных национальных стандартов, используемых для нужд Вооруженных Сил, других войск и воинских формирований Республики Казахстан
  kaz: Қазақстан Республикасы Қарулы Күштерінің, басқа да әскерлері мен әскери құралымдарының мұқтажы үшін пайдаланылатын әскери ұлттық стандарттарды әзірлеу, келісу, бекіту, тіркеу, есепке алу, өзгерту, қайта қарау, күшін жою және қолданысқа енгізу қағидаларын бекіту туралы
