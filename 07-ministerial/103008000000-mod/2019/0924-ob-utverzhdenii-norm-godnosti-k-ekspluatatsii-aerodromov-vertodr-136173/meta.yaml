title:
  rus: «Об утверждении Норм годности к эксплуатации аэродромов (вертодромов), аэродромных участков автомобильных дорог и тактико-технические требования, предъявляемые к аэродромам государственной авиации Республики Казахстан»
  kaz: Әуеайлақтардың (тікұшақ айлақтарының), автомобиль жолдарының әуеайлақтық учаскелерінің пайдалануға жарамдылығының нормаларын және Қазақстан Республикасы мемлекеттік авиациясының әуеайлақтарына қойылатын тактикалық-техникалық талаптарды бекіту туралы
