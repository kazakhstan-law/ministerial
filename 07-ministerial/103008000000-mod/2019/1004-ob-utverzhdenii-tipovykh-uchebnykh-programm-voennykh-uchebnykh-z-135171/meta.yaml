  title:
    rus: О внесении изменений и дополнения в приказ Министра обороны Республики Казахстан от 4 октября 2019 года № 792 «Об утверждении типовых учебных программ военных учебных заведений, подведомственных Министерству обороны Республики Казахстан»
    kaz: «Қазақстан Республикасының Қорғаныс министрлігіне ведомстволық бағынысты әскери оқу орындарының үлгілік оқу бағдарламаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2019 жылғы 4 қазандағы № 792 бұйрығына өзгерістер мен толықтыру енгізу туралы
