  kaz: Қазақстан Республикасы Қарулы Күштерінің әскери мүлкін пайдалануды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы (жүк көтеру механизмдерін, қысыммен жұмыс істейтін қазандықтар мен ыдыстарын)
