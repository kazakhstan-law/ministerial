  title:
    rus: О внесении изменений и дополнения в приказ Министра обороны Республики Казахстан от 15 мая 2019 года № 337 «Об утверждении типовых учебных планов военных учебных заведений, подведомственных Министерству обороны Республики Казахстан»
    kaz: «Қазақстан Республикасының Қорғаныс министрлігіне ведомстволық бағынысты әскери оқу орындарының үлгілік оқу жоспарларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2019 жылғы 15 мамырдағы № 337 бұйрығына өзгерістер мен толықтыру енгізу туралы
