title:
  rus: Об утверждении Правил о служебных командировках личного состава Вооруженных Сил Республики Казахстан в пределах Республики Казахстан и Правил возмещения личному составу Вооруженных Сил Республики Казахстан расходов на служебные командировки, в том числе в иностранные государства
  kaz: Қазақстан Республикасы Қарулы Күштері жеке құрамының Қазақстан Республикасының шегіндегі қызметтік іссапарлары туралы қағидаларды және Қазақстан Республикасы Қарулы Күштерінің жеке құрамына қызметтік іссапарларға, оның ішінде шет мемлекеттерге арналған шығыстарды өтеу қағидаларын бекіту туралы
