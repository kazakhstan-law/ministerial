    kaz: Қазақстан Республикасының Қарулы Күштерінде әскери қызмет өткеру қағидаларын қолдану жөніндегі нұсқаулықты бекіту және Қазақстан Республикасы Қорғаныс министрінің кейбір бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
