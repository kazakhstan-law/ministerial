act_code: '213921'
requisite: Приказ Министра обороны Республики Казахстан от 27 августа 2025 года № 1165. Отменен приказом Министра обороны Республики Казахстан от 14 апреля 2026 года № 363 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Перечня закрытых и обособленных военных городков, иных закрытых объектов, содержание служебных жилищ и централизованное отопление в которых обеспечиваются за счет бюджетных средств, а также в которых служебное жилище не подлежит приватизации
  kaz: Қызметтік тұрғынжайларды ұстау жəне орталықтандырылған жылыту жүйесі бюджет қаражаты есебінен қамтамасыз етілетін, сондай-ақ қызметтік тұрғынжайы жекешелендіруге жатпайтын жабық жəне оқшауланған əскери қалашықтардың, өзге де жабық объектілердің тізбесін бекіту туралы
