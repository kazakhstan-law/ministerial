title:
  rus: Об утверждении натуральных норм обеспечения лекарственными средствами и медицинскими изделиями (изделиями медицинского назначения и медицинской техники) воинских частей и учреждений, военно-медицинских подразделений Вооруженных Сил Республики Казахстан на военное время
  kaz: Қазақстан Республикасы Қарулы Күштерінің әскери бөлімдері мен мекемелерін, әскери-медициналық бөлімшелерін дәрілік заттармен және медициналық бұйыммен (медициналық мақсаттағы бұйыммен және медициналық техникамен) қамтамасыз етудің соғыс уақытына арналған заттай нормаларын бекіту туралы
