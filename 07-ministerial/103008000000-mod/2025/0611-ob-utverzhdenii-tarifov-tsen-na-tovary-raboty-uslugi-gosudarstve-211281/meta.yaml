title:
  rus: Об утверждении тарифов (цен) на товары (работы, услуги) государственных учреждений Вооруженных Сил, которым предоставлено право осуществлять приносящую доходы деятельность, деньги от реализации которых остаются в их распоряжении
  kaz: Өткізуден түскен ақша өз билігінде қалатын, кіріс әкелетін қызметті жүзеге асыру құқығы берілген Қарулы Күштер мемлекеттік мекемелерінің тауарына (жұмысына, көрсетілетін қызметіне) тарифті (бағаны) бекіту туралы
