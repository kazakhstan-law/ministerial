act_code: '214576'
requisite: Приказ Министра обороны Республики Казахстан от 19 сентября 2025 года № 1307
title:
  rus: Об утверждении Правил взаимодействия структурных подразделений Министерства обороны, Генерального штаба и Вооруженных Сил Республики Казахстан при осуществлении государственных закупок в интересах Министерства обороны Республики Казахстан
  kaz: Қазақстан Республикасы Қорғаныс министрлігінің мүддесінде мемлекеттік сатып алуды жүзеге асырған кезде Қазақстан Республикасының Қорғаныс министрлігі, Бас штабы және Қарулы Күштері құрылымдық бөлімшелерінің өзара іс-қимыл жасау қағидаларын бекіту туралы
