act_code: '210397'
requisite: Приказ Министра обороны Республики Казахстан от 25 апреля 2025 года № 472
title:
  rus: Об утверждении натуральных норм обеспечения мыломоющими средствами, инструментами и инвентарем для уборки служебных, бытовых, производственных помещений и территорий на объектах Министерства обороны Республики Казахстан
  kaz: Қазақстан Республикасы Қорғаныс министрлігінің объектілерінде қызметтік, тұрмыстық, өндірістік үй-жай мен аумақты жинау үшін сабын-жуғыш заттармен, құрал-сайманмен және құралмен қамтамасыз етудің заттай нормасын бекіту туралы
