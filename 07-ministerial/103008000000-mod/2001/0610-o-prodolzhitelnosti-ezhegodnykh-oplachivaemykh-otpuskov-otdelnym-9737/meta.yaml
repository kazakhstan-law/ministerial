act_code: '9737'
requisite: Приказ Министра обороны Республики Казахстан от 11 июня 2001 года N 155. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 августа 2001 года N 1615. Утратил силу приказом Министра обороны Республики Казахстан от 30 ноября 2006 года № 451.
title:
  rus: О продолжительности ежегодных оплачиваемых отпусков отдельным категориям гражданского персонала воинских частей, учреждений, предприятий и организаций Министерства обороны Республики Казахстан, содержащихся за счет государственного бюджета
  kaz: Қазақстан Республикасы Қорғаныс министрлігі әскери бөлімдерінің, мекемелерінің, кәсіпорындарының және ұйымдарының мемлекеттік бюджет есебінен қамтамасыз етілетін азаматтық қызметкерлері кейбір санаттарының жыл сайынғы ақылы демалыстарының ұзақтығы туралы
