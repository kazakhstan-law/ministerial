  title:
    rus: О внесении изменения в приказ Министра обороны Республики Казахстан от 11 июня 2001 года N 155 "О продолжительности ежегодных оплачиваемых отпусков, отдельным категориям гражданского персонала воинских частей, учреждений, предприятий и организаций Министерства обороны Республики Казахстан, содержащихся за счет государственного бюджета", зарегистрированный за N 1615
    kaz: 1615 нөмірімен тіркелген "Қазақстан Республикасы Қорғаныс министрлігінің мемлекеттік бюджет есебінен ұсталатын әскери бөлімдері, мекемелері, кәсіпорындары мен ұйымдарының жекелеген санаттағы азаматтық персоналдарының жыл сайынғы төленетін еңбек демалысының ұзақтығы туралы" Қазақстан Республикасы Қорғаныс министрінің 2001 жылғы 11 маусымдағы N 155 бұйрығына өзгеріс енгізу туралы
