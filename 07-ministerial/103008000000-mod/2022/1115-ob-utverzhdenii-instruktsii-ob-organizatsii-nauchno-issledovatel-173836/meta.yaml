act_code: '173836'
requisite: Приказ Министра обороны Республики Казахстан от 15 ноября 2022 года № 1049. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 ноября 2022 года № 30571
title:
  rus: Об утверждении Инструкции об организации научно-исследовательских работ, научно-исследовательских и опытно-конструкторских работ, опытно-конструкторских работ и технологических работ, реализуемых в рамках выполнения научных, научно-технических и инновационных проектов (программ) военными учебными заведениями, подведомственными Министерству обороны Республики Казахстан
  kaz: Қазақстан Республикасының Қорғаныс министрлігіне ведомстволық бағынысты әскери оқу орындарының ғылыми, ғылыми-техникалық және инновациялық жобаларды (бағдарламаларды) орындауы шеңберінде іске асырылатын ғылыми-зерттеу жұмыстарын, ғылыми-зерттеу және тәжірибелік-конструкторлық жұмыстарды, тәжірибелік-конструкторлық жұмыстарды және технологиялық жұмыстарды ұйымдастыру туралы нұсқаулықты бекіту туралы
