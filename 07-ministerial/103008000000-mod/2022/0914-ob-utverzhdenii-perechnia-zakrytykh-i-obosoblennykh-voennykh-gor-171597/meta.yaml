requisite: Приказ Министра обороны Республики Казахстан от 14 сентября 2022 года № 786. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 сентября 2022 года № 29582. Утратил силу приказом Министра обороны Республики Казахстан от 10 октября 2025 года № 1412 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Перечня закрытых и обособленных военных городков, пограничных отделений и иных закрытых объектов, содержание служебных жилищ и централизованное отопление в которых обеспечиваются за счет государства
  kaz: Қызметтік тұрғынжайларды күтіп-ұстау және орталықтандырылған жылыту мемлекет есебінен қамтамасыз етілетін жабық және оқшауланған әскери қалашықтардың, шекара бөлімшелерінің және өзге де жабық объектілердің тізбесін бекіту туралы
