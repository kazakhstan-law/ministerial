act_code: '175238'
requisite: Приказ Министра обороны Республики Казахстан от 7 декабря 2022 года № 1177. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 декабря 2022 года № 31068
title:
  rus: Об утверждении Инструкции по выплате единовременной компенсации в случае гибели (смерти) военнослужащего в период прохождения им воинской службы, военнослужащего, проходящего воинскую службу в резерве в периоды нахождения на занятиях или сборах по боевой подготовке, сборах при кризисных ситуациях или военнообязанного, призванного на воинские сборы, при установлении ему инвалидности или в случае получения им увечья, связанного с исполнением обязанностей воинской службы
  kaz: Әскери қызметші әскери қызмет өткеру кезеңінде, резервтегі әскери қызметті өткеріп жүрген әскери қызметшіжауынгерлік даярлық бойынша сабақтарда немесе жиындарда, дағдарыстық ахуалдар кезіндегі жиындарда болған кезеңдерде немесе әскери жиындарға шақырылған әскери міндетті қаза тапқан (қайтыс болған) жағдайда,оған мүгедектік белгіленген кезде немесе ол әскери қызмет міндеттерін орындауға байланысты мертіккен жағдайда біржолғы өтемақы төлеу жөніндегі нұсқаулықты бекіту туралы
