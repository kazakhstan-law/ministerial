  requisite: Приказ Министра обороны Республики Казахстан от 31 июля 2025 года № 934. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 августа 2025 года № 36585
  title:
    rus: О внесении изменений в приказы Министра обороны Республики Казахстан от 23 сентября 2022 года № 827 «Об утверждении Инструкции по организации исчисления выслуги лет военнослужащим Вооруженных Сил Республики Казахстан» и от 7 декабря 2022 года № 1177 «Об утверждении Инструкции по выплате единовременной компенсации в случае гибели (смерти) военнослужащего в период прохождения им воинской службы или военнообязанного, призванного на воинские сборы, при установлении ему инвалидности или в случае получения им увечья, связанного с исполнением обязанностей воинской службы»
    kaz: Қазақстан Республикасы Қорғаныс министрінің «Қазақстан Республикасы Қарулы Күштерінің әскери қызметшілеріне еңбек сіңірген жылдарын есептеуді ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» 2022 жылғы 23 қыркүйектегі № 827 және «Әскери қызметші әскери қызмет өткеру кезеңінде немесе әскери жиындарға шақырылған әскери міндетті қаза тапқан (қайтыс болған) жағдайда, оған мүгедектік белгіленген кезде немесе ол әскери қызмет міндеттерін орындауға байланысты мертіккен жағдайда біржолғы өтемақы төлеу жөніндегі нұсқаулықты бекіту туралы» 2022 жылғы 7 желтоқсандағы № 1177 бұйрықтарына өзгерістер енгізу туралы
