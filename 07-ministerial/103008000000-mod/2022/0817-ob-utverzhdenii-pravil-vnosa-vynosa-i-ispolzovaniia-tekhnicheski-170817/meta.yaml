  title:
    rus: О внесении изменения в приказ Министра обороны Республики Казахстан от 17 августа 2022 года № 663дсп «Об утверждении Правил вноса, выноса и использования технических средств служебного пользования (абонентских устройств сотовой связи и мобильных устройств) в Министерстве обороны Республики Казахстан»
    kaz: «Қазақстан Республикасының Қорғаныс министрлігінде қызметтік пайдаланудағы техникалық құралдарды (абоненттік ұялы байланыс құрылғысын және мобильдік құрылғыны) алып кіру, алып шығу және пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2022 жылғы 17 тамыздағы № 663қбп бұйрығына өзгеріс енгізу туралы
