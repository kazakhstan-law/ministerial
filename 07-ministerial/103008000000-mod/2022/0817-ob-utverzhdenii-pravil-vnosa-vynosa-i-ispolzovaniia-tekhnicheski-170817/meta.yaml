act_code: '170817'
requisite: Приказ Министра обороны Республики Казахстан от 17 августа 2022 года № 663дсп
title:
  rus: Об утверждении Правил вноса, выноса и использования технических средств служебного пользования (абонентских устройств сотовой связи и мобильных устройств) в Министерстве обороны Республики Казахстан
  kaz: Қазақстан Республикасының Қорғаныс министрлігінде қызметтік пайдаланудағы техникалық құралдарды (ұялы байланыс абоненттік құрылғыларын және мобильді құрылғыларды) кіргізу, шығару және пайдалану қағидаларын бекіту туралы
