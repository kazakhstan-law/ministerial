act_code: '170285'
requisite: Приказ Министра обороны Республики Казахстан от 22 июня 2022 года № 452
title:
  rus: Об утверждении нормы снабжения полиграфологическим оборудованием для психофизиологических и полиграфологических исследований кандидатов на должности, связанные с сохранностью вооружения на арсеналах, базах и складах Вооруженных Сил Республики Казахстан
  kaz: Қазақстан Республикасы Қарулы Күштерінің арсеналдарында, базалары мен қоймаларында қару-жарақтың сақталуына байланысты лауазымдарға кандидаттарды психофизиологиялық және полиграфологиялық зерттеулер үшін полиграфологиялық жабдықпен жабдықтау нормасын бекіту туралы
