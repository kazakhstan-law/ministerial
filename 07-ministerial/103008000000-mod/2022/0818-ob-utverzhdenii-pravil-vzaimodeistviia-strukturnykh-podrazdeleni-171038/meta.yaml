act_code: '171038'
requisite: Приказ Министра обороны Республики Казахстан от 18 августа 2022 года № 684
title:
  rus: Об утверждении Правил взаимодействия структурных подразделений Министерства обороны, Генерального штаба и Вооруженных Сил Республики Казахстан при формировании государственного оборонного заказа
  kaz: Мемлекеттік қорғаныстық тапсырысты қалыптастырған кезде Қазақстан Республикасының Қорғаныс министрлігі, Бас штабы және Қарулы Күштері құрылымдық бөлімшелерінің өзара іс-қимыл жасау қағидаларын бекіту туралы
