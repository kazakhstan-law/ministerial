  requisite: Приказ и.о. Министра обороны Республики Казахстан от 30 сентября 2025 года № 1354
  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 18 августа 2022 года № 684 «Об утверждении Правил взаимодействия структурных подразделений Министерства обороны, Генерального штаба и Вооруженных Сил Республики Казахстан при формировании государственного оборонного заказа и осуществлении государственных закупок в интересах Министерства обороны Республики Казахстан»
    kaz: «Қазақстан Республикасы Қорғаныс министрлігінің мүддесінде мемлекеттік қорғаныстық тапсырысты қалыптастырған және мемлекеттік сатып алуды жүзеге асырған кезде Қазақстан Республикасының Қорғаныс министрлігі, Бас штабы және Қарулы Күштері құрылымдық бөлімшелерінің өзара іс-қимылы қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2022 жылғы 18 тамыздағы № 684 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/215222/rus
