  code: '190583'
  requisite: Приказ Министра обороны Республики Казахстан от 18 декабря 2023 года № 1327
  title:
    rus: О внесении изменения в приказ Министра обороны Республики Казахстан от 18 августа 2022 года № 684 «Об утверждении Правил взаимодействия структурных подраделений Министерства обороны, Генерального штаба и Вооруженных Сил Республики Казахстан при формировании государственного оборонного заказа и осуществлении государственных закупок в интересах Министерства обороны Республики Казахстан»
    kaz: «Қазақстан Республикасы Қорғаныс министрлігінің мүддесінде мемлекеттік қорғаныстық тапсырысты қалыптастырған және мемлекеттік сатып алуды жүзеге асырған кезде Қазақстан Республикасының Қорғаныс министрлігі, Бас штабы және Қарулы Күштері құрылымдық бөлімшелерінің өзара іс-қимылы қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2022 жылғы 18 тамыздағы № 684 бұйрығына өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/190583/rus
