title:
  rus: Об утверждении Инструкции по планированию и подготовке материалов организационно-штатных мероприятий, разработке штатов и табелей органов военного управления, республиканских государственных учреждений Вооруженных Сил
  kaz: Қарулы Күштер әскери басқару органдарының, республикалық мемлекеттік мекемелерінің ұйымдық-штаттық іс-шаралары материалдарын жоспарлау және дайындау, штаттары мен табельдерін әзірлеу жөніндегі нұсқаулықты бекіту туралы
