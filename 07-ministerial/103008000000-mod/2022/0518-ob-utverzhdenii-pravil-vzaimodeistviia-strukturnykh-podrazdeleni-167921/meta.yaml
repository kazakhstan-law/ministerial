act_code: '167921'
requisite: Приказ Министра обороны Республики Казахстан от 18 мая 2022 года № 312. Отменен приказом Министра обороны Республики Казахстан от 18 августа 2022 года № 684 (вводится в действие со дня его подписания)
title:
  rus: Об утверждении Правил взаимодействия структурных подразделений Министерства обороны, Генерального штаба и Вооруженных Сил Республики Казахстан при формировании государственного оборонного заказа и осуществлении государственных закупок в интересах Министерства обороны Республики Казахстан
  kaz: Қазақстан Республикасы Қорғаныс министрлігінің мүддесінде мемлекеттік қорғаныстық тапсырысты қалыптастыру және мемлекеттік сатып алуды жүзеге асыру кезінде Қазақстан Республикасының Қорғаныс министрлігі, Бас штабы және Қарулы Күштері құрылымдық бөлімшелерінің өзара іс-қимыл жасау қағидаларын бекіту туралы
