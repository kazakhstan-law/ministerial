  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 3 июля 2000 года N 182 "Об утверждении и введении в действие Правил отбывания уголовных наказаний осужденными военнослужащими", зарегистрированный в Министерстве юстиции Республики Казахстан 22 ноября 2000 года N 1298
    kaz: Қазақстан Республикасының Әділет министрлігінде 2000 жылғы 22 қарашада N 1298 болып тіркелген "Сотталған Әскери қызметшілердің қылмыстық жазаларын өтеу ережесін бекіту және күшіне енгізу туралы" Қазақстан Республикасы Қорғаныс министрінің 2000 жылғы 3 шілдедегі N 182 бұйрығына өзгерістер енгізу туралы
