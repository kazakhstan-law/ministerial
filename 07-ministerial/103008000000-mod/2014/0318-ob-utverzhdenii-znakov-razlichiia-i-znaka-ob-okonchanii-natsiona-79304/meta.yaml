  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 18 марта 2014 года № 112 «Об утверждении знаков различия и знака об окончании Национального университета обороны имени Первого Президента Республики Казахстан – Елбасы»
    kaz: «Қазақстан Республикасының Тұңғыш Президенті – Елбасы атындағы Ұлттық қорғаныс университетінің айырым белгілерін және аяқтағаны туралы белгісін бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2014 жылғы 18 наурыздағы № 112 бұйрығына өзгерістер енгізу туралы
