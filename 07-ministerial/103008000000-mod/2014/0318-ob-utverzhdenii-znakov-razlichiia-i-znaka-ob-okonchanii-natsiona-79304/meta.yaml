title:
  rus: Об утверждении знаков различия и знака об окончании Национального университета обороны Республики Казахстан
  kaz: Қазақстан Республикасы Ұлттық қорғаныс университетінің айырым белгілерін және оқуды аяқтағаны туралы белгіні бекіту туралы
