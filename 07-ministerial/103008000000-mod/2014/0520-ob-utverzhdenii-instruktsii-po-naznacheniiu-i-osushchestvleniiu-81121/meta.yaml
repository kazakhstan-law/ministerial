  requisite: Приказ Министра обороны Республики Казахстан от 17 января 2019 года № 27. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 января 2019 года № 18216. Утратил силу приказом Министра обороны Республики Казахстан от 23 сентября 2022 года № 827 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: Об утверждении Инструкции по организации исчисления выслуги лет военнослужащим Вооруженных Сил Республики Казахстан и о внесении изменений в приказ Министра обороны Республики Казахстан от 20 мая 2014 года № 218 «Об утверждении Инструкции по назначению и осуществлению пенсионных выплат военнослужащим»
    kaz: Қазақстан Республикасы Қарулы Күштерінің әскери қызметшілеріне еңбек сіңірген жылдарын есептеуді ұйымдастыру жөніндегі нұсқаулықты бекіту туралы және «Әскери қызметшілерге зейнетақы төлемдерін тағайындау және оларды жүзеге асыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2014 жылғы 20 мамырдағы № 218 бұйрығына өзгерістер енгізу туралы
