title:
  rus: Об утверждении Инструкции по назначению и осуществлению пенсионных выплат военнослужащим
  kaz: Әскери қызметшілерге зейнетақы төлемдерін тағайындау және оларды жүзеге асыру жөніндегі нұсқаулықты бекіту туралы
