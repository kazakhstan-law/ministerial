title:
  rus: Об утверждении Правил предоставления земельного участка во временное безвозмездное пользование по договорам государственно-частного партнерства для строительства, реконструкции и эксплуатации оборонных объектов
  kaz: Қорғаныс объектілерін салу, реконструкциялау және пайдалану үшін мемлекеттік-жекешелік әріптестік шарттары бойынша жер учаскесін уақытша өтеусіз пайдалануға беру қағидаларын бекіту туралы
