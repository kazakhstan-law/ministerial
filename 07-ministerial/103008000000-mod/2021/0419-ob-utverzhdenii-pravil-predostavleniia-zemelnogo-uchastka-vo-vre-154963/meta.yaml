  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 19 апреля 2021 года № 236 «Об утверждении Правил предоставления земельного участка во временное безвозмездное пользование по договорам государственно-частного партнерства, в том числе по договору концессии для строительства, реконструкции и эксплуатации оборонных объектов»
    kaz: «Қорғаныс объектілерін салу, реконструкциялау және пайдалану үшін мемлекеттік-жекешелік әріптестік шарттары бойынша, оның ішінде концессия шарты бойынша жер учаскесін уақытша өтеусіз пайдалануға беру қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2021 жылғы 19 сәуірдегі № 236 бұйрығына өзгерістер енгізу туралы
