act_code: '155685'
requisite: Приказ Министра обороны Республики Казахстан от 30 апреля 2021 года № 275. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 мая 2021 года № 22710. Утратил силу приказом Министра обороны Республики Казахстан от 15 ноября 2022 года № 104 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции об организации научно-исследовательских работ, научно-исследовательских и опытно-конструкторских работ, опытно-конструкторских работ и технологических работ, реализуемых в рамках выполнения научных, научно-технических и инновационных проектов (программ) военными учебными заведениями, подведомственными Министерству обороны Республики Казахстан
  kaz: Қазақстан Республикасының Қорғаныс министрлігіне ведомстволық бағынысты әскери оқу орындарының ғылыми, ғылыми-техникалық және инновациялық жобаларды (бағдарламаларды) орындауы шеңберінде іске асырылатын ғылыми-зерттеу жұмыстарын, ғылыми-зерттеу және тәжірибелік-конструкторлық жұмыстарды, тәжірибелік-конструкторлық жұмыстар мен технологиялық жұмыстарды ұйымдастыру туралы нұсқаулықты бекіту туралы
