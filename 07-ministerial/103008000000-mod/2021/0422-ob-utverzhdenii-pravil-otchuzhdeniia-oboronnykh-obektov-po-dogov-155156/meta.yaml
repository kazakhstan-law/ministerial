  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 22 апреля 2021 года № 250 «Об утверждении Правил отчуждения оборонных объектов по договорам государственно-частного партнерства, в том числе по договору концессии для возмещения затрат частному партнеру и концессионеру»
    kaz: «Мемлекеттік-жекешелік әріптестік шарттары бойынша, оның ішінде концессия шарты бойынша жекеше әріптеске және концессионерге шығындарды өтеу үшін қорғаныс объектілерін иеліктен шығару қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2021 жылғы 22 сәуірдегі № 250 бұйрығына өзгерістер енгізу туралы
