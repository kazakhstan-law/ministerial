act_code: '157601'
requisite: Приказ Министра обороны Республики Казахстан от 4 августа 2021 года № 500. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 августа 2021 года № 23848. Утратил силу приказом Министра обороны Республики Казахстан от 28 октября 2023 года № 1100 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача справок лицам, имеющим льготы (ветеранам Великой Отечественной войны, боевых действий на территории других государств и участникам ликвидации последствий катастрофы на Чернобыльской атомной электростанции)»
  kaz: «Жеңілдігі бар адамдарға (Ұлы Отан соғысының, басқа мемлекеттердің аумағындағы ұрыс қимылдарының ардагерлері мен Чернобыль атом электр станциясындағы апаттың салдарын жоюға қатысушыларға) анықтамалар беру» мемлекеттік қызметін көрсету қағидаларын бекіту туралы
