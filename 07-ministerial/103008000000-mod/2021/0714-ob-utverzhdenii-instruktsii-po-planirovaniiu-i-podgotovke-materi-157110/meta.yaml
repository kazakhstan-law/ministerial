title:
  rus: Об утверждении Инструкции по планированию и подготовке материалов организационно-штатных мероприятий, разработке штатов и табелей органов военного управления, республиканских государственных учреждений Вооруженных Сил Республики Казахстан
  kaz: Ұйымдық-штаттық іс-шаралардың материалдарын жоспарлау және дайындау, Қазақстан Республикасы Қарулы Күштері әскери басқару органдарының, республикалық мемлекеттік мекемелерінің штаттары мен табельдерін әзірлеу жөніндегі нұсқаулықты бекіту туралы
