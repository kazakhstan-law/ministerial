title:
  rus: Об утверждении Правил организации учебного процесса по дистанционному обучению в военных учебных заведениях, подведомственных Министерству обороны Республики Казахстан, за исключением организаций среднего образования
  kaz: Орта білім беру ұйымдарын қоспағанда, Қазақстан Республикасының Қорғаныс министрлігіне ведомстволық бағынысты әскери оқу орындарында қашықтықтан оқыту бойынша оқу процесін ұйымдастыру қағидаларын бекіту туралы
