  title:
    rus: О внесении изменения в приказ Министра обороны Республики Казахстан от 29 января 2013 года № 37 "Об утверждении требований, предъявляемых к соответствию состояния здоровья лиц для службы в Вооруженных Силах, других войсках и воинских формированиях Республики Казахстан"
    kaz: '"Қазақстан Республикасының Қарулы Күштерінде, басқа да әскерлері мен әскери құралымдарында қызмет ету үшін адамдар денсаулық жағдайының сәйкес келуіне қойылатын талаптарды бекіту туралы" Қазақстан Республикасы Қорғаныс министрінің 2013 жылғы 29 қаңтардағы № 37 бұйрығына өзгеріс енгізу туралы'
