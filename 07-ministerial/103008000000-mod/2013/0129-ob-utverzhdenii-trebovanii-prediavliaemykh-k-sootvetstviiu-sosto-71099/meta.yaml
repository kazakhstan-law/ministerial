requisite: Приказ Министра обороны Республики Казахстан от 29 января 2013 года № 37. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 февраля 2013 года № 8336. Утратил силу приказом Министра обороны Республики Казахстан от 22 декабря 2020 года № 722 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении требований, предъявляемых к соответствию состояния здоровья лиц для службы в Вооруженных Силах, других войсках и воинских формированиях Республики Казахстан
  kaz: Қазақстан Республикасының Қарулы Күштерінде, басқа да әскерлері мен әскери құралымдарында қызмет ету үшін адамдар денсаулық жағдайының сәйкес келуіне қойылатын талаптарды бекіту туралы
