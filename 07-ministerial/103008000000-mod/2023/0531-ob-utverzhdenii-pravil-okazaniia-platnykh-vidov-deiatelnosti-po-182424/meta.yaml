act_code: '182424'
requisite: Приказ Министра обороны Республики Казахстан от 31 мая 2023 года № 527. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 июня 2023 года № 32664. Утратил силу приказом Министра обороны Республики Казахстан от 14 июня 2024 года № 625 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) Государственным военно-историческим музеем Вооруженных Сил Республики Казахстан и расходования им денег от реализации товаров (работ, услуг)
  kaz: Қазақстан Республикасы Қарулы Күштері Мемлекеттік әскери-тарихи музейінің тауарларды (жұмыстарды, қызметтерді) өткізу бойынша ақылы қызмет түрін көрсетуі және тауарларды (жұмыстарды, қызметтерді) өткізуден түскен ақшаны жұмсауы қағидаларын бекіту туралы
