  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 31 мая 2023 года № 527 «Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) Государственным военно-историческим музеем Вооруженных Сил Республики Казахстан и расходования им денег от реализации товаров (работ, услуг)»
    kaz: «Қазақстан Республикасы Қарулы Күштері Мемлекеттік әскери-тарихи музейінің тауарларды (жұмыстарды, қызметтерді) өткізу бойынша ақылы қызмет түрін көрсетуі және тауарларды (жұмыстарды, қызметтерді) өткізуден түскен ақшаны жұмсауы қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2023 жылғы 31 мамырдағы № 527 бұйрығына өзгерістер енгізу туралы
