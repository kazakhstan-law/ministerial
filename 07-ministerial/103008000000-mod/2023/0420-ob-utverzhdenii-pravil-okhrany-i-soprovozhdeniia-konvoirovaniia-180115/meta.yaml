title:
  rus: Об утверждении Правил охраны и сопровождения (конвоирования) военнослужащих, содержащихся на гауптвахте органов военной полиции Вооруженных Сил Республики Казахстан (кроме военнослужащих, подвергнутых административному аресту) за пределы гауптвахты
  kaz: Қазақстан Республикасы Қарулы Күштері әскери полиция органдарының гауптвахтасында ұсталатын әскери қызметшiлердi (әкімшілік қамаққа алынған әскери қызметшілерден басқа) гауптвахтадан тыс жерде күзету және алып жүру (айдауылмен алып жүру) қағидаларын бекiту туралы
