    rus: О внесении изменения в приказ Министра обороны Республики Казахстан от 20 апреля 2023 года № 354 «Об утверждении Правил охраны и сопровождения (конвоирования) военнослужащих, содержащихся на гауптвахте органов военной полиции Вооруженных Сил Республики Казахстан (кроме военнослужащих, подвергнутых административному аресту) за пределы гауптвахты»
    kaz: «Қазақстан Республикасы Қарулы Күштері әскери полиция органдарының гауптвахтасында ұсталатын әскери қызметшiлердi (әкімшілік қамаққа алынған әскери қызметшілерден басқа) гауптвахтадан тыс жерде күзету және алып жүру (айдауылмен алып жүру) қағидаларын бекiту туралы» Қазақстан Республикасы Қорғаныс министрінің 2023 жылғы 20 сәуірдегі № 354 бұйрығына өзгеріс енгізу туралы
