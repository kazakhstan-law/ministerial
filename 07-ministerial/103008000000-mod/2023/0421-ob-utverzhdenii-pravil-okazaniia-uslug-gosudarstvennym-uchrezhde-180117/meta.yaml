  title:
    rus: О внесении изменения в приказ Министра обороны Республики Казахстан от 21 апреля 2023 года № 366 «Об утверждении Правил оказания услуг государственным учреждением Вооруженных Сил Республики Казахстан, специализирующимся в области аэропортовской деятельности, и использования денег от реализации таких услуг»
    kaz: «Қазақстан Республикасы Қарулы Күштерінің әуежайлық қызмет саласында маманданатын мемлекеттік мекемесінің қызметтерді көрсету және осындай көрсетілетін қызметтерді өткізуден түсетін ақшаны пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2023 жылғы 21 сәуірдегі № 366 бұйрығына өзгеріс енгізу туралы
