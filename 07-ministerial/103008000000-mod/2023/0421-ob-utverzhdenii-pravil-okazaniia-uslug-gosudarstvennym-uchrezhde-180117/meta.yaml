act_code: '180117'
requisite: Приказ Министра обороны Республики Казахстан от 21 апреля 2023 года № 366. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 апреля 2023 года № 32353. Утратил силу приказом Министра обороны Республики Казахстан от 15 июля 2025 года № 828 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания услуг государственным учреждением Вооруженных Сил Республики Казахстан, специализирующимся в области аэропортовской деятельности, и использования денег от реализации таких услуг
  kaz: Қазақстан Республикасы Қарулы Күштерінің әуежайлық қызмет саласында маманданатын мемлекеттік мекемесінің қызметтерді көрсету және осындай көрсетілетін қызметтерді өткізуден түсетін ақшаны пайдалану қағидаларын бекіту туралы
