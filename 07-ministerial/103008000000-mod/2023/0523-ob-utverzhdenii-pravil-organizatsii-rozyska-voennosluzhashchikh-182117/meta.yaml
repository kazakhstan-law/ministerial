title:
  rus: Об утверждении Правил организации розыска военнослужащих Вооруженных Сил Республики Казахстан, скрывающихся от органов, ведущих уголовный процесс, а также самовольно оставивших воинскую часть (учреждение) или место службы
  kaz: Қылмыстық процесті жүргізетін органдардан жасырынып жүрген, сондай-ақ әскери бөлімді (мекемені) немесе қызмет орнын өз бетінше тастап кеткен Қазақстан Республикасы Қарулы Күштерінің әскери қызметшілерін іздестіруді ұйымдастыру қағидаларын бекіту туралы
