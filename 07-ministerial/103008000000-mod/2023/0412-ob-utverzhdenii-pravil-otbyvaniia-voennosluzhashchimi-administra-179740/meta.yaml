  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 12 апреля 2023 года № 319 «Об утверждении Правил отбывания военнослужащими административного ареста на гауптвахте органов военной полиции Вооруженных Сил Республики Казахстан»
    kaz: «Қазақстан Республикасы Қарулы Күштері әскери полиция органдарының гауптвахтасында әскери қызметшiлердiң әкiмшiлiк қамауды өтеу қағидаларын бекiту туралы» Қазақстан Республикасы Қорғаныс министрінің 2023 жылғы 12 сәуірдегі № 319 бұйрығына өзгерістер енгізу туралы
