act_code: '180344'
requisite: Приказ Министра обороны Республики Казахстан от 27 апреля 2023 года № 384. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 апреля 2023 года № 32375. Утратил силу приказом Министра обороны Республики Казахстан от 15 июля 2025 года № 828 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации услуг государственным учреждением Вооруженных Сил Республики Казахстан, специализирующимся в области культуры и расходования им денег от реализации услуг
  kaz: Мәдениет саласында маманданатын Қазақстан Республикасы Қарулы Күштері мемлекеттік мекемесінің көрсетілетін қызметті өткізу бойынша ақылы қызмет түрін көрсетуі және көрсетілетін қызметті өткізуден түсетін ақшаны жұмсау қағидаларын бекіту туралы
