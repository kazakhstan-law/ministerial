  code: '197823'
  requisite: Приказ Министра обороны Республики Казахстан от 14 июня 2024 года № 625. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 июня 2024 года № 34509. Утратил силу приказом Министра обороны Республики Казахстан от 15 июля 2025 года № 828 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 27 апреля 2023 года № 384 «Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) Национальным военно-патриотическим центром Вооруженных Сил Республики Казахстан и расходования им денег от реализации товаров (работ, услуг)» и признании утратившими силу некоторых приказов Министра обороны Республики Казахстан
    kaz: «Қазақстан Республикасы Қарулы Күштері Ұлттық әскери-патриоттық орталығының тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізу жөніндегі ақылы қызмет түрлерін көрсету және олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түсетін ақшаны жұмсау қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2023 жылғы 27 сәуірдегі № 384 бұйрығына өзгерістер енгізу және Қазақстан Республикасы Қорғаныс министрінің кейбір бұйрықтарының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/197823/rus
