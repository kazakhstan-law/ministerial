title:
  rus: Об утверждении Порядка организации деятельности помещений для временно задержанных при дежурном по органу военной полиции Вооруженных Сил Республики Казахстан и типовые правила внутреннего распорядка в них
  kaz: Қазақстан Республикасы Қарулы Күштерінің әскери полиция органы бойынша кезекші жанындағы уақытша ұсталғандарға арналған үй-жайлардың қызметін ұйымдастыру тәртібі және олардағы ішкі тәртіптеменің үлгілік қағидаларын бекіту туралы
