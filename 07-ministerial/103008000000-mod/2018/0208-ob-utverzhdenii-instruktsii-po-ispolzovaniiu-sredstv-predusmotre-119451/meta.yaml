requisite: Приказ Министра обороны Республики Казахстан от 8 февраля 2018 года № 68. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 марта 2018 года № 16469. Утратил силу приказом Министра обороны Республики Казахстан от 14 декабря 2022 года № 1220 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по использованию средств, предусмотренных в республиканском бюджете на представительские расходы по бюджетной подпрограмме «Повышение боевой готовности Вооруженных Сил Республики Казахстан» бюджетной программы «Обеспечение боевой, мобилизационной готовности Вооруженных Сил Республики Казахстан»
  kaz: «Қазақстан Республикасы Қарулы Күштерінің жауынгерлік, жұмылдыру дайындығын қамтамасыз ету» бюджеттік бағдарламасының «Қазақстан Республикасы Қарулы Күштерінің жауынгерлік әзірлігін арттыру» бюджеттік кіші бағдарламасы бойынша республикалық бюджетте өкілдік шығыстарға көзделген қаражатты пайдалану жөніндегі нұсқаулықты бекіту туралы
