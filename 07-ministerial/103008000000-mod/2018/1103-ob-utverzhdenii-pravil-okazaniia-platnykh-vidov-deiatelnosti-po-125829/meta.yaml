  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 3 ноября 2018 года № 751 «Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) военными учебными заведениями Министерства обороны Республики Казахстан и расходования ими денег от реализации товаров (работ, услуг)»
    kaz: «Қазақстан Республикасы Қорғаныс министрлігі әскери оқу орындарының тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізу жөніндегі ақылы қызмет түрлерін көрсету және олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсау қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2018 жылғы 3 қарашадағы № 751 бұйрығына өзгерістер енгізу туралы
