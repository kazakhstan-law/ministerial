act_code: '125829'
requisite: Приказ Министра обороны Республики Казахстан от 3 ноября 2018 года № 751. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 ноября 2018 года № 17730. Утратил силу приказом Министра обороны Республики Казахстан от 15 июля 2025 года № 828 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) военными учебными заведениями Министерства обороны Республики Казахстан и расходования ими денег от реализации товаров (работ, услуг)
  kaz: Қазақстан Республикасы Қорғаныс министрлігі әскери оқу орындарының тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізу жөніндегі ақылы қызмет түрлерін көрсету және олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсау қағидаларын бекіту туралы
