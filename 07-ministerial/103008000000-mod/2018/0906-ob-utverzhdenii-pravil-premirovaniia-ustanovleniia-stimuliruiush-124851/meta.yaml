  title:
    rus: О внесении изменений и дополнения в приказ Министра обороны Республики Казахстан от 6 сентября 2018 года № 616 «Об утверждении Правил премирования, установления стимулирующих надбавок к должностному окладу и оказания материальной помощи руководителям казенных предприятий Министерства обороны Республики Казахстан»
    kaz: «Қазақстан Республикасы Қорғаныс министрлігі қазыналық кәсіпорындарының басшыларына сыйлықақы беру, лауазымдық айлықақысына ынталандыру үстемеақыларын белгілеу және материалдық көмек көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2018 жылғы 6 қыркүйектегі № 616 бұйрығына өзгерістер мен толықтыру енгізу туралы
