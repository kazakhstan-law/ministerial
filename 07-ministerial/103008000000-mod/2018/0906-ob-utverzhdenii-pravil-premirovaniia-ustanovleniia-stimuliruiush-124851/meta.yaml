title:
  rus: Об утверждении Правил премирования, установления стимулирующих надбавок к должностным окладам и оказания материальной помощи руководителям казенных предприятий Министерства обороны Республики Казахстан
  kaz: Қазақстан Республикасы Қорғаныс министрлігі қазыналық кәсіпорындарының басшыларына сыйлықақы беру, лауазымдық айлықақысына ынталандыру үстемеақыларын белгілеу және материалдық көмек көрсету қағидаларын бекіту туралы
