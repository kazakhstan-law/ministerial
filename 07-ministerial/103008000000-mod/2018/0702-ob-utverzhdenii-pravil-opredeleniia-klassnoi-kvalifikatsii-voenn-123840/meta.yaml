    kaz: «Қазақстан Республикасы Қарулы Күштерінің әскери қызметшілеріне сыныптық біліктілікті айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2018 жылғы 2 шілдедегі № 442 бұйрығына өзгеріс енгізу туралы
