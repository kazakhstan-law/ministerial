  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 2 июля 2018 года № 442 «Об утверждении Правил определения классной квалификации военнослужащим Вооруженных Сил Республики Казахстан»
    kaz: «Қазақстан Республикасы Қарулы Күштерінің әскери қызметшілеріне сыныптық біліктілікті айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2018 жылғы 2 шілдедегі № 442 бұйрығына өзгерістер енгізу туралы
