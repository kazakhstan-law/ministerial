    kaz: «Қазақстан Республикасы Қорғаныс министрлігі әскери оқу орындарының ақылы негізде берілетін тауарларына (жұмысына, көрсетілетін қызметтеріне) бағаларды бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2018 жылғы 22 қарашадағы № 752 бұйрығына өзгерістер енгізу туралы
