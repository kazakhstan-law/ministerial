act_code: '126143'
requisite: Приказ Министра обороны Республики Казахстан от 22 ноября 2018 года № 752. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 ноября 2018 года № 17771. Утратил силу приказом Министра обороны Республики Казахстан от 28 июля 2025 года № 911 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении цен на товары (работы, услуги) военных учебных заведений Министерства обороны Республики Казахстан, предоставляемые на платной основе
