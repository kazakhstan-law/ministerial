  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 22 ноября 2018 года № 752 «Об утверждении цен на товары (работы, услуги) военных учебных заведений Министерства обороны Республики Казахстан, предоставляемые на платной основе»
    kaz: «Қазақстан Республикасы Қорғаныс министрлігі әскери оқу орындарының ақылы негізде берілетін тауарларына (жұмыстарына, көрсетілетін қызметтеріне) бағаларды бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2018 жылғы 22 қарашадағы № 752 бұйрығына өзгерістер енгізу туралы
