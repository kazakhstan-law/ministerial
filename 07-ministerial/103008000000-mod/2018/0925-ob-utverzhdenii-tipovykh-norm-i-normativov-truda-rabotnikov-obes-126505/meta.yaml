act_code: '126505'
requisite: Приказ Министра обороны Республики Казахстан от 25 сентября 2018 года № 625. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 декабря 2018 года № 17852
title:
  rus: Об утверждении типовых норм и нормативов труда работников, обеспечивающих техническое обслуживание и функционирование объектов инфраструктуры, автомобильной и специальной техники воинских частей и учреждений Министерства обороны Республики Казахстан
  kaz: Қазақстан Республикасы Қорғаныс министрлігінің әскери бөлімдері мен мекемелерінің инфрақұрылымы объектілеріне, автомобиль және арнайы техникасына техникалық қызмет көрсетуді және олардың жұмыс істеуін қамтамасыз ететін жұмыскерлердің үлгілік еңбек нормасы мен нормативін бекіту туралы
