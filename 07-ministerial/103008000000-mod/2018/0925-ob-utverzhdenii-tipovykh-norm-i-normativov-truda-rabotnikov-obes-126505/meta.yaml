  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 25 сентября 2018 года № 625 «Об утверждении Норм труда работников, обеспечивающих техническое обслуживание и функционирование объектов инфраструктуры, автомобильной и специальной техники воинских частей и учреждений Министерства обороны Республики Казахстан»
    kaz: «Қазақстан Республикасы Қорғаныс министрлігінің әскери бөлімдері мен мекемелерінің инфрақұрылымы объектілеріне, автомобиль және арнайы техникасына техникалық қызмет көрсетуді және олардың жұмыс істеуін қамтамасыз ететін жұмыскерлерінің еңбек нормаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2018 жылғы 25 қыркүйектегі № 625 бұйрығына өзгерістер енгізу туралы
