title:
  rus: Об утверждении Правил организации и осуществления учебного процесса, учебно-методической и научно-методической деятельности в военных учебных заведениях, подведомственных Министерству обороны Республики Казахстан
  kaz: Қазақстан Республикасының Қорғаныс министрлігіне ведомстволық бағынысты әскери оқу орындарында оқу процесін, оқу-әдістемелік және ғылыми-әдістемелік қызметті ұйымдастыру және жүзеге асыру қағидаларын бекіту туралы
