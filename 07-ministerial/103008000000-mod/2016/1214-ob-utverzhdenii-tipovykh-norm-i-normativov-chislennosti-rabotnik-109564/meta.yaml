title:
  rus: Об утверждении типовых норм и нормативов численности работников банно-прачечных комбинатов, обеспечивающих техническое обслуживание и функционирование воинских частей и учреждений Министерства обороны Республики Казахстан
  kaz: Қазақстан Республикасы Қорғаныс министрлігінің әскери бөлімдері мен мекемелеріне техникалық қызмет көрсетуді және олардың жұмыс істеуін қамтамасыз ететін монша кір-жуу комбинаты жұмыскерлері санының үлгілік нормасы мен нормативін бекіту туралы
