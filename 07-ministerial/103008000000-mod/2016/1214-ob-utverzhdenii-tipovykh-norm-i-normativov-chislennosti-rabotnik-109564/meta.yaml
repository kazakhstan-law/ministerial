  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 14 декабря 2016 года № 595 «Об утверждении Нормативов численности работников банно-прачечных комбинатов, обеспечивающих техническое обслуживание и функционирование воинских частей и учреждений Министерства обороны Республики Казахстан»
    kaz: «Қазақстан Республикасы Қорғаныс министрлігінің әскери бөлімдері мен мекемелеріне техникалық қызмет көрсетуді және олардың жұмыс істеуін қамтамасыз ететін монша кір-жуу комбинаттары жұмыскерлері санының нормативтерін бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2016 жылғы 14 желтоқсандағы № 595 бұйрығына өзгерістер енгізу туралы
