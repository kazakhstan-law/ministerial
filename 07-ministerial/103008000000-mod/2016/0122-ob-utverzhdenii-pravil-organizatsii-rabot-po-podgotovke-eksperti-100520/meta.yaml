act_code: '100520'
requisite: Приказ Министра обороны Республики Казахстан от 22 января 2016 года № 34. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 февраля 2016 года № 13294
title:
  rus: Об утверждении Правил организации работ по подготовке, экспертизе, апробации, изданию и проведению мониторинга учебных изданий и учебно-методических комплексов в военных учебных заведениях, подведомственных Министерству обороны Республики Казахстан, за исключением организаций среднего образования
  kaz: Орта білім беру ұйымдарын қоспағанда, Қазақстан Республикасының Қорғаныс министрлігіне ведомстволық бағынысты әскери оқу орындарында оқулық басылымдары мен оқу-әдістемелік кешендерді дайындау, сараптау, сынамақтан өткізу, басып шығару және оларға мониторинг жүргізу жөніндегі жұмыстарды ұйымдастыру қағидаларын бекіту туралы
