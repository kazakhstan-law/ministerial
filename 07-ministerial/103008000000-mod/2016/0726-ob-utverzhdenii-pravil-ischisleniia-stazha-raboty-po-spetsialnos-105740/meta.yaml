title:
  rus: Об утверждении Правил исчисления стажа работы по специальности для гражданского персонала воинских частей и учреждений, работников казенных предприятий Вооруженных Сил Республики Казахстан и установления рабочим процентной надбавки за работу в Вооруженных Силах Республики Казахстан
  kaz: Қазақстан Республикасы Қарулы Күштерінің әскери бөлімдері мен мекемелерінің азаматтық персоналы, қазыналық кәсіпорындарының жұмыскерлері үшін мамандығы бойынша жұмыс өтілін есептеу және Қазақстан Республикасының Қарулы Күштеріндегі жұмысы үшін жұмысшыларға пайыздық үстемеақы белгілеу қағидаларын бекіту туралы
