  title:
    rus: О внесении изменения в приказ Министра обороны Республики Казахстан от 26 июля 2016 года № 350 «Об утверждении Правил исчисления стажа работы по специальности для гражданского персонала воинских частей и учреждений, работников казенных предприятий Вооруженных Сил Республики Казахстан и установления рабочим процентной надбавки за работу в Вооруженных Силах Республики Казахстан»
    kaz: «Қазақстан Республикасы Қарулы Күштерінің әскери бөлімдері мен мекемелерінің азаматтық персоналы, қазыналық кәсіпорындарының жұмыскерлері үшін мамандығы бойынша жұмыс өтілін есептеу және Қазақстан Республикасының Қарулы Күштеріндегі жұмысы үшін жұмысшыларға пайыздық үстемеақы белгілеу қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2016 жылғы 26 шілдедегі № 350 бұйрығына өзгеріс енгізу туралы
