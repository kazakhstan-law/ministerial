act_code: '100343'
requisite: Приказ Министра обороны Республики Казахстан от 22 января 2016 года № 38. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 февраля 2016 года № 13266. Утратил силу приказом Министра обороны Республики Казахстан от 13 октября 2017 года № 588 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении квалификационных характеристик должностей педагогических работников и приравненных к ним лиц в военных учебных заведениях, подведомственных Министерству обороны Республики Казахстан, за исключением должностей гражданских служащих
  kaz: Қазақстан Республикасының Қорғаныс министрлігіне ведомстволық бағынысты әскери оқу орындарында, азаматтық қызметші лауазымдарын қоспағанда, педагог жұмыскерлер мен оларға теңестірілген адамдар лауазымдарының біліктілік сипаттамаларын бекіту туралы
