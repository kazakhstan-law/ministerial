  title:
    rus: О внесении изменений и дополнения в приказ Министра обороны Республики Казахстан от 22 января 2016 года № 32 «Об утверждении Правил проведения текущего контроля успеваемости, промежуточной и итоговой аттестации обучающихся в военных учебных заведениях, подведомственных Министерству обороны Республики Казахстан»
    kaz: «Қазақстан Республикасының Қорғаныс министрлігіне ведомстволық бағынысты әскери оқу орындарында білім алушылардың үлгеріміне ағымдағы бақылау, оларға аралық және қорытынды аттестаттау жүргізу қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2016 жылғы 22 қаңтардағы № 32 бұйрығына өзгерістер мен толықтыру енгізу туралы
