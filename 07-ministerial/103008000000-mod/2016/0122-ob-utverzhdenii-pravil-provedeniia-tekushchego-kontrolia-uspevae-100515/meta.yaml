title:
  rus: Об утверждении Правил проведения текущего контроля успеваемости, промежуточной и итоговой аттестации обучающихся в военных учебных заведениях, подведомственных Министерству обороны Республики Казахстан
  kaz: Қазақстан Республикасының Қорғаныс министрлігіне ведомстволық бағынысты әскери оқу орындарында білім алушылардың үлгеріміне ағымдағы бақылау, оларға аралық және қорытынды аттестаттау жүргізу қағидаларын бекіту туралы
