  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 18 октября 2016 года № 488дсп «Об утверждении перечня специальностей и квалификаций по образовательным программам, реализуемым в военных учебных заведениях, подведомственных Министерству обороны Республики Казахстан»
    kaz: «Қазақстан Республикасының Қорғаныс министрлігіне ведомстволық бағынысты әскери оқу орындарында іске асырылатын білім беру бағдарламалары бойынша мамандықтар мен біліктіліктер тізбесін бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2016 жылғы 18 қазандағы № 488қбп бұйрығына өзгеріс енгізу туралы
