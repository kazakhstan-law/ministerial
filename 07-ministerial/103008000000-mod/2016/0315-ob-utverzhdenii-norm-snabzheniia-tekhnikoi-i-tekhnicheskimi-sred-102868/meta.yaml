act_code: '102868'
requisite: Приказ Министра обороны Республики Казахстан от 15 марта 2016 года № 115. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 мая 2016 года № 13745
title:
  rus: Об утверждении норм снабжения техникой и техническими средствами районных эксплуатационных частей Вооруженных Сил Республики Казахстан и норм снабжения техническими средствами, машинами, установками и имуществом дорожно-эксплуатационных участков Вооруженных Сил Республики Казахстан
  kaz: Қазақстан Республикасы Қарулы Күштерінің аудандық пайдалану бөлімдерін техникамен және техникалық құралдармен жабдықтау нормаларын және Қазақстан Республикасы Қарулы Күштерінің жол-пайдалану учаскелерін техникалық құралдармен, машиналармен, қондырғылармен және мүлікпен жабдықтау нормаларын бекіту туралы
