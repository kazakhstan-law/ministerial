requisite: Приказ Министра обороны Республики Казахстан от 17 мая 2016 года № 242. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 июня 2016 года № 13795. Утратил силу приказом Министра обороны Республики Казахстан от 5 июня 2017 года № 265 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил назначения (в том числе временно) на должности соответствующего состава военнослужащих нижестоящего состава, военнообязанных соответствующего состава либо лиц гражданского персонала
  kaz: Төмен тұрған құрамның әскери қызметшілерін, тиісті құрамның әскери міндеттілерін немесе азаматтық персонал адамдарын тиісті құрамның лауазымдарына тағайындау (оның ішінде уақытша) қағидаларын бекіту туралы
