  title:
    rus: О внесении изменений в приказ Министра обороны Республики Казахстан от 22 января 2016 года № 39 «Об утверждении Правил замещения должностей педагогических работников и приравненных к ним лиц, научных работников военных учебных заведений, подведомственных Министерству обороны Республики Казахстан, за исключением должностей гражданских служащих»
    kaz: «Қазақстан Республикасының Қорғаныс министрлігіне ведомстволық бағынысты әскери оқу орындарында азаматтық қызметші лауазымдарын қоспағанда, педагог жұмыскерлер мен оларға теңестірілген адамдар, ғылыми қызметкерлер лауазымдарына орналасу қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2016 жылғы 22 қаңтардағы № 39 бұйрығына өзгерістер енгізу туралы
