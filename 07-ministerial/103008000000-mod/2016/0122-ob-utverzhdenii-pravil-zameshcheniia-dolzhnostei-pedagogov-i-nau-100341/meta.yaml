  code: '196365'
  requisite: Приказ Министра обороны Республики Казахстан от 2 мая 2024 года № 454. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 мая 2024 года № 34328
  title:
    rus: О внесении изменения в приказ Министра обороны Республики Казахстан от 22 января 2016 года № 39 «Об утверждении Правил замещения должностей педагогов и научных работников военных учебных заведений, подведомственных Министерству обороны Республики Казахстан, за исключением должностей гражданских служащих»
    kaz: «Қазақстан Республикасының Қорғаныс министрлігіне ведомстволық бағынысты әскери оқу орындарында азаматтық қызметші лауазымдарын қоспағанда, педагогтар мен ғылыми қызметкерлер лауазымдарына орналасу қағидаларын бекіту туралы» Қазақстан Республикасы Қорғаныс министрінің 2016 жылғы 22 қаңтардағы № 39 бұйрығына өзгеріс енгізу туралы
