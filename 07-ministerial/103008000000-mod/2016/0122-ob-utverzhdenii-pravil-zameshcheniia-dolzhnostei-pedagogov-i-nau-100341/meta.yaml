act_code: '100341'
requisite: Приказ Министра обороны Республики Казахстан от 22 января 2016 года № 39. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 февраля 2016 года № 13271
title:
  rus: Об утверждении Правил замещения должностей педагогов и научных работников военных учебных заведений, подведомственных Министерству обороны Республики Казахстан, за исключением должностей гражданских служащих
  kaz: Қазақстан Республикасының Қорғаныс министрлігіне ведомстволық бағынысты әскери оқу орындарында азаматтық қызметші лауазымдарын қоспағанда, педагогтар мен ғылыми қызметкерлер лауазымдарына орналасу қағидаларын бекіту туралы
