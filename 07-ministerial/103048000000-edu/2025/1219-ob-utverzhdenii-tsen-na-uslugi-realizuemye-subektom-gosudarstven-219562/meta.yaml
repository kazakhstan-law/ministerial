caused_by:
  code: '230023'
  requisite: Приказ и.о. Министра просвещения Республики Казахстан от 14 сентября 2026 года № 251-НҚ
  title:
    rus: О внесении изменений приказ исполняющего обязанности Министра просвещения Республики Казахстан от 19 декабря 2025 года № 291 «Об утверждении цен на услуги, реализуемые субъектом государственной монополии в области образования по методологическому и научно-методическому обеспечению системы образования и образовательного процесса (государственные общеобязательные стандарты образования, типовые учебные планы, типовые учебные программы)»
    kaz: «Білім беру жүйесі мен білім беру процесін әдіснамалық және ғылыми-әдістемелік (мемлекеттік жалпыға міндетті білім беру стандарттары, үлгілік оқу жоспарлары, үлгілік оқу бағдарламалары) қамтамасыз ету жөніндегі білім беру саласындағы мемлекеттік монополия субъектісі іске асыратын көрсетілетін қызметтердің бағаларын бекіту туралы» Қазақстан Республикасы Оқу-ағарту министрінің міндетін атқарушының 2025 жылғы 19 желтоқсандағы № 291 бұйрығына  өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/230023/rus
