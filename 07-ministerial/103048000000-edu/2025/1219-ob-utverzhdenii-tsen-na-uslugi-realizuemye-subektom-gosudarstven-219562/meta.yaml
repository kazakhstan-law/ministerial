act_code: '219562'
requisite: Приказ и.о. Министра просвещения Республики Казахстан от 19 декабря 2025 года № 291
title:
  rus: Об утверждении цен на услуги, реализуемые субъектом государственной монополии в области образования по методологическому и научно-методическому обеспечению системы образования и образовательного процесса (государственные общеобязательные стандарты образования, типовые учебные планы, типовые учебные программы)
  kaz: Білім беру жүйесі мен білім беру процесін әдіснамалық және ғылыми-әдістемелік (мемлекеттік жалпыға міндетті білім беру стандарттары, үлгілік оқу жоспарлары, үлгілік оқу бағдарламалары) қамтамасыз ету жөніндегі білім беру саласындағы мемлекеттік монополия субъектісі іске асыратын көрсетілетін қызметтердің бағаларын бекіту туралы
