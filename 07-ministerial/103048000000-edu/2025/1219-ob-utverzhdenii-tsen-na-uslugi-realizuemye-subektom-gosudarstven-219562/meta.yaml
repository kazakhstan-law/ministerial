title:
  rus: Об утверждении цен на услуги, реализуемые субъектом государственной монополии в области образования по методологическому и научно-методическому обеспечению системы образования и образовательного процесса
  kaz: Білім беру жүйесі мен білім беру процесін әдіснамалық және ғылыми-әдістемелік қамтамасыз ету жөніндегі білім беру саласындағы мемлекеттік монополия субъектісі іске асыратын көрсетілетін қызметтердің бағаларын бекіту туралы
