title:
  rus: Об утверждении Правил осуществления платных видов деятельности по реализации товаров (работ, услуг) государственными учреждениями в области образования, деньги от реализации которых остаются в их распоряжении, использования денег от реализации государственными учреждениями в области образования товаров (работ, услуг), остающихся в их распоряжении
  kaz: Өткізуден түскен ақша өз иелігінде қалатын білім беру саласындағы мемлекеттік мекемелердің тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуі бойынша ақылы қызмет түрлерін жүзеге асыру, білім беру саласындағы мемлекеттік мекемелердің тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуінен түскен, өз иелігінде қалатын ақшаны пайдалану қағидаларын бекіту туралы
