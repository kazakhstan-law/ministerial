title:
  rus: Об утверждении Правил и критериев отбора республиканских и международных олимпиад и конкурсов научных проектов (научных соревнований) по общеобразовательным предметам, конкурсов исполнителей, конкурсов профессионального мастерства и спортивных соревнований
  kaz: Жалпы білім беретін пәндер бойынша республикалық және халықаралық олимпиадалар мен ғылыми жобалар конкурстарын (ғылыми жарыстарды), орындаушылар конкурстарын, кәсіби шеберлік конкурстарын және спорттық жарыстарды іріктеу қағидалары мен өлшемшарттарын бекіту туралы
