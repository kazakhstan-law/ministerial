    rus: О внесении изменений в приказ исполняющего обязанности Министра просвещения Республики Казахстан от 10 июля 2024 года № 174 «Об определении сроков начала и завершения 2024-2025 учебного года, а также сроков проведения итоговой аттестации обучающихся в организациях среднего образования»
