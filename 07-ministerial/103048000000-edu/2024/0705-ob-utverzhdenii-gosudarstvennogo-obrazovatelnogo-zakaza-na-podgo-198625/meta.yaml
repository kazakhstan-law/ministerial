  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра просвещения Республики Казахстан от 5 июля 2024 года № 171  «Об утверждении государственного образовательного заказа на подготовку кадров с техническим и профессиональным, послесредним образованием в организациях образования, финансируемых из республиканского бюджета (за исключением организаций образования, осуществляющих подготовку специалистов для Вооруженных Сил, других войск и воинских формирований, а также специальных государственных органов), с учетом потребностей рынка труда на 2024 – 2025, 2025 – 2026, 2026 – 2027 учебные годы»
    kaz: «Еңбек нарығының қажеттіліктерін ескере отырып, республикалық бюджеттен қаржыландырылатын білім беру ұйымдарында (Қарулы Күштер, басқа да әскерлер мен әскери құралымдар, сондай-ақ арнаулы мемлекеттік органдар үшін мамандар даярлауды жүзеге асыратын білім беру ұйымдарын қоспағанда), техникалық және кәсіптік, орта білімнен кейінгі білімі бар кадрларды даярлауға 2024 – 2025, 2025 – 2026, 2026 – 2027 оқу жылдарына арналған мемлекеттік білім беру тапсырысын бекіту туралы» Қазақстан Республикасы Оқу-ағарту министрінің міндетін атқарушының 2024 жылғы 5 шiлдедегi № 171 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/224138/rus
