title:
  rus: О некоторых вопросах пилотного проекта по размещению государственного образовательного заказа на дошкольное воспитание и обучение с учетом персонифицированного финансирования по получателям образовательных услуг
  kaz: Көрсетілетін білім беру қызметін алушылар бойынша дербестендірілген қаржыландыруды ескере отырып, мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын орналастыру жөніндегі пилоттық жобаның кейбір мәселелері туралы
