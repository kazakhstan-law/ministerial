  title:
    rus: О внесении изменений в приказ Министра просвещения Республики Казахстан от 29 февраля 2024 года № 53 «О некоторых вопросах пилотного проекта по централизованному размещению государственного образовательного заказа на дошкольное воспитание и обучение, в том числе с учетом персонифицированного финансирования по получателям образовательных услуг»
    kaz: «Көрсетілетін білім беру қызметін алушылар бойынша дербестендірілген қаржыландыруды ескере отырып, мектепке дейінгі тәрбие мен оқытуға мемлекеттік білім беру тапсырысын орналастыру жөніндегі пилоттық жобаның кейбір мәселелері туралы» Қазақстан Республикасы Оқу-ағарту министрінің 2024 жылғы 29 ақпандағы № 53 бұйрығына өзгерістер енгізу туралы
