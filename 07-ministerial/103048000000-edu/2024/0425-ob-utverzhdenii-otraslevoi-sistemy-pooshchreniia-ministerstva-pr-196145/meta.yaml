  title:
    rus: О внесении изменений в приказы Министра просвещения Республики Казахстан от 25 апреля 2024 года № 86 «Об утверждении Отраслевой системы поощрения Министерства просвещения Республики Казахстан» и от 29 августа 2025 года № 197 «Об утверждении Методики проведения рейтинга эффективности деятельности педагогов и руководителей организаций образования»
    kaz: «Қазақстан Республикасы Оқу-ағарту министрлігінің салалық көтермелеу жүйесін бекіту туралы» Қазақстан Республикасы Оқу-ағарту министрінің 2024 жылғы 25 сәуірдегі № 86 және «Білім беру ұйымдарының педагогтері мен басшылары қызметінің тиімділігі рейтингін жүргізу әдістемесін бекіту туралы» Қазақстан Республикасы Оқу-ағарту министрінің 2025 жылғы 29 тамыздағы № 197 бұйрықтарына өзгерістер енгізу туралы
