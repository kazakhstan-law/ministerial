title:
  rus: Об утверждении Перечня международных олимпиад по общеобразовательным предметам, по которым победители, призеры и педагоги, подготовившие их, победители международных конкурсов научных проектов, педагоги, подготовившие их, поощряются единовременным вознаграждением за счет бюджетных средств
  kaz: Жеңімпаздары, жүлдегерлері және оларды дайындаған педагогтер, ғылыми жобалардың халықаралық конкурстарының жеңімпаздары, оларды дайындаған педагогтер бюджет қаражаты есебінен біржолғы сыйақымен көтермеленетін жалпы білім беретін пәндер бойынша халықаралық олимпиадалардың тізбесін бекіту туралы
