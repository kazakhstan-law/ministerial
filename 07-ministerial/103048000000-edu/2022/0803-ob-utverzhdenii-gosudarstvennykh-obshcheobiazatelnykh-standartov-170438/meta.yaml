  title:
    rus: О внесении изменений и дополнений в приказ Министра просвещения Республики Казахстан от 3 августа 2022 года № 348 «Об утверждении государственных общеобязательных стандартов дошкольного воспитания и обучения, начального, основного среднего и общего среднего, технического и профессионального, послесреднего образования» и приказ Министра просвещения Республики Казахстан от 28 марта 2023 года № 75 «Об утверждении Правил организации учебного процесса по кредитной технологии обучения»
    kaz: «Мектепке дейінгі тәрбие мен оқытудың, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі білім берудің мемлекеттік жалпыға міндетті стандарттарын бекіту туралы» Қазақстан Республикасы Оқу-ағарту министрінің 2022 жылғы 3 тамыздағы № 348 бұйрығына және «Техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарында оқытудың кредиттік технологиясы бойынша оқу процесін ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Оқу-ағарту министрінің 2023 жылғы 28 наурыздағы № 75 бұйрығына өзгерістер мен толықтырулар енгізу туралы
