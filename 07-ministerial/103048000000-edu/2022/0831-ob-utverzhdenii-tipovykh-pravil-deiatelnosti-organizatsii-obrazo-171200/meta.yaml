  title:
    rus: О внесении дополнения в приказ Министра просвещения Республики Казахстан от 31 августа 2022 года № 385 «Об утверждении Типовых правил деятельности организаций дошкольного, среднего, технического и профессионального, послесреднего образования, дополнительного образования соответствующих типов и видов»
    kaz: «Тиісті типтердегі және түрлердегі мектепке дейінгі, орта, техникалық және кәсіптік, орта білімнен кейінгі, қосымша білім беру ұйымдары қызметінің үлгілік қағидаларын бекіту туралы» Қазақстан Республикасы Оқу-ағарту министрінің 2022 жылғы 31 тамыздағы № 385 бұйрығына толықтырулар енгізу туралы
