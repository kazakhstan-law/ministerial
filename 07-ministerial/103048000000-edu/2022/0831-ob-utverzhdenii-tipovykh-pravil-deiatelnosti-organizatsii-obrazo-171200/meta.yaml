  title:
    rus: О внесении изменений в приказ Министра просвещения Республики Казахстан от 31 августа 2022 года № 385 «Об утверждении Типовых правил деятельности организаций дошкольного, начального, основного среднего, общего среднего, технического и профессионального, послесреднего образования, специализированных, специальных, организациях образования для детей-сирот и детей, оставшихся без попечения родителей, организациях дополнительного образования для детей и взрослых»
    kaz: Қазақстан Республикасы Оқу-ағарту министрінің 2022 жылғы 31 тамыздағы № 385 «Мектепке дейінгі, бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдары, мамандандырылған, арнайы, жетім балалар мен ата-анасының қамқорлығынсыз қалған балаларға арналған білім беру ұйымдары, балалар мен ересектерге арналған қосымша білім беру ұйымдары қызметінің үлгілік қағидаларын бекіту туралы» бұйрығына өзгерістер енгізі туралы
  link: https://zan.gov.kz/client/#!/doc/175952/rus
