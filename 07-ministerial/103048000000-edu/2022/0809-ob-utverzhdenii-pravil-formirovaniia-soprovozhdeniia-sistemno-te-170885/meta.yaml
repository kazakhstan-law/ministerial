  requisite: Приказ и.о. Министра просвещения Республики Казахстан от 20 июля 2023 года № 218. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 июля 2023 года № 33147
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра образования и науки Республики Казахстан от 1 декабря 2011 года № 503 «Об утверждении Правил организации и функционирования объектов информатизации в области образования» и о внесении изменений в приказ Министра просвещения Республики Казахстан от 9 августа 2022 года № 354 «Об утверждении Правил формирования, сопровождения, системно-технического обслуживания, интеграции и обеспечения информационной безопасности информационной системы «Национальная образовательная база данных»
    kaz: «Білім беру саласындағы ақпараттандыру объектілерін ұйымдастыру және олардың жұмыс істеу қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің міндетін атқарушының 2011 жылғы 1 желтоқсандағы № 503 бұйрығына өзгерістер енгізу туралы және «Ұлттық білім беру деректер қоры» ақпараттық жүйесін қалыптастыру, сүйемелдеу, жүйелік-техникалық қызмет көрсету, интеграция және ақпараттық қауіпсіздікті қамтамасыз ету қағидаларын бекіту туралы» Қазақстан Республикасы Оқу-ағарту министрінің 2022 жылғы 9 тамыздағы № 354 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/184240/rus
