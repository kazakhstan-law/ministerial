title:
  rus: Об утверждении Правил формирования, сопровождения, системно-технического обслуживания, интеграции и обеспечения кибербезопасности цифровой системы «Национальная образовательная база данных»
  kaz: «Ұлттық білім беру деректер қоры» цифрлық жүйесін қалыптастыру, сүйемелдеу, жүйелік-техникалық қызмет көрсету, интеграция және киберқауіпсіздікті қамтамасыз ету қағидаларын бекіту туралы
