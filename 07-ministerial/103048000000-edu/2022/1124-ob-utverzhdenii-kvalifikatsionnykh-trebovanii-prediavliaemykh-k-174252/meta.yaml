  title:
    rus: «О внесении изменений в приказы Министра просвещения Республики Казахстан от 24 ноября 2022 года № 473 «Об утверждении квалификационных требований, предъявляемых к образовательной деятельности организаций образования, за исключением организаций высшего и послевузовского образования, и перечень документов, подтверждающих соответствие им» и от 27 ноября 2025 года № 268 «О внесении изменения и дополнения в приказ Министра просвещения Республики Казахстан от 24 ноября 2022 года № 473 «Об утверждении квалификационных требований, предъявляемых к образовательной деятельности организаций образования, за исключением организаций высшего и послевузовского образования, и перечень документов, подтверждающих соответствие им»
    kaz: Жоғары және жоғары оқу орнынан кейінгі білім беру ұйымдарын қоспағанда, білім беру ұйымдарының білім беру қызметіне қойылатын біліктілік талаптарын және оларға сәйкестікті растайтын құжаттардың тізбесін бекіту туралы» Қазақстан Республикасы Оқу-ағарту министрінің 2022 жылғы 24 қарашадағы № 473 және «Жоғары және жоғары оқу орнынан кейінгі білім беру ұйымдарын қоспағанда, білім беру ұйымдарының білім беру қызметіне қойылатын біліктілік талаптарын және оларға сәйкестікті растайтын құжаттардың тізбесін бекіту туралы Қазақстан Республикасы Оқу-ағарту министрінің 2022 жылғы 24 қарашадағы № 473 бұйрығына өзгеріс пен толықтыру енгізу туралы» Қазақстан Республикасы Оқу-ағарту министрінің 2025 жылғы 27 қарашадағы № 268 бұйрықтарына өзгерістер енгізу туралы»
