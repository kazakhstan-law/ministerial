title:
  rus: Об утверждении квалификационных требований, предъявляемых к образовательной деятельности организаций образования, за исключением организаций высшего и послевузовского образования, и перечень документов, подтверждающих соответствие им
  kaz: Жоғары және жоғары оқу орнынан кейінгі білім беру ұйымдарын қоспағанда, білім беру ұйымдарының білім беру қызметіне қойылатын біліктілік талаптарын және оларға сәйкестікті растайтын құжаттардың тізбесін бекіту туралы
