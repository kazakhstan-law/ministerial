  title:
    rus: О внесении изменения в приказ Министра просвещения Республики Казахстан от 24 ноября 2022 года № 473 «Об утверждении квалификационных требований, предъявляемых к образовательной деятельности организаций, предоставляющих начальное, основное среднее, общее среднее, техническое и профессиональное, послесреднее, духовное образование, и перечня документов, подтверждающих соответствие им»
    kaz: Бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі, діни білім беру ұйымдарының білім беру қызметіне қойылатын біліктілік талаптарын және оларға сәйкестікті растайтын құжаттардың тізбесін бекіту туралы» Қазақстан Республикасы Оқу-ағарту министрінің 2022 жылғы 24 қарашадағы № 473 бұйрығына өзгеріс енгізу туралы
