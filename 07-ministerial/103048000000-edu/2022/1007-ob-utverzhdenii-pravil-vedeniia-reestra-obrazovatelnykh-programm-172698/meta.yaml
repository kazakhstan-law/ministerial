title:
  rus: Об утверждении Правил ведения реестра образовательных программ, реализуемых организациями технического и профессионального, послесреднего образования, а также основания включения в реестр образовательных программ и исключения из него
  kaz: Техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдары іске асыратын білім беру бағдарламаларының тізілімін жүргізу қағидалары, сондай-ақ білім беру бағдарламаларының тізіліміне енгізу және алып тастау негіздерін бекіту туралы
