  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра просвещения Республики Казахстан от 7 октября 2022 года № 417 «Об утверждении Правил ведения реестра образовательных программ, реализуемых организациями технического и профессионального, послесреднего образования, а также основания включения в реестр образовательных программ и исключения из него»
    kaz: «Техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдары іске асыратын білім беру бағдарламаларының тізілімін жүргізу қағидалары, сондай-ақ білім беру бағдарламаларының тізіліміне енгізу және алып тастау негіздерін бекіту туралы» Қазақстан Республикасы Оқу-ағарту министрінің міндетін атқарушының 2022 жылғы 7 қазандағы № 417 бұйрығына өзгеріс енгізу туралы
