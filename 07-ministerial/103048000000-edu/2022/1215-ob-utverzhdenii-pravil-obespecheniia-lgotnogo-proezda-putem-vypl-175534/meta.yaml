act_code: '175534'
requisite: Приказ Министра просвещения Республики Казахстан от 15 декабря 2022 года № 497. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 декабря 2022 года № 31134
title:
  rus: Об утверждении правил обеспечения льготного проезда путем выплаты компенсаций для обучающихся на основе государственного образовательного заказа в организациях образования, реализующих образовательные программы технического и профессионального, послесреднего образования, в период зимних и летних каникул на междугородном железнодорожном и автомобильном транспорте
  kaz: Техникалық және кәсiптiк, орта бiлiмнен кейiнгi және жоғары бiлiмнің білім беру бағдарламаларын іске асыратын ұйымдарда мемлекеттік білім беру тапсырысы негізінде білім алушылар үшін өтемақылар төлеу арқылы қысқы және жазғы каникул кезеңінде қалааралық теміржол және автомобиль көлігінде жеңілдікпен жол жүруді қамтамасыз ету қағидаларын бекіту туралы
