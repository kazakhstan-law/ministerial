  title:
    rus: О внесении изменений в приказ Министра просвещения Республики Казахстан от 15 декабря 2022 года № 497 «Об утверждении Правил обеспечения льготного проезда путем выплаты компенсаций для обучающихся на основе государственного образовательного заказа в организациях образования, реализующих образовательные программы технического и профессионального, послесреднего образования, в период зимних и летних каникул на междугородном железнодорожном и автомобильном транспорте (кроме такси)»
    kaz: «Техникалық және кәсiптiк, орта бiлiмнен кейiнгi және жоғары бiлiмнің білім беру бағдарламаларын іске асыратын ұйымдарда мемлекеттік білім беру тапсырысы негізінде білім алушылар үшін өтемақылар төлеу арқылы қысқы және жазғы каникул кезеңінде қалааралық теміржол және автомобиль (таксиден басқа) көлігінде жеңілдікпен жол жүруді қамтамасыз ету қағидаларын бекіту туралы» Қазақстан Республикасы Оқу-ағарту министрінің 2022 жылғы 15 желтоқсандағы № 497 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/184067/rus
