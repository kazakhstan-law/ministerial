act_code: '170465'
requisite: Приказ и.о. Министра просвещения Республики Казахстан от 29 июля 2022 года № 347. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 августа 2022 года № 29030
title:
  rus: Об утверждении Правил выплаты единовременного вознаграждения победителям и призерам международных олимпиад по общеобразовательным предметам, педагогам, подготовившим их, победителям международных конкурсов научных проектов, педагогам, подготовившим их, а также размеров единовременного вознаграждения победителям и призерам международных олимпиад по общеобразовательным предметам, педагогам, подготовившим их, победителям международных конкурсов научных проектов, педагогам, подготовившим их
  kaz: Жалпы білім беретін пәндер бойынша халықаралық олимпиадалардың жеңімпаздары мен жүлдегерлеріне, оларды дайындаған педагогтерге, ғылыми жобалардың халықаралық конкурстарының жеңімпаздарына, оларды дайындаған педагогтерге біржолғы сыйақы төлеу қағидаларын, сондай-ақ жалпы білім беретін пәндер бойынша халықаралық олимпиадалардың жеңімпаздары мен жүлдегерлеріне, оларды дайындаған педагогтерге, ғылыми жобалардың халықаралық конкурстарының жеңімпаздарына, оларды дайындаған педагогтерге берілетін біржолғы сыйақының мөлшерлерін бекіту туралы
