title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача лицензии на занятие образовательной деятельностью в сфере начального, основного среднего, общего среднего, технического и профессионального, послесреднего образования, духовного образования, образовательно-оздоровительные услуги несовершеннолетним
  kaz: Бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру, діни білім беру, кәмелетке толмағандарға білім беру-сауықтыру қызметтері саласында білім беру қызметімен айналысуға лицензия беру» мемлекеттік қызметін көрсету қағидаларын бекіту туралы
