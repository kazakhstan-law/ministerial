act_code: '169979'
requisite: Приказ Министра просвещения Республики Казахстан от 15 июля 2022 года № 326. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 июля 2022 года № 28848
title:
  rus: Об утверждении Перечня международных олимпиад по общеобразовательным предметам, международных конкурсов научных проектов и международных конкурсов исполнителей, спортивных соревнований, по которым победители и призеры (награжденные дипломами первой, второй и третьей степени) последних трех лет зачисляются с присуждением образовательного гранта в организации образования, реализующие образовательные программы высшего образования, и критерии их отбора
  kaz: Соңғы үш жылдағы жеңімпаздары мен жүлдегерлері (бірінші, екінші және үшінші дәрежелі дипломдармен марапатталған) жоғары білімнің білім беру бағдарламаларын іске асыратын білім беру ұйымдарына білім беру гранты беріле отырып қабылданатын жалпы білім беретін пәндер бойынша халықаралық олимпиадалардың, ғылыми жобалардың халықаралық конкурстарының және орындаушылардың халықаралық конкурстарының, спорттық жарыстардың тізбесі мен оларды іріктеу өлшемшарттарын бекіту туралы
