  title:
    rus: О внесении дополнения в приказ Министра просвещения Республики Казахстан от 15 июля 2022 года № 326 «Об утверждении Перечня международных олимпиад по общеобразовательным предметам, международных конкурсов научных проектов, конкурсов исполнителей, спортивных соревнований, по которым победители и призеры (награжденные дипломами первой, второй и третьей степени) последних трех лет зачисляются с присуждением образовательного гранта в организации образования, реализующие образовательные программы высшего образования, и критерии их отбора»
    kaz: Соңғы үш жылдағы жеңімпаздары мен жүлдегерлері (бірінші, екінші және үшінші дәрежелі дипломдармен марапатталған) жоғары білімнің білім беру бағдарламаларын іске асыратын білім беру ұйымдарына білім беру гранты беріле отырып қабылданатын, жалпы білім беретін пәндер бойынша халықаралық олимпиадалардың және орындаушылардың халықаралық конкурстарының, спорттық жарыстардың тізбесін және оларды іріктеу өлшемшарттарын бекіту туралы» Қазақстан Республикасы Оқу-ағарту министрінің 2022 жылғы 15 шiлдедегi № 326 бұйрығына толықтыру енгізу туралы
