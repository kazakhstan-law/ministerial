title:
  rus: Об утверждении Перечня видов деятельности, технологически связанных с услугами, осуществляемыми субъектом специального права акционерным обществом «Национальный центр исследований и оценки образования «Талдау» имени Ахмет Байтұрсынұлы»
  kaz: Арнайы құқық субъектісі «Ахмет Байтұрсынұлы атындағы «Талдау» «Ахмет Байтұрсынұлы атындағы «Талдау» ұлттық зерттеулер және білімді бағалау орталығы» акционерлік қоғамы жүзеге асыратын қызметтермен технологиялық тұрғыдан байланысты қызмет түрлерінің тізбесін бекіту туралы
