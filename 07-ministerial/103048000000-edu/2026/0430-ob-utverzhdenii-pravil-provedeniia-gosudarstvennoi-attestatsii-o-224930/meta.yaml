act_code: '224930'
requisite: Приказ Министра просвещения Республики Казахстан от 30 апреля 2026 года № 114-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 мая 2026 года № 38645
title:
  rus: Об утверждении правил проведения государственной аттестации организаций образования, реализующих общеобразовательные учебные программы дошкольного воспитания и обучения, начального, основного среднего и общего среднего образования, образовательные программы технического и профессионального, послесреднего образования независимо от форм собственности и ведомственной подчиненности
  kaz: Меншік нысанына және ведомстволық бағыныстылығына қарамастан, мектепке дейінгі тәрбие мен оқытудың, бастауыш, негізгі орта және жалпы орта білімнің жалпы білім беретін оқу бағдарламаларын, техникалық және кәсіптік, орта білімнен кейінгі білімнің білім беру бағдарламаларын іске асыратын білім беру ұйымдарын мемлекеттік аттестаттаудан өткізу қағидаларын бекіту туралы
