title:
  rus: Об определении минимального размера территории детских деревень, с расположенными на ней жилыми помещениями квартирного типа, административными зданиями и сооружениями, предназначенными для проживания семей, а также приусадебным и подсобным (домашним) хозяйством
  kaz: Балалар ауылының пәтер үлгісіндегі тұрғын үй-жайлар, әкімшілік ғимараттар мен отбасылардың тұруына арналған құрылысжайлар, сондай-ақ үй іргесiндегi және қосалқы (үй) шаруашылық орналасқан оқшауланған аумағы болады, оның ең аз мөлшерін айқындауды туралы
