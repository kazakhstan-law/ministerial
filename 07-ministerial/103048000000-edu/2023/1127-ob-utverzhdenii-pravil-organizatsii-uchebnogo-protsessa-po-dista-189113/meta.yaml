  title:
    rus: О внесении изменений и дополнения в приказ Министра просвещения Республики Казахстан от 27 ноября 2023 года № 349 «Об утверждении требований к организациям образования по предоставлению дистанционного обучения и правил организации учебного процесса по дистанционному обучению по образовательным программам начального, основного среднего, общего среднего, технического и профессионального, послесреднего образования и в форме онлайн-обучения по образовательным программам технического и профессионального, послесреднего образования» и признании утратившим силу некоторых приказов
    kaz: «Қашықтан оқытуды ұсыну бойынша білім беру ұйымдарына қойылатын талаптарды және бастауыш, негізгі орта, жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі білімнің білім беру бағдарламалары бойынша қашықтан оқыту бойынша оқу процесін ұйымдастыру қағидаларын және техникалық және кәсіптік, орта білімнен кейінгі білімнің білім беру бағдарламалары бойынша онлайн-оқыту нысанында оқу процесін ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Оқу-ағарту министрінің 2023 жылғы 27 қарашадағы № 349 бұйрығына өзгерістер мен толықтыру енгізу және кейбір бұйрықтардың күші жойылды деп тану туралы
