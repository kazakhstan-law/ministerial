act_code: '189113'
requisite: Приказ Министра просвещения Республики Казахстан от 27 ноября 2023 года № 349. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 ноября 2023 года № 33682
title:
  rus: Об утверждении правил организации учебного процесса по дистанционному обучению в организациях среднего, дополнительного, технического и профессионального, послесреднего образования, в том числе при неблагоприятных погодных метеоусловиях, а также при введении чрезвычайного положения, ограничительных мероприятий, в том числе карантина, на соответствующих административно-территориальных единицах (на отдельных объектах), при объявлении чрезвычайных ситуаций и в форме онлайн-обучения в организациях образования, реализующих образовательные учебные программы технического и профессионального, послесреднего образования, а также требований к организациям образования по предоставлению дистанционного обучения
  kaz: Орта, қосымша, техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарында, оның ішінде қолайсыз ауа райы метеожағдайларында, сондай-ақ тиісті әкімшілік-аумақтық бірліктерде (жекелеген объектілерде) төтенше жағдай, шектеу іс-шаралары, оның ішінде карантин енгізілген, төтенше жағдайлар жарияланған кезде қашықтан оқыту бойынша және техникалық және кәсіптік, орта білімнен кейінгі білімнің білім беретін оқу бағдарламаларын іске асыратын білім беру ұйымдарында онлайн-оқыту нысанында оқу процесін ұйымдастыру қағидаларын, сондай-ақ қашықтан оқытуды ұсыну бойынша білім беру ұйымдарына қойылатын талаптарын бекіту туралы
