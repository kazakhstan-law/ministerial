title:
  rus: «Об утверждении Правил присуждения и размеров образовательного гранта Президента Республики Казахстан «Өркен» для оплаты обучения одаренных детей в автономной организации образования «Назарбаев Интеллектуальные школы»
  kaz: «Назарбаев Зияткерлік мектептері» дербес білім беру ұйымында дарынды балалардың оқуына ақы төлеу үшін Қазақстан Республикасы Президентінің «Өркен» білім беру грантын тағайындау қағидалары мен мөлшерлерін бекіту туралы»
