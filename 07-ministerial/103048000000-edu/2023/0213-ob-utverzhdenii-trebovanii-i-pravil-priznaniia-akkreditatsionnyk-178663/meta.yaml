  title:
    rus: О внесении изменений в приказ Министра просвещения Республики Казахстан от 13 февраля 2023 года № 34 «Об утверждении требований, предъявляемые к аккредитационому органу в сфере среднего, технического и профессионального, послесреднего образования и правил признания аккредитационных органов, в том числе зарубежных в сфере среднего, технического и профессионального, послесреднего образования»
    kaz: «Орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру саласындағы аккредиттеу органдарына қойылатын талаптарды және орта, техникалық және кәсіптік, орта білімнен кейінгі білім беру саласындағы, оның ішінде шетелдік аккредиттеу органдарын тану қағидаларын бекіту туралы» Қазақстан Республикасы Оқу-ағарту министрінің 2023 жылғы 13 ақпандағы № 34 бұйрығына өзгерістер енгізу туралы
