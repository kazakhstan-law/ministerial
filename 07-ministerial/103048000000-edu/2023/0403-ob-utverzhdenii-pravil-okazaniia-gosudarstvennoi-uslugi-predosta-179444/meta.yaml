act_code: '179444'
requisite: Приказ Министра просвещения Республики Казахстан от 3 апреля 2023 года № 82. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 апреля 2023 года № 32226
title:
  rus: Об утверждении Правил оказания государственной услуги «Предоставление бесплатного питания отдельным категориям граждан, а также лицам, находящимся под опекой (попечительством) и патронатом, обучающимся и воспитанникам организаций технического и профессионального, послесреднего образования»
  kaz: «Техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарындағы тәрбиеленушілер мен білім алушылардың жекелеген санаттағы азаматтарына, сондай-ақ, қорғаншылық (қамқоршылықтағы) пен патронаттағы тұлғаларына тегін тамақтандыруды ұсыну» мемлекеттік қызмет көрсету қағидаларын бекіту туралы
