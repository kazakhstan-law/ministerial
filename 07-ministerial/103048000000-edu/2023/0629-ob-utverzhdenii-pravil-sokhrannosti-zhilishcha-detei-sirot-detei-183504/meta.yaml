  title:
    rus: О внесении изменений в некоторые приказы и признании утратившим силу приказа Министра образования и науки Республики Казахстан от 21 августа 2019 года № 373 «Об утверждении инструкции по взаимодействию организаций для детей-сирот и детей, оставшихся без попечения родителей, с негосударственными агентствами по усыновлению в вопросах устройства детей-сирот и детей, оставшихся без попечения родителей, в семьи граждан Республики Казахстан»
    kaz: Кейбір бұйрықтарға өзгерістер енгізу туралы және «Жетім балалар мен ата-анасының қамқорлығынсыз қалған балаларға арналған ұйымдардың бала асырап алу жөніндегі мемлекеттік емес агенттіктермен Қазақстан Республикасы азаматтарының отбасыларына жетім балалар мен ата-анасының қамқорлығынсыз қалған балаларды орналастыру мәселелерінде өзара іс-қимылы бойынша нұсқаулықты бекіту туралы «Қазақстан Республикасы Білім және ғылым министрінің 2019 жылғы 21 тамыздағы № 373 бұйрығының күші жойылды деп тану туралы
  link: https://zan.gov.kz/client/#!/doc/208610/rus
