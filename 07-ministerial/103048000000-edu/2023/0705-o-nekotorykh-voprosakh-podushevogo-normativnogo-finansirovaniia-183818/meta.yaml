title:
  rus: О некоторых вопросах подушевого нормативного финансирования дошкольного воспитания и обучения, среднего образования, а также технического и профессионального, послесреднего образования с учетом кредитной технологии обучения
  kaz: Мектепке дейінгі тәрбие мен оқытуды, орта білім беруді, сондай-ақ кредиттік оқыту технологиясын ескере отырып, техникалық және кәсіптік, орта білімнен кейінгі білім беруді жан басына шаққандағы нормативтік қаржыландырудың кейбір мәселелері туралы
