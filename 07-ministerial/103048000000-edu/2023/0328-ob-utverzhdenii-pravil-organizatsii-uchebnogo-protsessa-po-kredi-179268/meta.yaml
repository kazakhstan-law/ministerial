  title:
    rus: О внесении изменения в приказ Министра просвещения Республики Казахстан от 28 марта 2023 года № 75 «Об утверждении Правил организации учебного процесса по кредитной технологии обучения в организациях технического и профессионального, послесреднего образования»
    kaz: «Техникалық және кәсіптік, орта білімнен кейінгі білім беру ұйымдарында оқытудың кредиттік технологиясы бойынша оқу процесін ұйымдастыру қағидаларын бекіту туралы» Қазақстан Республикасы Оқу-ағарту министрінің 2023 жылғы 28 наурыздағы № 75 бұйрығына өзгеріс енгізу туралы
