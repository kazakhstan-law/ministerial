requisite: Приказ Министра просвещения Республики Казахстан от 25 июля 2023 года № 225. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 июля 2023 года № 33170.Утратил силу приказом Министра просвещения Республики Казахстан от 2 мая 2025 года № 103 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил организации учебного процесса в форме онлайн-обучения в организациях образования, реализующих общеобразовательные учебные программы технического и профессионального, послесреднего образования
  kaz: Техникалық және кәсіптік, орта білімнен кейінгі білімнің жалпы білім беретін оқу бағдарламаларын іске асыратын білім беру ұйымдарында онлайн-оқыту нысанында оқу процесін ұйымдастыру қағидаларын бекіту туралы
