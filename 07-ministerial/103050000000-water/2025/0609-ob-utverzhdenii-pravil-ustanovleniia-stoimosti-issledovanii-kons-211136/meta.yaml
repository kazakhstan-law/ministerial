  title:
    rus: О внесении изменений в приказы Министра водных ресурсов и ирригации Республики Казахстан от 9 июня 2025 года № 113-НҚ «Об утверждении Правил установления стоимости исследований, консалтинговых услуг» и от 27 июня 2025 года № 157-НҚ «Об утверждении Правил субсидирования и выплат субсидий из бюджета на покрытие расходов по погашению, обслуживанию и софинансированию по займам, привлеченным под государственную гарантию, на развитие водохранилищ, каналов и гидротехнических сооружений Республики Казахстан»
    kaz: «Зерттеулердің, консалтингтік көрсетілетін қызметтер құнын белгілеу қағидаларын бекіту туралы» 2025 жылғы 9 маусымдағы № 113-НҚ және «Қазақстан Республикасының су қоймаларын, каналдары мен гидротехникалық құрылысжайларын дамытуға мемлекеттік кепілдікпен тартылған қарыздар бойынша өтеу, қызмет көрсету және қоса қаржыландыру жөніндегі шығыстарды жабуға бюджеттен субсидиялар бөлу және субсидиялар төлеу қағидасын бекіту туралы» 2025 жылғы 27 маусымдағы № 157-НҚ Қазақстан Республикасы Су ресурстары және ирригация министрінің бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/227929/rus
