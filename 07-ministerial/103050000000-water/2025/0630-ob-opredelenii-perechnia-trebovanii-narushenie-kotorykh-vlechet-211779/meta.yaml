title:
  rus: Об определении перечня требований, нарушение которых влечет применение мер оперативного реагирования, а также определение в отношении конкретных нарушений требований конкретного вида меры оперативного реагирования, условия ее применения и срок действия данной меры (при необходимости)
  kaz: Бұзылуы жедел ден қою шараларын қолдануға алып келетін талаптар тізбесін, сондай-ақ талаптарды нақты бұзушылықтарға қатысты жедел ден қою шарасының нақты түрін, оны қолдану шарттарын және осы шараның қолданылу мерзімін (қажет болған кезде) айқындау туралы
