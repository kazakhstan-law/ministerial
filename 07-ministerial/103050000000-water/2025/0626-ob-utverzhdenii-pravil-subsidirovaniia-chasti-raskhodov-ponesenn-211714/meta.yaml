  title:
    rus: О внесении изменений в приказы Министра водных ресурсов и ирригации Республики Казахстан от 24 июня 2025 года № 147-НҚ «Об утверждении Правил субсидирования стоимости услуг по подаче воды сельскохозяйственным товаропроизводителям» и исполняющего обязанности Министра водных ресурсов и ирригации Республики Казахстан от 26 июня 2025 года № 153-НҚ «Об утверждении Правил субсидирования части расходов, понесенных сельскохозяйственным товаропроизводителем при инвестиционных вложениях, направленных на внедрение водосберегающих технологий орошения»
    kaz: «Ауыл шаруашылығы тауарларын өндiрушiлерге су беру бойынша көрсетілетін қызметтер құнын субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Су ресурстары және ирригация министрінің 2025 жылғы 24 маусымдағы № 147-НҚ және «Суарудың су үнемдейтін технологияларын енгізуге бағытталған инвестициялық салымдар кезінде ауыл шаруашылығы тауарын өндiрушiлер шеккен шығыстардың бір бөлігін субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Су ресурстары және ирригация министрінің міндетін атқарушының 2025 жылғы 26 маусымдағы № 153-НҚ бұйрықтарына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/227812/rus
