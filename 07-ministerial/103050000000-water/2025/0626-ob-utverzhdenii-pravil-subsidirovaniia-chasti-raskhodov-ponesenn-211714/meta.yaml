title:
  rus: Об утверждении Правил субсидирования части расходов, понесенных сельскохозяйственным товаропроизводителем при инвестиционных вложениях, направленных на внедрение водосберегающих технологий орошения
  kaz: Суарудың су үнемдейтін технологияларын енгізуге бағытталған инвестициялық салымдар кезінде ауыл шаруашылығы тауарын өндiрушiлер шеккен шығыстардың бір бөлігін субсидиялау қағидаларын бекіту туралы
