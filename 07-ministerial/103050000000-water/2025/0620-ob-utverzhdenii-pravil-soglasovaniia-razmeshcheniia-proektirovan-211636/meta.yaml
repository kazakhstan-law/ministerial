act_code: '211636'
requisite: Приказ и.о. Министра водных ресурсов и ирригации Республики Казахстан от 20 июня 2025 года № 142-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 июня 2025 года № 36324
title:
  rus: Об утверждении Правил согласования размещения, проектирования и строительства, реконструкции сооружений и других объектов, влияющих на состояние водных объектов, а также условий проведения работ, связанных со строительной деятельностью, лесоразведением, операциями по недропользованию, бурением скважин, санацией поверхностных водных объектов, рыбохозяйственной мелиорацией водных объектов, сельскохозяйственными и иными работами на водных объектах, в водоохранных зонах и полосах
  kaz: Су объектілерінің жай-күйіне әсер ететін құрылысжайлар мен басқа да объектілерді орналастыруды, жобалауды және салуды, реконструкциялауды, сондай-ақ су объектілеріндегі, су қорғау аймақтары мен белдеулеріндегі құрылыс қызметіне, ағаш өсіруге, жер қойнауын пайдалану жөніндегі операцияларға, ұңғымаларды бұрғылауға, жерүсті су объектілерін санациялауға, су объектілерінің балық шаруашылығы мелиорациясына, ауыл шаруашылығы жұмыстары мен өзге де жұмыстарға байланысты жұмыстарды жүргізу шарттарын келісу Қағидаларын бекіту туралы
