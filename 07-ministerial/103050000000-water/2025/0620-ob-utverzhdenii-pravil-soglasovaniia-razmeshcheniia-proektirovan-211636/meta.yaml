  requisite: Приказ и.о. Министра водных ресурсов и ирригации Республики Казахстан от 26 мая 2026 года № 161-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 мая 2026 года № 38816
  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра водных ресурсов и ирригации Республики Казахстан от 20 июня 2025 года № 142-НҚ «Об утверждении Правил согласования размещения, проектирования и строительства, реконструкции сооружений и других объектов, влияющих на состояние водных объектов, а также условий проведения работ, связанных со строительной деятельностью, лесоразведением, операциями по недропользованию, бурением скважин, санацией поверхностных водных объектов, рыбохозяйственной мелиорацией водных объектов, сельскохозяйственными и иными работами на водных объектах, в водоохранных зонах и полосах»
    kaz: «Су объектілерінің жай-күйіне әсер ететін құрылысжайлар мен басқа да объектілерді орналастыруды, жобалауды және салуды, реконструкциялауды, сондай-ақ су объектілеріндегі, су қорғау аймақтары мен белдеулеріндегі құрылыс қызметіне, ағаш өсіруге, жер қойнауын пайдалану жөніндегі операцияларға, ұңғымаларды бұрғылауға, жерүсті су объектілерін санациялауға, су объектілерінің балық шаруашылығы мелиорациясына, ауыл шаруашылығы жұмыстары мен өзге де жұмыстарға байланысты жұмыстарды жүргізу шарттарын келісу Қағидаларын бекіту туралы» Қазақстан Республикасы Су ресурстары және ирригация министрінің міндетін атқарушысының 2025 жылғы 20 маусымдағы № 142-НҚ бұйрығына өзгерістер мен толықтырулар енгізу туралы
