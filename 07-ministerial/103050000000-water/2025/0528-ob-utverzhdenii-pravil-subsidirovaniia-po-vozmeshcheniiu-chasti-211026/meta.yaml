requisite: Приказ и.о. Министра водных ресурсов и ирригации Республики Казахстан от 28 мая 2025 года № 100-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 июня 2025 года № 36209. Утратил силу приказом и.о. Министра водных ресурсов и ирригации Республики Казахстан от 26 июня 2025 года № 153-НҚ (вводится в действие со дня его первого официального опубликования)
title:
