requisite: Приказ Министра водных ресурсов и ирригации Республики Казахстан от 27 июня 2025 года № 157-НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июня 2025 года № 36356
title:
  rus: Об утверждении Правил субсидирования и выплат субсидий из бюджета на покрытие расходов по погашению, обслуживанию и софинансированию по займам, привлеченным под государственную гарантию, на развитие водохранилищ, каналов и гидротехнических сооружений Республики Казахстан
  kaz: Қазақстан Республикасының су қоймаларын, каналдары мен гидротехникалық құрылысжайларын дамытуға мемлекеттік кепілдікпен тартылған қарыздар бойынша өтеу, қызмет көрсету және қоса қаржыландыру жөніндегі шығыстарды жабуға бюджеттен субсидиялар бөлу және субсидиялар төлеу қағидасын бекіту туралы
