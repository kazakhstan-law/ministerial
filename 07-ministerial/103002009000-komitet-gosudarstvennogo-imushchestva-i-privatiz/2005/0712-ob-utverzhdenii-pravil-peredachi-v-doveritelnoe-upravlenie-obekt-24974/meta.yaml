    kaz: '"Мемлекеттік республикалық меншік объектілерін сенім білдірілген басқаруға беру ережесін бекіту туралы" Қазақстан Республикасы Қаржы министрлігінің Мемлекеттік мүлік және жекешелендіру комитеті төрағасының 2005 жылғы 12 шілдедегі N 265 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
