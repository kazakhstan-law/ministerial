title:
  rus: Об утверждении положений о территориальных органах Комитета государственного имущества и приватизации Министерства финансов Республики Казахстан
  kaz: Қазақстан Республикасы Қаржы министрлігі Мемлекеттік мүлік және жекешелендіру комитетінің аумақтық органдары туралы ережелерді бекіту туралы
