  title:
    rus: О внесении изменения в приказ и.о. Председателя Комитета государственного имущества и приватизации Министерства финансов Республики Казахстан от 27 сентября 2018 года № 934 «Об утверждении Положений о территориальных органах Комитета государственного имущества и приватизации Министерства финансов Республики Казахстан»
    kaz: «Қазақстан Республикасы Қаржы министрлігі Мемлекеттік мүлік және жекешелендіру комитетінің аумақтық органдары туралы ережелерді бекіту туралы» Қазақстан Республикасы Қаржы министрлігінің Мемлекеттік мүлік және жекешелендіру комитеті Төрағасының міндетін атқарушының 2018 жылғы 27 қыркүйектегі № 934 бұйрығына өзгеріс енгізу туралы
