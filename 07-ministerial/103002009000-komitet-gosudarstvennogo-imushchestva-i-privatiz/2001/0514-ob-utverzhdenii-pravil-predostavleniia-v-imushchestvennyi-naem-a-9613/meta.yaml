  requisite: Приказ Председателя Комитета государственного имущества и приватизации Министерства финансов Республики Казахстан от 1 августа 2003 года № 249.  Зарегистрирован в Министерстве юстиции Республики Казахстан 23 октября 2003 года № 2539. Утратил силу приказом Министра финансов Республики Казахстан от 2 ноября 2012 года № 478
  title:
    rus: О внесении изменения и дополнений в приказ Председателя Комитета государственного имущества и приватизации Министерства финансов Республики Казахстан от 15 мая 2001 года № 111 "Об утверждении Правил предоставления в имущественный наем (аренду) объектов, находящихся на балансе республиканских государственных учреждений", зарегистрированный в Министерстве юстиции Республики Казахстан 27 июля 2001 года № 1589
    kaz: Қазақстан Республикасының Әділет министрлігінде 2001 жылғы 27 шілдеде N 1589 тіркелген "Республикалық мемлекеттік мекемелердің балансындағы объектілерді мүліктік жалға (жалдауға) беру ережесін бекіту туралы" Қазақстан Республикасының Қаржы министрлігі Мемлекеттік мүлік және жекешелендіру комитетінің 2001 жылғы 15 мамырдағы N 111 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/17273/rus
