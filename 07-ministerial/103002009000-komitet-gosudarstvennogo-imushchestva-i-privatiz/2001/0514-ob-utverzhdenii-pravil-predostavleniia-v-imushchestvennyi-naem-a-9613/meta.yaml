act_code: '9613'
requisite: Приказ Председателя Комитета государственного имущества и приватизации Министерства финансов Республики Казахстан от 15 мая 2001 года № 111. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 июля 2001 года № 1589. Утратил силу приказом Министра финансов Республики Казахстан от 2 ноября 2012 года № 478
title:
  rus: Об утверждении Правил предоставления в имущественный наем (аренду) объектов, находящихся на балансе республиканских государственных учреждений
  kaz: Республикалық мемлекеттiк мекемелердiң балансындағы объектiлердi мүлiктiк жалға (жалдауға) берудiң ережесiн бекiту туралы
