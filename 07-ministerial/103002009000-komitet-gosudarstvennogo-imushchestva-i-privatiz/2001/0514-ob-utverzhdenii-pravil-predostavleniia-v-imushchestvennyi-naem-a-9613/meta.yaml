  title:
    rus: О внесении изменения в приказ Председателя Комитета государственного имущества и приватизации Министерства финансов Республики Казахстан от 15 мая 2001 года № 111 "Об утверждении Правил предоставления в имущественный наем (аренду) объектов, находящихся на балансе республиканских государственных учреждений", зарегистрированный в Министерстве юстиции Республики Казахстан 27 июля 2001 года № 1589
    kaz: Қазақстан Республикасының Әдiлет министрлiгiнде 2001 жылғы 27 шiлдеде N 1589 тiркелген "Республикалық мемлекеттiк мекемелердiң балансындағы объектiлердi мүліктік жалға (жалдауға) беру ережесiн бекiту туралы" Қазақстан Республикасының Қаржы министрлiгi Мемлекеттiк мүлiк және жекешелендiру комитетiнiң Төрағасының 2001 жылғы 15 мамырдағы N 111 бұйрығына өзгерiс енгiзу туралы
