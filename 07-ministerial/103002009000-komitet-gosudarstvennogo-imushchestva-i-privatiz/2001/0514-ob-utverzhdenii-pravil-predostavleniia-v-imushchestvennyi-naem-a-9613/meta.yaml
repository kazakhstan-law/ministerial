title:
  rus: Об утверждении Правил предоставления в имущественный наем (аренду) объектов, находящихся на балансе республиканских государственных учреждений
  kaz: Республикалық мемлекеттiк мекемелердiң балансындағы объектiлердi мүлiктiк жалға (жалдауға) берудiң ережесiн бекiту туралы
