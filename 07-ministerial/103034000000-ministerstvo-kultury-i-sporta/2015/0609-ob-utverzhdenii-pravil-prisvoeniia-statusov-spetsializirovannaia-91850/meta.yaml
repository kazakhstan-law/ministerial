    rus: О внесении изменения в приказ исполняющего обязанности Министра культуры и спорта Республики Казахстан от 9 июня 2015 года № 209 «Об утверждении Правил присвоения статусов «специализированная» спортивным школам и «специализированное» отделениям спортивных школ»
