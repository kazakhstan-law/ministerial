title:
  rus: О распределении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным, послесредним  образованием в учебных заведениях Министерства культуры и спорта Республики Казахстан на 2015-2016 учебный год
  kaz: Жоғары және жоғары оқу орнынан кейінгі, сондай-ақ  техникалық және кәсіптік, орта білімнен кейінгі білімі бар мамандар даярлауға 2015 – 2016 оқу жылына арналған мемлекеттік білім беру тапсырысын Қазақстан Республикасы Мәдениет және спорт министрлігінің оқу орындарында  бөлу туралы
