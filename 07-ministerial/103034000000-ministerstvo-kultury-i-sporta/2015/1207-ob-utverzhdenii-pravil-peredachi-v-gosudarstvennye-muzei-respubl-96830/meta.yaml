act_code: '96830'
requisite: Приказ Министра культуры и спорта Республики Казахстан от 7 декабря 2015 года № 376. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 декабря 2015 года № 12578. Утратил силу приказом Министра культуры и спорта Республики Казахстан от 15 апреля 2020 года № 90 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил передачи в государственные музеи Республики Казахстан после научной фиксации и обработки материалов и находок, полученных физическими и юридическими лицами Республики Казахстан и других государств в результате археологических исследований на территории Казахстана
  kaz: Қазақстан аумағындағы археологиялық зерттеулер нәтижесінде Қазақстан Республикасының және басқа да мемлекеттердің жеке және заңды тұлғалары алған материалдар мен олжалар ғылыми тіркелгеннен және өңделгеннен кейін Қазақстан Республикасының мемлекеттік музейлеріне беру қағидаларын бекiту туралы
