title:
  rus: Об утверждении Реестра должностей гражданских служащих в сферах культуры, образования в области культуры, развития языков, архивного дела и документационного обеспечения управления, физической культуры и спорта
  kaz: Мәдениет, мәдениет саласында білім беру, тілдерді дамыту, архив ісі және басқаруды құжаттамалық қамтамасыз ету, дене шынықтыру және спорт салаларындағы азаматтық қызметшілер лауазымдарының тізілімін бекіту туралы
