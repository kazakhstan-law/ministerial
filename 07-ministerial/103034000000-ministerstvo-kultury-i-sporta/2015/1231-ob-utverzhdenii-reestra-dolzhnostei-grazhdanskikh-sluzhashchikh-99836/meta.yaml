  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра культуры и спорта Республики Казахстан от 31 декабря 2015 года № 419 «Об утверждении Реестра должностей гражданских служащих в сферах культуры, образования в области культуры, развития языков, архивного дела и документационного обеспечения управления, физической культуры и спорта»
    kaz: «Мәдениет, мәдениет саласында білім беру, тілдерді дамыту, архив ісі және құжаттама, дене шынықтыру және спорт салаларындағы азаматтық қызметшілер лауазымдарының тізілімін бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің міндетін атқарушының 2015 жылғы 31 желтоқсандағы № 419 бұйрығына өзгерістер енгізу туралы
