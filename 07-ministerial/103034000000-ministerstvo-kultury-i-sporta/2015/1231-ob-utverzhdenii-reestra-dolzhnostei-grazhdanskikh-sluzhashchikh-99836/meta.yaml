  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра культуры и спорта Республики Казахстан от 31 декабря 2015 года № 419 «Об утверждении Реестра должностей гражданских служащих в сферах культуры, образования в области культуры и искусства, развития языков, архивного дела и документации, физической культуры и спорта, религиозной деятельности»
    kaz: Мәдениет, мәдениет және өнер саласында білім беру, тілдерді дамыту, архив ісі және құжаттама, дене шынықтыру және спорт, дін қызметі салаларындағы азаматтық қызметшілер лауазымдарының тізілімін бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің міндетін атқарушысының 2015 жылғы 31 желтоқсандағы № 419 бұйрығына өзгерістер енгізу туралы
