title:
  rus: Об утверждении квалификационных требований, предъявляемых при лицензировании деятельности по осуществлению археологических и (или) научно-реставрационных работ на памятниках истории и культуры,  и перечня документов, подтверждающих соответствие им
  kaz: Тарих және мәдениет ескерткіштеріндегі археологиялық және (немесе) ғылыми-реставрациялық жұмыстарды жүзеге асыру қызметін  лицензиялау кезінде қойылатын  біліктілік талаптарын және оларға сәйкестікті растайтын  құжаттар тізбесін бекіту туралы
