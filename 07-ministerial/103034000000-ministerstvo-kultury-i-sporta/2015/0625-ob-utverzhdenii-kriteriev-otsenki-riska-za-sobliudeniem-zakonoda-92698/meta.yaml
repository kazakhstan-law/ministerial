requisite: Совместный приказ и.о. Министра культуры и спорта Республики Казахстан от 25 июня 2015 года № 223 и и.о. Министра национальной экономики Республики Казахстан от 30 июня 2015 года № 486. Зарегестрирован в Министерстве юстиции 4 августа 2015 года № 11840. Утратил силу совместным приказом Министра культуры и спорта Республики Казахстан от 8 августа 2016 года № 227 и Министра национальной экономики Республики Казахстан от 17 августа 2016 года № 373
title:
  rus: Об утверждении критериев оценки риска за соблюдением законодательства Республики Казахстан об игорном бизнесе и форм проверочных листов в сфере государственного контроля за соблюдением законодательства Республики Казахстан об игорном бизнесе
  kaz: Қазақстан Республикасының ойын бизнесі туралы заңнамасының орындалуы үшін тәуекел дәрежесін бағалау критерийлерін және Қазақстан Республикасының ойын бизнесі туралы заңнамасының орындалуы үшін мемлекеттік бақылау саласындағы тексеру парақтарының нысандарын бекіту туралы
