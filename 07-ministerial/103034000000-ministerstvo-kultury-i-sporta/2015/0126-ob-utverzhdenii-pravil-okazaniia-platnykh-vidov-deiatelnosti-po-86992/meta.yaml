  title:
    rus: О внесении изменений в приказ Министра культуры и спорта Республики Казахстан от 26 января 2015 года № 21 «Об утверждении Правил оказания платных видов деятельности по реализации товаров, работ, услуг государственными библиотеками, государственными музеями и музеями-заповедниками и расходования ими денег от реализации товаров, работ, услуг»
    kaz: «Мемлекеттік кітапханалардың, мемлекеттік музейлер мен музей-қорықтардың тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізу жөніндегі ақылы қызмет түрлерін көрсету және олардың тауарларды, жұмыстарды, көрсетілетін қызметтерді өткізуден түскен ақшаны жұмсау қағидаларын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2015 жылғы 26 қаңтардағы № 21 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/151421/rus
