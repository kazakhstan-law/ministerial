act_code: '86992'
requisite: Приказ Министра культуры и спорта Республики Казахстан от 26 января 2015 года № 21. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 февраля 2015 года № 10331. Утратил силу приказом Министра культуры и информации Республики Казахстан от 10 июля 2025 года № 312-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) государственными библиотеками, государственными музеями и музеями-заповедниками, созданными в организационно-правовой форме государственного учреждения, и расходования ими денег от реализации товаров (работ, услуг)
  kaz: Мемлекеттік мекеменің ұйымдық-құқықтық нысанында құрылған мемлекеттік кітапханалардың, мемлекеттік музейлер мен музей-қорықтардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізу бойынша ақылы қызмет түрлерін көрсету және олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсау қағидаларын бекіту туралы
