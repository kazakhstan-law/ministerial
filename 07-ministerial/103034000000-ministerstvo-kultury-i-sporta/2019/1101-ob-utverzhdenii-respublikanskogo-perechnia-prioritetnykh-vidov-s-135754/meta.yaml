title:
  rus: Об утверждении республиканского перечня приоритетных видов спорта и регионального перечня приоритетных видов спорта в разрезе регионов, а также порядка их финансирования за счет бюджетных средств
  kaz: Спорттың басым түрлерінің республикалық тізбесін және өңірлер бөлінісінде спорттың басым түрлерінің өңірлік тізбесін, сондай-ақ оларды бюджет қаражаты есебінен қаржыландыру тәртібін бекіту туралы
