act_code: '133034'
requisite: Приказ Министра культуры и спорта Республики Казахстан от 24 июня 2019 года № 181. Зарегистрирован в Министерстве юстиции Республики Казахстан 26 июня 2019 года № 18896
title:
  rus: Об утверждении перечня международных, республиканских конкурсов и фестивалей, победители которых допускаются к обучению в форме экстерната в организациях образования, реализующих образовательные программы технического и профессионального, послесреднего образования по специальностям культуры и искусства
  kaz: Мәдениет және өнер мамандықтары бойынша техникалық және кәсіптік, орта білімнен кейінгі білімнің білім беру бағдарламаларын іске асыратын білім беру ұйымдарында экстернат нысанында оқуға рұқсат етілетін халықаралық, республикалық конкурстар мен фестивальдардың тізбесін бекіту туралы
