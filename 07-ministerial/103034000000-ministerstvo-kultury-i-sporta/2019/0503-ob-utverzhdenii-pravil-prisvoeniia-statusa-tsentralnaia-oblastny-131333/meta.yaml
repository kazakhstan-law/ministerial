act_code: '131333'
requisite: Приказ Министра культуры и спорта Республики Казахстан от 3 мая 2019 года № 126. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 мая 2019 года № 18641
title:
  rus: Об утверждении Правил присвоения статуса «Центральная» областным, городов республиканского значения, столицы, городским и районным, городов областного значения библиотекам, ведущим формирование, хранение и предоставление пользователям библиотек универсальных собраний документов, осуществляющим организацию взаимоиспользования библиотечных ресурсов и оказывающим методическую помощь другим библиотекам, местными исполнительными органами соответствующей административно-территориальной единицы
  kaz: Тиісті әкімшілік-аумақтық бірліктің жергілікті атқарушы органдары құжаттардың әмбебап жинақтарын қалыптастыруды, сақтауды және кітапхана пайдаланушыларына беруді жүргізетін, кітапхана ресурстарын өзара пайдалануды ұйымдастыруды жүзеге асыратын және басқа кітапханаларға әдістемелік көмек көрсететін облыстық, республикалық маңызы бар қалалардың, астананың, қалалық және аудандық, облыстық маңызы бар қалалардың кітапханаларына «Орталық» мәртебесін беру қағидаларын бекіту туралы
