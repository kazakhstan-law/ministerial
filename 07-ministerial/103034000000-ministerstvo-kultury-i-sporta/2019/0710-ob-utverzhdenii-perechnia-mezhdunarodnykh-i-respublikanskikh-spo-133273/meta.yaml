act_code: '133273'
requisite: Приказ Министра культуры и спорта Республики Казахстан от 10 июля 2019 года № 194. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 июля 2019 года № 19022
title:
  rus: Об утверждении перечня международных и республиканских спортивных соревнований, победители которых допускаются к обучению в форме экстерната в организациях образования, реализующих образовательные программы технического и профессионального, послесреднего образования по специальностям физической культуры и спорта
  kaz: Жеңімпаздары дене шынықтыру және спорт мамандықтары бойынша техникалық және кәсіптік, орта білімнен кейінгі білімнің білім беру бағдарламаларын іске асыратын білім беру ұйымдарында экстернат нысанында оқуға рұқсат етілетін халықаралық және республикалық спорттық жарыстардың тізбесін бекіту туралы
