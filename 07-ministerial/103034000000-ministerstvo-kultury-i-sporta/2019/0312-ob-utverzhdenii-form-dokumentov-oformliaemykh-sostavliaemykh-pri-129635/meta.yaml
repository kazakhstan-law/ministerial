act_code: '129635'
requisite: Приказ Министра культуры и спорта Республики Казахстан от 12 марта 2019 года № 62. Зарегистрирован в Министерстве юстиции Республики Казахстан 15 марта 2019 года № 18392. Утратил силу приказом Министра культуры и информации Республики Казахстан от 22 ноября 2023 года № 458-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении форм документов, оформляемых (составляемых) при комплектовании, хранении, учете и использовании документов Национального архивного фонда и других архивных документов государственными и специальными государственными архивами
  kaz: «Ұлттық архив қорының құжаттарын және басқа да архивтік құжаттарды мемлекеттік және арнаулы мемлекеттік архивтердің жинақтау, сақтау, есепке алу мен пайдалану кезінде ресімделетін (жасалатын) құжаттар нысандарын бекіту туралы»
