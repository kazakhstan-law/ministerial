  title:
    rus: О внесении изменения в приказ Министра культуры и спорта Республики Казахстан от 13 августа 2019 года № 229 «О распределении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным, послесредним образованием в организациях образования в области культуры и спорта, финансируемых из республиканского бюджета на 2019-2020 учебный год»
    kaz: «Республикалық бюджеттен қаржыландырылатын мәдениет және спорт саласындағы білім беру ұйымдарында жоғары және жоғары оқу орнынан кейінгі білімі бар, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар мамандарды даярлауға 2019 – 2020 оқу жылына арналған мемлекеттік білім беру тапсырысын бөлу туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2019 жылғы 13 тамыздағы № 229 бұйрығына өзгеріс енгізу туралы
