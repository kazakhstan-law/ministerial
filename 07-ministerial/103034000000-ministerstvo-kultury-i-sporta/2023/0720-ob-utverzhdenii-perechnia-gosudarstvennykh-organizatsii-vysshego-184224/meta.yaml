  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра культуры и спорта Республики Казахстан от 20 июля 2023 года № 187 «Об утверждении перечня государственных организаций высшего и (или) послевузовского образования, первые руководители которых назначаются на должности и освобождаются от должностей Правительством Республики Казахстан»
    kaz: «Бірінші басшыларын Қазақстан Республикасының Үкіметі лауазымға тағайындайтын және лауазымынан босататын мемлекеттік жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарының тізбесін бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің міндетін атқарушының 2023 жылғы 20 шiлдедегi № 187 бұйрығына өзгерістер енгізу туралы
