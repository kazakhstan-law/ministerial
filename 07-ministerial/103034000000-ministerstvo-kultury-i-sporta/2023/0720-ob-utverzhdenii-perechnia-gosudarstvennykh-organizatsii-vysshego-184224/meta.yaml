title:
  rus: Об утверждении перечня государственных организаций высшего и (или) послевузовского образования, первые руководители которых назначаются на должности и освобождаются от должностей Правительством Республики Казахстан
  kaz: Бірінші басшыларын Қазақстан Республикасының Үкіметі лауазымға тағайындайтын және лауазымынан босататын мемлекеттік жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарының тізбесін бекіту туралы
