  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра культуры и спорта Республики Казахстан от 16 февраля 2023 года № 51 «Об утверждении Правил финансирования и нормативов финансирования проведения социально значимых мероприятий в области культуры и культурных мероприятий в Республике Казахстан и за рубежом, финансируемых за счет бюджетных средств»
    kaz: Бюджет қаражаты есебінен қаржыландырылатын Қазақстан Республикасындағы және шетелдегі мәдениет саласындағы әлеуметтік маңызы бар іс-шаралар мен мәдени іс-шараларды өткізуді қаржыландыру қағидалары мен қаржыландыру нормативтерін бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің міндетін атқарушының 2023 жылғы 16 ақпандағы № 51 бұйрығына өзгеріс енгізу туралы
