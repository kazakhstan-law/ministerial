  kaz: Бюджет қаражаты есебінен қаржыландырылатын Қазақстан Республикасындағы және шетелдегі мәдениет саласындағы әлеуметтік маңызы бар іс-шаралар мен мәдени іс-шараларды өткізуді қаржыландыру қағидалары мен қаржыландыру нормативтерін бекіту туралы
