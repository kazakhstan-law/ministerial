act_code: '183561'
requisite: Приказ Министра культуры и спорта Республики Казахстан от 27 июня 2023 года № 156. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июня 2023 года № 32990
title:
  rus: Об утверждении размеров денежных поощрений чемпионам и призерам международных спортивных соревнований, тренерам и членам национальных команд Республики Казахстан по видам спорта
  kaz: Халықаралық спорттық жарыстардың чемпиондары мен жүлдегерлеріне, спорт түрлері бойынша Қазақстан Республикасы ұлттық командаларының жаттықтырушылары мен мүшелеріне ақшалай көтермелеу мөлшерін бекіту туралы
