  requisite: Приказ и.о. Министра туризма и спорта Республики Казахстан от 20 июня 2025 года № 100
  title:
    rus: О внесении изменений в приказ Министра культуры и спорта Республики Казахстан от 27 июня 2023 года № 156 «Об утверждении размеров денежных поощрений чемпионам и призерам международных спортивных соревнований, тренерам и членам сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта)»
    kaz: «Халықаралық спорттық жарыстардың чемпиондары мен жүлдегерлеріне, жаттықтырушыларға және спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) мүшелеріне ақшалай көтермелеудің мөлшерін бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2023 жылғы 27 маусымдағы № 156 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/211501/rus
