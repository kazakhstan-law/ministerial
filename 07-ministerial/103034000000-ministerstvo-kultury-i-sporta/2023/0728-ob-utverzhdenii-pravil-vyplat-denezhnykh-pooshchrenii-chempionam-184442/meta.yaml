requisite: Приказ и.о. Министра культуры и спорта Республики Казахстан от 28 июля 2023 года № 204. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 июля 2023 года № 33186
title:
  rus: Об утверждении Правил выплат денежных поощрений чемпионам и призерам международных спортивных соревнований, тренерам и членам национальных команд Республики Казахстан по видам спорта и их возврата
  kaz: Халықаралық спорттық жарыстардың чемпиондары мен жүлдегерлеріне, жаттықтырушыларға және спорт түрлері бойынша Қазақстан Республикасы ұлттық командаларының мүшелеріне ақшалай көтермелеуді төлеу және оны қайтару қағидаларын бекіту туралы
