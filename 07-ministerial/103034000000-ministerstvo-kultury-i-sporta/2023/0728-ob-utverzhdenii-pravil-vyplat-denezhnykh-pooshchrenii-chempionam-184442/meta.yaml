  requisite: Приказ Министра туризма и спорта Республики Казахстан от 31 июля 2025 года № 149. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 августа 2025 года № 36548
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра культуры и спорта Республики Казахстан от 28 июля 2023 года № 204 «Об утверждении Правил выплат денежных поощрений чемпионам и призерам международных спортивных соревнований, тренерам и членам сборных команд Республики Казахстан по видам спорта (национальных сборных команд по видам спорта) и их возврата»
    kaz: «Халықаралық спорттық жарыстардың чемпиондары мен жүлдегерлеріне, жаттықтырушыларға және спорт түрлері бойынша Қазақстан Республикасы құрама командаларының (спорт түрлері бойынша ұлттық құрама командалардың) мүшелеріне ақшалай көтермелеуді төлеу және оны қайтару қағидаларын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің міндетін атқарушының 2023 жылғы 28 шiлдедегi № 204 бұйрығына өзгерістер енгізу туралы
