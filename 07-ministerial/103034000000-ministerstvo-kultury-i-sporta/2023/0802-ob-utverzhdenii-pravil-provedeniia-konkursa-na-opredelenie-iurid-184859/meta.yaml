  title:
    rus: О внесении изменений в приказ Министра культуры и спорта Республики Казахстан от 2 августа 2023 года № 213 «Об утверждении Правил проведения конкурса на определение юридического лица, осуществляющего функции администратора системы гарантирования прав граждан Республики Казахстан в сфере выездного туризма»
    kaz: «Қазақстан Республикасы азаматтарының шығу туризмі саласындағы құқықтарына кепілдік беру жүйесі әкімшісінің функцияларын жүзеге асыратын заңды тұлғаны айқындауға арналған конкурсты өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2023 жылғы 2 тамыздағы № 213 бұйрығына өзгерістер енгізу туралы
