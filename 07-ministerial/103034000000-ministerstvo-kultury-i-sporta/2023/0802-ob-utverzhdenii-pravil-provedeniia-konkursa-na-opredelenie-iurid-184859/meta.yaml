title:
  rus: Об утверждении Правил проведения конкурса на определение юридического лица, осуществляющего функции администратора системы гарантирования прав граждан Республики Казахстан в сфере выездного туризма
  kaz: Қазақстан Республикасы азаматтарының шығу туризмі саласындағы құқықтарына кепілдік беру жүйесі әкімшісінің функцияларын жүзеге асыратын заңды тұлғаны айқындауға арналған конкурсты өткізу қағидаларын бекіту туралы
