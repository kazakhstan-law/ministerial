act_code: '178391'
requisite: Приказ и.о. Министра культуры и спорта Республики Казахстан от 27 января 2023 года № 25. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 января 2023 года № 31792. Утратил силу приказом Министра туризма и спорта Республики Казахстан от 20 сентября 2024 года № 160 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил приема, учета и хранения информации о принятых ставках на пари (в том числе электронных) по каждому участнику пари, коэффициентах на варианты исхода пари, выигрышах и выплатах по ним, а также передачи ее иным лицам
  kaz: Бәс тігудің әрбір қатысушысы бойынша бәс тігуге қабылданған мөлшерлемелер (оның ішінде электрондық), бәс тігу нәтижесінің нұсқаларына коэффициенттер, олар бойынша ұтыстар мен төлемдер туралы ақпаратты қабылдау, есепке алу және сақтау, сондай-ақ оны өзге тұлғаларға беру қағидаларын бекіту туралы
