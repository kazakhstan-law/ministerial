  title:
    rus: О внесении изменений в приказ Министра культуры и спорта Республики Казахстан от 21 августа 2020 года № 234 «О распределении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным, послесредним образованием в организациях образования в области культуры, спорта и туризма, финансируемых из республиканского бюджета на 2020-2021 учебный год»
    kaz: «Республикалық бюджеттен қаржыландырылатын мәдениет, спорт және туризм саласындағы білім беру ұйымдарында жоғары және жоғары оқу орнынан кейінгі білімі бар, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар мамандарды даярлауға 2020 – 2021 оқу жылына арналған мемлекеттік білім беру тапсырысын бөлу туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2020 жылғы 21 тамыздағы № 234 бұйрығына өзгерістер енгізу туралы
