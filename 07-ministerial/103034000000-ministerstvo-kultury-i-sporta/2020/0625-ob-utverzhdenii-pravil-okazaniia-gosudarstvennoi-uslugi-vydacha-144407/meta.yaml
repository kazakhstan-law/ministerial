title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача лицензии на деятельность по осуществлению научно-реставрационных работ на памятниках истории и культуры и (или) археологических работ»
  kaz: «Тарих және мәдениет ескерткіштеріндегі ғылыми-реставрациялық жұмыстарды және (немесе) археологиялық жұмыстарды жүзеге асыру жөніндегі қызметке лицензия беру» мемлекеттік қызметін көрсету қағидаларын бекіту туралы
