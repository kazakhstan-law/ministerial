requisite: Приказ Министра культуры и спорта Республики Казахстан от 15 сентября 2020 года № 254. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 сентября 2020 года № 21214. Утратил силу приказом Министра культуры и информации Республики Казахстан от 4 июля 2025 года № 307-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении цен на товары (работы, услуги), производимые и реализуемые республиканскими государственными казенными предприятиями Министерства культуры и спорта Республики Казахстан
  kaz: Қазақстан Республикасы Мәдениет және спорт министрлігінің республикалық мемлекеттік қазыналық кәсіпорындары өндіретін және сататын тауарларға (жұмыстарға, көрсетілетін қызметтерге) бағаларды белгілеу туралы
