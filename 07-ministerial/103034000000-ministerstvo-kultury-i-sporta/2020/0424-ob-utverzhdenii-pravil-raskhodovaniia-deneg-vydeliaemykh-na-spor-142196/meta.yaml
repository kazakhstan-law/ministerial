  title:
    rus: О внесении изменений в приказ Министра культуры и спорта Республики Казахстан от 24 апреля 2020 года № 100 «Об утверждении Правил расходования денежных средств, выделяемых на спортивные мероприятия, в том числе на учебно-тренировочные сборы для физкультурно-спортивных организаций, финансируемых из республиканского и местного бюджетов»
    kaz: «Республикалық және жергілікті бюджеттерден қаржыландырылатын спорттық іс-шараларға, оның ішінде дене шынықтыру-спорт ұйымдары үшін оқу-жаттығу жиындарына бөлінетін ақша қаражатын жұмсау қағидаларын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2020 жылғы 24 сәуірдегі № 100 бұйрығына өзгерістер енгізу туралы»
