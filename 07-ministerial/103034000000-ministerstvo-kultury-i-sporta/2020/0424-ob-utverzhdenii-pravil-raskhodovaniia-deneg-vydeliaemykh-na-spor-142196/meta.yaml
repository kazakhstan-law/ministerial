title:
  rus: Об утверждении Правил расходования денег, выделяемых на спортивные мероприятия, в том числе на учебно-тренировочные сборы для физкультурно-спортивных организаций, финансируемых из республиканского и местного бюджетов
  kaz: Республикалық және жергілікті бюджеттерден қаржыландырылатын спорттық іс-шараларға, оның ішінде дене шынықтыру-спорт ұйымдары үшін оқу-жаттығу жиындарына бөлінетін ақша жұмсау қағидаларын бекіту туралы
