  title:
    rus: О внесении изменения в приказ Министра культуры и спорта Республики Казахстан от 19 мая 2020 года № 132 «Об утверждении квалификационных требований и условий, предъявляемых при лицензировании деятельности по осуществлению научно-реставрационных работ на памятниках истории и культуры и (или) археологических работ и перечня документов, подтверждающих соответствие им»
    kaz: «Тарих және мәдениет ескерткіштеріндегі ғылыми-реставрациялық жұмыстарды және (немесе) археологиялық жұмыстарды жүзеге асыру жөніндегі қызметті лицензиялау кезінде қойылатын біліктілік талаптары мен шарттарын және оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2020 жылғы 19 мамырдағы № 132 бұйрығына өзгеріс енгізу туралы
