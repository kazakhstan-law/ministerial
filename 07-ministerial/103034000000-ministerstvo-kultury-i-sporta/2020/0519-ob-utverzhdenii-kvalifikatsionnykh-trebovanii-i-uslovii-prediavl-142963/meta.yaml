title:
  rus: Об утверждении квалификационных требований и условий, предъявляемых при лицензировании деятельности по осуществлению научно-реставрационных работ на памятниках истории и культуры, деятельности по осуществлению археологических работ и перечня документов, подтверждающих соответствие им
  kaz: Тарих және мәдениет ескерткіштеріндегі ғылыми-реставрациялық жұмыстарды жүзеге асыру жөніндегі қызметті, археологиялық жұмыстарды жүзеге асыру жөніндегі қызметті лицензиялау кезінде қойылатын біліктілік талаптары мен шарттарын және оларға сәйкестікті растайтын құжаттар тізбесін бекіту туралы
