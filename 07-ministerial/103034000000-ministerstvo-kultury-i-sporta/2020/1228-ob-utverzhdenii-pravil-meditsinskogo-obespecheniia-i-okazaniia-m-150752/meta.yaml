title:
  rus: Об утверждении правил медицинского обеспечения и оказания медицинской помощи спортсменам и тренерам при проведении спортивных мероприятий, в период восстановительных мероприятий после интенсивных физических нагрузок, заболеваний и травм у спортсменов
  kaz: Cпорттық іс-шараларды өткізу кезінде, спортшылардың денеге аса күш түсіруінен, ауруларынан және жарақаттануларынан кейін қалпына келтіру іс-шаралары кезеңінде спортшылар мен жаттықтырушыларды медициналық қамтамасыз ету және оларға медициналық көмек көрсету қағидаларын бекіту туралы
