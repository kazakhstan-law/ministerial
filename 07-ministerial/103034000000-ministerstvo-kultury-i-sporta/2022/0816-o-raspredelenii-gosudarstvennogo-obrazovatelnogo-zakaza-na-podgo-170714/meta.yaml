  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра культуры и спорта Республики Казахстан от 16 августа 2022 года № 240 «О распределении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным, послесредним образованием в организациях образования в области культуры, спорта и туризма, финансируемых из республиканского бюджета на 2022-2023 учебный год»
    kaz: «Республикалық бюджеттен қаржыландырылатын мәдениет, спорт және туризм саласындағы білім беру ұйымдарында жоғары және жоғары оқу орнынан кейінгі білімі бар, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар мамандарды даярлауға 2022 – 2023 оқу жылына арналған мемлекеттік білім беру тапсырысын бөлу туралы» Қазақстан Республикасы Мәдениет және спорт министрі міндетін атқарушының 2022 жылғы 16 тамыздағы № 240 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/172510/rus
