act_code: '170714'
requisite: Приказ и.о. Министра культуры и спорта Республики Казахстан от 16 августа 2022 года № 240. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 августа 2022 года № 29154
title:
  rus: О распределении государственного образовательного заказа на подготовку кадров с высшим и послевузовским образованием, а также техническим и профессиональным, послесредним образованием в организациях образования в области культуры, спорта и туризма, финансируемых из республиканского бюджета на 2022-2023 учебный год
  kaz: Республикалық бюджеттен қаржыландырылатын мәдениет, спорт және туризм салаларындағы білім беру ұйымдарында жоғары және жоғары оқу орнынан кейінгі, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар кадрларды даярлауға 2022 – 2023 оқу жылына арналған мемлекеттік білім беру тапсырысын бөлу туралы
