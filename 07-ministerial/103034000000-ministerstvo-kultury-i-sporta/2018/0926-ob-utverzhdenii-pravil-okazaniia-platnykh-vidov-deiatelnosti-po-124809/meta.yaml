requisite: Приказ Министра культуры и спорта Республики Казахстан от 26 сентября 2018 года № 275. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 сентября 2018 года № 17446. Утратил силу приказом Министра культуры и информации Республики Казахстан от 10 июля 2025 года № 313-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) государственными архивами, деньги от реализации которых остаются в их распоряжении и расходования ими денег от реализации товаров (работ, услуг)
  kaz: Тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түсетін ақша өз иелігінде қалатын мемлекеттік архивтердің оларды өткізу бойынша ақылы қызмет түрлерін көрсетуі және олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсауы қағидаларын бекіту туралы
