  title:
    rus: О внесении изменения в приказ Министра культуры и спорта Республики Казахстан от 26 сентября 2018 года № 275 «Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) государственными архивами, деньги от реализации которых остаются в их распоряжении и расходования ими денег от реализации товаров (работ, услуг)»
    kaz: «Тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түсетін ақша өз иелігінде қалатын мемлекеттік архивтердің оларды өткізу бойынша ақылы қызмет түрлерін көрсетуі және олардың тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсауы қағидаларын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2018 жылғы 26 қыркүйектегі № 275 бұйрығына өзгеріс енгізу туралы
