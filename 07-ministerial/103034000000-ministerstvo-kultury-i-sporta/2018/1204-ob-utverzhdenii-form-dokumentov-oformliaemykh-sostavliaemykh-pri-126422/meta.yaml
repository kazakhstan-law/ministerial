requisite: Приказ Министра культуры и спорта Республики Казахстан от 4 декабря 2018 года № 343. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 декабря 2018 года № 17862. Утратил силу приказом Министра культуры и информации Республики Казахстан от 22 ноября 2023 года № 458-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении форм документов, оформляемых (составляемых) при приеме, хранении, учете и использовании документов Национального архивного фонда и других архивных документов ведомственными и частными архивами
  kaz: Ұлттық архив қорының құжаттарын және басқа да архивтік құжаттарды ведомстволық және жеке архивтердің қабылдау, сақтау, есепке алу мен пайдалану кезінде ресімделетін (жасалатын) құжаттар нысандарын бекіту туралы
