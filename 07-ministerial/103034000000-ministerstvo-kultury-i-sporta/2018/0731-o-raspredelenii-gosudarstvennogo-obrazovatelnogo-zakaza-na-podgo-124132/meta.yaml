act_code: '124132'
requisite: Приказ и.о. Министра культуры и спорта Республики Казахстан от 31 июля 2018 года № 182. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 августа 2018 года № 17288
title:
  rus: О распределении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным, послесредним образованием в организациях образования в области культуры и спорта, финансируемых из республиканского бюджета на 2018-2019 учебный год
  kaz: Республикалық бюджеттен қаржыландырылатын мәдениет және спорт саласындағы білім беру ұйымдарында жоғары және жоғары оқу орнынан кейінгі білімі бар, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар мамандарды даярлауға 2018 – 2019 оқу жылына арналған мемлекеттік білім беру тапсырысын бөлу туралы
