  title:
    rus: О внесении изменений в приказ Министра культуры и спорта Республики Казахстан от 22 декабря 2016 года № 342 «Об утверждении Правил и условий исчисления стажа работы по специальности для гражданских служащих государственных организаций Министерства культуры и спорта Республики Казахстан и его ведомств, содержащихся за счет средств государственного бюджета»
    kaz: «Қазақстан Республикасы Мәдениет және спорт министрлігінің мемлекеттік бюджет қаражаты есебінен ұсталатын мемлекеттік ұйымдарының және оның ведомстволарының қызметкерлері, азаматтық қызметшілері үшін мамандығы бойынша жұмыс өтілін есептеу қағидалары мен шарттарын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2016 жылғы 22 желтоқсандағы № 342 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/115433/rus
