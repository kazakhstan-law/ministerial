  title:
    rus: О внесении изменений в приказ Министра культуры и спорта Республики Казахстан от 22 декабря 2016 года № 342 «Об утверждении Правил и условий исчисления стажа работы по специальности для гражданских служащих, работников организаций, содержащихся за счет средств государственного бюджета в сферах культуры, развития языков, архивного дела, физической культуры и спорта»
    kaz: «Мәдениет, тілдерді дамыту, архив ісі, дене шынықтыру және спорт салаларындағы мемлекеттік бюджет қаражаты есебінен ұсталатын азаматтық қызметшілері, ұйымдардың жұмыскерлері үшін мамандығы бойынша жұмыс өтілін есептеу қағидалары мен шарттарын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2016 жылғы 22 желтоқсандағы № 342 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/127294/rus
