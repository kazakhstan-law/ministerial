requisite: Приказ Министра культуры и спорта Республики Казахстан от 22 декабря 2016 года № 342. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 января 2017 года № 14723
title:
  rus: Об утверждении Правил и условий исчисления стажа работы по специальности для гражданских служащих, работников организаций, содержащихся за счет средств государственного бюджета в сферах культуры, развития языков, архивного дела и документационного обеспечения управления, физической культуры и спорта
  kaz: Мәдениет, тілдерді дамыту, архив ісі және басқаруды құжаттамалық қамтамасыз ету, дене шынықтыру және спорт салаларындағы мемлекеттік бюджет қаражаты есебінен ұсталатын ұйымдардың жұмыскерлері, азаматтық қызметшілері үшін мамандығы бойынша жұмыс өтілін есептеу қағидалары мен шарттарын бекіту туралы
