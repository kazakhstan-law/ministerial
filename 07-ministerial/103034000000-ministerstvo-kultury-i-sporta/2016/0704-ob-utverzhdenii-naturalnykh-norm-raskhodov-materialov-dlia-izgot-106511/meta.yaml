requisite: Приказ Министра культуры и спорта Республики Казахстан от 4 июля 2016 года № 202. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 сентября 2016 года № 14264. Утратил силу приказом и.о. Министра культуры и информации Республики Казахстан от 30 июня 2025 года № 296-НҚ (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм расходов материалов для изготовления микрофильмов и фотокопий документов, реставрации документов, картонажных работ, выполняемых государственными архивными учреждениями Республики Казахстан
  kaz: Қазақстан Республикасының мемлекеттік архив мекемелерімен орындалатын микрофильмдерді және құжаттардың фотокөшірмелерін дайындауға, құжаттарды реставрациялауға, қатырма қағазбен жұмыстарға арналған материалдардың заттай шығыс нормаларын бекіту туралы
