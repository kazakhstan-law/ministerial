act_code: '104761'
requisite: Приказ Министра культуры и спорта Республики Казахстан от 19 июля 2016 года № 210. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 июля 2016 года № 13972
title:
  rus: О распределении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным, послесредним образованием в организациях образования сферы культуры, искусства и спорта, финансируемых из республиканского бюджета, на 2016-2017 учебный год
  kaz: Республикалық бюджеттен қаржыландырылатын жоғары және жоғары оқу орнынан кейінгі, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар мамандар даярлауға 2016-2017 оқу жылына арналған мемлекеттік білім беру тапсырысын мәдениет, өнер және спорт саласындағы білім беру ұйымдарында бөлу туралы
