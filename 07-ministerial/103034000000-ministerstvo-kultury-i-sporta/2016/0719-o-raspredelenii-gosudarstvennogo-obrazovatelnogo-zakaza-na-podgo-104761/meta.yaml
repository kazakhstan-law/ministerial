  title:
    rus: О внесении изменений в приказ Министра культуры и спорта Республики Казахстан от 19 июля 2016 года № 210 "О распределении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным, послесредним образованием в организациях образования сферы культуры и искусства, финансируемых из республиканского бюджета на, 2016-2017 учебный год"
    kaz: '"Республикалық бюджеттен қаржыландырылатын жоғары және жоғары оқу орнынан кейінгі, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар мамандар даярлауға 2016 – 2017 оқу жылына арналған мемлекеттік білім беру тапсырысын мәдениет және өнер саласындағы білім беру ұйымдарында бөлу туралы" Қазақстан Республикасы Мәдениет және спорт министрінің 2016 жылғы 19 шілдедегі № 210 бұйрығына өзгерістер енгізу туралы'
