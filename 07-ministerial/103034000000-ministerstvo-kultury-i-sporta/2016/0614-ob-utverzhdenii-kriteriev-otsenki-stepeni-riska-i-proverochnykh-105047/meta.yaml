  title:
    rus: О внесении изменений и дополнения в совместный приказ Министра культуры и спорта Республики Казахстан от 14 июня 2016 года № 162 и Министра национальной экономики Республики Казахстан от 23 июня 2016 года № 277 «Об утверждении критериев оценки степени риска и проверочного листа за охраной и использованием объектов историко-культурного наследия»
    kaz: «Тарихи-мәдени мұра объектілерінің қорғалуы мен пайдаланылуына тәуекел дәрежесін бағалау өлшемшарттарын және тексеру парағын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2016 жылғы 14 маусымдағы № 162 және Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 23 маусымдағы № 277 бірлескен бұйрығына өзгерістер мен толықтыру енгізу туралы
