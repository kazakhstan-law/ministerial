  title:
    rus: О внесении изменений в приказ Министра культуры и спорта Республики Казахстан от 30 мая 2017 года № 155 «Об утверждении типовых штатов для организаций, в которых осуществляются учебно-тренировочный процесс, подготовка спортивного резерва и спортсменов высокого класса, антидопинговая деятельность, научно-методическое, медико-биологическое и фармакологическое обеспечение, и организаций, обеспечивающих спортсменов медицинской помощью»
    kaz: «Оқу-жаттығу процесі, спорттық резервті және жоғары дәрежедегі спортшыларды даярлау, допингке қарсы қызмет, ғылыми-әдістемелік, медициналық-биологиялық және фармакологиялық қамтамасыз ету жүзеге асырылатын ұйымдар және спортшыларды медициналық көмекпен қамтамасыз ететін ұйымдар үшін үлгілік штаттарды бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2017 жылғы 30 мамырдағы № 155 бұйрығына өзгерістер енгізу туралы
