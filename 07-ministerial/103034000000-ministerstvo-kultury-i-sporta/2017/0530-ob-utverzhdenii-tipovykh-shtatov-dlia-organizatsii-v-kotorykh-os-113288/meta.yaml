  title:
    rus: О внесении изменений и дополнений в приказ Министра культуры и спорта Республики Казахстан от 30 мая 2017 года № 155 «Об утверждении Типовых штатов для физкультурно-спортивных организаций, в которых осуществляется учебно-тренировочный процесс, подготовка спортивного резерва и спортсменов высокого класса»
    kaz: «Оқу-жаттығу процесі, спорт резервін және жоғары дәрежедегі споршыларды даярлау жүзеге асырылатын дене шынықтыру-спорт ұйымдары үшін үлгілік штаттарды бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2017 жылғы 30 мамырдағы № 155 бұйрығына өзгерістер мен толықтырулар енгізу туралы
