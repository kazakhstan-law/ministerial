act_code: '113288'
requisite: Приказ Министра культуры и спорта Республики Казахстан от 30 мая 2017 года № 155. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 июля 2017 года № 15301
title:
  rus: Об утверждении типовых штатов для организаций, в которых осуществляются учебно-тренировочный процесс, подготовка спортивного резерва и спортсменов высокого класса, антидопинговая деятельность, научно-методическое, медико-биологическое и фармакологическое обеспечение, и организаций, обеспечивающих спортсменов медицинской помощью
  kaz: Оқу-жаттығу процесі, спорттық резервті және жоғары дәрежедегі споршыларды даярлау, допингке қарсы қызмет, ғылыми-әдістемелік, медициналық-биологиялық және фармакологиялық қамтамасыз ету жүзеге асырылатын ұйымдар және спортшыларды медициналық көмекпен қамтамасыз ететін ұйымдар үшін үлгілік штаттарды бекіту туралы
