title:
  rus: Об утверждении правил приобретения на определенный срок имущественных прав на общественно значимую литературу и (или) ее издания для распространения в государственные библиотеки и иные государственные организации, и установлении критериев ее отбора
  kaz: Мемлекеттік кітапханаларға және өзге де мемлекеттік ұйымдарға тарату үшін қоғамдық маңызы бар әдебиетке мүліктік құқықтарды белгілі бір мерзімге сатып алу және (немесе) оны басып шығару жөніндегі қағидаларын бекіту және оны іріктеу өлшемшарттарын белгілеу туралы
