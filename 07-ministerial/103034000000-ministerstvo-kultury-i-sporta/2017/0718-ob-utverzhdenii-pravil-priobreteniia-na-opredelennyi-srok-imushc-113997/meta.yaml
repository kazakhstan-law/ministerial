    kaz: «Қоғамдық маңызы бар әдебиетті сатып алу, басып шығару және тарату қағидаларын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2017 жылғы 18 шілдедегі № 210 бұйрығына өзгерістер мен толықтырулар енгізу тралы
