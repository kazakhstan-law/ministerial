  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра культуры и спорта Республики Казахстан от 29 сентября 2017 года № 263 «Об утверждении Перечня типовых документов, образующихся в деятельности государственных и негосударственных организаций, с указанием срока хранения»
