act_code: '114172'
requisite: Приказ Министра культуры и спорта Республики Казахстан от 1 августа 2017 года № 221. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 августа 2017 года № 15507
title:
  rus: О распределении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным, послесредним образованием в организациях образования в области культуры и спорта, финансируемых из республиканского бюджета на 2017-2018 учебный год
  kaz: Республикалық бюджеттен қаржыландырылатын мәдениет және спорт саласындағы білім беру ұйымдарында жоғары және жоғары оқу орнынан кейінгі білімі бар, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар мамандарды даярлауға мемлекеттік білім беру тапсырысын бөлу туралы
