    kaz: «Қазақстан Республикасы Тұңғыш Президентінің–Елбасының тестілерін өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің міндетін атқарушының 2014 жылғы 21 қарашадағы № 103 бұйрығына өзгерістер мен толықтыру енгізу туралы
