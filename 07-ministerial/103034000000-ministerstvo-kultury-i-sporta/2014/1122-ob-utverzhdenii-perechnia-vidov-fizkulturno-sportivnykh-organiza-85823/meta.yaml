title:
  rus: Об утверждении перечня видов физкультурно-спортивных организаций и правил их деятельности, в которых осуществляется учебно-тренировочный процесс по подготовке спортивного резерва и спортсменов высокого класса
  kaz: Спорт резерві мен жоғары дәрежелі спортшыларды даярлау жөніндегі оқу-жаттығу процесі жүзеге асырылатын дене шынықтыру-спорт ұйымдары түрлерінің тізбесін және олардың қызметі қағидаларын бекіту туралы
