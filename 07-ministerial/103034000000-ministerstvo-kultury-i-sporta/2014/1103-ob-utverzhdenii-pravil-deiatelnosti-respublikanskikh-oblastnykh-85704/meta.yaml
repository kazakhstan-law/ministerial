title:
  rus: Об утверждении Правил деятельности республиканских, областных, городов республиканского значения, столицы специализированных школ-интернатов-колледжей олимпийского резерва и областных, городов республиканского значения, столицы школ-интернатов для одаренных в спорте детей
  kaz: Олимпиадалық резервтің республикалық, облыстық, республикалық маңызы бар қалалардың, астананың мамандандырылған мектеп-интернат-колледждері және спорттағы дарынды балаларға арналған облыстық, республикалық маңызы бар қалалардың, астананың мектеп-интернаттары қызметінің қағидаларын бекіту туралы
