  title:
    rus: О внесении изменений в приказ Министра культуры и спорта Республики Казахстан от 3 ноября 2014 года № 69 «Об утверждении Правил деятельности республиканских специализированных школ-интернатов-колледжей олимпийского резерва и областных школ-интернатов для одаренных в спорте детей»
    kaz: «Олимпиадалық резервтің республикалық мамандандырылған мектеп-интернаттар-колледждері және спорттағы дарынды балаларға арналған облыстық мектеп-интернаттар қызметінің қағидаларын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2014 жылғы 3 қарашадағы № 69 бұйрығына өзгерістер енгізу туралы
