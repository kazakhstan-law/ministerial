  title:
    rus: О внесении дополнений в приказ Министра культуры и спорта Республики Казахстан от 22 ноября 2014 года № 107 "Об утверждении Методики нормативов питания и фармакологического обеспечения спортсменов, в том числе военнослужащих всех категорий и сотрудников правоохранительных и специальных государственных органов, в период учебно-тренировочного процесса и спортивных мероприятий"
    kaz: '"Оқу-жаттығу процесі мен спорттық іс-шаралар кезеңінде спортшыларды, оның ішінде барлық санаттағы әскери қызметшілерді және құқық қорғау және арнаулы мемлекеттік органдардың қызметкерлерін тамақтандыру және фармакологиялық қамтамасыз ету нормативтерінің әдістемесін бекіту туралы" Қазақстан Республикасы Мәдениет және спорт Министрінің 2014 жылғы 22 қарашадағы № 107 бұйрығына толықтырулар енгізу туралы'
