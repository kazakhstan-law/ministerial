  title:
    rus: О внесении изменений в приказ Министра культуры и спорта Республики Казахстан от 20 октября 2014 года № 42 «Об утверждении возраста спортсменов по видам спорта в физкультурно-спортивных организациях, в которых осуществляется учебно-тренировочный процесс по подготовке спортивного резерва и спортсменов высокого класса»
    kaz: «Спорт резерві және жоғары дәрежедегі спортшыларды даярлау бойынша оқу-жаттығу процесін жүзеге асыратын дене шынықтыру-спорт ұйымдарында спорт түрлері бойынша спортшылардың жас шамасын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2014 жылғы 20 қазандағы № 42 бұйрығына өзгерістер енгізу туралы
