caused_by:
  code: '225034'
  requisite: Приказ и.о. Министра туризма и спорта Республики Казахстан от 30 апреля 2026 года № 78. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 мая 2026 года № 38676
  title:
    rus: О внесении изменений и дополнений в приказ Министра культуры и спорта Республики Казахстан от 20 октября 2014 года № 42 «Об утверждении возраста спортсменов по видам спорта для зачисления в физкультурно-спортивные организации, в которых осуществляется учебно-тренировочный процесс по подготовке спортивного резерва и спортсменов высокого класса, а также минимального возраста для участия в спортивных соревнованиях по видам спорта»
    kaz: «Спорт резервін және жоғары дәрежелі спортшыларды даярлау жөніндегі оқу-жаттығу процесі жүзеге асырылатын дене шынықтыру-спорт ұйымдарына қабылдау үшін спорт түрлері бойынша спортшылардың жасын, сондай-ақ денсаулық сақтау саласындағы уәкілетті органмен келісім бойынша спорт түрлері бойынша спорттық жарыстарға қатысу үшін ең төменгі жасын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2014 жылғы 20 қазандағы № 42 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/225034/rus
