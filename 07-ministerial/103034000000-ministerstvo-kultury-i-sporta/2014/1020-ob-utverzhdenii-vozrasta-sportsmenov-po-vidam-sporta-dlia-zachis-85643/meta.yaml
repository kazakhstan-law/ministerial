  title:
    rus: О внесении изменений и дополнения в приказ Министра культуры и спорта Республики Казахстан от 20 октября 2014 года № 42 «Об утверждении возраста спортсменов по видам спорта в физкультурно-спортивных организациях, в которых осуществляется учебно-тренировочный процесс по подготовке спортивного резерва и спортсменов высокого класса»
    kaz: «Спорт резервін және жоғары сыныпты спортшыларды даярлау жөніндегі оқу-жаттығу процесі жүзеге асырылатын дене шынықтыру-спорт ұйымдарындағы спорт түрлері бойынша спортшылардың жас мөлшерін бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2014 жылғы 20 қазандағы № 42 бұйрығына өзгерістер мен толықтыру енгізу туралы
