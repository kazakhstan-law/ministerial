act_code: '85643'
requisite: Приказ Министра культуры и спорта Республики Казахстан от 20 октября 2014 года № 42. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 ноября 2014 года № 9881
title:
  rus: Об утверждении возраста спортсменов по видам спорта для зачисления в физкультурно-спортивные организации, в которых осуществляется учебно-тренировочный процесс по подготовке спортивного резерва и спортсменов высокого класса, а также минимального возраста для участия в спортивных соревнованиях по видам спорта
  kaz: Спорт резерві және жоғары дәрежедегі спортшыларды даярлау бойынша оқу-жаттығу процесін жүзеге асыратын дене шынықтыру-спорт ұйымдарына қабылдау үшін спорттың түрлері бойынша спортшылардың жас шамасын, сондай-ақ спорт түрлері бойынша спорттық жарыстарға қатысу үшін ең төменгі жас шамасын бекіту туралы
