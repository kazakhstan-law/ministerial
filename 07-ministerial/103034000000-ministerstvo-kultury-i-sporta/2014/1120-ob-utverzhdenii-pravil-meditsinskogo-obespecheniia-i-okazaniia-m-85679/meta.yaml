requisite: Приказ Министра культуры и спорта Республики Казахстан от 20 ноября 2014 года № 101. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 декабря 2014 года № 10014. Утратил силу приказом Министра культуры и спорта Республики Казахстан от 28 декабря 2020 года № 361 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил медицинского обеспечения и оказания медицинской помощи спортсменам и тренерам при проведении спортивных мероприятий, в период восстановительных мероприятий после интенсивных физических нагрузок, заболеваний и травм у спортсменов
  kaz: Cпорттық іс-шараларды өткізу кезінде, спортшылардың қарқынды дене жүктемелерінен, ауыруларынан және жарақаттануларынан кейін қалпына келтіру іс-шаралары кезеңінде спортшылар мен жаттықтырушыларды медициналық қамтамасыз ету және оларға медициналық көмек көрсету қағидаларын бекіту туралы
