act_code: '91317'
requisite: Приказ и.о. Министра культуры и спорта Республики Казахстан от 21 ноября 2014 года № 105. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 июля 2015 года № 11790. Утратил силу приказом и.о. Министра культуры и спорта Республики Казахстан от 16 августа 2022 года № 238 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм обеспечения спортсменов, тренеров и специалистов в области физической культуры и спорта, военнослужащих и сотрудников правоохранительных органов в период подготовки и участия в спортивных мероприятиях, проводимых на территории Республики Казахстан и за ее пределами
  kaz: Қазақстан Республикасының аумағында және оның шегінен тыс жерде өткізілетін спорттық іс-шараларға дайындалу және қатысу кезеңінде спортшыларды, жаттықтырушыларды және дене шынықтыру және спорт саласындағы мамандарды, әскери қызметшілер мен құқық қорғау органдарының қызметкерлерін қамтамасыз етудің заттай нормаларын бекіту туралы
