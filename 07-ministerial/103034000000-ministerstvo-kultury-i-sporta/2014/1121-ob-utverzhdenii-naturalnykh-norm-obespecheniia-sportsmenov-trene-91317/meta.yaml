  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра культуры и спорта Республики Казахстан от 21 ноября 2014 года № 105 «Об утверждении натуральных норм обеспечения спортсменов, тренеров и специалистов в области физической культуры и спорта, военнослужащих всех категорий и сотрудников правоохранительных и специальных государственных органов в период подготовки и участия в спортивных мероприятиях, проводимых на территории Республики Казахстан и за ее пределами
    kaz: «Қазақстан Республикасының аумағында және одан тыс жерлерде өткізілетін спорттық іс-шараларға даярлық және оған қатысу кезеңінде спортшыларды, жаттықтырушыларды және дене шынықтыру мен спорт саласындағы мамандарды, барлық санаттағы әскери қызметшілер мен құқық қорғау және арнаулы мемлекеттік органдардың қызметкерлерін қамтамасыз етудің заттай нормаларын бекiту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің міндетін атқарушысының 2014 жылғы 21 қарашадағы № 105 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/114416/rus
