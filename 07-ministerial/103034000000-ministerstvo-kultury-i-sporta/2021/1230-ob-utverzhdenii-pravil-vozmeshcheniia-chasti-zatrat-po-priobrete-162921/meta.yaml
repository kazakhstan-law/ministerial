title:
  rus: Об утверждении Правил возмещения части затрат по приобретению автомобильных транспортных средств вместимостью более восьми мест для сидения, исключая место водителя, субъектам предпринимательства, осуществляющим туристскую деятельность
  kaz: Туристік қызметті жүзеге асыратын кәсіпкерлік субъектілеріне сыйымдылығы жүргiзушiнiң орнын қоспағанда, сегiзден астам отыратын орны бар автомобиль көлік құралдарын сатып алу бойынша шығындардың бір бөлігін өтеу қағидаларын бекіту туралы
