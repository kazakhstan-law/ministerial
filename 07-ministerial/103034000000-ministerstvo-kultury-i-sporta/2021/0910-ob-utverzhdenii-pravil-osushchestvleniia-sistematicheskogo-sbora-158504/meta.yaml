  title:
    rus: О внесении изменений в приказ Министра культуры и спорта Республики Казахстан от 10 сентября 2021 года № 282 «Об утверждении Правил осуществления систематического сбора информации и анализа содержания интернет-ресурсов на предмет наличия признаков интернет-казино»
    kaz: «Ақпаратты жүйелі түрде жинауды және интернет-ресурстардың мазмұнын интернет-казино белгілерінің болуы-болмауы тұрғысынан талдауды жүзеге асыру қағидаларын бекіту туралы» Қазақстан Республикасы Мәдениет және спорт министрінің 2021 жылғы 10 қыркүйектегі № 282 бұйрығына өзгерістер енгізу туралы
