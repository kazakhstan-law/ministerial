act_code: '158504'
requisite: Приказ Министра культуры и спорта Республики Казахстан от 10 сентября 2021 года № 282. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 сентября 2021 года № 24320
title:
  rus: Об утверждении Правил осуществления систематического сбора информации и анализа содержания интернет-ресурсов на предмет наличия признаков интернет-казино, иностранных букмекерских контор и (или) тотализаторов, не имеющих лицензий на право занятия деятельностью в сфере игорного бизнеса в Республике Казахстан
  kaz: Ақпаратты жүйелі түрде жинауды және интернет-ресурстардың мазмұнын интернет-казино, Қазақстан Республикасында ойын бизнесі саласындағы қызметпен айналысу құқығына лицензиялары жоқ шетелдік букмекерлік кеңселер және (немесе) тотализаторлар белгілерінің болуы-болмауы тұрғысынан талдауды жүзеге асыру қағидаларын бекіту туралы
