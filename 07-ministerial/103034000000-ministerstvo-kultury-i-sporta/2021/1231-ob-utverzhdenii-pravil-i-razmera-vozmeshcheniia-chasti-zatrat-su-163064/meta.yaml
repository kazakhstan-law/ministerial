  kaz: Танытым орталықтары мен туристерді орналастыру орындарын салу және реконструкциялау кезінде кәсіпкерлік субъектілері шығындарының бір бөлігін өтеу қағидалары мен мөлшерін, сондай-ақ оларға қойылатын талаптарды бекіту туралы
