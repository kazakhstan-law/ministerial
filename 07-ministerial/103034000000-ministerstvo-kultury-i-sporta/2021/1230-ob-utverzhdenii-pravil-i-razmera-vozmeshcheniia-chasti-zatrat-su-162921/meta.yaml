act_code: '162921'
requisite: Приказ Министра культуры и спорта Республики Казахстан от 30 декабря 2021 года № 412. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 января 2022 года № 26380
title:
  rus: Об утверждении Правил и размера возмещения части затрат субъектов предпринимательства, осуществляющих туристскую деятельность, на приобретение автомобильных транспортных средств вместимостью более восьми мест для сидения, за исключением места водителя, а также требований к транспортным средствам, часть затрат на приобретение которых подлежит возмещению
  kaz: Туристік қызметті жүзеге асыратын кәсіпкерлік субъектілерінің жүргізушінің орнын қоспағанда, сыйымдылығы сегізден астам отыратын орын болатын автомобиль көлік құралдарын сатып алуға жұмсалған шығындарының бір бөлігін өтеу қағидалары мен мөлшерін, сондай-ақ көлік құралдарын сатып алуға жұмсалатын шығындардың бір бөлігі өтелуге тиіс осындай көлік құралдарына қойылатын талаптарды бекіту туралы
