title:
  rus: Об утверждении Правил и размера субсидирования части затрат субъектов предпринимательства на содержание санитарно-гигиенических узлов на туристских ресурсах и путях следования к ним, а также требований к санитарно-гигиеническим узлам, затраты на содержание которых подлежат субсидированию
  kaz: Кәсіпкерлік субъектілерінің туристік ресурстардағы және оларға апаратын жолдардағы санитариялық-гигиеналық тораптарды күтіп-ұстауға жұмсалған шығындарының бір бөлігін субсидиялау қағидалары мен мөлшерін, сондай-ақ санитариялық-гигиеналық тораптарды күтіп-ұстауға жұмсалатын шығындар субсидиялануға тиіс осындай тораптарға қойылатын талаптарды бекіту туралы
