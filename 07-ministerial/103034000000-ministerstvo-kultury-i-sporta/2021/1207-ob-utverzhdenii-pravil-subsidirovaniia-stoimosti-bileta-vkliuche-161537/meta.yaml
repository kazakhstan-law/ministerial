title:
  rus: Об утверждении Правил субсидирования стоимости билета, включенного в туристский продукт, при воздушной перевозке несовершеннолетних пассажиров на территории Республики Казахстан, а также требований, предъявляемых к туристскому продукту
  kaz: Қазақстан Республикасы аумағында кәмелетке толмаған жолаушыларды әуе көлігімен тасымалдау кезінде туристік өнімге кіретін билеттің құнын субсидиялау қағидаларын, сондай-ақ туристік өнімге қойылатын талаптарды бекіту туралы
