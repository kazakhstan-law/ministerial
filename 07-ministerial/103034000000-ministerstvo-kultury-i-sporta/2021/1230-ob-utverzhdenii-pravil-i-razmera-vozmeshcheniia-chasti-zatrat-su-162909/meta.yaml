title:
  rus: Об утверждении Правил и размера возмещения части затрат субъектов предпринимательства на строительство объектов придорожного сервиса, а также перечня таких объектов и требований, предъявляемых к ним
  kaz: Кәсіпкерлік субъектілерінің жол бойындағы сервис объектілерін салуға жұмсалған шығындарының бір бөлігін өтеу қағидалары мен мөлшерін, сондай-ақ осындай объектілердің тізбесін және оларға қойылатын талаптарды бекіту туралы
