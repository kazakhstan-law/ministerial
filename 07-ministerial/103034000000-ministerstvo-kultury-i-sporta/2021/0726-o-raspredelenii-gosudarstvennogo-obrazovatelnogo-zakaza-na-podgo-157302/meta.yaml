act_code: '157302'
requisite: Приказ и.о. Министра культуры и спорта Республики Казахстан от 26 июля 2021 года № 230. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 июля 2021 года № 23721
title:
  rus: О распределении государственного образовательного заказа на подготовку специалистов с высшим и послевузовским образованием, а также с техническим и профессиональным, послесредним образованием в организациях образования в области культуры, спорта и туризма финансируемых из республиканского бюджета на 2021-2022 учебный год
  kaz: Республикалық бюджеттен қаржыландырылатын мәдениет, спорт және туризм салаларындағы білім беру ұйымдарында жоғары және жоғары оқу орнынан кейінгі білімі бар, сондай-ақ техникалық және кәсіптік, орта білімнен кейінгі білімі бар мамандарды даярлауға 2021 – 2022 оқу жылына арналған мемлекеттік білім беру тапсырысын бөлу туралы
