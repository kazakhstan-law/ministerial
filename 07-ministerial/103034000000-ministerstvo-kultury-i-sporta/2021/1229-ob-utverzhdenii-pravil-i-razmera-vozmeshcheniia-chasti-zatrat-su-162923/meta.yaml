act_code: '162923'
requisite: Приказ Министра культуры и спорта Республики Казахстан от 29 декабря 2021 года № 407. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 января 2022 года № 26382
title:
  rus: Об утверждении Правил и размера возмещения части затрат субъектов предпринимательства на приобретение оборудования и техники для горнолыжных курортов, а также перечня оборудования и техники для горнолыжных курортов, часть затрат на приобретение которых подлежит возмещению
  kaz: Кәсіпкерлік субъектілерінің тау шаңғысы курорттарына арналған жабдықтар мен техника сатып алуға жұмсалған шығындарының бір бөлігін өтеу қағидалары мен мөлшерін, сондай-ақ тау шаңғысы курорттарына арналған жабдықтар мен техниканы сатып алуға жұмсалатын шығындардың бір бөлігі өтелуге тиіс осындай жабдықтар мен техника тізбесін бекіту туралы
