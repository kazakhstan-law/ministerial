title:
  rus: Об утверждении Правил возмещения части затрат субъектов предпринимательства по приобретению оборудования и техники для горнолыжных курортов
  kaz: Кәсіпкерлік субъектілерінің тау шаңғысы курорттарына арналған жабдықтар мен техника сатып алу бойынша шығындарының бір бөлігін өтеу қағидаларын бекіту туралы
