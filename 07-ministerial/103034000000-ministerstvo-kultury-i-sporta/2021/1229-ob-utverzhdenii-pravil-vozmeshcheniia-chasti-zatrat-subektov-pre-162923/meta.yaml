  title:
    rus: О внесении изменений в приказы Министра культуры и спорта Республики Казахстан от 15 декабря 2021 года № 387 «Об утверждении Правил субсидирования затрат туроператоров в сфере въездного туризма за каждого иностранного туриста» и от 29 декабря 2021 года № 407 «Об утверждении Правил возмещения части затрат субъектов предпринимательства по приобретению оборудования и техники для горнолыжных курортов»
    kaz: Қазақстан Республикасы Мәдениет және спорт министрінің «Әрбір шетелдік турист үшін келу туризмі саласындағы туроператорлардың шығындарын субсидиялау қағидаларын бекіту туралы» 2021 жылғы 15 желтоқсандағы № 387 және «Кәсіпкерлік субъектілерінің тау шаңғысы курорттарына арналған жабдықтар мен техника сатып алу бойынша шығындарының бір бөлігін өтеу қағидаларын бекіту туралы» 2021 жылғы 29 желтоқсандағы № 407 бұйрықтарына өзгерістер енгізу туралы
