  requisite: Приказ и.о. Председателя Комитета по правам интеллектуальной собственности Министерства юстиции Республики Казахстан от 28 сентября 2004 года N 58-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 октября 2004 года N 3158. Утратил силу приказом Министра юстиции Республики Казахстан от 27 мая 2009 года N 56
  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета по правам интеллектуальной собственности Министерства юстиции Республики Казахстан от 10 августа 2001 года N 30 "Об утверждении Правил регистрации договоров об уступке исключительного права на объекты промышленной собственности", зарегистрированный за N 1679
    kaz: '"Өнеркәсіптік меншік объектілеріне ерекше құқықты беру туралы шарттарды тіркеудің тәртібі жөніндегі Ережені бекіту туралы" N 1679 мемлекеттік тіркелген Қазақстан Республикасы Әділет министрлігінің Санаткерлік меншік құқығы жөніндегі комитеті төрайымының 2001 жылғы 10 тамыздағы N 30 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
