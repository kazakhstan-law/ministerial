act_code: '10829'
requisite: Приказ Председателя Комитета по правам интеллектуальной собственности Министерства юстиции Республики Казахстан от 10 августа 2001 года № 30. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 ноября 2001 года № 1679. Утратил силу приказом Председателя Комитета по правам интеллектуальной собственности Министерства юстиции Республики Казахстан от 24 апреля 2007 года № 58-ОД
title:
  rus: Об утверждении Правил регистрации договоров об уступке исключительного права на объекты промышленной собственности
  kaz: Өнеркәсiптiк меншiк объектiлерiне ерекше құқықты беру туралы шарттарды тiркеудiң тәртiбi жөнiндегi Ереженi бекiту туралы
