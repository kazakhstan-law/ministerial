  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета по правам интеллектуальной собственности Министерства юстиции Республики Казахстан от 10 августа 2001 года N 31 "Об утверждении Правил регистрации лицензионных, сублицензионных договоров на использование объектов промышленной собственности", зарегистрированный за N 1678
    kaz: '"Өнеркәсіптік меншік объектілерін пайдалануға лицензиялық, сублицензиялық шарттарды тіркеудің тәртібін бекіту туралы" N 1678 мемлекеттік тіркелген Қазақстан Республикасы Әділет министрлігінің Санаткерлік меншік құқығы жөніндегі комитеті төрайымының 2001 жылғы 10 тамыздағы N 31 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
