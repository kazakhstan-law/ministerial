act_code: '10828'
requisite: Приказ Председателя Комитета по правам интеллектуальной собственности Министерства юстиции Республики Казахстан от 10 августа 2001 года № 31. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 ноября 2001 года № 1678. Утратил силу приказом Председателя Комитета по правам интеллектуальной собственности Министерства юстиции Республики Казахстан от 24 апреля 2007 года № 57-ОД
title:
  rus: Об утверждении Правил регистрации лицензионных, сублицензионных договоров на использование объектов промышленной собственности
  kaz: Өнеркәсiптiк меншiк объектiлерiн пайдалануға арналған лицензиялық, сублицензиялық шарттарды тiркеудiң тәртiбi жөнiндегi Ереженi бекiту туралы
