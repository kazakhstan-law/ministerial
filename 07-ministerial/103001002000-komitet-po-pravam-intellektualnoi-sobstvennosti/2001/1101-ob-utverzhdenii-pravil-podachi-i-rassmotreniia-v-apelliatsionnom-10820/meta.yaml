  title:
    rus: О внесении изменений и дополнений в Приказ Председателя Комитета по правам интеллектуальной собственности Министерства юстиции Республики Казахстан от 1 ноября 2001 года № 69 "Об утверждении Правил подачи и рассмотрения в Апелляционном совете возражений, связанных с патентованием и регистрацией объектов промышленной собственности", зарегистрированный за № 1712
    kaz: '"Өнеркәсіптік меншік объектілерін патенттеу мен тіркеуге байланысты қарсылықтарды апелляциялық кеңеске берудің және оны қараудың тәртібі туралы ережені бекіту туралы" N 1712 тіркелген Қазақстан Республикасы Әділет министрлігінің Санаткерлік меншік құқығы жөніндегі комитеті төрайымының 2001 жылғы 1 қарашадағы N 69 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
