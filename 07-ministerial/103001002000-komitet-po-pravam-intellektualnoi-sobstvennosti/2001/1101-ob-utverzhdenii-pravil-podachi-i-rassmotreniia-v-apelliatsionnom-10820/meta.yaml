  title:
    rus: О внесении изменений и дополнений в приказ Председателя Комитета по правам интеллектуальной собственности Министерства юстиции Республики Казахстан от 1 ноября 2001 года № 69 "Об утверждении Правил подачи и рассмотрения в апелляционном совете возражений, связанных с патентованием и регистрацией объектов промышленной собственности"
    kaz: '"Өнеркәсіптік меншік объектілерін патенттеу мен тіркеуге байланысты қарсылықтарды апелляциялық кеңеске берудің және оны қараудың тәртібі туралы ережені бекіту туралы" Қазақстан Республикасы Әділет министрлігінің Зияткерлік меншік құқығы комитеті төрағасының 2001 жылғы 1 қарашадағы № 69 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
