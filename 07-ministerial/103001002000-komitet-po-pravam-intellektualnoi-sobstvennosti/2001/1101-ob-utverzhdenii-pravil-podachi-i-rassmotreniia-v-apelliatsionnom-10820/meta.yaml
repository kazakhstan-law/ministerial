act_code: '10820'
requisite: Приказ Председателя Комитета по правам интеллектуальной собственности Министерства юстиции Республики Казахстан от 1 ноября 2001 года № 69.  Зарегистрирован в Министерстве юстиции Республики Казахстан 28 декабря 2001 года № 1712. Утратил силу приказом Министра юстиции Республики Казахстан от 12 марта 2010 года № 81
title:
  rus: Об утверждении Правил подачи и рассмотрения в апелляционном совете возражений, связанных с патентованием и регистрацией объектов промышленной собственности
  kaz: Өнеркәсiптiк меншiк объектiлерiн патенттеу мен тiркеуге байланысты қарсылықтарды апелляциялық кеңеске берудiң және оны қараудың тәртiбi туралы Ережені бекіту туралы
