  title:
    rus: О внесении дополнения в Приказ Председателя Комитета по правам интеллектуальной собственности Министерства юстиции Республики Казахстан от 15 августа 2002 года № 133 "Об утверждении Инструкции по признанию товарного знака (знака обслуживания) общеизвестным в Республике Казахстан"
    kaz: '"Тауар таңбасын (қызмет көрсету белгісін) Қазақстан Республикасында жалпыға белгілі деп тану туралы нұсқаулықты бекіту туралы" Қазақстан Республикасы Әділет министрлігінің Зияткерлік меншік құқығы комитеті төрайымының 2002 жылғы 15 тамыздағы № 133 бұйрығына толықтыру енгізу туралы'
