  requisite: Приказ Председателя Комитета по правам интеллектуальной собственности Министерства юстиции Республики Казахстан от 12 февраля 2004 года № 7-п. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 февраля 2004 года № 2707. Утратил силу приказом и.о. Министра юстиции Республики Казахстан от 28 июля 2010 года № 223
  title:
    rus: О внесении дополнений в приказ Председателя Комитета по правам интеллектуальной собственности Министерства юстиции Республики Казахстан от 4 ноября 2002 года № 188 "Об утверждении Правил аттестации и регистрации патентных поверенных Республики Казахстан", зарегистрированный в Министерстве юстиции Республики Казахстан за № 2040
    kaz: Қазақстан Республикасы Әділет министрлігінде 2002 жылғы 12 қарашада N 2040 тіркелген "Қазақстан Республикасының патенттік сенімді өкілдерді тіркеу және аттестаттау ережесін бекіту туралы" Қазақстан Республикасы Әділет министрлігінің Санаткерлік меншік құқығы жөніндегі комитеті төрайымының 2002 жылғы 4 қарашадағы N 188 бұйрығына толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/18618/rus
