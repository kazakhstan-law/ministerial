act_code: '13567'
requisite: Приказ Председателя Комитета по правам интеллектуальной собственности Министерства юстиции Республики Казахстан от 4 ноября 2002 года № 188. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 ноября 2002 года № 2040. Утратил силу приказом и.о. Министра юстиции Республики Казахстан от 28 июля 2010 года № 223 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил аттестации и регистрации патентных поверенных Республики Казахстан
  kaz: Қазақстан Республикасының патенттік сенімді өкілдерді аттестаттау және тіркеу ережесін бекіту туралы
