  title:
    rus: О внесении дополнения и изменения в Приказ Председателя Комитета по правам интеллектуальной собственности Министерства юстиции Республики Казахстан от 4 ноября 2002 года № 188 "Об утверждении Правил аттестации и регистрации патентных поверенных Республики Казахстан"
    kaz: '"Қазақстан Республикасының патенттік сенім білдірілген өкілдерін атестаттау және тіркеу ережесін бекіту туралы" Қазақстан Республикасы Әділет министрлігінің Зияткерлік меншік құқығы комитеті Төрайымының 2002 жылғы 4 қарашадағы № 188 Бұйрығына толықтыру мен өзгеріс енгізу туралы'
