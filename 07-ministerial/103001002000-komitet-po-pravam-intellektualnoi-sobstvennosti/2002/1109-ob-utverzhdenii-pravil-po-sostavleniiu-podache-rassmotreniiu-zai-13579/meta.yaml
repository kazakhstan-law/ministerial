act_code: '13579'
requisite: Приказ Председателя Комитета по правам интеллектуальной собственности Министерства юстиции Республики Казахстан от 9 ноября 2002 года N 192. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 ноября 2002 года N 2043. Утратил силу приказом и.о. Министра юстиции Республики Казахстан от 23 апреля 2010 года N 136 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
