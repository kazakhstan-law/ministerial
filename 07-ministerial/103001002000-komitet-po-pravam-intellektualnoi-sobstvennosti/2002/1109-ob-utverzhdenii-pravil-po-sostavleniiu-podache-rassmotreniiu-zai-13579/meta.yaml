  title:
    rus: О внесении изменения и дополнений в приказ Председателя Комитета по правам интеллектуальной собственности Министерства юстиции Республики Казахстан от 9 ноября 2002 года N 192 "Об утверждении Правил по составлению, подаче, рассмотрению заявки на регистрацию, регистрации и выдаче свидетельства на топологии интегральной микросхемы", зарегистрированный за N 2043
    kaz: '"Интегралдық микросхема топологиясын тiркеуге өтiнiм жасау, беру, қарау, тiркеу және куәлiк беру жөнiндегi ереженi бекiту туралы" N 2043 тiркелген Қазақстан Республикасы Әдiлет министрлiгінiң Санаткерлiк меншiк құқығы жөнiндегi комитетi төрайымының 2002 жылғы 9 қарашадағы N 192 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы'
