requisite: Приказ Председателя Комитета лесного хозяйства и животного мира Министерства экологии, геологии и природных ресурсов Республики Казахстан от 30 декабря 2020 года № 27-5-6/253. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2020 года № 22009. Утратил силу приказом и.о. Председателя Комитета лесного хозяйства и животного мира Министерства экологии и природных ресурсов Республики Казахстан от 2 октября 2024 года № 233 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении размеров тарифов за услуги, предоставляемые особо охраняемыми природными территориями республиканского значения со статусом юридического лица, находящимися в его ведении
