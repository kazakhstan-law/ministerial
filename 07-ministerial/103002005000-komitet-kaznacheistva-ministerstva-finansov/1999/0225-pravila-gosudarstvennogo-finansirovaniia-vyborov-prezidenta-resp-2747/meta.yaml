  title:
    rus: Об утверждении изменений и дополнений в Правила государственного финансирования выборов Президента Республики Казахстан, депутатов Парламента, маслихатов и членов органов местного самоуправления
    kaz: Қазақстан Республикасы Президентiнiң, Парламент, маслихаттар депутаттының және жергiлiктi өзiн-өзi басқару органдары мүшелерiнің сайлауын мемлекеттік қаржыландырудың ережелерiне өзгерістер мен толықтыруларды бекіту туралы
