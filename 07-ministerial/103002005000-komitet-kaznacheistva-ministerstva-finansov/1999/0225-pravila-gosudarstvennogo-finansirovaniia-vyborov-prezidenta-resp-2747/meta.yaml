  requisite: Приказ Председателя Комитета казначейства Министерства финансов Республики Казахстан от 14 июля 2004 года N 26. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 июля 2004 года N 2967. Утратил силу - приказом Председателя Комитета казначейства Министерства финансов Республики Казахстан от 20 декабря 2005 года N 58
  title:
    rus: О внесении изменений и дополнений в приказ Директора Департамента казначейства Министерства финансов Республики Казахстан от 25 февраля 1999 года N 71 "Об утверждении Правил государственного финансирования выборов Президента Республики Казахстан, депутатов Парламента, маслихатов и членов органов местного самоуправления", зарегистрированный за N 737
    kaz: N 737 тіркелген "Қазақстан Республикасы Президентінің, Парламент, мәслихаттар депутаттарының және жергілікті өзін-өзі басқару органдары мүшелерінің сайлауын мемлекеттік қаржыландыру ережесін бекіту туралы" Қазақстан Республикасы Қаржы министрлігінің Қазынашылық департаменті директорының 1999 жылғы 25 ақпандағы N 71 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/20697/rus
