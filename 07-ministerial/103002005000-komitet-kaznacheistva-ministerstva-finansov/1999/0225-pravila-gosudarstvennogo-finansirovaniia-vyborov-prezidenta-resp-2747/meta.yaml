act_code: '2747'
requisite: Утверждены приказом Департамента Казначейства Министерства финансов Республики Казахстан от 25 февраля 1999 г. N 71. Зарегистрирован в Министерстве юстиции Республики Казахстан 20.04.1999 г. за N 737. Утратил силу - приказом Председателя Комитета казначейства Министерства финансов Республики Казахстан от 20 декабря 2005 года N 58
title:
  rus: Правила государственного финансирования выборов Президента Республики Казахстан, депутатов Парламента, за исключением депутатов Мажилиса Парламента, избираемых на основе партийных списков, маслихатов и членов органов местного самоуправления
  kaz: Қазақстан Республикасы Президентінің, партиялық тізімдер негізінде сайланатын Парламент Мәжілісінің депутаттарын қоспағанда, Парламент, мәслихаттар депутаттарының және жергілікті өзін-өзі басқару органдары мүшелерінің сайлауын мемлекеттік қаржыландырудың Ережелері
