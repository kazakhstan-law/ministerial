  requisite: Приказ Председателя Комитета казначейства Министерства финансов Республики Казахстан от 1 июля 2002 года N 305. Зарегистрирован в Министерстве юстиции Республики Казахстан 8 августа 2002 года N 1941. Утратил силу - приказом Председателя Комитета казначейства Министерства финансов Республики Казахстан от 20 декабря 2005 года N 58
  title:
    rus: О внесении изменений и дополнений в приказ Департамента казначейства Министерства финансов Республики Казахстан от 25 февраля 1999 года N 71 "Об утверждении Правил государственного финансирования выборов Президента Республики Казахстан, депутатов Парламента, маслихатов и членов органов местного самоуправления"
    kaz: Қазақстан Республикасының Қаржы министрлiгi Қазынашылық департаментiнiң "Қазақстан Республикасы Президентiнiң, Парламент, мәслихаттар депутаттарының және жергiлiктi өзiн-өзi басқару органдары мүшелерiнiң сайлауын мемлекеттiк қаржыландырудың ережесiн бекiту туралы" 1999 жылғы 25 ақпандағы N 71 бұйрығына өзгерiстер мен толықтырулар енгiзу туралы
  link: https://zan.gov.kz/client/#!/doc/12897/rus
