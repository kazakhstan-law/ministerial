title:
  rus: Об утверждении изменений и дополнений в Правила государственного финансирования выборов Президента Республики Казахстан, депутатов Парламента, маслихатов и членов органов местного самоуправления ~V990737
  kaz: Қазақстан Республикасы Президентінің, Парламент, мәслихаттар депутаттарының және жергілікті өзін өзі басқару органдары мүшелерінің сайлауларын мемлекеттік қаржыландырудың Ережесіне өзгерістер мен толықтыруларды бекіту туралы
