  code: '37068'
  requisite: Приказ Министра финансов Республики Казахстан от 28 декабря 2007 года № 489. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 января 2008 года № 5110. Утратил силу приказом Министра финансов Республики Казахстан от 22 августа 2011 года № 423
  title:
    rus: О внесении изменений и дополнений в приказ Директора Департамента казначейства Министерства финансов Республики Казахстан от 23 июля 1998 года № 335 "Об утверждении Инструкции о порядке проведения инвентаризации активов, материальных запасов, денег, расчетов и других статей баланса в организациях, содержащихся за счет республиканского и местных бюджетов Республики Казахстан"
    kaz: '"Қазақстан Республикасының республикалық және жергілікті бюджеттер есебінен ұсталатын ұйымдарында активтерге, материалдық запастарға, ақшаларға, есеп айырысуларға және басқа да баланс баптарына түгендеме жүргізудің тәртібі туралы Нұсқаулықты бекіту туралы" Қазақстан Республикасы Қаржы министрлігінің Қазынашылық департаменті директорының 1998 жылы 23 шілдедегі N 335 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/37068/rus
