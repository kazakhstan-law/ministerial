act_code: '2189'
requisite: Приказ Директора Департамента Казначейства Министерства финансов Республики Казахстан от 23 июля 1998 года № 335. Зарегистрирован Министерством юстиции Республики Казахстан 15 октября 1998 года № 621. Утратил силу приказом Министра финансов Республики Казахстан от 22 августа 2011 года № 423
title:
  rus: Об утверждении Инструкции о порядке проведения инвентаризации активов, материальных запасов, денег, расчетов и других статей баланса в государственных учреждениях, содержащихся за счет республиканского и местных бюджетов
  kaz: Республикалық және жергілікті бюджеттер есебінен ұсталатын ұйымдарында активтерді, материалдық запастарды, ақшаларды, есеп айырысуларды және басқа да баланс баптарына түгендемені жүргізудің тәртібі туралы Нұсқаулықты бекіту туралы
