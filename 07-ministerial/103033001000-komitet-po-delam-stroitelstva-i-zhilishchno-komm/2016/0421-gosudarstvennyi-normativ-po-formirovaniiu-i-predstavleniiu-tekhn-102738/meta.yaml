act_code: '102738'
requisite: Приказ Председателя Комитета по делам строительства, жилищно-коммунального хозяйства и управления земельными ресурсами Министерства национальной экономики Республики Казахстан от 21 апреля 2016 года № 106-нқ. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 мая 2016 года № 13736. Утратил силу приказом и.о. Председателя Комитета по делам строительства и жилищно-коммунального хозяйства Министерства промышленности и строительства Республики Казахстан от 21 января 2026 года № 5-нқ (вводится в действие по истечении десяти календарных дней после дня его официального опубликования)
title:
  rus: Государственный норматив по формированию и представлению технико-экономических обоснований и проектно-сметной документации в электронно-цифровой форме в экспертные организации и в Единый государственный электронный банк предпроектной и проектной (проектно-сметной) документации  на строительство объектов, финансируемых за счет государственных инвестиций и средств  субъектов квазигосударственного сектора
  kaz: Мемлекеттік инвестициялардың және квазимемлекеттік сектор субъектілерінің қаражаты есебінен қаржыландырылатын объектілердің құрылысына арналған жоба алдындағы және жобалау (жобалау-сметалық) құжаттамасын сараптамалық ұйымдарға және Бірыңғай мемлекеттік электрондық банкке электрондық-сандық нысандағы техникалық-экономикалық негіздемелерді және жобалау-сметалық құжаттамасын қалыптастыру және ұсыну жөніндегі мемлекеттік норматив
