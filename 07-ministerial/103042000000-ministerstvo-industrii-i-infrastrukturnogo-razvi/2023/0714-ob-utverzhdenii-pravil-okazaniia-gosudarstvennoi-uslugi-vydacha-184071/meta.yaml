requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 14 июля 2023 года № 516. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 июля 2023 года № 33094
title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача разрешения на переход права недропользования (доли в праве недропользования), возникшего на основании контракта на недропользование, лицензии на разведку или лицензии на добычу твердых полезных ископаемых, а также переход объектов, связанных с правом недропользования»
  kaz: Жер қойнауын пайдалануға арналған келісімшарт, барлауға арналған лицензия немесе қатты пайдалы қазбаларды өндіруге арналған лицензия негізінде туындаған жер қойнауын пайдалану құқығын (жер қойнауын пайдалану құқығындағы үлесті) ауыстыруға, сондай-ақ жер қойнауын пайдалану құқығымен байланысты объектілерді ауыстыруға рұқсат беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы
