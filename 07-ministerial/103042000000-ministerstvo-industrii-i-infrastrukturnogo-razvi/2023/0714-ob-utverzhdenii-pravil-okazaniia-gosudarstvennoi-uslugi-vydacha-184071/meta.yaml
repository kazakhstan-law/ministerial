  code: '223563'
  requisite: Приказ Министра промышленности и строительства Республики Казахстан от 19 марта 2026 года № 121. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 марта 2026 года № 38230
  title:
    rus: О внесении изменений в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 14 июля 2023 года № 516 «Об утверждении Правил оказания государственной услуги «Выдача разрешения на переход права недропользования (доли в праве недропользования), возникшего на основании контракта на недропользование, лицензии на разведку или лицензии на добычу твердых полезных ископаемых, а также переход объектов, связанных с правом недропользования»
    kaz: «Жер қойнауын пайдалануға арналған келісімшарт, барлауға арналған лицензия немесе қатты пайдалы қазбаларды өндіруге арналған лицензия негізінде туындаған жер қойнауын пайдалану құқығын (жер қойнауын пайдалану құқығындағы үлесті) ауыстыруға, сондай-ақ жер қойнауын пайдалану құқығымен байланысты объектілерді ауыстыруға рұқсат беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2023 жылғы 14 шілдедегі № 516 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/223563/rus
