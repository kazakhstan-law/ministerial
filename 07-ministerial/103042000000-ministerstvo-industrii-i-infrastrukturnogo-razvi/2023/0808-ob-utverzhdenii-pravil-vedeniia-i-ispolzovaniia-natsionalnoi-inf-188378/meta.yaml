requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 8 августа 2023 года № 565. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 августа 2023 года № 33261
title:
  rus: Об утверждении Правил ведения и использования национальной информационной системы промышленности Республики Казахстан и Перечня функциональных и информационных сервисов, входящих в национальную информационную систему промышленности Республики Казахстан
  kaz: Қазақстан Республикасы өнеркәсібінің ұлттық ақпараттық жүйесін жүргізу және пайдалану қағидаларын және Қазақстан Республикасы өнеркәсібінің ұлттық ақпараттық жүйесіне кіретін функционалдық және ақпараттық сервистердің тізбесін бекіту туралы
