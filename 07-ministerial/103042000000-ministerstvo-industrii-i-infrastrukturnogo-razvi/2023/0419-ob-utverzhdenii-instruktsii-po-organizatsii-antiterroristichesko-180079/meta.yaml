  title:
    rus: О внесении изменений в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 19 апреля 2023 года 267 «Об утверждении Инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, осуществляющих деятельность в сфере железнодорожного транспорта»
    kaz: «Теміржол көлігі саласындағы қызметті жүзеге асыратын террористік тұрғыдан осал объектілерді терроризмге қарсы қорғауды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2023 жылғы 19 сәуірдегі № 267 бұйрығына өзгерістер енгізу туралы
