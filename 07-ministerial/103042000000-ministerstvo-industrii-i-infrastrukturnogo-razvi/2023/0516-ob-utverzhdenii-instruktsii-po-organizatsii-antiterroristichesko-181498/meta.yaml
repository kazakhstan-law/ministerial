title:
  rus: Об утверждении Инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, находящихся в ведении Министерства индустрии и инфраструктурного развития Республики Казахстан
  kaz: Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің қарамағындағы террористік тұрғыдан осал объектілердің терроризмге қарсы қорғалуын ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
