title:
  rus: Об утверждении Правил субсидирования аэропортов, находящихся в коммунальной собственности, не обеспечивающих достаточный уровень доходов для покрытия операционных затрат с пассажиропотоком менее двухсот тысяч пассажиров в год
  kaz: Жылына екі жүз мың жолаушыдан аз жолаушылар легімен операциялық шығындарды жабу үшін кірістердің жеткілікті деңгейін қамтамасыз етпейтін коммуналдық меншіктегі әуежайларды субсидиялау қағидаларын бекіту туралы
