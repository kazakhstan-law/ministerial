  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 31 марта 2023 года № 202 «Об утверждении Правил субсидирования аэропортов, находящихся в коммунальной собственности, не обеспечивающих достаточный уровень доходов для покрытия операционных затрат с пассажиропотоком менее двухсот тысяч пассажиров в год»
    kaz: «Жылына екі жүз мың жолаушыдан аз жолаушылар легімен операциялық шығындарды жабу үшін кірістердің жеткілікті деңгейін қамтамасыз етпейтін коммуналдық меншіктегі әуежайларды субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2023 жылғы 31 наурыздағы № 202 бұйрығына өзгерістер енгізу туралы
