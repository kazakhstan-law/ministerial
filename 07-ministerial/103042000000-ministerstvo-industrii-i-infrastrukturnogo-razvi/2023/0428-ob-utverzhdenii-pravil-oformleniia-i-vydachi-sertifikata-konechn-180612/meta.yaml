  title:
    rus: О внесении изменений в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 28 апреля 2023 года № 309 «Об утверждении Правил оформления и выдачи сертификата конечного пользователя Республики Казахстан и международного импортного сертификата Республики Казахстан и квалификационных требований
    kaz: Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2023 жылғы 28 сәуірдегі № 309 «Қазақстан Республикасының түпкілікті пайдаланушысының сертификатын және Қазақстан Республикасының халықаралық импорттық сертификатын ресімдеу және беру қағидалары мен біліктілік талаптарын бекіту туралы» бұйрығына өзгерістер енгізу туралы
