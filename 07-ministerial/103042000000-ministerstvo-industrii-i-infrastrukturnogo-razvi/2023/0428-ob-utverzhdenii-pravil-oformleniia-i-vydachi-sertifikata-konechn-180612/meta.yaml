title:
  rus: Об утверждении Правил оформления и выдачи сертификата конечного пользователя Республики Казахстан и международного импортного сертификата Республики Казахстан и квалификационных требований
  kaz: Қазақстан Республикасы түпкілікті пайдаланушысының сертификатын және Қазақстан Республикасының халықаралық импорттық сертификатын  ресімдеу және  беру қағидалары мен біліктілік талаптарын бекіту туралы
