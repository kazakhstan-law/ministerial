title:
  rus: Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства индустрии и инфраструктурного развития Республики Казахстан, его ведомств и их территориальных подразделений
  kaz: Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің, оның ведомстволары мен олардың аумақтық бөлімшелерінің «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы»
