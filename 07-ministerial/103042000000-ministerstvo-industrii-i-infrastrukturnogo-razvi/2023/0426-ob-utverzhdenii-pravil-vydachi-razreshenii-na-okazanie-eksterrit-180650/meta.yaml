requisite: Приказ и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 26 апреля 2023 года № 294. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 мая 2023 года № 32413
title:
  rus: Об утверждении Правил выдачи разрешений на оказание экстерриториальных посреднических услуг или технической помощи и квалификационных требований, порядка уведомления и ведения уполномоченным органом списка физических и юридических лиц Республики Казахстан, оказывающих экстерриториальные посреднические услуги или техническую помощь
  kaz: Эксаумақтық делдалдық қызметтер немесе техникалық көмек көрсетуге рұқсаттар беру қағидаларын және біліктілік талаптарын, уәкілетті органның эксаумақтық делдалдық қызметтер немесе техникалық көмек көрсететін Қазақстан Республикасының жеке және заңды тұлғаларын хабардар ету және олардың тізімін жүргізу тәртібін бекіту туралы
