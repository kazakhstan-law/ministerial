  title:
    rus: О внесении дополнения в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 20 июня 2023 года № 454 «Об определении ювелирных и других изделий, произведенных и (или) реализуемых на территории Республики Казахстан, не подлежащих обязательному опробованию и клеймению в уполномоченных организациях»
    kaz: «Уәкілетті ұйымдарда міндетті түрде сынамалануға және таңбалануға жатпайтын Қазақстан Республикасының аумағында өндірілген және (немесе) өткізілетін зергерлік және басқа да бұйымдарды айқындау туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2023 жылғы 20 маусымдағы № 454 бұйрығына толықтыру енгізу туралы
