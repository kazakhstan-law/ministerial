  title:
    rus: О внесении изменений в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 12 мая 2023 года № 350 «Об утверждении инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, осуществляющих деятельность в сфере металлургической промышленности, относящиеся к системообразующим»
    kaz: «Жүйе құраушыларға жататын металлургия өнеркәсібі саласындағы қызметті жүзеге асыратын террористік тұрғыдан осал объектілерді терроризмге қарсы қорғауды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2023 жылғы 12 мамырдағы № 350 бұйрығына өзгерістер енгізу туралы
