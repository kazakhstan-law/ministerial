title:
  rus: Об утверждении инструкции по организации антитеррористической защиты объектов, уязвимых в террористическом отношении, осуществляющих деятельность в сфере металлургической промышленности, относящиеся к системообразующим
  kaz: Жүйе құраушыларға жататын металлургия өнеркәсібі саласындағы қызметті жүзеге асыратын террористік тұрғыдан осал объектілерді терроризмге қарсы қорғауды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
