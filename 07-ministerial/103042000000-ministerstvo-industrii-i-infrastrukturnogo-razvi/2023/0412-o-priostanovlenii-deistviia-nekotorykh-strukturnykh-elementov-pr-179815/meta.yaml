act_code: '179815'
requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 12 апреля 2023 года № 243. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 апреля 2023 года № 32313
title:
  rus: О приостановлении действия некоторых структурных элементов приказа исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 19 июля 2019 года № 521 «Об утверждении типовых договоров между перевозчиком и экспедитором об организации перевозок грузов железнодорожным транспортом»
  kaz: «Тасымалдаушы мен экспедитор арасындағы жүктерді теміржол көлігімен тасымалдауды ұйымдастыру туралы үлгілік шарттарды бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2019 жылғы 19 шілдедегі № 521 бұйрығының кейбір құрылымдық элементтерінің қолданысын тоқтата тұру туралы
