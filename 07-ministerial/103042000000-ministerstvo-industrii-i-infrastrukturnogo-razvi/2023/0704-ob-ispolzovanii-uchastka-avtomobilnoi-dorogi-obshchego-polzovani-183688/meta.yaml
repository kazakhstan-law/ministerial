  requisite: Приказ и.о. Министра транспорта Республики Казахстан от 31 июля 2026 года № 199. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 августа 2026 года № 39479
  title:
    rus: О внесении изменения в приказ Министерства индустрии и инфраструктурного развития Республики Казахстан от 4 июля 2023 года № 490 «Об использовании участка автомобильной дороги общего пользования республиканского значения «Большая Алматинская Кольцевая автомобильная дорога» (БАКАД) на платной основе»
    kaz: «Ақылы негізде «Үлкен Алматы Айналма Автомобиль Жолы» (ҮАААЖ) республикалық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолының учаскесін пайдалану туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2023 жылғы 4 шiлдедегi № 490 бұйрығына өзгеріс енгізу туралы
