title:
  rus: Об использовании участка автомобильной дороги общего пользования республиканского значения «Большая Алматинская Кольцевая автомобильная дорога» (БАКАД) на платной основе
  kaz: Ақылы негізде «Үлкен Алматы Айналма Автомобиль Жолы» (ҮАААЖ) республикалық маңызы бар жалпыға ортақ пайдаланылатын автомобиль жолының учаскесін пайдалану туралы
