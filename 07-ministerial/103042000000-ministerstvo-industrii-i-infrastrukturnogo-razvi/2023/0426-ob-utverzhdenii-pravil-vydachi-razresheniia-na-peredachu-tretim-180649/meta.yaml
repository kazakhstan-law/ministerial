act_code: '180649'
requisite: Приказ и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 26 апреля 2023 года № 293. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 мая 2023 года № 32412
title:
  rus: Об утверждении Правил выдачи разрешения на передачу третьим лицам на территории Республики Казахстан импортированных специфических товаров, а также товаров, импортированных с предоставлением гарантийных обязательств и квалификационных требований
  kaz: Импортталған өзіндік ерекшелігі бар тауарларды, сондай-ақ Қазақстан Республикасының кепілдік міндеттемелері беріле отырып импортталған тауарларды Қазақстан Республикасының аумағында үшінші тұлғаларға беруге рұқсат беру қағидаларын және біліктілік талаптарын бекіту туралы
