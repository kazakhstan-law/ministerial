  title:
    rus: О внесении изменения в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 27 июня 2019 года № 447 «Об утверждении правил перечисления и норматива отчислений на обеспечение безопасности полетов гражданской авиации»
    kaz: «Азаматтық авиацияның ұшу қауіпсіздігін қамтамасыз етуге арналған аударымдарды аудару қағидалары мен олардың нормативін бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 27 маусымдағы № 447 бұйрығына өзгеріс енгізу туралы
