  title:
    rus: О внесении изменения в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 3 сентября 2019 года № 687 «Об утверждении Правил сертификации и выдачи сертификата организации техническому обслуживанию и ремонту авиационной техники государственной авиации» и приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 3 сентября 2019 года № 688 «Об утверждении Сертификационных требований к организациям по техническому обслуживанию и ремонту авиационной техники государственной авиации»
    kaz: «Мемлекеттік авиацияның авиациялық техникасына техникалық қызмет көрсету және оны жөндеу жөніндегі ұйымдарды сертификаттау және оларға сертификат беру қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 3 қыркүйектегі № 687 бұйрығы және «Мемлекеттік авиацияның авиациялық техникасына техникалық қызмет көрсету және жөндеу жөніндегі ұйымдарға қойылатын сертификаттық талаптарды бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 3 қыркүйектегі № 688 бұйрықтарына өзгерістер енгізу туралы.
