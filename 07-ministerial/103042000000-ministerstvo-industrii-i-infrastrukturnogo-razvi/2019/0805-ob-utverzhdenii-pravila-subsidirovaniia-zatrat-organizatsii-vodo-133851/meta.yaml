act_code: '133851'
requisite: Приказ и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 5 августа 2019 года № 619. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 августа 2019 года № 19196. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 30 июля 2025 года № 287 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правила субсидирования затрат организаций водоснабжения и водоотведения на погашение и обслуживание займов международных финансовых организаций, привлеченных для реализации проектов по расширению, модернизации, реконструкции, обновлению, поддержанию существующих активов и созданию новых активов в населенных пунктах
  kaz: Сумен жабдықтау және су бұру ұйымдарының елді мекендерде бар активтерді кеңейту, жаңғырту, реконструкциялау, жаңарту, ұстап тұру және жаңа активтер құру жөніндегі жобаларды іске асыру үшін тартылған халықаралық қаржы ұйымдарының қарыздарын өтеуге және оларға қызмет көрсетуге арналған шығындарын субсидиялау қағидаларын бекіту туралы
