  requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 20 января 2023 года № 37. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 января 2023 года № 31755. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 30 июля 2025 года № 287 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 5 августа 2019 года № 619 «Об утверждении Правил субсидирования затрат организаций водоснабжения и водоотведения, и организаций в сфере передачи и снабжения электрической энергии, передачи и снабжения тепловой энергией на погашение и обслуживание займов международных финансовых организаций, привлеченных для реализации проектов по расширению, модернизации, реконструкции, обновлению, поддержанию существующих активов и созданию новых активов в населенных пунктах»
    kaz: «Сумен жабдықтау және су бұру ұйымдарының және электр энергиясын беру мен онымен жабдықтау, жылу энергиясын беру мен онымен жабдықтау саласындағы ұйымдардың елді мекендерде бар активтерді кеңейту, жаңғырту, реконструкциялау, жаңарту, ұстап тұру және жаңа активтер құру жөніндегі жобаларды іске асыру үшін тартылған халықаралық қаржы ұйымдарының қарыздарын өтеуге және оларға қызмет көрсетуге арналған шығындарын субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2019 жылғы 5 тамыздағы № 619 бұйрығына өзгеріс енгізу туралы
