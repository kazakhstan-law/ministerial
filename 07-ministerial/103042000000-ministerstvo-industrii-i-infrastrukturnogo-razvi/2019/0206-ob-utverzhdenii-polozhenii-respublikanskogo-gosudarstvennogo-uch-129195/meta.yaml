act_code: '129195'
requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 6 февраля 2019 года № 65. Утратил силу приказом Министра экологии, геологии и природных ресурсов Республики Казахстан от 30 сентября 2019 года № 44-Ө
title:
  rus: Об утверждении положений Республиканского государственного учреждения «Комитет геологии и недропользования Министерства индустрии и инфраструктурного развития Республики Казахстан» и его территориальных подразделений
  kaz: Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің Геология және жер қойнауын пайдалану комитеті» мемлекеттік мекемесінің және оның аумақтық бөлімшелерінің ережелерін бекіту туралы
