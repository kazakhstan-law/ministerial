act_code: '135650'
requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 25 октября 2019 года № 803. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 октября 2019 года № 19534. Утратил силу приказом и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 15 мая 2020 года № 298 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Субсидирование убытков перевозчика, связанных с осуществлением автомобильных пассажирских перевозок по социально значимым сообщениям в межрайонном (междугородном внутриобластном), внутрирайонном, городском (сельском) и пригородном сообщениях»
  kaz: «Ауданаралық (қалааралық облысішілік), ауданішілік, қалалық (ауылдық) және қала маңындағы қатынастарда әлеуметтік маңызы бар қатынастар бойынша автомобильмен жолаушылар тасымалын жүзеге асырумен байланысты тасымалдаушылардың залалдарын субсидиялау» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
