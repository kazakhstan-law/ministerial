  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 6 августа 2019 года № 621 «Об утверждении Правил проведения конкурсного отбора лиц для управления управляющими компаниями специальных экономических зон и государственных индустриальных зон, а также квалификационных требований к указанным лицам»
    kaz: «Арнайы экономикалық аймақтардың және мемлекеттік индустриялық аймақтардың басқарушы компанияларын басқару үшін адамдарды конкурстық іріктеуді жүргізу қағидаларын, сондай-ақ көрсетілген адамдарға қойылатын біліктілік талаптарын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2019 жылғы 6 тамыздағы № 621 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/156901/rus
