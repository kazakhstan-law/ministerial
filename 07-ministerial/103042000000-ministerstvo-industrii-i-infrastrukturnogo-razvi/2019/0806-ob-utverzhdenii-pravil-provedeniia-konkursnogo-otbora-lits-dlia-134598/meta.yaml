title:
  rus: Об утверждении Правил проведения конкурсного отбора лиц для управления управляющими компаниями специальных экономических зон и государственных индустриальных зон, а также квалификационных требований к указанным лицам
  kaz: Арнайы экономикалық аймақтардың және мемлекеттік индустриялық аймақтардың басқарушы компанияларын басқару үшін адамдарды конкурстық іріктеуді жүргізу қағидаларын, сондай-ақ көрсетілген адамдарға қойылатын біліктілік талаптарын бекіту туралы
