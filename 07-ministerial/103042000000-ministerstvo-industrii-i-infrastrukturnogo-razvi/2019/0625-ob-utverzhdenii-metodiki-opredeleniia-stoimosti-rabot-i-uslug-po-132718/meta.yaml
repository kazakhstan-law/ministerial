title:
  rus: Об утверждении Методики определения стоимости работ и услуг по производству экспертизы качества работ и материалов, а также управления дорожными активами автомобильных дорог
  kaz: Жұмыстар мен материалдардың сапасына сараптама жүргізу жөніндегі жұмыстар мен көрсетілетін қызметтер құнын айқындау, сондай-ақ автомобиль жолдарының жол активтерін басқару әдістемесін бекіту туралы
