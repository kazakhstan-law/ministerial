  title:
    rus: О внесении изменений в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 25 июня 2019 года № 426 «Об утверждении Методики определения стоимости работ и услуг по производству экспертизы качества работ и материалов при строительстве, реконструкции, ремонте и содержании автомобильных дорог, а также управления дорожными активами автомобильных дорог областного, районного значения и улиц населенных пунктов»
    kaz: «Автомобиль жолдарын салу, реконструкциялау, жөндеу және күтіп-ұстау кезінде жұмыстар мен материалдардың сапасына сараптама жүргізу жөніндегі жұмыстар мен қызметтер көрсету құнын айқындау, сондай-ақ облыстық, аудандық маңызы бар автомобиль жолдарының және елді мекендер көшелерінің жол активтерін басқару әдістемесін бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 25 маусымдағы № 426 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/179339/rus
