act_code: '137815'
requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 27 декабря 2019 года № 945. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2019 года № 19802
title:
  rus: Об утверждении Правил разработки, согласования, утверждения, регистрации, учета, изменения, пересмотра, отмены и введения в действие военных национальных стандартов, используемых для нужд Вооруженных Сил Республики Казахстан, других войск и воинских формирований
  kaz: Қазақстан Республикасы Қарулы Күштерінің, басқа әскерлер мен әскери құралымдардың мұқтаждары үшін пайдаланылатын әскери ұлттық стандарттарды әзірлеу, келісу, бекіту, тіркеу, есепке алу, өзгерту, қайта қарау, олардың күшін жою және қолданысқа енгізу қағидаларын бекіту туралы
