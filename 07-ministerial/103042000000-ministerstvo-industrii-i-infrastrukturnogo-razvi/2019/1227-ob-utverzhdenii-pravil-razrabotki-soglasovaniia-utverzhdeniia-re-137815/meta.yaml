  title:
    rus: О внесении изменений в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 27 декабря 2019 года № 945 «Об утверждении Правил разработки, согласования, утверждения, регистрации, учета, изменения, пересмотра, отмены и введения в действие военных национальных стандартов, используемых для нужд Вооруженных Сил Республики Казахстан, других войск и воинских формирований»
    kaz: «Қазақстан Республикасы Қарулы Күштерінің, басқа әскерлер мен әскери құралымдардың мұқтаждары үшін пайдаланылатын әскери ұлттық стандарттарды әзірлеу, келісу, бекіту, тіркеу, есепке алу, өзгерту, қайта қарау, олардың күшін жою және қолданысқа енгізу қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 27 желтоқсандағы № 945 бұйрығына өзгерістер енгізу туралы
