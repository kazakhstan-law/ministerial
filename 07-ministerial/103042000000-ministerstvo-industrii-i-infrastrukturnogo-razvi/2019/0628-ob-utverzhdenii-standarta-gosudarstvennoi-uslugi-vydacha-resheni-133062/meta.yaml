  title:
    rus: Об утверждении Правил оказания государственной услуги «Выдача решения на проведение комплекса работ по постутилизации объектов (снос строений)» и признании утратившим силу приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 28 июня 2019 года № 452 «Об утверждении стандарта государственной услуги «Выдача решения на проведение комплекса работ по постутилизации объектов (снос строений)»
    kaz: «Объектілерді кейіннен кәдеге жарату (құрылыстарды бұзу) жөніндегі жұмыстар кешенін жүргізуге рұқсат беру» мемлекеттік қызмет көрсету қағидаларын бекіту және «Объектілерді кейіннен кәдеге жарату (құрылыстарды бұзу) жөніндегі жұмыстар кешенін жүргізуге рұқсат беру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 28 маусымдағы № 452 бұйрығының күшін жою туралы
