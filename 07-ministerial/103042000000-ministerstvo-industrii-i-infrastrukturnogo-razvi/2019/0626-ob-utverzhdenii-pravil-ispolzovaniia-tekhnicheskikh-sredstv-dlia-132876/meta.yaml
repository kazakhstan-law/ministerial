  title:
    rus: О внесении изменения и дополнений в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 26 июня 2019 года № 436 «Об утверждении Правил использования технических средств для фиксации фактов совершения административных правонарушений и действий сотрудниками органов транспортного контроля»
    kaz: «Көліктік бақылау органдары қызметкерлерінің әкімшілік құқық бұзушылықтар және әрекеттер жасау фактілерін тіркеп алу үшін техникалық құралдарды пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 26 маусымдағы № 436 бұйрығына өзгеріс пен толықтырулар енгізу туралы
