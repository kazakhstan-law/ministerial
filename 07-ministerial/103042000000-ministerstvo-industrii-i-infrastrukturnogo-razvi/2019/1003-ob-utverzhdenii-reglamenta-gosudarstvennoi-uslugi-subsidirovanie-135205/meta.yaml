act_code: '135205'
requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 3 октября 2019 года № 752. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 октября 2019 года № 19463. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 29 апреля 2020 года № 244 (вводится в действие по истечении двадцати одного календарного дня после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Субсидирование ставок вознаграждения по выдаваемым кредитам банками второго уровня субъектам частного предпринимательства для целей жилищного строительства»
  kaz: «Тұрғын үй құрылысы мақсаттары үшін жеке кәсіпкерлік субъектілеріне екінші деңгейдегі банктер беретін кредиттер бойынша сыйақы мөлшерлемелерін субсидиялау» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
