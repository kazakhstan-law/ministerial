title:
  rus: Об утверждении положений Республиканского государственного учреждения «Комитет технического регулирования и метрологии Министерства индустрии и инфраструктурного развития Республики Казахстан» и его территориальных подразделений
  kaz: «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігі Техникалық peттеу және метрология комитеті» республикалық мемлекеттік мекемесінің және оның aумақтық бөлімшелерінің ережелерін бекіту туралы
