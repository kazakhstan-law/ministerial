requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 15 января 2019 года № 12. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 января 2019 года № 18197. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 8 сентября 2020 года № 457 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача заключения (разрешительного документа) на помещение минерального сырья под таможенную процедуру переработки вне таможенной территории»
  kaz: «Минералды шикізатты кеден аумағынан тыс жерде қайта өңдеудің кедендік рәсімімен орналастыруға қорытынды (рұқсат құжатын) беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
