act_code: '129232'
requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 11 февраля 2019 года № 70. Утратил силу приказом Министра транспорта Республики Казахстан от 29 сентября 2023 года № 17
title:
  rus: Об утверждении Положений государственных учреждений «Комитет гражданской авиации Министерства индустрии и инфраструктурного развития Республики Казахстан» и «Межрегиональная инспекция по безопасности полетов Комитета гражданской авиации Министерства индустрии и инфраструктурного развития Республики Казахстан»
  kaz: «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің Азаматтық авиация комитеті» және «Қазақстан Республикасының Индустрия және инфрақұрылымдық даму министрлігі Азаматтық авиация комитетінің Өңіраралық ұшу қауіпсіздігі инспекциясы» мемлекеттік мекемелерінің ережелерін бекіту туралы
