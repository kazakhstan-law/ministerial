  title:
    rus: О внесении изменений в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 11 февраля 2019 года № 70 «Об утверждении Положений государственных учреждений «Комитет гражданской авиации Министерства индустрии и инфраструктурного развития Республики Казахстан» и «Межрегиональная инспекция по безопасности полетов Комитета гражданской авиации Министерства индустрии и инфраструктурного развития Республики Казахстан»
    kaz: «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің Азаматтық авиация комитеті» және «Қазақстан Республикасының Индустрия және инфрақұрылымдық даму министрлігі Азаматтық авиация комитетінің Өңіраралық ұшу қауіпсіздігі инспекциясы» мемлекеттік мекемелерінің ережелерін бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 11 ақпандағы № 70 бұйрығына өзгерістер енгізу туралы
