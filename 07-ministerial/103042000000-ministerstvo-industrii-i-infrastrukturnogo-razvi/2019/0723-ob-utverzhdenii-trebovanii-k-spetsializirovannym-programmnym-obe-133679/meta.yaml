title:
  rus: Об утверждении требований к специализированным программным обеспечениям, осуществляющим информационное взаимодействие с единой информационной системой обязательного технического осмотра механических транспортных средств и прицепов к ним
  kaz: Механикалық көлік құралдары мен олардың тіркемелерін міндетті техникалық қарап-тексерудің бірыңғай ақпараттық жүйесімен ақпараттық өзара іс-қимыл жасауды жүзеге асыратын мамандандырылған бағдарламалық қамтылымдарға қойылатын талаптарды бекіту туралы
