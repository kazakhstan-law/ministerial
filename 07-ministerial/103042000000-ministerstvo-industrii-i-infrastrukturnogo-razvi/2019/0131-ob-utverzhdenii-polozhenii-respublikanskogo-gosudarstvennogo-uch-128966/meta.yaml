  code: '136112'
  requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 8 ноября 2019 года № 836. Утратил силу приказом и.о. Министра транспорта Республики Казахстан от 18 апреля 2025 года № 124 (вступает в силу со дня его подписания)
  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 31 января 2019 года № 58 «Об утверждении положений республиканского государственного учреждения «Комитет транспорта Министерства индустрии и инфраструктурного развития Республики Казахстан» и его территориальных подразделений»
    kaz: «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің Көлік комитеті» республикалық мемлекеттік мекемесінің және оның aумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушысының 2019 жылғы 31 қаңтардағы № 58 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/136112/rus
