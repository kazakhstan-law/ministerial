  requisite: Приказ и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 20 сентября 2019 года № 731. Утратил силу приказом и.о. Министра транспорта Республики Казахстан от 18 апреля 2025 года № 124 (вступает в силу со дня его подписания)
  title:
    rus: О внесении изменений и дополнений в приказ Министра индустрии и инфраструктурного Республики Казахстан от 31 января 2019 года № 58 «Об утверждении положений государственного учреждения «Комитет транспорта Министерства индустрии и инфраструктурного развития Республики Казахстан» и его территориальных подразделений»
    kaz: «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің Көлік комитеті» мемлекеттік мекемесінің және оның aумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 31 қаңтардағы № 58 бұйрығына өзгерістер мен толықтырулар енгізу туралы
