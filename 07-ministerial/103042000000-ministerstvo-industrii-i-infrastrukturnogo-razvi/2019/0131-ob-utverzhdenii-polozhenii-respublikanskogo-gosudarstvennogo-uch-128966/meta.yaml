act_code: '128966'
requisite: Приказ и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 31 января 2019 года № 58. Утратил силу приказом и.о. Министра транспорта Республики Казахстан от 18 апреля 2025 года № 124 (вступает в силу со дня его подписания)
title:
  rus: Об утверждении положений республиканского государственного учреждения «Комитет транспорта Министерства индустрии и инфраструктурного развития Республики Казахстан» и его территориальных подразделений
  kaz: «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің Көлік комитеті» республикалық мемлекеттік мекемесінің және оның aумақтық бөлімшелерінің ережелерін бекіту туралы
