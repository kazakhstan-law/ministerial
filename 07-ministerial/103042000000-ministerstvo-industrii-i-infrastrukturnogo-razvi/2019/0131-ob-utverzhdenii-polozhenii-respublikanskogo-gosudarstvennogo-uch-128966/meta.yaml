  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 31 января 2019 года № 58 «Об утверждении положений республиканского государственного учреждения «Комитет транспорта Министерства индустрии и инфраструктурного развития Республики Казахстан» и его территориальных подразделений»
    kaz: «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің Көлік комитеті» республикалық мемлекеттік мекемесінің және оның aумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2019 жылғы 31 қаңтардағы № 58 бұйрығына өзгерістер мен толықтырулар енгізу туралы»
