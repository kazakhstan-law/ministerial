  title:
    rus: О внесении изменений и дополнений в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 7 февраля 2019 года № 67 «Об утверждении положений республиканского государственного учреждения «Комитет индустриального развития и промышленной безопасности Министерства индустрии и инфраструктурного развития Республики Казахстан» и его территориальных подразделений»
    kaz: «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің Индустриялық даму және өнеркәсіптік қауіпсіздік комитеті» республикалық мемлекеттік мекемесінің және оның aумақтық бөлімшелерінің ережелерін бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 7 ақпандағы № 67 бұйрығына өзгерістер мен толықтырулар енгізу туралы»
