act_code: '129146'
requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 7 февраля 2019 года № 67. Утратил силу приказом и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 28 октября 2020 года № 561 (вводится в действие со дня его подписания)
title:
  rus: Об утверждении Положений Республиканского государственного учреждения «Комитет индустриального развития и промышленной безопасности Министерства индустрии и инфраструктурного развития Республики Казахстан» и его территориальных подразделений
  kaz: «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің Индустриялық даму және өнеркәсіптік қауіпсіздік комитеті» республикалық мемлекеттік мекемесінің және оның аумақтық бөлімшелерінің ережелерін бекіту туралы
