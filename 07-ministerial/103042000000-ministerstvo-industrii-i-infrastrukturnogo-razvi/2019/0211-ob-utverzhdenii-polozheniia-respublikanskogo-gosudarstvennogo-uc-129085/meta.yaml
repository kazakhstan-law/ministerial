  title:
    rus: О внесении изменений и дополнения в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 11 февраля 2019 года № 71 «Об утверждении Положения республиканского государственного учреждения «Комитет автомобильных дорог Министерства индустрии и инфраструктурного развития Республики Казахстан»
    kaz: «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің Автомобиль жолдары комитеті» республикалық мемлекеттік мекемесінің ережесін бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 11 ақпандағы № 71 бұйрығына өзгерістер мен толықтыру енгізу туралы
