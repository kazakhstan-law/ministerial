title:
  rus: Об утверждении положения Республиканского государственного учреждения «Комитет автомобильных дорог Министерства индустрии и инфраструктурного развития Республики Казахстан»
  kaz: «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің Автомобиль жолдары комитеті» республикалық мемлекеттік мекемесінің ережесін бекіту туралы
