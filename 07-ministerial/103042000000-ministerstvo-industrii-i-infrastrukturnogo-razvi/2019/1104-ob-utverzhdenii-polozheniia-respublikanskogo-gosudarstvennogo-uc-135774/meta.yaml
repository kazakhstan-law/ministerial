    kaz: «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің Мемлекеттік қорғаныстық тапсырыс комитеті» республикалық мемлекеттік мекемесінің ережесін бекiту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 4 қарашадағы № 822 бұйрығына толықтыру енгізу туралы
