title:
  rus: Об утверждении Правил регистрации деятельности по перевозке грузов грузовыми и специализированными автотранспортными средствами, а также оказанию услуг специальными автомобилями в территориальном подразделении уполномоченного органа в области автомобильного транспорта
  kaz: Автомобиль көлiгi саласындағы уәкілетті органның аумақтық бөлімшесінде жүктерді жүк таситын және мамандандырылған автокөлік құралдарымен тасымалдау, сондай-ақ арнаулы автомобильдермен қызметтер көрсету жөніндегі қызметті тіркеу қағидаларын бекіту туралы
