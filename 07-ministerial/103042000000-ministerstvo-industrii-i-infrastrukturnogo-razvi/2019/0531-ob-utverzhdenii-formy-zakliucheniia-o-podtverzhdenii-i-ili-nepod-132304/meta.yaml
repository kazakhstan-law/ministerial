  title:
    rus: О признании утратившим силу приказа Министра индустрии и инфраструктурного развития Республики Казахстан от 31 мая 2019 года № 346 «Об утверждении формы заключения о подтверждении и (или) неподтверждении выявленных нарушений по результатам профилактического контроля без посещения субъекта (объекта) контроля в сфере реализации ювелирных и других изделий из драгоценных металлов и драгоценных камней»
    kaz: «Бағалы металдар мен асыл тастардан жасалған зергерлік және басқа да бұйымдарды өткізу саласында бақылау субъектісіне (объектісіне) бармай профилактикалық бақылау нәтижелері бойынша анықталған бұзушылықтарды растау және (немесе) растамау туралы қорытындының нысанын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 31 мамырдағы № 346 бұйрығының күші жойылды деп тану туралы
