act_code: '132304'
requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 31 мая 2019 года № 346. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 июня 2019 года № 18785. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 7 июня 2021 года № 281 (вводится в действие с 1 июля 2021 года)
title:
  rus: Об утверждении формы заключения о подтверждении и (или) неподтверждении выявленных нарушений по результатам профилактического контроля без посещения субъекта (объекта) контроля в сфере реализации ювелирных и других изделий из драгоценных металлов и драгоценных камней
  kaz: Бағалы металдар мен асыл тастардан жасалған зергерлік және басқа да бұйымдарды өткізу саласында бақылау субъектісіне (объектісіне) бармай профилактикалық бақылау нәтижелері бойынша анықталған бұзушылықтарды растау және (немесе) растамау туралы қорытындының нысанын бекіту туралы
