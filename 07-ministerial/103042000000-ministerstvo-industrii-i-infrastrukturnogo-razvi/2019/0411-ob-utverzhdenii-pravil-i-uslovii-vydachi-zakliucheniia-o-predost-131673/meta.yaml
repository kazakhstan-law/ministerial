act_code: '131673'
requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 11 апреля 2019 года № 211. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 апреля 2019 года № 18532. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 14 октября 2025 года № 434 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и условий выдачи заключения о предоставлении организациям полномочий или об отказе в предоставлении полномочий по оформлению паспортов транспортных средств (паспортов шасси транспортных средств) и паспортов самоходных машин и других видов техники, в том числе оформлению электронных паспортов транспортных средств (паспортов шасси транспортных средств) и электронных паспортов самоходных машин и других видов техники
  kaz: Көлік құралдарының паспорттарын (көлік құралдары шассилерінің паспорттарын) және өздігінен жүретін машиналар мен басқа да техника түрлерінің паспорттарын ресімдеу, оның ішінде көлік құралдарының электрондық паспорттарын (көлік құралдары шассилерінің паспорттарын) және өздігінен жүретін машиналар мен басқа да техника түрлерінің электрондық паспорттарын ресімдеу жөніндегі өкілеттіктерді ұйымдарға беру туралы немесе өкілеттіктерді беруден бас тарту туралы қорытынды беру қағидалары мен шарттарын бекіту туралы
