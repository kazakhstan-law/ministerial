  title:
    rus: О внесении изменения в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 11 апреля 2019 года № 211 «Об утверждении Правил и условий выдачи заключения о предоставлении организациям полномочий или об отказе в предоставлении полномочий по оформлению паспортов транспортных средств (паспортов шасси транспортных средств) и паспортов самоходных машин и других видов техники, в том числе оформлению электронных паспортов транспортных средств (паспортов шасси транспортных средств) и электронных паспортов самоходных машин и других видов техники»
    kaz: «Көлік құралдарының паспорттарын (көлік құралдары шассилерінің паспорттарын) және өздігінен жүретін машиналар мен басқа да техника түрлерінің паспорттарын ресімдеу, оның ішінде көлік құралдарының электрондық паспорттарын (көлік құралдары шассилерінің паспорттарын) және өздігінен жүретін машиналар мен басқа да техника түрлерінің электрондық паспорттарын ресімдеу жөніндегі өкілеттіктерді ұйымдарға беру туралы немесе өкілеттіктерді беруден бас тарту туралы қорытынды беру қағидалары мен шарттарын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 11 сәуірдегі № 211 бұйрығына өзгеріс енгізу туралы
