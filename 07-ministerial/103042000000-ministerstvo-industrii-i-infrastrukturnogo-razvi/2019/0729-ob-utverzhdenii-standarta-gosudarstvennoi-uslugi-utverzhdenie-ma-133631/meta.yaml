requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 29 июля 2019 года № 567. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 июля 2019 года № 19163. Утратил силу приказом и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 29 апреля 2020 года № 251 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Утверждение маршрутов и расписания движений регулярных городских (сельских), пригородных и внутрирайонных автомобильных перевозок пассажиров и багажа»
  kaz: «Жолаушылар мен багажды автомобильмен қалалық (ауылдық), қала маңындағы және ауданішілік тұрақты тасымалдау маршруттарын және қозғалыс кестелерiн бекiту» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
