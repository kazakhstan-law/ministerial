  title:
    rus: О внесении изменения в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 30 января 2019 года № 55 «Об утверждении Положения республиканского государственного учреждения «Комитет по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и инфраструктурного развития Республики Казахстан»
    kaz: «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің Құрылыс және тұрғын үй-коммуналдық шаруашылық істері комитеті» республикалық мемлекеттік мекемесінің ережесін бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2019 жылғы 30 қаңтардағы № 55 бұйрығына өзгеріс енгізу туралы
