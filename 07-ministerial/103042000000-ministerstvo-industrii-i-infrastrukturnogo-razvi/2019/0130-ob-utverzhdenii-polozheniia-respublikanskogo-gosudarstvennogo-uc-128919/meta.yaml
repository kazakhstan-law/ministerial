title:
  rus: Об утверждении Положения республиканского государственного учреждения «Комитет по делам строительства и жилищно-коммунального хозяйства Министерства индустрии и инфраструктурного развития Республики Казахстан»
  kaz: «Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің Құрылыс және тұрғын үй-коммуналдық шаруашылық істері комитеті» республикалық мемлекеттік мекемесінің ережесін бекіту туралы
