  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 11 июля 2019 года № 500 «Об утверждении Правил представления управляющей компанией специальной экономической и индустриальной зон отчетности»
    kaz: «Арнайы экономикалық және индустриялық аймақтардың басқарушы компаниясының есептілікті ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2019 жылғы 11 шілдедегі № 500 бұйрығына өзгеріс енгізу туралы
