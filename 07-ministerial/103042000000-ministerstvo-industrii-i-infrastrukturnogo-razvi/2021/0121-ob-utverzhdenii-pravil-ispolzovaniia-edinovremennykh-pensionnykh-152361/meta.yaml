  title:
    rus: О внесении изменений и дополнения в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 21 января 2021 года № 24 «Об утверждении Правил использования единовременных пенсионных выплат для улучшения жилищных условий в соответствии с законодательством Республики Казахстан»
    kaz: «Қазақстан Республикасының заңнамасына сәйкес тұрғын үй жағдайларын жақсарту үшін біржолғы зейнетақы төлемдерін пайдалану қағидасын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2021 жылғы 21 қаңтардағы № 24 бұйрығына өзгерістер мен толықтыру енгізу туралы
