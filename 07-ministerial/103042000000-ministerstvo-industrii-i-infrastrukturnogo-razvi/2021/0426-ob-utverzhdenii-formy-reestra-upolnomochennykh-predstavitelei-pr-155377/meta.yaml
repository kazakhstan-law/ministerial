  title:
    rus: О внесении изменений в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 26 апреля 2021 года № 196 «Об утверждении формы реестра уполномоченных представителей, применяющих освобождение от налога на добавленную стоимость при реализации транспортных средств и (или) сельскохозяйственной техники, приобретенных у их производителя»
    kaz: «Өндірушіден сатып алынған көлік құралдарын және (немесе) ауыл шаруашылығы техникасын өткізу кезінде қосылған құн салығынан босатуды қолданатын уәкілетті өкілдердің тізілімі нысанын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2021 жылғы 26 сәуірдегі № 196 бұйрығына өзгерістер енгізу туралы
