title:
  rus: Об утверждении формы реестра уполномоченных представителей, применяющих освобождение от налога на добавленную стоимость при реализации транспортных средств и (или) сельскохозяйственной техники, приобретенных у их производителя
  kaz: Өндірушіден сатып алынған көлік құралдарын және (немесе) ауыл шаруашылығы техникасын өткізу кезінде қосылған құн салығынан босатуды қолданатын уәкілетті өкілдердің тізілімі нысанын бекіту туралы
