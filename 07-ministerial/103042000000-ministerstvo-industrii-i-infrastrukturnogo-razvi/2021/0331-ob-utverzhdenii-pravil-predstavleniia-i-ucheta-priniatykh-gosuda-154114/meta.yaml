  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 10 апреля 2020 года № 195 «Об утверждении модельных контрактов по видам операций по недропользованию» и приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 31 марта 2021 года № 144 «Об утверждении Правил представления и учета принятых государственным органом обеспечений исполнения обязательств по ликвидации последствий операций по недропользованию»
    kaz: «Жер қойнауын пайдалану жөніндегі операциялардың түрлері бойынша модельдік келісімшарттарды бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетің атқарушы 2020 жылғы 10 сәуірдегі № 195 бұйрығына және «Мемлекеттік орган қабылдаған жер қойнауын пайдалану жөніндегі операциялардың салдарын жою бойынша міндеттемелерді орындауды қамтамасыз етулерді ұсыну және есепке алу қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2021 жылғы 31 наурыздағы № 144 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/179785/rus
