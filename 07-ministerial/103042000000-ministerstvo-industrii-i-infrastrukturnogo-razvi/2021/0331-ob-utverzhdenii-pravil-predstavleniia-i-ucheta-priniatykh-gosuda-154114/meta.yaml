title:
  rus: Об утверждении Правил представления и учета принятых государственным органом обеспечений исполнения обязательств по ликвидации последствий операций по недропользованию
  kaz: Мемлекеттік орган қабылдаған жер қойнауын пайдалану жөніндегі операциялардың салдарын жою бойынша міндеттемелерді орындауды қамтамасыз етулерді ұсыну және есепке алу қағидаларын бекіту туралы
