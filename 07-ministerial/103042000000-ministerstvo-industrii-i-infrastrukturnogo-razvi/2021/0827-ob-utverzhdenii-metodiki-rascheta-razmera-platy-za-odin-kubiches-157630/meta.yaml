  title:
    rus: О внесении изменений в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 27 августа 2021 года № 470 «Об утверждении Методики расчета размера платы за один кубический метр поданной питьевой воды населению из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения»
    kaz: «Ауыз сумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды топтық және оқшау жүйелерінен халыққа берілген ауызсудың бір текше метрі үшін төлемақы мөлшерін есептеу әдістемесін бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2021 жылғы 27 тамыздағы № 470 бұйрығына өзгерістер енгізу туралы
