requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 27 августа 2021 года № 470. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 августа 2021 года № 24170. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 22 августа 2025 года № 306 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики расчета размера платы за один кубический метр поданной питьевой воды населению из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения
  kaz: Ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды топтық және оқшау жүйелерінен халыққа берілген ауызсудың бір текше метрі үшін төлемақы мөлшерін есептеу әдістемесін бекіту туралы
