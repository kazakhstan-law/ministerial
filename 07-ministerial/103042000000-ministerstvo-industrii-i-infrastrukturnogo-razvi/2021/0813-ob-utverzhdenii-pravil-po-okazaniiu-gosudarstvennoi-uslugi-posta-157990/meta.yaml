act_code: '157990'
requisite: Приказ и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 13 августа 2021 года № 441. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 августа 2021 года № 24039. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 27 декабря 2023 года № 168 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил по оказанию государственной услуги «Постановка на учет и очередность, а также принятие местными исполнительными органами решения о предоставлении жилища гражданам, нуждающимся в жилище из государственного жилищного фонда или жилище, арендованном местным исполнительным органом в частном жилищном фонде»
  kaz: «Мемлекеттік тұрғын үй қорынан берілетін тұрғын үйге немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйге мұқтаж азаматтарды есепке алу және кезекке қою, сондай-ақ жергілікті атқарушы органдардың тұрғын үй беру туралы шешім қабылдауы» мемлекеттік қызмет көрсету жөніндегі қағидаларды бекіту туралы
