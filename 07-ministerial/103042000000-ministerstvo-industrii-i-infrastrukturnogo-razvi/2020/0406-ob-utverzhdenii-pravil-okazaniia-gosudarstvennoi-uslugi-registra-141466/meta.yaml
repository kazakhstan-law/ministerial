  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 6 апреля 2020 года № 187 «Об утверждении Правил оказания государственной услуги «Регистрация деклараций промышленной безопасности опасного производственного объекта»
    kaz: «Қауіпті өндіріс объектісінің өнеркәсіптік қауіпсіздік декларацияларын тіркеу» мемлекеттік қызметін көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2020 жылғы 6 сәуірдегі № 187 бұйрығына өзгеріс енгізу туралы
