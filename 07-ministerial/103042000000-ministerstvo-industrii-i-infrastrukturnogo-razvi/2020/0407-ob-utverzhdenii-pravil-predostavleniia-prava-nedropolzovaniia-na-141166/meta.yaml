  code: '159220'
  requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 4 октября 2021 года № 523. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 октября 2021 года № 24640
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 7 апреля 2020 года № 188 «Об утверждении Правил предоставления права недропользования на проведение разведки или добычи общераспространенных полезных ископаемых, используемых для целей строительства (реконструкции) и ремонта автомобильных дорог общего пользования, железных дорог, находящихся в государственной собственности, а также для реконструкции и ремонта гидросооружений и гидротехнических сооружений»
    kaz: «Мемлекеттік меншіктегі жалпыға ортақ пайдаланылатын автомобиль жолдарын, теміржолдарды салу (реконструкциялау) және жөндеу мақсаттары үшін, сондай-ақ гидроқұрылысжайларды және гидротехникалық құрылысжайларды реконструкциялау және жөндеу үшін пайдаланылатын кең таралған пайдалы қазбаларды барлауды немесе өндіруді жүргізуге жер қойнауын пайдалану құқығын беру қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2020 жылғы 7 сәуірдегі № 188 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/159220/rus
