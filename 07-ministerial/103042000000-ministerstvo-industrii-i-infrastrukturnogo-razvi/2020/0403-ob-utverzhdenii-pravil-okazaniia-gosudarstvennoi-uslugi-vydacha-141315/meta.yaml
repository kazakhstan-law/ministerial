  title:
    rus: О внесении изменений в некоторые приказы исполняющего обязанности Министра транспорта и коммуникаций Республики Казахстан, исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан и Министерства индустрии и инфраструктурного развития Республики Казахстан
    kaz: Қазақстан Республикасы Көлік және коммуникация министрінің міндетін атқарушының, Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының және Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің кейбір бұйрықтарына өзгерістер енгізу туралы
