    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 27 марта 2020 года № 159 «Об утверждении Правил регистрации местными исполнительными органами договоров участия в жилищно-строительном кооперативе»
    kaz: «Жергілікті атқарушы органдардың тұрғын үй-құрылыс кооперативіне қатысу шарттарын тіркеу қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2020 жылғы 27 наурыздағы № 159 бұйрығына өзгеріс пен толықтыру енгізу туралы
