caused_by:
  code: '214615'
  requisite: Приказ Министра промышленности и строительства Республики Казахстан от 22 сентября 2025 года № 381. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 сентября 2025 года № 36907
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 30 марта 2020 года № 166 «Об утверждении Методики расчета сметы расходов на управление объектом кондоминиума и содержание общего имущества объекта кондоминиума, а также методики расчета минимального размера расходов на управление объектом кондоминиума и содержание общего имущества объекта кондоминиума»
    kaz: «Кондоминиум объектісін басқаруға және кондоминиум объектісінің ортақ мүлкін күтіп-ұстауға арналған шығыстар сметасын есептеу әдістемесін, сондай-ақ кондоминиум объектісін басқаруға және кондоминиум объектісінің ортақ мүлкін күтіп-ұстауға арналған шығыстардың ең төмен мөлшерін есептеу әдістемесін бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрі міндетін атқарушының 2020 жылғы 30 наурыздағы № 166 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/214615/rus
