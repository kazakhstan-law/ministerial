title:
  rus: Об утверждении Методики расчета годовой сметы расходов на управление объектом кондоминиума, а также методики расчета минимального размера взносов на управление объектом кондоминиума
  kaz: Кондоминиум объектісін басқаруға арналған шығыстардың жылдық сметасын есептеу әдістемесін, сондай-ақ кондоминиум объектісін басқаруға арналған жарналардың ең төмен мөлшерін есептеу әдістемесін бекіту туралы
