  title:
    rus: О внесении изменений в некоторые приказы Министерства индустрии и инфраструктурного развития Республики Казахстан в сфере оказания государственных услуг в области промышленной безопасности
    kaz: Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің өнеркәсіптік қауіпсіздік саласында мемлекеттік қызметтер көрсету саласындағы кейбір бұйрықтарына өзгерістер енгізу туралы
