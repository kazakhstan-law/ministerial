title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача разрешений на применение технологий, применяемых на опасных производственных объектах, опасных технических устройств»
  kaz: «Қауіпті өндірістік объектілерде қолданылатын технологияларды, қауіпті техникалық құрылғыларды қолдануға рұқсаттар беру» мемлекеттік қызметін көрсету қағидаларын бекіту туралы
