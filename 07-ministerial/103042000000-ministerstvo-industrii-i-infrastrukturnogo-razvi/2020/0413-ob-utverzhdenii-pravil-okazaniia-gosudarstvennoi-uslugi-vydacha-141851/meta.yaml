title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача лицензии на осуществление деятельности по ликвидации посредством уничтожения, утилизации, захоронения и переработке высвобождаемых боеприпасов, вооружений, военной техники, специальных средств»
  kaz: «Босатылатын оқ-дәрілерді, қару-жарақтарды, әскери техниканы, арнайы құралдарды құртып жіберу, кәдеге жарату, көму арқылы жою және қайта өңдеу жөніндегі қызметті жүзеге асыруға лицензия беру» мемлекеттік қызметті көрсету қағидаларын бекіту туралы
