  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 31 декабря 2020 года № 706 «Об утверждении Правил эксплуатации беспилотных летательных аппаратов в воздушном пространстве Республики Казахстан»
    kaz: «Қазақстан Республикасының әуе кеңістігінде пилотсыз ұшу аппараттарын пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2020 жылғы 31 желтоқсандағы № 706 бұйрығына өзгерістер енгізу туралы
