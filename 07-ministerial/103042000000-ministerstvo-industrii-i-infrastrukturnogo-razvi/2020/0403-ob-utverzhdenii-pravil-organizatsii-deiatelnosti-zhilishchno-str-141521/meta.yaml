  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 3 апреля 2020 года № 180 «Об утверждении Правил организации деятельности жилищно-строительного кооператива и оплаты паевых взносов членами жилищно-строительного кооператива и типовой формы договора участия в жилищно-строительном кооперативе, а также типового устава жилищно-строительного кооператива»
    kaz: «Тұрғын үй-құрылыс кооперативінің қызметін ұйымдастыру және тұрғын үй-құрылыс кооперативі мүшелерінің пай жарналарын төлеу қағидаларын және тұрғын үй-құрылыс кооперативіне қатысу шартының үлгілік нысанын, сондай-ақ тұрғын үй-құрылыс кооперативінің үлгілік жарғысын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің м.а. 2020 жылғы 3 сәуірдегі № 180 бұйрығына өзгерістер енгізу туралы
