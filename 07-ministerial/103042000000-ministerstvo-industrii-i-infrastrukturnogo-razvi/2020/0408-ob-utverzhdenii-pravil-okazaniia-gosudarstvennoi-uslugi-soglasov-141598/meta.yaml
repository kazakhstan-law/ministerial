requisite: Приказ и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 8 апреля 2020 года № 189. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 апреля 2020 года № 20371. Утратил силу приказом и.о. Министра по чрезвычайным ситуациям Республики Казахстан от 16 сентября 2021 года № 454 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания государственной услуги «Согласование проектной документации на строительство, расширение, реконструкцию, модернизацию, консервацию и ликвидацию опасных производственных объектов»
  kaz: «Қауіпті өндірістік объектілерді салуға, кеңейтуге, реконструкциялауға, жаңғыртуға, консервациялауға және жоюға арналған жобалау құжаттамасын келісу» мемлекеттік қызметін көрсету қағидаларын бекіту туралы
