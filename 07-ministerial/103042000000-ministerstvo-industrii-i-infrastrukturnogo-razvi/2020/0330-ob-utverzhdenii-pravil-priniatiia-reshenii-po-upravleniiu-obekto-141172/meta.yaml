title:
  rus: Об утверждении Правил принятия решений по управлению объектом кондоминиума, а также типовых форм протоколов собрания собственников квартир, нежилых помещений, многоквартирного жилого дома и форм ежемесячного и годового отчетов по управлению объектом кондоминиума
  kaz: Кондоминиум объектісін басқару жөніндегі шешімдерді қабылдау қағидаларын, сондай-ақ пәтерлердің, тұрғын емес үй-жайлардың, көппәтерлі тұрғын үйлердің меншік иелері жиналыстары хаттамаларының үлгілік нысандарын және кондоминиум объектісін басқару жөніндегі айлық және жылдық есептердің нысандарын бекіту туралы
