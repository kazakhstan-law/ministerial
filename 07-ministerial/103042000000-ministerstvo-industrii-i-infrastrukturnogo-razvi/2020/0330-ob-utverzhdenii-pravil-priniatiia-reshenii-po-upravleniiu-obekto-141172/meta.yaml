  title:
    rus: О внесении изменений в Приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 30 марта 2020 года № 163 «Об утверждении Правил принятия решений по управлению объектом кондоминиума и содержанию общего имущества объекта кондоминиума, а также типовые формы протоколов собрания»
    kaz: «Кондоминиум объектісін басқару және кондоминиум объектісінің ортақ мүлкін күтіп-ұстау жөніндегі шешімдерді қабылдау қағидаларын, сондай-ақ жиналыс хаттамаларының үлгілік нысандарын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2020 жылғы 30 наурыздағы № 163 бұйрығына өзгерістер енгізу туралы»
  link: https://zan.gov.kz/client/#!/doc/191191/rus
