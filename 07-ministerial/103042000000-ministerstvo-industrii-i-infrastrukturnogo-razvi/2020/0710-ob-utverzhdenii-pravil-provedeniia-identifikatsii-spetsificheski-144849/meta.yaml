    kaz: «Тауарларды, технологияларды, жұмыстарды, көрсетілетін қызметтерді, ақпаратты өнімге жатқызу туралы қорытынды беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2020 жылғы 10 шiлдедегi № 394 бұйрығына өзгерістер енгізу туралы
