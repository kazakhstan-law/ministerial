act_code: '141042'
requisite: Приказ и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 30 марта 2020 года № 161. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 апреля 2020 года № 20260. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 24 марта 2022 года № 148 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении формы и срока представления отчетности о закупленном и реализованном ломе и отходах цветных и черных металлов юридическими лицами, осуществляющими деятельность по сбору (заготовке), хранению, переработке и реализации лома и отходов цветных и черных металлов
  kaz: Түсті және қара металдардың сынықтары мен қалдықтарын жинау (дайындау), сақтау, қайта өңдеу және өткізу жөніндегі қызметті жүзеге асыратын заңды тұлғалар сатып алған және өткізлген түсті және қара металл сынықтары мен қалдықтары туралы есептілікті ұсыну нысаны мен мерзімін айқындау туралы
