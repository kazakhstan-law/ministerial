  requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 29 апреля 2021 года № 205. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 мая 2021 года № 22693. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 24 марта 2022 года № 148 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития от 30 марта 2020 года № 161 «Об определении формы и срока представления отчетности о закупленном и реализованном ломе и отходах цветных и черных металлов юридическими лицами, осуществляющими деятельность по сбору (заготовке), хранению, переработке и реализации лома и отходов цветных и черных металлов»
    kaz: Түсті және қара металдардың сынықтары мен қалдықтарын жинау (дайындау), сақтау, қайта өңдеу және өткізу жөніндегі қызметті жүзеге асыратын заңды тұлғалар сатып алған және өткізілген түсті және қара металл сынықтары мен қалдықтары туралы есептілікті ұсыну нысаны мен мерзімін айқындау туралы» Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2020 жылғы 30 наурыздағы № 161 бұйрығына өзгеріс енгізу туралы
