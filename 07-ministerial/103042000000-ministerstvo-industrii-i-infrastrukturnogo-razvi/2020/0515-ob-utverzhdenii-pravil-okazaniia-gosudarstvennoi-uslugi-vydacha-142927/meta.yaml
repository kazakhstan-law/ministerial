act_code: '142927'
requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 15 мая 2020 года № 292. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 мая 2020 года № 20658
title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача технического условия для проектирования на пересечение автомобильных дорог общего пользования международного и республиканского значения каналами, линиями связи и электропередачи, нефтепроводами, газопроводами, водопроводами и железными дорогами, другими инженерными сетями, коммуникациями, а также для строительства подъездных дорог и примыканий к автомобильным дорогам общего пользования международного и республиканского значения»
  kaz: «Халықаралық және республикалық маңызы бар ортақ пайдаланылатын автомобиль жолдарын байланыс және электр беру арналарының, желілерінің, мұнай құбырларының, газ құбырларының, су құбырларының және теміржолдардың, басқа да инженерлік желілердің, коммуникациялардың кесіп өтуін жобалау үшін, сондай-ақ кiрме жолдарды және халықаралық және республикалық маңызы бар ортақ пайдаланылатын автомобиль жолдарына жалғасатын жолдарды салу үшін техникалық шартты беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы
