  title:
    rus: О внесении изменений в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 15 мая 2020 года № 292 «Об утверждении Правил оказания государственной услуги «Выдача технического условия для проектирования на пересечение автомобильных дорог общего пользования международного и республиканского значения каналами, линиями связи и электропередачи, нефтепроводами, газопроводами, водопроводами и железными дорогами, другими инженерными сетями, коммуникациями, а также для строительства подъездных дорог и примыканий к автомобильным дорогам общего пользования международного и республиканского значения»
    kaz: «Халықаралық және республикалық маңызы бар ортақ пайдаланылатын автомобиль жолдарын байланыс және электр беру арналарының, желілерінің, мұнай құбырларының, газ құбырларының, су құбырларының және теміржолдардың, басқа да инженерлік желілердің, коммуникациялардың кесіп өтуін жобалау үшін, сондай-ақ кiрме жолдарды және халықаралық және республикалық маңызы бар ортақ пайдаланылатын автомобиль жолдарына жалғасатын жолдарды салу үшін техникалық шартты беру» мемлекеттік қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2020 жылғы 15 мамырдағы № 292 бұйрығына өзгерістер енгізу туралы
