requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 23 сентября 2020 года № 493. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 сентября 2020 года № 21252. Утратил силу приказом и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 30 мая 2022 года № 303 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и условий заключения, а также оснований для изменения и расторжения соглашения о промышленной сборке транспортных средств с юридическими лицами Республики Казахстан и его типовой формы
  kaz: Қазақстан Республикасының заңды тұлғаларымен көлік құралдарын өнеркәсіптік құрастыру туралы келісім жасасу қағидалары мен шарттары, сондай-ақ оны өзгерту және бұзу үшін негіздемелер және оның үлгілік нысанын бекіту туралы
