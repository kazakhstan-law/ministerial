  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 31 марта 2020 года № 172 «Об утверждении правил формирования, обработки, а также централизованного сбора и хранения информации в электронной форме, в том числе функционирования объектов информатизации в сфере жилищных отношений и жилищно-коммунального хозяйства»
    kaz: «Ақпаратты электрондық нысанда қалыптастыру, өңдеу, сондай-ақ орталықтандырылған түрде жинау және сақтау, оның ішінде тұрғын үй қатынастары және тұрғын үй-коммуналдық шаруашылық саласындағы ақпараттандыру объектілерінің жұмыс істеу қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2020 жылғы 31 наурыздағы № 172 бұйрығына өзгерістер енгізу туралы
