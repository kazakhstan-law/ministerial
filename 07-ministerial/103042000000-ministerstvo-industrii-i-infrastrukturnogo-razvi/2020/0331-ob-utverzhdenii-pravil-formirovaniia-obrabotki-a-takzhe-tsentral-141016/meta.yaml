title:
  rus: Об утверждении правил формирования, обработки, а также централизованного сбора и хранения информации в электронной форме, в том числе функционирования объектов информатизации в сфере жилищных отношений и жилищно-коммунального хозяйства
  kaz: Ақпаратты электрондық нысанда қалыптастыру, өңдеу, сондай-ақ орталықтандырылған түрде жинау және сақтау, оның ішінде тұрғын үй қатынастары және тұрғын үй-коммуналдық шаруашылық саласындағы ақпараттандыру объектілерінің жұмыс істеу қағидаларын бекіту туралы
