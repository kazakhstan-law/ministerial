  requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 9 мая 2020 года № 277. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 мая 2020 года № 20600. Действовал до 25 июня 2020 года в соответствии с пунктом 4 настоящего приказа
  title:
    rus: О внесении изменений в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 18 апреля 2020 года № 212 «Об утверждении Правил возмещения затрат поставщикам коммунальных услуг в режиме чрезвычайного положения в Республике Казахстан»
    kaz: «Төтенше жағдай кезеңінде коммуналдық қызметтерді жеткізушілердің шығындарын өтеу қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2020 жылғы 18 сәуірдегі № 212 бұйрығына өзгерістер енгізу туралы
