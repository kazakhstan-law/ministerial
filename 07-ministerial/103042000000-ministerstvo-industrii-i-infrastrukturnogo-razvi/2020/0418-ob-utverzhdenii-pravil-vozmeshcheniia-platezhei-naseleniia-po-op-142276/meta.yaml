title:
  rus: Об утверждении Правил возмещения платежей населения по оплате коммунальных услуг в режиме чрезвычайного положения в Республике Казахстан
  kaz: Қазақстан Республикасындағы төтенше жағдай режимінде коммуналдық қызметтердің төлемі бойынша халықтың төлемақысын өтеу қағидаларын бекіту туралы
