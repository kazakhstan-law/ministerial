  title:
    rus: О внесении изменений в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 22 апреля 2020 года № 219 «Об утверждении Правил оказания государственной услуги «Выдача документа об условиях переработки товаров на/вне таможенной территории Евразийского экономического союза и переработки товаров для внутреннего потребления в легкой, горно-металлургической, химической, фармацевтической, деревообрабатывающей отраслях промышленности, а также машиностроении и стройиндустрии»
    kaz: «Жеңіл, тау-кен металлургия, химия, фармацевтика, ағаш өңдеу өнеркәсібі салаларында, сондай-ақ машина жасау және құрылыс индустриясында тауарларды Еуразиялық экономикалық одақтың кедендік аумағында/аумағынан тыс қайта өңдеудің және ішкі тұтыну үшін қайта өңдеудің шарттары туралы құжатты беру» мемлекеттік қызметті көрсетудің қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2020 жылғы 22 сәуірдегі № 219 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/157126/rus
