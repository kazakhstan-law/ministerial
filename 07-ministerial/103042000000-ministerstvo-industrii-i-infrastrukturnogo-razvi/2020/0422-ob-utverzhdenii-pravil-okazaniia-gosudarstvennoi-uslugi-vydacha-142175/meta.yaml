act_code: '142175'
requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 22 апреля 2020 года № 219. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 апреля 2020 года № 20482
title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача документа об условиях переработки товаров на/вне таможенной территории Евразийского экономического союза и переработки товаров для внутреннего потребления в легкой, горно-металлургической, химической, деревообрабатывающей отраслях промышленности, а также машиностроении и стройиндустрии»
  kaz: «Жеңіл, тау-кен металлургия, химия, ағаш өңдеу өнеркәсібі салаларында, сондай-ақ машина жасау және құрылыс индустриясында тауарларды Еуразиялық экономикалық одақтың кедендік аумағында/аумағынан тыс қайта өңдеудің және ішкі тұтыну үшін қайта өңдеудің шарттары туралы құжатты беру» мемлекеттік қызметті көрсетудің қағидаларын бекіту туралы
