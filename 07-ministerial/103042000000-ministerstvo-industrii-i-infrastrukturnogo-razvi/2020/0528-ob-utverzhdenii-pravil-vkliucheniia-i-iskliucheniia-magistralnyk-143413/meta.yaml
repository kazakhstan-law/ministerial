title:
  rus: Об утверждении Правил включения и исключения магистральных, станционных путей и иных объектов магистральной железнодорожной сети из перечня магистральных, станционных путей и иных объектов, технологически необходимых для функционирования магистральной железнодорожной сети
  kaz: Магистральдық теміржол желісінің жұмыс істеуі үшін технологиялық қажетті магистральдық, станциялық жолдардың және өзге де объектілердің тізбесінен магистральдық, станциялық жолдарды және магистральдық теміржол желісінің өзге де объектілерін енгізу және алып тастау қағидалары
