  title:
    rus: О внесении изменений в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 28 мая 2020 года № 319 «Об утверждении Правил включения и исключения магистральных, станционных путей и иных объектов магистральной железнодорожной сети из перечня магистральных, станционных путей и иных объектов, технологически необходимых для функционирования магистральной железнодорожной сети»
    kaz: «Магистральдық теміржол желісінің жұмыс істеуі үшін технологиялық тұрғыдан қажетті магистральдық, станциялық жолдарды және өзге де объектілерді тізбеге енгізу және тізбеден шығару қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2020 жылғы 28 мамырдағы № 319 бұйрығына өзгерістер енгізу туралы
