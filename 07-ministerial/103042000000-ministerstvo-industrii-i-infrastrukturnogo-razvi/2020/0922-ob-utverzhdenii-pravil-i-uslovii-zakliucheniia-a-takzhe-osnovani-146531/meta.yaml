requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 22 сентября 2020 года № 491. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 сентября 2020 года № 21241. Утратил силу приказом и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 30 мая 2022 года № 304 (вводится в действие по истечении шестидесяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил и условий заключения, а также оснований для изменения и расторжения соглашения о промышленной сборке компонентов к транспортным средствам и (или) сельскохозяйственной технике с юридическими лицами Республики Казахстан и его типовой формы
  kaz: Қазақстан Республикасының заңды тұлғаларымен көлік құралдарына және (немесе) ауыл шаруашылығы техникасына компоненттерді өнеркәсіптік құрастыру туралы келісім жасасу қағидалары мен шарттарын, сондай-ақ оны өзгерту және бұзу үшін негіздемелерді және оның үлгілік нысанын бекіту туралы
