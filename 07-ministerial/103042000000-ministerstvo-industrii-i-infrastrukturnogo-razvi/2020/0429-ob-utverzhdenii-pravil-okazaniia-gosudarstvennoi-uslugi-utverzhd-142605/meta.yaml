title:
  rus: Об утверждении Правил оказания государственной услуги «Утверждение маршрутов и расписания движений регулярных городских (сельских), пригородных и внутрирайонных автомобильных перевозок пассажиров и багажа»
  kaz: «Жолаушылар мен багажды автомобильмен қалалық (ауылдық), қала маңындағы және ауданішілік тұрақты тасымалдау маршруттарын және қозғалыс кестелерiн бекiту» мемлекеттік қызметті көрсету қағидаларын бекіту туралы
