  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 29 апреля 2020 года № 251 «Об утверждении Правил оказания государственной услуги «Утверждение маршрутов и расписания движений регулярных городских (сельских), пригородных и внутрирайонных автомобильных перевозок пассажиров и багажа»
    kaz: «Жолаушылар мен багажды автомобильмен қалалық (ауылдық), қала маңындағы және ауданішілік тұрақты тасымалдау маршруттарын және қозғалыс кестелерiн бекiту» мемлекеттік қызметті көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2020 жылғы 29 сәуірдегі № 251 бұйрығына өзгерістер мен толықтыру енгізу туралы
