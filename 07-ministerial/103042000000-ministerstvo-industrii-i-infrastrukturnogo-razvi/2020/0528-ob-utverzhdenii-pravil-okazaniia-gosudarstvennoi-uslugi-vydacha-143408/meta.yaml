  title:
    rus: О внесении изменений и дополнений в некоторые приказы Министерства по инвестициям и развитию Республики Казахстан и Министерства индустрии и инфраструктурного развития Республики Казахстан
    kaz: Қазақстан Республикасы Инвестициялар және даму министрлігінің және Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрлігінің кейбір бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
