act_code: '143408'
requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 28 мая 2020 года № 318. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 июня 2020 года № 20791
title:
  rus: Об утверждении Правил оказания государственной услуги «Выдача лицензии на право занятия деятельностью по нерегулярной перевозке пассажиров автобусами, микроавтобусами в междугородном межобластном, межрайонном (междугородном внутриобластном) и международном сообщениях, а также регулярной перевозке пассажиров автобусами, микроавтобусами в международном сообщении»
  kaz: «Жолаушыларды облысаралық қалааралық, ауданаралық (облысішiлiк қалааралық) және халықаралық қатынаста автобустармен, шағын автобустармен тұрақты емес тасымалдау, сондай-ақ жолаушыларды халықаралық қатынаста автобустармен, шағын автобустармен тұрақты тасымалдау қызметімен айналысу құқығына лицензия беру» мемлекеттік қызметті көрсету қағидаларын бекіту туралы
