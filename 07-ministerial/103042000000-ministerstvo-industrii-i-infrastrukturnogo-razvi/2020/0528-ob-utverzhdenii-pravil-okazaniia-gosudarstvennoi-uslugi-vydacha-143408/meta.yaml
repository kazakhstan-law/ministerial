  title:
    rus: О внесении изменений в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 28 мая 2020 года № 318 «Об утверждении Правил оказания государственной услуги «Выдача лицензии на право занятия деятельностью по нерегулярной перевозке пассажиров автобусами, микроавтобусами в междугородном межобластном, межрайонном (междугородном внутриобластном) и международном сообщениях, а также регулярной перевозке пассажиров автобусами, микроавтобусами в международном сообщении»
    kaz: «Жолаушыларды облысаралық қалааралық, ауданаралық (облысішiлiк қалааралық) және халықаралық қатынаста автобустармен, шағын автобустармен тұрақты емес тасымалдау, сондай-ақ жолаушыларды халықаралық қатынаста автобустармен, шағын автобустармен тұрақты тасымалдау қызметімен айналысу құқығына лицензия беру» мемлекеттік қызметті көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2020 жылғы 28 мамырдағы № 318 бұйрығына өзгерістер енгiзу туралы
  link: https://zan.gov.kz/client/#!/doc/152483/rus
