  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 6 апреля 2020 года № 186 «Об утверждении Правил оказания государственной услуги «Аттестация юридических лиц на право проведения работ в области промышленной безопасности»
    kaz: «Заңды тұлғаларды өнеркәсіптік қауіпсіздік саласында жұмыстар жүргізу құқығына аттестаттау» мемлекеттік қызмет көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2020 жылғы 6 сәуірдегі № 186 бұйрығына өзгерістер енгізу туралы
