title:
  rus: Об утверждении Правил аттестации юридических лиц на право проведения работ в области промышленной безопасности
  kaz: Заңды тұлғаларды өнеркәсіптік қауіпсіздік саласындағы жұмыстарды жүргізу құқығына аттестаттау қағидаларын бекіту туралы
