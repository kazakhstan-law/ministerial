  kaz: Қазақстан Республикасының заңды тұлғаларымен ауыл шаруашылығы техникасын өнеркәсіптік құрастыру туралы келісімді жасасу қағидалары мен шарттарын, сондай-ақ оны өзгерту және бұзу үшін негіздер мен оның үлгілік нысанын бекіту туралы
