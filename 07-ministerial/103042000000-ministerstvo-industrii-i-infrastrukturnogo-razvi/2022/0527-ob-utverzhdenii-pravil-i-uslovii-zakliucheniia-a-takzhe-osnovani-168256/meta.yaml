  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 27 мая 2022 года № 293 «Об утверждении Правил и условий заключения, а также оснований для изменения и расторжения соглашения о промышленной сборке сельскохозяйственной техники с юридическими лицами Республики Казахстан и его типовой формы»
    kaz: «Қазақстан Республикасының заңды тұлғаларымен ауыл шаруашылығы техникасын өнеркәсіптік құрастыру туралы келісімді  жасасу қағидалары мен шарттарын, сондай-ақ оны өзгерту және бұзу үшін негіздер мен оның үлгілік нысанын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2022 жылғы 27 мамырдағы № 293 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/193082/rus
