  title:
    rus: О внесении изменений в приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 26 апреля 2022 года № 232 «Об утверждении Правил определения стоимости исследований, консалтинговых услуг и государственного задания в области индустрии и инфраструктурного развития»
    kaz: «Индустрия және инфрақұрылымдық даму саласындағы зерттеулердің, консалтингтік көрсетілетін қызметтердің және мемлекеттік тапсырманың құнын айқындау қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің 2022 жылғы 26 сәуірдегі № 232 бұйрығына өзгерістер енгізу туралы
