  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 30 мая 2022 года № 303 «Об утверждении Правил и условий заключения, а также оснований для изменения и расторжения соглашения о промышленной сборке транспортных средств с юридическими лицами Республики Казахстан и его типовой формы»
    kaz: «Қазақстан Республикасының заңды тұлғаларымен көлік құралдарын өнеркәсіптік құрастыру туралы келісімді жасасу қағидалары мен шарттарын, сондай-ақ оны өзгерту және бұзу үшін негіздемелерді және үлгілік нысанын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің м.а. 2022 жылғы 30 мамырдағы № 303 бұйрығына өзгерістер мен толықтыру енгізу туралы
