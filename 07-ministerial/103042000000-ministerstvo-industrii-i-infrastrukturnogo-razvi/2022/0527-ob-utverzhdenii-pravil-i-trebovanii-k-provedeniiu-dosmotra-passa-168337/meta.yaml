title:
  rus: Об утверждении Правил и требований к проведению досмотра пассажиров и лиц, посещающих объекты транспортной инфраструктуры, вещей, находящихся при них, в том числе ручной клади и багажа
  kaz: Жолаушыларды және көлік инфрақұрылымы объектілеріне келетін адамдарды, олардың алып жүретін заттарын, оның ішінде қол жүгі мен багажын жете тексеруді жүргізу қағидалары мен талаптарын бекіту туралы
