  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 31 мая 2022 года № 301 «Об утверждении Правил и требований к проведению досмотра пассажиров и лиц, посещающих объекты транспортной инфраструктуры, вещей, находящихся при них, в том числе ручной клади и багажа»
    kaz: «Жолаушыларды және көлік инфрақұрылымы объектілеріне келетін адамдарды, олардың алып жүретін заттарын, оның ішінде қол жүгі мен багажын жете тексеруді жүргізу қағидалары мен талаптарын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2022 жылғы 27 мамырдағы № 301 бұйрығына өзгерістер мен толықтыру енгізу туралы
