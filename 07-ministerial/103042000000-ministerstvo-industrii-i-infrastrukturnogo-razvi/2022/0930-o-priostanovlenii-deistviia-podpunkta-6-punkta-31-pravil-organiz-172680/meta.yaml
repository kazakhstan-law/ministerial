act_code: '172680'
requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 30 сентября 2022 года № 544. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 октября 2022 года № 30095
title:
  rus: О приостановлении действия подпункта 6) пункта 31 Правил организации и проведения обязательного технического осмотра механических транспортных средств и прицепов к ним, за исключением механических транспортных средств и прицепов к ним Вооруженных Сил, других войск и воинских формирований, утвержденных приказом исполняющего обязанности Министра по инвестициям и развитию Республики Казахстан от 26 марта 2015 года № 329
  kaz: Қазақстан Республикасы Инвестициялар және даму министрінің міндетін атқарушының 2015 жылғы 26 наурыздағы № 329 бұйрығымен бекітілген Қарулы Күштердің, басқа да әскерлер мен әскери құралымдардың механикалық көлік құралдары мен олардың тіркемелерін қоспағанда, механикалық көлік құралдары мен олардың тіркемелерін міндетті техникалық қарап-тексеруді ұйымдастыру және жүргізу қағидаларының 31-тармағының 6) тармақшасын қолданылуын тоқтата тұру туралы
