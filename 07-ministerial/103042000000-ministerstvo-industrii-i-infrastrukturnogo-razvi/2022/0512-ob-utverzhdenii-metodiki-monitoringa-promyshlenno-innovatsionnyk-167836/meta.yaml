  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 12 мая 2022 года № 265 «Об утверждении Методики мониторинга промышленно-инновационных проектов единой карты индустриализации» и в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 22 августа 2023 года № 592 «Об утверждении Правил включения промышленно-инновационных проектов в единую карту индустриализации»
    kaz: «Бірыңғай индустрияландыру картасының өнеркәсіптік-инновациялық жобаларын мониторингтеу әдістемесін бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2022 жылғы 12 мамырдағы № 265 бұйрығына және «Өнеркәсіптік-инновациялық жобаларды бірыңғай индустрияландыру картасына енгізу қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2023 жылғы 22 тамыздағы № 592 бұйрығына өзгерістер енгізу туралы
