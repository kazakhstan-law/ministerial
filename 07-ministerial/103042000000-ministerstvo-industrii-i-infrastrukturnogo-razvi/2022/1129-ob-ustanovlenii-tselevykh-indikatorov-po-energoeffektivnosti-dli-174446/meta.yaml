caused_by:
  code: '200661'
  requisite: Приказ и.о. Министра промышленности и строительства Республики Казахстан от 10 сентября 2024 года № 322. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 сентября 2024 года № 35067. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 6 марта 2026 года № 86 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 29 ноября 2022 года № 663 «Об установлении целевых индикаторов по энергоэффективности для субъектов Государственного энергетического реестра, потребляющих энергетические ресурсы в объеме, эквивалентном пятидесяти тысячам и более тонн условного топлива в год»
    kaz: «Жылына елу мың және одан да көп тонна шартты отынға барабар көлемде энергетикалық ресурстарды тұтынатын Мемлекеттік энергетикалық тізілім субъектілері үшін энергия тиімділігі бойынша нысаналы индикаторларды белгілеу туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2022 жылғы 29 қарашадағы № 663 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/200661/rus
