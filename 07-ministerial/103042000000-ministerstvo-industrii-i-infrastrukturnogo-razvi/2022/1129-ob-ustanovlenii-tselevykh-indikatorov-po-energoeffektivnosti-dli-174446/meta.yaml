requisite: Приказ и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 29 ноября 2022 года № 663. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 ноября 2022 года № 30790. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 6 марта 2026 года № 86 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении целевых индикаторов по энергоэффективности для субъектов Государственного энергетического реестра, потребляющих энергетические ресурсы в объеме, эквивалентном пятидесяти тысячам и более тонн условного топлива в год
  kaz: Жылына елу мың және одан да көп тонна шартты отынға барабар көлемде энергетикалық ресурстарды тұтынатын Мемлекеттік энергетикалық тізілім субъектілері үшін энергия тиімділігі бойынша нысаналы индикаторларды белгілеу туралы
