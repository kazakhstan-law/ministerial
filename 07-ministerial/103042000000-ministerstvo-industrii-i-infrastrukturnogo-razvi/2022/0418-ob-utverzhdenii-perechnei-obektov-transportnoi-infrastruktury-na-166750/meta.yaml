requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 18 апреля 2022 года № 213. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 апреля 2022 года № 27649
title:
  rus: Об утверждении перечней объектов транспортной инфраструктуры, на которых производится досмотр, лиц, в отношении которых не производится досмотр, веществ и предметов, запрещенных к вносу на объекты транспортной инфраструктуры
  kaz: Жете тексеру жүргізілетін көлік инфрақұрылымы объектілерінің, өздеріне қатысты жете тексеру жүргізілмейтін адамдардың, сондай-ақ көлік инфрақұрылымы объектілеріне әкелуге тыйым салынған заттар мен нәрселердің тізбелерін бекіту туралы
