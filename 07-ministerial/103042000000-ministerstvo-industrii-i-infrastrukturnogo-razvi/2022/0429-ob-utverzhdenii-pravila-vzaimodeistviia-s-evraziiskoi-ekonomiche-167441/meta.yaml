requisite: Приказ и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 29 апреля 2022 года № 243. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 мая 2022 года № 27943
title:
  rus: Об утверждении Правила взаимодействия с Евразийской экономической комиссией по вопросам формирования и ведения евразийского реестра промышленных товаров с учетом законодательства Республики Казахстан
  kaz: Қазақстан Республикасының заңнамасын ескере отырып, өнеркәсіптік тауарлардың Еуразиялық тізілімін қалыптастыру және жүргізу мәселелері бойынша Еуразиялық экономикалық комиссиямен өзара іс-қимыл жасау қағидаларын бекіту туралы
