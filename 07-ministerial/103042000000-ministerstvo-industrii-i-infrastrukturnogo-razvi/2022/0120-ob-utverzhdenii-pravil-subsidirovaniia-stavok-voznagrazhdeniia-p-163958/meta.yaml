    kaz: «Теміржолдарды жаңғыртуға кредит беру және қаржы лизингі кезінде сыйақы мөлшерлемелерін субсидиялау қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2022 жылғы 20 қаңтардағы № 21 бұйрығына өзгеріс енгізу туралы
