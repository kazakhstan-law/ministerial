  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 27 июня 2022 года № 367 «Об утверждении Правил конкурсного отбора территориальных кластеров, Правил формирования и ведения реестра территориальных кластеров и Правил предоставления мер государственного стимулирования промышленности в развитии территориальных кластеров»
    kaz: «Аумақтық кластерлерді конкурстық іріктеу қағидаларын, аумақтық кластерлердің тізілімін қалыптастыру және жүргізу қағидаларын және аумақтық кластерлерді дамытуда өнеркәсіпті мемлекеттік ынталандыру шараларын ұсыну қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2022 жылғы 27 маусымдағы № 367 бұйрығына өзгеріс енгізу туралы
