title:
  rus: Об утверждении Правил конкурсного отбора территориальных кластеров, Правил формирования и ведения реестра территориальных кластеров и Правил предоставления мер государственного стимулирования промышленности в развитии территориальных кластеров
  kaz: Аумақтық кластерлерді конкурстық іріктеу қағидаларын, аумақтық кластерлердің тізілімін қалыптастыру және жүргізу қағидаларын және аумақтық кластерлерді дамытуда өнеркәсіпті мемлекеттік ынталандыру шараларын ұсыну қағидаларын бекіту туралы
