title:
  rus: Об утверждении Правил учета сделок, связанных с переходом права собственности на минеральное сырье до аффинажа и (или) на необработанные драгоценные камни, а также использованием их в качестве залога
  kaz: Аффинаждауға дейінгі минералды шикізатқа және (немесе) өңделмеген бағалы тастарға меншік құқығының өтуіне, сондай-ақ оларды кепіл ретінде пайдалануға байланысты мәмілелерді есепке алу қағидаларын бекіту туралы
