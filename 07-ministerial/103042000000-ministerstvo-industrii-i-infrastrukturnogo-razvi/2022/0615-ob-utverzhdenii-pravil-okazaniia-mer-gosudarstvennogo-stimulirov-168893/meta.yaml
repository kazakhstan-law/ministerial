  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 15 июня 2022 года № 342 «Об утверждении Правил оказания мер государственного стимулирования промышленности, направленных на продвижение отечественных обработанных товаров, работ и услуг на внутренний рынок»
    kaz: «Отандық өңделген тауарларды, жұмыстар мен көрсетілетін қызметтерді ішкі нарыққа ілгерілетуге бағытталған өнеркәсіпті мемлекеттік ынталандыру шараларын көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2022 жылғы 15 маусымдағы № 342 бұйрығына өзгерістер мен толықтыру енгізу туралы
