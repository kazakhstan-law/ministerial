title:
  rus: Об утверждении Правил оказания мер государственного стимулирования промышленности, направленных на продвижение обработанных товаров, работ и услуг казахстанского происхождения на внутренний рынок
  kaz: Қазақстанда шығарылған өңделген тауарларды, жұмыстар мен көрсетілетін қызметтерді ішкі нарыққа ілгерілетуге бағытталған өнеркәсіпті мемлекеттік ынталандыру шараларын көрсету қағидаларын бекіту туралы
