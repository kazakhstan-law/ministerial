  title:
    rus: О внесении изменения в приказ исполняющего обязанности Министра индустрии и инфраструктурного развития Республики Казахстан от 11 мая 2022 года № 259 «Об установлении требований к юридическим лицам, осуществляющим деятельность по сбору (заготовке), хранению, переработке и реализации лома и отходов цветных и черных металлов в уведомительном порядке»
    kaz: «Түсті және қара металдардың сынығы мен қалдықтарын жинау (дайындау), сақтау, қайта өңдеу және өткізу жөніндегі қызметті хабарлама тәртібімен жүзеге асыратын заңды тұлғаларға қойылатын талаптарды белгілеу туралы» Қазақстан Республикасы Индустрия және инфрақұрылымдық даму министрінің міндетін атқарушының 2022 жылғы 11 мамырдағы № 259 бұйрығына өзгеріс енгізу туралы
