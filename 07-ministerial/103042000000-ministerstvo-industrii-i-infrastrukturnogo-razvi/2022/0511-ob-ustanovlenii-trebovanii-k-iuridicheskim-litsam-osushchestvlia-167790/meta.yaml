title:
  rus: Об установлении требований к юридическим лицам, осуществляющим деятельность по сбору (заготовке), хранению, переработке и реализации лома и отходов цветных и черных металлов в уведомительном порядке
  kaz: Түсті және қара металдардың сынығы мен қалдықтарын жинау (дайындау), сақтау, қайта өңдеу және өткізу жөніндегі қызметті хабарлама жасау тәртібімен жүзеге асыратын заңды тұлғаларға қойылатын талаптарды белгілеу туралы
