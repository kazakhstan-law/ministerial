requisite: Приказ Министра индустрии и инфраструктурного развития Республики Казахстан от 26 апреля 2022 года № 228. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 мая 2022 года № 27871
title:
  rus: Об утверждении требований к техническим средствам, применяемым при досмотре пассажиров и лиц, посещающих объекты транспортной инфраструктуры, вещей, находящихся при них, в том числе ручной клади и багажа
  kaz: Жолаушыларды және көлік инфрақұрылымы объектілеріне келетін адамдарды, олардың алып жүретін заттарын, оның ішінде қол жүгі мен багажын жете тексеру кезінде қолданылатын техникалық құралдарға қойылатын талаптарды бекіту туралы
