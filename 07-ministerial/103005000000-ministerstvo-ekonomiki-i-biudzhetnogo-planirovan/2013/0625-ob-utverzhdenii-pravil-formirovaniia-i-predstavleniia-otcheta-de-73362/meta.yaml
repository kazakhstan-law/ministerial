  title:
    rus: О внесении изменений в приказ Министра экономики и бюджетного планирования Республики Казахстан от 25 июня 2013 года № 193 «Об утверждении Правил формирования и представления отчета деятельности центральных государственных органов, местных исполнительных органов областей, городов республиканского значения, столицы, районов, городов областного значения, акимов районов в городе, городов районного значения, поселков, сел, сельских округов по вопросам оказания государственных услуг и его типовой формы»
    kaz: «Орталық мемлекеттік органдардың, облыстардың, республикалық маңызы бар қалалардың, астананың, аудандардың, облыстық маңызы бар қалалардың жергілікті атқарушы органдарының, қаладағы аудандар, аудандық маңызы бар қалалар, кенттер, ауылдар, ауылдық округтер әкімдерінің мемлекеттік қызметтер көрсету мәселелері жөніндегі қызметінің есебін қалыптастыру мен ұсыну қағидаларын және оның үлгі нысанын бекіту туралы» Қазақстан Республикасы Экономика және бюджеттік жоспарлау министрінің 2013 жылғы 25 маусымдағы № 193 бұйрығына өзгерістер енгізу туралы
