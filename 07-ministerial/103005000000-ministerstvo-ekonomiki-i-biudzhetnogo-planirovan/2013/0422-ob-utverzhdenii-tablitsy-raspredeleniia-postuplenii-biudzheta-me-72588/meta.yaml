  title:
    rus: О внесении дополнения в приказ Министра экономики и бюджетного планирования Республики Казахстан от 22 апреля 2013 года № 111 "Об утверждении Таблицы распределения поступлений бюджета между уровнями бюджетов и контрольным счетом наличности Национального фонда Республики Казахстан"
    kaz: '"Бюджет түсімдерін бюджеттер деңгейлері мен Қазақстан Республикасы Ұлттық қорының қолма-қол ақшасының бақылау шоты арасында бөлу кестесін бекіту туралы" Қазақстан Республикасы Экономика және бюджеттік жоспарлау министрінің 2013 жылғы 22 сәуірдегі № 111 бұйрығына толықтыру енгізу туралы'
