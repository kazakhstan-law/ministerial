  title:
    rus: О внесении изменений и дополнения в приказ Министра экономики и бюджетного планирования Республики Казахстан от 9 сентября 2013 года № 275 "Об утверждении перечня бюджетных инвестиционных и концессионных проектов, финансирование разработки или корректировки, а также проведение необходимых экспертиз технико-экономических обоснований, консультативное сопровождение концессионных проектов которых осуществляется за счет средств распределяемой бюджетной программы 002 "Разработка или корректировка, а также проведение необходимых экспертиз технико-экономических обоснований бюджетных инвестиционных и концессионных проектов, консультативное сопровождение концессионных проектов" Министерства экономики и бюджетного планирования Республики Казахстан на 2013 год"
    kaz: '"Техникалық-экономикалық негіздемелер әзірлеуді немесе түзетуді қаржыландыру, сондай-ақ қажетті сараптамалар жүргізу, концессиялық жобаларды консультациялық сүйемелдеу Қазақстан Республикасы Экономика және бюджеттік жоспарлау министрлігінің 002 "Бюджеттік инвестициялық және концессиялық жобалардың техникалық-экономикалық негіздемелерін әзірлеу немесе түзету, сондай-ақ қажетті сараптамалар жүргізу, концессиялық жобаларды консультациялық сүйемелдеу" бюджеттік бағдарламасының 2013 жылға бөлінетін қаражаты есебінен жүзеге асырылатын бюджеттік инвестициялық және концессиялық жобалардың тізбесін бекіту туралы" Қазақстан Республикасы Экономика және бюджеттік жоспарлау министрінің 2013 жылғы 9 қыркүйектегі № 275 бұйрығына өзгерістер мен толықтыру енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/75281/rus
