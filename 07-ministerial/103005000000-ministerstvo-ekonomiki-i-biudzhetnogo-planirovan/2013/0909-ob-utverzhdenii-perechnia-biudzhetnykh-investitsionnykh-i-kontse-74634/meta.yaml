act_code: '74634'
requisite: Приказ Министра экономики и бюджетного планирования Республики Казахстан от 9 сентября 2013 года № 275. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 октября 2013 года № 8759
title:
  rus: Об утверждении перечня бюджетных инвестиционных и концессионных проектов, финансирование разработки или корректировки, а также проведение необходимых экспертиз технико-экономических обоснований, консультативное сопровождение концессионных проектов которых осуществляется за счет средств распределяемой бюджетной программы 002 "Разработка или корректировка, а также проведение необходимых экспертиз технико-экономических обоснований бюджетных инвестиционных и концессионных проектов, консультативное сопровождение концессионных проектов" на 2013 год
  kaz: Техникалық-экономикалық негіздемелер әзірлеуді немесе түзетуді қаржыландыру, сондай-ақ қажетті сараптамалар жүргізу, концессиялық жобаларды консультациялық сүйемелдеу 002 "Бюджеттік инвестициялық және концессиялық жобалардың техникалық-экономикалық негіздемелерін әзірлеу немесе түзету, сондай-ақ қажетті сараптамалар жүргізу, концессиялық жобаларды консультациялық сүйемелдеу" бюджеттік бағдарламасының 2013 жылға бөлінетін қаражаты есебінен жүзеге асырылатын бюджеттік инвестициялық және концессиялық жобалардың тізбесін бекіту туралы
