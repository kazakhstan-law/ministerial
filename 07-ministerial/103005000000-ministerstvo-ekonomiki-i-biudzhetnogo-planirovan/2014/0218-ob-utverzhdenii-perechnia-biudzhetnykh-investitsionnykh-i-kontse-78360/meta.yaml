act_code: '78360'
requisite: Приказ Министра экономики и бюджетного планирования Республики Казахстан от 18 февраля 2014 года № 50. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 марта 2014 года № 9208. Утратил силу приказом Министра национальной экономики Республики Казахстан от 21 августа 2014 года № 1
title:
  rus: Об утверждении перечня бюджетных инвестиционных и концессионных проектов, финансирование разработки или корректировки, а также проведение необходимых экспертиз технико-экономических обоснований, консультативное сопровождение концессионных проектов которых осуществляется за счет средств распределяемой бюджетной программы 002 "Разработка или корректировка, а также проведение необходимых экспертиз технико-экономических обоснований бюджетных инвестиционных и концессионных проектов, консультативное сопровождение концессионных проектов" Министерства экономики и бюджетного планирования Республики Казахстан на 2014 год
  kaz: Техникалық-экономикалық негіздемелер әзірлеуді немесе түзетуді қаржыландыру, сондай-ақ қажетті сараптамалар жүргізу, концессиялық жобаларды консультациялық сүйемелдеу Қазақстан Республикасы Экономика және бюджеттік жоспарлау министрлігінің 002 "Бюджеттік инвестициялық және концессиялық жобалардың техникалық-экономикалық негіздемелерін әзірлеу немесе түзету, сондай-ақ қажетті сараптамалар жүргізу, концессиялық жобаларды консультациялық сүйемелдеу" бөлінетін бюджеттік бағдарламасының 2014 жылға қаражаты есебінен жүзеге асырылатын бюджеттік инвестициялық және концессиялық жобалардың тізбесін бекіту туралы
