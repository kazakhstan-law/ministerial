act_code: '45029'
requisite: Приказ Министра экономики и бюджетного планирования Республики Казахстан от 23 февраля 2009 года № 24. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 марта 2009 года № 5604. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 12 января 2026 года № 3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Методики определения стоимости объекта концессии и суммарной стоимости государственной поддержки деятельности концессионеров и источников возмещения затрат
  kaz: Концессия объектісінің құнын және концессионерлер қызметін мемлекеттік қолдаудың жиынтық құнын және шығындардың орнын толтыру көздерін айқындау әдістемесін бекіту туралы
