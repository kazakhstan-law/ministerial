  title:
    rus: О внесении изменений в приказ Министра экономики и бюджетного планирования Республики Казахстан от 23 февраля 2009 года № 24 «Об утверждении Методики определения стоимости объекта концессии, суммарной стоимости государственной поддержки деятельности концессионеров и источников возмещения затрат»
    kaz: «Концессия объектісінің құнын, концессионерлер қызметін мемлекеттік қолдау мен шығындарды өтеу көздерінің жиынтық құнын айқындау әдістемесін бекіту туралы» Қазақстан Республикасының Экономика және бюджеттік жоспарлау министрінің 2009 жылғы 23 ақпандағы № 24 бұйрығына өзгерістер енгізу туралы
