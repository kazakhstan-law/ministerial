  title:
    rus: О внесении изменений в приказ Министра экономики и бюджетного планирования Республики Казахстан от 23 февраля 2009 года № 24 "Об утверждении Методики определения стоимости объекта концессии, концессионного проекта и суммарной стоимости государственной поддержки деятельности концессионера"
    kaz: '"Концессия объектісінің, концессиялық жобаның құнын және концессионер қызметін мемлекеттік қолдаудың жиынтық құнын айқындау әдістемесін бекіту туралы" Қазақстан Республикасы Экономика және бюджеттік жоспарлау министрінің 2009 жылғы 23 ақпандағы № 24 бұйрығына өзгерістер енгізу туралы'
