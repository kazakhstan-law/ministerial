act_code: '45031'
requisite: Приказ и.о. Министра экономики и бюджетного планирования Республики Казахстан от 3 марта 2009 года № 34. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 марта 2009 года № 5610. Утратил силу приказом Министра экономического развития и торговли Республики Казахстан от 22 июля 2010 года № 126
title:
  rus: Об утверждении Требований к содержанию, порядку и срокам разработки финансово-экономического обоснования, а также порядку отбора бюджетных инвестиций, планируемых к реализации посредством участия государства в уставном капитале юридических лиц
  kaz: Қаржы-экономикалық негіздеменің мазмұнына, оны әзірлеу тәртібі мен мерзіміне, сондай-ақ заңды тұлғалардың жарғылық капиталына мемлекеттік қатысуы арқылы іске асыру жоспарланған бюджеттік инвестицияларды іріктеу тәртібіне қойылатын Талаптарды бекіту туралы
