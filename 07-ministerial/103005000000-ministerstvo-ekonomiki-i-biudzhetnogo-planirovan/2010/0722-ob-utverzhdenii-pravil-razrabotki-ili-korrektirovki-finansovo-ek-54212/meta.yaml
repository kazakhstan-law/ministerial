act_code: '54212'
requisite: Приказ Министра экономического развития и торговли Республики Казахстан от 22 июля 2010 года № 126. Зарегистрирован в Министерстве юстиции Республики Казахстан 16 августа 2010 года № 6395. Утратил силу приказом Министра экономики и бюджетного планирования Республики Казахстан от 30 июня 2014 года № 187
title:
  rus: Об утверждении Правил разработки или корректировки финансово-экономического обоснования бюджетных инвестиций, а также отбора бюджетных инвестиций, планируемых к реализации посредством участия государства в уставном капитале юридических лиц
  kaz: Бюджеттік инвестициялардың қаржы-экономикалық негіздемесін әзірлеу немесе түзету ережелерін, сондай-ақ заңды тұлғалардың жарғылық капиталына мемлекеттің қатысуы арқылы іске асыру жоспарланған бюджеттік инвестицияларды іріктеуін бекіту туралы
