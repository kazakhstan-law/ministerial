  requisite: Приказ и.о. Министра экономического развития и торговли Республики Казахстан от 12 июля 2012 года № 214. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 августа 2012 года № 7821. Утратил силу приказом Министра экономики и бюджетного планирования Республики Казахстан от 30 июня 2014 года № 187
  title:
    rus: О внесении изменений в приказ Министра экономического развития и торговли Республики Казахстан от 22 июля 2010 года № 126 "Об утверждении Требований к содержанию, порядку и срокам разработки финансово-экономического обоснования, а также порядку отбора бюджетных инвестиций, планируемых к реализации посредством участия государства в уставном капитале юридических лиц"
    kaz: '"Қаржы-экономикалық негіздеменің мазмұнына, оны әзірлеу тәртібі мен мерзіміне, сондай-ақ заңды тұлғалардың жарғылық капиталына мемлекеттің қатысуы арқылы іске асыру жоспарланған бюджеттік инвестицияларды іріктеу тәртібінің талаптарын бекіту туралы" Қазақстан Республикасы Экономикалық даму және сауда министрінің 2010 жылғы 22 шілдедегі № 126 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/66982/rus
