  title:
    rus: О внесении изменений в приказ Министра экономического развития и торговли Республики Казахстан от 22 июля 2010 года № 126 "Об утверждении Правил разработки или корректировки финансово-экономического обоснования бюджетных инвестиций, а также отбора бюджетных инвестиций, планируемых к реализации посредством участия государства в уставном капитале юридических лиц"
    kaz: '"Бюджеттік инвестициялардың қаржы-экономикалық негіздемесін әзірлеу немесе түзету ережелерін, сондай-ақ заңды тұлғалардың жарғылық капиталына мемлекеттің қатысуы арқылы іске асыру жоспарланған бюджеттік инвестицияларды іріктеуін бекіту туралы" Қазақстан Республикасы Экономикалық даму және сауда министрінің 2010 жылғы 22 шілдедегі № 126 бұйрығына өзгерістер енгізу туралы'
