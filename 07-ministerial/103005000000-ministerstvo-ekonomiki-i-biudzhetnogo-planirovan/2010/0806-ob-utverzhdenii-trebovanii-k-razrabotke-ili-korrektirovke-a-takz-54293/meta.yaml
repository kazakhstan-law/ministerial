caused_by:
  code: '157196'
  requisite: Приказ и.о. Министра национальной экономики Республики Казахстан от 21 июля 2021 года № 70. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 июля 2021 года № 23661. Утратил силу приказом Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 23 декабря 2025 года № 133 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра экономического развития и торговли Республики Казахстан от 6 августа 2010 года № 136 «Об утверждении Требований к разработке или корректировке, а также проведению необходимых экспертиз технико-экономического обоснования инвестиционного проекта для предоставления государственных гарантий»
    kaz: «Мемлекеттік кепілдіктер беру үшін инвестициялық жобаның техникалық-экономикалық негіздемесін әзірлеуге немесе түзетуге, сондай-ақ қажетті сараптамалар жүргізуге қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Экономикалық даму және сауда министрінің міндетін атқарушысының 2010 жылғы 6 тамыздағы № 136 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/157196/rus
