  title:
    rus: О внесении изменения и дополнения в приказ и.о. Министра экономического развития и торговли Республики Казахстан от 6 августа 2010 года № 136 "Об утверждении Требований к разработке или корректировке, а также проведению необходимых экспертиз технико-экономического обоснования инвестиционного проекта для предоставления государственных гарантий"
    kaz: '"Мемлекеттік кепілдіктер беру үшін инвестициялық жобаның техникалық-экономикалық негіздемесін әзірлеуге немесе түзетуге, сондай-ақ қажетті сараптамалар жүргізуге қойылатын талаптарды бекіту туралы" Қазақстан Республикасы Экономикалық даму және сауда министрінің м.а. 2010 жылғы 6 тамыздағы № 136 бұйрығына өзгеріс және толықтыру енгізу туралы'
