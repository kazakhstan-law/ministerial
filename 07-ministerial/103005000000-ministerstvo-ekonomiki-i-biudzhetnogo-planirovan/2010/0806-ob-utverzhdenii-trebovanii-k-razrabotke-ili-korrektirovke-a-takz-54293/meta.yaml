caused_by:
  code: '197259'
  requisite: Приказ Заместителя Премьер-Министра - Министра национальной экономики Республики Казахстан от 31 мая 2024 года № 27. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 мая 2024 года № 34431
  title:
    rus: О внесении изменений и дополнений в приказ исполняющего обязанности Министра экономического развития и торговли Республики Казахстан от 6 августа 2010 года № 136 «Об утверждении Требований к разработке или корректировке, а также проведению необходимых экспертиз технико-экономического обоснования инвестиционного проекта для предоставления государственных гарантий» и приказ Министра национальной экономики Республики Казахстан от 16 января 2015 года № 17 «Об утверждении Правил передачи государственного имущества в доверительное управление и Типового договора доверительного управления государственным имуществом»
    kaz: «Мемлекеттік кепілдіктер беру үшін инвестициялық жобаның техникалық-экономикалық негіздемесін әзірлеуге немесе түзетуге, сондай-ақ қажетті сараптамалар жүргізуге қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Экономикалық даму және сауда министрінің міндетін атқарушының 2010 жылғы 6 тамыздағы № 136 бұйрығына және «Мемлекеттік мүлікті сенімгерлік басқаруға беру қағидаларын және Мемлекеттік мүлікті сенімгерлік басқарудың үлгілік шартын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2015 жылғы 16 қаңтардағы № 17 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/197259/rus
