  title:
    rus: О внесении дополнения в приказ исполняющего обязанности Министра экономического развития и торговли Республики Казахстан от 6 августа 2010 года № 136 «Об утверждении Требований к разработке или корректировке, а также проведению необходимых экспертиз технико-экономического обоснования инвестиционного проекта для предоставления государственных гарантий»
    kaz: «Мемлекеттік кепілдіктер беру үшін инвестициялық жобаның техникалық-экономикалық негіздемесін әзірлеуге немесе түзетуге, сондай-ақ қажетті сараптамалар жүргізуге қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Экономикалық даму және сауда министрінің міндетін атқарушының 2010 жылғы 6 тамыздағы № 136 бұйрығына толықтыру енгізу туралы
