act_code: '21807'
requisite: Приказ и.о. Министра экономики и бюджетного планирования Республики Казахстан от 30 сентября 2004 года N 143. Зарегистрирован Министерством юстиции Республики Казахстан 5 ноября 2004 года N 3185. Утратил силу приказом и.о. Министра экономики и бюджетного планирования Республики Казахстан от 3 марта 2009 года N 34
title:
  rus: Об утверждении Правил разработки и рассмотрения финансово-экономического обоснования бюджетных инвестиций посредством участия в уставном капитале юридических лиц
  kaz: Заңды тұлғалардың жарғылық капиталға қатысу арқылы бюджеттік инвестициялардың қаржылық-экономикалық негіздемесін әзірлеу және оны қарау ережесін бекіту туралы
