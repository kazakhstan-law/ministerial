  requisite: Приказ Министра экономики и бюджетного планирования Республики Казахстан от 13 ноября 2006 года № 171. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 ноября 2006 года № 4466. Утратил силу приказом Министра экономики и бюджетного планирования Республики Казахстан от 22 мая 2009 года № 115
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра экономики и бюджетного планирования Республики Казахстан от 30 сентября 2004 года № 143 "Об утверждении Правил разработки и рассмотрения финансово-экономического обоснования бюджетных инвестиций, осуществляемых посредством участия в формировании и увеличении уставного капитала юридических лиц"
    kaz: '"Заңды тұлғалардың жарғылық капиталын қалыптастыруға және ұлғайтуға қатысу арқылы жүзеге асырылатын бюджеттік инвестициялардың қаржылық-экономикалық негіздемесін әзірлеу және оны қарау ережесін бекіту туралы" Қазақстан Республикасының Экономика және бюджеттік жоспарлау министрінің міндетін атқарушының 2004 жылғы 30 қыркүйектегі № 143 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/30598/rus
