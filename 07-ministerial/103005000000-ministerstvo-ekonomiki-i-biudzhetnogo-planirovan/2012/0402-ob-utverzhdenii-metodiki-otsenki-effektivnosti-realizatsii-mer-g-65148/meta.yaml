act_code: '65148'
requisite: Приказ Министра экономического развития и торговли Республики Казахстан от 2 февраля 2012 года № 96. Зарегистрирован в Министерстве юстиции Республики Казахстан 2 мая 2012 года № 7608. Утратил силу приказом Министра национальной экономики Республики Казахстан от 29 сентября 2016 года № 430
title:
  rus: Об утверждении Методики оценки эффективности реализации мер государственной поддержки индустриально-инновационной деятельности, осуществляемых государственными органами, местными исполнительными органами областей, городов республиканского значения, столицы, а также субъектами индустриально-инновационной системы, осуществляющими поддержку индустриально-инновационной деятельности
  kaz: Мемлекеттік органдар, облыстардың, республикалық маңызы бар қалалардың, астананың жергілікті атқарушы органдары, сондай-ақ индустриялық-инновациялық қызметті қолдауды жүзеге асыратын индустриялық-инновациялық жүйенің субъектілері жүзеге асыратын индустриялық-инновациялық қызметті мемлекеттік қолдау шараларының іске асырылу тиімділігін бағалау әдістемесін бекіту туралы
