  title:
    rus: О внесении изменения в приказ Министра экономического развития и торговли Республики Казахстан от 2 февраля 2012 года № 96 "Об утверждении Методики оценки эффективности реализации мер государственной поддержки индустриально-инновационной деятельности, осуществляемых государственными органами, местными исполнительными органами областей, городов республиканского значения, столицы, а также субъектами индустриально-инновационной системы, осуществляющими поддержку индустриально-инновационной деятельности"
    kaz: '"Мемлекеттік органдар, облыстардың, республикалық маңызы бар қалалардың, астананың жергілікті атқарушы органдары, сондай-ақ индустриялық-инновациялық қызметті қолдауды жүзеге асыратын индустриялық-инновациялық жүйенің субъектілері жүзеге асыратын индустриялық-инновациялық қызметті мемлекеттік қолдау шараларының іске асырылу тиімділігін бағалау әдістемесін бекіту туралы" Қазақстан Республикасы Экономикалық даму және сауда министрінің 2012 жылғы 2 ақпандағы № 96 бұйрығына өзгеріс енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/80115/rus
