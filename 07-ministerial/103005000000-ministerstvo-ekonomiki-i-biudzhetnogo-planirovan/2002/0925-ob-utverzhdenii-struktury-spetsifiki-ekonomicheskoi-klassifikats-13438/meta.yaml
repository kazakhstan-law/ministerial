  requisite: Приказ Министра экономики и бюджетного планирования Республики Казахстан от 7 октября 2003 года N 163. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 октября 2003 года N 2535. Утратил силу - приказом и.о. Министра экономики и бюджетного планирования РК от 30 декабря 2004 года N 172
  title:
    rus: О внесении изменений и дополнений N 4 в приказ Министра экономики и бюджетного планирования Республики Казахстан от 26 сентября 2002 года N 4 "Об утверждении структуры специфики экономической классификации расходов бюджета Республики Казахстан", зарегистрированный за N 2019
    kaz: '"Қазақстан Республикасы бюджет шығыстарының экономикалық сыныптамасы ерекшелігінің құрылымын бекіту туралы" Қазақстан Республикасы Экономика және бюджеттік жоспарлау министрінің 2002 жылғы 26 қыркүйекте N 2019 тіркелген N 4 бұйрығына N 4 өзгерістер мен толықтырулар енгізу туралы'
