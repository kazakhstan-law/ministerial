  requisite: Приказ Министра экономики и бюджетного планирования Республики Казахстан от 5 июня 2003 года № 96. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 июня 2003 года № 2382. Утратил силу - приказом и.о. Министра экономики и бюджетного планирования РК от 30 декабря 2004 года № 172
  title:
    rus: О внесении дополнения № 3 в приказ Министра экономики и бюджетного планирования Республики Казахстан от 26 сентября 2002 года № 4 "Об утверждении структуры специфики экономической классификации расходов бюджета Республики Казахстан", зарегистрированный за № 2019
    kaz: '"Қазақстан Республикасы бюджет шығыстарының экономикалық сыныптамасы ерекшелігінің құрылымын бекіту туралы" Қазақстан Республикасы Экономика және бюджеттік жоспарлау министрінің 2002 жылғы 26 қыркүйекте № 2019 тіркелген № 4 бұйрығына № 3 толықтырулар енгізу туралы'
