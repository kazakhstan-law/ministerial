requisite: Приказ Министра экономики и бюджетного планирования Республики Казахстан от 26 сентября 2002 года N 4. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 октября 2002 года N 2019. Утратил силу приказом и.о. Министра экономики и бюджетного планирования Республики Казахстан от 30 декабря 2004 года N 172
title:
