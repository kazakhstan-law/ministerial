  requisite: Қазақстан Республикасы Экономика және бюджеттік жоспарлау министрінің 2004 жылғы 2 тамыздағы N 115 бұйрығы. Қазақстан Республикасының Әділет министрлігінде 2004 жылғы 27 тамызда тіркелді. Тіркеу N 3039. Күші жойылды - ҚР Экономика және бюджеттік жоспарлау министрлігінің 2004 жылғы 30 желтоқсандағы N 172 бұйрығымен.
  title:
    rus: Тіркелген N 2019, "Қазақстан Республикасы бюджет шығыстарының экономикалық сыныптамасы ерекшелігінің құрылымын бекіту туралы" Қазақстан Республикасы Экономика және бюджеттік жоспарлау министрінің 2002 жылғы 26 қыркүйектегі N 4 бұйрығына N 5 өзгерістер мен толықтырулар енгізу туралы
