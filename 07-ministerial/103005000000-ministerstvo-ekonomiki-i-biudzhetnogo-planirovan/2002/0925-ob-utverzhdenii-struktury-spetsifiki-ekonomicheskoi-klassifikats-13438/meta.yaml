  requisite: Приказ Министра экономики и бюджетного планирования Республики Казахстан от 12 марта 2003 года № 44. Зарегистрирован в Министерстве юстиции Республики Казахстан 27 марта 2003 года № 2221. Утратил силу - приказом и.о. Министра экономики и бюджетного планирования РК от 30 декабря 2004 года № 172
  title:
    rus: О внесении изменений и дополнения № 1 в приказ Министра экономики и бюджетного планирования Республики Казахстан от 26 сентября 2002 года № 4 "Об утверждении структуры специфики экономической классификации расходов бюджета Республики Казахстан", зарегистрированный за № 2019
    kaz: № 2019 тіркелген "Қазақстан Республикасы бюджет шығыстарының экономикалық сыныптамасы ерекшелігінің құрылымын бекіту туралы" Қазақстан Республикасы Экономика және бюджеттік жоспарлау министрінің 2002 жылғы 26 қыркүйектегі № 4 бұйрығына № 1 өзгерістер мен толықтыру енгізу туралы
