  requisite: Қазақстан Республикасының Экономика және бюджеттік жоспарлау министрлігінің 2003 жылғы 4 мамырдағы № 76 бұйрығы. Қазақстан Республикасы Әділет министрлігінде 2003 жылғы 21 мамырда тіркелді. Тіркеу № 2294. Күші жойылды - ҚР Экономика және бюджеттік жоспарлау министрлігінің 2004 жылғы 30 желтоқсандағы № 172 бұйрығымен.
