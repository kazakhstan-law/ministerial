    kaz: '"Сараптамалық сүйемелдеу режимінде құрылыс жобаларына мемлекеттік сараптама жүргізу қағидасын бекіту туралы" Қазақстан Республикасы Құрылыс және тұрғын үй-коммуналдық шаруашылық істері агенттігі төрағасының 2012 жылғы 23 шілдедегі № 356 бұйрығына өзгеріс енгізу туралы'
