act_code: '66407'
requisite: Приказ Председателя Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства от 29 мая 2012 года № 215. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 июня 2012 года № 7768. Утратил силу приказом Министра индустрии и инфраструктурного развития Республики Казахстан от 4 февраля 2021 года № 44 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Квалификационных требований, предъявляемых к рекомендуемой жилищной инспекцией кандидатуре председателя правления кооператива собственников помещений (квартир)
  kaz: Тұрғын үй инспекциясы ұсынып отырған үй-жайлардың (пәтерлердің) меншік иелері кооперативі басқармасының төрағасы кандидатурасына қойылатын біліктілік талаптарын бекіту туралы
