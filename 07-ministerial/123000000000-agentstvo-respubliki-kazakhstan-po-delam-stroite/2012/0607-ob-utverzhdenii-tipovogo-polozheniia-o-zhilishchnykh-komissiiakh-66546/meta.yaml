  title:
    rus: О внесении изменений в приказы Председателя Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства от 7 июня 2012 года № 237 «Об утверждении Типового положения о жилищных комиссиях местных исполнительных органов, государственных предприятий, государственных учреждений» и Министра национальной экономики Республики Казахстан от 28 июля 2016 года № 343 «Об утверждении типовой формы договора о предоставлении гарантии»
    kaz: «Жергілікті атқарушы органдардың, мемлекеттік кәсіпорындардың, мемлекеттік мекемелердің тұрғын үй комиссиялары туралы үлгі ережені бекіту туралы» Қазақстан Республикасы Құрылыс және тұрғын үй-коммуналдық шаруашылық істері агенттігі төрағасының 2012 жылғы 7 маусымдағы № 237 және «Кепілдік беру туралы шарттың үлгілік нысанын бекіту туралы» Қазақстан Республикасы Ұлттық экономика министрінің 2016 жылғы 28 шілдедегі № 343 бұйрықтарына өзгерістер енгізу туралы
