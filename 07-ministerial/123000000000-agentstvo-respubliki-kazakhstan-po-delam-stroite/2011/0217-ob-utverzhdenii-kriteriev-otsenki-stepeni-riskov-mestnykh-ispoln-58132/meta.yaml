  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства от 17 февраля 2011 года № 59 "Об утверждении критериев оценки степени рисков местных исполнительных органов по делам архитектуры, градостроительства и строительства, государственного архитектурно-строительного контроля и надзора, лицензирования"
    kaz: '"Сәулет, қала құрылысы және құрылыс істері, мемлекеттік сәулет-құрылыс бақылау мен қадағалау, лицензиялау жөніндегі жергілікті атқарушы органдардың тәуекелдер дәрежелерін бағалау критерийлерін бекіту туралы" Қазақстан Республикасы Құрылыс және тұрғын үй-коммуналдық шаруашылық істері агенттігі төрағасының 2011 жылғы 17 ақпандағы № 59 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/64053/rus
