requisite: Приказ Председателя Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства от 5 декабря 2011 года № 471. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 февраля 2012 года № 7412. Утратил силу приказом и.о. Министра индустрии и инфраструктурного развития Республики Казахстан от 31 декабря 2019 года № 958 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил исчисления совокупного дохода семьи (гражданина), претендующей на получение жилищной помощи, а также на предоставление жилища из государственного жилищного фонда или жилища, арендованного местным исполнительным органом в частном жилищном фонде
  kaz: Тұрғын үй көмегін алуға, сондай-ақ мемлекеттік тұрғын үй қорынан тұрғын үйді немесе жеке тұрғын үй қорынан жергілікті атқарушы орган жалдаған тұрғын үйді алуға үміткер отбасының (азаматтың) жиынтық табысын есептеу қағидасын бекіту туралы
