  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства от 26 сентября 2011 года № 354 «Об утверждении Методики расчета объемов предоставленных услуг по водоснабжению и водоотведению»
    kaz: «Сумен жабдықтау және су бұру жөнінде көрсетілген қызметтің көлемін есептеу әдістемесін бекіту туралы» Қазақстан Республикасы Құрылыс және тұрғын үй-коммуналдық шаруашылық істері агенттігі төрағасының 2011 жылғы 26 қыркүйектегі № 354 бұйрығына өзгерістер енгізу туралы
