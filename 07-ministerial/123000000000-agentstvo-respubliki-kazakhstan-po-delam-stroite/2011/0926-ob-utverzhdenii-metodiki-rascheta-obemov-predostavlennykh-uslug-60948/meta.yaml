  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства от 26 сентября 2011 года № 354 «Об утверждении Методики определения объемов предоставленных услуг водоснабжения и водоотведения»
    kaz: '"Сумен жабдықтау және су бұру қызметінің көрсетілген көлемін анықтау әдістемесін бекіту туралы" Қазақстан Республикасы Құрылыс және тұрғын үй-коммуналдық шаруашылық істері агенттігі төрағасының 2011 жылғы 26 қыркүйектегі № 354 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
