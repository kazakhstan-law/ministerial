title:
  rus: Об утверждении формы проверочного листа по вопросам проверок деятельности местных исполнительных органов по делам архитектуры, градостроительства и строительства
  kaz: Сәулет, қала құрылысы және құрылыс істері жөніндегі жергілікті атқарушы органдардың қызметін тексеру мәселелері бойынша тексеру парағының нысанын бекіту туралы
