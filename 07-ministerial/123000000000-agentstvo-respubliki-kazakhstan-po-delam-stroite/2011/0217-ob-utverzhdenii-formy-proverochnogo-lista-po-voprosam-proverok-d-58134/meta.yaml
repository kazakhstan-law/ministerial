  title:
    rus: О внесении изменений в приказ Председателя Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства от 17 февраля 2011 года № 60 "Об утверждении формы проверочного листа по вопросам проверок деятельности местных исполнительных органов по делам архитектуры, градостроительства и строительства, государственного архитектурно-строительного контроля и надзора, лицензирования"
    kaz: '"Сәулет, қала құрылысы және құрылыс қызметі, мемлекеттік сәулет-құрылыс бақылауы мен қадағалауды, лицензиялау саласындағы жергілікті атқарушы органдардың қызметін тексеру мәселелері жөніндегі тексеру парағының нысанын бекіту туралы" Қазақстан Республикасы Құрылыс және тұрғын үй-коммуналдық шаруашылық істері агенттігі төрағасының 2011 жылғы 17 ақпандағы № 60 бұйрығына өзгерістер енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/64054/rus
