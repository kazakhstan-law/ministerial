  title:
    rus: О внесении изменений и дополнения в приказы Председателя Агентства Республики Казахстан по делам строительства и жилищно-коммунального хозяйства от 13 сентября 2011 года № 338 "Об утверждении Типовой формы договора управления объектом кондоминиума" и от 12 декабря 2011 года № 479 "Об утверждении Методики расчета сметы расходов на содержание общего имущества объекта кондоминиума"
    kaz: '"Кондоминиум объектісін басқару шартының үлгілік нысанын бекіту туралы" 2011 жылғы 13 қыркүйектегі № 338 және "Кондоминиум объектісінің ортақ мүлкін күтіп-ұстауға арналған шығыстар сметасын есептеу әдістемесін бекіту туралы" 2011 жылғы 12 желтоқсандағы № 479 Қазақстан Республикасы Құрылыс және тұрғын үй-коммуналдық шаруашылық істері агенттігі төрағасының бұйрықтарына өзгерістер мен толықтырулар енгізу туралы'
  link: https://zan.gov.kz/client/#!/doc/81840/rus
