    kaz: Қазақстан Республикасы Премьер - Министрінің Бірінші орынбасары - Қазақстан Республикасы Өңірлік даму министрінің 2013 жылғы 24 қыркүйектегі № 239/НҚ «Ауылдық елді-мекендердің әлеуметтік-экономикалық дамуының мониторингі мен талдауын жүзеге асыру жөніндегі нұсқаулықты бекіту туралы» бұйрығына өзгерістер енгізу туралы
