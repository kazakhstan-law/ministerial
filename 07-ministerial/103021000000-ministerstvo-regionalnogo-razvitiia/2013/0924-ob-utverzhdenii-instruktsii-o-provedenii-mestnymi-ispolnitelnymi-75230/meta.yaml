  title:
    rus: О внесении изменений и дополнения в приказ Первого заместителя Премьер-Министра Республики Казахстан – Министра регионального развития Республики Казахстан от 24 сентября 2013 года № 239/ОД «Об утверждении Инструкции о проведении местными исполнительными органами мониторинга (скрининга) социально-экономического развития сельских населенных пунктов»
