act_code: '73153'
requisite: Приказ Первого заместителя Премьер-Министра Республики Казахстан - Министра регионального развития Республики Казахстан от 15 апреля 2013 года № 01-04-03/47 НҚ. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 мая 2013 года № 8481. Утратил силу приказом Министра национальной экономики Республики Казахстан от 11 ноября 2015 года № 690
title:
  rus: Об утверждении Правил особого регулирования архитектурной, градостроительной и строительной деятельности, а также градостроительной регламентации на территории города Астаны и ее пригородной зоны
  kaz: Астана қаласы және оның қала маңы аймағының аумағындағы сәулет, қала құрылысы және құрылыс қызметін ерекше реттеудің, сондай-ақ қала құрылысын регламенттеудің ережесін бекіту туралы
