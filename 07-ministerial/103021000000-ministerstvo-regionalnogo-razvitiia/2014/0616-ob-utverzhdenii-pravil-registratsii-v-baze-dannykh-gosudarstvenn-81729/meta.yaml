  title:
    rus: О внесении изменений в приказ Министра регионального развития Республики Казахстан от 16 июня 2014 года № 172/ОД «Об утверждении правил регистрации в базе данных государственного градостроительного кадастра предпроектной и проектной (проектно-сметной) документации, а также объектов архитектурной, градостроительной и строительной деятельности»
    kaz: «Жобалау алдындағы және жобалау (жобалау-сметалық) құжаттамасын, сондай-ақ сәулет, қала құрылысы және құрылыс қызметі объектілерін мемлекеттік қала құрылысы кадастрының деректер базасында тіркеу қағидаларын бекіту туралы» Қазақстан Республикасы Өңірлік даму министрінің 2014 жылғы 16 маусымдағы № 172/НҚ бұйрығына өзгерістер енгізу туралы
