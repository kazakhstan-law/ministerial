requisite: Приказ Министра регионального развития Республики Казахстан от 16 июня 2014 года № 172/ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 июля 2014 года № 9603. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 17 апреля 2026 года № 184 (вводится в действие с 1 июля 2026 года и подлежит официальному опубликованию)
title:
