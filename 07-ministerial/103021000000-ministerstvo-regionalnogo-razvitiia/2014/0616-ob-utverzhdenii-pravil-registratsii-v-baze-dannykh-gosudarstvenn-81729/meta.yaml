act_code: '81729'
requisite: Приказ Министра регионального развития Республики Казахстан от 16 июня 2014 года № 172/ОД. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 июля 2014 года № 9603. Утратил силу приказом Министра промышленности и строительства Республики Казахстан от 17 апреля 2026 года № 184 (вводится в действие с 1 июля 2026 года и подлежит официальному опубликованию)
title:
  rus: Об утверждении правил регистрации в базе данных государственного градостроительного кадастра градостроительных проектов, предпроектной и проектной (проектно-сметной) документации, а также объектов архитектурной, градостроительной и строительной деятельности
  kaz: Қала құрылысы жобаларын, жобалау алдындағы және жобалау (жобалау-сметалық) құжаттамасын, сондай-ақ сәулет, қала құрылысы және құрылыс қызметі объектілерін мемлекеттік қала құрылысы кадастрының деректер базасында тіркеу қағидаларын бекіту туралы
