  kaz: Қала құрылысы жобаларын, жобалау алдындағы және жобалау (жобалау-сметалық) құжаттамасын, сондай-ақ сәулет, қала құрылысы және құрылыс қызметі объектілерін мемлекеттік қала құрылысы кадастрының деректер базасында тіркеу қағидаларын бекіту туралы
