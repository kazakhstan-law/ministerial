act_code: '96053'
requisite: Приказ Директора Службы внешней разведки Республики Казахстан "Сырбар" от 31 марта 2015 года № 4. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 декабря 2015 года № 12340. Утратил силу приказом Председателя Комитета национальной безопасности Республики Казахстан от 22 июня 2021 года № 69/қе (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм возмещения сотрудникам Службы внешней разведки Республики Казахстан "Сырбар" и членам их семей, постоянно совместно проживающим с ними, затрат за проезд на транспорте по территории Республики Казахстан
  kaz: Қазақстан Республикасы "Сырбар" Сыртқы барлау қызметінің қызметкерлері және олармен үнемі бірге тұратын отбасы мүшелеріне Қазақстан Республикасының аумағында көлікпен жол жүру шығындарын өтеу нормаларын бекіту туралы
