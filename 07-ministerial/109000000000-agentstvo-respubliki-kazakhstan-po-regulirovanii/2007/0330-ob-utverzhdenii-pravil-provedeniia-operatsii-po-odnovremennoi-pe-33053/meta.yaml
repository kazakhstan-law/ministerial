act_code: '33053'
requisite: Постановление Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 30 марта 2007 года N 57. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 мая 2007 года N 4657. Утратило силу постановлением Правления Агентства Республики Казахстан по регулированию и надзору финансового рынка и финансовых организаций от 28 ноября 2008 года N 191
title:
  rus: Об утверждении Правил проведения операций по одновременной передаче части обязательств и прав требования по дебиторской задолженности, имущества принудительно ликвидируемого банка другому (другим) банку (банкам)
  kaz: Мiндеттемелердiң бiр бөлiгiн және мәжбүрлеп таратылатын банктiң дебиторлық берешегi бойынша талап ету құқықтарын, мүлкін басқа банкке (банктерге) бiр мезгiлде беру жөніндегі операцияларды жүргiзу ережесін бекіту туралы
