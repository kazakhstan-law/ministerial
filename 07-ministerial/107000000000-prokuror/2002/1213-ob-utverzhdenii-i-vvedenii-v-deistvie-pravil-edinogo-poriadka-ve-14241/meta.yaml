requisite: Приказ Генерального Прокурора Республики Казахстан от 13 декабря 2002 года N 67. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 января 2003 года N 2115. Утратило силу - приказом Генерального прокурора Республики Казахстан от 7 июня 2007 года N 22 (вводится в действие со дня официального опубликования)
title:
  rus: Об утверждении и введении в действие Правил единого порядка ведения учета лиц, признанных в установленном порядке недееспособными либо ограниченно дееспособными, а также лиц, лишенных судом права занимать государственные должности
  kaz: Белгіленген реттерде әрекетке қабілетсіз деп танылған немесе әрекетке қабілеттілігі шектелген, сондай-ақ мемлекеттік лауазымды атқару құқығынан сот айырған тұлғалардың бірыңғай есебiн жүргiзудiң реті жөнiндегi Ереженi бекітіп, қолданысқа енгізу
