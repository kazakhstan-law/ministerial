  title:
    rus: О внесении изменений в приказ Генерального Прокурора Республики Казахстан от 13 декабря 2002 года N 67 "Об утверждении и введении в действие Правил единого порядка ведения учета лиц, совершивших умышленные административные правонарушения, дела о которых подведомственны судам; признанных в установленном порядке недееспособными либо ограниченно дееспособными, а также лиц, лишенных судом права занимать государственные должности", зарегистрированный за N 2115
    kaz: N 2115 санымен тіркелген "Істері соттардың ведомствосына қарасты қасақана әкімшілік құқық бұзушылықтар жасаған тұлғалардың; белгіленген тәртіпте әрекетке қабілетсіз не әрекетке қабілеттілігі шектеулі деп танылған, сондай-ақ мемлекеттік лауазымды иелену құқығы сотпен айырылған тұлғалардың есебін бірыңғай тәртіпте жүргізу Қағидасын бекіту мен іске қосу туралы" Қазақстан Республикасы Бас Прокурорының 2002 жылдың 13 желтоқсанындағы N 67 бұйрығына өзгертулер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/19706/rus
