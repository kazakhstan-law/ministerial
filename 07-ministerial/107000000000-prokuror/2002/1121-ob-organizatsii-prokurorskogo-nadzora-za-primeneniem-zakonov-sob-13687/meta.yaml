  title:
    rus: О внесении изменений и дополнений в приказ Генерального Прокурора Республики Казахстан от 21 ноября 2002 года № 60 "Об организации прокурорского надзора за применением законов, соблюдением прав и свобод человека и гражданина в социально-экономической сфере", зарегистрированный за № 2065
    kaz: Қазақстан Республикасы Бас Прокурорының 2065 нөмірімен тіркелген "Әлеуметтік-экономикалық саладағы заңдардың қолданылуына, адам мен азаматтың құқықтары мен бостандықтарының сақталуына прокурорлық қадағалауды ұйымдастыру туралы" 21.11.2002 жылғы N 60 бұйрығына өзгерістер мен толықтырулар енгізу туралы
