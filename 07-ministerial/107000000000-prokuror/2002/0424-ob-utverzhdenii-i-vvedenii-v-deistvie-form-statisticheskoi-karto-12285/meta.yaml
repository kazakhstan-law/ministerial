act_code: '12285'
requisite: Приказ Генерального Прокурора Республики Казахстан от 25 апреля 2002 года N 28. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 мая 2002 года N 1868. Утратил силу - приказом Генерального прокурора Республики Казахстан от 1 марта 2004 года N 12 (V042744)
title:
  rus: Об утверждении и введении в действие форм статистической карточки учета проверок деятельности хозяйствующих субъектов и талона-приложения к ней по форме N 1-П, формы отчета "О регистрации актов о назначении проверок деятельности хозяйствующих субъектов", журнала регистрации карточек и актов о назначении проверок деятельности хозяйствующих субъектов, инструкции "О порядке ведения статистической карточки учета проверок деятельности хозяйствующих субъектов по форме N 1-П, отчета "О регистрации актов о назначении проверок деятельности хозяйствующих субъектов" и журнала регистрации карточек и актов о назначении проверок деятельности хозяйствующих субъектов, отмене приказа Генерального Прокурора Республики Казахстан N 67 от 29 декабря 2000 года
  kaz: Шаруашылық субъектілерінің қызметін тексеруді тіркеу N 1 формалы статистикалық карточканы, "Шаруашылық субъектілерінің қызметін тексеруді тағайындау актілерін тіркеу туралы" нысанын және шаруашылық субъектілерді тексеруді тағайындау туралы карточкалар мен актілерді тіркеу журналын, Шаруашылық субъектілерінің қызметін тексеруді тіркеу N 1 формалы статистикалық карточканы, "Шаруашылық субъектілерінің қызметін тексеруді тағайындау актілерін тіркеу туралы" нысанын және шаруашылық субъектілерді тексеруді тағайындау туралы карточкалар мен актілерді тіркеу журналын жүргізу тәртібі жайлы Нұсқауды бекітіп күшіне енгізу және Қазақстан Республикасы Бас Прокурорының 2000 жылдың 29 желтоқсанындығы N 67 бұйрығының күшін жою туралы
