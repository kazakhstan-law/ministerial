act_code: '12284'
requisite: Приказ Генерального Прокурора Республики Казахстан от 25 апреля 2002 года N 27. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 мая 2002 года N 1867. Утратил силу - приказом Генерального прокурора Республики Казахстан от 1 марта 2004 года N 12 (V042744)
title:
  rus: Об утверждении Правил "О порядке представления и регистрации документов первичного учета всех проверок деятельности хозяйствующих субъектов" и отмене приказа Генерального Прокурора Республики Казахстан N 66 от 29 декабря 2000 года
  kaz: '"Шаруашылық субъектілердің қызметінде жүргізілетін барлық тексерулердің алғашқы есеп құжаттарын ұсыну және тіркеу тәртібі туралы" Ережесін бекіту және Қазақстан Республикасы Бас Прокурорының 2000 жылдың 29 желтоқсанындағы N 66 бұйрығының күшін жою туралы'
