title:
  rus: О признании утратившим силу приказа Генерального Прокурора Республики Казахстан от 13 сентября 2017 года № 104 «Об утверждении Инструкции по организации прокурорского надзора за законностью исполнения уголовных наказаний и применения иных мер государственного принуждения»
  kaz: Қазақстан Республикасы Бас Прокурорының «Қылмыстық жазаларды орындаудың және өзге де мемлекеттік мәжбүрлеу шараларын қолданудың заңдылығын прокурорлық қадағалауды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы» 2017 жылғы 13 қыркүйектегі № 104 бұйрығының күшін жою туралы
