requisite: Приказ и.о. Генерального Прокурора Республики Казахстан от 10 декабря 2021 года № 161. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 декабря 2021 года № 25924. Утратил силу приказом Генерального Прокурора РК от 9 января 2023 годы № 12 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении формы отчета № 1-ЭТ «О правонарушениях, связанных с экстремизмом и терроризмом и о состоянии прокурорского надзора» и Инструкции по его формированию
  kaz: «Экстремизмге және терроризмге байланысты құқық бұзушылықтар туралы және прокурорлық қадағалаудың жай-күйі туралы» № 1-ЭТ есеп нысанын және оны қалыптастыру жөніндегі нұсқаулықты бекіту туралы
