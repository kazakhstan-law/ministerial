act_code: '154243'
requisite: Приказ Генерального Прокурора Республики Казахстан от 1 апреля 2021 года № 42. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 апреля 2021 года № 22486. Утратил силу приказом Генерального Прокурора Республики Казахстан от 10 ноября 2025 года № 139 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм индивидуального рациона питания, продовольствия, оборудования, столово-кухонного инвентаря, для лиц, проходящих первоначальную профессиональную подготовку в Академии правоохранительных органов при Генеральной прокуратуре Республики Казахстан
  kaz: Қазақстан Республикасы Бас прокуратурасының жанындағы Құқық қорғау органдары академиясында алғашқы кәсіптік даярлықтан өтетін адамдарға арналған жеке тамақтану рационының, азық-түліктің, жабдықтың, асханалық–ас үй мүкәммалының заттай нормаларын бекіту туралы
