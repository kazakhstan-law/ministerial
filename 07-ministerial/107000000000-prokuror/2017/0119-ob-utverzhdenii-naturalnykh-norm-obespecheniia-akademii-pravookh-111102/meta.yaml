act_code: '111102'
requisite: Приказ Генерального прокурора Республики Казахстан от 19 января 2017 года № 5. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 апреля 2017 года № 14991. Утратил силу приказом Генерального Прокурора Республики Казахстан от 10 ноября 2025 года № 139 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении натуральных норм обеспечения Академии правоохранительных органов при Генеральной прокуратуре Республики Казахстан служебными автомобилями, телефонной связью, офисной мебелью и площадями для размещения аппарата государственного учреждения
  kaz: Қазақстан Республикасы Бас прокуратурасының жанындағы Құқық қорғау органдары академиясын қызметтік автомобильдермен, телефон байланысымен, кеңсе жиһазымен және мемлекеттік мекеменің аппаратын орналастыру үшін аумақпен қамтамасыз етудің заттай нормаларын бекіту туралы
