act_code: '110653'
requisite: Приказ Генерального прокурора Республики Казахстан от 8 февраля 2017 года № 10. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 марта 2017 года № 14898. Утратил силу приказом Генерального Прокурора Республики Казахстан от 27 февраля 2018 года № 29 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: «Об утверждении Правил ведения учета лиц, привлеченных к уголовной ответственности за совершение уголовных правонарушений против половой неприкосновенности несовершеннолетних»
  kaz: «Кәмелетке толмағандарға жыныстық тиіспеушілікке қарсы қылмыстық құқық бұзушылықтар жасағаны үшін қылмыстық жауаптылыққа тартылған адамдарды есепке алуды жүргізу қағидаларын бекіту туралы»
