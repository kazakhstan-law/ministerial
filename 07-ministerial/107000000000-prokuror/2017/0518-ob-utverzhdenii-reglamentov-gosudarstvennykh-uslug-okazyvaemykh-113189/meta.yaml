requisite: Приказ Генерального прокурора Республики Казахстан от 18 мая 2017 года № 49. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 июня 2017 года № 15254. Утратил силу приказом Генерального Прокурора Республики Казахстан от 22 января 2019 года № 7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламентов государственных услуг, оказываемых Комитетом по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан и его территориальными управлениями
  kaz: Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөніндегі комитетімен және оның аумақтық басқармаларымен көрсетілетін мемлекеттік көрсетілетін қызметтер регламенттерін бекіту туралы
