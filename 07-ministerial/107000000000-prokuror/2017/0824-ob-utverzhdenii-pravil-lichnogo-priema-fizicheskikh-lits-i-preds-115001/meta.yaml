    kaz: «Қазақстан Республикасы прокуратура органдары лауазымды адамдарының жеке тұлғаларды және заңды тұлғалардың өкілдерін жеке қабылдау қағидаларын бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2017 жылғы 24 тамыздағы № 87 бұйрығына өзгерістер мен толықтыру енгізу туралы
