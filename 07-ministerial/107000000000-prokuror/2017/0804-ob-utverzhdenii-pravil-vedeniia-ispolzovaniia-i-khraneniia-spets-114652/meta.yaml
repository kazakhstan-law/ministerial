act_code: '114652'
requisite: Приказ Генерального прокурора Республики Казахстан от 4 августа 2017 года № 78. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 сентября 2017 года № 15639
title:
  rus: Об утверждении Правил ведения, использования и хранения специальных учетов разыскиваемых лиц, скрывшихся от дознания, следствия, суда, а также лиц, уклоняющихся от отбывания наказания или осуществления пробационного контроля, разыскиваемых лиц, пропавших без вести, утративших связь с родственниками, не способных сообщить о себе установочные данные, трупов, личность которых не установлена, и разыскиваемых лиц, являющихся должниками по исполнительным производствам, ответчиками по искам, предъявленным в интересах государства, а также о взыскании алиментов, возмещении вреда, причиненного увечьем или иным повреждением здоровью, смертью кормильца
  kaz: Анықтаудан, тергеуден, соттан жасырынған іздестірудегі адамдарды, сондай-ақ жазасын өтеуден немесе пробациялық бақылауды жүзеге асырудан жалтарған, хабарсыз кеткен іздестірудегі адамдарды, туыстарымен байланысын жоғалтқан, өзі туралы анықтамалық деректерді хабарлауға қабілеті жоқ адамдарды, жеке басы анықталмаған мәйiттердi және атқарушылық істер жүргізу бойынша борышкерлер, мемлекет мүддесіне орай, сондай-ақ алименттер өндіріп алу, мертігуден немесе денсаулығының өзге де зақымдануынан, асыраушысының қайтыс болуынан келген зиянды өтеу туралы талап қоюлар бойынша жауапкерлер болып табылатын іздестірудегі адамдарды арнайы есепке алуды жүргізу, оны пайдалану және сақтау қағидаларын бекіту туралы
