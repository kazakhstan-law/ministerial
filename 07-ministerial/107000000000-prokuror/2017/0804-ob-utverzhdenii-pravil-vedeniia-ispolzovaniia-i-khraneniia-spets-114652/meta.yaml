  title:
    rus: О внесении изменений в приказ Генерального Прокурора Республики Казахстан от 4 августа 2017 года № 78 «Об утверждении Правил ведения и использования специальных учетов лиц, скрывшихся от дознания, следствия, суда, а также лиц, уклоняющихся от отбывания наказания или осуществления пробационного контроля, без вести пропавших, утративших связь с родственниками, не способных сообщить о себе установочные данные, трупов, личность которых не установлена и разыскиваемых лиц, являющихся должниками по исполнительному производству, ответчиками по искам, предъявленным в интересах государства, а также о взыскании алиментов, возмещении вреда, причиненного увечьем или иным повреждением здоровью, смертью кормильца»
    kaz: «Анықтаудан, тергеуден, соттан жасырынған адамдарды, сондай-ақ жазасын өтеуден немесе пробациялық бақылауды жүзеге асырудан жалтарған, хабарсыз кеткен, туыстарымен байланысын жоғалтқан, өзі туралы анықтамалық деректерді хабарлауға қабілеті жоқ адамдарды, жеке басы анықталмаған мәйiттердi және атқарушылық іс жүргізу бойынша борышкерлер, мемлекет мүддесіне орай, сондай-ақ алименттер өндіріп алу, мертігуден немесе денсаулығының өзге де зақымдануынан, асыраушысының қайтыс болуынан келген зиянды өтеу туралы талап қоюлар бойынша жауапкерлер болып табылатын іздестірудегі адамдарды арнайы есепке алуды жүргізу оны пайдалану, және сақтау қағидаларын бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2017 жылғы 4 тамыздағы № 78 бұйрығына өзгерістер енгізу туралы
