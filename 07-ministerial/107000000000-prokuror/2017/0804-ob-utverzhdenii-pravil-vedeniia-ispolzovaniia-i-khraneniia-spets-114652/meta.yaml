  title:
    rus: О внесении изменений в приказ Генерального Прокурора Республики Казахстан от 4 августа 2017 года № 78 «Об утверждении Правил ведения и использования специальных учетов лиц, скрывшихся от дознания, следствия, суда, а также лиц, уклоняющихся от отбывания наказания или осуществления пробационного контроля, без вести пропавших, утративших связь с родственниками, не способных сообщить о себе установочные данные, трупов, личность которых не установлена и разыскиваемых лиц, являющихся должниками по исполнительному производству, ответчиками по искам, предъявленным в интересах государства, а также о взыскании алиментов, возмещении вреда, причиненного увечьем или иным повреждением здоровью, смертью кормильца»
    kaz: «Анықтаудан, тергеуден, соттан және жазасын өтеуден жасырынып жүрген немесе пробациялық бақылауды жүзеге асырудан жалтарып жүрген, хабар-ошарсыз жоғалып кеткен, туысқандарымен байланысты жоғалтқан адамдарды, өзі туралы анықтамалық деректерді хабарлауға қабілеті жоқ адамдарды, жеке басы анықталмаған мәйіттерді және атқарушылық іс жүргізу бойынша борышкерлер, мемлекеттің мүддесі үшін ұсынылған, сондай-ақ алименттер өндіріп алу туралы, мертігуден болмаса денсаулығының өзге де зақымдануынан, асыраушының мертігуінен немесе денсаулығының өзге де зақымдануынан, қайтыс болуынан келген залалды өтеу туралы қуынымдар бойынша жауапкер болып табылатын іздеудегі адамдарды арнайы есепке алуды жүргізу және пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2017 жылғы 4 тамыздағы № 78 бұйрығына өзгерістер енгізу туралы
