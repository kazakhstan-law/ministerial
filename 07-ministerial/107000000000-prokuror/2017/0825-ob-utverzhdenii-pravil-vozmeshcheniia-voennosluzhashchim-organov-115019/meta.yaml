title:
  rus: Об утверждении Правил возмещения военнослужащим органов военной прокуратуры Республики Казахстан расходов за счет государства на внутриреспубликанские перевозки собственного имущества на железнодорожном, автомобильном и внутреннем водном транспорте
  kaz: Қазақстан Республикасы әскери прокуратура органдарының әскери қызметшілеріне өз мүлкін теміржол, автомобиль және ішкі су көлігімен республикаішілік тасымалдауға жұмсалатын шығыстарды мемлекет есебінен өтеу қағидаларын бекіту туралы
