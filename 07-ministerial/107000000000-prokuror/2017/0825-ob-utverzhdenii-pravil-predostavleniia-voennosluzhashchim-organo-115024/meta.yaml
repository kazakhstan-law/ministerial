title:
  rus: Об утверждении Правил предоставления военнослужащим органов военной прокуратуры Республики Казахстан и членам их семей права на проезд за счет государства внутренними и международными авиамаршрутами на воздушном транспорте
  kaz: Қазақстан Республикасы әскери прокуратура органдарының әскери қызметшілері мен олардың отбасы мүшелеріне әуе көлігімен ішкі және халықаралық авиамаршруттармен мемлекет есебінен жол жүру құқығын беру қағидаларын бекіту туралы
