requisite: Приказ Генерального прокурора Республики Казахстан от 30 июня 2017 года № 68. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 августа 2017 года № 15516. Утратил силу приказом Генерального Прокурора Республики Казахстан от 27 февраля 2018 года № 29 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил ведения и использования специальных учетов лиц, совершивших уголовные правонарушения,  привлекаемых к уголовной ответственности, лиц, привлеченных к уголовной ответственности за совершение уголовного правонарушения и дактилоскопического учета задержанных, содержащихся под стражей и осужденных лиц
  kaz: Қылмыстық жауаптылыққа тартылатын, қылмыстық құқық бұзушылықтар жасаған адамдардың, қылмыстық құқық бұзушылық жасағаны үшін қылмыстық жауаптылыққа тартылған адамдардың арнайы есебін, ұстап алынған, күзетпен ұсталатын және сотталған адамдардың дактилоскопиялық есебін жүргізу және пайдалану қағидаларын бекіту туралы
