  title:
    rus: О внесении изменения в приказ Генерального Прокурора Республики Казахстан от 9 марта 2017 года № 24 «Об утверждении стандарта государственной услуги «Выдача сведений по учетам Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан о совершении лицом административного правонарушения»»
    kaz: «Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөніндегі комитетінің есептері бойынша тұлғаның әкімшілік құқық бұзушылық жасағаны туралы мәлімет беру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2017 жылғы 9 наурыздағы № 24 бұйрығына өзгеріс енгізу туралы
