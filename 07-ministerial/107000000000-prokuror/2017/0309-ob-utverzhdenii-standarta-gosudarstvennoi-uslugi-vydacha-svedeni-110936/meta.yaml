act_code: '110936'
requisite: Приказ Генерального прокурора Республики Казахстан от 9 марта 2017 года № 24. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 апреля 2017 года № 14977. Утратил силу приказом Генерального Прокурора Республики Казахстан от 18 мая 2020 года № 64 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении стандарта государственной услуги «Выдача сведений по учетам Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан о совершении лицом административного правонарушения»
  kaz: «Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөніндегі комитетінің есептері бойынша тұлғаның әкімшілік құқық бұзушылық жасағаны туралы мәлімет беру» мемлекеттік көрсетілетін қызмет стандартын бекіту туралы
