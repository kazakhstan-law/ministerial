  title:
    rus: О внесении изменений и дополнений в приказ Генерального Прокурора Республики Казахстан от 1 марта 2004 года № 12 "Об утверждении Инструкции о представлении, регистрации и ведении информационных учетных документов всех проверок деятельности хозяйствующих субъектов"
    kaz: Қазақстан Республикасы Бас Прокурорының 2004 жылғы 1 наурыздағы N 12 "Шаруашылық жүргізуші субъектілердің қызметіне жүргізілген барлық тексеруді ақпараттық есепке алу құжаттарын тапсыру, тіркеу және жүргізу жөніндегі нұсқаулықты бекіту туралы" бұйрығына өзгерістер мен толықтырулар енгізу туралы
