requisite: Приказ Генерального Прокурора Республики Казахстан от 13 августа 2012 года № 93. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 августа 2012 года № 7872. Утратил силу приказом Генерального прокурора Республики Казахстан от 6 января 2014 года № 2
title:
  rus: Об утверждении Инструкции об организации прокурорского надзора за соблюдением законности при исполнении наказаний, содержании лиц в специальных учреждениях и осуществлении контроля за освобожденными из мест лишения свободы
  kaz: Жазаны орындауда, арнайы мекемелерде адамдардың ұсталуында және бас бостандығынан айыру орындарынан босағандарды бақылауда заңдылықтың сақталуына прокурорлық қадағалауды ұйымдастыру туралы нұсқаулықты бекіту туралы
