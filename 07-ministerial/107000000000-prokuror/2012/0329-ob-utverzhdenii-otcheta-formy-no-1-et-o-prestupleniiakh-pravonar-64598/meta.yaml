act_code: '64598'
requisite: Приказ Генерального Прокурора Республики Казахстан от 29 марта 2012 года № 33. Зарегистрирован в Министерстве юстиции Республики Казахстан 10 апреля 2012 года № 7539. Утратил силу приказом Генерального Прокурора Республики Казахстан от 9 октября 2014 года № 113
title:
  rus: Об утверждении отчета формы № 1-ЭТ "О преступлениях, правонарушениях, связанных с экстремизмом, террористической деятельностью и о состоянии прокурорского надзора", Инструкции по его составлению и введении банка данных о лицах, привлеченных к ответственности за совершение преступлений и правонарушений, связанных с экстремизмом, террористической деятельностью и организациях, признанных судом экстремистскими, террористическими"
  kaz: '"Экстремизмге, террорлық әрекетке байланысты қылмыстар, құқық бұзушылықтар туралы және прокурорлық қадағалау жағдайы туралы" № 1-ЭТ нысанды есепті, оның құрылуы жөніндегі Нұсқаулықты бекіту туралы және экстремизмге, террорлық әрекетке байланысты қылмыстар мен құқық бұзушылықтар жасағаны үшін жауапқа тартылған адамдар және сот экстремистік, террорлық деп таныған ұйымдар туралы деректер банкін енгізу туралы"'
