requisite: Приказ Генерального Прокурора Республики Казахстан от 20 июля 2026 года № 118. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 июля 2026 года № 39461
title:
  rus: Об утверждении Правил создания Комиссии по досудебному урегулированию споров между инвесторами и государственными органами, местными исполнительными органами, учреждениями, субъектами квазигосударственного сектора при Комитете по защите прав инвесторов Генеральной прокуратуры Республики Казахстан
  kaz: Қазақстан Республикасы Бас прокуратурасының Инвесторлардың құқықтарын қорғау комитеті жанындағы Инвесторлар мен мемлекеттік органдар, жергілікті атқарушы органдар, мекемелер, квазимемлекеттік сектор субъектілері арасындағы дауларды сотқа дейінгі реттеу комиссиясын құру қағидаларын бекіту туралы
