act_code: '4508'
requisite: Приказ Генерального Прокурора Республики Казахстан от 29 октября 1999 года N 92. Зарегистрирован в Министерстве юстиции Республики Казахстан 29.10.99г. за N 959. Утратил силу - приказом Генерального прокурора РК от 29.12.2000г. N 67
title:
  rus: Об утверждении и введении в действие формы статистической карточки учета проверок в сфере предпринимательства формы N 1-П, формы отчета о регистрации актов о назначении проверок деятельности субъектов предпринимательства и журнала регистрации карточек и актов о назначении проверок деятельности субъектов предпринимательства, Инструкции "О порядке составления статистической карточки учета проверок в сфере предпринимательства по форме N 1-П, отчета о регистрации актов о назначении проверок деятельности субъектов предпринимательства и ведения журнала регистрации карточек и актов о назначении проверок деятельности субъектов предпринимательства", отмене приказов Генерального прокурора Республики Казахстан N 78 от 7 сентября 1999 года и N 86 от 12 октября 1999 года
  kaz: Кәсiпкерлiк саласында тексеру жүргiзудi есепке алу карточкасының N 1-П нысанын, кәсiпкерлiк субъектiлерiнiң қызметiне тексеру тағайындау жөнiндегi актiлердi тiркеудiң есеп беру нысанын, карточкалар мен кәсiпкерлiк субъектiлерiнің қызметiне тексеру тағайындау туралы актiлердi тiркеу журналының нысанын және "Кәсiпкерлiк саласында тексеру жүргiзудi есепке алу N 1-П нысанындағы статистикалық карточканы, кәсiпкерлiк субъектiлерiнiң қызметiне тексеру тағайындау жөнiндегi актiлердi тiркеудiң есебiн және карточкалар мен кәсiпкерлiк субъектiлерiнің қызметiне тексеру тағайындау актiлерiн тiркеу журналын жүргiзу тәртiбi туралы" нұсқауды бекiту және күшiне енгiзу туралы
