  title:
    rus: О внесении изменений в приказ Генерального Прокурора Республики Казахстан от 19 июня 2013 года № 63 "Об утверждении Правил регистрации актов о назначении проверок, уведомлений о приостановлении, возобновлении, продлении сроков проверок, об изменении состава участников и предоставлении информационных документов о проверках и их результатах"
    kaz: '"Тексерулер тағайындау туралы актілерді, тоқтату, қайта жаңғырту, тексеру мерзімдерін ұзарту туралы хабарламаларды, қатысушылардың құрамын өзгерту туралы актілерді тіркеу және тексеру мен оның нәтижелері жөніндегі ақпараттық есепке алу құжаттарын ұсыну ережесін бекіту туралы" Қазақстан Республикасы Бас Прокурорының 2013 жылғы 19 маусымдағы № 63 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
