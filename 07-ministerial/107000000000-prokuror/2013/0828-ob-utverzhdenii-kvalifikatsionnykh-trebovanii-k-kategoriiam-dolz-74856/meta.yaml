title:
  rus: Об утверждении Квалификационных требований к категориям должностей сотрудников системы органов прокуратуры Республики Казахстан
  kaz: Қазақстан Республикасының прокуратура органдары жүйесінің қызметкерлері лауазымдарының санаттарына қойылатын біліктілік талаптарын бекіту туралы
