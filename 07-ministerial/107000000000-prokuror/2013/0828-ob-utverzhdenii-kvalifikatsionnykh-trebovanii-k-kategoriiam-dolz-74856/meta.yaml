  title:
    rus: О внесении изменений в приказ Генерального Прокурора Республики Казахстан от 28 августа 2013 года № 90 «Об утверждении Квалификационных требований для должностей сотрудников органов, ведомств и учреждений прокуратуры Республики Казахстан»
    kaz: «Қазақстан Республикасының прокуратура органдары, ведомстволары мен мекемелері қызметкерлерінің лауазымдары үшін біліктілік талаптарын бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2013 жылғы 28 тамыздағы № 90 бұйрығына өзгерістер енгізу туралы
