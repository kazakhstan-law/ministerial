title:
  rus: Об утверждении Правил вне конкурсного поступления на службу в систему органов прокуратуры Республики Казахстан
  kaz: Қазақстан Республикасының прокуратура органдары жүйесіне қызметке конкурстан тыс қабылдау қағидаларын бекіту туралы
