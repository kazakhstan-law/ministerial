  title:
    rus: О внесении изменений в приказ Генерального Прокурора Республики Казахстан от 24 июля 2013 года № 76 «Об утверждении Правил вне конкурсного поступления на службу в органы, ведомства и учреждения прокуратуры Республики Казахстан»
    kaz: «Қазақстан Республикасының прокуратура органдары, ведомстволары мен мекемелеріне қызметке конкурстан тыс қабылдау қағидасын бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2013 жылғы 24 шілдедегі №76 бұйрығына өзгерістер енгізу туралы
