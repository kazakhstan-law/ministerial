  requisite: Приказ Генерального Прокурора Республики Казахстан от 26 января 2009 года № 4. Зарегистрирован в Министерстве юстиции Республики Казахстан 21 апреля 2009 года № 5639. Утратил силу приказом Генерального Прокурора Республики Казахстан от 26 декабря 2017 года № 165 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнения в некоторые нормативные правовые акты Генерального Прокурора Республики Казахстан по вопросам формирования статистической отчетности
    kaz: Қазақстан Республикасы Бас Прокурорының кейбір нормативтік құқықтық актілеріне статистикалық есептілікті қалыптастыру мәселелері бойынша өзгерістер мен толықтырулар енгізу туралы
