  title:
    rus: О внесении изменений и дополнений в некоторые нормативные правовые акты Генерального Прокурора Республики Казахстан
    kaz: Қазақстан Республикасы Бас Прокурорының кейбір нормативтік құқықтық актілеріне өзгерістер мен толықтырулар енгізу туралы
