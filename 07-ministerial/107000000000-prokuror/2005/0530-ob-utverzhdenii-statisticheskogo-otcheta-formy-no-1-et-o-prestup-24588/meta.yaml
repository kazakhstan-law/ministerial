act_code: '24588'
requisite: Приказ Генерального прокурора Республики Казахстан от 30 мая 2005 года № 19. Зарегистрирован в Министерстве юстиции Республики Казахстан 29 июня 2005 года № 3703. Утратил силу приказом Генерального Прокурора Республики Казахстан от 29 марта 2012 года № 33
title:
  rus: Об утверждении статистического отчета формы № 1-ЭТ "О преступлениях, правонарушениях, связанных с экстремизмом, террористической деятельностью и о состоянии прокурорского надзора", Инструкции по его составлению и введении банка данных о лицах, привлеченных к ответственности за совершение преступлений и правонарушений, связанных с экстремизмом, террористической деятельностью и организациях, признанных судом экстремистскими, террористическими
  kaz: '"Экстремизмге, лаңкестікке байланысты қылмыстар мен құқықбұзушылықтар және прокурорлық қадағалау туралы" N1-ЭТ нысанды статистикалық есептің және олардың құрылуы бойынша Нұсқаулықтың бекітілуі туралы, экстремизмге, лаңкестікке байланысты қылмыстар мен құқықбұзушылықтар жасағаны үшін жауаптылыққа тартылған тұлғаларды, сондай-ақ сот арқылы экстремистік, лаңкестік болып танылған ұйымдарды деректер базасына енгізу туралы'
