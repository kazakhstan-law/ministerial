title:
  rus: Об утверждении Инструкции по ведению единого карточного учета заявлений и сообщений о преступлениях, уголовных дел, результатов их расследования и судебного рассмотрения (Единая унифицированная статистическая система)
  kaz: Қылмыстар туралы өтініштер мен хабарларды, қылмыстық істерді, олардың тергелуі және сотта қарастырылу нәтижелерінің бірыңғай кәртішкелік есепке алу негізінде жүргізу туралы Нұсқаулықтың бекітілуі жөнінде (Бірыңғай бірегейлік статистикалық жүйе)
