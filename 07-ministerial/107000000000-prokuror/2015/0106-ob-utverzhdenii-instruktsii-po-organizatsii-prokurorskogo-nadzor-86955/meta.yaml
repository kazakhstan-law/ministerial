act_code: '86955'
requisite: Приказ Генерального Прокурора Республики Казахстан от 6 января 2015 года № 7. Зарегистрирован в Министерстве юстиции Республики Казахстан 7 февраля 2015 года № 10202. Утратил силу приказом Генерального прокурора Республики Казахстан от 13 сентября 2017 года № 104 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по организации прокурорского надзора за соблюдением законности при исполнении наказаний, содержании лиц в специальных учреждениях и осуществлении контроля за освобожденными из мест лишения свободы
  kaz: Жазаны орындау, арнайы мекемелерде адамдарды ұстау және бас бостандығынан айыру орындарынан босағандарға бақылау жүргізу кезінде заңдылықтың сақталуына прокурорлық қадағалауды ұйымдастыру жөніндегі Нұсқаулықты бекіту туралы
