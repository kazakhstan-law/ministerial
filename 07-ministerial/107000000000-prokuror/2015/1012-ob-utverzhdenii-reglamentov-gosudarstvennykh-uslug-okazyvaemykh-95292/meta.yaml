  title:
    rus: О внесении изменений в приказ Генерального Прокурора Республики Казахстан от 12 октября 2015 года № 121 "Об утверждении Регламентов государственных услуг, оказываемых Комитетом по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан и его территориальными управлениями"
    kaz: '"Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөніндегі комитетімен және оның аумақтық басқармаларымен көрсетілетін мемлекеттік көрсетілетін қызметтер регламенттерін бекітутуралы" Қазақстан Республикасы Бас Прокурорының 2015 жылғы 12 қазандағы № 121 бұйрығына өзгерістер енгізу туралы'
