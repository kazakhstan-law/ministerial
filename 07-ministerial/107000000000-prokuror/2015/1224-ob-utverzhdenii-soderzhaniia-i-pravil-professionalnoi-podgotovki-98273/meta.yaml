  requisite: Совместный приказ Генерального Прокурора Республики Казахстан от 28 августа 2026 года № 144, Председателя Агентства Республики Казахстан по финансовому мониторингу от 31 августа 2026 года № 15 и Министра внутренних дел Республики Казахстан от 31 августа 2026 года № 621. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 августа 2026 года № 39774
  title:
    rus: О внесении изменения в совместный приказ Генерального Прокурора Республики Казахстан от 24 декабря 2015 года № 152, Министра финансов Республики Казахстан от 25 декабря 2015 года № 684, Министра по делам государственной службы Республики Казахстан от 28 декабря 2015 года № 3 и Министра внутренних дел Республики Казахстан от 25 декабря 2015 года № 1062 «Об утверждении Содержания и Правил профессиональной подготовки, переподготовки и повышения квалификации сотрудников правоохранительных органов Республики Казахстан»
    kaz: «Қазақстан Республикасының құқық қорғау органдары қызметкерлерін кәсіби даярлау, қайта даярлау және олардың біліктілігін арттырудың мазмұны мен қағидаларын бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2015 жылғы 24 желтоқсандағы № 152, Қазақстан Республикасы Қаржы министрінің 2015 жылғы 25 желтоқсандағы № 684, Қазақстан Республикасы Мемлекеттік қызмет істері министрінің 2015 жылғы 28 жетоқсандағы № 3 және Қазақстан Ресубликасы Ішкі істер министрінің 2015 жылғы 25 желтоқсандағы № 1062 бірлескен бұйрығына өзгеріс енгізу туралы
