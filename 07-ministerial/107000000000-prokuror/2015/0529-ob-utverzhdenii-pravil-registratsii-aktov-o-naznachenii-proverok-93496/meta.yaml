act_code: '93496'
requisite: Приказ Генерального Прокурора Республики Казахстан от 29 мая 2015 года № 67. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 июля 2015 года № 11564. Утратил силу приказом Генерального Прокурора Республики Казахстан от 26 января 2016 года № 13
title:
  rus: Об утверждении Правил регистрации актов о назначении проверок, уведомлений о приостановлении, возобновлении, продлении сроков проверок, об изменении состава участников и представлении информационных учетных документов о проверках и их результатах
  kaz: Тексерудiң тағайындалғаны туралы актiлердi, тексеруді тоқтата тұру, қайта бастау, оның мерзімдерін ұзарту туралы, қатысушылар құрамын өзгерту және тексеру мен оның нәтижелерi туралы ақпараттық есептiк құжаттарды ұсыну туралы хабарлау қағидасын бекіту туралы
