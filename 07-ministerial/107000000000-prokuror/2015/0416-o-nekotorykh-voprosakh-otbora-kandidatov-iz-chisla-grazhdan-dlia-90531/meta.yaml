title:
  rus: О некоторых вопросах отбора кандидатов из числа граждан для поступления на воинскую службу по контракту в органы, ведомства и учреждения прокуратуры Республики Казахстан
  kaz: Қазақстан Республикасының прокуратура органдарына, ведомстволарына және мекемелеріне келісімшарт бойынша әскери қызметке кіру үшін азаматтар ішінен кандидаттарды  іріктеу жөніндегі кейбір мәселелері туралы
