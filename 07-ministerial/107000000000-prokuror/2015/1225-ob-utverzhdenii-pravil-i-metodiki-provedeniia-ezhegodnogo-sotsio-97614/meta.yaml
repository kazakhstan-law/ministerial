title:
  rus: Об утверждении Правил и методики проведения ежегодного социологического мониторинга состояния морально-психологического климата в подразделениях органов прокуратуры Республики Казахстан.
  kaz: Қазақстан Республикасы прокуратура органдарының бөлімшелеріндегі моральдық-психологиялық ахуалдың жай-күйіне жыл сайынғы социологиялық мониторинг жүргізудің қағидалары мен әдістемесін бекіту туралы
