  title:
    rus: О внесении изменения в приказ Генерального Прокурора Республики Казахстан от 13 августа 2015 года № 101 "Об утверждении Правил Приема на обучение в Академию правоохранительных органов при Генеральной прокуратуре Республики Казахстан, реализующую профессиональные учебные программы послевузовского образования"
    kaz: '"Жоғары оқу орнынан кейінгі білім берудің кәсіби оқу бағдарламаларын іске асыратын Қазақстан Республикасы Бас прокуратурасы жанындағы Құқық қорғау органдары академиясына Оқуға қабылдау ережелерін бекіту туралы" Қазақстан Республикасы Бас Прокурорының 2015 жылғы 13 тамыздағы № 101 бұйрығына өзгеріс енгізу туралы'
