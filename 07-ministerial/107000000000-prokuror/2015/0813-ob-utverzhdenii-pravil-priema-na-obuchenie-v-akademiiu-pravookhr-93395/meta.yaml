    kaz: «Жоғары оқу орнынан кейінгі білім берудің білім беру бағдарламаларын іске асыратын Қазақстан Республикасы Бас прокуратурасының жанындағы Құқық қорғау органдары академиясына оқуға қабылдау қағидаларын бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2015 жылғы 13 тамыздағы № 101 бұйрығына өзгерістер енгізу туралы
