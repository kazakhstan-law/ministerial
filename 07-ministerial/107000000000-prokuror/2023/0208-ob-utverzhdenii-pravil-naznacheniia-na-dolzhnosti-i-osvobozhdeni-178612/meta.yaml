title:
  rus: Об утверждении Правил назначения на должности и освобождения от должностей прокуроров и иных работников, за исключением должностей, назначаемых Президентом Республики Казахстан и (или) по согласованию с ним, а также с Администрацией Президента Республики Казахстан
  kaz: Қазақстан Республикасының Президенті тағайындайтын және (немесе) онымен, сондай-ақ Қазақстан Республикасы Президентінің Әкімшілігімен келісім бойынша тағайындалатын лауазымдарды қоспағанда, прокурорлар мен өзге де қызметкерлерді лауазымдарға тағайындау және лауазымдардан босату қағидаларын бекіту туралы
