title:
  rus: Об утверждении Правил регистрации, учета обращений, поступающих в государственные органы, органы местного самоуправления, юридические лица со стопроцентным участием государства, а также ведения информационной аналитической системы «Электронные обращения»
  kaz: Мемлекеттік органдарға, жергілікті өзін-өзі басқару органдарына, мемлекет жүз пайыз қатысатын заңды тұлғаларға келіп түсетін жолданымдарды тіркеу, есепке алу, сондай-ақ «Электрондық жолданымдар» ақпараттық-талдау жүйесін жүргізу қағидаларын бекіту туралы
