  title:
    rus: О внесении изменений и дополнений в приказ Генерального Прокурора Республики Казахстан от 5 января 2023 года № 8 «Об утверждении Инструкции по приему, выдаче, ознакомлению, хранению и уничтожению прекращенных уголовных дел подразделениями архивной работы Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан»
    kaz: «Құқық қорғау, арнаулы мемлекеттік және өзге де органдардың ақпарат алмасу жүйесінен мәліметтерді қалыптастыру, оларға қол жеткізу, пайдалану, сақтау, қорғау және жою қағидаларын бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2023 жылғы 13 қаңтардағы № 21 бұйрығына өзгерістер енгізу туралы
