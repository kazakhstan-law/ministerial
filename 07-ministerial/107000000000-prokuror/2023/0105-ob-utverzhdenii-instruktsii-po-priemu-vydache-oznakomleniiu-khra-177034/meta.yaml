title:
  rus: Об утверждении Инструкции по приему, выдаче, ознакомлению, хранению и уничтожению прекращенных уголовных дел подразделениями архивной работы Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан
  kaz: Қазақстан Республикасы Бас прокуратурасы Құқықтық статистика және арнайы есепке алу жөніндегі комитеті архивтік жұмыс бөлімшелерінің тоқтатылған қылмыстық істерді қабылдау, беру, таныстыру, сақтау және жою жөніндегі нұсқаулықты бекіту туралы
