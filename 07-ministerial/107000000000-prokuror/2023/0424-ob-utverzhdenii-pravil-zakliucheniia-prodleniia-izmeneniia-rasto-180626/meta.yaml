  kaz: Қазақстан Республикасы Бас прокуратурасының жанындағы Құқық қорғау органдары академиясының магистратурасына және докторантурасына түсетін адамдармен келісімшарт жасасу, ұзарту, өзгерту, бұзу және тоқтату қағидаларын бекіту туралы
