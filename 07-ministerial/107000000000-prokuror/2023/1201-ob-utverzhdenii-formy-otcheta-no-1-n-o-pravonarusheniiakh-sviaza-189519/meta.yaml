act_code: '189519'
requisite: Приказ Генерального Прокурора Республики Казахстан от 1 декабря 2023 года № 213. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 декабря 2023 года № 33723
title:
  rus: Об утверждении формы отчета № 1-Н «О правонарушениях, связанных с незаконным оборотом наркотических средств, психотропных веществ, их аналогов и прекурсоров, ядовитых веществ, а также конфискованного имущества по уголовным делам» и Инструкции по его формированию»
  kaz: «Есірткі құралдарының, психотроптық заттардың, сол тектестер мен прекурсорларының, улы заттардың, сондай-ақ қылмыстық істер бойынша тәркіленген мүліктің заңсыз айналымына байланысты құқық бұзушылықтар туралы» № 1-Н есеп нысанын және оны қалыптастыру жөніндегі нұсқаулықты бекіту туралы
