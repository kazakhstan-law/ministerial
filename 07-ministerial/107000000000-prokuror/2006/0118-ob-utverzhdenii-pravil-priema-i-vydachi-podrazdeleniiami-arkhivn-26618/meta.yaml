act_code: '26618'
requisite: Приказ Генерального Прокурора Республики Казахстан от 18 января 2006 года № 7. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 февраля 2006 года № 4087. Утратил силу приказом Генерального Прокурора Республики Казахстан от 5 сентября 2022 года № 179 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил приема и выдачи подразделениями архивной работы Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан прекращенных уголовных дел и материалов, по которым органами прокуратуры вынесены постановления об отказе в возбуждении уголовного дела
  kaz: Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөнiндегi комитетiнiң мұрағат жұмыстары бөлiмшесiмен прокуратура органдары арқылы қылмыстық iстердi қозғаудан бас тарту туралы қаулылары шыққан қысқартылған қылмыстық iстер мен материалдарды қабылдау және беру Ережесiн бекiту туралы
