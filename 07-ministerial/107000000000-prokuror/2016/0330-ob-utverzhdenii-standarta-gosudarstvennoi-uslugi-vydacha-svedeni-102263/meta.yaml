act_code: '102263'
requisite: Приказ Генерального Прокурора Республики Казахстан от 30 марта 2016 года № 53. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 мая 2016 года № 13696. Утратил силу приказом Генерального прокурора Республики Казахстан от 9 марта 2017 года № 24
title:
  rus: Об утверждении стандарта государственной услуги "Выдача сведений по учетам Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан о совершении лицом административного правонарушения"
  kaz: '"Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөніндегі комитетінің есептері бойынша тұлғаның әлімшілік құқық бұзушылық жасағаны туралы мәлімет беру"мемлекеттік көрсетілутін қызметтің стандартын бекіту туралы'
