title:
  rus: Об утверждении Правил проведения текущего контроля успеваемости, промежуточной и итоговой аттестации обучающихся Академии правоохранительных органов при Генеральной прокуратуре Республики Казахстан
  kaz: Қазақстан Республикасы Бас прокуратурасының жанындағы Құқық қорғау органдары академиясында білім алушылардың үлгеріміне ағымдағы бақылау, оларға аралық және қорытынды аттестаттау жүргізу қағидаларын бекіту туралы
