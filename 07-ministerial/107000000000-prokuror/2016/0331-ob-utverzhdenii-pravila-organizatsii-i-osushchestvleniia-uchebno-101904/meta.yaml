title:
  rus: Об утверждении Правила организации и осуществления учебного процесса, учебно-методической и научно-методической деятельности в Академии правоохранительных органов при Генеральной прокуратуре Республики Казахстан
  kaz: Қазақстан Республикасы Бас прокуратурасының жанындағы Құқық қорғау органдары академиясында оқу процесін, оқу-әдістемелік және ғылыми-әдістемелік қызметті ұйымдастыру және жүзеге асыру қағидаларын бекіту туралы
