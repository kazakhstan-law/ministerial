act_code: '105713'
requisite: Приказ Генерального Прокурора Республики Казахстан от 14 июля 2016 года № 125. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 августа 2016 года № 14126. Утратил силу приказом Генерального Прокурора Республики Казахстан от 5 августа 2024 года № 99 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении отчета формы № 3-К «О коррупционных преступлениях, лицах их совершивших, осужденных, движении уголовных дел о коррупционных преступлениях и о субъектах коррупционных правонарушений» и Инструкции по его формированию"
  kaz: «Сыбайлас жемқорлық қылмыстар,оларды жасаған, сотталған адамдар, сыбайлас жемқорлық қылмыстар жөніндегі қылмыстық істердің қозғалысы және сыбайлас жемқорлық құқық бұзушылық субъектілері туралы» № 3-К нысанды есепті және оны қалыптастыру жөніндегі Нұсқаулықты бекіту туралы
