    kaz: «Сыбайлас жемқорлық қылмыстар, оларды жасаған, сотталған адамдар, сыбайлас жемқорлық қылмыстар жөніндегі қылмыстық істердің қозғалысы және сыбайлас жемқорлық құқық бұзушылық субъектілері туралы» № 3-К нысанды есепті және оны қалыптастыру жөніндегі Нұсқаулықты бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2016 жылғы 14 шілдедегі № 125 бұйрығына өзгерістер енгізу туралы
