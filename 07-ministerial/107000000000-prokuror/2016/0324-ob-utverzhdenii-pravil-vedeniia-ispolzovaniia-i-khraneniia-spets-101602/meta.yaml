act_code: '101602'
requisite: Приказ Генерального Прокурора Республики Казахстан от 24 марта 2016 года № 49. Зарегистрирован в Министерстве юстиции Республики Казахстан 22 апреля 2016 года № 13613
title:
  rus: Об утверждении Правил ведения, использования и хранения специальных учетов лиц, привлеченных к ответственности за осуществление террористической деятельности, а также организаций и информационных материалов, признанных судом террористическими, и лиц, привлеченных к ответственности за совершение экстремизма, а также организаций и информационных материалов, признанных судом экстремистскими
  kaz: Террористік іс-әрекетті жүзеге асырғаны үшін жауаптылыққа тартылған адамдарды, сондай-ақ cот террористік деп таныған ұйымдарды және ақпараттық материалдарды және экстремизмді жасағаны үшін жауаптылыққа тартылған адамдарды, сондай-ақ cот экстремистік деп таныған ұйымдарды және ақпараттық материалдарды арнайы есепке алуды жүргізу, пайдалану және сақтау қағидаларын бекіту туралы
