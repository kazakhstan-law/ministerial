act_code: '99418'
requisite: Приказ Генерального Прокурора Республики Казахстан от 26 января 2016 года № 13. Зарегистрирован в Министерстве юстиции Республики Казахстан 23 февраля 2016 года № 13171. Утратил силу приказом и.о. Генерального Прокурора Республики Казахстан от 25 декабря 2020 года № 162 (вводится в действие с 1 января 2021 года)
title:
  rus: Об утверждении Правил регистрации актов о назначении, дополнительных актов о продлении сроков проверки и профилактического контроля и надзора с посещением субъекта (объекта) контроля и надзора и их отмены, уведомлений о приостановлении, возобновлении, продлении сроков проверки и профилактического контроля и надзора с посещением субъекта (объекта) контроля и надзора, изменении состава участников и представлении информационных учетных документов о проверке и профилактическом контроле и надзоре с посещением субъекта (объекта) контроля и надзора и их результатах
  kaz: Тексеруді және бақылау және қадағалау субъектісіне (объектісіне) бару арқылы профилактикалық бақылау мен қадағалауды тағайындау туралы актілерді, олардың мерзімдерін ұзарту туралы қосымша актілерді тіркеу және олардың күшін жою, тексеру және бақылау және қадағалау субъектісіне (объектісіне) бару арқылы профилактикалық бақылау мен қадағалау мерзімдерін тоқтата тұру, қайта бастау, ұзарту, қатысушылар құрамын өзгерту туралы хабарламаларды тіркеу және тексеру және бақылау және қадағалау субъектісіне (объектісіне) бару арқылы профилактикалық бақылау мен қадағалау, және олардың нәтижелері туралы ақпараттық есепке алу құжаттарын ұсыну қағидаларын бекіту туралы
