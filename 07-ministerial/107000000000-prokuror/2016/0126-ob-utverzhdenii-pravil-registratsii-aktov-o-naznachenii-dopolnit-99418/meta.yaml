  title:
    rus: О внесении изменений в приказ Генерального Прокурора Республики Казахстан от 26 января 2016 года № 13 «Об утверждении Правил регистрации актов о назначении проверки, уведомлений о приостановлении, возобновлении, продлении сроков проверки, об изменении состава участников и предоставлении информационных учетных документов о проверке и ее результатах»
    kaz: «Тексерудi тағайындау туралы актiлердi, тексеруді тоқтата тұру, қайта бастау, оның мерзімдерін ұзарту туралы, қатысушылар құрамын өзгерту және тексеру мен оның нәтижелерi туралы ақпараттық есепке алу құжаттарын ұсыну туралы хабарламаларды тіркеу қағидаларын бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2016 жылғы 26 қаңтардағы № 13 бұйрығына өзгерістер енгізу туралы
