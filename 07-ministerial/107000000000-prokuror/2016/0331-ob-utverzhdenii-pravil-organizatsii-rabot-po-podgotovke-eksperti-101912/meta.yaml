  title:
    rus: О внесении изменений и дополнений в некоторые приказы Генерального Прокурора Республики Казахстан по вопросам образовательной деятельности Академии правоохранительных органов при Генеральной прокуратуре Республики Казахстан
    kaz: Қазақстан Республикасы Бас прокуратурасының жанындағы Құқық қорғау органдары академиясының білім беру қызметі мәселелері бойынша Қазақстан Республикасы Бас Прокурорының кейбір бұйрықтарына өзгерістер мен толықтырулар енгізу туралы
