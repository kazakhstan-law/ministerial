title:
  rus: Об утверждении Правил организации работ по подготовке, экспертизе, апробации, изданию и проведению мониторинга учебных изданий и учебно-методических комплексов в Академии правоохранительных органов при Генеральной прокуратуре Республики Казахстан
  kaz: Қазақстан Республикасы Бас прокуратурасының жанындағы Құқық қорғау органдары академиясында оқулық басылымдары мен оқу-әдiстемелiк кешендерді дайындау, сараптау, сынамақтан өткізу, басып шығару және оларға мониторинг жүргізу жөнiндегi жұмыстарды ұйымдастыру қағидаларын бекіту туралы
