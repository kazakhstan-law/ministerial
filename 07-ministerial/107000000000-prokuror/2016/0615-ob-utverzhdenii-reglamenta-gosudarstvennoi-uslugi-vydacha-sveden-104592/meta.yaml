act_code: '104592'
requisite: Приказ Генерального Прокурора Республики Казахстан от 15 июня 2016 года № 110. Зарегистрирован в Министерстве юстиции Республики Казахстан 12 июля 2016 года № 13910. Утратил силу приказом Генерального прокурора Республики Казахстан от 18 мая 2017 года № 49 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении регламента государственной услуги «Выдача сведений по учетам Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан о совершении лицом административного правонарушения»
  kaz: «Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөніндегі комитетінің есептері бойынша тұлғаның әкімшілік құқық бұзушылық жасағаны туралы мәлімет беру» мемлекеттік көрсетілетін қызмет регламентін бекіту туралы
