  title:
    rus: О внесении изменений и дополнения в приказ Генерального Прокурора Республики Казахстан от 25 апреля 2016 года № 84 «Об утверждении форм судебных отчетов в уголовно-правовой сфере, электронных информационных учетных документов и Инструкции по их формированию»
    kaz: «Қылмыстық-құқықтық саладағы сот статистикалық есептерінің, электрондық ақпараттық есепке алу құжаттарының нысандарын және оларды қалыптастыру жөніндегі Нұсқаулықты бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2016 жылғы 25 сәуірдегі № 84 бұйрығына өзгерістер мен толықтыру енгізу туралы
