requisite: Приказ Генерального Прокурора Республики Казахстан от 27 января 2016 года № 15. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 февраля 2016 года № 13198. Утратил силу приказом Генерального Прокурора Республики Казахстан от 3 июня 2019 года № 48 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил ведения учета уведомлений, направляемых органами контроля и надзора в уполномоченный орган, осуществляющий в пределах своей компетенции статистическую деятельность в области правовой статистики и специальных учетов
  kaz: Бақылау және қадағалау органдары өз құзыреті шегінде құқықтық статистика және арнайы есепке алу саласында статистикалық қызметті жүзеге асыратын уәкілетті органға жолдайтын хабарлардың есебін жүргізу қағидаларын бекіту туралы
