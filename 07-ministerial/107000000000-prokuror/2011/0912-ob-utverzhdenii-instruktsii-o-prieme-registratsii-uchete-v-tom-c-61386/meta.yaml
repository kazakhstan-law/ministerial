title:
  rus: Об утверждении Инструкции о приеме, регистрации, учете, в том числе в электронном формате, и рассмотрении заявлений, сообщений, жалоб и иной информации о преступлениях, происшествиях
  kaz: Қылмыстар, оқиғалар туралы өтініштерді, хабарламаларды, шағымдарды және өзге ақпаратты қабылдау, тіркеу, есепке алу, соның ішінде электронды форматта және қарау жөніндегі Нұсқаулықты бекіту туралы
