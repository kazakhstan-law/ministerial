requisite: Приказ Генерального прокурора Республики Казахстан от 18 ноября 2011 года № 122. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 декабря 2011 года № 7330. Утратил силу приказом Генерального прокурора Республики Казахстан от 7 августа 2014 года № 80
title:
  rus: Об утверждении Инструкции по ведению единого карточного учета заявлений, сообщений, жалоб и иной информации о преступлениях, происшествиях, уголовных дел, результатах их расследования, прокурорского надзора и судебного рассмотрения (Единая унифицированная статистическая система)
  kaz: Қылмыстар, оқиғалар, қылмыстық істер, оларды тергеу, прокурорлық қадағалау және сотта қарау нәтижелері туралы өтініштерді, хабарламаларды, шағымдарды және өзге де ақпаратты бірыңғай карточкалық есепке алуды жүргізу жөніндегі Нұсқаулықты (Бірыңғай біріздендірілген статистикалық жүйе) бекіту туралы
