requisite: Приказ Генерального Прокурора Республики Казахстан от 26 января 2011 года № 13. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 февраля 2011 года № 6794. Утратил силу приказом Генерального Прокурора Республики Казахстан от 28 октября 2014 года № 129
title:
  rus: Об утверждении форм отчета № 2-З "О лицах, подвергнутых мерам обеспечения производства по делам об административных правонарушениях" и карточки № 2-З "Карточка учета лиц, подвергнутых мерам обеспечения производства по делам об административных правонарушениях" и Инструкции по их заполнению
  kaz: '"Әкімшілік құқық бұзушылық туралы іс жүргізуді қамтамасыз ету шараларына тартылған тұлғалар туралы" № 2-З нысанды статистикалық есепті және "Әкімшілік құқық бұзушылық туралы іс жүргізуді қамтамасыз ету шараларына тартылған тұлғаларды есепке алу карточкасы" № 2-З карточканы және оларды толтыру бойынша Нұсқаулықты бекіту туралы'
