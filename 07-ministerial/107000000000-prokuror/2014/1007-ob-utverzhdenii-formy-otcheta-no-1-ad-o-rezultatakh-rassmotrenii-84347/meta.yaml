    kaz: «Уәкілетті органдармен әкімшілік құқық бұзушылықтар жөніндегі істерді қарау нәтижелері туралы» № 1-ӘІ нысанды есепті және оны құрастыру бойынша Нұсқаулықты бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2014 жылғы 7 қазандағы № 109 бұйрығына өзгерістер енгізу туралы
