  title:
    rus: О внесении изменений в приказ Генерального Прокурора Республики Казахстан от 8 июля 2014 года № 69 «Об утверждении Правил прохождения компьютерного тестирования на знание законодательства Республики Казахстан и логическое мышление при аттестации сотрудников органов, ведомств и учреждений прокуратуры Республики Казахстан»
    kaz: «Қазақстан Республикасының прокуратура органдары, ведомстволары, мекемелері мен білім беру ұйымдарының қызметкерлерін тестен өтудің қағидалары мен шарттары, сондай-ақ лауазымдардың санаттары үшін шекті мәндер бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2014 жылғы 8 шілдедегі № 69 бұйрығына өзгерістер енгізу туралы
