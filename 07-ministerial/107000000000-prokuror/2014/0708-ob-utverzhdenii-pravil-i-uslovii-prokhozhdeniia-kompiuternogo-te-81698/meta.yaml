  title:
    rus: О внесении изменений и дополнений в приказ Генерального Прокурора Республики Казахстан от 8 июля 2014 года № 69 «Об утверждении Правил прохождения компьютерного тестирования на знание законодательства Республики Казахстан и логическое мышление при аттестации сотрудников органов, ведомств и учреждений прокуратуры Республики Казахстан»
    kaz: «Қазақстан Республикасының прокуратура органдары, ведомстволары мен мекемелерінің қызметкерлерін Қазақстан Республикасының заңнамасын білуге және логикалық ойлау қабілетіне компьютерлік тестілеуден өткізу Қағидаларын бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2014 жылғы 8 шілдедегі № 69 бұйрығына өзгерістер мен толықтырулар енгізу туралы
