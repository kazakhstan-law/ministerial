title:
  rus: Об утверждении Правил и условий прохождения компьютерного тестирования сотрудников системы органов прокуратуры Республики Казахстан, подлежащих аттестации, на знание законодательства Республики Казахстан и логическое мышление
  kaz: Аттестаттауға жатқызылған Қазақстан Республикасының прокуратура органдары жүйесі қызметкерлерінің Қазақстан Республикасы заңнамасын білуін және логикалық ойлау қабілетін компьютерлік тестілеуден өткізудің қағидалары мен шарттарын  бекіту туралы
