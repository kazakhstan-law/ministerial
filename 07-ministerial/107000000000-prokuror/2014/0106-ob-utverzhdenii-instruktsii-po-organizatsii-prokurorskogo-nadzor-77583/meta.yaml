title:
  rus: Об утверждении Инструкции по организации прокурорского надзора за соблюдением законности при исполнении наказаний, содержании лиц в специальных учреждениях и осуществлении контроля за освобожденными из мест лишения свободы
  kaz: Жазаны орындауда, арнайы мекемелерде адамдардың ұсталуында және бас бостандығынан айыру орындарынан босағандарды бақылауда заңдылықтың сақталуына прокурорлық қадағалауды ұйымдастыру жөніндегі нұсқаулықты бекіту туралы
