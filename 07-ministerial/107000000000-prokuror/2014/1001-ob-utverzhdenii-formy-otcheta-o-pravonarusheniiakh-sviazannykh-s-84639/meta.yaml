  title:
    rus: О внесении изменений и дополнения в некоторые приказы Генерального Прокурора Республики Казахстан в сфере правовой статистики и специальных учетов
    kaz: Қазақстан Республикасы Бас Прокурорының құқықтық статистика және арнайы есепке алу саласындағы кейбір бұйрықтарына өзгерістер мен толықтыру енгізу туралы
