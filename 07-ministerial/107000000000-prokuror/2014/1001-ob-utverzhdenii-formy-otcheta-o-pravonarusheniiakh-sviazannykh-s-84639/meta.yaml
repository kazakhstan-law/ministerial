act_code: '84639'
requisite: Приказ Генерального Прокурора Республики Казахстан от 1 октября 2014 года № 101. Зарегистрирован в Министерстве юстиции Республики Казахстан 5 ноября 2014 года № 9859. Утратил силу приказом Генерального Прокурора Республики Казахстан от 1 декабря 2023 года № 213 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении формы отчета «О правонарушениях, связанных с незаконным оборотом наркотических средств, психотропных и ядовитых веществ, прекурсоров, их аналогов и вещественных доказательствах, конфискованного имущества по уголовным делам» и Инструкции по его формированию
  kaz: «Есірткі құралдарының, психотроптық және улы заттардың, прекурсорлардың, сол тектестердің заңсыз айналымына және заттай дәлелдемелерге, қылмыстық істер бойынша тәркіленген мүлікке байланысты құқық бұзушылықтар туралы» есеп нысанын және оны қалыптастыру жөніндегі нұсқаулықты бекіту туралы
