act_code: '83437'
requisite: Приказ Генерального Прокурора Республики Казахстан от 7 августа 2014 года № 80. Зарегистрирован в Министерстве юстиции Республики Казахстан 11 сентября 2014 года № 9730. Утратил силу приказом Генерального Прокурора Республики Казахстан от 19 сентября 2014 года № 89
title:
  rus: Об утверждении Инструкции по ведению единого карточного учета, в том числе в электронном формате заявлений, сообщений, жалоб и иной информации о преступлениях, происшествиях, уголовных делах, результатах их расследования, и прокурорского надзора за ними
  kaz: Қылмыстар, оқиғалар туралы өтініштерді, хабарламаларды, шағымдарды және өзге де ақпаратты, қылмыстық істерді, оларды тергеу және прокурорлық қадағалау нәтижелерін бірыңғай, соның ішінде электрондық форматта карточкалық есепке алуды жүргізу жөніндегі нұсқаулықты бекіту туралы
