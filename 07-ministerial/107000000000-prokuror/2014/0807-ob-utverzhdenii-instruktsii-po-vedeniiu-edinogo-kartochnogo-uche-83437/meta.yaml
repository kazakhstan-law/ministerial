  title:
    rus: Об утверждении Правил приема и регистрации заявления, сообщения или рапорта об уголовных правонарушениях, а также ведения Единого реестра досудебных расследований
    kaz: Қылмыстық құқық бұзушылықтар туралы арызды, хабарды немесе баянатты қабылдау және тіркеу, сондай-ақ Сотқа дейінгі тергеп-тексерулердің бірыңғай тізілімін жүргізу қағидаларын бекіту туралы
