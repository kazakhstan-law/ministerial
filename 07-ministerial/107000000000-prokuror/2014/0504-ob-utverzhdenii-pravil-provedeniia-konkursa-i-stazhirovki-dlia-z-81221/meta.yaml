  title:
    rus: О внесении изменений в приказ Генерального Прокурора Республики Казахстан от 4 мая 2014 года №40 «Об утверждении Правил проведения конкурса и стажировки для занятия должностей в органах, ведомствах и учреждениях прокуратуры Республики Казахстан»
    kaz: «Қазақстан Республикасының прокуратура органдарында, ведомстволары мен мекемелерінде лауазымдарға орналасу үшін конкурс пен тағылымдама өткізу ережесін бекіту тарула» Қазақстан Республикасы Бас Прокурорының 2014 жылғы 4 мамырдағы №40 бұйрығына өзгерістер енгізу туралы
