act_code: '81221'
requisite: Приказ Генерального Прокурора Республики Казахстан от 4 мая 2014 года № 40. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 июля 2014 года № 9561. Утратил силу приказом Генерального Прокурора Республики Казахстан от 13 января 2023 года № 18 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения конкурса и стажировки для занятия должностей в системе органов прокуратуры Республики Казахстан
  kaz: Қазақстан Республикасы прокуратура органдары жүйесінде лауазымдарға орналастыру үшін конкурс пен тағылымдама өткізу қағидаларын бекіту туралы
