  title:
    rus: О внесении изменений в приказ Генерального Прокурора Республики Казахстан от 8 июля 2014 года № 70 «О создании централизованного банка данных лиц, не исполнивших обязательства по исполнительным документам, а также лиц, добровольно не исполнивших постановления о наложении административного штрафа (централизованный банк данных должников), и утверждении Инструкции по его ведению»
    kaz: Атқарушы құжаттар бойынша міндеттемелерді орындамаған тұлғалардың, сондай-ақ әкімшілік айыппұлды салу жөнінде қаулыларды ерікті түрде орындамаған тұлғалардың орталықтандырылған деректер банкін (борышкерлердің орталықтандырылған деректер банкі) құру және оны жүргізу жөніндегі Нұсқаулығын бекіту туралы Қазақстан Республикасы Бас Прокурорының 2014 жылғы 8 шілдедегі № 70 бұйрығына өзгерістер енгізу туралы
