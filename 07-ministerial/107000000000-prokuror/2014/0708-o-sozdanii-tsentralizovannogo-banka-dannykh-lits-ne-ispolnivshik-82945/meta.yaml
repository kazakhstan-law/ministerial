act_code: '82945'
requisite: Приказ Генерального Прокурора Республики Казахстан от 8 июля 2014 года № 70. Зарегистрирован в Министерстве юстиции Республики Казахстан 25 июля 2014 года № 9628. Утратил силу приказом Генерального Прокурора Республики Казахстан от 16 июля 2026 года № 115 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О создании централизованного банка данных лиц, не исполнивших обязательства по исполнительным документам, а также лиц, добровольно не исполнивших постановления о наложении административного штрафа (централизованный банк данных должников), и утверждении Инструкции по его ведению
  kaz: Атқарушы құжаттар бойынша міндеттемелерді орындамаған тұлғалардың, сондай-ақ әкімшілік айыппұлды салу жөнінде қаулыларды ерікті түрде орындамаған тұлғалардың орталықтандырылған деректер банкін (борышкерлердің орталықтандырылған деректер банкі) құру және оны жүргізу жөніндегі нұсқаулығын бекіту туралы
