requisite: Приказ Генерального Прокурора Республики Казахстан от 2 сентября 2014 года № 85. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 октября 2014 года № 9773. Утратил силу приказом Генерального прокурора Республики Казахстан от 31 января 2017 года № 7 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
