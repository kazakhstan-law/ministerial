  title:
    rus: О внесении изменений и дополнений в приказ Генерального Прокурора Республики Казахстан от 16 января 2003 года № 2 "Об утверждении и введении в действие отчета формы № 1-Н "О преступлениях и правонарушениях, связанных с незаконным оборотом наркотических средств, психотропных или ядовитых веществ, прекурсоров и лицах, их употребляющих" и Инструкции о порядке его составления"
    kaz: '"Есірткі заттардың, жүйкеге әсер ететін немесе улы заттардың, прекурсорлардың заңсыз айналымына байланысты қылмыстар және құқық бұзушылықтар, оларды пайдаланушы адамдар туралы" № 1-Н нысанды есепті және оны құрастыру тәртібі жөніндегі Нұсқаулықты бекіту туралы" Қазақстан Республикасы Бас Прокурорының 2003 жылғы 6 қаңтардағы № 2 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
