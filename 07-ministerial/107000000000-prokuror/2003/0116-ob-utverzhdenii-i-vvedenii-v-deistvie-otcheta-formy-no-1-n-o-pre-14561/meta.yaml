  title:
    rus: О внесении изменений и дополнений в приказ Генерального Прокурора Республики Казахстан от 16 января 2003 года № 2 "Об утверждении и введении в действие статистического отчета формы № 1-Н "О преступлениях и правонарушениях, связанных с незаконным оборотом наркотических средств, психотропных или ядовитых веществ, прекурсоров и лицах, их употребляющих" и Инструкции о порядке его составления" (зарегистрированный в Министерстве юстиции Республики Казахстан № 2172)
    kaz: Қазақстан Республикасы Бас Прокурорының 2003 жылғы 16 қаңтардағы "Нашақорлық заттардың, жүйкеге әсер ететін немесе улы заттардың, прекурсорлардың заңсыз айналымымен және оларды қолданатын тұлғалармен байланысты қылмыстар мен құқық бұзушылықтар туралы" № 1-Н нысанды статистикалық есепті және оны құру тәртібі жөніндегі Нұсқаулықты бекіту мен іске қосу туралы" № 2 бұйрығына (Қазақстан Республикасының Әділет министрлігінде № 2172 тіркелген) өзгертулер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/18917/rus
