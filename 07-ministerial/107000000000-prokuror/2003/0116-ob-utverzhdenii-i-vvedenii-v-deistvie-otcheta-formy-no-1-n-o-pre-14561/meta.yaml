  title:
    rus: О внесении изменений и дополнений в приказ Генерального Прокурора Республики Казахстан от 16 января 2003 года № 2 "Об утверждении и введении в действие отчета формы № 1-Н "О преступлениях и правонарушениях, связанных с незаконным оборотом наркотических средств, психотропных или ядовитых веществ, прекурсоров и лицах, их употребляющих" и Инструкции о порядке его составления"
    kaz: '"Есiрткi заттармен заңсыз айналыс жасаумен, психотроптық немесе улы заттарды, оның құрымдық бөлiктерiн пайдаланушы тұлғалармен байланысты қылмыстар және құқық бұзушылықтар туралы № 1-Н статистикалық есеп нысанын бекітіп және қолданысқа енгізу және оны құрастырудың реттерi жөніндегі Нұсқау туралы" Қазақстан Республикасы Бас Прокурорының 2003 жылғы 16 қаңтардағы № 2 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
