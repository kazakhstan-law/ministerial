  title:
    rus: О внесении изменений и дополнений в приказ Генерального Прокурора Республики Казахстан от 16 января 2003 года № 2 "Об утверждении и введении в действие статистического отчета формы № 1-Н "О преступлениях и правонарушениях, связанных с незаконным оборотом наркотических средств, психотропных или ядовитых веществ, прекурсоров и лицах, их употребляющих" и Инструкции о порядке его составления"
    kaz: '"Есірткі заттардың, жүйкеге әсер ететін немесе улы заттардың, прекурсорлардың заңсыз айналымымен байланысты қылмыстар мен құқық бұзушылықтар және оларды қолданатын тұлғалар туралы" N 1-Н нысанды статистикалық есепті және оның құрылуы жөніндегі Нұсқаулықты бекіту және қолданысқа енгізу туралы" Қазақстан Республикасы Бас Прокурорының 2003 жылғы 16 қаңтардағы N 2 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
