title:
  rus: Об утверждении и введении в действие отчета формы № 1-Н "О преступлениях и правонарушениях, связанных с незаконным оборотом наркотических средств, психотропных или ядовитых веществ, прекурсоров и лицах, их употребляющих" и Инструкции о его составлении
  kaz: «Есірткі заттардың, жүйкеге әсер ететін немесе улы заттардың, прекурсорлардың заңсыз айналымына байланысты қылмыстар және құқық бұзушылықтар, оларды пайдаланушы адамдар туралы» № 1-Н нысанды есепті және оны құрастыру жөніндегі Нұсқаулықты бекіту туралы
