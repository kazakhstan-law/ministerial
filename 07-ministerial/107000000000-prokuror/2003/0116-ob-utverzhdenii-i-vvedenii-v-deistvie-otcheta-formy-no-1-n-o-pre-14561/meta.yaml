  title:
    rus: О внесении дополнений и изменений в некоторые нормативные правовые акты Генерального Прокурора Республики Казахстан по вопросам формирования статистической отчетности
    kaz: Қазақстан Республикасы Бас Прокурорының статистикалық есептілікті қалыптастыру мәселелері бойынша кейбір нормативтік құқықтық актілеріне толықтырулар мен өзгерістер енгізу туралы
