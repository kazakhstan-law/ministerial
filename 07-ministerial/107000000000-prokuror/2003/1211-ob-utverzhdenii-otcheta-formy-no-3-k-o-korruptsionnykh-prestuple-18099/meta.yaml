  requisite: Приказ Генерального Прокурора Республики Казахстан от 25 января 2010 года № 5. Зарегистрирован в Министерстве юстиции Республики Казахстан 19 февраля 2010 года № 6076. Утратил силу приказом Генерального Прокурора Республики Казахстан от 8 октября 2014 года № 112
  title:
    rus: О внесении изменений и дополнений в приказ Генерального Прокурора Республики Казахстан от 11 декабря 2003 года № 69 "Об утверждении статистического отчета формы № 3-К "О коррупционных преступлениях, лицах их совершивших, осужденных, движении уголовных дел о коррупционных преступлениях и о субъектах коррупционных правонарушений" и Инструкции по его составлению
    kaz: '"Сыбайлас жемқорлық қылмыстар, оларды жасаған тұлғалар, сотталғандар, сыбайлас жемқорлық қылмыстар жөніндегі қылмыстық істердің қозғалысы және сыбайлас жемқорлық құқық бұзушылық субъектілері туралы" № 3-К нысанды статистикалық есепті және оның құрылуы жөніндегі Нұсқаулықты бекіту туралы" Қазақстан Республикасы Бас Прокурорының 2003 жылғы 11 желтоқсандағы № 69 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
