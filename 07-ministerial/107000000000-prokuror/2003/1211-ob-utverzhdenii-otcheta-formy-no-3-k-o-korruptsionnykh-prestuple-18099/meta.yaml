title:
  rus: Об утверждении отчета формы № 3-К "О коррупционных преступлениях, лицах их совершивших, осужденных, движении уголовных дел о коррупционных преступлениях и о субъектах коррупционных правонарушений" и Инструкции по его составлению
  kaz: '"Сыбайлас жемқорлық қылмыстар, оларды жасаған тұлғалар және сыбайлас жемқорлық қылмыстар жөніндегі қылмыстық істердің қозғалысы туралы" N 3-К нысанды есепті құру бойынша Нұсқаулықты бекіту туралы'
