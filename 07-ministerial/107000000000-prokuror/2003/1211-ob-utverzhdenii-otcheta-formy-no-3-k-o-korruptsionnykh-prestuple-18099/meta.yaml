    kaz: '"Сыбайлас жемқорлық қылмыстар, оларды жасаған тұлғалар, сотталғандар және сыбайлас жемқорлық қылмыстар жөніндегі қылмыстық істердің қозғалысы туралы" N 3-К нысанды статистикалық есепті және оны құру бойынша Нұсқаулықты бекіту туралы" Қазақстан Республикасы Бас Прокурорының 2003 жылғы 11 желтоқсандағы N 69 бұйрығына өзгерістер мен толықтырулар енгізу туралы'
