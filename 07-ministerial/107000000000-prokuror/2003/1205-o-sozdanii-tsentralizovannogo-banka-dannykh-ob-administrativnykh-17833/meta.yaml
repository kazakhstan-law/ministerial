  title:
    rus: О внесении изменений и дополнений в приказ Генерального Прокурора Республики Казахстан от 5 декабря 2003 года N 67 "О создании централизованного банка данных об административных правонарушениях и лицах, их совершивших", зарегистрированный в Реестре государственной регистрации нормативных правовых актов за N 2606
    kaz: Нормативтік құқықтық актілердің Мемлекеттік тіркеу тізілімінде N 2606 санымен тіркелген "Әкімшілік құқық бұзушылықтар және оларды жасаған тұлғалар жөніндегі орталықтандырылған деректер банкін құру туралы" Қазақстан Республикасы Бас Прокурорының 2003 жылғы 5 желтоқсандағы N 67 бұйрығына өзгерістер мен толықтырулар енгізу туралы
