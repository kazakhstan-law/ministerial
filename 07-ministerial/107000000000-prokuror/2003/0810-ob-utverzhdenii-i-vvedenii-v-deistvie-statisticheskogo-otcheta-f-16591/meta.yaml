title:
  rus: Об утверждении и введении в действие статистического отчета формы N 2-ЗС "О рассмотрении заявлений и сообщений о преступлениях, происшествиях органами уголовного преследования" и Инструкции по его составлению
  kaz: '"Қылмыстық қудалау органдарымен қылмыс, оқиғалар туралы өтініштер мен хабарламаларды қарау туралы" N 2-3С нысанды статистикалық есеп және оны құру жөніндегі Нұсқауды бекіту және іске ендіру туралы'
