  title:
    rus: О внесении дополнений и изменений в приказ Генерального Прокурора Республики Казахстан от 11 августа 2003 года № 48 "Об утверждении и введении в действие статистического отчета формы № 2-ЗС "О рассмотрении заявлений и сообщений о преступлениях органами уголовного преследования" и Инструкции по его составлению"
    kaz: '"Қазақстан Республикасы Бас Прокурорының 2003 жылғы 11 тамыздағы "Қылмыстық қудалау органдарының қылмыстар жөніндегі өтініштер мен хабарламаларды қарауы туралы" № 2-3С нысанды статистикалық есепті және оның құрылуы бойынша Нұсқаулықты бекіту және қолданысқа енгізу туралы" № 48 бұйрығына толықтырулар мен өзгерістер енгізу туралы'
