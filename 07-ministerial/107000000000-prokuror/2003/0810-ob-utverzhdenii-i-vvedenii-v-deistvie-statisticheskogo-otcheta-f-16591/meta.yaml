  title:
    rus: О внесении изменений и дополнений в приказ Генерального Прокурора Республики Казахстан от 11 августа 2003 года N 48 "Об утверждении и введении в действие статистического отчета формы N 2-ЗС "О рассмотрении заявлений и сообщений о преступлениях органами уголовного преследования" и Инструкции по его составлению"
    kaz: '"Қылмыстық қудалау органдары арқылы қылмыстар жөніндегі өтініштер мен хабарларды қарастыру туралы" N2-ЗС нысанды статистикалық есепті және олардың құрылуы бойынша Нұсқаулықты бекіту және іске қосу туралы" Қазақстан Республикасы Бас Прокурорының 2003 жылғы 11 тамыздағы N 48 бұйрығына өзгерістер мен толықтырулар енгізу туралы"'
