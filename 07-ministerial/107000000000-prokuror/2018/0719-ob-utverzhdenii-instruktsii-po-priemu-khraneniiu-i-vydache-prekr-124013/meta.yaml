act_code: '124013'
requisite: Приказ и.о. Генерального Прокурора Республики Казахстан от 19 июля 2018 года № 91. Зарегистрирован в Министерстве юстиции Республики Казахстан 3 августа 2018 года № 17272. Утратил силу приказом Генерального Прокурора Республики Казахстан от 5 января 2023 года № 8 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по приему, хранению и выдаче прекращенных уголовных дел подразделениями архивной работы Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан
  kaz: Қазақстан Республикасы Бас прокуратурасы Құқықтық статистика және арнайы есепке алу жөніндегі комитеті архивтік жұмыс бөлімшелерінің тоқтатылған қылмыстық істерді қабылдау, сақтау және беру жөніндегі нұсқаулықты бекіту туралы
