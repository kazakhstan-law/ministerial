  requisite: Приказ Генерального Прокурора Республики Казахстан от 29 декабря 2021 года № 174. Зарегистрирован в Министерстве юстиции Республики Казахстан 6 января 2022 года № 26400. Утратил силу приказом Генерального Прокурора Республики Казахстан от 5 января 2023 года № 8 (вводится в действие после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в приказ исполняющего обязанности Генерального Прокурора Республики Казахстан от 19 июля 2018 года № 91 «Об утверждении Инструкции по приему, хранению и выдаче прекращенных уголовных дел подразделениями архивной работы Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан»
    kaz: «Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөніндегі комитетінің архивтік жұмыс бөлімшелерінің тоқтатылған қылмыстық істерді қабылдау, сақтау және беру жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Бас Прокуроры міндетін атқарушының 2018 жылғы 19 шілдедегі № 91 бұйрығына өзгерістер енгізу туралы
