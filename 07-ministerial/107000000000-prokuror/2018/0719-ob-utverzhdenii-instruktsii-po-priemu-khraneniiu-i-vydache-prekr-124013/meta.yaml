  title:
    rus: О внесении изменений в приказ исполняющего обязанности Генерального Прокурора Республики Казахстан от 19 июля 2018 года № 91 «Об утверждении Инструкции по приему, хранению и выдаче прекращенных уголовных дел подразделениями архивной работы Комитета по правовой статистике и специальным учетам Генеральной прокуратуры Республики Казахстан»
    kaz: Қазақстан Республикасы Бас прокуратурасының Құқықтық статистика және арнайы есепке алу жөніндегі комитетінің мұрағаттық жұмыс бөлімшелерімен тоқтатылған қылмыстық істерді қабылдау, сақтау және беру бойынша нұсқаулықты бекіту туралы» Қазақстан Республикасы Бас Прокурорының міндетін атқарушысының 2018 жылғы 19 шілдедегі № 91 бұйрығына өзгерістер енгізу туралы
