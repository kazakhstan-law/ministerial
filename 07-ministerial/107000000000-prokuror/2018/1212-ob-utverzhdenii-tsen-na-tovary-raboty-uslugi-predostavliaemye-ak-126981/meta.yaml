title:
  rus: Об утверждении цен на товары (работы, услуги), предоставляемые Академией правоохранительных органов при Генеральной прокуратуре Республики Казахстан на платной основе
  kaz: Қазақстан Республикасы Бас прокуратурасының жанындағы Құқық қорғау органдары академиясының ақылы негізде берілетін тауарларына (жұмыстарына, көрсетілетін қызметтеріне) бағаларды бекіту туралы
