act_code: '122624'
requisite: Приказ Генерального Прокурора Республики Казахстан от 1 июня 2018 года № 72. Зарегистрирован в Министерстве юстиции Республики Казахстан 18 июня 2018 года № 17084. Утратил силу приказом Генерального Прокурора Республики Казахстан от 17 января 2023 года № 29 (вводится в действие после дня его первого официального опубликования)
title:
  rus: Об утверждении Инструкции по рассмотрению обращений, сообщений, предложений, откликов и запросов в органах, ведомствах, учреждениях и организации образования прокуратуры Республики Казахстан
  kaz: Қазақстан Республикасының прокуратурасы органдарында, ведомстволарында, мекемелерінде және білім беру ұйымында жолданымдарды, хабарларды, ұсыныстарды, үн қосуларды және сұрау салуларды қарау жөніндегі нұсқаулықты бекіту туралы
