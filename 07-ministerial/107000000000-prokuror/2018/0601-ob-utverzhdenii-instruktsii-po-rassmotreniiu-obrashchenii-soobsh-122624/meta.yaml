  title:
    rus: О внесении изменения в приказ Генерального Прокурора Республики Казахстан от 1 июня 2018 года № 72 «Об утверждении Инструкции по рассмотрению обращений, сообщений, предложений, откликов и запросов в органах, ведомствах, учреждениях и организации образования прокуратуры Республики Казахстан»
    kaz: «Қазақстан Республикасының прокуратурасы органдарында, ведомстволарында, мекемелерінде және білім беру ұйымында жолданымдарды, хабарларды, ұсыныстарды, үн қосуларды және сұрау салуларды қарау жөніндегі нұсқаулықты бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2018 жылғы 1 маусымдағы № 72 бұйрығына өзгеріс енгізу туралы
