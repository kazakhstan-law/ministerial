  kaz: Қылмыстық құқық бұзушылықтар жасаған, қылмыстық жауаптылыққа тартылған және тартылатын адамдарды арнайы есепке алуды және ұстап алынған, күзетпен ұсталатын және сотталған адамдарды дактилоскопиялық есепке алуды жүргізу, пайдалану және сақтау қағидаларын бекіту туралы
