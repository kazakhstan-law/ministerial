  title:
    rus: О внесении изменений в приказ Генерального Прокурора Республики Казахстан от 27 февраля 2018 года № 29 «Об утверждении Правил ведения, использования и хранения специальных учетов лиц, совершивших уголовные правонарушения, привлеченных и привлекаемых к уголовной ответственности и дактилоскопического учета задержанных, содержащихся под стражей и осужденных лиц»
    kaz: «Қылмыстық құқық бұзушылықтар жасаған, қылмыстық жауаптылыққа тартылған және тартылатын адамдарды арнайы есепке алуды және ұстап алынған, күзетпен ұсталатын және сотталған адамдарды дактилоскопиялық есепке алуды жүргізу, пайдалану және сақтау қағидаларын бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2018 жылдың 27 ақпандағы № 29 бұйрығына өзгерістер енгізу туралы
