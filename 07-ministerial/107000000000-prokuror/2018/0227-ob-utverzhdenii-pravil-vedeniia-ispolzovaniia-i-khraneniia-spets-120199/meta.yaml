  title:
    rus: О внесении изменений и дополнений в приказ Генерального Прокурора Республики Казахстан от 27 февраля 2018 года № 29 «Об утверждении Правил ведения и использования специальных учетов лиц, совершивших уголовные правонарушения, привлекаемых к уголовной ответственности, лиц, привлеченных к уголовной ответственности за совершение уголовного правонарушения и дактилоскопического учета задержанных, содержащихся под стражей и осужденных лиц»
    kaz: «Қылмыстық құқық бұзушылықтар жасаған, қылмыстық жауаптылыққа тартылатын адамдардың, қылмыстық құқық бұзушылық жасағаны үшін қылмыстық жауаптылыққа тартылған адамдардың арнайы есебін, ұстап алынған, күзетпен ұсталатын және сотталған адамдардың дактилоскопиялық арнайы есебін жүргізу және пайдалану қағидаларын бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2018 жылғы 27 ақпандағы № 29 бұйрығына өзгерістер мен толықтырулар енгізу туралы
