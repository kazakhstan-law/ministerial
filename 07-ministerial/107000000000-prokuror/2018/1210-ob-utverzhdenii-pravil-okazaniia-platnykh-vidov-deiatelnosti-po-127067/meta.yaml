title:
  rus: Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) Академией правоохранительных органов при Генеральной прокуратуре Республики Казахстан и расходования ею денег от реализации товаров (работ, услуг)
  kaz: Қазақстан Республикасы Бас прокуратурасының жанындағы Құқық қорғау органдары академиясының тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуі бойынша ақылы қызмет түрлерін көрсету және оның тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсау қағидаларын бекіту туралы
