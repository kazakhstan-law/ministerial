  title:
    rus: О внесении изменений в приказ Генерального Прокурора Республики Казахстан от 10 декабря 2018 года № 135 «Об утверждении Правил оказания платных видов деятельности по реализации товаров (работ, услуг) Академией правоохранительных органов при Генеральной прокуратуре Республики Казахстан и расходования ею денег от реализации товаров (работ, услуг)»
    kaz: «Қазақстан Республикасы Бас прокуратурасының жанындағы Құқық қорғау органдары академиясының тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуі бойынша ақылы қызмет түрлерін көрсету және оның тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуден түскен ақшаны жұмсау қағидаларын бекіту туралы» Қазақстан Республикасы Бас Прокурорының 2018 жылғы 10 желтоқсандағы № 135 бұйрығына өзгерістер енгізу туралы
