act_code: '8055'
requisite: Приказ Генерального прокурора Республики Казахстан от 29 декабря 2000 г. N 67. Зарегистрирован в Министерстве юстиции Республики Казахстан 27.01.2001 г. за N 1375. . Утратил силу - приказом Генерального прокурора Республики Казахстан от 25 апреля 2002 года № 28 ~V021868
title:
  rus: Об утверждении и введении в действие форм статистической карточки учета проверок деятельности хозяйствующих субъектов формы N 1-П, формы отчета "О регистрации актов о назначении проверок деятельности хозяйствующих субъектов" и журнала регистрации карточек и актов о назначении проверок деятельности хозяйствующих субъектов, Инструкции "О порядке ведения статистической карточки учета проверок деятельности хозяйствующих субъектов по форме N 1-П, отчета "О регистрации актов о назначении проверок деятельности хозяйствующих субъектов" и журнала регистрации карточек и актов о назначении проверок деятельности хозяйствующих субъектов", отмене приказа Генерального прокурора Республики Казахстан N 92 от 29 октября 1999 года
  kaz: Шаруашылық субъектiлер саласында тексеру жүргiзудi есепке алу карточкасының N 1-П нысанын, шаруашылық субъектiлердi қызметiне тексеру тағайындау жөнiндегi актiлерiнiң тiркеудiң есеп беру нысанын, карточкалар мен кәсiпкерлiк субъектiлерiнiң қызметiне тексеру тағайындау туралы актiлердi тiркеу журналының нысанын және "Шаруашылық саласында тексеру жүргiзудi есепке алу N 1-П нысанындағы статистикалық карточканы, кәсiпкерлiк субъектiлерiнiң қызметiне тексеру тағайындау жөнiндегi актiлердi тiркеудiң есебiн және карточкалар мен шаруашылық субъектiлерiнiң қызметiне тексеру тағайындау актiлерiн тiркеу журналын жүргiзу тәртiбi туралы" нұсқауды бекiту және күшiне енгiзу және N 92 29 қазан 1999 жылғы Қазақстан Республикасы Бас прокурорының бұйрығының күшiн жою туралы
