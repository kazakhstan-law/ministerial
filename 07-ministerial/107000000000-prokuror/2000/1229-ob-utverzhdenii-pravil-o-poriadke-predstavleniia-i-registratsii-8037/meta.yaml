requisite: Приказ Генерального прокурора Республики Казахстан от 29 декабря 2000 года N 66. Зарегистрирован в Министерстве юстиции Республики Казахстан 27.01.2001 г. за N 1374. Утратил силу - приказом Генерального прокурора Республики Казахстан от 25 апреля 2002 года № 27 ~V021867
title:
  rus: Об утверждении Правил "О порядке представления и регистрации документов первичного учета всех проверок деятельности хозяйствующих субъектов" и отмене приказа Генерального прокурора Республики Казахстан N 83 от 29 сентября 1999 года
  kaz: '"Шаруашылық субъектілерінің қызметіне жүргізілетін барлық тексерулердің алғашқы есеп құжаттарын ұсыну және тіркеу тәртібі туралы" Ережесін бекіту және N 83 29 қыркүйек 1999 жылғы ~V990958 Қазақстан Республикасы Бас прокурорының бұйрығының күшін жою туралы'
