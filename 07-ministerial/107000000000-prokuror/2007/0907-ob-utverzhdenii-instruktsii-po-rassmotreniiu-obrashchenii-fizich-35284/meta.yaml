    kaz: '"Қазақстан Республикасының прокуратура органдары мен мекемелерінде жеке және заңды тұлғалардың өтініштерін қарау жөніндегі Нұсқаулықты бекіту туралы" Қазақстан Республикасы Бас Прокурорының 2007 жылғы 7 қыркүйектегі № 37 бұйрығына өзгертулер мен толықтырулар енгізу туралы'
