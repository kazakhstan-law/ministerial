act_code: '150921'
requisite: Приказ и.о. Генерального Прокурора Республики Казахстан от 25 декабря 2020 года № 162. Зарегистрирован в Министерстве юстиции Республики Казахстан 30 декабря 2020 года № 21964
title:
  rus: Об утверждении Правил регистрации актов о назначении, дополнительных актов о продлении сроков профилактического контроля с посещением субъекта (объекта) контроля и надзора и (или) проверки, отказа в их регистрации и отмены, уведомлений о приостановлении, возобновлении, продлении сроков профилактического контроля с посещением субъекта (объекта) контроля и надзора и (или) проверки, изменении состава участников и представлении информационных учетных документов о профилактическом контроле с посещением субъекта (объекта) контроля и надзора и (или) проверке и их результатах
  kaz: Бақылау мен қадағалау субъектісіне (объектісіне) бару арқылы профилактикалық бақылауды және (немесе) тексеруді тағайындау туралы актілерді, олардың мерзімдерін ұзарту туралы қосымша актілерді тіркеудің, оларды тіркеуден бас тартудың және күшін жоюдың, бақылау мен қадағалау субъектісіне (объектісіне) бару арқылы профилактикалық бақылауды және (немесе) тексеруді тоқтата тұру, қайта бастау, мерзімдерін ұзарту туралы хабарламалардың, қатысушылар құрамын өзгертудің және бақылау мен қадағалау субъектісіне (объектісіне) бару арқылы профилактикалық бақылау және (немесе) тексеру және олардың нәтижелері туралы ақпараттық есепке алу құжаттарын ұсыну қағидаларын бекіту туралы
