  title:
    rus: О внесении изменений в приказ исполняющего обязанности Генерального Прокурора Республики Казахстан от 25 декабря 2020 года № 162 «Об утверждении Правил регистрации актов о назначении, дополнительных актов о продлении сроков проверки и профилактического контроля и надзора с посещением субъекта (объекта) контроля и надзора и их отмены, уведомлений о приостановлении, возобновлении, продлении сроков проверки и профилактического контроля и надзора с посещением субъекта (объекта) контроля и надзора, изменении состава участников и представлении информационных учетных документов о проверке и профилактическом контроле и надзоре с посещением субъекта (объекта) контроля и надзора и их результатах»
    kaz: «Тексеруді және бақылау және қадағалау субъектісіне (объектісіне) бару арқылы профилактикалық бақылау мен қадағалауды тағайындау туралы актілерді, олардың мерзімдерін ұзарту және күшін жою туралы қосымша актілерді, тексеру және бақылау және қадағалау субъектісіне (объектісіне) бару арқылы профилактикалық бақылау мен қадағалау мерзімдерін тоқтата тұру, қайта бастау, ұзарту, қатысушылар құрамын өзгерту және тексеру және бақылау және қадағалау субъектісіне (объектісіне) бару арқылы профилактикалық бақылау мен қадағалау туралы ақпараттық есепке алу құжаттарын ұсыну және олардың нәтижелері туралы хабарламаларды тіркеу қағидаларын бекіту туралы» Қазақстан Республикасы Бас Прокурорының міндетін атқарушысының 2020 жылғы 25 желтоқсандағы № 162 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/174632/rus
