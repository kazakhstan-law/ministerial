title:
  rus: Об утверждении отчета формы № 1-Е "О работе органов следствия, в том числе специальных прокуроров, наделенных функциями по расследованию уголовных дел и дознания и Инструкции по его составлению"
  kaz: «Тергеу органдарының, соның ішінде қылмыстық істерді тергеу бойынша қызметтер берілген арнайы прокурорлардың және анықтау органының жұмысы туралы» № 1-Е нысанды есепті бекіту туралы
