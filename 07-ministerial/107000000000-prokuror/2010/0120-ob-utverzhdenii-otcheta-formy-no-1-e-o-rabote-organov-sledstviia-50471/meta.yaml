  title:
    rus: О внесении изменений и дополнений в приказ Генерального Прокурора Республики Казахстан от 20 января 2010 года № 2 "Об утверждении отчета формы № 1-Е "О работе органов следствия, в том числе специальных прокуроров, наделенных функциями по расследованию уголовных дел и дознания" и Инструкции по его составлению"
    kaz: Қазақстан Республикасы Бас Прокурорының 2010 жылғы 20 қаңтардағы "Тергеу органдарының, соның ішінде қылмыстық істерді тергеу бойынша қызметтер берілген арнайы прокурорлардың және анықтау органының жұмысы туралы" № 1-Е нысанды есепті және оның құрылуы жөніндегі Нұсқаулықты бекіту туралы" № 2 бұйрығына өзгерістер мен толықтырулар енгізу туралы
