act_code: '2276'
requisite: Приказ Агентства Республики Казахстан по государственным закупкам от 25 января 1999 года № 2. Зарегистрирован в Министерстве юстиции Республики Казахстан 28 февраля 1999 года № 692. Утратил силу приказом Председателя Агентства Республики Казахстан по государственным закупкам от 18 апреля 2003 года № 56
title:
  rus: Об утверждении и введении в действие "Правил составления и порядка представления отчетности и формы отчета о проведенных государственных закупках товаров, работ и услуг для государственных учреждений, финансируемых из республиканского и местных бюджетов"
  kaz: '"Республикалық және жергiлiктi бюджеттерден қаржыланатын мемлекеттiк мекемелер үшiн жүргiзiлген, тауарларды, жұмыстарды және қызмет көрсетулердi мемлекеттiк сатып алу туралы есеп берудi жасау мен табыс етудiң Ережесi мен есеп нысандарын" бекiту және күшiне енгiзу туралы'
