  requisite: Приказ и.о. Председателя Агентства Республики Казахстан по государственным закупкам от 23 июля 2004 года N 80. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 августа 2004 года N 3008. Утратил силу приказом Министра финансов Республики Казахстан от 15 апреля 2008 года N 179.
  title:
    rus: О внесении изменений и дополнений в приказ Председателя Агентства Республики Казахстан по государственным закупкам от 31 октября 2002 года N 8 "Об утверждении Типовой конкурсной документации, предоставляемой организатором конкурса потенциальным поставщикам для подготовки конкурсных заявок и участия в открытом или закрытом конкурсе по государственным закупкам товаров, работ и услуг", зарегистрированный за N 2041
    kaz: N 2041-мен тіркелген "Конкурсты ұйымдастырушы конкурстық өтінімдерді дайындау және тауарларды, жұмыстарды және көрсетілетін қызметтерді мемлекеттік сатып алу бойынша ашық немесе жабық конкурсқа қатысу үшін ықтимал өнім берушілерге беретін үлгі конкурстық құжаттаманы бекіту туралы" Қазақстан Республикасының Мемлекеттік сатып алу жөніндегі агенттігі төрағасының 2002 жылғы 31 қазандағы N 8 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/20937/rus
