act_code: '13553'
requisite: Приказ Председателя Агентства Республики Казахстан по государственным закупкам от 31 октября 2002 года N 8. Зарегистрирован в Министерстве юстиции Республики Казахстан 14 ноября 2002 года N 2041. Утратил силу приказом Министра финансов Республики Казахстан от 15 апреля 2008 года N 179
title:
  rus: Об утверждении Типовой конкурсной документации, предоставляемой организатором конкурса потенциальным поставщикам для подготовки конкурсных заявок и участия в открытом или закрытом конкурсе по государственным закупкам товаров, работ и услуг
  kaz: Конкурсты ұйымдастырушы конкурстық өтiнiмдердi дайындау және тауарларды, жұмыстарды және көрсетілетiн қызметтердi мемлекеттiк сатып алу бойынша ашық немесе жабық конкурсқа қатысу үшiн ықтимал өнім берушiлерге беретiн үлгi конкурстық құжаттаманы бекiту туралы
