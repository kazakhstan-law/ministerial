  title:
    rus: О внесении изменений в приказ от 31 октября 2002 года N 8 "Об утверждении Типовой конкурсной документации, предоставляемой организатором конкурса потенциальным поставщикам для подготовки конкурсных заявок и участия в открытом или закрытом конкурсе по государственным закупкам товаров, работам и услуг", зарегистрированный в Министерстве юстиции Республики казахстан 14 ноября 2002 года за N 2041
    kaz: Қазақстан Республикасының Әдiлет министрлігінде 2002 жылғы 14 қарашада N 2041 тiркелген, 2002 жылғы 31 қазандағы N 8 "Конкурсты ұйымдастырушы конкурстық өтiнiмдердi дайындау және тауарларды, жұмыстарды және көрсетiлетiн қызметтердi мемлекеттiк сатып алу бойынша ашық немесе жабық конкурсқа қатысу үшiн ықтимал өнiм берушiлерге беретiн үлгi конкурстық құжаттаманы бекiту туралы" бұйрыққа өзгерiстер енгiзу туралы
