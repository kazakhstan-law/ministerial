act_code: '23308'
requisite: Приказ Председателя Комитета финансового контроля и государственных закупок Министерства финансов Республики Казахстан от 22 февраля 2005 года N 32. Зарегистрирован Министерством юстиции Республики Казахстан 18 марта 2005 года N 3500. Утратил силу приказом Председателя Комитета финансового контроля и государственных закупок Министерства финансов Республики Казахстан от 24 марта 2006 года N 90
title:
