act_code: '27471'
requisite: Приказ Председателя Комитета финансового контроля и государственных закупок Министерства финансов Республики Казахстан от 24 марта 2006 года N 90. Зарегистрирован в Министерстве юстиции Республики Казахстан 24 апреля 2006 года N 4205. Утратил силу приказом Министра финансов Республики Казахстан от 15 апреля 2008 года N 179.
title:
  rus: Об утверждении Правил включения и исключения из Государственного реестра субъектов, обязанных осуществлять закупки товаров, работ и услуг за счет имеющихся в их распоряжении денег в соответствии с законодательством Республики Казахстан о государственных закупках
  kaz: Қазақстан Республикасының мемлекеттік сатып алу туралы заңнамасына сәйкес қарамағындағы ақшалай қаражаттардың есебінен тауарлар, жұмыстар және қызметтерді сатып алуға міндетті субъектілерді Мемлекеттік реестрге енгізу және шығару Ережелерін бекіту туралы
