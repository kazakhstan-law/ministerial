    kaz: «Құрылыстағы баға белгілеу жөніндегі нормативтік құжаттарды бекіту туралы» Қазақстан Республикасы Инвестициялар және даму министрлігінің Құрылыс және тұрғын үй-коммуналдық шаруашылық істері комитеті төрағасының 2017 жылғы 14 қарашадағы № 249-нқ бұйрығына өзгерістер мен толықтырулар енгізу туралы
