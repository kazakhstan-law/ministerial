title:
  rus: Об утверждении Правил ведения реестра образовательных программ, реализуемых организациями высшего и (или) послевузовского образования, а также основания включения в реестр образовательных программ и исключения из него
  kaz: Жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарында іске асыратын білім беру бағдарламаларының тізілімін жүргізу қағидалары, сондай-ақ білім беру бағдарламаларының тізіліміне енгізу мен одан алып тастау негіздерін бекіту туралы
