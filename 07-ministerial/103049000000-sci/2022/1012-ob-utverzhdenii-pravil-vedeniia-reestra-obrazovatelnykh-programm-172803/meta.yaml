  title:
    rus: О внесении изменений и дополнения в приказ Министра науки и высшего образования Республики Казахстан от 12 октября 2022 года № 106 «Об утверждении Правил ведения реестра образовательных программ, реализуемых организациями высшего и (или) послевузовского образования, а также основания включения в реестр образовательных программ и исключения из него»
    kaz: «Жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарында іске асыратын білім беру бағдарламаларының тізілімін жүргізу қағидалары, сондай-ақ білім беру бағдарламаларының тізіліміне енгізу мен одан алып тастау негіздерін бекіту туралы» Қазақстан Республикасының Ғылым және жоғары білім министрінің 2022 жылғы 12 қазандағы № 106 бұйрығына өзгерістер мен толықтыру енгізу туралы
