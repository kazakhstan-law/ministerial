  title:
    rus: О внесении изменений и дополнений в приказ Министра науки и высшего образования Республики Казахстан от 30 декабря 2022 года № 223 «Об утверждении правил и критериев избрания академиков Национальной академии Республики Казахстан»
    kaz: «Қазақстан Республикасының Ұлттық ғылым академиясының академиктарын сайлау қағидалары мен өлшемшарттарын бекіту туралы» Қазақстан Республикасы Ғылым және жоғары білім министрінің 2022 жылғы 30 желтоқсандағы № 223 бұйрығына өзгерістер мен толықтырулар енгізу туралы
