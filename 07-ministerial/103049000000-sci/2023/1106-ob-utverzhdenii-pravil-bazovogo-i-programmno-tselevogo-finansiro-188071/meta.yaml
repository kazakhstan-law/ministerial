  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра науки и высшего образования Республики Казахстан от 6 ноября 2023 года № 563 «Об утверждении Правил базового и программно-целевого финансирования научной и (или) научно-технической деятельности, грантового финансирования научной и (или) научно-технической деятельности и коммерциализации результатов научной и (или) научно-технической деятельности, финансирования научных организаций, осуществляющих фундаментальные научные исследования»
    kaz: «Ғылыми және (немесе) ғылыми-техникалық қызметті базалық және бағдарламалық-нысаналы қаржыландыру, ғылыми және (немесе) ғылыми-техникалық қызметті гранттық қаржыландыру және ғылыми және (немесе) ғылыми-техникалық қызмет нәтижелерін коммерцияландыру, іргелі ғылыми зерттеулерді жүзеге асыратын ғылыми ұйымдарды қаржыландыру қағидаларын бекіту туралы» Қазақстан Республикасы Ғылым және жоғары білім министрінің міндетін атқарушының 2023 жылғы 6 қарашадағы № 563 бұйрығына өзгерістер енгізу туралы
