  code: '195074'
  requisite: Приказ Министра науки и высшего образования Республики Казахстан от 27 марта 2024 года № 128. Зарегистрирован в Министерстве юстиции Республики Казахстан 1 апреля 2024 года № 34201
  title:
    rus: О внесении изменений и дополнений в приказ Министра науки и высшего образования Республики Казахстан от 10 февраля 2023 года № 47 «Об утверждении видов документов о высшем и (или) послевузовском образовании, формы документов о высшем и (или) послевузовском образовании государственного образца и правил их учета и выдачи, основных требований к содержанию документов о высшем и (или) послевузовском образовании собственного образца и правил их учета и выдачи»
    kaz: «Жоғары және (немесе) жоғары оқу орнынан кейінгі білім туралы құжаттардың түрлерін, білім туралы мемлекеттік үлгідегі құжаттардың нысандарын және оларды есепке алу мен беру қағидаларын, жоғары және (немесе) жоғары оқу орнынан кейінгі білім туралы өзіндік үлгідегі құжаттардың мазмұнына қойылатын негізгі талаптарды және оларды есепке алу мен беру қағидаларын әзірлеу және бекіту туралы» Қазақстан Республикасы Ғылым және жоғары білім министрінің 2023 жылғы 10 ақпандағы № 47 бұйрығына өзгерістер мен толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/195074/rus
