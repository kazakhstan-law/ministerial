requisite: Приказ Министра науки и высшего образования Республики Казахстан от 10 февраля 2023 года № 47. Зарегистрирован в Министерстве юстиции Республики Казахстан 13 февраля 2023 года № 31894
title:
  rus: Об утверждении видов документов о высшем и (или) послевузовском образовании, формы документов о высшем и (или) послевузовском образовании государственного образца и правил их учета и выдачи, основных требований к содержанию документов о высшем и (или) послевузовском образовании собственного образца и правил их учета и выдачи
  kaz: Жоғары және (немесе) жоғары оқу орнынан кейінгі білім туралы құжаттардың түрлерін, білім туралы мемлекеттік үлгідегі құжаттардың нысандарын және оларды есепке алу мен беру қағидаларын, жоғары және (немесе) жоғары оқу орнынан кейінгі білім туралы өзіндік үлгідегі құжаттардың мазмұнына қойылатын негізгі талаптарды және оларды есепке алу мен беру қағидаларын әзірлеу және бекіту туралы
