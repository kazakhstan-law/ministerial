  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра науки и высшего образования Республики Казахстан от 11 августа 2023 года № 403 «Об утверждении Правил направления специалиста на работу, возмещения расходов, понесенных за счет бюджетных средств, предоставления права самостоятельного трудоустройства, освобождения от обязанности или прекращения обязанности по отработке гражданами Республики Казахстан, обучавшимися на основе государственного образовательного заказа»
    kaz: «Маманды жұмысқа жіберу, бюджет қаражаты есебінен шеккен шығыстарды өтеу, өз бетімен жұмысқа орналасу құқығын беру, мемлекеттік білім беру тапсырысы негізінде білім алған Қазақстан Республикасының азаматтарын жұмыспен өтеу жөніндегі міндетінен босату немесе олардың міндетін тоқтату қағидаларын бекіту туралы» Қазақстан Республикасы Ғылым және жоғары білім министрі міндетін атқарушының 2023 жылғы 11 тамыздағы № 403 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/193803/rus
