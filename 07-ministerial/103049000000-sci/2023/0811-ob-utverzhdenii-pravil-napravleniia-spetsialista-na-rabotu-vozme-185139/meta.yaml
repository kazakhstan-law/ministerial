requisite: Приказ и.о. Министра науки и высшего образования Республики Казахстан от 11 августа 2023 года № 403. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 августа 2023 года № 33291
title:
  rus: Об утверждении Правил направления специалиста на работу, возмещения расходов, понесенных за счет бюджетных средств, предоставления права самостоятельного трудоустройства, освобождения от обязанности или прекращения обязанности по отработке гражданами Республики Казахстан, обучавшимися на основе государственного образовательного заказа
  kaz: Маманды жұмысқа жіберу, бюджет қаражаты есебінен жұмсалған шығыстарды өтеу, өз бетінше жұмысқа орналасу құқығын беру, мемлекеттік білім беру тапсырысы негізінде білім алған Қазақстан Республикасының азаматтарын жұмыспен өтеу жөніндегі міндетінен босату немесе олардың міндетін тоқтату қағидаларын бекіту туралы
