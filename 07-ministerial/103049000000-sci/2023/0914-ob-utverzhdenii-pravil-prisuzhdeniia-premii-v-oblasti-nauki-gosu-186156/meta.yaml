  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра науки и высшего образования Республики Казахстан от 14 сентября 2023 года № 466 «Об утверждении правил присуждения премий в области науки, государственных научных стипендий» и о внесении изменений и дополнений в приказ Министра образования и науки Республики Казахстан от 11 июня 2020 года № 242 «Об утверждении Правил оказания государственной услуги «Прием работ на соискание премий в области науки, государственных научных стипендий» и признании утратившим силу приказа Министра образования и науки Республики Казахстан от 21 декабря 2011 года № 536 «Об утверждении размеров премий в области науки и государственных научных стипендий и требований к оформлению конкурсных материалов»
    kaz: «Ғылым саласындағы сыйлықақыларды, мемлекеттік ғылыми стипендияларды беру қағидаларын бекіту туралы» Қазақстан Республикасы Ғылым және жоғары білім министрінің міндетін атқарушының 2023 жылғы 14 қыркүйектегі № 466 бұйрығына өзгерістер туралы және «Ғылым саласындағы сыйлықтарды, мемлекеттік ғылыми стипендияларды алуға ұсынылған жұмыстарды қабылдау» мемлекеттік қызметін көрсету қағидаларын бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2020 жылғы 11 маусымдағы № 242 бұйрығына өзгерістер мен толықтырулар енгізу туралы және «Ғылым саласындағы сыйлықтар мен мемлекеттік ғылыми стипендиялардың мөлшерлерін және конкурстық материалдарды ресімдеуге қойылатын талаптарды бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2011 жылғы 21 желтоқсандағы № 536 бұйрығының күші жойылды деп тану туралы
