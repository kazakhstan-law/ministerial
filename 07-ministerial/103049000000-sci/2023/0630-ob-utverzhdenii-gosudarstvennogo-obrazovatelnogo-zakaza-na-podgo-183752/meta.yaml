    kaz: Республикалық бюджеттен қаржыландырылатын білім беру ұйымдарында (Қазақстан Республикасының Қарулы Күштері, басқа да әскерлері мен әскери құралымдары, сондай-ақ арнаулы мемлекеттік органдар үшін кадрларды даярлауды жүзеге асыратын білім беру ұйымдарын қоспағанда) жоғары және жоғары оқу орнынан кейінгі білімі бар кадрларды даярлауға 2021-2022, 2022-2023, 2023-2024 оқу жылдарына арналған мемлекеттік білім беру тапсырысын бекіту туралы» Қазақстан Республикасы Ғылым және жоғары білім министрінің 2023 жылғы 30 маусымдағы № 302 бұйрығына өзгерістер енгізу туралы
