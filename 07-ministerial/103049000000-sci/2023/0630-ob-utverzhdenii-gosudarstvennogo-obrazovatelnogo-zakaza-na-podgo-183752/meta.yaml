act_code: '183752'
requisite: Приказ Министра науки и высшего образования Республики Казахстан от 30 июня 2023 года № 302
title:
  rus: Об утверждении государственного образовательного заказа на подготовку кадров с высшим и послевузовским образованием, в организациях образования, финансируемых из республиканского бюджета (за исключением организаций образования, осуществляющих подготовку кадров для Вооруженных Сил Республики Казахстан, других войск и воинских формирований, а также специальных государственных органов), на 2021 – 2022, 2022 – 2023, 2023 – 2024 учебные годы
  kaz: Республикалық бюджеттен қаржыландырылатын білім беру ұйымдарында (Қазақстан Республикасының Қарулы Күштері, басқа да әскерлері мен әскери құралымдары, сондай-ақ арнаулы мемлекеттік органдар үшін кадрларды даярлауды жүзеге асыратын білім беру ұйымдарын қоспағанда) жоғары және жоғары оқу орнынан кейінгі білімі бар кадрларды даярлауға 2021 – 2022, 2022 – 2023, 2023 – 2024 оқу жылдарына арналған мемлекеттік білім беру тапсырысын бекіту туралы
