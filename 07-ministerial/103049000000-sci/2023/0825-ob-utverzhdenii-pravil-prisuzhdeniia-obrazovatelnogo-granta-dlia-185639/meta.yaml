  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра науки и высшего образования Республики Казахстан от 25 августа 2023 года № 443 «Об утверждении Правил присуждения образовательного гранта для оплаты высшего или послевузовского образования с присуждением степени «бакалавр» или «магистр»
    kaz: «Бакалавр» немесе «магистр» дәрежелері берілетін жоғары немесе жоғары оқу орнынан кейінгі білім алуға ақы төлеу үшін білім беру грантын беру қағидаларын бекіту туралы» Қазақстан Республикасы Ғылым және жоғары білім министрінің міндетін атқарушының 2023 жылғы 25 тамыздағы № 443 бұйрығына өзгерістер енгізу туралы
