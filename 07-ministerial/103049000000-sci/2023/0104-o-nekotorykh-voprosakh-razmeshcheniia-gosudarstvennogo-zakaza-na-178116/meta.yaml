    kaz: «Жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарының студенттерін, магистранттарын және докторанттарын жатақханалардағы орындармен қамтамасыз етуге мемлекеттік тапсырысты орналастырудың кейбір мәселелері туралы» Қазақстан Республикасы Ғылым және жоғары білім министрінің 2023 жылғы 4 қаңтардағы № 1 бұйрығына өзгерістер енгізу туралы
