  title:
    rus: О внесении изменений и дополнения в приказ Министра науки и высшего образования Республики Казахстан от 4 января 2023 № 1 «О некоторых вопросах размещения государственного заказа на обеспечение студентов, магистрантов и докторантов организаций высшего и (или) послевузовского образования местами в общежитиях»
    kaz: «Жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарының студенттерін, магистранттарын және докторанттарын жатақханалардағы орындармен қамтамасыз етуге мемлекеттік тапсырысты орналастырудың кейбір мәселелері туралы» Қазақстан Республикасы Ғылым және жоғары білім министрінің 2023 жылғы 4 қаңтардағы № 1 бұйрығына өзгерістер мен толықтыру енгізу туралы
