  kaz: Жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарының студенттерін, магистранттарын және докторанттарын жатақханалардағы орындармен қамтамасыз етуге мемлекеттік тапсырысты орналастырудың кейбір мәселелері туралы
