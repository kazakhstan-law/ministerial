act_code: '183313'
requisite: Приказ Министра науки и высшего образования Республики Казахстан от 13 июня 2023 года № 273
title:
  rus: Об определении организации (администратора), осуществляющей комплекс мероприятий по международным программам подготовки, переподготовки и повышения квалификации кадров за рубежом, в том числе международной стипендии «Болашак»
  kaz: Шетелде кадрлар даярлаудың, қайта даярлаудың және білiктілiгiн арттырудың халықаралық бағдарламалары, оның iшiнде «Болашақ» халықаралық стипендиясы бойынша іс-шаралар кешенiн жүзеге асыру бойынша ұйымды (әкімшіні) айқындау туралы
