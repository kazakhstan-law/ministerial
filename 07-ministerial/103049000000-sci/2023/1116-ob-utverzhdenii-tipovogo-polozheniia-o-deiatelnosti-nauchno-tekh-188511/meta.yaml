requisite: Приказ Министра науки и высшего образования Республики Казахстан от 16 ноября 2023 года № 585. Зарегистрирован в Министерстве юстиции Республики Казахстан 20 ноября 2023 года № 33654. Утратил силу приказом Министра науки и высшего образования Республики Казахстан от 23 октября 2024 года № 491 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Типового положения о деятельности научно-технического совета по рассмотрению проектов научно-исследовательских, научно-технических и опытно-конструкторских работ в сфере недропользования
  kaz: Жер қойнауын пайдалану саласындағы ғылыми-зерттеу, ғылыми-техникалық және тәжірибелік-конструкторлық жұмыстардың жобаларын қарау жөніндегі ғылыми-техникалық кеңестің қызметі туралы үлгілік ережені бекіту туралы
