  title:
    rus: О внесении изменения в приказ исполняющего обязааности  Министра науки и высшего образования Республики Казахстан от 31 марта 2023 года № 103-к «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства науки и высшего образования Республики Казахстан»
    kaz: «Қазақстан Республикасы Ғылым және жоғары білім министрлігінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» Қазақстан Республикасы Ғылым және жоғары білім министрінің міндетін атқарушының 2023 жылғы 31 наурыздағы № 103-к бұйрығына өзгерістер енгізу туралы
