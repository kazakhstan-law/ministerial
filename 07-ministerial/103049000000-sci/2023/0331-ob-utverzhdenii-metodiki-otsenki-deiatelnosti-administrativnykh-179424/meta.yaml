title:
  rus: «Об утверждении Методики оценки деятельности административных государственных служащих корпуса «Б» Министерства науки и высшего образования Республики Казахстан»
  kaz: Қазақстан Республикасы Ғылым және жоғары білім министрлігінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы
