act_code: '223674'
requisite: Приказ Министра науки и высшего образования Республики Казахстан от 2 апреля 2026 года № 168
title:
  rus: Об утверждении сроков приема документов претендентов для участия в конкурсе на прохождение научной стажировки и проведения конкурса и списка ведущих зарубежных организаций высшего и (или) послевузовского образования, научных центров и иных организаций, рекомендуемых для прохождения научных стажировок на 2026 год
  kaz: 2026 жылы ғылыми тағылымдамадан өту конкурсына қатысу үшін үміткерлердің құжаттарын қабылдау және конкурс өткізу мерзімдері мен ғылыми тағылымдамадан өту үшін ұсынылатын шетелдік жетекші жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарының, ғылыми орталықтардың және өзге де ұйымдардың тізімін бекіту туралы
