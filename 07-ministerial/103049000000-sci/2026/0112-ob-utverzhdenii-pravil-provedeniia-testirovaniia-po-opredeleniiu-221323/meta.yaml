  title:
    rus: О внесении изменений в приказ Министра науки и высшего образования Республики Казахстан от 12 января 2026 года № 9 «Об утверждении Правил проведения тестирования по определению объема знаний государственного языка на элементарном уровне, основ Конституции Республики Казахстан, а также истории Казахстана при приеме в гражданство или восстановлении в гражданстве Республики Казахстан»
    kaz: «Қазақстан Республикасының азаматтығына қабылдау немесе азаматтығын қалпына келтіру кезінде мемлекеттік тілді қарапайым деңгейде, Қазақстан Республикасы Конституциясының негіздерін, сондай-ақ Қазақстан тарихын білу көлемін айқындау бойынша тестілеуді өткізу қағидаларын бекіту туралы» Қазақстан Республикасы Ғылым және жоғары білім министрінің 2026 жылғы 12 қаңтардағы № 9 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/226921/rus
