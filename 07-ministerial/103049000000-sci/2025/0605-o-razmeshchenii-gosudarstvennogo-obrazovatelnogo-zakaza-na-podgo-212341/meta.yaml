  title:
    rus: О внесении изменений в приказ исполняющего обязанности Министра науки и высшего образования Республики Казахстан от 5 июня 2025 года № 295 «О размещении государственного образовательного заказа на подготовку кадров с послевузовским образованием на 2025-2026 учебный год»
    kaz: «2025–2026 оқу жылына жоғары оқу орнынан кейінгі білімі бар кадрларды даярлауға арналған мемлекеттік білім беру тапсырысын орналастыру туралы» Қазақстан Республикасы Ғылым және жоғары білім министрі міндетін атқарушының 2025 жылғы 5 маусымдағы № 295 бұйрығына өзгерістер енгізу туралы
