requisite: Приказ Министра науки и высшего образования Республики Казахстан от 9 июня 2025 года № 296. Зарегистрирован в Министерстве юстиции Республики Казахстан 17 июня 2025 года № 36285
title:
  rus: Об утверждении Правил осуществления платных видов деятельности по реализации товаров (работ, услуг) государственными учреждениями в сфере науки, деньги от реализации которых остаются в их распоряжении, использования денег от реализации государственными учреждениями в сфере науки товаров (работ, услуг), остающихся в их распоряжении
  kaz: Өткізуден түскен ақша өз иелігінде қалатын ғылым саласындағы мемлекеттік мекемелердің тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуі бойынша ақылы қызмет түрлерін жүзеге асыру, ғылым саласындағы мемлекеттік мекемелердің тауарларды (жұмыстарды, көрсетілетін қызметтерді) өткізуінен түскен, өз иелігінде қалатын ақшаны пайдалану қағидаларын бекіту туралы
