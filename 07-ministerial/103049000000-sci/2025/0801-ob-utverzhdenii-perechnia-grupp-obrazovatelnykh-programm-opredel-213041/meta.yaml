title:
  rus: Об утверждении перечня групп образовательных программ, определяющих социально экономическое развитие села, по которым предусматривается квота приема в организации высшего и (или) послевузовского образования Республики Казахстан
  kaz: Қазақстан Республикасы жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарына қабылдау квотасы көзделген ауылдың әлеуметтік-экономикалық дамуын айқындайтын білім беру бағдарламалары тобының тізбесін бекіту туралы
