title:
  rus: Об утверждении формы, сроков и Правил выдачи уведомлений лицам по научно-исследовательским работам по их расходам на осуществление (приобретение) научно-исследовательских работ на основании отчета о проведении научно-исследовательских работ, созданию научного центра по расходам на создание научных центров на основании отчета с актом ввода в эксплуатацию, научно-техническим и опытно-конструкторским работам по расходам на осуществление (приобретение) научно-технических и опытно-конструкторских работ на основании отчета о внедрении результатов научно-технических и опытно-конструкторских работ с актом внедрения
  kaz: Ғылыми-зерттеу жұмыстарын жүргізу туралы есептің негізінде олардың ғылыми-зерттеу жұмыстарын жүзеге асыруға (сатып алуға) арналған шығыстар бойынша ғылыми-зерттеу жұмыстары, пайдалануға беру актісі бар есептің негізінде олардың ғылыми орталықтар құруға арналған шығыстар бойынша ғылыми орталық құруы, ендіру актісі бар ғылыми-техникалық және тәжірибелік-конструкторлық жұмыстар нәтижелерін ендіру туралы есептің негізінде олардың ғылыми-техникалық және тәжірибелік-конструкторлық жұмыстарды жүзеге асыруға (сатып алуға) арналған шығыстар бойынша ғылыми-техникалық және тәжірибелік-конструкторлық жұмыстары бойынша адамдарға хабарламаларды беру нысанын, мерзімі мен қағидаларын бекіту туралы
