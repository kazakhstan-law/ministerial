  title:
    rus: О внесении изменений в приказ Министра науки и высшего образования Республики Казахстан от 31 декабря 2024 года № 630 «Об утверждении Правил государственного учета научных, научно-технических проектов и программ, проектов коммерциализации результатов научной и (или) научно-технической деятельности, финансируемых за счет бюджетных средств, а также из средств недропользователей в рамках обязательств недропользователей в области науки, и отчетов по их выполнению»
    kaz: «Бюджет қаражат есебінен, сондай-ақ жер қойнауын пайдаланушылардың ғылым саласындағы міндеттемелері шеңберінде жер қойнауын пайдаланушылардың қаражатынан қаржыландырылатын ғылыми, ғылыми-техникалық жобалар мен бағдарламаларды, ғылыми және (немесе) ғылыми-техникалық қызмет нәтижелерін коммерцияландыру жобаларын және олардың орындалуы жөніндегі есептерді мемлекеттік есепке алу қағидаларын бекіту туралы» Қазақстан Республикасы Ғылым және жоғары білім министрінің 2024 жылғы 31 желтоқсандағы № 630 бұйрығына өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/229979/rus
