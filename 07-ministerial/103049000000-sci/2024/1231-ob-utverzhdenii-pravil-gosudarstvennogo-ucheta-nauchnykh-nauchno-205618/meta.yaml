act_code: '205618'
requisite: Приказ Министра науки и высшего образования Республики Казахстан от 31 декабря 2024 года № 630. Зарегистрирован в Министерстве юстиции Республики Казахстан 31 декабря 2024 года № 35615
title:
  rus: Об утверждении Правил государственного учета научных, научно-технических проектов и программ, проектов коммерциализации результатов научной и (или) научно-технической деятельности, финансируемых за счет бюджетных средств, а также из средств недропользователей в рамках обязательств недропользователей в области науки, и отчетов по их выполнению
  kaz: Бюджет қаражаты есебінен, сондай-ақ жер қойнауын пайдаланушылардың ғылым саласындағы міндеттемелері шеңберінде жер қойнауын пайдаланушылардың қаражатынан қаржыландырылатын ғылыми, ғылыми-техникалық жобалар мен бағдарламаларды, ғылыми және (немесе) ғылыми-техникалық қызмет нәтижелерін коммерцияландыру жобаларын және олардың орындалуы жөніндегі есептерді мемлекеттік есепке алу қағидаларын бекіту туралы
