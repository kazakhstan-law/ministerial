  rus: Об утверждении объема знаний государственного языка на элементарном уровне, основ Конституции Республики Казахстан, а также истории Казахстана при приеме в гражданство или восстановлении в гражданстве Республики Казахстан
  kaz: Қазақстан Республикасының азаматтығына қабылдау немесе азаматтығын қалпына келтіру кезінде мемлекеттік тілді қарапайым деңгейде, Қазақстан Республикасы Конституциясының негіздерін, сондай-ақ Қазақстан тарихын білу көлемін бекіту туралы
