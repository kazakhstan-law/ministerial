    kaz: «Қазақстан Республикасының азаматтығына қабылдау немесе азаматтығын қалпына келтіру кезінде мемлекеттік тілді қарапайым деңгейде, Қазақстан Республикасы Конституциясының негіздерін, сондай-ақ Қазақстан тарихын білу көлемін бекіту туралы» 2024 жылғы 8 қазандағы № 479 Қазақстан Республикасы Ғылым және жоғары білім министрінің бұйрығына өзгеріс енгізу туралы
