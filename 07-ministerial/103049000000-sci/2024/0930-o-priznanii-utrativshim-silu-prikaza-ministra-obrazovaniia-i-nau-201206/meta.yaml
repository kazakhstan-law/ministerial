title:
  rus: О признании утратившим силу приказа Министра образования и науки Республики Казахстан от 19 мая 2011 года № 201 «Об утверждении Правил пользования субъектами научной и (или) научно-технической деятельности услугами научных лабораторий коллективного пользования»
  kaz: «Ұжымдық пайдаланудағы ғылыми зертханалар көрсететін қызметтерді ғылыми және (немесе) ғылыми-техникалық қызмет субъектілерінің пайдалану ережесін бекіту туралы» Қазақстан Республикасы Білім және ғылым министрінің 2011 жылғы 19 мамырдағы № 201 бұйрығының күшін жою туралы
