title:
  rus: Об утверждении Правил приобретения научно-исследовательскими институтами и организациями высшего и (или) послевузовского образования товаров, работ, услуг, необходимых для выполнения научных исследований и научных работ, реализуемых за счет бюджетных средств
  kaz: Ғылыми-зерттеу институттары мен жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарының бюджет қаражаты есебінен өткізілетін ғылыми зерттеулер мен ғылыми жұмыстарды орындау үшін қажетті тауарларды, жұмыстарды, көрсетілетін қызметтерді сатып алу қағидаларын бекіту туралы
