act_code: '194593'
requisite: Приказ Министра науки и высшего образования Республики Казахстан от 18 марта 2024 года № 118
title:
  rus: Об утверждении государственного образовательного заказа на подготовку кадров с высшим или послевузовским образованием, в организациях образования, финансируемых из республиканского бюджета (за исключением организаций образования, осуществляющих подготовку специалистов для Вооруженных Сил Республики Казахстан, других войск и воинских формирований, а также специальных государственных органов), на 2024 – 2025, 2025 – 2026, 2026 – 2027 учебные годы
  kaz: Республикалық бюджеттен қаржыландырылатын білім беру ұйымдарында (Қазақстан Республикасының Қарулы Күштері, басқа да әскерлері мен әскери құралымдары, сондай-ақ арнаулы мемлекеттік органдар үшін мамандар даярлауды жүзеге асыратын білім беру ұйымдарын қоспағанда) жоғары немесе жоғары оқу орнынан кейінгі білімі бар кадрларды даярлауға 2024 – 2025, 2025 – 2026, 2026 – 2027 оқу жылдарына арналған мемлекеттік білім беру тапсырысын бекіту туралы
