act_code: '195304'
requisite: Приказ и.о. Министра науки и высшего образования Республики Казахстан от 3 апреля 2024 года № 143. Зарегистрирован в Министерстве юстиции Республики Казахстан 4 апреля 2024 года № 34224
title:
  rus: Об утверждении Правил по организации заказа, хранению, учету и выдаче бланков документов государственного образца об образовании и обеспечению ими организаций образования, реализующих образовательные учебные программы высшего и послевузовского образования, подведомственных организаций образования, осуществление контроля за их использованием
  kaz: Білім туралы мемлекеттік үлгідегі құжаттардың бланкілеріне тапсырыс беруді ұйымдастыру, оларды сақтау, есепке алу және беру және олармен жоғары және жоғары оқу орнынан кейінгі білімнің білім беретін оқу бағдарламаларын іске асыратын білім беру ұйымдарын, ведомстволық бағынысты білім беру ұйымдарын қамтамасыз ету, олардың пайдаланылуына бақылауды жүзеге асыру жөніндегі қағидаларды бекіту туралы
