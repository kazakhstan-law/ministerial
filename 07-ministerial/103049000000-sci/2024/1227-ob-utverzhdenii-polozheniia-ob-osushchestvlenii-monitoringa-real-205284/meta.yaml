  title:
    rus: О внесении изменений и дополнения в приказ исполняющего обязанности Министра науки и высшего образования Республики Казахстан от 27 декабря 2024 года № 600 «Об утверждении Положения об осуществлении мониторинга реализации научных, научно-технических проектов и программ, проектов коммерциализации результатов научной и (или) научно-технической деятельности на стадиях их выполнения и завершения»
    kaz: «Ғылыми, ғылыми-техникалық жобалар мен бағдарламаларды, ғылыми және (немесе) ғылыми-техникалық қызмет нәтижелерін коммерцияландыру жобаларын орындау және аяқтау сатыларында олардың іске асырылуына мониторингті жүзеге асыру туралы ережесін бекіту туралы» Қазақстан Республикасы Ғылым және жоғары білім министрінің міндетін атқарушының 2024 жылғы 27 желтоқсандағы № 600 бұйрығына өзгерістер мен толықтыру енгізу туралы
