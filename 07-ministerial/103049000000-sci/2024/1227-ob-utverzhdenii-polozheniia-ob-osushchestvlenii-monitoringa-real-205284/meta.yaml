title:
  rus: Об утверждении Положения об осуществлении мониторинга реализации научных, научно-технических проектов и программ, проектов коммерциализации результатов научной и (или) научно-технической деятельности на стадиях их выполнения и завершения
  kaz: Ғылыми, ғылыми-техникалық жобалар мен бағдарламаларды, ғылыми және (немесе) ғылыми-техникалық қызмет нәтижелерін коммерцияландыру жобаларын орындау және аяқтау сатыларында олардың іске асырылуына мониторингті жүзеге асыру туралы ережесін бекіту туралы
