title:
  rus: Об утверждении Положения о комиссии по распределению на работу молодых специалистов и лиц, обучавшихся в докторантуре по программам подготовки докторов философии (PhD) и докторов по профилю на основе государственного образовательного заказа
  kaz: Жас мамандарды және мемлекеттік білім беру тапсырысы негізінде философия докторларын (PhD) және бейіні бойынша докторларды даярлау бағдарламалары бойынша докторантурада оқыған адамдарды жұмысқа бөлу жөніндегі комиссия туралы ережені бекіту туралы
